<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four checks.">
  <title>Keeping a live system honest</title>
  <style>
    .continuous-eval-bg   { fill: #f8fafc; }
    .continuous-eval-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-eval-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-eval-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-eval-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-eval-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-eval-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .continuous-eval-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .continuous-eval-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .continuous-eval-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .continuous-eval-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .continuous-eval-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .continuous-eval-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .continuous-eval-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .continuous-eval-stage { opacity: 1; }

    .continuous-eval-s0 { animation-delay: 0.00s; }
    .continuous-eval-e0 { animation-delay: 0.00s; }
    .continuous-eval-s1 { animation-delay: 1.28s; }
    .continuous-eval-e1 { animation-delay: 1.28s; }
    .continuous-eval-s2 { animation-delay: 2.56s; }
    .continuous-eval-e2 { animation-delay: 2.56s; }
    .continuous-eval-s3 { animation-delay: 3.84s; }
    .continuous-eval-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .continuous-eval-conn  { animation: continuous-eval-trace 6.4s ease-in-out infinite; }
      .continuous-eval-stage { animation: continuous-eval-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes continuous-eval-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes continuous-eval-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .continuous-eval-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .continuous-eval-stage { animation: continuous-eval-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes continuous-eval-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="continuous-eval-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="continuous-eval-bg" width="980" height="322"/>
  <text class="continuous-eval-h1"  x="30" y="40">Keeping a live system honest</text>
  <text class="continuous-eval-sub" x="30" y="64">Four checks.</text>
  <g class="continuous-eval-stage continuous-eval-s0">
    <rect class="continuous-eval-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="continuous-eval-step" x="44" y="142">01</text>
    <text class="continuous-eval-name" x="70" y="142">Score a sample of live traffic</text>
    <text class="continuous-eval-desc" x="44" y="166">On faithfulness and relevance,</text>
    <text class="continuous-eval-desc" x="44" y="182">continuously.</text>
  </g>
  <line class="continuous-eval-line continuous-eval-conn continuous-eval-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#continuous-eval-tip)"/>
  <g class="continuous-eval-stage continuous-eval-s1">
    <rect class="continuous-eval-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="continuous-eval-step" x="280" y="142">02</text>
    <text class="continuous-eval-name" x="306" y="142">Check that the index is current</text>
    <text class="continuous-eval-desc" x="280" y="166">Document count and age, against</text>
    <text class="continuous-eval-desc" x="280" y="182">the source.</text>
  </g>
  <line class="continuous-eval-line continuous-eval-conn continuous-eval-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#continuous-eval-tip)"/>
  <g class="continuous-eval-stage continuous-eval-s2">
    <rect class="continuous-eval-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="continuous-eval-step" x="516" y="142">03</text>
    <text class="continuous-eval-name" x="542" y="142">Watch how often the confidence gate fires</text>
    <text class="continuous-eval-desc" x="516" y="166">A rise means retrieval quality</text>
    <text class="continuous-eval-desc" x="516" y="182">is falling.</text>
  </g>
  <line class="continuous-eval-line continuous-eval-conn continuous-eval-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#continuous-eval-tip)"/>
  <g class="continuous-eval-stage continuous-eval-s3">
    <rect class="continuous-eval-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="continuous-eval-step" x="752" y="142">04</text>
    <text class="continuous-eval-name" x="778" y="142">And collect explicit user feedback</text>
    <text class="continuous-eval-desc" x="752" y="166">Which is sparse, and the most</text>
    <text class="continuous-eval-desc" x="752" y="182">direct signal there is.</text>
  </g>
  <text class="continuous-eval-sub" x="30" y="304">The gate rate is a particularly good early indicator: it moves before user complaints do, and it requires no labelling to interpret.</text>
</svg>
