<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Contemporaneous and complete.">
  <title>A laboratory notebook</title>
  <style>
    .lab-notebook-bg   { fill: #f8fafc; }
    .lab-notebook-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-notebook-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-notebook-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-notebook-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-notebook-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-notebook-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lab-notebook-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lab-notebook-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lab-notebook-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lab-notebook-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lab-notebook-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lab-notebook-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lab-notebook-row { opacity: 1; }
    .lab-notebook-r0 { animation-delay: 0.00s; }
    .lab-notebook-r1 { animation-delay: 0.45s; }
    .lab-notebook-r2 { animation-delay: 0.90s; }
    .lab-notebook-r3 { animation-delay: 1.35s; }
    .lab-notebook-r4 { animation-delay: 1.80s; }
    .lab-notebook-row { animation: lab-notebook-reveal 7.3s ease-in-out infinite; }
    @keyframes lab-notebook-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lab-notebook-bg" width="980" height="390"/>
  <text class="lab-notebook-h1"  x="30" y="40">A laboratory notebook</text>
  <text class="lab-notebook-sub" x="30" y="64">Contemporaneous and complete.</text>
  <rect class="lab-notebook-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lab-notebook-name" x="46" y="122">Contemporaneous</text>
  <text class="lab-notebook-desc" x="46" y="142">Trustworthy.</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r0" x="46" y="182">Written as the work happened</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r1" x="46" y="216">Every attempt recorded</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r2" x="46" y="250">Dated and signed</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r3" x="46" y="284">Another person could repeat it</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r4" x="46" y="318">This is a reproducible notebook</text>
  <rect class="lab-notebook-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lab-notebook-name" x="526" y="122">Rewritten afterwards</text>
  <text class="lab-notebook-desc" x="526" y="142">Untrustworthy.</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r0" x="526" y="182">Reconstructed later</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r1" x="526" y="216">Only successful attempts</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r2" x="526" y="250">Undated</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r3" x="526" y="284">Nobody could repeat it</text>
  <text class="lab-notebook-desc lab-notebook-row lab-notebook-r4" x="526" y="318">This is a tidied notebook</text>
  <text class="lab-notebook-sub" x="30" y="372">Recording every attempt rather than only the successful ones is what makes a record honest, and selectively tidied notebooks lose exactly that.</text>
</svg>
