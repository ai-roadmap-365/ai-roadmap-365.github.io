<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six stages, one loop.">
  <title>The workflow</title>
  <style>
    .workflow-idea-bg   { fill: #f8fafc; }
    .workflow-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workflow-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workflow-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workflow-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workflow-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workflow-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .workflow-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .workflow-idea-stage { opacity: 1; }

    .workflow-idea-s0 { animation-delay: 0.00s; }
    .workflow-idea-e0 { animation-delay: 0.00s; }
    .workflow-idea-s1 { animation-delay: 1.37s; }
    .workflow-idea-e1 { animation-delay: 1.37s; }
    .workflow-idea-s2 { animation-delay: 2.74s; }
    .workflow-idea-e2 { animation-delay: 2.74s; }
    .workflow-idea-s3 { animation-delay: 4.11s; }
    .workflow-idea-e3 { animation-delay: 4.11s; }
    .workflow-idea-s4 { animation-delay: 5.49s; }
    .workflow-idea-e4 { animation-delay: 5.49s; }
    .workflow-idea-s5 { animation-delay: 6.86s; }
    .workflow-idea-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .workflow-idea-conn  { animation: workflow-idea-trace 9.600000000000001s ease-in-out infinite; }
      .workflow-idea-stage { animation: workflow-idea-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes workflow-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes workflow-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .workflow-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .workflow-idea-stage { animation: workflow-idea-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes workflow-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="workflow-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="workflow-idea-bg" width="980" height="322"/>
  <text class="workflow-idea-h1"  x="30" y="40">The workflow</text>
  <text class="workflow-idea-sub" x="30" y="64">Six stages, one loop.</text>
  <g class="workflow-idea-stage workflow-idea-s0">
    <rect class="workflow-idea-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="workflow-idea-step" x="44" y="142">01</text>
    <text class="workflow-idea-name" x="70" y="142">Frame the problem</text>
    <text class="workflow-idea-desc" x="44" y="166">What decision, what</text>
    <text class="workflow-idea-desc" x="44" y="182">would success look</text>
    <text class="workflow-idea-desc" x="44" y="198">like.</text>
  </g>
  <line class="workflow-idea-line workflow-idea-conn workflow-idea-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#workflow-idea-tip)"/>
  <g class="workflow-idea-stage workflow-idea-s1">
    <rect class="workflow-idea-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="workflow-idea-step" x="201" y="142">02</text>
    <text class="workflow-idea-name" x="227" y="142">Get and validate the data</text>
    <text class="workflow-idea-desc" x="201" y="166">Which is where most</text>
    <text class="workflow-idea-desc" x="201" y="182">of the time goes.</text>
  </g>
  <line class="workflow-idea-line workflow-idea-conn workflow-idea-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#workflow-idea-tip)"/>
  <g class="workflow-idea-stage workflow-idea-s2">
    <rect class="workflow-idea-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="workflow-idea-step" x="358" y="142">03</text>
    <text class="workflow-idea-name" x="384" y="142">Build features</text>
    <text class="workflow-idea-desc" x="358" y="166">Where most of the</text>
    <text class="workflow-idea-desc" x="358" y="182">gains come from.</text>
  </g>
  <line class="workflow-idea-line workflow-idea-conn workflow-idea-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#workflow-idea-tip)"/>
  <g class="workflow-idea-stage workflow-idea-s3">
    <rect class="workflow-idea-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="workflow-idea-step" x="515" y="142">04</text>
    <text class="workflow-idea-name" x="541" y="142">Train candidate models</text>
    <text class="workflow-idea-desc" x="515" y="166">The shortest stage.</text>
  </g>
  <line class="workflow-idea-line workflow-idea-conn workflow-idea-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#workflow-idea-tip)"/>
  <g class="workflow-idea-stage workflow-idea-s4">
    <rect class="workflow-idea-good" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="workflow-idea-step" x="672" y="142">05</text>
    <text class="workflow-idea-name" x="698" y="142">Evaluate honestly, against a baseline</text>
    <text class="workflow-idea-desc" x="672" y="166">With the split</text>
    <text class="workflow-idea-desc" x="672" y="182">respected.</text>
  </g>
  <line class="workflow-idea-line workflow-idea-conn workflow-idea-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#workflow-idea-tip)"/>
  <g class="workflow-idea-stage workflow-idea-s5">
    <rect class="workflow-idea-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="workflow-idea-step" x="829" y="142">06</text>
    <text class="workflow-idea-name" x="855" y="142">Then deploy, monitor, and loop back</text>
    <text class="workflow-idea-desc" x="829" y="166">Which is where it</text>
    <text class="workflow-idea-desc" x="829" y="182">stops being a</text>
    <text class="workflow-idea-desc" x="829" y="198">project.</text>
    <text class="workflow-idea-edge" x="829" y="242">a cycle</text>
  </g>
  <text class="workflow-idea-sub" x="30" y="304">The loop back to data is the arrow most plans omit, and it is the one that runs for as long as the model is in service.</text>
</svg>
