<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five stages, one is dominant.">
  <title>The request-time budget</title>
  <style>
    .latency-budget-rag-bg   { fill: #f8fafc; }
    .latency-budget-rag-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-rag-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-rag-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-rag-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-rag-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-rag-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-budget-rag-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latency-budget-rag-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latency-budget-rag-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latency-budget-rag-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latency-budget-rag-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latency-budget-rag-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .latency-budget-rag-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .latency-budget-rag-stage { opacity: 1; }

    .latency-budget-rag-s0 { animation-delay: 0.00s; }
    .latency-budget-rag-e0 { animation-delay: 0.00s; }
    .latency-budget-rag-s1 { animation-delay: 1.33s; }
    .latency-budget-rag-e1 { animation-delay: 1.33s; }
    .latency-budget-rag-s2 { animation-delay: 2.67s; }
    .latency-budget-rag-e2 { animation-delay: 2.67s; }
    .latency-budget-rag-s3 { animation-delay: 4.00s; }
    .latency-budget-rag-e3 { animation-delay: 4.00s; }
    .latency-budget-rag-s4 { animation-delay: 5.33s; }
    .latency-budget-rag-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .latency-budget-rag-conn  { animation: latency-budget-rag-trace 8s ease-in-out infinite; }
      .latency-budget-rag-stage { animation: latency-budget-rag-arrive 8s ease-in-out infinite; }
    }
    @keyframes latency-budget-rag-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes latency-budget-rag-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .latency-budget-rag-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .latency-budget-rag-stage { animation: latency-budget-rag-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes latency-budget-rag-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="latency-budget-rag-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="latency-budget-rag-bg" width="980" height="322"/>
  <text class="latency-budget-rag-h1"  x="30" y="40">The request-time budget</text>
  <text class="latency-budget-rag-sub" x="30" y="64">Five stages, one is dominant.</text>
  <g class="latency-budget-rag-stage latency-budget-rag-s0">
    <rect class="latency-budget-rag-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="latency-budget-rag-step" x="44" y="142">01</text>
    <text class="latency-budget-rag-name" x="70" y="142">Embed the query</text>
    <text class="latency-budget-rag-desc" x="44" y="166">Tens of milliseconds, and</text>
    <text class="latency-budget-rag-desc" x="44" y="182">cacheable.</text>
  </g>
  <line class="latency-budget-rag-line latency-budget-rag-conn latency-budget-rag-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#latency-budget-rag-tip)"/>
  <g class="latency-budget-rag-stage latency-budget-rag-s1">
    <rect class="latency-budget-rag-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="latency-budget-rag-step" x="233" y="142">02</text>
    <text class="latency-budget-rag-name" x="259" y="142">Search both indexes</text>
    <text class="latency-budget-rag-desc" x="233" y="166">In parallel. Tens of</text>
    <text class="latency-budget-rag-desc" x="233" y="182">milliseconds.</text>
  </g>
  <line class="latency-budget-rag-line latency-budget-rag-conn latency-budget-rag-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#latency-budget-rag-tip)"/>
  <g class="latency-budget-rag-stage latency-budget-rag-s2">
    <rect class="latency-budget-rag-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="latency-budget-rag-step" x="422" y="142">03</text>
    <text class="latency-budget-rag-name" x="448" y="142">Rerank the candidates</text>
    <text class="latency-budget-rag-desc" x="422" y="166">A hundred or so, and it</text>
    <text class="latency-budget-rag-desc" x="422" y="182">scales with depth.</text>
  </g>
  <line class="latency-budget-rag-line latency-budget-rag-conn latency-budget-rag-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#latency-budget-rag-tip)"/>
  <g class="latency-budget-rag-stage latency-budget-rag-s3">
    <rect class="latency-budget-rag-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="latency-budget-rag-step" x="611" y="142">04</text>
    <text class="latency-budget-rag-name" x="637" y="142">First token from the model</text>
    <text class="latency-budget-rag-desc" x="611" y="166">Which is what the user</text>
    <text class="latency-budget-rag-desc" x="611" y="182">actually waits for.</text>
  </g>
  <line class="latency-budget-rag-line latency-budget-rag-conn latency-budget-rag-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#latency-budget-rag-tip)"/>
  <g class="latency-budget-rag-stage latency-budget-rag-s4">
    <rect class="latency-budget-rag-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="latency-budget-rag-step" x="800" y="142">05</text>
    <text class="latency-budget-rag-name" x="826" y="142">Then the rest of the answer</text>
    <text class="latency-budget-rag-desc" x="800" y="166">Streaming, so it is read</text>
    <text class="latency-budget-rag-desc" x="800" y="182">as it arrives.</text>
  </g>
  <text class="latency-budget-rag-sub" x="30" y="304">Everything before the first token is dead time for the user, which makes retrieval latency worth optimising in a way that generation latency largely is not.</text>
</svg>
