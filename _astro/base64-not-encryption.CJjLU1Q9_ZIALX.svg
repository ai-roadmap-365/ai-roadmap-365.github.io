<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is reversible by anyone. The other needs a key.">
  <title>Encoding and encryption are not the same word</title>
  <style>
    .base64-not-encryption-bg   { fill: #f8fafc; }
    .base64-not-encryption-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base64-not-encryption-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base64-not-encryption-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base64-not-encryption-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base64-not-encryption-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base64-not-encryption-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .base64-not-encryption-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .base64-not-encryption-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .base64-not-encryption-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .base64-not-encryption-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .base64-not-encryption-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .base64-not-encryption-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .base64-not-encryption-row { opacity: 1; }
    .base64-not-encryption-r0 { animation-delay: 0.00s; }
    .base64-not-encryption-r1 { animation-delay: 0.45s; }
    .base64-not-encryption-r2 { animation-delay: 0.90s; }
    .base64-not-encryption-r3 { animation-delay: 1.35s; }
    .base64-not-encryption-r4 { animation-delay: 1.80s; }
    .base64-not-encryption-row { animation: base64-not-encryption-reveal 7.3s ease-in-out infinite; }
    @keyframes base64-not-encryption-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="base64-not-encryption-bg" width="980" height="390"/>
  <text class="base64-not-encryption-h1"  x="30" y="40">Encoding and encryption are not the same word</text>
  <text class="base64-not-encryption-sub" x="30" y="64">One is reversible by anyone. The other needs a key.</text>
  <rect class="base64-not-encryption-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="base64-not-encryption-name" x="46" y="122">Base64 encoding</text>
  <text class="base64-not-encryption-desc" x="46" y="142">Makes bytes safe to put in text.</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r0" x="46" y="182">Reversible by anyone, instantly</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r1" x="46" y="216">No key exists at all</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r2" x="46" y="250">One command each way</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r3" x="46" y="284">Grows the data by about a third</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r4" x="46" y="318">Provides exactly zero secrecy</text>
  <rect class="base64-not-encryption-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="base64-not-encryption-name" x="526" y="122">Encryption</text>
  <text class="base64-not-encryption-desc" x="526" y="142">Makes data unreadable without a key.</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r0" x="526" y="182">Reversible only with the key</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r1" x="526" y="216">The key is the whole security</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r2" x="526" y="250">This is what TLS does for you</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r3" x="526" y="284">Roughly preserves size</text>
  <text class="base64-not-encryption-desc base64-not-encryption-row base64-not-encryption-r4" x="526" y="318">Provides secrecy, and often integrity</text>
  <text class="base64-not-encryption-sub" x="30" y="372">Calling base64 "encrypted" has caused real breaches. Basic auth is safe on an HTTPS API and disastrous without one, and the difference is entirely TLS.</text>
</svg>
