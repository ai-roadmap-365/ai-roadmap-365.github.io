<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Injection through an image</title>
  <style>
    .visual-injection-bg   { fill: #f8fafc; }
    .visual-injection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visual-injection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visual-injection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visual-injection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visual-injection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visual-injection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .visual-injection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .visual-injection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .visual-injection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .visual-injection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .visual-injection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .visual-injection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .visual-injection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .visual-injection-stage { opacity: 1; }

    .visual-injection-s0 { animation-delay: 0.00s; }
    .visual-injection-e0 { animation-delay: 0.00s; }
    .visual-injection-s1 { animation-delay: 1.28s; }
    .visual-injection-e1 { animation-delay: 1.28s; }
    .visual-injection-s2 { animation-delay: 2.56s; }
    .visual-injection-e2 { animation-delay: 2.56s; }
    .visual-injection-s3 { animation-delay: 3.84s; }
    .visual-injection-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .visual-injection-conn  { animation: visual-injection-trace 6.4s ease-in-out infinite; }
      .visual-injection-stage { animation: visual-injection-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes visual-injection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes visual-injection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .visual-injection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .visual-injection-stage { animation: visual-injection-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes visual-injection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="visual-injection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="visual-injection-bg" width="980" height="322"/>
  <text class="visual-injection-h1"  x="30" y="40">Injection through an image</text>
  <text class="visual-injection-sub" x="30" y="64">Four steps.</text>
  <g class="visual-injection-stage visual-injection-s0">
    <rect class="visual-injection-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="visual-injection-step" x="44" y="142">01</text>
    <text class="visual-injection-name" x="70" y="142">Text is rendered into the image</text>
    <text class="visual-injection-desc" x="44" y="166">Visibly, or faintly enough to be</text>
    <text class="visual-injection-desc" x="44" y="182">missed.</text>
  </g>
  <line class="visual-injection-line visual-injection-conn visual-injection-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#visual-injection-tip)"/>
  <g class="visual-injection-stage visual-injection-s1">
    <rect class="visual-injection-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="visual-injection-step" x="280" y="142">02</text>
    <text class="visual-injection-name" x="306" y="142">The model reads it as readily as typed text</text>
    <text class="visual-injection-desc" x="280" y="166">There is no separate channel.</text>
  </g>
  <line class="visual-injection-line visual-injection-conn visual-injection-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#visual-injection-tip)"/>
  <g class="visual-injection-stage visual-injection-s2">
    <rect class="visual-injection-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="visual-injection-step" x="516" y="142">03</text>
    <text class="visual-injection-name" x="542" y="142">And may follow it as an instruction</text>
    <text class="visual-injection-desc" x="516" y="166">Exactly as with text injection.</text>
  </g>
  <line class="visual-injection-line visual-injection-conn visual-injection-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#visual-injection-tip)"/>
  <g class="visual-injection-stage visual-injection-s3">
    <rect class="visual-injection-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="visual-injection-step" x="752" y="142">04</text>
    <text class="visual-injection-name" x="778" y="142">So treat image content as untrusted input</text>
    <text class="visual-injection-desc" x="752" y="166">With the same controls as</text>
    <text class="visual-injection-desc" x="752" y="182">untrusted text.</text>
  </g>
  <text class="visual-injection-sub" x="30" y="304">The defences are the same as Day 251's, and so is the honest conclusion: they reduce the risk rather than removing it, so tool privileges are what actually bound the damage.</text>
</svg>
