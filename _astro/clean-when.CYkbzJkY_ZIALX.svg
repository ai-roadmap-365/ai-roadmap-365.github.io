<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the problem.">
  <title>Which treatment when</title>
  <style>
    .clean-when-bg   { fill: #f8fafc; }
    .clean-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clean-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clean-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clean-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clean-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clean-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clean-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clean-when-row { opacity: 1; }
    .clean-when-r0 { animation-delay: 0.00s; }
    .clean-when-r1 { animation-delay: 0.45s; }
    .clean-when-r2 { animation-delay: 0.90s; }
    .clean-when-r3 { animation-delay: 1.35s; }
    .clean-when-r4 { animation-delay: 1.80s; }
    .clean-when-row { animation: clean-when-reveal 7.3s ease-in-out infinite; }
    @keyframes clean-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="clean-when-bg" width="980" height="390"/>
  <text class="clean-when-h1"  x="30" y="40">Which treatment when</text>
  <text class="clean-when-sub" x="30" y="64">By the problem.</text>
  <rect class="clean-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="clean-when-name" x="46" y="122">The problem</text>
  <text class="clean-when-desc" x="46" y="142">What you found.</text>
  <text class="clean-when-desc clean-when-row clean-when-r0" x="46" y="182">A few values missing at random</text>
  <text class="clean-when-desc clean-when-row clean-when-r1" x="46" y="216">Many values missing, non-randomly</text>
  <text class="clean-when-desc clean-when-row clean-when-r2" x="46" y="250">Exact duplicate rows</text>
  <text class="clean-when-desc clean-when-row clean-when-r3" x="46" y="284">An impossible value</text>
  <text class="clean-when-desc clean-when-row clean-when-r4" x="46" y="318">An extreme but plausible value</text>
  <rect class="clean-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="clean-when-name" x="526" y="122">The treatment</text>
  <text class="clean-when-desc" x="526" y="142">What to do.</text>
  <text class="clean-when-desc clean-when-row clean-when-r0" x="526" y="182">Drop, and record the count</text>
  <text class="clean-when-desc clean-when-row clean-when-r1" x="526" y="216">Model it, and flag it</text>
  <text class="clean-when-desc clean-when-row clean-when-r2" x="526" y="250">Remove, after confirming they are duplicates</text>
  <text class="clean-when-desc clean-when-row clean-when-r3" x="526" y="284">Investigate the source; do not silently fix</text>
  <text class="clean-when-desc clean-when-row clean-when-r4" x="526" y="318">Keep it; consider a robust method</text>
  <text class="clean-when-sub" x="30" y="372">Keeping plausible extremes and switching to a robust method is usually better than removal, since removal changes what question the analysis is answering.</text>
</svg>
