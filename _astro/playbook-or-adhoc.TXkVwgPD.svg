<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same agent, very different defect rates.">
  <title>The playbook against ad-hoc prompting</title>
  <style>
    .playbook-or-adhoc-bg   { fill: #f8fafc; }
    .playbook-or-adhoc-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-or-adhoc-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-or-adhoc-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-or-adhoc-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-or-adhoc-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-or-adhoc-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .playbook-or-adhoc-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .playbook-or-adhoc-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .playbook-or-adhoc-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .playbook-or-adhoc-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .playbook-or-adhoc-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .playbook-or-adhoc-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .playbook-or-adhoc-row { opacity: 1; }
    .playbook-or-adhoc-r0 { animation-delay: 0.00s; }
    .playbook-or-adhoc-r1 { animation-delay: 0.45s; }
    .playbook-or-adhoc-r2 { animation-delay: 0.90s; }
    .playbook-or-adhoc-r3 { animation-delay: 1.35s; }
    .playbook-or-adhoc-r4 { animation-delay: 1.80s; }
    .playbook-or-adhoc-row { animation: playbook-or-adhoc-reveal 7.3s ease-in-out infinite; }
    @keyframes playbook-or-adhoc-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="playbook-or-adhoc-bg" width="980" height="390"/>
  <text class="playbook-or-adhoc-h1"  x="30" y="40">The playbook against ad-hoc prompting</text>
  <text class="playbook-or-adhoc-sub" x="30" y="64">Same agent, very different defect rates.</text>
  <rect class="playbook-or-adhoc-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="playbook-or-adhoc-name" x="46" y="122">The playbook</text>
  <text class="playbook-or-adhoc-desc" x="46" y="142">10x, under 1% defects.</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r0" x="46" y="182">A reviewed plan before any edit</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r1" x="46" y="216">Tests written before code</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r2" x="46" y="250">Every layer changed together</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r3" x="46" y="284">Quality gates before the PR</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r4" x="46" y="318">Documentation synchronised by construction</text>
  <rect class="playbook-or-adhoc-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="playbook-or-adhoc-name" x="526" y="122">Ad-hoc prompting</text>
  <text class="playbook-or-adhoc-desc" x="526" y="142">4x, around 25% defects.</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r0" x="526" y="182">Straight to implementation</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r1" x="526" y="216">Tests after, if at all</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r2" x="526" y="250">Layers drift out of sync</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r3" x="526" y="284">Review is the only gate</text>
  <text class="playbook-or-adhoc-desc playbook-or-adhoc-row playbook-or-adhoc-r4" x="526" y="318">Documentation usually missing</text>
  <text class="playbook-or-adhoc-sub" x="30" y="372">Ad-hoc prompting is still faster than manual coding, which is why it persists: the defect rate is the cost, and it is paid later by whoever debugs the production incident.</text>
</svg>
