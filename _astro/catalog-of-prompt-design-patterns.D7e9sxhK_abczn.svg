<svg role="img" aria-label="Taxonomy of core prompt design patterns including Persona-Context-Task, Directional Stimulus, Flipped Interaction, and Meta-Prompting" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Catalog of Prompt Design Patterns</title>
  <defs>
    <linearGradient id="bg250a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card250" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg250a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CATALOG OF PROMPT DESIGN PATTERNS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Reusable Architectural Blueprints for Robust LLM Steering</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card250)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Pattern 1: Persona-Context-Task -->
    <rect x="25" y="25" width="340" height="120" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="195" y="48" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Persona-Context-Task (PCT)</text>
    <text x="40" y="70" fill="#cbd5e1" font-size="8">• Defines identity, background, and directive</text>
    <text x="40" y="88" fill="#cbd5e1" font-size="8">• Standard foundational pattern for 80% tasks</text>
    <text x="40" y="106" fill="#34d399" font-size="8">e.g., "As SRE, analyze this Kubernetes OOM log."</text>

    <!-- Pattern 2: Directional Stimulus -->
    <rect x="395" y="25" width="340" height="120" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="565" y="48" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Directional Stimulus Prompting (DSP)</text>
    <text x="410" y="70" fill="#cbd5e1" font-size="8">• Injects key hints/keywords into context</text>
    <text x="410" y="88" fill="#cbd5e1" font-size="8">• Guides model focus without rigid templates</text>
    <text x="410" y="106" fill="#34d399" font-size="8">e.g., "Hint: Consider network socket exhaustion."</text>

    <!-- Pattern 3: Flipped Interaction -->
    <rect x="25" y="160" width="340" height="120" fill="#0f172a" stroke="#a855f7" rx="6"/>
    <text x="195" y="183" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">3. Flipped Interaction (Interview)</text>
    <text x="40" y="205" fill="#cbd5e1" font-size="8">• Model asks user questions sequentially</text>
    <text x="40" y="223" fill="#cbd5e1" font-size="8">• Resolves ambiguous requirements iteratively</text>
    <text x="40" y="241" fill="#38bdf8" font-size="8">e.g., "Ask me 1 question at a time until ready."</text>

    <!-- Pattern 4: Meta-Prompting -->
    <rect x="395" y="160" width="340" height="120" fill="#0f172a" stroke="#34d399" rx="6"/>
    <text x="565" y="183" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">4. Meta-Prompting (Self-Optimization)</text>
    <text x="410" y="205" fill="#cbd5e1" font-size="8">• LLM writes, critiques, and optimizes prompts</text>
    <text x="410" y="223" fill="#cbd5e1" font-size="8">• Recursive refinement of system instructions</text>
    <text x="410" y="241" fill="#38bdf8" font-size="8">e.g., "Critique this prompt and produce version 2."</text>
  </g>
</svg>
