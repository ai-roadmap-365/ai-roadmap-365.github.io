<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Five checks each.">
  <title>Ready, and not ready</title>
  <style>
    .readiness-checklist-bg   { fill: #f8fafc; }
    .readiness-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readiness-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readiness-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readiness-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readiness-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readiness-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readiness-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readiness-checklist-row { opacity: 1; }
    .readiness-checklist-r0 { animation-delay: 0.00s; }
    .readiness-checklist-r1 { animation-delay: 0.45s; }
    .readiness-checklist-r2 { animation-delay: 0.90s; }
    .readiness-checklist-r3 { animation-delay: 1.35s; }
    .readiness-checklist-r4 { animation-delay: 1.80s; }
    .readiness-checklist-row { animation: readiness-checklist-reveal 7.3s ease-in-out infinite; }
    @keyframes readiness-checklist-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="readiness-checklist-bg" width="980" height="390"/>
  <text class="readiness-checklist-h1"  x="30" y="40">Ready, and not ready</text>
  <text class="readiness-checklist-sub" x="30" y="64">Five checks each.</text>
  <rect class="readiness-checklist-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="readiness-checklist-name" x="46" y="122">Ready</text>
  <text class="readiness-checklist-desc" x="46" y="142">Every guardrail present.</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r0" x="46" y="182">Startup probe sized to the model load</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r1" x="46" y="216">Readiness distinct from liveness</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r2" x="46" y="250">LOR routing across replicas</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r3" x="46" y="284">Circuit breaker with a real fallback</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r4" x="46" y="318">PreStop draining for streams</text>
  <rect class="readiness-checklist-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="readiness-checklist-name" x="526" y="122">Not ready</text>
  <text class="readiness-checklist-desc" x="526" y="142">Each has caused an outage.</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r0" x="526" y="182">One health endpoint for three questions</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r1" x="526" y="216">Round-robin in front of variable work</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r2" x="526" y="250">No fallback — errors reach the client</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r3" x="526" y="284">Autoscaling on CPU</text>
  <text class="readiness-checklist-desc readiness-checklist-row readiness-checklist-r4" x="526" y="318">No TTFT or queue-depth metric</text>
  <text class="readiness-checklist-sub" x="30" y="372">Every row on the right is individually reasonable on the day it is decided, which is the same composition problem as Day 361's security posture: no single choice is negligent and the system is.</text>
</svg>
