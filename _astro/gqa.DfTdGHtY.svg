<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="By sharing keys between heads.">
  <title>Shrinking the attention cache</title>
  <style>
    .gqa-bg   { fill: #f8fafc; }
    .gqa-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gqa-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gqa-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gqa-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gqa-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gqa-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gqa-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gqa-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gqa-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gqa-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gqa-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gqa-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gqa-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gqa-stage { opacity: 1; }

    .gqa-s0 { animation-delay: 0.00s; }
    .gqa-e0 { animation-delay: 0.00s; }
    .gqa-s1 { animation-delay: 1.28s; }
    .gqa-e1 { animation-delay: 1.28s; }
    .gqa-s2 { animation-delay: 2.56s; }
    .gqa-e2 { animation-delay: 2.56s; }
    .gqa-s3 { animation-delay: 3.84s; }
    .gqa-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gqa-conn  { animation: gqa-trace 6.4s ease-in-out infinite; }
      .gqa-stage { animation: gqa-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gqa-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gqa-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gqa-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gqa-stage { animation: gqa-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gqa-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gqa-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gqa-bg" width="980" height="322"/>
  <text class="gqa-h1"  x="30" y="40">Shrinking the attention cache</text>
  <text class="gqa-sub" x="30" y="64">By sharing keys between heads.</text>
  <g class="gqa-stage gqa-s0">
    <rect class="gqa-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gqa-step" x="44" y="142">01</text>
    <text class="gqa-name" x="70" y="142">Each attention head caches its own keys and values</text>
    <text class="gqa-desc" x="44" y="166">Per layer, per token, per</text>
    <text class="gqa-desc" x="44" y="182">request.</text>
  </g>
  <line class="gqa-line gqa-conn gqa-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gqa-tip)"/>
  <g class="gqa-stage gqa-s1">
    <rect class="gqa-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gqa-step" x="280" y="142">02</text>
    <text class="gqa-name" x="306" y="142">Which becomes the limit on concurrent requests</text>
    <text class="gqa-desc" x="280" y="166">Before compute is anywhere near</text>
    <text class="gqa-desc" x="280" y="182">saturated.</text>
  </g>
  <line class="gqa-line gqa-conn gqa-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gqa-tip)"/>
  <g class="gqa-stage gqa-s2">
    <rect class="gqa-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gqa-step" x="516" y="142">03</text>
    <text class="gqa-name" x="542" y="142">Let several query heads share one key-value head</text>
    <text class="gqa-desc" x="516" y="166">Cutting the cache by that</text>
    <text class="gqa-desc" x="516" y="182">factor.</text>
  </g>
  <line class="gqa-line gqa-conn gqa-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gqa-tip)"/>
  <g class="gqa-stage gqa-s3">
    <rect class="gqa-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gqa-step" x="752" y="142">04</text>
    <text class="gqa-name" x="778" y="142">Many more concurrent requests</text>
    <text class="gqa-desc" x="752" y="166">With almost no measurable</text>
    <text class="gqa-desc" x="752" y="182">quality loss.</text>
  </g>
  <text class="gqa-sub" x="30" y="304">That quality barely moves is the empirical finding that made this standard: the query heads carry most of the useful variation, and the key-value heads were largely redundant.</text>
</svg>
