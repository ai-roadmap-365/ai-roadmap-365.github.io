<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward structure.">
  <title>Four steps in operational visibility</title>
  <style>
    .logging-history-bg   { fill: #f8fafc; }
    .logging-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logging-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logging-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logging-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logging-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logging-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .logging-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .logging-history-stage { opacity: 1; }

    .logging-history-s0 { animation-delay: 0.00s; }
    .logging-history-e0 { animation-delay: 0.00s; }
    .logging-history-s1 { animation-delay: 1.28s; }
    .logging-history-e1 { animation-delay: 1.28s; }
    .logging-history-s2 { animation-delay: 2.56s; }
    .logging-history-e2 { animation-delay: 2.56s; }
    .logging-history-s3 { animation-delay: 3.84s; }
    .logging-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .logging-history-conn  { animation: logging-history-trace 6.4s ease-in-out infinite; }
      .logging-history-stage { animation: logging-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes logging-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes logging-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .logging-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .logging-history-stage { animation: logging-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes logging-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="logging-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="logging-history-bg" width="980" height="322"/>
  <text class="logging-history-h1"  x="30" y="40">Four steps in operational visibility</text>
  <text class="logging-history-sub" x="30" y="64">Toward structure.</text>
  <g class="logging-history-stage logging-history-s0">
    <rect class="logging-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="logging-history-step" x="44" y="142">01</text>
    <text class="logging-history-name" x="70" y="142">Print statements, removed before release</text>
    <text class="logging-history-desc" x="44" y="166">And re-added when something</text>
    <text class="logging-history-desc" x="44" y="182">broke.</text>
  </g>
  <line class="logging-history-line logging-history-conn logging-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#logging-history-tip)"/>
  <g class="logging-history-stage logging-history-s1">
    <rect class="logging-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="logging-history-step" x="280" y="142">02</text>
    <text class="logging-history-name" x="306" y="142">Then logging frameworks with levels and handlers</text>
    <text class="logging-history-desc" x="280" y="166">Configurable without code</text>
    <text class="logging-history-desc" x="280" y="182">changes.</text>
  </g>
  <line class="logging-history-line logging-history-conn logging-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#logging-history-tip)"/>
  <g class="logging-history-stage logging-history-s2">
    <rect class="logging-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="logging-history-step" x="516" y="142">03</text>
    <text class="logging-history-name" x="542" y="142">Then centralised collection across machines</text>
    <text class="logging-history-desc" x="516" y="166">Searchable in one place.</text>
  </g>
  <line class="logging-history-line logging-history-conn logging-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#logging-history-tip)"/>
  <g class="logging-history-stage logging-history-s3">
    <rect class="logging-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="logging-history-step" x="752" y="142">04</text>
    <text class="logging-history-name" x="778" y="142">And structured events, queried like data</text>
    <text class="logging-history-desc" x="752" y="166">Rather than parsed as text.</text>
  </g>
  <text class="logging-history-sub" x="30" y="304">Structured records are the step that makes logs analysable, because extracting a field is a query rather than a regular expression written under pressure.</text>
</svg>
