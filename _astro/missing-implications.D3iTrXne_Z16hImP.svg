<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are bias.">
  <title>Four consequences of missing data handling</title>
  <style>
    .missing-implications-bg   { fill: #f8fafc; }
    .missing-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .missing-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .missing-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .missing-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .missing-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .missing-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .missing-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .missing-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .missing-implications-stage { opacity: 1; }

    .missing-implications-s0 { animation-delay: 0.00s; }
    .missing-implications-e0 { animation-delay: 0.00s; }
    .missing-implications-s1 { animation-delay: 1.28s; }
    .missing-implications-e1 { animation-delay: 1.28s; }
    .missing-implications-s2 { animation-delay: 2.56s; }
    .missing-implications-e2 { animation-delay: 2.56s; }
    .missing-implications-s3 { animation-delay: 3.84s; }
    .missing-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .missing-implications-conn  { animation: missing-implications-trace 6.4s ease-in-out infinite; }
      .missing-implications-stage { animation: missing-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes missing-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes missing-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .missing-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .missing-implications-stage { animation: missing-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes missing-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="missing-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="missing-implications-bg" width="980" height="322"/>
  <text class="missing-implications-h1"  x="30" y="40">Four consequences of missing data handling</text>
  <text class="missing-implications-sub" x="30" y="64">Two are bias.</text>
  <g class="missing-implications-stage missing-implications-s0">
    <rect class="missing-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="missing-implications-step" x="44" y="142">01</text>
    <text class="missing-implications-name" x="70" y="142">Deleting rows biases the sample</text>
    <text class="missing-implications-desc" x="44" y="166">Whenever missingness relates to</text>
    <text class="missing-implications-desc" x="44" y="182">the outcome.</text>
  </g>
  <line class="missing-implications-line missing-implications-conn missing-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#missing-implications-tip)"/>
  <g class="missing-implications-stage missing-implications-s1">
    <rect class="missing-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="missing-implications-step" x="280" y="142">02</text>
    <text class="missing-implications-name" x="306" y="142">Imputing before splitting leaks</text>
    <text class="missing-implications-desc" x="280" y="166">The statistics carry validation</text>
    <text class="missing-implications-desc" x="280" y="182">information.</text>
  </g>
  <line class="missing-implications-line missing-implications-conn missing-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#missing-implications-tip)"/>
  <g class="missing-implications-stage missing-implications-s2">
    <rect class="missing-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="missing-implications-step" x="516" y="142">03</text>
    <text class="missing-implications-name" x="542" y="142">And imputing without an indicator discards signal</text>
    <text class="missing-implications-desc" x="516" y="166">Which is frequently substantial.</text>
  </g>
  <line class="missing-implications-line missing-implications-conn missing-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#missing-implications-tip)"/>
  <g class="missing-implications-stage missing-implications-s3">
    <rect class="missing-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="missing-implications-step" x="752" y="142">04</text>
    <text class="missing-implications-name" x="778" y="142">So the model family changes what is needed</text>
    <text class="missing-implications-desc" x="752" y="166">Boosted trees may need nothing</text>
    <text class="missing-implications-desc" x="752" y="182">at all.</text>
  </g>
  <text class="missing-implications-sub" x="30" y="304">Choosing a model that handles missingness natively removes the whole problem, which is a better answer than getting the imputation right.</text>
</svg>
