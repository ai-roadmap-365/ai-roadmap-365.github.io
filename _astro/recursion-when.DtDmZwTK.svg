<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to loop.">
  <title>When to recurse</title>
  <style>
    .recursion-when-bg   { fill: #f8fafc; }
    .recursion-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recursion-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recursion-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recursion-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recursion-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recursion-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recursion-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recursion-when-row { opacity: 1; }
    .recursion-when-r0 { animation-delay: 0.00s; }
    .recursion-when-r1 { animation-delay: 0.45s; }
    .recursion-when-r2 { animation-delay: 0.90s; }
    .recursion-when-r3 { animation-delay: 1.35s; }
    .recursion-when-r4 { animation-delay: 1.80s; }
    .recursion-when-row { animation: recursion-when-reveal 7.3s ease-in-out infinite; }
    @keyframes recursion-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recursion-when-bg" width="980" height="390"/>
  <text class="recursion-when-h1"  x="30" y="40">When to recurse</text>
  <text class="recursion-when-sub" x="30" y="64">And when to loop.</text>
  <rect class="recursion-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recursion-when-name" x="46" y="122">Recurse</text>
  <text class="recursion-when-desc" x="46" y="142">Four cases.</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r0" x="46" y="182">The data is genuinely nested</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r1" x="46" y="216">Tree or graph traversal</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r2" x="46" y="250">Divide and conquer algorithms</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r3" x="46" y="284">Where the recursive form is far clearer</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r4" x="46" y="318">With caching, if subproblems repeat</text>
  <rect class="recursion-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recursion-when-name" x="526" y="122">Loop</text>
  <text class="recursion-when-desc" x="526" y="142">Also four.</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r0" x="526" y="182">A flat sequence</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r1" x="526" y="216">Depth could exceed the limit</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r2" x="526" y="250">Where an accumulator reads naturally</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r3" x="526" y="284">Tight numerical work</text>
  <text class="recursion-when-desc recursion-when-row recursion-when-r4" x="526" y="318">Where the recursion is only linear</text>
  <text class="recursion-when-sub" x="30" y="372">Linear recursion is the case to convert: it gains nothing over a loop and pays a stack frame per element for the privilege.</text>
</svg>
