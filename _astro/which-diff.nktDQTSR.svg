<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 356" role="img"
     aria-label="Which is why one can be empty while the other is not.">
  <title>Two diffs, comparing different pairs</title>
  <style>
    .which-diff-bg   { fill: #f8fafc; }
    .which-diff-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-diff-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-diff-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-diff-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-diff-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-diff-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .which-diff-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .which-diff-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .which-diff-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .which-diff-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .which-diff-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .which-diff-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .which-diff-row { opacity: 1; }
    .which-diff-r0 { animation-delay: 0.00s; }
    .which-diff-r1 { animation-delay: 0.45s; }
    .which-diff-r2 { animation-delay: 0.90s; }
    .which-diff-r3 { animation-delay: 1.35s; }
    .which-diff-row { animation: which-diff-reveal 6.8s ease-in-out infinite; }
    @keyframes which-diff-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="which-diff-bg" width="980" height="356"/>
  <text class="which-diff-h1"  x="30" y="40">Two diffs, comparing different pairs</text>
  <text class="which-diff-sub" x="30" y="64">Which is why one can be empty while the other is not.</text>
  <rect class="which-diff-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="which-diff-name" x="46" y="122">git diff</text>
  <text class="which-diff-desc" x="46" y="142">Working directory vs staging area.</text>
  <text class="which-diff-desc which-diff-row which-diff-r0" x="46" y="182">The edits you have NOT staged yet</text>
  <text class="which-diff-desc which-diff-row which-diff-r1" x="46" y="216">Empty when everything is staged</text>
  <text class="which-diff-desc which-diff-row which-diff-r2" x="46" y="250">"What have I changed since I last added?"</text>
  <text class="which-diff-desc which-diff-row which-diff-r3" x="46" y="284">Use it before deciding what to stage</text>
  <rect class="which-diff-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="which-diff-name" x="526" y="122">git diff --staged</text>
  <text class="which-diff-desc" x="526" y="142">Staging area vs last commit.</text>
  <text class="which-diff-desc which-diff-row which-diff-r0" x="526" y="182">Exactly what you are about to commit</text>
  <text class="which-diff-desc which-diff-row which-diff-r1" x="526" y="216">Empty when nothing is staged</text>
  <text class="which-diff-desc which-diff-row which-diff-r2" x="526" y="250">"What will this commit contain?"</text>
  <text class="which-diff-desc which-diff-row which-diff-r3" x="526" y="284">Use it as the last check before committing</text>
  <text class="which-diff-sub" x="30" y="338">"git diff shows nothing but I definitely changed something" almost always means everything is already staged. The two commands answer different questions and both are usually worth asking.</text>
</svg>
