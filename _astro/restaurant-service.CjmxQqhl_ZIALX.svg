<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them fills the room.">
  <title>Seating in waves, or as tables free</title>
  <style>
    .restaurant-service-bg   { fill: #f8fafc; }
    .restaurant-service-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-service-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-service-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-service-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-service-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-service-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restaurant-service-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .restaurant-service-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .restaurant-service-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .restaurant-service-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .restaurant-service-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .restaurant-service-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restaurant-service-row { opacity: 1; }
    .restaurant-service-r0 { animation-delay: 0.00s; }
    .restaurant-service-r1 { animation-delay: 0.45s; }
    .restaurant-service-r2 { animation-delay: 0.90s; }
    .restaurant-service-r3 { animation-delay: 1.35s; }
    .restaurant-service-r4 { animation-delay: 1.80s; }
    .restaurant-service-row { animation: restaurant-service-reveal 7.3s ease-in-out infinite; }
    @keyframes restaurant-service-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="restaurant-service-bg" width="980" height="390"/>
  <text class="restaurant-service-h1"  x="30" y="40">Seating in waves, or as tables free</text>
  <text class="restaurant-service-sub" x="30" y="64">One of them fills the room.</text>
  <rect class="restaurant-service-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="restaurant-service-name" x="46" y="122">Seating in waves</text>
  <text class="restaurant-service-desc" x="46" y="142">Everyone together.</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r0" x="46" y="182">A group seated, then served together</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r1" x="46" y="216">Nobody leaves until the slowest finishes</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r2" x="46" y="250">Empty tables wait for the next wave</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r3" x="46" y="284">Arrivals queue outside</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r4" x="46" y="318">The room is half empty most of the evening</text>
  <rect class="restaurant-service-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="restaurant-service-name" x="526" y="122">Seating as tables free</text>
  <text class="restaurant-service-desc" x="526" y="142">Continuously.</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r0" x="526" y="182">Each table turns over independently</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r1" x="526" y="216">A finished table is cleared at once</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r2" x="526" y="250">Reseated immediately</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r3" x="526" y="284">Arrivals seated within minutes</text>
  <text class="restaurant-service-desc restaurant-service-row restaurant-service-r4" x="526" y="318">The room stays full</text>
  <text class="restaurant-service-sub" x="30" y="372">Restaurants solved this long ago for exactly the same reason, and the throughput difference is of a similar magnitude.</text>
</svg>
