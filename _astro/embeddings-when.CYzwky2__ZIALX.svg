<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when they do not.">
  <title>When static embeddings suffice</title>
  <style>
    .embeddings-when-bg   { fill: #f8fafc; }
    .embeddings-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddings-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddings-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddings-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddings-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddings-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embeddings-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .embeddings-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .embeddings-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .embeddings-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .embeddings-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .embeddings-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embeddings-when-row { opacity: 1; }
    .embeddings-when-r0 { animation-delay: 0.00s; }
    .embeddings-when-r1 { animation-delay: 0.45s; }
    .embeddings-when-r2 { animation-delay: 0.90s; }
    .embeddings-when-r3 { animation-delay: 1.35s; }
    .embeddings-when-r4 { animation-delay: 1.80s; }
    .embeddings-when-row { animation: embeddings-when-reveal 7.3s ease-in-out infinite; }
    @keyframes embeddings-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="embeddings-when-bg" width="980" height="390"/>
  <text class="embeddings-when-h1"  x="30" y="40">When static embeddings suffice</text>
  <text class="embeddings-when-sub" x="30" y="64">And when they do not.</text>
  <rect class="embeddings-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="embeddings-when-name" x="46" y="122">Static is enough</text>
  <text class="embeddings-when-desc" x="46" y="142">Topic-level tasks.</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r0" x="46" y="182">Sentiment, spam, topic tagging</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r1" x="46" y="216">Running on constrained hardware</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r2" x="46" y="250">Where a word's sense rarely varies</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r3" x="46" y="284">Where latency budgets are tight</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r4" x="46" y="318">Precomputable and cacheable</text>
  <rect class="embeddings-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="embeddings-when-name" x="526" y="122">Contextual is needed</text>
  <text class="embeddings-when-desc" x="526" y="142">Meaning depends on the sentence.</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r0" x="526" y="182">Question answering</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r1" x="526" y="216">Summarisation and generation</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r2" x="526" y="250">Anywhere polysemy matters</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r3" x="526" y="284">Named entity recognition in ambiguous text</text>
  <text class="embeddings-when-desc embeddings-when-row embeddings-when-r4" x="526" y="318">Which is most modern language work</text>
  <text class="embeddings-when-sub" x="30" y="372">Static embeddings remain a genuinely reasonable choice for high-volume simple classification, and the reason is cost rather than nostalgia: they are orders of magnitude cheaper to serve.</text>
</svg>
