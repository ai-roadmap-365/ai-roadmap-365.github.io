<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Sensors, control rods and a ledger.">
  <title>A power station control room</title>
  <style>
    .control-room-bg   { fill: #f8fafc; }
    .control-room-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-room-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-room-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-room-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-room-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-room-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .control-room-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .control-room-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .control-room-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .control-room-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .control-room-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .control-room-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .control-room-row { opacity: 1; }
    .control-room-r0 { animation-delay: 0.00s; }
    .control-room-r1 { animation-delay: 0.45s; }
    .control-room-r2 { animation-delay: 0.90s; }
    .control-room-r3 { animation-delay: 1.35s; }
    .control-room-r4 { animation-delay: 1.80s; }
    .control-room-row { animation: control-room-reveal 7.3s ease-in-out infinite; }
    @keyframes control-room-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="control-room-bg" width="980" height="390"/>
  <text class="control-room-h1"  x="30" y="40">A power station control room</text>
  <text class="control-room-sub" x="30" y="64">Sensors, control rods and a ledger.</text>
  <rect class="control-room-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="control-room-name" x="46" y="122">The control room</text>
  <text class="control-room-desc" x="46" y="142">Four systems.</text>
  <text class="control-room-desc control-room-row control-room-r0" x="46" y="182">The reaction chamber generates power</text>
  <text class="control-room-desc control-room-row control-room-r1" x="46" y="216">Thousands of gauges read continuously</text>
  <text class="control-room-desc control-room-row control-room-r2" x="46" y="250">Control rods drop in 200 ms on a threshold</text>
  <text class="control-room-desc control-room-row control-room-r3" x="46" y="284">An unalterable ledger records every watt</text>
  <text class="control-room-desc control-room-row control-room-r4" x="46" y="318">Nobody is trusted to notice manually</text>
  <rect class="control-room-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="control-room-name" x="526" y="122">The platform</text>
  <text class="control-room-desc" x="526" y="142">The same four.</text>
  <text class="control-room-desc control-room-row control-room-r0" x="526" y="182">The GPU cluster serves inference</text>
  <text class="control-room-desc control-room-row control-room-r1" x="526" y="216">Golden signals, sampled continuously</text>
  <text class="control-room-desc control-room-row control-room-r2" x="526" y="250">The circuit breaker trips in 500 ms</text>
  <text class="control-room-desc control-room-row control-room-r3" x="526" y="284">A token ledger records every request</text>
  <text class="control-room-desc control-room-row control-room-r4" x="526" y="318">Automation, not attention</text>
  <text class="control-room-sub" x="30" y="372">"Nobody is trusted to notice manually" is the design principle both share: the automation exists because the response window is shorter than the time it takes a human to read a dashboard.</text>
</svg>
