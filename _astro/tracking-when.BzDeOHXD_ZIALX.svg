<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is overhead.">
  <title>When to track</title>
  <style>
    .tracking-when-bg   { fill: #f8fafc; }
    .tracking-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracking-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracking-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracking-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracking-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracking-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-when-row { opacity: 1; }
    .tracking-when-r0 { animation-delay: 0.00s; }
    .tracking-when-r1 { animation-delay: 0.45s; }
    .tracking-when-r2 { animation-delay: 0.90s; }
    .tracking-when-r3 { animation-delay: 1.35s; }
    .tracking-when-r4 { animation-delay: 1.80s; }
    .tracking-when-row { animation: tracking-when-reveal 7.3s ease-in-out infinite; }
    @keyframes tracking-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tracking-when-bg" width="980" height="390"/>
  <text class="tracking-when-h1"  x="30" y="40">When to track</text>
  <text class="tracking-when-sub" x="30" y="64">And when it is overhead.</text>
  <rect class="tracking-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tracking-when-name" x="46" y="122">Track</text>
  <text class="tracking-when-desc" x="46" y="142">Almost always.</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r0" x="46" y="182">Anything more than a handful of runs</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r1" x="46" y="216">Any model heading for production</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r2" x="46" y="250">Any work with more than one person</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r3" x="46" y="284">Anything regulated or audited</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r4" x="46" y="318">Any result you might need to defend</text>
  <rect class="tracking-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tracking-when-name" x="526" y="122">Skip it</text>
  <text class="tracking-when-desc" x="526" y="142">Narrowly.</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r0" x="526" y="182">A single throwaway exploration</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r1" x="526" y="216">Following a tutorial</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r2" x="526" y="250">Where the run takes under a minute</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r3" x="526" y="284">And nothing depends on the result</text>
  <text class="tracking-when-desc tracking-when-row tracking-when-r4" x="526" y="318">Which is rarer than it feels</text>
  <text class="tracking-when-sub" x="30" y="372">The threshold arrives earlier than most people expect, because the run that turns out to matter is almost never the one you planned to keep.</text>
</svg>
