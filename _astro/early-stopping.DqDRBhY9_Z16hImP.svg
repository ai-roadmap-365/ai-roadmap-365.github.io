<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three parameters, decided in advance.">
  <title>Early stopping as a stated rule</title>
  <style>
    .early-stopping-bg   { fill: #f8fafc; }
    .early-stopping-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .early-stopping-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .early-stopping-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .early-stopping-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .early-stopping-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .early-stopping-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .early-stopping-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .early-stopping-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .early-stopping-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .early-stopping-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .early-stopping-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .early-stopping-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .early-stopping-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .early-stopping-stage { opacity: 1; }

    .early-stopping-s0 { animation-delay: 0.00s; }
    .early-stopping-e0 { animation-delay: 0.00s; }
    .early-stopping-s1 { animation-delay: 1.28s; }
    .early-stopping-e1 { animation-delay: 1.28s; }
    .early-stopping-s2 { animation-delay: 2.56s; }
    .early-stopping-e2 { animation-delay: 2.56s; }
    .early-stopping-s3 { animation-delay: 3.84s; }
    .early-stopping-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .early-stopping-conn  { animation: early-stopping-trace 6.4s ease-in-out infinite; }
      .early-stopping-stage { animation: early-stopping-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes early-stopping-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes early-stopping-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .early-stopping-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .early-stopping-stage { animation: early-stopping-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes early-stopping-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="early-stopping-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="early-stopping-bg" width="980" height="322"/>
  <text class="early-stopping-h1"  x="30" y="40">Early stopping as a stated rule</text>
  <text class="early-stopping-sub" x="30" y="64">Three parameters, decided in advance.</text>
  <g class="early-stopping-stage early-stopping-s0">
    <rect class="early-stopping-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="early-stopping-step" x="44" y="142">01</text>
    <text class="early-stopping-name" x="70" y="142">The monitored metric</text>
    <text class="early-stopping-desc" x="44" y="166">Validation loss, or a task</text>
    <text class="early-stopping-desc" x="44" y="182">metric. Stated, not chosen</text>
    <text class="early-stopping-desc" x="44" y="198">later.</text>
  </g>
  <line class="early-stopping-line early-stopping-conn early-stopping-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#early-stopping-tip)"/>
  <g class="early-stopping-stage early-stopping-s1">
    <rect class="early-stopping-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="early-stopping-step" x="280" y="142">02</text>
    <text class="early-stopping-name" x="306" y="142">Patience</text>
    <text class="early-stopping-desc" x="280" y="166">How many epochs without</text>
    <text class="early-stopping-desc" x="280" y="182">improvement before stopping.</text>
    <text class="early-stopping-edge" x="280" y="242">in advance</text>
  </g>
  <line class="early-stopping-line early-stopping-conn early-stopping-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#early-stopping-tip)"/>
  <g class="early-stopping-stage early-stopping-s2">
    <rect class="early-stopping-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="early-stopping-step" x="516" y="142">03</text>
    <text class="early-stopping-name" x="542" y="142">Minimum improvement</text>
    <text class="early-stopping-desc" x="516" y="166">So noise does not count as</text>
    <text class="early-stopping-desc" x="516" y="182">progress.</text>
  </g>
  <line class="early-stopping-line early-stopping-conn early-stopping-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#early-stopping-tip)"/>
  <g class="early-stopping-stage early-stopping-s3">
    <rect class="early-stopping-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="early-stopping-step" x="752" y="142">04</text>
    <text class="early-stopping-name" x="778" y="142">Restore the best checkpoint</text>
    <text class="early-stopping-desc" x="752" y="166">Not the last one. They are</text>
    <text class="early-stopping-desc" x="752" y="182">usually different.</text>
  </g>
  <text class="early-stopping-sub" x="30" y="304">Deciding these before the run is what makes early stopping a rule rather than a judgement: choosing patience after seeing the curve is choosing the result you preferred.</text>
</svg>
