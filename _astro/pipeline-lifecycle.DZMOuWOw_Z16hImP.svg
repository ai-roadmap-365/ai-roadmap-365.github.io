<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How a pipeline runs</title>
  <style>
    .pipeline-lifecycle-bg   { fill: #f8fafc; }
    .pipeline-lifecycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-lifecycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-lifecycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-lifecycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-lifecycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-lifecycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-lifecycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-lifecycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-lifecycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-lifecycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-lifecycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-lifecycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-lifecycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-lifecycle-stage { opacity: 1; }

    .pipeline-lifecycle-s0 { animation-delay: 0.00s; }
    .pipeline-lifecycle-e0 { animation-delay: 0.00s; }
    .pipeline-lifecycle-s1 { animation-delay: 1.28s; }
    .pipeline-lifecycle-e1 { animation-delay: 1.28s; }
    .pipeline-lifecycle-s2 { animation-delay: 2.56s; }
    .pipeline-lifecycle-e2 { animation-delay: 2.56s; }
    .pipeline-lifecycle-s3 { animation-delay: 3.84s; }
    .pipeline-lifecycle-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-lifecycle-conn  { animation: pipeline-lifecycle-trace 6.4s ease-in-out infinite; }
      .pipeline-lifecycle-stage { animation: pipeline-lifecycle-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pipeline-lifecycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-lifecycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-lifecycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-lifecycle-stage { animation: pipeline-lifecycle-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-lifecycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-lifecycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-lifecycle-bg" width="980" height="322"/>
  <text class="pipeline-lifecycle-h1"  x="30" y="40">How a pipeline runs</text>
  <text class="pipeline-lifecycle-sub" x="30" y="64">Four steps.</text>
  <g class="pipeline-lifecycle-stage pipeline-lifecycle-s0">
    <rect class="pipeline-lifecycle-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-lifecycle-step" x="44" y="142">01</text>
    <text class="pipeline-lifecycle-name" x="70" y="142">Fit the first transform on the training data</text>
    <text class="pipeline-lifecycle-desc" x="44" y="166">Then transform it.</text>
  </g>
  <line class="pipeline-lifecycle-line pipeline-lifecycle-conn pipeline-lifecycle-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pipeline-lifecycle-tip)"/>
  <g class="pipeline-lifecycle-stage pipeline-lifecycle-s1">
    <rect class="pipeline-lifecycle-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-lifecycle-step" x="280" y="142">02</text>
    <text class="pipeline-lifecycle-name" x="306" y="142">Pass the output to the next step</text>
    <text class="pipeline-lifecycle-desc" x="280" y="166">Which fits on that, and</text>
    <text class="pipeline-lifecycle-desc" x="280" y="182">transforms in turn.</text>
  </g>
  <line class="pipeline-lifecycle-line pipeline-lifecycle-conn pipeline-lifecycle-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pipeline-lifecycle-tip)"/>
  <g class="pipeline-lifecycle-stage pipeline-lifecycle-s2">
    <rect class="pipeline-lifecycle-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-lifecycle-step" x="516" y="142">03</text>
    <text class="pipeline-lifecycle-name" x="542" y="142">Until the final estimator fits on the finished features</text>
    <text class="pipeline-lifecycle-desc" x="516" y="166">Which is the model itself.</text>
  </g>
  <line class="pipeline-lifecycle-line pipeline-lifecycle-conn pipeline-lifecycle-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pipeline-lifecycle-tip)"/>
  <g class="pipeline-lifecycle-stage pipeline-lifecycle-s3">
    <rect class="pipeline-lifecycle-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-lifecycle-step" x="752" y="142">04</text>
    <text class="pipeline-lifecycle-name" x="778" y="142">At prediction, every step only transforms</text>
    <text class="pipeline-lifecycle-desc" x="752" y="166">Using the statistics learned</text>
    <text class="pipeline-lifecycle-desc" x="752" y="182">during fitting.</text>
  </g>
  <text class="pipeline-lifecycle-sub" x="30" y="304">The asymmetry between fit and predict is exactly what prevents leakage: at prediction time no step is allowed to learn anything from the data it sees.</text>
</svg>
