<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to package</title>
  <style>
    .packaging-when-bg   { fill: #f8fafc; }
    .packaging-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packaging-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packaging-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packaging-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packaging-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packaging-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packaging-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packaging-when-row { opacity: 1; }
    .packaging-when-r0 { animation-delay: 0.00s; }
    .packaging-when-r1 { animation-delay: 0.45s; }
    .packaging-when-r2 { animation-delay: 0.90s; }
    .packaging-when-r3 { animation-delay: 1.35s; }
    .packaging-when-r4 { animation-delay: 1.80s; }
    .packaging-when-row { animation: packaging-when-reveal 7.3s ease-in-out infinite; }
    @keyframes packaging-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="packaging-when-bg" width="980" height="390"/>
  <text class="packaging-when-h1"  x="30" y="40">When to package</text>
  <text class="packaging-when-sub" x="30" y="64">And when not to.</text>
  <rect class="packaging-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="packaging-when-name" x="46" y="122">Package it</text>
  <text class="packaging-when-desc" x="46" y="142">Four cases.</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r0" x="46" y="182">Several projects need the same code</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r1" x="46" y="216">You want versioned dependencies on it</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r2" x="46" y="250">It ships a command-line tool</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r3" x="46" y="284">It must install into clean environments</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r4" x="46" y="318">Others outside your team will use it</text>
  <rect class="packaging-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="packaging-when-name" x="526" y="122">Do not</text>
  <text class="packaging-when-desc" x="526" y="142">Also four.</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r0" x="526" y="182">One project uses it — keep it inside</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r1" x="526" y="216">A one-off script</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r2" x="526" y="250">It changes daily and has one consumer</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r3" x="526" y="284">You cannot commit to maintaining it</text>
  <text class="packaging-when-desc packaging-when-row packaging-when-r4" x="526" y="318">Where a shared repository path suffices</text>
  <text class="packaging-when-sub" x="30" y="372">Keeping code inside its one consumer is the right default, because a package adds a release cycle between writing a change and using it.</text>
</svg>
