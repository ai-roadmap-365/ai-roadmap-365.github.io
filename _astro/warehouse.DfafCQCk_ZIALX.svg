<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where they sit decides the speed.">
  <title>Items on a shelf, or scattered in boxes</title>
  <style>
    .warehouse-bg   { fill: #f8fafc; }
    .warehouse-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .warehouse-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .warehouse-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .warehouse-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .warehouse-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .warehouse-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .warehouse-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .warehouse-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .warehouse-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .warehouse-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .warehouse-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .warehouse-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .warehouse-row { opacity: 1; }
    .warehouse-r0 { animation-delay: 0.00s; }
    .warehouse-r1 { animation-delay: 0.45s; }
    .warehouse-r2 { animation-delay: 0.90s; }
    .warehouse-r3 { animation-delay: 1.35s; }
    .warehouse-r4 { animation-delay: 1.80s; }
    .warehouse-row { animation: warehouse-reveal 7.3s ease-in-out infinite; }
    @keyframes warehouse-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="warehouse-bg" width="980" height="390"/>
  <text class="warehouse-h1"  x="30" y="40">Items on a shelf, or scattered in boxes</text>
  <text class="warehouse-sub" x="30" y="64">Where they sit decides the speed.</text>
  <rect class="warehouse-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="warehouse-name" x="46" y="122">Scattered in boxes</text>
  <text class="warehouse-desc" x="46" y="142">Each fetched separately.</text>
  <text class="warehouse-desc warehouse-row warehouse-r0" x="46" y="182">Each item somewhere different</text>
  <text class="warehouse-desc warehouse-row warehouse-r1" x="46" y="216">A separate trip for each</text>
  <text class="warehouse-desc warehouse-row warehouse-r2" x="46" y="250">Each box labelled with its contents</text>
  <text class="warehouse-desc warehouse-row warehouse-r3" x="46" y="284">Slow, and unpredictable</text>
  <text class="warehouse-desc warehouse-row warehouse-r4" x="46" y="318">This is a Python list</text>
  <rect class="warehouse-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="warehouse-name" x="526" y="122">In a row on one shelf</text>
  <text class="warehouse-desc" x="526" y="142">Fetched together.</text>
  <text class="warehouse-desc warehouse-row warehouse-r0" x="526" y="182">All items adjacent</text>
  <text class="warehouse-desc warehouse-row warehouse-r1" x="526" y="216">One trip collects many</text>
  <text class="warehouse-desc warehouse-row warehouse-r2" x="526" y="250">One label for the whole row</text>
  <text class="warehouse-desc warehouse-row warehouse-r3" x="526" y="284">Fast, and predictable</text>
  <text class="warehouse-desc warehouse-row warehouse-r4" x="526" y="318">This is an array</text>
  <text class="warehouse-sub" x="30" y="372">The processor's cache works exactly like the single trip: fetching one item brings its neighbours along, which is free only if they are the ones you need next.</text>
</svg>
