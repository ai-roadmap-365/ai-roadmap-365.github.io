<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Describing nobody.">
  <title>The average person in a room</title>
  <style>
    .room-average-bg   { fill: #f8fafc; }
    .room-average-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .room-average-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .room-average-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .room-average-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .room-average-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .room-average-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .room-average-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .room-average-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .room-average-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .room-average-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .room-average-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .room-average-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .room-average-row { opacity: 1; }
    .room-average-r0 { animation-delay: 0.00s; }
    .room-average-r1 { animation-delay: 0.45s; }
    .room-average-r2 { animation-delay: 0.90s; }
    .room-average-r3 { animation-delay: 1.35s; }
    .room-average-r4 { animation-delay: 1.80s; }
    .room-average-row { animation: room-average-reveal 7.3s ease-in-out infinite; }
    @keyframes room-average-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="room-average-bg" width="980" height="390"/>
  <text class="room-average-h1"  x="30" y="40">The average person in a room</text>
  <text class="room-average-sub" x="30" y="64">Describing nobody.</text>
  <rect class="room-average-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="room-average-name" x="46" y="122">The average</text>
  <text class="room-average-desc" x="46" y="142">One number.</text>
  <text class="room-average-desc room-average-row room-average-r0" x="46" y="182">Add everything, divide by the count</text>
  <text class="room-average-desc room-average-row room-average-r1" x="46" y="216">One very wealthy visitor shifts it</text>
  <text class="room-average-desc room-average-row room-average-r2" x="46" y="250">Describes nobody in the room</text>
  <text class="room-average-desc room-average-row room-average-r3" x="46" y="284">Easy to quote</text>
  <text class="room-average-desc room-average-row room-average-r4" x="46" y="318">This is a mean</text>
  <rect class="room-average-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="room-average-name" x="526" y="122">The distribution</text>
  <text class="room-average-desc" x="526" y="142">The whole picture.</text>
  <text class="room-average-desc room-average-row room-average-r0" x="526" y="182">Show the whole spread</text>
  <text class="room-average-desc room-average-row room-average-r1" x="526" y="216">The outlier is visible as one point</text>
  <text class="room-average-desc room-average-row room-average-r2" x="526" y="250">Describes the actual room</text>
  <text class="room-average-desc room-average-row room-average-r3" x="526" y="284">Harder to quote</text>
  <text class="room-average-desc room-average-row room-average-r4" x="526" y="318">This is what a plot shows</text>
  <text class="room-average-sub" x="30" y="372">The outlier being visible as a point rather than absorbed into a number is the entire argument for plotting, and it takes one line of code.</text>
</svg>
