<svg role="img" aria-label="End to end deployed ML service system diagram illustrating training serialization registry packaging FastAPI serving and PSI drift monitoring" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Complete Deployed ML Service Architecture</title>
  <defs>
    <linearGradient id="bg196a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card196" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg196a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SECTION PROJECT: END-TO-END DEPLOYED ML SERVICE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Unifying Training, Immutable Versioning, FastAPI Microservice, and Drift Observability</text>
  <g transform="translate(40, 85)">
    <rect width="770" height="295" fill="url(#card196)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Stage 1 -->
    <rect x="25" y="40" width="130" height="220" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="90" y="65" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Model Training</text>
    <text x="35" y="95" fill="#cbd5e1" font-family="system-ui" font-size="9">• Scikit-Learn Pipeline</text>
    <text x="35" y="120" fill="#cbd5e1" font-family="system-ui" font-size="9">• Cross-Validation</text>
    <text x="35" y="145" fill="#cbd5e1" font-family="system-ui" font-size="9">• ROC-AUC &amp; PR-AUC</text>
    <text x="35" y="170" fill="#cbd5e1" font-family="system-ui" font-size="9">• Subgroup Slicing</text>
    <text x="90" y="235" fill="#7dd3fc" font-family="system-ui" font-size="9" text-anchor="middle">Verified Candidate</text>
    <!-- Arrow -->
    <line x1="155" y1="150" x2="200" y2="150" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 2 -->
    <rect x="200" y="40" width="130" height="220" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="265" y="65" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Model Registry</text>
    <text x="210" y="95" fill="#cbd5e1" font-family="system-ui" font-size="9">• SHA-256 Hashing</text>
    <text x="210" y="120" fill="#cbd5e1" font-family="system-ui" font-size="9">• SemVer (v1.0.0)</text>
    <text x="210" y="145" fill="#cbd5e1" font-family="system-ui" font-size="9">• Lineage Provenance</text>
    <text x="210" y="170" fill="#cbd5e1" font-family="system-ui" font-size="9">• Stage Promotion</text>
    <text x="265" y="235" fill="#fde68a" font-family="system-ui" font-size="9" text-anchor="middle">PRODUCTION Stage</text>
    <!-- Arrow -->
    <line x1="330" y1="150" x2="375" y2="150" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 3 -->
    <rect x="375" y="40" width="165" height="220" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="457" y="65" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. FastAPI Service</text>
    <text x="385" y="95" fill="#cbd5e1" font-family="system-ui" font-size="9">• Preloaded Weights</text>
    <text x="385" y="120" fill="#cbd5e1" font-family="system-ui" font-size="9">• Pydantic Validation</text>
    <text x="385" y="145" fill="#cbd5e1" font-family="system-ui" font-size="9">• Batch /predict_batch</text>
    <text x="385" y="170" fill="#cbd5e1" font-family="system-ui" font-size="9">• Circuit Breaker Fallback</text>
    <text x="457" y="235" fill="#a7f3d0" font-family="system-ui" font-size="9" text-anchor="middle">Sub-5ms Inference</text>
    <!-- Arrow -->
    <line x1="540" y1="150" x2="585" y2="150" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 4 -->
    <rect x="585" y="40" width="160" height="220" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="6"/>
    <text x="665" y="65" fill="#f472b6" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. Observability</text>
    <text x="595" y="95" fill="#cbd5e1" font-family="system-ui" font-size="9">• Prometheus Latency</text>
    <text x="595" y="120" fill="#cbd5e1" font-family="system-ui" font-size="9">• PSI Drift Computation</text>
    <text x="595" y="145" fill="#cbd5e1" font-family="system-ui" font-size="9">• Prediction Shift Monitor</text>
    <text x="595" y="170" fill="#cbd5e1" font-family="system-ui" font-size="9">• Automated Alerts</text>
    <text x="665" y="235" fill="#fbcfe8" font-family="system-ui" font-size="9" text-anchor="middle">Continuous Feedback</text>
  </g>
</svg>
