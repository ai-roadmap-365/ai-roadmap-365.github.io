<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Six weeks, and the same handful of lessons kept returning.">
  <title>The rules that appeared in every week</title>
  <style>
    .recurring-rules-bg   { fill: #f8fafc; }
    .recurring-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recurring-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recurring-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recurring-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recurring-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recurring-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recurring-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recurring-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recurring-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recurring-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recurring-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recurring-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recurring-rules-row { opacity: 1; }
    .recurring-rules-r0 { animation-delay: 0.00s; }
    .recurring-rules-r1 { animation-delay: 0.45s; }
    .recurring-rules-r2 { animation-delay: 0.90s; }
    .recurring-rules-r3 { animation-delay: 1.35s; }
    .recurring-rules-r4 { animation-delay: 1.80s; }
    .recurring-rules-row { animation: recurring-rules-reveal 7.3s ease-in-out infinite; }
    @keyframes recurring-rules-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recurring-rules-bg" width="980" height="390"/>
  <text class="recurring-rules-h1"  x="30" y="40">The rules that appeared in every week</text>
  <text class="recurring-rules-sub" x="30" y="64">Six weeks, and the same handful of lessons kept returning.</text>
  <rect class="recurring-rules-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recurring-rules-name" x="46" y="122">The recurring rules</text>
  <text class="recurring-rules-desc" x="46" y="142">Each arrived several times.</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r0" x="46" y="182">A secret in a permanent place is compromised</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r1" x="46" y="216">Silent failure is the expensive failure</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r2" x="46" y="250">The earliest control is the cheapest</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r3" x="46" y="284">Retrying without a cap is unbounded cost</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r4" x="46" y="318">Measure the stage before optimising</text>
  <rect class="recurring-rules-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recurring-rules-name" x="526" y="122">Where they appeared</text>
  <text class="recurring-rules-desc" x="526" y="142">Different clothes, same rule.</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r0" x="526" y="182">Days 11, 25, 29, 32, 35, 41</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r1" x="526" y="216">Days 14, 26, 40, 41</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r2" x="526" y="250">Days 25, 35, 37, 41</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r3" x="526" y="284">Days 18, 22, 27, 41</text>
  <text class="recurring-rules-desc recurring-rules-row recurring-rules-r4" x="526" y="318">Days 15, 21, 39, 40</text>
  <text class="recurring-rules-sub" x="30" y="372">When the same rule arrives from five unrelated directions, it is not a coincidence about tooling — it is a property of building systems, and it is the part most worth carrying forward.</text>
</svg>
