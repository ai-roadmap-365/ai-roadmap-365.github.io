<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Metrics, n-grams, then judges.">
  <title>Three eras of evaluation</title>
  <style>
    .eval-lineage-bg   { fill: #f8fafc; }
    .eval-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-lineage-stage { opacity: 1; }

    .eval-lineage-s0 { animation-delay: 0.00s; }
    .eval-lineage-e0 { animation-delay: 0.00s; }
    .eval-lineage-s1 { animation-delay: 1.50s; }
    .eval-lineage-e1 { animation-delay: 1.50s; }
    .eval-lineage-s2 { animation-delay: 3.00s; }
    .eval-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-lineage-conn  { animation: eval-lineage-trace 6s ease-in-out infinite; }
      .eval-lineage-stage { animation: eval-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes eval-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-lineage-stage { animation: eval-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-lineage-bg" width="980" height="322"/>
  <text class="eval-lineage-h1"  x="30" y="40">Three eras of evaluation</text>
  <text class="eval-lineage-sub" x="30" y="64">Metrics, n-grams, then judges.</text>
  <g class="eval-lineage-stage eval-lineage-s0">
    <rect class="eval-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="eval-lineage-step" x="44" y="142">01</text>
    <text class="eval-lineage-name" x="70" y="142">Supervised metrics, 1990s-2010s</text>
    <text class="eval-lineage-desc" x="44" y="166">Accuracy, precision, recall, F1. Discrete</text>
    <text class="eval-lineage-desc" x="44" y="182">labels and continuous numbers.</text>
  </g>
  <line class="eval-lineage-line eval-lineage-conn eval-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#eval-lineage-tip)"/>
  <g class="eval-lineage-stage eval-lineage-s1">
    <rect class="eval-lineage-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="eval-lineage-step" x="359" y="142">02</text>
    <text class="eval-lineage-name" x="385" y="142">n-gram overlap, 2002-2018</text>
    <text class="eval-lineage-desc" x="359" y="166">BLEU and ROUGE. Fast, and blind to meaning.</text>
  </g>
  <line class="eval-lineage-line eval-lineage-conn eval-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#eval-lineage-tip)"/>
  <g class="eval-lineage-stage eval-lineage-s2">
    <rect class="eval-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="eval-lineage-step" x="674" y="142">03</text>
    <text class="eval-lineage-name" x="700" y="142">Holistic and judged, 2022</text>
    <text class="eval-lineage-desc" x="674" y="166">Schema validation, embeddings and calibrated</text>
    <text class="eval-lineage-desc" x="674" y="182">judges together.</text>
  </g>
  <text class="eval-lineage-sub" x="30" y="304">"The client paid the bill" and "the customer settled the invoice" share zero n-grams, which is the single clearest illustration of why the second era could not carry the field forward.</text>
</svg>
