<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-labelledby="d120fTitleId d120fDescId">
  <title id="d120fTitleId">Two Series with different indexes sliding together: matching labels align and add, non-matching labels become NaN</title>
  <desc id="d120fDescId">Series x, indexed a, b, c with values 1, 2, 3, slides in from the left, and Series y, indexed b, c, d with values 10, 20, 30, slides in from the right, converging on a shared row of index labels a, b, c, d. Labels b and c exist on both sides and light up green with their summed values 12 and 23. Labels a and d exist on only one side and light up red with NaN. Wires march from each source cell into its aligned result cell while the source cells that have no partner on the other side visibly have nothing arriving from the missing side.</desc>

  <style>
    .d120f-bg      { fill: #f8fafc; }
    .d120f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d120f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d120f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d120f-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; fill: #1a202c; }
    .d120f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d120f-src     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d120f-idx     { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.25; }

    /* Motion 2: wires march from source cells into the result row. */
    .d120f-wire {
      fill: none; stroke: #1d4ed8; stroke-width: 2.25;
      stroke-dasharray: 8 6; animation: d120f-march 1.4s linear infinite;
    }
    @keyframes d120f-march { to { stroke-dashoffset: -14; } }

    /* Motion 3: the two source blocks drift toward the shared index line and settle. */
    .d120f-blockx { animation: d120f-slidex 6s ease-in-out infinite; }
    .d120f-blocky { animation: d120f-slidey 6s ease-in-out infinite; }
    @keyframes d120f-slidex {
      0%, 8%   { transform: translateX(-18px); }
      45%, 100% { transform: translateX(0); }
    }
    @keyframes d120f-slidey {
      0%, 8%   { transform: translateX(18px); }
      45%, 100% { transform: translateX(0); }
    }

    /* Motion 1: matched result cells (b, c) pulse green once alignment lands. */
    .d120f-match {
      fill: #dcfce7; stroke: #047857; stroke-width: 2;
      animation: d120f-pulse-match 6s ease-in-out infinite;
    }
    @keyframes d120f-pulse-match {
      0%, 45%   { fill: #f1f5f9; stroke: #94a3b8; }
      60%, 100% { fill: #dcfce7; stroke: #047857; }
    }

    /* Unmatched result cells (a, d) pulse toward a NaN warning colour. */
    .d120f-nan {
      fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 5 4;
      animation: d120f-pulse-nan 6s ease-in-out infinite;
    }
    @keyframes d120f-pulse-nan {
      0%, 45%   { fill: #f1f5f9; stroke: #94a3b8; stroke-dasharray: 0; }
      60%, 100% { fill: #fee2e2; stroke: #b91c1c; stroke-dasharray: 5 4; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d120f-wire     { animation: none; stroke-dasharray: none; }
      .d120f-blockx   { animation: none; transform: translateX(0); }
      .d120f-blocky   { animation: none; transform: translateX(0); }
      .d120f-match    { animation: none; fill: #dcfce7; stroke: #047857; }
      .d120f-nan      { animation: none; fill: #fee2e2; stroke: #b91c1c; stroke-dasharray: 5 4; }
    }
  </style>

  <rect class="d120f-bg" x="0" y="0" width="980" height="520" />

  <text class="d120f-title" x="32" y="42">Addition aligns on LABEL, not position</text>
  <text class="d120f-sub" x="32" y="66">x (index a, b, c) + y (index b, c, d) -- only labels present on BOTH sides get a real sum</text>

  <!-- Left source: Series x -->
  <text class="d120f-label" x="150" y="106" text-anchor="middle">x</text>
  <g class="d120f-blockx">
    <rect class="d120f-src" x="90" y="118" width="120" height="40" />
    <text class="d120f-mono" x="115" y="143">a</text>
    <text class="d120f-mono" x="175" y="143">1</text>
    <rect class="d120f-src" x="90" y="162" width="120" height="40" />
    <text class="d120f-mono" x="115" y="187">b</text>
    <text class="d120f-mono" x="175" y="187">2</text>
    <rect class="d120f-src" x="90" y="206" width="120" height="40" />
    <text class="d120f-mono" x="115" y="231">c</text>
    <text class="d120f-mono" x="175" y="231">3</text>
  </g>

  <!-- Right source: Series y -->
  <text class="d120f-label" x="830" y="106" text-anchor="middle">y</text>
  <g class="d120f-blocky">
    <rect class="d120f-src" x="770" y="118" width="120" height="40" />
    <text class="d120f-mono" x="795" y="143">b</text>
    <text class="d120f-mono" x="855" y="143">10</text>
    <rect class="d120f-src" x="770" y="162" width="120" height="40" />
    <text class="d120f-mono" x="795" y="187">c</text>
    <text class="d120f-mono" x="855" y="187">20</text>
    <rect class="d120f-src" x="770" y="206" width="120" height="40" />
    <text class="d120f-mono" x="795" y="231">d</text>
    <text class="d120f-mono" x="855" y="231">30</text>
  </g>

  <!-- Result row: the shared index a, b, c, d -->
  <text class="d120f-label" x="490" y="300" text-anchor="middle">x + y  (aligned by index label)</text>

  <rect class="d120f-nan" x="330" y="320" width="320" height="40" />
  <text class="d120f-mono" x="355" y="345">a</text>
  <text class="d120f-mono" x="580" y="345">NaN   (only in x)</text>

  <rect class="d120f-match" x="330" y="364" width="320" height="40" />
  <text class="d120f-mono" x="355" y="389">b</text>
  <text class="d120f-mono" x="580" y="389">12.0   (2 + 10)</text>

  <rect class="d120f-match" x="330" y="408" width="320" height="40" />
  <text class="d120f-mono" x="355" y="433">c</text>
  <text class="d120f-mono" x="580" y="433">23.0   (3 + 20)</text>

  <rect class="d120f-nan" x="330" y="452" width="320" height="40" />
  <text class="d120f-mono" x="355" y="477">d</text>
  <text class="d120f-mono" x="580" y="477">NaN   (only in y)</text>

  <!-- Wires: from x's b,c into the result; from y's b,c into the result -->
  <path class="d120f-wire" d="M 210 182 L 330 384" />
  <path class="d120f-wire" d="M 210 226 L 330 428" />
  <path class="d120f-wire" d="M 770 138 L 650 384" />
  <path class="d120f-wire" d="M 770 182 L 650 428" />

  <text class="d120f-caption" x="32" y="500">Labels a and d exist on only ONE side, so the sum has nothing to add to -- pandas writes NaN rather than guessing.</text>
</svg>
