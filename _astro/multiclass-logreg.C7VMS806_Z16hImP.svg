<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Extending to many classes</title>
  <style>
    .multiclass-logreg-bg   { fill: #f8fafc; }
    .multiclass-logreg-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiclass-logreg-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiclass-logreg-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiclass-logreg-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiclass-logreg-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiclass-logreg-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multiclass-logreg-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multiclass-logreg-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multiclass-logreg-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multiclass-logreg-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multiclass-logreg-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multiclass-logreg-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multiclass-logreg-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multiclass-logreg-stage { opacity: 1; }

    .multiclass-logreg-s0 { animation-delay: 0.00s; }
    .multiclass-logreg-e0 { animation-delay: 0.00s; }
    .multiclass-logreg-s1 { animation-delay: 1.28s; }
    .multiclass-logreg-e1 { animation-delay: 1.28s; }
    .multiclass-logreg-s2 { animation-delay: 2.56s; }
    .multiclass-logreg-e2 { animation-delay: 2.56s; }
    .multiclass-logreg-s3 { animation-delay: 3.84s; }
    .multiclass-logreg-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .multiclass-logreg-conn  { animation: multiclass-logreg-trace 6.4s ease-in-out infinite; }
      .multiclass-logreg-stage { animation: multiclass-logreg-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes multiclass-logreg-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multiclass-logreg-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multiclass-logreg-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multiclass-logreg-stage { animation: multiclass-logreg-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multiclass-logreg-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multiclass-logreg-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multiclass-logreg-bg" width="980" height="322"/>
  <text class="multiclass-logreg-h1"  x="30" y="40">Extending to many classes</text>
  <text class="multiclass-logreg-sub" x="30" y="64">Four steps.</text>
  <g class="multiclass-logreg-stage multiclass-logreg-s0">
    <rect class="multiclass-logreg-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="multiclass-logreg-step" x="44" y="142">01</text>
    <text class="multiclass-logreg-name" x="70" y="142">Compute one score per class</text>
    <text class="multiclass-logreg-desc" x="44" y="166">A separate weight vector for</text>
    <text class="multiclass-logreg-desc" x="44" y="182">each.</text>
  </g>
  <line class="multiclass-logreg-line multiclass-logreg-conn multiclass-logreg-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#multiclass-logreg-tip)"/>
  <g class="multiclass-logreg-stage multiclass-logreg-s1">
    <rect class="multiclass-logreg-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="multiclass-logreg-step" x="280" y="142">02</text>
    <text class="multiclass-logreg-name" x="306" y="142">Exponentiate them</text>
    <text class="multiclass-logreg-desc" x="280" y="166">Making everything positive.</text>
  </g>
  <line class="multiclass-logreg-line multiclass-logreg-conn multiclass-logreg-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#multiclass-logreg-tip)"/>
  <g class="multiclass-logreg-stage multiclass-logreg-s2">
    <rect class="multiclass-logreg-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="multiclass-logreg-step" x="516" y="142">03</text>
    <text class="multiclass-logreg-name" x="542" y="142">And divide by the total</text>
    <text class="multiclass-logreg-desc" x="516" y="166">So they sum to one.</text>
  </g>
  <line class="multiclass-logreg-line multiclass-logreg-conn multiclass-logreg-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#multiclass-logreg-tip)"/>
  <g class="multiclass-logreg-stage multiclass-logreg-s3">
    <rect class="multiclass-logreg-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="multiclass-logreg-step" x="752" y="142">04</text>
    <text class="multiclass-logreg-name" x="778" y="142">Giving a probability distribution over classes</text>
    <text class="multiclass-logreg-desc" x="752" y="166">Which is softmax, and reduces to</text>
    <text class="multiclass-logreg-desc" x="752" y="182">sigmoid for two.</text>
    <text class="multiclass-logreg-edge" x="752" y="242">generalisation</text>
  </g>
  <text class="multiclass-logreg-sub" x="30" y="304">Softmax reducing exactly to the sigmoid in the two-class case is worth verifying once: it makes clear that these are one method rather than two.</text>
</svg>
