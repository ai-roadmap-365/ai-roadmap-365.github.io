<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Where a fixture is visible</title>
  <style>
    .conftest-bg   { fill: #f8fafc; }
    .conftest-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conftest-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conftest-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conftest-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conftest-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conftest-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conftest-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conftest-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conftest-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conftest-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conftest-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conftest-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .conftest-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .conftest-stage { opacity: 1; }

    .conftest-s0 { animation-delay: 0.00s; }
    .conftest-e0 { animation-delay: 0.00s; }
    .conftest-s1 { animation-delay: 1.28s; }
    .conftest-e1 { animation-delay: 1.28s; }
    .conftest-s2 { animation-delay: 2.56s; }
    .conftest-e2 { animation-delay: 2.56s; }
    .conftest-s3 { animation-delay: 3.84s; }
    .conftest-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .conftest-conn  { animation: conftest-trace 6.4s ease-in-out infinite; }
      .conftest-stage { animation: conftest-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes conftest-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes conftest-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .conftest-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .conftest-stage { animation: conftest-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes conftest-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="conftest-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="conftest-bg" width="980" height="322"/>
  <text class="conftest-h1"  x="30" y="40">Where a fixture is visible</text>
  <text class="conftest-sub" x="30" y="64">Four rules.</text>
  <g class="conftest-stage conftest-s0">
    <rect class="conftest-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="conftest-step" x="44" y="142">01</text>
    <text class="conftest-name" x="70" y="142">Defined in a test file, it is visible there</text>
    <text class="conftest-desc" x="44" y="166">And nowhere else.</text>
  </g>
  <line class="conftest-line conftest-conn conftest-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#conftest-tip)"/>
  <g class="conftest-stage conftest-s1">
    <rect class="conftest-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="conftest-step" x="280" y="142">02</text>
    <text class="conftest-name" x="306" y="142">Defined in a shared configuration file, it is visible in that directory</text>
    <text class="conftest-desc" x="280" y="166">And every directory beneath it.</text>
  </g>
  <line class="conftest-line conftest-conn conftest-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#conftest-tip)"/>
  <g class="conftest-stage conftest-s2">
    <rect class="conftest-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="conftest-step" x="516" y="142">03</text>
    <text class="conftest-name" x="542" y="142">So a fixture at the root is available everywhere</text>
    <text class="conftest-desc" x="516" y="166">Which is where shared setup</text>
    <text class="conftest-desc" x="516" y="182">belongs.</text>
  </g>
  <line class="conftest-line conftest-conn conftest-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#conftest-tip)"/>
  <g class="conftest-stage conftest-s3">
    <rect class="conftest-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="conftest-step" x="752" y="142">04</text>
    <text class="conftest-name" x="778" y="142">And it is never imported</text>
    <text class="conftest-desc" x="752" y="166">Which surprises people, and is</text>
    <text class="conftest-desc" x="752" y="182">the mechanism.</text>
  </g>
  <text class="conftest-sub" x="30" y="304">Fixtures being found rather than imported is the part that confuses newcomers, and it is why a fixture in the wrong directory silently does not exist.</text>
</svg>
