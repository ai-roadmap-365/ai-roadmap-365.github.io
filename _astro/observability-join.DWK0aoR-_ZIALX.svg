<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is what makes it diagnosable.">
  <title>One trace, every layer</title>
  <style>
    .observability-join-bg   { fill: #f8fafc; }
    .observability-join-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-join-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-join-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-join-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-join-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-join-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .observability-join-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .observability-join-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .observability-join-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .observability-join-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .observability-join-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .observability-join-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .observability-join-row { opacity: 1; }
    .observability-join-r0 { animation-delay: 0.00s; }
    .observability-join-r1 { animation-delay: 0.45s; }
    .observability-join-r2 { animation-delay: 0.90s; }
    .observability-join-r3 { animation-delay: 1.35s; }
    .observability-join-r4 { animation-delay: 1.80s; }
    .observability-join-row { animation: observability-join-reveal 7.3s ease-in-out infinite; }
    @keyframes observability-join-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="observability-join-bg" width="980" height="390"/>
  <text class="observability-join-h1"  x="30" y="40">One trace, every layer</text>
  <text class="observability-join-sub" x="30" y="64">Which is what makes it diagnosable.</text>
  <rect class="observability-join-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="observability-join-name" x="46" y="122">Correlated</text>
  <text class="observability-join-desc" x="46" y="142">One identifier throughout.</text>
  <text class="observability-join-desc observability-join-row observability-join-r0" x="46" y="182">Session ID linked to the trace</text>
  <text class="observability-join-desc observability-join-row observability-join-r1" x="46" y="216">Hold record tagged with it</text>
  <text class="observability-join-desc observability-join-row observability-join-r2" x="46" y="250">Cache hit or miss recorded per request</text>
  <text class="observability-join-desc observability-join-row observability-join-r3" x="46" y="284">Provider and duration attached</text>
  <text class="observability-join-desc observability-join-row observability-join-r4" x="46" y="318">One query answers what happened</text>
  <rect class="observability-join-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="observability-join-name" x="526" y="122">Per layer</text>
  <text class="observability-join-desc" x="526" y="142">Five dashboards.</text>
  <text class="observability-join-desc observability-join-row observability-join-r0" x="526" y="182">Each layer instrumented separately</text>
  <text class="observability-join-desc observability-join-row observability-join-r1" x="526" y="216">No shared identifier</text>
  <text class="observability-join-desc observability-join-row observability-join-r2" x="526" y="250">Timestamps correlated by hand</text>
  <text class="observability-join-desc observability-join-row observability-join-r3" x="526" y="284">A slow request has five possible causes</text>
  <text class="observability-join-desc observability-join-row observability-join-r4" x="526" y="318">And no way to choose between them</text>
  <text class="observability-join-sub" x="30" y="372">This is Day 343's point applied to a commercial product: telemetry that does not join up produces five green dashboards and one unhappy customer.</text>
</svg>
