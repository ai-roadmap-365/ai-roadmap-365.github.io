<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>A stage is a contract</title>
  <style>
    .stage-contract-bg   { fill: #f8fafc; }
    .stage-contract-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-contract-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-contract-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-contract-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-contract-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-contract-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stage-contract-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stage-contract-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stage-contract-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stage-contract-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stage-contract-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stage-contract-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stage-contract-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stage-contract-stage { opacity: 1; }

    .stage-contract-s0 { animation-delay: 0.00s; }
    .stage-contract-e0 { animation-delay: 0.00s; }
    .stage-contract-s1 { animation-delay: 1.28s; }
    .stage-contract-e1 { animation-delay: 1.28s; }
    .stage-contract-s2 { animation-delay: 2.56s; }
    .stage-contract-e2 { animation-delay: 2.56s; }
    .stage-contract-s3 { animation-delay: 3.84s; }
    .stage-contract-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stage-contract-conn  { animation: stage-contract-trace 6.4s ease-in-out infinite; }
      .stage-contract-stage { animation: stage-contract-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stage-contract-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stage-contract-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stage-contract-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stage-contract-stage { animation: stage-contract-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stage-contract-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stage-contract-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stage-contract-bg" width="980" height="322"/>
  <text class="stage-contract-h1"  x="30" y="40">A stage is a contract</text>
  <text class="stage-contract-sub" x="30" y="64">Four properties.</text>
  <g class="stage-contract-stage stage-contract-s0">
    <rect class="stage-contract-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stage-contract-step" x="44" y="142">01</text>
    <text class="stage-contract-name" x="70" y="142">Declared inputs, with types and expectations</text>
    <text class="stage-contract-desc" x="44" y="166">Not whatever happens to be in</text>
    <text class="stage-contract-desc" x="44" y="182">memory.</text>
  </g>
  <line class="stage-contract-line stage-contract-conn stage-contract-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stage-contract-tip)"/>
  <g class="stage-contract-stage stage-contract-s1">
    <rect class="stage-contract-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stage-contract-step" x="280" y="142">02</text>
    <text class="stage-contract-name" x="306" y="142">Declared outputs, checked before passing on</text>
    <text class="stage-contract-desc" x="280" y="166">So a broken stage fails at its</text>
    <text class="stage-contract-desc" x="280" y="182">own boundary.</text>
  </g>
  <line class="stage-contract-line stage-contract-conn stage-contract-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stage-contract-tip)"/>
  <g class="stage-contract-stage stage-contract-s2">
    <rect class="stage-contract-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stage-contract-step" x="516" y="142">03</text>
    <text class="stage-contract-name" x="542" y="142">Verifiable in isolation</text>
    <text class="stage-contract-desc" x="516" y="166">Which a notebook cell is not.</text>
  </g>
  <line class="stage-contract-line stage-contract-conn stage-contract-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stage-contract-tip)"/>
  <g class="stage-contract-stage stage-contract-s3">
    <rect class="stage-contract-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stage-contract-step" x="752" y="142">04</text>
    <text class="stage-contract-name" x="778" y="142">And runnable independently of the others</text>
    <text class="stage-contract-desc" x="752" y="166">Which is what makes the pipeline</text>
    <text class="stage-contract-desc" x="752" y="182">reproducible.</text>
  </g>
  <text class="stage-contract-sub" x="30" y="304">Failing at its own boundary is what makes a contract useful: without it, a corrupted intermediate flows onward and surfaces as an inexplicable result three stages later.</text>
</svg>
