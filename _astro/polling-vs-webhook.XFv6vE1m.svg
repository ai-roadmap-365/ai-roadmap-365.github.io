<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>Polling versus webhooks: many repeated client requests compared with a single server callback</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Polling vs. webhooks</text>

  <!-- Divider -->
  <line x1="380" y1="56" x2="380" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- LEFT: POLLING -->
  <text x="190" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">Polling (pull)</text>

  <rect x="40" y="96" width="120" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="100" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Your app</text>
  <text x="100" y="141" text-anchor="middle" font-size="14" fill="#1a202c">(client)</text>

  <rect x="220" y="96" width="120" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="280" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Server</text>
  <text x="280" y="141" text-anchor="middle" font-size="14" fill="#1a202c">(has the data)</text>

  <!-- repeated request/reply pairs -->
  <line x1="160" y1="180" x2="216" y2="180" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="220,180 208,175 208,185" fill="#1d4ed8"/>
  <text x="188" y="174" text-anchor="middle" font-size="14" fill="#1a202c">"Anything new?"</text>
  <line x1="220" y1="200" x2="164" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="160,200 172,195 172,205" fill="#94a3b8"/>
  <text x="192" y="216" text-anchor="middle" font-size="14" fill="#64748b">"No." (wasted)</text>

  <line x1="160" y1="248" x2="216" y2="248" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="220,248 208,243 208,253" fill="#1d4ed8"/>
  <text x="188" y="242" text-anchor="middle" font-size="14" fill="#1a202c">"Anything new?"</text>
  <line x1="220" y1="268" x2="164" y2="268" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="160,268 172,263 172,273" fill="#94a3b8"/>
  <text x="192" y="284" text-anchor="middle" font-size="14" fill="#64748b">"No." (wasted)</text>

  <line x1="160" y1="316" x2="216" y2="316" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="220,316 208,311 208,321" fill="#1d4ed8"/>
  <text x="188" y="310" text-anchor="middle" font-size="14" fill="#1a202c">"Anything new?"</text>
  <line x1="220" y1="336" x2="164" y2="336" stroke="#16a34a" stroke-width="2"/>
  <polygon points="160,336 172,331 172,341" fill="#16a34a"/>
  <text x="192" y="352" text-anchor="middle" font-size="14" fill="#16a34a">"Yes!" (finally)</text>

  <text x="190" y="400" text-anchor="middle" font-size="14" fill="#1a202c">Many trips; most return nothing.</text>
  <text x="190" y="420" text-anchor="middle" font-size="14" fill="#1a202c">Wastes requests and adds delay.</text>

  <!-- RIGHT: WEBHOOK -->
  <text x="570" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">Webhook (push)</text>

  <rect x="420" y="96" width="120" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="480" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Server</text>
  <text x="480" y="141" text-anchor="middle" font-size="14" fill="#1a202c">(has the data)</text>

  <rect x="600" y="96" width="120" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="660" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Your app</text>
  <text x="660" y="141" text-anchor="middle" font-size="14" fill="#1a202c">(your URL)</text>

  <!-- silence, then one callback -->
  <text x="570" y="210" text-anchor="middle" font-size="14" fill="#64748b">You register your URL once,</text>
  <text x="570" y="230" text-anchor="middle" font-size="14" fill="#64748b">then wait. No repeated asking.</text>

  <text x="570" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">event happens!</text>
  <line x1="480" y1="300" x2="480" y2="330" stroke="#16a34a" stroke-width="2"/>
  <line x1="480" y1="330" x2="596" y2="330" stroke="#16a34a" stroke-width="3"/>
  <polygon points="600,330 588,325 588,335" fill="#16a34a"/>
  <text x="540" y="322" text-anchor="middle" font-size="14" fill="#1a202c">POST /your-endpoint</text>
  <text x="560" y="352" text-anchor="middle" font-size="14" fill="#16a34a">the server calls you</text>

  <text x="570" y="400" text-anchor="middle" font-size="14" fill="#1a202c">One call, exactly when it matters.</text>
  <text x="570" y="420" text-anchor="middle" font-size="14" fill="#1a202c">No wasted trips; near-instant.</text>
</svg>
