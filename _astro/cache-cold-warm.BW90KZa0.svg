<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And why your CI build is not.">
  <title>Why the second install is instant</title>
  <style>
    .cache-cold-warm-bg   { fill: #f8fafc; }
    .cache-cold-warm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-cold-warm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-cold-warm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-cold-warm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-cold-warm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-cold-warm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-cold-warm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cache-cold-warm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cache-cold-warm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cache-cold-warm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cache-cold-warm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cache-cold-warm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cache-cold-warm-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cache-cold-warm-stage { opacity: 1; }

    .cache-cold-warm-s0 { animation-delay: 0.00s; }
    .cache-cold-warm-e0 { animation-delay: 0.00s; }
    .cache-cold-warm-s1 { animation-delay: 1.28s; }
    .cache-cold-warm-e1 { animation-delay: 1.28s; }
    .cache-cold-warm-s2 { animation-delay: 2.56s; }
    .cache-cold-warm-e2 { animation-delay: 2.56s; }
    .cache-cold-warm-s3 { animation-delay: 3.84s; }
    .cache-cold-warm-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cache-cold-warm-conn  { animation: cache-cold-warm-trace 6.4s ease-in-out infinite; }
      .cache-cold-warm-stage { animation: cache-cold-warm-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cache-cold-warm-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cache-cold-warm-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cache-cold-warm-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cache-cold-warm-stage { animation: cache-cold-warm-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cache-cold-warm-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cache-cold-warm-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cache-cold-warm-bg" width="980" height="322"/>
  <text class="cache-cold-warm-h1"  x="30" y="40">Why the second install is instant</text>
  <text class="cache-cold-warm-sub" x="30" y="64">And why your CI build is not.</text>
  <g class="cache-cold-warm-stage cache-cold-warm-s0">
    <rect class="cache-cold-warm-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cache-cold-warm-step" x="44" y="142">01</text>
    <text class="cache-cold-warm-name" x="70" y="142">First install</text>
    <text class="cache-cold-warm-desc" x="44" y="166">Index fetched, every package</text>
    <text class="cache-cold-warm-desc" x="44" y="182">downloaded and verified.</text>
    <text class="cache-cold-warm-edge" x="44" y="242">minutes</text>
  </g>
  <line class="cache-cold-warm-line cache-cold-warm-conn cache-cold-warm-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cache-cold-warm-tip)"/>
  <g class="cache-cold-warm-stage cache-cold-warm-s1">
    <rect class="cache-cold-warm-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cache-cold-warm-step" x="280" y="142">02</text>
    <text class="cache-cold-warm-name" x="306" y="142">Files kept in the cache</text>
    <text class="cache-cold-warm-desc" x="280" y="166">The downloads stay on disk after</text>
    <text class="cache-cold-warm-desc" x="280" y="182">installation.</text>
  </g>
  <line class="cache-cold-warm-line cache-cold-warm-conn cache-cold-warm-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cache-cold-warm-tip)"/>
  <g class="cache-cold-warm-stage cache-cold-warm-s2">
    <rect class="cache-cold-warm-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cache-cold-warm-step" x="516" y="142">03</text>
    <text class="cache-cold-warm-name" x="542" y="142">Second install</text>
    <text class="cache-cold-warm-desc" x="516" y="166">Nothing to fetch. Verification</text>
    <text class="cache-cold-warm-desc" x="516" y="182">and unpacking only.</text>
    <text class="cache-cold-warm-edge" x="516" y="242">seconds</text>
  </g>
  <line class="cache-cold-warm-line cache-cold-warm-conn cache-cold-warm-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cache-cold-warm-tip)"/>
  <g class="cache-cold-warm-stage cache-cold-warm-s3">
    <rect class="cache-cold-warm-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cache-cold-warm-step" x="752" y="142">04</text>
    <text class="cache-cold-warm-name" x="778" y="142">A CI runner starts empty</text>
    <text class="cache-cold-warm-desc" x="752" y="166">Every build pays the cold cost,</text>
    <text class="cache-cold-warm-desc" x="752" y="182">every time.</text>
    <text class="cache-cold-warm-edge" x="752" y="242">every build</text>
  </g>
  <text class="cache-cold-warm-sub" x="30" y="304">Caching that directory is usually the single largest speed-up available to a continuous-integration pipeline, and it is one configuration line.</text>
</svg>
