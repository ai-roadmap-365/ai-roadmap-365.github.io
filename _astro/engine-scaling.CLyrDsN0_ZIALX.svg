<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="From small ones you can afford to build.">
  <title>Predicting an engine's power</title>
  <style>
    .engine-scaling-bg   { fill: #f8fafc; }
    .engine-scaling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-scaling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-scaling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-scaling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-scaling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-scaling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .engine-scaling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .engine-scaling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .engine-scaling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .engine-scaling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .engine-scaling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .engine-scaling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .engine-scaling-row { opacity: 1; }
    .engine-scaling-r0 { animation-delay: 0.00s; }
    .engine-scaling-r1 { animation-delay: 0.45s; }
    .engine-scaling-r2 { animation-delay: 0.90s; }
    .engine-scaling-r3 { animation-delay: 1.35s; }
    .engine-scaling-r4 { animation-delay: 1.80s; }
    .engine-scaling-row { animation: engine-scaling-reveal 7.3s ease-in-out infinite; }
    @keyframes engine-scaling-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="engine-scaling-bg" width="980" height="390"/>
  <text class="engine-scaling-h1"  x="30" y="40">Predicting an engine's power</text>
  <text class="engine-scaling-sub" x="30" y="64">From small ones you can afford to build.</text>
  <rect class="engine-scaling-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="engine-scaling-name" x="46" y="122">Test small, then extrapolate</text>
  <text class="engine-scaling-desc" x="46" y="142">Cheap, and usually right.</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r0" x="46" y="182">Build several small versions</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r1" x="46" y="216">Measure how output scales</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r2" x="46" y="250">Fit the relationship</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r3" x="46" y="284">Predict the large one before building it</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r4" x="46" y="318">This is a scaling law</text>
  <rect class="engine-scaling-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="engine-scaling-name" x="526" y="122">Build the large one and see</text>
  <text class="engine-scaling-desc" x="526" y="142">Expensive, and slow.</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r0" x="526" y="182">One attempt, at full cost</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r1" x="526" y="216">No intermediate information</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r2" x="526" y="250">A failure teaches little</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r3" x="526" y="284">Months per iteration</text>
  <text class="engine-scaling-desc engine-scaling-row engine-scaling-r4" x="526" y="318">This was the field before 2020</text>
  <text class="engine-scaling-sub" x="30" y="372">The analogy also carries the caveat: extrapolation holds only while the underlying physics stays the same, and scaling laws likewise break when the regime changes.</text>
</svg>
