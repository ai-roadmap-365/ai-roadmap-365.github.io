<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Docker invented the workflow, not the isolation.">
  <title>Forty years of the same idea</title>
  <style>
    .container-lineage-bg   { fill: #f8fafc; }
    .container-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .container-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .container-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .container-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .container-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .container-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .container-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .container-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .container-lineage-stage { opacity: 1; }

    .container-lineage-s0 { animation-delay: 0.00s; }
    .container-lineage-e0 { animation-delay: 0.00s; }
    .container-lineage-s1 { animation-delay: 1.33s; }
    .container-lineage-e1 { animation-delay: 1.33s; }
    .container-lineage-s2 { animation-delay: 2.67s; }
    .container-lineage-e2 { animation-delay: 2.67s; }
    .container-lineage-s3 { animation-delay: 4.00s; }
    .container-lineage-e3 { animation-delay: 4.00s; }
    .container-lineage-s4 { animation-delay: 5.33s; }
    .container-lineage-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .container-lineage-conn  { animation: container-lineage-trace 8s ease-in-out infinite; }
      .container-lineage-stage { animation: container-lineage-arrive 8s ease-in-out infinite; }
    }
    @keyframes container-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes container-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .container-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .container-lineage-stage { animation: container-lineage-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes container-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="container-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="container-lineage-bg" width="980" height="322"/>
  <text class="container-lineage-h1"  x="30" y="40">Forty years of the same idea</text>
  <text class="container-lineage-sub" x="30" y="64">Docker invented the workflow, not the isolation.</text>
  <g class="container-lineage-stage container-lineage-s0">
    <rect class="container-lineage-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="container-lineage-step" x="44" y="142">01</text>
    <text class="container-lineage-name" x="70" y="142">chroot, 1979</text>
    <text class="container-lineage-desc" x="44" y="166">Changed a process's idea</text>
    <text class="container-lineage-desc" x="44" y="182">of the root. Isolated</text>
    <text class="container-lineage-desc" x="44" y="198">files and nothing else.</text>
    <text class="container-lineage-edge" x="44" y="242">not a sandbox</text>
  </g>
  <line class="container-lineage-line container-lineage-conn container-lineage-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#container-lineage-tip)"/>
  <g class="container-lineage-stage container-lineage-s1">
    <rect class="container-lineage-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="container-lineage-step" x="233" y="142">02</text>
    <text class="container-lineage-name" x="259" y="142">Jails and Zones, 2000-2004</text>
    <text class="container-lineage-desc" x="233" y="166">Whole-system isolation on</text>
    <text class="container-lineage-desc" x="233" y="182">a shared kernel, proven a</text>
    <text class="container-lineage-desc" x="233" y="198">decade early.</text>
  </g>
  <line class="container-lineage-line container-lineage-conn container-lineage-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#container-lineage-tip)"/>
  <g class="container-lineage-stage container-lineage-s2">
    <rect class="container-lineage-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="container-lineage-step" x="422" y="142">03</text>
    <text class="container-lineage-name" x="448" y="142">cgroups and namespaces, 2006</text>
    <text class="container-lineage-desc" x="422" y="166">Resource limits and</text>
    <text class="container-lineage-desc" x="422" y="182">isolated views. This is</text>
    <text class="container-lineage-desc" x="422" y="198">what a Linux container</text>
    <text class="container-lineage-edge" x="422" y="242">the mechanism</text>
  </g>
  <line class="container-lineage-line container-lineage-conn container-lineage-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#container-lineage-tip)"/>
  <g class="container-lineage-stage container-lineage-s3">
    <rect class="container-lineage-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="container-lineage-step" x="611" y="142">04</text>
    <text class="container-lineage-name" x="637" y="142">Docker, 2013</text>
    <text class="container-lineage-desc" x="611" y="166">A text file, a layered</text>
    <text class="container-lineage-desc" x="611" y="182">cached format, a</text>
    <text class="container-lineage-desc" x="611" y="198">registry. The workflow,</text>
    <text class="container-lineage-edge" x="611" y="242">why it spread</text>
  </g>
  <line class="container-lineage-line container-lineage-conn container-lineage-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#container-lineage-tip)"/>
  <g class="container-lineage-stage container-lineage-s4">
    <rect class="container-lineage-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="container-lineage-step" x="800" y="142">05</text>
    <text class="container-lineage-name" x="826" y="142">OCI, 2015</text>
    <text class="container-lineage-desc" x="800" y="166">One image and runtime</text>
    <text class="container-lineage-desc" x="800" y="182">format, so Podman,</text>
    <text class="container-lineage-desc" x="800" y="198">containerd and Kubernetes</text>
  </g>
  <text class="container-lineage-sub" x="30" y="304">The fourth row is the one worth internalising: containers existed for years and went nowhere until someone shipped a build file, a cache and a place to push to.</text>
</svg>
