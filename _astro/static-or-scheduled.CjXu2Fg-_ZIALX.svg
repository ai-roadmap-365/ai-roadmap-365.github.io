<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One number cannot do three jobs.">
  <title>A fixed rate, or a schedule</title>
  <style>
    .static-or-scheduled-bg   { fill: #f8fafc; }
    .static-or-scheduled-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-scheduled-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-scheduled-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-scheduled-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-scheduled-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-scheduled-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .static-or-scheduled-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .static-or-scheduled-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .static-or-scheduled-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .static-or-scheduled-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .static-or-scheduled-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .static-or-scheduled-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .static-or-scheduled-row { opacity: 1; }
    .static-or-scheduled-r0 { animation-delay: 0.00s; }
    .static-or-scheduled-r1 { animation-delay: 0.45s; }
    .static-or-scheduled-r2 { animation-delay: 0.90s; }
    .static-or-scheduled-r3 { animation-delay: 1.35s; }
    .static-or-scheduled-r4 { animation-delay: 1.80s; }
    .static-or-scheduled-row { animation: static-or-scheduled-reveal 7.3s ease-in-out infinite; }
    @keyframes static-or-scheduled-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="static-or-scheduled-bg" width="980" height="390"/>
  <text class="static-or-scheduled-h1"  x="30" y="40">A fixed rate, or a schedule</text>
  <text class="static-or-scheduled-sub" x="30" y="64">One number cannot do three jobs.</text>
  <rect class="static-or-scheduled-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="static-or-scheduled-name" x="46" y="122">Fixed</text>
  <text class="static-or-scheduled-desc" x="46" y="142">One compromise value.</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r0" x="46" y="182">Large enough to make progress</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r1" x="46" y="216">Small enough not to diverge</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r2" x="46" y="250">Too large near convergence — bounces</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r3" x="46" y="284">Too small early — slow exploration</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r4" x="46" y="318">Neither phase is served well</text>
  <rect class="static-or-scheduled-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="static-or-scheduled-name" x="526" y="122">Scheduled</text>
  <text class="static-or-scheduled-desc" x="526" y="142">The right value per phase.</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r0" x="526" y="182">Small at the start, rising</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r1" x="526" y="216">Large during exploration</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r2" x="526" y="250">Decaying toward the end</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r3" x="526" y="284">Settles into a minimum</text>
  <text class="static-or-scheduled-desc static-or-scheduled-row static-or-scheduled-r4" x="526" y="318">And the whole run is shorter</text>
  <text class="static-or-scheduled-sub" x="30" y="372">The bouncing at the end is the visible symptom: a validation curve that plateaus with persistent noise is usually a learning rate that never came down, not a model that stopped learning.</text>
</svg>
