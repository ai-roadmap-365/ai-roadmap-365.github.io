<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Decompose, search, extract, reconcile, cite.">
  <title>Five stages of a research run</title>
  <style>
    .research-pipeline-bg   { fill: #f8fafc; }
    .research-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .research-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .research-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .research-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .research-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .research-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .research-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .research-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .research-pipeline-stage { opacity: 1; }

    .research-pipeline-s0 { animation-delay: 0.00s; }
    .research-pipeline-e0 { animation-delay: 0.00s; }
    .research-pipeline-s1 { animation-delay: 1.33s; }
    .research-pipeline-e1 { animation-delay: 1.33s; }
    .research-pipeline-s2 { animation-delay: 2.67s; }
    .research-pipeline-e2 { animation-delay: 2.67s; }
    .research-pipeline-s3 { animation-delay: 4.00s; }
    .research-pipeline-e3 { animation-delay: 4.00s; }
    .research-pipeline-s4 { animation-delay: 5.33s; }
    .research-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .research-pipeline-conn  { animation: research-pipeline-trace 8s ease-in-out infinite; }
      .research-pipeline-stage { animation: research-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes research-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes research-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .research-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .research-pipeline-stage { animation: research-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes research-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="research-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="research-pipeline-bg" width="980" height="322"/>
  <text class="research-pipeline-h1"  x="30" y="40">Five stages of a research run</text>
  <text class="research-pipeline-sub" x="30" y="64">Decompose, search, extract, reconcile, cite.</text>
  <g class="research-pipeline-stage research-pipeline-s0">
    <rect class="research-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="research-pipeline-step" x="44" y="142">01</text>
    <text class="research-pipeline-name" x="70" y="142">Decompose</text>
    <text class="research-pipeline-desc" x="44" y="166">One question becomes K</text>
    <text class="research-pipeline-desc" x="44" y="182">orthogonal sub-questions.</text>
    <text class="research-pipeline-desc" x="44" y="198">Coverage comes from here.</text>
  </g>
  <line class="research-pipeline-line research-pipeline-conn research-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#research-pipeline-tip)"/>
  <g class="research-pipeline-stage research-pipeline-s1">
    <rect class="research-pipeline-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="research-pipeline-step" x="233" y="142">02</text>
    <text class="research-pipeline-name" x="259" y="142">Search, multi-hop</text>
    <text class="research-pipeline-desc" x="233" y="166">Follow citations rather</text>
    <text class="research-pipeline-desc" x="233" y="182">than reading only the</text>
    <text class="research-pipeline-desc" x="233" y="198">first page of results.</text>
  </g>
  <line class="research-pipeline-line research-pipeline-conn research-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#research-pipeline-tip)"/>
  <g class="research-pipeline-stage research-pipeline-s2">
    <rect class="research-pipeline-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="research-pipeline-step" x="422" y="142">03</text>
    <text class="research-pipeline-name" x="448" y="142">Extract atomic facts</text>
    <text class="research-pipeline-desc" x="422" y="166">5,000 words to three or</text>
    <text class="research-pipeline-desc" x="422" y="182">five verifiable claims,</text>
    <text class="research-pipeline-desc" x="422" y="198">each with a source.</text>
    <text class="research-pipeline-edge" x="422" y="242">note store</text>
  </g>
  <line class="research-pipeline-line research-pipeline-conn research-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#research-pipeline-tip)"/>
  <g class="research-pipeline-stage research-pipeline-s3">
    <rect class="research-pipeline-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="research-pipeline-step" x="611" y="142">04</text>
    <text class="research-pipeline-name" x="637" y="142">Reconcile conflicts</text>
    <text class="research-pipeline-desc" x="611" y="166">$120/kWh against $85/kWh:</text>
    <text class="research-pipeline-desc" x="611" y="182">report both and the</text>
    <text class="research-pipeline-desc" x="611" y="198">assumptions.</text>
  </g>
  <line class="research-pipeline-line research-pipeline-conn research-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#research-pipeline-tip)"/>
  <g class="research-pipeline-stage research-pipeline-s4">
    <rect class="research-pipeline-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="research-pipeline-step" x="800" y="142">05</text>
    <text class="research-pipeline-name" x="826" y="142">Synthesise with citations</text>
    <text class="research-pipeline-desc" x="800" y="166">Every claim carries a key</text>
    <text class="research-pipeline-desc" x="800" y="182">into a bibliography.</text>
  </g>
  <text class="research-pipeline-sub" x="30" y="304">The first stage is where quality is decided: a research brief is only as complete as its decomposition, and no amount of searching recovers a sub-question nobody asked.</text>
</svg>
