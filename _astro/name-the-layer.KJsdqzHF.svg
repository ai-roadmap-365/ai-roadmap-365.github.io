<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The single most useful debugging habit in this course.">
  <title>Name the layer before changing anything</title>
  <style>
    .name-the-layer-bg   { fill: #f8fafc; }
    .name-the-layer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name-the-layer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name-the-layer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name-the-layer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name-the-layer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name-the-layer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .name-the-layer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .name-the-layer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .name-the-layer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .name-the-layer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .name-the-layer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .name-the-layer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .name-the-layer-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .name-the-layer-stage { opacity: 1; }

    .name-the-layer-s0 { animation-delay: 0.00s; }
    .name-the-layer-e0 { animation-delay: 0.00s; }
    .name-the-layer-s1 { animation-delay: 1.33s; }
    .name-the-layer-e1 { animation-delay: 1.33s; }
    .name-the-layer-s2 { animation-delay: 2.67s; }
    .name-the-layer-e2 { animation-delay: 2.67s; }
    .name-the-layer-s3 { animation-delay: 4.00s; }
    .name-the-layer-e3 { animation-delay: 4.00s; }
    .name-the-layer-s4 { animation-delay: 5.33s; }
    .name-the-layer-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .name-the-layer-conn  { animation: name-the-layer-trace 8s ease-in-out infinite; }
      .name-the-layer-stage { animation: name-the-layer-arrive 8s ease-in-out infinite; }
    }
    @keyframes name-the-layer-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes name-the-layer-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .name-the-layer-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .name-the-layer-stage { animation: name-the-layer-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes name-the-layer-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="name-the-layer-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="name-the-layer-bg" width="980" height="322"/>
  <text class="name-the-layer-h1"  x="30" y="40">Name the layer before changing anything</text>
  <text class="name-the-layer-sub" x="30" y="64">The single most useful debugging habit in this course.</text>
  <g class="name-the-layer-stage name-the-layer-s0">
    <rect class="name-the-layer-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="name-the-layer-step" x="44" y="142">01</text>
    <text class="name-the-layer-name" x="70" y="142">Resources?</text>
    <text class="name-the-layer-desc" x="44" y="166">Killed, out of memory,</text>
    <text class="name-the-layer-desc" x="44" y="182">disk full. Exit code 137</text>
    <text class="name-the-layer-desc" x="44" y="198">says so directly.</text>
    <text class="name-the-layer-edge" x="44" y="242">the machine</text>
  </g>
  <line class="name-the-layer-line name-the-layer-conn name-the-layer-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#name-the-layer-tip)"/>
  <g class="name-the-layer-stage name-the-layer-s1">
    <rect class="name-the-layer-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="name-the-layer-step" x="233" y="142">02</text>
    <text class="name-the-layer-name" x="259" y="142">Environment?</text>
    <text class="name-the-layer-desc" x="233" y="166">PATH, a variable, a</text>
    <text class="name-the-layer-desc" x="233" y="182">version, a permission.</text>
    <text class="name-the-layer-desc" x="233" y="198">"Works on my machine"</text>
    <text class="name-the-layer-edge" x="233" y="242">the shell</text>
  </g>
  <line class="name-the-layer-line name-the-layer-conn name-the-layer-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#name-the-layer-tip)"/>
  <g class="name-the-layer-stage name-the-layer-s2">
    <rect class="name-the-layer-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="name-the-layer-step" x="422" y="142">03</text>
    <text class="name-the-layer-name" x="448" y="142">Network?</text>
    <text class="name-the-layer-desc" x="422" y="166">Did it resolve, connect,</text>
    <text class="name-the-layer-desc" x="422" y="182">and complete TLS? Three</text>
    <text class="name-the-layer-desc" x="422" y="198">separate answers.</text>
    <text class="name-the-layer-edge" x="422" y="242">the network</text>
  </g>
  <line class="name-the-layer-line name-the-layer-conn name-the-layer-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#name-the-layer-tip)"/>
  <g class="name-the-layer-stage name-the-layer-s3">
    <rect class="name-the-layer-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="name-the-layer-step" x="611" y="142">04</text>
    <text class="name-the-layer-name" x="637" y="142">Protocol?</text>
    <text class="name-the-layer-desc" x="611" y="166">What status came back,</text>
    <text class="name-the-layer-desc" x="611" y="182">and whose fault does its</text>
    <text class="name-the-layer-desc" x="611" y="198">first digit say it is?</text>
    <text class="name-the-layer-edge" x="611" y="242">HTTP</text>
  </g>
  <line class="name-the-layer-line name-the-layer-conn name-the-layer-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#name-the-layer-tip)"/>
  <g class="name-the-layer-stage name-the-layer-s4">
    <rect class="name-the-layer-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="name-the-layer-step" x="800" y="142">05</text>
    <text class="name-the-layer-name" x="826" y="142">Application?</text>
    <text class="name-the-layer-desc" x="800" y="166">Only once the four below</text>
    <text class="name-the-layer-desc" x="800" y="182">it are ruled out.</text>
    <text class="name-the-layer-edge" x="800" y="242">your code</text>
  </g>
  <text class="name-the-layer-sub" x="30" y="304">Almost every wasted debugging afternoon in this course's examples began by changing code at step five when the answer was at step one or two. All the checks above it are read-only and take seconds.</text>
</svg>
