<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four parts.">
  <title>Packaging a model</title>
  <style>
    .modelfile-bg   { fill: #f8fafc; }
    .modelfile-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modelfile-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modelfile-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modelfile-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modelfile-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modelfile-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .modelfile-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .modelfile-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .modelfile-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .modelfile-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .modelfile-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .modelfile-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .modelfile-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .modelfile-stage { opacity: 1; }

    .modelfile-s0 { animation-delay: 0.00s; }
    .modelfile-e0 { animation-delay: 0.00s; }
    .modelfile-s1 { animation-delay: 1.28s; }
    .modelfile-e1 { animation-delay: 1.28s; }
    .modelfile-s2 { animation-delay: 2.56s; }
    .modelfile-e2 { animation-delay: 2.56s; }
    .modelfile-s3 { animation-delay: 3.84s; }
    .modelfile-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .modelfile-conn  { animation: modelfile-trace 6.4s ease-in-out infinite; }
      .modelfile-stage { animation: modelfile-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes modelfile-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes modelfile-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .modelfile-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .modelfile-stage { animation: modelfile-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes modelfile-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="modelfile-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="modelfile-bg" width="980" height="322"/>
  <text class="modelfile-h1"  x="30" y="40">Packaging a model</text>
  <text class="modelfile-sub" x="30" y="64">Four parts.</text>
  <g class="modelfile-stage modelfile-s0">
    <rect class="modelfile-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="modelfile-step" x="44" y="142">01</text>
    <text class="modelfile-name" x="70" y="142">A base model to build on</text>
    <text class="modelfile-desc" x="44" y="166">Pulled once, shared between</text>
    <text class="modelfile-desc" x="44" y="182">packages.</text>
  </g>
  <line class="modelfile-line modelfile-conn modelfile-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#modelfile-tip)"/>
  <g class="modelfile-stage modelfile-s1">
    <rect class="modelfile-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="modelfile-step" x="280" y="142">02</text>
    <text class="modelfile-name" x="306" y="142">The chat template</text>
    <text class="modelfile-desc" x="280" y="166">Which is what makes the output</text>
    <text class="modelfile-desc" x="280" y="182">correct.</text>
  </g>
  <line class="modelfile-line modelfile-conn modelfile-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#modelfile-tip)"/>
  <g class="modelfile-stage modelfile-s2">
    <rect class="modelfile-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="modelfile-step" x="516" y="142">03</text>
    <text class="modelfile-name" x="542" y="142">Default sampling parameters</text>
    <text class="modelfile-desc" x="516" y="166">Temperature, truncation, stop</text>
    <text class="modelfile-desc" x="516" y="182">sequences.</text>
  </g>
  <line class="modelfile-line modelfile-conn modelfile-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#modelfile-tip)"/>
  <g class="modelfile-stage modelfile-s3">
    <rect class="modelfile-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="modelfile-step" x="752" y="142">04</text>
    <text class="modelfile-name" x="778" y="142">And a system prompt baked in</text>
    <text class="modelfile-desc" x="752" y="166">So the behaviour ships with the</text>
    <text class="modelfile-desc" x="752" y="182">package.</text>
    <text class="modelfile-edge" x="752" y="242">reproducible</text>
  </g>
  <text class="modelfile-sub" x="30" y="304">Baking the system prompt into the package makes behaviour reproducible across machines, which is the local equivalent of pinning a prompt version.</text>
</svg>
