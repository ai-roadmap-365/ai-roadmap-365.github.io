<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each removes something different.">
  <title>Three ways to make a model smaller</title>
  <style>
    .compression-idea-bg   { fill: #f8fafc; }
    .compression-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compression-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compression-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compression-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compression-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compression-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compression-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compression-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compression-idea-stage { opacity: 1; }

    .compression-idea-s0 { animation-delay: 0.00s; }
    .compression-idea-e0 { animation-delay: 0.00s; }
    .compression-idea-s1 { animation-delay: 1.50s; }
    .compression-idea-e1 { animation-delay: 1.50s; }
    .compression-idea-s2 { animation-delay: 3.00s; }
    .compression-idea-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .compression-idea-conn  { animation: compression-idea-trace 6s ease-in-out infinite; }
      .compression-idea-stage { animation: compression-idea-arrive 6s ease-in-out infinite; }
    }
    @keyframes compression-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compression-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compression-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compression-idea-stage { animation: compression-idea-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compression-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compression-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compression-idea-bg" width="980" height="322"/>
  <text class="compression-idea-h1"  x="30" y="40">Three ways to make a model smaller</text>
  <text class="compression-idea-sub" x="30" y="64">Each removes something different.</text>
  <g class="compression-idea-stage compression-idea-s0">
    <rect class="compression-idea-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="compression-idea-step" x="44" y="142">01</text>
    <text class="compression-idea-name" x="70" y="142">Quantisation</text>
    <text class="compression-idea-desc" x="44" y="166">Fewer bits per weight. Same architecture,</text>
    <text class="compression-idea-desc" x="44" y="182">same behaviour.</text>
  </g>
  <line class="compression-idea-line compression-idea-conn compression-idea-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#compression-idea-tip)"/>
  <g class="compression-idea-stage compression-idea-s1">
    <rect class="compression-idea-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="compression-idea-step" x="359" y="142">02</text>
    <text class="compression-idea-name" x="385" y="142">Distillation</text>
    <text class="compression-idea-desc" x="359" y="166">A smaller architecture trained to imitate a</text>
    <text class="compression-idea-desc" x="359" y="182">larger one.</text>
  </g>
  <line class="compression-idea-line compression-idea-conn compression-idea-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#compression-idea-tip)"/>
  <g class="compression-idea-stage compression-idea-s2">
    <rect class="compression-idea-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="compression-idea-step" x="674" y="142">03</text>
    <text class="compression-idea-name" x="700" y="142">Sparsity</text>
    <text class="compression-idea-desc" x="674" y="166">Remove weights entirely, in patterns the</text>
    <text class="compression-idea-desc" x="674" y="182">hardware can exploit.</text>
  </g>
  <text class="compression-idea-sub" x="30" y="304">These compose rather than compete: a distilled model can be quantised and then sparsified, and production models routinely are all three.</text>
</svg>
