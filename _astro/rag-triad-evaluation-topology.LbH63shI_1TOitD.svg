<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="RAG Triad Evaluation Topology">
  <title>RAG Triad Evaluation Topology</title>
  <defs>
    <style>
      .d356a-bg { fill: #f8fafc; }
      .d356a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d356a-que { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d356a-con { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d356a-ans { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d356a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d356a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d356a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d356a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d356a-bg" />
  
  <text x="40" y="40" class="d356a-title">The RAG Triad: Quantitative Evaluation Architecture</text>
  <text x="40" y="65" class="d356a-subtitle">RAG Triad Evaluation Topology showing User Query, Retrieved Context, Generated Answer, Context Recall, Faithfulness, and Answer Relevance</text>
  
  <!-- Query Node -->
  <rect x="40" y="110" width="250" height="280" class="d356a-que" />
  <text x="55" y="145" class="d356a-header" fill="#1d4ed8">1. User Query</text>
  <text x="55" y="180" class="d356a-text">• User Intent &amp; Constraints</text>
  <text x="55" y="210" class="d356a-text" font-weight="600" fill="#1d4ed8">Metric: Context Recall</text>
  <text x="55" y="235" class="d356a-text">Is retrieved context sufficient?</text>
  <text x="55" y="270" class="d356a-text" font-weight="600" fill="#1d4ed8">Metric: Answer Relevance</text>
  <text x="55" y="295" class="d356a-text">Does answer resolve query?</text>
  <text x="55" y="345" class="d356a-text" font-weight="600">Target Score: &gt; 0.90</text>
  
  <!-- Context Node -->
  <rect x="315" y="110" width="270" height="280" class="d356a-con" />
  <text x="330" y="145" class="d356a-header" fill="#15803d">2. Retrieved Context</text>
  <text x="330" y="180" class="d356a-text">• Hybrid Dense + BM25 Chunks</text>
  <text x="330" y="210" class="d356a-text" font-weight="600" fill="#15803d">Metric: Faithfulness</text>
  <text x="330" y="235" class="d356a-text">Are claims grounded in text?</text>
  <text x="330" y="270" class="d356a-text" font-weight="600" fill="#15803d">Zero-Hallucination Gate</text>
  <text x="330" y="295" class="d356a-text">Claims supported / Total claims</text>
  <text x="330" y="345" class="d356a-text" font-weight="600">Target Score: &gt; 0.95</text>
  
  <!-- Answer Node -->
  <rect x="610" y="110" width="250" height="280" class="d356a-ans" />
  <text x="625" y="145" class="d356a-header" fill="#7e22ce">3. Generated Answer</text>
  <text x="625" y="180" class="d356a-text">• Structured JSON Payload</text>
  <text x="625" y="210" class="d356a-text" font-weight="600" fill="#7e22ce">Automated Evaluation</text>
  <text x="625" y="235" class="d356a-text">LLM-as-a-Judge scoring</text>
  <text x="625" y="270" class="d356a-text" font-weight="600" fill="#7e22ce">CI/CD Quality Gate</text>
  <text x="625" y="295" class="d356a-text">Block deployment on drop</text>
  <text x="625" y="345" class="d356a-text" font-weight="600">Composite: &gt; 92.0%</text>
</svg>