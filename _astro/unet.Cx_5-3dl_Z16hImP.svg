<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Down, up, and across.">
  <title>The U-Net shape</title>
  <style>
    .unet-bg   { fill: #f8fafc; }
    .unet-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unet-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unet-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unet-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unet-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unet-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unet-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unet-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unet-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unet-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unet-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unet-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .unet-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .unet-stage { opacity: 1; }

    .unet-s0 { animation-delay: 0.00s; }
    .unet-e0 { animation-delay: 0.00s; }
    .unet-s1 { animation-delay: 1.28s; }
    .unet-e1 { animation-delay: 1.28s; }
    .unet-s2 { animation-delay: 2.56s; }
    .unet-e2 { animation-delay: 2.56s; }
    .unet-s3 { animation-delay: 3.84s; }
    .unet-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .unet-conn  { animation: unet-trace 6.4s ease-in-out infinite; }
      .unet-stage { animation: unet-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes unet-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes unet-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .unet-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .unet-stage { animation: unet-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes unet-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="unet-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="unet-bg" width="980" height="322"/>
  <text class="unet-h1"  x="30" y="40">The U-Net shape</text>
  <text class="unet-sub" x="30" y="64">Down, up, and across.</text>
  <g class="unet-stage unet-s0">
    <rect class="unet-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="unet-step" x="44" y="142">01</text>
    <text class="unet-name" x="70" y="142">Contracting path</text>
    <text class="unet-desc" x="44" y="166">Convolutions and downsampling.</text>
    <text class="unet-desc" x="44" y="182">Resolution falls, semantics</text>
    <text class="unet-desc" x="44" y="198">rise.</text>
  </g>
  <line class="unet-line unet-conn unet-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#unet-tip)"/>
  <g class="unet-stage unet-s1">
    <rect class="unet-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="unet-step" x="280" y="142">02</text>
    <text class="unet-name" x="306" y="142">Bottleneck</text>
    <text class="unet-desc" x="280" y="166">Lowest resolution, richest</text>
    <text class="unet-desc" x="280" y="182">features. The widest receptive</text>
    <text class="unet-desc" x="280" y="198">field.</text>
  </g>
  <line class="unet-line unet-conn unet-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#unet-tip)"/>
  <g class="unet-stage unet-s2">
    <rect class="unet-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="unet-step" x="516" y="142">03</text>
    <text class="unet-name" x="542" y="142">Expanding path</text>
    <text class="unet-desc" x="516" y="166">Upsampling back to full</text>
    <text class="unet-desc" x="516" y="182">resolution.</text>
    <text class="unet-edge" x="516" y="242">transposed conv</text>
  </g>
  <line class="unet-line unet-conn unet-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#unet-tip)"/>
  <g class="unet-stage unet-s3">
    <rect class="unet-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="unet-step" x="752" y="142">04</text>
    <text class="unet-name" x="778" y="142">Skip connections across</text>
    <text class="unet-desc" x="752" y="166">Fine spatial detail from the</text>
    <text class="unet-desc" x="752" y="182">encoder, joined to coarse</text>
    <text class="unet-desc" x="752" y="198">semantics.</text>
  </g>
  <text class="unet-sub" x="30" y="304">The skip connections are what make the boundaries sharp: without them, upsampling from the bottleneck produces semantically correct regions with blurred, approximate edges.</text>
</svg>
