<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Only one decides.">
  <title>Public benchmarks against your evaluation</title>
  <style>
    .benchmarks-bg   { fill: #f8fafc; }
    .benchmarks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmarks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmarks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmarks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmarks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmarks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .benchmarks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .benchmarks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .benchmarks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .benchmarks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .benchmarks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .benchmarks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .benchmarks-row { opacity: 1; }
    .benchmarks-r0 { animation-delay: 0.00s; }
    .benchmarks-r1 { animation-delay: 0.45s; }
    .benchmarks-r2 { animation-delay: 0.90s; }
    .benchmarks-r3 { animation-delay: 1.35s; }
    .benchmarks-r4 { animation-delay: 1.80s; }
    .benchmarks-row { animation: benchmarks-reveal 7.3s ease-in-out infinite; }
    @keyframes benchmarks-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="benchmarks-bg" width="980" height="390"/>
  <text class="benchmarks-h1"  x="30" y="40">Public benchmarks against your evaluation</text>
  <text class="benchmarks-sub" x="30" y="64">Only one decides.</text>
  <rect class="benchmarks-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="benchmarks-name" x="46" y="122">Public benchmarks</text>
  <text class="benchmarks-desc" x="46" y="142">Useful, and gamed.</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r0" x="46" y="182">Comparable across models</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r1" x="46" y="216">Published by the vendor</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r2" x="46" y="250">Contamination is common and hard to detect</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r3" x="46" y="284">Measures a task that is not yours</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r4" x="46" y="318">Moves with the marketing cycle</text>
  <rect class="benchmarks-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="benchmarks-name" x="526" y="122">Your own evaluation</text>
  <text class="benchmarks-desc" x="526" y="142">The one that counts.</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r0" x="526" y="182">A few hundred of your real examples</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r1" x="526" y="216">Graded the way your users judge</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r2" x="526" y="250">No contamination risk</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r3" x="526" y="284">Measures the thing you ship</text>
  <text class="benchmarks-desc benchmarks-row benchmarks-r4" x="526" y="318">And it catches regressions on model updates</text>
  <text class="benchmarks-sub" x="30" y="372">Building the internal set early is the highest-leverage step in any model-selection process, and it keeps paying every time a new model is released.</text>
</svg>
