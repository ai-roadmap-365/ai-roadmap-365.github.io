<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two accounting rules.">
  <title>How you count a mistake</title>
  <style>
    .measuring-tape-bg   { fill: #f8fafc; }
    .measuring-tape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measuring-tape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measuring-tape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measuring-tape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measuring-tape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measuring-tape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .measuring-tape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .measuring-tape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .measuring-tape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .measuring-tape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .measuring-tape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .measuring-tape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .measuring-tape-row { opacity: 1; }
    .measuring-tape-r0 { animation-delay: 0.00s; }
    .measuring-tape-r1 { animation-delay: 0.45s; }
    .measuring-tape-r2 { animation-delay: 0.90s; }
    .measuring-tape-r3 { animation-delay: 1.35s; }
    .measuring-tape-r4 { animation-delay: 1.80s; }
    .measuring-tape-row { animation: measuring-tape-reveal 7.3s ease-in-out infinite; }
    @keyframes measuring-tape-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="measuring-tape-bg" width="980" height="390"/>
  <text class="measuring-tape-h1"  x="30" y="40">How you count a mistake</text>
  <text class="measuring-tape-sub" x="30" y="64">Two accounting rules.</text>
  <rect class="measuring-tape-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="measuring-tape-name" x="46" y="122">Proportional</text>
  <text class="measuring-tape-desc" x="46" y="142">Every unit counts once.</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r0" x="46" y="182">Ten small errors equal one error of ten</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r1" x="46" y="216">No error dominates</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r2" x="46" y="250">One disaster is one disaster</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r3" x="46" y="284">Settles on the typical case</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r4" x="46" y="318">This is absolute error</text>
  <rect class="measuring-tape-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="measuring-tape-name" x="526" y="122">Squared</text>
  <text class="measuring-tape-desc" x="526" y="142">Large errors count far more.</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r0" x="526" y="182">One error of ten equals a hundred small ones</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r1" x="526" y="216">The largest error dominates the total</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r2" x="526" y="250">One disaster outweighs everything</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r3" x="526" y="284">Settles on the average case</text>
  <text class="measuring-tape-desc measuring-tape-row measuring-tape-r4" x="526" y="318">This is squared error</text>
  <text class="measuring-tape-sub" x="30" y="372">Which accounting is right depends on whether one large failure is genuinely worse than many small ones, which is a business question rather than a statistical one.</text>
</svg>
