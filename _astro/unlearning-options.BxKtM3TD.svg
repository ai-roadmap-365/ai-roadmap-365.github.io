<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Only one is affordable.">
  <title>Three ways to forget</title>
  <style>
    .unlearning-options-bg   { fill: #f8fafc; }
    .unlearning-options-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unlearning-options-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unlearning-options-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unlearning-options-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unlearning-options-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unlearning-options-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unlearning-options-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unlearning-options-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unlearning-options-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unlearning-options-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unlearning-options-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unlearning-options-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .unlearning-options-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .unlearning-options-stage { opacity: 1; }

    .unlearning-options-s0 { animation-delay: 0.00s; }
    .unlearning-options-e0 { animation-delay: 0.00s; }
    .unlearning-options-s1 { animation-delay: 1.28s; }
    .unlearning-options-e1 { animation-delay: 1.28s; }
    .unlearning-options-s2 { animation-delay: 2.56s; }
    .unlearning-options-e2 { animation-delay: 2.56s; }
    .unlearning-options-s3 { animation-delay: 3.84s; }
    .unlearning-options-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .unlearning-options-conn  { animation: unlearning-options-trace 6.4s ease-in-out infinite; }
      .unlearning-options-stage { animation: unlearning-options-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes unlearning-options-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes unlearning-options-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .unlearning-options-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .unlearning-options-stage { animation: unlearning-options-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes unlearning-options-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="unlearning-options-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="unlearning-options-bg" width="980" height="322"/>
  <text class="unlearning-options-h1"  x="30" y="40">Three ways to forget</text>
  <text class="unlearning-options-sub" x="30" y="64">Only one is affordable.</text>
  <g class="unlearning-options-stage unlearning-options-s0">
    <rect class="unlearning-options-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="unlearning-options-step" x="44" y="142">01</text>
    <text class="unlearning-options-name" x="70" y="142">Exact retraining</text>
    <text class="unlearning-options-desc" x="44" y="166">From scratch, without the</text>
    <text class="unlearning-options-desc" x="44" y="182">record. The gold standard.</text>
    <text class="unlearning-options-edge" x="44" y="242">&gt;$500k</text>
  </g>
  <line class="unlearning-options-line unlearning-options-conn unlearning-options-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#unlearning-options-tip)"/>
  <g class="unlearning-options-stage unlearning-options-s1">
    <rect class="unlearning-options-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="unlearning-options-step" x="280" y="142">02</text>
    <text class="unlearning-options-name" x="306" y="142">SISA sharding</text>
    <text class="unlearning-options-desc" x="280" y="166">Train sub-models on isolated</text>
    <text class="unlearning-options-desc" x="280" y="182">shards; retrain only the</text>
    <text class="unlearning-options-desc" x="280" y="198">affected one.</text>
    <text class="unlearning-options-edge" x="280" y="242">1/S</text>
  </g>
  <line class="unlearning-options-line unlearning-options-conn unlearning-options-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#unlearning-options-tip)"/>
  <g class="unlearning-options-stage unlearning-options-s2">
    <rect class="unlearning-options-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="unlearning-options-step" x="516" y="142">03</text>
    <text class="unlearning-options-name" x="542" y="142">Targeted gradient ascent</text>
    <text class="unlearning-options-desc" x="516" y="166">Negative steps on the sample</text>
    <text class="unlearning-options-desc" x="516" y="182">loss, with a KL penalty to</text>
    <text class="unlearning-options-desc" x="516" y="198">retain the rest.</text>
    <text class="unlearning-options-edge" x="516" y="242">approximate</text>
  </g>
  <line class="unlearning-options-line unlearning-options-conn unlearning-options-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#unlearning-options-tip)"/>
  <g class="unlearning-options-stage unlearning-options-s3">
    <rect class="unlearning-options-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="unlearning-options-step" x="752" y="142">04</text>
    <text class="unlearning-options-name" x="778" y="142">Or never train on it</text>
    <text class="unlearning-options-desc" x="752" y="166">Pseudonymise first, and erasure</text>
    <text class="unlearning-options-desc" x="752" y="182">is deleting a key.</text>
    <text class="unlearning-options-edge" x="752" y="242">free</text>
  </g>
  <text class="unlearning-options-sub" x="30" y="304">The fourth row is the design decision that avoids the first three: a pipeline that never sees a raw identifier has no weights to unlearn from, and Article 17 becomes a key deletion.</text>
</svg>
