<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>The not-a-number value</title>
  <style>
    .nan-bg   { fill: #f8fafc; }
    .nan-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nan-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nan-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nan-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nan-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nan-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nan-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nan-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nan-stage { opacity: 1; }

    .nan-s0 { animation-delay: 0.00s; }
    .nan-e0 { animation-delay: 0.00s; }
    .nan-s1 { animation-delay: 1.28s; }
    .nan-e1 { animation-delay: 1.28s; }
    .nan-s2 { animation-delay: 2.56s; }
    .nan-e2 { animation-delay: 2.56s; }
    .nan-s3 { animation-delay: 3.84s; }
    .nan-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nan-conn  { animation: nan-trace 6.4s ease-in-out infinite; }
      .nan-stage { animation: nan-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nan-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nan-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nan-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nan-stage { animation: nan-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nan-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nan-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nan-bg" width="980" height="322"/>
  <text class="nan-h1"  x="30" y="40">The not-a-number value</text>
  <text class="nan-sub" x="30" y="64">Four properties.</text>
  <g class="nan-stage nan-s0">
    <rect class="nan-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nan-step" x="44" y="142">01</text>
    <text class="nan-name" x="70" y="142">Produced by undefined operations, and used for missing data</text>
    <text class="nan-desc" x="44" y="166">Zero divided by zero, and absent</text>
    <text class="nan-desc" x="44" y="182">values.</text>
  </g>
  <line class="nan-line nan-conn nan-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nan-tip)"/>
  <g class="nan-stage nan-s1">
    <rect class="nan-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nan-step" x="280" y="142">02</text>
    <text class="nan-name" x="306" y="142">It propagates through every arithmetic operation</text>
    <text class="nan-desc" x="280" y="166">One of them poisons a whole sum.</text>
  </g>
  <line class="nan-line nan-conn nan-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nan-tip)"/>
  <g class="nan-stage nan-s2">
    <rect class="nan-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nan-step" x="516" y="142">03</text>
    <text class="nan-name" x="542" y="142">And it is not equal to itself</text>
    <text class="nan-desc" x="516" y="166">Which is deliberate, and</text>
    <text class="nan-desc" x="516" y="182">surprises everyone once.</text>
  </g>
  <line class="nan-line nan-conn nan-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nan-tip)"/>
  <g class="nan-stage nan-s3">
    <rect class="nan-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nan-step" x="752" y="142">04</text>
    <text class="nan-name" x="778" y="142">So test for it with a dedicated function</text>
    <text class="nan-desc" x="752" y="166">Never with equality.</text>
  </g>
  <text class="nan-sub" x="30" y="304">Self-inequality is required by the floating-point standard rather than being a quirk, and it is why an equality test for missing values silently finds nothing.</text>
</svg>
