<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Cost Levers and What Each One Saves showing the measured effect of caching, trimming and tiering on the same workload, and the case where a cache hit saves almost nothing">
  <title>Cost Levers and What Each One Saves</title>
  <defs>
    <style>
      .d327b-bg { fill: #f8fafc; }
      .d327b-axis { stroke: #94a3b8; stroke-width: 2px; }
      .d327b-large { fill: #ef4444; }
      .d327b-small { fill: #3b82f6; }
      .d327b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d327b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d327b-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d327b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d327b-lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #475569; }
      .d327b-warn { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d327b-bg"/>
  <text x="40" y="40" class="d327b-title">Cost Levers and What Each One Saves</text>
  <text x="40" y="64" class="d327b-sub">Measured on the same six-request workload. Red is large-model spend, blue is small-model spend.</text>

  <line x1="150" y1="100" x2="150" y2="260" class="d327b-axis"/>
  <line x1="150" y1="260" x2="800" y2="260" class="d327b-axis"/>

  <rect x="190" y="110" width="420" height="34" class="d327b-large"/>
  <rect x="610" y="110" width="69" height="34" class="d327b-small"/>
  <text x="140" y="132" class="d327b-lbl" text-anchor="end">no cache</text>
  <text x="700" y="132" class="d327b-t">$0.0085</text>

  <rect x="190" y="160" width="420" height="34" class="d327b-large"/>
  <rect x="610" y="160" width="35" height="34" class="d327b-small"/>
  <text x="140" y="182" class="d327b-lbl" text-anchor="end">+ cache</text>
  <text x="700" y="182" class="d327b-t">$0.0079  (saved 7%)</text>

  <rect x="190" y="210" width="351" height="34" class="d327b-large"/>
  <rect x="541" y="210" width="29" height="34" class="d327b-small"/>
  <text x="140" y="232" class="d327b-lbl" text-anchor="end">+ trim</text>
  <text x="700" y="232" class="d327b-t">$0.0066  (saved 22%)</text>

  <text x="40" y="308" class="d327b-h">The lesson hiding in the second bar</text>
  <text x="40" y="332" class="d327b-warn">The cache hit 2 of 6 requests — a 33% hit rate — and saved 7% of the cost.</text>
  <text x="40" y="354" class="d327b-t">The repeated question routed to the SMALL model, and small-model calls were never where the money was. The large</text>
  <text x="40" y="374" class="d327b-t">model accounts for 86% of spend from 2 of 6 requests.</text>
  <text x="40" y="402" class="d327b-t">Hit rate is not savings. A cache that hits your cheapest traffic saves nothing, and a dashboard showing hit rate reports</text>
  <text x="40" y="422" class="d327b-t">it as a success. Attribute spend by model first, or you optimise the visible thing instead of the expensive one.</text>
</svg>
