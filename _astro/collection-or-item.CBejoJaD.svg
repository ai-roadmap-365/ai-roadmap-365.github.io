<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The target tells you as much as the method does.">
  <title>Which verb goes where</title>
  <style>
    .collection-or-item-bg   { fill: #f8fafc; }
    .collection-or-item-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-or-item-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-or-item-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-or-item-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-or-item-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-or-item-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .collection-or-item-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .collection-or-item-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .collection-or-item-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .collection-or-item-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .collection-or-item-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .collection-or-item-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .collection-or-item-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .collection-or-item-stage { opacity: 1; }

    .collection-or-item-s0 { animation-delay: 0.00s; }
    .collection-or-item-e0 { animation-delay: 0.00s; }
    .collection-or-item-s1 { animation-delay: 1.28s; }
    .collection-or-item-e1 { animation-delay: 1.28s; }
    .collection-or-item-s2 { animation-delay: 2.56s; }
    .collection-or-item-e2 { animation-delay: 2.56s; }
    .collection-or-item-s3 { animation-delay: 3.84s; }
    .collection-or-item-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .collection-or-item-conn  { animation: collection-or-item-trace 6.4s ease-in-out infinite; }
      .collection-or-item-stage { animation: collection-or-item-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes collection-or-item-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes collection-or-item-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .collection-or-item-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .collection-or-item-stage { animation: collection-or-item-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes collection-or-item-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="collection-or-item-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="collection-or-item-bg" width="980" height="322"/>
  <text class="collection-or-item-h1"  x="30" y="40">Which verb goes where</text>
  <text class="collection-or-item-sub" x="30" y="64">The target tells you as much as the method does.</text>
  <g class="collection-or-item-stage collection-or-item-s0">
    <rect class="collection-or-item-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="collection-or-item-step" x="44" y="142">01</text>
    <text class="collection-or-item-name" x="70" y="142">POST to the collection</text>
    <text class="collection-or-item-desc" x="44" y="166">/users — you do not know the id</text>
    <text class="collection-or-item-desc" x="44" y="182">yet, so you cannot name the</text>
    <text class="collection-or-item-desc" x="44" y="198">item.</text>
    <text class="collection-or-item-edge" x="44" y="242">creates</text>
  </g>
  <line class="collection-or-item-line collection-or-item-conn collection-or-item-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#collection-or-item-tip)"/>
  <g class="collection-or-item-stage collection-or-item-s1">
    <rect class="collection-or-item-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="collection-or-item-step" x="280" y="142">02</text>
    <text class="collection-or-item-name" x="306" y="142">The server assigns the id</text>
    <text class="collection-or-item-desc" x="280" y="166">And returns 201 with the new</text>
    <text class="collection-or-item-desc" x="280" y="182">resource and its address.</text>
    <text class="collection-or-item-edge" x="280" y="242">201</text>
  </g>
  <line class="collection-or-item-line collection-or-item-conn collection-or-item-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#collection-or-item-tip)"/>
  <g class="collection-or-item-stage collection-or-item-s2">
    <rect class="collection-or-item-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="collection-or-item-step" x="516" y="142">03</text>
    <text class="collection-or-item-name" x="542" y="142">Everything else targets the item</text>
    <text class="collection-or-item-desc" x="516" y="166">/users/1 — GET, PUT, PATCH,</text>
    <text class="collection-or-item-desc" x="516" y="182">DELETE all name something that</text>
    <text class="collection-or-item-desc" x="516" y="198">exists.</text>
    <text class="collection-or-item-edge" x="516" y="242">/users/1</text>
  </g>
  <line class="collection-or-item-line collection-or-item-conn collection-or-item-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#collection-or-item-tip)"/>
  <g class="collection-or-item-stage collection-or-item-s3">
    <rect class="collection-or-item-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="collection-or-item-step" x="752" y="142">04</text>
    <text class="collection-or-item-name" x="778" y="142">GET works on both</text>
    <text class="collection-or-item-desc" x="752" y="166">The collection gives you a list;</text>
    <text class="collection-or-item-desc" x="752" y="182">the item gives you one.</text>
  </g>
  <text class="collection-or-item-sub" x="30" y="304">POSTing to an item is the tell that something has gone wrong in the design: you are asking to create a thing inside a thing that is not a container.</text>
</svg>
