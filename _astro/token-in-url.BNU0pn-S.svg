<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="URLs are written down in more places than you think.">
  <title>Why a token never belongs in a URL</title>
  <style>
    .token-in-url-bg   { fill: #f8fafc; }
    .token-in-url-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-in-url-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-in-url-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-in-url-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-in-url-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-in-url-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .token-in-url-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .token-in-url-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .token-in-url-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .token-in-url-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .token-in-url-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .token-in-url-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .token-in-url-row { opacity: 1; }
    .token-in-url-r0 { animation-delay: 0.00s; }
    .token-in-url-r1 { animation-delay: 0.45s; }
    .token-in-url-r2 { animation-delay: 0.90s; }
    .token-in-url-r3 { animation-delay: 1.35s; }
    .token-in-url-r4 { animation-delay: 1.80s; }
    .token-in-url-row { animation: token-in-url-reveal 7.3s ease-in-out infinite; }
    @keyframes token-in-url-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="token-in-url-bg" width="980" height="390"/>
  <text class="token-in-url-h1"  x="30" y="40">Why a token never belongs in a URL</text>
  <text class="token-in-url-sub" x="30" y="64">URLs are written down in more places than you think.</text>
  <rect class="token-in-url-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="token-in-url-name" x="46" y="122">In the URL</text>
  <text class="token-in-url-desc" x="46" y="142">?api_key=sk-secret</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r0" x="46" y="182">Logged by every proxy on the path</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r1" x="46" y="216">Saved in browser history</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r2" x="46" y="250">Sent onward in the Referer header</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r3" x="46" y="284">Appears in server access logs</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r4" x="46" y="318">Pasted into chats when sharing a link</text>
  <rect class="token-in-url-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="token-in-url-name" x="526" y="122">In a header</text>
  <text class="token-in-url-desc" x="526" y="142">Authorization: Bearer sk-secret</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r0" x="526" y="182">Not part of the address</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r1" x="526" y="216">Not logged by default</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r2" x="526" y="250">Never forwarded in Referer</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r3" x="526" y="284">Not stored in history</text>
  <text class="token-in-url-desc token-in-url-row token-in-url-r4" x="526" y="318">Encrypted with everything else under TLS</text>
  <text class="token-in-url-sub" x="30" y="372">An API that accepts a key in the query string is not thereby a safe place to put one. The protocol permits it; your logs will remember it.</text>
</svg>
