<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things scheduling is not</title>
  <style>
    .schedule-not-bg   { fill: #f8fafc; }
    .schedule-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedule-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedule-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedule-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedule-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedule-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-not-row { opacity: 1; }
    .schedule-not-r0 { animation-delay: 0.00s; }
    .schedule-not-r1 { animation-delay: 0.45s; }
    .schedule-not-r2 { animation-delay: 0.90s; }
    .schedule-not-r3 { animation-delay: 1.35s; }
    .schedule-not-r4 { animation-delay: 1.80s; }
    .schedule-not-row { animation: schedule-not-reveal 7.3s ease-in-out infinite; }
    @keyframes schedule-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="schedule-not-bg" width="980" height="390"/>
  <text class="schedule-not-h1"  x="30" y="40">Four things scheduling is not</text>
  <text class="schedule-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="schedule-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="schedule-not-name" x="46" y="122">The misconception</text>
  <text class="schedule-not-desc" x="46" y="142">Commonly held.</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r0" x="46" y="182">The scheduler prevents overlap</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r1" x="46" y="216">A job that errors will be noticed</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r2" x="46" y="250">Retrying is always safe</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r3" x="46" y="284">The environment matches your shell</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r4" x="46" y="318">A successful exit means it worked</text>
  <rect class="schedule-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="schedule-not-name" x="526" y="122">What is true</text>
  <text class="schedule-not-desc" x="526" y="142">Actually.</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r0" x="526" y="182">It does not; you need a lock</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r1" x="526" y="216">Only if something is watching</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r2" x="526" y="250">Only if the job is idempotent</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r3" x="526" y="284">Schedulers give a minimal environment</text>
  <text class="schedule-not-desc schedule-not-row schedule-not-r4" x="526" y="318">Check the output, not just the code</text>
  <text class="schedule-not-sub" x="30" y="372">The minimal environment is the classic first failure: a job that works in your shell and fails under the scheduler is almost always a missing path or variable.</text>
</svg>
