<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One disk is one disk, however good the history on it.">
  <title>Committed is not backed up</title>
  <style>
    .unpushed-is-unbacked-bg   { fill: #f8fafc; }
    .unpushed-is-unbacked-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpushed-is-unbacked-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpushed-is-unbacked-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpushed-is-unbacked-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpushed-is-unbacked-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpushed-is-unbacked-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unpushed-is-unbacked-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unpushed-is-unbacked-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unpushed-is-unbacked-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unpushed-is-unbacked-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unpushed-is-unbacked-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unpushed-is-unbacked-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unpushed-is-unbacked-row { opacity: 1; }
    .unpushed-is-unbacked-r0 { animation-delay: 0.00s; }
    .unpushed-is-unbacked-r1 { animation-delay: 0.45s; }
    .unpushed-is-unbacked-r2 { animation-delay: 0.90s; }
    .unpushed-is-unbacked-r3 { animation-delay: 1.35s; }
    .unpushed-is-unbacked-r4 { animation-delay: 1.80s; }
    .unpushed-is-unbacked-row { animation: unpushed-is-unbacked-reveal 7.3s ease-in-out infinite; }
    @keyframes unpushed-is-unbacked-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="unpushed-is-unbacked-bg" width="980" height="390"/>
  <text class="unpushed-is-unbacked-h1"  x="30" y="40">Committed is not backed up</text>
  <text class="unpushed-is-unbacked-sub" x="30" y="64">One disk is one disk, however good the history on it.</text>
  <rect class="unpushed-is-unbacked-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="unpushed-is-unbacked-name" x="46" y="122">Committed, not pushed</text>
  <text class="unpushed-is-unbacked-desc" x="46" y="142">Exists in exactly one place.</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r0" x="46" y="182">Full history — on one disk</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r1" x="46" y="216">Protected against your mistakes</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r2" x="46" y="250">Not protected against the disk</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r3" x="46" y="284">A laptop lost is the work lost</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r4" x="46" y="318">Nobody else can see it either</text>
  <rect class="unpushed-is-unbacked-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="unpushed-is-unbacked-name" x="526" y="122">Pushed</text>
  <text class="unpushed-is-unbacked-desc" x="526" y="142">Exists in at least two.</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r0" x="526" y="182">Full history in both places</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r1" x="526" y="216">Protected against your mistakes</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r2" x="526" y="250">And against either machine failing</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r3" x="526" y="284">A laptop lost is an inconvenience</text>
  <text class="unpushed-is-unbacked-desc unpushed-is-unbacked-row unpushed-is-unbacked-r4" x="526" y="318">And colleagues can build on it</text>
  <text class="unpushed-is-unbacked-sub" x="30" y="372">Push at the end of every working session. It costs seconds, and it is the entire difference between version control and a backup.</text>
</svg>
