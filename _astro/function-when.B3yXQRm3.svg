<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to extract a function</title>
  <style>
    .function-when-bg   { fill: #f8fafc; }
    .function-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .function-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .function-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .function-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .function-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .function-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .function-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .function-when-row { opacity: 1; }
    .function-when-r0 { animation-delay: 0.00s; }
    .function-when-r1 { animation-delay: 0.45s; }
    .function-when-r2 { animation-delay: 0.90s; }
    .function-when-r3 { animation-delay: 1.35s; }
    .function-when-r4 { animation-delay: 1.80s; }
    .function-when-row { animation: function-when-reveal 7.3s ease-in-out infinite; }
    @keyframes function-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="function-when-bg" width="980" height="390"/>
  <text class="function-when-h1"  x="30" y="40">When to extract a function</text>
  <text class="function-when-sub" x="30" y="64">And when not to.</text>
  <rect class="function-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="function-when-name" x="46" y="122">Extract</text>
  <text class="function-when-desc" x="46" y="142">Four signals.</text>
  <text class="function-when-desc function-when-row function-when-r0" x="46" y="182">The same logic appears twice</text>
  <text class="function-when-desc function-when-row function-when-r1" x="46" y="216">A block needs a comment to explain it</text>
  <text class="function-when-desc function-when-row function-when-r2" x="46" y="250">A block can be tested independently</text>
  <text class="function-when-desc function-when-row function-when-r3" x="46" y="284">The function is doing two things</text>
  <text class="function-when-desc function-when-row function-when-r4" x="46" y="318">A name would make the caller clearer</text>
  <rect class="function-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="function-when-name" x="526" y="122">Leave it</text>
  <text class="function-when-desc" x="526" y="142">Also four.</text>
  <text class="function-when-desc function-when-row function-when-r0" x="526" y="182">A single obvious line</text>
  <text class="function-when-desc function-when-row function-when-r1" x="526" y="216">Extraction needs more parameters than lines</text>
  <text class="function-when-desc function-when-row function-when-r2" x="526" y="250">It would only ever have one caller and one line</text>
  <text class="function-when-desc function-when-row function-when-r3" x="526" y="284">Where the name would repeat the code</text>
  <text class="function-when-desc function-when-row function-when-r4" x="526" y="318">Where indirection would hide the logic</text>
  <text class="function-when-sub" x="30" y="372">The second row of each column is the balance: extraction that needs six parameters to move three lines has made the code harder to follow, not easier.</text>
</svg>
