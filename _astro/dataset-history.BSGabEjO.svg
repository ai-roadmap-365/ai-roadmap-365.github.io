<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward synthesis.">
  <title>Four steps in fine-tuning data</title>
  <style>
    .dataset-history-bg   { fill: #f8fafc; }
    .dataset-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataset-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dataset-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dataset-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dataset-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dataset-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dataset-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dataset-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dataset-history-stage { opacity: 1; }

    .dataset-history-s0 { animation-delay: 0.00s; }
    .dataset-history-e0 { animation-delay: 0.00s; }
    .dataset-history-s1 { animation-delay: 1.28s; }
    .dataset-history-e1 { animation-delay: 1.28s; }
    .dataset-history-s2 { animation-delay: 2.56s; }
    .dataset-history-e2 { animation-delay: 2.56s; }
    .dataset-history-s3 { animation-delay: 3.84s; }
    .dataset-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dataset-history-conn  { animation: dataset-history-trace 6.4s ease-in-out infinite; }
      .dataset-history-stage { animation: dataset-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dataset-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dataset-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dataset-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dataset-history-stage { animation: dataset-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dataset-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dataset-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dataset-history-bg" width="980" height="322"/>
  <text class="dataset-history-h1"  x="30" y="40">Four steps in fine-tuning data</text>
  <text class="dataset-history-sub" x="30" y="64">Toward synthesis.</text>
  <g class="dataset-history-stage dataset-history-s0">
    <rect class="dataset-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-history-step" x="44" y="142">01</text>
    <text class="dataset-history-name" x="70" y="142">Hand-written by experts</text>
    <text class="dataset-history-desc" x="44" y="166">High quality, and very</text>
    <text class="dataset-history-desc" x="44" y="182">expensive.</text>
  </g>
  <line class="dataset-history-line dataset-history-conn dataset-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dataset-history-tip)"/>
  <g class="dataset-history-stage dataset-history-s1">
    <rect class="dataset-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-history-step" x="280" y="142">02</text>
    <text class="dataset-history-name" x="306" y="142">Crowdsourced at scale</text>
    <text class="dataset-history-desc" x="280" y="166">Cheaper, and noisier.</text>
  </g>
  <line class="dataset-history-line dataset-history-conn dataset-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dataset-history-tip)"/>
  <g class="dataset-history-stage dataset-history-s2">
    <rect class="dataset-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-history-step" x="516" y="142">03</text>
    <text class="dataset-history-name" x="542" y="142">Generated by a stronger model</text>
    <text class="dataset-history-desc" x="516" y="166">Cheap, and only as good as the</text>
    <text class="dataset-history-desc" x="516" y="182">generator.</text>
  </g>
  <line class="dataset-history-line dataset-history-conn dataset-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dataset-history-tip)"/>
  <g class="dataset-history-stage dataset-history-s3">
    <rect class="dataset-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-history-step" x="752" y="142">04</text>
    <text class="dataset-history-name" x="778" y="142">Then generated and verified</text>
    <text class="dataset-history-desc" x="752" y="166">Which is where quality returned.</text>
  </g>
  <text class="dataset-history-sub" x="30" y="304">The verification step is what closed the loop: unverified model-generated data compounds the generator's errors into the student, which the rejection step prevents.</text>
</svg>
