<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same result, different failure modes.">
  <title>Writing schemas, or deriving them</title>
  <style>
    .handwritten-or-derived-bg   { fill: #f8fafc; }
    .handwritten-or-derived-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handwritten-or-derived-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handwritten-or-derived-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handwritten-or-derived-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handwritten-or-derived-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handwritten-or-derived-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .handwritten-or-derived-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .handwritten-or-derived-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .handwritten-or-derived-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .handwritten-or-derived-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .handwritten-or-derived-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .handwritten-or-derived-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .handwritten-or-derived-row { opacity: 1; }
    .handwritten-or-derived-r0 { animation-delay: 0.00s; }
    .handwritten-or-derived-r1 { animation-delay: 0.45s; }
    .handwritten-or-derived-r2 { animation-delay: 0.90s; }
    .handwritten-or-derived-r3 { animation-delay: 1.35s; }
    .handwritten-or-derived-r4 { animation-delay: 1.80s; }
    .handwritten-or-derived-row { animation: handwritten-or-derived-reveal 7.3s ease-in-out infinite; }
    @keyframes handwritten-or-derived-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="handwritten-or-derived-bg" width="980" height="390"/>
  <text class="handwritten-or-derived-h1"  x="30" y="40">Writing schemas, or deriving them</text>
  <text class="handwritten-or-derived-sub" x="30" y="64">Same result, different failure modes.</text>
  <rect class="handwritten-or-derived-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="handwritten-or-derived-name" x="46" y="122">Hand-written</text>
  <text class="handwritten-or-derived-desc" x="46" y="142">A second source of truth.</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r0" x="46" y="182">Nested property dictionaries, by hand</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r1" x="46" y="216">Drifts from the function it describes</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r2" x="46" y="250">A renamed parameter breaks silently</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r3" x="46" y="284">Tedious enough to be skipped</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r4" x="46" y="318">Two things to review in a diff</text>
  <rect class="handwritten-or-derived-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="handwritten-or-derived-name" x="526" y="122">Derived</text>
  <text class="handwritten-or-derived-desc" x="526" y="142">One source of truth.</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r0" x="526" y="182">Signature and docstring are the schema</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r1" x="526" y="216">Cannot drift — it is the same definition</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r2" x="526" y="250">A rename updates both at once</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r3" x="526" y="284">Under ten lines per tool</text>
  <text class="handwritten-or-derived-desc handwritten-or-derived-row handwritten-or-derived-r4" x="526" y="318">One thing to review</text>
  <text class="handwritten-or-derived-sub" x="30" y="372">This is the FastAPI lesson transplanted: annotations serving both runtime validation and generated documentation was the change that made API schemas reliable, and the same argument holds for tool schemas.</text>
</svg>
