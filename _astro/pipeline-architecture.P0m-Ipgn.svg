<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img"
     aria-labelledby="d098a-title d098a-desc">
  <title id="d098a-title">The five stages of the pipeline, the promise each one guarantees, and the day it comes from</title>
  <desc id="d098a-desc">Configuration enters from the left through four ordered layers. Five stages run left to right: Ingest, Validate, Store, Report and Observe, each labelled with the promise it guarantees and the earlier day that taught it. Beneath them sits the store, a SQLite database reached through SQLAlchemy, holding a readings table with a unique idempotence key and a runs table. Below that, a structured log lane collects one JSON line per stage, all carrying the same run id, and ends in the exit code the scheduler reads.</desc>

  <style>
    .d098a-bg    { fill: #f8fafc; }
    .d098a-h1    { font: 600 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d098a-h2    { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d4ed8; }
    .d098a-lead  { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d098a-t     { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d098a-mono  { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a202c; }
    .d098a-day   { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b45309; }
    .d098a-note  { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    .d098a-stage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d098a-panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d098a-store { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .d098a-logs  { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .d098a-exit  { fill: #ffffff; stroke: #b45309; stroke-width: 2; }
    .d098a-wire  { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d098a-wireg { stroke: #15803d; stroke-width: 2.5; fill: none; }
    .d098a-wirea { stroke: #b45309; stroke-width: 2; fill: none; }
    .d098a-rule  { stroke: #cbd5e1; stroke-width: 1.5; }
  </style>

  <rect class="d098a-bg" x="0" y="0" width="1400" height="860"/>

  <defs>
    <marker id="d098a-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="d098a-arrowg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="d098a-arrowa" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text class="d098a-h1" x="24" y="40">A pipeline is a set of promises about what happens when something goes wrong</text>
  <text class="d098a-note" x="24" y="66">Five stages, five promises. The orange label on each stage is the earlier day that taught it.</text>

  <!-- Configuration panel -->
  <rect class="d098a-panel" x="24" y="110" width="192" height="240" rx="8"/>
  <text class="d098a-h2" x="40" y="138">CONFIGURATION</text>
  <text class="d098a-day" x="40" y="160">Day 97</text>
  <text class="d098a-t" x="40" y="186">Four layers, lowest first:</text>
  <text class="d098a-mono" x="40" y="210">1. defaults</text>
  <text class="d098a-mono" x="40" y="232">2. TOML file</text>
  <text class="d098a-mono" x="40" y="254">3. environment</text>
  <text class="d098a-mono" x="40" y="276">4. command line</text>
  <text class="d098a-note" x="40" y="304">Each value remembers</text>
  <text class="d098a-note" x="40" y="322">which layer won it, and</text>
  <text class="d098a-note" x="40" y="340">secrets print redacted.</text>
  <path class="d098a-wire" d="M 216 230 L 240 230" marker-end="url(#d098a-arrow)"/>

  <!-- Stage 1 -->
  <rect class="d098a-stage" x="240" y="110" width="215" height="240" rx="8"/>
  <text class="d098a-h2" x="256" y="138">1. INGEST</text>
  <text class="d098a-day" x="256" y="160">Days 78, 84</text>
  <line class="d098a-rule" x1="256" y1="172" x2="439" y2="172"/>
  <text class="d098a-lead" x="256" y="196">The promise</text>
  <text class="d098a-t" x="256" y="218">Every fetch has a deadline.</text>
  <text class="d098a-t" x="256" y="238">Only failures worth retrying</text>
  <text class="d098a-t" x="256" y="258">are retried. A source that</text>
  <text class="d098a-t" x="256" y="278">never answers does not take</text>
  <text class="d098a-t" x="256" y="298">the run down with it.</text>
  <text class="d098a-note" x="256" y="326">urllib.request, timeout,</text>
  <text class="d098a-note" x="256" y="344">exponential backoff</text>
  <path class="d098a-wire" d="M 455 230 L 473 230" marker-end="url(#d098a-arrow)"/>

  <!-- Stage 2 -->
  <rect class="d098a-stage" x="473" y="110" width="215" height="240" rx="8"/>
  <text class="d098a-h2" x="489" y="138">2. VALIDATE</text>
  <text class="d098a-day" x="489" y="160">Day 94</text>
  <line class="d098a-rule" x1="489" y1="172" x2="672" y2="172"/>
  <text class="d098a-lead" x="489" y="196">The promise</text>
  <text class="d098a-t" x="489" y="218">Every bad record is</text>
  <text class="d098a-t" x="489" y="238">collected, counted and</text>
  <text class="d098a-t" x="489" y="258">explained well enough to</text>
  <text class="d098a-t" x="489" y="278">fix the source — never the</text>
  <text class="d098a-t" x="489" y="298">first one only.</text>
  <text class="d098a-note" x="489" y="326">pydantic, extra=forbid,</text>
  <text class="d098a-note" x="489" y="344">ranges, aware timestamps</text>
  <path class="d098a-wire" d="M 688 230 L 706 230" marker-end="url(#d098a-arrow)"/>

  <!-- Stage 3 -->
  <rect class="d098a-stage" x="706" y="110" width="215" height="240" rx="8"/>
  <text class="d098a-h2" x="722" y="138">3. STORE</text>
  <text class="d098a-day" x="722" y="160">Days 88, 91, 93</text>
  <line class="d098a-rule" x1="722" y1="172" x2="905" y2="172"/>
  <text class="d098a-lead" x="722" y="196">The promise</text>
  <text class="d098a-t" x="722" y="218">Running the pipeline twice</text>
  <text class="d098a-t" x="722" y="238">stores the data once —</text>
  <text class="d098a-t" x="722" y="258">enforced by the schema,</text>
  <text class="d098a-t" x="722" y="278">counted honestly by the</text>
  <text class="d098a-t" x="722" y="298">application.</text>
  <text class="d098a-note" x="722" y="326">SQLAlchemy 2.0, UNIQUE,</text>
  <text class="d098a-note" x="722" y="344">ON CONFLICT DO NOTHING</text>
  <path class="d098a-wire" d="M 921 230 L 939 230" marker-end="url(#d098a-arrow)"/>

  <!-- Stage 4 -->
  <rect class="d098a-stage" x="939" y="110" width="215" height="240" rx="8"/>
  <text class="d098a-h2" x="955" y="138">4. REPORT</text>
  <text class="d098a-day" x="955" y="160">Days 86, 91, 95</text>
  <line class="d098a-rule" x1="955" y1="172" x2="1138" y2="172"/>
  <text class="d098a-lead" x="955" y="196">The promise</text>
  <text class="d098a-t" x="955" y="218">The report instant is a</text>
  <text class="d098a-t" x="955" y="238">parameter, not a clock</text>
  <text class="d098a-t" x="955" y="258">reading — so the answer is</text>
  <text class="d098a-t" x="955" y="278">testable, backfillable and</text>
  <text class="d098a-t" x="955" y="298">the same tomorrow.</text>
  <text class="d098a-note" x="955" y="326">select() over a window,</text>
  <text class="d098a-note" x="955" y="344">ISO 8601 in UTC</text>
  <path class="d098a-wire" d="M 1154 230 L 1172 230" marker-end="url(#d098a-arrow)"/>

  <!-- Stage 5 -->
  <rect class="d098a-stage" x="1172" y="110" width="215" height="240" rx="8"/>
  <text class="d098a-h2" x="1188" y="138">5. OBSERVE</text>
  <text class="d098a-day" x="1188" y="160">Days 81, 97</text>
  <line class="d098a-rule" x1="1188" y1="172" x2="1371" y2="172"/>
  <text class="d098a-lead" x="1188" y="196">The promise</text>
  <text class="d098a-t" x="1188" y="218">One structured line per</text>
  <text class="d098a-t" x="1188" y="238">stage, one run id through</text>
  <text class="d098a-t" x="1188" y="258">all of them, and an exit</text>
  <text class="d098a-t" x="1188" y="278">code a scheduler can act</text>
  <text class="d098a-t" x="1188" y="298">on without reading English.</text>
  <text class="d098a-note" x="1188" y="326">JSON per line, secrets</text>
  <text class="d098a-note" x="1188" y="344">redacted in the logger</text>

  <!-- The store beneath -->
  <rect class="d098a-store" x="240" y="420" width="1147" height="176" rx="8"/>
  <text class="d098a-h2" x="256" y="448">THE STORE — SQLite, reached through SQLAlchemy</text>
  <text class="d098a-mono" x="256" y="480">readings(id, station_id, reading_id, observed_at, temperature_dc, humidity_pct, ingested_by_run)</text>
  <text class="d098a-lead" x="256" y="506">UNIQUE (station_id, reading_id)   &#8592; the idempotence key: this is what makes a rerun safe</text>
  <text class="d098a-t" x="256" y="530">CHECK humidity_pct BETWEEN 0 AND 100     CHECK length(observed_at) = 20     INDEX on observed_at</text>
  <text class="d098a-mono" x="256" y="558">runs(run_id, started_at, status, fetched, accepted, rejected, inserted, duplicate)</text>
  <text class="d098a-note" x="256" y="582">Every row names the run that wrote it, so &#8220;undo run abc123&#8221; is one DELETE rather than a guess.</text>

  <path class="d098a-wireg" d="M 813 350 L 813 420" marker-end="url(#d098a-arrowg)"/>
  <text class="d098a-note" x="822" y="392">writes only what is new</text>
  <path class="d098a-wireg" d="M 1046 420 L 1046 350" marker-end="url(#d098a-arrowg)"/>
  <text class="d098a-note" x="1055" y="392">reads the window</text>

  <!-- The log lane -->
  <rect class="d098a-logs" x="240" y="656" width="900" height="180" rx="8"/>
  <text class="d098a-h2" x="256" y="684">STRUCTURED LOG &#8594; stderr, one JSON object per line</text>
  <text class="d098a-mono" x="256" y="712">{&quot;ts&quot;: &quot;...&quot;, &quot;level&quot;: &quot;info&quot;, &quot;run_id&quot;: &quot;run-cli000001&quot;, &quot;event&quot;: &quot;stage.ingest&quot;, ...}</text>
  <text class="d098a-t" x="256" y="740">stage.ingest &#183; stage.validate &#183; stage.store &#183; stage.report &#183; stage.observe</text>
  <text class="d098a-t" x="256" y="764">plus run.start and run.end, and a warning line for every rejected record</text>
  <text class="d098a-note" x="256" y="792">The report goes to stdout; the log goes to stderr. They are two different audiences.</text>
  <text class="d098a-note" x="256" y="816">A secret that an upstream echoes back is redacted here, once, where nobody can forget it.</text>

  <path class="d098a-wirea" d="M 347 350 L 347 656" marker-end="url(#d098a-arrowa)"/>
  <path class="d098a-wirea" d="M 580 350 L 580 656" marker-end="url(#d098a-arrowa)"/>
  <path class="d098a-wirea" d="M 813 596 L 813 656" marker-end="url(#d098a-arrowa)"/>
  <path class="d098a-wirea" d="M 1046 596 L 1046 656" marker-end="url(#d098a-arrowa)"/>
  <path class="d098a-wirea" d="M 1279 350 L 1279 726 L 1200 726" marker-end="url(#d098a-arrowa)"/>

  <!-- Exit code -->
  <rect class="d098a-exit" x="1172" y="656" width="215" height="180" rx="8"/>
  <text class="d098a-h2" x="1188" y="684">EXIT CODE</text>
  <text class="d098a-mono" x="1188" y="714">0  success</text>
  <text class="d098a-mono" x="1188" y="740">3  partial success</text>
  <text class="d098a-mono" x="1188" y="766">1  failure</text>
  <text class="d098a-note" x="1188" y="794">The only sentence the</text>
  <text class="d098a-note" x="1188" y="812">scheduler can read.</text>
</svg>
