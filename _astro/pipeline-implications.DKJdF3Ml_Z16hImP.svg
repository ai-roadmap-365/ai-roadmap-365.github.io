<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are burdens.">
  <title>Four consequences of owning the pipeline</title>
  <style>
    .pipeline-implications-bg   { fill: #f8fafc; }
    .pipeline-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-implications-stage { opacity: 1; }

    .pipeline-implications-s0 { animation-delay: 0.00s; }
    .pipeline-implications-e0 { animation-delay: 0.00s; }
    .pipeline-implications-s1 { animation-delay: 1.28s; }
    .pipeline-implications-e1 { animation-delay: 1.28s; }
    .pipeline-implications-s2 { animation-delay: 2.56s; }
    .pipeline-implications-e2 { animation-delay: 2.56s; }
    .pipeline-implications-s3 { animation-delay: 3.84s; }
    .pipeline-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-implications-conn  { animation: pipeline-implications-trace 6.4s ease-in-out infinite; }
      .pipeline-implications-stage { animation: pipeline-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pipeline-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-implications-stage { animation: pipeline-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-implications-bg" width="980" height="322"/>
  <text class="pipeline-implications-h1"  x="30" y="40">Four consequences of owning the pipeline</text>
  <text class="pipeline-implications-sub" x="30" y="64">Two are burdens.</text>
  <g class="pipeline-implications-stage pipeline-implications-s0">
    <rect class="pipeline-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-implications-step" x="44" y="142">01</text>
    <text class="pipeline-implications-name" x="70" y="142">Marginal cost falls to hardware</text>
    <text class="pipeline-implications-desc" x="44" y="166">No per-token billing at any</text>
    <text class="pipeline-implications-desc" x="44" y="182">volume.</text>
  </g>
  <line class="pipeline-implications-line pipeline-implications-conn pipeline-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pipeline-implications-tip)"/>
  <g class="pipeline-implications-stage pipeline-implications-s1">
    <rect class="pipeline-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-implications-step" x="280" y="142">02</text>
    <text class="pipeline-implications-name" x="306" y="142">And nothing leaves your infrastructure</text>
    <text class="pipeline-implications-desc" x="280" y="166">Which settles most compliance</text>
    <text class="pipeline-implications-desc" x="280" y="182">questions.</text>
  </g>
  <line class="pipeline-implications-line pipeline-implications-conn pipeline-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pipeline-implications-tip)"/>
  <g class="pipeline-implications-stage pipeline-implications-s2">
    <rect class="pipeline-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-implications-step" x="516" y="142">03</text>
    <text class="pipeline-implications-name" x="542" y="142">But you now maintain a trained artefact</text>
    <text class="pipeline-implications-desc" x="516" y="166">That decays as the task drifts.</text>
  </g>
  <line class="pipeline-implications-line pipeline-implications-conn pipeline-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pipeline-implications-tip)"/>
  <g class="pipeline-implications-stage pipeline-implications-s3">
    <rect class="pipeline-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-implications-step" x="752" y="142">04</text>
    <text class="pipeline-implications-name" x="778" y="142">With a capability ceiling below the frontier</text>
    <text class="pipeline-implications-desc" x="752" y="166">On anything outside the</text>
    <text class="pipeline-implications-desc" x="752" y="182">fine-tuned task.</text>
  </g>
  <text class="pipeline-implications-sub" x="30" y="304">Model decay is the ongoing cost that is easiest to underestimate: a fine-tune is not a deliverable but a thing that needs periodic re-measurement and retraining.</text>
</svg>
