<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Backward, to the cause.">
  <title>An orchestra tracing a sour chord</title>
  <style>
    .orchestra-bg   { fill: #f8fafc; }
    .orchestra-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orchestra-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .orchestra-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .orchestra-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .orchestra-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .orchestra-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .orchestra-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orchestra-row { opacity: 1; }
    .orchestra-r0 { animation-delay: 0.00s; }
    .orchestra-r1 { animation-delay: 0.45s; }
    .orchestra-r2 { animation-delay: 0.90s; }
    .orchestra-r3 { animation-delay: 1.35s; }
    .orchestra-r4 { animation-delay: 1.80s; }
    .orchestra-row { animation: orchestra-reveal 7.3s ease-in-out infinite; }
    @keyframes orchestra-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="orchestra-bg" width="980" height="390"/>
  <text class="orchestra-h1"  x="30" y="40">An orchestra tracing a sour chord</text>
  <text class="orchestra-sub" x="30" y="64">Backward, to the cause.</text>
  <rect class="orchestra-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="orchestra-name" x="46" y="122">Forward</text>
  <text class="orchestra-desc" x="46" y="142">The performance.</text>
  <text class="orchestra-desc orchestra-row orchestra-r0" x="46" y="182">Strings play their chords</text>
  <text class="orchestra-desc orchestra-row orchestra-r1" x="46" y="216">Woodwinds add harmony</text>
  <text class="orchestra-desc orchestra-row orchestra-r2" x="46" y="250">Brass swells</text>
  <text class="orchestra-desc orchestra-row orchestra-r3" x="46" y="284">The cymbal crashes</text>
  <text class="orchestra-desc orchestra-row orchestra-r4" x="46" y="318">The audience hears one sound</text>
  <rect class="orchestra-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="orchestra-name" x="526" y="122">Backward</text>
  <text class="orchestra-desc" x="526" y="142">Attributing the error.</text>
  <text class="orchestra-desc orchestra-row orchestra-r0" x="526" y="182">The chord was sour</text>
  <text class="orchestra-desc orchestra-row orchestra-r1" x="526" y="216">Because the brass played a flat</text>
  <text class="orchestra-desc orchestra-row orchestra-r2" x="526" y="250">Because the woodwinds came in early</text>
  <text class="orchestra-desc orchestra-row orchestra-r3" x="526" y="284">Because a violinist misread measure 42</text>
  <text class="orchestra-desc orchestra-row orchestra-r4" x="526" y="318">Each gets specific, calibrated feedback</text>
  <text class="orchestra-sub" x="30" y="372">The specificity is the point: every musician receives a correction proportional to their own contribution to the error, which is exactly what a gradient is.</text>
</svg>
