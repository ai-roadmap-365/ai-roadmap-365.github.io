<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three punctuation marks, and one shell trap.">
  <title>Building a query string by hand</title>
  <style>
    .query-string-anatomy-bg   { fill: #f8fafc; }
    .query-string-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-string-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-string-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-string-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-string-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-string-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .query-string-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .query-string-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .query-string-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .query-string-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .query-string-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .query-string-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .query-string-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .query-string-anatomy-stage { opacity: 1; }

    .query-string-anatomy-s0 { animation-delay: 0.00s; }
    .query-string-anatomy-e0 { animation-delay: 0.00s; }
    .query-string-anatomy-s1 { animation-delay: 1.28s; }
    .query-string-anatomy-e1 { animation-delay: 1.28s; }
    .query-string-anatomy-s2 { animation-delay: 2.56s; }
    .query-string-anatomy-e2 { animation-delay: 2.56s; }
    .query-string-anatomy-s3 { animation-delay: 3.84s; }
    .query-string-anatomy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .query-string-anatomy-conn  { animation: query-string-anatomy-trace 6.4s ease-in-out infinite; }
      .query-string-anatomy-stage { animation: query-string-anatomy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes query-string-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes query-string-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .query-string-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .query-string-anatomy-stage { animation: query-string-anatomy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes query-string-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="query-string-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="query-string-anatomy-bg" width="980" height="322"/>
  <text class="query-string-anatomy-h1"  x="30" y="40">Building a query string by hand</text>
  <text class="query-string-anatomy-sub" x="30" y="64">Three punctuation marks, and one shell trap.</text>
  <g class="query-string-anatomy-stage query-string-anatomy-s0">
    <rect class="query-string-anatomy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="query-string-anatomy-step" x="44" y="142">01</text>
    <text class="query-string-anatomy-name" x="70" y="142">? starts it</text>
    <text class="query-string-anatomy-desc" x="44" y="166">Everything after the path,</text>
    <text class="query-string-anatomy-desc" x="44" y="182">before the parameters begin.</text>
    <text class="query-string-anatomy-edge" x="44" y="242">?</text>
  </g>
  <line class="query-string-anatomy-line query-string-anatomy-conn query-string-anatomy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#query-string-anatomy-tip)"/>
  <g class="query-string-anatomy-stage query-string-anatomy-s1">
    <rect class="query-string-anatomy-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="query-string-anatomy-step" x="280" y="142">02</text>
    <text class="query-string-anatomy-name" x="306" y="142">name=value</text>
    <text class="query-string-anatomy-desc" x="280" y="166">One parameter. No spaces around</text>
    <text class="query-string-anatomy-desc" x="280" y="182">the equals sign.</text>
    <text class="query-string-anatomy-edge" x="280" y="242">lat=52.52</text>
  </g>
  <line class="query-string-anatomy-line query-string-anatomy-conn query-string-anatomy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#query-string-anatomy-tip)"/>
  <g class="query-string-anatomy-stage query-string-anatomy-s2">
    <rect class="query-string-anatomy-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="query-string-anatomy-step" x="516" y="142">03</text>
    <text class="query-string-anatomy-name" x="542" y="142">&amp; joins them</text>
    <text class="query-string-anatomy-desc" x="516" y="166">As many pairs as the endpoint</text>
    <text class="query-string-anatomy-desc" x="516" y="182">accepts.</text>
    <text class="query-string-anatomy-edge" x="516" y="242">&amp;</text>
  </g>
  <line class="query-string-anatomy-line query-string-anatomy-conn query-string-anatomy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#query-string-anatomy-tip)"/>
  <g class="query-string-anatomy-stage query-string-anatomy-s3">
    <rect class="query-string-anatomy-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="query-string-anatomy-step" x="752" y="142">04</text>
    <text class="query-string-anatomy-name" x="778" y="142">Quote the whole URL</text>
    <text class="query-string-anatomy-desc" x="752" y="166">Unquoted, the shell reads &amp; as</text>
    <text class="query-string-anatomy-desc" x="752" y="182">"run in background" and eats the</text>
    <text class="query-string-anatomy-desc" x="752" y="198">rest.</text>
    <text class="query-string-anatomy-edge" x="752" y="242">quote it</text>
  </g>
  <text class="query-string-anatomy-sub" x="30" y="304">That last one accounts for most "only part of my request went through" confusion, and it is Day 12's quoting rule appearing in a new costume.</text>
</svg>
