<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four readings.">
  <title>What a derivative tells you</title>
  <style>
    .deriv-uses-bg   { fill: #f8fafc; }
    .deriv-uses-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-uses-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-uses-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-uses-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-uses-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-uses-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deriv-uses-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deriv-uses-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deriv-uses-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deriv-uses-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deriv-uses-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deriv-uses-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deriv-uses-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deriv-uses-stage { opacity: 1; }

    .deriv-uses-s0 { animation-delay: 0.00s; }
    .deriv-uses-e0 { animation-delay: 0.00s; }
    .deriv-uses-s1 { animation-delay: 1.28s; }
    .deriv-uses-e1 { animation-delay: 1.28s; }
    .deriv-uses-s2 { animation-delay: 2.56s; }
    .deriv-uses-e2 { animation-delay: 2.56s; }
    .deriv-uses-s3 { animation-delay: 3.84s; }
    .deriv-uses-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .deriv-uses-conn  { animation: deriv-uses-trace 6.4s ease-in-out infinite; }
      .deriv-uses-stage { animation: deriv-uses-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes deriv-uses-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deriv-uses-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deriv-uses-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deriv-uses-stage { animation: deriv-uses-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deriv-uses-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deriv-uses-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deriv-uses-bg" width="980" height="322"/>
  <text class="deriv-uses-h1"  x="30" y="40">What a derivative tells you</text>
  <text class="deriv-uses-sub" x="30" y="64">Four readings.</text>
  <g class="deriv-uses-stage deriv-uses-s0">
    <rect class="deriv-uses-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-uses-step" x="44" y="142">01</text>
    <text class="deriv-uses-name" x="70" y="142">Positive: the function is increasing here</text>
    <text class="deriv-uses-desc" x="44" y="166">Move right to go up.</text>
  </g>
  <line class="deriv-uses-line deriv-uses-conn deriv-uses-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#deriv-uses-tip)"/>
  <g class="deriv-uses-stage deriv-uses-s1">
    <rect class="deriv-uses-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-uses-step" x="280" y="142">02</text>
    <text class="deriv-uses-name" x="306" y="142">Negative: it is decreasing</text>
    <text class="deriv-uses-desc" x="280" y="166">Move left to go up.</text>
  </g>
  <line class="deriv-uses-line deriv-uses-conn deriv-uses-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#deriv-uses-tip)"/>
  <g class="deriv-uses-stage deriv-uses-s2">
    <rect class="deriv-uses-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-uses-step" x="516" y="142">03</text>
    <text class="deriv-uses-name" x="542" y="142">Zero: a flat point — a peak, a trough, or neither</text>
    <text class="deriv-uses-desc" x="516" y="166">Which needs more information to</text>
    <text class="deriv-uses-desc" x="516" y="182">distinguish.</text>
  </g>
  <line class="deriv-uses-line deriv-uses-conn deriv-uses-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#deriv-uses-tip)"/>
  <g class="deriv-uses-stage deriv-uses-s3">
    <rect class="deriv-uses-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-uses-step" x="752" y="142">04</text>
    <text class="deriv-uses-name" x="778" y="142">And large in size: steep, so small steps matter</text>
    <text class="deriv-uses-desc" x="752" y="166">Which is why step size is tied</text>
    <text class="deriv-uses-desc" x="752" y="182">to slope.</text>
  </g>
  <text class="deriv-uses-sub" x="30" y="304">A zero derivative not implying a minimum is exactly the ambiguity that makes optimisation hard, since saddle points look identical to the first derivative.</text>
</svg>
