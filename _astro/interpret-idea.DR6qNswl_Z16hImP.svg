<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Global and local.">
  <title>Two kinds of explanation</title>
  <style>
    .interpret-idea-bg   { fill: #f8fafc; }
    .interpret-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interpret-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .interpret-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .interpret-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .interpret-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .interpret-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .interpret-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .interpret-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .interpret-idea-stage { opacity: 1; }

    .interpret-idea-s0 { animation-delay: 0.00s; }
    .interpret-idea-e0 { animation-delay: 0.00s; }
    .interpret-idea-s1 { animation-delay: 1.28s; }
    .interpret-idea-e1 { animation-delay: 1.28s; }
    .interpret-idea-s2 { animation-delay: 2.56s; }
    .interpret-idea-e2 { animation-delay: 2.56s; }
    .interpret-idea-s3 { animation-delay: 3.84s; }
    .interpret-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .interpret-idea-conn  { animation: interpret-idea-trace 6.4s ease-in-out infinite; }
      .interpret-idea-stage { animation: interpret-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes interpret-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes interpret-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .interpret-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .interpret-idea-stage { animation: interpret-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes interpret-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="interpret-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="interpret-idea-bg" width="980" height="322"/>
  <text class="interpret-idea-h1"  x="30" y="40">Two kinds of explanation</text>
  <text class="interpret-idea-sub" x="30" y="64">Global and local.</text>
  <g class="interpret-idea-stage interpret-idea-s0">
    <rect class="interpret-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="interpret-idea-step" x="44" y="142">01</text>
    <text class="interpret-idea-name" x="70" y="142">Global: what does this model rely on overall</text>
    <text class="interpret-idea-desc" x="44" y="166">A property of the model.</text>
  </g>
  <line class="interpret-idea-line interpret-idea-conn interpret-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#interpret-idea-tip)"/>
  <g class="interpret-idea-stage interpret-idea-s1">
    <rect class="interpret-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="interpret-idea-step" x="280" y="142">02</text>
    <text class="interpret-idea-name" x="306" y="142">Local: why did it say that about this case</text>
    <text class="interpret-idea-desc" x="280" y="166">A property of one prediction.</text>
  </g>
  <line class="interpret-idea-line interpret-idea-conn interpret-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#interpret-idea-tip)"/>
  <g class="interpret-idea-stage interpret-idea-s2">
    <rect class="interpret-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="interpret-idea-step" x="516" y="142">03</text>
    <text class="interpret-idea-name" x="542" y="142">Importance and dependence answer the first</text>
    <text class="interpret-idea-desc" x="516" y="166">Across the whole dataset.</text>
  </g>
  <line class="interpret-idea-line interpret-idea-conn interpret-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#interpret-idea-tip)"/>
  <g class="interpret-idea-stage interpret-idea-s3">
    <rect class="interpret-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="interpret-idea-step" x="752" y="142">04</text>
    <text class="interpret-idea-name" x="778" y="142">Attribution answers the second</text>
    <text class="interpret-idea-desc" x="752" y="166">Which is what a person affected</text>
    <text class="interpret-idea-desc" x="752" y="182">by a decision needs.</text>
  </g>
  <text class="interpret-idea-sub" x="30" y="304">Regulated settings usually require the local answer: a person declined a loan is entitled to know why in their case, not what the model relies on generally.</text>
</svg>
