<svg role="img" aria-label="Positional Encoding comparison illustrating Vaswani Sinusoidal absolute positions versus modern Rotary Position Embeddings rotation in the complex plane" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Sinusoidal vs. Rotary Position Embeddings (RoPE)</title>
  <defs>
    <linearGradient id="bg226b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card226b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg226b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">POSITIONAL ENCODING MECHANICS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Injecting Sequence Order: Vaswani Sinusoidal Vectors vs Modern Rotary Embeddings (RoPE)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card226b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Sinusoidal Absolute Encodings -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="195" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Vaswani Sinusoidal PE (Additive)</text>
    
    <rect x="35" y="65" width="320" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="195" y="85" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Vector Addition: x_pos = e_token + PE(pos)</text>
    <text x="195" y="110" fill="#cbd5e1" font-size="8" text-anchor="middle">PE(pos, 2i) = sin( pos / 10000^(2i/d) )</text>
    <text x="195" y="130" fill="#cbd5e1" font-size="8" text-anchor="middle">PE(pos, 2i+1) = cos( pos / 10000^(2i/d) )</text>
    <text x="195" y="160" fill="#94a3b8" font-size="8" text-anchor="middle">• Deterministic trigonometric frequencies</text>
    <text x="195" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">• Wavelength ranges from 2π to 10,000·2π</text>
    <text x="195" y="200" fill="#94a3b8" font-size="8" text-anchor="middle">• Enables linear relative shift: PE(pos+k) = T_k · PE(pos)</text>
    <text x="195" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Classic Absolute Positioning</text>

    <!-- Right: Rotary Position Embeddings (RoPE) -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="565" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Rotary Position Embeddings (RoPE)</text>
    
    <rect x="405" y="65" width="320" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="565" y="85" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">2D Complex Plane Rotation (Su et al., 2021)</text>
    <text x="565" y="110" fill="#cbd5e1" font-size="8" text-anchor="middle">q_m = R_{theta, m} · (W_Q x_m),   k_n = R_{theta, n} · (W_K x_n)</text>
    <text x="565" y="130" fill="#cbd5e1" font-size="8" text-anchor="middle">&lt;q_m, k_n&gt; = Re( (q e^{i m theta})* · (k e^{i n theta}) )</text>
    <text x="565" y="160" fill="#a7f3d0" font-size="8" text-anchor="middle">• Dot product depends strictly on relative offset (m - n)</text>
    <text x="565" y="180" fill="#a7f3d0" font-size="8" text-anchor="middle">• Zero extra parameter overhead</text>
    <text x="565" y="200" fill="#a7f3d0" font-size="8" text-anchor="middle">• Standard in Llama 3, Mistral, Gemma, and DeepSeek</text>
    <text x="565" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Modern LLM Standard</text>
  </g>
</svg>
