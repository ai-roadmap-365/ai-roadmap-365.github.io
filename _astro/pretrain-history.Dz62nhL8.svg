<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Scale, then data.">
  <title>Four steps to modern pretraining</title>
  <style>
    .pretrain-history-bg   { fill: #f8fafc; }
    .pretrain-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pretrain-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pretrain-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pretrain-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pretrain-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pretrain-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pretrain-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pretrain-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pretrain-history-stage { opacity: 1; }

    .pretrain-history-s0 { animation-delay: 0.00s; }
    .pretrain-history-e0 { animation-delay: 0.00s; }
    .pretrain-history-s1 { animation-delay: 1.28s; }
    .pretrain-history-e1 { animation-delay: 1.28s; }
    .pretrain-history-s2 { animation-delay: 2.56s; }
    .pretrain-history-e2 { animation-delay: 2.56s; }
    .pretrain-history-s3 { animation-delay: 3.84s; }
    .pretrain-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pretrain-history-conn  { animation: pretrain-history-trace 6.4s ease-in-out infinite; }
      .pretrain-history-stage { animation: pretrain-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pretrain-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pretrain-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pretrain-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pretrain-history-stage { animation: pretrain-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pretrain-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pretrain-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pretrain-history-bg" width="980" height="322"/>
  <text class="pretrain-history-h1"  x="30" y="40">Four steps to modern pretraining</text>
  <text class="pretrain-history-sub" x="30" y="64">Scale, then data.</text>
  <g class="pretrain-history-stage pretrain-history-s0">
    <rect class="pretrain-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-history-step" x="44" y="142">01</text>
    <text class="pretrain-history-name" x="70" y="142">A model per task</text>
    <text class="pretrain-history-desc" x="44" y="166">Trained from scratch on labelled</text>
    <text class="pretrain-history-desc" x="44" y="182">data, for one purpose.</text>
  </g>
  <line class="pretrain-history-line pretrain-history-conn pretrain-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pretrain-history-tip)"/>
  <g class="pretrain-history-stage pretrain-history-s1">
    <rect class="pretrain-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-history-step" x="280" y="142">02</text>
    <text class="pretrain-history-name" x="306" y="142">Pretrain then fine-tune</text>
    <text class="pretrain-history-desc" x="280" y="166">One general model, adapted many</text>
    <text class="pretrain-history-desc" x="280" y="182">times.</text>
  </g>
  <line class="pretrain-history-line pretrain-history-conn pretrain-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pretrain-history-tip)"/>
  <g class="pretrain-history-stage pretrain-history-s2">
    <rect class="pretrain-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-history-step" x="516" y="142">03</text>
    <text class="pretrain-history-name" x="542" y="142">Scale it enormously</text>
    <text class="pretrain-history-desc" x="516" y="166">Which produced capability nobody</text>
    <text class="pretrain-history-desc" x="516" y="182">had trained for.</text>
  </g>
  <line class="pretrain-history-line pretrain-history-conn pretrain-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pretrain-history-tip)"/>
  <g class="pretrain-history-stage pretrain-history-s3">
    <rect class="pretrain-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-history-step" x="752" y="142">04</text>
    <text class="pretrain-history-name" x="778" y="142">Then fix the data</text>
    <text class="pretrain-history-desc" x="752" y="166">Where most of the remaining</text>
    <text class="pretrain-history-desc" x="752" y="182">gains now come from.</text>
  </g>
  <text class="pretrain-history-sub" x="30" y="304">The last step is the current one and the least visible: the published architectures barely differ, and the corpora differ enormously.</text>
</svg>
