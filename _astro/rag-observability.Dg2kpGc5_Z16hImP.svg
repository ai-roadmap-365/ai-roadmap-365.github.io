<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five spans.">
  <title>Tracing a retrieval request</title>
  <style>
    .rag-observability-bg   { fill: #f8fafc; }
    .rag-observability-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-observability-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-observability-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-observability-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-observability-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-observability-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-observability-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-observability-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-observability-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-observability-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-observability-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-observability-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rag-observability-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rag-observability-stage { opacity: 1; }

    .rag-observability-s0 { animation-delay: 0.00s; }
    .rag-observability-e0 { animation-delay: 0.00s; }
    .rag-observability-s1 { animation-delay: 1.33s; }
    .rag-observability-e1 { animation-delay: 1.33s; }
    .rag-observability-s2 { animation-delay: 2.67s; }
    .rag-observability-e2 { animation-delay: 2.67s; }
    .rag-observability-s3 { animation-delay: 4.00s; }
    .rag-observability-e3 { animation-delay: 4.00s; }
    .rag-observability-s4 { animation-delay: 5.33s; }
    .rag-observability-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .rag-observability-conn  { animation: rag-observability-trace 8s ease-in-out infinite; }
      .rag-observability-stage { animation: rag-observability-arrive 8s ease-in-out infinite; }
    }
    @keyframes rag-observability-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rag-observability-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rag-observability-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rag-observability-stage { animation: rag-observability-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rag-observability-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rag-observability-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rag-observability-bg" width="980" height="322"/>
  <text class="rag-observability-h1"  x="30" y="40">Tracing a retrieval request</text>
  <text class="rag-observability-sub" x="30" y="64">Five spans.</text>
  <g class="rag-observability-stage rag-observability-s0">
    <rect class="rag-observability-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="rag-observability-step" x="44" y="142">01</text>
    <text class="rag-observability-name" x="70" y="142">The original query</text>
    <text class="rag-observability-desc" x="44" y="166">As the user typed it, and</text>
    <text class="rag-observability-desc" x="44" y="182">as it was rewritten.</text>
  </g>
  <line class="rag-observability-line rag-observability-conn rag-observability-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#rag-observability-tip)"/>
  <g class="rag-observability-stage rag-observability-s1">
    <rect class="rag-observability-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="rag-observability-step" x="233" y="142">02</text>
    <text class="rag-observability-name" x="259" y="142">What was retrieved</text>
    <text class="rag-observability-desc" x="233" y="166">Identifiers and scores,</text>
    <text class="rag-observability-desc" x="233" y="182">from both indexes.</text>
  </g>
  <line class="rag-observability-line rag-observability-conn rag-observability-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#rag-observability-tip)"/>
  <g class="rag-observability-stage rag-observability-s2">
    <rect class="rag-observability-good" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="rag-observability-step" x="422" y="142">03</text>
    <text class="rag-observability-name" x="448" y="142">What the reranker kept</text>
    <text class="rag-observability-desc" x="422" y="166">And what it discarded,</text>
    <text class="rag-observability-desc" x="422" y="182">with scores.</text>
  </g>
  <line class="rag-observability-line rag-observability-conn rag-observability-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#rag-observability-tip)"/>
  <g class="rag-observability-stage rag-observability-s3">
    <rect class="rag-observability-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="rag-observability-step" x="611" y="142">04</text>
    <text class="rag-observability-name" x="637" y="142">The exact prompt sent</text>
    <text class="rag-observability-desc" x="611" y="166">Fully rendered, with the</text>
    <text class="rag-observability-desc" x="611" y="182">passages in place.</text>
  </g>
  <line class="rag-observability-line rag-observability-conn rag-observability-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#rag-observability-tip)"/>
  <g class="rag-observability-stage rag-observability-s4">
    <rect class="rag-observability-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="rag-observability-step" x="800" y="142">05</text>
    <text class="rag-observability-name" x="826" y="142">And the answer, with its citations</text>
    <text class="rag-observability-desc" x="800" y="166">So any complaint is</text>
    <text class="rag-observability-desc" x="800" y="182">reconstructable end to</text>
    <text class="rag-observability-desc" x="800" y="198">end.</text>
  </g>
  <text class="rag-observability-sub" x="30" y="304">Without these five, a bad answer is unattributable: it could have originated in parsing, chunking, retrieval, reranking or generation, and only the trace distinguishes them.</text>
</svg>
