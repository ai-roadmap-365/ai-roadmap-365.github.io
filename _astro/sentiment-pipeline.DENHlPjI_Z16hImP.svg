<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Only one is the model.">
  <title>Seven stages, end to end</title>
  <style>
    .sentiment-pipeline-bg   { fill: #f8fafc; }
    .sentiment-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sentiment-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sentiment-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sentiment-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sentiment-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sentiment-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sentiment-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sentiment-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sentiment-pipeline-stage { opacity: 1; }

    .sentiment-pipeline-s0 { animation-delay: 0.00s; }
    .sentiment-pipeline-e0 { animation-delay: 0.00s; }
    .sentiment-pipeline-s1 { animation-delay: 1.40s; }
    .sentiment-pipeline-e1 { animation-delay: 1.40s; }
    .sentiment-pipeline-s2 { animation-delay: 2.80s; }
    .sentiment-pipeline-e2 { animation-delay: 2.80s; }
    .sentiment-pipeline-s3 { animation-delay: 4.20s; }
    .sentiment-pipeline-e3 { animation-delay: 4.20s; }
    .sentiment-pipeline-s4 { animation-delay: 5.60s; }
    .sentiment-pipeline-e4 { animation-delay: 5.60s; }
    .sentiment-pipeline-s5 { animation-delay: 7.00s; }
    .sentiment-pipeline-e5 { animation-delay: 7.00s; }
    .sentiment-pipeline-s6 { animation-delay: 8.40s; }
    .sentiment-pipeline-e6 { animation-delay: 8.40s; }
    @media (prefers-reduced-motion: no-preference) {
      .sentiment-pipeline-conn  { animation: sentiment-pipeline-trace 11.200000000000001s ease-in-out infinite; }
      .sentiment-pipeline-stage { animation: sentiment-pipeline-arrive 11.200000000000001s ease-in-out infinite; }
    }
    @keyframes sentiment-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sentiment-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sentiment-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sentiment-pipeline-stage { animation: sentiment-pipeline-settle 11.200000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sentiment-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sentiment-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sentiment-pipeline-bg" width="980" height="322"/>
  <text class="sentiment-pipeline-h1"  x="30" y="40">Seven stages, end to end</text>
  <text class="sentiment-pipeline-sub" x="30" y="64">Only one is the model.</text>
  <g class="sentiment-pipeline-stage sentiment-pipeline-s0">
    <rect class="sentiment-pipeline-box" x="30" y="118" width="109" height="104" rx="10"/>
    <text class="sentiment-pipeline-step" x="44" y="142">01</text>
    <text class="sentiment-pipeline-name" x="70" y="142">Ingest and clean</text>
    <text class="sentiment-pipeline-desc" x="44" y="166">Real text: emoji,</text>
    <text class="sentiment-pipeline-desc" x="44" y="182">markup, mixed</text>
    <text class="sentiment-pipeline-desc" x="44" y="198">languages,</text>
  </g>
  <line class="sentiment-pipeline-line sentiment-pipeline-conn sentiment-pipeline-e0" x1="141" y1="170" x2="163" y2="170" marker-end="url(#sentiment-pipeline-tip)"/>
  <g class="sentiment-pipeline-stage sentiment-pipeline-s1">
    <rect class="sentiment-pipeline-box" x="165" y="118" width="109" height="104" rx="10"/>
    <text class="sentiment-pipeline-step" x="179" y="142">02</text>
    <text class="sentiment-pipeline-name" x="205" y="142">Tokenise and batch dynamically</text>
    <text class="sentiment-pipeline-desc" x="179" y="166">Per-batch</text>
    <text class="sentiment-pipeline-desc" x="179" y="182">padding, with</text>
    <text class="sentiment-pipeline-desc" x="179" y="198">masks.</text>
  </g>
  <line class="sentiment-pipeline-line sentiment-pipeline-conn sentiment-pipeline-e1" x1="276" y1="170" x2="298" y2="170" marker-end="url(#sentiment-pipeline-tip)"/>
  <g class="sentiment-pipeline-stage sentiment-pipeline-s2">
    <rect class="sentiment-pipeline-box" x="300" y="118" width="109" height="104" rx="10"/>
    <text class="sentiment-pipeline-step" x="314" y="142">03</text>
    <text class="sentiment-pipeline-name" x="340" y="142">Model</text>
    <text class="sentiment-pipeline-desc" x="314" y="166">Recurrent with</text>
    <text class="sentiment-pipeline-desc" x="314" y="182">attention</text>
    <text class="sentiment-pipeline-desc" x="314" y="198">pooling, or a</text>
  </g>
  <line class="sentiment-pipeline-line sentiment-pipeline-conn sentiment-pipeline-e2" x1="411" y1="170" x2="433" y2="170" marker-end="url(#sentiment-pipeline-tip)"/>
  <g class="sentiment-pipeline-stage sentiment-pipeline-s3">
    <rect class="sentiment-pipeline-warn" x="435" y="118" width="109" height="104" rx="10"/>
    <text class="sentiment-pipeline-step" x="449" y="142">04</text>
    <text class="sentiment-pipeline-name" x="475" y="142">Evaluate on the right metrics</text>
    <text class="sentiment-pipeline-desc" x="449" y="166">Per-class, not</text>
    <text class="sentiment-pipeline-desc" x="449" y="182">overall accuracy.</text>
  </g>
  <line class="sentiment-pipeline-line sentiment-pipeline-conn sentiment-pipeline-e3" x1="546" y1="170" x2="568" y2="170" marker-end="url(#sentiment-pipeline-tip)"/>
  <g class="sentiment-pipeline-stage sentiment-pipeline-s4">
    <rect class="sentiment-pipeline-box" x="570" y="118" width="109" height="104" rx="10"/>
    <text class="sentiment-pipeline-step" x="584" y="142">05</text>
    <text class="sentiment-pipeline-name" x="610" y="142">Explain</text>
    <text class="sentiment-pipeline-desc" x="584" y="166">Token</text>
    <text class="sentiment-pipeline-desc" x="584" y="182">attribution, so a</text>
    <text class="sentiment-pipeline-desc" x="584" y="198">score can be</text>
  </g>
  <line class="sentiment-pipeline-line sentiment-pipeline-conn sentiment-pipeline-e4" x1="681" y1="170" x2="703" y2="170" marker-end="url(#sentiment-pipeline-tip)"/>
  <g class="sentiment-pipeline-stage sentiment-pipeline-s5">
    <rect class="sentiment-pipeline-box" x="705" y="118" width="109" height="104" rx="10"/>
    <text class="sentiment-pipeline-step" x="719" y="142">06</text>
    <text class="sentiment-pipeline-name" x="745" y="142">Calibrate</text>
    <text class="sentiment-pipeline-desc" x="719" y="166">So the confidence</text>
    <text class="sentiment-pipeline-desc" x="719" y="182">figure means</text>
    <text class="sentiment-pipeline-desc" x="719" y="198">something.</text>
  </g>
  <line class="sentiment-pipeline-line sentiment-pipeline-conn sentiment-pipeline-e5" x1="816" y1="170" x2="838" y2="170" marker-end="url(#sentiment-pipeline-tip)"/>
  <g class="sentiment-pipeline-stage sentiment-pipeline-s6">
    <rect class="sentiment-pipeline-good" x="840" y="118" width="109" height="104" rx="10"/>
    <text class="sentiment-pipeline-step" x="854" y="142">07</text>
    <text class="sentiment-pipeline-name" x="880" y="142">Serve, and monitor for drift</text>
    <text class="sentiment-pipeline-desc" x="854" y="166">Language changes</text>
    <text class="sentiment-pipeline-desc" x="854" y="182">continuously.</text>
  </g>
  <text class="sentiment-pipeline-sub" x="30" y="304">Six of the seven stages are engineering rather than modelling, which is the honest shape of a production NLP system and the reason accuracy alone rarely predicts success.</text>
</svg>
