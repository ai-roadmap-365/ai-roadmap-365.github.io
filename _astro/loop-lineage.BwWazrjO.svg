<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each fixed what the last could not.">
  <title>Three generations of control loop</title>
  <style>
    .loop-lineage-bg   { fill: #f8fafc; }
    .loop-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loop-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loop-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loop-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loop-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loop-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loop-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loop-lineage-stage { opacity: 1; }

    .loop-lineage-s0 { animation-delay: 0.00s; }
    .loop-lineage-e0 { animation-delay: 0.00s; }
    .loop-lineage-s1 { animation-delay: 1.28s; }
    .loop-lineage-e1 { animation-delay: 1.28s; }
    .loop-lineage-s2 { animation-delay: 2.56s; }
    .loop-lineage-e2 { animation-delay: 2.56s; }
    .loop-lineage-s3 { animation-delay: 3.84s; }
    .loop-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .loop-lineage-conn  { animation: loop-lineage-trace 6.4s ease-in-out infinite; }
      .loop-lineage-stage { animation: loop-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes loop-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loop-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loop-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loop-lineage-stage { animation: loop-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loop-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loop-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loop-lineage-bg" width="980" height="322"/>
  <text class="loop-lineage-h1"  x="30" y="40">Three generations of control loop</text>
  <text class="loop-lineage-sub" x="30" y="64">Each fixed what the last could not.</text>
  <g class="loop-lineage-stage loop-lineage-s0">
    <rect class="loop-lineage-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="loop-lineage-step" x="44" y="142">01</text>
    <text class="loop-lineage-name" x="70" y="142">Chain-of-thought, 2022</text>
    <text class="loop-lineage-desc" x="44" y="166">"Think step by step" unlocks</text>
    <text class="loop-lineage-desc" x="44" y="182">multi-step reasoning. Isolated</text>
    <text class="loop-lineage-desc" x="44" y="198">from reality.</text>
  </g>
  <line class="loop-lineage-line loop-lineage-conn loop-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#loop-lineage-tip)"/>
  <g class="loop-lineage-stage loop-lineage-s1">
    <rect class="loop-lineage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="loop-lineage-step" x="280" y="142">02</text>
    <text class="loop-lineage-name" x="306" y="142">ReAct, October 2022</text>
    <text class="loop-lineage-desc" x="280" y="166">Interleave reasoning with</text>
    <text class="loop-lineage-desc" x="280" y="182">actions. Observations ground the</text>
    <text class="loop-lineage-desc" x="280" y="198">trace.</text>
  </g>
  <line class="loop-lineage-line loop-lineage-conn loop-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#loop-lineage-tip)"/>
  <g class="loop-lineage-stage loop-lineage-s2">
    <rect class="loop-lineage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="loop-lineage-step" x="516" y="142">03</text>
    <text class="loop-lineage-name" x="542" y="142">Plan-and-Solve, 2023</text>
    <text class="loop-lineage-desc" x="516" y="166">An upfront macro plan, because</text>
    <text class="loop-lineage-desc" x="516" y="182">pure ReAct loses the global goal</text>
    <text class="loop-lineage-desc" x="516" y="198">on long horizons.</text>
  </g>
  <line class="loop-lineage-line loop-lineage-conn loop-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#loop-lineage-tip)"/>
  <g class="loop-lineage-stage loop-lineage-s3">
    <rect class="loop-lineage-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="loop-lineage-step" x="752" y="142">04</text>
    <text class="loop-lineage-name" x="778" y="142">Reflexion, 2023</text>
    <text class="loop-lineage-desc" x="752" y="166">A critique of a failed</text>
    <text class="loop-lineage-desc" x="752" y="182">trajectory, written into</text>
    <text class="loop-lineage-desc" x="752" y="198">episodic memory for the next</text>
  </g>
  <text class="loop-lineage-sub" x="30" y="304">Reflexion is the interesting one architecturally: it is a learning signal that costs no gradient update, because the lesson is stored as text the next episode reads.</text>
</svg>
