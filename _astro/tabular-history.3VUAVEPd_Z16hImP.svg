<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Boosting held.">
  <title>Four steps in tabular practice</title>
  <style>
    .tabular-history-bg   { fill: #f8fafc; }
    .tabular-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tabular-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tabular-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tabular-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tabular-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tabular-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tabular-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tabular-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tabular-history-stage { opacity: 1; }

    .tabular-history-s0 { animation-delay: 0.00s; }
    .tabular-history-e0 { animation-delay: 0.00s; }
    .tabular-history-s1 { animation-delay: 1.28s; }
    .tabular-history-e1 { animation-delay: 1.28s; }
    .tabular-history-s2 { animation-delay: 2.56s; }
    .tabular-history-e2 { animation-delay: 2.56s; }
    .tabular-history-s3 { animation-delay: 3.84s; }
    .tabular-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tabular-history-conn  { animation: tabular-history-trace 6.4s ease-in-out infinite; }
      .tabular-history-stage { animation: tabular-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tabular-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tabular-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tabular-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tabular-history-stage { animation: tabular-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tabular-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tabular-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tabular-history-bg" width="980" height="322"/>
  <text class="tabular-history-h1"  x="30" y="40">Four steps in tabular practice</text>
  <text class="tabular-history-sub" x="30" y="64">Boosting held.</text>
  <g class="tabular-history-stage tabular-history-s0">
    <rect class="tabular-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-history-step" x="44" y="142">01</text>
    <text class="tabular-history-name" x="70" y="142">Linear and generalised linear models</text>
    <text class="tabular-history-desc" x="44" y="166">Interpretable, and limited.</text>
  </g>
  <line class="tabular-history-line tabular-history-conn tabular-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tabular-history-tip)"/>
  <g class="tabular-history-stage tabular-history-s1">
    <rect class="tabular-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-history-step" x="280" y="142">02</text>
    <text class="tabular-history-name" x="306" y="142">Tree ensembles took over</text>
    <text class="tabular-history-desc" x="280" y="166">And have not been displaced</text>
    <text class="tabular-history-desc" x="280" y="182">since.</text>
  </g>
  <line class="tabular-history-line tabular-history-conn tabular-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tabular-history-tip)"/>
  <g class="tabular-history-stage tabular-history-s2">
    <rect class="tabular-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-history-step" x="516" y="142">03</text>
    <text class="tabular-history-name" x="542" y="142">Deep architectures were proposed repeatedly</text>
    <text class="tabular-history-desc" x="516" y="166">And have not consistently beaten</text>
    <text class="tabular-history-desc" x="516" y="182">boosting.</text>
  </g>
  <line class="tabular-history-line tabular-history-conn tabular-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tabular-history-tip)"/>
  <g class="tabular-history-stage tabular-history-s3">
    <rect class="tabular-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-history-step" x="752" y="142">04</text>
    <text class="tabular-history-name" x="778" y="142">So the consensus is boosting plus features</text>
    <text class="tabular-history-desc" x="752" y="166">Which is where practice sits</text>
    <text class="tabular-history-desc" x="752" y="182">today.</text>
  </g>
  <text class="tabular-history-sub" x="30" y="304">That a decade of deep tabular architectures has not displaced boosting is a substantive empirical result, and it is worth citing when the assumption is challenged.</text>
</svg>
