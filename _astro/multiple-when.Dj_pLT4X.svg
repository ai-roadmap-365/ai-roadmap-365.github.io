<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to add columns</title>
  <style>
    .multiple-when-bg   { fill: #f8fafc; }
    .multiple-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multiple-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multiple-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multiple-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multiple-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multiple-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multiple-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multiple-when-row { opacity: 1; }
    .multiple-when-r0 { animation-delay: 0.00s; }
    .multiple-when-r1 { animation-delay: 0.45s; }
    .multiple-when-r2 { animation-delay: 0.90s; }
    .multiple-when-r3 { animation-delay: 1.35s; }
    .multiple-when-r4 { animation-delay: 1.80s; }
    .multiple-when-row { animation: multiple-when-reveal 7.3s ease-in-out infinite; }
    @keyframes multiple-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="multiple-when-bg" width="980" height="390"/>
  <text class="multiple-when-h1"  x="30" y="40">When to add columns</text>
  <text class="multiple-when-sub" x="30" y="64">And when not to.</text>
  <rect class="multiple-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="multiple-when-name" x="46" y="122">Add them</text>
  <text class="multiple-when-desc" x="46" y="142">Four cases.</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r0" x="46" y="182">A known non-linear relationship</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r1" x="46" y="216">A theoretically justified interaction</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r2" x="46" y="250">Where prediction is the goal</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r3" x="46" y="284">Enough rows to support the columns</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r4" x="46" y="318">With regularisation, and validation</text>
  <rect class="multiple-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="multiple-when-name" x="526" y="122">Do not</text>
  <text class="multiple-when-desc" x="526" y="142">Also four.</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r0" x="526" y="182">Interpretation matters and predictors are correlated</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r1" x="526" y="216">Few rows relative to columns</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r2" x="526" y="250">Speculative high-degree polynomials</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r3" x="526" y="284">Without checking the inflation factors</text>
  <text class="multiple-when-desc multiple-when-row multiple-when-r4" x="526" y="318">Because the fit statistic improved</text>
  <text class="multiple-when-sub" x="30" y="372">The last row is the trap this lesson closes: the fit statistic improves with any added column, including a column of pure noise.</text>
</svg>
