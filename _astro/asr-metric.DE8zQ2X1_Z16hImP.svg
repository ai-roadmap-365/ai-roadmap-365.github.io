<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="What makes safety work arguable.">
  <title>Attack Success Rate over time</title>
  <style>
    .asr-metric-bg   { fill: #f8fafc; }
    .asr-metric-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-metric-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-metric-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-metric-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-metric-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-metric-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .asr-metric-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .asr-metric-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .asr-metric-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .asr-metric-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .asr-metric-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .asr-metric-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .asr-metric-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .asr-metric-stage { opacity: 1; }

    .asr-metric-s0 { animation-delay: 0.00s; }
    .asr-metric-e0 { animation-delay: 0.00s; }
    .asr-metric-s1 { animation-delay: 1.50s; }
    .asr-metric-e1 { animation-delay: 1.50s; }
    .asr-metric-s2 { animation-delay: 3.00s; }
    .asr-metric-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .asr-metric-conn  { animation: asr-metric-trace 6s ease-in-out infinite; }
      .asr-metric-stage { animation: asr-metric-arrive 6s ease-in-out infinite; }
    }
    @keyframes asr-metric-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes asr-metric-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .asr-metric-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .asr-metric-stage { animation: asr-metric-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes asr-metric-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="asr-metric-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="asr-metric-bg" width="980" height="322"/>
  <text class="asr-metric-h1"  x="30" y="40">Attack Success Rate over time</text>
  <text class="asr-metric-sub" x="30" y="64">What makes safety work arguable.</text>
  <g class="asr-metric-stage asr-metric-s0">
    <rect class="asr-metric-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="asr-metric-step" x="44" y="142">01</text>
    <text class="asr-metric-name" x="70" y="142">Measure ASR per category</text>
    <text class="asr-metric-desc" x="44" y="166">Injection, leakage, toxicity, tool</text>
    <text class="asr-metric-desc" x="44" y="182">escalation. Not one aggregate number.</text>
  </g>
  <line class="asr-metric-line asr-metric-conn asr-metric-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#asr-metric-tip)"/>
  <g class="asr-metric-stage asr-metric-s1">
    <rect class="asr-metric-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="asr-metric-step" x="359" y="142">02</text>
    <text class="asr-metric-name" x="385" y="142">Gate staging below 1.0%</text>
    <text class="asr-metric-desc" x="359" y="166">A deploy above the threshold does not</text>
    <text class="asr-metric-desc" x="359" y="182">proceed.</text>
    <text class="asr-metric-edge" x="359" y="242">the gate</text>
  </g>
  <line class="asr-metric-line asr-metric-conn asr-metric-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#asr-metric-tip)"/>
  <g class="asr-metric-stage asr-metric-s2">
    <rect class="asr-metric-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="asr-metric-step" x="674" y="142">03</text>
    <text class="asr-metric-name" x="700" y="142">Track the trendline weekly</text>
    <text class="asr-metric-desc" x="674" y="166">"34.2% to 0.4%" is evidence a guardrail</text>
    <text class="asr-metric-desc" x="674" y="182">worked.</text>
    <text class="asr-metric-edge" x="674" y="242">evidence</text>
  </g>
  <text class="asr-metric-sub" x="30" y="304">Per-category rather than aggregate is the detail that makes it usable: a single ASR figure hides that toxicity fell while tool escalation rose, which is exactly the trade a guardrail change can make.</text>
</svg>
