<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What feature engineering does</title>
  <style>
    .fe-idea-bg   { fill: #f8fafc; }
    .fe-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fe-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fe-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fe-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fe-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fe-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fe-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fe-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fe-idea-stage { opacity: 1; }

    .fe-idea-s0 { animation-delay: 0.00s; }
    .fe-idea-e0 { animation-delay: 0.00s; }
    .fe-idea-s1 { animation-delay: 1.28s; }
    .fe-idea-e1 { animation-delay: 1.28s; }
    .fe-idea-s2 { animation-delay: 2.56s; }
    .fe-idea-e2 { animation-delay: 2.56s; }
    .fe-idea-s3 { animation-delay: 3.84s; }
    .fe-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fe-idea-conn  { animation: fe-idea-trace 6.4s ease-in-out infinite; }
      .fe-idea-stage { animation: fe-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fe-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fe-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fe-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fe-idea-stage { animation: fe-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fe-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fe-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fe-idea-bg" width="980" height="322"/>
  <text class="fe-idea-h1"  x="30" y="40">What feature engineering does</text>
  <text class="fe-idea-sub" x="30" y="64">Four steps.</text>
  <g class="fe-idea-stage fe-idea-s0">
    <rect class="fe-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fe-idea-step" x="44" y="142">01</text>
    <text class="fe-idea-name" x="70" y="142">The signal is present but not in a usable form</text>
    <text class="fe-idea-desc" x="44" y="166">Two dates, when what matters is</text>
    <text class="fe-idea-desc" x="44" y="182">the gap between them.</text>
  </g>
  <line class="fe-idea-line fe-idea-conn fe-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fe-idea-tip)"/>
  <g class="fe-idea-stage fe-idea-s1">
    <rect class="fe-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fe-idea-step" x="280" y="142">02</text>
    <text class="fe-idea-name" x="306" y="142">The model cannot construct it</text>
    <text class="fe-idea-desc" x="280" y="166">A tree splits on columns, never</text>
    <text class="fe-idea-desc" x="280" y="182">on their difference.</text>
  </g>
  <line class="fe-idea-line fe-idea-conn fe-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fe-idea-tip)"/>
  <g class="fe-idea-stage fe-idea-s2">
    <rect class="fe-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fe-idea-step" x="516" y="142">03</text>
    <text class="fe-idea-name" x="542" y="142">So compute it and supply it directly</text>
    <text class="fe-idea-desc" x="516" y="166">One new column.</text>
  </g>
  <line class="fe-idea-line fe-idea-conn fe-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fe-idea-tip)"/>
  <g class="fe-idea-stage fe-idea-s3">
    <rect class="fe-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fe-idea-step" x="752" y="142">04</text>
    <text class="fe-idea-name" x="778" y="142">And the model uses it immediately</text>
    <text class="fe-idea-desc" x="752" y="166">Often for a larger gain than any</text>
    <text class="fe-idea-desc" x="752" y="182">tuning.</text>
  </g>
  <text class="fe-idea-sub" x="30" y="304">The test for a worthwhile feature is whether the model could have derived it itself: differences, ratios and aggregations cannot be, which is why they pay.</text>
</svg>
