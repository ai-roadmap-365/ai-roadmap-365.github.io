<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Deciding what flows and what is held.">
  <title>A reservoir with sluice gates</title>
  <style>
    .reservoir-bg   { fill: #f8fafc; }
    .reservoir-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reservoir-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reservoir-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reservoir-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reservoir-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reservoir-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reservoir-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reservoir-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reservoir-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reservoir-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reservoir-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reservoir-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reservoir-row { opacity: 1; }
    .reservoir-r0 { animation-delay: 0.00s; }
    .reservoir-r1 { animation-delay: 0.45s; }
    .reservoir-r2 { animation-delay: 0.90s; }
    .reservoir-r3 { animation-delay: 1.35s; }
    .reservoir-r4 { animation-delay: 1.80s; }
    .reservoir-row { animation: reservoir-reveal 7.3s ease-in-out infinite; }
    @keyframes reservoir-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="reservoir-bg" width="980" height="390"/>
  <text class="reservoir-h1"  x="30" y="40">A reservoir with sluice gates</text>
  <text class="reservoir-sub" x="30" y="64">Deciding what flows and what is held.</text>
  <rect class="reservoir-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="reservoir-name" x="46" y="122">An open channel</text>
  <text class="reservoir-desc" x="46" y="142">Everything passes through.</text>
  <text class="reservoir-desc reservoir-row reservoir-r0" x="46" y="182">Water flows straight through</text>
  <text class="reservoir-desc reservoir-row reservoir-r1" x="46" y="216">Nothing is retained</text>
  <text class="reservoir-desc reservoir-row reservoir-r2" x="46" y="250">Yesterday's flow is entirely gone</text>
  <text class="reservoir-desc reservoir-row reservoir-r3" x="46" y="284">No control over what is kept</text>
  <text class="reservoir-desc reservoir-row reservoir-r4" x="46" y="318">This is vanilla recurrence</text>
  <rect class="reservoir-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="reservoir-name" x="526" y="122">A gated reservoir</text>
  <text class="reservoir-desc" x="526" y="142">Three controls.</text>
  <text class="reservoir-desc reservoir-row reservoir-r0" x="526" y="182">An outflow gate deciding what to release</text>
  <text class="reservoir-desc reservoir-row reservoir-r1" x="526" y="216">An inflow gate deciding what to admit</text>
  <text class="reservoir-desc reservoir-row reservoir-r2" x="526" y="250">The reservoir level persists between them</text>
  <text class="reservoir-desc reservoir-row reservoir-r3" x="526" y="284">Long-term storage, deliberately managed</text>
  <text class="reservoir-desc reservoir-row reservoir-r4" x="526" y="318">This is an LSTM cell</text>
  <text class="reservoir-sub" x="30" y="372">The reservoir level persisting is the cell state, and the reason it can hold information for hundreds of steps is that nothing forces it to be recomputed from scratch each time.</text>
</svg>
