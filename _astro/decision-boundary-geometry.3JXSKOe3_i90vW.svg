<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Decision Boundary Geometry">
  <title>Decision Boundary Geometry: Linear vs Polynomial</title>
  <defs>
    <style>
      .d156a-bg { fill: #f8fafc; }
      .d156a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d156a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d156a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
      .d156a-math { fill: #0f172a; font-family: "Courier New", monospace; font-size: 14px; font-weight: 600; }
      .d156a-line { stroke: #2563eb; stroke-width: 3; }
      .d156a-curve { stroke: #7c3aed; stroke-width: 3; fill: none; }
      .d156a-c0 { fill: #ef4444; }
      .d156a-c1 { fill: #10b981; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d156a-bg" />

  <text x="40" y="45" class="d156a-header" font-size="22">Decision Boundary Geometry in Feature Space</text>
  <text x="40" y="70" class="d156a-text">Comparing linear hyperplanes with non-linear polynomial boundaries</text>

  <!-- Panel 1: Linear Boundary -->
  <rect x="40" y="100" width="390" height="340" class="d156a-card" />
  <text x="60" y="130" class="d156a-header" font-size="16" fill="#1d4ed8">1. Linear Boundary (Raw Features)</text>
  <text x="60" y="155" class="d156a-math">w₁x₁ + w₂x₂ + b = 0</text>
  <text x="60" y="175" class="d156a-text" font-size="12" fill="#64748b">Slope: -w₁/w₂ | Intercept: -b/w₂</text>

  <!-- Coordinate axes 1 -->
  <line x1="80" y1="380" x2="380" y2="380" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="80" y1="380" x2="80" y2="200" stroke="#94a3b8" stroke-width="1.5" />
  <text x="360" y="400" class="d156a-text" font-size="12">x₁</text>
  <text x="60" y="210" class="d156a-text" font-size="12">x₂</text>

  <!-- Linear Separating Line -->
  <line x1="100" y1="370" x2="360" y2="220" class="d156a-line" />
  
  <!-- Points Class 0 -->
  <circle cx="140" cy="340" r="6" class="d156a-c0" />
  <circle cx="170" cy="360" r="6" class="d156a-c0" />
  <circle cx="210" cy="330" r="6" class="d156a-c0" />
  <circle cx="250" cy="350" r="6" class="d156a-c0" />

  <!-- Points Class 1 -->
  <circle cx="200" cy="240" r="6" class="d156a-c1" />
  <circle cx="240" cy="220" r="6" class="d156a-c1" />
  <circle cx="280" cy="250" r="6" class="d156a-c1" />
  <circle cx="320" cy="210" r="6" class="d156a-c1" />

  <text x="90" y="420" class="d156a-text" font-size="12" fill="#1e40af">Straight hyperplane dividing two half-spaces</text>

  <!-- Panel 2: Polynomial Boundary -->
  <rect x="470" y="100" width="390" height="340" class="d156a-card" />
  <text x="490" y="130" class="d156a-header" font-size="16" fill="#6d28d9">2. Quadratic Boundary (Expanded Features)</text>
  <text x="490" y="155" class="d156a-math" font-size="13">w₁x₁ + w₂x₂ + w₃x₁² + w₄x₁x₂ + w₅x₂² + b = 0</text>
  <text x="490" y="175" class="d156a-text" font-size="12" fill="#64748b">Conic section (ellipse / parabola in 2D)</text>

  <!-- Coordinate axes 2 -->
  <line x1="510" y1="380" x2="810" y2="380" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="510" y1="380" x2="510" y2="200" stroke="#94a3b8" stroke-width="1.5" />
  <text x="790" y="400" class="d156a-text" font-size="12">x₁</text>
  <text x="490" y="210" class="d156a-text" font-size="12">x₂</text>

  <!-- Curved Elliptical Boundary -->
  <ellipse cx="660" cy="290" rx="90" ry="60" class="d156a-curve" />

  <!-- Inner Points Class 1 -->
  <circle cx="640" cy="280" r="6" class="d156a-c1" />
  <circle cx="670" cy="290" r="6" class="d156a-c1" />
  <circle cx="660" cy="310" r="6" class="d156a-c1" />

  <!-- Outer Points Class 0 -->
  <circle cx="540" cy="230" r="6" class="d156a-c0" />
  <circle cx="780" cy="240" r="6" class="d156a-c0" />
  <circle cx="560" cy="360" r="6" class="d156a-c0" />
  <circle cx="760" cy="350" r="6" class="d156a-c0" />

  <text x="520" y="420" class="d156a-text" font-size="12" fill="#5b21b6">Linear in 5D space; non-linear enclosed boundary in 2D</text>
</svg>
