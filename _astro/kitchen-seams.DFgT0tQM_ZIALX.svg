<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The head chef's job is the seams.">
  <title>A kitchen where every station passed</title>
  <style>
    .kitchen-seams-bg   { fill: #f8fafc; }
    .kitchen-seams-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-seams-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-seams-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-seams-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-seams-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-seams-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-seams-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kitchen-seams-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kitchen-seams-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kitchen-seams-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kitchen-seams-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kitchen-seams-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-seams-row { opacity: 1; }
    .kitchen-seams-r0 { animation-delay: 0.00s; }
    .kitchen-seams-r1 { animation-delay: 0.45s; }
    .kitchen-seams-r2 { animation-delay: 0.90s; }
    .kitchen-seams-r3 { animation-delay: 1.35s; }
    .kitchen-seams-r4 { animation-delay: 1.80s; }
    .kitchen-seams-row { animation: kitchen-seams-reveal 7.3s ease-in-out infinite; }
    @keyframes kitchen-seams-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kitchen-seams-bg" width="980" height="390"/>
  <text class="kitchen-seams-h1"  x="30" y="40">A kitchen where every station passed</text>
  <text class="kitchen-seams-sub" x="30" y="64">The head chef's job is the seams.</text>
  <rect class="kitchen-seams-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-seams-name" x="46" y="122">Each station</text>
  <text class="kitchen-seams-desc" x="46" y="142">Inspected, and clean.</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r0" x="46" y="182">The prep station is clean</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r1" x="46" y="216">The grill runs at temperature</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r2" x="46" y="250">Each passes its own inspection</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r3" x="46" y="284">Nobody is doing anything wrong</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r4" x="46" y="318">And plates still go out wrong</text>
  <rect class="kitchen-seams-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-seams-name" x="526" y="122">The seams</text>
  <text class="kitchen-seams-desc" x="526" y="142">Three decisions.</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r0" x="526" y="182">Allergens labelled at prep, not at plating</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r1" x="526" y="216">By plating it is already in six dishes</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r2" x="526" y="250">One order ticket for the whole table</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r3" x="526" y="284">Rather than each station billing separately</text>
  <text class="kitchen-seams-desc kitchen-seams-row kitchen-seams-r4" x="526" y="318">And the pass is checked before the plate leaves</text>
  <text class="kitchen-seams-sub" x="30" y="372">All three kitchen decisions map exactly: redaction before indexing, one ledger per request, and verification at the end point rather than per station.</text>
</svg>
