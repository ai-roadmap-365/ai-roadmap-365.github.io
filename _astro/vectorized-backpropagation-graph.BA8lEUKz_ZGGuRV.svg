<svg role="img" aria-label="Vectorized backward propagation computational graph showing chain rule error flow from loss through hidden layers to weights" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Vectorized Backpropagation Computational Graph</title>
  <defs>
    <linearGradient id="bg200a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card200" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg200a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">VECTORIZED BACKPROPAGATION COMPUTATIONAL GRAPH</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Reverse-Mode Automatic Differentiation and Analytical Gradient Propagation</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card200)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Output Loss dL/dA^[L] -->
    <rect x="615" y="35" width="120" height="225" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="675" y="60" fill="#fb7185" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Loss Layer L</text>
    <text x="675" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">Loss L(A^[L], Y)</text>
    <rect x="625" y="110" width="100" height="70" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="675" y="135" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">dZ^[L]</text>
    <text x="675" y="155" fill="#cbd5e1" font-size="9" text-anchor="middle">= A^[L] - Y</text>

    <!-- Arrow backwards to Layer 2 -->
    <line x1="615" y1="145" x2="555" y2="145" stroke="#fb7185" stroke-width="2"/>
    <text x="585" y="135" fill="#fb7185" font-size="8" text-anchor="middle">dZ^[L]</text>

    <!-- Layer 2 Backward -->
    <rect x="395" y="35" width="160" height="225" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/>
    <text x="475" y="60" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Layer 2 Gradients</text>
    <text x="475" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">dW^[2] = (1/m) dZ^[2] (A^[1])^T</text>
    <text x="475" y="98" fill="#94a3b8" font-size="9" text-anchor="middle">db^[2] = (1/m) sum(dZ^[2])</text>
    <rect x="405" y="110" width="140" height="70" fill="#1e293b" stroke="#c084fc" rx="4"/>
    <text x="475" y="135" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">dA^[1]</text>
    <text x="475" y="155" fill="#cbd5e1" font-size="9" text-anchor="middle">= (W^[2])^T dZ^[2]</text>

    <!-- Arrow backwards to Layer 1 -->
    <line x1="395" y1="145" x2="335" y2="145" stroke="#c084fc" stroke-width="2"/>
    <text x="365" y="135" fill="#c084fc" font-size="8" text-anchor="middle">dA^[1]</text>

    <!-- Layer 1 Backward -->
    <rect x="175" y="35" width="160" height="225" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="255" y="60" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Layer 1 Gradients</text>
    <text x="255" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">dZ^[1] = dA^[1] * g&#39;(Z^[1])</text>
    <text x="255" y="98" fill="#94a3b8" font-size="9" text-anchor="middle">dW^[1] = (1/m) dZ^[1] X^T</text>
    <rect x="185" y="110" width="140" height="70" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="255" y="135" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Parameter Updates</text>
    <text x="255" y="155" fill="#cbd5e1" font-size="9" text-anchor="middle">W^[1] -= lr * dW^[1]</text>

    <!-- Input Node -->
    <rect x="25" y="35" width="120" height="225" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="85" y="60" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Input X</text>
    <text x="85" y="145" fill="#94a3b8" font-size="10" text-anchor="middle">Feature Matrix</text>
  </g>
</svg>
