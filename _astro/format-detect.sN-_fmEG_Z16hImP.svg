<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Detecting the format</title>
  <style>
    .format-detect-bg   { fill: #f8fafc; }
    .format-detect-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-detect-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-detect-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-detect-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-detect-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-detect-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .format-detect-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .format-detect-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .format-detect-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .format-detect-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .format-detect-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .format-detect-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .format-detect-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .format-detect-stage { opacity: 1; }

    .format-detect-s0 { animation-delay: 0.00s; }
    .format-detect-e0 { animation-delay: 0.00s; }
    .format-detect-s1 { animation-delay: 1.28s; }
    .format-detect-e1 { animation-delay: 1.28s; }
    .format-detect-s2 { animation-delay: 2.56s; }
    .format-detect-e2 { animation-delay: 2.56s; }
    .format-detect-s3 { animation-delay: 3.84s; }
    .format-detect-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .format-detect-conn  { animation: format-detect-trace 6.4s ease-in-out infinite; }
      .format-detect-stage { animation: format-detect-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes format-detect-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes format-detect-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .format-detect-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .format-detect-stage { animation: format-detect-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes format-detect-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="format-detect-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="format-detect-bg" width="980" height="322"/>
  <text class="format-detect-h1"  x="30" y="40">Detecting the format</text>
  <text class="format-detect-sub" x="30" y="64">Four steps.</text>
  <g class="format-detect-stage format-detect-s0">
    <rect class="format-detect-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="format-detect-step" x="44" y="142">01</text>
    <text class="format-detect-name" x="70" y="142">The extension is a claim, not a fact</text>
    <text class="format-detect-desc" x="44" y="166">Frequently wrong, and sometimes</text>
    <text class="format-detect-desc" x="44" y="182">hostile.</text>
  </g>
  <line class="format-detect-line format-detect-conn format-detect-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#format-detect-tip)"/>
  <g class="format-detect-stage format-detect-s1">
    <rect class="format-detect-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="format-detect-step" x="280" y="142">02</text>
    <text class="format-detect-name" x="306" y="142">Read the leading bytes instead</text>
    <text class="format-detect-desc" x="280" y="166">Which identify the actual</text>
    <text class="format-detect-desc" x="280" y="182">format.</text>
  </g>
  <line class="format-detect-line format-detect-conn format-detect-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#format-detect-tip)"/>
  <g class="format-detect-stage format-detect-s2">
    <rect class="format-detect-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="format-detect-step" x="516" y="142">03</text>
    <text class="format-detect-name" x="542" y="142">Dispatch to the right extractor</text>
    <text class="format-detect-desc" x="516" y="166">One per format, each with its</text>
    <text class="format-detect-desc" x="516" y="182">own failure modes.</text>
  </g>
  <line class="format-detect-line format-detect-conn format-detect-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#format-detect-tip)"/>
  <g class="format-detect-stage format-detect-s3">
    <rect class="format-detect-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="format-detect-step" x="752" y="142">04</text>
    <text class="format-detect-name" x="778" y="142">And route the unknown to review</text>
    <text class="format-detect-desc" x="752" y="166">Rather than to a parser that</text>
    <text class="format-detect-desc" x="752" y="182">will produce noise.</text>
  </g>
  <text class="format-detect-sub" x="30" y="304">Trusting the extension is also a security issue rather than only a correctness one, since a mislabelled file can reach a parser that was never meant to see it.</text>
</svg>
