<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920" role="img" font-family="system-ui, sans-serif">
  <title>The decision procedure before writing a scraper, as a flowchart: ask whether an API, a data dump or a feed exists; ask whether robots.txt allows the path; ask what the rate limit permits; ask whether personal data is involved — each question can end in do not scrape, and only a clear run through all four reaches scrape politely, which then loops over pages extracting fields and treating a missing element as an ordinary None</title>
  <rect x="0" y="0" width="900" height="920" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Before you write the scraper</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#1a202c">Four questions. Any one of them can end the project, and that is a good outcome.</text>

  <!-- Q1 -->
  <rect x="120" y="78" width="420" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="140" y="102" font-size="16" font-weight="bold" fill="#1a202c">1. Is there an API, a data dump, or a feed?</text>
  <text x="140" y="122" font-size="14" fill="#1a202c">Check /robots.txt for a Sitemap line, look for /api, an</text>
  <text x="140" y="139" font-size="14" fill="#1a202c">RSS link in the page head, a downloads page — or just ask.</text>
  <line x1="540" y1="113" x2="616" y2="113" stroke="#1a202c" stroke-width="2"/>
  <polygon points="620,113 606,107 606,119" fill="#1a202c"/>
  <text x="556" y="106" font-size="14" fill="#1d4ed8">yes</text>
  <rect x="620" y="86" width="230" height="54" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="735" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Use it. Stop here.</text>
  <text x="735" y="128" text-anchor="middle" font-size="14" fill="#1a202c">Stable, permitted, cheaper.</text>
  <text x="452" y="168" font-size="14" fill="#1a202c">no</text>
  <line x1="330" y1="148" x2="330" y2="172" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,176 324,162 336,162" fill="#1a202c"/>

  <!-- Q2 -->
  <rect x="120" y="176" width="420" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="140" y="200" font-size="16" font-weight="bold" fill="#1a202c">2. Does robots.txt allow this exact path?</text>
  <text x="140" y="220" font-size="14" fill="#1a202c">RobotFileParser.can_fetch(user_agent, url) — and read the</text>
  <text x="140" y="237" font-size="14" fill="#1a202c">terms of service yourself, because no library can read them.</text>
  <line x1="540" y1="211" x2="616" y2="211" stroke="#1a202c" stroke-width="2"/>
  <polygon points="620,211 606,205 606,217" fill="#1a202c"/>
  <text x="556" y="204" font-size="14" fill="#1d4ed8">no</text>
  <rect x="620" y="184" width="230" height="54" fill="#e2e8f0" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="735" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Do not scrape.</text>
  <text x="735" y="226" text-anchor="middle" font-size="14" fill="#1a202c">Ask the owner instead.</text>
  <text x="452" y="266" font-size="14" fill="#1a202c">yes</text>
  <line x1="330" y1="246" x2="330" y2="270" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,274 324,260 336,260" fill="#1a202c"/>

  <!-- Q3 -->
  <rect x="120" y="274" width="420" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="140" y="298" font-size="16" font-weight="bold" fill="#1a202c">3. What rate does the site permit?</text>
  <text x="140" y="318" font-size="14" fill="#1a202c">Crawl-delay if declared; otherwise pick a slow number and</text>
  <text x="140" y="335" font-size="14" fill="#1a202c">back off on 429 and 5xx. Their other users share that server.</text>
  <line x1="540" y1="309" x2="616" y2="309" stroke="#1a202c" stroke-width="2"/>
  <polygon points="620,309 606,303 606,315" fill="#1a202c"/>
  <text x="546" y="302" font-size="14" fill="#1d4ed8">too slow to be useful</text>
  <rect x="620" y="282" width="230" height="54" fill="#e2e8f0" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="735" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Do not scrape.</text>
  <text x="735" y="324" text-anchor="middle" font-size="14" fill="#1a202c">Ask for a bulk export.</text>
  <text x="452" y="364" font-size="14" fill="#1a202c">workable</text>
  <line x1="330" y1="344" x2="330" y2="368" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,372 324,358 336,358" fill="#1a202c"/>

  <!-- Q4 -->
  <rect x="120" y="372" width="420" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="140" y="396" font-size="16" font-weight="bold" fill="#1a202c">4. Is personal data involved?</text>
  <text x="140" y="416" font-size="14" fill="#1a202c">Names, photos, profiles, reviews, posts. Publicly visible is</text>
  <text x="140" y="433" font-size="14" fill="#1a202c">not the same as free to collect, store and republish.</text>
  <line x1="540" y1="407" x2="616" y2="407" stroke="#1a202c" stroke-width="2"/>
  <polygon points="620,407 606,401 606,413" fill="#1a202c"/>
  <text x="556" y="400" font-size="14" fill="#1d4ed8">yes</text>
  <rect x="620" y="380" width="230" height="54" fill="#e2e8f0" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="735" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Stop. Get advice.</text>
  <text x="735" y="422" text-anchor="middle" font-size="14" fill="#1a202c">Before the loop, not after.</text>
  <text x="452" y="462" font-size="14" fill="#1a202c">no</text>
  <line x1="330" y1="442" x2="330" y2="466" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,470 324,456 336,456" fill="#1a202c"/>

  <!-- Scrape politely -->
  <rect x="120" y="470" width="420" height="64" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="330" y="494" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Scrape politely</text>
  <text x="330" y="514" text-anchor="middle" font-size="14" fill="#1a202c">honest User-Agent with a contact address, a timeout,</text>
  <text x="330" y="529" text-anchor="middle" font-size="14" fill="#1a202c">a cache, and the smallest set of fields you actually need</text>
  <line x1="330" y1="534" x2="330" y2="558" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,562 324,548 336,562" fill="#1a202c"/>
  <polygon points="330,562 324,548 336,548" fill="#1a202c"/>

  <!-- Extraction loop -->
  <text x="60" y="590" font-size="16" font-weight="bold" fill="#1d4ed8">The extraction loop — and the one line where most scrapers crash</text>

  <rect x="120" y="602" width="420" height="52" fill="#f8fafc" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="140" y="624" font-size="15" font-weight="bold" fill="#1a202c">Fetch this page — from the cache if it is there</text>
  <text x="140" y="644" font-size="14" fill="#1a202c">otherwise wait the crawl delay, then request it once</text>
  <line x1="330" y1="654" x2="330" y2="676" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,680 324,666 336,666" fill="#1a202c"/>

  <rect x="120" y="680" width="420" height="52" fill="#f8fafc" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="140" y="702" font-size="15" font-weight="bold" fill="#1a202c">For each row: select_one(selector)</text>
  <text x="140" y="722" font-size="14" fill="#1a202c">never chain .text onto a lookup you have not checked</text>
  <line x1="330" y1="732" x2="330" y2="754" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,758 324,744 336,744" fill="#1a202c"/>

  <rect x="120" y="758" width="420" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="140" y="780" font-size="15" font-weight="bold" fill="#1a202c">Found nothing? That is None, not a crash</text>
  <text x="140" y="800" font-size="14" fill="#1a202c">record the field as missing and carry on to the next row</text>
  <line x1="560" y1="706" x2="596" y2="706" stroke="#1a202c" stroke-width="2"/>
  <text x="566" y="698" font-size="14" fill="#1a202c">found it</text>
  <rect x="600" y="680" width="250" height="52" fill="#f8fafc" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="725" y="702" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">get_text, then convert</text>
  <text x="725" y="722" text-anchor="middle" font-size="14" fill="#1a202c">strip whitespace, drop badges</text>
  <line x1="540" y1="784" x2="596" y2="784" stroke="#1a202c" stroke-width="2"/>
  <polygon points="600,784 586,778 586,790" fill="#1a202c"/>

  <rect x="600" y="758" width="250" height="52" fill="#f8fafc" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="725" y="780" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Is there a next page?</text>
  <text x="725" y="800" text-anchor="middle" font-size="14" fill="#1a202c">a.next missing means you are done</text>

  <!-- loop back -->
  <path d="M 850 784 L 878 784 L 878 628 L 546 628" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="542,628 556,622 556,634" fill="#1d4ed8"/>
  <text x="600" y="834" font-size="14" fill="#1d4ed8">yes — same site only, and stop if you have seen this URL before</text>

  <text x="60" y="866" font-size="14" fill="#1a202c">No next page: write the output with its provenance, and remember that this scraper is now yours to maintain.</text>
  <text x="60" y="888" font-size="14" fill="#1a202c">The page is a user interface. It will change without notice, and nobody owes you a deprecation notice for a div.</text>
  <text x="60" y="910" font-size="14" fill="#1a202c">Scrape the minimum you need. Every extra field is another thing that can break at three in the morning.</text>
</svg>
