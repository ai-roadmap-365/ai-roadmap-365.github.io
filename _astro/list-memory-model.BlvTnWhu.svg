<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" font-family="system-ui, sans-serif">
  <title>A Python list as a dynamic array of references: a variable points to an array of slots that hold references to value objects; aliasing shares one array while a copy makes a second array</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A list is a dynamic array of references</text>

  <!-- Panel 1: the array of references -->
  <text x="40" y="72" font-size="15" font-weight="bold" fill="#1d4ed8">nums = [10, 20, 30]</text>

  <!-- variable name -->
  <rect x="40" y="86" width="88" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="84" y="111" text-anchor="middle" font-size="15" fill="#1a202c">nums</text>
  <line x1="128" y1="106" x2="176" y2="106" stroke="#1a202c" stroke-width="2"/>
  <polygon points="176,106 164,100 164,112" fill="#1a202c"/>

  <!-- the array (contiguous slots), with one spare slot for capacity -->
  <rect x="180" y="86" width="360" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="360" y="76" text-anchor="middle" font-size="14" fill="#1a202c">one contiguous block of slots (indices 0, 1, 2 … + spare capacity)</text>
  <g font-size="14" fill="#1a202c">
    <rect x="192" y="98" width="72" height="36" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="228" y="121" text-anchor="middle">[0]</text>
    <rect x="272" y="98" width="72" height="36" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="308" y="121" text-anchor="middle">[1]</text>
    <rect x="352" y="98" width="72" height="36" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="388" y="121" text-anchor="middle">[2]</text>
    <rect x="432" y="98" width="96" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="480" y="121" text-anchor="middle" fill="#64748b">spare</text>
  </g>

  <!-- value objects the slots reference -->
  <g font-size="15" fill="#1a202c">
    <circle cx="228" cy="196" r="22" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
    <text x="228" y="201" text-anchor="middle">10</text>
    <circle cx="308" cy="196" r="22" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
    <text x="308" y="201" text-anchor="middle">20</text>
    <circle cx="388" cy="196" r="22" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
    <text x="388" y="201" text-anchor="middle">30</text>
  </g>
  <line x1="228" y1="134" x2="228" y2="172" stroke="#1a202c" stroke-width="2"/>
  <polygon points="228,172 222,160 234,160" fill="#1a202c"/>
  <line x1="308" y1="134" x2="308" y2="172" stroke="#1a202c" stroke-width="2"/>
  <polygon points="308,172 302,160 314,160" fill="#1a202c"/>
  <line x1="388" y1="134" x2="388" y2="172" stroke="#1a202c" stroke-width="2"/>
  <polygon points="388,172 382,160 394,160" fill="#1a202c"/>
  <text x="600" y="180" font-size="14" fill="#1a202c">Each slot holds a</text>
  <text x="600" y="199" font-size="14" fill="#1a202c">reference (an arrow),</text>
  <text x="600" y="218" font-size="14" fill="#1a202c">not the value itself.</text>

  <line x1="30" y1="250" x2="730" y2="250" stroke="#94a3b8" stroke-width="1"/>

  <!-- Panel 2: aliasing -->
  <text x="40" y="284" font-size="15" font-weight="bold" fill="#1d4ed8">b = a  →  aliasing (one list, two names)</text>
  <rect x="40" y="300" width="70" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="75" y="323" text-anchor="middle" font-size="15" fill="#1a202c">a</text>
  <rect x="40" y="360" width="70" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="75" y="383" text-anchor="middle" font-size="15" fill="#1a202c">b</text>
  <rect x="200" y="322" width="150" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="275" y="353" text-anchor="middle" font-size="14" fill="#1a202c">[1, 2, 3]</text>
  <line x1="110" y1="318" x2="198" y2="338" stroke="#1a202c" stroke-width="2"/>
  <polygon points="198,338 185,335 190,325" fill="#1a202c"/>
  <line x1="110" y1="378" x2="198" y2="358" stroke="#1a202c" stroke-width="2"/>
  <polygon points="198,358 190,371 185,361" fill="#1a202c"/>
  <text x="360" y="336" font-size="14" fill="#1a202c">b.append(4) changes</text>
  <text x="360" y="355" font-size="14" fill="#1a202c">the one shared list, so</text>
  <text x="360" y="374" font-size="14" fill="#1a202c">a is now [1, 2, 3, 4] too.</text>

  <!-- Panel 3: copy -->
  <text x="40" y="430" font-size="15" font-weight="bold" fill="#1d4ed8">c = a[:]  →  copy (a second list)</text>
  <rect x="40" y="446" width="70" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="75" y="469" text-anchor="middle" font-size="15" fill="#1a202c">a</text>
  <rect x="40" y="502" width="70" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="75" y="525" text-anchor="middle" font-size="15" fill="#1a202c">c</text>
  <rect x="200" y="446" width="150" height="40" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="275" y="471" text-anchor="middle" font-size="14" fill="#1a202c">[1, 2, 3]</text>
  <rect x="200" y="500" width="150" height="40" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="275" y="525" text-anchor="middle" font-size="14" fill="#1a202c">[1, 2, 3]</text>
  <line x1="110" y1="464" x2="198" y2="466" stroke="#1a202c" stroke-width="2"/>
  <polygon points="198,466 186,461 186,471" fill="#1a202c"/>
  <line x1="110" y1="520" x2="198" y2="520" stroke="#1a202c" stroke-width="2"/>
  <polygon points="198,520 186,515 186,525" fill="#1a202c"/>
  <text x="360" y="472" font-size="14" fill="#1a202c">c.append(4) changes only c;</text>
  <text x="360" y="491" font-size="14" fill="#1a202c">a stays [1, 2, 3]. A slice copy</text>
  <text x="360" y="510" font-size="14" fill="#1a202c">is shallow: the two outer lists</text>
  <text x="360" y="529" font-size="14" fill="#1a202c">differ, but nested lists are shared.</text>
</svg>
