<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four automated checks.">
  <title>Linting a prompt template</title>
  <style>
    .template-ci-bg   { fill: #f8fafc; }
    .template-ci-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-ci-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-ci-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-ci-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-ci-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-ci-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .template-ci-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .template-ci-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .template-ci-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .template-ci-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .template-ci-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .template-ci-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .template-ci-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .template-ci-stage { opacity: 1; }

    .template-ci-s0 { animation-delay: 0.00s; }
    .template-ci-e0 { animation-delay: 0.00s; }
    .template-ci-s1 { animation-delay: 1.28s; }
    .template-ci-e1 { animation-delay: 1.28s; }
    .template-ci-s2 { animation-delay: 2.56s; }
    .template-ci-e2 { animation-delay: 2.56s; }
    .template-ci-s3 { animation-delay: 3.84s; }
    .template-ci-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .template-ci-conn  { animation: template-ci-trace 6.4s ease-in-out infinite; }
      .template-ci-stage { animation: template-ci-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes template-ci-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes template-ci-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .template-ci-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .template-ci-stage { animation: template-ci-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes template-ci-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="template-ci-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="template-ci-bg" width="980" height="322"/>
  <text class="template-ci-h1"  x="30" y="40">Linting a prompt template</text>
  <text class="template-ci-sub" x="30" y="64">Four automated checks.</text>
  <g class="template-ci-stage template-ci-s0">
    <rect class="template-ci-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="template-ci-step" x="44" y="142">01</text>
    <text class="template-ci-name" x="70" y="142">Parse every template</text>
    <text class="template-ci-desc" x="44" y="166">So a syntax error fails the</text>
    <text class="template-ci-desc" x="44" y="182">build, not a request.</text>
  </g>
  <line class="template-ci-line template-ci-conn template-ci-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#template-ci-tip)"/>
  <g class="template-ci-stage template-ci-s1">
    <rect class="template-ci-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="template-ci-step" x="280" y="142">02</text>
    <text class="template-ci-name" x="306" y="142">Check that every variable is supplied</text>
    <text class="template-ci-desc" x="280" y="166">And that none supplied is</text>
    <text class="template-ci-desc" x="280" y="182">unused.</text>
  </g>
  <line class="template-ci-line template-ci-conn template-ci-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#template-ci-tip)"/>
  <g class="template-ci-stage template-ci-s2">
    <rect class="template-ci-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="template-ci-step" x="516" y="142">03</text>
    <text class="template-ci-name" x="542" y="142">Check the rendered token count</text>
    <text class="template-ci-desc" x="516" y="166">Against the budget, with</text>
    <text class="template-ci-desc" x="516" y="182">realistic inputs.</text>
  </g>
  <line class="template-ci-line template-ci-conn template-ci-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#template-ci-tip)"/>
  <g class="template-ci-stage template-ci-s3">
    <rect class="template-ci-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="template-ci-step" x="752" y="142">04</text>
    <text class="template-ci-name" x="778" y="142">Then run the evaluation set</text>
    <text class="template-ci-desc" x="752" y="166">Because a template that renders</text>
    <text class="template-ci-desc" x="752" y="182">is not a template that works.</text>
  </g>
  <text class="template-ci-sub" x="30" y="304">The first three are cheap and catch the embarrassing failures; the fourth is the expensive one and the only one that catches a change that renders perfectly and answers worse.</text>
</svg>
