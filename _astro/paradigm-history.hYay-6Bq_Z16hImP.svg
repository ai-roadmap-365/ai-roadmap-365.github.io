<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each opened a different door.">
  <title>Four steps across the paradigms</title>
  <style>
    .paradigm-history-bg   { fill: #f8fafc; }
    .paradigm-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .paradigm-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .paradigm-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .paradigm-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .paradigm-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .paradigm-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .paradigm-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .paradigm-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .paradigm-history-stage { opacity: 1; }

    .paradigm-history-s0 { animation-delay: 0.00s; }
    .paradigm-history-e0 { animation-delay: 0.00s; }
    .paradigm-history-s1 { animation-delay: 1.28s; }
    .paradigm-history-e1 { animation-delay: 1.28s; }
    .paradigm-history-s2 { animation-delay: 2.56s; }
    .paradigm-history-e2 { animation-delay: 2.56s; }
    .paradigm-history-s3 { animation-delay: 3.84s; }
    .paradigm-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .paradigm-history-conn  { animation: paradigm-history-trace 6.4s ease-in-out infinite; }
      .paradigm-history-stage { animation: paradigm-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes paradigm-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes paradigm-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .paradigm-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .paradigm-history-stage { animation: paradigm-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes paradigm-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="paradigm-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="paradigm-history-bg" width="980" height="322"/>
  <text class="paradigm-history-h1"  x="30" y="40">Four steps across the paradigms</text>
  <text class="paradigm-history-sub" x="30" y="64">Each opened a different door.</text>
  <g class="paradigm-history-stage paradigm-history-s0">
    <rect class="paradigm-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="paradigm-history-step" x="44" y="142">01</text>
    <text class="paradigm-history-name" x="70" y="142">Supervised learning came first</text>
    <text class="paradigm-history-desc" x="44" y="166">Because labelled data was how</text>
    <text class="paradigm-history-desc" x="44" y="182">problems were framed.</text>
  </g>
  <line class="paradigm-history-line paradigm-history-conn paradigm-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#paradigm-history-tip)"/>
  <g class="paradigm-history-stage paradigm-history-s1">
    <rect class="paradigm-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="paradigm-history-step" x="280" y="142">02</text>
    <text class="paradigm-history-name" x="306" y="142">Unsupervised methods addressed unlabelled data</text>
    <text class="paradigm-history-desc" x="280" y="166">Which is most data.</text>
  </g>
  <line class="paradigm-history-line paradigm-history-conn paradigm-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#paradigm-history-tip)"/>
  <g class="paradigm-history-stage paradigm-history-s2">
    <rect class="paradigm-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="paradigm-history-step" x="516" y="142">03</text>
    <text class="paradigm-history-name" x="542" y="142">Reinforcement learning addressed sequential decisions</text>
    <text class="paradigm-history-desc" x="516" y="166">Where no correct action is</text>
    <text class="paradigm-history-desc" x="516" y="182">known.</text>
  </g>
  <line class="paradigm-history-line paradigm-history-conn paradigm-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#paradigm-history-tip)"/>
  <g class="paradigm-history-stage paradigm-history-s3">
    <rect class="paradigm-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="paradigm-history-step" x="752" y="142">04</text>
    <text class="paradigm-history-name" x="778" y="142">And self-supervision unlocked the largest models</text>
    <text class="paradigm-history-desc" x="752" y="166">By manufacturing labels from raw</text>
    <text class="paradigm-history-desc" x="752" y="182">text.</text>
  </g>
  <text class="paradigm-history-sub" x="30" y="304">The fourth step is what made frontier models possible, and it works by turning the abundance of unlabelled data into a supervised problem.</text>
</svg>
