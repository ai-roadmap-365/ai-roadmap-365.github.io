<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Which indexes to create</title>
  <style>
    .index-choose-bg   { fill: #f8fafc; }
    .index-choose-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-choose-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-choose-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-choose-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-choose-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-choose-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-choose-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .index-choose-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .index-choose-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .index-choose-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .index-choose-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .index-choose-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .index-choose-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .index-choose-stage { opacity: 1; }

    .index-choose-s0 { animation-delay: 0.00s; }
    .index-choose-e0 { animation-delay: 0.00s; }
    .index-choose-s1 { animation-delay: 1.28s; }
    .index-choose-e1 { animation-delay: 1.28s; }
    .index-choose-s2 { animation-delay: 2.56s; }
    .index-choose-e2 { animation-delay: 2.56s; }
    .index-choose-s3 { animation-delay: 3.84s; }
    .index-choose-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .index-choose-conn  { animation: index-choose-trace 6.4s ease-in-out infinite; }
      .index-choose-stage { animation: index-choose-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes index-choose-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes index-choose-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .index-choose-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .index-choose-stage { animation: index-choose-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes index-choose-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="index-choose-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="index-choose-bg" width="980" height="322"/>
  <text class="index-choose-h1"  x="30" y="40">Which indexes to create</text>
  <text class="index-choose-sub" x="30" y="64">Four rules.</text>
  <g class="index-choose-stage index-choose-s0">
    <rect class="index-choose-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="index-choose-step" x="44" y="142">01</text>
    <text class="index-choose-name" x="70" y="142">Index the columns you filter on</text>
    <text class="index-choose-desc" x="44" y="166">Especially the selective ones.</text>
  </g>
  <line class="index-choose-line index-choose-conn index-choose-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#index-choose-tip)"/>
  <g class="index-choose-stage index-choose-s1">
    <rect class="index-choose-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="index-choose-step" x="280" y="142">02</text>
    <text class="index-choose-name" x="306" y="142">Index join keys on both sides</text>
    <text class="index-choose-desc" x="280" y="166">Which is where most time is</text>
    <text class="index-choose-desc" x="280" y="182">lost.</text>
  </g>
  <line class="index-choose-line index-choose-conn index-choose-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#index-choose-tip)"/>
  <g class="index-choose-stage index-choose-s2">
    <rect class="index-choose-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="index-choose-step" x="516" y="142">03</text>
    <text class="index-choose-name" x="542" y="142">Consider ordering columns, if you sort often</text>
    <text class="index-choose-desc" x="516" y="166">A sorted index removes the sort.</text>
  </g>
  <line class="index-choose-line index-choose-conn index-choose-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#index-choose-tip)"/>
  <g class="index-choose-stage index-choose-s3">
    <rect class="index-choose-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="index-choose-step" x="752" y="142">04</text>
    <text class="index-choose-name" x="778" y="142">And stop there — measure before adding more</text>
    <text class="index-choose-desc" x="752" y="166">Unused indexes cost writes for</text>
    <text class="index-choose-desc" x="752" y="182">nothing.</text>
  </g>
  <text class="index-choose-sub" x="30" y="304">Unused indexes are pure cost, and most databases can report which indexes have never been used, which makes them unusually easy to clean up.</text>
</svg>
