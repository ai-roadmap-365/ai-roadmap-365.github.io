<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each step fixed a failure of the one before it.">
  <title>Why OAuth had to be invented</title>
  <style>
    .password-to-delegation-bg   { fill: #f8fafc; }
    .password-to-delegation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .password-to-delegation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .password-to-delegation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .password-to-delegation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .password-to-delegation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .password-to-delegation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .password-to-delegation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .password-to-delegation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .password-to-delegation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .password-to-delegation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .password-to-delegation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .password-to-delegation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .password-to-delegation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .password-to-delegation-stage { opacity: 1; }

    .password-to-delegation-s0 { animation-delay: 0.00s; }
    .password-to-delegation-e0 { animation-delay: 0.00s; }
    .password-to-delegation-s1 { animation-delay: 1.28s; }
    .password-to-delegation-e1 { animation-delay: 1.28s; }
    .password-to-delegation-s2 { animation-delay: 2.56s; }
    .password-to-delegation-e2 { animation-delay: 2.56s; }
    .password-to-delegation-s3 { animation-delay: 3.84s; }
    .password-to-delegation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .password-to-delegation-conn  { animation: password-to-delegation-trace 6.4s ease-in-out infinite; }
      .password-to-delegation-stage { animation: password-to-delegation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes password-to-delegation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes password-to-delegation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .password-to-delegation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .password-to-delegation-stage { animation: password-to-delegation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes password-to-delegation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="password-to-delegation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="password-to-delegation-bg" width="980" height="322"/>
  <text class="password-to-delegation-h1"  x="30" y="40">Why OAuth had to be invented</text>
  <text class="password-to-delegation-sub" x="30" y="64">Each step fixed a failure of the one before it.</text>
  <g class="password-to-delegation-stage password-to-delegation-s0">
    <rect class="password-to-delegation-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="password-to-delegation-step" x="44" y="142">01</text>
    <text class="password-to-delegation-name" x="70" y="142">Give it your password</text>
    <text class="password-to-delegation-desc" x="44" y="166">The app can do everything you</text>
    <text class="password-to-delegation-desc" x="44" y="182">can, forever. Revoke only by</text>
    <text class="password-to-delegation-desc" x="44" y="198">changing the password.</text>
    <text class="password-to-delegation-edge" x="44" y="242">total access</text>
  </g>
  <line class="password-to-delegation-line password-to-delegation-conn password-to-delegation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#password-to-delegation-tip)"/>
  <g class="password-to-delegation-stage password-to-delegation-s1">
    <rect class="password-to-delegation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="password-to-delegation-step" x="280" y="142">02</text>
    <text class="password-to-delegation-name" x="306" y="142">Give it an API key</text>
    <text class="password-to-delegation-desc" x="280" y="166">Revocable without disturbing</text>
    <text class="password-to-delegation-desc" x="280" y="182">your login. Still your full</text>
    <text class="password-to-delegation-desc" x="280" y="198">permissions.</text>
    <text class="password-to-delegation-edge" x="280" y="242">revocable</text>
  </g>
  <line class="password-to-delegation-line password-to-delegation-conn password-to-delegation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#password-to-delegation-tip)"/>
  <g class="password-to-delegation-stage password-to-delegation-s2">
    <rect class="password-to-delegation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="password-to-delegation-step" x="516" y="142">03</text>
    <text class="password-to-delegation-name" x="542" y="142">Give it a scoped token</text>
    <text class="password-to-delegation-desc" x="516" y="166">Read photos, not delete them.</text>
    <text class="password-to-delegation-desc" x="516" y="182">The limit is visible and</text>
    <text class="password-to-delegation-desc" x="516" y="198">enforced.</text>
    <text class="password-to-delegation-edge" x="516" y="242">scoped</text>
  </g>
  <line class="password-to-delegation-line password-to-delegation-conn password-to-delegation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#password-to-delegation-tip)"/>
  <g class="password-to-delegation-stage password-to-delegation-s3">
    <rect class="password-to-delegation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="password-to-delegation-step" x="752" y="142">04</text>
    <text class="password-to-delegation-name" x="778" y="142">And never see your password</text>
    <text class="password-to-delegation-desc" x="752" y="166">You authenticate at the</text>
    <text class="password-to-delegation-desc" x="752" y="182">provider's own page. The app is</text>
    <text class="password-to-delegation-desc" x="752" y="198">never in the room.</text>
    <text class="password-to-delegation-edge" x="752" y="242">delegated</text>
  </g>
  <text class="password-to-delegation-sub" x="30" y="304">OAuth 1.0 came directly out of one concrete case: a photo-printing service that needed your photos and had no acceptable way to ask for them.</text>
</svg>
