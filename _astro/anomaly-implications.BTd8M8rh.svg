<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are operational.">
  <title>Four consequences of anomaly detection</title>
  <style>
    .anomaly-implications-bg   { fill: #f8fafc; }
    .anomaly-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .anomaly-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .anomaly-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .anomaly-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .anomaly-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .anomaly-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .anomaly-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .anomaly-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .anomaly-implications-stage { opacity: 1; }

    .anomaly-implications-s0 { animation-delay: 0.00s; }
    .anomaly-implications-e0 { animation-delay: 0.00s; }
    .anomaly-implications-s1 { animation-delay: 1.28s; }
    .anomaly-implications-e1 { animation-delay: 1.28s; }
    .anomaly-implications-s2 { animation-delay: 2.56s; }
    .anomaly-implications-e2 { animation-delay: 2.56s; }
    .anomaly-implications-s3 { animation-delay: 3.84s; }
    .anomaly-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .anomaly-implications-conn  { animation: anomaly-implications-trace 6.4s ease-in-out infinite; }
      .anomaly-implications-stage { animation: anomaly-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes anomaly-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes anomaly-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .anomaly-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .anomaly-implications-stage { animation: anomaly-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes anomaly-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="anomaly-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="anomaly-implications-bg" width="980" height="322"/>
  <text class="anomaly-implications-h1"  x="30" y="40">Four consequences of anomaly detection</text>
  <text class="anomaly-implications-sub" x="30" y="64">Two are operational.</text>
  <g class="anomaly-implications-stage anomaly-implications-s0">
    <rect class="anomaly-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-implications-step" x="44" y="142">01</text>
    <text class="anomaly-implications-name" x="70" y="142">It catches failures nobody anticipated</text>
    <text class="anomaly-implications-desc" x="44" y="166">Which is its main value.</text>
  </g>
  <line class="anomaly-implications-line anomaly-implications-conn anomaly-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#anomaly-implications-tip)"/>
  <g class="anomaly-implications-stage anomaly-implications-s1">
    <rect class="anomaly-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-implications-step" x="280" y="142">02</text>
    <text class="anomaly-implications-name" x="306" y="142">But most flags are benign</text>
    <text class="anomaly-implications-desc" x="280" y="166">So alert volume must be managed,</text>
    <text class="anomaly-implications-desc" x="280" y="182">or it is ignored.</text>
  </g>
  <line class="anomaly-implications-line anomaly-implications-conn anomaly-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#anomaly-implications-tip)"/>
  <g class="anomaly-implications-stage anomaly-implications-s2">
    <rect class="anomaly-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-implications-step" x="516" y="142">03</text>
    <text class="anomaly-implications-name" x="542" y="142">And normal drifts over time</text>
    <text class="anomaly-implications-desc" x="516" y="166">So the model of normality needs</text>
    <text class="anomaly-implications-desc" x="516" y="182">refreshing.</text>
  </g>
  <line class="anomaly-implications-line anomaly-implications-conn anomaly-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#anomaly-implications-tip)"/>
  <g class="anomaly-implications-stage anomaly-implications-s3">
    <rect class="anomaly-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-implications-step" x="752" y="142">04</text>
    <text class="anomaly-implications-name" x="778" y="142">While unusual can correlate with minority groups</text>
    <text class="anomaly-implications-desc" x="752" y="166">Which makes disparate flagging a</text>
    <text class="anomaly-implications-desc" x="752" y="182">real risk.</text>
  </g>
  <text class="anomaly-implications-sub" x="30" y="304">Disparate flagging is a genuine fairness concern here: a person whose behaviour is legitimately atypical is flagged repeatedly by a system that models the majority.</text>
</svg>
