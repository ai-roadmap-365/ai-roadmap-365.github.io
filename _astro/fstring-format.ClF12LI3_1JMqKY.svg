<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>The f-string format specification {value:>10.2f} broken into its fields — fill and align, width, precision, and type — with the resulting formatted output</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Reading an f-string format spec</text>

  <!-- The whole spec -->
  <text x="380" y="86" text-anchor="middle" font-size="26" font-family="ui-monospace, monospace" font-weight="bold" fill="#1a202c">f"{price:&gt;10.2f}"</text>
  <text x="380" y="112" text-anchor="middle" font-size="13" fill="#1a202c">value name, then a colon, then the format spec</text>

  <!-- Four field boxes -->
  <rect x="40" y="150" width="150" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="115" y="180" text-anchor="middle" font-size="22" font-family="ui-monospace, monospace" font-weight="bold" fill="#1a202c">&gt;</text>
  <text x="115" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">align</text>
  <text x="115" y="228" text-anchor="middle" font-size="12" fill="#1a202c">&gt; right, &lt; left, ^ center</text>

  <rect x="210" y="150" width="150" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="285" y="180" text-anchor="middle" font-size="22" font-family="ui-monospace, monospace" font-weight="bold" fill="#1a202c">10</text>
  <text x="285" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">width</text>
  <text x="285" y="228" text-anchor="middle" font-size="12" fill="#1a202c">min total characters</text>

  <rect x="380" y="150" width="150" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="455" y="180" text-anchor="middle" font-size="22" font-family="ui-monospace, monospace" font-weight="bold" fill="#1a202c">.2</text>
  <text x="455" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">precision</text>
  <text x="455" y="228" text-anchor="middle" font-size="12" fill="#1a202c">digits after the point</text>

  <rect x="550" y="150" width="150" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="625" y="180" text-anchor="middle" font-size="22" font-family="ui-monospace, monospace" font-weight="bold" fill="#1a202c">f</text>
  <text x="625" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">type</text>
  <text x="625" y="228" text-anchor="middle" font-size="12" fill="#1a202c">f fixed, d int, e sci, % pct</text>

  <!-- Worked result -->
  <rect x="40" y="290" width="680" height="130" fill="#f1f5f9" stroke="#1d4ed8" stroke-width="1.5" rx="10"/>
  <text x="380" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">With price = 7.5, the spec produces a right-aligned, 10-wide, 2-decimal field:</text>
  <text x="380" y="360" text-anchor="middle" font-size="22" font-family="ui-monospace, monospace" fill="#1a202c">|&#160;&#160;&#160;&#160;&#160;&#160;7.50|</text>
  <text x="380" y="388" text-anchor="middle" font-size="13" fill="#1a202c">six padding spaces + "7.50" = 10 characters between the bars</text>
  <text x="380" y="410" text-anchor="middle" font-size="13" fill="#1d4ed8">add a comma before the width — {price:&gt;12,.2f} — for a thousands separator</text>
</svg>
