<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each independently useful.">
  <title>Five components, one ecosystem</title>
  <style>
    .hf-components-bg   { fill: #f8fafc; }
    .hf-components-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-components-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-components-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-components-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-components-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-components-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hf-components-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hf-components-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hf-components-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hf-components-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hf-components-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hf-components-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hf-components-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hf-components-stage { opacity: 1; }

    .hf-components-s0 { animation-delay: 0.00s; }
    .hf-components-e0 { animation-delay: 0.00s; }
    .hf-components-s1 { animation-delay: 1.33s; }
    .hf-components-e1 { animation-delay: 1.33s; }
    .hf-components-s2 { animation-delay: 2.67s; }
    .hf-components-e2 { animation-delay: 2.67s; }
    .hf-components-s3 { animation-delay: 4.00s; }
    .hf-components-e3 { animation-delay: 4.00s; }
    .hf-components-s4 { animation-delay: 5.33s; }
    .hf-components-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .hf-components-conn  { animation: hf-components-trace 8s ease-in-out infinite; }
      .hf-components-stage { animation: hf-components-arrive 8s ease-in-out infinite; }
    }
    @keyframes hf-components-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hf-components-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hf-components-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hf-components-stage { animation: hf-components-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hf-components-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hf-components-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hf-components-bg" width="980" height="322"/>
  <text class="hf-components-h1"  x="30" y="40">Five components, one ecosystem</text>
  <text class="hf-components-sub" x="30" y="64">Each independently useful.</text>
  <g class="hf-components-stage hf-components-s0">
    <rect class="hf-components-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="hf-components-step" x="44" y="142">01</text>
    <text class="hf-components-name" x="70" y="142">A model hub</text>
    <text class="hf-components-desc" x="44" y="166">Hundreds of thousands of</text>
    <text class="hf-components-desc" x="44" y="182">pretrained checkpoints,</text>
    <text class="hf-components-desc" x="44" y="198">versioned and</text>
  </g>
  <line class="hf-components-line hf-components-conn hf-components-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#hf-components-tip)"/>
  <g class="hf-components-stage hf-components-s1">
    <rect class="hf-components-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="hf-components-step" x="233" y="142">02</text>
    <text class="hf-components-name" x="259" y="142">Auto classes</text>
    <text class="hf-components-desc" x="233" y="166">Resolve architecture from</text>
    <text class="hf-components-desc" x="233" y="182">the checkpoint's</text>
    <text class="hf-components-desc" x="233" y="198">configuration. One</text>
    <text class="hf-components-edge" x="233" y="242">interchangeable</text>
  </g>
  <line class="hf-components-line hf-components-conn hf-components-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#hf-components-tip)"/>
  <g class="hf-components-stage hf-components-s2">
    <rect class="hf-components-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="hf-components-step" x="422" y="142">03</text>
    <text class="hf-components-name" x="448" y="142">Fast tokenizers</text>
    <text class="hf-components-desc" x="422" y="166">Compiled implementations,</text>
    <text class="hf-components-desc" x="422" y="182">tokenising millions of</text>
    <text class="hf-components-desc" x="422" y="198">words per second.</text>
  </g>
  <line class="hf-components-line hf-components-conn hf-components-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#hf-components-tip)"/>
  <g class="hf-components-stage hf-components-s3">
    <rect class="hf-components-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="hf-components-step" x="611" y="142">04</text>
    <text class="hf-components-name" x="637" y="142">Memory-mapped datasets</text>
    <text class="hf-components-desc" x="611" y="166">Corpora larger than</text>
    <text class="hf-components-desc" x="611" y="182">memory, read without</text>
    <text class="hf-components-desc" x="611" y="198">loading.</text>
  </g>
  <line class="hf-components-line hf-components-conn hf-components-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#hf-components-tip)"/>
  <g class="hf-components-stage hf-components-s4">
    <rect class="hf-components-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="hf-components-step" x="800" y="142">05</text>
    <text class="hf-components-name" x="826" y="142">A training loop with best practices</text>
    <text class="hf-components-desc" x="800" y="166">Mixed precision,</text>
    <text class="hf-components-desc" x="800" y="182">distribution,</text>
    <text class="hf-components-desc" x="800" y="198">checkpointing,</text>
  </g>
  <text class="hf-components-sub" x="30" y="304">The auto classes are the piece that makes models interchangeable: switching architecture becomes a change of checkpoint name rather than a rewrite of the model code.</text>
</svg>
