<svg role="img" aria-label="BERT pretraining architecture diagram showing input tokens with CLS SEP and MASK tokens bidirectional self attention and dual MLM and NSP heads" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>BERT Pretraining Objectives: MLM and NSP</title>
  <defs>
    <linearGradient id="bg228a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card228" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg228a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BERT PRETRAINING: MASKED LM (MLM) &amp; NEXT SENTENCE PREDICTION (NSP)</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Devlin et al. (2018): Self-Supervised Bidirectional Contextual Representation Learning</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card228)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Top Output Heads -->
    <g transform="translate(40, 20)">
      <rect width="180" height="50" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
      <text x="90" y="42" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">NSP Binary Head</text>
      <text x="90" y="58" fill="#f8fafc" font-size="9" text-anchor="middle">IsNext: 99.4%</text>
    </g>

    <g transform="translate(380, 20)">
      <rect width="340" height="50" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
      <text x="170" y="42" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Masked Language Model (MLM) Head</text>
      <text x="170" y="58" fill="#f8fafc" font-size="9" text-anchor="middle">Predict [MASK] -> "bank" (CrossEntropy)</text>
    </g>

    <!-- Center: 12-Layer Bidirectional Transformer Encoder -->
    <rect x="40" y="90" width="680" height="95" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <text x="380" y="125" fill="#38bdf8" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">BERT-Base: 12 Transformer Encoder Layers (L=12, H=768, A=12, 110M Params)</text>
    <text x="380" y="150" fill="#94a3b8" font-size="11" text-anchor="middle">Full Bidirectional (All-to-All) Self-Attention Across Entire Document Context</text>

    <!-- Bottom: Input Tokens with Segment and Position Embeddings -->
    <g transform="translate(40, 205)">
      <!-- [CLS] Token -->
      <rect x="0" y="0" width="85" height="70" fill="#1e293b" stroke="#f43f5e" rx="4"/>
      <text x="42" y="25" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">[CLS]</text>
      <text x="42" y="45" fill="#cbd5e1" font-size="8" text-anchor="middle">Seg A / Pos 0</text>
      <text x="42" y="60" fill="#94a3b8" font-size="7" text-anchor="middle">Doc Vector</text>

      <!-- Token 1 -->
      <rect x="95" y="0" width="95" height="70" fill="#1e293b" stroke="#38bdf8" rx="4"/>
      <text x="142" y="25" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">"The"</text>
      <text x="142" y="45" fill="#cbd5e1" font-size="8" text-anchor="middle">Seg A / Pos 1</text>

      <!-- Token 2: [MASK] -->
      <rect x="200" y="0" width="115" height="70" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="4"/>
      <text x="257" y="25" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">[MASK]</text>
      <text x="257" y="45" fill="#cbd5e1" font-size="8" text-anchor="middle">Seg A / Pos 2</text>
      <text x="257" y="60" fill="#a7f3d0" font-size="7" text-anchor="middle">(Was: "bank")</text>

      <!-- Token 3 -->
      <rect x="325" y="0" width="95" height="70" fill="#1e293b" stroke="#38bdf8" rx="4"/>
      <text x="372" y="25" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">"robbed"</text>
      <text x="372" y="45" fill="#cbd5e1" font-size="8" text-anchor="middle">Seg A / Pos 3</text>

      <!-- [SEP] Token -->
      <rect x="430" y="0" width="85" height="70" fill="#1e293b" stroke="#fbbf24" rx="4"/>
      <text x="472" y="25" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">[SEP]</text>
      <text x="472" y="45" fill="#cbd5e1" font-size="8" text-anchor="middle">Divider</text>

      <!-- Token 4 (Sentence B) -->
      <rect x="525" y="0" width="150" height="70" fill="#1e293b" stroke="#a855f7" rx="4"/>
      <text x="600" y="25" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">"Police arrived."</text>
      <text x="600" y="45" fill="#cbd5e1" font-size="8" text-anchor="middle">Seg B / Pos 5-6</text>
    </g>

    <!-- Connectors -->
    <line x1="130" y1="90" x2="130" y2="70" stroke="#f43f5e" stroke-width="2"/>
    <line x1="550" y1="90" x2="550" y2="70" stroke="#10b981" stroke-width="2"/>
  </g>
</svg>
