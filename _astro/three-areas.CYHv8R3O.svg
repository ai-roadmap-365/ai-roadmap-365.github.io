<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" font-family="system-ui, sans-serif">
  <title>Git's three areas and the commands that move a file between them: working directory, staging area, and repository</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The three areas of a Git project</text>

  <!-- Working directory -->
  <rect x="30" y="90" width="200" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="130" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Working directory</text>
  <text x="130" y="146" text-anchor="middle" font-size="14" fill="#1a202c">the files you edit</text>
  <text x="130" y="166" text-anchor="middle" font-size="14" fill="#1a202c">on disk right now</text>
  <text x="130" y="210" text-anchor="middle" font-size="14" fill="#1a202c">notes.txt (modified)</text>

  <!-- Staging area -->
  <rect x="280" y="90" width="200" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="380" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Staging area</text>
  <text x="380" y="146" text-anchor="middle" font-size="14" fill="#1a202c">(the index):</text>
  <text x="380" y="166" text-anchor="middle" font-size="14" fill="#1a202c">the next snapshot,</text>
  <text x="380" y="186" text-anchor="middle" font-size="14" fill="#1a202c">assembled on purpose</text>
  <text x="380" y="216" text-anchor="middle" font-size="14" fill="#1a202c">notes.txt (staged)</text>

  <!-- Repository -->
  <rect x="530" y="90" width="200" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="630" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Repository</text>
  <text x="630" y="146" text-anchor="middle" font-size="14" fill="#1a202c">the .git directory:</text>
  <text x="630" y="166" text-anchor="middle" font-size="14" fill="#1a202c">permanent history</text>
  <text x="630" y="186" text-anchor="middle" font-size="14" fill="#1a202c">of committed snapshots</text>
  <text x="630" y="216" text-anchor="middle" font-size="14" fill="#1a202c">commit chain</text>

  <!-- git add arrow -->
  <line x1="230" y1="150" x2="272" y2="150" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="280,150 266,143 266,157" fill="#1d4ed8"/>
  <text x="255" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">git add</text>

  <!-- git commit arrow -->
  <line x1="480" y1="150" x2="522" y2="150" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="530,150 516,143 516,157" fill="#1d4ed8"/>
  <text x="505" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">git commit</text>

  <!-- git status spans working + staging -->
  <text x="255" y="270" text-anchor="middle" font-size="14" fill="#1a202c">git status compares all three · git diff shows what changed</text>

  <!-- git checkout / restore back arrow (informational) -->
  <path d="M 630 240 C 630 300, 130 300, 130 250" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="130,242 123,256 137,256" fill="#1d4ed8"/>
  <text x="380" y="300" text-anchor="middle" font-size="14" fill="#1a202c">git checkout / restore brings a committed version back into your working directory</text>

  <!-- Note box -->
  <rect x="30" y="330" width="700" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="380" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">The staging area is what makes Git deliberate</text>
  <text x="380" y="378" text-anchor="middle" font-size="14" fill="#1a202c">You choose exactly which changes enter the next commit — you edit freely, then curate a clean snapshot.</text>
</svg>
