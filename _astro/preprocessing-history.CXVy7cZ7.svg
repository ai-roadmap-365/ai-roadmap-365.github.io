<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward pipelines.">
  <title>Four steps in preprocessing practice</title>
  <style>
    .preprocessing-history-bg   { fill: #f8fafc; }
    .preprocessing-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .preprocessing-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .preprocessing-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .preprocessing-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .preprocessing-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .preprocessing-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .preprocessing-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .preprocessing-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .preprocessing-history-stage { opacity: 1; }

    .preprocessing-history-s0 { animation-delay: 0.00s; }
    .preprocessing-history-e0 { animation-delay: 0.00s; }
    .preprocessing-history-s1 { animation-delay: 1.28s; }
    .preprocessing-history-e1 { animation-delay: 1.28s; }
    .preprocessing-history-s2 { animation-delay: 2.56s; }
    .preprocessing-history-e2 { animation-delay: 2.56s; }
    .preprocessing-history-s3 { animation-delay: 3.84s; }
    .preprocessing-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .preprocessing-history-conn  { animation: preprocessing-history-trace 6.4s ease-in-out infinite; }
      .preprocessing-history-stage { animation: preprocessing-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes preprocessing-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes preprocessing-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .preprocessing-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .preprocessing-history-stage { animation: preprocessing-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes preprocessing-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="preprocessing-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="preprocessing-history-bg" width="980" height="322"/>
  <text class="preprocessing-history-h1"  x="30" y="40">Four steps in preprocessing practice</text>
  <text class="preprocessing-history-sub" x="30" y="64">Toward pipelines.</text>
  <g class="preprocessing-history-stage preprocessing-history-s0">
    <rect class="preprocessing-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="preprocessing-history-step" x="44" y="142">01</text>
    <text class="preprocessing-history-name" x="70" y="142">Transformations written by hand, per project</text>
    <text class="preprocessing-history-desc" x="44" y="166">And frequently applied</text>
    <text class="preprocessing-history-desc" x="44" y="182">inconsistently.</text>
  </g>
  <line class="preprocessing-history-line preprocessing-history-conn preprocessing-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#preprocessing-history-tip)"/>
  <g class="preprocessing-history-stage preprocessing-history-s1">
    <rect class="preprocessing-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="preprocessing-history-step" x="280" y="142">02</text>
    <text class="preprocessing-history-name" x="306" y="142">Library functions standardised them</text>
    <text class="preprocessing-history-desc" x="280" y="166">But left the ordering to the</text>
    <text class="preprocessing-history-desc" x="280" y="182">practitioner.</text>
  </g>
  <line class="preprocessing-history-line preprocessing-history-conn preprocessing-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#preprocessing-history-tip)"/>
  <g class="preprocessing-history-stage preprocessing-history-s2">
    <rect class="preprocessing-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="preprocessing-history-step" x="516" y="142">03</text>
    <text class="preprocessing-history-name" x="542" y="142">Pipeline objects bound them to the model</text>
    <text class="preprocessing-history-desc" x="516" y="166">Which made the correct order the</text>
    <text class="preprocessing-history-desc" x="516" y="182">default.</text>
  </g>
  <line class="preprocessing-history-line preprocessing-history-conn preprocessing-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#preprocessing-history-tip)"/>
  <g class="preprocessing-history-stage preprocessing-history-s3">
    <rect class="preprocessing-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="preprocessing-history-step" x="752" y="142">04</text>
    <text class="preprocessing-history-name" x="778" y="142">And modern models handle much of it natively</text>
    <text class="preprocessing-history-desc" x="752" y="166">Categorical features and missing</text>
    <text class="preprocessing-history-desc" x="752" y="182">values especially.</text>
  </g>
  <text class="preprocessing-history-sub" x="30" y="304">Pipeline objects were the decisive step because they made leakage structurally harder rather than merely discouraged, which is the general lesson of this session.</text>
</svg>
