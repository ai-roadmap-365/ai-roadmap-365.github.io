<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the damage is not symmetrical.">
  <title>Processing is not chunking</title>
  <style>
    .processing-not-chunking-bg   { fill: #f8fafc; }
    .processing-not-chunking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-not-chunking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-not-chunking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-not-chunking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-not-chunking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-not-chunking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .processing-not-chunking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .processing-not-chunking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .processing-not-chunking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .processing-not-chunking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .processing-not-chunking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .processing-not-chunking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .processing-not-chunking-row { opacity: 1; }
    .processing-not-chunking-r0 { animation-delay: 0.00s; }
    .processing-not-chunking-r1 { animation-delay: 0.45s; }
    .processing-not-chunking-r2 { animation-delay: 0.90s; }
    .processing-not-chunking-r3 { animation-delay: 1.35s; }
    .processing-not-chunking-r4 { animation-delay: 1.80s; }
    .processing-not-chunking-row { animation: processing-not-chunking-reveal 7.3s ease-in-out infinite; }
    @keyframes processing-not-chunking-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="processing-not-chunking-bg" width="980" height="390"/>
  <text class="processing-not-chunking-h1"  x="30" y="40">Processing is not chunking</text>
  <text class="processing-not-chunking-sub" x="30" y="64">And the damage is not symmetrical.</text>
  <rect class="processing-not-chunking-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="processing-not-chunking-name" x="46" y="122">Processing</text>
  <text class="processing-not-chunking-desc" x="46" y="142">Obtaining clean text.</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r0" x="46" y="182">Format detection and extraction</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r1" x="46" y="216">Quality scoring</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r2" x="46" y="250">Resource budgets</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r3" x="46" y="284">Corrupted output is not recoverable downstream</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r4" x="46" y="318">The damage is upstream and invisible</text>
  <rect class="processing-not-chunking-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="processing-not-chunking-name" x="526" y="122">Chunking</text>
  <text class="processing-not-chunking-desc" x="526" y="142">Dividing clean text.</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r0" x="526" y="182">Splitting strategy and overlap</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r1" x="526" y="216">Cheap to change</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r2" x="526" y="250">Cheap to re-run</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r3" x="526" y="284">Bad chunking is recoverable — re-chunk</text>
  <text class="processing-not-chunking-desc processing-not-chunking-row processing-not-chunking-r4" x="526" y="318">Provided the text was right</text>
  <text class="processing-not-chunking-sub" x="30" y="372">The asymmetry is the point: chunking excellent text badly costs a re-run, and chunking corrupted text produces well-formed chunks of nonsense that nothing downstream can detect.</text>
</svg>
