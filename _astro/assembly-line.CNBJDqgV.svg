<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each station transforms what it receives.">
  <title>An assembly line</title>
  <style>
    .assembly-line-bg   { fill: #f8fafc; }
    .assembly-line-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assembly-line-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assembly-line-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assembly-line-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assembly-line-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assembly-line-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assembly-line-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assembly-line-row { opacity: 1; }
    .assembly-line-r0 { animation-delay: 0.00s; }
    .assembly-line-r1 { animation-delay: 0.45s; }
    .assembly-line-r2 { animation-delay: 0.90s; }
    .assembly-line-r3 { animation-delay: 1.35s; }
    .assembly-line-r4 { animation-delay: 1.80s; }
    .assembly-line-row { animation: assembly-line-reveal 7.3s ease-in-out infinite; }
    @keyframes assembly-line-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="assembly-line-bg" width="980" height="390"/>
  <text class="assembly-line-h1"  x="30" y="40">An assembly line</text>
  <text class="assembly-line-sub" x="30" y="64">Each station transforms what it receives.</text>
  <rect class="assembly-line-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="assembly-line-name" x="46" y="122">The line</text>
  <text class="assembly-line-desc" x="46" y="142">Four stations.</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r0" x="46" y="182">Raw steel arrives at the dock</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r1" x="46" y="216">Stamping shapes it into a chassis</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r2" x="46" y="250">Assembly adds engine and wiring</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r3" x="46" y="284">Paint and diagnostics finish it</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r4" x="46" y="318">Inspection measures against the blueprint</text>
  <rect class="assembly-line-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="assembly-line-name" x="526" y="122">The network</text>
  <text class="assembly-line-desc" x="526" y="142">The same four.</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r0" x="526" y="182">Input features arrive</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r1" x="526" y="216">Layer one produces a first representation</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r2" x="526" y="250">Layer two builds on it</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r3" x="526" y="284">The output layer produces a prediction</text>
  <text class="assembly-line-desc assembly-line-row assembly-line-r4" x="526" y="318">The loss measures the deviation</text>
  <text class="assembly-line-sub" x="30" y="372">Each station receives only what the previous one produced, which is exactly the property that makes both the assembly line and the forward pass parallelisable across many items at once.</text>
</svg>
