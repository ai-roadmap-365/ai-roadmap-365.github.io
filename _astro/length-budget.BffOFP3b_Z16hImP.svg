<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Length budgeting</title>
  <style>
    .length-budget-bg   { fill: #f8fafc; }
    .length-budget-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .length-budget-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .length-budget-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .length-budget-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .length-budget-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .length-budget-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .length-budget-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .length-budget-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .length-budget-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .length-budget-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .length-budget-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .length-budget-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .length-budget-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .length-budget-stage { opacity: 1; }

    .length-budget-s0 { animation-delay: 0.00s; }
    .length-budget-e0 { animation-delay: 0.00s; }
    .length-budget-s1 { animation-delay: 1.28s; }
    .length-budget-e1 { animation-delay: 1.28s; }
    .length-budget-s2 { animation-delay: 2.56s; }
    .length-budget-e2 { animation-delay: 2.56s; }
    .length-budget-s3 { animation-delay: 3.84s; }
    .length-budget-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .length-budget-conn  { animation: length-budget-trace 6.4s ease-in-out infinite; }
      .length-budget-stage { animation: length-budget-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes length-budget-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes length-budget-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .length-budget-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .length-budget-stage { animation: length-budget-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes length-budget-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="length-budget-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="length-budget-bg" width="980" height="322"/>
  <text class="length-budget-h1"  x="30" y="40">Length budgeting</text>
  <text class="length-budget-sub" x="30" y="64">Four steps.</text>
  <g class="length-budget-stage length-budget-s0">
    <rect class="length-budget-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="length-budget-step" x="44" y="142">01</text>
    <text class="length-budget-name" x="70" y="142">Measure the token length of every example</text>
    <text class="length-budget-desc" x="44" y="166">Before configuring anything.</text>
  </g>
  <line class="length-budget-line length-budget-conn length-budget-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#length-budget-tip)"/>
  <g class="length-budget-stage length-budget-s1">
    <rect class="length-budget-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="length-budget-step" x="280" y="142">02</text>
    <text class="length-budget-name" x="306" y="142">The distribution has a long tail</text>
    <text class="length-budget-desc" x="280" y="166">A few examples many times the</text>
    <text class="length-budget-desc" x="280" y="182">median.</text>
  </g>
  <line class="length-budget-line length-budget-conn length-budget-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#length-budget-tip)"/>
  <g class="length-budget-stage length-budget-s2">
    <rect class="length-budget-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="length-budget-step" x="516" y="142">03</text>
    <text class="length-budget-name" x="542" y="142">Set the cutoff at a high percentile</text>
    <text class="length-budget-desc" x="516" y="166">Not at the maximum, which one</text>
    <text class="length-budget-desc" x="516" y="182">outlier sets.</text>
  </g>
  <line class="length-budget-line length-budget-conn length-budget-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#length-budget-tip)"/>
  <g class="length-budget-stage length-budget-s3">
    <rect class="length-budget-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="length-budget-step" x="752" y="142">04</text>
    <text class="length-budget-name" x="778" y="142">Because memory scales with the longest in a batch</text>
    <text class="length-budget-desc" x="752" y="166">So one long example sizes the</text>
    <text class="length-budget-desc" x="752" y="182">whole run.</text>
  </g>
  <text class="length-budget-sub" x="30" y="304">Sizing to the maximum rather than a percentile is how a run that would have fit comfortably runs out of memory on a single pathological example.</text>
</svg>
