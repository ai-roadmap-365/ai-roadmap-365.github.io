<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 860" role="img" font-family="system-ui, sans-serif">
  <title>One scheduled invocation, step by step: the scheduler fires, the job tries to take a non-blocking lock and exits 75 if another copy holds it, sets up the environment the scheduler did not give it, runs the work under a timeout that branches to success, failure or exit 124, writes one structured log line and a heartbeat on success only, and exits with a meaningful code — while a separate watchdog process reads that heartbeat on its own schedule and alerts when an expected success never arrives</title>
  <rect x="0" y="0" width="980" height="860" fill="#f8fafc"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One scheduled run, from trigger to exit code — and the watchdog beside it</text>

  <!-- Main column -->
  <rect x="180" y="56" width="380" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="370" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1 · The scheduler fires</text>
  <text x="370" y="99" text-anchor="middle" font-size="14" fill="#1a202c">cron, launchd or a systemd timer starts the command</text>
  <line x1="370" y1="108" x2="370" y2="130" stroke="#1a202c" stroke-width="2"/>
  <polygon points="370,138 365,128 375,128" fill="#1a202c"/>

  <!-- Lock decision -->
  <polygon points="370,140 560,190 370,240 180,190" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="370" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2 · Take the lock?</text>
  <text x="370" y="204" text-anchor="middle" font-size="14" fill="#1a202c">flock, LOCK_EX and LOCK_NB</text>

  <!-- Already running branch -->
  <line x1="560" y1="190" x2="660" y2="190" stroke="#1a202c" stroke-width="2"/>
  <polygon points="668,190 658,185 658,195" fill="#1a202c"/>
  <text x="610" y="180" text-anchor="middle" font-size="14" fill="#1d4ed8">held</text>
  <rect x="668" y="158" width="286" height="64" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="811" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">exit 75 · already running</text>
  <text x="811" y="200" text-anchor="middle" font-size="14" fill="#1a202c">no work done, one log line written,</text>
  <text x="811" y="216" text-anchor="middle" font-size="14" fill="#1a202c">no heartbeat, nothing corrupted</text>

  <line x1="370" y1="240" x2="370" y2="264" stroke="#1a202c" stroke-width="2"/>
  <polygon points="370,272 365,262 375,262" fill="#1a202c"/>
  <text x="392" y="258" font-size="14" fill="#1d4ed8">free</text>

  <!-- Environment -->
  <rect x="180" y="274" width="380" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="370" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3 · Set up what the scheduler did not give you</text>
  <text x="370" y="318" text-anchor="middle" font-size="14" fill="#1a202c">PATH · working directory · TZ · configuration</text>
  <text x="370" y="338" text-anchor="middle" font-size="14" fill="#1a202c">skip this and it works in your terminal only</text>
  <line x1="370" y1="350" x2="370" y2="372" stroke="#1a202c" stroke-width="2"/>
  <polygon points="370,380 365,370 375,370" fill="#1a202c"/>

  <!-- Idempotence check -->
  <rect x="180" y="382" width="380" height="66" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="370" y="406" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4 · Has this unit of work already been done?</text>
  <text x="370" y="426" text-anchor="middle" font-size="14" fill="#1a202c">if yes: record it, exit 0. A no-op is a success,</text>
  <text x="370" y="442" text-anchor="middle" font-size="14" fill="#1a202c">not something to alert on.</text>
  <line x1="370" y1="448" x2="370" y2="470" stroke="#1a202c" stroke-width="2"/>
  <polygon points="370,478 365,468 375,468" fill="#1a202c"/>

  <!-- Work under timeout -->
  <rect x="180" y="480" width="380" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="370" y="504" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5 · Do the work, under a time budget</text>
  <text x="370" y="524" text-anchor="middle" font-size="14" fill="#1a202c">write output atomically: temporary name, then rename</text>
  <text x="370" y="544" text-anchor="middle" font-size="14" fill="#1a202c">so a crash cannot leave a file that looks finished</text>

  <!-- Three outcomes -->
  <line x1="370" y1="552" x2="370" y2="576" stroke="#1a202c" stroke-width="2"/>
  <line x1="150" y1="576" x2="590" y2="576" stroke="#1a202c" stroke-width="2"/>
  <line x1="150" y1="576" x2="150" y2="600" stroke="#1a202c" stroke-width="2"/>
  <line x1="370" y1="576" x2="370" y2="600" stroke="#1a202c" stroke-width="2"/>
  <line x1="590" y1="576" x2="590" y2="600" stroke="#1a202c" stroke-width="2"/>
  <polygon points="150,608 145,598 155,598" fill="#1a202c"/>
  <polygon points="370,608 365,598 375,598" fill="#1a202c"/>
  <polygon points="590,608 585,598 595,598" fill="#1a202c"/>

  <rect x="42" y="610" width="216" height="72" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="634" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">it finished</text>
  <text x="150" y="654" text-anchor="middle" font-size="14" fill="#1a202c">exit 0 · write heartbeat</text>
  <text x="150" y="672" text-anchor="middle" font-size="14" fill="#1d4ed8">the only branch that does</text>

  <rect x="262" y="610" width="216" height="72" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="370" y="634" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">it raised</text>
  <text x="370" y="654" text-anchor="middle" font-size="14" fill="#1a202c">exit 1 · no heartbeat</text>
  <text x="370" y="672" text-anchor="middle" font-size="14" fill="#1a202c">retry only if idempotent</text>

  <rect x="482" y="610" width="216" height="72" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="590" y="634" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">it overran</text>
  <text x="590" y="654" text-anchor="middle" font-size="14" fill="#1a202c">exit 124 · no heartbeat</text>
  <text x="590" y="672" text-anchor="middle" font-size="14" fill="#1a202c">the lock is released</text>

  <!-- Log and release -->
  <line x1="150" y1="682" x2="150" y2="700" stroke="#1a202c" stroke-width="2"/>
  <line x1="370" y1="682" x2="370" y2="700" stroke="#1a202c" stroke-width="2"/>
  <line x1="590" y1="682" x2="590" y2="700" stroke="#1a202c" stroke-width="2"/>
  <line x1="150" y1="700" x2="590" y2="700" stroke="#1a202c" stroke-width="2"/>
  <line x1="370" y1="700" x2="370" y2="716" stroke="#1a202c" stroke-width="2"/>
  <polygon points="370,724 365,714 375,714" fill="#1a202c"/>

  <rect x="180" y="726" width="380" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="370" y="750" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">6 · Log one line, release the lock, exit</text>
  <text x="370" y="770" text-anchor="middle" font-size="14" fill="#1a202c">run id · status · duration · exit code · context</text>
  <text x="370" y="790" text-anchor="middle" font-size="14" fill="#1a202c">the lock is released however the run ended</text>

  <!-- Watchdog column -->
  <rect x="668" y="274" width="286" height="288" fill="#ffffff" stroke="#1a202c" stroke-width="3" rx="10"/>
  <text x="811" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The watchdog — a separate run</text>
  <text x="811" y="324" text-anchor="middle" font-size="14" fill="#1a202c">Its own schedule, its own process.</text>
  <text x="811" y="348" text-anchor="middle" font-size="14" fill="#1a202c">Reads the heartbeat file and asks:</text>
  <text x="811" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">is the last success too old?</text>
  <text x="811" y="402" text-anchor="middle" font-size="14" fill="#1a202c">fresh -&gt; exit 0, say nothing</text>
  <text x="811" y="424" text-anchor="middle" font-size="14" fill="#1a202c">stale -&gt; exit 1, alert a human</text>
  <text x="811" y="446" text-anchor="middle" font-size="14" fill="#1a202c">missing -&gt; exit 1, it never ran</text>
  <text x="811" y="478" text-anchor="middle" font-size="14" fill="#1a202c">This is the only check that</text>
  <text x="811" y="498" text-anchor="middle" font-size="14" fill="#1a202c">catches a job which stopped</text>
  <text x="811" y="518" text-anchor="middle" font-size="14" fill="#1a202c">being scheduled at all — that</text>
  <text x="811" y="538" text-anchor="middle" font-size="14" fill="#1a202c">failure produces no error,</text>
  <text x="811" y="556" text-anchor="middle" font-size="14" fill="#1a202c">because it produces nothing.</text>

  <!-- heartbeat link -->
  <line x1="258" y1="646" x2="230" y2="646" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 42 646 L 20 646 L 20 400 L 30 400" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 30 400 L 30 250 L 660 250 L 660 380 L 666 380" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="668,380 658,375 658,385" fill="#1d4ed8"/>
  <text x="360" y="242" text-anchor="middle" font-size="14" fill="#1d4ed8">the heartbeat file is the only thing connecting them</text>

  <!-- Footer -->
  <rect x="42" y="810" width="912" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="498" y="836" text-anchor="middle" font-size="14" fill="#1a202c">Every clock in this diagram is a parameter, so each branch above is a test that runs in milliseconds rather than a morning spent waiting.</text>
</svg>
