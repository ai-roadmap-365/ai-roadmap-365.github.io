<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="It points at a name, not an address — so the walk continues.">
  <title>A CNAME costs another lookup</title>
  <style>
    .cname-chain-bg   { fill: #f8fafc; }
    .cname-chain-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cname-chain-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cname-chain-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cname-chain-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cname-chain-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cname-chain-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cname-chain-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cname-chain-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cname-chain-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cname-chain-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cname-chain-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cname-chain-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cname-chain-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cname-chain-stage { opacity: 1; }

    .cname-chain-s0 { animation-delay: 0.00s; }
    .cname-chain-e0 { animation-delay: 0.00s; }
    .cname-chain-s1 { animation-delay: 1.28s; }
    .cname-chain-e1 { animation-delay: 1.28s; }
    .cname-chain-s2 { animation-delay: 2.56s; }
    .cname-chain-e2 { animation-delay: 2.56s; }
    .cname-chain-s3 { animation-delay: 3.84s; }
    .cname-chain-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cname-chain-conn  { animation: cname-chain-trace 6.4s ease-in-out infinite; }
      .cname-chain-stage { animation: cname-chain-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cname-chain-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cname-chain-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cname-chain-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cname-chain-stage { animation: cname-chain-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cname-chain-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cname-chain-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cname-chain-bg" width="980" height="322"/>
  <text class="cname-chain-h1"  x="30" y="40">A CNAME costs another lookup</text>
  <text class="cname-chain-sub" x="30" y="64">It points at a name, not an address — so the walk continues.</text>
  <g class="cname-chain-stage cname-chain-s0">
    <rect class="cname-chain-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cname-chain-step" x="44" y="142">01</text>
    <text class="cname-chain-name" x="70" y="142">Ask for www.example.com</text>
    <text class="cname-chain-desc" x="44" y="166">You want an address. The record</text>
    <text class="cname-chain-desc" x="44" y="182">you get is not one.</text>
  </g>
  <line class="cname-chain-line cname-chain-conn cname-chain-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cname-chain-tip)"/>
  <g class="cname-chain-stage cname-chain-s1">
    <rect class="cname-chain-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cname-chain-step" x="280" y="142">02</text>
    <text class="cname-chain-name" x="306" y="142">Get back a CNAME</text>
    <text class="cname-chain-desc" x="280" y="166">"This name is really</text>
    <text class="cname-chain-desc" x="280" y="182">example.com." No address yet.</text>
    <text class="cname-chain-edge" x="280" y="242">alias</text>
  </g>
  <line class="cname-chain-line cname-chain-conn cname-chain-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cname-chain-tip)"/>
  <g class="cname-chain-stage cname-chain-s2">
    <rect class="cname-chain-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cname-chain-step" x="516" y="142">03</text>
    <text class="cname-chain-name" x="542" y="142">Look that name up too</text>
    <text class="cname-chain-desc" x="516" y="166">The resolver starts again for</text>
    <text class="cname-chain-desc" x="516" y="182">the target name.</text>
    <text class="cname-chain-edge" x="516" y="242">+1 lookup</text>
  </g>
  <line class="cname-chain-line cname-chain-conn cname-chain-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cname-chain-tip)"/>
  <g class="cname-chain-stage cname-chain-s3">
    <rect class="cname-chain-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cname-chain-step" x="752" y="142">04</text>
    <text class="cname-chain-name" x="778" y="142">Finally, an A record</text>
    <text class="cname-chain-desc" x="752" y="166">An address. Now the connection</text>
    <text class="cname-chain-desc" x="752" y="182">can begin.</text>
  </g>
  <text class="cname-chain-sub" x="30" y="304">This is why you point a custom domain at a hosting provider's name rather than its address: the provider can move, and your record never changes.</text>
</svg>
