<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A model never sees your file. It sees the numbers your preprocessing produced.">
  <title>Three kinds of input, one destination</title>
  <style>
    .everything-becomes-numbers-bg   { fill: #f8fafc; }
    .everything-becomes-numbers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .everything-becomes-numbers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .everything-becomes-numbers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .everything-becomes-numbers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .everything-becomes-numbers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .everything-becomes-numbers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .everything-becomes-numbers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .everything-becomes-numbers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .everything-becomes-numbers-stage { opacity: 1; }

    .everything-becomes-numbers-s0 { animation-delay: 0.00s; }
    .everything-becomes-numbers-e0 { animation-delay: 0.00s; }
    .everything-becomes-numbers-s1 { animation-delay: 1.28s; }
    .everything-becomes-numbers-e1 { animation-delay: 1.28s; }
    .everything-becomes-numbers-s2 { animation-delay: 2.56s; }
    .everything-becomes-numbers-e2 { animation-delay: 2.56s; }
    .everything-becomes-numbers-s3 { animation-delay: 3.84s; }
    .everything-becomes-numbers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .everything-becomes-numbers-conn  { animation: everything-becomes-numbers-trace 6.4s ease-in-out infinite; }
      .everything-becomes-numbers-stage { animation: everything-becomes-numbers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes everything-becomes-numbers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes everything-becomes-numbers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .everything-becomes-numbers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .everything-becomes-numbers-stage { animation: everything-becomes-numbers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes everything-becomes-numbers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="everything-becomes-numbers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="everything-becomes-numbers-bg" width="980" height="322"/>
  <text class="everything-becomes-numbers-h1"  x="30" y="40">Three kinds of input, one destination</text>
  <text class="everything-becomes-numbers-sub" x="30" y="64">A model never sees your file. It sees the numbers your preprocessing produced.</text>
  <g class="everything-becomes-numbers-stage everything-becomes-numbers-s0">
    <rect class="everything-becomes-numbers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="everything-becomes-numbers-step" x="44" y="142">01</text>
    <text class="everything-becomes-numbers-name" x="70" y="142">Text</text>
    <text class="everything-becomes-numbers-desc" x="44" y="166">Characters to code points, code</text>
    <text class="everything-becomes-numbers-desc" x="44" y="182">points to bytes, bytes to token</text>
    <text class="everything-becomes-numbers-desc" x="44" y="198">ids.</text>
    <text class="everything-becomes-numbers-edge" x="44" y="242">UTF-8, then a tokeniser</text>
  </g>
  <line class="everything-becomes-numbers-line everything-becomes-numbers-conn everything-becomes-numbers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#everything-becomes-numbers-tip)"/>
  <g class="everything-becomes-numbers-stage everything-becomes-numbers-s1">
    <rect class="everything-becomes-numbers-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="everything-becomes-numbers-step" x="280" y="142">02</text>
    <text class="everything-becomes-numbers-name" x="306" y="142">Images</text>
    <text class="everything-becomes-numbers-desc" x="280" y="166">A grid of pixels, each a red,</text>
    <text class="everything-becomes-numbers-desc" x="280" y="182">green and blue value.</text>
    <text class="everything-becomes-numbers-edge" x="280" y="242">height x width x 3</text>
  </g>
  <line class="everything-becomes-numbers-line everything-becomes-numbers-conn everything-becomes-numbers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#everything-becomes-numbers-tip)"/>
  <g class="everything-becomes-numbers-stage everything-becomes-numbers-s2">
    <rect class="everything-becomes-numbers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="everything-becomes-numbers-step" x="516" y="142">03</text>
    <text class="everything-becomes-numbers-name" x="542" y="142">Sound</text>
    <text class="everything-becomes-numbers-desc" x="516" y="166">Amplitude measured many</text>
    <text class="everything-becomes-numbers-desc" x="516" y="182">thousands of times a second.</text>
    <text class="everything-becomes-numbers-edge" x="516" y="242">sample rate</text>
  </g>
  <line class="everything-becomes-numbers-line everything-becomes-numbers-conn everything-becomes-numbers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#everything-becomes-numbers-tip)"/>
  <g class="everything-becomes-numbers-stage everything-becomes-numbers-s3">
    <rect class="everything-becomes-numbers-hi" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="everything-becomes-numbers-step" x="752" y="142">04</text>
    <text class="everything-becomes-numbers-name" x="778" y="142">Arrays of numbers</text>
    <text class="everything-becomes-numbers-desc" x="752" y="166">One representation the</text>
    <text class="everything-becomes-numbers-desc" x="752" y="182">arithmetic can work on.</text>
    <text class="everything-becomes-numbers-edge" x="752" y="242">tensors</text>
  </g>
  <text class="everything-becomes-numbers-sub" x="30" y="304">If encoding differs at all between training and serving, the model is being asked a question in a language it was not taught.</text>
</svg>
