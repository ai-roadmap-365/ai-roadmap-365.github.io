<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" font-family="system-ui, sans-serif">
  <title>The TCP three-way handshake: SYN, SYN-ACK, ACK between a client and a server</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The TCP three-way handshake</text>

  <!-- Actor boxes -->
  <rect x="70" y="60" width="160" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Client</text>

  <rect x="490" y="60" width="160" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="570" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Server (listening)</text>

  <!-- Lifelines -->
  <line x1="150" y1="106" x2="150" y2="420" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="570" y1="106" x2="570" y2="420" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Step 1: SYN -->
  <text x="360" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">1. SYN  —  "Can we talk? My start number is x"</text>
  <line x1="150" y1="165" x2="562" y2="185" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="570,187 553,182 559,170" fill="#1d4ed8"/>

  <!-- Step 2: SYN-ACK -->
  <text x="360" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">2. SYN-ACK  —  "Yes. Got x. My start number is y"</text>
  <line x1="570" y1="250" x2="158" y2="270" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="150,272 167,267 161,255" fill="#1d4ed8"/>

  <!-- Step 3: ACK -->
  <text x="360" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">3. ACK  —  "Got y. Let's go"</text>
  <line x1="150" y1="335" x2="562" y2="355" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="570,357 553,352 559,340" fill="#1d4ed8"/>

  <!-- Established banner -->
  <rect x="120" y="390" width="480" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="413" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Connection ESTABLISHED</text>
  <text x="360" y="432" text-anchor="middle" font-size="14" fill="#1a202c">Both sides agree on start numbers; reliable, ordered data can now flow.</text>
</svg>
