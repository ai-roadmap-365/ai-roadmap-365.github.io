<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One number for spatial agreement.">
  <title>Intersection over union</title>
  <style>
    .iou-bg   { fill: #f8fafc; }
    .iou-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iou-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iou-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iou-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iou-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iou-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .iou-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .iou-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .iou-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .iou-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .iou-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .iou-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .iou-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .iou-stage { opacity: 1; }

    .iou-s0 { animation-delay: 0.00s; }
    .iou-e0 { animation-delay: 0.00s; }
    .iou-s1 { animation-delay: 1.28s; }
    .iou-e1 { animation-delay: 1.28s; }
    .iou-s2 { animation-delay: 2.56s; }
    .iou-e2 { animation-delay: 2.56s; }
    .iou-s3 { animation-delay: 3.84s; }
    .iou-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .iou-conn  { animation: iou-trace 6.4s ease-in-out infinite; }
      .iou-stage { animation: iou-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes iou-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes iou-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .iou-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .iou-stage { animation: iou-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes iou-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="iou-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="iou-bg" width="980" height="322"/>
  <text class="iou-h1"  x="30" y="40">Intersection over union</text>
  <text class="iou-sub" x="30" y="64">One number for spatial agreement.</text>
  <g class="iou-stage iou-s0">
    <rect class="iou-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="iou-step" x="44" y="142">01</text>
    <text class="iou-name" x="70" y="142">Intersection: the shared area</text>
    <text class="iou-desc" x="44" y="166">Where the predicted and true</text>
    <text class="iou-desc" x="44" y="182">regions overlap.</text>
  </g>
  <line class="iou-line iou-conn iou-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#iou-tip)"/>
  <g class="iou-stage iou-s1">
    <rect class="iou-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="iou-step" x="280" y="142">02</text>
    <text class="iou-name" x="306" y="142">Union: the combined area</text>
    <text class="iou-desc" x="280" y="166">Everything either region covers.</text>
  </g>
  <line class="iou-line iou-conn iou-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#iou-tip)"/>
  <g class="iou-stage iou-s2">
    <rect class="iou-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="iou-step" x="516" y="142">03</text>
    <text class="iou-name" x="542" y="142">The ratio</text>
    <text class="iou-desc" x="516" y="166">One for a perfect match, zero</text>
    <text class="iou-desc" x="516" y="182">for no overlap.</text>
    <text class="iou-edge" x="516" y="242">0 to 1</text>
  </g>
  <line class="iou-line iou-conn iou-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#iou-tip)"/>
  <g class="iou-stage iou-s3">
    <rect class="iou-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="iou-step" x="752" y="142">04</text>
    <text class="iou-name" x="778" y="142">A threshold makes it a decision</text>
    <text class="iou-desc" x="752" y="166">Above 0.5 counts as a detection,</text>
    <text class="iou-desc" x="752" y="182">by convention.</text>
  </g>
  <text class="iou-sub" x="30" y="304">The threshold convention is what turns a continuous overlap into a countable correct-or-not, which is what makes detection metrics comparable across models and datasets.</text>
</svg>
