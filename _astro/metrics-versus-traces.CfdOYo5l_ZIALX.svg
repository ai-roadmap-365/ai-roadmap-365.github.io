<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And spans need a propagated header.">
  <title>Metrics notice; traces explain</title>
  <style>
    .metrics-versus-traces-bg   { fill: #f8fafc; }
    .metrics-versus-traces-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-versus-traces-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-versus-traces-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-versus-traces-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-versus-traces-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-versus-traces-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-versus-traces-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metrics-versus-traces-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metrics-versus-traces-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metrics-versus-traces-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metrics-versus-traces-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metrics-versus-traces-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-versus-traces-row { opacity: 1; }
    .metrics-versus-traces-r0 { animation-delay: 0.00s; }
    .metrics-versus-traces-r1 { animation-delay: 0.45s; }
    .metrics-versus-traces-r2 { animation-delay: 0.90s; }
    .metrics-versus-traces-r3 { animation-delay: 1.35s; }
    .metrics-versus-traces-r4 { animation-delay: 1.80s; }
    .metrics-versus-traces-row { animation: metrics-versus-traces-reveal 7.3s ease-in-out infinite; }
    @keyframes metrics-versus-traces-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metrics-versus-traces-bg" width="980" height="390"/>
  <text class="metrics-versus-traces-h1"  x="30" y="40">Metrics notice; traces explain</text>
  <text class="metrics-versus-traces-sub" x="30" y="64">And spans need a propagated header.</text>
  <rect class="metrics-versus-traces-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-versus-traces-name" x="46" y="122">Metrics</text>
  <text class="metrics-versus-traces-desc" x="46" y="142">Is something wrong?</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r0" x="46" y="182">Cheap aggregates per window</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r1" x="46" y="216">Drive alerts</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r2" x="46" y="250">Bounded storage</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r3" x="46" y="284">Cannot reconstruct one request</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r4" x="46" y="318">Answer: yes, since 14:05</text>
  <rect class="metrics-versus-traces-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-versus-traces-name" x="526" y="122">Traces</text>
  <text class="metrics-versus-traces-desc" x="526" y="142">Where did the time go?</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r0" x="526" y="182">One request across every hop</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r1" x="526" y="216">Needs a W3C traceparent header propagated</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r2" x="526" y="250">Expensive at full retention</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r3" x="526" y="284">Sampled at the tail</text>
  <text class="metrics-versus-traces-desc metrics-versus-traces-row metrics-versus-traces-r4" x="526" y="318">Answer: 3.9s in the vector store</text>
  <text class="metrics-versus-traces-sub" x="30" y="372">The header propagation is the part that has to be built rather than configured: a trace that stops at the gateway because a downstream client did not forward the header shows a fast gateway and nothing else.</text>
</svg>
