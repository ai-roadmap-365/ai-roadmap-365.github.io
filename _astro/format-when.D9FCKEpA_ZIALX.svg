<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the shape and the scale.">
  <title>Which format when</title>
  <style>
    .format-when-bg   { fill: #f8fafc; }
    .format-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .format-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .format-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .format-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .format-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .format-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .format-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .format-when-row { opacity: 1; }
    .format-when-r0 { animation-delay: 0.00s; }
    .format-when-r1 { animation-delay: 0.45s; }
    .format-when-r2 { animation-delay: 0.90s; }
    .format-when-r3 { animation-delay: 1.35s; }
    .format-when-r4 { animation-delay: 1.80s; }
    .format-when-row { animation: format-when-reveal 7.3s ease-in-out infinite; }
    @keyframes format-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="format-when-bg" width="980" height="390"/>
  <text class="format-when-h1"  x="30" y="40">Which format when</text>
  <text class="format-when-sub" x="30" y="64">By the shape and the scale.</text>
  <rect class="format-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="format-when-name" x="46" y="122">The situation</text>
  <text class="format-when-desc" x="46" y="142">What you have.</text>
  <text class="format-when-desc format-when-row format-when-r0" x="46" y="182">Flat records, human-editable</text>
  <text class="format-when-desc format-when-row format-when-r1" x="46" y="216">Nested structure, moderate size</text>
  <text class="format-when-desc format-when-row format-when-r2" x="46" y="250">Millions of nested records</text>
  <text class="format-when-desc format-when-row format-when-r3" x="46" y="284">Very large tabular data</text>
  <text class="format-when-desc format-when-row format-when-r4" x="46" y="318">Configuration a person edits</text>
  <rect class="format-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="format-when-name" x="526" y="122">The format</text>
  <text class="format-when-desc" x="526" y="142">What to use.</text>
  <text class="format-when-desc format-when-row format-when-r0" x="526" y="182">Comma-separated, with a real parser</text>
  <text class="format-when-desc format-when-row format-when-r1" x="526" y="216">JSON</text>
  <text class="format-when-desc format-when-row format-when-r2" x="526" y="250">Line-delimited JSON</text>
  <text class="format-when-desc format-when-row format-when-r3" x="526" y="284">A columnar binary format</text>
  <text class="format-when-desc format-when-row format-when-r4" x="526" y="318">A format with comments, such as TOML</text>
  <text class="format-when-sub" x="30" y="372">JSON lacking comments is the reason it makes a poor configuration format, however convenient it is for machine interchange.</text>
</svg>
