<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="TDD, program repair, and planning.">
  <title>Three disciplines, synthesised</title>
  <style>
    .workflow-lineage-bg   { fill: #f8fafc; }
    .workflow-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workflow-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workflow-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workflow-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workflow-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workflow-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .workflow-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .workflow-lineage-stage { opacity: 1; }

    .workflow-lineage-s0 { animation-delay: 0.00s; }
    .workflow-lineage-e0 { animation-delay: 0.00s; }
    .workflow-lineage-s1 { animation-delay: 1.50s; }
    .workflow-lineage-e1 { animation-delay: 1.50s; }
    .workflow-lineage-s2 { animation-delay: 3.00s; }
    .workflow-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .workflow-lineage-conn  { animation: workflow-lineage-trace 6s ease-in-out infinite; }
      .workflow-lineage-stage { animation: workflow-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes workflow-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes workflow-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .workflow-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .workflow-lineage-stage { animation: workflow-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes workflow-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="workflow-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="workflow-lineage-bg" width="980" height="322"/>
  <text class="workflow-lineage-h1"  x="30" y="40">Three disciplines, synthesised</text>
  <text class="workflow-lineage-sub" x="30" y="64">TDD, program repair, and planning.</text>
  <g class="workflow-lineage-stage workflow-lineage-s0">
    <rect class="workflow-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="workflow-lineage-step" x="44" y="142">01</text>
    <text class="workflow-lineage-name" x="70" y="142">Test-driven development</text>
    <text class="workflow-lineage-desc" x="44" y="166">Tests first. For a model, they are the</text>
    <text class="workflow-lineage-desc" x="44" y="182">missing feedback loop.</text>
  </g>
  <line class="workflow-lineage-line workflow-lineage-conn workflow-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#workflow-lineage-tip)"/>
  <g class="workflow-lineage-stage workflow-lineage-s1">
    <rect class="workflow-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="workflow-lineage-step" x="359" y="142">02</text>
    <text class="workflow-lineage-name" x="385" y="142">Automated program repair</text>
    <text class="workflow-lineage-desc" x="359" y="166">Test-suite-guided iterative repair, from</text>
    <text class="workflow-lineage-desc" x="359" y="182">genetic programming onward.</text>
  </g>
  <line class="workflow-lineage-line workflow-lineage-conn workflow-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#workflow-lineage-tip)"/>
  <g class="workflow-lineage-stage workflow-lineage-s2">
    <rect class="workflow-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="workflow-lineage-step" x="674" y="142">03</text>
    <text class="workflow-lineage-name" x="700" y="142">Plan-and-solve, 2023</text>
    <text class="workflow-lineage-desc" x="674" y="166">Decomposing before executing: over 40% better</text>
    <text class="workflow-lineage-desc" x="674" y="182">completion on multi-step tasks.</text>
  </g>
  <text class="workflow-lineage-sub" x="30" y="304">Coding agents are the current state of the art in automated program repair rather than a departure from it, which is why the field's existing findings about repair loops transfer directly.</text>
</svg>
