<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>The core Python built-in types grouped by mutability and by category</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The core Python types, grouped by mutability</text>

  <!-- Immutable column -->
  <rect x="30" y="64" width="340" height="380" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2" rx="12"/>
  <text x="200" y="94" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Immutable — cannot change in place</text>

  <text x="200" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Numbers &amp; logic</text>
  <rect x="52" y="140" width="90" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="97" y="163" text-anchor="middle" font-size="15" fill="#1a202c">int</text>
  <text x="97" y="179" text-anchor="middle" font-size="12" fill="#1a202c">7, -3</text>
  <rect x="155" y="140" width="90" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="200" y="163" text-anchor="middle" font-size="15" fill="#1a202c">float</text>
  <text x="200" y="179" text-anchor="middle" font-size="12" fill="#1a202c">3.14</text>
  <rect x="258" y="140" width="90" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="303" y="163" text-anchor="middle" font-size="15" fill="#1a202c">bool</text>
  <text x="303" y="179" text-anchor="middle" font-size="12" fill="#1a202c">True</text>

  <text x="200" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Text &amp; nothing</text>
  <rect x="52" y="234" width="140" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="122" y="257" text-anchor="middle" font-size="15" fill="#1a202c">str</text>
  <text x="122" y="273" text-anchor="middle" font-size="12" fill="#1a202c">"hello"</text>
  <rect x="205" y="234" width="143" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="276" y="257" text-anchor="middle" font-size="15" fill="#1a202c">NoneType</text>
  <text x="276" y="273" text-anchor="middle" font-size="12" fill="#1a202c">None</text>

  <text x="200" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Fixed sequence</text>
  <rect x="105" y="328" width="190" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="200" y="351" text-anchor="middle" font-size="15" fill="#1a202c">tuple</text>
  <text x="200" y="367" text-anchor="middle" font-size="12" fill="#1a202c">(1, 2, 3)</text>

  <text x="200" y="418" text-anchor="middle" font-size="13" fill="#1a202c">Rebinding a name is fine;</text>
  <text x="200" y="435" text-anchor="middle" font-size="13" fill="#1a202c">the object itself never mutates.</text>

  <!-- Mutable column -->
  <rect x="390" y="64" width="340" height="380" fill="#ecfdf5" stroke="#1d4ed8" stroke-width="2" rx="12"/>
  <text x="560" y="94" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Mutable — can change in place</text>

  <text x="560" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Collections</text>
  <rect x="412" y="156" width="140" height="60" fill="#d1fae5" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="482" y="182" text-anchor="middle" font-size="15" fill="#1a202c">list</text>
  <text x="482" y="202" text-anchor="middle" font-size="12" fill="#1a202c">[1, 2, 3]</text>
  <rect x="568" y="156" width="140" height="60" fill="#d1fae5" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="638" y="182" text-anchor="middle" font-size="15" fill="#1a202c">dict</text>
  <text x="638" y="202" text-anchor="middle" font-size="12" fill="#1a202c">{"k": 1}</text>
  <rect x="490" y="236" width="140" height="60" fill="#d1fae5" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="560" y="262" text-anchor="middle" font-size="15" fill="#1a202c">set</text>
  <text x="560" y="282" text-anchor="middle" font-size="12" fill="#1a202c">{1, 2, 3}</text>

  <text x="560" y="352" text-anchor="middle" font-size="13" fill="#1a202c">Methods like .append() and</text>
  <text x="560" y="371" text-anchor="middle" font-size="13" fill="#1a202c">key assignment change the</text>
  <text x="560" y="390" text-anchor="middle" font-size="13" fill="#1a202c">object every alias can see.</text>
  <text x="560" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Deep dives: Days 47&#8211;49</text>
</svg>
