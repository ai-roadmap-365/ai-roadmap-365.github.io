<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same question, different systems.">
  <title>A hallway answer, or an engineer</title>
  <style>
    .stateless-or-agent-bg   { fill: #f8fafc; }
    .stateless-or-agent-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-or-agent-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-or-agent-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-or-agent-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-or-agent-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-or-agent-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stateless-or-agent-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stateless-or-agent-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stateless-or-agent-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stateless-or-agent-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stateless-or-agent-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stateless-or-agent-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stateless-or-agent-row { opacity: 1; }
    .stateless-or-agent-r0 { animation-delay: 0.00s; }
    .stateless-or-agent-r1 { animation-delay: 0.45s; }
    .stateless-or-agent-r2 { animation-delay: 0.90s; }
    .stateless-or-agent-r3 { animation-delay: 1.35s; }
    .stateless-or-agent-r4 { animation-delay: 1.80s; }
    .stateless-or-agent-row { animation: stateless-or-agent-reveal 7.3s ease-in-out infinite; }
    @keyframes stateless-or-agent-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stateless-or-agent-bg" width="980" height="390"/>
  <text class="stateless-or-agent-h1"  x="30" y="40">A hallway answer, or an engineer</text>
  <text class="stateless-or-agent-sub" x="30" y="64">Same question, different systems.</text>
  <rect class="stateless-or-agent-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stateless-or-agent-name" x="46" y="122">Stateless model</text>
  <text class="stateless-or-agent-desc" x="46" y="142">One forward pass.</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r0" x="46" y="182">Answers from what it already knows</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r1" x="46" y="216">Never opened the codebase</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r2" x="46" y="250">Never ran the test suite</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r3" x="46" y="284">A typo or a deprecated library goes unnoticed</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r4" x="46" y="318">Thirty seconds, and no verification</text>
  <rect class="stateless-or-agent-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stateless-or-agent-name" x="526" y="122">Agent</text>
  <text class="stateless-or-agent-desc" x="526" y="142">A loop with tools.</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r0" x="526" y="182">Reads the ticket and the stack trace</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r1" x="526" y="216">Greps the repository</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r2" x="526" y="250">Edits and runs pytest</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r3" x="526" y="284">Reads the traceback and adjusts</text>
  <text class="stateless-or-agent-desc stateless-or-agent-row stateless-or-agent-r4" x="526" y="318">Submits a diff that passes</text>
  <text class="stateless-or-agent-sub" x="30" y="372">The right-hand column is not smarter — the same model does both — it is the difference between predicting an answer and checking one, and checking is what tools make possible.</text>
</svg>
