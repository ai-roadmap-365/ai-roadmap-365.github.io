<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to use an abstraction.">
  <title>When to call the provider directly</title>
  <style>
    .api-when-bg   { fill: #f8fafc; }
    .api-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-when-row { opacity: 1; }
    .api-when-r0 { animation-delay: 0.00s; }
    .api-when-r1 { animation-delay: 0.45s; }
    .api-when-r2 { animation-delay: 0.90s; }
    .api-when-r3 { animation-delay: 1.35s; }
    .api-when-r4 { animation-delay: 1.80s; }
    .api-when-row { animation: api-when-reveal 7.3s ease-in-out infinite; }
    @keyframes api-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="api-when-bg" width="980" height="390"/>
  <text class="api-when-h1"  x="30" y="40">When to call the provider directly</text>
  <text class="api-when-sub" x="30" y="64">And when to use an abstraction.</text>
  <rect class="api-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="api-when-name" x="46" y="122">Call it directly</text>
  <text class="api-when-desc" x="46" y="142">Full access.</text>
  <text class="api-when-desc api-when-row api-when-r0" x="46" y="182">Provider-specific features you need</text>
  <text class="api-when-desc api-when-row api-when-r1" x="46" y="216">Caching and batch endpoints</text>
  <text class="api-when-desc api-when-row api-when-r2" x="46" y="250">Fewer moving parts</text>
  <text class="api-when-desc api-when-row api-when-r3" x="46" y="284">Errors you can read</text>
  <text class="api-when-desc api-when-row api-when-r4" x="46" y="318">Right when one provider is enough</text>
  <rect class="api-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="api-when-name" x="526" y="122">Use an abstraction</text>
  <text class="api-when-desc" x="526" y="142">Portability.</text>
  <text class="api-when-desc api-when-row api-when-r0" x="526" y="182">Several providers, or failover</text>
  <text class="api-when-desc api-when-row api-when-r1" x="526" y="216">Routing between models</text>
  <text class="api-when-desc api-when-row api-when-r2" x="526" y="250">A single place for logging and limits</text>
  <text class="api-when-desc api-when-row api-when-r3" x="526" y="284">At the cost of the newest features</text>
  <text class="api-when-desc api-when-row api-when-r4" x="526" y="318">Right when portability matters</text>
  <text class="api-when-sub" x="30" y="372">The compromise most teams land on is a thin internal wrapper: direct calls underneath, with one place that owns retries, logging and the model identifier.</text>
</svg>
