<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The decision that turned machines into computers.">
  <title>Why a program is data</title>
  <style>
    .rewiring-to-programming-bg   { fill: #f8fafc; }
    .rewiring-to-programming-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rewiring-to-programming-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rewiring-to-programming-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rewiring-to-programming-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rewiring-to-programming-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rewiring-to-programming-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rewiring-to-programming-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rewiring-to-programming-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rewiring-to-programming-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rewiring-to-programming-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rewiring-to-programming-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rewiring-to-programming-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rewiring-to-programming-row { opacity: 1; }
    .rewiring-to-programming-r0 { animation-delay: 0.00s; }
    .rewiring-to-programming-r1 { animation-delay: 0.45s; }
    .rewiring-to-programming-r2 { animation-delay: 0.90s; }
    .rewiring-to-programming-r3 { animation-delay: 1.35s; }
    .rewiring-to-programming-r4 { animation-delay: 1.80s; }
    .rewiring-to-programming-row { animation: rewiring-to-programming-reveal 7.3s ease-in-out infinite; }
    @keyframes rewiring-to-programming-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rewiring-to-programming-bg" width="980" height="390"/>
  <text class="rewiring-to-programming-h1"  x="30" y="40">Why a program is data</text>
  <text class="rewiring-to-programming-sub" x="30" y="64">The decision that turned machines into computers.</text>
  <rect class="rewiring-to-programming-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rewiring-to-programming-name" x="46" y="122">Rewired for each job</text>
  <text class="rewiring-to-programming-desc" x="46" y="142">The task lived in the cabling.</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r0" x="46" y="182">Hours or days of physical work per change</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r1" x="46" y="216">Only specialists could alter it</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r2" x="46" y="250">One machine, one task at a time</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r3" x="46" y="284">No way to store a procedure</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r4" x="46" y="318">A mistake meant rewiring again</text>
  <rect class="rewiring-to-programming-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rewiring-to-programming-name" x="526" y="122">Stored program</text>
  <text class="rewiring-to-programming-desc" x="526" y="142">The task lives in memory, as numbers.</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r0" x="526" y="182">Loading a different program takes moments</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r1" x="526" y="216">Anyone can write one</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r2" x="526" y="250">One machine, unlimited tasks</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r3" x="526" y="284">Programs can be saved, copied and shared</text>
  <text class="rewiring-to-programming-desc rewiring-to-programming-row rewiring-to-programming-r4" x="526" y="318">A program can even write another program</text>
  <text class="rewiring-to-programming-sub" x="30" y="372">Instructions and data sit in the same memory, indistinguishable except by how they are used — which is the whole reason a general-purpose computer is general-purpose.</text>
</svg>
