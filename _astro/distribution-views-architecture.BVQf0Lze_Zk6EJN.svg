<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 570" width="1400" height="570" role="img" aria-labelledby="d130aTitleId d130aDescId">
  <title id="d130aTitleId">One sample, five pictures -- histogram, KDE, ECDF, boxplot and strip plot -- each labelled with what it reveals and what it conceals</title>
  <desc id="d130aDescId">The same bimodal sample of points is drawn five different ways in five side-by-side panels. The histogram panel shows two bars of different heights with a visible gap and is labelled reveals: two separate clusters and their relative sizes, conceals: the exact shape depends on the chosen bin width. The KDE panel shows a smooth two-humped curve and is labelled reveals: a smooth two-humped shape with no visible bin edges, conceals: the curve depends on a chosen bandwidth and can place density past a real boundary. The ECDF panel shows a rising staircase and is labelled reveals: every observation and any exact quantile, with no chosen parameter at all, conceals: the number of modes is hard to see at a glance. The boxplot panel shows a single box with a median line and whiskers and is labelled reveals: the five-number summary, position and spread, conceals: whether the distribution is unimodal or bimodal -- a boxplot cannot show this. The strip plot panel shows every individual point as a small dot in two visible clusters and is labelled reveals: every single raw observation, conceals: nothing about shape, but becomes unreadable once there are too many points to see individually. A caption beneath the five panels states that these are five views of the identical sample, not five competing conclusions.</desc>

  <style>
    .d130a-bg      { fill: #f8fafc; }
    .d130a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 700; fill: #1a202c; }
    .d130a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
    .d130a-panel   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d130a-name    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1d4ed8; }
    .d130a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 700; fill: #1a202c; }
    .d130a-body    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #334155; }
    .d130a-axis    { stroke: #94a3b8; stroke-width: 1.25; }
    .d130a-bar     { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 1.25; }
    .d130a-curve   { fill: none; stroke: #1d4ed8; stroke-width: 2.25; }
    .d130a-step    { fill: none; stroke: #1d4ed8; stroke-width: 2.25; }
    .d130a-box     { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.75; }
    .d130a-median  { stroke: #1d4ed8; stroke-width: 2; }
    .d130a-whisker { stroke: #1d4ed8; stroke-width: 1.5; }
    .d130a-dot     { fill: #1d4ed8; opacity: 0.75; }
    .d130a-reveal  { fill: #166534; }
    .d130a-conceal { fill: #b91c1c; }
    .d130a-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
  </style>

  <rect class="d130a-bg" x="0" y="0" width="1400" height="570" />

  <text class="d130a-title" x="40" y="42">One sample, five pictures</text>
  <text class="d130a-sub" x="40" y="66">Every panel below draws the exact same bimodal points. Only the picture changes -- and each picture reveals one thing while it conceals another.</text>

  <!-- five panels, each 250 wide, 40px gutter -->
  <!-- panel x starts: 40, 305, 570, 835, 1100 ; width 240; y 100 to 470 -->

  <!-- PANEL 1: HISTOGRAM -->
  <rect class="d130a-panel" x="40" y="100" width="245" height="330" rx="8" />
  <text class="d130a-name" x="60" y="130">Histogram</text>
  <line class="d130a-axis" x1="65" y1="330" x2="270" y2="330" />
  <line class="d130a-axis" x1="65" y1="180" x2="65" y2="330" />
  <rect class="d130a-bar" x="80"  y="230" width="34" height="100" />
  <rect class="d130a-bar" x="118" y="290" width="34" height="40" />
  <rect class="d130a-bar" x="156" y="310" width="34" height="20" />
  <rect class="d130a-bar" x="194" y="200" width="34" height="130" />
  <rect class="d130a-bar" x="232" y="270" width="34" height="60" />
  <text class="d130a-label d130a-reveal" x="60" y="358">reveals:</text>
  <text class="d130a-body" x="60" y="374">two clusters, their sizes</text>
  <text class="d130a-label d130a-conceal" x="60" y="396">conceals:</text>
  <text class="d130a-body" x="60" y="412">shape depends on bin width</text>

  <!-- PANEL 2: KDE -->
  <rect class="d130a-panel" x="305" y="100" width="245" height="330" rx="8" />
  <text class="d130a-name" x="325" y="130">KDE</text>
  <line class="d130a-axis" x1="330" y1="330" x2="535" y2="330" />
  <line class="d130a-axis" x1="330" y1="180" x2="330" y2="330" />
  <path class="d130a-curve" d="M 345 328
    C 365 328, 375 300, 390 250
    C 400 218, 410 210, 422 212
    C 432 214, 438 240, 448 300
    C 458 240, 466 214, 478 212
    C 490 210, 500 240, 512 300
    C 520 320, 528 328, 535 328" />
  <text class="d130a-label d130a-reveal" x="325" y="358">reveals:</text>
  <text class="d130a-body" x="325" y="374">a smooth two-humped shape</text>
  <text class="d130a-label d130a-conceal" x="325" y="396">conceals:</text>
  <text class="d130a-body" x="325" y="412">depends on bandwidth; can</text>
  <text class="d130a-body" x="325" y="427">place density past a boundary</text>

  <!-- PANEL 3: ECDF -->
  <rect class="d130a-panel" x="570" y="100" width="245" height="330" rx="8" />
  <text class="d130a-name" x="590" y="130">ECDF</text>
  <line class="d130a-axis" x1="595" y1="330" x2="800" y2="330" />
  <line class="d130a-axis" x1="595" y1="180" x2="595" y2="330" />
  <path class="d130a-step" d="M 605 328
    L 630 328 L 630 300 L 655 300 L 655 270 L 675 270 L 675 240
    L 695 240 L 695 235 L 715 235 L 715 210 L 735 210 L 735 200
    L 755 200 L 755 195 L 795 195" />
  <text class="d130a-label d130a-reveal" x="590" y="358">reveals:</text>
  <text class="d130a-body" x="590" y="374">every observation; any exact</text>
  <text class="d130a-body" x="590" y="389">quantile; no chosen parameter</text>
  <text class="d130a-label d130a-conceal" x="590" y="411">conceals:</text>
  <text class="d130a-body" x="590" y="427">mode count is hard to read</text>

  <!-- PANEL 4: BOXPLOT -->
  <rect class="d130a-panel" x="835" y="100" width="245" height="330" rx="8" />
  <text class="d130a-name" x="855" y="130">Boxplot</text>
  <line class="d130a-axis" x1="860" y1="330" x2="1065" y2="330" />
  <line class="d130a-whisker" x1="962" y1="230" x2="962" y2="180" />
  <line class="d130a-whisker" x1="962" y1="300" x2="962" y2="330" />
  <line class="d130a-whisker" x1="945" y1="180" x2="980" y2="180" />
  <line class="d130a-whisker" x1="945" y1="330" x2="980" y2="330" />
  <rect class="d130a-box" x="920" y="230" width="85" height="70" />
  <line class="d130a-median" x1="920" y1="262" x2="1005" y2="262" />
  <text class="d130a-label d130a-reveal" x="855" y="358">reveals:</text>
  <text class="d130a-body" x="855" y="374">five-number summary: position</text>
  <text class="d130a-body" x="855" y="389">and spread, fast to compare</text>
  <text class="d130a-label d130a-conceal" x="855" y="411">conceals:</text>
  <text class="d130a-body" x="855" y="427">unimodal vs bimodal -- cannot</text>
  <text class="d130a-body" x="855" y="442">show this, structurally</text>

  <!-- PANEL 5: STRIP PLOT -->
  <rect class="d130a-panel" x="1100" y="100" width="245" height="330" rx="8" />
  <text class="d130a-name" x="1120" y="130">Strip plot</text>
  <line class="d130a-axis" x1="1125" y1="330" x2="1330" y2="330" />
  <line class="d130a-axis" x1="1125" y1="180" x2="1125" y2="330" />
  <g class="d130a-dot">
    <circle cx="1150" cy="300" r="4" /><circle cx="1156" cy="290" r="4" /><circle cx="1146" cy="280" r="4" />
    <circle cx="1162" cy="270" r="4" /><circle cx="1152" cy="260" r="4" /><circle cx="1168" cy="250" r="4" />
    <circle cx="1300" cy="220" r="4" /><circle cx="1290" cy="210" r="4" /><circle cx="1310" cy="230" r="4" />
    <circle cx="1295" cy="240" r="4" /><circle cx="1280" cy="225" r="4" /><circle cx="1305" cy="205" r="4" />
    <circle cx="1200" cy="315" r="4" /><circle cx="1215" cy="308" r="4" /><circle cx="1225" cy="300" r="4" />
  </g>
  <text class="d130a-label d130a-reveal" x="1120" y="358">reveals:</text>
  <text class="d130a-body" x="1120" y="374">every single raw observation</text>
  <text class="d130a-label d130a-conceal" x="1120" y="396">conceals:</text>
  <text class="d130a-body" x="1120" y="412">nothing about shape -- but</text>
  <text class="d130a-body" x="1120" y="427">unreadable once too crowded</text>

  <!-- Caption -->
  <rect class="d130a-panel" x="40" y="470" width="1305" height="70" rx="8" />
  <text class="d130a-caption" x="60" y="500">These are five views of the identical sample -- not five competing conclusions. Every one of them is arithmetically correct.</text>
  <text class="d130a-caption" x="60" y="522">Each one also discards something specific, and the professional habit this lesson teaches is asking, every time, what a given picture was never built to show.</text>
</svg>
