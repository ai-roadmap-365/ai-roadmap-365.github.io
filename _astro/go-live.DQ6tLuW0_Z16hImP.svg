<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All measured, none assumed.">
  <title>Four go-live verifications</title>
  <style>
    .go-live-bg   { fill: #f8fafc; }
    .go-live-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .go-live-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .go-live-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .go-live-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .go-live-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .go-live-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .go-live-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .go-live-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .go-live-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .go-live-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .go-live-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .go-live-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .go-live-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .go-live-stage { opacity: 1; }

    .go-live-s0 { animation-delay: 0.00s; }
    .go-live-e0 { animation-delay: 0.00s; }
    .go-live-s1 { animation-delay: 1.28s; }
    .go-live-e1 { animation-delay: 1.28s; }
    .go-live-s2 { animation-delay: 2.56s; }
    .go-live-e2 { animation-delay: 2.56s; }
    .go-live-s3 { animation-delay: 3.84s; }
    .go-live-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .go-live-conn  { animation: go-live-trace 6.4s ease-in-out infinite; }
      .go-live-stage { animation: go-live-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes go-live-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes go-live-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .go-live-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .go-live-stage { animation: go-live-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes go-live-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="go-live-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="go-live-bg" width="980" height="322"/>
  <text class="go-live-h1"  x="30" y="40">Four go-live verifications</text>
  <text class="go-live-sub" x="30" y="64">All measured, none assumed.</text>
  <g class="go-live-stage go-live-s0">
    <rect class="go-live-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="go-live-step" x="44" y="142">01</text>
    <text class="go-live-name" x="70" y="142">End-to-end integration tests pass</text>
    <text class="go-live-desc" x="44" y="166">Across every layer, not per</text>
    <text class="go-live-desc" x="44" y="182">component.</text>
  </g>
  <line class="go-live-line go-live-conn go-live-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#go-live-tip)"/>
  <g class="go-live-stage go-live-s1">
    <rect class="go-live-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="go-live-step" x="280" y="142">02</text>
    <text class="go-live-name" x="306" y="142">Cache hit latency benchmarked</text>
    <text class="go-live-desc" x="280" y="166">Under 20 ms, measured rather</text>
    <text class="go-live-desc" x="280" y="182">than expected.</text>
    <text class="go-live-edge" x="280" y="242">measured</text>
  </g>
  <line class="go-live-line go-live-conn go-live-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#go-live-tip)"/>
  <g class="go-live-stage go-live-s2">
    <rect class="go-live-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="go-live-step" x="516" y="142">03</text>
    <text class="go-live-name" x="542" y="142">Failover validated under fault injection</text>
    <text class="go-live-desc" x="516" y="166">Live simulated network faults.</text>
  </g>
  <line class="go-live-line go-live-conn go-live-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#go-live-tip)"/>
  <g class="go-live-stage go-live-s3">
    <rect class="go-live-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="go-live-step" x="752" y="142">04</text>
    <text class="go-live-name" x="778" y="142">Billing reconciles to micro-dollars</text>
    <text class="go-live-desc" x="752" y="166">Ledger against provider usage,</text>
    <text class="go-live-desc" x="752" y="182">exactly.</text>
  </g>
  <text class="go-live-sub" x="30" y="304">Billing reconciliation is the one that surfaces integration bugs nothing else finds: a discrepancy between your ledger and the provider's usage means some path is charging or generating differently than you believe.</text>
</svg>
