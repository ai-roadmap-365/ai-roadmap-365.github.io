<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Approach speed is not landing speed.">
  <title>Landing an aircraft</title>
  <style>
    .landing-bg   { fill: #f8fafc; }
    .landing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .landing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .landing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .landing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .landing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .landing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .landing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .landing-row { opacity: 1; }
    .landing-r0 { animation-delay: 0.00s; }
    .landing-r1 { animation-delay: 0.45s; }
    .landing-r2 { animation-delay: 0.90s; }
    .landing-r3 { animation-delay: 1.35s; }
    .landing-r4 { animation-delay: 1.80s; }
    .landing-row { animation: landing-reveal 7.3s ease-in-out infinite; }
    @keyframes landing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="landing-bg" width="980" height="390"/>
  <text class="landing-h1"  x="30" y="40">Landing an aircraft</text>
  <text class="landing-sub" x="30" y="64">Approach speed is not landing speed.</text>
  <rect class="landing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="landing-name" x="46" y="122">One speed throughout</text>
  <text class="landing-desc" x="46" y="142">Wrong at both ends.</text>
  <text class="landing-desc landing-row landing-r0" x="46" y="182">Fast enough to cover the distance</text>
  <text class="landing-desc landing-row landing-r1" x="46" y="216">Far too fast to touch down</text>
  <text class="landing-desc landing-row landing-r2" x="46" y="250">Or slow enough to land, and never arrive</text>
  <text class="landing-desc landing-row landing-r3" x="46" y="284">No single value serves both</text>
  <text class="landing-desc landing-row landing-r4" x="46" y="318">The aircraft bounces</text>
  <rect class="landing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="landing-name" x="526" y="122">A staged descent</text>
  <text class="landing-desc" x="526" y="142">Fast, then slow.</text>
  <text class="landing-desc landing-row landing-r0" x="526" y="182">Cruise speed for the distance</text>
  <text class="landing-desc landing-row landing-r1" x="526" y="216">Reducing on approach</text>
  <text class="landing-desc landing-row landing-r2" x="526" y="250">Slowest at the moment of contact</text>
  <text class="landing-desc landing-row landing-r3" x="526" y="284">Each phase at its own speed</text>
  <text class="landing-desc landing-row landing-r4" x="526" y="318">And the landing is smooth</text>
  <text class="landing-sub" x="30" y="372">Bouncing on the runway is a good picture of what a too-high final learning rate does: the model repeatedly overshoots a minimum it is close enough to reach.</text>
</svg>
