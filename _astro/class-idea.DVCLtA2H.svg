<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things.">
  <title>What a class bundles</title>
  <style>
    .class-idea-bg   { fill: #f8fafc; }
    .class-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .class-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .class-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .class-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .class-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .class-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .class-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .class-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .class-idea-stage { opacity: 1; }

    .class-idea-s0 { animation-delay: 0.00s; }
    .class-idea-e0 { animation-delay: 0.00s; }
    .class-idea-s1 { animation-delay: 1.28s; }
    .class-idea-e1 { animation-delay: 1.28s; }
    .class-idea-s2 { animation-delay: 2.56s; }
    .class-idea-e2 { animation-delay: 2.56s; }
    .class-idea-s3 { animation-delay: 3.84s; }
    .class-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .class-idea-conn  { animation: class-idea-trace 6.4s ease-in-out infinite; }
      .class-idea-stage { animation: class-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes class-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes class-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .class-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .class-idea-stage { animation: class-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes class-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="class-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="class-idea-bg" width="980" height="322"/>
  <text class="class-idea-h1"  x="30" y="40">What a class bundles</text>
  <text class="class-idea-sub" x="30" y="64">Four things.</text>
  <g class="class-idea-stage class-idea-s0">
    <rect class="class-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="class-idea-step" x="44" y="142">01</text>
    <text class="class-idea-name" x="70" y="142">State: the data belonging to one thing</text>
    <text class="class-idea-desc" x="44" y="166">Its attributes.</text>
  </g>
  <line class="class-idea-line class-idea-conn class-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#class-idea-tip)"/>
  <g class="class-idea-stage class-idea-s1">
    <rect class="class-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="class-idea-step" x="280" y="142">02</text>
    <text class="class-idea-name" x="306" y="142">Behaviour: the operations on that data</text>
    <text class="class-idea-desc" x="280" y="166">Its methods, which know where</text>
    <text class="class-idea-desc" x="280" y="182">the data is.</text>
  </g>
  <line class="class-idea-line class-idea-conn class-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#class-idea-tip)"/>
  <g class="class-idea-stage class-idea-s2">
    <rect class="class-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="class-idea-step" x="516" y="142">03</text>
    <text class="class-idea-name" x="542" y="142">A template, from which instances are made</text>
    <text class="class-idea-desc" x="516" y="166">The class itself is not the</text>
    <text class="class-idea-desc" x="516" y="182">thing.</text>
  </g>
  <line class="class-idea-line class-idea-conn class-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#class-idea-tip)"/>
  <g class="class-idea-stage class-idea-s3">
    <rect class="class-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="class-idea-step" x="752" y="142">04</text>
    <text class="class-idea-name" x="778" y="142">And identity: two instances are distinct</text>
    <text class="class-idea-desc" x="752" y="166">Even with identical attributes.</text>
    <text class="class-idea-edge" x="752" y="242">the model</text>
  </g>
  <text class="class-idea-sub" x="30" y="304">The template-versus-instance distinction is the one to get right early, because most early confusion comes from treating the class as the object.</text>
</svg>
