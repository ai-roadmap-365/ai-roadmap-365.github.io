<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is honest on rare classes.">
  <title>Two areas under two curves</title>
  <style>
    .roc-pr-auc-bg   { fill: #f8fafc; }
    .roc-pr-auc-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roc-pr-auc-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roc-pr-auc-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roc-pr-auc-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roc-pr-auc-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roc-pr-auc-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .roc-pr-auc-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .roc-pr-auc-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .roc-pr-auc-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .roc-pr-auc-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .roc-pr-auc-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .roc-pr-auc-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .roc-pr-auc-row { opacity: 1; }
    .roc-pr-auc-r0 { animation-delay: 0.00s; }
    .roc-pr-auc-r1 { animation-delay: 0.45s; }
    .roc-pr-auc-r2 { animation-delay: 0.90s; }
    .roc-pr-auc-r3 { animation-delay: 1.35s; }
    .roc-pr-auc-r4 { animation-delay: 1.80s; }
    .roc-pr-auc-row { animation: roc-pr-auc-reveal 7.3s ease-in-out infinite; }
    @keyframes roc-pr-auc-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="roc-pr-auc-bg" width="980" height="390"/>
  <text class="roc-pr-auc-h1"  x="30" y="40">Two areas under two curves</text>
  <text class="roc-pr-auc-sub" x="30" y="64">One is honest on rare classes.</text>
  <rect class="roc-pr-auc-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="roc-pr-auc-name" x="46" y="122">Area under the characteristic curve</text>
  <text class="roc-pr-auc-desc" x="46" y="142">Balance-insensitive.</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r0" x="46" y="182">Summarises recall against false alarm rate</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r1" x="46" y="216">Baseline is always one half</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r2" x="46" y="250">Looks strong even on very rare classes</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r3" x="46" y="284">Widely reported and widely misread</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r4" x="46" y="318">Use when classes are roughly balanced</text>
  <rect class="roc-pr-auc-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="roc-pr-auc-name" x="526" y="122">Area under precision-recall</text>
  <text class="roc-pr-auc-desc" x="526" y="142">Balance-sensitive.</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r0" x="526" y="182">Summarises precision against recall</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r1" x="526" y="216">Baseline is the positive rate itself</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r2" x="526" y="250">Degrades visibly as positives become rare</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r3" x="526" y="284">Less reported, more informative</text>
  <text class="roc-pr-auc-desc roc-pr-auc-row roc-pr-auc-r4" x="526" y="318">Use when positives are rare</text>
  <text class="roc-pr-auc-sub" x="30" y="372">The differing baselines are the practical tell: a score of 0.8 means something very different depending on which curve produced it and how rare the positives are.</text>
</svg>
