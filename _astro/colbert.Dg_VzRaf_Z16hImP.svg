<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Between the two extremes.">
  <title>Late interaction</title>
  <style>
    .colbert-bg   { fill: #f8fafc; }
    .colbert-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .colbert-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .colbert-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .colbert-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .colbert-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .colbert-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .colbert-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .colbert-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .colbert-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .colbert-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .colbert-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .colbert-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .colbert-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .colbert-stage { opacity: 1; }

    .colbert-s0 { animation-delay: 0.00s; }
    .colbert-e0 { animation-delay: 0.00s; }
    .colbert-s1 { animation-delay: 1.28s; }
    .colbert-e1 { animation-delay: 1.28s; }
    .colbert-s2 { animation-delay: 2.56s; }
    .colbert-e2 { animation-delay: 2.56s; }
    .colbert-s3 { animation-delay: 3.84s; }
    .colbert-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .colbert-conn  { animation: colbert-trace 6.4s ease-in-out infinite; }
      .colbert-stage { animation: colbert-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes colbert-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes colbert-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .colbert-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .colbert-stage { animation: colbert-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes colbert-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="colbert-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="colbert-bg" width="980" height="322"/>
  <text class="colbert-h1"  x="30" y="40">Late interaction</text>
  <text class="colbert-sub" x="30" y="64">Between the two extremes.</text>
  <g class="colbert-stage colbert-s0">
    <rect class="colbert-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="colbert-step" x="44" y="142">01</text>
    <text class="colbert-name" x="70" y="142">Keep a vector per token, not one per passage</text>
    <text class="colbert-desc" x="44" y="166">So no information is pooled</text>
    <text class="colbert-desc" x="44" y="182">away.</text>
  </g>
  <line class="colbert-line colbert-conn colbert-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#colbert-tip)"/>
  <g class="colbert-stage colbert-s1">
    <rect class="colbert-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="colbert-step" x="280" y="142">02</text>
    <text class="colbert-name" x="306" y="142">Which can still be precomputed</text>
    <text class="colbert-desc" x="280" y="166">Unlike a cross-encoder.</text>
  </g>
  <line class="colbert-line colbert-conn colbert-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#colbert-tip)"/>
  <g class="colbert-stage colbert-s2">
    <rect class="colbert-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="colbert-step" x="516" y="142">03</text>
    <text class="colbert-name" x="542" y="142">Match each query token to its best passage token</text>
    <text class="colbert-desc" x="516" y="166">And sum those best matches.</text>
  </g>
  <line class="colbert-line colbert-conn colbert-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#colbert-tip)"/>
  <g class="colbert-stage colbert-s3">
    <rect class="colbert-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="colbert-step" x="752" y="142">04</text>
    <text class="colbert-name" x="778" y="142">Landing between the two extremes</text>
    <text class="colbert-desc" x="752" y="166">Near cross-encoder quality, near</text>
    <text class="colbert-desc" x="752" y="182">bi-encoder speed.</text>
    <text class="colbert-edge" x="752" y="242">more storage</text>
  </g>
  <text class="colbert-sub" x="30" y="304">The storage cost is the reason this is not universal: a vector per token is one to two orders of magnitude more than a vector per passage.</text>
</svg>
