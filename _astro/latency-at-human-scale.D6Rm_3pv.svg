<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The ratios are the point. The exact digits differ per machine and per year.">
  <title>The pyramid, if a register access took one second</title>
  <style>
    .latency-at-human-scale-bg   { fill: #f8fafc; }
    .latency-at-human-scale-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-at-human-scale-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-at-human-scale-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-at-human-scale-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-at-human-scale-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-at-human-scale-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-at-human-scale-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latency-at-human-scale-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latency-at-human-scale-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latency-at-human-scale-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latency-at-human-scale-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latency-at-human-scale-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .latency-at-human-scale-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .latency-at-human-scale-stage { opacity: 1; }

    .latency-at-human-scale-s0 { animation-delay: 0.00s; }
    .latency-at-human-scale-e0 { animation-delay: 0.00s; }
    .latency-at-human-scale-s1 { animation-delay: 1.33s; }
    .latency-at-human-scale-e1 { animation-delay: 1.33s; }
    .latency-at-human-scale-s2 { animation-delay: 2.67s; }
    .latency-at-human-scale-e2 { animation-delay: 2.67s; }
    .latency-at-human-scale-s3 { animation-delay: 4.00s; }
    .latency-at-human-scale-e3 { animation-delay: 4.00s; }
    .latency-at-human-scale-s4 { animation-delay: 5.33s; }
    .latency-at-human-scale-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .latency-at-human-scale-conn  { animation: latency-at-human-scale-trace 8s ease-in-out infinite; }
      .latency-at-human-scale-stage { animation: latency-at-human-scale-arrive 8s ease-in-out infinite; }
    }
    @keyframes latency-at-human-scale-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes latency-at-human-scale-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .latency-at-human-scale-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .latency-at-human-scale-stage { animation: latency-at-human-scale-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes latency-at-human-scale-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="latency-at-human-scale-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="latency-at-human-scale-bg" width="980" height="322"/>
  <text class="latency-at-human-scale-h1"  x="30" y="40">The pyramid, if a register access took one second</text>
  <text class="latency-at-human-scale-sub" x="30" y="64">The ratios are the point. The exact digits differ per machine and per year.</text>
  <g class="latency-at-human-scale-stage latency-at-human-scale-s0">
    <rect class="latency-at-human-scale-good" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="latency-at-human-scale-step" x="44" y="142">01</text>
    <text class="latency-at-human-scale-name" x="70" y="142">Register</text>
    <text class="latency-at-human-scale-desc" x="44" y="166">0.3 nanoseconds. The</text>
    <text class="latency-at-human-scale-desc" x="44" y="182">values in play right now.</text>
    <text class="latency-at-human-scale-edge" x="44" y="242">1 second</text>
  </g>
  <line class="latency-at-human-scale-line latency-at-human-scale-conn latency-at-human-scale-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#latency-at-human-scale-tip)"/>
  <g class="latency-at-human-scale-stage latency-at-human-scale-s1">
    <rect class="latency-at-human-scale-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="latency-at-human-scale-step" x="233" y="142">02</text>
    <text class="latency-at-human-scale-name" x="259" y="142">L1 cache</text>
    <text class="latency-at-human-scale-desc" x="233" y="166">About 1 nanosecond. The</text>
    <text class="latency-at-human-scale-desc" x="233" y="182">hottest recent data.</text>
    <text class="latency-at-human-scale-edge" x="233" y="242">3 seconds</text>
  </g>
  <line class="latency-at-human-scale-line latency-at-human-scale-conn latency-at-human-scale-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#latency-at-human-scale-tip)"/>
  <g class="latency-at-human-scale-stage latency-at-human-scale-s2">
    <rect class="latency-at-human-scale-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="latency-at-human-scale-step" x="422" y="142">03</text>
    <text class="latency-at-human-scale-name" x="448" y="142">RAM</text>
    <text class="latency-at-human-scale-desc" x="422" y="166">About 100 nanoseconds.</text>
    <text class="latency-at-human-scale-desc" x="422" y="182">Everything running.</text>
    <text class="latency-at-human-scale-edge" x="422" y="242">5 minutes</text>
  </g>
  <line class="latency-at-human-scale-line latency-at-human-scale-conn latency-at-human-scale-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#latency-at-human-scale-tip)"/>
  <g class="latency-at-human-scale-stage latency-at-human-scale-s3">
    <rect class="latency-at-human-scale-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="latency-at-human-scale-step" x="611" y="142">04</text>
    <text class="latency-at-human-scale-name" x="637" y="142">SSD</text>
    <text class="latency-at-human-scale-desc" x="611" y="166">About 100 microseconds.</text>
    <text class="latency-at-human-scale-desc" x="611" y="182">Files, and anything</text>
    <text class="latency-at-human-scale-desc" x="611" y="198">swapped.</text>
    <text class="latency-at-human-scale-edge" x="611" y="242">4 days</text>
  </g>
  <line class="latency-at-human-scale-line latency-at-human-scale-conn latency-at-human-scale-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#latency-at-human-scale-tip)"/>
  <g class="latency-at-human-scale-stage latency-at-human-scale-s4">
    <rect class="latency-at-human-scale-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="latency-at-human-scale-step" x="800" y="142">05</text>
    <text class="latency-at-human-scale-name" x="826" y="142">Network</text>
    <text class="latency-at-human-scale-desc" x="800" y="166">Milliseconds. Datasets</text>
    <text class="latency-at-human-scale-desc" x="800" y="182">and checkpoints.</text>
    <text class="latency-at-human-scale-edge" x="800" y="242">months</text>
  </g>
  <text class="latency-at-human-scale-sub" x="30" y="304">Register to SSD is roughly a factor of a million. That single ratio explains most performance surprises.</text>
</svg>
