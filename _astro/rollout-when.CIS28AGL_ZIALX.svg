<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what does not.">
  <title>What gets a flag</title>
  <style>
    .rollout-when-bg   { fill: #f8fafc; }
    .rollout-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rollout-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rollout-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rollout-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rollout-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rollout-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rollout-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rollout-when-row { opacity: 1; }
    .rollout-when-r0 { animation-delay: 0.00s; }
    .rollout-when-r1 { animation-delay: 0.45s; }
    .rollout-when-r2 { animation-delay: 0.90s; }
    .rollout-when-r3 { animation-delay: 1.35s; }
    .rollout-when-r4 { animation-delay: 1.80s; }
    .rollout-when-row { animation: rollout-when-reveal 7.3s ease-in-out infinite; }
    @keyframes rollout-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rollout-when-bg" width="980" height="390"/>
  <text class="rollout-when-h1"  x="30" y="40">What gets a flag</text>
  <text class="rollout-when-sub" x="30" y="64">And what does not.</text>
  <rect class="rollout-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rollout-when-name" x="46" y="122">Flag it</text>
  <text class="rollout-when-desc" x="46" y="142">Anything that changes behaviour.</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r0" x="46" y="182">Model upgrades</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r1" x="46" y="216">Prompt version migrations</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r2" x="46" y="250">System prompt refinements</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r3" x="46" y="284">Multi-tenant capability launches</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r4" x="46" y="318">Anything a user could notice</text>
  <rect class="rollout-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rollout-when-name" x="526" y="122">Do not</text>
  <text class="rollout-when-desc" x="526" y="142">No users to protect.</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r0" x="526" y="182">One-off developer scripts</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r1" x="526" y="216">Offline evaluation benchmarks</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r2" x="526" y="250">A flag system for a notebook</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r3" x="526" y="284">But keep the deterministic hash</text>
  <text class="rollout-when-desc rollout-when-row rollout-when-r4" x="526" y="318">It costs one line and one salt</text>
  <text class="rollout-when-sub" x="30" y="372">"Anything a user could notice" is the usable test, and for an AI system it is broader than it looks: tone, verbosity and formatting are all noticeable, and none of them shows up in an error rate.</text>
</svg>
