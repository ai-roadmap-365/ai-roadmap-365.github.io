<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is too early.">
  <title>When to build a tested library</title>
  <style>
    .library-when-bg   { fill: #f8fafc; }
    .library-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-when-row { opacity: 1; }
    .library-when-r0 { animation-delay: 0.00s; }
    .library-when-r1 { animation-delay: 0.45s; }
    .library-when-r2 { animation-delay: 0.90s; }
    .library-when-r3 { animation-delay: 1.35s; }
    .library-when-r4 { animation-delay: 1.80s; }
    .library-when-row { animation: library-when-reveal 7.3s ease-in-out infinite; }
    @keyframes library-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-when-bg" width="980" height="390"/>
  <text class="library-when-h1"  x="30" y="40">When to build a tested library</text>
  <text class="library-when-sub" x="30" y="64">And when it is too early.</text>
  <rect class="library-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-when-name" x="46" y="122">Build it</text>
  <text class="library-when-desc" x="46" y="142">Production and scale.</text>
  <text class="library-when-desc library-when-row library-when-r0" x="46" y="182">Anything with users</text>
  <text class="library-when-desc library-when-row library-when-r1" x="46" y="216">More than a handful of prompts</text>
  <text class="library-when-desc library-when-row library-when-r2" x="46" y="250">More than one person editing</text>
  <text class="library-when-desc library-when-row library-when-r3" x="46" y="284">Where model updates would matter</text>
  <text class="library-when-desc library-when-row library-when-r4" x="46" y="318">And where a regression costs something</text>
  <rect class="library-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-when-name" x="526" y="122">Not yet</text>
  <text class="library-when-desc" x="526" y="142">Exploration.</text>
  <text class="library-when-desc library-when-row library-when-r0" x="526" y="182">Prototyping a new feature</text>
  <text class="library-when-desc library-when-row library-when-r1" x="526" y="216">Prompts likely to be discarded</text>
  <text class="library-when-desc library-when-row library-when-r2" x="526" y="250">A single throwaway script</text>
  <text class="library-when-desc library-when-row library-when-r3" x="526" y="284">Before the task is settled</text>
  <text class="library-when-desc library-when-row library-when-r4" x="526" y="318">Which is a short window</text>
  <text class="library-when-sub" x="30" y="372">The transition point is the first user, not the tenth prompt, because that is when a silent regression starts costing something outside the team.</text>
</svg>
