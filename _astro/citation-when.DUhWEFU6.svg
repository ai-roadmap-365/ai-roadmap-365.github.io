<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when claiming them is enough.">
  <title>When to verify citations</title>
  <style>
    .citation-when-bg   { fill: #f8fafc; }
    .citation-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .citation-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .citation-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .citation-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .citation-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .citation-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .citation-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .citation-when-row { opacity: 1; }
    .citation-when-r0 { animation-delay: 0.00s; }
    .citation-when-r1 { animation-delay: 0.45s; }
    .citation-when-r2 { animation-delay: 0.90s; }
    .citation-when-r3 { animation-delay: 1.35s; }
    .citation-when-r4 { animation-delay: 1.80s; }
    .citation-when-row { animation: citation-when-reveal 7.3s ease-in-out infinite; }
    @keyframes citation-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="citation-when-bg" width="980" height="390"/>
  <text class="citation-when-h1"  x="30" y="40">When to verify citations</text>
  <text class="citation-when-sub" x="30" y="64">And when claiming them is enough.</text>
  <rect class="citation-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="citation-when-name" x="46" y="122">Verify</text>
  <text class="citation-when-desc" x="46" y="142">Four cases.</text>
  <text class="citation-when-desc citation-when-row citation-when-r0" x="46" y="182">Medical, legal or financial answers</text>
  <text class="citation-when-desc citation-when-row citation-when-r1" x="46" y="216">Anything a user will act on</text>
  <text class="citation-when-desc citation-when-row citation-when-r2" x="46" y="250">Regulated or audited output</text>
  <text class="citation-when-desc citation-when-row citation-when-r3" x="46" y="284">Where a wrong citation is a liability</text>
  <text class="citation-when-desc citation-when-row citation-when-r4" x="46" y="318">And where coverage can be sacrificed</text>
  <rect class="citation-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="citation-when-name" x="526" y="122">Claim only</text>
  <text class="citation-when-desc" x="526" y="142">Also four.</text>
  <text class="citation-when-desc citation-when-row citation-when-r0" x="526" y="182">Internal exploratory tools</text>
  <text class="citation-when-desc citation-when-row citation-when-r1" x="526" y="216">Where a person checks every answer</text>
  <text class="citation-when-desc citation-when-row citation-when-r2" x="526" y="250">Brainstorming and drafting</text>
  <text class="citation-when-desc citation-when-row citation-when-r3" x="526" y="284">Very low-stakes questions</text>
  <text class="citation-when-desc citation-when-row citation-when-r4" x="526" y="318">But say clearly that they are unverified</text>
  <text class="citation-when-sub" x="30" y="372">Saying clearly that citations are unverified is the minimum in the second column, because the default assumption of any reader is that a reference was checked.</text>
</svg>
