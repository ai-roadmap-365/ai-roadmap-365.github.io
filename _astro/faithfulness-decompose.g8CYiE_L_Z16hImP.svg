<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Measuring faithfulness</title>
  <style>
    .faithfulness-decompose-bg   { fill: #f8fafc; }
    .faithfulness-decompose-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-decompose-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-decompose-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-decompose-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-decompose-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-decompose-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .faithfulness-decompose-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .faithfulness-decompose-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .faithfulness-decompose-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .faithfulness-decompose-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .faithfulness-decompose-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .faithfulness-decompose-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .faithfulness-decompose-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .faithfulness-decompose-stage { opacity: 1; }

    .faithfulness-decompose-s0 { animation-delay: 0.00s; }
    .faithfulness-decompose-e0 { animation-delay: 0.00s; }
    .faithfulness-decompose-s1 { animation-delay: 1.28s; }
    .faithfulness-decompose-e1 { animation-delay: 1.28s; }
    .faithfulness-decompose-s2 { animation-delay: 2.56s; }
    .faithfulness-decompose-e2 { animation-delay: 2.56s; }
    .faithfulness-decompose-s3 { animation-delay: 3.84s; }
    .faithfulness-decompose-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .faithfulness-decompose-conn  { animation: faithfulness-decompose-trace 6.4s ease-in-out infinite; }
      .faithfulness-decompose-stage { animation: faithfulness-decompose-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes faithfulness-decompose-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes faithfulness-decompose-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .faithfulness-decompose-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .faithfulness-decompose-stage { animation: faithfulness-decompose-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes faithfulness-decompose-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="faithfulness-decompose-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="faithfulness-decompose-bg" width="980" height="322"/>
  <text class="faithfulness-decompose-h1"  x="30" y="40">Measuring faithfulness</text>
  <text class="faithfulness-decompose-sub" x="30" y="64">Four steps.</text>
  <g class="faithfulness-decompose-stage faithfulness-decompose-s0">
    <rect class="faithfulness-decompose-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="faithfulness-decompose-step" x="44" y="142">01</text>
    <text class="faithfulness-decompose-name" x="70" y="142">Decompose the answer into claims</text>
    <text class="faithfulness-decompose-desc" x="44" y="166">One assertion each,</text>
    <text class="faithfulness-decompose-desc" x="44" y="182">self-contained.</text>
  </g>
  <line class="faithfulness-decompose-line faithfulness-decompose-conn faithfulness-decompose-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#faithfulness-decompose-tip)"/>
  <g class="faithfulness-decompose-stage faithfulness-decompose-s1">
    <rect class="faithfulness-decompose-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="faithfulness-decompose-step" x="280" y="142">02</text>
    <text class="faithfulness-decompose-name" x="306" y="142">Check each against the retrieved context</text>
    <text class="faithfulness-decompose-desc" x="280" y="166">Supported, contradicted, or</text>
    <text class="faithfulness-decompose-desc" x="280" y="182">unaddressed.</text>
  </g>
  <line class="faithfulness-decompose-line faithfulness-decompose-conn faithfulness-decompose-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#faithfulness-decompose-tip)"/>
  <g class="faithfulness-decompose-stage faithfulness-decompose-s2">
    <rect class="faithfulness-decompose-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="faithfulness-decompose-step" x="516" y="142">03</text>
    <text class="faithfulness-decompose-name" x="542" y="142">Score as the supported fraction</text>
    <text class="faithfulness-decompose-desc" x="516" y="166">Directly interpretable, unlike</text>
    <text class="faithfulness-decompose-desc" x="516" y="182">most metrics.</text>
  </g>
  <line class="faithfulness-decompose-line faithfulness-decompose-conn faithfulness-decompose-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#faithfulness-decompose-tip)"/>
  <g class="faithfulness-decompose-stage faithfulness-decompose-s3">
    <rect class="faithfulness-decompose-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="faithfulness-decompose-step" x="752" y="142">04</text>
    <text class="faithfulness-decompose-name" x="778" y="142">A low score means the model ignored its sources</text>
    <text class="faithfulness-decompose-desc" x="752" y="166">Which is a prompting or model</text>
    <text class="faithfulness-decompose-desc" x="752" y="182">problem, not retrieval.</text>
  </g>
  <text class="faithfulness-decompose-sub" x="30" y="304">Attributing a low faithfulness score to the generation stage rather than to retrieval is what makes it actionable: the passages were there and were not used.</text>
</svg>
