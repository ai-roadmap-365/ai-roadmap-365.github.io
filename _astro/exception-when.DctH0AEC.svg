<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to let it fly.">
  <title>When to catch</title>
  <style>
    .exception-when-bg   { fill: #f8fafc; }
    .exception-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exception-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exception-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exception-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exception-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exception-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exception-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exception-when-row { opacity: 1; }
    .exception-when-r0 { animation-delay: 0.00s; }
    .exception-when-r1 { animation-delay: 0.45s; }
    .exception-when-r2 { animation-delay: 0.90s; }
    .exception-when-r3 { animation-delay: 1.35s; }
    .exception-when-r4 { animation-delay: 1.80s; }
    .exception-when-row { animation: exception-when-reveal 7.3s ease-in-out infinite; }
    @keyframes exception-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exception-when-bg" width="980" height="390"/>
  <text class="exception-when-h1"  x="30" y="40">When to catch</text>
  <text class="exception-when-sub" x="30" y="64">And when to let it fly.</text>
  <rect class="exception-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exception-when-name" x="46" y="122">Catch it</text>
  <text class="exception-when-desc" x="46" y="142">Four cases.</text>
  <text class="exception-when-desc exception-when-row exception-when-r0" x="46" y="182">You can genuinely recover</text>
  <text class="exception-when-desc exception-when-row exception-when-r1" x="46" y="216">A retry is likely to succeed</text>
  <text class="exception-when-desc exception-when-row exception-when-r2" x="46" y="250">A fallback exists and is documented</text>
  <text class="exception-when-desc exception-when-row exception-when-r3" x="46" y="284">At the boundary, to translate it</text>
  <text class="exception-when-desc exception-when-row exception-when-r4" x="46" y="318">To add context, then re-raise</text>
  <rect class="exception-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exception-when-name" x="526" y="122">Let it propagate</text>
  <text class="exception-when-desc" x="526" y="142">Also four.</text>
  <text class="exception-when-desc exception-when-row exception-when-r0" x="526" y="182">You cannot do anything useful</text>
  <text class="exception-when-desc exception-when-row exception-when-r1" x="526" y="216">It signals a programming bug</text>
  <text class="exception-when-desc exception-when-row exception-when-r2" x="526" y="250">Catching would hide the cause</text>
  <text class="exception-when-desc exception-when-row exception-when-r3" x="526" y="284">Where the caller knows better</text>
  <text class="exception-when-desc exception-when-row exception-when-r4" x="526" y="318">Which is most of the time</text>
  <text class="exception-when-sub" x="30" y="372">Letting it propagate being the common case is worth stating: most code should not handle exceptions, and a codebase full of try blocks is usually hiding rather than handling.</text>
</svg>
