<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Agglomerative clustering</title>
  <style>
    .hac-bg   { fill: #f8fafc; }
    .hac-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hac-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hac-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hac-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hac-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hac-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hac-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hac-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hac-stage { opacity: 1; }

    .hac-s0 { animation-delay: 0.00s; }
    .hac-e0 { animation-delay: 0.00s; }
    .hac-s1 { animation-delay: 1.28s; }
    .hac-e1 { animation-delay: 1.28s; }
    .hac-s2 { animation-delay: 2.56s; }
    .hac-e2 { animation-delay: 2.56s; }
    .hac-s3 { animation-delay: 3.84s; }
    .hac-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hac-conn  { animation: hac-trace 6.4s ease-in-out infinite; }
      .hac-stage { animation: hac-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hac-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hac-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hac-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hac-stage { animation: hac-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hac-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hac-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hac-bg" width="980" height="322"/>
  <text class="hac-h1"  x="30" y="40">Agglomerative clustering</text>
  <text class="hac-sub" x="30" y="64">Four steps.</text>
  <g class="hac-stage hac-s0">
    <rect class="hac-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hac-step" x="44" y="142">01</text>
    <text class="hac-name" x="70" y="142">Start with every point as its own cluster</text>
    <text class="hac-desc" x="44" y="166">N clusters, for N points.</text>
  </g>
  <line class="hac-line hac-conn hac-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hac-tip)"/>
  <g class="hac-stage hac-s1">
    <rect class="hac-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hac-step" x="280" y="142">02</text>
    <text class="hac-name" x="306" y="142">Find the closest pair</text>
    <text class="hac-desc" x="280" y="166">By a linkage rule, which is the</text>
    <text class="hac-desc" x="280" y="182">key choice.</text>
  </g>
  <line class="hac-line hac-conn hac-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hac-tip)"/>
  <g class="hac-stage hac-s2">
    <rect class="hac-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hac-step" x="516" y="142">03</text>
    <text class="hac-name" x="542" y="142">Merge them, and repeat</text>
    <text class="hac-desc" x="516" y="166">Until one cluster remains.</text>
  </g>
  <line class="hac-line hac-conn hac-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hac-tip)"/>
  <g class="hac-stage hac-s3">
    <rect class="hac-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hac-step" x="752" y="142">04</text>
    <text class="hac-name" x="778" y="142">The merge order is the hierarchy</text>
    <text class="hac-desc" x="752" y="166">Cut it at any height to get a</text>
    <text class="hac-desc" x="752" y="182">partition.</text>
    <text class="hac-edge" x="752" y="242">a tree</text>
  </g>
  <text class="hac-sub" x="30" y="304">The linkage rule decides the character of the result far more than the algorithm does, which is why it deserves more attention than it usually gets.</text>
</svg>
