<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Whatever the data.">
  <title>Two facts that always hold</title>
  <style>
    .two-facts-bg   { fill: #f8fafc; }
    .two-facts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-facts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-facts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-facts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-facts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-facts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-facts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-facts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-facts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-facts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-facts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-facts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .two-facts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .two-facts-stage { opacity: 1; }

    .two-facts-s0 { animation-delay: 0.00s; }
    .two-facts-e0 { animation-delay: 0.00s; }
    .two-facts-s1 { animation-delay: 2.00s; }
    .two-facts-e1 { animation-delay: 2.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .two-facts-conn  { animation: two-facts-trace 6s ease-in-out infinite; }
      .two-facts-stage { animation: two-facts-arrive 6s ease-in-out infinite; }
    }
    @keyframes two-facts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes two-facts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .two-facts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .two-facts-stage { animation: two-facts-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes two-facts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="two-facts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="two-facts-bg" width="980" height="322"/>
  <text class="two-facts-h1"  x="30" y="40">Two facts that always hold</text>
  <text class="two-facts-sub" x="30" y="64">Whatever the data.</text>
  <g class="two-facts-stage two-facts-s0">
    <rect class="two-facts-good" x="30" y="118" width="447" height="104" rx="10"/>
    <text class="two-facts-step" x="44" y="142">01</text>
    <text class="two-facts-name" x="70" y="142">The residuals sum to zero</text>
    <text class="two-facts-desc" x="44" y="166">Whenever an intercept is fitted. Always.</text>
  </g>
  <line class="two-facts-line two-facts-conn two-facts-e0" x1="479" y1="170" x2="501" y2="170" marker-end="url(#two-facts-tip)"/>
  <g class="two-facts-stage two-facts-s1">
    <rect class="two-facts-warn" x="503" y="118" width="447" height="104" rx="10"/>
    <text class="two-facts-step" x="517" y="142">02</text>
    <text class="two-facts-name" x="543" y="142">And the line passes through the mean of the data</text>
    <text class="two-facts-desc" x="517" y="166">The centroid, in every dimension.</text>
  </g>
  <text class="two-facts-sub" x="30" y="304">Both follow from the fitting itself rather than from any assumption about the data, which makes them useful as arithmetic checks on an implementation.</text>
</svg>
