<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two lists.">
  <title>Where compatibility holds and where it breaks</title>
  <style>
    .tool-calling-std-bg   { fill: #f8fafc; }
    .tool-calling-std-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-calling-std-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-calling-std-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-calling-std-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-calling-std-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-calling-std-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-calling-std-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-calling-std-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-calling-std-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-calling-std-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-calling-std-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-calling-std-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-calling-std-row { opacity: 1; }
    .tool-calling-std-r0 { animation-delay: 0.00s; }
    .tool-calling-std-r1 { animation-delay: 0.45s; }
    .tool-calling-std-r2 { animation-delay: 0.90s; }
    .tool-calling-std-r3 { animation-delay: 1.35s; }
    .tool-calling-std-r4 { animation-delay: 1.80s; }
    .tool-calling-std-row { animation: tool-calling-std-reveal 7.3s ease-in-out infinite; }
    @keyframes tool-calling-std-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tool-calling-std-bg" width="980" height="390"/>
  <text class="tool-calling-std-h1"  x="30" y="40">Where compatibility holds and where it breaks</text>
  <text class="tool-calling-std-sub" x="30" y="64">Two lists.</text>
  <rect class="tool-calling-std-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tool-calling-std-name" x="46" y="122">Portable</text>
  <text class="tool-calling-std-desc" x="46" y="142">The common path.</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r0" x="46" y="182">Messages with roles</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r1" x="46" y="216">Basic sampling parameters</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r2" x="46" y="250">Streaming of plain text</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r3" x="46" y="284">Token usage reporting</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r4" x="46" y="318">Which covers most applications</text>
  <rect class="tool-calling-std-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tool-calling-std-name" x="526" y="122">Provider-specific</text>
  <text class="tool-calling-std-desc" x="526" y="142">The edges.</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r0" x="526" y="182">Tool call formats and semantics</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r1" x="526" y="216">Structured output modes</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r2" x="526" y="250">Caching and batch endpoints</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r3" x="526" y="284">Error codes and messages</text>
  <text class="tool-calling-std-desc tool-calling-std-row tool-calling-std-r4" x="526" y="318">And multimodal input handling</text>
  <text class="tool-calling-std-sub" x="30" y="372">Knowing which column a feature is in before depending on it is the whole discipline here, and it is what keeps a portability claim honest.</text>
</svg>
