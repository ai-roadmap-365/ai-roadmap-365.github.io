<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Hierarchical Agent Configuration Architecture">
  <title>Hierarchical Agent Configuration Architecture</title>
  <defs>
    <style>
      .d305a-bg { fill: #f8fafc; }
      .d305a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d305a-glob { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d305a-proj { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d305a-skill { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d305a-task { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d305a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d305a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d305a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d305a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d305a-bg" />
  
  <text x="40" y="40" class="d305a-title">Hierarchical Configuration &amp; Rule Precedence</text>
  <text x="40" y="65" class="d305a-subtitle">Hierarchical Agent Configuration Architecture showing Global Rules, Project AGENTS.md, Custom Skills On-Demand, Persistent Memory Store, and Task Prompt</text>
  
  <!-- Level 1: Global User Rules -->
  <rect x="40" y="100" width="190" height="280" class="d305a-glob" />
  <text x="55" y="130" class="d305a-header" fill="#1d4ed8">1. Global User Rules</text>
  <text x="55" y="155" class="d305a-text">• Path: `~/.config/rules`</text>
  <text x="55" y="175" class="d305a-text">• Author preferences</text>
  <text x="55" y="195" class="d305a-text">• Formatting styles</text>
  <text x="55" y="215" class="d305a-text">• Shell environment</text>
  <text x="55" y="245" class="d305a-text" font-weight="600">Scope:</text>
  <text x="55" y="265" class="d305a-text">Applies across all repos</text>
  <text x="55" y="295" class="d305a-text" font-weight="600">Priority:</text>
  <text x="55" y="315" class="d305a-text">Lowest (Overridable)</text>
  
  <!-- Level 2: Project AGENTS.md -->
  <rect x="255" y="100" width="190" height="280" class="d305a-proj" />
  <text x="270" y="130" class="d305a-header" fill="#7e22ce">2. Project AGENTS.md</text>
  <text x="270" y="155" class="d305a-text">• Path: `./AGENTS.md`</text>
  <text x="270" y="175" class="d305a-text">• Build commands</text>
  <text x="270" y="195" class="d305a-text">• Test runner scripts</text>
  <text x="270" y="215" class="d305a-text">• Arch invariants</text>
  <text x="270" y="245" class="d305a-text" font-weight="600">Scope:</text>
  <text x="270" y="265" class="d305a-text">This specific repository</text>
  <text x="270" y="295" class="d305a-text" font-weight="600">Priority:</text>
  <text x="270" y="315" class="d305a-text">Overrides Global</text>
  
  <!-- Level 3: Custom Skills -->
  <rect x="470" y="100" width="190" height="280" class="d305a-skill" />
  <text x="485" y="130" class="d305a-header" fill="#15803d">3. Skills &amp; Memory</text>
  <text x="485" y="155" class="d305a-text">• Path: `.agents/skills/`</text>
  <text x="485" y="175" class="d305a-text">• On-demand workflows</text>
  <text x="485" y="195" class="d305a-text">• Domain scripts</text>
  <text x="485" y="215" class="d305a-text">• Past bug post-mortems</text>
  <text x="485" y="245" class="d305a-text" font-weight="600">Activation:</text>
  <text x="485" y="265" class="d305a-text">Lazy loaded on trigger</text>
  <text x="485" y="295" class="d305a-text" font-weight="600">Priority:</text>
  <text x="485" y="315" class="d305a-text">Domain Specific</text>
  
  <!-- Level 4: Task Spec Prompt -->
  <rect x="685" y="100" width="180" height="280" class="d305a-task" />
  <text x="700" y="130" class="d305a-header" fill="#b91c1c">4. Task Spec Prompt</text>
  <text x="700" y="155" class="d305a-text">• Current prompt</text>
  <text x="700" y="175" class="d305a-text">• Immediate objective</text>
  <text x="700" y="195" class="d305a-text">• Non-goals &amp; limits</text>
  <text x="700" y="215" class="d305a-text">• Target files</text>
  <text x="700" y="245" class="d305a-text" font-weight="600">Scope:</text>
  <text x="700" y="265" class="d305a-text">Active session only</text>
  <text x="700" y="295" class="d305a-text" font-weight="600">Priority:</text>
  <text x="700" y="315" class="d305a-text">Highest Authority</text>
</svg>