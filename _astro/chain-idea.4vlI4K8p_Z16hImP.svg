<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What the chain rule says</title>
  <style>
    .chain-idea-bg   { fill: #f8fafc; }
    .chain-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chain-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chain-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chain-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chain-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chain-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chain-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chain-idea-stage { opacity: 1; }

    .chain-idea-s0 { animation-delay: 0.00s; }
    .chain-idea-e0 { animation-delay: 0.00s; }
    .chain-idea-s1 { animation-delay: 1.28s; }
    .chain-idea-e1 { animation-delay: 1.28s; }
    .chain-idea-s2 { animation-delay: 2.56s; }
    .chain-idea-e2 { animation-delay: 2.56s; }
    .chain-idea-s3 { animation-delay: 3.84s; }
    .chain-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chain-idea-conn  { animation: chain-idea-trace 6.4s ease-in-out infinite; }
      .chain-idea-stage { animation: chain-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chain-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chain-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chain-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chain-idea-stage { animation: chain-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chain-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chain-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chain-idea-bg" width="980" height="322"/>
  <text class="chain-idea-h1"  x="30" y="40">What the chain rule says</text>
  <text class="chain-idea-sub" x="30" y="64">Four steps.</text>
  <g class="chain-idea-stage chain-idea-s0">
    <rect class="chain-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chain-idea-step" x="44" y="142">01</text>
    <text class="chain-idea-name" x="70" y="142">One function feeds into another</text>
    <text class="chain-idea-desc" x="44" y="166">Which is composition.</text>
  </g>
  <line class="chain-idea-line chain-idea-conn chain-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chain-idea-tip)"/>
  <g class="chain-idea-stage chain-idea-s1">
    <rect class="chain-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chain-idea-step" x="280" y="142">02</text>
    <text class="chain-idea-name" x="306" y="142">The outer function has a rate of change</text>
    <text class="chain-idea-desc" x="280" y="166">With respect to its input.</text>
  </g>
  <line class="chain-idea-line chain-idea-conn chain-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chain-idea-tip)"/>
  <g class="chain-idea-stage chain-idea-s2">
    <rect class="chain-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chain-idea-step" x="516" y="142">03</text>
    <text class="chain-idea-name" x="542" y="142">So does the inner one</text>
    <text class="chain-idea-desc" x="516" y="166">With respect to the original</text>
    <text class="chain-idea-desc" x="516" y="182">variable.</text>
  </g>
  <line class="chain-idea-line chain-idea-conn chain-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chain-idea-tip)"/>
  <g class="chain-idea-stage chain-idea-s3">
    <rect class="chain-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chain-idea-step" x="752" y="142">04</text>
    <text class="chain-idea-name" x="778" y="142">Multiply them to get the overall rate</text>
    <text class="chain-idea-desc" x="752" y="166">Rates compose by multiplication.</text>
  </g>
  <text class="chain-idea-sub" x="30" y="304">Rates multiplying rather than adding is the whole content of the rule, and it is why a long chain of small factors shrinks toward nothing.</text>
</svg>
