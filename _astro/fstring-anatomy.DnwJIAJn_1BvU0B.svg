<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of an f-string: literal text, an embedded expression, and a format spec producing formatted output</title>
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of an f-string</text>

  <!-- Token boxes making up the f-string -->
  <rect x="40"  y="96" width="36"  height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="58"  y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">f</text>

  <rect x="80"  y="96" width="150" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="155" y="132" text-anchor="middle" font-size="20" fill="#1a202c">"Total: </text>

  <rect x="234" y="96" width="28"  height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="248" y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">{</text>

  <rect x="266" y="96" width="168" height="56" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="350" y="132" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">price * qty</text>

  <rect x="438" y="96" width="86"  height="56" fill="#c7d2fe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="481" y="132" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">:.2f</text>

  <rect x="528" y="96" width="28"  height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="542" y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">}</text>

  <rect x="560" y="96" width="28"  height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="574" y="132" text-anchor="middle" font-size="20" fill="#1a202c">"</text>

  <!-- Callout labels -->
  <text x="155" y="184" text-anchor="middle" font-size="14" fill="#1a202c">literal text, kept as-is</text>

  <line x1="350" y1="152" x2="350" y2="206" stroke="#1d4ed8" stroke-width="2"/>
  <text x="350" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">expression</text>
  <text x="350" y="242" text-anchor="middle" font-size="14" fill="#1a202c">evaluated first</text>

  <line x1="481" y1="152" x2="481" y2="270" stroke="#1d4ed8" stroke-width="2"/>
  <text x="481" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">format spec</text>
  <text x="481" y="306" text-anchor="middle" font-size="14" fill="#1a202c">2 decimal places</text>

  <!-- Flow arrow to output -->
  <line x1="360" y1="316" x2="360" y2="360" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="360,368 352,352 368,352" fill="#1d4ed8"/>
  <text x="384" y="344" font-size="14" fill="#1a202c">Python evaluates, then formats</text>

  <!-- Given values -->
  <text x="360" y="392" text-anchor="middle" font-size="14" fill="#1a202c">with price = 5.0 and qty = 5, the expression is 25.0</text>

  <!-- Output box -->
  <rect x="230" y="404" width="260" height="44" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="432" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Total: 25.00</text>
</svg>
