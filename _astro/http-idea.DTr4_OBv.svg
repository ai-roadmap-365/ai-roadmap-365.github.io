<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What an HTTP call involves</title>
  <style>
    .http-idea-bg   { fill: #f8fafc; }
    .http-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .http-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .http-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .http-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .http-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .http-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .http-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .http-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .http-idea-stage { opacity: 1; }

    .http-idea-s0 { animation-delay: 0.00s; }
    .http-idea-e0 { animation-delay: 0.00s; }
    .http-idea-s1 { animation-delay: 1.28s; }
    .http-idea-e1 { animation-delay: 1.28s; }
    .http-idea-s2 { animation-delay: 2.56s; }
    .http-idea-e2 { animation-delay: 2.56s; }
    .http-idea-s3 { animation-delay: 3.84s; }
    .http-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .http-idea-conn  { animation: http-idea-trace 6.4s ease-in-out infinite; }
      .http-idea-stage { animation: http-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes http-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes http-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .http-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .http-idea-stage { animation: http-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes http-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="http-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="http-idea-bg" width="980" height="322"/>
  <text class="http-idea-h1"  x="30" y="40">What an HTTP call involves</text>
  <text class="http-idea-sub" x="30" y="64">Four steps.</text>
  <g class="http-idea-stage http-idea-s0">
    <rect class="http-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="http-idea-step" x="44" y="142">01</text>
    <text class="http-idea-name" x="70" y="142">Build a request: method, address, headers, body</text>
    <text class="http-idea-desc" x="44" y="166">Which is entirely under your</text>
    <text class="http-idea-desc" x="44" y="182">control.</text>
  </g>
  <line class="http-idea-line http-idea-conn http-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#http-idea-tip)"/>
  <g class="http-idea-stage http-idea-s1">
    <rect class="http-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="http-idea-step" x="280" y="142">02</text>
    <text class="http-idea-name" x="306" y="142">Send it, and wait</text>
    <text class="http-idea-desc" x="280" y="166">For a bounded time, or forever</text>
    <text class="http-idea-desc" x="280" y="182">if you forgot.</text>
  </g>
  <line class="http-idea-line http-idea-conn http-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#http-idea-tip)"/>
  <g class="http-idea-stage http-idea-s2">
    <rect class="http-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="http-idea-step" x="516" y="142">03</text>
    <text class="http-idea-name" x="542" y="142">Receive a status, headers and a body</text>
    <text class="http-idea-desc" x="516" y="166">Which say what happened and what</text>
    <text class="http-idea-desc" x="516" y="182">came back.</text>
  </g>
  <line class="http-idea-line http-idea-conn http-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#http-idea-tip)"/>
  <g class="http-idea-stage http-idea-s3">
    <rect class="http-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="http-idea-step" x="752" y="142">04</text>
    <text class="http-idea-name" x="778" y="142">Then decide what the status means</text>
    <text class="http-idea-desc" x="752" y="166">Which is where most integration</text>
    <text class="http-idea-desc" x="752" y="182">bugs live.</text>
  </g>
  <text class="http-idea-sub" x="30" y="304">Every model API call in the later courses is exactly this, which is why the failure handling here transfers directly.</text>
</svg>
