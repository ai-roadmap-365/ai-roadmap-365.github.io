<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four points.">
  <title>The three batch strategies</title>
  <style>
    .gd-variants-bg   { fill: #f8fafc; }
    .gd-variants-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-variants-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-variants-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-variants-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-variants-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-variants-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gd-variants-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gd-variants-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gd-variants-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gd-variants-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gd-variants-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gd-variants-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gd-variants-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gd-variants-stage { opacity: 1; }

    .gd-variants-s0 { animation-delay: 0.00s; }
    .gd-variants-e0 { animation-delay: 0.00s; }
    .gd-variants-s1 { animation-delay: 1.28s; }
    .gd-variants-e1 { animation-delay: 1.28s; }
    .gd-variants-s2 { animation-delay: 2.56s; }
    .gd-variants-e2 { animation-delay: 2.56s; }
    .gd-variants-s3 { animation-delay: 3.84s; }
    .gd-variants-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gd-variants-conn  { animation: gd-variants-trace 6.4s ease-in-out infinite; }
      .gd-variants-stage { animation: gd-variants-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gd-variants-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gd-variants-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gd-variants-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gd-variants-stage { animation: gd-variants-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gd-variants-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gd-variants-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gd-variants-bg" width="980" height="322"/>
  <text class="gd-variants-h1"  x="30" y="40">The three batch strategies</text>
  <text class="gd-variants-sub" x="30" y="64">Four points.</text>
  <g class="gd-variants-stage gd-variants-s0">
    <rect class="gd-variants-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gd-variants-step" x="44" y="142">01</text>
    <text class="gd-variants-name" x="70" y="142">Full batch: the exact gradient, once per pass</text>
    <text class="gd-variants-desc" x="44" y="166">Accurate, and slow.</text>
  </g>
  <line class="gd-variants-line gd-variants-conn gd-variants-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gd-variants-tip)"/>
  <g class="gd-variants-stage gd-variants-s1">
    <rect class="gd-variants-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gd-variants-step" x="280" y="142">02</text>
    <text class="gd-variants-name" x="306" y="142">One sample at a time: fast, noisy steps</text>
    <text class="gd-variants-desc" x="280" y="166">Which can escape shallow minima.</text>
  </g>
  <line class="gd-variants-line gd-variants-conn gd-variants-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gd-variants-tip)"/>
  <g class="gd-variants-stage gd-variants-s2">
    <rect class="gd-variants-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gd-variants-step" x="516" y="142">03</text>
    <text class="gd-variants-name" x="542" y="142">Mini-batches: a compromise, and the standard</text>
    <text class="gd-variants-desc" x="516" y="166">Good estimates, efficient</text>
    <text class="gd-variants-desc" x="516" y="182">hardware use.</text>
  </g>
  <line class="gd-variants-line gd-variants-conn gd-variants-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gd-variants-tip)"/>
  <g class="gd-variants-stage gd-variants-s3">
    <rect class="gd-variants-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gd-variants-step" x="752" y="142">04</text>
    <text class="gd-variants-name" x="778" y="142">With batch size trading noise against throughput</text>
    <text class="gd-variants-desc" x="752" y="166">Which is a tuning decision.</text>
  </g>
  <text class="gd-variants-sub" x="30" y="304">Mini-batches won not only for the statistics but for the hardware: a batch of a few hundred is what keeps a modern accelerator actually busy.</text>
</svg>
