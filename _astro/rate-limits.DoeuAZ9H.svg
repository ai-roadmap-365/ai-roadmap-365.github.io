<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three resources worth capping.">
  <title>Bounding a runaway loop</title>
  <style>
    .rate-limits-bg   { fill: #f8fafc; }
    .rate-limits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rate-limits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rate-limits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rate-limits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rate-limits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rate-limits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rate-limits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rate-limits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rate-limits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rate-limits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rate-limits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rate-limits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rate-limits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rate-limits-stage { opacity: 1; }

    .rate-limits-s0 { animation-delay: 0.00s; }
    .rate-limits-e0 { animation-delay: 0.00s; }
    .rate-limits-s1 { animation-delay: 1.50s; }
    .rate-limits-e1 { animation-delay: 1.50s; }
    .rate-limits-s2 { animation-delay: 3.00s; }
    .rate-limits-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .rate-limits-conn  { animation: rate-limits-trace 6s ease-in-out infinite; }
      .rate-limits-stage { animation: rate-limits-arrive 6s ease-in-out infinite; }
    }
    @keyframes rate-limits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rate-limits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rate-limits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rate-limits-stage { animation: rate-limits-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rate-limits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rate-limits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rate-limits-bg" width="980" height="322"/>
  <text class="rate-limits-h1"  x="30" y="40">Bounding a runaway loop</text>
  <text class="rate-limits-sub" x="30" y="64">Three resources worth capping.</text>
  <g class="rate-limits-stage rate-limits-s0">
    <rect class="rate-limits-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="rate-limits-step" x="44" y="142">01</text>
    <text class="rate-limits-name" x="70" y="142">A sliding-window rate limit</text>
    <text class="rate-limits-desc" x="44" y="166">Per tool, per client. Hundreds of calls a</text>
    <text class="rate-limits-desc" x="44" y="182">second is a reasoning failure, not a</text>
    <text class="rate-limits-desc" x="44" y="198">workload.</text>
  </g>
  <line class="rate-limits-line rate-limits-conn rate-limits-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#rate-limits-tip)"/>
  <g class="rate-limits-stage rate-limits-s1">
    <rect class="rate-limits-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="rate-limits-step" x="359" y="142">02</text>
    <text class="rate-limits-name" x="385" y="142">Third-party quotas</text>
    <text class="rate-limits-desc" x="359" y="166">So a loop against somebody else's API is your</text>
    <text class="rate-limits-desc" x="359" y="182">incident, not theirs.</text>
  </g>
  <line class="rate-limits-line rate-limits-conn rate-limits-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#rate-limits-tip)"/>
  <g class="rate-limits-stage rate-limits-s2">
    <rect class="rate-limits-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="rate-limits-step" x="674" y="142">03</text>
    <text class="rate-limits-name" x="700" y="142">Disk and log volume</text>
    <text class="rate-limits-desc" x="674" y="166">Rotating logs with a size cap, or an error</text>
    <text class="rate-limits-desc" x="674" y="182">loop fills the disk.</text>
  </g>
  <text class="rate-limits-sub" x="30" y="304">The third is a real denial of service with no attacker required: an agent stuck in an error loop writes audit entries as fast as it fails, and the audit log is what fills the volume.</text>
</svg>
