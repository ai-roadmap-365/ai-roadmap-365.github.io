<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="d152f-title d152f-desc" width="1040" height="660">
  <title id="d152f-title">The same one outlier reaching RMSE and MAE by different routes, and moving each by a different amount</title>
  <desc id="d152f-desc">A flow diagram showing one set of residuals splitting into two paths -- one squares each error before averaging, the other takes the absolute value -- with a token representing one outlier travelling both paths. On the squaring path the token grows enormously; on the absolute-value path it grows only in proportion to its size. The resulting bars show RMSE moving from 2.4801 to 28.2569, a factor of 11.39, while MAE moves from 1.9833 to 5.9448, a factor of 3.00, on the exact same fifty predictions with the exact same one target shifted.</desc>
  <style>
    .d152f-bg { fill: #f8fafc; }
    .d152f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 23px; font-weight: 700; }
    .d152f-sub { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d152f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d152f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d152f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .d152f-num { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d152f-stage { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d152f-source { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
    .d152f-bar-before { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 2; }
    .d152f-bar-after { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 2.5; }
    .d152f-wire { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d152f-axis { stroke: #1a202c; stroke-width: 2; }

    .d152f-token-sq {
      offset-path: path('M 210 148 C 320 148 380 220 420 300');
      offset-rotate: 0deg;
      animation: d152f-travel-sq 6s ease-in-out infinite;
    }
    .d152f-token-ab {
      offset-path: path('M 210 148 C 320 148 380 400 420 460');
      offset-rotate: 0deg;
      animation: d152f-travel-ab 6s ease-in-out infinite;
    }
    @keyframes d152f-travel-sq {
      0%   { offset-distance: 0%;   r: 8;  fill: #1d4ed8; }
      55%  { offset-distance: 92%;  r: 8;  fill: #1d4ed8; }
      70%  { offset-distance: 100%; r: 22; fill: #1a202c; }
      100% { offset-distance: 100%; r: 22; fill: #1a202c; }
    }
    @keyframes d152f-travel-ab {
      0%   { offset-distance: 0%;   r: 8;  fill: #1d4ed8; }
      55%  { offset-distance: 92%;  r: 8;  fill: #1d4ed8; }
      70%  { offset-distance: 100%; r: 12; fill: #1a202c; }
      100% { offset-distance: 100%; r: 12; fill: #1a202c; }
    }
    .d152f-bar-rmse-after { animation: d152f-grow-rmse 6s ease-in-out infinite; }
    .d152f-bar-mae-after { animation: d152f-grow-mae 6s ease-in-out infinite; }
    @keyframes d152f-grow-rmse {
      0%, 55% { height: 24px; y: 476px; opacity: 0.35; }
      70%, 100% { height: 220px; y: 280px; opacity: 1; }
    }
    @keyframes d152f-grow-mae {
      0%, 55% { height: 24px; y: 476px; opacity: 0.35; }
      70%, 100% { height: 58px; y: 442px; opacity: 1; }
    }
    .d152f-note-after { animation: d152f-fade-in 6s ease-in-out infinite; }
    @keyframes d152f-fade-in {
      0%, 60% { opacity: 0; }
      75%, 100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d152f-token-sq, .d152f-token-ab { animation: none; offset-distance: 100%; }
      .d152f-token-sq { r: 22; fill: #1a202c; }
      .d152f-token-ab { r: 12; fill: #1a202c; }
      .d152f-bar-rmse-after { animation: none; height: 220px; y: 280px; opacity: 1; }
      .d152f-bar-mae-after { animation: none; height: 58px; y: 442px; opacity: 1; }
      .d152f-note-after { animation: none; opacity: 1; }
    }
  </style>
  <rect class="d152f-bg" x="0" y="0" width="1040" height="660"/>

  <text class="d152f-title" x="520" y="36" text-anchor="middle">One outlier, two routes, two very different consequences</text>
  <text class="d152f-sub" x="520" y="58" text-anchor="middle">Fifty predictions, unchanged. One true value moved 200 units away. Watch what each route does with it.</text>

  <!-- source -->
  <rect class="d152f-source" x="60" y="108" width="150" height="80" rx="8"/>
  <text class="d152f-label" x="135" y="140" text-anchor="middle">50 residuals</text>
  <text class="d152f-muted" x="135" y="160" text-anchor="middle">one moved</text>
  <text class="d152f-muted" x="135" y="176" text-anchor="middle">200 units away</text>

  <!-- squaring path -->
  <rect class="d152f-stage" x="420" y="228" width="200" height="72" rx="8"/>
  <text class="d152f-head" x="520" y="256" text-anchor="middle">square each error</text>
  <text class="d152f-muted" x="520" y="278" text-anchor="middle">then average, then sqrt -- RMSE</text>

  <!-- absolute-value path -->
  <rect class="d152f-stage" x="420" y="424" width="200" height="72" rx="8"/>
  <text class="d152f-head" x="520" y="452" text-anchor="middle">take the absolute value</text>
  <text class="d152f-muted" x="520" y="474" text-anchor="middle">then average -- MAE</text>

  <path class="d152f-wire" d="M 210 148 C 320 148 380 220 415 260" marker-end="url(#d152f-arrow)"/>
  <path class="d152f-wire" d="M 210 148 C 320 148 380 400 415 452" marker-end="url(#d152f-arrow)"/>
  <marker id="d152f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <circle class="d152f-token-sq" r="8"/>
  <circle class="d152f-token-ab" r="8"/>

  <!-- bars -->
  <line class="d152f-axis" x1="700" y1="500" x2="1000" y2="500"/>
  <text class="d152f-muted" x="700" y="518">before</text>
  <text class="d152f-muted" x="850" y="518">after (one outlier)</text>

  <rect class="d152f-bar-before" x="700" y="476" width="60" height="24" rx="3"/>
  <text class="d152f-num" x="730" y="470" text-anchor="middle">RMSE 2.4801</text>
  <rect class="d152f-bar-rmse-after" x="850" y="476" width="60" height="24" rx="3"/>
  <text class="d152f-num d152f-note-after" x="880" y="264" text-anchor="middle">RMSE 28.2569</text>
  <text class="d152f-muted d152f-note-after" x="880" y="284" text-anchor="middle">11.39x</text>

  <rect class="d152f-bar-before" x="700" y="440" width="60" height="24" rx="3"/>
  <text class="d152f-num" x="730" y="434" text-anchor="middle">MAE 1.9833</text>
  <rect class="d152f-bar-mae-after" x="850" y="476" width="60" height="24" rx="3"/>
  <text class="d152f-num d152f-note-after" x="880" y="434" text-anchor="middle">MAE 5.9448</text>
  <text class="d152f-muted d152f-note-after" x="880" y="454" text-anchor="middle">3.00x</text>

  <rect class="d152f-stage" x="60" y="550" width="920" height="90" rx="10"/>
  <text class="d152f-label" x="80" y="576">Same fifty predictions both times. The only change: one true value moved 200 units away.</text>
  <text class="d152f-label" x="80" y="598">RMSE squares that one row's error before averaging, so it moved 11.39x. MAE never squares anything, so it moved 3.00x.</text>
  <text class="d152f-muted" x="80" y="622">With motion switched off, both bar heights and both printed numbers are already in their final, "after" position.</text>
</svg>
