<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Anomaly detection, and the usual suspects.">
  <title>Finding where a NaN was born</title>
  <style>
    .nan-hunting-bg   { fill: #f8fafc; }
    .nan-hunting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-hunting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-hunting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-hunting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-hunting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-hunting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nan-hunting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nan-hunting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nan-hunting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nan-hunting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nan-hunting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nan-hunting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nan-hunting-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nan-hunting-stage { opacity: 1; }

    .nan-hunting-s0 { animation-delay: 0.00s; }
    .nan-hunting-e0 { animation-delay: 0.00s; }
    .nan-hunting-s1 { animation-delay: 1.28s; }
    .nan-hunting-e1 { animation-delay: 1.28s; }
    .nan-hunting-s2 { animation-delay: 2.56s; }
    .nan-hunting-e2 { animation-delay: 2.56s; }
    .nan-hunting-s3 { animation-delay: 3.84s; }
    .nan-hunting-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nan-hunting-conn  { animation: nan-hunting-trace 6.4s ease-in-out infinite; }
      .nan-hunting-stage { animation: nan-hunting-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nan-hunting-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nan-hunting-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nan-hunting-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nan-hunting-stage { animation: nan-hunting-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nan-hunting-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nan-hunting-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nan-hunting-bg" width="980" height="322"/>
  <text class="nan-hunting-h1"  x="30" y="40">Finding where a NaN was born</text>
  <text class="nan-hunting-sub" x="30" y="64">Anomaly detection, and the usual suspects.</text>
  <g class="nan-hunting-stage nan-hunting-s0">
    <rect class="nan-hunting-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nan-hunting-step" x="44" y="142">01</text>
    <text class="nan-hunting-name" x="70" y="142">The loss becomes NaN</text>
    <text class="nan-hunting-desc" x="44" y="166">And every subsequent step</text>
    <text class="nan-hunting-desc" x="44" y="182">propagates it through every</text>
    <text class="nan-hunting-desc" x="44" y="198">weight.</text>
  </g>
  <line class="nan-hunting-line nan-hunting-conn nan-hunting-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nan-hunting-tip)"/>
  <g class="nan-hunting-stage nan-hunting-s1">
    <rect class="nan-hunting-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nan-hunting-step" x="280" y="142">02</text>
    <text class="nan-hunting-name" x="306" y="142">Anomaly detection names the operation</text>
    <text class="nan-hunting-desc" x="280" y="166">The framework reports which</text>
    <text class="nan-hunting-desc" x="280" y="182">backward function produced it.</text>
    <text class="nan-hunting-edge" x="280" y="242">slow</text>
  </g>
  <line class="nan-hunting-line nan-hunting-conn nan-hunting-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nan-hunting-tip)"/>
  <g class="nan-hunting-stage nan-hunting-s2">
    <rect class="nan-hunting-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nan-hunting-step" x="516" y="142">03</text>
    <text class="nan-hunting-name" x="542" y="142">Usual causes: log of zero, division, overflow</text>
    <text class="nan-hunting-desc" x="516" y="166">A confident prediction, an empty</text>
    <text class="nan-hunting-desc" x="516" y="182">denominator, an unclipped</text>
    <text class="nan-hunting-desc" x="516" y="198">gradient.</text>
  </g>
  <line class="nan-hunting-line nan-hunting-conn nan-hunting-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nan-hunting-tip)"/>
  <g class="nan-hunting-stage nan-hunting-s3">
    <rect class="nan-hunting-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nan-hunting-step" x="752" y="142">04</text>
    <text class="nan-hunting-name" x="778" y="142">Then disable it</text>
    <text class="nan-hunting-desc" x="752" y="166">It is far too slow to leave on</text>
    <text class="nan-hunting-desc" x="752" y="182">for a real run.</text>
  </g>
  <text class="nan-hunting-sub" x="30" y="304">Once a NaN enters the weights every subsequent computation produces NaN, which is why catching the first occurrence matters more than inspecting the model afterwards.</text>
</svg>
