<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How asynchronous execution works</title>
  <style>
    .async-how-bg   { fill: #f8fafc; }
    .async-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .async-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .async-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .async-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .async-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .async-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .async-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .async-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .async-how-stage { opacity: 1; }

    .async-how-s0 { animation-delay: 0.00s; }
    .async-how-e0 { animation-delay: 0.00s; }
    .async-how-s1 { animation-delay: 1.28s; }
    .async-how-e1 { animation-delay: 1.28s; }
    .async-how-s2 { animation-delay: 2.56s; }
    .async-how-e2 { animation-delay: 2.56s; }
    .async-how-s3 { animation-delay: 3.84s; }
    .async-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .async-how-conn  { animation: async-how-trace 6.4s ease-in-out infinite; }
      .async-how-stage { animation: async-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes async-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes async-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .async-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .async-how-stage { animation: async-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes async-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="async-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="async-how-bg" width="980" height="322"/>
  <text class="async-how-h1"  x="30" y="40">How asynchronous execution works</text>
  <text class="async-how-sub" x="30" y="64">Four steps.</text>
  <g class="async-how-stage async-how-s0">
    <rect class="async-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="async-how-step" x="44" y="142">01</text>
    <text class="async-how-name" x="70" y="142">An event loop runs tasks on one thread</text>
    <text class="async-how-desc" x="44" y="166">Cooperatively, not</text>
    <text class="async-how-desc" x="44" y="182">pre-emptively.</text>
  </g>
  <line class="async-how-line async-how-conn async-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#async-how-tip)"/>
  <g class="async-how-stage async-how-s1">
    <rect class="async-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="async-how-step" x="280" y="142">02</text>
    <text class="async-how-name" x="306" y="142">A task reaching a wait suspends itself</text>
    <text class="async-how-desc" x="280" y="166">Explicitly, at a marked point.</text>
  </g>
  <line class="async-how-line async-how-conn async-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#async-how-tip)"/>
  <g class="async-how-stage async-how-s2">
    <rect class="async-how-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="async-how-step" x="516" y="142">03</text>
    <text class="async-how-name" x="542" y="142">The loop runs other ready tasks meanwhile</text>
    <text class="async-how-desc" x="516" y="166">So the thread is never idle.</text>
  </g>
  <line class="async-how-line async-how-conn async-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#async-how-tip)"/>
  <g class="async-how-stage async-how-s3">
    <rect class="async-how-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="async-how-step" x="752" y="142">04</text>
    <text class="async-how-name" x="778" y="142">And resumes the first when its wait completes</text>
    <text class="async-how-desc" x="752" y="166">Which requires it to yield.</text>
  </g>
  <text class="async-how-sub" x="30" y="304">Requiring the task to yield is the catch: a blocking call inside an asynchronous function stops the entire loop, and nothing warns you that it happened.</text>
</svg>
