<svg role="img" aria-label="Transfer learning paradigms comparing feature extraction linear probing with frozen backbone versus full fine-tuning with differential learning rates" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Transfer Learning Paradigms: Feature Extraction vs Fine-Tuning</title>
  <defs>
    <linearGradient id="bg213a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card213" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg213a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TRANSFER LEARNING PARADIGMS IN VISION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Feature Extraction (Linear Probing) vs Layer-Wise Fine-Tuning</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card213)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Strategy 1: Feature Extraction / Linear Probing -->
    <rect x="25" y="25" width="345" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="197" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Feature Extraction (Linear Probing)</text>
    
    <!-- Pretrained Backbone (Frozen) -->
    <rect x="45" y="70" width="305" height="70" fill="#1e293b" stroke="#64748b" stroke-dasharray="4" rx="4"/>
    <text x="197" y="95" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">Pretrained Backbone (ResNet-50 / ViT)</text>
    <text x="197" y="115" fill="#38bdf8" font-size="9" text-anchor="middle">requires_grad = False (Frozen Weights)</text>
    <text x="197" y="130" fill="#94a3b8" font-size="8" text-anchor="middle">Zero updates during backpropagation</text>

    <!-- New Classifier Head (Trainable) -->
    <rect x="45" y="155" width="305" height="50" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="197" y="178" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">New Custom Linear Classifier Head</text>
    <text x="197" y="195" fill="#f8fafc" font-size="8" text-anchor="middle">requires_grad = True (High LR = 1e-3)</text>
    
    <text x="197" y="230" fill="#cbd5e1" font-size="8" text-anchor="middle">Best for: Small datasets (&lt; 1,000 samples) or quick baselines</text>
    <text x="197" y="248" fill="#cbd5e1" font-size="8" text-anchor="middle">Speed: Ultra-fast training (Single epoch feature caching)</text>

    <!-- Strategy 2: Differential Fine-Tuning -->
    <rect x="390" y="25" width="345" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="562" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Differential Layer-Wise Fine-Tuning</text>
    
    <!-- Early Layers (Low LR) -->
    <rect x="410" y="70" width="305" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="562" y="93" fill="#38bdf8" font-size="9" text-anchor="middle">Early Conv Blocks (Stem): LR = 1e-6 (Subtle refinement)</text>

    <!-- Deep Layers (Mid LR) -->
    <rect x="410" y="118" width="305" height="40" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="562" y="141" fill="#fbbf24" font-size="9" text-anchor="middle">Late ResNet Stages: LR = 1e-5 (Domain adaptation)</text>

    <!-- New Head (High LR) -->
    <rect x="410" y="166" width="305" height="40" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="562" y="189" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">New Classifier Head: LR = 1e-3 (Fast initial learning)</text>

    <text x="562" y="230" fill="#cbd5e1" font-size="8" text-anchor="middle">Best for: Medium/Large datasets or distinct visual domains</text>
    <text x="562" y="248" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Result: State-of-the-Art accuracy without catastrophic forgetting</text>
  </g>
</svg>
