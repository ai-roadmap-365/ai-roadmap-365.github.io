<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four consequences.">
  <title>What repeated multiplication does</title>
  <style>
    .chain-effects-bg   { fill: #f8fafc; }
    .chain-effects-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-effects-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-effects-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-effects-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-effects-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-effects-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-effects-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chain-effects-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chain-effects-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chain-effects-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chain-effects-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chain-effects-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chain-effects-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chain-effects-stage { opacity: 1; }

    .chain-effects-s0 { animation-delay: 0.00s; }
    .chain-effects-e0 { animation-delay: 0.00s; }
    .chain-effects-s1 { animation-delay: 1.28s; }
    .chain-effects-e1 { animation-delay: 1.28s; }
    .chain-effects-s2 { animation-delay: 2.56s; }
    .chain-effects-e2 { animation-delay: 2.56s; }
    .chain-effects-s3 { animation-delay: 3.84s; }
    .chain-effects-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chain-effects-conn  { animation: chain-effects-trace 6.4s ease-in-out infinite; }
      .chain-effects-stage { animation: chain-effects-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chain-effects-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chain-effects-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chain-effects-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chain-effects-stage { animation: chain-effects-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chain-effects-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chain-effects-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chain-effects-bg" width="980" height="322"/>
  <text class="chain-effects-h1"  x="30" y="40">What repeated multiplication does</text>
  <text class="chain-effects-sub" x="30" y="64">Four consequences.</text>
  <g class="chain-effects-stage chain-effects-s0">
    <rect class="chain-effects-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chain-effects-step" x="44" y="142">01</text>
    <text class="chain-effects-name" x="70" y="142">Factors below one shrink the product</text>
    <text class="chain-effects-desc" x="44" y="166">Toward zero, exponentially.</text>
  </g>
  <line class="chain-effects-line chain-effects-conn chain-effects-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chain-effects-tip)"/>
  <g class="chain-effects-stage chain-effects-s1">
    <rect class="chain-effects-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chain-effects-step" x="280" y="142">02</text>
    <text class="chain-effects-name" x="306" y="142">Factors above one grow it</text>
    <text class="chain-effects-desc" x="280" y="166">Toward overflow, equally fast.</text>
  </g>
  <line class="chain-effects-line chain-effects-conn chain-effects-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chain-effects-tip)"/>
  <g class="chain-effects-stage chain-effects-s2">
    <rect class="chain-effects-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chain-effects-step" x="516" y="142">03</text>
    <text class="chain-effects-name" x="542" y="142">And depth multiplies the effect</text>
    <text class="chain-effects-desc" x="516" y="166">Fifty layers means fifty</text>
    <text class="chain-effects-desc" x="516" y="182">factors.</text>
  </g>
  <line class="chain-effects-line chain-effects-conn chain-effects-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chain-effects-tip)"/>
  <g class="chain-effects-stage chain-effects-s3">
    <rect class="chain-effects-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chain-effects-step" x="752" y="142">04</text>
    <text class="chain-effects-name" x="778" y="142">Which is why architectures add shortcut paths</text>
    <text class="chain-effects-desc" x="752" y="166">Giving gradients a direct route.</text>
  </g>
  <text class="chain-effects-sub" x="30" y="304">Shortcut connections exist precisely because of this arithmetic: a path that skips layers has fewer factors, so the gradient survives to the early layers.</text>
</svg>
