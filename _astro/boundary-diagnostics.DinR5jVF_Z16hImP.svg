<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things to look for.">
  <title>Reading a boundary plot</title>
  <style>
    .boundary-diagnostics-bg   { fill: #f8fafc; }
    .boundary-diagnostics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-diagnostics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-diagnostics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-diagnostics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-diagnostics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-diagnostics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-diagnostics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boundary-diagnostics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boundary-diagnostics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boundary-diagnostics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boundary-diagnostics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boundary-diagnostics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .boundary-diagnostics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .boundary-diagnostics-stage { opacity: 1; }

    .boundary-diagnostics-s0 { animation-delay: 0.00s; }
    .boundary-diagnostics-e0 { animation-delay: 0.00s; }
    .boundary-diagnostics-s1 { animation-delay: 1.28s; }
    .boundary-diagnostics-e1 { animation-delay: 1.28s; }
    .boundary-diagnostics-s2 { animation-delay: 2.56s; }
    .boundary-diagnostics-e2 { animation-delay: 2.56s; }
    .boundary-diagnostics-s3 { animation-delay: 3.84s; }
    .boundary-diagnostics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .boundary-diagnostics-conn  { animation: boundary-diagnostics-trace 6.4s ease-in-out infinite; }
      .boundary-diagnostics-stage { animation: boundary-diagnostics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes boundary-diagnostics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes boundary-diagnostics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .boundary-diagnostics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .boundary-diagnostics-stage { animation: boundary-diagnostics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes boundary-diagnostics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="boundary-diagnostics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="boundary-diagnostics-bg" width="980" height="322"/>
  <text class="boundary-diagnostics-h1"  x="30" y="40">Reading a boundary plot</text>
  <text class="boundary-diagnostics-sub" x="30" y="64">Four things to look for.</text>
  <g class="boundary-diagnostics-stage boundary-diagnostics-s0">
    <rect class="boundary-diagnostics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-diagnostics-step" x="44" y="142">01</text>
    <text class="boundary-diagnostics-name" x="70" y="142">The shape</text>
    <text class="boundary-diagnostics-desc" x="44" y="166">Straight, curved, or fragmented</text>
    <text class="boundary-diagnostics-desc" x="44" y="182">into islands.</text>
  </g>
  <line class="boundary-diagnostics-line boundary-diagnostics-conn boundary-diagnostics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#boundary-diagnostics-tip)"/>
  <g class="boundary-diagnostics-stage boundary-diagnostics-s1">
    <rect class="boundary-diagnostics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-diagnostics-step" x="280" y="142">02</text>
    <text class="boundary-diagnostics-name" x="306" y="142">The margin</text>
    <text class="boundary-diagnostics-desc" x="280" y="166">How much empty space separates</text>
    <text class="boundary-diagnostics-desc" x="280" y="182">the classes.</text>
  </g>
  <line class="boundary-diagnostics-line boundary-diagnostics-conn boundary-diagnostics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#boundary-diagnostics-tip)"/>
  <g class="boundary-diagnostics-stage boundary-diagnostics-s2">
    <rect class="boundary-diagnostics-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-diagnostics-step" x="516" y="142">03</text>
    <text class="boundary-diagnostics-name" x="542" y="142">Which points fall on the wrong side</text>
    <text class="boundary-diagnostics-desc" x="516" y="166">And whether they cluster or</text>
    <text class="boundary-diagnostics-desc" x="516" y="182">scatter.</text>
  </g>
  <line class="boundary-diagnostics-line boundary-diagnostics-conn boundary-diagnostics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#boundary-diagnostics-tip)"/>
  <g class="boundary-diagnostics-stage boundary-diagnostics-s3">
    <rect class="boundary-diagnostics-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-diagnostics-step" x="752" y="142">04</text>
    <text class="boundary-diagnostics-name" x="778" y="142">And how sharply confidence changes</text>
    <text class="boundary-diagnostics-desc" x="752" y="166">A very sharp transition suggests</text>
    <text class="boundary-diagnostics-desc" x="752" y="182">overfitting.</text>
  </g>
  <text class="boundary-diagnostics-sub" x="30" y="304">Fragmented islands around individual points are the clearest visual signature of overfitting, and they are visible long before validation error confirms it.</text>
</svg>
