<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them runs out of memory.">
  <title>Streaming, or buffering</title>
  <style>
    .stream-or-buffer-bg   { fill: #f8fafc; }
    .stream-or-buffer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-buffer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-buffer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-buffer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-buffer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-buffer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stream-or-buffer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stream-or-buffer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stream-or-buffer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stream-or-buffer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stream-or-buffer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stream-or-buffer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stream-or-buffer-row { opacity: 1; }
    .stream-or-buffer-r0 { animation-delay: 0.00s; }
    .stream-or-buffer-r1 { animation-delay: 0.45s; }
    .stream-or-buffer-r2 { animation-delay: 0.90s; }
    .stream-or-buffer-r3 { animation-delay: 1.35s; }
    .stream-or-buffer-r4 { animation-delay: 1.80s; }
    .stream-or-buffer-row { animation: stream-or-buffer-reveal 7.3s ease-in-out infinite; }
    @keyframes stream-or-buffer-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stream-or-buffer-bg" width="980" height="390"/>
  <text class="stream-or-buffer-h1"  x="30" y="40">Streaming, or buffering</text>
  <text class="stream-or-buffer-sub" x="30" y="64">One of them runs out of memory.</text>
  <rect class="stream-or-buffer-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stream-or-buffer-name" x="46" y="122">Streaming</text>
  <text class="stream-or-buffer-desc" x="46" y="142">Constant memory per request.</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r0" x="46" y="182">Yield each frame as it arrives</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r1" x="46" y="216">Memory does not grow with output length</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r2" x="46" y="250">The user reads while the model writes</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r3" x="46" y="284">The connection stays alive</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r4" x="46" y="318">Thousands of concurrent streams are fine</text>
  <rect class="stream-or-buffer-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stream-or-buffer-name" x="526" y="122">Buffering</text>
  <text class="stream-or-buffer-desc" x="526" y="142">Memory times concurrency.</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r0" x="526" y="182">Accumulate the whole completion</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r1" x="526" y="216">Then send it</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r2" x="526" y="250">Thousands of concurrent multi-thousand-token strings</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r3" x="526" y="284">The proxy may time out waiting</text>
  <text class="stream-or-buffer-desc stream-or-buffer-row stream-or-buffer-r4" x="526" y="318">And the process may not survive the burst</text>
  <text class="stream-or-buffer-sub" x="30" y="372">The proxy timeout is the failure people meet first and the memory ceiling is the one that takes the service down, and both are removed by the same change.</text>
</svg>
