<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And one thing the packaging hid.">
  <title>Four steps to the vector database</title>
  <style>
    .ann-lineage-bg   { fill: #f8fafc; }
    .ann-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ann-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ann-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ann-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ann-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ann-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ann-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ann-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ann-lineage-stage { opacity: 1; }

    .ann-lineage-s0 { animation-delay: 0.00s; }
    .ann-lineage-e0 { animation-delay: 0.00s; }
    .ann-lineage-s1 { animation-delay: 1.28s; }
    .ann-lineage-e1 { animation-delay: 1.28s; }
    .ann-lineage-s2 { animation-delay: 2.56s; }
    .ann-lineage-e2 { animation-delay: 2.56s; }
    .ann-lineage-s3 { animation-delay: 3.84s; }
    .ann-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ann-lineage-conn  { animation: ann-lineage-trace 6.4s ease-in-out infinite; }
      .ann-lineage-stage { animation: ann-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ann-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ann-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ann-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ann-lineage-stage { animation: ann-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ann-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ann-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ann-lineage-bg" width="980" height="322"/>
  <text class="ann-lineage-h1"  x="30" y="40">Four steps to the vector database</text>
  <text class="ann-lineage-sub" x="30" y="64">And one thing the packaging hid.</text>
  <g class="ann-lineage-stage ann-lineage-s0">
    <rect class="ann-lineage-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ann-lineage-step" x="44" y="142">01</text>
    <text class="ann-lineage-name" x="70" y="142">k-d trees, 1970s</text>
    <text class="ann-lineage-desc" x="44" y="166">Beautiful in three dimensions,</text>
    <text class="ann-lineage-desc" x="44" y="182">worse than linear beyond about</text>
    <text class="ann-lineage-desc" x="44" y="198">twenty.</text>
  </g>
  <line class="ann-lineage-line ann-lineage-conn ann-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ann-lineage-tip)"/>
  <g class="ann-lineage-stage ann-lineage-s1">
    <rect class="ann-lineage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ann-lineage-step" x="280" y="142">02</text>
    <text class="ann-lineage-name" x="306" y="142">Locality-sensitive hashing, 1998</text>
    <text class="ann-lineage-desc" x="280" y="166">Probabilistic bucketing with</text>
    <text class="ann-lineage-desc" x="280" y="182">provable guarantees.</text>
  </g>
  <line class="ann-lineage-line ann-lineage-conn ann-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ann-lineage-tip)"/>
  <g class="ann-lineage-stage ann-lineage-s2">
    <rect class="ann-lineage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ann-lineage-step" x="516" y="142">03</text>
    <text class="ann-lineage-name" x="542" y="142">HNSW, 2016</text>
    <text class="ann-lineage-desc" x="516" y="166">Better recall-latency trade-offs</text>
    <text class="ann-lineage-desc" x="516" y="182">than anything before. Costly in</text>
    <text class="ann-lineage-desc" x="516" y="198">memory.</text>
  </g>
  <line class="ann-lineage-line ann-lineage-conn ann-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ann-lineage-tip)"/>
  <g class="ann-lineage-stage ann-lineage-s3">
    <rect class="ann-lineage-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ann-lineage-step" x="752" y="142">04</text>
    <text class="ann-lineage-name" x="778" y="142">Vector databases, 2019</text>
    <text class="ann-lineage-desc" x="752" y="166">Packaged behind APIs — and the</text>
    <text class="ann-lineage-desc" x="752" y="182">recall trade-off became a</text>
    <text class="ann-lineage-desc" x="752" y="198">default.</text>
    <text class="ann-lineage-edge" x="752" y="242">the side effect</text>
  </g>
  <text class="ann-lineage-sub" x="30" y="304">The curse of dimensionality is the reason the first row failed: in high dimensions almost every point is roughly equidistant from every other, so there is nothing left to prune.</text>
</svg>
