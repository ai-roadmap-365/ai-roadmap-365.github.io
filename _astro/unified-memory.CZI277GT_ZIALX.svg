<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What fits.">
  <title>Unified memory against discrete</title>
  <style>
    .unified-memory-bg   { fill: #f8fafc; }
    .unified-memory-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-memory-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-memory-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-memory-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-memory-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-memory-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unified-memory-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unified-memory-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unified-memory-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unified-memory-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unified-memory-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unified-memory-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unified-memory-row { opacity: 1; }
    .unified-memory-r0 { animation-delay: 0.00s; }
    .unified-memory-r1 { animation-delay: 0.45s; }
    .unified-memory-r2 { animation-delay: 0.90s; }
    .unified-memory-r3 { animation-delay: 1.35s; }
    .unified-memory-r4 { animation-delay: 1.80s; }
    .unified-memory-row { animation: unified-memory-reveal 7.3s ease-in-out infinite; }
    @keyframes unified-memory-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="unified-memory-bg" width="980" height="390"/>
  <text class="unified-memory-h1"  x="30" y="40">Unified memory against discrete</text>
  <text class="unified-memory-sub" x="30" y="64">What fits.</text>
  <rect class="unified-memory-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="unified-memory-name" x="46" y="122">Unified memory</text>
  <text class="unified-memory-desc" x="46" y="142">One pool.</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r0" x="46" y="182">Processor and accelerator share memory</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r1" x="46" y="216">A large model can use most of the system memory</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r2" x="46" y="250">No transfer between pools</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r3" x="46" y="284">Lower peak throughput</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r4" x="46" y="318">Which puts large models on laptops</text>
  <rect class="unified-memory-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="unified-memory-name" x="526" y="122">Discrete memory</text>
  <text class="unified-memory-desc" x="526" y="142">Two pools.</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r0" x="526" y="182">Dedicated, and much faster</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r1" x="526" y="216">Bounded by the card's own capacity</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r2" x="526" y="250">Transfers cost time</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r3" x="526" y="284">Higher peak throughput</text>
  <text class="unified-memory-desc unified-memory-row unified-memory-r4" x="526" y="318">Layers spill to system memory when it overflows</text>
  <text class="unified-memory-sub" x="30" y="372">Spilling layers to system memory works and is dramatically slower, which is why fitting entirely in the fast pool matters more than raw throughput.</text>
</svg>
