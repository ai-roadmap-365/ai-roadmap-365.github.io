<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Then handling each.">
  <title>Sorting post into pigeonholes</title>
  <style>
    .sorting-post-bg   { fill: #f8fafc; }
    .sorting-post-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-post-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-post-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-post-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-post-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-post-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sorting-post-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sorting-post-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sorting-post-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sorting-post-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sorting-post-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sorting-post-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sorting-post-row { opacity: 1; }
    .sorting-post-r0 { animation-delay: 0.00s; }
    .sorting-post-r1 { animation-delay: 0.45s; }
    .sorting-post-r2 { animation-delay: 0.90s; }
    .sorting-post-r3 { animation-delay: 1.35s; }
    .sorting-post-r4 { animation-delay: 1.80s; }
    .sorting-post-row { animation: sorting-post-reveal 7.3s ease-in-out infinite; }
    @keyframes sorting-post-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sorting-post-bg" width="980" height="390"/>
  <text class="sorting-post-h1"  x="30" y="40">Sorting post into pigeonholes</text>
  <text class="sorting-post-sub" x="30" y="64">Then handling each.</text>
  <rect class="sorting-post-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sorting-post-name" x="46" y="122">Sort first</text>
  <text class="sorting-post-desc" x="46" y="142">Then handle each hole.</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r0" x="46" y="182">One pigeonhole per destination</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r1" x="46" y="216">Everything for a destination together</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r2" x="46" y="250">Handle each hole once</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r3" x="46" y="284">Counts per destination are immediate</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r4" x="46" y="318">This is grouping</text>
  <rect class="sorting-post-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sorting-post-name" x="526" y="122">In arrival order</text>
  <text class="sorting-post-desc" x="526" y="142">Revisit constantly.</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r0" x="526" y="182">Handle each item as it comes</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r1" x="526" y="216">Destinations interleaved</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r2" x="526" y="250">Revisit the same destination repeatedly</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r3" x="526" y="284">Counting requires a separate tally</text>
  <text class="sorting-post-desc sorting-post-row sorting-post-r4" x="526" y="318">This is looping with counters</text>
  <text class="sorting-post-sub" x="30" y="372">Revisiting the same destination repeatedly is what a manual loop with counters does, and the pigeonhole arrangement is why grouping is both clearer and faster.</text>
</svg>
