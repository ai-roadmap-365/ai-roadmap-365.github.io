<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 740" width="980" height="740" role="img" aria-labelledby="d109f-title d109f-desc">
  <title id="d109f-title">Eight directions tried one after another from the same point, with the rate of change measured for each, and the gradient's direction winning</title>
  <desc id="d109f-desc">From the point (1, 1) on the surface f equals x squared plus three y squared, eight unit directions are tried in turn and the rate of change along each is measured directly, without ever forming a gradient. Due east gives 2.0000, thirty degrees gives 4.7321, forty-five gives 5.6569, sixty gives 6.1962, 71.5651 degrees gives 6.3246, ninety gives 6.0000, a hundred and twenty gives 4.1962, and due west gives minus 2.0000. The largest is 6.3246 at 71.5651 degrees, which is the bearing of the gradient (2, 6), and its value is the gradient's own length, the square root of 40. The arrows light up one at a time and the gradient's arrow is drawn permanently in blue.</desc>

  <style>
    .d109f-bg     { fill: #f8fafc; }
    .d109f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d109f-head   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d109f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d109f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d109f-num    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d109f-accent { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1d4ed8; }
    .d109f-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d109f-rule   { stroke: #cbd5e1; stroke-width: 1.5; }
    .d109f-axis   { stroke: #cbd5e1; stroke-width: 1.5; }
    .d109f-cont   { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 9 5; }
    .d109f-base   { stroke: #64748b; stroke-width: 1.5; }
    .d109f-win    { stroke: #1d4ed8; stroke-width: 4; fill: none; }
    .d109f-winbar { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.5; }
    .d109f-down   { fill: #fecaca; stroke: #b91c1c; stroke-width: 1.5; }

    /* Motion 3 — eight candidates light up one after another, in bearing order.
       Each rests fully drawn and fully legible; the animation only says WHEN
       each one was tried, never WHAT it measured. */
    .d109f-ray  { stroke: #b45309; stroke-width: 2.5; fill: none;
                  animation: d109f-try 8s ease-in-out infinite; }
    .d109f-bar  { fill: #fde68a; stroke: #b45309; stroke-width: 1.5;
                  animation: d109f-lit 8s ease-in-out infinite; }
    .d109f-c1 { animation-delay: 0s; }
    .d109f-c2 { animation-delay: 0.7s; }
    .d109f-c3 { animation-delay: 1.4s; }
    .d109f-c4 { animation-delay: 2.1s; }
    .d109f-c5 { animation-delay: 2.8s; }
    .d109f-c6 { animation-delay: 3.5s; }
    .d109f-c7 { animation-delay: 4.2s; }
    .d109f-c8 { animation-delay: 4.9s; }
    @keyframes d109f-try {
      0%, 8%, 100% { stroke: #b45309; stroke-width: 2.5; }
      2%, 6%       { stroke: #f59e0b; stroke-width: 4.5; }
    }
    @keyframes d109f-lit {
      0%, 8%, 100% { fill: #fde68a; }
      2%, 6%       { fill: #fbbf24; }
    }

    /* Motion 3 — after every candidate has been tried, the answer settles on
       the gradient: its ring holds from 70% of the cycle to the end. The ring
       rests visible at full opacity, so a still frame shows the winner marked. */
    .d109f-ring { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                  animation: d109f-settle 8s ease-in-out infinite; }
    @keyframes d109f-settle {
      0%, 64%   { stroke-width: 2.5; }
      72%, 100% { stroke-width: 6; }
    }

    /* The winner takes its turn in the sequence like every other candidate,
       at 2.8s, and is ALSO drawn permanently thicker and in blue -- so the
       still frame shows which one won without needing the animation. */
    .d109f-winray { animation: d109f-winpulse 8s ease-in-out infinite;
                    animation-delay: 2.8s; }
    @keyframes d109f-winpulse {
      0%, 8%, 100% { stroke-width: 4; }
      2%, 6%       { stroke-width: 7; }
    }

    /* Motion 2 — a flowing arrow along the winning bar, marking it as the answer. */
    .d109f-flow { stroke: #1d4ed8; stroke-width: 2.5; fill: none;
                  stroke-dasharray: 10 8; animation: d109f-march 1.8s linear infinite; }
    @keyframes d109f-march { to { stroke-dashoffset: -18; } }

    @media (prefers-reduced-motion: reduce) {
      .d109f-ray  { animation: none; stroke: #b45309; stroke-width: 2.5; }
      .d109f-bar  { animation: none; fill: #fde68a; }
      .d109f-ring   { animation: none; stroke-width: 6; }
      .d109f-winray { animation: none; stroke-width: 4; }
      .d109f-flow { animation: none; stroke-dasharray: none; }
    }
  </style>

  <defs>
    <marker id="d109f-tip-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
    <marker id="d109f-tip-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d109f-bg" x="0" y="0" width="980" height="740" />

  <text class="d109f-title" x="30" y="38">Which way is uphill? Try every direction and measure.</text>
  <text class="d109f-small" x="30" y="62">f(x, y) = x² + 3y², standing at (1, 1). Each rate below was measured DIRECTLY along its own bearing with a central difference — no gradient was formed to produce these numbers.</text>

  <!-- ================= LEFT: the fan of candidate directions ================= -->
  <rect class="d109f-panel" x="30" y="82" width="470" height="540" rx="4" />
  <text class="d109f-head" x="48" y="108">Eight unit directions, tried one at a time</text>

  <line class="d109f-axis" x1="70" y1="480" x2="450" y2="480" />
  <line class="d109f-axis" x1="255" y1="300" x2="255" y2="590" />

  <!-- the contour through the point, for reference: direction (6, -2) -->
  <line class="d109f-cont" x1="103.2" y1="429.4" x2="406.8" y2="530.6" />
  <text class="d109f-small" x="330" y="556" fill="#0f766e">the contour</text>

  <!-- the eight candidate rays, all length 150 -->
  <line class="d109f-ray d109f-c1" x1="255" y1="480" x2="405"   y2="480"   marker-end="url(#d109f-tip-amber)" />
  <line class="d109f-ray d109f-c2" x1="255" y1="480" x2="384.9" y2="405"   marker-end="url(#d109f-tip-amber)" />
  <line class="d109f-ray d109f-c3" x1="255" y1="480" x2="361.1" y2="373.9" marker-end="url(#d109f-tip-amber)" />
  <line class="d109f-ray d109f-c4" x1="255" y1="480" x2="330"   y2="350.1" marker-end="url(#d109f-tip-amber)" />
  <line class="d109f-ray d109f-c6" x1="255" y1="480" x2="255"   y2="330"   marker-end="url(#d109f-tip-amber)" />
  <line class="d109f-ray d109f-c7" x1="255" y1="480" x2="180"   y2="350.1" marker-end="url(#d109f-tip-amber)" />
  <line class="d109f-ray d109f-c8" x1="255" y1="480" x2="105"   y2="480"   marker-end="url(#d109f-tip-amber)" />

  <!-- the winner, drawn permanently in blue so the still frame shows the answer -->
  <line class="d109f-win d109f-winray" x1="255" y1="480" x2="302.4" y2="337.7" marker-end="url(#d109f-tip-blue)" />
  <circle class="d109f-ring" cx="302.4" cy="337.7" r="13" />

  <circle cx="255" cy="480" r="5" fill="#1a202c" />
  <text class="d109f-label" x="222" y="504">(1, 1)</text>

  <text class="d109f-num" x="412" y="486">0°</text>
  <text class="d109f-num" x="392" y="400">30°</text>
  <text class="d109f-num" x="368" y="368">45°</text>
  <text class="d109f-num" x="337" y="344">60°</text>
  <text class="d109f-num" x="228" y="322">90°</text>
  <text class="d109f-num" x="140" y="344">120°</text>
  <text class="d109f-num" x="66"  y="486">180°</text>
  <text class="d109f-accent" x="312" y="322">71.5651° = ∇f</text>

  <text class="d109f-small" x="48" y="588">Every arrow has length 1. Only the bearing differs, which is why the</text>
  <text class="d109f-small" x="48" y="608">answers can be compared at all.</text>

  <!-- ================= RIGHT: the measured rates ================= -->
  <rect class="d109f-panel" x="520" y="82" width="430" height="540" rx="4" />
  <text class="d109f-head" x="538" y="108">What each one measured</text>
  <text class="d109f-small" x="538" y="128">rate of change of f, per unit of distance walked</text>

  <!-- zero baseline at x = 650, scale 34 px per unit -->
  <line class="d109f-base" x1="650" y1="150" x2="650" y2="482" />
  <text class="d109f-small" x="638" y="500">0</text>

  <rect class="d109f-bar d109f-c1" x="650" y="158" width="68"  height="22" />
  <rect class="d109f-bar d109f-c2" x="650" y="198" width="161" height="22" />
  <rect class="d109f-bar d109f-c3" x="650" y="238" width="192" height="22" />
  <rect class="d109f-bar d109f-c4" x="650" y="278" width="211" height="22" />
  <rect class="d109f-winbar"       x="650" y="318" width="215" height="22" />
  <rect class="d109f-bar d109f-c6" x="650" y="358" width="204" height="22" />
  <rect class="d109f-bar d109f-c7" x="650" y="398" width="143" height="22" />
  <rect class="d109f-down"         x="582" y="438" width="68"  height="22" />

  <text class="d109f-num" x="538" y="174">0°</text>
  <text class="d109f-num" x="538" y="214">30°</text>
  <text class="d109f-num" x="538" y="254">45°</text>
  <text class="d109f-num" x="538" y="294">60°</text>
  <text class="d109f-accent" x="538" y="334">71.57°</text>
  <text class="d109f-num" x="538" y="374">90°</text>
  <text class="d109f-num" x="538" y="414">120°</text>
  <text class="d109f-num" x="538" y="454">180°</text>

  <text class="d109f-num" x="726" y="174">2.0000</text>
  <text class="d109f-num" x="819" y="214">4.7321</text>
  <text class="d109f-num" x="850" y="254">5.6569</text>
  <text class="d109f-num" x="869" y="294">6.1962</text>
  <text class="d109f-accent" x="873" y="334">6.3246</text>
  <text class="d109f-num" x="862" y="374">6.0000</text>
  <text class="d109f-num" x="801" y="414">4.1962</text>
  <text class="d109f-num" x="522" y="454">−2.0000</text>

  <!-- the flowing marker along the winning bar -->
  <line class="d109f-flow" x1="654" y1="348" x2="861" y2="348" marker-end="url(#d109f-tip-blue)" />

  <line class="d109f-rule" x1="538" y1="516" x2="932" y2="516" />
  <text class="d109f-label" x="538" y="542">Winner: 6.3246 at 71.5651°</text>
  <text class="d109f-small" x="538" y="564">which is exactly | ∇f | = √(2² + 6²) = √40, and exactly the bearing of</text>
  <text class="d109f-small" x="538" y="584">∇f = (2, 6). The sweep was told nothing about the gradient. It found it.</text>
  <text class="d109f-small" x="538" y="606">The 180° bar is negative: that direction goes DOWN, at the same rate.</text>

  <!-- ================= FOOTER ================= -->
  <rect class="d109f-panel" x="30" y="636" width="920" height="86" rx="4" />
  <text class="d109f-label" x="48" y="664">Two readings of one arrow: the DIRECTION of ∇f answers "which way is uphill", and its LENGTH answers "how steep, that way".</text>
  <text class="d109f-small" x="48" y="688">No direction can beat that length, because the rate along a unit direction u is ∇f · u = |∇f| cos(angle), and cosine cannot exceed 1. Reverse the arrow and</text>
  <text class="d109f-small" x="48" y="708">you get the steepest way DOWN, at −6.3246 — which is the whole of gradient descent, and the reason the 90° bar here is 6.0000 rather than the winner.</text>
</svg>
