<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What survives, and what does not.">
  <title>Describing a photograph over the telephone</title>
  <style>
    .reading-vs-seeing-bg   { fill: #f8fafc; }
    .reading-vs-seeing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-vs-seeing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-vs-seeing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-vs-seeing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-vs-seeing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-vs-seeing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reading-vs-seeing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reading-vs-seeing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reading-vs-seeing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reading-vs-seeing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reading-vs-seeing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reading-vs-seeing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reading-vs-seeing-row { opacity: 1; }
    .reading-vs-seeing-r0 { animation-delay: 0.00s; }
    .reading-vs-seeing-r1 { animation-delay: 0.45s; }
    .reading-vs-seeing-r2 { animation-delay: 0.90s; }
    .reading-vs-seeing-r3 { animation-delay: 1.35s; }
    .reading-vs-seeing-r4 { animation-delay: 1.80s; }
    .reading-vs-seeing-row { animation: reading-vs-seeing-reveal 7.3s ease-in-out infinite; }
    @keyframes reading-vs-seeing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="reading-vs-seeing-bg" width="980" height="390"/>
  <text class="reading-vs-seeing-h1"  x="30" y="40">Describing a photograph over the telephone</text>
  <text class="reading-vs-seeing-sub" x="30" y="64">What survives, and what does not.</text>
  <rect class="reading-vs-seeing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="reading-vs-seeing-name" x="46" y="122">Described in words</text>
  <text class="reading-vs-seeing-desc" x="46" y="142">Someone else chose what mattered.</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r0" x="46" y="182">Only what the describer noticed</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r1" x="46" y="216">Layout and spatial relations lost</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r2" x="46" y="250">Small text usually omitted</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r3" x="46" y="284">Cannot be re-examined</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r4" x="46" y="318">This was the old extraction pipeline</text>
  <rect class="reading-vs-seeing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="reading-vs-seeing-name" x="526" y="122">Seen directly</text>
  <text class="reading-vs-seeing-desc" x="526" y="142">Everything is available.</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r0" x="526" y="182">The whole image attended to</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r1" x="526" y="216">Layout and position preserved</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r2" x="526" y="250">Fine detail readable on demand</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r3" x="526" y="284">Can be questioned repeatedly</text>
  <text class="reading-vs-seeing-desc reading-vs-seeing-row reading-vs-seeing-r4" x="526" y="318">This is multimodal input</text>
  <text class="reading-vs-seeing-sub" x="30" y="372">The old pipeline really did work this way — character recognition produced a description, and everything about layout and structure had to be reconstructed from it.</text>
</svg>
