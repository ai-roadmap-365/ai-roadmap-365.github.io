<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four traps.">
  <title>Where intuition fails</title>
  <style>
    .prob-traps-bg   { fill: #f8fafc; }
    .prob-traps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-traps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-traps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-traps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-traps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-traps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prob-traps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prob-traps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prob-traps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prob-traps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prob-traps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prob-traps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prob-traps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prob-traps-stage { opacity: 1; }

    .prob-traps-s0 { animation-delay: 0.00s; }
    .prob-traps-e0 { animation-delay: 0.00s; }
    .prob-traps-s1 { animation-delay: 1.28s; }
    .prob-traps-e1 { animation-delay: 1.28s; }
    .prob-traps-s2 { animation-delay: 2.56s; }
    .prob-traps-e2 { animation-delay: 2.56s; }
    .prob-traps-s3 { animation-delay: 3.84s; }
    .prob-traps-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prob-traps-conn  { animation: prob-traps-trace 6.4s ease-in-out infinite; }
      .prob-traps-stage { animation: prob-traps-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prob-traps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prob-traps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prob-traps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prob-traps-stage { animation: prob-traps-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prob-traps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prob-traps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prob-traps-bg" width="980" height="322"/>
  <text class="prob-traps-h1"  x="30" y="40">Where intuition fails</text>
  <text class="prob-traps-sub" x="30" y="64">Four traps.</text>
  <g class="prob-traps-stage prob-traps-s0">
    <rect class="prob-traps-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prob-traps-step" x="44" y="142">01</text>
    <text class="prob-traps-name" x="70" y="142">Ignoring the base rate makes rare things seem likely</text>
    <text class="prob-traps-desc" x="44" y="166">Which misreads every screening</text>
    <text class="prob-traps-desc" x="44" y="182">test.</text>
  </g>
  <line class="prob-traps-line prob-traps-conn prob-traps-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prob-traps-tip)"/>
  <g class="prob-traps-stage prob-traps-s1">
    <rect class="prob-traps-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prob-traps-step" x="280" y="142">02</text>
    <text class="prob-traps-name" x="306" y="142">Assuming independence when events are correlated</text>
    <text class="prob-traps-desc" x="280" y="166">Which understates joint risk.</text>
  </g>
  <line class="prob-traps-line prob-traps-conn prob-traps-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prob-traps-tip)"/>
  <g class="prob-traps-stage prob-traps-s2">
    <rect class="prob-traps-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prob-traps-step" x="516" y="142">03</text>
    <text class="prob-traps-name" x="542" y="142">Expecting past outcomes to influence independent ones</text>
    <text class="prob-traps-desc" x="516" y="166">They do not.</text>
  </g>
  <line class="prob-traps-line prob-traps-conn prob-traps-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prob-traps-tip)"/>
  <g class="prob-traps-stage prob-traps-s3">
    <rect class="prob-traps-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prob-traps-step" x="752" y="142">04</text>
    <text class="prob-traps-name" x="778" y="142">And confusing one conditional with its reverse</text>
    <text class="prob-traps-desc" x="752" y="166">They are entirely different</text>
    <text class="prob-traps-desc" x="752" y="182">numbers.</text>
  </g>
  <text class="prob-traps-sub" x="30" y="304">Confusing a conditional with its reverse is the error behind most misreported test results, and it is exactly what the next day's theorem corrects.</text>
</svg>
