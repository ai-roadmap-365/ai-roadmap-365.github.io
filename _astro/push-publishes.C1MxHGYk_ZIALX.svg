<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Including everything committed at any point in the past.">
  <title>Pushing is publication</title>
  <style>
    .push-publishes-bg   { fill: #f8fafc; }
    .push-publishes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-publishes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-publishes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-publishes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-publishes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-publishes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .push-publishes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .push-publishes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .push-publishes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .push-publishes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .push-publishes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .push-publishes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .push-publishes-row { opacity: 1; }
    .push-publishes-r0 { animation-delay: 0.00s; }
    .push-publishes-r1 { animation-delay: 0.45s; }
    .push-publishes-r2 { animation-delay: 0.90s; }
    .push-publishes-r3 { animation-delay: 1.35s; }
    .push-publishes-r4 { animation-delay: 1.80s; }
    .push-publishes-row { animation: push-publishes-reveal 7.3s ease-in-out infinite; }
    @keyframes push-publishes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="push-publishes-bg" width="980" height="390"/>
  <text class="push-publishes-h1"  x="30" y="40">Pushing is publication</text>
  <text class="push-publishes-sub" x="30" y="64">Including everything committed at any point in the past.</text>
  <rect class="push-publishes-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="push-publishes-name" x="46" y="122">What people assume</text>
  <text class="push-publishes-desc" x="46" y="142">The current files.</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r0" x="46" y="182">"I removed that file before pushing"</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r1" x="46" y="216">"The key is not in the code any more"</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r2" x="46" y="250">"That commit was from months ago"</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r3" x="46" y="284">"Nobody will look that far back"</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r4" x="46" y="318">Scanners look immediately</text>
  <rect class="push-publishes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="push-publishes-name" x="526" y="122">What is actually published</text>
  <text class="push-publishes-desc" x="526" y="142">Every commit, ever.</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r0" x="526" y="182">The complete history goes</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r1" x="526" y="216">Every version of every file</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r2" x="526" y="250">Including ones later deleted</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r3" x="526" y="284">Including your name and email</text>
  <text class="push-publishes-desc push-publishes-row push-publishes-r4" x="526" y="318">Assume it was read; revoke, do not delete</text>
  <text class="push-publishes-sub" x="30" y="372">A .gitignore written before the first commit prevents this. Everything after that point is damage control, and revocation is the only step that actually works.</text>
</svg>
