<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Coding Agent Codebase Indexing and Tool Loop">
  <title>Coding Agent Codebase Indexing and Tool Loop</title>
  <defs>
    <style>
      .d302f-bg { fill: #f8fafc; }
      .d302f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d302f-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d302f-edit { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d302f-test { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d302f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d302f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d302f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d302f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d302f-loop { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d302f-bg" />
  
  <text x="40" y="40" class="d302a-title">The Agentic Coding Lifecycle: Index -> Edit -> Verify -> Fix</text>
  <text x="40" y="65" class="d302a-subtitle">Coding Agent Codebase Indexing and Tool Loop flowchart showing AST repo-map compilation, semantic retrieval, patch generation, test execution, and self-correction</text>
  
  <!-- Step 1: Context Indexing -->
  <rect x="40" y="110" width="180" height="260" class="d302f-step" />
  <text x="55" y="140" class="d302f-header" fill="#1d4ed8">1. Context Retrieval</text>
  <text x="55" y="170" class="d302f-text">• AST Repo-Map parsing</text>
  <text x="55" y="190" class="d302f-text">• LSP symbol resolution</text>
  <text x="55" y="210" class="d302f-text">• Vector / BM25 search</text>
  <text x="55" y="230" class="d302f-text">• Gathers target files</text>
  <text x="55" y="260" class="d302f-text" font-weight="600">Output:</text>
  <text x="55" y="280" class="d302f-text">Exact function context</text>
  
  <!-- Step 2: Patch Synthesis -->
  <rect x="250" y="110" width="180" height="260" class="d302f-edit" />
  <text x="265" y="140" class="d302f-header" fill="#7e22ce">2. Patch Synthesis</text>
  <text x="265" y="170" class="d302f-text">• Generates targeted diffs</text>
  <text x="265" y="190" class="d302f-text">• Applies search/replace</text>
  <text x="265" y="210" class="d302f-text">• Modifies multi-file</text>
  <text x="265" y="230" class="d302f-text">  imports and tests</text>
  <text x="265" y="260" class="d302f-text" font-weight="600">Method:</text>
  <text x="265" y="280" class="d302f-text">Search/Replace chunks</text>
  
  <!-- Step 3: Test Verification -->
  <rect x="460" y="110" width="190" height="260" class="d302f-test" />
  <text x="475" y="140" class="d302f-header" fill="#15803d">3. Tool Verification</text>
  <text x="475" y="170" class="d302f-text">• Runs `pytest tests/`</text>
  <text x="475" y="190" class="d302f-text">• Runs `mypy` type check</text>
  <text x="475" y="210" class="d302f-text">• Runs `ruff` linter</text>
  <text x="475" y="240" class="d302f-text" font-weight="600">Result Evaluation:</text>
  <text x="475" y="260" class="d302f-text">Pass -> Complete</text>
  <text x="475" y="280" class="d302f-text">Fail -> Error Observation</text>
  
  <!-- Step 4: Self-Correction Loop -->
  <rect x="680" y="110" width="180" height="260" class="d302f-card" />
  <text x="695" y="140" class="d302f-header">4. Self-Correction</text>
  <text x="695" y="170" class="d302f-text">• Parses stack trace</text>
  <text x="695" y="190" class="d302f-text">• Identifies line number</text>
  <text x="695" y="210" class="d302f-text">• Generates fix diff</text>
  <text x="695" y="240" class="d302f-text" font-weight="600">Iterates:</text>
  <text x="695" y="260" class="d302f-text">Until all tests green</text>
  <text x="695" y="280" class="d302f-text">or max turns reached</text>
  
  <!-- Loop Path -->
  <path d="M 770 230 L 770 330 L 340 330 L 340 230" class="d302f-loop" />
  <text x="450" y="350" class="d302f-text" font-weight="600">Self-Correction Feedback Loop</text>
</svg>