<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Failure included.">
  <title>Four consequences of scaling out</title>
  <style>
    .distributed-implications-bg   { fill: #f8fafc; }
    .distributed-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distributed-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distributed-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distributed-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distributed-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distributed-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distributed-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .distributed-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .distributed-implications-stage { opacity: 1; }

    .distributed-implications-s0 { animation-delay: 0.00s; }
    .distributed-implications-e0 { animation-delay: 0.00s; }
    .distributed-implications-s1 { animation-delay: 1.28s; }
    .distributed-implications-e1 { animation-delay: 1.28s; }
    .distributed-implications-s2 { animation-delay: 2.56s; }
    .distributed-implications-e2 { animation-delay: 2.56s; }
    .distributed-implications-s3 { animation-delay: 3.84s; }
    .distributed-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .distributed-implications-conn  { animation: distributed-implications-trace 6.4s ease-in-out infinite; }
      .distributed-implications-stage { animation: distributed-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes distributed-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes distributed-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .distributed-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .distributed-implications-stage { animation: distributed-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes distributed-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="distributed-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="distributed-implications-bg" width="980" height="322"/>
  <text class="distributed-implications-h1"  x="30" y="40">Four consequences of scaling out</text>
  <text class="distributed-implications-sub" x="30" y="64">Failure included.</text>
  <g class="distributed-implications-stage distributed-implications-s0">
    <rect class="distributed-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-implications-step" x="44" y="142">01</text>
    <text class="distributed-implications-name" x="70" y="142">Cost scales with devices multiplied by time</text>
    <text class="distributed-implications-desc" x="44" y="166">And a wasted week is a large</text>
    <text class="distributed-implications-desc" x="44" y="182">number.</text>
  </g>
  <line class="distributed-implications-line distributed-implications-conn distributed-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#distributed-implications-tip)"/>
  <g class="distributed-implications-stage distributed-implications-s1">
    <rect class="distributed-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-implications-step" x="280" y="142">02</text>
    <text class="distributed-implications-name" x="306" y="142">At cluster scale, something always fails</text>
    <text class="distributed-implications-desc" x="280" y="166">So checkpoint often and resume</text>
    <text class="distributed-implications-desc" x="280" y="182">automatically.</text>
  </g>
  <line class="distributed-implications-line distributed-implications-conn distributed-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#distributed-implications-tip)"/>
  <g class="distributed-implications-stage distributed-implications-s2">
    <rect class="distributed-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-implications-step" x="516" y="142">03</text>
    <text class="distributed-implications-name" x="542" y="142">Scaling is sub-linear</text>
    <text class="distributed-implications-desc" x="516" y="166">Twice the devices gives well</text>
    <text class="distributed-implications-desc" x="516" y="182">under twice the throughput.</text>
  </g>
  <line class="distributed-implications-line distributed-implications-conn distributed-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#distributed-implications-tip)"/>
  <g class="distributed-implications-stage distributed-implications-s3">
    <rect class="distributed-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-implications-step" x="752" y="142">04</text>
    <text class="distributed-implications-name" x="778" y="142">And debugging is much harder</text>
    <text class="distributed-implications-desc" x="752" y="166">A deadlock in one rank hangs the</text>
    <text class="distributed-implications-desc" x="752" y="182">entire job.</text>
  </g>
  <text class="distributed-implications-sub" x="30" y="304">Hardware failure at scale is a certainty rather than a risk, which is why checkpoint and resume are part of the training design rather than an operational afterthought.</text>
</svg>
