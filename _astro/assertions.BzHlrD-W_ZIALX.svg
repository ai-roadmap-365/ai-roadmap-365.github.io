<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Use both.">
  <title>Deterministic assertions against judged ones</title>
  <style>
    .assertions-bg   { fill: #f8fafc; }
    .assertions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assertions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assertions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assertions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assertions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assertions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assertions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assertions-row { opacity: 1; }
    .assertions-r0 { animation-delay: 0.00s; }
    .assertions-r1 { animation-delay: 0.45s; }
    .assertions-r2 { animation-delay: 0.90s; }
    .assertions-r3 { animation-delay: 1.35s; }
    .assertions-r4 { animation-delay: 1.80s; }
    .assertions-row { animation: assertions-reveal 7.3s ease-in-out infinite; }
    @keyframes assertions-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="assertions-bg" width="980" height="390"/>
  <text class="assertions-h1"  x="30" y="40">Deterministic assertions against judged ones</text>
  <text class="assertions-sub" x="30" y="64">Use both.</text>
  <rect class="assertions-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="assertions-name" x="46" y="122">Deterministic</text>
  <text class="assertions-desc" x="46" y="142">Cheap and certain.</text>
  <text class="assertions-desc assertions-row assertions-r0" x="46" y="182">Schema validity, required fields</text>
  <text class="assertions-desc assertions-row assertions-r1" x="46" y="216">Forbidden strings absent</text>
  <text class="assertions-desc assertions-row assertions-r2" x="46" y="250">Length and latency bounds</text>
  <text class="assertions-desc assertions-row assertions-r3" x="46" y="284">Free, and instant</text>
  <text class="assertions-desc assertions-row assertions-r4" x="46" y="318">Run these first</text>
  <rect class="assertions-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="assertions-name" x="526" y="122">Model-graded</text>
  <text class="assertions-desc" x="526" y="142">Expensive and nuanced.</text>
  <text class="assertions-desc assertions-row assertions-r0" x="526" y="182">Tone, helpfulness, faithfulness</text>
  <text class="assertions-desc assertions-row assertions-r1" x="526" y="216">Whether the answer addresses the question</text>
  <text class="assertions-desc assertions-row assertions-r2" x="526" y="250">Costs a model call per case</text>
  <text class="assertions-desc assertions-row assertions-r3" x="526" y="284">Slower, and itself variable</text>
  <text class="assertions-desc assertions-row assertions-r4" x="526" y="318">Run these on what passes</text>
  <text class="assertions-sub" x="30" y="372">Ordering them cheap-first is a meaningful saving at scale: most failures are caught by the deterministic tier, which never needs a model call to find them.</text>
</svg>
