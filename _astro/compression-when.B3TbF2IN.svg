<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to compress</title>
  <style>
    .compression-when-bg   { fill: #f8fafc; }
    .compression-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compression-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compression-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compression-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compression-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compression-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compression-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compression-when-row { opacity: 1; }
    .compression-when-r0 { animation-delay: 0.00s; }
    .compression-when-r1 { animation-delay: 0.45s; }
    .compression-when-r2 { animation-delay: 0.90s; }
    .compression-when-r3 { animation-delay: 1.35s; }
    .compression-when-r4 { animation-delay: 1.80s; }
    .compression-when-row { animation: compression-when-reveal 7.3s ease-in-out infinite; }
    @keyframes compression-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="compression-when-bg" width="980" height="390"/>
  <text class="compression-when-h1"  x="30" y="40">When to compress</text>
  <text class="compression-when-sub" x="30" y="64">And when not to.</text>
  <rect class="compression-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="compression-when-name" x="46" y="122">Compress</text>
  <text class="compression-when-desc" x="46" y="142">Deployment constraints.</text>
  <text class="compression-when-desc compression-when-row compression-when-r0" x="46" y="182">On-device or edge deployment</text>
  <text class="compression-when-desc compression-when-row compression-when-r1" x="46" y="216">High-volume serving where cost dominates</text>
  <text class="compression-when-desc compression-when-row compression-when-r2" x="46" y="250">Strict latency budgets</text>
  <text class="compression-when-desc compression-when-row compression-when-r3" x="46" y="284">When the model does not fit</text>
  <text class="compression-when-desc compression-when-row compression-when-r4" x="46" y="318">Where the accuracy loss is measured and accepted</text>
  <rect class="compression-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="compression-when-name" x="526" y="122">Do not</text>
  <text class="compression-when-desc" x="526" y="142">Four cases.</text>
  <text class="compression-when-desc compression-when-row compression-when-r0" x="526" y="182">Before the model is otherwise finished</text>
  <text class="compression-when-desc compression-when-row compression-when-r1" x="526" y="216">During training or research</text>
  <text class="compression-when-desc compression-when-row compression-when-r2" x="526" y="250">Safety-critical decisions without extensive testing</text>
  <text class="compression-when-desc compression-when-row compression-when-r3" x="526" y="284">Where the model is already fast enough</text>
  <text class="compression-when-desc compression-when-row compression-when-r4" x="526" y="318">Or where nobody has measured the loss</text>
  <text class="compression-when-sub" x="30" y="372">Compressing before the model is finished is wasted effort in both directions: the architecture will change, and the compression will have to be redone and remeasured.</text>
</svg>
