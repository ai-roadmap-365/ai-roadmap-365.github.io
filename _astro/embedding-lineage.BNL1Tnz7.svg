<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Local windows, global counts, subwords.">
  <title>Three approaches to learning embeddings</title>
  <style>
    .embedding-lineage-bg   { fill: #f8fafc; }
    .embedding-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .embedding-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .embedding-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .embedding-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .embedding-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .embedding-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .embedding-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .embedding-lineage-stage { opacity: 1; }

    .embedding-lineage-s0 { animation-delay: 0.00s; }
    .embedding-lineage-e0 { animation-delay: 0.00s; }
    .embedding-lineage-s1 { animation-delay: 1.50s; }
    .embedding-lineage-e1 { animation-delay: 1.50s; }
    .embedding-lineage-s2 { animation-delay: 3.00s; }
    .embedding-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .embedding-lineage-conn  { animation: embedding-lineage-trace 6s ease-in-out infinite; }
      .embedding-lineage-stage { animation: embedding-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes embedding-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes embedding-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .embedding-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .embedding-lineage-stage { animation: embedding-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes embedding-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="embedding-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="embedding-lineage-bg" width="980" height="322"/>
  <text class="embedding-lineage-h1"  x="30" y="40">Three approaches to learning embeddings</text>
  <text class="embedding-lineage-sub" x="30" y="64">Local windows, global counts, subwords.</text>
  <g class="embedding-lineage-stage embedding-lineage-s0">
    <rect class="embedding-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="embedding-lineage-step" x="44" y="142">01</text>
    <text class="embedding-lineage-name" x="70" y="142">Local window prediction</text>
    <text class="embedding-lineage-desc" x="44" y="166">Predict a word from its neighbours, or</text>
    <text class="embedding-lineage-desc" x="44" y="182">neighbours from a word.</text>
  </g>
  <line class="embedding-lineage-line embedding-lineage-conn embedding-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#embedding-lineage-tip)"/>
  <g class="embedding-lineage-stage embedding-lineage-s1">
    <rect class="embedding-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="embedding-lineage-step" x="359" y="142">02</text>
    <text class="embedding-lineage-name" x="385" y="142">Global co-occurrence</text>
    <text class="embedding-lineage-desc" x="359" y="166">Factorise the whole corpus co-occurrence</text>
    <text class="embedding-lineage-desc" x="359" y="182">matrix directly.</text>
    <text class="embedding-lineage-edge" x="359" y="242">global</text>
  </g>
  <line class="embedding-lineage-line embedding-lineage-conn embedding-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#embedding-lineage-tip)"/>
  <g class="embedding-lineage-stage embedding-lineage-s2">
    <rect class="embedding-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="embedding-lineage-step" x="674" y="142">03</text>
    <text class="embedding-lineage-name" x="700" y="142">Subword composition</text>
    <text class="embedding-lineage-desc" x="674" y="166">A word's vector as the sum of its character</text>
    <text class="embedding-lineage-desc" x="674" y="182">n-grams.</text>
    <text class="embedding-lineage-edge" x="674" y="242">no OOV</text>
  </g>
  <text class="embedding-lineage-sub" x="30" y="304">The third approach eliminated the out-of-vocabulary problem for static embeddings: an unseen word still has character n-grams, so it still has a vector.</text>
</svg>
