<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three numbers that explain why a faster clock rarely fixes a slow program.">
  <title>The processor is usually waiting</title>
  <style>
    .cycle-cost-scale-bg   { fill: #f8fafc; }
    .cycle-cost-scale-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cycle-cost-scale-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cycle-cost-scale-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cycle-cost-scale-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cycle-cost-scale-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cycle-cost-scale-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cycle-cost-scale-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cycle-cost-scale-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cycle-cost-scale-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cycle-cost-scale-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cycle-cost-scale-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cycle-cost-scale-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cycle-cost-scale-row { opacity: 1; }
    .cycle-cost-scale-r0 { animation-delay: 0.00s; }
    .cycle-cost-scale-r1 { animation-delay: 0.45s; }
    .cycle-cost-scale-r2 { animation-delay: 0.90s; }
    .cycle-cost-scale-r3 { animation-delay: 1.35s; }
    .cycle-cost-scale-r4 { animation-delay: 1.80s; }
    .cycle-cost-scale-row { animation: cycle-cost-scale-reveal 7.3s ease-in-out infinite; }
    @keyframes cycle-cost-scale-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cycle-cost-scale-bg" width="980" height="390"/>
  <text class="cycle-cost-scale-h1"  x="30" y="40">The processor is usually waiting</text>
  <text class="cycle-cost-scale-sub" x="30" y="64">Three numbers that explain why a faster clock rarely fixes a slow program.</text>
  <rect class="cycle-cost-scale-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cycle-cost-scale-name" x="46" y="122">One cycle</text>
  <text class="cycle-cost-scale-desc" x="46" y="142">About 0.3 nanoseconds</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r0" x="46" y="182">A 3 GHz chip completes 3 billion a second</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r1" x="46" y="216">Light travels roughly 10 cm in that time</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r2" x="46" y="250">Which is why distance on the chip matters</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r3" x="46" y="284">A register answers within one</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r4" x="46" y="318">The clock is a timing signal, not work done</text>
  <rect class="cycle-cost-scale-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cycle-cost-scale-name" x="526" y="122">One memory access</text>
  <text class="cycle-cost-scale-desc" x="526" y="142">About 100 nanoseconds</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r0" x="526" y="182">Roughly 300 cycles of waiting</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r1" x="526" y="216">The ALU has nothing to do meanwhile</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r2" x="526" y="250">Cache exists entirely to avoid this</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r3" x="526" y="284">Day 3 measures it on your own machine</text>
  <text class="cycle-cost-scale-desc cycle-cost-scale-row cycle-cost-scale-r4" x="526" y="318">This, not clock speed, is usually the limit</text>
  <text class="cycle-cost-scale-sub" x="30" y="372">A chip's speed is rarely the reason a program is slow. What it is waiting for usually is.</text>
</svg>
