<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One instruction, thousands of data points.">
  <title>Why accelerators exist</title>
  <style>
    .cpu-gpu-idea-bg   { fill: #f8fafc; }
    .cpu-gpu-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cpu-gpu-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cpu-gpu-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cpu-gpu-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cpu-gpu-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cpu-gpu-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cpu-gpu-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cpu-gpu-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cpu-gpu-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cpu-gpu-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cpu-gpu-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cpu-gpu-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cpu-gpu-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cpu-gpu-idea-stage { opacity: 1; }

    .cpu-gpu-idea-s0 { animation-delay: 0.00s; }
    .cpu-gpu-idea-e0 { animation-delay: 0.00s; }
    .cpu-gpu-idea-s1 { animation-delay: 1.28s; }
    .cpu-gpu-idea-e1 { animation-delay: 1.28s; }
    .cpu-gpu-idea-s2 { animation-delay: 2.56s; }
    .cpu-gpu-idea-e2 { animation-delay: 2.56s; }
    .cpu-gpu-idea-s3 { animation-delay: 3.84s; }
    .cpu-gpu-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cpu-gpu-idea-conn  { animation: cpu-gpu-idea-trace 6.4s ease-in-out infinite; }
      .cpu-gpu-idea-stage { animation: cpu-gpu-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cpu-gpu-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cpu-gpu-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cpu-gpu-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cpu-gpu-idea-stage { animation: cpu-gpu-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cpu-gpu-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cpu-gpu-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cpu-gpu-idea-bg" width="980" height="322"/>
  <text class="cpu-gpu-idea-h1"  x="30" y="40">Why accelerators exist</text>
  <text class="cpu-gpu-idea-sub" x="30" y="64">One instruction, thousands of data points.</text>
  <g class="cpu-gpu-idea-stage cpu-gpu-idea-s0">
    <rect class="cpu-gpu-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cpu-gpu-idea-step" x="44" y="142">01</text>
    <text class="cpu-gpu-idea-name" x="70" y="142">Neural networks are matrix multiplication</text>
    <text class="cpu-gpu-idea-desc" x="44" y="166">Overwhelmingly. Almost</text>
    <text class="cpu-gpu-idea-desc" x="44" y="182">everything else is a rounding</text>
    <text class="cpu-gpu-idea-desc" x="44" y="198">error.</text>
  </g>
  <line class="cpu-gpu-idea-line cpu-gpu-idea-conn cpu-gpu-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cpu-gpu-idea-tip)"/>
  <g class="cpu-gpu-idea-stage cpu-gpu-idea-s1">
    <rect class="cpu-gpu-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cpu-gpu-idea-step" x="280" y="142">02</text>
    <text class="cpu-gpu-idea-name" x="306" y="142">And each output element is independent</text>
    <text class="cpu-gpu-idea-desc" x="280" y="166">Nothing waits on anything else.</text>
  </g>
  <line class="cpu-gpu-idea-line cpu-gpu-idea-conn cpu-gpu-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cpu-gpu-idea-tip)"/>
  <g class="cpu-gpu-idea-stage cpu-gpu-idea-s2">
    <rect class="cpu-gpu-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cpu-gpu-idea-step" x="516" y="142">03</text>
    <text class="cpu-gpu-idea-name" x="542" y="142">So compute thousands at once</text>
    <text class="cpu-gpu-idea-desc" x="516" y="166">Simple units, run in lockstep,</text>
    <text class="cpu-gpu-idea-desc" x="516" y="182">on different data.</text>
  </g>
  <line class="cpu-gpu-idea-line cpu-gpu-idea-conn cpu-gpu-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cpu-gpu-idea-tip)"/>
  <g class="cpu-gpu-idea-stage cpu-gpu-idea-s3">
    <rect class="cpu-gpu-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cpu-gpu-idea-step" x="752" y="142">04</text>
    <text class="cpu-gpu-idea-name" x="778" y="142">At much lower clock speeds</text>
    <text class="cpu-gpu-idea-desc" x="752" y="166">Slower per unit, vastly faster</text>
    <text class="cpu-gpu-idea-desc" x="752" y="182">in aggregate.</text>
    <text class="cpu-gpu-idea-edge" x="752" y="242">width, not speed</text>
  </g>
  <text class="cpu-gpu-idea-sub" x="30" y="304">The clock-speed point is worth holding on to: accelerators run slower per operation than a general-purpose processor and win purely on how many operations happen simultaneously.</text>
</svg>
