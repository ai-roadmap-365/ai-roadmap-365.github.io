<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="Private addresses are room numbers, not street addresses.">
  <title>Why your laptop's address is useless to a server</title>
  <style>
    .private-versus-public-bg   { fill: #f8fafc; }
    .private-versus-public-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-versus-public-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-versus-public-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-versus-public-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-versus-public-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-versus-public-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .private-versus-public-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .private-versus-public-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .private-versus-public-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .private-versus-public-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .private-versus-public-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .private-versus-public-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .private-versus-public-row { opacity: 1; }
    .private-versus-public-r0 { animation-delay: 0.00s; }
    .private-versus-public-r1 { animation-delay: 0.45s; }
    .private-versus-public-r2 { animation-delay: 0.90s; }
    .private-versus-public-r3 { animation-delay: 1.35s; }
    .private-versus-public-r4 { animation-delay: 1.80s; }
    .private-versus-public-r5 { animation-delay: 2.25s; }
    .private-versus-public-row { animation: private-versus-public-reveal 7.7s ease-in-out infinite; }
    @keyframes private-versus-public-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="private-versus-public-bg" width="980" height="424"/>
  <text class="private-versus-public-h1"  x="30" y="40">Why your laptop's address is useless to a server</text>
  <text class="private-versus-public-sub" x="30" y="64">Private addresses are room numbers, not street addresses.</text>
  <rect class="private-versus-public-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="private-versus-public-name" x="46" y="122">Private</text>
  <text class="private-versus-public-desc" x="46" y="142">Reserved, never routed publicly.</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r0" x="46" y="182">10.0.0.0/8 — large internal networks</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r1" x="46" y="216">172.16.0.0/12 — medium ones</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r2" x="46" y="250">192.168.0.0/16 — home and small office</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r3" x="46" y="284">127.0.0.0/8 — this machine only</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r4" x="46" y="318">Reachable only inside its own network</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r5" x="46" y="352">NAT lets many share one public address</text>
  <rect class="private-versus-public-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="private-versus-public-name" x="526" y="122">Public</text>
  <text class="private-versus-public-desc" x="526" y="142">Globally reachable.</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r0" x="526" y="182">Assigned by regional registries</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r1" x="526" y="216">Routed across the whole internet</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r2" x="526" y="250">What a name's A record usually points to</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r3" x="526" y="284">What a server needs to be reached at</text>
  <text class="private-versus-public-desc private-versus-public-row private-versus-public-r4" x="526" y="318">Scarce under IPv4; abundant under IPv6</text>
  <text class="private-versus-public-sub" x="30" y="406">Recognising a private address by sight explains a great many "it works on my machine but not from the server" mysteries, usually in under a second.</text>
</svg>
