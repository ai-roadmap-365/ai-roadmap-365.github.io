<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Importing a module runs every top-level statement.">
  <title>Why a file needs the guard to be both</title>
  <style>
    .run-me-or-import-me-bg   { fill: #f8fafc; }
    .run-me-or-import-me-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-me-or-import-me-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-me-or-import-me-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-me-or-import-me-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-me-or-import-me-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-me-or-import-me-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .run-me-or-import-me-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .run-me-or-import-me-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .run-me-or-import-me-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .run-me-or-import-me-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .run-me-or-import-me-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .run-me-or-import-me-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .run-me-or-import-me-row { opacity: 1; }
    .run-me-or-import-me-r0 { animation-delay: 0.00s; }
    .run-me-or-import-me-r1 { animation-delay: 0.45s; }
    .run-me-or-import-me-r2 { animation-delay: 0.90s; }
    .run-me-or-import-me-r3 { animation-delay: 1.35s; }
    .run-me-or-import-me-r4 { animation-delay: 1.80s; }
    .run-me-or-import-me-row { animation: run-me-or-import-me-reveal 7.3s ease-in-out infinite; }
    @keyframes run-me-or-import-me-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="run-me-or-import-me-bg" width="980" height="390"/>
  <text class="run-me-or-import-me-h1"  x="30" y="40">Why a file needs the guard to be both</text>
  <text class="run-me-or-import-me-sub" x="30" y="64">Importing a module runs every top-level statement.</text>
  <rect class="run-me-or-import-me-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="run-me-or-import-me-name" x="46" y="122">Work at module level</text>
  <text class="run-me-or-import-me-desc" x="46" y="142">Runs on import, too.</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r0" x="46" y="182">python3 prog.py — works</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r1" x="46" y="216">import prog — ALSO runs everything</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r2" x="46" y="250">A test importing one function runs the pipeline</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r3" x="46" y="284">So the file cannot be tested</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r4" x="46" y="318">And cannot be reused as a library</text>
  <rect class="run-me-or-import-me-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="run-me-or-import-me-name" x="526" y="122">Work inside main()</text>
  <text class="run-me-or-import-me-desc" x="526" y="142">Runs only when run.</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r0" x="526" y="182">The guard checks how the file was loaded</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r1" x="526" y="216">python3 prog.py — runs main</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r2" x="526" y="250">import prog — defines, runs nothing</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r3" x="526" y="284">Tests can import and call directly</text>
  <text class="run-me-or-import-me-desc run-me-or-import-me-row run-me-or-import-me-r4" x="526" y="318">Two lines, and the file becomes reusable</text>
  <text class="run-me-or-import-me-sub" x="30" y="372">This follows from modules being ordinary code: Python defines your functions by executing the file, so anything else at that level executes too. The guard is how you separate the definitions from the doing.</text>
</svg>
