<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Model Card Canonical Architecture</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 6; }
    .box-sec { fill: #1e1b4b; stroke: #6366f1; stroke-width: 2; rx: 6; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
  </style>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">The 9 Canonical Sections of an Enterprise Model Card</text>
  <text x="450" y="65" class="text-sub">Mitchell et al. (2019) / Partnership on AI Standard for Transparent Machine Learning</text>

  <!-- Row 1 -->
  <rect x="50" y="90" width="240" height="105" class="box-sec" />
  <text x="170" y="115" class="text-title">1. Model Details</text>
  <text x="170" y="140" class="text-sub">Developer, version, architecture,</text>
  <text x="170" y="160" class="text-sub">release date, license, contacts</text>

  <rect x="330" y="90" width="240" height="105" class="box-sec" />
  <text x="450" y="115" class="text-title">2. Intended Use</text>
  <text x="450" y="140" class="text-sub">Primary uses, target users,</text>
  <text x="450" y="160" class="text-sub" fill="#ef4444">Out-of-scope &amp; prohibited uses</text>

  <rect x="610" y="90" width="240" height="105" class="box-sec" />
  <text x="730" y="115" class="text-title">3. Factors &amp; Subgroups</text>
  <text x="730" y="140" class="text-sub">Demographic groups, hardware,</text>
  <text x="730" y="160" class="text-sub">environmental conditions</text>

  <!-- Row 2 -->
  <rect x="50" y="215" width="240" height="105" class="box-sec" />
  <text x="170" y="240" class="text-title">4. Metrics &amp; Baselines</text>
  <text x="170" y="265" class="text-sub">Performance metrics, thresholds,</text>
  <text x="170" y="285" class="text-sub">lift over heuristic baselines</text>

  <rect x="330" y="215" width="240" height="105" class="box-sec" />
  <text x="450" y="240" class="text-title">5. Evaluation Data</text>
  <text x="450" y="265" class="text-sub">Validation dataset details,</text>
  <text x="450" y="285" class="text-sub">split strategy (Group/Time)</text>

  <rect x="610" y="215" width="240" height="105" class="box-sec" />
  <text x="730" y="240" class="text-title">6. Training Data</text>
  <text x="730" y="265" class="text-sub">Ingestion filters, schemas,</text>
  <text x="730" y="285" class="text-sub">preprocessing &amp; cleaning rules</text>

  <!-- Row 3 -->
  <rect x="50" y="340" width="240" height="115" class="box-sec" />
  <text x="170" y="365" class="text-title">7. Quantitative Slices</text>
  <text x="170" y="390" class="text-sub">Performance by subpopulation,</text>
  <text x="170" y="410" class="text-sub">Disparate Impact &amp; Equal Opp</text>

  <rect x="330" y="340" width="240" height="115" class="box-sec" />
  <text x="450" y="365" class="text-title">8. Ethical Considerations</text>
  <text x="450" y="390" class="text-sub">Proxy discrimination risks,</text>
  <text x="450" y="410" class="text-sub">human-in-the-loop escalations</text>

  <rect x="610" y="340" width="240" height="115" class="box-sec" />
  <text x="730" y="365" class="text-title">9. Caveats &amp; Limits</text>
  <text x="730" y="390" class="text-sub">Known failure modes, drift,</text>
  <text x="730" y="410" class="text-sub">retraining trigger criteria</text>
</svg>
