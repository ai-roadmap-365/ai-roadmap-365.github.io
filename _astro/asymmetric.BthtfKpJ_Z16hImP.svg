<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And many models need to be told which.">
  <title>Queries and passages are different</title>
  <style>
    .asymmetric-bg   { fill: #f8fafc; }
    .asymmetric-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asymmetric-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asymmetric-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asymmetric-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asymmetric-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asymmetric-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .asymmetric-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .asymmetric-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .asymmetric-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .asymmetric-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .asymmetric-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .asymmetric-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .asymmetric-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .asymmetric-stage { opacity: 1; }

    .asymmetric-s0 { animation-delay: 0.00s; }
    .asymmetric-e0 { animation-delay: 0.00s; }
    .asymmetric-s1 { animation-delay: 1.28s; }
    .asymmetric-e1 { animation-delay: 1.28s; }
    .asymmetric-s2 { animation-delay: 2.56s; }
    .asymmetric-e2 { animation-delay: 2.56s; }
    .asymmetric-s3 { animation-delay: 3.84s; }
    .asymmetric-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .asymmetric-conn  { animation: asymmetric-trace 6.4s ease-in-out infinite; }
      .asymmetric-stage { animation: asymmetric-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes asymmetric-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes asymmetric-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .asymmetric-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .asymmetric-stage { animation: asymmetric-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes asymmetric-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="asymmetric-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="asymmetric-bg" width="980" height="322"/>
  <text class="asymmetric-h1"  x="30" y="40">Queries and passages are different</text>
  <text class="asymmetric-sub" x="30" y="64">And many models need to be told which.</text>
  <g class="asymmetric-stage asymmetric-s0">
    <rect class="asymmetric-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="asymmetric-step" x="44" y="142">01</text>
    <text class="asymmetric-name" x="70" y="142">A query is short and a passage is long</text>
    <text class="asymmetric-desc" x="44" y="166">They do not naturally land near</text>
    <text class="asymmetric-desc" x="44" y="182">each other.</text>
  </g>
  <line class="asymmetric-line asymmetric-conn asymmetric-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#asymmetric-tip)"/>
  <g class="asymmetric-stage asymmetric-s1">
    <rect class="asymmetric-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="asymmetric-step" x="280" y="142">02</text>
    <text class="asymmetric-name" x="306" y="142">Which pushes queries into their own region</text>
    <text class="asymmetric-desc" x="280" y="166">Similar to other queries rather</text>
    <text class="asymmetric-desc" x="280" y="182">than to answers.</text>
  </g>
  <line class="asymmetric-line asymmetric-conn asymmetric-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#asymmetric-tip)"/>
  <g class="asymmetric-stage asymmetric-s2">
    <rect class="asymmetric-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="asymmetric-step" x="516" y="142">03</text>
    <text class="asymmetric-name" x="542" y="142">So many models take a prefix saying which it is</text>
    <text class="asymmetric-desc" x="516" y="166">Encoded differently on each</text>
    <text class="asymmetric-desc" x="516" y="182">side.</text>
  </g>
  <line class="asymmetric-line asymmetric-conn asymmetric-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#asymmetric-tip)"/>
  <g class="asymmetric-stage asymmetric-s3">
    <rect class="asymmetric-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="asymmetric-step" x="752" y="142">04</text>
    <text class="asymmetric-name" x="778" y="142">And omitting it degrades results quietly</text>
    <text class="asymmetric-desc" x="752" y="166">With no error, and no obvious</text>
    <text class="asymmetric-desc" x="752" y="182">symptom.</text>
  </g>
  <text class="asymmetric-sub" x="30" y="304">This is one of the most common silent misconfigurations in retrieval systems: everything works, results are merely worse, and nothing anywhere reports a problem.</text>
</svg>
