<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Borrowed from mathematics.">
  <title>Four steps toward comprehensions</title>
  <style>
    .comprehension-history-bg   { fill: #f8fafc; }
    .comprehension-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .comprehension-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .comprehension-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .comprehension-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .comprehension-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .comprehension-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .comprehension-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .comprehension-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .comprehension-history-stage { opacity: 1; }

    .comprehension-history-s0 { animation-delay: 0.00s; }
    .comprehension-history-e0 { animation-delay: 0.00s; }
    .comprehension-history-s1 { animation-delay: 1.28s; }
    .comprehension-history-e1 { animation-delay: 1.28s; }
    .comprehension-history-s2 { animation-delay: 2.56s; }
    .comprehension-history-e2 { animation-delay: 2.56s; }
    .comprehension-history-s3 { animation-delay: 3.84s; }
    .comprehension-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .comprehension-history-conn  { animation: comprehension-history-trace 6.4s ease-in-out infinite; }
      .comprehension-history-stage { animation: comprehension-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes comprehension-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes comprehension-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .comprehension-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .comprehension-history-stage { animation: comprehension-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes comprehension-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="comprehension-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="comprehension-history-bg" width="980" height="322"/>
  <text class="comprehension-history-h1"  x="30" y="40">Four steps toward comprehensions</text>
  <text class="comprehension-history-sub" x="30" y="64">Borrowed from mathematics.</text>
  <g class="comprehension-history-stage comprehension-history-s0">
    <rect class="comprehension-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-history-step" x="44" y="142">01</text>
    <text class="comprehension-history-name" x="70" y="142">Set-builder notation in mathematics</text>
    <text class="comprehension-history-desc" x="44" y="166">The set of all x such that a</text>
    <text class="comprehension-history-desc" x="44" y="182">condition holds.</text>
  </g>
  <line class="comprehension-history-line comprehension-history-conn comprehension-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#comprehension-history-tip)"/>
  <g class="comprehension-history-stage comprehension-history-s1">
    <rect class="comprehension-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-history-step" x="280" y="142">02</text>
    <text class="comprehension-history-name" x="306" y="142">Adopted by functional languages</text>
    <text class="comprehension-history-desc" x="280" y="166">As map and filter over lists.</text>
  </g>
  <line class="comprehension-history-line comprehension-history-conn comprehension-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#comprehension-history-tip)"/>
  <g class="comprehension-history-stage comprehension-history-s2">
    <rect class="comprehension-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-history-step" x="516" y="142">03</text>
    <text class="comprehension-history-name" x="542" y="142">Then as list comprehension syntax</text>
    <text class="comprehension-history-desc" x="516" y="166">Which read closer to the</text>
    <text class="comprehension-history-desc" x="516" y="182">mathematics.</text>
  </g>
  <line class="comprehension-history-line comprehension-history-conn comprehension-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#comprehension-history-tip)"/>
  <g class="comprehension-history-stage comprehension-history-s3">
    <rect class="comprehension-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-history-step" x="752" y="142">04</text>
    <text class="comprehension-history-name" x="778" y="142">And generator expressions made it lazy</text>
    <text class="comprehension-history-desc" x="752" y="166">Which removed the memory cost.</text>
  </g>
  <text class="comprehension-history-sub" x="30" y="304">The notation was borrowed from mathematics deliberately, which is why a comprehension reads like a definition rather than like a procedure.</text>
</svg>
