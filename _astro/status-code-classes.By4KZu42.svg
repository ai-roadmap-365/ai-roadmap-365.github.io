<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" font-family="system-ui, sans-serif">
  <title>The five HTTP status-code classes and what each one signals</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Reading a status code: five classes by first digit</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#1d4ed8">The first digit tells you the whole story; the rest is detail.</text>

  <!-- 1xx -->
  <rect x="40" y="84" width="680" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <rect x="40" y="84" width="150" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="115" y="130" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a202c">1xx</text>
  <text x="206" y="118" font-size="16" font-weight="bold" fill="#1a202c">Informational</text>
  <text x="206" y="142" font-size="14" fill="#1a202c">"Received, continue." Rarely seen directly &#8594; ignore in everyday work.</text>

  <!-- 2xx -->
  <rect x="40" y="172" width="680" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <rect x="40" y="172" width="150" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="115" y="218" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a202c">2xx</text>
  <text x="206" y="206" font-size="16" font-weight="bold" fill="#1a202c">Success</text>
  <text x="206" y="230" font-size="14" fill="#1a202c">It worked &#8594; read the body. 200 OK &#183; 201 Created &#183; 204 No Content.</text>

  <!-- 3xx -->
  <rect x="40" y="260" width="680" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <rect x="40" y="260" width="150" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="115" y="306" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a202c">3xx</text>
  <text x="206" y="294" font-size="16" font-weight="bold" fill="#1a202c">Redirection</text>
  <text x="206" y="318" font-size="14" fill="#1a202c">It moved &#8594; follow Location. 301 Permanent &#183; 302 Found &#183; 304 Not Modified.</text>

  <!-- 4xx -->
  <rect x="40" y="348" width="680" height="90" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <rect x="40" y="348" width="150" height="90" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="115" y="401" text-anchor="middle" font-size="24" font-weight="bold" fill="#f8fafc">4xx</text>
  <text x="206" y="378" font-size="16" font-weight="bold" fill="#1a202c">Client error &#8212; YOUR request was wrong</text>
  <text x="206" y="402" font-size="14" fill="#1a202c">Fix the request; do not just retry. 400 Bad Request &#183; 401 Unauthorized</text>
  <text x="206" y="424" font-size="14" fill="#1a202c">403 Forbidden &#183; 404 Not Found &#183; 429 Too Many Requests.</text>

  <!-- 5xx -->
  <rect x="40" y="450" width="680" height="90" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <rect x="40" y="450" width="150" height="90" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="115" y="503" text-anchor="middle" font-size="24" font-weight="bold" fill="#f8fafc">5xx</text>
  <text x="206" y="480" font-size="16" font-weight="bold" fill="#1a202c">Server error &#8212; the SERVER failed</text>
  <text x="206" y="504" font-size="14" fill="#1a202c">Not your fault &#8594; retry later with backoff. 500 Internal &#183; 502 Bad</text>
  <text x="206" y="526" font-size="14" fill="#1a202c">Gateway &#183; 503 Service Unavailable.</text>
</svg>
