<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons it matters.">
  <title>Adapter provenance</title>
  <style>
    .adapter-provenance-bg   { fill: #f8fafc; }
    .adapter-provenance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adapter-provenance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adapter-provenance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adapter-provenance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adapter-provenance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adapter-provenance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .adapter-provenance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .adapter-provenance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .adapter-provenance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .adapter-provenance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .adapter-provenance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .adapter-provenance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .adapter-provenance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .adapter-provenance-stage { opacity: 1; }

    .adapter-provenance-s0 { animation-delay: 0.00s; }
    .adapter-provenance-e0 { animation-delay: 0.00s; }
    .adapter-provenance-s1 { animation-delay: 1.28s; }
    .adapter-provenance-e1 { animation-delay: 1.28s; }
    .adapter-provenance-s2 { animation-delay: 2.56s; }
    .adapter-provenance-e2 { animation-delay: 2.56s; }
    .adapter-provenance-s3 { animation-delay: 3.84s; }
    .adapter-provenance-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .adapter-provenance-conn  { animation: adapter-provenance-trace 6.4s ease-in-out infinite; }
      .adapter-provenance-stage { animation: adapter-provenance-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes adapter-provenance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes adapter-provenance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .adapter-provenance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .adapter-provenance-stage { animation: adapter-provenance-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes adapter-provenance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="adapter-provenance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="adapter-provenance-bg" width="980" height="322"/>
  <text class="adapter-provenance-h1"  x="30" y="40">Adapter provenance</text>
  <text class="adapter-provenance-sub" x="30" y="64">Four reasons it matters.</text>
  <g class="adapter-provenance-stage adapter-provenance-s0">
    <rect class="adapter-provenance-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="adapter-provenance-step" x="44" y="142">01</text>
    <text class="adapter-provenance-name" x="70" y="142">An adapter changes model behaviour</text>
    <text class="adapter-provenance-desc" x="44" y="166">Which makes it closer to a</text>
    <text class="adapter-provenance-desc" x="44" y="182">dependency than to data.</text>
  </g>
  <line class="adapter-provenance-line adapter-provenance-conn adapter-provenance-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#adapter-provenance-tip)"/>
  <g class="adapter-provenance-stage adapter-provenance-s1">
    <rect class="adapter-provenance-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="adapter-provenance-step" x="280" y="142">02</text>
    <text class="adapter-provenance-name" x="306" y="142">And it is small enough to share casually</text>
    <text class="adapter-provenance-desc" x="280" y="166">Which is how untrusted ones</text>
    <text class="adapter-provenance-desc" x="280" y="182">spread.</text>
  </g>
  <line class="adapter-provenance-line adapter-provenance-conn adapter-provenance-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#adapter-provenance-tip)"/>
  <g class="adapter-provenance-stage adapter-provenance-s2">
    <rect class="adapter-provenance-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="adapter-provenance-step" x="516" y="142">03</text>
    <text class="adapter-provenance-name" x="542" y="142">A hostile adapter can introduce a backdoor</text>
    <text class="adapter-provenance-desc" x="516" y="166">Behaviour triggered by a</text>
    <text class="adapter-provenance-desc" x="516" y="182">specific phrase.</text>
  </g>
  <line class="adapter-provenance-line adapter-provenance-conn adapter-provenance-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#adapter-provenance-tip)"/>
  <g class="adapter-provenance-stage adapter-provenance-s3">
    <rect class="adapter-provenance-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="adapter-provenance-step" x="752" y="142">04</text>
    <text class="adapter-provenance-name" x="778" y="142">So pin, verify and evaluate before serving</text>
    <text class="adapter-provenance-desc" x="752" y="166">Exactly as for any other</text>
    <text class="adapter-provenance-desc" x="752" y="182">dependency.</text>
  </g>
  <text class="adapter-provenance-sub" x="30" y="304">Treating an adapter as configuration rather than as code is the mistake here: it alters what the model does, and it deserves the same review a library would get.</text>
</svg>
