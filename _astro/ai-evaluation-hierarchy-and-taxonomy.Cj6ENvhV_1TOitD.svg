<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="AI Evaluation Hierarchy and Taxonomy">
  <title>AI Evaluation Hierarchy and Taxonomy</title>
  <defs>
    <style>
      .d309a-bg { fill: #f8fafc; }
      .d309a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d309a-t1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d309a-t2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d309a-t3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d309a-t4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d309a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d309a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d309a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d309a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d309a-bg" />
  
  <text x="40" y="40" class="d309a-title">The 4-Tier AI Evaluation Taxonomy</text>
  <text x="40" y="65" class="d309a-subtitle">AI Evaluation Hierarchy and Taxonomy showing Heuristics &amp; Exact Match, Embedding Similarity, LLM-as-Judge Rubrics, Human Expert Review, and Production Observability</text>
  
  <!-- Tier 1: Deterministic Heuristics -->
  <rect x="40" y="100" width="190" height="300" class="d309a-t1" />
  <text x="55" y="130" class="d309a-header" fill="#1d4ed8">1. Deterministic Heuristics</text>
  <text x="55" y="155" class="d309a-text">• Exact Match / Substring</text>
  <text x="55" y="175" class="d309a-text">• JSON Schema validation</text>
  <text x="55" y="195" class="d309a-text">• Regex pattern matching</text>
  <text x="55" y="215" class="d309a-text">• Python AST syntax check</text>
  <text x="55" y="245" class="d309a-text" font-weight="600">Pros:</text>
  <text x="55" y="265" class="d309a-text">Instant, zero API cost,</text>
  <text x="55" y="280" class="d309a-text">100% reproducible</text>
  <text x="55" y="310" class="d309a-text" font-weight="600">Best For:</text>
  <text x="55" y="330" class="d309a-text">Tool calls &amp; structured data</text>
  
  <!-- Tier 2: Statistical & Embeddings -->
  <rect x="255" y="100" width="190" height="300" class="d309a-t2" />
  <text x="270" y="130" class="d309a-header" fill="#7e22ce">2. Statistical / Vectors</text>
  <text x="270" y="155" class="d309a-text">• ROUGE / BLEU n-grams</text>
  <text x="270" y="175" class="d309a-text">• Embedding cosine distance</text>
  <text x="270" y="195" class="d309a-text">• BERTScore token match</text>
  <text x="270" y="215" class="d309a-text">• Perplexity evaluation</text>
  <text x="270" y="245" class="d309a-text" font-weight="600">Pros:</text>
  <text x="270" y="265" class="d309a-text">Fast semantic overlap</text>
  <text x="270" y="280" class="d309a-text">Captures synonyms</text>
  <text x="270" y="310" class="d309a-text" font-weight="600">Best For:</text>
  <text x="270" y="330" class="d309a-text">Summarization &amp; search</text>
  
  <!-- Tier 3: LLM-as-Judge -->
  <rect x="470" y="100" width="190" height="300" class="d309a-t3" />
  <text x="485" y="130" class="d309a-header" fill="#a16207">3. Model-Graded (LLM)</text>
  <text x="485" y="155" class="d309a-text">• Rubric-based grading</text>
  <text x="485" y="175" class="d309a-text">• Pairwise comparison</text>
  <text x="485" y="195" class="d309a-text">• Grounding &amp; faithfulness</text>
  <text x="485" y="215" class="d309a-text">• Tone &amp; helpfulness</text>
  <text x="485" y="245" class="d309a-text" font-weight="600">Pros:</text>
  <text x="485" y="265" class="d309a-text">High nuance &amp; reasoning</text>
  <text x="485" y="280" class="d309a-text">Automates open prose</text>
  <text x="485" y="310" class="d309a-text" font-weight="600">Best For:</text>
  <text x="485" y="330" class="d309a-text">RAG &amp; conversational chat</text>
  
  <!-- Tier 4: Human Review -->
  <rect x="685" y="100" width="180" height="300" class="d309a-t4" />
  <text x="700" y="130" class="d309a-header" fill="#15803d">4. Human Expert Review</text>
  <text x="700" y="155" class="d309a-text">• Domain SME audit</text>
  <text x="700" y="175" class="d309a-text">• Calibration test sets</text>
  <text x="700" y="195" class="d309a-text">• Red teaming</text>
  <text x="700" y="215" class="d309a-text">• User thumbs-up/down</text>
  <text x="700" y="245" class="d309a-text" font-weight="600">Pros:</text>
  <text x="700" y="265" class="d309a-text">Absolute gold standard</text>
  <text x="700" y="280" class="d309a-text">Calibrates tier 3 LLMs</text>
  <text x="700" y="310" class="d309a-text" font-weight="600">Best For:</text>
  <text x="700" y="330" class="d309a-text">Safety &amp; ground truth</text>
</svg>