<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when you do not.">
  <title>When you need an accelerator</title>
  <style>
    .hardware-when-bg   { fill: #f8fafc; }
    .hardware-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hardware-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hardware-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hardware-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hardware-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hardware-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hardware-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hardware-when-row { opacity: 1; }
    .hardware-when-r0 { animation-delay: 0.00s; }
    .hardware-when-r1 { animation-delay: 0.45s; }
    .hardware-when-r2 { animation-delay: 0.90s; }
    .hardware-when-r3 { animation-delay: 1.35s; }
    .hardware-when-r4 { animation-delay: 1.80s; }
    .hardware-when-row { animation: hardware-when-reveal 7.3s ease-in-out infinite; }
    @keyframes hardware-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hardware-when-bg" width="980" height="390"/>
  <text class="hardware-when-h1"  x="30" y="40">When you need an accelerator</text>
  <text class="hardware-when-sub" x="30" y="64">And when you do not.</text>
  <rect class="hardware-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hardware-when-name" x="46" y="122">You need one</text>
  <text class="hardware-when-desc" x="46" y="142">Training, and heavy serving.</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r0" x="46" y="182">Training anything beyond a toy</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r1" x="46" y="216">Serving large generative models</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r2" x="46" y="250">High-throughput batch inference</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r3" x="46" y="284">Large batch fine-tuning</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r4" x="46" y="318">Anything measured in device-hours</text>
  <rect class="hardware-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hardware-when-name" x="526" y="122">You do not</text>
  <text class="hardware-when-desc" x="526" y="142">More often than assumed.</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r0" x="526" y="182">Small quantised classifiers</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r1" x="526" y="216">Low request volumes</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r2" x="526" y="250">Classical machine learning</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r3" x="526" y="284">Embedding lookups and retrieval</text>
  <text class="hardware-when-desc hardware-when-row hardware-when-r4" x="526" y="318">Where latency is already acceptable</text>
  <text class="hardware-when-sub" x="30" y="372">A quantised small classifier serving comfortably on a general-purpose processor is a common and frequently overlooked outcome, and it removes an entire class of operational cost.</text>
</svg>
