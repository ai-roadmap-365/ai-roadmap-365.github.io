<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Restated each decade.">
  <title>Four steps in this finding</title>
  <style>
    .features-history-bg   { fill: #f8fafc; }
    .features-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .features-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .features-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .features-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .features-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .features-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .features-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .features-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .features-history-stage { opacity: 1; }

    .features-history-s0 { animation-delay: 0.00s; }
    .features-history-e0 { animation-delay: 0.00s; }
    .features-history-s1 { animation-delay: 1.28s; }
    .features-history-e1 { animation-delay: 1.28s; }
    .features-history-s2 { animation-delay: 2.56s; }
    .features-history-e2 { animation-delay: 2.56s; }
    .features-history-s3 { animation-delay: 3.84s; }
    .features-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .features-history-conn  { animation: features-history-trace 6.4s ease-in-out infinite; }
      .features-history-stage { animation: features-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes features-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes features-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .features-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .features-history-stage { animation: features-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes features-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="features-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="features-history-bg" width="980" height="322"/>
  <text class="features-history-h1"  x="30" y="40">Four steps in this finding</text>
  <text class="features-history-sub" x="30" y="64">Restated each decade.</text>
  <g class="features-history-stage features-history-s0">
    <rect class="features-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="features-history-step" x="44" y="142">01</text>
    <text class="features-history-name" x="70" y="142">Practitioners observed it informally for years</text>
    <text class="features-history-desc" x="44" y="166">Better inputs beat better</text>
    <text class="features-history-desc" x="44" y="182">algorithms.</text>
  </g>
  <line class="features-history-line features-history-conn features-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#features-history-tip)"/>
  <g class="features-history-stage features-history-s1">
    <rect class="features-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="features-history-step" x="280" y="142">02</text>
    <text class="features-history-name" x="306" y="142">Then measured directly</text>
    <text class="features-history-desc" x="280" y="166">More data closed gaps that</text>
    <text class="features-history-desc" x="280" y="182">algorithm choice could not.</text>
  </g>
  <line class="features-history-line features-history-conn features-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#features-history-tip)"/>
  <g class="features-history-stage features-history-s2">
    <rect class="features-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="features-history-step" x="516" y="142">03</text>
    <text class="features-history-name" x="542" y="142">Competitions confirmed it repeatedly</text>
    <text class="features-history-desc" x="516" y="166">Feature work separated the top</text>
    <text class="features-history-desc" x="516" y="182">entries.</text>
  </g>
  <line class="features-history-line features-history-conn features-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#features-history-tip)"/>
  <g class="features-history-stage features-history-s3">
    <rect class="features-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="features-history-step" x="752" y="142">04</text>
    <text class="features-history-name" x="778" y="142">And scaling laws restated it for large models</text>
    <text class="features-history-desc" x="752" y="166">Where data quality now</text>
    <text class="features-history-desc" x="752" y="182">dominates.</text>
  </g>
  <text class="features-history-sub" x="30" y="304">The finding keeps being rediscovered in each new setting, most recently as the observation that frontier model quality is now decided by data curation.</text>
</svg>
