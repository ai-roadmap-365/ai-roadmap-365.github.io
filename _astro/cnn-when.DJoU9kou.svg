<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Budget, and whether to train at all.">
  <title>Choosing an architecture</title>
  <style>
    .cnn-when-bg   { fill: #f8fafc; }
    .cnn-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cnn-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cnn-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cnn-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cnn-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cnn-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cnn-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cnn-when-row { opacity: 1; }
    .cnn-when-r0 { animation-delay: 0.00s; }
    .cnn-when-r1 { animation-delay: 0.45s; }
    .cnn-when-r2 { animation-delay: 0.90s; }
    .cnn-when-r3 { animation-delay: 1.35s; }
    .cnn-when-r4 { animation-delay: 1.80s; }
    .cnn-when-row { animation: cnn-when-reveal 7.3s ease-in-out infinite; }
    @keyframes cnn-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cnn-when-bg" width="980" height="390"/>
  <text class="cnn-when-h1"  x="30" y="40">Choosing an architecture</text>
  <text class="cnn-when-sub" x="30" y="64">Budget, and whether to train at all.</text>
  <rect class="cnn-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cnn-when-name" x="46" y="122">Select a pretrained family</text>
  <text class="cnn-when-desc" x="46" y="142">Almost always.</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r0" x="46" y="182">Residual networks for a general default</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r1" x="46" y="216">Efficient families for constrained hardware</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r2" x="46" y="250">Match the compute budget, not the leaderboard</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r3" x="46" y="284">Fine-tune rather than train — Day 213</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r4" x="46" y="318">Days of work saved</text>
  <rect class="cnn-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cnn-when-name" x="526" y="122">Design one</text>
  <text class="cnn-when-desc" x="526" y="142">Rarely, and deliberately.</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r0" x="526" y="182">Unusual input shapes or modalities</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r1" x="526" y="216">Hard latency or memory constraints</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r2" x="526" y="250">Research into architecture itself</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r3" x="526" y="284">Expect to lose to a pretrained baseline</text>
  <text class="cnn-when-desc cnn-when-row cnn-when-r4" x="526" y="318">At least at first</text>
  <text class="cnn-when-sub" x="30" y="372">"Expect to lose to a pretrained baseline" is the honest starting position: a custom architecture trained on your data competes against one trained on millions of images.</text>
</svg>
