<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which sidesteps the scale problem entirely.">
  <title>Fuse by rank, not by score</title>
  <style>
    .rrf-fusion-bg   { fill: #f8fafc; }
    .rrf-fusion-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-fusion-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-fusion-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-fusion-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-fusion-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-fusion-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rrf-fusion-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rrf-fusion-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rrf-fusion-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rrf-fusion-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rrf-fusion-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rrf-fusion-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rrf-fusion-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rrf-fusion-stage { opacity: 1; }

    .rrf-fusion-s0 { animation-delay: 0.00s; }
    .rrf-fusion-e0 { animation-delay: 0.00s; }
    .rrf-fusion-s1 { animation-delay: 1.28s; }
    .rrf-fusion-e1 { animation-delay: 1.28s; }
    .rrf-fusion-s2 { animation-delay: 2.56s; }
    .rrf-fusion-e2 { animation-delay: 2.56s; }
    .rrf-fusion-s3 { animation-delay: 3.84s; }
    .rrf-fusion-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rrf-fusion-conn  { animation: rrf-fusion-trace 6.4s ease-in-out infinite; }
      .rrf-fusion-stage { animation: rrf-fusion-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rrf-fusion-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rrf-fusion-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rrf-fusion-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rrf-fusion-stage { animation: rrf-fusion-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rrf-fusion-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rrf-fusion-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rrf-fusion-bg" width="980" height="322"/>
  <text class="rrf-fusion-h1"  x="30" y="40">Fuse by rank, not by score</text>
  <text class="rrf-fusion-sub" x="30" y="64">Which sidesteps the scale problem entirely.</text>
  <g class="rrf-fusion-stage rrf-fusion-s0">
    <rect class="rrf-fusion-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rrf-fusion-step" x="44" y="142">01</text>
    <text class="rrf-fusion-name" x="70" y="142">Two rankers, two scales</text>
    <text class="rrf-fusion-desc" x="44" y="166">A cosine similarity near 0.8 and</text>
    <text class="rrf-fusion-desc" x="44" y="182">a BM25 score of 14. Not</text>
    <text class="rrf-fusion-desc" x="44" y="198">comparable.</text>
  </g>
  <line class="rrf-fusion-line rrf-fusion-conn rrf-fusion-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rrf-fusion-tip)"/>
  <g class="rrf-fusion-stage rrf-fusion-s1">
    <rect class="rrf-fusion-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rrf-fusion-step" x="280" y="142">02</text>
    <text class="rrf-fusion-name" x="306" y="142">Discard the scores</text>
    <text class="rrf-fusion-desc" x="280" y="166">Keep only the POSITION each</text>
    <text class="rrf-fusion-desc" x="280" y="182">document holds in each list.</text>
    <text class="rrf-fusion-edge" x="280" y="242">rank</text>
  </g>
  <line class="rrf-fusion-line rrf-fusion-conn rrf-fusion-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rrf-fusion-tip)"/>
  <g class="rrf-fusion-stage rrf-fusion-s2">
    <rect class="rrf-fusion-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rrf-fusion-step" x="516" y="142">03</text>
    <text class="rrf-fusion-name" x="542" y="142">Score by 1/(k + rank)</text>
    <text class="rrf-fusion-desc" x="516" y="166">A document ranked first in</text>
    <text class="rrf-fusion-desc" x="516" y="182">either list scores highly;</text>
    <text class="rrf-fusion-desc" x="516" y="198">ranked in both, higher still.</text>
    <text class="rrf-fusion-edge" x="516" y="242">1/(k+r)</text>
  </g>
  <line class="rrf-fusion-line rrf-fusion-conn rrf-fusion-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rrf-fusion-tip)"/>
  <g class="rrf-fusion-stage rrf-fusion-s3">
    <rect class="rrf-fusion-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rrf-fusion-step" x="752" y="142">04</text>
    <text class="rrf-fusion-name" x="778" y="142">Sort by the fused score</text>
    <text class="rrf-fusion-desc" x="752" y="166">No normalisation, no tuning of</text>
    <text class="rrf-fusion-desc" x="752" y="182">relative weights.</text>
    <text class="rrf-fusion-edge" x="752" y="242">fused</text>
  </g>
  <text class="rrf-fusion-sub" x="30" y="304">Rank fusion is popular because it needs no calibration: the two rankers can be replaced independently without retuning a blend weight, which matters when one of them is a model you will upgrade.</text>
</svg>
