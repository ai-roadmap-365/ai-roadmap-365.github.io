<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is parallel; one is not.">
  <title>Prefill and decode are different problems</title>
  <style>
    .prefill-or-decode-bg   { fill: #f8fafc; }
    .prefill-or-decode-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-or-decode-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-or-decode-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-or-decode-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-or-decode-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-or-decode-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prefill-or-decode-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prefill-or-decode-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prefill-or-decode-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prefill-or-decode-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prefill-or-decode-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prefill-or-decode-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prefill-or-decode-row { opacity: 1; }
    .prefill-or-decode-r0 { animation-delay: 0.00s; }
    .prefill-or-decode-r1 { animation-delay: 0.45s; }
    .prefill-or-decode-r2 { animation-delay: 0.90s; }
    .prefill-or-decode-r3 { animation-delay: 1.35s; }
    .prefill-or-decode-r4 { animation-delay: 1.80s; }
    .prefill-or-decode-row { animation: prefill-or-decode-reveal 7.3s ease-in-out infinite; }
    @keyframes prefill-or-decode-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prefill-or-decode-bg" width="980" height="390"/>
  <text class="prefill-or-decode-h1"  x="30" y="40">Prefill and decode are different problems</text>
  <text class="prefill-or-decode-sub" x="30" y="64">One is parallel; one is not.</text>
  <rect class="prefill-or-decode-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prefill-or-decode-name" x="46" y="122">Prefill</text>
  <text class="prefill-or-decode-desc" x="46" y="142">Parallel, compute-bound.</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r0" x="46" y="182">The whole prompt in one forward pass</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r1" x="46" y="216">300-2,000 ms for a long context</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r2" x="46" y="250">Compute-bound</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r3" x="46" y="284">Attacked by prompt caching</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r4" x="46" y="318">Reusing a prefix skips it entirely</text>
  <rect class="prefill-or-decode-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prefill-or-decode-name" x="526" y="122">Decode</text>
  <text class="prefill-or-decode-desc" x="526" y="142">Sequential, memory-bound.</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r0" x="526" y="182">One forward pass per token</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r1" x="526" y="216">10-30 ms each, 200 tokens is seconds</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r2" x="526" y="250">Memory-bandwidth bound, not compute</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r3" x="526" y="284">Caching cannot help — it is new text</text>
  <text class="prefill-or-decode-desc prefill-or-decode-row prefill-or-decode-r4" x="526" y="318">Attacked by speculative decoding</text>
  <text class="prefill-or-decode-sub" x="30" y="372">Knowing which phase dominates a given workload decides which optimisation is worth building: a long-context assistant is prefill-heavy, and a long-answer one is decode-heavy.</text>
</svg>
