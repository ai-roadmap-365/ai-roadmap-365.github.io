<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The signal to move is reuse, not size.">
  <title>Notebook or module</title>
  <style>
    .notebook-or-module-bg   { fill: #f8fafc; }
    .notebook-or-module-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebook-or-module-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebook-or-module-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebook-or-module-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebook-or-module-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebook-or-module-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .notebook-or-module-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .notebook-or-module-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .notebook-or-module-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .notebook-or-module-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .notebook-or-module-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .notebook-or-module-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .notebook-or-module-row { opacity: 1; }
    .notebook-or-module-r0 { animation-delay: 0.00s; }
    .notebook-or-module-r1 { animation-delay: 0.45s; }
    .notebook-or-module-r2 { animation-delay: 0.90s; }
    .notebook-or-module-r3 { animation-delay: 1.35s; }
    .notebook-or-module-r4 { animation-delay: 1.80s; }
    .notebook-or-module-row { animation: notebook-or-module-reveal 7.3s ease-in-out infinite; }
    @keyframes notebook-or-module-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="notebook-or-module-bg" width="980" height="390"/>
  <text class="notebook-or-module-h1"  x="30" y="40">Notebook or module</text>
  <text class="notebook-or-module-sub" x="30" y="64">The signal to move is reuse, not size.</text>
  <rect class="notebook-or-module-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="notebook-or-module-name" x="46" y="122">A notebook</text>
  <text class="notebook-or-module-desc" x="46" y="142">For exploring.</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r0" x="46" y="182">Output beside the code, which is the point</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r1" x="46" y="216">Cells can run in any order</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r2" x="46" y="250">Hidden state: the file does not describe the run</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r3" x="46" y="284">Painful to diff and to test</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r4" x="46" y="318">Excellent for the first hour</text>
  <rect class="notebook-or-module-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="notebook-or-module-name" x="526" y="122">A module</text>
  <text class="notebook-or-module-desc" x="526" y="142">For anything reused.</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r0" x="526" y="182">Runs top to bottom, always</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r1" x="526" y="216">No state but what the code creates</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r2" x="526" y="250">The file IS what happened</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r3" x="526" y="284">Testable, diffable, importable</text>
  <text class="notebook-or-module-desc notebook-or-module-row notebook-or-module-r4" x="526" y="318">The notebook can import it</text>
  <text class="notebook-or-module-sub" x="30" y="372">The two are not rivals. The productive arrangement is a thin notebook that imports a module: exploration keeps its inline output, and the logic worth keeping lives somewhere it can be tested.</text>
</svg>
