<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four derivations, none written by hand.">
  <title>From a Python function to a tool</title>
  <style>
    .decorator-to-schema-bg   { fill: #f8fafc; }
    .decorator-to-schema-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decorator-to-schema-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decorator-to-schema-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decorator-to-schema-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decorator-to-schema-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decorator-to-schema-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decorator-to-schema-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .decorator-to-schema-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .decorator-to-schema-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .decorator-to-schema-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .decorator-to-schema-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .decorator-to-schema-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .decorator-to-schema-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .decorator-to-schema-stage { opacity: 1; }

    .decorator-to-schema-s0 { animation-delay: 0.00s; }
    .decorator-to-schema-e0 { animation-delay: 0.00s; }
    .decorator-to-schema-s1 { animation-delay: 1.28s; }
    .decorator-to-schema-e1 { animation-delay: 1.28s; }
    .decorator-to-schema-s2 { animation-delay: 2.56s; }
    .decorator-to-schema-e2 { animation-delay: 2.56s; }
    .decorator-to-schema-s3 { animation-delay: 3.84s; }
    .decorator-to-schema-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .decorator-to-schema-conn  { animation: decorator-to-schema-trace 6.4s ease-in-out infinite; }
      .decorator-to-schema-stage { animation: decorator-to-schema-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes decorator-to-schema-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes decorator-to-schema-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .decorator-to-schema-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .decorator-to-schema-stage { animation: decorator-to-schema-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes decorator-to-schema-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="decorator-to-schema-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="decorator-to-schema-bg" width="980" height="322"/>
  <text class="decorator-to-schema-h1"  x="30" y="40">From a Python function to a tool</text>
  <text class="decorator-to-schema-sub" x="30" y="64">Four derivations, none written by hand.</text>
  <g class="decorator-to-schema-stage decorator-to-schema-s0">
    <rect class="decorator-to-schema-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="decorator-to-schema-step" x="44" y="142">01</text>
    <text class="decorator-to-schema-name" x="70" y="142">Type hints become the schema</text>
    <text class="decorator-to-schema-desc" x="44" y="166">Parameter names, types and</text>
    <text class="decorator-to-schema-desc" x="44" y="182">requiredness, derived by</text>
    <text class="decorator-to-schema-desc" x="44" y="198">inspection.</text>
    <text class="decorator-to-schema-edge" x="44" y="242">no JSON by hand</text>
  </g>
  <line class="decorator-to-schema-line decorator-to-schema-conn decorator-to-schema-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#decorator-to-schema-tip)"/>
  <g class="decorator-to-schema-stage decorator-to-schema-s1">
    <rect class="decorator-to-schema-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="decorator-to-schema-step" x="280" y="142">02</text>
    <text class="decorator-to-schema-name" x="306" y="142">The docstring becomes the description</text>
    <text class="decorator-to-schema-desc" x="280" y="166">Which is what the model reads to</text>
    <text class="decorator-to-schema-desc" x="280" y="182">decide whether to call it.</text>
  </g>
  <line class="decorator-to-schema-line decorator-to-schema-conn decorator-to-schema-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#decorator-to-schema-tip)"/>
  <g class="decorator-to-schema-stage decorator-to-schema-s2">
    <rect class="decorator-to-schema-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="decorator-to-schema-step" x="516" y="142">03</text>
    <text class="decorator-to-schema-name" x="542" y="142">Arguments are coerced or rejected</text>
    <text class="decorator-to-schema-desc" x="516" y="166">"100" becomes 100, or a</text>
    <text class="decorator-to-schema-desc" x="516" y="182">structured schema error before</text>
    <text class="decorator-to-schema-desc" x="516" y="198">the handler runs.</text>
  </g>
  <line class="decorator-to-schema-line decorator-to-schema-conn decorator-to-schema-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#decorator-to-schema-tip)"/>
  <g class="decorator-to-schema-stage decorator-to-schema-s3">
    <rect class="decorator-to-schema-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="decorator-to-schema-step" x="752" y="142">04</text>
    <text class="decorator-to-schema-name" x="778" y="142">Exceptions become results</text>
    <text class="decorator-to-schema-desc" x="752" y="166">A traceback in a content block</text>
    <text class="decorator-to-schema-desc" x="752" y="182">with isError set, not a crashed</text>
    <text class="decorator-to-schema-desc" x="752" y="198">process.</text>
  </g>
  <text class="decorator-to-schema-sub" x="30" y="304">Deriving the schema from the same annotations the runtime enforces removes an entire class of drift: the description a model reads cannot disagree with the function it calls, because both come from one definition.</text>
</svg>
