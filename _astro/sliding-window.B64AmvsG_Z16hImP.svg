<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three regions, three treatments.">
  <title>Keeping the scratchpad bounded</title>
  <style>
    .sliding-window-bg   { fill: #f8fafc; }
    .sliding-window-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sliding-window-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sliding-window-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sliding-window-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sliding-window-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sliding-window-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sliding-window-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sliding-window-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sliding-window-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sliding-window-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sliding-window-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sliding-window-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sliding-window-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sliding-window-stage { opacity: 1; }

    .sliding-window-s0 { animation-delay: 0.00s; }
    .sliding-window-e0 { animation-delay: 0.00s; }
    .sliding-window-s1 { animation-delay: 1.50s; }
    .sliding-window-e1 { animation-delay: 1.50s; }
    .sliding-window-s2 { animation-delay: 3.00s; }
    .sliding-window-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .sliding-window-conn  { animation: sliding-window-trace 6s ease-in-out infinite; }
      .sliding-window-stage { animation: sliding-window-arrive 6s ease-in-out infinite; }
    }
    @keyframes sliding-window-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sliding-window-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sliding-window-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sliding-window-stage { animation: sliding-window-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sliding-window-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sliding-window-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sliding-window-bg" width="980" height="322"/>
  <text class="sliding-window-h1"  x="30" y="40">Keeping the scratchpad bounded</text>
  <text class="sliding-window-sub" x="30" y="64">Three regions, three treatments.</text>
  <g class="sliding-window-stage sliding-window-s0">
    <rect class="sliding-window-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="sliding-window-step" x="44" y="142">01</text>
    <text class="sliding-window-name" x="70" y="142">Preserve the head</text>
    <text class="sliding-window-desc" x="44" y="166">System prompt and goal, verbatim. Dropping</text>
    <text class="sliding-window-desc" x="44" y="182">these loses the objective.</text>
  </g>
  <line class="sliding-window-line sliding-window-conn sliding-window-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#sliding-window-tip)"/>
  <g class="sliding-window-stage sliding-window-s1">
    <rect class="sliding-window-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="sliding-window-step" x="359" y="142">02</text>
    <text class="sliding-window-name" x="385" y="142">Compact the middle</text>
    <text class="sliding-window-desc" x="359" y="166">Intermediate turns summarised into structured</text>
    <text class="sliding-window-desc" x="359" y="182">bullets, facts preserved.</text>
    <text class="sliding-window-edge" x="359" y="242">lossy</text>
  </g>
  <line class="sliding-window-line sliding-window-conn sliding-window-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#sliding-window-tip)"/>
  <g class="sliding-window-stage sliding-window-s2">
    <rect class="sliding-window-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="sliding-window-step" x="674" y="142">03</text>
    <text class="sliding-window-name" x="700" y="142">Keep the last K raw</text>
    <text class="sliding-window-desc" x="674" y="166">Recent turns in full, because the next step</text>
    <text class="sliding-window-desc" x="674" y="182">conditions on them.</text>
  </g>
  <text class="sliding-window-sub" x="30" y="304">The middle region is where judgement is needed: an observation's extracted fact must survive compaction while its surrounding narrative need not, and a naive truncation loses exactly the wrong half.</text>
</svg>
