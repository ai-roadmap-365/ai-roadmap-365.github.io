<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different activities.">
  <title>Fine-tuning against training from scratch</title>
  <style>
    .finetune-vs-scratch-bg   { fill: #f8fafc; }
    .finetune-vs-scratch-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-scratch-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-scratch-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-scratch-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-scratch-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-scratch-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-vs-scratch-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .finetune-vs-scratch-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .finetune-vs-scratch-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .finetune-vs-scratch-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .finetune-vs-scratch-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .finetune-vs-scratch-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-vs-scratch-row { opacity: 1; }
    .finetune-vs-scratch-r0 { animation-delay: 0.00s; }
    .finetune-vs-scratch-r1 { animation-delay: 0.45s; }
    .finetune-vs-scratch-r2 { animation-delay: 0.90s; }
    .finetune-vs-scratch-r3 { animation-delay: 1.35s; }
    .finetune-vs-scratch-r4 { animation-delay: 1.80s; }
    .finetune-vs-scratch-row { animation: finetune-vs-scratch-reveal 7.3s ease-in-out infinite; }
    @keyframes finetune-vs-scratch-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="finetune-vs-scratch-bg" width="980" height="390"/>
  <text class="finetune-vs-scratch-h1"  x="30" y="40">Fine-tuning against training from scratch</text>
  <text class="finetune-vs-scratch-sub" x="30" y="64">Two different activities.</text>
  <rect class="finetune-vs-scratch-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="finetune-vs-scratch-name" x="46" y="122">Fine-tuning</text>
  <text class="finetune-vs-scratch-desc" x="46" y="142">Adapting what exists.</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r0" x="46" y="182">Starts from learned representations</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r1" x="46" y="216">Hundreds to thousands of examples</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r2" x="46" y="250">Minutes to hours on one device</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r3" x="46" y="284">Very small learning rates</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r4" x="46" y="318">Two or three passes over the data</text>
  <rect class="finetune-vs-scratch-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="finetune-vs-scratch-name" x="526" y="122">From scratch</text>
  <text class="finetune-vs-scratch-desc" x="526" y="142">Building from nothing.</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r0" x="526" y="182">Starts from random weights</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r1" x="526" y="216">Millions to billions of examples</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r2" x="526" y="250">Days to months on a cluster</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r3" x="526" y="284">Ordinary learning rates</text>
  <text class="finetune-vs-scratch-desc finetune-vs-scratch-row finetune-vs-scratch-r4" x="526" y="318">Many passes, or one over vast data</text>
  <text class="finetune-vs-scratch-sub" x="30" y="372">The resource gap is roughly four orders of magnitude, which is why fine-tuning is what almost all applied work actually does.</text>
</svg>
