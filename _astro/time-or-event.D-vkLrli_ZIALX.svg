<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The difference between rungs three and four.">
  <title>Two kinds of trigger</title>
  <style>
    .time-or-event-bg   { fill: #f8fafc; }
    .time-or-event-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-or-event-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-or-event-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-or-event-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-or-event-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-or-event-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-or-event-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-or-event-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-or-event-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-or-event-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-or-event-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-or-event-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-or-event-row { opacity: 1; }
    .time-or-event-r0 { animation-delay: 0.00s; }
    .time-or-event-r1 { animation-delay: 0.45s; }
    .time-or-event-r2 { animation-delay: 0.90s; }
    .time-or-event-r3 { animation-delay: 1.35s; }
    .time-or-event-r4 { animation-delay: 1.80s; }
    .time-or-event-row { animation: time-or-event-reveal 7.3s ease-in-out infinite; }
    @keyframes time-or-event-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="time-or-event-bg" width="980" height="390"/>
  <text class="time-or-event-h1"  x="30" y="40">Two kinds of trigger</text>
  <text class="time-or-event-sub" x="30" y="64">The difference between rungs three and four.</text>
  <rect class="time-or-event-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="time-or-event-name" x="46" y="122">Triggered by time</text>
  <text class="time-or-event-desc" x="46" y="142">cron, timers.</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r0" x="46" y="182">Fires on a clock, regardless</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r1" x="46" y="216">Nightly backups, hourly pulls</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r2" x="46" y="250">A missed run is simply missed</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r3" x="46" y="284">Runs whether anything changed or not</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r4" x="46" y="318">Day 14's territory</text>
  <rect class="time-or-event-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="time-or-event-name" x="526" y="122">Triggered by an event</text>
  <text class="time-or-event-desc" x="526" y="142">Hooks, CI.</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r0" x="526" y="182">Fires when the relevant thing happens</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r1" x="526" y="216">A commit, a push, a merge</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r2" x="526" y="250">Cannot run early or late</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r3" x="526" y="284">Never runs when nothing changed</text>
  <text class="time-or-event-desc time-or-event-row time-or-event-r4" x="526" y="318">Exactly when the check is relevant</text>
  <text class="time-or-event-sub" x="30" y="372">Most automation people write as a schedule would be better as an event, and the tell is a job that starts by checking whether there is anything to do.</text>
</svg>
