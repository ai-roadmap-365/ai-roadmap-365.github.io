<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two questions about the same predictions.">
  <title>Top-1 and top-5</title>
  <style>
    .top1-top5-bg   { fill: #f8fafc; }
    .top1-top5-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .top1-top5-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .top1-top5-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .top1-top5-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .top1-top5-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .top1-top5-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .top1-top5-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .top1-top5-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .top1-top5-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .top1-top5-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .top1-top5-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .top1-top5-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .top1-top5-row { opacity: 1; }
    .top1-top5-r0 { animation-delay: 0.00s; }
    .top1-top5-r1 { animation-delay: 0.45s; }
    .top1-top5-r2 { animation-delay: 0.90s; }
    .top1-top5-r3 { animation-delay: 1.35s; }
    .top1-top5-r4 { animation-delay: 1.80s; }
    .top1-top5-row { animation: top1-top5-reveal 7.3s ease-in-out infinite; }
    @keyframes top1-top5-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="top1-top5-bg" width="980" height="390"/>
  <text class="top1-top5-h1"  x="30" y="40">Top-1 and top-5</text>
  <text class="top1-top5-sub" x="30" y="64">Two questions about the same predictions.</text>
  <rect class="top1-top5-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="top1-top5-name" x="46" y="122">Top-1</text>
  <text class="top1-top5-desc" x="46" y="142">Was the best guess right?</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r0" x="46" y="182">The single highest-scoring class</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r1" x="46" y="216">Strict, and what most products need</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r2" x="46" y="250">Penalises genuine ambiguity</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r3" x="46" y="284">The number usually quoted</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r4" x="46" y="318">Harsh on fine-grained classes</text>
  <rect class="top1-top5-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="top1-top5-name" x="526" y="122">Top-5</text>
  <text class="top1-top5-desc" x="526" y="142">Was it in the shortlist?</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r0" x="526" y="182">Correct if among the five highest</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r1" x="526" y="216">Forgives ambiguity between similar classes</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r2" x="526" y="250">Historically reported on large benchmarks</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r3" x="526" y="284">Reflects label noise as much as skill</text>
  <text class="top1-top5-desc top1-top5-row top1-top5-r4" x="526" y="318">Useful when a human picks from a shortlist</text>
  <text class="top1-top5-sub" x="30" y="372">Top-5 makes sense when a person or a downstream stage will choose among candidates, and it overstates capability when the system must commit to one answer.</text>
</svg>
