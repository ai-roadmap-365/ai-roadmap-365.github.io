<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Speed without instability.">
  <title>Mixed precision, in four steps</title>
  <style>
    .precision-idea-bg   { fill: #f8fafc; }
    .precision-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .precision-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .precision-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .precision-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .precision-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .precision-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .precision-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .precision-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .precision-idea-stage { opacity: 1; }

    .precision-idea-s0 { animation-delay: 0.00s; }
    .precision-idea-e0 { animation-delay: 0.00s; }
    .precision-idea-s1 { animation-delay: 1.28s; }
    .precision-idea-e1 { animation-delay: 1.28s; }
    .precision-idea-s2 { animation-delay: 2.56s; }
    .precision-idea-e2 { animation-delay: 2.56s; }
    .precision-idea-s3 { animation-delay: 3.84s; }
    .precision-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .precision-idea-conn  { animation: precision-idea-trace 6.4s ease-in-out infinite; }
      .precision-idea-stage { animation: precision-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes precision-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes precision-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .precision-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .precision-idea-stage { animation: precision-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes precision-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="precision-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="precision-idea-bg" width="980" height="322"/>
  <text class="precision-idea-h1"  x="30" y="40">Mixed precision, in four steps</text>
  <text class="precision-idea-sub" x="30" y="64">Speed without instability.</text>
  <g class="precision-idea-stage precision-idea-s0">
    <rect class="precision-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="precision-idea-step" x="44" y="142">01</text>
    <text class="precision-idea-name" x="70" y="142">Matrix operations in sixteen bits</text>
    <text class="precision-idea-desc" x="44" y="166">Where the compute is, and where</text>
    <text class="precision-idea-desc" x="44" y="182">precision matters least.</text>
  </g>
  <line class="precision-idea-line precision-idea-conn precision-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#precision-idea-tip)"/>
  <g class="precision-idea-stage precision-idea-s1">
    <rect class="precision-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="precision-idea-step" x="280" y="142">02</text>
    <text class="precision-idea-name" x="306" y="142">Reductions and losses in thirty-two</text>
    <text class="precision-idea-desc" x="280" y="166">Where small differences</text>
    <text class="precision-idea-desc" x="280" y="182">accumulate and matter.</text>
  </g>
  <line class="precision-idea-line precision-idea-conn precision-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#precision-idea-tip)"/>
  <g class="precision-idea-stage precision-idea-s2">
    <rect class="precision-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="precision-idea-step" x="516" y="142">03</text>
    <text class="precision-idea-name" x="542" y="142">Keep a full-precision copy of the weights</text>
    <text class="precision-idea-desc" x="516" y="166">So tiny updates are not rounded</text>
    <text class="precision-idea-desc" x="516" y="182">away to nothing.</text>
  </g>
  <line class="precision-idea-line precision-idea-conn precision-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#precision-idea-tip)"/>
  <g class="precision-idea-stage precision-idea-s3">
    <rect class="precision-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="precision-idea-step" x="752" y="142">04</text>
    <text class="precision-idea-name" x="778" y="142">Roughly twice the throughput, half the memory</text>
    <text class="precision-idea-desc" x="752" y="166">For an unchanged model and</text>
    <text class="precision-idea-desc" x="752" y="182">unchanged results.</text>
    <text class="precision-idea-edge" x="752" y="242">2x</text>
  </g>
  <text class="precision-idea-sub" x="30" y="304">The master-weight copy is what makes this safe rather than merely fast: without it, an update smaller than the low-precision resolution simply disappears and training stalls.</text>
</svg>
