<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From Fortran to accelerators.">
  <title>Four steps in array computing</title>
  <style>
    .array-history-bg   { fill: #f8fafc; }
    .array-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .array-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .array-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .array-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .array-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .array-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .array-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .array-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .array-history-stage { opacity: 1; }

    .array-history-s0 { animation-delay: 0.00s; }
    .array-history-e0 { animation-delay: 0.00s; }
    .array-history-s1 { animation-delay: 1.28s; }
    .array-history-e1 { animation-delay: 1.28s; }
    .array-history-s2 { animation-delay: 2.56s; }
    .array-history-e2 { animation-delay: 2.56s; }
    .array-history-s3 { animation-delay: 3.84s; }
    .array-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .array-history-conn  { animation: array-history-trace 6.4s ease-in-out infinite; }
      .array-history-stage { animation: array-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes array-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes array-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .array-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .array-history-stage { animation: array-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes array-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="array-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="array-history-bg" width="980" height="322"/>
  <text class="array-history-h1"  x="30" y="40">Four steps in array computing</text>
  <text class="array-history-sub" x="30" y="64">From Fortran to accelerators.</text>
  <g class="array-history-stage array-history-s0">
    <rect class="array-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="array-history-step" x="44" y="142">01</text>
    <text class="array-history-name" x="70" y="142">Scientific computing in compiled languages</text>
    <text class="array-history-desc" x="44" y="166">Fast, and painful to write.</text>
  </g>
  <line class="array-history-line array-history-conn array-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#array-history-tip)"/>
  <g class="array-history-stage array-history-s1">
    <rect class="array-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="array-history-step" x="280" y="142">02</text>
    <text class="array-history-name" x="306" y="142">Array-oriented languages made the notation concise</text>
    <text class="array-history-desc" x="280" y="166">Operations on whole collections.</text>
  </g>
  <line class="array-history-line array-history-conn array-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#array-history-tip)"/>
  <g class="array-history-stage array-history-s2">
    <rect class="array-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="array-history-step" x="516" y="142">03</text>
    <text class="array-history-name" x="542" y="142">Then a Python array library with compiled internals</text>
    <text class="array-history-desc" x="516" y="166">Which gave both notation and</text>
    <text class="array-history-desc" x="516" y="182">speed.</text>
  </g>
  <line class="array-history-line array-history-conn array-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#array-history-tip)"/>
  <g class="array-history-stage array-history-s3">
    <rect class="array-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="array-history-step" x="752" y="142">04</text>
    <text class="array-history-name" x="778" y="142">And tensor libraries added gradients and accelerators</text>
    <text class="array-history-desc" x="752" y="166">Which is the same model,</text>
    <text class="array-history-desc" x="752" y="182">extended.</text>
  </g>
  <text class="array-history-sub" x="30" y="304">Tensor libraries deliberately mirror the array interface, which is why fluency here transfers almost unchanged to model code.</text>
</svg>
