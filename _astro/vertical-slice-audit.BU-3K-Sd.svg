<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One real request, measured at every stage.">
  <title>Audit the slice end to end</title>
  <style>
    .vertical-slice-audit-bg   { fill: #f8fafc; }
    .vertical-slice-audit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vertical-slice-audit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vertical-slice-audit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vertical-slice-audit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vertical-slice-audit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vertical-slice-audit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vertical-slice-audit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vertical-slice-audit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vertical-slice-audit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vertical-slice-audit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vertical-slice-audit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vertical-slice-audit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vertical-slice-audit-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vertical-slice-audit-stage { opacity: 1; }

    .vertical-slice-audit-s0 { animation-delay: 0.00s; }
    .vertical-slice-audit-e0 { animation-delay: 0.00s; }
    .vertical-slice-audit-s1 { animation-delay: 1.33s; }
    .vertical-slice-audit-e1 { animation-delay: 1.33s; }
    .vertical-slice-audit-s2 { animation-delay: 2.67s; }
    .vertical-slice-audit-e2 { animation-delay: 2.67s; }
    .vertical-slice-audit-s3 { animation-delay: 4.00s; }
    .vertical-slice-audit-e3 { animation-delay: 4.00s; }
    .vertical-slice-audit-s4 { animation-delay: 5.33s; }
    .vertical-slice-audit-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .vertical-slice-audit-conn  { animation: vertical-slice-audit-trace 8s ease-in-out infinite; }
      .vertical-slice-audit-stage { animation: vertical-slice-audit-arrive 8s ease-in-out infinite; }
    }
    @keyframes vertical-slice-audit-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vertical-slice-audit-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vertical-slice-audit-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vertical-slice-audit-stage { animation: vertical-slice-audit-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vertical-slice-audit-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vertical-slice-audit-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vertical-slice-audit-bg" width="980" height="322"/>
  <text class="vertical-slice-audit-h1"  x="30" y="40">Audit the slice end to end</text>
  <text class="vertical-slice-audit-sub" x="30" y="64">One real request, measured at every stage.</text>
  <g class="vertical-slice-audit-stage vertical-slice-audit-s0">
    <rect class="vertical-slice-audit-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="vertical-slice-audit-step" x="44" y="142">01</text>
    <text class="vertical-slice-audit-name" x="70" y="142">Send one real request</text>
    <text class="vertical-slice-audit-desc" x="44" y="166">Not a synthetic one. A</text>
    <text class="vertical-slice-audit-desc" x="44" y="182">query a user would</text>
    <text class="vertical-slice-audit-desc" x="44" y="198">actually type.</text>
  </g>
  <line class="vertical-slice-audit-line vertical-slice-audit-conn vertical-slice-audit-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#vertical-slice-audit-tip)"/>
  <g class="vertical-slice-audit-stage vertical-slice-audit-s1">
    <rect class="vertical-slice-audit-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="vertical-slice-audit-step" x="233" y="142">02</text>
    <text class="vertical-slice-audit-name" x="259" y="142">Measure each stage</text>
    <text class="vertical-slice-audit-desc" x="233" y="166">A trace, per Day 40.</text>
    <text class="vertical-slice-audit-desc" x="233" y="182">Where did the time</text>
    <text class="vertical-slice-audit-desc" x="233" y="198">actually go?</text>
    <text class="vertical-slice-audit-edge" x="233" y="242">trace</text>
  </g>
  <line class="vertical-slice-audit-line vertical-slice-audit-conn vertical-slice-audit-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#vertical-slice-audit-tip)"/>
  <g class="vertical-slice-audit-stage vertical-slice-audit-s2">
    <rect class="vertical-slice-audit-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="vertical-slice-audit-step" x="422" y="142">03</text>
    <text class="vertical-slice-audit-name" x="448" y="142">Compare against the budget</text>
    <text class="vertical-slice-audit-desc" x="422" y="166">The allocation from Day</text>
    <text class="vertical-slice-audit-desc" x="422" y="182">352. Which stage broke</text>
    <text class="vertical-slice-audit-desc" x="422" y="198">its share?</text>
    <text class="vertical-slice-audit-edge" x="422" y="242">budget</text>
  </g>
  <line class="vertical-slice-audit-line vertical-slice-audit-conn vertical-slice-audit-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#vertical-slice-audit-tip)"/>
  <g class="vertical-slice-audit-stage vertical-slice-audit-s3">
    <rect class="vertical-slice-audit-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="vertical-slice-audit-step" x="611" y="142">04</text>
    <text class="vertical-slice-audit-name" x="637" y="142">Check the failure paths</text>
    <text class="vertical-slice-audit-desc" x="611" y="166">Kill the retrieval store</text>
    <text class="vertical-slice-audit-desc" x="611" y="182">and confirm the fallback</text>
    <text class="vertical-slice-audit-desc" x="611" y="198">behaves as designed.</text>
  </g>
  <line class="vertical-slice-audit-line vertical-slice-audit-conn vertical-slice-audit-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#vertical-slice-audit-tip)"/>
  <g class="vertical-slice-audit-stage vertical-slice-audit-s4">
    <rect class="vertical-slice-audit-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="vertical-slice-audit-step" x="800" y="142">05</text>
    <text class="vertical-slice-audit-name" x="826" y="142">Record the numbers</text>
    <text class="vertical-slice-audit-desc" x="800" y="166">They are the baseline</text>
    <text class="vertical-slice-audit-desc" x="800" y="182">every later change is</text>
    <text class="vertical-slice-audit-desc" x="800" y="198">judged against.</text>
    <text class="vertical-slice-audit-edge" x="800" y="242">baseline</text>
  </g>
  <text class="vertical-slice-audit-sub" x="30" y="304">The fourth step is the one people skip because everything is working. It is also the only opportunity to discover that the fallback was never wired up, while there is still time to wire it.</text>
</svg>
