<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every OS job exists because early computing suffered without it.">
  <title>The five jobs, and the failure each one prevents</title>
  <style>
    .os-five-jobs-bg   { fill: #f8fafc; }
    .os-five-jobs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-five-jobs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-five-jobs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-five-jobs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-five-jobs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-five-jobs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .os-five-jobs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .os-five-jobs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .os-five-jobs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .os-five-jobs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .os-five-jobs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .os-five-jobs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .os-five-jobs-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .os-five-jobs-stage { opacity: 1; }

    .os-five-jobs-s0 { animation-delay: 0.00s; }
    .os-five-jobs-e0 { animation-delay: 0.00s; }
    .os-five-jobs-s1 { animation-delay: 1.33s; }
    .os-five-jobs-e1 { animation-delay: 1.33s; }
    .os-five-jobs-s2 { animation-delay: 2.67s; }
    .os-five-jobs-e2 { animation-delay: 2.67s; }
    .os-five-jobs-s3 { animation-delay: 4.00s; }
    .os-five-jobs-e3 { animation-delay: 4.00s; }
    .os-five-jobs-s4 { animation-delay: 5.33s; }
    .os-five-jobs-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .os-five-jobs-conn  { animation: os-five-jobs-trace 8s ease-in-out infinite; }
      .os-five-jobs-stage { animation: os-five-jobs-arrive 8s ease-in-out infinite; }
    }
    @keyframes os-five-jobs-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes os-five-jobs-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .os-five-jobs-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .os-five-jobs-stage { animation: os-five-jobs-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes os-five-jobs-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="os-five-jobs-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="os-five-jobs-bg" width="980" height="322"/>
  <text class="os-five-jobs-h1"  x="30" y="40">The five jobs, and the failure each one prevents</text>
  <text class="os-five-jobs-sub" x="30" y="64">Every OS job exists because early computing suffered without it.</text>
  <g class="os-five-jobs-stage os-five-jobs-s0">
    <rect class="os-five-jobs-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="os-five-jobs-step" x="44" y="142">01</text>
    <text class="os-five-jobs-name" x="70" y="142">Process management</text>
    <text class="os-five-jobs-desc" x="44" y="166">One CPU, many programs</text>
    <text class="os-five-jobs-desc" x="44" y="182">wanting it.</text>
    <text class="os-five-jobs-edge" x="44" y="242">ps, kill</text>
  </g>
  <line class="os-five-jobs-line os-five-jobs-conn os-five-jobs-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#os-five-jobs-tip)"/>
  <g class="os-five-jobs-stage os-five-jobs-s1">
    <rect class="os-five-jobs-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="os-five-jobs-step" x="233" y="142">02</text>
    <text class="os-five-jobs-name" x="259" y="142">Virtual memory</text>
    <text class="os-five-jobs-desc" x="233" y="166">Programs colliding in</text>
    <text class="os-five-jobs-desc" x="233" y="182">RAM; RAM running out.</text>
    <text class="os-five-jobs-edge" x="233" y="242">OOM killer</text>
  </g>
  <line class="os-five-jobs-line os-five-jobs-conn os-five-jobs-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#os-five-jobs-tip)"/>
  <g class="os-five-jobs-stage os-five-jobs-s2">
    <rect class="os-five-jobs-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="os-five-jobs-step" x="422" y="142">03</text>
    <text class="os-five-jobs-name" x="448" y="142">Filesystems</text>
    <text class="os-five-jobs-desc" x="422" y="166">Raw disk blocks are</text>
    <text class="os-five-jobs-desc" x="422" y="182">unusable by humans.</text>
    <text class="os-five-jobs-edge" x="422" y="242">df -h</text>
  </g>
  <line class="os-five-jobs-line os-five-jobs-conn os-five-jobs-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#os-five-jobs-tip)"/>
  <g class="os-five-jobs-stage os-five-jobs-s3">
    <rect class="os-five-jobs-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="os-five-jobs-step" x="611" y="142">04</text>
    <text class="os-five-jobs-name" x="637" y="142">Device drivers</text>
    <text class="os-five-jobs-desc" x="611" y="166">Every device speaks a</text>
    <text class="os-five-jobs-desc" x="611" y="182">different dialect.</text>
    <text class="os-five-jobs-edge" x="611" y="242">nvidia-smi</text>
  </g>
  <line class="os-five-jobs-line os-five-jobs-conn os-five-jobs-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#os-five-jobs-tip)"/>
  <g class="os-five-jobs-stage os-five-jobs-s4">
    <rect class="os-five-jobs-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="os-five-jobs-step" x="800" y="142">05</text>
    <text class="os-five-jobs-name" x="826" y="142">Permissions</text>
    <text class="os-five-jobs-desc" x="800" y="166">Users and programs must</text>
    <text class="os-five-jobs-desc" x="800" y="182">not trample each other.</text>
    <text class="os-five-jobs-edge" x="800" y="242">sudo</text>
  </g>
  <text class="os-five-jobs-sub" x="30" y="304">Every mysterious behaviour later in the course traces back to one of these five.</text>
</svg>
