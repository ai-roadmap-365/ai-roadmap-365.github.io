<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="img" aria-labelledby="arch-title arch-desc" width="1080" height="720">
  <title id="arch-title">One installed package: a pure core, adapters at the edges, configuration in, logs and state out</title>
  <desc id="arch-desc">An architecture diagram of an automation toolkit. Configuration enters on the left through four precedence layers and the secret arrives from the environment. Two console entry points and one scheduled invocation call into the package. Inside, a pure core is ringed by adapters for HTTP, the filesystem and the clock. Structured logs, the state file and a run summary leave on the right.</desc>

  <rect x="0" y="0" width="1080" height="720" fill="#f8fafc"/>

  <style>
    .h  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #1a202c; }
    .t  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #1a202c; }
    .s  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #475569; }
    .b  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .a  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1d4ed8; }
    .box   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .bluebox { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
    .corebox { fill: #ffffff; stroke: #1d4ed8; stroke-width: 3; }
    .warnbox { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
    .arrow { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#head); }
    .dash  { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>

  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <text x="30" y="42" class="h">Shipping an automation toolkit: what is installed, and where the edges are</text>

  <!-- Configuration column -->
  <text x="30" y="88" class="b">Configuration in, weakest first</text>
  <rect x="30" y="100" width="220" height="46" rx="6" class="box"/>
  <text x="44" y="121" class="t">1. defaults in the code</text>
  <text x="44" y="139" class="s">the tool runs with no setup</text>

  <rect x="30" y="156" width="220" height="46" rx="6" class="box"/>
  <text x="44" y="177" class="t">2. configuration file</text>
  <text x="44" y="195" class="s">this machine's preferences</text>

  <rect x="30" y="212" width="220" height="46" rx="6" class="box"/>
  <text x="44" y="233" class="t">3. environment</text>
  <text x="44" y="251" class="s">deployment facts</text>

  <rect x="30" y="268" width="220" height="46" rx="6" class="bluebox"/>
  <text x="44" y="289" class="t">4. command-line flags</text>
  <text x="44" y="307" class="s">this run, right now — strongest</text>

  <rect x="30" y="336" width="220" height="66" rx="6" class="warnbox"/>
  <text x="44" y="358" class="b">SECRET</text>
  <text x="44" y="378" class="s">from the environment only —</text>
  <text x="44" y="395" class="s">never from a file or a flag</text>

  <path d="M254 200 L 330 250" class="arrow"/>
  <path d="M254 366 L 330 320" class="arrow"/>

  <!-- Callers -->
  <text x="30" y="452" class="b">Who invokes it</text>
  <rect x="30" y="464" width="220" height="52" rx="6" class="box"/>
  <text x="44" y="486" class="t">a person at a terminal</text>
  <text x="44" y="505" class="s">feedkit fetch / report / status</text>

  <rect x="30" y="526" width="220" height="66" rx="6" class="box"/>
  <text x="44" y="548" class="t">a scheduler</text>
  <text x="44" y="567" class="s">cron, launchd, systemd timer</text>
  <text x="44" y="584" class="s">runs feedkit-scheduled</text>

  <path d="M254 490 L 330 470" class="arrow"/>
  <path d="M254 556 L 330 500" class="arrow"/>

  <!-- The installed package -->
  <rect x="330" y="88" width="420" height="520" rx="10" fill="#ffffff" stroke="#1a202c" stroke-width="2"/>
  <text x="350" y="118" class="b">the installed package</text>
  <text x="350" y="139" class="s">pip install -e .  gives two console scripts</text>

  <rect x="352" y="156" width="376" height="52" rx="6" class="bluebox"/>
  <text x="366" y="178" class="a">entry points</text>
  <text x="366" y="197" class="s">feedkit  ·  feedkit-scheduled  ·  argparse subcommands</text>

  <!-- adapters ring -->
  <rect x="352" y="224" width="376" height="300" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="366" y="248" class="b">adapters — the only impure code</text>

  <rect x="366" y="262" width="112" height="62" rx="6" class="box"/>
  <text x="378" y="284" class="t">HTTP</text>
  <text x="378" y="302" class="s">timeout,</text>
  <text x="378" y="318" class="s">retry, backoff</text>

  <rect x="488" y="262" width="104" height="62" rx="6" class="box"/>
  <text x="500" y="284" class="t">filesystem</text>
  <text x="500" y="302" class="s">atomic write,</text>
  <text x="500" y="318" class="s">the run lock</text>

  <rect x="602" y="262" width="112" height="62" rx="6" class="box"/>
  <text x="614" y="284" class="t">clock</text>
  <text x="614" y="302" class="s">now, and</text>
  <text x="614" y="318" class="s">sleeping</text>

  <!-- pure core -->
  <rect x="392" y="344" width="296" height="160" rx="8" class="corebox"/>
  <text x="410" y="372" class="a">the pure core</text>
  <text x="410" y="396" class="t">select what is new</text>
  <text x="410" y="418" class="t">validate the payload</text>
  <text x="410" y="440" class="t">merge the state</text>
  <text x="410" y="462" class="t">summarise the run</text>
  <text x="410" y="484" class="t">decide the exit code</text>

  <text x="352" y="552" class="s">No network, no clock, no disk in the core. Every boundary arrives as an</text>
  <text x="352" y="572" class="s">argument, so the interesting decisions are testable with plain data.</text>
  <text x="352" y="596" class="s">That is Day 74's rule, applied to a whole program.</text>

  <path d="M478 300 L 520 344" class="dash"/>
  <path d="M540 324 L 540 344" class="dash"/>
  <path d="M614 300 L 570 344" class="dash"/>

  <!-- Outputs -->
  <text x="790" y="88" class="b">What comes out</text>

  <rect x="790" y="100" width="260" height="96" rx="6" class="bluebox"/>
  <text x="804" y="124" class="a">structured logs, on stdout</text>
  <text x="804" y="146" class="s">one JSON object per line</text>
  <text x="804" y="164" class="s">run id + which item + level</text>
  <text x="804" y="182" class="s">secrets redacted on the way out</text>

  <rect x="790" y="212" width="260" height="96" rx="6" class="box"/>
  <text x="804" y="236" class="a">the state file</text>
  <text x="804" y="258" class="s">what has already been done</text>
  <text x="804" y="276" class="s">written whole or not at all</text>
  <text x="804" y="294" class="s">this is what makes a rerun safe</text>

  <rect x="790" y="324" width="260" height="96" rx="6" class="box"/>
  <text x="804" y="348" class="a">the run summary</text>
  <text x="804" y="370" class="s">ok / failed counts, new items</text>
  <text x="804" y="388" class="s">every failure named</text>
  <text x="804" y="406" class="s">last-success timestamp</text>

  <rect x="790" y="436" width="260" height="120" rx="6" class="bluebox"/>
  <text x="804" y="460" class="a">the exit code</text>
  <text x="804" y="482" class="s">0  everything worked</text>
  <text x="804" y="500" class="s">2  partial success</text>
  <text x="804" y="518" class="s">1  nothing worked</text>
  <text x="804" y="536" class="s">3  a run was already going</text>

  <path d="M752 180 L 786 148" class="arrow"/>
  <path d="M752 300 L 786 260" class="arrow"/>
  <path d="M752 400 L 786 372" class="arrow"/>
  <path d="M752 470 L 786 490" class="arrow"/>

  <text x="30" y="644" class="s">The supervisor captures stdout and reads the exit code. The program never opens a log file, never rotates one,</text>
  <text x="30" y="666" class="s">and never decides where logs belong — fewer decisions inside the program is the whole argument for stdout.</text>
  <text x="30" y="694" class="s">A separate, much simpler watchdog reads the last-success timestamp, because the failure a supervisor cannot see is the run that never happened.</text>
</svg>
