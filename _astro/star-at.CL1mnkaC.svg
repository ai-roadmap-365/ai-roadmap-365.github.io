<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different operations.">
  <title>Elementwise against matrix product</title>
  <style>
    .star-at-bg   { fill: #f8fafc; }
    .star-at-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .star-at-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .star-at-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .star-at-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .star-at-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .star-at-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .star-at-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .star-at-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .star-at-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .star-at-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .star-at-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .star-at-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .star-at-row { opacity: 1; }
    .star-at-r0 { animation-delay: 0.00s; }
    .star-at-r1 { animation-delay: 0.45s; }
    .star-at-r2 { animation-delay: 0.90s; }
    .star-at-r3 { animation-delay: 1.35s; }
    .star-at-r4 { animation-delay: 1.80s; }
    .star-at-row { animation: star-at-reveal 7.3s ease-in-out infinite; }
    @keyframes star-at-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="star-at-bg" width="980" height="390"/>
  <text class="star-at-h1"  x="30" y="40">Elementwise against matrix product</text>
  <text class="star-at-sub" x="30" y="64">Two different operations.</text>
  <rect class="star-at-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="star-at-name" x="46" y="122">Elementwise</text>
  <text class="star-at-desc" x="46" y="142">Position by position.</text>
  <text class="star-at-desc star-at-row star-at-r0" x="46" y="182">Multiplies corresponding entries</text>
  <text class="star-at-desc star-at-row star-at-r1" x="46" y="216">Shapes must match, or broadcast</text>
  <text class="star-at-desc star-at-row star-at-r2" x="46" y="250">Result has the same shape</text>
  <text class="star-at-desc star-at-row star-at-r3" x="46" y="284">No summation anywhere</text>
  <text class="star-at-desc star-at-row star-at-r4" x="46" y="318">Used for masks and gates</text>
  <rect class="star-at-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="star-at-name" x="526" y="122">Matrix product</text>
  <text class="star-at-desc" x="526" y="142">Rows against columns.</text>
  <text class="star-at-desc star-at-row star-at-r0" x="526" y="182">Dot products of rows and columns</text>
  <text class="star-at-desc star-at-row star-at-r1" x="526" y="216">Inner dimensions must match</text>
  <text class="star-at-desc star-at-row star-at-r2" x="526" y="250">Result has the outer shape</text>
  <text class="star-at-desc star-at-row star-at-r3" x="526" y="284">Summation is the point</text>
  <text class="star-at-desc star-at-row star-at-r4" x="526" y="318">Used for layers and transformations</text>
  <text class="star-at-sub" x="30" y="372">Using the wrong one is a common and quiet bug: with square matrices both are defined, both produce a square result, and only the numbers are wrong.</text>
</svg>
