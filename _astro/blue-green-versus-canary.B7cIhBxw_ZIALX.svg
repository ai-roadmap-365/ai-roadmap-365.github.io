<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to make a release reversible.">
  <title>Blue-green or canary</title>
  <style>
    .blue-green-versus-canary-bg   { fill: #f8fafc; }
    .blue-green-versus-canary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-versus-canary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-versus-canary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-versus-canary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-versus-canary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-versus-canary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blue-green-versus-canary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .blue-green-versus-canary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .blue-green-versus-canary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .blue-green-versus-canary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .blue-green-versus-canary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .blue-green-versus-canary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blue-green-versus-canary-row { opacity: 1; }
    .blue-green-versus-canary-r0 { animation-delay: 0.00s; }
    .blue-green-versus-canary-r1 { animation-delay: 0.45s; }
    .blue-green-versus-canary-r2 { animation-delay: 0.90s; }
    .blue-green-versus-canary-r3 { animation-delay: 1.35s; }
    .blue-green-versus-canary-r4 { animation-delay: 1.80s; }
    .blue-green-versus-canary-row { animation: blue-green-versus-canary-reveal 7.3s ease-in-out infinite; }
    @keyframes blue-green-versus-canary-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="blue-green-versus-canary-bg" width="980" height="390"/>
  <text class="blue-green-versus-canary-h1"  x="30" y="40">Blue-green or canary</text>
  <text class="blue-green-versus-canary-sub" x="30" y="64">Two ways to make a release reversible.</text>
  <rect class="blue-green-versus-canary-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="blue-green-versus-canary-name" x="46" y="122">Blue-green</text>
  <text class="blue-green-versus-canary-desc" x="46" y="142">All traffic, at once.</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r0" x="46" y="182">Two complete environments, one live</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r1" x="46" y="216">Switch to release, switch back to undo</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r2" x="46" y="250">No partial exposure to reason about</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r3" x="46" y="284">Simple, and easy to get right</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r4" x="46" y="318">Every user sees the problem, briefly</text>
  <rect class="blue-green-versus-canary-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="blue-green-versus-canary-name" x="526" y="122">Canary</text>
  <text class="blue-green-versus-canary-desc" x="526" y="142">A fraction first.</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r0" x="526" y="182">A small percentage of real traffic</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r1" x="526" y="216">Promote or roll back on evidence</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r2" x="526" y="250">Smaller blast radius</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r3" x="526" y="284">Two versions running concurrently</text>
  <text class="blue-green-versus-canary-desc blue-green-versus-canary-row blue-green-versus-canary-r4" x="526" y="318">Needs enough traffic to measure</text>
  <text class="blue-green-versus-canary-sub" x="30" y="372">Neither is strictly better. Blue-green is the right default below the traffic level at which a canary's error rate means anything, and both beat replacing everything with no way back.</text>
</svg>
