<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not a feature of the tool — a change in what you dare to try.">
  <title>Why branching changes how you work</title>
  <style>
    .branch-and-merge-bg   { fill: #f8fafc; }
    .branch-and-merge-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-and-merge-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-and-merge-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-and-merge-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-and-merge-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-and-merge-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .branch-and-merge-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .branch-and-merge-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .branch-and-merge-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .branch-and-merge-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .branch-and-merge-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .branch-and-merge-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .branch-and-merge-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .branch-and-merge-stage { opacity: 1; }

    .branch-and-merge-s0 { animation-delay: 0.00s; }
    .branch-and-merge-e0 { animation-delay: 0.00s; }
    .branch-and-merge-s1 { animation-delay: 1.28s; }
    .branch-and-merge-e1 { animation-delay: 1.28s; }
    .branch-and-merge-s2 { animation-delay: 2.56s; }
    .branch-and-merge-e2 { animation-delay: 2.56s; }
    .branch-and-merge-s3 { animation-delay: 3.84s; }
    .branch-and-merge-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .branch-and-merge-conn  { animation: branch-and-merge-trace 6.4s ease-in-out infinite; }
      .branch-and-merge-stage { animation: branch-and-merge-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes branch-and-merge-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes branch-and-merge-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .branch-and-merge-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .branch-and-merge-stage { animation: branch-and-merge-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes branch-and-merge-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="branch-and-merge-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="branch-and-merge-bg" width="980" height="322"/>
  <text class="branch-and-merge-h1"  x="30" y="40">Why branching changes how you work</text>
  <text class="branch-and-merge-sub" x="30" y="64">Not a feature of the tool — a change in what you dare to try.</text>
  <g class="branch-and-merge-stage branch-and-merge-s0">
    <rect class="branch-and-merge-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="branch-and-merge-step" x="44" y="142">01</text>
    <text class="branch-and-merge-name" x="70" y="142">Split off</text>
    <text class="branch-and-merge-desc" x="44" y="166">A second line of development,</text>
    <text class="branch-and-merge-desc" x="44" y="182">starting from a known-good</text>
    <text class="branch-and-merge-desc" x="44" y="198">commit.</text>
  </g>
  <line class="branch-and-merge-line branch-and-merge-conn branch-and-merge-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#branch-and-merge-tip)"/>
  <g class="branch-and-merge-stage branch-and-merge-s1">
    <rect class="branch-and-merge-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="branch-and-merge-step" x="280" y="142">02</text>
    <text class="branch-and-merge-name" x="306" y="142">Work independently</text>
    <text class="branch-and-merge-desc" x="280" y="166">Commit freely. Main keeps</text>
    <text class="branch-and-merge-desc" x="280" y="182">receiving other work,</text>
    <text class="branch-and-merge-desc" x="280" y="198">undisturbed.</text>
    <text class="branch-and-merge-edge" x="280" y="242">isolated</text>
  </g>
  <line class="branch-and-merge-line branch-and-merge-conn branch-and-merge-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#branch-and-merge-tip)"/>
  <g class="branch-and-merge-stage branch-and-merge-s2">
    <rect class="branch-and-merge-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="branch-and-merge-step" x="516" y="142">03</text>
    <text class="branch-and-merge-name" x="542" y="142">Merge back</text>
    <text class="branch-and-merge-desc" x="516" y="166">A commit with two parents,</text>
    <text class="branch-and-merge-desc" x="516" y="182">combining both sets of changes.</text>
    <text class="branch-and-merge-edge" x="516" y="242">joined</text>
  </g>
  <line class="branch-and-merge-line branch-and-merge-conn branch-and-merge-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#branch-and-merge-tip)"/>
  <g class="branch-and-merge-stage branch-and-merge-s3">
    <rect class="branch-and-merge-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="branch-and-merge-step" x="752" y="142">04</text>
    <text class="branch-and-merge-name" x="778" y="142">Or throw it away</text>
    <text class="branch-and-merge-desc" x="752" y="166">An abandoned experiment costs</text>
    <text class="branch-and-merge-desc" x="752" y="182">nothing and leaves main</text>
    <text class="branch-and-merge-desc" x="752" y="198">untouched.</text>
    <text class="branch-and-merge-edge" x="752" y="242">free</text>
  </g>
  <text class="branch-and-merge-sub" x="30" y="304">That last option is the underrated one. When abandoning an experiment is free, you try more of them — which is the real reason cheap branching changed how software gets written.</text>
</svg>
