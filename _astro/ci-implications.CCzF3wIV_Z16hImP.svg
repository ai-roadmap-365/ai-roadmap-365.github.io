<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are supply chain.">
  <title>Five consequences of a privileged runner</title>
  <style>
    .ci-implications-bg   { fill: #f8fafc; }
    .ci-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ci-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ci-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ci-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ci-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ci-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ci-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ci-implications-stage { opacity: 1; }

    .ci-implications-s0 { animation-delay: 0.00s; }
    .ci-implications-e0 { animation-delay: 0.00s; }
    .ci-implications-s1 { animation-delay: 1.33s; }
    .ci-implications-e1 { animation-delay: 1.33s; }
    .ci-implications-s2 { animation-delay: 2.67s; }
    .ci-implications-e2 { animation-delay: 2.67s; }
    .ci-implications-s3 { animation-delay: 4.00s; }
    .ci-implications-e3 { animation-delay: 4.00s; }
    .ci-implications-s4 { animation-delay: 5.33s; }
    .ci-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .ci-implications-conn  { animation: ci-implications-trace 8s ease-in-out infinite; }
      .ci-implications-stage { animation: ci-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes ci-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ci-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ci-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ci-implications-stage { animation: ci-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ci-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ci-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ci-implications-bg" width="980" height="322"/>
  <text class="ci-implications-h1"  x="30" y="40">Five consequences of a privileged runner</text>
  <text class="ci-implications-sub" x="30" y="64">Two are supply chain.</text>
  <g class="ci-implications-stage ci-implications-s0">
    <rect class="ci-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="ci-implications-step" x="44" y="142">01</text>
    <text class="ci-implications-name" x="70" y="142">The trigger decides secret exposure</text>
    <text class="ci-implications-desc" x="44" y="166">pull_request_target may</text>
    <text class="ci-implications-desc" x="44" y="182">inspect a PR; it must</text>
    <text class="ci-implications-desc" x="44" y="198">never run its code.</text>
    <text class="ci-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="ci-implications-line ci-implications-conn ci-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#ci-implications-tip)"/>
  <g class="ci-implications-stage ci-implications-s1">
    <rect class="ci-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="ci-implications-step" x="233" y="142">02</text>
    <text class="ci-implications-name" x="259" y="142">uses: org/action@v3 runs their code</text>
    <text class="ci-implications-desc" x="233" y="166">With your token, and a</text>
    <text class="ci-implications-desc" x="233" y="182">tag is mutable. Pin a</text>
    <text class="ci-implications-desc" x="233" y="198">full SHA near a secret.</text>
    <text class="ci-implications-edge" x="233" y="242">supply chain</text>
  </g>
  <line class="ci-implications-line ci-implications-conn ci-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#ci-implications-tip)"/>
  <g class="ci-implications-stage ci-implications-s2">
    <rect class="ci-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="ci-implications-step" x="422" y="142">03</text>
    <text class="ci-implications-name" x="448" y="142">Set permissions: explicitly</text>
    <text class="ci-implications-desc" x="422" y="166">A lint job needs nothing.</text>
    <text class="ci-implications-desc" x="422" y="182">Only the release job</text>
    <text class="ci-implications-desc" x="422" y="198">needs contents: write.</text>
    <text class="ci-implications-edge" x="422" y="242">least privilege</text>
  </g>
  <line class="ci-implications-line ci-implications-conn ci-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#ci-implications-tip)"/>
  <g class="ci-implications-stage ci-implications-s3">
    <rect class="ci-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="ci-implications-step" x="611" y="142">04</text>
    <text class="ci-implications-name" x="637" y="142">Caches are trusted inputs</text>
    <text class="ci-implications-desc" x="611" y="166">An untrusted run that</text>
    <text class="ci-implications-desc" x="611" y="182">writes a shared cache</text>
    <text class="ci-implications-desc" x="611" y="198">poisons what a privileged</text>
  </g>
  <line class="ci-implications-line ci-implications-conn ci-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#ci-implications-tip)"/>
  <g class="ci-implications-stage ci-implications-s4">
    <rect class="ci-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="ci-implications-step" x="800" y="142">05</text>
    <text class="ci-implications-name" x="826" y="142">Billed on minutes, not wall clock</text>
    <text class="ci-implications-desc" x="800" y="166">A matrix of twelve</text>
    <text class="ci-implications-desc" x="800" y="182">multiplies the bill and</text>
    <text class="ci-implications-desc" x="800" y="198">may not move the path at</text>
    <text class="ci-implications-edge" x="800" y="242">money</text>
  </g>
  <text class="ci-implications-sub" x="30" y="304">CI is the most privileged environment most teams operate and the least reviewed, which is an uncomfortable combination and the reason all five of these are worth a checklist rather than a habit.</text>
</svg>
