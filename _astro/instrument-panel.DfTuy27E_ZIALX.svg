<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One tells you what changed.">
  <title>Instruments, or a warning light</title>
  <style>
    .instrument-panel-bg   { fill: #f8fafc; }
    .instrument-panel-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-panel-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-panel-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-panel-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-panel-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-panel-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instrument-panel-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .instrument-panel-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .instrument-panel-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .instrument-panel-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .instrument-panel-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .instrument-panel-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instrument-panel-row { opacity: 1; }
    .instrument-panel-r0 { animation-delay: 0.00s; }
    .instrument-panel-r1 { animation-delay: 0.45s; }
    .instrument-panel-r2 { animation-delay: 0.90s; }
    .instrument-panel-r3 { animation-delay: 1.35s; }
    .instrument-panel-r4 { animation-delay: 1.80s; }
    .instrument-panel-row { animation: instrument-panel-reveal 7.3s ease-in-out infinite; }
    @keyframes instrument-panel-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="instrument-panel-bg" width="980" height="390"/>
  <text class="instrument-panel-h1"  x="30" y="40">Instruments, or a warning light</text>
  <text class="instrument-panel-sub" x="30" y="64">One tells you what changed.</text>
  <rect class="instrument-panel-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="instrument-panel-name" x="46" y="122">A warning light</text>
  <text class="instrument-panel-desc" x="46" y="142">After the fact.</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r0" x="46" y="182">Illuminates when something has failed</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r1" x="46" y="216">No indication of what, or why</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r2" x="46" y="250">No warning beforehand</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r3" x="46" y="284">Too late to prevent it</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r4" x="46" y="318">This is alerting on outcomes</text>
  <rect class="instrument-panel-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="instrument-panel-name" x="526" y="122">An instrument panel</text>
  <text class="instrument-panel-desc" x="526" y="142">Continuously.</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r0" x="526" y="182">Readings for every subsystem</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r1" x="526" y="216">Trends visible before failure</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r2" x="526" y="250">Time to act</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r3" x="526" y="284">Diagnosis from the pattern</text>
  <text class="instrument-panel-desc instrument-panel-row instrument-panel-r4" x="526" y="318">This is observability</text>
  <text class="instrument-panel-sub" x="30" y="372">The value is in the trend rather than the threshold: a reading drifting steadily toward its limit is actionable, and the same reading crossing it is an incident.</text>
</svg>
