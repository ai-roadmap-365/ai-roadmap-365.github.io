<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From unbounded loops to bounded, schema-driven calls.">
  <title>Three eras of agents</title>
  <style>
    .agent-three-eras-bg   { fill: #f8fafc; }
    .agent-three-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-three-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-three-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-three-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-three-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-three-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-three-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-three-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-three-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-three-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-three-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-three-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .agent-three-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .agent-three-eras-stage { opacity: 1; }

    .agent-three-eras-s0 { animation-delay: 0.00s; }
    .agent-three-eras-e0 { animation-delay: 0.00s; }
    .agent-three-eras-s1 { animation-delay: 1.50s; }
    .agent-three-eras-e1 { animation-delay: 1.50s; }
    .agent-three-eras-s2 { animation-delay: 3.00s; }
    .agent-three-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .agent-three-eras-conn  { animation: agent-three-eras-trace 6s ease-in-out infinite; }
      .agent-three-eras-stage { animation: agent-three-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes agent-three-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes agent-three-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .agent-three-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .agent-three-eras-stage { animation: agent-three-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes agent-three-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="agent-three-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="agent-three-eras-bg" width="980" height="322"/>
  <text class="agent-three-eras-h1"  x="30" y="40">Three eras of agents</text>
  <text class="agent-three-eras-sub" x="30" y="64">From unbounded loops to bounded, schema-driven calls.</text>
  <g class="agent-three-eras-stage agent-three-eras-s0">
    <rect class="agent-three-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="agent-three-eras-step" x="44" y="142">01</text>
    <text class="agent-three-eras-name" x="70" y="142">Autonomous loops, 2023</text>
    <text class="agent-three-eras-desc" x="44" y="166">Give it a goal and let it run. Spectacular</text>
    <text class="agent-three-eras-desc" x="44" y="182">demos, unbounded cost.</text>
    <text class="agent-three-eras-edge" x="44" y="242">unbounded</text>
  </g>
  <line class="agent-three-eras-line agent-three-eras-conn agent-three-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#agent-three-eras-tip)"/>
  <g class="agent-three-eras-stage agent-three-eras-s1">
    <rect class="agent-three-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="agent-three-eras-step" x="359" y="142">02</text>
    <text class="agent-three-eras-name" x="385" y="142">String-parsed ReAct, 2023-2024</text>
    <text class="agent-three-eras-desc" x="359" y="166">Parse "Action: search[query]" out of prose.</text>
    <text class="agent-three-eras-desc" x="359" y="182">Broke on any phrasing change.</text>
    <text class="agent-three-eras-edge" x="359" y="242">brittle</text>
  </g>
  <line class="agent-three-eras-line agent-three-eras-conn agent-three-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#agent-three-eras-tip)"/>
  <g class="agent-three-eras-stage agent-three-eras-s2">
    <rect class="agent-three-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="agent-three-eras-step" x="674" y="142">03</text>
    <text class="agent-three-eras-name" x="700" y="142">Schema-driven, 2025-</text>
    <text class="agent-three-eras-desc" x="674" y="166">Tools declared with schemas, arguments</text>
    <text class="agent-three-eras-desc" x="674" y="182">validated, turns and spend capped.</text>
    <text class="agent-three-eras-edge" x="674" y="242">bounded</text>
  </g>
  <text class="agent-three-eras-sub" x="30" y="304">Each era's failure was the same shape as the last: the model was trusted to produce something structured without being constrained to, and the fix each time was to move the structure out of the prose and into a contract.</text>
</svg>
