<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Library, extension, or service.">
  <title>Choosing an implementation</title>
  <style>
    .ann-tooling-bg   { fill: #f8fafc; }
    .ann-tooling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-tooling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-tooling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-tooling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-tooling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-tooling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ann-tooling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ann-tooling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ann-tooling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ann-tooling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ann-tooling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ann-tooling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ann-tooling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ann-tooling-stage { opacity: 1; }

    .ann-tooling-s0 { animation-delay: 0.00s; }
    .ann-tooling-e0 { animation-delay: 0.00s; }
    .ann-tooling-s1 { animation-delay: 1.28s; }
    .ann-tooling-e1 { animation-delay: 1.28s; }
    .ann-tooling-s2 { animation-delay: 2.56s; }
    .ann-tooling-e2 { animation-delay: 2.56s; }
    .ann-tooling-s3 { animation-delay: 3.84s; }
    .ann-tooling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ann-tooling-conn  { animation: ann-tooling-trace 6.4s ease-in-out infinite; }
      .ann-tooling-stage { animation: ann-tooling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ann-tooling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ann-tooling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ann-tooling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ann-tooling-stage { animation: ann-tooling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ann-tooling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ann-tooling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ann-tooling-bg" width="980" height="322"/>
  <text class="ann-tooling-h1"  x="30" y="40">Choosing an implementation</text>
  <text class="ann-tooling-sub" x="30" y="64">Library, extension, or service.</text>
  <g class="ann-tooling-stage ann-tooling-s0">
    <rect class="ann-tooling-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ann-tooling-step" x="44" y="142">01</text>
    <text class="ann-tooling-name" x="70" y="142">Exact search with a numeric library</text>
    <text class="ann-tooling-desc" x="44" y="166">A matrix multiply. No index, and</text>
    <text class="ann-tooling-desc" x="44" y="182">the baseline every measurement</text>
    <text class="ann-tooling-desc" x="44" y="198">needs.</text>
  </g>
  <line class="ann-tooling-line ann-tooling-conn ann-tooling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ann-tooling-tip)"/>
  <g class="ann-tooling-stage ann-tooling-s1">
    <rect class="ann-tooling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ann-tooling-step" x="280" y="142">02</text>
    <text class="ann-tooling-name" x="306" y="142">An algorithm library</text>
    <text class="ann-tooling-desc" x="280" y="166">The reference implementations.</text>
    <text class="ann-tooling-desc" x="280" y="182">You own persistence, updates and</text>
    <text class="ann-tooling-desc" x="280" y="198">rebuilds.</text>
  </g>
  <line class="ann-tooling-line ann-tooling-conn ann-tooling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ann-tooling-tip)"/>
  <g class="ann-tooling-stage ann-tooling-s2">
    <rect class="ann-tooling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ann-tooling-step" x="516" y="142">03</text>
    <text class="ann-tooling-name" x="542" y="142">A database extension</text>
    <text class="ann-tooling-desc" x="516" y="166">Strongest default when the data</text>
    <text class="ann-tooling-desc" x="516" y="182">is already there — it removes a</text>
    <text class="ann-tooling-desc" x="516" y="198">whole system.</text>
  </g>
  <line class="ann-tooling-line ann-tooling-conn ann-tooling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ann-tooling-tip)"/>
  <g class="ann-tooling-stage ann-tooling-s3">
    <rect class="ann-tooling-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ann-tooling-step" x="752" y="142">04</text>
    <text class="ann-tooling-name" x="778" y="142">A vector database or managed service</text>
    <text class="ann-tooling-desc" x="752" y="166">Choose for filtering,</text>
    <text class="ann-tooling-desc" x="752" y="182">persistence and clustering, not</text>
    <text class="ann-tooling-desc" x="752" y="198">for the algorithm.</text>
    <text class="ann-tooling-edge" x="752" y="242">features</text>
  </g>
  <text class="ann-tooling-sub" x="30" y="304">The algorithm is broadly the same everywhere, which is the useful thing to know when comparing vector databases: the differences worth paying for are filtering, persistence, operations and clustering.</text>
</svg>
