<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One number you can compute in advance.">
  <title>The predictable initial loss</title>
  <style>
    .initial-loss-bg   { fill: #f8fafc; }
    .initial-loss-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .initial-loss-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .initial-loss-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .initial-loss-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .initial-loss-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .initial-loss-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .initial-loss-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .initial-loss-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .initial-loss-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .initial-loss-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .initial-loss-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .initial-loss-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .initial-loss-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .initial-loss-stage { opacity: 1; }

    .initial-loss-s0 { animation-delay: 0.00s; }
    .initial-loss-e0 { animation-delay: 0.00s; }
    .initial-loss-s1 { animation-delay: 1.28s; }
    .initial-loss-e1 { animation-delay: 1.28s; }
    .initial-loss-s2 { animation-delay: 2.56s; }
    .initial-loss-e2 { animation-delay: 2.56s; }
    .initial-loss-s3 { animation-delay: 3.84s; }
    .initial-loss-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .initial-loss-conn  { animation: initial-loss-trace 6.4s ease-in-out infinite; }
      .initial-loss-stage { animation: initial-loss-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes initial-loss-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes initial-loss-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .initial-loss-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .initial-loss-stage { animation: initial-loss-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes initial-loss-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="initial-loss-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="initial-loss-bg" width="980" height="322"/>
  <text class="initial-loss-h1"  x="30" y="40">The predictable initial loss</text>
  <text class="initial-loss-sub" x="30" y="64">One number you can compute in advance.</text>
  <g class="initial-loss-stage initial-loss-s0">
    <rect class="initial-loss-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="initial-loss-step" x="44" y="142">01</text>
    <text class="initial-loss-name" x="70" y="142">An untrained model predicts uniformly</text>
    <text class="initial-loss-desc" x="44" y="166">No information yet, so every</text>
    <text class="initial-loss-desc" x="44" y="182">class is equally likely.</text>
  </g>
  <line class="initial-loss-line initial-loss-conn initial-loss-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#initial-loss-tip)"/>
  <g class="initial-loss-stage initial-loss-s1">
    <rect class="initial-loss-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="initial-loss-step" x="280" y="142">02</text>
    <text class="initial-loss-name" x="306" y="142">So cross-entropy starts at ln(K)</text>
    <text class="initial-loss-desc" x="280" y="166">About 2.30 for ten classes, 6.91</text>
    <text class="initial-loss-desc" x="280" y="182">for a thousand.</text>
    <text class="initial-loss-edge" x="280" y="242">computable</text>
  </g>
  <line class="initial-loss-line initial-loss-conn initial-loss-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#initial-loss-tip)"/>
  <g class="initial-loss-stage initial-loss-s2">
    <rect class="initial-loss-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="initial-loss-step" x="516" y="142">03</text>
    <text class="initial-loss-name" x="542" y="142">Much higher means something is wrong</text>
    <text class="initial-loss-desc" x="516" y="166">Bad initialisation, a scaling</text>
    <text class="initial-loss-desc" x="516" y="182">error, or mismatched labels.</text>
  </g>
  <line class="initial-loss-line initial-loss-conn initial-loss-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#initial-loss-tip)"/>
  <g class="initial-loss-stage initial-loss-s3">
    <rect class="initial-loss-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="initial-loss-step" x="752" y="142">04</text>
    <text class="initial-loss-name" x="778" y="142">Much lower means leakage</text>
    <text class="initial-loss-desc" x="752" y="166">The model already knows</text>
    <text class="initial-loss-desc" x="752" y="182">something it should not.</text>
  </g>
  <text class="initial-loss-sub" x="30" y="304">A loss far below the theoretical starting point before any training is the clearest possible signal of label leakage, and it costs one forward pass to detect.</text>
</svg>
