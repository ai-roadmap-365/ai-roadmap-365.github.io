<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The learning curve as a budget question</title>
  <style>
    .learning-curve-145-bg   { fill: #f8fafc; }
    .learning-curve-145-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curve-145-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curve-145-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curve-145-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curve-145-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curve-145-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .learning-curve-145-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .learning-curve-145-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .learning-curve-145-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .learning-curve-145-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .learning-curve-145-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .learning-curve-145-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .learning-curve-145-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .learning-curve-145-stage { opacity: 1; }

    .learning-curve-145-s0 { animation-delay: 0.00s; }
    .learning-curve-145-e0 { animation-delay: 0.00s; }
    .learning-curve-145-s1 { animation-delay: 1.28s; }
    .learning-curve-145-e1 { animation-delay: 1.28s; }
    .learning-curve-145-s2 { animation-delay: 2.56s; }
    .learning-curve-145-e2 { animation-delay: 2.56s; }
    .learning-curve-145-s3 { animation-delay: 3.84s; }
    .learning-curve-145-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .learning-curve-145-conn  { animation: learning-curve-145-trace 6.4s ease-in-out infinite; }
      .learning-curve-145-stage { animation: learning-curve-145-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes learning-curve-145-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes learning-curve-145-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .learning-curve-145-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .learning-curve-145-stage { animation: learning-curve-145-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes learning-curve-145-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="learning-curve-145-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="learning-curve-145-bg" width="980" height="322"/>
  <text class="learning-curve-145-h1"  x="30" y="40">The learning curve as a budget question</text>
  <text class="learning-curve-145-sub" x="30" y="64">Four steps.</text>
  <g class="learning-curve-145-stage learning-curve-145-s0">
    <rect class="learning-curve-145-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="learning-curve-145-step" x="44" y="142">01</text>
    <text class="learning-curve-145-name" x="70" y="142">Plot validation error against training set size</text>
    <text class="learning-curve-145-desc" x="44" y="166">Refitting at each size.</text>
  </g>
  <line class="learning-curve-145-line learning-curve-145-conn learning-curve-145-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#learning-curve-145-tip)"/>
  <g class="learning-curve-145-stage learning-curve-145-s1">
    <rect class="learning-curve-145-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="learning-curve-145-step" x="280" y="142">02</text>
    <text class="learning-curve-145-name" x="306" y="142">A curve still falling means more data will help</text>
    <text class="learning-curve-145-desc" x="280" y="166">By roughly the amount the trend</text>
    <text class="learning-curve-145-desc" x="280" y="182">suggests.</text>
  </g>
  <line class="learning-curve-145-line learning-curve-145-conn learning-curve-145-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#learning-curve-145-tip)"/>
  <g class="learning-curve-145-stage learning-curve-145-s2">
    <rect class="learning-curve-145-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="learning-curve-145-step" x="516" y="142">03</text>
    <text class="learning-curve-145-name" x="542" y="142">A flat curve means it will not</text>
    <text class="learning-curve-145-desc" x="516" y="166">However much you buy.</text>
  </g>
  <line class="learning-curve-145-line learning-curve-145-conn learning-curve-145-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#learning-curve-145-tip)"/>
  <g class="learning-curve-145-stage learning-curve-145-s3">
    <rect class="learning-curve-145-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="learning-curve-145-step" x="752" y="142">04</text>
    <text class="learning-curve-145-name" x="778" y="142">Which converts a budget argument into a measurement</text>
    <text class="learning-curve-145-desc" x="752" y="166">For the cost of a few extra</text>
    <text class="learning-curve-145-desc" x="752" y="182">fits.</text>
    <text class="learning-curve-145-edge" x="752" y="242">cheap</text>
  </g>
  <text class="learning-curve-145-sub" x="30" y="304">Turning the most expensive question in a project into a cheap experiment is the practical value here, and it is why the curve is worth plotting before the meeting.</text>
</svg>
