<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each a learned decision.">
  <title>Three gates and a cell state</title>
  <style>
    .lstm-gates-bg   { fill: #f8fafc; }
    .lstm-gates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-gates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-gates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-gates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-gates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-gates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lstm-gates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lstm-gates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lstm-gates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lstm-gates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lstm-gates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lstm-gates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lstm-gates-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lstm-gates-stage { opacity: 1; }

    .lstm-gates-s0 { animation-delay: 0.00s; }
    .lstm-gates-e0 { animation-delay: 0.00s; }
    .lstm-gates-s1 { animation-delay: 1.28s; }
    .lstm-gates-e1 { animation-delay: 1.28s; }
    .lstm-gates-s2 { animation-delay: 2.56s; }
    .lstm-gates-e2 { animation-delay: 2.56s; }
    .lstm-gates-s3 { animation-delay: 3.84s; }
    .lstm-gates-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lstm-gates-conn  { animation: lstm-gates-trace 6.4s ease-in-out infinite; }
      .lstm-gates-stage { animation: lstm-gates-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lstm-gates-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lstm-gates-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lstm-gates-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lstm-gates-stage { animation: lstm-gates-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lstm-gates-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lstm-gates-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lstm-gates-bg" width="980" height="322"/>
  <text class="lstm-gates-h1"  x="30" y="40">Three gates and a cell state</text>
  <text class="lstm-gates-sub" x="30" y="64">Each a learned decision.</text>
  <g class="lstm-gates-stage lstm-gates-s0">
    <rect class="lstm-gates-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lstm-gates-step" x="44" y="142">01</text>
    <text class="lstm-gates-name" x="70" y="142">Forget gate</text>
    <text class="lstm-gates-desc" x="44" y="166">What to discard from the</text>
    <text class="lstm-gates-desc" x="44" y="182">existing cell state. A sigmoid</text>
    <text class="lstm-gates-desc" x="44" y="198">per dimension.</text>
  </g>
  <line class="lstm-gates-line lstm-gates-conn lstm-gates-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lstm-gates-tip)"/>
  <g class="lstm-gates-stage lstm-gates-s1">
    <rect class="lstm-gates-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lstm-gates-step" x="280" y="142">02</text>
    <text class="lstm-gates-name" x="306" y="142">Input gate</text>
    <text class="lstm-gates-desc" x="280" y="166">What of the new candidate to</text>
    <text class="lstm-gates-desc" x="280" y="182">admit.</text>
  </g>
  <line class="lstm-gates-line lstm-gates-conn lstm-gates-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lstm-gates-tip)"/>
  <g class="lstm-gates-stage lstm-gates-s2">
    <rect class="lstm-gates-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lstm-gates-step" x="516" y="142">03</text>
    <text class="lstm-gates-name" x="542" y="142">Cell state update: multiply then add</text>
    <text class="lstm-gates-desc" x="516" y="166">Old state scaled by forget, plus</text>
    <text class="lstm-gates-desc" x="516" y="182">new content scaled by input.</text>
    <text class="lstm-gates-edge" x="516" y="242">the highway</text>
  </g>
  <line class="lstm-gates-line lstm-gates-conn lstm-gates-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lstm-gates-tip)"/>
  <g class="lstm-gates-stage lstm-gates-s3">
    <rect class="lstm-gates-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lstm-gates-step" x="752" y="142">04</text>
    <text class="lstm-gates-name" x="778" y="142">Output gate</text>
    <text class="lstm-gates-desc" x="752" y="166">How much of the cell state to</text>
    <text class="lstm-gates-desc" x="752" y="182">expose as this step's hidden</text>
    <text class="lstm-gates-desc" x="752" y="198">state.</text>
  </g>
  <text class="lstm-gates-sub" x="30" y="304">The third step is where the architecture's power lives: the cell state is updated by addition rather than by a matrix multiply, which is what stops the gradient shrinking at every step.</text>
</svg>
