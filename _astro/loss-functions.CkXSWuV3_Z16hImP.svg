<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Both measure surprise.">
  <title>Two losses, one pattern</title>
  <style>
    .loss-functions-bg   { fill: #f8fafc; }
    .loss-functions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-functions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-functions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-functions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-functions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-functions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loss-functions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loss-functions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loss-functions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loss-functions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loss-functions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loss-functions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loss-functions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loss-functions-stage { opacity: 1; }

    .loss-functions-s0 { animation-delay: 0.00s; }
    .loss-functions-e0 { animation-delay: 0.00s; }
    .loss-functions-s1 { animation-delay: 1.50s; }
    .loss-functions-e1 { animation-delay: 1.50s; }
    .loss-functions-s2 { animation-delay: 3.00s; }
    .loss-functions-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .loss-functions-conn  { animation: loss-functions-trace 6s ease-in-out infinite; }
      .loss-functions-stage { animation: loss-functions-arrive 6s ease-in-out infinite; }
    }
    @keyframes loss-functions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loss-functions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loss-functions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loss-functions-stage { animation: loss-functions-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loss-functions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loss-functions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loss-functions-bg" width="980" height="322"/>
  <text class="loss-functions-h1"  x="30" y="40">Two losses, one pattern</text>
  <text class="loss-functions-sub" x="30" y="64">Both measure surprise.</text>
  <g class="loss-functions-stage loss-functions-s0">
    <rect class="loss-functions-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="loss-functions-step" x="44" y="142">01</text>
    <text class="loss-functions-name" x="70" y="142">Categorical cross-entropy</text>
    <text class="loss-functions-desc" x="44" y="166">For one-hot targets across K classes.</text>
    <text class="loss-functions-desc" x="44" y="182">Penalises confident wrong answers heavily.</text>
  </g>
  <line class="loss-functions-line loss-functions-conn loss-functions-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#loss-functions-tip)"/>
  <g class="loss-functions-stage loss-functions-s1">
    <rect class="loss-functions-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="loss-functions-step" x="359" y="142">02</text>
    <text class="loss-functions-name" x="385" y="142">Binary cross-entropy</text>
    <text class="loss-functions-desc" x="359" y="166">The two-class special case, paired with a</text>
    <text class="loss-functions-desc" x="359" y="182">sigmoid output.</text>
  </g>
  <line class="loss-functions-line loss-functions-conn loss-functions-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#loss-functions-tip)"/>
  <g class="loss-functions-stage loss-functions-s2">
    <rect class="loss-functions-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="loss-functions-step" x="674" y="142">03</text>
    <text class="loss-functions-name" x="700" y="142">And an epsilon guard</text>
    <text class="loss-functions-desc" x="674" y="166">Because the logarithm of zero is undefined</text>
    <text class="loss-functions-desc" x="674" y="182">and a confident model produces zeros.</text>
  </g>
  <text class="loss-functions-sub" x="30" y="304">The epsilon is not a rounding nicety: a model that becomes confident enough to output exactly zero for a true class produces a loss of negative infinity and a training run that ends in NaN.</text>
</svg>
