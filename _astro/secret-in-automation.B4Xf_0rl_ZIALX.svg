<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And it has one simple rule.">
  <title>The most damaging automation mistake</title>
  <style>
    .secret-in-automation-bg   { fill: #f8fafc; }
    .secret-in-automation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secret-in-automation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secret-in-automation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secret-in-automation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secret-in-automation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secret-in-automation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .secret-in-automation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .secret-in-automation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .secret-in-automation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .secret-in-automation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .secret-in-automation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .secret-in-automation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .secret-in-automation-row { opacity: 1; }
    .secret-in-automation-r0 { animation-delay: 0.00s; }
    .secret-in-automation-r1 { animation-delay: 0.45s; }
    .secret-in-automation-r2 { animation-delay: 0.90s; }
    .secret-in-automation-r3 { animation-delay: 1.35s; }
    .secret-in-automation-r4 { animation-delay: 1.80s; }
    .secret-in-automation-row { animation: secret-in-automation-reveal 7.3s ease-in-out infinite; }
    @keyframes secret-in-automation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="secret-in-automation-bg" width="980" height="390"/>
  <text class="secret-in-automation-h1"  x="30" y="40">The most damaging automation mistake</text>
  <text class="secret-in-automation-sub" x="30" y="64">And it has one simple rule.</text>
  <rect class="secret-in-automation-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="secret-in-automation-name" x="46" y="122">In the script</text>
  <text class="secret-in-automation-desc" x="46" y="142">Committed, and permanent.</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r0" x="46" y="182">In git history the moment you commit</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r1" x="46" y="216">History is copied to every clone</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r2" x="46" y="250">Removing it later changes nothing</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r3" x="46" y="284">Scanners find public ones in minutes</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r4" x="46" y="318">Effectively public, forever</text>
  <rect class="secret-in-automation-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="secret-in-automation-name" x="526" y="122">From the environment</text>
  <text class="secret-in-automation-desc" x="526" y="142">Named in code, stored elsewhere.</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r0" x="526" y="182">The script reads API_TOKEN</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r1" x="526" y="216">It never contains one</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r2" x="526" y="250">Value in CI's encrypted secrets</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r3" x="526" y="284">Or a secret manager, or a gitignored file</text>
  <text class="secret-in-automation-desc secret-in-automation-row secret-in-automation-r4" x="526" y="318">Rotatable without touching the code</text>
  <text class="secret-in-automation-sub" x="30" y="372">This is Day 25's rule arriving where it does the most damage: automation runs unattended with real credentials, which makes it both a standing capability and an attractive target.</text>
</svg>
