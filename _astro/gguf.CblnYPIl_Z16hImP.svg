<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>The model file format</title>
  <style>
    .gguf-bg   { fill: #f8fafc; }
    .gguf-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gguf-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gguf-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gguf-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gguf-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gguf-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gguf-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gguf-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gguf-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gguf-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gguf-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gguf-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gguf-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gguf-stage { opacity: 1; }

    .gguf-s0 { animation-delay: 0.00s; }
    .gguf-e0 { animation-delay: 0.00s; }
    .gguf-s1 { animation-delay: 1.28s; }
    .gguf-e1 { animation-delay: 1.28s; }
    .gguf-s2 { animation-delay: 2.56s; }
    .gguf-e2 { animation-delay: 2.56s; }
    .gguf-s3 { animation-delay: 3.84s; }
    .gguf-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gguf-conn  { animation: gguf-trace 6.4s ease-in-out infinite; }
      .gguf-stage { animation: gguf-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gguf-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gguf-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gguf-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gguf-stage { animation: gguf-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gguf-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gguf-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gguf-bg" width="980" height="322"/>
  <text class="gguf-h1"  x="30" y="40">The model file format</text>
  <text class="gguf-sub" x="30" y="64">Four properties.</text>
  <g class="gguf-stage gguf-s0">
    <rect class="gguf-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gguf-step" x="44" y="142">01</text>
    <text class="gguf-name" x="70" y="142">Metadata in a header</text>
    <text class="gguf-desc" x="44" y="166">Architecture, template,</text>
    <text class="gguf-desc" x="44" y="182">tokeniser, all self-describing.</text>
  </g>
  <line class="gguf-line gguf-conn gguf-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gguf-tip)"/>
  <g class="gguf-stage gguf-s1">
    <rect class="gguf-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gguf-step" x="280" y="142">02</text>
    <text class="gguf-name" x="306" y="142">Then the quantised tensors</text>
    <text class="gguf-desc" x="280" y="166">Laid out for direct reading.</text>
  </g>
  <line class="gguf-line gguf-conn gguf-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gguf-tip)"/>
  <g class="gguf-stage gguf-s2">
    <rect class="gguf-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gguf-step" x="516" y="142">03</text>
    <text class="gguf-name" x="542" y="142">Memory-mapped rather than loaded</text>
    <text class="gguf-desc" x="516" y="166">So startup is fast and memory is</text>
    <text class="gguf-desc" x="516" y="182">shared.</text>
  </g>
  <line class="gguf-line gguf-conn gguf-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gguf-tip)"/>
  <g class="gguf-stage gguf-s3">
    <rect class="gguf-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gguf-step" x="752" y="142">04</text>
    <text class="gguf-name" x="778" y="142">And nothing is executed on load</text>
    <text class="gguf-desc" x="752" y="166">Which is a security property,</text>
    <text class="gguf-desc" x="752" y="182">not a convenience.</text>
  </g>
  <text class="gguf-sub" x="30" y="304">Carrying the template in the file's own metadata is what removes the template-mismatch trap from the previous lesson: the format knows how to address the model.</text>
</svg>
