<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Sorting against argsorting</title>
  <style>
    .argsort-bg   { fill: #f8fafc; }
    .argsort-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argsort-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argsort-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argsort-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argsort-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argsort-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .argsort-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .argsort-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .argsort-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .argsort-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .argsort-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .argsort-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .argsort-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .argsort-stage { opacity: 1; }

    .argsort-s0 { animation-delay: 0.00s; }
    .argsort-e0 { animation-delay: 0.00s; }
    .argsort-s1 { animation-delay: 1.28s; }
    .argsort-e1 { animation-delay: 1.28s; }
    .argsort-s2 { animation-delay: 2.56s; }
    .argsort-e2 { animation-delay: 2.56s; }
    .argsort-s3 { animation-delay: 3.84s; }
    .argsort-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .argsort-conn  { animation: argsort-trace 6.4s ease-in-out infinite; }
      .argsort-stage { animation: argsort-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes argsort-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes argsort-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .argsort-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .argsort-stage { animation: argsort-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes argsort-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="argsort-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="argsort-bg" width="980" height="322"/>
  <text class="argsort-h1"  x="30" y="40">Sorting against argsorting</text>
  <text class="argsort-sub" x="30" y="64">Four steps.</text>
  <g class="argsort-stage argsort-s0">
    <rect class="argsort-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="argsort-step" x="44" y="142">01</text>
    <text class="argsort-name" x="70" y="142">Sorting values gives them in order</text>
    <text class="argsort-desc" x="44" y="166">And discards which was which.</text>
  </g>
  <line class="argsort-line argsort-conn argsort-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#argsort-tip)"/>
  <g class="argsort-stage argsort-s1">
    <rect class="argsort-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="argsort-step" x="280" y="142">02</text>
    <text class="argsort-name" x="306" y="142">Which breaks the link to any parallel array</text>
    <text class="argsort-desc" x="280" y="166">Names, labels, identifiers.</text>
  </g>
  <line class="argsort-line argsort-conn argsort-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#argsort-tip)"/>
  <g class="argsort-stage argsort-s2">
    <rect class="argsort-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="argsort-step" x="516" y="142">03</text>
    <text class="argsort-name" x="542" y="142">Sorting the indices keeps the correspondence</text>
    <text class="argsort-desc" x="516" y="166">Giving the order rather than the</text>
    <text class="argsort-desc" x="516" y="182">values.</text>
  </g>
  <line class="argsort-line argsort-conn argsort-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#argsort-tip)"/>
  <g class="argsort-stage argsort-s3">
    <rect class="argsort-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="argsort-step" x="752" y="142">04</text>
    <text class="argsort-name" x="778" y="142">Which is how top-k retrieval is implemented</text>
    <text class="argsort-desc" x="752" y="166">Scores sorted, documents looked</text>
    <text class="argsort-desc" x="752" y="182">up.</text>
  </g>
  <text class="argsort-sub" x="30" y="304">Every nearest-neighbour and top-k operation in this curriculum is an index sort, which makes this one of the most reused patterns in the course.</text>
</svg>
