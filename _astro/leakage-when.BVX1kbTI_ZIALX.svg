<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By data type.">
  <title>Where to look for leakage</title>
  <style>
    .leakage-when-bg   { fill: #f8fafc; }
    .leakage-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leakage-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leakage-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leakage-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leakage-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leakage-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-when-row { opacity: 1; }
    .leakage-when-r0 { animation-delay: 0.00s; }
    .leakage-when-r1 { animation-delay: 0.45s; }
    .leakage-when-r2 { animation-delay: 0.90s; }
    .leakage-when-r3 { animation-delay: 1.35s; }
    .leakage-when-r4 { animation-delay: 1.80s; }
    .leakage-when-row { animation: leakage-when-reveal 7.3s ease-in-out infinite; }
    @keyframes leakage-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="leakage-when-bg" width="980" height="390"/>
  <text class="leakage-when-h1"  x="30" y="40">Where to look for leakage</text>
  <text class="leakage-when-sub" x="30" y="64">By data type.</text>
  <rect class="leakage-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="leakage-when-name" x="46" y="122">The characteristic</text>
  <text class="leakage-when-desc" x="46" y="142">What you have.</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r0" x="46" y="182">Any timestamp column</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r1" x="46" y="216">Repeated rows per entity</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r2" x="46" y="250">Features derived from downstream systems</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r3" x="46" y="284">Any preprocessing at all</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r4" x="46" y="318">Aggregations across rows</text>
  <rect class="leakage-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="leakage-when-name" x="526" y="122">The leak to check</text>
  <text class="leakage-when-desc" x="526" y="142">What to look for.</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r0" x="526" y="182">Temporal lookahead — split by time</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r1" x="526" y="216">Group contamination — split by entity</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r2" x="526" y="250">Target leakage — audit recording times</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r3" x="526" y="284">Contamination — use a pipeline</text>
  <text class="leakage-when-desc leakage-when-row leakage-when-r4" x="526" y="318">Computed across the split boundary</text>
  <text class="leakage-when-sub" x="30" y="372">Each row here is a check that costs minutes, and the failure it prevents costs a deployment — which is the best return available in this course.</text>
</svg>
