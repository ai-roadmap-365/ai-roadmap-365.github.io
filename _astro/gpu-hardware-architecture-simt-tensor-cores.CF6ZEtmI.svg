<svg role="img" aria-label="GPU Streaming Multiprocessor and Tensor Core architecture diagram showing SIMT execution warp schedulers shared memory and HBM interconnect" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>GPU Architecture and Tensor Core Engine</title>
  <defs>
    <linearGradient id="bg232a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card232" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg232a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">GPU STREAMING MULTIPROCESSOR (SM) &amp; TENSOR CORES</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Massive Parallelism: SIMT Execution, SRAM Shared Memory, and High Bandwidth Memory (HBM)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card232)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Streaming Multiprocessor (SM) Core -->
    <rect x="25" y="25" width="440" height="255" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="245" y="48" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Streaming Multiprocessor (SM Architecture)</text>
    
    <!-- Warp Schedulers -->
    <rect x="40" y="65" width="410" height="35" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="245" y="87" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">4x Warp Schedulers &amp; Dispatch Units (32 Threads / Warp)</text>

    <!-- Execution Units: CUDA Cores + Tensor Cores -->
    <g transform="translate(40, 110)">
      <!-- FP32/INT32 Cores -->
      <rect x="0" y="0" width="195" height="90" fill="#1e293b" stroke="#38bdf8" rx="4"/>
      <text x="97" y="22" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">CUDA SIMT Cores</text>
      <text x="97" y="42" fill="#cbd5e1" font-size="8" text-anchor="middle">• 128 FP32 / INT32 ALUs</text>
      <text x="97" y="60" fill="#cbd5e1" font-size="8" text-anchor="middle">• Elementwise &amp; Activations</text>
      <text x="97" y="78" fill="#94a3b8" font-size="7" text-anchor="middle">GELU, LayerNorm, Add</text>

      <!-- Tensor Cores (Green) -->
      <rect x="210" y="0" width="200" height="90" fill="#065f46" stroke="#10b981" stroke-width="2" rx="4"/>
      <text x="310" y="22" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">4th Gen Tensor Cores</text>
      <text x="310" y="42" fill="#a7f3d0" font-size="8" text-anchor="middle">• Mixed-Precision Matrix MAC</text>
      <text x="310" y="60" fill="#a7f3d0" font-size="8" text-anchor="middle">• D = A x B + C (16x16x16)</text>
      <text x="310" y="78" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">FP16 / BF16 / FP8 Engines</text>
    </g>

    <!-- SRAM Shared Memory -->
    <rect x="40" y="210" width="410" height="55" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="245" y="232" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">Ultra-Fast SRAM: L1 Cache &amp; Shared Memory (256 KB / SM)</text>
    <text x="245" y="252" fill="#cbd5e1" font-size="8" text-anchor="middle">~19 TB/s Bandwidth • Zero-Latency Data Tiling (FlashAttention)</text>

    <!-- Right: Global Memory Hierarchy -->
    <rect x="485" y="25" width="250" height="255" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="610" y="48" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Memory Hierarchy</text>

    <!-- L2 Cache -->
    <rect x="500" y="65" width="220" height="55" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="610" y="88" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">L2 Cache (50 MB - 60 MB)</text>
    <text x="610" y="108" fill="#cbd5e1" font-size="8" text-anchor="middle">~5 TB/s Cross-SM Shared Cache</text>

    <!-- High Bandwidth Memory (HBM3e) -->
    <rect x="500" y="130" width="220" height="75" fill="#1e293b" stroke="#f43f5e" stroke-width="2" rx="4"/>
    <text x="610" y="152" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">HBM3 / HBM3e VRAM</text>
    <text x="610" y="172" fill="#cbd5e1" font-size="8" text-anchor="middle">80 GB - 192 GB Capacity</text>
    <text x="610" y="190" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">3.35 TB/s to 5.3 TB/s Bandwidth</text>

    <!-- NVLink Interconnect -->
    <rect x="500" y="215" width="220" height="50" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="610" y="235" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">NVLink 4 / 5 Interconnect</text>
    <text x="610" y="252" fill="#cbd5e1" font-size="8" text-anchor="middle">900 GB/s - 1.8 TB/s GPU-to-GPU</text>
  </g>
</svg>
