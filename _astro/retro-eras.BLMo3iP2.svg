<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each step removed a reason to lie.">
  <title>How reviews became usable</title>
  <style>
    .retro-eras-bg   { fill: #f8fafc; }
    .retro-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retro-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retro-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retro-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retro-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retro-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retro-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .retro-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .retro-eras-stage { opacity: 1; }

    .retro-eras-s0 { animation-delay: 0.00s; }
    .retro-eras-e0 { animation-delay: 0.00s; }
    .retro-eras-s1 { animation-delay: 1.28s; }
    .retro-eras-e1 { animation-delay: 1.28s; }
    .retro-eras-s2 { animation-delay: 2.56s; }
    .retro-eras-e2 { animation-delay: 2.56s; }
    .retro-eras-s3 { animation-delay: 3.84s; }
    .retro-eras-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .retro-eras-conn  { animation: retro-eras-trace 6.4s ease-in-out infinite; }
      .retro-eras-stage { animation: retro-eras-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes retro-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes retro-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .retro-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .retro-eras-stage { animation: retro-eras-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes retro-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="retro-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="retro-eras-bg" width="980" height="322"/>
  <text class="retro-eras-h1"  x="30" y="40">How reviews became usable</text>
  <text class="retro-eras-sub" x="30" y="64">Each step removed a reason to lie.</text>
  <g class="retro-eras-stage retro-eras-s0">
    <rect class="retro-eras-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="retro-eras-step" x="44" y="142">01</text>
    <text class="retro-eras-name" x="70" y="142">Project post-mortems, 1960s</text>
    <text class="retro-eras-desc" x="44" y="166">Large programmes, formal</text>
    <text class="retro-eras-desc" x="44" y="182">reviews. Findings stayed inside</text>
    <text class="retro-eras-desc" x="44" y="198">the project.</text>
  </g>
  <line class="retro-eras-line retro-eras-conn retro-eras-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#retro-eras-tip)"/>
  <g class="retro-eras-stage retro-eras-s1">
    <rect class="retro-eras-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="retro-eras-step" x="280" y="142">02</text>
    <text class="retro-eras-name" x="306" y="142">Blameless review, 2000s</text>
    <text class="retro-eras-desc" x="280" y="166">Naming individuals produces</text>
    <text class="retro-eras-desc" x="280" y="182">defensive accounts, and</text>
    <text class="retro-eras-desc" x="280" y="198">therefore bad data.</text>
    <text class="retro-eras-edge" x="280" y="242">honest data</text>
  </g>
  <line class="retro-eras-line retro-eras-conn retro-eras-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#retro-eras-tip)"/>
  <g class="retro-eras-stage retro-eras-s2">
    <rect class="retro-eras-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="retro-eras-step" x="516" y="142">03</text>
    <text class="retro-eras-name" x="542" y="142">Agile retrospectives, 2001</text>
    <text class="retro-eras-desc" x="516" y="166">Short and frequent. The same</text>
    <text class="retro-eras-desc" x="516" y="182">three items reappear when</text>
    <text class="retro-eras-desc" x="516" y="198">nothing is measured.</text>
  </g>
  <line class="retro-eras-line retro-eras-conn retro-eras-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#retro-eras-tip)"/>
  <g class="retro-eras-stage retro-eras-s3">
    <rect class="retro-eras-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="retro-eras-step" x="752" y="142">04</text>
    <text class="retro-eras-name" x="778" y="142">Calibration research</text>
    <text class="retro-eras-desc" x="752" y="166">Systematic under-estimation,</text>
    <text class="retro-eras-desc" x="752" y="182">worse for unfamiliar work. The</text>
    <text class="retro-eras-desc" x="752" y="198">planning fallacy, 1979.</text>
    <text class="retro-eras-edge" x="752" y="242">your own ratio</text>
  </g>
  <text class="retro-eras-sub" x="30" y="304">The second step is why this lesson measures gates and estimates rather than people: a review that produces defensive accounts produces unreliable inputs, and the numbers are the only part that survives the retelling.</text>
</svg>
