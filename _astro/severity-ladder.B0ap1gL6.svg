<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Consequence, stated in advance.">
  <title>What makes a finding high</title>
  <style>
    .severity-ladder-bg   { fill: #f8fafc; }
    .severity-ladder-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-ladder-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-ladder-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-ladder-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-ladder-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-ladder-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .severity-ladder-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .severity-ladder-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .severity-ladder-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .severity-ladder-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .severity-ladder-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .severity-ladder-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .severity-ladder-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .severity-ladder-stage { opacity: 1; }

    .severity-ladder-s0 { animation-delay: 0.00s; }
    .severity-ladder-e0 { animation-delay: 0.00s; }
    .severity-ladder-s1 { animation-delay: 1.28s; }
    .severity-ladder-e1 { animation-delay: 1.28s; }
    .severity-ladder-s2 { animation-delay: 2.56s; }
    .severity-ladder-e2 { animation-delay: 2.56s; }
    .severity-ladder-s3 { animation-delay: 3.84s; }
    .severity-ladder-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .severity-ladder-conn  { animation: severity-ladder-trace 6.4s ease-in-out infinite; }
      .severity-ladder-stage { animation: severity-ladder-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes severity-ladder-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes severity-ladder-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .severity-ladder-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .severity-ladder-stage { animation: severity-ladder-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes severity-ladder-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="severity-ladder-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="severity-ladder-bg" width="980" height="322"/>
  <text class="severity-ladder-h1"  x="30" y="40">What makes a finding high</text>
  <text class="severity-ladder-sub" x="30" y="64">Consequence, stated in advance.</text>
  <g class="severity-ladder-stage severity-ladder-s0">
    <rect class="severity-ladder-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="severity-ladder-step" x="44" y="142">01</text>
    <text class="severity-ladder-name" x="70" y="142">High</text>
    <text class="severity-ladder-desc" x="44" y="166">An attacker can act, data</text>
    <text class="severity-ladder-desc" x="44" y="182">leaves, or the service goes</text>
    <text class="severity-ladder-desc" x="44" y="198">down.</text>
    <text class="severity-ladder-edge" x="44" y="242">fails</text>
  </g>
  <line class="severity-ladder-line severity-ladder-conn severity-ladder-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#severity-ladder-tip)"/>
  <g class="severity-ladder-stage severity-ladder-s1">
    <rect class="severity-ladder-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="severity-ladder-step" x="280" y="142">02</text>
    <text class="severity-ladder-name" x="306" y="142">Medium</text>
    <text class="severity-ladder-desc" x="280" y="166">Real exposure, narrower path.</text>
    <text class="severity-ladder-desc" x="280" y="182">One spend cap missing; an</text>
    <text class="severity-ladder-desc" x="280" y="198">unpinned image.</text>
    <text class="severity-ladder-edge" x="280" y="242">fails</text>
  </g>
  <line class="severity-ladder-line severity-ladder-conn severity-ladder-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#severity-ladder-tip)"/>
  <g class="severity-ladder-stage severity-ladder-s2">
    <rect class="severity-ladder-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="severity-ladder-step" x="516" y="142">03</text>
    <text class="severity-ladder-name" x="542" y="142">Low</text>
    <text class="severity-ladder-desc" x="516" y="166">Worth noting. A destructive</text>
    <text class="severity-ladder-desc" x="516" y="182">scope that exists but is gated</text>
    <text class="severity-ladder-desc" x="516" y="198">by confirmation.</text>
    <text class="severity-ladder-edge" x="516" y="242">passes</text>
  </g>
  <line class="severity-ladder-line severity-ladder-conn severity-ladder-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#severity-ladder-tip)"/>
  <g class="severity-ladder-stage severity-ladder-s3">
    <rect class="severity-ladder-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="severity-ladder-step" x="752" y="142">04</text>
    <text class="severity-ladder-name" x="778" y="142">The verdict</text>
    <text class="severity-ladder-desc" x="752" y="166">Any high or medium fails. Low</text>
    <text class="severity-ladder-desc" x="752" y="182">findings do not.</text>
    <text class="severity-ladder-edge" x="752" y="242">arithmetic</text>
  </g>
  <text class="severity-ladder-sub" x="30" y="304">Defining the ladder before running the review is what stops severity being negotiated afterwards, when the person arguing is the one who would have to do the remediation.</text>
</svg>
