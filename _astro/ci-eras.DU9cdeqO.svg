<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each made pipelines easier to grow.">
  <title>Five steps to the modern pipeline</title>
  <style>
    .ci-eras-bg   { fill: #f8fafc; }
    .ci-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ci-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ci-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ci-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ci-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ci-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ci-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ci-eras-stage { opacity: 1; }

    .ci-eras-s0 { animation-delay: 0.00s; }
    .ci-eras-e0 { animation-delay: 0.00s; }
    .ci-eras-s1 { animation-delay: 1.33s; }
    .ci-eras-e1 { animation-delay: 1.33s; }
    .ci-eras-s2 { animation-delay: 2.67s; }
    .ci-eras-e2 { animation-delay: 2.67s; }
    .ci-eras-s3 { animation-delay: 4.00s; }
    .ci-eras-e3 { animation-delay: 4.00s; }
    .ci-eras-s4 { animation-delay: 5.33s; }
    .ci-eras-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .ci-eras-conn  { animation: ci-eras-trace 8s ease-in-out infinite; }
      .ci-eras-stage { animation: ci-eras-arrive 8s ease-in-out infinite; }
    }
    @keyframes ci-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ci-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ci-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ci-eras-stage { animation: ci-eras-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ci-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ci-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ci-eras-bg" width="980" height="322"/>
  <text class="ci-eras-h1"  x="30" y="40">Five steps to the modern pipeline</text>
  <text class="ci-eras-sub" x="30" y="64">Each made pipelines easier to grow.</text>
  <g class="ci-eras-stage ci-eras-s0">
    <rect class="ci-eras-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="ci-eras-step" x="44" y="142">01</text>
    <text class="ci-eras-name" x="70" y="142">CruiseControl, 2001</text>
    <text class="ci-eras-desc" x="44" y="166">A practice before a</text>
    <text class="ci-eras-desc" x="44" y="182">product. A broken build</text>
    <text class="ci-eras-desc" x="44" y="198">is everyone's problem.</text>
  </g>
  <line class="ci-eras-line ci-eras-conn ci-eras-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#ci-eras-tip)"/>
  <g class="ci-eras-stage ci-eras-s1">
    <rect class="ci-eras-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="ci-eras-step" x="233" y="142">02</text>
    <text class="ci-eras-name" x="259" y="142">Jenkins, 2005</text>
    <text class="ci-eras-desc" x="233" y="166">Taught the failure mode</text>
    <text class="ci-eras-desc" x="233" y="182">of a build defined by</text>
    <text class="ci-eras-desc" x="233" y="198">clicking: it drifts, and</text>
  </g>
  <line class="ci-eras-line ci-eras-conn ci-eras-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#ci-eras-tip)"/>
  <g class="ci-eras-stage ci-eras-s2">
    <rect class="ci-eras-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="ci-eras-step" x="422" y="142">03</text>
    <text class="ci-eras-name" x="448" y="142">Pipeline as code, 2015</text>
    <text class="ci-eras-desc" x="422" y="166">Reviewable, diffable,</text>
    <text class="ci-eras-desc" x="422" y="182">branchable — and easy to</text>
    <text class="ci-eras-desc" x="422" y="198">grow, since a stage is</text>
  </g>
  <line class="ci-eras-line ci-eras-conn ci-eras-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#ci-eras-tip)"/>
  <g class="ci-eras-stage ci-eras-s3">
    <rect class="ci-eras-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="ci-eras-step" x="611" y="142">04</text>
    <text class="ci-eras-name" x="637" y="142">GitHub Actions, 2019</text>
    <text class="ci-eras-desc" x="611" y="166">The marketplace. CI</text>
    <text class="ci-eras-desc" x="611" y="182">becomes where most</text>
    <text class="ci-eras-desc" x="611" y="198">organisations run the</text>
    <text class="ci-eras-edge" x="611" y="242">the risk</text>
  </g>
  <line class="ci-eras-line ci-eras-conn ci-eras-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#ci-eras-tip)"/>
  <g class="ci-eras-stage ci-eras-s4">
    <rect class="ci-eras-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="ci-eras-step" x="800" y="142">05</text>
    <text class="ci-eras-name" x="826" y="142">pull_request_target, 2020</text>
    <text class="ci-eras-desc" x="800" y="166">Exploited within months,</text>
    <text class="ci-eras-desc" x="800" y="182">and still the sharpest</text>
    <text class="ci-eras-desc" x="800" y="198">edge in the product.</text>
  </g>
  <text class="ci-eras-sub" x="30" y="304">The third and fourth rows compound: putting the pipeline in the repository made adding a stage nearly free, and the marketplace made each stage somebody else's code running with your token.</text>
</svg>
