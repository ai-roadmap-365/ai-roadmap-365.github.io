<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And a platform will not decide what healthy means.">
  <title>Deploying is not releasing</title>
  <style>
    .deploy-versus-release-bg   { fill: #f8fafc; }
    .deploy-versus-release-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-versus-release-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-versus-release-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-versus-release-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-versus-release-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-versus-release-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deploy-versus-release-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deploy-versus-release-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deploy-versus-release-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deploy-versus-release-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deploy-versus-release-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deploy-versus-release-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deploy-versus-release-row { opacity: 1; }
    .deploy-versus-release-r0 { animation-delay: 0.00s; }
    .deploy-versus-release-r1 { animation-delay: 0.45s; }
    .deploy-versus-release-r2 { animation-delay: 0.90s; }
    .deploy-versus-release-r3 { animation-delay: 1.35s; }
    .deploy-versus-release-r4 { animation-delay: 1.80s; }
    .deploy-versus-release-row { animation: deploy-versus-release-reveal 7.3s ease-in-out infinite; }
    @keyframes deploy-versus-release-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="deploy-versus-release-bg" width="980" height="390"/>
  <text class="deploy-versus-release-h1"  x="30" y="40">Deploying is not releasing</text>
  <text class="deploy-versus-release-sub" x="30" y="64">And a platform will not decide what healthy means.</text>
  <rect class="deploy-versus-release-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="deploy-versus-release-name" x="46" y="122">The misconception</text>
  <text class="deploy-versus-release-desc" x="46" y="142">Three that cost real time.</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r0" x="46" y="182">"Deployed means released"</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r1" x="46" y="216">"The platform handles health"</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r2" x="46" y="250">"Promotion is the finish line"</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r3" x="46" y="284">"Friday deploys are dangerous"</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r4" x="46" y="318">"Rollback is restoring a backup"</text>
  <rect class="deploy-versus-release-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="deploy-versus-release-name" x="526" y="122">The correction</text>
  <text class="deploy-versus-release-desc" x="526" y="142">What is actually true.</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r0" x="526" y="182">Feature flags separate the two</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r1" x="526" y="216">Only you know what serving means</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r2" x="526" y="250">Monitoring is the other half</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r3" x="526" y="284">They are, without flags and rollback</text>
  <text class="deploy-versus-release-desc deploy-versus-release-row deploy-versus-release-r4" x="526" y="318">It is swapping which artefact is live</text>
  <text class="deploy-versus-release-sub" x="30" y="372">The first row is what makes the fourth safe: once deploying and releasing are separate operations, shipping code on a Friday exposes nothing to anyone until a flag says so.</text>
</svg>
