<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What k-means is not</title>
  <style>
    .kmeans-not-bg   { fill: #f8fafc; }
    .kmeans-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kmeans-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kmeans-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kmeans-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kmeans-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kmeans-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kmeans-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kmeans-not-row { opacity: 1; }
    .kmeans-not-r0 { animation-delay: 0.00s; }
    .kmeans-not-r1 { animation-delay: 0.45s; }
    .kmeans-not-r2 { animation-delay: 0.90s; }
    .kmeans-not-r3 { animation-delay: 1.35s; }
    .kmeans-not-r4 { animation-delay: 1.80s; }
    .kmeans-not-row { animation: kmeans-not-reveal 7.3s ease-in-out infinite; }
    @keyframes kmeans-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kmeans-not-bg" width="980" height="390"/>
  <text class="kmeans-not-h1"  x="30" y="40">What k-means is not</text>
  <text class="kmeans-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="kmeans-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kmeans-not-name" x="46" y="122">The misconception</text>
  <text class="kmeans-not-desc" x="46" y="142">Commonly held.</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r0" x="46" y="182">It finds the natural number of groups</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r1" x="46" y="216">It works on any cluster shape</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r2" x="46" y="250">It gives the same answer every run</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r3" x="46" y="284">Scaling is optional</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r4" x="46" y="318">Every point belongs somewhere meaningful</text>
  <rect class="kmeans-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kmeans-not-name" x="526" y="122">What is true</text>
  <text class="kmeans-not-desc" x="526" y="142">Actually.</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r0" x="526" y="182">You must supply k; it cannot object</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r1" x="526" y="216">It assumes spherical, similar-sized clusters</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r2" x="526" y="250">Different seeds give different local minima</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r3" x="526" y="284">The objective is a squared distance; scaling is mandatory</text>
  <text class="kmeans-not-desc kmeans-not-row kmeans-not-r4" x="526" y="318">Outliers are forced into a cluster regardless</text>
  <text class="kmeans-not-sub" x="30" y="372">Forcing outliers into clusters is the structural difference from density-based methods, and it is why k-means is a poor choice when anomalies are present.</text>
</svg>
