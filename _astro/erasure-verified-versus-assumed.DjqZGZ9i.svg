<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" role="img" aria-label="Erasure Verified versus Erasure Assumed showing delete calls issued to some stores and a read-back that reports which stores still hold the subject">
  <title>Erasure Verified versus Erasure Assumed</title>
  <defs>
    <style>
      .d328b-bg { fill: #f8fafc; }
      .d328b-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d328b-ok { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d328b-bad { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d328b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d328b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d328b-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .d328b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d328b-warn { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
      .d328b-mono { font-family: ui-monospace, monospace; font-size: 11px; fill: #0f172a; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d328b-bg"/>
  <text x="40" y="40" class="d328b-title">Erasure Verified versus Erasure Assumed</text>
  <text x="40" y="64" class="d328b-sub">Both runs issue the same two delete calls. Only one of them tells you the request was not fulfilled.</text>

  <rect x="40" y="95" width="390" height="230" rx="8" class="d328b-panel"/>
  <text x="235" y="124" class="d328b-h" text-anchor="middle">Assumed — report from the delete calls</text>
  <rect x="70" y="145" width="150" height="34" rx="5" class="d328b-ok"/>
  <text x="145" y="167" class="d328b-t" text-anchor="middle">database — deleted</text>
  <rect x="250" y="145" width="150" height="34" rx="5" class="d328b-ok"/>
  <text x="325" y="167" class="d328b-t" text-anchor="middle">vector_index — deleted</text>
  <text x="235" y="210" class="d328b-mono" text-anchor="middle">deleted_from=2</text>
  <text x="235" y="232" class="d328b-mono" text-anchor="middle">"erasure complete"</text>
  <text x="235" y="268" class="d328b-warn" text-anchor="middle">Two stores were never asked.</text>
  <text x="235" y="290" class="d328b-t" text-anchor="middle">Nothing in this run looks wrong.</text>

  <rect x="470" y="95" width="390" height="230" rx="8" class="d328b-panel"/>
  <text x="665" y="124" class="d328b-h" text-anchor="middle">Verified — read back afterwards</text>
  <rect x="500" y="145" width="150" height="34" rx="5" class="d328b-ok"/>
  <text x="575" y="167" class="d328b-t" text-anchor="middle">database — gone</text>
  <rect x="680" y="145" width="150" height="34" rx="5" class="d328b-ok"/>
  <text x="755" y="167" class="d328b-t" text-anchor="middle">vector_index — gone</text>
  <rect x="500" y="189" width="150" height="34" rx="5" class="d328b-bad"/>
  <text x="575" y="211" class="d328b-t" text-anchor="middle">response_cache — PRESENT</text>
  <rect x="680" y="189" width="150" height="34" rx="5" class="d328b-bad"/>
  <text x="755" y="211" class="d328b-t" text-anchor="middle">audit_log — PRESENT</text>
  <text x="665" y="252" class="d328b-mono" text-anchor="middle">INCOMPLETE still_present=audit_log,response_cache</text>
  <text x="665" y="288" class="d328b-t" text-anchor="middle">A silent failure has become a visible one.</text>

  <text x="40" y="368" class="d328b-t">"We ran the deletion" and "the data is gone" are different claims. Only the second is what was promised, and only a</text>
  <text x="40" y="388" class="d328b-t">read-back can support it. A store that accepted the call and did not act looks identical to one that did.</text>
</svg>
