<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A known sequence should be written, not chosen.">
  <title>When not to use an agent</title>
  <style>
    .agent-or-sequence-bg   { fill: #f8fafc; }
    .agent-or-sequence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-sequence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-sequence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-sequence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-sequence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-sequence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-or-sequence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-or-sequence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-or-sequence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-or-sequence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-or-sequence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-or-sequence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-or-sequence-row { opacity: 1; }
    .agent-or-sequence-r0 { animation-delay: 0.00s; }
    .agent-or-sequence-r1 { animation-delay: 0.45s; }
    .agent-or-sequence-r2 { animation-delay: 0.90s; }
    .agent-or-sequence-r3 { animation-delay: 1.35s; }
    .agent-or-sequence-r4 { animation-delay: 1.80s; }
    .agent-or-sequence-row { animation: agent-or-sequence-reveal 7.3s ease-in-out infinite; }
    @keyframes agent-or-sequence-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="agent-or-sequence-bg" width="980" height="390"/>
  <text class="agent-or-sequence-h1"  x="30" y="40">When not to use an agent</text>
  <text class="agent-or-sequence-sub" x="30" y="64">A known sequence should be written, not chosen.</text>
  <rect class="agent-or-sequence-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="agent-or-sequence-name" x="46" y="122">A fixed pipeline</text>
  <text class="agent-or-sequence-desc" x="46" y="142">When you know the steps.</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r0" x="46" y="182">Retrieve, then generate, then validate</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r1" x="46" y="216">Predictable cost and latency</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r2" x="46" y="250">Testable end to end, deterministically</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r3" x="46" y="284">Failure modes enumerable in advance</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r4" x="46" y="318">Almost always the right answer</text>
  <rect class="agent-or-sequence-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="agent-or-sequence-name" x="526" y="122">An agent</text>
  <text class="agent-or-sequence-desc" x="526" y="142">When the steps depend on findings.</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r0" x="526" y="182">Which tool to call is not known upfront</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r1" x="526" y="216">Variable cost and latency, by design</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r2" x="526" y="250">Testing means many runs, not one</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r3" x="526" y="284">Failures include loops and refusals</text>
  <text class="agent-or-sequence-desc agent-or-sequence-row agent-or-sequence-r4" x="526" y="318">Justify it before choosing it</text>
  <text class="agent-or-sequence-sub" x="30" y="372">Most capstone problems described as agent problems are pipelines with a branch. Write the branch: it is cheaper, faster, testable, and it does not need a turn cap.</text>
</svg>
