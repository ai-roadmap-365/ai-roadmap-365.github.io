<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different optima.">
  <title>Optimal to train, optimal to serve</title>
  <style>
    .train-vs-serve-bg   { fill: #f8fafc; }
    .train-vs-serve-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .train-vs-serve-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .train-vs-serve-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .train-vs-serve-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .train-vs-serve-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .train-vs-serve-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .train-vs-serve-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .train-vs-serve-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .train-vs-serve-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .train-vs-serve-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .train-vs-serve-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .train-vs-serve-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .train-vs-serve-row { opacity: 1; }
    .train-vs-serve-r0 { animation-delay: 0.00s; }
    .train-vs-serve-r1 { animation-delay: 0.45s; }
    .train-vs-serve-r2 { animation-delay: 0.90s; }
    .train-vs-serve-r3 { animation-delay: 1.35s; }
    .train-vs-serve-r4 { animation-delay: 1.80s; }
    .train-vs-serve-row { animation: train-vs-serve-reveal 7.3s ease-in-out infinite; }
    @keyframes train-vs-serve-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="train-vs-serve-bg" width="980" height="390"/>
  <text class="train-vs-serve-h1"  x="30" y="40">Optimal to train, optimal to serve</text>
  <text class="train-vs-serve-sub" x="30" y="64">Two different optima.</text>
  <rect class="train-vs-serve-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="train-vs-serve-name" x="46" y="122">Compute-optimal</text>
  <text class="train-vs-serve-desc" x="46" y="142">Cheapest to train.</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r0" x="46" y="182">Roughly twenty tokens per parameter</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r1" x="46" y="216">Minimises loss for the training budget</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r2" x="46" y="250">Produces a larger model</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r3" x="46" y="284">Which costs more on every request</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r4" x="46" y="318">Right for a research result</text>
  <rect class="train-vs-serve-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="train-vs-serve-name" x="526" y="122">Inference-optimal</text>
  <text class="train-vs-serve-desc" x="526" y="142">Cheapest to run.</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r0" x="526" y="182">Ten or twenty times past the optimum</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r1" x="526" y="216">Spends more on training, once</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r2" x="526" y="250">Produces a smaller model</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r3" x="526" y="284">Which is cheaper on every request forever</text>
  <text class="train-vs-serve-desc train-vs-serve-row train-vs-serve-r4" x="526" y="318">Right for anything deployed</text>
  <text class="train-vs-serve-sub" x="30" y="372">Serving cost dominating training cost over a model's life is what shifted practice here, and it is why current open models are deliberately trained far past the compute optimum.</text>
</svg>
