<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What imbalance handling is not</title>
  <style>
    .imbalance-not-bg   { fill: #f8fafc; }
    .imbalance-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .imbalance-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .imbalance-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .imbalance-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .imbalance-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .imbalance-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .imbalance-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .imbalance-not-row { opacity: 1; }
    .imbalance-not-r0 { animation-delay: 0.00s; }
    .imbalance-not-r1 { animation-delay: 0.45s; }
    .imbalance-not-r2 { animation-delay: 0.90s; }
    .imbalance-not-r3 { animation-delay: 1.35s; }
    .imbalance-not-r4 { animation-delay: 1.80s; }
    .imbalance-not-row { animation: imbalance-not-reveal 7.3s ease-in-out infinite; }
    @keyframes imbalance-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="imbalance-not-bg" width="980" height="390"/>
  <text class="imbalance-not-h1"  x="30" y="40">What imbalance handling is not</text>
  <text class="imbalance-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="imbalance-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="imbalance-not-name" x="46" y="122">The misconception</text>
  <text class="imbalance-not-desc" x="46" y="142">Commonly held.</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r0" x="46" y="182">Imbalanced data is always a problem</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r1" x="46" y="216">Balancing always improves the model</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r2" x="46" y="250">Synthetic examples add information</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r3" x="46" y="284">Balance the test set too</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r4" x="46" y="318">It replaces choosing the right metric</text>
  <rect class="imbalance-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="imbalance-not-name" x="526" y="122">What is true</text>
  <text class="imbalance-not-desc" x="526" y="142">Actually.</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r0" x="526" y="182">Only when the rare class matters</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r1" x="526" y="216">It can hurt calibration</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r2" x="526" y="250">They interpolate what is already there</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r3" x="526" y="284">Never — it must reflect reality</text>
  <text class="imbalance-not-desc imbalance-not-row imbalance-not-r4" x="526" y="318">It complements it, and cannot replace it</text>
  <text class="imbalance-not-sub" x="30" y="372">Balancing the test set is a serious error: it makes the measured performance describe a world that does not exist, and the deployed model will disappoint.</text>
</svg>
