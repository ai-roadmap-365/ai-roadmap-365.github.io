<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" font-family="system-ui, sans-serif">
  <title>An HTTP request message beside an HTTP response message, each labelled part by part</title>
  <rect x="0" y="0" width="820" height="500" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One HTTP round trip: request and response</text>

  <!-- Client / server labels and arrow -->
  <text x="200" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">CLIENT sends a request &#8594;</text>
  <text x="620" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">&#8592; SERVER sends a response</text>

  <!-- ===== REQUEST MESSAGE ===== -->
  <rect x="30" y="80" width="360" height="390" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="10"/>

  <!-- request line -->
  <rect x="46" y="96" width="328" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="60" y="124" font-size="15" font-weight="bold" fill="#1a202c">POST /v1/messages HTTP/1.1</text>
  <text x="60" y="160" font-size="13" fill="#1d4ed8">request line: method &#183; path &#183; version</text>

  <!-- headers -->
  <rect x="46" y="172" width="328" height="120" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="60" y="194" font-size="14" fill="#1a202c">Host: api.example</text>
  <text x="60" y="216" font-size="14" fill="#1a202c">Content-Type: application/json</text>
  <text x="60" y="238" font-size="14" fill="#1a202c">Authorization: Bearer &lt;token&gt;</text>
  <text x="60" y="260" font-size="14" fill="#1a202c">Content-Length: 27</text>
  <text x="60" y="284" font-size="13" fill="#1d4ed8">headers: metadata, one Name: value per line</text>

  <!-- blank line -->
  <line x1="46" y1="306" x2="374" y2="306" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="60" y="322" font-size="13" fill="#1a202c" font-style="italic">(blank line: ends the headers)</text>

  <!-- body -->
  <rect x="46" y="334" width="328" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="60" y="366" font-size="15" font-weight="bold" fill="#1a202c">{"prompt":"Hello, server"}</text>
  <text x="60" y="410" font-size="13" fill="#1d4ed8">body: the data you are sending</text>
  <text x="60" y="430" font-size="13" fill="#1d4ed8">(JSON for a model prompt)</text>

  <!-- ===== RESPONSE MESSAGE ===== -->
  <rect x="430" y="80" width="360" height="390" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="10"/>

  <!-- status line -->
  <rect x="446" y="96" width="328" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="460" y="124" font-size="15" font-weight="bold" fill="#1a202c">HTTP/1.1 200 OK</text>
  <text x="460" y="160" font-size="13" fill="#1d4ed8">status line: version &#183; code &#183; reason</text>

  <!-- headers -->
  <rect x="446" y="172" width="328" height="120" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="460" y="194" font-size="14" fill="#1a202c">Content-Type: application/json</text>
  <text x="460" y="216" font-size="14" fill="#1a202c">Content-Length: 41</text>
  <text x="460" y="238" font-size="14" fill="#1a202c">Cache-Control: no-store</text>
  <text x="460" y="284" font-size="13" fill="#1d4ed8">headers: describe the response</text>

  <!-- blank line -->
  <line x1="446" y1="306" x2="774" y2="306" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="460" y="322" font-size="13" fill="#1a202c" font-style="italic">(blank line: ends the headers)</text>

  <!-- body -->
  <rect x="446" y="334" width="328" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="460" y="366" font-size="14" font-weight="bold" fill="#1a202c">{"reply":"Hello to you</text>
  <text x="460" y="388" font-size="14" font-weight="bold" fill="#1a202c">too, client!"}</text>
  <text x="460" y="426" font-size="13" fill="#1d4ed8">body: the data you asked for</text>
</svg>
