<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Understood, not merely signed.">
  <title>Informed consent</title>
  <style>
    .medical-consent-bg   { fill: #f8fafc; }
    .medical-consent-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-consent-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-consent-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-consent-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-consent-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-consent-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medical-consent-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .medical-consent-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .medical-consent-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .medical-consent-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .medical-consent-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .medical-consent-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medical-consent-row { opacity: 1; }
    .medical-consent-r0 { animation-delay: 0.00s; }
    .medical-consent-r1 { animation-delay: 0.45s; }
    .medical-consent-r2 { animation-delay: 0.90s; }
    .medical-consent-r3 { animation-delay: 1.35s; }
    .medical-consent-r4 { animation-delay: 1.80s; }
    .medical-consent-row { animation: medical-consent-reveal 7.3s ease-in-out infinite; }
    @keyframes medical-consent-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="medical-consent-bg" width="980" height="390"/>
  <text class="medical-consent-h1"  x="30" y="40">Informed consent</text>
  <text class="medical-consent-sub" x="30" y="64">Understood, not merely signed.</text>
  <rect class="medical-consent-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="medical-consent-name" x="46" y="122">Informed</text>
  <text class="medical-consent-desc" x="46" y="142">Genuinely agreed.</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r0" x="46" y="182">The use is explained clearly</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r1" x="46" y="216">Risks are stated</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r2" x="46" y="250">Refusal is a real option</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r3" x="46" y="284">It can be withdrawn</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r4" x="46" y="318">This is meaningful consent</text>
  <rect class="medical-consent-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="medical-consent-name" x="526" y="122">Nominal</text>
  <text class="medical-consent-desc" x="526" y="142">Technically obtained.</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r0" x="526" y="182">Buried in long terms</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r1" x="526" y="216">Risks unmentioned</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r2" x="526" y="250">Refusal means no service</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r3" x="526" y="284">No withdrawal in practice</text>
  <text class="medical-consent-desc medical-consent-row medical-consent-r4" x="526" y="318">This is a signature</text>
  <text class="medical-consent-sub" x="30" y="372">Refusal not being a real option is what hollows out most consent in practice, and it is the reason legal compliance and ethical adequacy diverge.</text>
</svg>
