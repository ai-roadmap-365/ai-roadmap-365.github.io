<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Detected, negotiated, and isolated.">
  <title>Plugging in a peripheral</title>
  <style>
    .usb-analogy-bg   { fill: #f8fafc; }
    .usb-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .usb-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .usb-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .usb-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .usb-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .usb-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .usb-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .usb-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .usb-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .usb-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .usb-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .usb-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .usb-analogy-row { opacity: 1; }
    .usb-analogy-r0 { animation-delay: 0.00s; }
    .usb-analogy-r1 { animation-delay: 0.45s; }
    .usb-analogy-r2 { animation-delay: 0.90s; }
    .usb-analogy-r3 { animation-delay: 1.35s; }
    .usb-analogy-r4 { animation-delay: 1.80s; }
    .usb-analogy-row { animation: usb-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes usb-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="usb-analogy-bg" width="980" height="390"/>
  <text class="usb-analogy-h1"  x="30" y="40">Plugging in a peripheral</text>
  <text class="usb-analogy-sub" x="30" y="64">Detected, negotiated, and isolated.</text>
  <rect class="usb-analogy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="usb-analogy-name" x="46" y="122">A USB peripheral</text>
  <text class="usb-analogy-desc" x="46" y="142">Three properties.</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r0" x="46" y="182">Detected on connection, no reboot</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r1" x="46" y="216">Capabilities negotiated by the controller</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r2" x="46" y="250">A failing mouse does not crash the machine</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r3" x="46" y="284">Each device is its own thing</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r4" x="46" y="318">Unplug it and nothing else notices</text>
  <rect class="usb-analogy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="usb-analogy-name" x="526" y="122">An MCP server</text>
  <text class="usb-analogy-desc" x="526" y="142">The same three.</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r0" x="526" y="182">Discovered at client startup</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r1" x="526" y="216">Capabilities negotiated in the handshake</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r2" x="526" y="250">A crashing server does not crash the host</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r3" x="526" y="284">Each is a separate process</text>
  <text class="usb-analogy-desc usb-analogy-row usb-analogy-r4" x="526" y="318">Remove it from the config and it is gone</text>
  <text class="usb-analogy-sub" x="30" y="372">Process isolation is the property doing the work in both cases, and it is the reason a community server you have not audited is a bounded risk rather than an unbounded one.</text>
</svg>
