<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And it is what makes review hard.">
  <title>Fluency is not correctness</title>
  <style>
    .fluent-or-correct-bg   { fill: #f8fafc; }
    .fluent-or-correct-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fluent-or-correct-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fluent-or-correct-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fluent-or-correct-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fluent-or-correct-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fluent-or-correct-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fluent-or-correct-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fluent-or-correct-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fluent-or-correct-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fluent-or-correct-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fluent-or-correct-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fluent-or-correct-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fluent-or-correct-row { opacity: 1; }
    .fluent-or-correct-r0 { animation-delay: 0.00s; }
    .fluent-or-correct-r1 { animation-delay: 0.45s; }
    .fluent-or-correct-r2 { animation-delay: 0.90s; }
    .fluent-or-correct-r3 { animation-delay: 1.35s; }
    .fluent-or-correct-r4 { animation-delay: 1.80s; }
    .fluent-or-correct-row { animation: fluent-or-correct-reveal 7.3s ease-in-out infinite; }
    @keyframes fluent-or-correct-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fluent-or-correct-bg" width="980" height="390"/>
  <text class="fluent-or-correct-h1"  x="30" y="40">Fluency is not correctness</text>
  <text class="fluent-or-correct-sub" x="30" y="64">And it is what makes review hard.</text>
  <rect class="fluent-or-correct-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fluent-or-correct-name" x="46" y="122">What you see</text>
  <text class="fluent-or-correct-desc" x="46" y="142">Persuasive, and superficial.</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r0" x="46" y="182">Impeccable formatting</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r1" x="46" y="216">Fluent docstrings</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r2" x="46" y="250">Elegant type annotations</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r3" x="46" y="284">Confident explanatory comments</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r4" x="46" y="318">A passing test suite</text>
  <rect class="fluent-or-correct-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fluent-or-correct-name" x="526" y="122">What matters</text>
  <text class="fluent-or-correct-desc" x="526" y="142">None of it visible.</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r0" x="526" y="182">Algorithmic complexity</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r1" x="526" y="216">Resource cleanup in a finally block</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r2" x="526" y="250">Tenant isolation on every query</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r3" x="526" y="284">Assertions that would catch a real bug</text>
  <text class="fluent-or-correct-desc fluent-or-correct-row fluent-or-correct-r4" x="526" y="318">Dependencies that exist</text>
  <text class="fluent-or-correct-sub" x="30" y="372">You do not judge the wall by the shine of its paint: everything in the left column is real and none of it is evidence about anything in the right column.</text>
</svg>
