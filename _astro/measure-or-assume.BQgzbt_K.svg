<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them has an answer.">
  <title>Measuring drift, or assuming it away</title>
  <style>
    .measure-or-assume-bg   { fill: #f8fafc; }
    .measure-or-assume-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measure-or-assume-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measure-or-assume-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measure-or-assume-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measure-or-assume-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measure-or-assume-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .measure-or-assume-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .measure-or-assume-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .measure-or-assume-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .measure-or-assume-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .measure-or-assume-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .measure-or-assume-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .measure-or-assume-row { opacity: 1; }
    .measure-or-assume-r0 { animation-delay: 0.00s; }
    .measure-or-assume-r1 { animation-delay: 0.45s; }
    .measure-or-assume-r2 { animation-delay: 0.90s; }
    .measure-or-assume-r3 { animation-delay: 1.35s; }
    .measure-or-assume-r4 { animation-delay: 1.80s; }
    .measure-or-assume-row { animation: measure-or-assume-reveal 7.3s ease-in-out infinite; }
    @keyframes measure-or-assume-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="measure-or-assume-bg" width="980" height="390"/>
  <text class="measure-or-assume-h1"  x="30" y="40">Measuring drift, or assuming it away</text>
  <text class="measure-or-assume-sub" x="30" y="64">One of them has an answer.</text>
  <rect class="measure-or-assume-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="measure-or-assume-name" x="46" y="122">Measured</text>
  <text class="measure-or-assume-desc" x="46" y="142">Both sides enumerated.</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r0" x="46" y="182">Id and version sets from source and index</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r1" x="46" y="216">Classified over the union</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r2" x="46" y="250">Ages, not only counts</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r3" x="46" y="284">A stated target and an error budget</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r4" x="46" y="318">"p95 staleness under an hour"</text>
  <rect class="measure-or-assume-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="measure-or-assume-name" x="526" y="122">Assumed</text>
  <text class="measure-or-assume-desc" x="526" y="142">The job exited zero.</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r0" x="526" y="182">The pipeline ran last night</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r1" x="526" y="216">Nothing raised an error</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r2" x="526" y="250">No comparison performed</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r3" x="526" y="284">Orphans structurally invisible</text>
  <text class="measure-or-assume-desc measure-or-assume-row measure-or-assume-r4" x="526" y="318">"Is the index fresh?" has no answer</text>
  <text class="measure-or-assume-sub" x="30" y="372">"Is the index fresh?" is not a useful question because it has no useful answer, and replacing it with a percentile target is what forces the conversation about what freshness is actually worth.</text>
</svg>
