<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And nothing else.">
  <title>Three parts</title>
  <style>
    .arrange-act-assert-bg   { fill: #f8fafc; }
    .arrange-act-assert-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arrange-act-assert-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arrange-act-assert-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arrange-act-assert-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arrange-act-assert-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arrange-act-assert-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .arrange-act-assert-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .arrange-act-assert-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .arrange-act-assert-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .arrange-act-assert-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .arrange-act-assert-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .arrange-act-assert-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .arrange-act-assert-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .arrange-act-assert-stage { opacity: 1; }

    .arrange-act-assert-s0 { animation-delay: 0.00s; }
    .arrange-act-assert-e0 { animation-delay: 0.00s; }
    .arrange-act-assert-s1 { animation-delay: 1.50s; }
    .arrange-act-assert-e1 { animation-delay: 1.50s; }
    .arrange-act-assert-s2 { animation-delay: 3.00s; }
    .arrange-act-assert-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .arrange-act-assert-conn  { animation: arrange-act-assert-trace 6s ease-in-out infinite; }
      .arrange-act-assert-stage { animation: arrange-act-assert-arrive 6s ease-in-out infinite; }
    }
    @keyframes arrange-act-assert-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes arrange-act-assert-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .arrange-act-assert-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .arrange-act-assert-stage { animation: arrange-act-assert-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes arrange-act-assert-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="arrange-act-assert-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="arrange-act-assert-bg" width="980" height="322"/>
  <text class="arrange-act-assert-h1"  x="30" y="40">Three parts</text>
  <text class="arrange-act-assert-sub" x="30" y="64">And nothing else.</text>
  <g class="arrange-act-assert-stage arrange-act-assert-s0">
    <rect class="arrange-act-assert-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="arrange-act-assert-step" x="44" y="142">01</text>
    <text class="arrange-act-assert-name" x="70" y="142">Arrange: set up exactly what this test needs</text>
    <text class="arrange-act-assert-desc" x="44" y="166">No more.</text>
  </g>
  <line class="arrange-act-assert-line arrange-act-assert-conn arrange-act-assert-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#arrange-act-assert-tip)"/>
  <g class="arrange-act-assert-stage arrange-act-assert-s1">
    <rect class="arrange-act-assert-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="arrange-act-assert-step" x="359" y="142">02</text>
    <text class="arrange-act-assert-name" x="385" y="142">Act: perform the one operation under test</text>
    <text class="arrange-act-assert-desc" x="359" y="166">A single call, ideally.</text>
  </g>
  <line class="arrange-act-assert-line arrange-act-assert-conn arrange-act-assert-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#arrange-act-assert-tip)"/>
  <g class="arrange-act-assert-stage arrange-act-assert-s2">
    <rect class="arrange-act-assert-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="arrange-act-assert-step" x="674" y="142">03</text>
    <text class="arrange-act-assert-name" x="700" y="142">Assert: check one behaviour</text>
    <text class="arrange-act-assert-desc" x="674" y="166">A test asserting five things fails</text>
    <text class="arrange-act-assert-desc" x="674" y="182">ambiguously.</text>
  </g>
  <text class="arrange-act-assert-sub" x="30" y="304">One behaviour per test is what makes a failure diagnostic: a test with five assertions tells you something broke, and a focused one tells you what.</text>
</svg>
