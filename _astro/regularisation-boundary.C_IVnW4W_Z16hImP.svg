<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four levers.">
  <title>Controlling boundary complexity</title>
  <style>
    .regularisation-boundary-bg   { fill: #f8fafc; }
    .regularisation-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regularisation-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .regularisation-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .regularisation-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .regularisation-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .regularisation-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .regularisation-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .regularisation-boundary-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .regularisation-boundary-stage { opacity: 1; }

    .regularisation-boundary-s0 { animation-delay: 0.00s; }
    .regularisation-boundary-e0 { animation-delay: 0.00s; }
    .regularisation-boundary-s1 { animation-delay: 1.28s; }
    .regularisation-boundary-e1 { animation-delay: 1.28s; }
    .regularisation-boundary-s2 { animation-delay: 2.56s; }
    .regularisation-boundary-e2 { animation-delay: 2.56s; }
    .regularisation-boundary-s3 { animation-delay: 3.84s; }
    .regularisation-boundary-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .regularisation-boundary-conn  { animation: regularisation-boundary-trace 6.4s ease-in-out infinite; }
      .regularisation-boundary-stage { animation: regularisation-boundary-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes regularisation-boundary-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes regularisation-boundary-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .regularisation-boundary-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .regularisation-boundary-stage { animation: regularisation-boundary-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes regularisation-boundary-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="regularisation-boundary-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="regularisation-boundary-bg" width="980" height="322"/>
  <text class="regularisation-boundary-h1"  x="30" y="40">Controlling boundary complexity</text>
  <text class="regularisation-boundary-sub" x="30" y="64">Four levers.</text>
  <g class="regularisation-boundary-stage regularisation-boundary-s0">
    <rect class="regularisation-boundary-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="regularisation-boundary-step" x="44" y="142">01</text>
    <text class="regularisation-boundary-name" x="70" y="142">How many features, and of what degree</text>
    <text class="regularisation-boundary-desc" x="44" y="166">Each polynomial term adds</text>
    <text class="regularisation-boundary-desc" x="44" y="182">curvature.</text>
  </g>
  <line class="regularisation-boundary-line regularisation-boundary-conn regularisation-boundary-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#regularisation-boundary-tip)"/>
  <g class="regularisation-boundary-stage regularisation-boundary-s1">
    <rect class="regularisation-boundary-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="regularisation-boundary-step" x="280" y="142">02</text>
    <text class="regularisation-boundary-name" x="306" y="142">How strongly coefficients are penalised</text>
    <text class="regularisation-boundary-desc" x="280" y="166">Which smooths the boundary.</text>
  </g>
  <line class="regularisation-boundary-line regularisation-boundary-conn regularisation-boundary-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#regularisation-boundary-tip)"/>
  <g class="regularisation-boundary-stage regularisation-boundary-s2">
    <rect class="regularisation-boundary-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="regularisation-boundary-step" x="516" y="142">03</text>
    <text class="regularisation-boundary-name" x="542" y="142">Which model class is used at all</text>
    <text class="regularisation-boundary-desc" x="516" y="166">Some cannot draw a complex</text>
    <text class="regularisation-boundary-desc" x="516" y="182">boundary regardless.</text>
  </g>
  <line class="regularisation-boundary-line regularisation-boundary-conn regularisation-boundary-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#regularisation-boundary-tip)"/>
  <g class="regularisation-boundary-stage regularisation-boundary-s3">
    <rect class="regularisation-boundary-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="regularisation-boundary-step" x="752" y="142">04</text>
    <text class="regularisation-boundary-name" x="778" y="142">And validation, which decides all three</text>
    <text class="regularisation-boundary-desc" x="752" y="166">Rather than intuition about what</text>
    <text class="regularisation-boundary-desc" x="752" y="182">looks right.</text>
  </g>
  <text class="regularisation-boundary-sub" x="30" y="304">Validation deciding rather than intuition is the discipline: a boundary that looks right in a two-dimensional plot may be badly wrong in the dimensions not shown.</text>
</svg>
