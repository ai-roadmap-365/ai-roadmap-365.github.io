<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three real lines, hidden in four hundred.">
  <title>Why a shared formatting file matters</title>
  <style>
    .formatting-diff-noise-bg   { fill: #f8fafc; }
    .formatting-diff-noise-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formatting-diff-noise-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formatting-diff-noise-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formatting-diff-noise-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formatting-diff-noise-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formatting-diff-noise-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .formatting-diff-noise-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .formatting-diff-noise-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .formatting-diff-noise-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .formatting-diff-noise-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .formatting-diff-noise-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .formatting-diff-noise-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .formatting-diff-noise-row { opacity: 1; }
    .formatting-diff-noise-r0 { animation-delay: 0.00s; }
    .formatting-diff-noise-r1 { animation-delay: 0.45s; }
    .formatting-diff-noise-r2 { animation-delay: 0.90s; }
    .formatting-diff-noise-r3 { animation-delay: 1.35s; }
    .formatting-diff-noise-r4 { animation-delay: 1.80s; }
    .formatting-diff-noise-row { animation: formatting-diff-noise-reveal 7.3s ease-in-out infinite; }
    @keyframes formatting-diff-noise-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="formatting-diff-noise-bg" width="980" height="390"/>
  <text class="formatting-diff-noise-h1"  x="30" y="40">Why a shared formatting file matters</text>
  <text class="formatting-diff-noise-sub" x="30" y="64">Three real lines, hidden in four hundred.</text>
  <rect class="formatting-diff-noise-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="formatting-diff-noise-name" x="46" y="122">Everyone formats differently</text>
  <text class="formatting-diff-noise-desc" x="46" y="142">The diff is unreadable.</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r0" x="46" y="182">400 changed lines, 3 of them real</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r1" x="46" y="216">Reviewers skim, and miss the 3</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r2" x="46" y="250">Merge conflicts on lines nobody touched</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r3" x="46" y="284">Arguments about tabs, recurring</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r4" x="46" y="318">Every editor "fixes" the previous one</text>
  <rect class="formatting-diff-noise-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="formatting-diff-noise-name" x="526" y="122">.editorconfig plus format on save</text>
  <text class="formatting-diff-noise-desc" x="526" y="142">The diff is the change.</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r0" x="526" y="182">3 changed lines, all of them real</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r1" x="526" y="216">Reviewers read all of it</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r2" x="526" y="250">Conflicts only where work overlapped</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r3" x="526" y="284">The argument happened once</text>
  <text class="formatting-diff-noise-desc formatting-diff-noise-row formatting-diff-noise-r4" x="526" y="318">Any editor produces the same output</text>
  <text class="formatting-diff-noise-sub" x="30" y="372">This is the highest-return configuration in the lesson and the one most often left to individual preference, which is exactly why the problem is so common.</text>
</svg>
