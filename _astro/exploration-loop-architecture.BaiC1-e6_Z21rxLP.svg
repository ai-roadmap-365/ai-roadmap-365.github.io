<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img" aria-labelledby="d136aTitleId d136aDescId">
  <title id="d136aTitleId">The exploratory loop, a sealed confirmation set opened once, and a growing research log</title>
  <desc id="d136aDescId">A three-stage cycle -- ask a question, take a look, refine the question -- loops back on itself on the left. A sealed confirmation set sits to the right, connected by one arrow labelled "opened once, when a hypothesis is chosen." Beneath both, a research log accumulates dated rows, most marked as a null outcome.</desc>

  <style>
    .d136a-bg     { fill: #f8fafc; }
    .d136a-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d136a-sub    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #475569; }
    .d136a-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d136a-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d136a-tiny   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #64748b; }
    .d136a-loopbox { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d136a-sealbox  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .d136a-logbox   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d136a-arrow    { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d136a-arrowred { stroke: #b91c1c; stroke-width: 2.5; fill: none; stroke-dasharray: 6 5; }
    .d136a-panel  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .d136a-null   { fill: #94a3b8; }
    .d136a-found  { fill: #047857; }
  </style>

  <rect class="d136a-bg" x="0" y="0" width="980" height="700" />

  <text class="d136a-title" x="32" y="42">The exploratory loop, a sealed confirmation set, and a growing log</text>
  <text class="d136a-sub" x="32" y="66">Most cycles of the loop find nothing. That is the normal texture of the work, not a failure.</text>

  <defs>
    <marker id="d136a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d136a-arrowhead-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
  </defs>

  <!-- === The three-stage loop, left side === -->
  <rect class="d136a-loopbox" x="90" y="120" width="200" height="80" rx="10" />
  <text class="d136a-label" x="190" y="152" text-anchor="middle">1. Ask a question</text>
  <text class="d136a-tiny" x="190" y="172" text-anchor="middle">a specific, answerable one</text>

  <rect class="d136a-loopbox" x="330" y="260" width="200" height="80" rx="10" />
  <text class="d136a-label" x="430" y="292" text-anchor="middle">2. Take a look</text>
  <text class="d136a-tiny" x="430" y="312" text-anchor="middle">groupby, filter, plot</text>

  <rect class="d136a-loopbox" x="90" y="400" width="200" height="80" rx="10" />
  <text class="d136a-label" x="190" y="432" text-anchor="middle">3. Refine the question</text>
  <text class="d136a-tiny" x="190" y="452" text-anchor="middle">sharpen, narrow, or drop it</text>

  <!-- loop arrows -->
  <path class="d136a-arrow" marker-end="url(#d136a-arrowhead)"
        d="M 270 190 C 320 220, 350 230, 380 258" />
  <path class="d136a-arrow" marker-end="url(#d136a-arrowhead)"
        d="M 370 340 C 320 370, 290 380, 250 398" />
  <path class="d136a-arrow" marker-end="url(#d136a-arrowhead)"
        d="M 170 398 C 130 340, 130 260, 170 202" />
  <text class="d136a-tiny" x="130" y="300" text-anchor="middle">most looks</text>
  <text class="d136a-tiny" x="130" y="316" text-anchor="middle">find nothing --</text>
  <text class="d136a-tiny" x="130" y="332" text-anchor="middle">loop continues</text>

  <!-- occasional finding, breaks toward the seal -->
  <path class="d136a-arrowred" marker-end="url(#d136a-arrowhead-red)"
        d="M 530 300 C 650 300, 700 260, 740 220" />
  <text class="d136a-small" x="545" y="240" text-anchor="middle" style="font-style: italic;">occasionally, something</text>
  <text class="d136a-small" x="545" y="258" text-anchor="middle" style="font-style: italic;">looks interesting</text>

  <!-- === The sealed confirmation set, right side === -->
  <rect class="d136a-sealbox" x="740" y="120" width="200" height="110" rx="10" />
  <text x="840" y="155" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#b91c1c">&#128274;</text>
  <text class="d136a-label" x="840" y="185" text-anchor="middle">Confirmation set</text>
  <text class="d136a-tiny" x="840" y="204" text-anchor="middle">sealed at the start</text>
  <text class="d136a-tiny" x="840" y="220" text-anchor="middle">untouched until a hypothesis exists</text>

  <text class="d136a-small" x="840" y="255" text-anchor="middle">opened once, when a hypothesis is chosen</text>

  <!-- result of the single check -->
  <path class="d136a-arrow" marker-end="url(#d136a-arrowhead)"
        d="M 840 232 L 840 300" />
  <rect class="d136a-panel" x="720" y="300" width="240" height="70" rx="10" />
  <text class="d136a-small" x="840" y="326" text-anchor="middle">survives &#8594; worth reporting (Day 133)</text>
  <text class="d136a-small" x="840" y="348" text-anchor="middle">fails &#8594; a shape in the noise</text>

  <!-- === The research log, beneath both === -->
  <text class="d136a-label" x="32" y="530">Research log -- accumulates beneath every cycle of the loop</text>
  <rect class="d136a-panel" x="32" y="546" width="908" height="130" rx="10" />

  <text class="d136a-tiny" x="52" y="570">timestamp</text>
  <text class="d136a-tiny" x="230" y="570">question</text>
  <text class="d136a-tiny" x="560" y="570">look</text>
  <text class="d136a-tiny" x="760" y="570">outcome</text>
  <line x1="52" y1="578" x2="920" y2="578" stroke="#cbd5e1" stroke-width="1" />

  <circle class="d136a-null" cx="60" cy="600" r="4" />
  <text class="d136a-small" x="74" y="604">09:00</text>
  <text class="d136a-small" x="230" y="604">does revenue differ by region?</text>
  <text class="d136a-small" x="560" y="604">groupby, compare means</text>
  <text class="d136a-small" x="760" y="604">null -- nothing found</text>

  <circle class="d136a-null" cx="60" cy="625" r="4" />
  <text class="d136a-small" x="74" y="629">09:15</text>
  <text class="d136a-small" x="230" y="629">does revenue differ by signup weekday?</text>
  <text class="d136a-small" x="560" y="629">groupby, compare means</text>
  <text class="d136a-small" x="760" y="629">null -- nothing found</text>

  <circle class="d136a-found" cx="60" cy="650" r="4" />
  <text class="d136a-small" x="74" y="654">09:40</text>
  <text class="d136a-small" x="230" y="654">do older customers use fewer sessions?</text>
  <text class="d136a-small" x="560" y="654">two-sample z-test</text>
  <text class="d136a-small" x="760" y="654">p=0.0059, d=0.61 -- exploration only</text>

  <text class="d136a-tiny" x="52" y="672">... the log's own length is the true comparison count</text>
</svg>
