<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And one canary decides the third.">
  <title>The circuit breaker's three states</title>
  <style>
    .circuit-states-bg   { fill: #f8fafc; }
    .circuit-states-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-states-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-states-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-states-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-states-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-states-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .circuit-states-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .circuit-states-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .circuit-states-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .circuit-states-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .circuit-states-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .circuit-states-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .circuit-states-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .circuit-states-stage { opacity: 1; }

    .circuit-states-s0 { animation-delay: 0.00s; }
    .circuit-states-e0 { animation-delay: 0.00s; }
    .circuit-states-s1 { animation-delay: 1.28s; }
    .circuit-states-e1 { animation-delay: 1.28s; }
    .circuit-states-s2 { animation-delay: 2.56s; }
    .circuit-states-e2 { animation-delay: 2.56s; }
    .circuit-states-s3 { animation-delay: 3.84s; }
    .circuit-states-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .circuit-states-conn  { animation: circuit-states-trace 6.4s ease-in-out infinite; }
      .circuit-states-stage { animation: circuit-states-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes circuit-states-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes circuit-states-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .circuit-states-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .circuit-states-stage { animation: circuit-states-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes circuit-states-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="circuit-states-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="circuit-states-bg" width="980" height="322"/>
  <text class="circuit-states-h1"  x="30" y="40">The circuit breaker's three states</text>
  <text class="circuit-states-sub" x="30" y="64">And one canary decides the third.</text>
  <g class="circuit-states-stage circuit-states-s0">
    <rect class="circuit-states-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="circuit-states-step" x="44" y="142">01</text>
    <text class="circuit-states-name" x="70" y="142">CLOSED: healthy</text>
    <text class="circuit-states-desc" x="44" y="166">All traffic forwarded. Readiness</text>
    <text class="circuit-states-desc" x="44" y="182">returns 200.</text>
  </g>
  <line class="circuit-states-line circuit-states-conn circuit-states-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#circuit-states-tip)"/>
  <g class="circuit-states-stage circuit-states-s1">
    <rect class="circuit-states-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="circuit-states-step" x="280" y="142">02</text>
    <text class="circuit-states-name" x="306" y="142">Five consecutive errors: trip</text>
    <text class="circuit-states-desc" x="280" y="166">The circuit opens.</text>
  </g>
  <line class="circuit-states-line circuit-states-conn circuit-states-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#circuit-states-tip)"/>
  <g class="circuit-states-stage circuit-states-s2">
    <rect class="circuit-states-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="circuit-states-step" x="516" y="142">03</text>
    <text class="circuit-states-name" x="542" y="142">OPEN: fail fast</text>
    <text class="circuit-states-desc" x="516" y="166">Zero traffic forwarded. An</text>
    <text class="circuit-states-desc" x="516" y="182">immediate fallback, at 0 ms.</text>
    <text class="circuit-states-desc" x="516" y="198">Cooldown 30s.</text>
    <text class="circuit-states-edge" x="516" y="242">no waiting</text>
  </g>
  <line class="circuit-states-line circuit-states-conn circuit-states-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#circuit-states-tip)"/>
  <g class="circuit-states-stage circuit-states-s3">
    <rect class="circuit-states-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="circuit-states-step" x="752" y="142">04</text>
    <text class="circuit-states-name" x="778" y="142">HALF-OPEN: one canary</text>
    <text class="circuit-states-desc" x="752" y="166">Succeeds, reset to CLOSED.</text>
    <text class="circuit-states-desc" x="752" y="182">Fails, re-trip for another 30</text>
    <text class="circuit-states-desc" x="752" y="198">seconds.</text>
    <text class="circuit-states-edge" x="752" y="242">one request</text>
  </g>
  <text class="circuit-states-sub" x="30" y="304">Failing fast is the part that is counter-intuitive and the part that matters: continuing to forward requests to a dead backend converts one failure into a queue of timeouts across every client waiting on it.</text>
</svg>
