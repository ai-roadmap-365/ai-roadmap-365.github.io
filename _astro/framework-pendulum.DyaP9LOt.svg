<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Gold rush, then a return to simplicity.">
  <title>The framework pendulum</title>
  <style>
    .framework-pendulum-bg   { fill: #f8fafc; }
    .framework-pendulum-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-pendulum-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-pendulum-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-pendulum-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-pendulum-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-pendulum-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .framework-pendulum-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .framework-pendulum-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .framework-pendulum-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .framework-pendulum-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .framework-pendulum-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .framework-pendulum-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .framework-pendulum-row { opacity: 1; }
    .framework-pendulum-r0 { animation-delay: 0.00s; }
    .framework-pendulum-r1 { animation-delay: 0.45s; }
    .framework-pendulum-r2 { animation-delay: 0.90s; }
    .framework-pendulum-r3 { animation-delay: 1.35s; }
    .framework-pendulum-r4 { animation-delay: 1.80s; }
    .framework-pendulum-row { animation: framework-pendulum-reveal 7.3s ease-in-out infinite; }
    @keyframes framework-pendulum-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="framework-pendulum-bg" width="980" height="390"/>
  <text class="framework-pendulum-h1"  x="30" y="40">The framework pendulum</text>
  <text class="framework-pendulum-sub" x="30" y="64">Gold rush, then a return to simplicity.</text>
  <rect class="framework-pendulum-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="framework-pendulum-name" x="46" y="122">The gold rush, 2022-2023</text>
  <text class="framework-pendulum-desc" x="46" y="142">Universal wrappers.</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r0" x="46" y="182">Every vector store and provider wrapped</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r1" x="46" y="216">Breaking changes across minor releases</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r2" x="46" y="250">Undocumented prompt mutations</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r3" x="46" y="284">Latency overhead nobody could locate</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r4" x="46" y="318">Debugging meant reading library internals</text>
  <rect class="framework-pendulum-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="framework-pendulum-name" x="526" y="122">Back to simplicity, 2024</text>
  <text class="framework-pendulum-desc" x="526" y="142">Composable loops.</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r0" x="526" y="182">Explicit prompt formatting</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r1" x="526" y="216">Native tool-calling APIs</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r2" x="526" y="250">Simple, composable Python</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r3" x="526" y="284">Anthropic's own published guidance</text>
  <text class="framework-pendulum-desc framework-pendulum-row framework-pendulum-r4" x="526" y="318">Reliability from having less machinery</text>
  <text class="framework-pendulum-sub" x="30" y="372">The pendulum is a familiar shape from web frameworks, and it usually settles somewhere in between: the useful conclusion is not that frameworks are bad, but that you should know what one is doing before adopting it.</text>
</svg>
