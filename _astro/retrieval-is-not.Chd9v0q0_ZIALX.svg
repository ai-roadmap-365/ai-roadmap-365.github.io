<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It selects; it does not decide.">
  <title>What retrieval does not do</title>
  <style>
    .retrieval-is-not-bg   { fill: #f8fafc; }
    .retrieval-is-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-is-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-is-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-is-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-is-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-is-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retrieval-is-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retrieval-is-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retrieval-is-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retrieval-is-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retrieval-is-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retrieval-is-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retrieval-is-not-row { opacity: 1; }
    .retrieval-is-not-r0 { animation-delay: 0.00s; }
    .retrieval-is-not-r1 { animation-delay: 0.45s; }
    .retrieval-is-not-r2 { animation-delay: 0.90s; }
    .retrieval-is-not-r3 { animation-delay: 1.35s; }
    .retrieval-is-not-r4 { animation-delay: 1.80s; }
    .retrieval-is-not-row { animation: retrieval-is-not-reveal 7.3s ease-in-out infinite; }
    @keyframes retrieval-is-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="retrieval-is-not-bg" width="980" height="390"/>
  <text class="retrieval-is-not-h1"  x="30" y="40">What retrieval does not do</text>
  <text class="retrieval-is-not-sub" x="30" y="64">It selects; it does not decide.</text>
  <rect class="retrieval-is-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="retrieval-is-not-name" x="46" y="122">Retrieval owns</text>
  <text class="retrieval-is-not-desc" x="46" y="142">Getting the right passages here.</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r0" x="46" y="182">Chunking and embedding</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r1" x="46" y="216">Recall: is the answer in the shortlist?</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r2" x="46" y="250">Precision: is it near the top?</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r3" x="46" y="284">Latency inside its slice of the budget</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r4" x="46" y="318">A measurable score of its own</text>
  <rect class="retrieval-is-not-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="retrieval-is-not-name" x="526" y="122">Retrieval does not own</text>
  <text class="retrieval-is-not-desc" x="526" y="142">Downstream concerns.</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r0" x="526" y="182">Whether the model uses the passage</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r1" x="526" y="216">Whether the answer is phrased well</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r2" x="526" y="250">Whether the claim is cited</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r3" x="526" y="284">Whether the user's question made sense</text>
  <text class="retrieval-is-not-desc retrieval-is-not-row retrieval-is-not-r4" x="526" y="318">Those are separate, separately measured</text>
  <text class="retrieval-is-not-sub" x="30" y="372">Keeping the boundary sharp is what lets you diagnose: a bad answer is either a retrieval failure or a generation failure, and the RAG-triad evaluation on Day 356 exists to tell them apart.</text>
</svg>
