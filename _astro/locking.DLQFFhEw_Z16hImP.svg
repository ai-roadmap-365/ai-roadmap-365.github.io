<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Locking, and the failure it prevents</title>
  <style>
    .locking-bg   { fill: #f8fafc; }
    .locking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .locking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .locking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .locking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .locking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .locking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .locking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .locking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .locking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .locking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .locking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .locking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .locking-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .locking-stage { opacity: 1; }

    .locking-s0 { animation-delay: 0.00s; }
    .locking-e0 { animation-delay: 0.00s; }
    .locking-s1 { animation-delay: 1.28s; }
    .locking-e1 { animation-delay: 1.28s; }
    .locking-s2 { animation-delay: 2.56s; }
    .locking-e2 { animation-delay: 2.56s; }
    .locking-s3 { animation-delay: 3.84s; }
    .locking-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .locking-conn  { animation: locking-trace 6.4s ease-in-out infinite; }
      .locking-stage { animation: locking-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes locking-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes locking-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .locking-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .locking-stage { animation: locking-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes locking-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="locking-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="locking-bg" width="980" height="322"/>
  <text class="locking-h1"  x="30" y="40">Locking, and the failure it prevents</text>
  <text class="locking-sub" x="30" y="64">Four steps.</text>
  <g class="locking-stage locking-s0">
    <rect class="locking-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="locking-step" x="44" y="142">01</text>
    <text class="locking-name" x="70" y="142">A run that takes longer than its interval overlaps the next</text>
    <text class="locking-desc" x="44" y="166">Which schedulers do not prevent.</text>
  </g>
  <line class="locking-line locking-conn locking-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#locking-tip)"/>
  <g class="locking-stage locking-s1">
    <rect class="locking-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="locking-step" x="280" y="142">02</text>
    <text class="locking-name" x="306" y="142">So two runs write the same output at once</text>
    <text class="locking-desc" x="280" y="166">Producing a file that is</text>
    <text class="locking-desc" x="280" y="182">neither.</text>
  </g>
  <line class="locking-line locking-conn locking-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#locking-tip)"/>
  <g class="locking-stage locking-s2">
    <rect class="locking-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="locking-step" x="516" y="142">03</text>
    <text class="locking-name" x="542" y="142">A lock makes the second run exit immediately</text>
    <text class="locking-desc" x="516" y="166">Which is the correct behaviour.</text>
  </g>
  <line class="locking-line locking-conn locking-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#locking-tip)"/>
  <g class="locking-stage locking-s3">
    <rect class="locking-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="locking-step" x="752" y="142">04</text>
    <text class="locking-name" x="778" y="142">But a crashed run can leave a stale lock</text>
    <text class="locking-desc" x="752" y="166">So the lock needs an expiry.</text>
  </g>
  <text class="locking-sub" x="30" y="304">The stale lock is the failure that follows from adding locking naively: a crashed job blocks every subsequent run until someone notices.</text>
</svg>
