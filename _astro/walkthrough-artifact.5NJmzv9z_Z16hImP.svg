<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="What a reviewer needs before the diff.">
  <title>The walkthrough artefact</title>
  <style>
    .walkthrough-artifact-bg   { fill: #f8fafc; }
    .walkthrough-artifact-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .walkthrough-artifact-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .walkthrough-artifact-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .walkthrough-artifact-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .walkthrough-artifact-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .walkthrough-artifact-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .walkthrough-artifact-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .walkthrough-artifact-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .walkthrough-artifact-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .walkthrough-artifact-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .walkthrough-artifact-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .walkthrough-artifact-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .walkthrough-artifact-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .walkthrough-artifact-stage { opacity: 1; }

    .walkthrough-artifact-s0 { animation-delay: 0.00s; }
    .walkthrough-artifact-e0 { animation-delay: 0.00s; }
    .walkthrough-artifact-s1 { animation-delay: 1.28s; }
    .walkthrough-artifact-e1 { animation-delay: 1.28s; }
    .walkthrough-artifact-s2 { animation-delay: 2.56s; }
    .walkthrough-artifact-e2 { animation-delay: 2.56s; }
    .walkthrough-artifact-s3 { animation-delay: 3.84s; }
    .walkthrough-artifact-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .walkthrough-artifact-conn  { animation: walkthrough-artifact-trace 6.4s ease-in-out infinite; }
      .walkthrough-artifact-stage { animation: walkthrough-artifact-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes walkthrough-artifact-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes walkthrough-artifact-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .walkthrough-artifact-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .walkthrough-artifact-stage { animation: walkthrough-artifact-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes walkthrough-artifact-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="walkthrough-artifact-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="walkthrough-artifact-bg" width="980" height="322"/>
  <text class="walkthrough-artifact-h1"  x="30" y="40">The walkthrough artefact</text>
  <text class="walkthrough-artifact-sub" x="30" y="64">What a reviewer needs before the diff.</text>
  <g class="walkthrough-artifact-stage walkthrough-artifact-s0">
    <rect class="walkthrough-artifact-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="walkthrough-artifact-step" x="44" y="142">01</text>
    <text class="walkthrough-artifact-name" x="70" y="142">Architectural intent</text>
    <text class="walkthrough-artifact-desc" x="44" y="166">Why these changes, and how they</text>
    <text class="walkthrough-artifact-desc" x="44" y="182">fit. Not what changed — the diff</text>
    <text class="walkthrough-artifact-desc" x="44" y="198">shows that.</text>
  </g>
  <line class="walkthrough-artifact-line walkthrough-artifact-conn walkthrough-artifact-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#walkthrough-artifact-tip)"/>
  <g class="walkthrough-artifact-stage walkthrough-artifact-s1">
    <rect class="walkthrough-artifact-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="walkthrough-artifact-step" x="280" y="142">02</text>
    <text class="walkthrough-artifact-name" x="306" y="142">A file table</text>
    <text class="walkthrough-artifact-desc" x="280" y="166">Every file touched and the</text>
    <text class="walkthrough-artifact-desc" x="280" y="182">reason, so nothing is a</text>
    <text class="walkthrough-artifact-desc" x="280" y="198">surprise.</text>
  </g>
  <line class="walkthrough-artifact-line walkthrough-artifact-conn walkthrough-artifact-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#walkthrough-artifact-tip)"/>
  <g class="walkthrough-artifact-stage walkthrough-artifact-s2">
    <rect class="walkthrough-artifact-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="walkthrough-artifact-step" x="516" y="142">03</text>
    <text class="walkthrough-artifact-name" x="542" y="142">Test evidence</text>
    <text class="walkthrough-artifact-desc" x="516" y="166">The suite, the new cases, and</text>
    <text class="walkthrough-artifact-desc" x="516" y="182">the output.</text>
  </g>
  <line class="walkthrough-artifact-line walkthrough-artifact-conn walkthrough-artifact-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#walkthrough-artifact-tip)"/>
  <g class="walkthrough-artifact-stage walkthrough-artifact-s3">
    <rect class="walkthrough-artifact-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="walkthrough-artifact-step" x="752" y="142">04</text>
    <text class="walkthrough-artifact-name" x="778" y="142">A rollback plan</text>
    <text class="walkthrough-artifact-desc" x="752" y="166">Because production traffic finds</text>
    <text class="walkthrough-artifact-desc" x="752" y="182">edge cases the tests did not.</text>
  </g>
  <text class="walkthrough-artifact-sub" x="30" y="304">Reducing review cycle time from days to minutes is the claim, and the mechanism is straightforward: a reviewer who understands the intent before opening the diff reads it once instead of reconstructing it.</text>
</svg>
