<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Ratios multiply.">
  <title>A train of gears</title>
  <style>
    .gear-train-bg   { fill: #f8fafc; }
    .gear-train-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gear-train-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gear-train-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gear-train-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gear-train-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gear-train-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gear-train-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gear-train-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gear-train-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gear-train-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gear-train-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gear-train-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gear-train-row { opacity: 1; }
    .gear-train-r0 { animation-delay: 0.00s; }
    .gear-train-r1 { animation-delay: 0.45s; }
    .gear-train-r2 { animation-delay: 0.90s; }
    .gear-train-r3 { animation-delay: 1.35s; }
    .gear-train-r4 { animation-delay: 1.80s; }
    .gear-train-row { animation: gear-train-reveal 7.3s ease-in-out infinite; }
    @keyframes gear-train-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gear-train-bg" width="980" height="390"/>
  <text class="gear-train-h1"  x="30" y="40">A train of gears</text>
  <text class="gear-train-sub" x="30" y="64">Ratios multiply.</text>
  <rect class="gear-train-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gear-train-name" x="46" y="122">Ratios multiply</text>
  <text class="gear-train-desc" x="46" y="142">What actually happens.</text>
  <text class="gear-train-desc gear-train-row gear-train-r0" x="46" y="182">Each gear pair has a ratio</text>
  <text class="gear-train-desc gear-train-row gear-train-r1" x="46" y="216">The overall ratio is their product</text>
  <text class="gear-train-desc gear-train-row gear-train-r2" x="46" y="250">A chain of reductions reduces sharply</text>
  <text class="gear-train-desc gear-train-row gear-train-r3" x="46" y="284">Reverse the input, reverse the output</text>
  <text class="gear-train-desc gear-train-row gear-train-r4" x="46" y="318">This is the chain rule</text>
  <rect class="gear-train-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gear-train-name" x="526" y="122">If they added</text>
  <text class="gear-train-desc" x="526" y="142">They do not.</text>
  <text class="gear-train-desc gear-train-row gear-train-r0" x="526" y="182">Overall ratio would be a sum</text>
  <text class="gear-train-desc gear-train-row gear-train-r1" x="526" y="216">Long chains would barely change anything</text>
  <text class="gear-train-desc gear-train-row gear-train-r2" x="526" y="250">Reductions would not compound</text>
  <text class="gear-train-desc gear-train-row gear-train-r3" x="526" y="284">This is the common wrong intuition</text>
  <text class="gear-train-desc gear-train-row gear-train-r4" x="526" y="318">And it hides why depth is hard</text>
  <text class="gear-train-sub" x="30" y="372">The gear picture also explains vanishing gradients directly: chain enough reductions together and the final shaft barely turns at all.</text>
</svg>
