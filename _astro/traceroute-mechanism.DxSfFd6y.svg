<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="It deliberately sends packets that will not arrive.">
  <title>How traceroute sees routers that never introduce themselves</title>
  <style>
    .traceroute-mechanism-bg   { fill: #f8fafc; }
    .traceroute-mechanism-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceroute-mechanism-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceroute-mechanism-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceroute-mechanism-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceroute-mechanism-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceroute-mechanism-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .traceroute-mechanism-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .traceroute-mechanism-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .traceroute-mechanism-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .traceroute-mechanism-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .traceroute-mechanism-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .traceroute-mechanism-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .traceroute-mechanism-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .traceroute-mechanism-stage { opacity: 1; }

    .traceroute-mechanism-s0 { animation-delay: 0.00s; }
    .traceroute-mechanism-e0 { animation-delay: 0.00s; }
    .traceroute-mechanism-s1 { animation-delay: 1.28s; }
    .traceroute-mechanism-e1 { animation-delay: 1.28s; }
    .traceroute-mechanism-s2 { animation-delay: 2.56s; }
    .traceroute-mechanism-e2 { animation-delay: 2.56s; }
    .traceroute-mechanism-s3 { animation-delay: 3.84s; }
    .traceroute-mechanism-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .traceroute-mechanism-conn  { animation: traceroute-mechanism-trace 6.4s ease-in-out infinite; }
      .traceroute-mechanism-stage { animation: traceroute-mechanism-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes traceroute-mechanism-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes traceroute-mechanism-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .traceroute-mechanism-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .traceroute-mechanism-stage { animation: traceroute-mechanism-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes traceroute-mechanism-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="traceroute-mechanism-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="traceroute-mechanism-bg" width="980" height="322"/>
  <text class="traceroute-mechanism-h1"  x="30" y="40">How traceroute sees routers that never introduce themselves</text>
  <text class="traceroute-mechanism-sub" x="30" y="64">It deliberately sends packets that will not arrive.</text>
  <g class="traceroute-mechanism-stage traceroute-mechanism-s0">
    <rect class="traceroute-mechanism-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="traceroute-mechanism-step" x="44" y="142">01</text>
    <text class="traceroute-mechanism-name" x="70" y="142">Send with hop limit 1</text>
    <text class="traceroute-mechanism-desc" x="44" y="166">The first router decrements it</text>
    <text class="traceroute-mechanism-desc" x="44" y="182">to zero, discards the packet,</text>
    <text class="traceroute-mechanism-desc" x="44" y="198">and reports the error.</text>
    <text class="traceroute-mechanism-edge" x="44" y="242">hop 1</text>
  </g>
  <line class="traceroute-mechanism-line traceroute-mechanism-conn traceroute-mechanism-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#traceroute-mechanism-tip)"/>
  <g class="traceroute-mechanism-stage traceroute-mechanism-s1">
    <rect class="traceroute-mechanism-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="traceroute-mechanism-step" x="280" y="142">02</text>
    <text class="traceroute-mechanism-name" x="306" y="142">Send with hop limit 2</text>
    <text class="traceroute-mechanism-desc" x="280" y="166">Expires at the second router,</text>
    <text class="traceroute-mechanism-desc" x="280" y="182">which identifies itself the same</text>
    <text class="traceroute-mechanism-desc" x="280" y="198">way.</text>
    <text class="traceroute-mechanism-edge" x="280" y="242">hop 2</text>
  </g>
  <line class="traceroute-mechanism-line traceroute-mechanism-conn traceroute-mechanism-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#traceroute-mechanism-tip)"/>
  <g class="traceroute-mechanism-stage traceroute-mechanism-s2">
    <rect class="traceroute-mechanism-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="traceroute-mechanism-step" x="516" y="142">03</text>
    <text class="traceroute-mechanism-name" x="542" y="142">Keep incrementing</text>
    <text class="traceroute-mechanism-desc" x="516" y="166">Each packet dies one router</text>
    <text class="traceroute-mechanism-desc" x="516" y="182">further along, naming that</text>
    <text class="traceroute-mechanism-desc" x="516" y="198">router.</text>
  </g>
  <line class="traceroute-mechanism-line traceroute-mechanism-conn traceroute-mechanism-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#traceroute-mechanism-tip)"/>
  <g class="traceroute-mechanism-stage traceroute-mechanism-s3">
    <rect class="traceroute-mechanism-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="traceroute-mechanism-step" x="752" y="142">04</text>
    <text class="traceroute-mechanism-name" x="778" y="142">Until one arrives</text>
    <text class="traceroute-mechanism-desc" x="752" y="166">The destination answers</text>
    <text class="traceroute-mechanism-desc" x="752" y="182">differently, and the trace ends.</text>
    <text class="traceroute-mechanism-edge" x="752" y="242">arrived</text>
  </g>
  <text class="traceroute-mechanism-sub" x="30" y="304">The hop limit field is also called TTL, which is a different thing entirely from the DNS TTL. Same name, unrelated jobs — a genuine source of confusion.</text>
</svg>
