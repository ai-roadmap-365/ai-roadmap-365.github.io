<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each one moved where the difficulty lives.">
  <title>Three eras of what counted as an AI project</title>
  <style>
    .scope-three-eras-bg   { fill: #f8fafc; }
    .scope-three-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-three-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-three-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-three-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-three-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-three-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-three-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scope-three-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scope-three-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scope-three-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scope-three-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scope-three-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scope-three-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scope-three-eras-stage { opacity: 1; }

    .scope-three-eras-s0 { animation-delay: 0.00s; }
    .scope-three-eras-e0 { animation-delay: 0.00s; }
    .scope-three-eras-s1 { animation-delay: 1.50s; }
    .scope-three-eras-e1 { animation-delay: 1.50s; }
    .scope-three-eras-s2 { animation-delay: 3.00s; }
    .scope-three-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .scope-three-eras-conn  { animation: scope-three-eras-trace 6s ease-in-out infinite; }
      .scope-three-eras-stage { animation: scope-three-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes scope-three-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scope-three-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scope-three-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scope-three-eras-stage { animation: scope-three-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scope-three-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scope-three-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scope-three-eras-bg" width="980" height="322"/>
  <text class="scope-three-eras-h1"  x="30" y="40">Three eras of what counted as an AI project</text>
  <text class="scope-three-eras-sub" x="30" y="64">Each one moved where the difficulty lives.</text>
  <g class="scope-three-eras-stage scope-three-eras-s0">
    <rect class="scope-three-eras-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="scope-three-eras-step" x="44" y="142">01</text>
    <text class="scope-three-eras-name" x="70" y="142">Algorithm-only, 2015-2020</text>
    <text class="scope-three-eras-desc" x="44" y="166">The model WAS the project. Training a</text>
    <text class="scope-three-eras-desc" x="44" y="182">classifier was the achievement.</text>
    <text class="scope-three-eras-edge" x="44" y="242">the model</text>
  </g>
  <line class="scope-three-eras-line scope-three-eras-conn scope-three-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#scope-three-eras-tip)"/>
  <g class="scope-three-eras-stage scope-three-eras-s1">
    <rect class="scope-three-eras-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="scope-three-eras-step" x="359" y="142">02</text>
    <text class="scope-three-eras-name" x="385" y="142">Wrapper demos, 2023-2024</text>
    <text class="scope-three-eras-desc" x="359" y="166">An API call behind a text box. Easy to build,</text>
    <text class="scope-three-eras-desc" x="359" y="182">and indistinguishable from every other one.</text>
    <text class="scope-three-eras-edge" x="359" y="242">the demo</text>
  </g>
  <line class="scope-three-eras-line scope-three-eras-conn scope-three-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#scope-three-eras-tip)"/>
  <g class="scope-three-eras-stage scope-three-eras-s2">
    <rect class="scope-three-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="scope-three-eras-step" x="674" y="142">03</text>
    <text class="scope-three-eras-name" x="700" y="142">Production systems, 2025-</text>
    <text class="scope-three-eras-desc" x="674" y="166">Retrieval, evaluation, cost control, failure</text>
    <text class="scope-three-eras-desc" x="674" y="182">handling. Judged on whether it holds up.</text>
    <text class="scope-three-eras-edge" x="674" y="242">the system</text>
  </g>
  <text class="scope-three-eras-sub" x="30" y="304">This is why the capstone is scoped as a system rather than a model: the differentiating work has moved to everything around the call, and that is what a reviewer can actually assess.</text>
</svg>
