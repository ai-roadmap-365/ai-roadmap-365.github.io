<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four outcomes.">
  <title>Triage, not a binary decision</title>
  <style>
    .triage-bg   { fill: #f8fafc; }
    .triage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .triage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .triage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .triage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .triage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .triage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .triage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .triage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .triage-stage { opacity: 1; }

    .triage-s0 { animation-delay: 0.00s; }
    .triage-e0 { animation-delay: 0.00s; }
    .triage-s1 { animation-delay: 1.28s; }
    .triage-e1 { animation-delay: 1.28s; }
    .triage-s2 { animation-delay: 2.56s; }
    .triage-e2 { animation-delay: 2.56s; }
    .triage-s3 { animation-delay: 3.84s; }
    .triage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .triage-conn  { animation: triage-trace 6.4s ease-in-out infinite; }
      .triage-stage { animation: triage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes triage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes triage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .triage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .triage-stage { animation: triage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes triage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="triage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="triage-bg" width="980" height="322"/>
  <text class="triage-h1"  x="30" y="40">Triage, not a binary decision</text>
  <text class="triage-sub" x="30" y="64">Four outcomes.</text>
  <g class="triage-stage triage-s0">
    <rect class="triage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="triage-step" x="44" y="142">01</text>
    <text class="triage-name" x="70" y="142">Clean</text>
    <text class="triage-desc" x="44" y="166">Good yield, sensible structure.</text>
    <text class="triage-desc" x="44" y="182">Index it.</text>
  </g>
  <line class="triage-line triage-conn triage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#triage-tip)"/>
  <g class="triage-stage triage-s1">
    <rect class="triage-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="triage-step" x="280" y="142">02</text>
    <text class="triage-name" x="306" y="142">Partial</text>
    <text class="triage-desc" x="280" y="166">Some pages good, some empty.</text>
    <text class="triage-desc" x="280" y="182">Index what worked, flag the</text>
    <text class="triage-desc" x="280" y="198">rest.</text>
  </g>
  <line class="triage-line triage-conn triage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#triage-tip)"/>
  <g class="triage-stage triage-s2">
    <rect class="triage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="triage-step" x="516" y="142">03</text>
    <text class="triage-name" x="542" y="142">Image-only</text>
    <text class="triage-desc" x="516" y="166">Route to character recognition,</text>
    <text class="triage-desc" x="516" y="182">then re-measure.</text>
  </g>
  <line class="triage-line triage-conn triage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#triage-tip)"/>
  <g class="triage-stage triage-s3">
    <rect class="triage-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="triage-step" x="752" y="142">04</text>
    <text class="triage-name" x="778" y="142">Unreadable</text>
    <text class="triage-desc" x="752" y="166">Queue for a person, and record</text>
    <text class="triage-desc" x="752" y="182">why.</text>
  </g>
  <text class="triage-sub" x="30" y="304">Most difficult documents are partially usable, which is why a binary accept-or-reject discards a great deal of content that a triage step would have kept.</text>
</svg>
