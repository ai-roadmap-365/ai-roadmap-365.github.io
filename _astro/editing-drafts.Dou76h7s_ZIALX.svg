<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each fixing what remains.">
  <title>Successive drafts</title>
  <style>
    .editing-drafts-bg   { fill: #f8fafc; }
    .editing-drafts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editing-drafts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editing-drafts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editing-drafts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editing-drafts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editing-drafts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .editing-drafts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .editing-drafts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .editing-drafts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .editing-drafts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .editing-drafts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .editing-drafts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .editing-drafts-row { opacity: 1; }
    .editing-drafts-r0 { animation-delay: 0.00s; }
    .editing-drafts-r1 { animation-delay: 0.45s; }
    .editing-drafts-r2 { animation-delay: 0.90s; }
    .editing-drafts-r3 { animation-delay: 1.35s; }
    .editing-drafts-r4 { animation-delay: 1.80s; }
    .editing-drafts-row { animation: editing-drafts-reveal 7.3s ease-in-out infinite; }
    @keyframes editing-drafts-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="editing-drafts-bg" width="980" height="390"/>
  <text class="editing-drafts-h1"  x="30" y="40">Successive drafts</text>
  <text class="editing-drafts-sub" x="30" y="64">Each fixing what remains.</text>
  <rect class="editing-drafts-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="editing-drafts-name" x="46" y="122">One attempt</text>
  <text class="editing-drafts-desc" x="46" y="142">However good it is.</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r0" x="46" y="182">Write it once, as well as you can</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r1" x="46" y="216">Whatever is wrong stays wrong</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r2" x="46" y="250">Limited by a single effort</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r3" x="46" y="284">No mechanism to improve</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r4" x="46" y="318">This is a single model</text>
  <rect class="editing-drafts-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="editing-drafts-name" x="526" y="122">Successive corrections</text>
  <text class="editing-drafts-desc" x="526" y="142">Each fixing the remainder.</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r0" x="526" y="182">A rough draft first</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r1" x="526" y="216">Each pass targets what is still wrong</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r2" x="526" y="250">Small corrections, many of them</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r3" x="526" y="284">Converges on something strong</text>
  <text class="editing-drafts-desc editing-drafts-row editing-drafts-r4" x="526" y="318">This is boosting</text>
  <text class="editing-drafts-sub" x="30" y="372">The analogy also carries the failure mode: enough revision passes and you start correcting things that were never wrong, which is exactly overfitting.</text>
</svg>
