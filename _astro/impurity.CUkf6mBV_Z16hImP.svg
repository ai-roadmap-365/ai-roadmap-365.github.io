<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Measuring a good split</title>
  <style>
    .impurity-bg   { fill: #f8fafc; }
    .impurity-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .impurity-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .impurity-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .impurity-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .impurity-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .impurity-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .impurity-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .impurity-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .impurity-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .impurity-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .impurity-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .impurity-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .impurity-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .impurity-stage { opacity: 1; }

    .impurity-s0 { animation-delay: 0.00s; }
    .impurity-e0 { animation-delay: 0.00s; }
    .impurity-s1 { animation-delay: 1.28s; }
    .impurity-e1 { animation-delay: 1.28s; }
    .impurity-s2 { animation-delay: 2.56s; }
    .impurity-e2 { animation-delay: 2.56s; }
    .impurity-s3 { animation-delay: 3.84s; }
    .impurity-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .impurity-conn  { animation: impurity-trace 6.4s ease-in-out infinite; }
      .impurity-stage { animation: impurity-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes impurity-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes impurity-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .impurity-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .impurity-stage { animation: impurity-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes impurity-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="impurity-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="impurity-bg" width="980" height="322"/>
  <text class="impurity-h1"  x="30" y="40">Measuring a good split</text>
  <text class="impurity-sub" x="30" y="64">Four steps.</text>
  <g class="impurity-stage impurity-s0">
    <rect class="impurity-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="impurity-step" x="44" y="142">01</text>
    <text class="impurity-name" x="70" y="142">A node with one class only is pure</text>
    <text class="impurity-desc" x="44" y="166">Impurity zero. Nothing left to</text>
    <text class="impurity-desc" x="44" y="182">decide.</text>
  </g>
  <line class="impurity-line impurity-conn impurity-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#impurity-tip)"/>
  <g class="impurity-stage impurity-s1">
    <rect class="impurity-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="impurity-step" x="280" y="142">02</text>
    <text class="impurity-name" x="306" y="142">A node with an even mix is maximally impure</text>
    <text class="impurity-desc" x="280" y="166">The prediction there is a coin</text>
    <text class="impurity-desc" x="280" y="182">flip.</text>
  </g>
  <line class="impurity-line impurity-conn impurity-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#impurity-tip)"/>
  <g class="impurity-stage impurity-s2">
    <rect class="impurity-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="impurity-step" x="516" y="142">03</text>
    <text class="impurity-name" x="542" y="142">Measure it with Gini or entropy</text>
    <text class="impurity-desc" x="516" y="166">Which agree closely in practice.</text>
  </g>
  <line class="impurity-line impurity-conn impurity-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#impurity-tip)"/>
  <g class="impurity-stage impurity-s3">
    <rect class="impurity-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="impurity-step" x="752" y="142">04</text>
    <text class="impurity-name" x="778" y="142">And choose the split with the largest reduction</text>
    <text class="impurity-desc" x="752" y="166">Weighted by how many examples go</text>
    <text class="impurity-desc" x="752" y="182">each way.</text>
    <text class="impurity-edge" x="752" y="242">greedy</text>
  </g>
  <text class="impurity-sub" x="30" y="304">Gini and entropy rarely disagree enough to change the tree, so the choice between them is far less consequential than it is often made to seem.</text>
</svg>
