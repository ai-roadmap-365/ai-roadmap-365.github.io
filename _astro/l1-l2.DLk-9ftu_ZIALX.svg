<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="They disagree.">
  <title>Two ways to measure length</title>
  <style>
    .l1-l2-bg   { fill: #f8fafc; }
    .l1-l2-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .l1-l2-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .l1-l2-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .l1-l2-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .l1-l2-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .l1-l2-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .l1-l2-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .l1-l2-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .l1-l2-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .l1-l2-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .l1-l2-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .l1-l2-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .l1-l2-row { opacity: 1; }
    .l1-l2-r0 { animation-delay: 0.00s; }
    .l1-l2-r1 { animation-delay: 0.45s; }
    .l1-l2-r2 { animation-delay: 0.90s; }
    .l1-l2-r3 { animation-delay: 1.35s; }
    .l1-l2-r4 { animation-delay: 1.80s; }
    .l1-l2-row { animation: l1-l2-reveal 7.3s ease-in-out infinite; }
    @keyframes l1-l2-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="l1-l2-bg" width="980" height="390"/>
  <text class="l1-l2-h1"  x="30" y="40">Two ways to measure length</text>
  <text class="l1-l2-sub" x="30" y="64">They disagree.</text>
  <rect class="l1-l2-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="l1-l2-name" x="46" y="122">Straight-line distance</text>
  <text class="l1-l2-desc" x="46" y="142">Through the space.</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r0" x="46" y="182">Root of the sum of squares</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r1" x="46" y="216">The shortest path, geometrically</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r2" x="46" y="250">Large differences dominate</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r3" x="46" y="284">Rotation does not change it</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r4" x="46" y="318">The usual default</text>
  <rect class="l1-l2-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="l1-l2-name" x="526" y="122">Grid distance</text>
  <text class="l1-l2-desc" x="526" y="142">Along the axes.</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r0" x="526" y="182">Sum of absolute differences</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r1" x="526" y="216">The path a taxi takes on a grid</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r2" x="526" y="250">All differences count equally</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r3" x="526" y="284">Rotation does change it</text>
  <text class="l1-l2-desc l1-l2-row l1-l2-r4" x="526" y="318">More robust in high dimensions</text>
  <text class="l1-l2-sub" x="30" y="372">They rank pairs of points differently, which means a nearest-neighbour result can change entirely with the choice of metric.</text>
</svg>
