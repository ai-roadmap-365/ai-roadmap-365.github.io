<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each with a specific effect.">
  <title>Five loader parameters</title>
  <style>
    .loader-params-bg   { fill: #f8fafc; }
    .loader-params-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-params-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-params-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-params-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-params-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-params-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loader-params-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loader-params-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loader-params-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loader-params-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loader-params-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loader-params-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loader-params-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loader-params-stage { opacity: 1; }

    .loader-params-s0 { animation-delay: 0.00s; }
    .loader-params-e0 { animation-delay: 0.00s; }
    .loader-params-s1 { animation-delay: 1.33s; }
    .loader-params-e1 { animation-delay: 1.33s; }
    .loader-params-s2 { animation-delay: 2.67s; }
    .loader-params-e2 { animation-delay: 2.67s; }
    .loader-params-s3 { animation-delay: 4.00s; }
    .loader-params-e3 { animation-delay: 4.00s; }
    .loader-params-s4 { animation-delay: 5.33s; }
    .loader-params-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .loader-params-conn  { animation: loader-params-trace 8s ease-in-out infinite; }
      .loader-params-stage { animation: loader-params-arrive 8s ease-in-out infinite; }
    }
    @keyframes loader-params-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loader-params-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loader-params-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loader-params-stage { animation: loader-params-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loader-params-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loader-params-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loader-params-bg" width="980" height="322"/>
  <text class="loader-params-h1"  x="30" y="40">Five loader parameters</text>
  <text class="loader-params-sub" x="30" y="64">Each with a specific effect.</text>
  <g class="loader-params-stage loader-params-s0">
    <rect class="loader-params-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="loader-params-step" x="44" y="142">01</text>
    <text class="loader-params-name" x="70" y="142">batch_size</text>
    <text class="loader-params-desc" x="44" y="166">Samples per step. Bounded</text>
    <text class="loader-params-desc" x="44" y="182">by activation memory, not</text>
    <text class="loader-params-desc" x="44" y="198">by preference.</text>
  </g>
  <line class="loader-params-line loader-params-conn loader-params-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#loader-params-tip)"/>
  <g class="loader-params-stage loader-params-s1">
    <rect class="loader-params-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="loader-params-step" x="233" y="142">02</text>
    <text class="loader-params-name" x="259" y="142">shuffle</text>
    <text class="loader-params-desc" x="233" y="166">A fresh permutation each</text>
    <text class="loader-params-desc" x="233" y="182">epoch. Off means the</text>
    <text class="loader-params-desc" x="233" y="198">model sees the same order</text>
  </g>
  <line class="loader-params-line loader-params-conn loader-params-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#loader-params-tip)"/>
  <g class="loader-params-stage loader-params-s2">
    <rect class="loader-params-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="loader-params-step" x="422" y="142">03</text>
    <text class="loader-params-name" x="448" y="142">num_workers</text>
    <text class="loader-params-desc" x="422" y="166">Background processes</text>
    <text class="loader-params-desc" x="422" y="182">doing the loading. Zero</text>
    <text class="loader-params-desc" x="422" y="198">for debugging.</text>
    <text class="loader-params-edge" x="422" y="242">parallel I/O</text>
  </g>
  <line class="loader-params-line loader-params-conn loader-params-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#loader-params-tip)"/>
  <g class="loader-params-stage loader-params-s3">
    <rect class="loader-params-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="loader-params-step" x="611" y="142">04</text>
    <text class="loader-params-name" x="637" y="142">pin_memory</text>
    <text class="loader-params-desc" x="611" y="166">Page-locked buffers, so</text>
    <text class="loader-params-desc" x="611" y="182">transfer to the</text>
    <text class="loader-params-desc" x="611" y="198">accelerator can be</text>
  </g>
  <line class="loader-params-line loader-params-conn loader-params-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#loader-params-tip)"/>
  <g class="loader-params-stage loader-params-s4">
    <rect class="loader-params-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="loader-params-step" x="800" y="142">05</text>
    <text class="loader-params-name" x="826" y="142">drop_last</text>
    <text class="loader-params-desc" x="800" y="166">Discard a partial final</text>
    <text class="loader-params-desc" x="800" y="182">batch — important with</text>
    <text class="loader-params-desc" x="800" y="198">batch normalisation.</text>
  </g>
  <text class="loader-params-sub" x="30" y="304">The last is not tidiness: a final batch of one sample makes batch normalisation compute statistics over a single example, which is numerically unstable and can produce a NaN.</text>
</svg>
