<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Attribution against caps.">
  <title>Build the ledger, adopt the proxy</title>
  <style>
    .cost-tooling-bg   { fill: #f8fafc; }
    .cost-tooling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-tooling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-tooling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-tooling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-tooling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-tooling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-tooling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-tooling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-tooling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-tooling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-tooling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-tooling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-tooling-row { opacity: 1; }
    .cost-tooling-r0 { animation-delay: 0.00s; }
    .cost-tooling-r1 { animation-delay: 0.45s; }
    .cost-tooling-r2 { animation-delay: 0.90s; }
    .cost-tooling-r3 { animation-delay: 1.35s; }
    .cost-tooling-r4 { animation-delay: 1.80s; }
    .cost-tooling-row { animation: cost-tooling-reveal 7.3s ease-in-out infinite; }
    @keyframes cost-tooling-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cost-tooling-bg" width="980" height="390"/>
  <text class="cost-tooling-h1"  x="30" y="40">Build the ledger, adopt the proxy</text>
  <text class="cost-tooling-sub" x="30" y="64">Attribution against caps.</text>
  <rect class="cost-tooling-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cost-tooling-name" x="46" y="122">Build the ledger</text>
  <text class="cost-tooling-desc" x="46" y="142">You own the attribution.</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r0" x="46" y="182">Per model, per stage, per tenant</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r1" x="46" y="216">A dozen lines of code</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r2" x="46" y="250">Provider dashboards cannot do this</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r3" x="46" y="284">They report the bill, not the cause</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r4" x="46" y="318">Attribution is the whole point</text>
  <rect class="cost-tooling-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cost-tooling-name" x="526" y="122">Adopt a proxy</text>
  <text class="cost-tooling-desc" x="526" y="142">For caps across services.</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r0" x="526" y="182">Per-key budgets and rate limits</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r1" x="526" y="216">Logging across providers</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r2" x="526" y="250">Observability with cost per trace</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r3" x="526" y="284">Semantic caching, with a correctness risk</text>
  <text class="cost-tooling-desc cost-tooling-row cost-tooling-r4" x="526" y="318">Self-hosting converts per-token into fixed hardware</text>
  <text class="cost-tooling-sub" x="30" y="372">The self-hosting crossover deserves an actual calculation rather than an instinct: below some volume it is worse, above it dramatically better, and the point depends on your traffic.</text>
</svg>
