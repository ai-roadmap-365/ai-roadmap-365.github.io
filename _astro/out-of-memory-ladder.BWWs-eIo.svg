<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four stages, and only the last one is loud.">
  <title>What happens as memory runs out</title>
  <style>
    .out-of-memory-ladder-bg   { fill: #f8fafc; }
    .out-of-memory-ladder-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .out-of-memory-ladder-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .out-of-memory-ladder-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .out-of-memory-ladder-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .out-of-memory-ladder-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .out-of-memory-ladder-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .out-of-memory-ladder-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .out-of-memory-ladder-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .out-of-memory-ladder-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .out-of-memory-ladder-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .out-of-memory-ladder-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .out-of-memory-ladder-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .out-of-memory-ladder-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .out-of-memory-ladder-stage { opacity: 1; }

    .out-of-memory-ladder-s0 { animation-delay: 0.00s; }
    .out-of-memory-ladder-e0 { animation-delay: 0.00s; }
    .out-of-memory-ladder-s1 { animation-delay: 1.28s; }
    .out-of-memory-ladder-e1 { animation-delay: 1.28s; }
    .out-of-memory-ladder-s2 { animation-delay: 2.56s; }
    .out-of-memory-ladder-e2 { animation-delay: 2.56s; }
    .out-of-memory-ladder-s3 { animation-delay: 3.84s; }
    .out-of-memory-ladder-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .out-of-memory-ladder-conn  { animation: out-of-memory-ladder-trace 6.4s ease-in-out infinite; }
      .out-of-memory-ladder-stage { animation: out-of-memory-ladder-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes out-of-memory-ladder-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes out-of-memory-ladder-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .out-of-memory-ladder-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .out-of-memory-ladder-stage { animation: out-of-memory-ladder-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes out-of-memory-ladder-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="out-of-memory-ladder-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="out-of-memory-ladder-bg" width="980" height="322"/>
  <text class="out-of-memory-ladder-h1"  x="30" y="40">What happens as memory runs out</text>
  <text class="out-of-memory-ladder-sub" x="30" y="64">Four stages, and only the last one is loud.</text>
  <g class="out-of-memory-ladder-stage out-of-memory-ladder-s0">
    <rect class="out-of-memory-ladder-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="out-of-memory-ladder-step" x="44" y="142">01</text>
    <text class="out-of-memory-ladder-name" x="70" y="142">Free memory</text>
    <text class="out-of-memory-ladder-desc" x="44" y="166">Allocations succeed instantly.</text>
    <text class="out-of-memory-ladder-desc" x="44" y="182">Everything is fine.</text>
  </g>
  <line class="out-of-memory-ladder-line out-of-memory-ladder-conn out-of-memory-ladder-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#out-of-memory-ladder-tip)"/>
  <g class="out-of-memory-ladder-stage out-of-memory-ladder-s1">
    <rect class="out-of-memory-ladder-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="out-of-memory-ladder-step" x="280" y="142">02</text>
    <text class="out-of-memory-ladder-name" x="306" y="142">Caches evicted</text>
    <text class="out-of-memory-ladder-desc" x="280" y="166">The OS drops cached file data</text>
    <text class="out-of-memory-ladder-desc" x="280" y="182">first. You may notice disk reads</text>
    <text class="out-of-memory-ladder-desc" x="280" y="198">returning.</text>
  </g>
  <line class="out-of-memory-ladder-line out-of-memory-ladder-conn out-of-memory-ladder-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#out-of-memory-ladder-tip)"/>
  <g class="out-of-memory-ladder-stage out-of-memory-ladder-s2">
    <rect class="out-of-memory-ladder-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="out-of-memory-ladder-step" x="516" y="142">03</text>
    <text class="out-of-memory-ladder-name" x="542" y="142">Swapping</text>
    <text class="out-of-memory-ladder-desc" x="516" y="166">Less-used pages written to disk.</text>
    <text class="out-of-memory-ladder-desc" x="516" y="182">The machine does not stop; it</text>
    <text class="out-of-memory-ladder-desc" x="516" y="198">slows to disk latency.</text>
    <text class="out-of-memory-ladder-edge" x="516" y="242">1000x slower</text>
  </g>
  <line class="out-of-memory-ladder-line out-of-memory-ladder-conn out-of-memory-ladder-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#out-of-memory-ladder-tip)"/>
  <g class="out-of-memory-ladder-stage out-of-memory-ladder-s3">
    <rect class="out-of-memory-ladder-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="out-of-memory-ladder-step" x="752" y="142">04</text>
    <text class="out-of-memory-ladder-name" x="778" y="142">The OOM killer</text>
    <text class="out-of-memory-ladder-desc" x="752" y="166">A process is chosen and</text>
    <text class="out-of-memory-ladder-desc" x="752" y="182">terminated. Exit code 137, no</text>
    <text class="out-of-memory-ladder-desc" x="752" y="198">traceback.</text>
    <text class="out-of-memory-ladder-edge" x="752" y="242">137</text>
  </g>
  <text class="out-of-memory-ladder-sub" x="30" y="304">The dangerous stage is the third: the machine appears to be working, and is running thousands of times slower than it should. A job that seems hung is very often swapping.</text>
</svg>
