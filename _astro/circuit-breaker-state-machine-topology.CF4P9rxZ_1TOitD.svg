<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Circuit Breaker State Machine Topology">
  <title>Circuit Breaker State Machine Topology</title>
  <defs>
    <style>
      .d317b-bg { fill: #f8fafc; }
      .d317b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d317b-closed { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d317b-open { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d317b-half { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d317b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d317b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d317b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d317b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d317b-bg" />
  
  <text x="40" y="40" class="d317a-title">Circuit Breaker State Machine for AI Gateways</text>
  <text x="40" y="65" class="d317a-subtitle">Circuit Breaker State Machine Topology showing CLOSED state (normal traffic), OPEN state (fail fast to secondary fallback), and HALF-OPEN state (canary probe recovery)</text>
  
  <!-- State 1: CLOSED -->
  <rect x="40" y="110" width="250" height="270" class="d317b-closed" />
  <text x="60" y="145" class="d317b-header" fill="#15803d">1. CLOSED (Normal)</text>
  <text x="60" y="180" class="d317b-text">• Upstream provider healthy</text>
  <text x="60" y="205" class="d317b-text">• 100% traffic to Primary model</text>
  <text x="60" y="230" class="d317b-text">• Consecutive failures tracked</text>
  <text x="60" y="270" class="d317b-text" font-weight="600">Trip Trigger:</text>
  <text x="60" y="295" class="d317b-text">5 consecutive 5xx errors</text>
  <text x="60" y="320" class="d317b-text" fill="#ef4444" font-weight="700">-> Transitions to OPEN</text>
  
  <!-- State 2: OPEN -->
  <rect x="325" y="110" width="250" height="270" class="d317b-open" />
  <text x="345" y="145" class="d317b-header" fill="#991b1b">2. OPEN (Failing Fast)</text>
  <text x="345" y="180" class="d317b-text">• Upstream model down (503)</text>
  <text x="345" y="205" class="d317b-text">• Zero calls to primary provider</text>
  <text x="345" y="230" class="d317b-text">• Immediate route to Fallback</text>
  <text x="345" y="270" class="d317b-text" font-weight="600">Recovery Timer:</text>
  <text x="345" y="295" class="d317b-text">Sleep for 30s reset timeout</text>
  <text x="345" y="320" class="d317b-text" fill="#a16207" font-weight="700">-> Transitions to HALF-OPEN</text>
  
  <!-- State 3: HALF-OPEN -->
  <rect x="610" y="110" width="250" height="270" class="d317b-half" />
  <text x="630" y="145" class="d317b-header" fill="#a16207">3. HALF-OPEN (Testing)</text>
  <text x="630" y="180" class="d317b-text">• Send 1 probe test request</text>
  <text x="630" y="205" class="d317b-text">• If probe succeeds (200 OK):</text>
  <text x="630" y="225" class="d317b-text" fill="#15803d">  -> Reset to CLOSED</text>
  <text x="630" y="255" class="d317b-text">• If probe fails (5xx / Timeout):</text>
  <text x="630" y="275" class="d317b-text" fill="#ef4444">  -> Trip back to OPEN (60s)</text>
  <text x="630" y="320" class="d317b-text" font-weight="600">Self-Healing Gateway</text>
</svg>