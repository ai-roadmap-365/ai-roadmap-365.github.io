<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Two definitions, one answer</title>
  <style>
    .dot-two-ways-bg   { fill: #f8fafc; }
    .dot-two-ways-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-two-ways-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-two-ways-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-two-ways-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-two-ways-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-two-ways-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dot-two-ways-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dot-two-ways-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dot-two-ways-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dot-two-ways-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dot-two-ways-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dot-two-ways-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dot-two-ways-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dot-two-ways-stage { opacity: 1; }

    .dot-two-ways-s0 { animation-delay: 0.00s; }
    .dot-two-ways-e0 { animation-delay: 0.00s; }
    .dot-two-ways-s1 { animation-delay: 1.28s; }
    .dot-two-ways-e1 { animation-delay: 1.28s; }
    .dot-two-ways-s2 { animation-delay: 2.56s; }
    .dot-two-ways-e2 { animation-delay: 2.56s; }
    .dot-two-ways-s3 { animation-delay: 3.84s; }
    .dot-two-ways-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dot-two-ways-conn  { animation: dot-two-ways-trace 6.4s ease-in-out infinite; }
      .dot-two-ways-stage { animation: dot-two-ways-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dot-two-ways-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dot-two-ways-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dot-two-ways-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dot-two-ways-stage { animation: dot-two-ways-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dot-two-ways-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dot-two-ways-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dot-two-ways-bg" width="980" height="322"/>
  <text class="dot-two-ways-h1"  x="30" y="40">Two definitions, one answer</text>
  <text class="dot-two-ways-sub" x="30" y="64">Four steps.</text>
  <g class="dot-two-ways-stage dot-two-ways-s0">
    <rect class="dot-two-ways-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dot-two-ways-step" x="44" y="142">01</text>
    <text class="dot-two-ways-name" x="70" y="142">Algebraically: multiply matching components and sum</text>
    <text class="dot-two-ways-desc" x="44" y="166">Which is what you compute.</text>
  </g>
  <line class="dot-two-ways-line dot-two-ways-conn dot-two-ways-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dot-two-ways-tip)"/>
  <g class="dot-two-ways-stage dot-two-ways-s1">
    <rect class="dot-two-ways-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dot-two-ways-step" x="280" y="142">02</text>
    <text class="dot-two-ways-name" x="306" y="142">Geometrically: the product of the lengths and the cosine of the angle</text>
    <text class="dot-two-ways-desc" x="280" y="166">Which is what it means.</text>
  </g>
  <line class="dot-two-ways-line dot-two-ways-conn dot-two-ways-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dot-two-ways-tip)"/>
  <g class="dot-two-ways-stage dot-two-ways-s2">
    <rect class="dot-two-ways-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dot-two-ways-step" x="516" y="142">03</text>
    <text class="dot-two-ways-name" x="542" y="142">The two always agree</text>
    <text class="dot-two-ways-desc" x="516" y="166">Which is a theorem, not a</text>
    <text class="dot-two-ways-desc" x="516" y="182">coincidence.</text>
  </g>
  <line class="dot-two-ways-line dot-two-ways-conn dot-two-ways-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dot-two-ways-tip)"/>
  <g class="dot-two-ways-stage dot-two-ways-s3">
    <rect class="dot-two-ways-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dot-two-ways-step" x="752" y="142">04</text>
    <text class="dot-two-ways-name" x="778" y="142">So the angle can be recovered from the components</text>
    <text class="dot-two-ways-desc" x="752" y="166">Which is what similarity search</text>
    <text class="dot-two-ways-desc" x="752" y="182">does.</text>
    <text class="dot-two-ways-edge" x="752" y="242">the bridge</text>
  </g>
  <text class="dot-two-ways-sub" x="30" y="304">The agreement between a computation and a geometric meaning is what makes this operation so useful: you compute one and read the other.</text>
</svg>
