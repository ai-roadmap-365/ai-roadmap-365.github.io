<svg role="img" aria-label="Byte Pair Encoding BPE merge algorithm iterating over character pairs merging most frequent bigrams into vocabulary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Byte-Pair Encoding (BPE) Iterative Merge Mechanics</title>
  <defs>
    <linearGradient id="bg218b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card218b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg218b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BYTE-PAIR ENCODING (BPE) ALGORITHM</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Iterative Frequency-Based Merging of Adjacent Subword Pairs</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card218b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Step 1: Base Character Vocab -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Step 1: Base Alphabet</text>
    <rect x="35" y="65" width="200" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Corpus Decomposition</text>
    <text x="135" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">l o w _ (5)</text>
    <text x="135" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">l o w e r _ (2)</text>
    <text x="135" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">n e w e s t _ (6)</text>
    <text x="135" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">w i d e s t _ (3)</text>
    <text x="135" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Vocab: {d,e,i,l,n,o,r,s,t,w,_}</text>

    <!-- Step 2: Frequency Count & Merge -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Step 2: Find &amp; Merge Top Pair</text>
    <rect x="280" y="65" width="200" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Frequency Evaluation</text>
    <text x="380" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">Pair ('e', 's'): 6 + 3 = 9</text>
    <text x="380" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">Pair ('s', 't'): 6 + 3 = 9</text>
    <text x="380" y="155" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Merge 'e' + 's' -> 'es'</text>
    <text x="380" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">Merge 'es' + 't' -> 'est' (9)</text>
    <text x="380" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Add 'es', 'est' to Vocab</text>

    <!-- Step 3: Resulting Subwords -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="625" y="48" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Step 3: Learned Subwords</text>
    <rect x="525" y="65" width="200" height="190" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="625" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Compact Representation</text>
    <text x="625" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">"lowest" -> ["low", "est"]</text>
    <text x="625" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">"newest" -> ["new", "est"]</text>
    <text x="625" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">"widest" -> ["wide", "est"]</text>
    <text x="625" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">Unseen "smartest" -> ["smart", "est"]</text>
    <text x="625" y="235" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">Zero OOV on New Words</text>
  </g>
</svg>
