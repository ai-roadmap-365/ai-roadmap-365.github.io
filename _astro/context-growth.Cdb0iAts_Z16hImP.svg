<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each turn re-reads every earlier turn.">
  <title>Why the loop gets expensive</title>
  <style>
    .context-growth-bg   { fill: #f8fafc; }
    .context-growth-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-growth-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-growth-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-growth-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-growth-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-growth-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .context-growth-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .context-growth-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .context-growth-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .context-growth-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .context-growth-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .context-growth-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .context-growth-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .context-growth-stage { opacity: 1; }

    .context-growth-s0 { animation-delay: 0.00s; }
    .context-growth-e0 { animation-delay: 0.00s; }
    .context-growth-s1 { animation-delay: 1.28s; }
    .context-growth-e1 { animation-delay: 1.28s; }
    .context-growth-s2 { animation-delay: 2.56s; }
    .context-growth-e2 { animation-delay: 2.56s; }
    .context-growth-s3 { animation-delay: 3.84s; }
    .context-growth-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .context-growth-conn  { animation: context-growth-trace 6.4s ease-in-out infinite; }
      .context-growth-stage { animation: context-growth-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes context-growth-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes context-growth-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .context-growth-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .context-growth-stage { animation: context-growth-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes context-growth-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="context-growth-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="context-growth-bg" width="980" height="322"/>
  <text class="context-growth-h1"  x="30" y="40">Why the loop gets expensive</text>
  <text class="context-growth-sub" x="30" y="64">Each turn re-reads every earlier turn.</text>
  <g class="context-growth-stage context-growth-s0">
    <rect class="context-growth-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="context-growth-step" x="44" y="142">01</text>
    <text class="context-growth-name" x="70" y="142">Every turn appends</text>
    <text class="context-growth-desc" x="44" y="166">Thought plus action plus</text>
    <text class="context-growth-desc" x="44" y="182">observation, onto the prompt.</text>
  </g>
  <line class="context-growth-line context-growth-conn context-growth-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#context-growth-tip)"/>
  <g class="context-growth-stage context-growth-s1">
    <rect class="context-growth-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="context-growth-step" x="280" y="142">02</text>
    <text class="context-growth-name" x="306" y="142">So step 8 re-reads steps 1 to 7</text>
    <text class="context-growth-desc" x="280" y="166">Input tokens grow with the</text>
    <text class="context-growth-desc" x="280" y="182">square of the trajectory depth.</text>
    <text class="context-growth-edge" x="280" y="242">quadratic</text>
  </g>
  <line class="context-growth-line context-growth-conn context-growth-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#context-growth-tip)"/>
  <g class="context-growth-stage context-growth-s2">
    <rect class="context-growth-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="context-growth-step" x="516" y="142">03</text>
    <text class="context-growth-name" x="542" y="142">And latency grows with it</text>
    <text class="context-growth-desc" x="516" y="166">Time to first token rises as the</text>
    <text class="context-growth-desc" x="516" y="182">prompt lengthens.</text>
  </g>
  <line class="context-growth-line context-growth-conn context-growth-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#context-growth-tip)"/>
  <g class="context-growth-stage context-growth-s3">
    <rect class="context-growth-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="context-growth-step" x="752" y="142">04</text>
    <text class="context-growth-name" x="778" y="142">Truncate the scratchpad</text>
    <text class="context-growth-desc" x="752" y="166">Summarise older observations,</text>
    <text class="context-growth-desc" x="752" y="182">preserving the atomic facts</text>
    <text class="context-growth-desc" x="752" y="198">extracted.</text>
  </g>
  <text class="context-growth-sub" x="30" y="304">Preserving extracted facts while summarising the surrounding narrative is the part that needs care: the observation "the file has 412 lines" must survive, and the paragraph around it need not.</text>
</svg>
