<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Reading the wind, and the swell.">
  <title>Sailing across an ocean</title>
  <style>
    .sailboat-bg   { fill: #f8fafc; }
    .sailboat-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sailboat-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sailboat-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sailboat-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sailboat-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sailboat-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sailboat-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sailboat-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sailboat-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sailboat-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sailboat-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sailboat-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sailboat-row { opacity: 1; }
    .sailboat-r0 { animation-delay: 0.00s; }
    .sailboat-r1 { animation-delay: 0.45s; }
    .sailboat-r2 { animation-delay: 0.90s; }
    .sailboat-r3 { animation-delay: 1.35s; }
    .sailboat-r4 { animation-delay: 1.80s; }
    .sailboat-row { animation: sailboat-reveal 7.3s ease-in-out infinite; }
    @keyframes sailboat-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sailboat-bg" width="980" height="390"/>
  <text class="sailboat-h1"  x="30" y="40">Sailing across an ocean</text>
  <text class="sailboat-sub" x="30" y="64">Reading the wind, and the swell.</text>
  <rect class="sailboat-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sailboat-name" x="46" y="122">Fixed heading</text>
  <text class="sailboat-desc" x="46" y="142">One rate, everywhere.</text>
  <text class="sailboat-desc sailboat-row sailboat-r0" x="46" y="182">The same rudder input regardless</text>
  <text class="sailboat-desc sailboat-row sailboat-r1" x="46" y="216">Too much in a swell — overshoot</text>
  <text class="sailboat-desc sailboat-row sailboat-r2" x="46" y="250">Too little in calm — no progress</text>
  <text class="sailboat-desc sailboat-row sailboat-r3" x="46" y="284">One setting cannot suit both</text>
  <text class="sailboat-desc sailboat-row sailboat-r4" x="46" y="318">This is a global learning rate</text>
  <rect class="sailboat-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sailboat-name" x="526" y="122">Adaptive</text>
  <text class="sailboat-desc" x="526" y="142">Per condition.</text>
  <text class="sailboat-desc sailboat-row sailboat-r0" x="526" y="182">Small corrections in rough water</text>
  <text class="sailboat-desc sailboat-row sailboat-r1" x="526" y="216">Larger ones when it is calm</text>
  <text class="sailboat-desc sailboat-row sailboat-r2" x="526" y="250">Momentum carries through a lull</text>
  <text class="sailboat-desc sailboat-row sailboat-r3" x="526" y="284">Each direction handled on its own terms</text>
  <text class="sailboat-desc sailboat-row sailboat-r4" x="526" y="318">This is per-parameter adaptivity</text>
  <text class="sailboat-sub" x="30" y="372">The per-parameter part is what the analogy stretches to convey: it is not one boat adapting over time, it is millions of independent rudders each tuned to their own recent history.</text>
</svg>
