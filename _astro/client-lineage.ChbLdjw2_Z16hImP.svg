<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From imports to processes.">
  <title>Three eras of tool clients</title>
  <style>
    .client-lineage-bg   { fill: #f8fafc; }
    .client-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .client-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .client-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .client-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .client-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .client-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .client-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .client-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .client-lineage-stage { opacity: 1; }

    .client-lineage-s0 { animation-delay: 0.00s; }
    .client-lineage-e0 { animation-delay: 0.00s; }
    .client-lineage-s1 { animation-delay: 1.50s; }
    .client-lineage-e1 { animation-delay: 1.50s; }
    .client-lineage-s2 { animation-delay: 3.00s; }
    .client-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .client-lineage-conn  { animation: client-lineage-trace 6s ease-in-out infinite; }
      .client-lineage-stage { animation: client-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes client-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes client-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .client-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .client-lineage-stage { animation: client-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes client-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="client-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="client-lineage-bg" width="980" height="322"/>
  <text class="client-lineage-h1"  x="30" y="40">Three eras of tool clients</text>
  <text class="client-lineage-sub" x="30" y="64">From imports to processes.</text>
  <g class="client-lineage-stage client-lineage-s0">
    <rect class="client-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="client-lineage-step" x="44" y="142">01</text>
    <text class="client-lineage-name" x="70" y="142">Hardcoded classes, 2022-2023</text>
    <text class="client-lineage-desc" x="44" y="166">A tool was a Python class you imported. Tools</text>
    <text class="client-lineage-desc" x="44" y="182">coupled to the host process.</text>
  </g>
  <line class="client-lineage-line client-lineage-conn client-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#client-lineage-tip)"/>
  <g class="client-lineage-stage client-lineage-s1">
    <rect class="client-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="client-lineage-step" x="359" y="142">02</text>
    <text class="client-lineage-name" x="385" y="142">Function calling, 2023-2024</text>
    <text class="client-lineage-desc" x="359" y="166">Functions converted to schemas, sent in the</text>
    <text class="client-lineage-desc" x="359" y="182">request, parsed from the response.</text>
  </g>
  <line class="client-lineage-line client-lineage-conn client-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#client-lineage-tip)"/>
  <g class="client-lineage-stage client-lineage-s2">
    <rect class="client-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="client-lineage-step" x="674" y="142">03</text>
    <text class="client-lineage-name" x="700" y="142">Multi-server clients, 2024</text>
    <text class="client-lineage-desc" x="674" y="166">Independent processes across stdio and SSE,</text>
    <text class="client-lineage-desc" x="674" y="182">catalogues merged at run time.</text>
  </g>
  <text class="client-lineage-sub" x="30" y="304">The first era's coupling is what the protocol undoes: updating a database connector meant redeploying the agent, because the connector was code inside it.</text>
</svg>
