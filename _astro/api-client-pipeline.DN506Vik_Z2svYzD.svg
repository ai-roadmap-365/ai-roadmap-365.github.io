<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>The six stages of an API client: read the docs, build the request, send it, parse the JSON, handle errors, and present the result</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The API client pipeline</text>

  <!-- Stage 1 -->
  <rect x="40" y="70" width="200" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="140" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Read the docs</text>
  <text x="140" y="124" text-anchor="middle" font-size="14" fill="#1a202c">endpoint, params, auth, shape</text>

  <!-- Stage 2 -->
  <rect x="280" y="70" width="200" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Build the request</text>
  <text x="380" y="124" text-anchor="middle" font-size="14" fill="#1a202c">URL + query string</text>

  <!-- Stage 3 -->
  <rect x="520" y="70" width="200" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="620" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Send it</text>
  <text x="620" y="124" text-anchor="middle" font-size="14" fill="#1a202c">curl fetches the reply</text>

  <!-- Stage 4 -->
  <rect x="520" y="210" width="200" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="620" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Parse the JSON</text>
  <text x="620" y="264" text-anchor="middle" font-size="14" fill="#1a202c">jq / python3 by path</text>

  <!-- Stage 5 -->
  <rect x="280" y="210" width="200" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">5. Handle errors</text>
  <text x="380" y="264" text-anchor="middle" font-size="14" fill="#1a202c">failed call, missing field</text>

  <!-- Stage 6 -->
  <rect x="40" y="210" width="200" height="72" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="140" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">6. Present</text>
  <text x="140" y="264" text-anchor="middle" font-size="14" fill="#ffffff">a clean report</text>

  <!-- Arrows row 1: 1 -> 2 -> 3 -->
  <line x1="240" y1="106" x2="278" y2="106" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="106" x2="518" y2="106" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow 3 -> 4 (down) -->
  <line x1="620" y1="142" x2="620" y2="208" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows row 2 (right to left): 4 -> 5 -> 6 -->
  <line x1="518" y1="246" x2="482" y2="246" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="278" y1="246" x2="242" y2="246" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note -->
  <text x="380" y="350" text-anchor="middle" font-size="15" fill="#1a202c">Each stage feeds the next — and each can fail in its own way,</text>
  <text x="380" y="374" text-anchor="middle" font-size="15" fill="#1a202c">which is why stage 5 (handle errors) is never optional.</text>
  <text x="380" y="416" text-anchor="middle" font-size="15" font-style="italic" fill="#1d4ed8">Same six stages for every API — including an AI model's.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/>
    </marker>
  </defs>
</svg>
