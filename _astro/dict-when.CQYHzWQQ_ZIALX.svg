<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is not.">
  <title>When a dictionary is right</title>
  <style>
    .dict-when-bg   { fill: #f8fafc; }
    .dict-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dict-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dict-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dict-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dict-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dict-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dict-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dict-when-row { opacity: 1; }
    .dict-when-r0 { animation-delay: 0.00s; }
    .dict-when-r1 { animation-delay: 0.45s; }
    .dict-when-r2 { animation-delay: 0.90s; }
    .dict-when-r3 { animation-delay: 1.35s; }
    .dict-when-r4 { animation-delay: 1.80s; }
    .dict-when-row { animation: dict-when-reveal 7.3s ease-in-out infinite; }
    @keyframes dict-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dict-when-bg" width="980" height="390"/>
  <text class="dict-when-h1"  x="30" y="40">When a dictionary is right</text>
  <text class="dict-when-sub" x="30" y="64">And when it is not.</text>
  <rect class="dict-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dict-when-name" x="46" y="122">Use a dictionary</text>
  <text class="dict-when-desc" x="46" y="142">Four cases.</text>
  <text class="dict-when-desc dict-when-row dict-when-r0" x="46" y="182">Lookup by a meaningful key</text>
  <text class="dict-when-desc dict-when-row dict-when-r1" x="46" y="216">Counting or grouping by category</text>
  <text class="dict-when-desc dict-when-row dict-when-r2" x="46" y="250">Configuration and structured payloads</text>
  <text class="dict-when-desc dict-when-row dict-when-r3" x="46" y="284">Caching computed results</text>
  <text class="dict-when-desc dict-when-row dict-when-r4" x="46" y="318">Where insertion order should be kept</text>
  <rect class="dict-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dict-when-name" x="526" y="122">Use something else</text>
  <text class="dict-when-desc" x="526" y="142">Also four.</text>
  <text class="dict-when-desc dict-when-row dict-when-r0" x="526" y="182">Membership only — a set is leaner</text>
  <text class="dict-when-desc dict-when-row dict-when-r1" x="526" y="216">Fixed known fields — a dataclass</text>
  <text class="dict-when-desc dict-when-row dict-when-r2" x="526" y="250">Millions of uniform records — a dataframe</text>
  <text class="dict-when-desc dict-when-row dict-when-r3" x="526" y="284">Ordered numeric data — an array</text>
  <text class="dict-when-desc dict-when-row dict-when-r4" x="526" y="318">Where keys are just positions — a list</text>
  <text class="dict-when-sub" x="30" y="372">The dataclass row is worth acting on: a dictionary with a fixed set of known keys is a class waiting to be written, and the class catches typos the dictionary does not.</text>
</svg>
