<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different questions.">
  <title>Coefficients against predictions</title>
  <style>
    .instability-prediction-bg   { fill: #f8fafc; }
    .instability-prediction-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instability-prediction-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instability-prediction-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instability-prediction-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instability-prediction-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instability-prediction-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instability-prediction-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .instability-prediction-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .instability-prediction-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .instability-prediction-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .instability-prediction-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .instability-prediction-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instability-prediction-row { opacity: 1; }
    .instability-prediction-r0 { animation-delay: 0.00s; }
    .instability-prediction-r1 { animation-delay: 0.45s; }
    .instability-prediction-r2 { animation-delay: 0.90s; }
    .instability-prediction-r3 { animation-delay: 1.35s; }
    .instability-prediction-r4 { animation-delay: 1.80s; }
    .instability-prediction-row { animation: instability-prediction-reveal 7.3s ease-in-out infinite; }
    @keyframes instability-prediction-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="instability-prediction-bg" width="980" height="390"/>
  <text class="instability-prediction-h1"  x="30" y="40">Coefficients against predictions</text>
  <text class="instability-prediction-sub" x="30" y="64">Two different questions.</text>
  <rect class="instability-prediction-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="instability-prediction-name" x="46" y="122">Coefficients</text>
  <text class="instability-prediction-desc" x="46" y="142">Badly affected.</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r0" x="46" y="182">Variance inflated by the collinearity</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r1" x="46" y="216">Signs can flip between samples</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r2" x="46" y="250">Individual effects uninterpretable</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r3" x="46" y="284">Standard errors large</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r4" x="46" y="318">Interpretation is compromised</text>
  <rect class="instability-prediction-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="instability-prediction-name" x="526" y="122">Predictions</text>
  <text class="instability-prediction-desc" x="526" y="142">Barely affected.</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r0" x="526" y="182">Cross-validated error nearly unchanged</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r1" x="526" y="216">OLS 54.5272, Ridge 54.4913, Lasso 54.4961</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r2" x="526" y="250">A gap of 0.036, with VIFs up to 59.2</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r3" x="526" y="284">The fitted surface is stable</text>
  <text class="instability-prediction-desc instability-prediction-row instability-prediction-r4" x="526" y="318">Prediction is fine</text>
  <text class="instability-prediction-sub" x="30" y="372">Conflating these two questions is the mistake the measurement is designed to prevent: severe collinearity is an interpretation problem, not a prediction problem.</text>
</svg>
