<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="An hour of uncompressed 1080p is 670 GB. Something has to give.">
  <title>Why video compression is not optional</title>
  <style>
    .video-frame-cost-bg   { fill: #f8fafc; }
    .video-frame-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-frame-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-frame-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-frame-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-frame-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-frame-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .video-frame-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .video-frame-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .video-frame-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .video-frame-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .video-frame-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .video-frame-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .video-frame-cost-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .video-frame-cost-stage { opacity: 1; }

    .video-frame-cost-s0 { animation-delay: 0.00s; }
    .video-frame-cost-e0 { animation-delay: 0.00s; }
    .video-frame-cost-s1 { animation-delay: 1.28s; }
    .video-frame-cost-e1 { animation-delay: 1.28s; }
    .video-frame-cost-s2 { animation-delay: 2.56s; }
    .video-frame-cost-e2 { animation-delay: 2.56s; }
    .video-frame-cost-s3 { animation-delay: 3.84s; }
    .video-frame-cost-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .video-frame-cost-conn  { animation: video-frame-cost-trace 6.4s ease-in-out infinite; }
      .video-frame-cost-stage { animation: video-frame-cost-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes video-frame-cost-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes video-frame-cost-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .video-frame-cost-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .video-frame-cost-stage { animation: video-frame-cost-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes video-frame-cost-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="video-frame-cost-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="video-frame-cost-bg" width="980" height="322"/>
  <text class="video-frame-cost-h1"  x="30" y="40">Why video compression is not optional</text>
  <text class="video-frame-cost-sub" x="30" y="64">An hour of uncompressed 1080p is 670 GB. Something has to give.</text>
  <g class="video-frame-cost-stage video-frame-cost-s0">
    <rect class="video-frame-cost-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="video-frame-cost-step" x="44" y="142">01</text>
    <text class="video-frame-cost-name" x="70" y="142">One frame</text>
    <text class="video-frame-cost-desc" x="44" y="166">1920 x 1080 pixels, three bytes</text>
    <text class="video-frame-cost-desc" x="44" y="182">each.</text>
    <text class="video-frame-cost-edge" x="44" y="242">6.2 MB</text>
  </g>
  <line class="video-frame-cost-line video-frame-cost-conn video-frame-cost-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#video-frame-cost-tip)"/>
  <g class="video-frame-cost-stage video-frame-cost-s1">
    <rect class="video-frame-cost-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="video-frame-cost-step" x="280" y="142">02</text>
    <text class="video-frame-cost-name" x="306" y="142">One second</text>
    <text class="video-frame-cost-desc" x="280" y="166">Thirty frames, uncompressed.</text>
    <text class="video-frame-cost-edge" x="280" y="242">187 MB</text>
  </g>
  <line class="video-frame-cost-line video-frame-cost-conn video-frame-cost-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#video-frame-cost-tip)"/>
  <g class="video-frame-cost-stage video-frame-cost-s2">
    <rect class="video-frame-cost-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="video-frame-cost-step" x="516" y="142">03</text>
    <text class="video-frame-cost-name" x="542" y="142">One hour</text>
    <text class="video-frame-cost-desc" x="516" y="166">At that rate, before any</text>
    <text class="video-frame-cost-desc" x="516" y="182">compression.</text>
    <text class="video-frame-cost-edge" x="516" y="242">670 GB</text>
  </g>
  <line class="video-frame-cost-line video-frame-cost-conn video-frame-cost-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#video-frame-cost-tip)"/>
  <g class="video-frame-cost-stage video-frame-cost-s3">
    <rect class="video-frame-cost-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="video-frame-cost-step" x="752" y="142">04</text>
    <text class="video-frame-cost-name" x="778" y="142">Compressed</text>
    <text class="video-frame-cost-desc" x="752" y="166">Full frames occasionally;</text>
    <text class="video-frame-cost-desc" x="752" y="182">between them, only changes.</text>
    <text class="video-frame-cost-edge" x="752" y="242">~2 GB</text>
  </g>
  <text class="video-frame-cost-sub" x="30" y="304">This is why a still grabbed from video looks worse than a photograph: most frames were never stored in full.</text>
</svg>
