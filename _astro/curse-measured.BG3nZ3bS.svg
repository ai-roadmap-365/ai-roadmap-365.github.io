<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The curse, measured</title>
  <style>
    .curse-measured-bg   { fill: #f8fafc; }
    .curse-measured-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curse-measured-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curse-measured-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curse-measured-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curse-measured-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curse-measured-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .curse-measured-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .curse-measured-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .curse-measured-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .curse-measured-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .curse-measured-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .curse-measured-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .curse-measured-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .curse-measured-stage { opacity: 1; }

    .curse-measured-s0 { animation-delay: 0.00s; }
    .curse-measured-e0 { animation-delay: 0.00s; }
    .curse-measured-s1 { animation-delay: 1.28s; }
    .curse-measured-e1 { animation-delay: 1.28s; }
    .curse-measured-s2 { animation-delay: 2.56s; }
    .curse-measured-e2 { animation-delay: 2.56s; }
    .curse-measured-s3 { animation-delay: 3.84s; }
    .curse-measured-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .curse-measured-conn  { animation: curse-measured-trace 6.4s ease-in-out infinite; }
      .curse-measured-stage { animation: curse-measured-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes curse-measured-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes curse-measured-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .curse-measured-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .curse-measured-stage { animation: curse-measured-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes curse-measured-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="curse-measured-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="curse-measured-bg" width="980" height="322"/>
  <text class="curse-measured-h1"  x="30" y="40">The curse, measured</text>
  <text class="curse-measured-sub" x="30" y="64">Four steps.</text>
  <g class="curse-measured-stage curse-measured-s0">
    <rect class="curse-measured-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="curse-measured-step" x="44" y="142">01</text>
    <text class="curse-measured-name" x="70" y="142">Generate pairs of random vectors</text>
    <text class="curse-measured-desc" x="44" y="166">And measure their cosine</text>
    <text class="curse-measured-desc" x="44" y="182">similarity.</text>
  </g>
  <line class="curse-measured-line curse-measured-conn curse-measured-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#curse-measured-tip)"/>
  <g class="curse-measured-stage curse-measured-s1">
    <rect class="curse-measured-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="curse-measured-step" x="280" y="142">02</text>
    <text class="curse-measured-name" x="306" y="142">In two dimensions the similarities spread widely</text>
    <text class="curse-measured-desc" x="280" y="166">From near minus one to near one.</text>
  </g>
  <line class="curse-measured-line curse-measured-conn curse-measured-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#curse-measured-tip)"/>
  <g class="curse-measured-stage curse-measured-s2">
    <rect class="curse-measured-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="curse-measured-step" x="516" y="142">03</text>
    <text class="curse-measured-name" x="542" y="142">In a thousand dimensions they cluster tightly near zero</text>
    <text class="curse-measured-desc" x="516" y="166">Almost everything is almost</text>
    <text class="curse-measured-desc" x="516" y="182">perpendicular.</text>
  </g>
  <line class="curse-measured-line curse-measured-conn curse-measured-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#curse-measured-tip)"/>
  <g class="curse-measured-stage curse-measured-s3">
    <rect class="curse-measured-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="curse-measured-step" x="752" y="142">04</text>
    <text class="curse-measured-name" x="778" y="142">So the gap between nearest and furthest shrinks</text>
    <text class="curse-measured-desc" x="752" y="166">Which is what breaks naive</text>
    <text class="curse-measured-desc" x="752" y="182">similarity search.</text>
  </g>
  <text class="curse-measured-sub" x="30" y="304">Measuring the concentration directly is more convincing than the argument, and it explains why learned embeddings use a few hundred dimensions rather than thousands.</text>
</svg>
