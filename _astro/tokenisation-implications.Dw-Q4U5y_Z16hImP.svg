<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cost, context, security and portability.">
  <title>Four consequences of the tokeniser</title>
  <style>
    .tokenisation-implications-bg   { fill: #f8fafc; }
    .tokenisation-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tokenisation-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tokenisation-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tokenisation-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tokenisation-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tokenisation-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tokenisation-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tokenisation-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tokenisation-implications-stage { opacity: 1; }

    .tokenisation-implications-s0 { animation-delay: 0.00s; }
    .tokenisation-implications-e0 { animation-delay: 0.00s; }
    .tokenisation-implications-s1 { animation-delay: 1.28s; }
    .tokenisation-implications-e1 { animation-delay: 1.28s; }
    .tokenisation-implications-s2 { animation-delay: 2.56s; }
    .tokenisation-implications-e2 { animation-delay: 2.56s; }
    .tokenisation-implications-s3 { animation-delay: 3.84s; }
    .tokenisation-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tokenisation-implications-conn  { animation: tokenisation-implications-trace 6.4s ease-in-out infinite; }
      .tokenisation-implications-stage { animation: tokenisation-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tokenisation-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tokenisation-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tokenisation-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tokenisation-implications-stage { animation: tokenisation-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tokenisation-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tokenisation-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tokenisation-implications-bg" width="980" height="322"/>
  <text class="tokenisation-implications-h1"  x="30" y="40">Four consequences of the tokeniser</text>
  <text class="tokenisation-implications-sub" x="30" y="64">Cost, context, security and portability.</text>
  <g class="tokenisation-implications-stage tokenisation-implications-s0">
    <rect class="tokenisation-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tokenisation-implications-step" x="44" y="142">01</text>
    <text class="tokenisation-implications-name" x="70" y="142">Billing is per token</text>
    <text class="tokenisation-implications-desc" x="44" y="166">So tokeniser efficiency is</text>
    <text class="tokenisation-implications-desc" x="44" y="182">directly a cost.</text>
    <text class="tokenisation-implications-edge" x="44" y="242">money</text>
  </g>
  <line class="tokenisation-implications-line tokenisation-implications-conn tokenisation-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tokenisation-implications-tip)"/>
  <g class="tokenisation-implications-stage tokenisation-implications-s1">
    <rect class="tokenisation-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tokenisation-implications-step" x="280" y="142">02</text>
    <text class="tokenisation-implications-name" x="306" y="142">Context length is in tokens</text>
    <text class="tokenisation-implications-desc" x="280" y="166">An efficient tokeniser fits more</text>
    <text class="tokenisation-implications-desc" x="280" y="182">real text in the same window.</text>
  </g>
  <line class="tokenisation-implications-line tokenisation-implications-conn tokenisation-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tokenisation-implications-tip)"/>
  <g class="tokenisation-implications-stage tokenisation-implications-s2">
    <rect class="tokenisation-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tokenisation-implications-step" x="516" y="142">03</text>
    <text class="tokenisation-implications-name" x="542" y="142">Unusual inputs are an attack surface</text>
    <text class="tokenisation-implications-desc" x="516" y="166">Adversarial strings can expand</text>
    <text class="tokenisation-implications-desc" x="516" y="182">enormously in token count.</text>
  </g>
  <line class="tokenisation-implications-line tokenisation-implications-conn tokenisation-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tokenisation-implications-tip)"/>
  <g class="tokenisation-implications-stage tokenisation-implications-s3">
    <rect class="tokenisation-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tokenisation-implications-step" x="752" y="142">04</text>
    <text class="tokenisation-implications-name" x="778" y="142">The tokeniser is part of the model</text>
    <text class="tokenisation-implications-desc" x="752" y="166">Mismatched tokenisers produce</text>
    <text class="tokenisation-implications-desc" x="752" y="182">fluent nonsense.</text>
  </g>
  <text class="tokenisation-implications-sub" x="30" y="304">The mismatch case is worth recognising by its symptom: a model loaded with the wrong tokeniser generates grammatical text with no relationship to the prompt, and nothing errors.</text>
</svg>
