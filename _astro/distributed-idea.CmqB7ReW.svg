<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every device, every step.">
  <title>Distributed training in four steps</title>
  <style>
    .distributed-idea-bg   { fill: #f8fafc; }
    .distributed-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distributed-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distributed-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distributed-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distributed-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distributed-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distributed-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .distributed-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .distributed-idea-stage { opacity: 1; }

    .distributed-idea-s0 { animation-delay: 0.00s; }
    .distributed-idea-e0 { animation-delay: 0.00s; }
    .distributed-idea-s1 { animation-delay: 1.28s; }
    .distributed-idea-e1 { animation-delay: 1.28s; }
    .distributed-idea-s2 { animation-delay: 2.56s; }
    .distributed-idea-e2 { animation-delay: 2.56s; }
    .distributed-idea-s3 { animation-delay: 3.84s; }
    .distributed-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .distributed-idea-conn  { animation: distributed-idea-trace 6.4s ease-in-out infinite; }
      .distributed-idea-stage { animation: distributed-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes distributed-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes distributed-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .distributed-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .distributed-idea-stage { animation: distributed-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes distributed-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="distributed-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="distributed-idea-bg" width="980" height="322"/>
  <text class="distributed-idea-h1"  x="30" y="40">Distributed training in four steps</text>
  <text class="distributed-idea-sub" x="30" y="64">Every device, every step.</text>
  <g class="distributed-idea-stage distributed-idea-s0">
    <rect class="distributed-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-idea-step" x="44" y="142">01</text>
    <text class="distributed-idea-name" x="70" y="142">Every device holds the model</text>
    <text class="distributed-idea-desc" x="44" y="166">Or a shard of it. Same</text>
    <text class="distributed-idea-desc" x="44" y="182">computation, different data.</text>
  </g>
  <line class="distributed-idea-line distributed-idea-conn distributed-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#distributed-idea-tip)"/>
  <g class="distributed-idea-stage distributed-idea-s1">
    <rect class="distributed-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-idea-step" x="280" y="142">02</text>
    <text class="distributed-idea-name" x="306" y="142">Split the batch across devices</text>
    <text class="distributed-idea-desc" x="280" y="166">Each computes gradients on its</text>
    <text class="distributed-idea-desc" x="280" y="182">own slice.</text>
  </g>
  <line class="distributed-idea-line distributed-idea-conn distributed-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#distributed-idea-tip)"/>
  <g class="distributed-idea-stage distributed-idea-s2">
    <rect class="distributed-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-idea-step" x="516" y="142">03</text>
    <text class="distributed-idea-name" x="542" y="142">Average the gradients across all of them</text>
    <text class="distributed-idea-desc" x="516" y="166">A collective operation over the</text>
    <text class="distributed-idea-desc" x="516" y="182">network.</text>
    <text class="distributed-idea-edge" x="516" y="242">communication</text>
  </g>
  <line class="distributed-idea-line distributed-idea-conn distributed-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#distributed-idea-tip)"/>
  <g class="distributed-idea-stage distributed-idea-s3">
    <rect class="distributed-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-idea-step" x="752" y="142">04</text>
    <text class="distributed-idea-name" x="778" y="142">And every device applies the same update</text>
    <text class="distributed-idea-desc" x="752" y="166">So the replicas never diverge.</text>
  </g>
  <text class="distributed-idea-sub" x="30" y="304">Keeping the replicas identical is what makes this equivalent to training on one enormous device, and it is why the averaging step cannot be skipped or approximated casually.</text>
</svg>
