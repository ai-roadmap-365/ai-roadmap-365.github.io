<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img">
  <title>Plan And Solve Vs React Comparison</title>
  <defs>
    <style>
      .d289f-bg { fill: #f8fafc; }
      .d289f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d289f-plan { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d289f-react { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d289f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d289f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d289f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; }
      .d289f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .d289f-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d289f-bg" />
  
  <text x="40" y="40" class="d289f-title">Plan and Solve vs ReAct Comparison</text>
  <text x="40" y="65" class="d289f-subtitle">Plan and Solve vs ReAct Comparison diagram contrasting upfront macro planning with iterative step-by-step reasoning</text>
  
  <!-- Left Side: Plan-and-Solve -->
  <rect x="40" y="90" width="380" height="310" class="d289f-plan" />
  <text x="60" y="125" class="d289f-header" fill="#1d4ed8">Plan-and-Solve (Macro-First)</text>
  
  <rect x="60" y="145" width="340" height="50" class="d289f-card" />
  <text x="75" y="175" class="d289f-text">1. Upfront Planner: Generate full sub-task list [T1, T2, T3]</text>
  
  <path d="M 230 195 L 230 220" class="d289f-flow" />
  
  <rect x="60" y="220" width="340" height="50" class="d289f-card" />
  <text x="75" y="250" class="d289f-text">2. Sequential Executor: Execute T1 -> T2 -> T3 strictly</text>
  
  <path d="M 230 270 L 230 295" class="d289f-flow" />
  
  <rect x="60" y="295" width="340" height="50" class="d289f-card" />
  <text x="75" y="325" class="d289f-text">3. Re-Planner: Update plan only if a sub-task fails</text>
  
  <text x="60" y="375" class="d289f-text" font-weight="600" fill="#1d4ed8">Best for: Well-structured, predictable multi-step tasks</text>
  
  <!-- Right Side: ReAct -->
  <rect x="480" y="90" width="380" height="310" class="d289f-react" />
  <text x="500" y="125" class="d289f-header" fill="#a16207">ReAct (Dynamic Interleaved)</text>
  
  <rect x="500" y="145" width="340" height="50" class="d289f-card" />
  <text x="515" y="175" class="d289f-text">1. Single-Step Thought: "What is my immediate next action?"</text>
  
  <path d="M 670 195 L 670 220" class="d289f-flow" />
  
  <rect x="500" y="220" width="340" height="50" class="d289f-card" />
  <text x="515" y="250" class="d289f-text">2. Action: Call 1 tool immediately -> Capture Observation</text>
  
  <path d="M 670 270 L 670 295" class="d289f-flow" />
  
  <rect x="500" y="295" width="340" height="50" class="d289f-card" />
  <text x="515" y="325" class="d289f-text">3. Dynamic Recalibration: Re-evaluate next step based on output</text>
  
  <text x="500" y="375" class="d289f-text" font-weight="600" fill="#a16207">Best for: Exploratory, unpredictable, open-ended tasks</text>
</svg>