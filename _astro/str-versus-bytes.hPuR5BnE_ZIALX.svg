<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Python 3 separated them, permanently and deliberately.">
  <title>Text and bytes are different types</title>
  <style>
    .str-versus-bytes-bg   { fill: #f8fafc; }
    .str-versus-bytes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .str-versus-bytes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .str-versus-bytes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .str-versus-bytes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .str-versus-bytes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .str-versus-bytes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .str-versus-bytes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .str-versus-bytes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .str-versus-bytes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .str-versus-bytes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .str-versus-bytes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .str-versus-bytes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .str-versus-bytes-row { opacity: 1; }
    .str-versus-bytes-r0 { animation-delay: 0.00s; }
    .str-versus-bytes-r1 { animation-delay: 0.45s; }
    .str-versus-bytes-r2 { animation-delay: 0.90s; }
    .str-versus-bytes-r3 { animation-delay: 1.35s; }
    .str-versus-bytes-r4 { animation-delay: 1.80s; }
    .str-versus-bytes-row { animation: str-versus-bytes-reveal 7.3s ease-in-out infinite; }
    @keyframes str-versus-bytes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="str-versus-bytes-bg" width="980" height="390"/>
  <text class="str-versus-bytes-h1"  x="30" y="40">Text and bytes are different types</text>
  <text class="str-versus-bytes-sub" x="30" y="64">Python 3 separated them, permanently and deliberately.</text>
  <rect class="str-versus-bytes-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="str-versus-bytes-name" x="46" y="122">str</text>
  <text class="str-versus-bytes-desc" x="46" y="142">Text. A sequence of characters.</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r0" x="46" y="182">"café" — four characters</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r1" x="46" y="216">len() counts CHARACTERS</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r2" x="46" y="250">No encoding attached; it is abstract text</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r3" x="46" y="284">What you manipulate with methods</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r4" x="46" y="318">What every f-string produces</text>
  <rect class="str-versus-bytes-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="str-versus-bytes-name" x="526" y="122">bytes</text>
  <text class="str-versus-bytes-desc" x="526" y="142">Raw bytes. No meaning attached.</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r0" x="526" y="182">b'caf\\xc3\\xa9' — five bytes</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r1" x="526" y="216">len() counts BYTES</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r2" x="526" y="250">Meaningless until you name an encoding</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r3" x="526" y="284">What files and sockets actually carry</text>
  <text class="str-versus-bytes-desc str-versus-bytes-row str-versus-bytes-r4" x="526" y="318">.encode() to get here, .decode() to leave</text>
  <text class="str-versus-bytes-sub" x="30" y="372">Python 2 conflated these, and the resulting silent corruption was severe enough to justify a breaking language change. Requiring you to name an encoding is the whole point.</text>
</svg>
