<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And it is how CI secrets leak.">
  <title>One word, categorically different</title>
  <style>
    .pr-or-pr-target-bg   { fill: #f8fafc; }
    .pr-or-pr-target-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-or-pr-target-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-or-pr-target-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-or-pr-target-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-or-pr-target-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-or-pr-target-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pr-or-pr-target-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pr-or-pr-target-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pr-or-pr-target-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pr-or-pr-target-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pr-or-pr-target-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pr-or-pr-target-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pr-or-pr-target-row { opacity: 1; }
    .pr-or-pr-target-r0 { animation-delay: 0.00s; }
    .pr-or-pr-target-r1 { animation-delay: 0.45s; }
    .pr-or-pr-target-r2 { animation-delay: 0.90s; }
    .pr-or-pr-target-r3 { animation-delay: 1.35s; }
    .pr-or-pr-target-r4 { animation-delay: 1.80s; }
    .pr-or-pr-target-row { animation: pr-or-pr-target-reveal 7.3s ease-in-out infinite; }
    @keyframes pr-or-pr-target-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pr-or-pr-target-bg" width="980" height="390"/>
  <text class="pr-or-pr-target-h1"  x="30" y="40">One word, categorically different</text>
  <text class="pr-or-pr-target-sub" x="30" y="64">And it is how CI secrets leak.</text>
  <rect class="pr-or-pr-target-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pr-or-pr-target-name" x="46" y="122">pull_request</text>
  <text class="pr-or-pr-target-desc" x="46" y="142">Fork code, no secrets.</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r0" x="46" y="182">Checks out the fork's code</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r1" x="46" y="216">A read-only token</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r2" x="46" y="250">No secrets in the environment</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r3" x="46" y="284">A hostile PR can run anything</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r4" x="46" y="318">And gain nothing</text>
  <rect class="pr-or-pr-target-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pr-or-pr-target-name" x="526" y="122">pull_request_target</text>
  <text class="pr-or-pr-target-desc" x="526" y="142">Base context, with secrets.</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r0" x="526" y="182">Runs in the base repository's context</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r1" x="526" y="216">Secrets are present</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r2" x="526" y="250">Added so workflows could label and comment</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r3" x="526" y="284">People add a fork checkout next</text>
  <text class="pr-or-pr-target-desc pr-or-pr-target-row pr-or-pr-target-r4" x="526" y="318">Now untrusted code has your secrets</text>
  <text class="pr-or-pr-target-sub" x="30" y="372">The rule that survives: `pull_request_target` may inspect a pull request and must never run its code. If you need both, that is two workflows, not one.</text>
</svg>
