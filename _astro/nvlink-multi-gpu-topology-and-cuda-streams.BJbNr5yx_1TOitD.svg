<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="NVLink Multi-GPU Topology and CUDA Streams">
  <title>NVLink Multi-GPU Topology and CUDA Streams</title>
  <defs>
    <style>
      .d338a-bg { fill: #f8fafc; }
      .d338a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d338a-gpu { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d338a-nvl { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d338a-stm { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d338a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d338a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d338a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d338a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d338a-bg" />
  
  <text x="40" y="40" class="d338a-title">Multi-GPU Hardware Topology &amp; CUDA Streaming</text>
  <text x="40" y="65" class="d338a-subtitle">NVLink Multi-GPU Topology and CUDA Streams showing 4x H100 GPUs connected via 900 GB/s NVSwitch Fabric with Concurrent CUDA Stream Overlap between DMA Memory Copy and Tensor Core Compute</text>
  
  <!-- Multi-GPU Fabric -->
  <rect x="40" y="110" width="240" height="270" class="d338a-gpu" />
  <text x="55" y="145" class="d338a-header" fill="#1d4ed8">1. 4x H100 SXM5 Cluster</text>
  <text x="55" y="180" class="d338a-text">• GPU 0: Layer 0-19 (80GB)</text>
  <text x="55" y="205" class="d338a-text">• GPU 1: Layer 20-39 (80GB)</text>
  <text x="55" y="230" class="d338a-text">• GPU 2: Layer 40-59 (80GB)</text>
  <text x="55" y="255" class="d338a-text">• GPU 3: Layer 60-79 (80GB)</text>
  <text x="55" y="295" class="d338a-text" font-weight="600" fill="#1d4ed8">320GB Total VRAM Pool</text>
  <text x="55" y="320" class="d338a-text">Hosts 70B &amp; 405B Models</text>
  
  <!-- NVSwitch Interconnect -->
  <rect x="315" y="110" width="240" height="270" class="d338a-nvl" />
  <text x="330" y="145" class="d338a-header" fill="#7e22ce">2. NVSwitch 900 GB/s Fabric</text>
  <text x="330" y="180" class="d338a-text">• Bidirectional AllReduce</text>
  <text x="330" y="205" class="d338a-text">• 14x faster than PCIe Gen 5</text>
  <text x="330" y="230" class="d338a-text">• Microsecond synchronization</text>
  <text x="330" y="255" class="d338a-text">• Zero CPU host bouncing</text>
  <text x="330" y="295" class="d338a-text" font-weight="600" fill="#7e22ce">Zero Communication Drag</text>
  <text x="330" y="320" class="d338a-text">Enables 8-way Tensor Parallel</text>
  
  <!-- CUDA Stream Concurrency -->
  <rect x="590" y="110" width="270" height="270" class="d338a-stm" />
  <text x="605" y="145" class="d338a-header" fill="#15803d">3. CUDA Stream Overlap</text>
  <text x="605" y="180" class="d338a-text">• **Stream 1 (HtoD DMA):**</text>
  <text x="605" y="200" class="d338a-text">  Copies Batch N+1 via Pinned RAM</text>
  <text x="605" y="225" class="d338a-text">• **Stream 2 (Compute Kernel):**</text>
  <text x="605" y="245" class="d338a-text">  Executes Batch N on Tensor Cores</text>
  <text x="605" y="270" class="d338a-text">• **Stream 3 (DtoH DMA):**</text>
  <text x="605" y="290" class="d338a-text">  Emits Batch N-1 tokens</text>
  <text x="605" y="320" class="d338a-text" font-weight="600" fill="#15803d">100% Hardware Saturation</text>
</svg>