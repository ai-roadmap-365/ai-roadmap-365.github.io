<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" font-family="system-ui, sans-serif">
  <title>A packet hopping across routers in several autonomous systems from a source computer to a destination server</title>
  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A packet's route: hop by hop across autonomous systems</text>

  <!-- AS group backgrounds -->
  <rect x="30" y="70" width="210" height="150" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
  <text x="135" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">AS 1 — your network</text>

  <rect x="285" y="70" width="210" height="150" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
  <text x="390" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">AS 2 — transit / ISP</text>

  <rect x="540" y="70" width="210" height="150" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
  <text x="645" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">AS 3 — destination network</text>

  <!-- Source -->
  <rect x="45" y="150" width="80" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="85" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Source</text>
  <text x="85" y="190" text-anchor="middle" font-size="14" fill="#1a202c">computer</text>

  <!-- Routers -->
  <circle cx="200" cy="176" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">R1</text>
  <text x="200" y="189" text-anchor="middle" font-size="14" fill="#1a202c">gateway</text>

  <circle cx="330" cy="176" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="330" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">R2</text>

  <circle cx="455" cy="176" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="455" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">R3</text>

  <circle cx="590" cy="176" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="590" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">R4</text>

  <!-- Destination -->
  <rect x="655" y="150" width="80" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="695" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Dest.</text>
  <text x="695" y="190" text-anchor="middle" font-size="14" fill="#1a202c">server</text>

  <!-- Hop arrows -->
  <g stroke="#1d4ed8" stroke-width="3" fill="#1d4ed8">
    <line x1="125" y1="176" x2="162" y2="176"/>
    <polygon points="170,176 156,169 156,183"/>
    <line x1="230" y1="176" x2="292" y2="176"/>
    <polygon points="300,176 286,169 286,183"/>
    <line x1="360" y1="176" x2="417" y2="176"/>
    <polygon points="425,176 411,169 411,183"/>
    <line x1="485" y1="176" x2="552" y2="176"/>
    <polygon points="560,176 546,169 546,183"/>
    <line x1="620" y1="176" x2="647" y2="176"/>
    <polygon points="655,176 641,169 641,183"/>
  </g>

  <!-- Hop labels -->
  <text x="390" y="240" text-anchor="middle" font-size="14" fill="#1a202c">Each router reads the destination IP, forwards to the next hop, and forgets the packet.</text>

  <!-- BGP note -->
  <rect x="30" y="270" width="720" height="58" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="390" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Between autonomous systems: BGP</text>
  <text x="390" y="314" text-anchor="middle" font-size="14" fill="#1a202c">Each AS advertises which address blocks it can reach, so routers learn the next hop toward any destination.</text>

  <!-- traceroute note -->
  <rect x="30" y="344" width="720" height="58" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="390" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">traceroute reveals the hops</text>
  <text x="390" y="388" text-anchor="middle" font-size="14" fill="#1a202c">Sending packets with hop limits 1, 2, 3, … makes each router in turn report back, exposing R1, R2, R3, R4.</text>
</svg>
