<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Properties of people, not of machines.">
  <title>Three thresholds, unchanged since 1968</title>
  <style>
    .miller-thresholds-bg   { fill: #f8fafc; }
    .miller-thresholds-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .miller-thresholds-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .miller-thresholds-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .miller-thresholds-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .miller-thresholds-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .miller-thresholds-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .miller-thresholds-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .miller-thresholds-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .miller-thresholds-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .miller-thresholds-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .miller-thresholds-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .miller-thresholds-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .miller-thresholds-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .miller-thresholds-stage { opacity: 1; }

    .miller-thresholds-s0 { animation-delay: 0.00s; }
    .miller-thresholds-e0 { animation-delay: 0.00s; }
    .miller-thresholds-s1 { animation-delay: 1.28s; }
    .miller-thresholds-e1 { animation-delay: 1.28s; }
    .miller-thresholds-s2 { animation-delay: 2.56s; }
    .miller-thresholds-e2 { animation-delay: 2.56s; }
    .miller-thresholds-s3 { animation-delay: 3.84s; }
    .miller-thresholds-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .miller-thresholds-conn  { animation: miller-thresholds-trace 6.4s ease-in-out infinite; }
      .miller-thresholds-stage { animation: miller-thresholds-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes miller-thresholds-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes miller-thresholds-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .miller-thresholds-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .miller-thresholds-stage { animation: miller-thresholds-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes miller-thresholds-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="miller-thresholds-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="miller-thresholds-bg" width="980" height="322"/>
  <text class="miller-thresholds-h1"  x="30" y="40">Three thresholds, unchanged since 1968</text>
  <text class="miller-thresholds-sub" x="30" y="64">Properties of people, not of machines.</text>
  <g class="miller-thresholds-stage miller-thresholds-s0">
    <rect class="miller-thresholds-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="miller-thresholds-step" x="44" y="142">01</text>
    <text class="miller-thresholds-name" x="70" y="142">100 ms</text>
    <text class="miller-thresholds-desc" x="44" y="166">Feels instantaneous. The click</text>
    <text class="miller-thresholds-desc" x="44" y="182">registered.</text>
    <text class="miller-thresholds-edge" x="44" y="242">instant</text>
  </g>
  <line class="miller-thresholds-line miller-thresholds-conn miller-thresholds-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#miller-thresholds-tip)"/>
  <g class="miller-thresholds-stage miller-thresholds-s1">
    <rect class="miller-thresholds-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="miller-thresholds-step" x="280" y="142">02</text>
    <text class="miller-thresholds-name" x="306" y="142">1 second</text>
    <text class="miller-thresholds-desc" x="280" y="166">A train of thought survives.</text>
    <text class="miller-thresholds-desc" x="280" y="182">Beyond this, attention starts to</text>
    <text class="miller-thresholds-desc" x="280" y="198">wander.</text>
    <text class="miller-thresholds-edge" x="280" y="242">seamless</text>
  </g>
  <line class="miller-thresholds-line miller-thresholds-conn miller-thresholds-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#miller-thresholds-tip)"/>
  <g class="miller-thresholds-stage miller-thresholds-s2">
    <rect class="miller-thresholds-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="miller-thresholds-step" x="516" y="142">03</text>
    <text class="miller-thresholds-name" x="542" y="142">10 seconds</text>
    <text class="miller-thresholds-desc" x="516" y="166">The limit of attention on one</text>
    <text class="miller-thresholds-desc" x="516" y="182">task. People switch away.</text>
    <text class="miller-thresholds-edge" x="516" y="242">lost</text>
  </g>
  <line class="miller-thresholds-line miller-thresholds-conn miller-thresholds-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#miller-thresholds-tip)"/>
  <g class="miller-thresholds-stage miller-thresholds-s3">
    <rect class="miller-thresholds-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="miller-thresholds-step" x="752" y="142">04</text>
    <text class="miller-thresholds-name" x="778" y="142">Time to first token</text>
    <text class="miller-thresholds-desc" x="752" y="166">The number a streaming interface</text>
    <text class="miller-thresholds-desc" x="752" y="182">has to keep under the first two.</text>
    <text class="miller-thresholds-edge" x="752" y="242">the target</text>
  </g>
  <text class="miller-thresholds-sub" x="30" y="304">A model that takes eleven seconds in total is not a ten-second wait if the first token arrives in four — which is why time to first token, not total duration, is the number worth optimising.</text>
</svg>
