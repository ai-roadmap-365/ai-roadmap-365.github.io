<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what it exposes.">
  <title>What fine-tuning costs</title>
  <style>
    .finetune-implications-bg   { fill: #f8fafc; }
    .finetune-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .finetune-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .finetune-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .finetune-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .finetune-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .finetune-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-implications-row { opacity: 1; }
    .finetune-implications-r0 { animation-delay: 0.00s; }
    .finetune-implications-r1 { animation-delay: 0.45s; }
    .finetune-implications-r2 { animation-delay: 0.90s; }
    .finetune-implications-r3 { animation-delay: 1.35s; }
    .finetune-implications-r4 { animation-delay: 1.80s; }
    .finetune-implications-row { animation: finetune-implications-reveal 7.3s ease-in-out infinite; }
    @keyframes finetune-implications-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="finetune-implications-bg" width="980" height="390"/>
  <text class="finetune-implications-h1"  x="30" y="40">What fine-tuning costs</text>
  <text class="finetune-implications-sub" x="30" y="64">And what it exposes.</text>
  <rect class="finetune-implications-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="finetune-implications-name" x="46" y="122">What you gain</text>
  <text class="finetune-implications-desc" x="46" y="142">Cheap specialisation.</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r0" x="46" y="182">Task accuracy above a prompted large model</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r1" x="46" y="216">Millisecond latency on ordinary hardware</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r2" x="46" y="250">No per-token API cost</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r3" x="46" y="284">Full control of the deployed artefact</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r4" x="46" y="318">Predictable, versionable behaviour</text>
  <rect class="finetune-implications-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="finetune-implications-name" x="526" y="122">What you take on</text>
  <text class="finetune-implications-desc" x="526" y="142">Four obligations.</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r0" x="526" y="182">Training data can be extracted from weights</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r1" x="526" y="216">Base model licences bind the fine-tune</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r2" x="526" y="250">Data drift requires periodic retraining</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r3" x="526" y="284">Pretraining bias is inherited, not removed</text>
  <text class="finetune-implications-desc finetune-implications-row finetune-implications-r4" x="526" y="318">And a labelled dataset must exist</text>
  <text class="finetune-implications-sub" x="30" y="372">Extraction from weights is the one teams most often miss: a model fine-tuned on confidential text is itself a confidential artefact, whatever the base model's licence says.</text>
</svg>
