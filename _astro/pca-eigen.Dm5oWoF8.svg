<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Principal components are eigenvectors</title>
  <style>
    .pca-eigen-bg   { fill: #f8fafc; }
    .pca-eigen-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-eigen-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-eigen-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-eigen-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-eigen-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-eigen-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pca-eigen-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pca-eigen-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pca-eigen-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pca-eigen-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pca-eigen-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pca-eigen-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pca-eigen-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pca-eigen-stage { opacity: 1; }

    .pca-eigen-s0 { animation-delay: 0.00s; }
    .pca-eigen-e0 { animation-delay: 0.00s; }
    .pca-eigen-s1 { animation-delay: 1.28s; }
    .pca-eigen-e1 { animation-delay: 1.28s; }
    .pca-eigen-s2 { animation-delay: 2.56s; }
    .pca-eigen-e2 { animation-delay: 2.56s; }
    .pca-eigen-s3 { animation-delay: 3.84s; }
    .pca-eigen-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pca-eigen-conn  { animation: pca-eigen-trace 6.4s ease-in-out infinite; }
      .pca-eigen-stage { animation: pca-eigen-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pca-eigen-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pca-eigen-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pca-eigen-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pca-eigen-stage { animation: pca-eigen-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pca-eigen-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pca-eigen-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pca-eigen-bg" width="980" height="322"/>
  <text class="pca-eigen-h1"  x="30" y="40">Principal components are eigenvectors</text>
  <text class="pca-eigen-sub" x="30" y="64">Four steps.</text>
  <g class="pca-eigen-stage pca-eigen-s0">
    <rect class="pca-eigen-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pca-eigen-step" x="44" y="142">01</text>
    <text class="pca-eigen-name" x="70" y="142">Centre the data</text>
    <text class="pca-eigen-desc" x="44" y="166">Which is not optional, and is</text>
    <text class="pca-eigen-desc" x="44" y="182">the commonest omission.</text>
  </g>
  <line class="pca-eigen-line pca-eigen-conn pca-eigen-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pca-eigen-tip)"/>
  <g class="pca-eigen-stage pca-eigen-s1">
    <rect class="pca-eigen-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pca-eigen-step" x="280" y="142">02</text>
    <text class="pca-eigen-name" x="306" y="142">Compute the covariance matrix</text>
    <text class="pca-eigen-desc" x="280" y="166">Symmetric, so the nice case</text>
    <text class="pca-eigen-desc" x="280" y="182">applies.</text>
  </g>
  <line class="pca-eigen-line pca-eigen-conn pca-eigen-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pca-eigen-tip)"/>
  <g class="pca-eigen-stage pca-eigen-s2">
    <rect class="pca-eigen-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pca-eigen-step" x="516" y="142">03</text>
    <text class="pca-eigen-name" x="542" y="142">Its eigenvectors are the principal components</text>
    <text class="pca-eigen-desc" x="516" y="166">Directions of greatest variance.</text>
  </g>
  <line class="pca-eigen-line pca-eigen-conn pca-eigen-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pca-eigen-tip)"/>
  <g class="pca-eigen-stage pca-eigen-s3">
    <rect class="pca-eigen-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pca-eigen-step" x="752" y="142">04</text>
    <text class="pca-eigen-name" x="778" y="142">And their eigenvalues are the variance each captures</text>
    <text class="pca-eigen-desc" x="752" y="166">Which is why ordering by</text>
    <text class="pca-eigen-desc" x="752" y="182">eigenvalue ranks them.</text>
  </g>
  <text class="pca-eigen-sub" x="30" y="304">Forgetting to centre produces a first component pointing at the data's mean rather than at its greatest variation, which is a silent and total failure.</text>
</svg>
