<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What the library does</title>
  <style>
    .what-sklearn-does-bg   { fill: #f8fafc; }
    .what-sklearn-does-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-sklearn-does-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-sklearn-does-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-sklearn-does-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-sklearn-does-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-sklearn-does-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-sklearn-does-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .what-sklearn-does-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .what-sklearn-does-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .what-sklearn-does-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .what-sklearn-does-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .what-sklearn-does-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .what-sklearn-does-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .what-sklearn-does-stage { opacity: 1; }

    .what-sklearn-does-s0 { animation-delay: 0.00s; }
    .what-sklearn-does-e0 { animation-delay: 0.00s; }
    .what-sklearn-does-s1 { animation-delay: 1.28s; }
    .what-sklearn-does-e1 { animation-delay: 1.28s; }
    .what-sklearn-does-s2 { animation-delay: 2.56s; }
    .what-sklearn-does-e2 { animation-delay: 2.56s; }
    .what-sklearn-does-s3 { animation-delay: 3.84s; }
    .what-sklearn-does-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .what-sklearn-does-conn  { animation: what-sklearn-does-trace 6.4s ease-in-out infinite; }
      .what-sklearn-does-stage { animation: what-sklearn-does-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes what-sklearn-does-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes what-sklearn-does-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .what-sklearn-does-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .what-sklearn-does-stage { animation: what-sklearn-does-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes what-sklearn-does-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="what-sklearn-does-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="what-sklearn-does-bg" width="980" height="322"/>
  <text class="what-sklearn-does-h1"  x="30" y="40">What the library does</text>
  <text class="what-sklearn-does-sub" x="30" y="64">Four steps.</text>
  <g class="what-sklearn-does-stage what-sklearn-does-s0">
    <rect class="what-sklearn-does-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="what-sklearn-does-step" x="44" y="142">01</text>
    <text class="what-sklearn-does-name" x="70" y="142">Decompose the data matrix directly</text>
    <text class="what-sklearn-does-desc" x="44" y="166">Without ever forming the squared</text>
    <text class="what-sklearn-does-desc" x="44" y="182">product.</text>
  </g>
  <line class="what-sklearn-does-line what-sklearn-does-conn what-sklearn-does-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#what-sklearn-does-tip)"/>
  <g class="what-sklearn-does-stage what-sklearn-does-s1">
    <rect class="what-sklearn-does-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="what-sklearn-does-step" x="280" y="142">02</text>
    <text class="what-sklearn-does-name" x="306" y="142">So the condition number is never squared</text>
    <text class="what-sklearn-does-desc" x="280" y="166">And precision is preserved.</text>
  </g>
  <line class="what-sklearn-does-line what-sklearn-does-conn what-sklearn-does-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#what-sklearn-does-tip)"/>
  <g class="what-sklearn-does-stage what-sklearn-does-s2">
    <rect class="what-sklearn-does-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="what-sklearn-does-step" x="516" y="142">03</text>
    <text class="what-sklearn-does-name" x="542" y="142">For a rank-deficient problem it returns the minimum-norm solution</text>
    <text class="what-sklearn-does-desc" x="516" y="166">Rather than failing or returning</text>
    <text class="what-sklearn-does-desc" x="516" y="182">something arbitrary.</text>
  </g>
  <line class="what-sklearn-does-line what-sklearn-does-conn what-sklearn-does-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#what-sklearn-does-tip)"/>
  <g class="what-sklearn-does-stage what-sklearn-does-s3">
    <rect class="what-sklearn-does-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="what-sklearn-does-step" x="752" y="142">04</text>
    <text class="what-sklearn-does-name" x="778" y="142">Which is why the library and the textbook disagree</text>
    <text class="what-sklearn-does-desc" x="752" y="166">And why the library is right.</text>
  </g>
  <text class="what-sklearn-does-sub" x="30" y="304">The minimum-norm choice is a deliberate policy rather than an accident, and knowing it explains why duplicated columns produce small equal coefficients rather than large opposite ones.</text>
</svg>
