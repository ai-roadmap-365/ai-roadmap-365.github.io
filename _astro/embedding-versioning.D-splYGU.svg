<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Change the model and the store is invalid.">
  <title>Embeddings are versioned data</title>
  <style>
    .embedding-versioning-bg   { fill: #f8fafc; }
    .embedding-versioning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-versioning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-versioning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-versioning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-versioning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-versioning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-versioning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .embedding-versioning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .embedding-versioning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .embedding-versioning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .embedding-versioning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .embedding-versioning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-versioning-row { opacity: 1; }
    .embedding-versioning-r0 { animation-delay: 0.00s; }
    .embedding-versioning-r1 { animation-delay: 0.45s; }
    .embedding-versioning-r2 { animation-delay: 0.90s; }
    .embedding-versioning-r3 { animation-delay: 1.35s; }
    .embedding-versioning-r4 { animation-delay: 1.80s; }
    .embedding-versioning-row { animation: embedding-versioning-reveal 7.3s ease-in-out infinite; }
    @keyframes embedding-versioning-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="embedding-versioning-bg" width="980" height="390"/>
  <text class="embedding-versioning-h1"  x="30" y="40">Embeddings are versioned data</text>
  <text class="embedding-versioning-sub" x="30" y="64">Change the model and the store is invalid.</text>
  <rect class="embedding-versioning-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="embedding-versioning-name" x="46" y="122">Treated as durable</text>
  <text class="embedding-versioning-desc" x="46" y="142">A silent correctness bug.</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r0" x="46" y="182">New model, old vectors in the store</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r1" x="46" y="216">Query and documents in different spaces</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r2" x="46" y="250">Similarity scores become meaningless</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r3" x="46" y="284">Nothing raises; results just get worse</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r4" x="46" y="318">Discovered by evaluation, or not at all</text>
  <rect class="embedding-versioning-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="embedding-versioning-name" x="526" y="122">Treated as versioned</text>
  <text class="embedding-versioning-desc" x="526" y="142">The model is part of the data's identity.</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r0" x="526" y="182">The model name is stored with the index</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r1" x="526" y="216">A mismatch is detected at startup</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r2" x="526" y="250">Re-embedding is a planned migration</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r3" x="526" y="284">Old and new can run side by side</text>
  <text class="embedding-versioning-desc embedding-versioning-row embedding-versioning-r4" x="526" y="318">The evaluation set catches regressions</text>
  <text class="embedding-versioning-sub" x="30" y="372">This is Day 5's preprocessing-must-match rule at the corpus level: query and document must pass through the same transform, and an upgrade that changes one silently invalidates the other.</text>
</svg>
