<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five steps per request.">
  <title>The serving path</title>
  <style>
    .serving-flow-bg   { fill: #f8fafc; }
    .serving-flow-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-flow-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-flow-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-flow-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-flow-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-flow-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serving-flow-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .serving-flow-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .serving-flow-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .serving-flow-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .serving-flow-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .serving-flow-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .serving-flow-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .serving-flow-stage { opacity: 1; }

    .serving-flow-s0 { animation-delay: 0.00s; }
    .serving-flow-e0 { animation-delay: 0.00s; }
    .serving-flow-s1 { animation-delay: 1.33s; }
    .serving-flow-e1 { animation-delay: 1.33s; }
    .serving-flow-s2 { animation-delay: 2.67s; }
    .serving-flow-e2 { animation-delay: 2.67s; }
    .serving-flow-s3 { animation-delay: 4.00s; }
    .serving-flow-e3 { animation-delay: 4.00s; }
    .serving-flow-s4 { animation-delay: 5.33s; }
    .serving-flow-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .serving-flow-conn  { animation: serving-flow-trace 8s ease-in-out infinite; }
      .serving-flow-stage { animation: serving-flow-arrive 8s ease-in-out infinite; }
    }
    @keyframes serving-flow-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes serving-flow-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .serving-flow-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .serving-flow-stage { animation: serving-flow-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes serving-flow-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="serving-flow-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="serving-flow-bg" width="980" height="322"/>
  <text class="serving-flow-h1"  x="30" y="40">The serving path</text>
  <text class="serving-flow-sub" x="30" y="64">Five steps per request.</text>
  <g class="serving-flow-stage serving-flow-s0">
    <rect class="serving-flow-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="serving-flow-step" x="44" y="142">01</text>
    <text class="serving-flow-name" x="70" y="142">Validate the request against the schema</text>
    <text class="serving-flow-desc" x="44" y="166">Rejecting malformed input</text>
    <text class="serving-flow-desc" x="44" y="182">loudly.</text>
  </g>
  <line class="serving-flow-line serving-flow-conn serving-flow-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#serving-flow-tip)"/>
  <g class="serving-flow-stage serving-flow-s1">
    <rect class="serving-flow-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="serving-flow-step" x="233" y="142">02</text>
    <text class="serving-flow-name" x="259" y="142">Assemble the features</text>
    <text class="serving-flow-desc" x="233" y="166">Including any looked up</text>
    <text class="serving-flow-desc" x="233" y="182">from a store.</text>
  </g>
  <line class="serving-flow-line serving-flow-conn serving-flow-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#serving-flow-tip)"/>
  <g class="serving-flow-stage serving-flow-s2">
    <rect class="serving-flow-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="serving-flow-step" x="422" y="142">03</text>
    <text class="serving-flow-name" x="448" y="142">Run the pipeline</text>
    <text class="serving-flow-desc" x="422" y="166">Preprocessing and model</text>
    <text class="serving-flow-desc" x="422" y="182">together, as one</text>
    <text class="serving-flow-desc" x="422" y="198">artefact.</text>
  </g>
  <line class="serving-flow-line serving-flow-conn serving-flow-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#serving-flow-tip)"/>
  <g class="serving-flow-stage serving-flow-s3">
    <rect class="serving-flow-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="serving-flow-step" x="611" y="142">04</text>
    <text class="serving-flow-name" x="637" y="142">Apply the threshold and business rules</text>
    <text class="serving-flow-desc" x="611" y="166">Which are part of the</text>
    <text class="serving-flow-desc" x="611" y="182">decision, not the model.</text>
  </g>
  <line class="serving-flow-line serving-flow-conn serving-flow-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#serving-flow-tip)"/>
  <g class="serving-flow-stage serving-flow-s4">
    <rect class="serving-flow-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="serving-flow-step" x="800" y="142">05</text>
    <text class="serving-flow-name" x="826" y="142">And return the result with its metadata</text>
    <text class="serving-flow-desc" x="800" y="166">Model version, score, and</text>
    <text class="serving-flow-desc" x="800" y="182">a request identifier.</text>
  </g>
  <text class="serving-flow-sub" x="30" y="304">Returning the model version with every response is what makes production incidents traceable, and it costs a single field.</text>
</svg>
