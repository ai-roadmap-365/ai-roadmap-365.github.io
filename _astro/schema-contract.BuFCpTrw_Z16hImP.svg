<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The schema contract</title>
  <style>
    .schema-contract-bg   { fill: #f8fafc; }
    .schema-contract-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-contract-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-contract-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-contract-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-contract-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-contract-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schema-contract-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schema-contract-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schema-contract-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schema-contract-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schema-contract-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schema-contract-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schema-contract-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schema-contract-stage { opacity: 1; }

    .schema-contract-s0 { animation-delay: 0.00s; }
    .schema-contract-e0 { animation-delay: 0.00s; }
    .schema-contract-s1 { animation-delay: 1.28s; }
    .schema-contract-e1 { animation-delay: 1.28s; }
    .schema-contract-s2 { animation-delay: 2.56s; }
    .schema-contract-e2 { animation-delay: 2.56s; }
    .schema-contract-s3 { animation-delay: 3.84s; }
    .schema-contract-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .schema-contract-conn  { animation: schema-contract-trace 6.4s ease-in-out infinite; }
      .schema-contract-stage { animation: schema-contract-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes schema-contract-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schema-contract-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schema-contract-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schema-contract-stage { animation: schema-contract-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schema-contract-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schema-contract-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schema-contract-bg" width="980" height="322"/>
  <text class="schema-contract-h1"  x="30" y="40">The schema contract</text>
  <text class="schema-contract-sub" x="30" y="64">Four steps.</text>
  <g class="schema-contract-stage schema-contract-s0">
    <rect class="schema-contract-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="schema-contract-step" x="44" y="142">01</text>
    <text class="schema-contract-name" x="70" y="142">Declare the expected input types and ranges</text>
    <text class="schema-contract-desc" x="44" y="166">Alongside the model.</text>
  </g>
  <line class="schema-contract-line schema-contract-conn schema-contract-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#schema-contract-tip)"/>
  <g class="schema-contract-stage schema-contract-s1">
    <rect class="schema-contract-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="schema-contract-step" x="280" y="142">02</text>
    <text class="schema-contract-name" x="306" y="142">Validate every request against it</text>
    <text class="schema-contract-desc" x="280" y="166">Before the model sees it.</text>
  </g>
  <line class="schema-contract-line schema-contract-conn schema-contract-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#schema-contract-tip)"/>
  <g class="schema-contract-stage schema-contract-s2">
    <rect class="schema-contract-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="schema-contract-step" x="516" y="142">03</text>
    <text class="schema-contract-name" x="542" y="142">Reject what does not conform, loudly</text>
    <text class="schema-contract-desc" x="516" y="166">With a message naming the field.</text>
  </g>
  <line class="schema-contract-line schema-contract-conn schema-contract-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#schema-contract-tip)"/>
  <g class="schema-contract-stage schema-contract-s3">
    <rect class="schema-contract-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="schema-contract-step" x="752" y="142">04</text>
    <text class="schema-contract-name" x="778" y="142">Because unvalidated input produces a silent wrong answer</text>
    <text class="schema-contract-desc" x="752" y="166">Which is far worse than an</text>
    <text class="schema-contract-desc" x="752" y="182">error.</text>
  </g>
  <text class="schema-contract-sub" x="30" y="304">A loud rejection is the desirable failure here: a model given a string where it expected a number will often produce a number, and nothing will report a problem.</text>
</svg>
