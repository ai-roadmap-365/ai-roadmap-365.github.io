<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two ideas combined.">
  <title>Four steps to random forests</title>
  <style>
    .forest-history-bg   { fill: #f8fafc; }
    .forest-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forest-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forest-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forest-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forest-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forest-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forest-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .forest-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .forest-history-stage { opacity: 1; }

    .forest-history-s0 { animation-delay: 0.00s; }
    .forest-history-e0 { animation-delay: 0.00s; }
    .forest-history-s1 { animation-delay: 1.28s; }
    .forest-history-e1 { animation-delay: 1.28s; }
    .forest-history-s2 { animation-delay: 2.56s; }
    .forest-history-e2 { animation-delay: 2.56s; }
    .forest-history-s3 { animation-delay: 3.84s; }
    .forest-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .forest-history-conn  { animation: forest-history-trace 6.4s ease-in-out infinite; }
      .forest-history-stage { animation: forest-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes forest-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes forest-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .forest-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .forest-history-stage { animation: forest-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes forest-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="forest-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="forest-history-bg" width="980" height="322"/>
  <text class="forest-history-h1"  x="30" y="40">Four steps to random forests</text>
  <text class="forest-history-sub" x="30" y="64">Two ideas combined.</text>
  <g class="forest-history-stage forest-history-s0">
    <rect class="forest-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="forest-history-step" x="44" y="142">01</text>
    <text class="forest-history-name" x="70" y="142">Single trees were interpretable and unstable</text>
    <text class="forest-history-desc" x="44" y="166">Small data changes rewrote them.</text>
  </g>
  <line class="forest-history-line forest-history-conn forest-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#forest-history-tip)"/>
  <g class="forest-history-stage forest-history-s1">
    <rect class="forest-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="forest-history-step" x="280" y="142">02</text>
    <text class="forest-history-name" x="306" y="142">Bagging averaged away much of that instability</text>
    <text class="forest-history-desc" x="280" y="166">By resampling the rows.</text>
  </g>
  <line class="forest-history-line forest-history-conn forest-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#forest-history-tip)"/>
  <g class="forest-history-stage forest-history-s2">
    <rect class="forest-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="forest-history-step" x="516" y="142">03</text>
    <text class="forest-history-name" x="542" y="142">Random subspaces attacked the same problem via columns</text>
    <text class="forest-history-desc" x="516" y="166">Developed independently.</text>
  </g>
  <line class="forest-history-line forest-history-conn forest-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#forest-history-tip)"/>
  <g class="forest-history-stage forest-history-s3">
    <rect class="forest-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="forest-history-step" x="752" y="142">04</text>
    <text class="forest-history-name" x="778" y="142">Combining both gave random forests</text>
    <text class="forest-history-desc" x="752" y="166">Which have needed little</text>
    <text class="forest-history-desc" x="752" y="182">revision since.</text>
  </g>
  <text class="forest-history-sub" x="30" y="304">Two independently developed decorrelation ideas turning out to compose is why the method has been so durable: neither alone is nearly as effective.</text>
</svg>
