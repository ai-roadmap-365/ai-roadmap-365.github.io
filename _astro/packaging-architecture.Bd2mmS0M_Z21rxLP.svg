<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a Python distribution: a source tree with a src layout and a pyproject.toml is read by a build frontend, which calls the build backend named in the build-system table; the backend writes two artifacts, an sdist holding the whole project and a wheel holding only the installable package plus its dist-info metadata; pip unpacks the wheel into a virtual environment's site-packages and writes a console script into the environment's bin directory; an index is an optional channel between the two artifacts and the installing environment</title>
  <rect x="0" y="0" width="980" height="700" fill="#f8fafc"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">From a source tree to something someone else can install</text>

  <!-- Column 1: source tree -->
  <rect x="20" y="60" width="210" height="300" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="125" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Source tree</text>
  <text x="125" y="106" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">src layout</text>
  <text x="36" y="134" font-size="14" fill="#1a202c">pyproject.toml</text>
  <text x="46" y="154" font-size="14" fill="#1d4ed8">build-system</text>
  <text x="46" y="173" font-size="14" fill="#1d4ed8">project</text>
  <text x="46" y="192" font-size="14" fill="#1d4ed8">project.scripts</text>
  <text x="36" y="216" font-size="14" fill="#1a202c">src/</text>
  <text x="50" y="235" font-size="14" fill="#1a202c">wordtally/</text>
  <text x="64" y="254" font-size="14" fill="#1a202c">__init__.py</text>
  <text x="64" y="273" font-size="14" fill="#1a202c">core.py  cli.py</text>
  <text x="64" y="292" font-size="14" fill="#1a202c">data/stopwords.txt</text>
  <text x="36" y="316" font-size="14" fill="#1a202c">tests/  README.md</text>
  <text x="36" y="335" font-size="14" fill="#1a202c">LICENSE  MANIFEST.in</text>
  <text x="125" y="354" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">nothing importable at the root</text>

  <line x1="232" y1="200" x2="286" y2="200" stroke="#1a202c" stroke-width="2"/>
  <polygon points="292,200 280,194 280,206" fill="#1a202c"/>

  <!-- Column 2: frontend and backend -->
  <rect x="294" y="60" width="196" height="300" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="392" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Build</text>

  <rect x="310" y="102" width="164" height="86" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="392" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">frontend</text>
  <text x="392" y="145" text-anchor="middle" font-size="14" fill="#1d4ed8">python -m build</text>
  <text x="392" y="165" text-anchor="middle" font-size="14" fill="#1a202c">reads build-system,</text>
  <text x="392" y="181" text-anchor="middle" font-size="14" fill="#1a202c">builds nothing itself</text>

  <line x1="392" y1="190" x2="392" y2="212" stroke="#1a202c" stroke-width="2"/>
  <polygon points="392,218 386,206 398,206" fill="#1a202c"/>

  <rect x="310" y="220" width="164" height="104" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="392" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">backend</text>
  <text x="392" y="263" text-anchor="middle" font-size="14" fill="#1d4ed8">setuptools.build_meta</text>
  <text x="392" y="283" text-anchor="middle" font-size="14" fill="#1a202c">or hatchling, flit_core,</text>
  <text x="392" y="299" text-anchor="middle" font-size="14" fill="#1a202c">poetry-core — swappable</text>
  <text x="392" y="317" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">this one does the work</text>
  <text x="392" y="348" text-anchor="middle" font-size="14" fill="#1a202c">one standard interface</text>

  <line x1="492" y1="150" x2="546" y2="120" stroke="#1a202c" stroke-width="2"/>
  <polygon points="552,117 540,113 543,125" fill="#1a202c"/>
  <line x1="492" y1="250" x2="546" y2="286" stroke="#1a202c" stroke-width="2"/>
  <polygon points="552,290 540,286 546,277" fill="#1a202c"/>

  <!-- Column 3: two artifacts -->
  <rect x="554" y="60" width="196" height="130" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="652" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3a. sdist</text>
  <text x="652" y="103" text-anchor="middle" font-size="14" fill="#1d4ed8">name-0.3.1.tar.gz</text>
  <text x="568" y="124" font-size="14" fill="#1a202c">pyproject.toml  MANIFEST.in</text>
  <text x="568" y="143" font-size="14" fill="#1a202c">src/  tests/  LICENSE</text>
  <text x="568" y="162" font-size="14" fill="#1a202c">README.md  PKG-INFO</text>
  <text x="652" y="181" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">must be BUILT before use</text>

  <rect x="554" y="204" width="196" height="156" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="652" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3b. wheel</text>
  <text x="652" y="247" text-anchor="middle" font-size="14" fill="#1d4ed8">name-0.3.1-py3-none-any.whl</text>
  <text x="568" y="268" font-size="14" fill="#1a202c">wordtally/*.py</text>
  <text x="568" y="287" font-size="14" fill="#1a202c">wordtally/data/stopwords.txt</text>
  <text x="568" y="306" font-size="14" fill="#1a202c">dist-info/METADATA</text>
  <text x="568" y="325" font-size="14" fill="#1a202c">dist-info/entry_points.txt</text>
  <text x="652" y="348" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">a zip; installs by unpacking</text>

  <line x1="752" y1="282" x2="806" y2="220" stroke="#1a202c" stroke-width="2"/>
  <polygon points="811,215 799,214 806,224" fill="#1a202c"/>

  <!-- Column 4: the installing environment -->
  <rect x="812" y="60" width="152" height="300" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="888" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Environment</text>
  <text x="888" y="105" text-anchor="middle" font-size="14" fill="#1a202c">a virtual env</text>

  <rect x="826" y="120" width="124" height="106" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="888" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">site-packages/</text>
  <text x="838" y="163" font-size="14" fill="#1a202c">wordtally/</text>
  <text x="838" y="182" font-size="14" fill="#1a202c">  core.py</text>
  <text x="838" y="201" font-size="14" fill="#1a202c">  cli.py</text>
  <text x="838" y="220" font-size="14" fill="#1a202c">…dist-info/</text>

  <rect x="826" y="240" width="124" height="76" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="888" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">bin/</text>
  <text x="888" y="283" text-anchor="middle" font-size="14" fill="#1d4ed8">wordtally</text>
  <text x="888" y="302" text-anchor="middle" font-size="14" fill="#1a202c">a COMMAND</text>
  <text x="888" y="338" text-anchor="middle" font-size="14" fill="#1a202c">import name:</text>
  <text x="888" y="355" text-anchor="middle" font-size="14" fill="#1d4ed8">wordtally</text>

  <!-- Index as an optional channel -->
  <rect x="554" y="404" width="410" height="112" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" rx="8"/>
  <text x="759" y="428" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">An index — an OPTIONAL channel</text>
  <text x="759" y="450" text-anchor="middle" font-size="14" fill="#1a202c">the public index · a test index for rehearsal · a private index</text>
  <text x="759" y="470" text-anchor="middle" font-size="14" fill="#1a202c">a git URL · a wheel handed over directly · a local directory</text>
  <text x="759" y="492" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">a published version can never be reused, replaced, or taken back</text>
  <text x="759" y="510" text-anchor="middle" font-size="14" fill="#1a202c">this lab stops before this box</text>

  <line x1="652" y1="362" x2="652" y2="396" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="652,402 646,390 658,390" fill="#1d4ed8"/>
  <line x1="900" y1="404" x2="900" y2="366" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="900,360 894,372 906,372" fill="#1d4ed8"/>

  <!-- The four things a user needs -->
  <rect x="20" y="404" width="510" height="112" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="275" y="428" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">What a user actually needs — all four, or none of it works</text>
  <text x="36" y="452" font-size="14" fill="#1a202c">the code</text>
  <text x="150" y="452" font-size="14" fill="#1a202c">its dependencies</text>
  <text x="300" y="452" font-size="14" fill="#1a202c">its metadata</text>
  <text x="420" y="452" font-size="14" fill="#1a202c">an entry point</text>
  <text x="36" y="474" font-size="14" fill="#1d4ed8">src/wordtally</text>
  <text x="150" y="474" font-size="14" fill="#1d4ed8">dependencies</text>
  <text x="300" y="474" font-size="14" fill="#1d4ed8">name, version,</text>
  <text x="420" y="474" font-size="14" fill="#1d4ed8">project.scripts</text>
  <text x="300" y="492" font-size="14" fill="#1d4ed8">requires-python</text>
  <text x="275" y="510" text-anchor="middle" font-size="14" font-style="italic" fill="#1a202c">every one of them is declared in pyproject.toml</text>

  <!-- Name split -->
  <rect x="20" y="540" width="944" height="70" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="492" y="564" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Two names, and they are allowed to differ</text>
  <text x="250" y="588" text-anchor="middle" font-size="14" fill="#1a202c">DISTRIBUTION name — what you install</text>
  <text x="250" y="604" text-anchor="middle" font-size="14" fill="#1d4ed8">pip install wordtally-tools</text>
  <text x="734" y="588" text-anchor="middle" font-size="14" fill="#1a202c">IMPORT name — what you import</text>
  <text x="734" y="604" text-anchor="middle" font-size="14" fill="#1d4ed8">import wordtally</text>

  <text x="490" y="644" text-anchor="middle" font-size="14" fill="#1a202c">The same split you already met: pip install beautifulsoup4, then import bs4.</text>
  <text x="490" y="666" text-anchor="middle" font-size="14" fill="#1a202c">Ship both artifacts for a pure-Python project: the wheel so installs are fast and need no build, the sdist so the source stays available.</text>
</svg>
