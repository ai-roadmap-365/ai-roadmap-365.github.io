<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="So the pieces fit together with no overlap and no gap.">
  <title>Why a slice excludes its end</title>
  <style>
    .half-open-slicing-bg   { fill: #f8fafc; }
    .half-open-slicing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .half-open-slicing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .half-open-slicing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .half-open-slicing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .half-open-slicing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .half-open-slicing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .half-open-slicing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .half-open-slicing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .half-open-slicing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .half-open-slicing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .half-open-slicing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .half-open-slicing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .half-open-slicing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .half-open-slicing-stage { opacity: 1; }

    .half-open-slicing-s0 { animation-delay: 0.00s; }
    .half-open-slicing-e0 { animation-delay: 0.00s; }
    .half-open-slicing-s1 { animation-delay: 1.28s; }
    .half-open-slicing-e1 { animation-delay: 1.28s; }
    .half-open-slicing-s2 { animation-delay: 2.56s; }
    .half-open-slicing-e2 { animation-delay: 2.56s; }
    .half-open-slicing-s3 { animation-delay: 3.84s; }
    .half-open-slicing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .half-open-slicing-conn  { animation: half-open-slicing-trace 6.4s ease-in-out infinite; }
      .half-open-slicing-stage { animation: half-open-slicing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes half-open-slicing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes half-open-slicing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .half-open-slicing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .half-open-slicing-stage { animation: half-open-slicing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes half-open-slicing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="half-open-slicing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="half-open-slicing-bg" width="980" height="322"/>
  <text class="half-open-slicing-h1"  x="30" y="40">Why a slice excludes its end</text>
  <text class="half-open-slicing-sub" x="30" y="64">So the pieces fit together with no overlap and no gap.</text>
  <g class="half-open-slicing-stage half-open-slicing-s0">
    <rect class="half-open-slicing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="half-open-slicing-step" x="44" y="142">01</text>
    <text class="half-open-slicing-name" x="70" y="142">s[a:b] runs from a up to b</text>
    <text class="half-open-slicing-desc" x="44" y="166">Including a, excluding b. This</text>
    <text class="half-open-slicing-desc" x="44" y="182">is the rule.</text>
    <text class="half-open-slicing-edge" x="44" y="242">half-open</text>
  </g>
  <line class="half-open-slicing-line half-open-slicing-conn half-open-slicing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#half-open-slicing-tip)"/>
  <g class="half-open-slicing-stage half-open-slicing-s1">
    <rect class="half-open-slicing-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="half-open-slicing-step" x="280" y="142">02</text>
    <text class="half-open-slicing-name" x="306" y="142">So the length is b - a</text>
    <text class="half-open-slicing-desc" x="280" y="166">No off-by-one arithmetic, ever.</text>
  </g>
  <line class="half-open-slicing-line half-open-slicing-conn half-open-slicing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#half-open-slicing-tip)"/>
  <g class="half-open-slicing-stage half-open-slicing-s2">
    <rect class="half-open-slicing-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="half-open-slicing-step" x="516" y="142">03</text>
    <text class="half-open-slicing-name" x="542" y="142">And s[:n] plus s[n:] is the whole</text>
    <text class="half-open-slicing-desc" x="516" y="166">No overlap, no gap, whatever n</text>
    <text class="half-open-slicing-desc" x="516" y="182">is.</text>
    <text class="half-open-slicing-edge" x="516" y="242">tiles</text>
  </g>
  <line class="half-open-slicing-line half-open-slicing-conn half-open-slicing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#half-open-slicing-tip)"/>
  <g class="half-open-slicing-stage half-open-slicing-s3">
    <rect class="half-open-slicing-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="half-open-slicing-step" x="752" y="142">04</text>
    <text class="half-open-slicing-name" x="778" y="142">Slicing never raises</text>
    <text class="half-open-slicing-desc" x="752" y="166">Out-of-range bounds give you</text>
    <text class="half-open-slicing-desc" x="752" y="182">what exists. Indexing is strict;</text>
    <text class="half-open-slicing-desc" x="752" y="198">slicing is forgiving.</text>
    <text class="half-open-slicing-edge" x="752" y="242">no IndexError</text>
  </g>
  <text class="half-open-slicing-sub" x="30" y="304">That last asymmetry catches people: s[10] on a five-character string raises IndexError, and s[3:10] quietly returns two characters. Both behaviours are deliberate.</text>
</svg>
