<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Similarity high, metrics different: a conflict.">
  <title>Deduplicating a note store</title>
  <style>
    .information-gain-bg   { fill: #f8fafc; }
    .information-gain-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .information-gain-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .information-gain-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .information-gain-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .information-gain-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .information-gain-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .information-gain-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .information-gain-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .information-gain-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .information-gain-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .information-gain-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .information-gain-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .information-gain-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .information-gain-stage { opacity: 1; }

    .information-gain-s0 { animation-delay: 0.00s; }
    .information-gain-e0 { animation-delay: 0.00s; }
    .information-gain-s1 { animation-delay: 1.28s; }
    .information-gain-e1 { animation-delay: 1.28s; }
    .information-gain-s2 { animation-delay: 2.56s; }
    .information-gain-e2 { animation-delay: 2.56s; }
    .information-gain-s3 { animation-delay: 3.84s; }
    .information-gain-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .information-gain-conn  { animation: information-gain-trace 6.4s ease-in-out infinite; }
      .information-gain-stage { animation: information-gain-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes information-gain-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes information-gain-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .information-gain-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .information-gain-stage { animation: information-gain-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes information-gain-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="information-gain-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="information-gain-bg" width="980" height="322"/>
  <text class="information-gain-h1"  x="30" y="40">Deduplicating a note store</text>
  <text class="information-gain-sub" x="30" y="64">Similarity high, metrics different: a conflict.</text>
  <g class="information-gain-stage information-gain-s0">
    <rect class="information-gain-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="information-gain-step" x="44" y="142">01</text>
    <text class="information-gain-name" x="70" y="142">Embed the candidate fact</text>
    <text class="information-gain-desc" x="44" y="166">Compare against every note</text>
    <text class="information-gain-desc" x="44" y="182">already stored.</text>
  </g>
  <line class="information-gain-line information-gain-conn information-gain-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#information-gain-tip)"/>
  <g class="information-gain-stage information-gain-s1">
    <rect class="information-gain-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="information-gain-step" x="280" y="142">02</text>
    <text class="information-gain-name" x="306" y="142">Similarity above 0.88, same metric</text>
    <text class="information-gain-desc" x="280" y="166">Redundant. Discard, and record</text>
    <text class="information-gain-desc" x="280" y="182">the second source.</text>
    <text class="information-gain-edge" x="280" y="242">dedupe</text>
  </g>
  <line class="information-gain-line information-gain-conn information-gain-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#information-gain-tip)"/>
  <g class="information-gain-stage information-gain-s2">
    <rect class="information-gain-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="information-gain-step" x="516" y="142">03</text>
    <text class="information-gain-name" x="542" y="142">Similarity high, metric different</text>
    <text class="information-gain-desc" x="516" y="166">$450M against $410M. Flag as a</text>
    <text class="information-gain-desc" x="516" y="182">conflict.</text>
  </g>
  <line class="information-gain-line information-gain-conn information-gain-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#information-gain-tip)"/>
  <g class="information-gain-stage information-gain-s3">
    <rect class="information-gain-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="information-gain-step" x="752" y="142">04</text>
    <text class="information-gain-name" x="778" y="142">Route to a resolution subagent</text>
    <text class="information-gain-desc" x="752" y="166">Which reports both figures and</text>
    <text class="information-gain-desc" x="752" y="182">the differing basis.</text>
  </g>
  <text class="information-gain-sub" x="30" y="304">The distinction in the third row is what makes the store useful rather than merely deduplicated: two sources saying the same thing differently is noise, and two sources saying different things similarly is the finding.</text>
</svg>
