<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The condition number</title>
  <style>
    .condition-number-bg   { fill: #f8fafc; }
    .condition-number-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-number-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-number-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-number-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-number-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-number-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .condition-number-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .condition-number-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .condition-number-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .condition-number-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .condition-number-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .condition-number-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .condition-number-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .condition-number-stage { opacity: 1; }

    .condition-number-s0 { animation-delay: 0.00s; }
    .condition-number-e0 { animation-delay: 0.00s; }
    .condition-number-s1 { animation-delay: 1.28s; }
    .condition-number-e1 { animation-delay: 1.28s; }
    .condition-number-s2 { animation-delay: 2.56s; }
    .condition-number-e2 { animation-delay: 2.56s; }
    .condition-number-s3 { animation-delay: 3.84s; }
    .condition-number-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .condition-number-conn  { animation: condition-number-trace 6.4s ease-in-out infinite; }
      .condition-number-stage { animation: condition-number-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes condition-number-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes condition-number-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .condition-number-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .condition-number-stage { animation: condition-number-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes condition-number-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="condition-number-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="condition-number-bg" width="980" height="322"/>
  <text class="condition-number-h1"  x="30" y="40">The condition number</text>
  <text class="condition-number-sub" x="30" y="64">Four steps.</text>
  <g class="condition-number-stage condition-number-s0">
    <rect class="condition-number-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="condition-number-step" x="44" y="142">01</text>
    <text class="condition-number-name" x="70" y="142">The condition number is the ratio of largest to smallest curvature</text>
    <text class="condition-number-desc" x="44" y="166">Across directions in the loss</text>
    <text class="condition-number-desc" x="44" y="182">surface.</text>
  </g>
  <line class="condition-number-line condition-number-conn condition-number-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#condition-number-tip)"/>
  <g class="condition-number-stage condition-number-s1">
    <rect class="condition-number-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="condition-number-step" x="280" y="142">02</text>
    <text class="condition-number-name" x="306" y="142">Unscaled features make it enormous</text>
    <text class="condition-number-desc" x="280" y="166">Thousands, or worse.</text>
  </g>
  <line class="condition-number-line condition-number-conn condition-number-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#condition-number-tip)"/>
  <g class="condition-number-stage condition-number-s2">
    <rect class="condition-number-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="condition-number-step" x="516" y="142">03</text>
    <text class="condition-number-name" x="542" y="142">The step size is limited by the steepest direction</text>
    <text class="condition-number-desc" x="516" y="166">So progress along the shallow</text>
    <text class="condition-number-desc" x="516" y="182">ones is glacial.</text>
  </g>
  <line class="condition-number-line condition-number-conn condition-number-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#condition-number-tip)"/>
  <g class="condition-number-stage condition-number-s3">
    <rect class="condition-number-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="condition-number-step" x="752" y="142">04</text>
    <text class="condition-number-name" x="778" y="142">Scaling brings the ratio near one</text>
    <text class="condition-number-desc" x="752" y="166">And every direction progresses</text>
    <text class="condition-number-desc" x="752" y="182">together.</text>
  </g>
  <text class="condition-number-sub" x="30" y="304">This is the same conditioning argument behind normalisation layers in neural networks, so the intuition transfers directly to deep learning.</text>
</svg>
