<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="One collection, many questions.">
  <title>Filter with parameters, not with new endpoints</title>
  <style>
    .query-parameters-not-endpoints-bg   { fill: #f8fafc; }
    .query-parameters-not-endpoints-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-parameters-not-endpoints-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-parameters-not-endpoints-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-parameters-not-endpoints-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-parameters-not-endpoints-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-parameters-not-endpoints-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .query-parameters-not-endpoints-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .query-parameters-not-endpoints-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .query-parameters-not-endpoints-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .query-parameters-not-endpoints-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .query-parameters-not-endpoints-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .query-parameters-not-endpoints-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .query-parameters-not-endpoints-row { opacity: 1; }
    .query-parameters-not-endpoints-r0 { animation-delay: 0.00s; }
    .query-parameters-not-endpoints-r1 { animation-delay: 0.45s; }
    .query-parameters-not-endpoints-r2 { animation-delay: 0.90s; }
    .query-parameters-not-endpoints-r3 { animation-delay: 1.35s; }
    .query-parameters-not-endpoints-r4 { animation-delay: 1.80s; }
    .query-parameters-not-endpoints-r5 { animation-delay: 2.25s; }
    .query-parameters-not-endpoints-row { animation: query-parameters-not-endpoints-reveal 7.7s ease-in-out infinite; }
    @keyframes query-parameters-not-endpoints-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="query-parameters-not-endpoints-bg" width="980" height="424"/>
  <text class="query-parameters-not-endpoints-h1"  x="30" y="40">Filter with parameters, not with new endpoints</text>
  <text class="query-parameters-not-endpoints-sub" x="30" y="64">One collection, many questions.</text>
  <rect class="query-parameters-not-endpoints-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="query-parameters-not-endpoints-name" x="46" y="122">An endpoint per variation</text>
  <text class="query-parameters-not-endpoints-desc" x="46" y="142">The collection multiplies.</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r0" x="46" y="182">/users/admins</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r1" x="46" y="216">/users/recent</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r2" x="46" y="250">/users/admins/recent</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r3" x="46" y="284">/users/admins/recent/page2</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r4" x="46" y="318">Every combination is a new endpoint</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r5" x="46" y="352">All of them documented, tested, maintained</text>
  <rect class="query-parameters-not-endpoints-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="query-parameters-not-endpoints-name" x="526" y="122">Parameters on one collection</text>
  <text class="query-parameters-not-endpoints-desc" x="526" y="142">The collection stays one thing.</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r0" x="526" y="182">/users?role=admin</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r1" x="526" y="216">/users?sort=-created</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r2" x="526" y="250">/users?role=admin&amp;sort=-created</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r3" x="526" y="284">/users?...&amp;page=2&amp;limit=50</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r4" x="526" y="318">Combinations come free</text>
  <text class="query-parameters-not-endpoints-desc query-parameters-not-endpoints-row query-parameters-not-endpoints-r5" x="526" y="352">One endpoint to document and test</text>
  <text class="query-parameters-not-endpoints-sub" x="30" y="406">Paging belongs here too. A collection that returns everything works until it does not, and adding limit and offset afterwards is a breaking change you can avoid by starting with them.</text>
</svg>
