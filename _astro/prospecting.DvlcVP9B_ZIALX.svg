<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where to dig next.">
  <title>Prospecting a large area</title>
  <style>
    .prospecting-bg   { fill: #f8fafc; }
    .prospecting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prospecting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prospecting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prospecting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prospecting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prospecting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prospecting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prospecting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prospecting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prospecting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prospecting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prospecting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prospecting-row { opacity: 1; }
    .prospecting-r0 { animation-delay: 0.00s; }
    .prospecting-r1 { animation-delay: 0.45s; }
    .prospecting-r2 { animation-delay: 0.90s; }
    .prospecting-r3 { animation-delay: 1.35s; }
    .prospecting-r4 { animation-delay: 1.80s; }
    .prospecting-row { animation: prospecting-reveal 7.3s ease-in-out infinite; }
    @keyframes prospecting-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prospecting-bg" width="980" height="390"/>
  <text class="prospecting-h1"  x="30" y="40">Prospecting a large area</text>
  <text class="prospecting-sub" x="30" y="64">Where to dig next.</text>
  <rect class="prospecting-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prospecting-name" x="46" y="122">Dig on a fixed grid</text>
  <text class="prospecting-desc" x="46" y="142">Systematic, and wasteful.</text>
  <text class="prospecting-desc prospecting-row prospecting-r0" x="46" y="182">Every intersection, regardless</text>
  <text class="prospecting-desc prospecting-row prospecting-r1" x="46" y="216">Most holes find nothing</text>
  <text class="prospecting-desc prospecting-row prospecting-r2" x="46" y="250">No learning between holes</text>
  <text class="prospecting-desc prospecting-row prospecting-r3" x="46" y="284">Cost grows with area</text>
  <text class="prospecting-desc prospecting-row prospecting-r4" x="46" y="318">This is grid search</text>
  <rect class="prospecting-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prospecting-name" x="526" y="122">Dig where the signs point</text>
  <text class="prospecting-desc" x="526" y="142">Informed by what you find.</text>
  <text class="prospecting-desc prospecting-row prospecting-r0" x="526" y="182">Each result informs the next site</text>
  <text class="prospecting-desc prospecting-row prospecting-r1" x="526" y="216">Concentrates effort on promising ground</text>
  <text class="prospecting-desc prospecting-row prospecting-r2" x="526" y="250">Still tries unexplored areas</text>
  <text class="prospecting-desc prospecting-row prospecting-r3" x="526" y="284">Finds more per hole</text>
  <text class="prospecting-desc prospecting-row prospecting-r4" x="526" y="318">This is Bayesian optimisation</text>
  <text class="prospecting-sub" x="30" y="372">The exploration term is what stops this collapsing into digging the same promising spot forever, which is the failure mode of pure exploitation.</text>
</svg>
