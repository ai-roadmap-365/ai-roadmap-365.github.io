<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each stands alone, which is why the separation held for thirty years.">
  <title>Add one layer at a time</title>
  <style>
    .three-languages-independence-bg   { fill: #f8fafc; }
    .three-languages-independence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-languages-independence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-languages-independence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-languages-independence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-languages-independence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-languages-independence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-languages-independence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-languages-independence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-languages-independence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-languages-independence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-languages-independence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-languages-independence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-languages-independence-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-languages-independence-stage { opacity: 1; }

    .three-languages-independence-s0 { animation-delay: 0.00s; }
    .three-languages-independence-e0 { animation-delay: 0.00s; }
    .three-languages-independence-s1 { animation-delay: 1.50s; }
    .three-languages-independence-e1 { animation-delay: 1.50s; }
    .three-languages-independence-s2 { animation-delay: 3.00s; }
    .three-languages-independence-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-languages-independence-conn  { animation: three-languages-independence-trace 6s ease-in-out infinite; }
      .three-languages-independence-stage { animation: three-languages-independence-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-languages-independence-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-languages-independence-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-languages-independence-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-languages-independence-stage { animation: three-languages-independence-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-languages-independence-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-languages-independence-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-languages-independence-bg" width="980" height="322"/>
  <text class="three-languages-independence-h1"  x="30" y="40">Add one layer at a time</text>
  <text class="three-languages-independence-sub" x="30" y="64">Each stands alone, which is why the separation held for thirty years.</text>
  <g class="three-languages-independence-stage three-languages-independence-s0">
    <rect class="three-languages-independence-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-languages-independence-step" x="44" y="142">01</text>
    <text class="three-languages-independence-name" x="70" y="142">HTML alone</text>
    <text class="three-languages-independence-desc" x="44" y="166">Readable, navigable, works in every browser</text>
    <text class="three-languages-independence-desc" x="44" y="182">and every screen reader.</text>
    <text class="three-languages-independence-edge" x="44" y="242">structure</text>
  </g>
  <line class="three-languages-independence-line three-languages-independence-conn three-languages-independence-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-languages-independence-tip)"/>
  <g class="three-languages-independence-stage three-languages-independence-s1">
    <rect class="three-languages-independence-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-languages-independence-step" x="359" y="142">02</text>
    <text class="three-languages-independence-name" x="385" y="142">Add CSS</text>
    <text class="three-languages-independence-desc" x="359" y="166">Now it looks designed. Remove the stylesheet</text>
    <text class="three-languages-independence-desc" x="359" y="182">and the content is still all there.</text>
    <text class="three-languages-independence-edge" x="359" y="242">appearance</text>
  </g>
  <line class="three-languages-independence-line three-languages-independence-conn three-languages-independence-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-languages-independence-tip)"/>
  <g class="three-languages-independence-stage three-languages-independence-s2">
    <rect class="three-languages-independence-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-languages-independence-step" x="674" y="142">03</text>
    <text class="three-languages-independence-name" x="700" y="142">Add JavaScript</text>
    <text class="three-languages-independence-desc" x="674" y="166">Now it responds. Remove it and the page still</text>
    <text class="three-languages-independence-desc" x="674" y="182">shows everything it had.</text>
    <text class="three-languages-independence-edge" x="674" y="242">behaviour</text>
  </g>
  <text class="three-languages-independence-sub" x="30" y="304">Building in this order is not nostalgia. A page that needs all three to show any content fails for slow connections, old devices, and every user whose script did not load.</text>
</svg>
