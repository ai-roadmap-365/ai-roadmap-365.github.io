<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Twelve chunks yesterday, eight today.">
  <title>The document that shrinks</title>
  <style>
    .shrinking-document-bg   { fill: #f8fafc; }
    .shrinking-document-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shrinking-document-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shrinking-document-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shrinking-document-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shrinking-document-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shrinking-document-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shrinking-document-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shrinking-document-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shrinking-document-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shrinking-document-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shrinking-document-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shrinking-document-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shrinking-document-row { opacity: 1; }
    .shrinking-document-r0 { animation-delay: 0.00s; }
    .shrinking-document-r1 { animation-delay: 0.45s; }
    .shrinking-document-r2 { animation-delay: 0.90s; }
    .shrinking-document-r3 { animation-delay: 1.35s; }
    .shrinking-document-r4 { animation-delay: 1.80s; }
    .shrinking-document-row { animation: shrinking-document-reveal 7.3s ease-in-out infinite; }
    @keyframes shrinking-document-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shrinking-document-bg" width="980" height="390"/>
  <text class="shrinking-document-h1"  x="30" y="40">The document that shrinks</text>
  <text class="shrinking-document-sub" x="30" y="64">Twelve chunks yesterday, eight today.</text>
  <rect class="shrinking-document-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shrinking-document-name" x="46" y="122">Upsert only</text>
  <text class="shrinking-document-desc" x="46" y="142">Four orphans remain.</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r0" x="46" y="182">Chunks one to eight updated</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r1" x="46" y="216">Chunks nine to twelve untouched</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r2" x="46" y="250">Still in the index</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r3" x="46" y="284">Still retrievable</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r4" x="46" y="318">Content the document no longer contains</text>
  <rect class="shrinking-document-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shrinking-document-name" x="526" y="122">Upsert and reconcile</text>
  <text class="shrinking-document-desc" x="526" y="142">Per-document cleanup.</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r0" x="526" y="182">Chunks one to eight upserted</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r1" x="526" y="216">Ids for this document not in the current set</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r2" x="526" y="250">Deleted</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r3" x="526" y="284">The index matches the document</text>
  <text class="shrinking-document-desc shrinking-document-row shrinking-document-r4" x="526" y="318">Easy to forget, strange to debug</text>
  <text class="shrinking-document-sub" x="30" y="372">This produces some of the oddest retrieval bugs available: an answer quoting a paragraph that was removed from the source document weeks ago, retrieved from a chunk nothing updates.</text>
</svg>
