<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What preprocessing is not</title>
  <style>
    .preprocessing-not-bg   { fill: #f8fafc; }
    .preprocessing-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .preprocessing-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .preprocessing-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .preprocessing-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .preprocessing-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .preprocessing-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .preprocessing-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .preprocessing-not-row { opacity: 1; }
    .preprocessing-not-r0 { animation-delay: 0.00s; }
    .preprocessing-not-r1 { animation-delay: 0.45s; }
    .preprocessing-not-r2 { animation-delay: 0.90s; }
    .preprocessing-not-r3 { animation-delay: 1.35s; }
    .preprocessing-not-r4 { animation-delay: 1.80s; }
    .preprocessing-not-row { animation: preprocessing-not-reveal 7.3s ease-in-out infinite; }
    @keyframes preprocessing-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="preprocessing-not-bg" width="980" height="390"/>
  <text class="preprocessing-not-h1"  x="30" y="40">What preprocessing is not</text>
  <text class="preprocessing-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="preprocessing-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="preprocessing-not-name" x="46" y="122">The misconception</text>
  <text class="preprocessing-not-desc" x="46" y="142">Commonly held.</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r0" x="46" y="182">It is a preliminary formatting step</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r1" x="46" y="216">One recipe fits every model</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r2" x="46" y="250">Scaling can be fitted on all the data</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r3" x="46" y="284">One-hot encoding is always safe</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r4" x="46" y="318">It can be applied ad hoc at inference</text>
  <rect class="preprocessing-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="preprocessing-not-name" x="526" y="122">What is true</text>
  <text class="preprocessing-not-desc" x="526" y="142">Actually.</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r0" x="526" y="182">It is part of the model, and must ship with it</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r1" x="526" y="216">Requirements differ by model family</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r2" x="526" y="250">Fitting on all the data leaks</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r3" x="526" y="284">High cardinality makes it explode</text>
  <text class="preprocessing-not-desc preprocessing-not-row preprocessing-not-r4" x="526" y="318">It must be the same transform, from the artefact</text>
  <text class="preprocessing-not-sub" x="30" y="372">The last row is the production failure: preprocessing reimplemented in the serving code will drift from the training version, silently and permanently.</text>
</svg>
