<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And zero compliance incidents.">
  <title>Two weeks to fifteen minutes</title>
  <style>
    .fintech-case-bg   { fill: #f8fafc; }
    .fintech-case-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fintech-case-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fintech-case-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fintech-case-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fintech-case-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fintech-case-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fintech-case-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fintech-case-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fintech-case-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fintech-case-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fintech-case-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fintech-case-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fintech-case-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fintech-case-stage { opacity: 1; }

    .fintech-case-s0 { animation-delay: 0.00s; }
    .fintech-case-e0 { animation-delay: 0.00s; }
    .fintech-case-s1 { animation-delay: 1.28s; }
    .fintech-case-e1 { animation-delay: 1.28s; }
    .fintech-case-s2 { animation-delay: 2.56s; }
    .fintech-case-e2 { animation-delay: 2.56s; }
    .fintech-case-s3 { animation-delay: 3.84s; }
    .fintech-case-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fintech-case-conn  { animation: fintech-case-trace 6.4s ease-in-out infinite; }
      .fintech-case-stage { animation: fintech-case-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fintech-case-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fintech-case-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fintech-case-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fintech-case-stage { animation: fintech-case-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fintech-case-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fintech-case-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fintech-case-bg" width="980" height="322"/>
  <text class="fintech-case-h1"  x="30" y="40">Two weeks to fifteen minutes</text>
  <text class="fintech-case-sub" x="30" y="64">And zero compliance incidents.</text>
  <g class="fintech-case-stage fintech-case-s0">
    <rect class="fintech-case-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fintech-case-step" x="44" y="142">01</text>
    <text class="fintech-case-name" x="70" y="142">350 real banking queries</text>
    <text class="fintech-case-desc" x="44" y="166">Happy paths, ambiguous disputes,</text>
    <text class="fintech-case-desc" x="44" y="182">adversarial phishing attempts.</text>
  </g>
  <line class="fintech-case-line fintech-case-conn fintech-case-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fintech-case-tip)"/>
  <g class="fintech-case-stage fintech-case-s1">
    <rect class="fintech-case-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fintech-case-step" x="280" y="142">02</text>
    <text class="fintech-case-name" x="306" y="142">A composite metric</text>
    <text class="fintech-case-desc" x="280" y="166">Exact match for amounts, schema</text>
    <text class="fintech-case-desc" x="280" y="182">F1 for actions, a judge for</text>
    <text class="fintech-case-desc" x="280" y="198">regulatory compliance.</text>
  </g>
  <line class="fintech-case-line fintech-case-conn fintech-case-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fintech-case-tip)"/>
  <g class="fintech-case-stage fintech-case-s2">
    <rect class="fintech-case-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fintech-case-step" x="516" y="142">03</text>
    <text class="fintech-case-name" x="542" y="142">Regulatory invariants at 100%</text>
    <text class="fintech-case-desc" x="516" y="166">And zero regression on the</text>
    <text class="fintech-case-desc" x="516" y="182">golden baseline.</text>
  </g>
  <line class="fintech-case-line fintech-case-conn fintech-case-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fintech-case-tip)"/>
  <g class="fintech-case-stage fintech-case-s3">
    <rect class="fintech-case-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fintech-case-step" x="752" y="142">04</text>
    <text class="fintech-case-name" x="778" y="142">14 days to 15 minutes</text>
    <text class="fintech-case-desc" x="752" y="166">Eighteen months, no compliance</text>
    <text class="fintech-case-desc" x="752" y="182">incidents.</text>
  </g>
  <text class="fintech-case-sub" x="30" y="304">The regulatory invariants being separate from the composite is what makes this defensible: a compliance case cannot be traded off against an average, and the gate encodes that directly.</text>
</svg>
