<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not about how much work went in.">
  <title>A version number is a promise about breakage</title>
  <style>
    .semver-promise-bg   { fill: #f8fafc; }
    .semver-promise-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semver-promise-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semver-promise-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semver-promise-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semver-promise-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semver-promise-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .semver-promise-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .semver-promise-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .semver-promise-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .semver-promise-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .semver-promise-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .semver-promise-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .semver-promise-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .semver-promise-stage { opacity: 1; }

    .semver-promise-s0 { animation-delay: 0.00s; }
    .semver-promise-e0 { animation-delay: 0.00s; }
    .semver-promise-s1 { animation-delay: 1.50s; }
    .semver-promise-e1 { animation-delay: 1.50s; }
    .semver-promise-s2 { animation-delay: 3.00s; }
    .semver-promise-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .semver-promise-conn  { animation: semver-promise-trace 6s ease-in-out infinite; }
      .semver-promise-stage { animation: semver-promise-arrive 6s ease-in-out infinite; }
    }
    @keyframes semver-promise-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes semver-promise-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .semver-promise-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .semver-promise-stage { animation: semver-promise-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes semver-promise-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="semver-promise-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="semver-promise-bg" width="980" height="322"/>
  <text class="semver-promise-h1"  x="30" y="40">A version number is a promise about breakage</text>
  <text class="semver-promise-sub" x="30" y="64">Not about how much work went in.</text>
  <g class="semver-promise-stage semver-promise-s0">
    <rect class="semver-promise-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="semver-promise-step" x="44" y="142">01</text>
    <text class="semver-promise-name" x="70" y="142">PATCH</text>
    <text class="semver-promise-desc" x="44" y="166">A backward-compatible fix. Upgrade without</text>
    <text class="semver-promise-desc" x="44" y="182">reading anything.</text>
    <text class="semver-promise-edge" x="44" y="242">1.4.2 to 1.4.3</text>
  </g>
  <line class="semver-promise-line semver-promise-conn semver-promise-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#semver-promise-tip)"/>
  <g class="semver-promise-stage semver-promise-s1">
    <rect class="semver-promise-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="semver-promise-step" x="359" y="142">02</text>
    <text class="semver-promise-name" x="385" y="142">MINOR</text>
    <text class="semver-promise-desc" x="359" y="166">New features, nothing broken. Upgrade safely;</text>
    <text class="semver-promise-desc" x="359" y="182">read if curious.</text>
    <text class="semver-promise-edge" x="359" y="242">1.4.2 to 1.5.0</text>
  </g>
  <line class="semver-promise-line semver-promise-conn semver-promise-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#semver-promise-tip)"/>
  <g class="semver-promise-stage semver-promise-s2">
    <rect class="semver-promise-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="semver-promise-step" x="674" y="142">03</text>
    <text class="semver-promise-name" x="700" y="142">MAJOR</text>
    <text class="semver-promise-desc" x="674" y="166">Something you depend on may have changed.</text>
    <text class="semver-promise-desc" x="674" y="182">Read before upgrading.</text>
    <text class="semver-promise-edge" x="674" y="242">1.4.2 to 2.0.0</text>
  </g>
  <text class="semver-promise-sub" x="30" y="304">The commonest mistake is bumping MAJOR because a change felt big. Semver is about compatibility, not effort: a one-line change that renames a public function is MAJOR, and a six-month rewrite that keeps the interface is not.</text>
</svg>
