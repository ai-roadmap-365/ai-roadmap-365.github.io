<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Check, fetch on a miss, populate, return.">
  <title>The cache pattern, and its one hard part</title>
  <style>
    .cache-hit-miss-bg   { fill: #f8fafc; }
    .cache-hit-miss-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-hit-miss-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-hit-miss-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-hit-miss-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-hit-miss-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-hit-miss-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-hit-miss-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cache-hit-miss-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cache-hit-miss-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cache-hit-miss-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cache-hit-miss-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cache-hit-miss-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cache-hit-miss-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cache-hit-miss-stage { opacity: 1; }

    .cache-hit-miss-s0 { animation-delay: 0.00s; }
    .cache-hit-miss-e0 { animation-delay: 0.00s; }
    .cache-hit-miss-s1 { animation-delay: 1.28s; }
    .cache-hit-miss-e1 { animation-delay: 1.28s; }
    .cache-hit-miss-s2 { animation-delay: 2.56s; }
    .cache-hit-miss-e2 { animation-delay: 2.56s; }
    .cache-hit-miss-s3 { animation-delay: 3.84s; }
    .cache-hit-miss-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cache-hit-miss-conn  { animation: cache-hit-miss-trace 6.4s ease-in-out infinite; }
      .cache-hit-miss-stage { animation: cache-hit-miss-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cache-hit-miss-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cache-hit-miss-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cache-hit-miss-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cache-hit-miss-stage { animation: cache-hit-miss-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cache-hit-miss-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cache-hit-miss-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cache-hit-miss-bg" width="980" height="322"/>
  <text class="cache-hit-miss-h1"  x="30" y="40">The cache pattern, and its one hard part</text>
  <text class="cache-hit-miss-sub" x="30" y="64">Check, fetch on a miss, populate, return.</text>
  <g class="cache-hit-miss-stage cache-hit-miss-s0">
    <rect class="cache-hit-miss-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cache-hit-miss-step" x="44" y="142">01</text>
    <text class="cache-hit-miss-name" x="70" y="142">Check the cache</text>
    <text class="cache-hit-miss-desc" x="44" y="166">Every read starts here, not at</text>
    <text class="cache-hit-miss-desc" x="44" y="182">the real store.</text>
  </g>
  <line class="cache-hit-miss-line cache-hit-miss-conn cache-hit-miss-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cache-hit-miss-tip)"/>
  <g class="cache-hit-miss-stage cache-hit-miss-s1">
    <rect class="cache-hit-miss-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cache-hit-miss-step" x="280" y="142">02</text>
    <text class="cache-hit-miss-name" x="306" y="142">Hit — return immediately</text>
    <text class="cache-hit-miss-desc" x="280" y="166">Microseconds. The slow store was</text>
    <text class="cache-hit-miss-desc" x="280" y="182">never touched.</text>
    <text class="cache-hit-miss-edge" x="280" y="242">fast</text>
  </g>
  <line class="cache-hit-miss-line cache-hit-miss-conn cache-hit-miss-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cache-hit-miss-tip)"/>
  <g class="cache-hit-miss-stage cache-hit-miss-s2">
    <rect class="cache-hit-miss-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cache-hit-miss-step" x="516" y="142">03</text>
    <text class="cache-hit-miss-name" x="542" y="142">Miss — fetch, populate, return</text>
    <text class="cache-hit-miss-desc" x="516" y="166">Slower this once; fast for</text>
    <text class="cache-hit-miss-desc" x="516" y="182">everyone after.</text>
    <text class="cache-hit-miss-edge" x="516" y="242">one slow read</text>
  </g>
  <line class="cache-hit-miss-line cache-hit-miss-conn cache-hit-miss-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cache-hit-miss-tip)"/>
  <g class="cache-hit-miss-stage cache-hit-miss-s3">
    <rect class="cache-hit-miss-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cache-hit-miss-step" x="752" y="142">04</text>
    <text class="cache-hit-miss-name" x="778" y="142">And then the data changes</text>
    <text class="cache-hit-miss-desc" x="752" y="166">Stale copies must be evicted or</text>
    <text class="cache-hit-miss-desc" x="752" y="182">updated, or users see old data.</text>
    <text class="cache-hit-miss-edge" x="752" y="242">invalidation</text>
  </g>
  <text class="cache-hit-miss-sub" x="30" y="304">A time-to-live is how most systems dodge the hard part: each entry simply expires after N seconds, trading a bounded amount of staleness for not having to know when anything changed.</text>
</svg>
