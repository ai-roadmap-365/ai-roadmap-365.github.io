<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to measure when you do.">
  <title>When to leave exact search</title>
  <style>
    .scaling-when-bg   { fill: #f8fafc; }
    .scaling-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scaling-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scaling-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scaling-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scaling-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scaling-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-when-row { opacity: 1; }
    .scaling-when-r0 { animation-delay: 0.00s; }
    .scaling-when-r1 { animation-delay: 0.45s; }
    .scaling-when-r2 { animation-delay: 0.90s; }
    .scaling-when-r3 { animation-delay: 1.35s; }
    .scaling-when-r4 { animation-delay: 1.80s; }
    .scaling-when-row { animation: scaling-when-reveal 7.3s ease-in-out infinite; }
    @keyframes scaling-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scaling-when-bg" width="980" height="390"/>
  <text class="scaling-when-h1"  x="30" y="40">When to leave exact search</text>
  <text class="scaling-when-sub" x="30" y="64">And what to measure when you do.</text>
  <rect class="scaling-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scaling-when-name" x="46" y="122">Stay exact</text>
  <text class="scaling-when-desc" x="46" y="142">Simpler, and often enough.</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r0" x="46" y="182">Below a few hundred thousand vectors</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r1" x="46" y="216">A matrix multiply against the corpus</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r2" x="46" y="250">No index, no rebuild, no failure modes</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r3" x="46" y="284">Recall is 1.0 by construction</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r4" x="46" y="318">And it is the baseline you will need anyway</text>
  <rect class="scaling-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scaling-when-name" x="526" y="122">Adopt an index</text>
  <text class="scaling-when-desc" x="526" y="142">And measure the loss.</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r0" x="526" y="182">When exact stops fitting the latency budget</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r1" x="526" y="216">Or the memory budget</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r2" x="526" y="250">Keep an exact baseline on a sample</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r3" x="526" y="284">Measure recall against it, per query</text>
  <text class="scaling-when-desc scaling-when-row scaling-when-r4" x="526" y="318">A number nobody measured is not a trade-off</text>
  <text class="scaling-when-sub" x="30" y="372">Keeping an exact-search baseline over a sample is the practice that makes all of this manageable: it costs almost nothing and it is the only way recall is ever a measured quantity rather than an assumption.</text>
</svg>
