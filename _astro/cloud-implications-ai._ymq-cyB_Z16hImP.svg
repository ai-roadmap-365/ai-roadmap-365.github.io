<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them is a legal question.">
  <title>Five consequences of running in a region</title>
  <style>
    .cloud-implications-ai-bg   { fill: #f8fafc; }
    .cloud-implications-ai-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-ai-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-ai-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-ai-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-ai-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-ai-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cloud-implications-ai-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cloud-implications-ai-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cloud-implications-ai-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cloud-implications-ai-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cloud-implications-ai-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cloud-implications-ai-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cloud-implications-ai-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cloud-implications-ai-stage { opacity: 1; }

    .cloud-implications-ai-s0 { animation-delay: 0.00s; }
    .cloud-implications-ai-e0 { animation-delay: 0.00s; }
    .cloud-implications-ai-s1 { animation-delay: 1.33s; }
    .cloud-implications-ai-e1 { animation-delay: 1.33s; }
    .cloud-implications-ai-s2 { animation-delay: 2.67s; }
    .cloud-implications-ai-e2 { animation-delay: 2.67s; }
    .cloud-implications-ai-s3 { animation-delay: 4.00s; }
    .cloud-implications-ai-e3 { animation-delay: 4.00s; }
    .cloud-implications-ai-s4 { animation-delay: 5.33s; }
    .cloud-implications-ai-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .cloud-implications-ai-conn  { animation: cloud-implications-ai-trace 8s ease-in-out infinite; }
      .cloud-implications-ai-stage { animation: cloud-implications-ai-arrive 8s ease-in-out infinite; }
    }
    @keyframes cloud-implications-ai-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cloud-implications-ai-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cloud-implications-ai-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cloud-implications-ai-stage { animation: cloud-implications-ai-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cloud-implications-ai-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cloud-implications-ai-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cloud-implications-ai-bg" width="980" height="322"/>
  <text class="cloud-implications-ai-h1"  x="30" y="40">Five consequences of running in a region</text>
  <text class="cloud-implications-ai-sub" x="30" y="64">One of them is a legal question.</text>
  <g class="cloud-implications-ai-stage cloud-implications-ai-s0">
    <rect class="cloud-implications-ai-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-ai-step" x="44" y="142">01</text>
    <text class="cloud-implications-ai-name" x="70" y="142">Inject secrets at run time</text>
    <text class="cloud-implications-ai-desc" x="44" y="166">A cloud secret manager</text>
    <text class="cloud-implications-ai-desc" x="44" y="182">with rotation. Never a</text>
    <text class="cloud-implications-ai-desc" x="44" y="198">repository, never an</text>
    <text class="cloud-implications-ai-edge" x="44" y="242">security</text>
  </g>
  <line class="cloud-implications-ai-line cloud-implications-ai-conn cloud-implications-ai-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#cloud-implications-ai-tip)"/>
  <g class="cloud-implications-ai-stage cloud-implications-ai-s1">
    <rect class="cloud-implications-ai-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-ai-step" x="233" y="142">02</text>
    <text class="cloud-implications-ai-name" x="259" y="142">The region decides the law</text>
    <text class="cloud-implications-ai-desc" x="233" y="166">Geo-fencing keeps EU</text>
    <text class="cloud-implications-ai-desc" x="233" y="182">prompts and activations</text>
    <text class="cloud-implications-ai-desc" x="233" y="198">in EU regions.</text>
    <text class="cloud-implications-ai-edge" x="233" y="242">privacy</text>
  </g>
  <line class="cloud-implications-ai-line cloud-implications-ai-conn cloud-implications-ai-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#cloud-implications-ai-tip)"/>
  <g class="cloud-implications-ai-stage cloud-implications-ai-s2">
    <rect class="cloud-implications-ai-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-ai-step" x="422" y="142">03</text>
    <text class="cloud-implications-ai-name" x="448" y="142">Startup is 60-120 seconds</text>
    <text class="cloud-implications-ai-desc" x="422" y="166">Weights load. Probes must</text>
    <text class="cloud-implications-ai-desc" x="422" y="182">allow for it or</text>
    <text class="cloud-implications-ai-desc" x="422" y="198">restart-loop.</text>
    <text class="cloud-implications-ai-edge" x="422" y="242">performance</text>
  </g>
  <line class="cloud-implications-ai-line cloud-implications-ai-conn cloud-implications-ai-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#cloud-implications-ai-tip)"/>
  <g class="cloud-implications-ai-stage cloud-implications-ai-s3">
    <rect class="cloud-implications-ai-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-ai-step" x="611" y="142">04</text>
    <text class="cloud-implications-ai-name" x="637" y="142">Two regions, identical definitions</text>
    <text class="cloud-implications-ai-desc" x="611" y="166">DNS reroutes in under</text>
    <text class="cloud-implications-ai-desc" x="611" y="182">three seconds when one</text>
    <text class="cloud-implications-ai-desc" x="611" y="198">goes dark.</text>
    <text class="cloud-implications-ai-edge" x="611" y="242">resilience</text>
  </g>
  <line class="cloud-implications-ai-line cloud-implications-ai-conn cloud-implications-ai-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#cloud-implications-ai-tip)"/>
  <g class="cloud-implications-ai-stage cloud-implications-ai-s4">
    <rect class="cloud-implications-ai-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-ai-step" x="800" y="142">05</text>
    <text class="cloud-implications-ai-name" x="826" y="142">Commit the baseline, spot the batch</text>
    <text class="cloud-implications-ai-desc" x="800" y="166">40-60% off a monthly</text>
    <text class="cloud-implications-ai-desc" x="800" y="182">bill.</text>
    <text class="cloud-implications-ai-edge" x="800" y="242">money</text>
  </g>
  <text class="cloud-implications-ai-sub" x="30" y="304">Identical Terraform definitions across regions is what makes the fourth row cheap: disaster recovery is a second `apply` rather than a second engineering project, provided nothing was ever configured by hand.</text>
</svg>
