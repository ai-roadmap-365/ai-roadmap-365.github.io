<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Choosing where to look</title>
  <style>
    .acquisition-bg   { fill: #f8fafc; }
    .acquisition-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acquisition-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acquisition-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acquisition-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acquisition-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acquisition-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .acquisition-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .acquisition-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .acquisition-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .acquisition-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .acquisition-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .acquisition-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .acquisition-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .acquisition-stage { opacity: 1; }

    .acquisition-s0 { animation-delay: 0.00s; }
    .acquisition-e0 { animation-delay: 0.00s; }
    .acquisition-s1 { animation-delay: 1.28s; }
    .acquisition-e1 { animation-delay: 1.28s; }
    .acquisition-s2 { animation-delay: 2.56s; }
    .acquisition-e2 { animation-delay: 2.56s; }
    .acquisition-s3 { animation-delay: 3.84s; }
    .acquisition-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .acquisition-conn  { animation: acquisition-trace 6.4s ease-in-out infinite; }
      .acquisition-stage { animation: acquisition-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes acquisition-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes acquisition-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .acquisition-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .acquisition-stage { animation: acquisition-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes acquisition-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="acquisition-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="acquisition-bg" width="980" height="322"/>
  <text class="acquisition-h1"  x="30" y="40">Choosing where to look</text>
  <text class="acquisition-sub" x="30" y="64">Four steps.</text>
  <g class="acquisition-stage acquisition-s0">
    <rect class="acquisition-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="acquisition-step" x="44" y="142">01</text>
    <text class="acquisition-name" x="70" y="142">Some regions look good on average</text>
    <text class="acquisition-desc" x="44" y="166">Exploitation: refine what is</text>
    <text class="acquisition-desc" x="44" y="182">already promising.</text>
  </g>
  <line class="acquisition-line acquisition-conn acquisition-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#acquisition-tip)"/>
  <g class="acquisition-stage acquisition-s1">
    <rect class="acquisition-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="acquisition-step" x="280" y="142">02</text>
    <text class="acquisition-name" x="306" y="142">Others are simply unexplored</text>
    <text class="acquisition-desc" x="280" y="166">Exploration: the surrogate is</text>
    <text class="acquisition-desc" x="280" y="182">uncertain there.</text>
  </g>
  <line class="acquisition-line acquisition-conn acquisition-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#acquisition-tip)"/>
  <g class="acquisition-stage acquisition-s2">
    <rect class="acquisition-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="acquisition-step" x="516" y="142">03</text>
    <text class="acquisition-name" x="542" y="142">Expected improvement scores both together</text>
    <text class="acquisition-desc" x="516" y="166">How much better it might be,</text>
    <text class="acquisition-desc" x="516" y="182">weighted by how likely.</text>
  </g>
  <line class="acquisition-line acquisition-conn acquisition-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#acquisition-tip)"/>
  <g class="acquisition-stage acquisition-s3">
    <rect class="acquisition-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="acquisition-step" x="752" y="142">04</text>
    <text class="acquisition-name" x="778" y="142">And the highest score is tried next</text>
    <text class="acquisition-desc" x="752" y="166">Which handles the trade-off</text>
    <text class="acquisition-desc" x="752" y="182">automatically.</text>
    <text class="acquisition-edge" x="752" y="242">one number</text>
  </g>
  <text class="acquisition-sub" x="30" y="304">Reducing exploration versus exploitation to a single comparable number is what makes the loop automatic, and it is the same idea used in modern experiment design.</text>
</svg>
