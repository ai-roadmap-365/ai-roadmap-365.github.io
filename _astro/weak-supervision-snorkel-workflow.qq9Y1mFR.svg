<svg role="img" aria-label="Weak supervision workflow showing heuristic labeling functions vote aggregation generative label matrix and downstream model training" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Weak Supervision Programmatic Labeling Workflow</title>
  <defs>
    <linearGradient id="bg191b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="weakCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg191b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">WEAK SUPERVISION: PROGRAMMATIC LABELING WITH SNORKEL</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Combining Noisy Labeling Functions via Generative Label Models without Manual Hand-Labeling</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#weakCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- LFs -->
    <rect x="30" y="35" width="180" height="225" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="120" y="60" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Labeling Functions (LFs)</text>
    <text x="45" y="95" fill="#cbd5e1" font-family="system-ui" font-size="10">• LF1: Regex Keyword Match</text>
    <text x="45" y="125" fill="#cbd5e1" font-family="system-ui" font-size="10">• LF2: Knowledge Base Rule</text>
    <text x="45" y="155" fill="#cbd5e1" font-family="system-ui" font-size="10">• LF3: Legacy Heuristic Model</text>
    <text x="45" y="185" fill="#cbd5e1" font-family="system-ui" font-size="10">• LF4: Third-Party API</text>
    <text x="45" y="225" fill="#94a3b8" font-family="system-ui" font-size="9">Emit Votes: {+1, -1, ABSTAIN}</text>
    <!-- Arrow -->
    <line x1="210" y1="145" x2="280" y2="145" stroke="#64748b" stroke-width="2"/>
    <!-- Label Model -->
    <rect x="280" y="60" width="190" height="170" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="375" y="90" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Generative Label Model</text>
    <text x="295" y="125" fill="#cbd5e1" font-family="system-ui" font-size="10">• Learns LF Accuracies</text>
    <text x="295" y="150" fill="#cbd5e1" font-family="system-ui" font-size="10">• Resolves LF Conflicts</text>
    <text x="295" y="175" fill="#cbd5e1" font-family="system-ui" font-size="10">• Outputs Probabilistic y_tilde</text>
    <!-- Arrow -->
    <line x1="470" y1="145" x2="540" y2="145" stroke="#64748b" stroke-width="2"/>
    <!-- Downstream Model -->
    <rect x="540" y="60" width="180" height="170" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="630" y="90" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Downstream Model</text>
    <text x="555" y="125" fill="#cbd5e1" font-family="system-ui" font-size="10">• GBDT / Transformer</text>
    <text x="555" y="155" fill="#cbd5e1" font-family="system-ui" font-size="10">• Trained on Probabilities</text>
    <text x="555" y="185" fill="#cbd5e1" font-family="system-ui" font-size="10">• Generalizes Beyond Rules</text>
  </g>
</svg>
