<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Increasing autonomy, decreasing steering.">
  <title>Four generations of coding assistance</title>
  <style>
    .four-generations-bg   { fill: #f8fafc; }
    .four-generations-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-generations-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-generations-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-generations-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-generations-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-generations-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-generations-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-generations-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-generations-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-generations-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-generations-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-generations-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-generations-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-generations-stage { opacity: 1; }

    .four-generations-s0 { animation-delay: 0.00s; }
    .four-generations-e0 { animation-delay: 0.00s; }
    .four-generations-s1 { animation-delay: 1.28s; }
    .four-generations-e1 { animation-delay: 1.28s; }
    .four-generations-s2 { animation-delay: 2.56s; }
    .four-generations-e2 { animation-delay: 2.56s; }
    .four-generations-s3 { animation-delay: 3.84s; }
    .four-generations-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-generations-conn  { animation: four-generations-trace 6.4s ease-in-out infinite; }
      .four-generations-stage { animation: four-generations-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-generations-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-generations-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-generations-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-generations-stage { animation: four-generations-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-generations-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-generations-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-generations-bg" width="980" height="322"/>
  <text class="four-generations-h1"  x="30" y="40">Four generations of coding assistance</text>
  <text class="four-generations-sub" x="30" y="64">Increasing autonomy, decreasing steering.</text>
  <g class="four-generations-stage four-generations-s0">
    <rect class="four-generations-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-generations-step" x="44" y="142">01</text>
    <text class="four-generations-name" x="70" y="142">Inline completion</text>
    <text class="four-generations-desc" x="44" y="166">The next few tokens. You steer</text>
    <text class="four-generations-desc" x="44" y="182">every inch.</text>
    <text class="four-generations-edge" x="44" y="242">tokens</text>
  </g>
  <line class="four-generations-line four-generations-conn four-generations-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-generations-tip)"/>
  <g class="four-generations-stage four-generations-s1">
    <rect class="four-generations-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-generations-step" x="280" y="142">02</text>
    <text class="four-generations-name" x="306" y="142">In-editor chat</text>
    <text class="four-generations-desc" x="280" y="166">Explanation and refactoring,</text>
    <text class="four-generations-desc" x="280" y="182">while you do the editing.</text>
  </g>
  <line class="four-generations-line four-generations-conn four-generations-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-generations-tip)"/>
  <g class="four-generations-stage four-generations-s2">
    <rect class="four-generations-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-generations-step" x="516" y="142">03</text>
    <text class="four-generations-name" x="542" y="142">Agentic IDEs and terminal agents</text>
    <text class="four-generations-desc" x="516" y="166">Multi-file edits, terminal</text>
    <text class="four-generations-desc" x="516" y="182">execution, self-verification.</text>
    <text class="four-generations-edge" x="516" y="242">tool loop</text>
  </g>
  <line class="four-generations-line four-generations-conn four-generations-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-generations-tip)"/>
  <g class="four-generations-stage four-generations-s3">
    <rect class="four-generations-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-generations-step" x="752" y="142">04</text>
    <text class="four-generations-name" x="778" y="142">Headless engineers</text>
    <text class="four-generations-desc" x="752" y="166">An issue in, a pull request out,</text>
    <text class="four-generations-desc" x="752" y="182">inside a sandboxed container.</text>
    <text class="four-generations-edge" x="752" y="242">async</text>
  </g>
  <text class="four-generations-sub" x="30" y="304">Autonomy is the axis, and the choice is not simply "the newest": generation three keeps a person in the loop continuously, which is right for work whose specification is still moving.</text>
</svg>
