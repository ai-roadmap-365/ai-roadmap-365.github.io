<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Confirm, hold, dispatch, settle.">
  <title>A ride-sharing platform</title>
  <style>
    .rideshare-bg   { fill: #f8fafc; }
    .rideshare-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rideshare-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rideshare-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rideshare-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rideshare-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rideshare-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rideshare-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rideshare-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rideshare-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rideshare-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rideshare-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rideshare-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rideshare-row { opacity: 1; }
    .rideshare-r0 { animation-delay: 0.00s; }
    .rideshare-r1 { animation-delay: 0.45s; }
    .rideshare-r2 { animation-delay: 0.90s; }
    .rideshare-r3 { animation-delay: 1.35s; }
    .rideshare-r4 { animation-delay: 1.80s; }
    .rideshare-row { animation: rideshare-reveal 7.3s ease-in-out infinite; }
    @keyframes rideshare-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rideshare-bg" width="980" height="390"/>
  <text class="rideshare-h1"  x="30" y="40">A ride-sharing platform</text>
  <text class="rideshare-sub" x="30" y="64">Confirm, hold, dispatch, settle.</text>
  <rect class="rideshare-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rideshare-name" x="46" y="122">The platform</text>
  <text class="rideshare-desc" x="46" y="142">Four mechanisms.</text>
  <text class="rideshare-desc rideshare-row rideshare-r0" x="46" y="182">The pickup confirms instantly on the map</text>
  <text class="rideshare-desc rideshare-row rideshare-r1" x="46" y="216">A hold is placed before the trip</text>
  <text class="rideshare-desc rideshare-row rideshare-r2" x="46" y="250">A cancelled driver is reassigned in seconds</text>
  <text class="rideshare-desc rideshare-row rideshare-r3" x="46" y="284">Exact mileage charged at the end</text>
  <text class="rideshare-desc rideshare-row rideshare-r4" x="46" y="318">The hold's remainder released</text>
  <rect class="rideshare-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rideshare-name" x="526" y="122">The application</text>
  <text class="rideshare-desc" x="526" y="142">The same four.</text>
  <text class="rideshare-desc rideshare-row rideshare-r0" x="526" y="182">Optimistic UI renders immediately</text>
  <text class="rideshare-desc rideshare-row rideshare-r1" x="526" y="216">A credit hold before generation</text>
  <text class="rideshare-desc rideshare-row rideshare-r2" x="526" y="250">Provider failover on error</text>
  <text class="rideshare-desc rideshare-row rideshare-r3" x="526" y="284">Exact tokens settled after streaming</text>
  <text class="rideshare-desc rideshare-row rideshare-r4" x="526" y="318">The hold released</text>
  <text class="rideshare-sub" x="30" y="372">Nobody would build a ride-sharing platform that charges after the trip and hopes the card works, and the equivalent design in an AI product is far more common than it should be.</text>
</svg>
