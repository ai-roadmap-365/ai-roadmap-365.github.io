<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different jobs, one order.">
  <title>Mitigate first, debug later</title>
  <style>
    .mitigate-or-debug-bg   { fill: #f8fafc; }
    .mitigate-or-debug-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mitigate-or-debug-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mitigate-or-debug-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mitigate-or-debug-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mitigate-or-debug-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mitigate-or-debug-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mitigate-or-debug-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mitigate-or-debug-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mitigate-or-debug-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mitigate-or-debug-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mitigate-or-debug-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mitigate-or-debug-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mitigate-or-debug-row { opacity: 1; }
    .mitigate-or-debug-r0 { animation-delay: 0.00s; }
    .mitigate-or-debug-r1 { animation-delay: 0.45s; }
    .mitigate-or-debug-r2 { animation-delay: 0.90s; }
    .mitigate-or-debug-r3 { animation-delay: 1.35s; }
    .mitigate-or-debug-r4 { animation-delay: 1.80s; }
    .mitigate-or-debug-row { animation: mitigate-or-debug-reveal 7.3s ease-in-out infinite; }
    @keyframes mitigate-or-debug-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mitigate-or-debug-bg" width="980" height="390"/>
  <text class="mitigate-or-debug-h1"  x="30" y="40">Mitigate first, debug later</text>
  <text class="mitigate-or-debug-sub" x="30" y="64">Two different jobs, one order.</text>
  <rect class="mitigate-or-debug-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mitigate-or-debug-name" x="46" y="122">Mitigate first</text>
  <text class="mitigate-or-debug-desc" x="46" y="142">Service restored in seconds.</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r0" x="46" y="182">Roll back to the known-good revision</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r1" x="46" y="216">Users stop seeing errors</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r2" x="46" y="250">The evidence is in the recording</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r3" x="46" y="284">Debug calmly, in staging</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r4" x="46" y="318">MTTR measured in seconds</text>
  <rect class="mitigate-or-debug-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mitigate-or-debug-name" x="526" y="122">Debug first</text>
  <text class="mitigate-or-debug-desc" x="526" y="142">The outage runs throughout.</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r0" x="526" y="182">45 minutes on a CUDA stack trace</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r1" x="526" y="216">Users receive 500s the whole time</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r2" x="526" y="250">Written by people under pressure</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r3" x="526" y="284">And the fix may be wrong</text>
  <text class="mitigate-or-debug-desc mitigate-or-debug-row mitigate-or-debug-r4" x="526" y="318">MTTR measured in tens of minutes</text>
  <text class="mitigate-or-debug-sub" x="30" y="372">Sealing the bulkhead before identifying which pipe broke is the same instinct, and it is correct for the same reason: the diagnosis is equally available afterwards and the flooding is not.</text>
</svg>
