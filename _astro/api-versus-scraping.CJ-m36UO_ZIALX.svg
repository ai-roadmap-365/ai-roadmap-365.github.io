<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is a contract. The other is an assumption.">
  <title>An API and a scraper are not equivalent</title>
  <style>
    .api-versus-scraping-bg   { fill: #f8fafc; }
    .api-versus-scraping-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-versus-scraping-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-versus-scraping-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-versus-scraping-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-versus-scraping-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-versus-scraping-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-versus-scraping-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api-versus-scraping-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api-versus-scraping-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api-versus-scraping-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api-versus-scraping-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api-versus-scraping-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-versus-scraping-row { opacity: 1; }
    .api-versus-scraping-r0 { animation-delay: 0.00s; }
    .api-versus-scraping-r1 { animation-delay: 0.45s; }
    .api-versus-scraping-r2 { animation-delay: 0.90s; }
    .api-versus-scraping-r3 { animation-delay: 1.35s; }
    .api-versus-scraping-r4 { animation-delay: 1.80s; }
    .api-versus-scraping-row { animation: api-versus-scraping-reveal 7.3s ease-in-out infinite; }
    @keyframes api-versus-scraping-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="api-versus-scraping-bg" width="980" height="390"/>
  <text class="api-versus-scraping-h1"  x="30" y="40">An API and a scraper are not equivalent</text>
  <text class="api-versus-scraping-sub" x="30" y="64">One is a contract. The other is an assumption.</text>
  <rect class="api-versus-scraping-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="api-versus-scraping-name" x="46" y="122">An API</text>
  <text class="api-versus-scraping-desc" x="46" y="142">A published promise.</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r0" x="46" y="182">Structured data, already parsed</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r1" x="46" y="216">A documented, versioned shape</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r2" x="46" y="250">Explicit permission and terms</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r3" x="46" y="284">Breaking changes are announced</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r4" x="46" y="318">Rate limits you can plan around</text>
  <rect class="api-versus-scraping-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="api-versus-scraping-name" x="526" y="122">Scraping</text>
  <text class="api-versus-scraping-desc" x="526" y="142">An assumption about a layout.</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r0" x="526" y="182">Parse HTML meant for human eyes</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r1" x="526" y="216">Breaks when a designer moves a div</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r2" x="526" y="250">Often against the terms you accepted</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r3" x="526" y="284">No warning; you find out in production</text>
  <text class="api-versus-scraping-desc api-versus-scraping-row api-versus-scraping-r4" x="526" y="318">And per Day 20, the content may be script-built</text>
  <text class="api-versus-scraping-sub" x="30" y="372">Scrape when there is genuinely no API and you have permission. Never scrape a service that offers one, and check for one before you assume there is not.</text>
</svg>
