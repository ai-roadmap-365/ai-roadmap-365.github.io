<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One dial, two directions.">
  <title>Recall against throughput</title>
  <style>
    .recall-qps-bg   { fill: #f8fafc; }
    .recall-qps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-qps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-qps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-qps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-qps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-qps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recall-qps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recall-qps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recall-qps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recall-qps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recall-qps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recall-qps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recall-qps-row { opacity: 1; }
    .recall-qps-r0 { animation-delay: 0.00s; }
    .recall-qps-r1 { animation-delay: 0.45s; }
    .recall-qps-r2 { animation-delay: 0.90s; }
    .recall-qps-r3 { animation-delay: 1.35s; }
    .recall-qps-r4 { animation-delay: 1.80s; }
    .recall-qps-row { animation: recall-qps-reveal 7.3s ease-in-out infinite; }
    @keyframes recall-qps-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recall-qps-bg" width="980" height="390"/>
  <text class="recall-qps-h1"  x="30" y="40">Recall against throughput</text>
  <text class="recall-qps-sub" x="30" y="64">One dial, two directions.</text>
  <rect class="recall-qps-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recall-qps-name" x="46" y="122">Tuned for recall</text>
  <text class="recall-qps-desc" x="46" y="142">Find more.</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r0" x="46" y="182">More candidates examined per query</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r1" x="46" y="216">Higher memory per vector</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r2" x="46" y="250">Slower queries</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r3" x="46" y="284">Recall above ninety-five percent</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r4" x="46" y="318">Right when a miss is expensive</text>
  <rect class="recall-qps-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recall-qps-name" x="526" y="122">Tuned for throughput</text>
  <text class="recall-qps-desc" x="526" y="142">Answer faster.</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r0" x="526" y="182">Fewer candidates examined</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r1" x="526" y="216">Lower memory per vector</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r2" x="526" y="250">Many times the query rate</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r3" x="526" y="284">Recall in the eighties</text>
  <text class="recall-qps-desc recall-qps-row recall-qps-r4" x="526" y="318">Right when volume dominates</text>
  <text class="recall-qps-sub" x="30" y="372">Choosing a point on this curve requires knowing what a miss actually costs, which is a product question that most teams answer implicitly by accepting a default.</text>
</svg>
