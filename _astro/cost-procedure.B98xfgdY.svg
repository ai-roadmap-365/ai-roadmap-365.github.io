<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Account before you optimise.">
  <title>Six steps, in order</title>
  <style>
    .cost-procedure-bg   { fill: #f8fafc; }
    .cost-procedure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-procedure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-procedure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-procedure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-procedure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-procedure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-procedure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-procedure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-procedure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-procedure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-procedure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-procedure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-procedure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-procedure-stage { opacity: 1; }

    .cost-procedure-s0 { animation-delay: 0.00s; }
    .cost-procedure-e0 { animation-delay: 0.00s; }
    .cost-procedure-s1 { animation-delay: 1.37s; }
    .cost-procedure-e1 { animation-delay: 1.37s; }
    .cost-procedure-s2 { animation-delay: 2.74s; }
    .cost-procedure-e2 { animation-delay: 2.74s; }
    .cost-procedure-s3 { animation-delay: 4.11s; }
    .cost-procedure-e3 { animation-delay: 4.11s; }
    .cost-procedure-s4 { animation-delay: 5.49s; }
    .cost-procedure-e4 { animation-delay: 5.49s; }
    .cost-procedure-s5 { animation-delay: 6.86s; }
    .cost-procedure-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-procedure-conn  { animation: cost-procedure-trace 9.600000000000001s ease-in-out infinite; }
      .cost-procedure-stage { animation: cost-procedure-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes cost-procedure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-procedure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-procedure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-procedure-stage { animation: cost-procedure-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-procedure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-procedure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-procedure-bg" width="980" height="322"/>
  <text class="cost-procedure-h1"  x="30" y="40">Six steps, in order</text>
  <text class="cost-procedure-sub" x="30" y="64">Account before you optimise.</text>
  <g class="cost-procedure-stage cost-procedure-s0">
    <rect class="cost-procedure-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="cost-procedure-step" x="44" y="142">01</text>
    <text class="cost-procedure-name" x="70" y="142">Account</text>
    <text class="cost-procedure-desc" x="44" y="166">Model, input tokens,</text>
    <text class="cost-procedure-desc" x="44" y="182">output tokens, cost</text>
    <text class="cost-procedure-desc" x="44" y="198">— per call, into a</text>
  </g>
  <line class="cost-procedure-line cost-procedure-conn cost-procedure-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#cost-procedure-tip)"/>
  <g class="cost-procedure-stage cost-procedure-s1">
    <rect class="cost-procedure-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="cost-procedure-step" x="201" y="142">02</text>
    <text class="cost-procedure-name" x="227" y="142">Record cache hits as zero-cost calls</text>
    <text class="cost-procedure-desc" x="201" y="166">Recording them as</text>
    <text class="cost-procedure-desc" x="201" y="182">absences hides the</text>
    <text class="cost-procedure-desc" x="201" y="198">hit rate exactly</text>
  </g>
  <line class="cost-procedure-line cost-procedure-conn cost-procedure-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#cost-procedure-tip)"/>
  <g class="cost-procedure-stage cost-procedure-s2">
    <rect class="cost-procedure-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="cost-procedure-step" x="358" y="142">03</text>
    <text class="cost-procedure-name" x="384" y="142">Estimate before spending</text>
    <text class="cost-procedure-desc" x="358" y="166">Count tokens from</text>
    <text class="cost-procedure-desc" x="358" y="182">the text; cap on the</text>
    <text class="cost-procedure-desc" x="358" y="198">estimate, reconcile</text>
  </g>
  <line class="cost-procedure-line cost-procedure-conn cost-procedure-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#cost-procedure-tip)"/>
  <g class="cost-procedure-stage cost-procedure-s3">
    <rect class="cost-procedure-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="cost-procedure-step" x="515" y="142">04</text>
    <text class="cost-procedure-name" x="541" y="142">Route</text>
    <text class="cost-procedure-desc" x="515" y="166">Even a crude</text>
    <text class="cost-procedure-desc" x="515" y="182">heuristic captures</text>
    <text class="cost-procedure-desc" x="515" y="198">most of the benefit.</text>
  </g>
  <line class="cost-procedure-line cost-procedure-conn cost-procedure-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#cost-procedure-tip)"/>
  <g class="cost-procedure-stage cost-procedure-s4">
    <rect class="cost-procedure-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="cost-procedure-step" x="672" y="142">05</text>
    <text class="cost-procedure-name" x="698" y="142">Trim to a context budget</text>
    <text class="cost-procedure-desc" x="672" y="166">Fill in priority</text>
    <text class="cost-procedure-desc" x="672" y="182">order, stopping at</text>
    <text class="cost-procedure-desc" x="672" y="198">the first chunk that</text>
  </g>
  <line class="cost-procedure-line cost-procedure-conn cost-procedure-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#cost-procedure-tip)"/>
  <g class="cost-procedure-stage cost-procedure-s5">
    <rect class="cost-procedure-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="cost-procedure-step" x="829" y="142">06</text>
    <text class="cost-procedure-name" x="855" y="142">Cap, degrade, then refuse</text>
    <text class="cost-procedure-desc" x="829" y="166">All three states</text>
    <text class="cost-procedure-desc" x="829" y="182">observable. Project</text>
    <text class="cost-procedure-desc" x="829" y="198">the total before</text>
  </g>
  <text class="cost-procedure-sub" x="30" y="304">Stopping at the first chunk that does not fit rather than skipping to a smaller one is deliberate: contiguity in relevance matters more than filling the budget exactly.</text>
</svg>
