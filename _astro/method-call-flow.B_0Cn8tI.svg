<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" role="img" font-family="system-ui, sans-serif">
  <title>Step by step, what happens when you write account.deposit(50): Python looks up the name deposit in the instance dictionary, does not find it, falls back to the class dictionary where the function lives, wraps it as a bound method that remembers the instance, calls it as Account.deposit(account, 50) with self bound to the instance, mutates that instance's own state through the property setter, has the setter check the invariant, and returns the new balance</title>
  <rect x="0" y="0" width="880" height="700" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">What happens when you write account.deposit(50)</text>

  <!-- 1 -->
  <rect x="120" y="56" width="420" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. Name lookup on the instance</text>
  <text x="330" y="98" text-anchor="middle" font-size="14" fill="#1a202c">is 'deposit' a key in account.__dict__ ?</text>
  <line x1="330" y1="108" x2="330" y2="126" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,128 324,116 336,116" fill="#1a202c"/>

  <!-- 2 -->
  <rect x="120" y="128" width="420" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. Not found there</text>
  <text x="330" y="170" text-anchor="middle" font-size="14" fill="#1a202c">the instance dict holds only state: owner, _balance, history</text>
  <line x1="330" y1="180" x2="330" y2="198" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,200 324,188 336,188" fill="#1a202c"/>

  <!-- 3 -->
  <rect x="120" y="200" width="420" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. Fall back to the class</text>
  <text x="330" y="242" text-anchor="middle" font-size="14" fill="#1a202c">type(account).__dict__['deposit'] → a function object</text>
  <line x1="330" y1="252" x2="330" y2="270" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,272 324,260 336,260" fill="#1a202c"/>

  <!-- 4 -->
  <rect x="120" y="272" width="420" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. A bound method is created</text>
  <text x="330" y="314" text-anchor="middle" font-size="14" fill="#1a202c">__func__ = the function, __self__ = this account</text>
  <line x1="330" y1="324" x2="330" y2="342" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,344 324,332 336,332" fill="#1a202c"/>

  <!-- 5 -->
  <rect x="120" y="344" width="420" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5. Called with self supplied</text>
  <text x="330" y="386" text-anchor="middle" font-size="14" fill="#1a202c">account.deposit(50) becomes Account.deposit(account, 50)</text>
  <line x1="330" y1="396" x2="330" y2="414" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,416 324,404 336,404" fill="#1a202c"/>

  <!-- 6 -->
  <rect x="120" y="416" width="420" height="52" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">6. This instance's state is mutated</text>
  <text x="330" y="458" text-anchor="middle" font-size="14" fill="#1a202c">self.balance = self.balance + 50 — no other account moves</text>
  <line x1="330" y1="468" x2="330" y2="486" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,488 324,476 336,476" fill="#1a202c"/>

  <!-- 7 -->
  <rect x="120" y="488" width="420" height="52" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">7. The invariant is checked</text>
  <text x="330" y="530" text-anchor="middle" font-size="14" fill="#1a202c">the property setter refuses a negative balance</text>
  <line x1="330" y1="540" x2="330" y2="558" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,560 324,548 336,548" fill="#1a202c"/>

  <!-- 8 -->
  <rect x="120" y="560" width="420" height="52" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="582" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">8. The move is recorded and returned</text>
  <text x="330" y="602" text-anchor="middle" font-size="14" fill="#1a202c">self.history.append(('deposit', 50.0)); return 150.0</text>

  <!-- rejection branch -->
  <line x1="540" y1="514" x2="586" y2="514" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="588,514 576,508 576,520" fill="#1d4ed8"/>
  <rect x="588" y="474" width="264" height="82" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="720" y="498" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">if the rule is broken</text>
  <text x="720" y="518" text-anchor="middle" font-size="14" fill="#1a202c">ValueError is raised,</text>
  <text x="720" y="538" text-anchor="middle" font-size="14" fill="#1a202c">and the state stays valid</text>

  <!-- side annotations -->
  <text x="700" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">where things live</text>
  <text x="700" y="206" text-anchor="middle" font-size="14" fill="#1a202c">state → the instance dict</text>
  <text x="700" y="228" text-anchor="middle" font-size="14" fill="#1a202c">behaviour → the class dict</text>
  <text x="700" y="250" text-anchor="middle" font-size="14" fill="#1a202c">the link → self</text>

  <text x="440" y="660" text-anchor="middle" font-size="15" fill="#1a202c">Steps 1 to 5 are the sugar; steps 6 to 8 are your code keeping the object's promise.</text>
</svg>
