<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" font-family="system-ui, sans-serif">
  <title>From a character to its bits: é becomes the code point U+00E9, then the UTF-8 bytes C3 A9, then sixteen bits</title>
  <rect x="0" y="0" width="700" height="560" fill="#f8fafc"/>
  <text x="350" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">From character to bits</text>

  <!-- Layer 1: character -->
  <rect x="120" y="60" width="460" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="170" y="107" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a202c">é</text>
  <text x="390" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Character</text>
  <text x="390" y="118" text-anchor="middle" font-size="14" fill="#1a202c">what a person sees on screen</text>

  <!-- Arrow 1 -->
  <line x1="350" y1="136" x2="350" y2="170" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="350,180 343,166 357,166" fill="#1d4ed8"/>
  <text x="368" y="164" font-size="14" fill="#1d4ed8">Unicode assigns a catalog number</text>

  <!-- Layer 2: code point -->
  <rect x="120" y="184" width="460" height="76" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="170" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">U+00E9</text>
  <text x="390" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Code point</text>
  <text x="390" y="242" text-anchor="middle" font-size="14" fill="#1a202c">the number 233 — same in every country</text>

  <!-- Arrow 2 -->
  <line x1="350" y1="260" x2="350" y2="294" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="350,304 343,290 357,290" fill="#1d4ed8"/>
  <text x="368" y="288" font-size="14" fill="#1d4ed8">UTF-8 turns the number into bytes</text>

  <!-- Layer 3: UTF-8 bytes -->
  <rect x="120" y="308" width="460" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="170" y="354" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">C3 A9</text>
  <text x="390" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">UTF-8 bytes</text>
  <text x="390" y="366" text-anchor="middle" font-size="14" fill="#1a202c">two bytes stored on disk or sent over a network</text>

  <!-- Arrow 3 -->
  <line x1="350" y1="384" x2="350" y2="418" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="350,428 343,414 357,414" fill="#1d4ed8"/>
  <text x="368" y="412" font-size="14" fill="#1d4ed8">each byte is eight switches</text>

  <!-- Layer 4: bits -->
  <rect x="120" y="432" width="460" height="76" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="230" y="478" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">11000011 10101001</text>
  <text x="460" y="466" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Bits</text>
  <text x="460" y="490" text-anchor="middle" font-size="14" fill="#1a202c">what the hardware actually holds</text>

  <text x="350" y="540" text-anchor="middle" font-size="15" fill="#1a202c">Emoji take the same trip: U+1F389 becomes the four bytes F0 9F 8E 89.</text>
</svg>
