<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What a raise does</title>
  <style>
    .raise-mechanics-bg   { fill: #f8fafc; }
    .raise-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raise-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raise-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raise-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raise-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raise-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .raise-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .raise-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .raise-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .raise-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .raise-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .raise-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .raise-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .raise-mechanics-stage { opacity: 1; }

    .raise-mechanics-s0 { animation-delay: 0.00s; }
    .raise-mechanics-e0 { animation-delay: 0.00s; }
    .raise-mechanics-s1 { animation-delay: 1.28s; }
    .raise-mechanics-e1 { animation-delay: 1.28s; }
    .raise-mechanics-s2 { animation-delay: 2.56s; }
    .raise-mechanics-e2 { animation-delay: 2.56s; }
    .raise-mechanics-s3 { animation-delay: 3.84s; }
    .raise-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .raise-mechanics-conn  { animation: raise-mechanics-trace 6.4s ease-in-out infinite; }
      .raise-mechanics-stage { animation: raise-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes raise-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes raise-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .raise-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .raise-mechanics-stage { animation: raise-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes raise-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="raise-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="raise-mechanics-bg" width="980" height="322"/>
  <text class="raise-mechanics-h1"  x="30" y="40">What a raise does</text>
  <text class="raise-mechanics-sub" x="30" y="64">Four steps.</text>
  <g class="raise-mechanics-stage raise-mechanics-s0">
    <rect class="raise-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="raise-mechanics-step" x="44" y="142">01</text>
    <text class="raise-mechanics-name" x="70" y="142">An exception object is created</text>
    <text class="raise-mechanics-desc" x="44" y="166">Carrying a type, a message and a</text>
    <text class="raise-mechanics-desc" x="44" y="182">traceback.</text>
  </g>
  <line class="raise-mechanics-line raise-mechanics-conn raise-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#raise-mechanics-tip)"/>
  <g class="raise-mechanics-stage raise-mechanics-s1">
    <rect class="raise-mechanics-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="raise-mechanics-step" x="280" y="142">02</text>
    <text class="raise-mechanics-name" x="306" y="142">The current frame stops immediately</text>
    <text class="raise-mechanics-desc" x="280" y="166">Nothing after the raise runs.</text>
  </g>
  <line class="raise-mechanics-line raise-mechanics-conn raise-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#raise-mechanics-tip)"/>
  <g class="raise-mechanics-stage raise-mechanics-s2">
    <rect class="raise-mechanics-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="raise-mechanics-step" x="516" y="142">03</text>
    <text class="raise-mechanics-name" x="542" y="142">Each frame is checked for a matching handler</text>
    <text class="raise-mechanics-desc" x="516" y="166">Unwinding outward, running</text>
    <text class="raise-mechanics-desc" x="516" y="182">finally blocks.</text>
  </g>
  <line class="raise-mechanics-line raise-mechanics-conn raise-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#raise-mechanics-tip)"/>
  <g class="raise-mechanics-stage raise-mechanics-s3">
    <rect class="raise-mechanics-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="raise-mechanics-step" x="752" y="142">04</text>
    <text class="raise-mechanics-name" x="778" y="142">And if none matches, the program exits</text>
    <text class="raise-mechanics-desc" x="752" y="166">Printing the traceback.</text>
  </g>
  <text class="raise-mechanics-sub" x="30" y="304">Finally blocks running during the unwind is what makes cleanup reliable, and it is why context managers work at all.</text>
</svg>
