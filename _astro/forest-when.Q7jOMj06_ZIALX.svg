<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use a random forest</title>
  <style>
    .forest-when-bg   { fill: #f8fafc; }
    .forest-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forest-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forest-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forest-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forest-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forest-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forest-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forest-when-row { opacity: 1; }
    .forest-when-r0 { animation-delay: 0.00s; }
    .forest-when-r1 { animation-delay: 0.45s; }
    .forest-when-r2 { animation-delay: 0.90s; }
    .forest-when-r3 { animation-delay: 1.35s; }
    .forest-when-r4 { animation-delay: 1.80s; }
    .forest-when-row { animation: forest-when-reveal 7.3s ease-in-out infinite; }
    @keyframes forest-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="forest-when-bg" width="980" height="390"/>
  <text class="forest-when-h1"  x="30" y="40">When to use a random forest</text>
  <text class="forest-when-sub" x="30" y="64">And when not to.</text>
  <rect class="forest-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="forest-when-name" x="46" y="122">Use one</text>
  <text class="forest-when-desc" x="46" y="142">Four cases.</text>
  <text class="forest-when-desc forest-when-row forest-when-r0" x="46" y="182">Tabular data, as a strong default</text>
  <text class="forest-when-desc forest-when-row forest-when-r1" x="46" y="216">When you want results without tuning</text>
  <text class="forest-when-desc forest-when-row forest-when-r2" x="46" y="250">Where free validation is useful</text>
  <text class="forest-when-desc forest-when-row forest-when-r3" x="46" y="284">Mixed feature types</text>
  <text class="forest-when-desc forest-when-row forest-when-r4" x="46" y="318">Noisy data with outliers</text>
  <rect class="forest-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="forest-when-name" x="526" y="122">Use something else</text>
  <text class="forest-when-desc" x="526" y="142">Also four.</text>
  <text class="forest-when-desc forest-when-row forest-when-r0" x="526" y="182">Where the last point of accuracy matters — boost</text>
  <text class="forest-when-desc forest-when-row forest-when-r1" x="526" y="216">Very high dimensional sparse text — linear</text>
  <text class="forest-when-desc forest-when-row forest-when-r2" x="526" y="250">Images, audio, sequences — networks</text>
  <text class="forest-when-desc forest-when-row forest-when-r3" x="526" y="284">Tight memory or latency budgets</text>
  <text class="forest-when-desc forest-when-row forest-when-r4" x="526" y="318">Where a readable rule is required</text>
  <text class="forest-when-sub" x="30" y="372">A forest is the right first serious attempt on tabular data almost always, and a boosted model is the right second one when the accuracy is worth the tuning.</text>
</svg>
