<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each extended the last.">
  <title>Four steps to video generation</title>
  <style>
    .video-history-bg   { fill: #f8fafc; }
    .video-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .video-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .video-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .video-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .video-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .video-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .video-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .video-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .video-history-stage { opacity: 1; }

    .video-history-s0 { animation-delay: 0.00s; }
    .video-history-e0 { animation-delay: 0.00s; }
    .video-history-s1 { animation-delay: 1.28s; }
    .video-history-e1 { animation-delay: 1.28s; }
    .video-history-s2 { animation-delay: 2.56s; }
    .video-history-e2 { animation-delay: 2.56s; }
    .video-history-s3 { animation-delay: 3.84s; }
    .video-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .video-history-conn  { animation: video-history-trace 6.4s ease-in-out infinite; }
      .video-history-stage { animation: video-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes video-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes video-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .video-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .video-history-stage { animation: video-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes video-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="video-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="video-history-bg" width="980" height="322"/>
  <text class="video-history-h1"  x="30" y="40">Four steps to video generation</text>
  <text class="video-history-sub" x="30" y="64">Each extended the last.</text>
  <g class="video-history-stage video-history-s0">
    <rect class="video-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="video-history-step" x="44" y="142">01</text>
    <text class="video-history-name" x="70" y="142">Interpolating between real frames</text>
    <text class="video-history-desc" x="44" y="166">Not generation, but the first</text>
    <text class="video-history-desc" x="44" y="182">motion work.</text>
  </g>
  <line class="video-history-line video-history-conn video-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#video-history-tip)"/>
  <g class="video-history-stage video-history-s1">
    <rect class="video-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="video-history-step" x="280" y="142">02</text>
    <text class="video-history-name" x="306" y="142">Generating frames independently</text>
    <text class="video-history-desc" x="280" y="166">Which flickered badly.</text>
  </g>
  <line class="video-history-line video-history-conn video-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#video-history-tip)"/>
  <g class="video-history-stage video-history-s2">
    <rect class="video-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="video-history-step" x="516" y="142">03</text>
    <text class="video-history-name" x="542" y="142">Adding temporal layers to an image model</text>
    <text class="video-history-desc" x="516" y="166">Which fixed consistency over</text>
    <text class="video-history-desc" x="516" y="182">short clips.</text>
  </g>
  <line class="video-history-line video-history-conn video-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#video-history-tip)"/>
  <g class="video-history-stage video-history-s3">
    <rect class="video-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="video-history-step" x="752" y="142">04</text>
    <text class="video-history-name" x="778" y="142">Then transformers over space and time together</text>
    <text class="video-history-desc" x="752" y="166">Which extended the clips and the</text>
    <text class="video-history-desc" x="752" y="182">coherence.</text>
  </g>
  <text class="video-history-sub" x="30" y="304">The intermediate step is instructive: bolting temporal layers onto a pretrained image model was cheap and worked well enough to make the field move.</text>
</svg>
