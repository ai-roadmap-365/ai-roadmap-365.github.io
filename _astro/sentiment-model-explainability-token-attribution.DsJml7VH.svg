<svg role="img" aria-label="Token attribution and saliency explanation heatmap showing positive and negative word feature contributions to predicted sentiment" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Model Explainability &amp; Token Attribution Heatmap</title>
  <defs>
    <linearGradient id="bg224b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card224b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg224b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SENTIMENT EXPLAINABILITY: TOKEN ATTRIBUTION MAP</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Integrated Gradients Saliency Scores Isolating Positive vs Negative Decision Drivers</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card224b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Review 1: Positive Review Saliency -->
    <rect x="25" y="25" width="710" height="110" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="40" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700">Sample A (Prediction: 98.4% POSITIVE)</text>
    <g transform="translate(40, 65)">
      <rect x="0" y="0" width="45" height="30" fill="#1e293b" rx="4"/>
      <text x="22" y="20" fill="#cbd5e1" font-size="10" text-anchor="middle">"The"</text>
      
      <rect x="55" y="0" width="70" height="30" fill="#065f46" stroke="#10b981" stroke-width="1.5" rx="4"/>
      <text x="90" y="20" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">"battery"</text>
      <text x="90" y="42" fill="#34d399" font-size="8" text-anchor="middle">+0.32</text>

      <rect x="135" y="0" width="45" height="30" fill="#1e293b" rx="4"/>
      <text x="157" y="20" fill="#cbd5e1" font-size="10" text-anchor="middle">"life"</text>

      <rect x="190" y="0" width="40" height="30" fill="#1e293b" rx="4"/>
      <text x="210" y="20" fill="#cbd5e1" font-size="10" text-anchor="middle">"is"</text>

      <rect x="240" y="0" width="95" height="30" fill="#047857" stroke="#34d399" stroke-width="2" rx="4"/>
      <text x="287" y="20" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">"fantastic"</text>
      <text x="287" y="42" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">+0.88</text>

      <rect x="345" y="0" width="50" height="30" fill="#1e293b" rx="4"/>
      <text x="370" y="20" fill="#cbd5e1" font-size="10" text-anchor="middle">"and"</text>

      <rect x="405" y="0" width="90" height="30" fill="#047857" stroke="#34d399" stroke-width="1.5" rx="4"/>
      <text x="450" y="20" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">"seamless"</text>
      <text x="450" y="42" fill="#34d399" font-size="8" text-anchor="middle">+0.64</text>
    </g>

    <!-- Review 2: Negation Handling Saliency -->
    <rect x="25" y="155" width="710" height="115" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="40" y="178" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700">Sample B (Prediction: 94.1% NEGATIVE - Negation Clause)</text>
    <g transform="translate(40, 195)">
      <rect x="0" y="0" width="60" height="30" fill="#1e293b" rx="4"/>
      <text x="30" y="20" fill="#cbd5e1" font-size="10" text-anchor="middle">"Overall"</text>

      <rect x="70" y="0" width="45" height="30" fill="#1e293b" rx="4"/>
      <text x="92" y="20" fill="#cbd5e1" font-size="10" text-anchor="middle">"it"</text>

      <rect x="125" y="0" width="45" height="30" fill="#1e293b" rx="4"/>
      <text x="147" y="20" fill="#cbd5e1" font-size="10" text-anchor="middle">"was"</text>

      <rect x="180" y="0" width="45" height="30" fill="#881337" stroke="#f43f5e" stroke-width="2" rx="4"/>
      <text x="202" y="20" fill="#fecdd3" font-size="10" font-weight="700" text-anchor="middle">"not"</text>
      <text x="202" y="42" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">-0.72</text>

      <rect x="235" y="0" width="90" height="30" fill="#881337" stroke="#f43f5e" stroke-width="2" rx="4"/>
      <text x="280" y="20" fill="#fecdd3" font-size="10" font-weight="700" text-anchor="middle">"worth"</text>
      <text x="280" y="42" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">-0.81</text>

      <rect x="335" y="0" width="45" height="30" fill="#1e293b" rx="4"/>
      <text x="357" y="20" fill="#cbd5e1" font-size="10" text-anchor="middle">"the"</text>

      <rect x="390" y="0" width="55" height="30" fill="#1e293b" rx="4"/>
      <text x="417" y="20" fill="#cbd5e1" font-size="10" text-anchor="middle">"price"</text>
    </g>
  </g>
</svg>
