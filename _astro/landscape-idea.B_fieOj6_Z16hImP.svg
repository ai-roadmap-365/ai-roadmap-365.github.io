<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four axes, not one.">
  <title>Choosing a model</title>
  <style>
    .landscape-idea-bg   { fill: #f8fafc; }
    .landscape-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .landscape-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .landscape-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .landscape-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .landscape-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .landscape-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .landscape-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .landscape-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .landscape-idea-stage { opacity: 1; }

    .landscape-idea-s0 { animation-delay: 0.00s; }
    .landscape-idea-e0 { animation-delay: 0.00s; }
    .landscape-idea-s1 { animation-delay: 1.28s; }
    .landscape-idea-e1 { animation-delay: 1.28s; }
    .landscape-idea-s2 { animation-delay: 2.56s; }
    .landscape-idea-e2 { animation-delay: 2.56s; }
    .landscape-idea-s3 { animation-delay: 3.84s; }
    .landscape-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .landscape-idea-conn  { animation: landscape-idea-trace 6.4s ease-in-out infinite; }
      .landscape-idea-stage { animation: landscape-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes landscape-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes landscape-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .landscape-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .landscape-idea-stage { animation: landscape-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes landscape-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="landscape-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="landscape-idea-bg" width="980" height="322"/>
  <text class="landscape-idea-h1"  x="30" y="40">Choosing a model</text>
  <text class="landscape-idea-sub" x="30" y="64">Four axes, not one.</text>
  <g class="landscape-idea-stage landscape-idea-s0">
    <rect class="landscape-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="landscape-idea-step" x="44" y="142">01</text>
    <text class="landscape-idea-name" x="70" y="142">Capability on your task</text>
    <text class="landscape-idea-desc" x="44" y="166">Measured on your own examples,</text>
    <text class="landscape-idea-desc" x="44" y="182">not a public benchmark.</text>
  </g>
  <line class="landscape-idea-line landscape-idea-conn landscape-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#landscape-idea-tip)"/>
  <g class="landscape-idea-stage landscape-idea-s1">
    <rect class="landscape-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="landscape-idea-step" x="280" y="142">02</text>
    <text class="landscape-idea-name" x="306" y="142">Cost per request</text>
    <text class="landscape-idea-desc" x="280" y="166">Input and output priced</text>
    <text class="landscape-idea-desc" x="280" y="182">separately, output several times</text>
    <text class="landscape-idea-desc" x="280" y="198">higher.</text>
  </g>
  <line class="landscape-idea-line landscape-idea-conn landscape-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#landscape-idea-tip)"/>
  <g class="landscape-idea-stage landscape-idea-s2">
    <rect class="landscape-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="landscape-idea-step" x="516" y="142">03</text>
    <text class="landscape-idea-name" x="542" y="142">Latency</text>
    <text class="landscape-idea-desc" x="516" y="166">Time to first token, and tokens</text>
    <text class="landscape-idea-desc" x="516" y="182">per second afterwards.</text>
    <text class="landscape-idea-edge" x="516" y="242">two numbers</text>
  </g>
  <line class="landscape-idea-line landscape-idea-conn landscape-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#landscape-idea-tip)"/>
  <g class="landscape-idea-stage landscape-idea-s3">
    <rect class="landscape-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="landscape-idea-step" x="752" y="142">04</text>
    <text class="landscape-idea-name" x="778" y="142">And the constraints</text>
    <text class="landscape-idea-desc" x="752" y="166">Region, retention, context</text>
    <text class="landscape-idea-desc" x="752" y="182">length, rate limits.</text>
  </g>
  <text class="landscape-idea-sub" x="30" y="304">Latency being two numbers rather than one matters for product design: a fast first token with slow generation feels better than the reverse, even at identical total time.</text>
</svg>
