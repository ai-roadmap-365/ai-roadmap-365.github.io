<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Asking for the top of the graph pulls everything below it.">
  <title>Why one install becomes eleven</title>
  <style>
    .dependency-graph-bg   { fill: #f8fafc; }
    .dependency-graph-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-graph-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-graph-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-graph-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-graph-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-graph-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dependency-graph-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dependency-graph-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dependency-graph-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dependency-graph-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dependency-graph-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dependency-graph-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dependency-graph-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dependency-graph-stage { opacity: 1; }

    .dependency-graph-s0 { animation-delay: 0.00s; }
    .dependency-graph-e0 { animation-delay: 0.00s; }
    .dependency-graph-s1 { animation-delay: 1.28s; }
    .dependency-graph-e1 { animation-delay: 1.28s; }
    .dependency-graph-s2 { animation-delay: 2.56s; }
    .dependency-graph-e2 { animation-delay: 2.56s; }
    .dependency-graph-s3 { animation-delay: 3.84s; }
    .dependency-graph-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dependency-graph-conn  { animation: dependency-graph-trace 6.4s ease-in-out infinite; }
      .dependency-graph-stage { animation: dependency-graph-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dependency-graph-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dependency-graph-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dependency-graph-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dependency-graph-stage { animation: dependency-graph-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dependency-graph-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dependency-graph-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dependency-graph-bg" width="980" height="322"/>
  <text class="dependency-graph-h1"  x="30" y="40">Why one install becomes eleven</text>
  <text class="dependency-graph-sub" x="30" y="64">Asking for the top of the graph pulls everything below it.</text>
  <g class="dependency-graph-stage dependency-graph-s0">
    <rect class="dependency-graph-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dependency-graph-step" x="44" y="142">01</text>
    <text class="dependency-graph-name" x="70" y="142">You ask for one thing</text>
    <text class="dependency-graph-desc" x="44" y="166">brew install wget. One name, one</text>
    <text class="dependency-graph-desc" x="44" y="182">command.</text>
    <text class="dependency-graph-edge" x="44" y="242">1 package</text>
  </g>
  <line class="dependency-graph-line dependency-graph-conn dependency-graph-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dependency-graph-tip)"/>
  <g class="dependency-graph-stage dependency-graph-s1">
    <rect class="dependency-graph-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dependency-graph-step" x="280" y="142">02</text>
    <text class="dependency-graph-name" x="306" y="142">It needs others</text>
    <text class="dependency-graph-desc" x="280" y="166">The index records what each</text>
    <text class="dependency-graph-desc" x="280" y="182">package depends on, so the</text>
    <text class="dependency-graph-desc" x="280" y="198">client can read ahead.</text>
  </g>
  <line class="dependency-graph-line dependency-graph-conn dependency-graph-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dependency-graph-tip)"/>
  <g class="dependency-graph-stage dependency-graph-s2">
    <rect class="dependency-graph-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dependency-graph-step" x="516" y="142">03</text>
    <text class="dependency-graph-name" x="542" y="142">And those need others</text>
    <text class="dependency-graph-desc" x="516" y="166">The graph is walked to the</text>
    <text class="dependency-graph-desc" x="516" y="182">bottom before anything is</text>
    <text class="dependency-graph-desc" x="516" y="198">downloaded.</text>
  </g>
  <line class="dependency-graph-line dependency-graph-conn dependency-graph-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dependency-graph-tip)"/>
  <g class="dependency-graph-stage dependency-graph-s3">
    <rect class="dependency-graph-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dependency-graph-step" x="752" y="142">04</text>
    <text class="dependency-graph-name" x="778" y="142">Shared ones installed once</text>
    <text class="dependency-graph-desc" x="752" y="166">Two parents needing the same</text>
    <text class="dependency-graph-desc" x="752" y="182">library get one copy, in the</text>
    <text class="dependency-graph-desc" x="752" y="198">right order.</text>
    <text class="dependency-graph-edge" x="752" y="242">11 packages</text>
  </g>
  <text class="dependency-graph-sub" x="30" y="304">This is the work that makes manual installation fail. The resolver refuses to proceed at all if no compatible set of versions exists — which is better than installing half of one.</text>
</svg>
