<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where the complexity sits.">
  <title>A gateway against direct calls</title>
  <style>
    .gateway-vs-direct-bg   { fill: #f8fafc; }
    .gateway-vs-direct-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-vs-direct-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-vs-direct-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-vs-direct-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-vs-direct-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-vs-direct-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-vs-direct-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gateway-vs-direct-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gateway-vs-direct-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gateway-vs-direct-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gateway-vs-direct-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gateway-vs-direct-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-vs-direct-row { opacity: 1; }
    .gateway-vs-direct-r0 { animation-delay: 0.00s; }
    .gateway-vs-direct-r1 { animation-delay: 0.45s; }
    .gateway-vs-direct-r2 { animation-delay: 0.90s; }
    .gateway-vs-direct-r3 { animation-delay: 1.35s; }
    .gateway-vs-direct-r4 { animation-delay: 1.80s; }
    .gateway-vs-direct-row { animation: gateway-vs-direct-reveal 7.3s ease-in-out infinite; }
    @keyframes gateway-vs-direct-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gateway-vs-direct-bg" width="980" height="390"/>
  <text class="gateway-vs-direct-h1"  x="30" y="40">A gateway against direct calls</text>
  <text class="gateway-vs-direct-sub" x="30" y="64">Where the complexity sits.</text>
  <rect class="gateway-vs-direct-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gateway-vs-direct-name" x="46" y="122">Through a gateway</text>
  <text class="gateway-vs-direct-desc" x="46" y="142">One place.</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r0" x="46" y="182">Credentials held centrally</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r1" x="46" y="216">Uniform logging and tracing</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r2" x="46" y="250">Limits and budgets enforced once</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r3" x="46" y="284">Routing changed without redeploying</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r4" x="46" y="318">But it is another service to run</text>
  <rect class="gateway-vs-direct-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gateway-vs-direct-name" x="526" y="122">Direct from each service</text>
  <text class="gateway-vs-direct-desc" x="526" y="142">No extra hop.</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r0" x="526" y="182">Fewer moving parts</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r1" x="526" y="216">No added latency</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r2" x="526" y="250">Credentials distributed, and duplicated</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r3" x="526" y="284">Logging implemented repeatedly</text>
  <text class="gateway-vs-direct-desc gateway-vs-direct-row gateway-vs-direct-r4" x="526" y="318">Fine for one or two services</text>
  <text class="gateway-vs-direct-sub" x="30" y="372">The crossover comes with the third or fourth service rather than with traffic volume, because the duplicated credential handling is what actually becomes unmanageable.</text>
</svg>
