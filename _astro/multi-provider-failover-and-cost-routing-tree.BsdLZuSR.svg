<svg role="img" aria-label="Multi-provider failover routing decision tree diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Multi-Provider Failover &amp; Cost Router</title>
  <defs>
    <linearGradient id="bg254b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card254b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg254b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MULTI-PROVIDER FAILOVER &amp; COST ROUTING</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Resilient Traffic Steering: Fast Local/Groq Tier -> Cloud Failover on 429/500</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card254b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Step 1: Ingress Request -->
    <rect x="25" y="25" width="165" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="107" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Prompt Ingress</text>
    <rect x="35" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="40" y="95" fill="#cbd5e1" font-size="7">• User query + schema</text>
    <text x="40" y="112" fill="#cbd5e1" font-size="7">• Target model alias</text>
    <text x="40" y="129" fill="#cbd5e1" font-size="7">• SLA timeout = 2.0s</text>
    <text x="107" y="200" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Client Router Ingress</text>

    <!-- Step 2: Primary Dispatch -->
    <rect x="210" y="25" width="165" height="245" fill="#0f172a" stroke="#34d399" rx="6"/>
    <text x="292" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">2. Primary (Fast/Cheap)</text>
    <rect x="220" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="225" y="95" fill="#cbd5e1" font-size="7">• Local vLLM / Groq</text>
    <text x="225" y="112" fill="#cbd5e1" font-size="7">• Sub-second TTFT</text>
    <text x="225" y="129" fill="#cbd5e1" font-size="7">• $0.05 / 1M tokens</text>
    <text x="292" y="200" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">95% Success Rate</text>

    <!-- Step 3: Secondary Failover -->
    <rect x="395" y="25" width="165" height="245" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="477" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">3. Failover (DeepSeek)</text>
    <rect x="405" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="410" y="95" fill="#cbd5e1" font-size="7">• Triggers on 429/500</text>
    <text x="410" y="112" fill="#cbd5e1" font-size="7">• DeepSeek V3 API</text>
    <text x="410" y="129" fill="#cbd5e1" font-size="7">• Base_url switch</text>
    <text x="477" y="200" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Automated Backup</text>

    <!-- Step 4: Frontier Fallback -->
    <rect x="580" y="25" width="165" height="245" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" rx="6"/>
    <text x="662" y="50" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">4. Frontier Fallback</text>
    <rect x="590" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="595" y="95" fill="#cbd5e1" font-size="7">• OpenAI GPT-4o</text>
    <text x="595" y="112" fill="#cbd5e1" font-size="7">• 99.99% Availability</text>
    <text x="595" y="129" fill="#cbd5e1" font-size="7">• Guaranteed delivery</text>
    <text x="662" y="200" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Zero Outages</text>
  </g>
</svg>
