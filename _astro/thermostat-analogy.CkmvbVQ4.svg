<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And you cannot override it by holding the valve.">
  <title>A thermostat, not a schedule</title>
  <style>
    .thermostat-analogy-bg   { fill: #f8fafc; }
    .thermostat-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermostat-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermostat-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermostat-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermostat-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermostat-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .thermostat-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .thermostat-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .thermostat-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .thermostat-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .thermostat-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .thermostat-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .thermostat-analogy-row { opacity: 1; }
    .thermostat-analogy-r0 { animation-delay: 0.00s; }
    .thermostat-analogy-r1 { animation-delay: 0.45s; }
    .thermostat-analogy-r2 { animation-delay: 0.90s; }
    .thermostat-analogy-r3 { animation-delay: 1.35s; }
    .thermostat-analogy-r4 { animation-delay: 1.80s; }
    .thermostat-analogy-row { animation: thermostat-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes thermostat-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="thermostat-analogy-bg" width="980" height="390"/>
  <text class="thermostat-analogy-h1"  x="30" y="40">A thermostat, not a schedule</text>
  <text class="thermostat-analogy-sub" x="30" y="64">And you cannot override it by holding the valve.</text>
  <rect class="thermostat-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="thermostat-analogy-name" x="46" y="122">A schedule</text>
  <text class="thermostat-analogy-desc" x="46" y="142">Reacts to moments.</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r0" x="46" y="182">On at seven, off at nine</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r1" x="46" y="216">A power flicker at 06:59 misses the cue</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r2" x="46" y="250">The house stays cold</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r3" x="46" y="284">No mechanism notices</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r4" x="46" y="318">This is a deployment script</text>
  <rect class="thermostat-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="thermostat-analogy-name" x="526" y="122">A thermostat</text>
  <text class="thermostat-analogy-desc" x="526" y="142">Reacts to state.</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r0" x="526" y="182">Keep it at twenty degrees</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r1" x="526" y="216">Never asks why the room is cold</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r2" x="526" y="250">Compares, acts a little, compares again</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r3" x="526" y="284">Open window, power cut, valve turned — same response</text>
  <text class="thermostat-analogy-desc thermostat-analogy-row thermostat-analogy-r4" x="526" y="318">This is a controller</text>
  <text class="thermostat-analogy-sub" x="30" y="372">`kubectl edit` on a running pod is holding the radiator valve; `kubectl edit` on the Deployment is changing the number on the thermostat. Only one of those survives the next pass of the loop.</text>
</svg>
