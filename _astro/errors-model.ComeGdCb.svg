<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Errors are part of the model</title>
  <style>
    .errors-model-bg   { fill: #f8fafc; }
    .errors-model-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .errors-model-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .errors-model-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .errors-model-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .errors-model-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .errors-model-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .errors-model-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .errors-model-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .errors-model-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .errors-model-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .errors-model-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .errors-model-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .errors-model-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .errors-model-stage { opacity: 1; }

    .errors-model-s0 { animation-delay: 0.00s; }
    .errors-model-e0 { animation-delay: 0.00s; }
    .errors-model-s1 { animation-delay: 1.28s; }
    .errors-model-e1 { animation-delay: 1.28s; }
    .errors-model-s2 { animation-delay: 2.56s; }
    .errors-model-e2 { animation-delay: 2.56s; }
    .errors-model-s3 { animation-delay: 3.84s; }
    .errors-model-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .errors-model-conn  { animation: errors-model-trace 6.4s ease-in-out infinite; }
      .errors-model-stage { animation: errors-model-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes errors-model-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes errors-model-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .errors-model-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .errors-model-stage { animation: errors-model-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes errors-model-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="errors-model-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="errors-model-bg" width="980" height="322"/>
  <text class="errors-model-h1"  x="30" y="40">Errors are part of the model</text>
  <text class="errors-model-sub" x="30" y="64">Four steps.</text>
  <g class="errors-model-stage errors-model-s0">
    <rect class="errors-model-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="errors-model-step" x="44" y="142">01</text>
    <text class="errors-model-name" x="70" y="142">A rule violation is a domain event, not a technical one</text>
    <text class="errors-model-desc" x="44" y="166">Insufficient funds is a business</text>
    <text class="errors-model-desc" x="44" y="182">outcome.</text>
  </g>
  <line class="errors-model-line errors-model-conn errors-model-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#errors-model-tip)"/>
  <g class="errors-model-stage errors-model-s1">
    <rect class="errors-model-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="errors-model-step" x="280" y="142">02</text>
    <text class="errors-model-name" x="306" y="142">A generic error loses that meaning</text>
    <text class="errors-model-desc" x="280" y="166">And forces callers to parse</text>
    <text class="errors-model-desc" x="280" y="182">messages.</text>
  </g>
  <line class="errors-model-line errors-model-conn errors-model-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#errors-model-tip)"/>
  <g class="errors-model-stage errors-model-s2">
    <rect class="errors-model-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="errors-model-step" x="516" y="142">03</text>
    <text class="errors-model-name" x="542" y="142">So define exceptions named for the domain rule</text>
    <text class="errors-model-desc" x="516" y="166">Carrying the relevant values.</text>
  </g>
  <line class="errors-model-line errors-model-conn errors-model-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#errors-model-tip)"/>
  <g class="errors-model-stage errors-model-s3">
    <rect class="errors-model-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="errors-model-step" x="752" y="142">04</text>
    <text class="errors-model-name" x="778" y="142">Which callers can catch and act on specifically</text>
    <text class="errors-model-desc" x="752" y="166">Which is what makes the model</text>
    <text class="errors-model-desc" x="752" y="182">usable.</text>
  </g>
  <text class="errors-model-sub" x="30" y="304">Naming exceptions after the business rule rather than the technical failure is what lets a caller distinguish a declined payment from a network problem.</text>
</svg>
