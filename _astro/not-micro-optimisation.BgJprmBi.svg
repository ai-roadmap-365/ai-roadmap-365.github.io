<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three orders of magnitude apart.">
  <title>Cost work is not micro-optimisation</title>
  <style>
    .not-micro-optimisation-bg   { fill: #f8fafc; }
    .not-micro-optimisation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-micro-optimisation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-micro-optimisation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-micro-optimisation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-micro-optimisation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-micro-optimisation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-micro-optimisation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-micro-optimisation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-micro-optimisation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-micro-optimisation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-micro-optimisation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-micro-optimisation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-micro-optimisation-row { opacity: 1; }
    .not-micro-optimisation-r0 { animation-delay: 0.00s; }
    .not-micro-optimisation-r1 { animation-delay: 0.45s; }
    .not-micro-optimisation-r2 { animation-delay: 0.90s; }
    .not-micro-optimisation-r3 { animation-delay: 1.35s; }
    .not-micro-optimisation-r4 { animation-delay: 1.80s; }
    .not-micro-optimisation-row { animation: not-micro-optimisation-reveal 7.3s ease-in-out infinite; }
    @keyframes not-micro-optimisation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-micro-optimisation-bg" width="980" height="390"/>
  <text class="not-micro-optimisation-h1"  x="30" y="40">Cost work is not micro-optimisation</text>
  <text class="not-micro-optimisation-sub" x="30" y="64">Three orders of magnitude apart.</text>
  <rect class="not-micro-optimisation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-micro-optimisation-name" x="46" y="122">Architectural</text>
  <text class="not-micro-optimisation-desc" x="46" y="142">Where the money is.</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r0" x="46" y="182">How much context to retrieve</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r1" x="46" y="216">Which model handles which request</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r2" x="46" y="250">Whether to cache at all</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r3" x="46" y="284">Made at design time, expensive to revisit</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r4" x="46" y="318">Three orders of magnitude of effect</text>
  <rect class="not-micro-optimisation-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-micro-optimisation-name" x="526" y="122">Micro-optimisation</text>
  <text class="not-micro-optimisation-desc" x="526" y="142">The wrong end.</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r0" x="526" y="182">Ten tokens off a system prompt</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r1" x="526" y="216">While every request goes to the largest model</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r2" x="526" y="250">Visible, satisfying, and negligible</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r3" x="526" y="284">Prices and models change anyway</text>
  <text class="not-micro-optimisation-desc not-micro-optimisation-row not-micro-optimisation-r4" x="526" y="318">So it is not a one-off exercise</text>
  <text class="not-micro-optimisation-sub" x="30" y="372">Optimising the visible thing rather than the expensive one is the recurring failure in this area, and it is the same mistake as celebrating a cache hit rate on your cheapest traffic.</text>
</svg>
