<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what you mean.">
  <title>Which operation when</title>
  <style>
    .matmul-when-bg   { fill: #f8fafc; }
    .matmul-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matmul-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .matmul-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .matmul-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .matmul-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .matmul-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .matmul-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matmul-when-row { opacity: 1; }
    .matmul-when-r0 { animation-delay: 0.00s; }
    .matmul-when-r1 { animation-delay: 0.45s; }
    .matmul-when-r2 { animation-delay: 0.90s; }
    .matmul-when-r3 { animation-delay: 1.35s; }
    .matmul-when-r4 { animation-delay: 1.80s; }
    .matmul-when-row { animation: matmul-when-reveal 7.3s ease-in-out infinite; }
    @keyframes matmul-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="matmul-when-bg" width="980" height="390"/>
  <text class="matmul-when-h1"  x="30" y="40">Which operation when</text>
  <text class="matmul-when-sub" x="30" y="64">By what you mean.</text>
  <rect class="matmul-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="matmul-when-name" x="46" y="122">What you mean</text>
  <text class="matmul-when-desc" x="46" y="142">The intention.</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r0" x="46" y="182">Apply a mask or a gate</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r1" x="46" y="216">Scale each feature by its own factor</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r2" x="46" y="250">Apply a layer to an input</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r3" x="46" y="284">Compose two transformations</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r4" x="46" y="318">Compute all pairwise similarities</text>
  <rect class="matmul-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="matmul-when-name" x="526" y="122">The operation</text>
  <text class="matmul-when-desc" x="526" y="142">What to write.</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r0" x="526" y="182">Elementwise multiplication</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r1" x="526" y="216">Elementwise, with broadcasting</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r2" x="526" y="250">Matrix-vector product</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r3" x="526" y="284">Matrix-matrix product</text>
  <text class="matmul-when-desc matmul-when-row matmul-when-r4" x="526" y="318">Matrix times its own transpose</text>
  <text class="matmul-when-sub" x="30" y="372">The last row is the pattern behind every similarity matrix and every attention score, and recognising it makes a great deal of model code legible at a glance.</text>
</svg>
