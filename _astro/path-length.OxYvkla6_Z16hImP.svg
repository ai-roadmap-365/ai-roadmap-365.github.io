<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Turning path length into a score</title>
  <style>
    .path-length-bg   { fill: #f8fafc; }
    .path-length-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-length-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-length-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-length-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-length-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-length-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .path-length-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .path-length-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .path-length-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .path-length-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .path-length-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .path-length-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .path-length-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .path-length-stage { opacity: 1; }

    .path-length-s0 { animation-delay: 0.00s; }
    .path-length-e0 { animation-delay: 0.00s; }
    .path-length-s1 { animation-delay: 1.28s; }
    .path-length-e1 { animation-delay: 1.28s; }
    .path-length-s2 { animation-delay: 2.56s; }
    .path-length-e2 { animation-delay: 2.56s; }
    .path-length-s3 { animation-delay: 3.84s; }
    .path-length-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .path-length-conn  { animation: path-length-trace 6.4s ease-in-out infinite; }
      .path-length-stage { animation: path-length-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes path-length-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes path-length-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .path-length-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .path-length-stage { animation: path-length-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes path-length-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="path-length-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="path-length-bg" width="980" height="322"/>
  <text class="path-length-h1"  x="30" y="40">Turning path length into a score</text>
  <text class="path-length-sub" x="30" y="64">Four steps.</text>
  <g class="path-length-stage path-length-s0">
    <rect class="path-length-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="path-length-step" x="44" y="142">01</text>
    <text class="path-length-name" x="70" y="142">Average each point's path length across the forest</text>
    <text class="path-length-desc" x="44" y="166">Which reduces the randomness.</text>
  </g>
  <line class="path-length-line path-length-conn path-length-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#path-length-tip)"/>
  <g class="path-length-stage path-length-s1">
    <rect class="path-length-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="path-length-step" x="280" y="142">02</text>
    <text class="path-length-name" x="306" y="142">Normalise against the expected length for that sample size</text>
    <text class="path-length-desc" x="280" y="166">So scores are comparable across</text>
    <text class="path-length-desc" x="280" y="182">datasets.</text>
  </g>
  <line class="path-length-line path-length-conn path-length-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#path-length-tip)"/>
  <g class="path-length-stage path-length-s2">
    <rect class="path-length-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="path-length-step" x="516" y="142">03</text>
    <text class="path-length-name" x="542" y="142">Producing a score near one for anomalies</text>
    <text class="path-length-desc" x="516" y="166">And near a half for ordinary</text>
    <text class="path-length-desc" x="516" y="182">points.</text>
  </g>
  <line class="path-length-line path-length-conn path-length-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#path-length-tip)"/>
  <g class="path-length-stage path-length-s3">
    <rect class="path-length-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="path-length-step" x="752" y="142">04</text>
    <text class="path-length-name" x="778" y="142">With a threshold set by expected contamination</text>
    <text class="path-length-desc" x="752" y="166">Which is an assumption you</text>
    <text class="path-length-desc" x="752" y="182">supply.</text>
  </g>
  <text class="path-length-sub" x="30" y="304">The contamination parameter is an assumption about how much of the data is anomalous, and getting it wrong shifts every decision the detector makes.</text>
</svg>
