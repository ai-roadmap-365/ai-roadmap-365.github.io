<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A corner replaced by a curve.">
  <title>Why transformers use smooth activations</title>
  <style>
    .gelu-swish-bg   { fill: #f8fafc; }
    .gelu-swish-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gelu-swish-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gelu-swish-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gelu-swish-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gelu-swish-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gelu-swish-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gelu-swish-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gelu-swish-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gelu-swish-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gelu-swish-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gelu-swish-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gelu-swish-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gelu-swish-row { opacity: 1; }
    .gelu-swish-r0 { animation-delay: 0.00s; }
    .gelu-swish-r1 { animation-delay: 0.45s; }
    .gelu-swish-r2 { animation-delay: 0.90s; }
    .gelu-swish-r3 { animation-delay: 1.35s; }
    .gelu-swish-r4 { animation-delay: 1.80s; }
    .gelu-swish-row { animation: gelu-swish-reveal 7.3s ease-in-out infinite; }
    @keyframes gelu-swish-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gelu-swish-bg" width="980" height="390"/>
  <text class="gelu-swish-h1"  x="30" y="40">Why transformers use smooth activations</text>
  <text class="gelu-swish-sub" x="30" y="64">A corner replaced by a curve.</text>
  <rect class="gelu-swish-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gelu-swish-name" x="46" y="122">ReLU</text>
  <text class="gelu-swish-desc" x="46" y="142">A corner at zero.</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r0" x="46" y="182">Piecewise linear</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r1" x="46" y="216">A discontinuous derivative at the origin</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r2" x="46" y="250">Fastest to compute</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r3" x="46" y="284">Excellent for convolutional networks</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r4" x="46" y="318">Still the default in vision</text>
  <rect class="gelu-swish-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gelu-swish-name" x="526" y="122">GeLU and Swish</text>
  <text class="gelu-swish-desc" x="526" y="142">Smooth throughout.</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r0" x="526" y="182">Continuously differentiable everywhere</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r1" x="526" y="216">A small negative dip before rising</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r2" x="526" y="250">Empirically better in transformers</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r3" x="526" y="284">More expensive to compute</text>
  <text class="gelu-swish-desc gelu-swish-row gelu-swish-r4" x="526" y="318">The standard in modern language models</text>
  <text class="gelu-swish-sub" x="30" y="372">The justification here is empirical rather than theoretical: these functions train better at scale in transformer architectures, and the reason is not fully settled.</text>
</svg>
