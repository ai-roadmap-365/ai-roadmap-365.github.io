<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Random wins.">
  <title>Grid against random search</title>
  <style>
    .grid-random-bg   { fill: #f8fafc; }
    .grid-random-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grid-random-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grid-random-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grid-random-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grid-random-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grid-random-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grid-random-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .grid-random-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .grid-random-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .grid-random-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .grid-random-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .grid-random-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grid-random-row { opacity: 1; }
    .grid-random-r0 { animation-delay: 0.00s; }
    .grid-random-r1 { animation-delay: 0.45s; }
    .grid-random-r2 { animation-delay: 0.90s; }
    .grid-random-r3 { animation-delay: 1.35s; }
    .grid-random-r4 { animation-delay: 1.80s; }
    .grid-random-row { animation: grid-random-reveal 7.3s ease-in-out infinite; }
    @keyframes grid-random-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="grid-random-bg" width="980" height="390"/>
  <text class="grid-random-h1"  x="30" y="40">Grid against random search</text>
  <text class="grid-random-sub" x="30" y="64">Random wins.</text>
  <rect class="grid-random-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="grid-random-name" x="46" y="122">Grid search</text>
  <text class="grid-random-desc" x="46" y="142">Every combination.</text>
  <text class="grid-random-desc grid-random-row grid-random-r0" x="46" y="182">Fixed values on every axis</text>
  <text class="grid-random-desc grid-random-row grid-random-r1" x="46" y="216">Cost multiplies with each parameter</text>
  <text class="grid-random-desc grid-random-row grid-random-r2" x="46" y="250">Tries only a few values of the parameter that matters</text>
  <text class="grid-random-desc grid-random-row grid-random-r3" x="46" y="284">Wasteful when most parameters are irrelevant</text>
  <text class="grid-random-desc grid-random-row grid-random-r4" x="46" y="318">Reproducible and exhaustive</text>
  <rect class="grid-random-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="grid-random-name" x="526" y="122">Random search</text>
  <text class="grid-random-desc" x="526" y="142">Sampled combinations.</text>
  <text class="grid-random-desc grid-random-row grid-random-r0" x="526" y="182">Random values on every axis</text>
  <text class="grid-random-desc grid-random-row grid-random-r1" x="526" y="216">Cost is whatever budget you set</text>
  <text class="grid-random-desc grid-random-row grid-random-r2" x="526" y="250">Tries a different value of every parameter each time</text>
  <text class="grid-random-desc grid-random-row grid-random-r3" x="526" y="284">Efficient when few parameters matter</text>
  <text class="grid-random-desc grid-random-row grid-random-r4" x="526" y="318">Better results for the same budget</text>
  <text class="grid-random-sub" x="30" y="372">The reason random wins is that only a few hyperparameters matter, and a grid spends most of its budget re-testing the same value of the important one.</text>
</svg>
