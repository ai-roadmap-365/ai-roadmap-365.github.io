<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" font-family="system-ui, sans-serif">
  <title>The modelling method as a seven-step flow: write the domain in plain sentences, extract the nouns and verbs, classify each noun as an entity or a value object, name every invariant in one sentence, draw the boundary between the pure core and its adapters, write the classes, then test the core with no files present</title>
  <rect x="0" y="0" width="800" height="680" fill="#f8fafc"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">From sentences to a tested model</text>

  <!-- Step 1 -->
  <rect x="60" y="60" width="330" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="86" font-size="15" font-weight="bold" fill="#1a202c">1. Write the domain in plain sentences</text>
  <text x="80" y="108" font-size="14" fill="#1a202c">in the expert's own words, not yours</text>
  <text x="410" y="97" font-size="14" fill="#1d4ed8">"An expense has an amount, a date, a category."</text>
  <line x1="225" y1="122" x2="225" y2="140" stroke="#1a202c" stroke-width="2"/>
  <polygon points="225,142 219,128 231,128" fill="#1a202c"/>

  <!-- Step 2 -->
  <rect x="60" y="142" width="330" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="168" font-size="15" font-weight="bold" fill="#1a202c">2. Underline the nouns and the verbs</text>
  <text x="80" y="190" font-size="14" fill="#1a202c">nouns become types, verbs become methods</text>
  <text x="410" y="179" font-size="14" fill="#1d4ed8">expense, amount, category · record, total</text>
  <line x1="225" y1="204" x2="225" y2="222" stroke="#1a202c" stroke-width="2"/>
  <polygon points="225,224 219,210 231,210" fill="#1a202c"/>

  <!-- Step 3 -->
  <rect x="60" y="224" width="330" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="250" font-size="15" font-weight="bold" fill="#1a202c">3. Classify: entity or value object</text>
  <text x="80" y="272" font-size="14" fill="#1a202c">has a life story, or is only its values?</text>
  <text x="410" y="261" font-size="14" fill="#1d4ed8">Expense, Ledger · Money, DateRange</text>
  <line x1="225" y1="286" x2="225" y2="304" stroke="#1a202c" stroke-width="2"/>
  <polygon points="225,306 219,292 231,292" fill="#1a202c"/>

  <!-- Step 4 -->
  <rect x="60" y="306" width="330" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="332" font-size="15" font-weight="bold" fill="#1a202c">4. Name every invariant, one sentence each</text>
  <text x="80" y="354" font-size="14" fill="#1a202c">and say exactly where it is enforced</text>
  <text x="410" y="343" font-size="14" fill="#1d4ed8">"An amount is positive." → __post_init__</text>
  <line x1="225" y1="368" x2="225" y2="386" stroke="#1a202c" stroke-width="2"/>
  <polygon points="225,388 219,374 231,374" fill="#1a202c"/>

  <!-- Step 5 -->
  <rect x="60" y="388" width="330" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="414" font-size="15" font-weight="bold" fill="#1a202c">5. Draw the boundary</text>
  <text x="80" y="436" font-size="14" fill="#1a202c">pure core inside, adapters outside</text>
  <text x="410" y="425" font-size="14" fill="#1d4ed8">core imports no json, no pathlib, no print</text>
  <line x1="225" y1="450" x2="225" y2="468" stroke="#1a202c" stroke-width="2"/>
  <polygon points="225,470 219,456 231,456" fill="#1a202c"/>

  <!-- Step 6 -->
  <rect x="60" y="470" width="330" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="496" font-size="15" font-weight="bold" fill="#1a202c">6. Write the classes</text>
  <text x="80" y="518" font-size="14" fill="#1a202c">frozen dataclasses, enums, a small hierarchy</text>
  <text x="410" y="507" font-size="14" fill="#1d4ed8">the code is a transcript of steps 1 to 5</text>
  <line x1="225" y1="532" x2="225" y2="550" stroke="#1a202c" stroke-width="2"/>
  <polygon points="225,552 219,538 231,538" fill="#1a202c"/>

  <!-- Step 7 -->
  <rect x="60" y="552" width="330" height="62" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="80" y="578" font-size="15" font-weight="bold" fill="#1a202c">7. Test the core with no files present</text>
  <text x="80" y="600" font-size="14" fill="#1a202c">one call in, one value or one refusal out</text>
  <text x="410" y="589" font-size="14" fill="#1d4ed8">if this is hard, the boundary leaked</text>

  <text x="400" y="652" text-anchor="middle" font-size="14" fill="#1a202c">Drawings first, bricks last: nothing is built until the floor plan and the building code are written down.</text>
</svg>
