<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The cost is divergence, not the merge command.">
  <title>Why a long-lived branch gets harder every day</title>
  <style>
    .branch-drift-bg   { fill: #f8fafc; }
    .branch-drift-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-drift-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-drift-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-drift-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-drift-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-drift-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .branch-drift-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .branch-drift-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .branch-drift-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .branch-drift-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .branch-drift-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .branch-drift-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .branch-drift-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .branch-drift-stage { opacity: 1; }

    .branch-drift-s0 { animation-delay: 0.00s; }
    .branch-drift-e0 { animation-delay: 0.00s; }
    .branch-drift-s1 { animation-delay: 1.28s; }
    .branch-drift-e1 { animation-delay: 1.28s; }
    .branch-drift-s2 { animation-delay: 2.56s; }
    .branch-drift-e2 { animation-delay: 2.56s; }
    .branch-drift-s3 { animation-delay: 3.84s; }
    .branch-drift-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .branch-drift-conn  { animation: branch-drift-trace 6.4s ease-in-out infinite; }
      .branch-drift-stage { animation: branch-drift-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes branch-drift-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes branch-drift-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .branch-drift-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .branch-drift-stage { animation: branch-drift-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes branch-drift-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="branch-drift-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="branch-drift-bg" width="980" height="322"/>
  <text class="branch-drift-h1"  x="30" y="40">Why a long-lived branch gets harder every day</text>
  <text class="branch-drift-sub" x="30" y="64">The cost is divergence, not the merge command.</text>
  <g class="branch-drift-stage branch-drift-s0">
    <rect class="branch-drift-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="branch-drift-step" x="44" y="142">01</text>
    <text class="branch-drift-name" x="70" y="142">Day 1</text>
    <text class="branch-drift-desc" x="44" y="166">Merge base is the current main.</text>
    <text class="branch-drift-desc" x="44" y="182">A merge is trivial.</text>
    <text class="branch-drift-edge" x="44" y="242">minutes</text>
  </g>
  <line class="branch-drift-line branch-drift-conn branch-drift-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#branch-drift-tip)"/>
  <g class="branch-drift-stage branch-drift-s1">
    <rect class="branch-drift-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="branch-drift-step" x="280" y="142">02</text>
    <text class="branch-drift-name" x="306" y="142">Week 1</text>
    <text class="branch-drift-desc" x="280" y="166">Main has moved. Still a small</text>
    <text class="branch-drift-desc" x="280" y="182">three-way merge.</text>
    <text class="branch-drift-edge" x="280" y="242">easy</text>
  </g>
  <line class="branch-drift-line branch-drift-conn branch-drift-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#branch-drift-tip)"/>
  <g class="branch-drift-stage branch-drift-s2">
    <rect class="branch-drift-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="branch-drift-step" x="516" y="142">03</text>
    <text class="branch-drift-name" x="542" y="142">Week 4</text>
    <text class="branch-drift-desc" x="516" y="166">Dozens of commits on both sides.</text>
    <text class="branch-drift-desc" x="516" y="182">Conflicts across several files.</text>
    <text class="branch-drift-edge" x="516" y="242">hours</text>
  </g>
  <line class="branch-drift-line branch-drift-conn branch-drift-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#branch-drift-tip)"/>
  <g class="branch-drift-stage branch-drift-s3">
    <rect class="branch-drift-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="branch-drift-step" x="752" y="142">04</text>
    <text class="branch-drift-name" x="778" y="142">Week 12</text>
    <text class="branch-drift-desc" x="752" y="166">The merge takes longer than the</text>
    <text class="branch-drift-desc" x="752" y="182">original work did.</text>
    <text class="branch-drift-edge" x="752" y="242">days</text>
  </g>
  <text class="branch-drift-sub" x="30" y="304">The fix is not merging better. It is merging more often: pull main into your branch regularly, and the final integration stays the size of one day's drift.</text>
</svg>
