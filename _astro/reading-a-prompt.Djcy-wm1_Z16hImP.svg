<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Most people never read it.">
  <title>Your prompt is already telling you things</title>
  <style>
    .reading-a-prompt-bg   { fill: #f8fafc; }
    .reading-a-prompt-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-a-prompt-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-a-prompt-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-a-prompt-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-a-prompt-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-a-prompt-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reading-a-prompt-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reading-a-prompt-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reading-a-prompt-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reading-a-prompt-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reading-a-prompt-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reading-a-prompt-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reading-a-prompt-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reading-a-prompt-stage { opacity: 1; }

    .reading-a-prompt-s0 { animation-delay: 0.00s; }
    .reading-a-prompt-e0 { animation-delay: 0.00s; }
    .reading-a-prompt-s1 { animation-delay: 1.28s; }
    .reading-a-prompt-e1 { animation-delay: 1.28s; }
    .reading-a-prompt-s2 { animation-delay: 2.56s; }
    .reading-a-prompt-e2 { animation-delay: 2.56s; }
    .reading-a-prompt-s3 { animation-delay: 3.84s; }
    .reading-a-prompt-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .reading-a-prompt-conn  { animation: reading-a-prompt-trace 6.4s ease-in-out infinite; }
      .reading-a-prompt-stage { animation: reading-a-prompt-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes reading-a-prompt-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reading-a-prompt-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reading-a-prompt-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reading-a-prompt-stage { animation: reading-a-prompt-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reading-a-prompt-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reading-a-prompt-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reading-a-prompt-bg" width="980" height="322"/>
  <text class="reading-a-prompt-h1"  x="30" y="40">Your prompt is already telling you things</text>
  <text class="reading-a-prompt-sub" x="30" y="64">Most people never read it.</text>
  <g class="reading-a-prompt-stage reading-a-prompt-s0">
    <rect class="reading-a-prompt-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="reading-a-prompt-step" x="44" y="142">01</text>
    <text class="reading-a-prompt-name" x="70" y="142">you@</text>
    <text class="reading-a-prompt-desc" x="44" y="166">Which account you are. Matters</text>
    <text class="reading-a-prompt-desc" x="44" y="182">the moment you use more than</text>
    <text class="reading-a-prompt-desc" x="44" y="198">one.</text>
  </g>
  <line class="reading-a-prompt-line reading-a-prompt-conn reading-a-prompt-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#reading-a-prompt-tip)"/>
  <g class="reading-a-prompt-stage reading-a-prompt-s1">
    <rect class="reading-a-prompt-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="reading-a-prompt-step" x="280" y="142">02</text>
    <text class="reading-a-prompt-name" x="306" y="142">hostname</text>
    <text class="reading-a-prompt-desc" x="280" y="166">Which machine. Matters</text>
    <text class="reading-a-prompt-desc" x="280" y="182">enormously once you are</text>
    <text class="reading-a-prompt-desc" x="280" y="198">connected to servers.</text>
    <text class="reading-a-prompt-edge" x="280" y="242">which box</text>
  </g>
  <line class="reading-a-prompt-line reading-a-prompt-conn reading-a-prompt-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#reading-a-prompt-tip)"/>
  <g class="reading-a-prompt-stage reading-a-prompt-s2">
    <rect class="reading-a-prompt-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="reading-a-prompt-step" x="516" y="142">03</text>
    <text class="reading-a-prompt-name" x="542" y="142">~/projects</text>
    <text class="reading-a-prompt-desc" x="516" y="166">Where you are. The answer to</text>
    <text class="reading-a-prompt-desc" x="516" y="182">half the questions you will ask.</text>
    <text class="reading-a-prompt-edge" x="516" y="242">pwd</text>
  </g>
  <line class="reading-a-prompt-line reading-a-prompt-conn reading-a-prompt-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#reading-a-prompt-tip)"/>
  <g class="reading-a-prompt-stage reading-a-prompt-s3">
    <rect class="reading-a-prompt-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="reading-a-prompt-step" x="752" y="142">04</text>
    <text class="reading-a-prompt-name" x="778" y="142">$ or #</text>
    <text class="reading-a-prompt-desc" x="752" y="166"># traditionally means you are</text>
    <text class="reading-a-prompt-desc" x="752" y="182">root. Worth noticing before you</text>
    <text class="reading-a-prompt-desc" x="752" y="198">type anything.</text>
    <text class="reading-a-prompt-edge" x="752" y="242">privilege</text>
  </g>
  <text class="reading-a-prompt-sub" x="30" y="304">Adding the git branch and the last exit code to your prompt is the highest-value customisation there is: both are things you would otherwise run a command to discover, several times an hour.</text>
</svg>
