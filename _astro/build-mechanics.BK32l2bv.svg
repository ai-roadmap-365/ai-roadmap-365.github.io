<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six mechanics, in order.">
  <title>What the builder actually does</title>
  <style>
    .build-mechanics-bg   { fill: #f8fafc; }
    .build-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .build-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .build-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .build-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .build-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .build-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .build-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .build-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .build-mechanics-stage { opacity: 1; }

    .build-mechanics-s0 { animation-delay: 0.00s; }
    .build-mechanics-e0 { animation-delay: 0.00s; }
    .build-mechanics-s1 { animation-delay: 1.37s; }
    .build-mechanics-e1 { animation-delay: 1.37s; }
    .build-mechanics-s2 { animation-delay: 2.74s; }
    .build-mechanics-e2 { animation-delay: 2.74s; }
    .build-mechanics-s3 { animation-delay: 4.11s; }
    .build-mechanics-e3 { animation-delay: 4.11s; }
    .build-mechanics-s4 { animation-delay: 5.49s; }
    .build-mechanics-e4 { animation-delay: 5.49s; }
    .build-mechanics-s5 { animation-delay: 6.86s; }
    .build-mechanics-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .build-mechanics-conn  { animation: build-mechanics-trace 9.600000000000001s ease-in-out infinite; }
      .build-mechanics-stage { animation: build-mechanics-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes build-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes build-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .build-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .build-mechanics-stage { animation: build-mechanics-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes build-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="build-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="build-mechanics-bg" width="980" height="322"/>
  <text class="build-mechanics-h1"  x="30" y="40">What the builder actually does</text>
  <text class="build-mechanics-sub" x="30" y="64">Six mechanics, in order.</text>
  <g class="build-mechanics-stage build-mechanics-s0">
    <rect class="build-mechanics-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="build-mechanics-step" x="44" y="142">01</text>
    <text class="build-mechanics-name" x="70" y="142">Start from a base image</text>
    <text class="build-mechanics-desc" x="44" y="166">A filesystem with</text>
    <text class="build-mechanics-desc" x="44" y="182">the interpreter</text>
    <text class="build-mechanics-desc" x="44" y="198">already in it.</text>
  </g>
  <line class="build-mechanics-line build-mechanics-conn build-mechanics-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#build-mechanics-tip)"/>
  <g class="build-mechanics-stage build-mechanics-s1">
    <rect class="build-mechanics-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="build-mechanics-step" x="201" y="142">02</text>
    <text class="build-mechanics-name" x="227" y="142">Each instruction adds a layer</text>
    <text class="build-mechanics-desc" x="201" y="166">ENV, WORKDIR, USER</text>
    <text class="build-mechanics-desc" x="201" y="182">and CMD change</text>
    <text class="build-mechanics-desc" x="201" y="198">metadata only, so</text>
  </g>
  <line class="build-mechanics-line build-mechanics-conn build-mechanics-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#build-mechanics-tip)"/>
  <g class="build-mechanics-stage build-mechanics-s2">
    <rect class="build-mechanics-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="build-mechanics-step" x="358" y="142">03</text>
    <text class="build-mechanics-name" x="384" y="142">Compute a cache key per layer</text>
    <text class="build-mechanics-desc" x="358" y="166">Parent identity,</text>
    <text class="build-mechanics-desc" x="358" y="182">instruction text,</text>
    <text class="build-mechanics-desc" x="358" y="198">and file hashes for</text>
    <text class="build-mechanics-edge" x="358" y="242">the key</text>
  </g>
  <line class="build-mechanics-line build-mechanics-conn build-mechanics-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#build-mechanics-tip)"/>
  <g class="build-mechanics-stage build-mechanics-s3">
    <rect class="build-mechanics-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="build-mechanics-step" x="515" y="142">04</text>
    <text class="build-mechanics-name" x="541" y="142">Walk down until a key differs</text>
    <text class="build-mechanics-desc" x="515" y="166">Everything from</text>
    <text class="build-mechanics-desc" x="515" y="182">there rebuilds.</text>
    <text class="build-mechanics-desc" x="515" y="198">"Which layer missed</text>
  </g>
  <line class="build-mechanics-line build-mechanics-conn build-mechanics-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#build-mechanics-tip)"/>
  <g class="build-mechanics-stage build-mechanics-s4">
    <rect class="build-mechanics-warn" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="build-mechanics-step" x="672" y="142">05</text>
    <text class="build-mechanics-name" x="698" y="142">Layers are immutable and all kept</text>
    <text class="build-mechanics-desc" x="672" y="166">A file copied then</text>
    <text class="build-mechanics-desc" x="672" y="182">removed is gone from</text>
    <text class="build-mechanics-desc" x="672" y="198">the top and present</text>
    <text class="build-mechanics-edge" x="672" y="242">forever</text>
  </g>
  <line class="build-mechanics-line build-mechanics-conn build-mechanics-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#build-mechanics-tip)"/>
  <g class="build-mechanics-stage build-mechanics-s5">
    <rect class="build-mechanics-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="build-mechanics-step" x="829" y="142">06</text>
    <text class="build-mechanics-name" x="855" y="142">.dockerignore bounds the context</text>
    <text class="build-mechanics-desc" x="829" y="166">Which bounds what a</text>
    <text class="build-mechanics-desc" x="829" y="182">broad COPY can read,</text>
    <text class="build-mechanics-desc" x="829" y="198">and what can</text>
  </g>
  <text class="build-mechanics-sub" x="30" y="304">The fifth mechanic is the one that becomes a security incident rather than a size problem: `COPY .env .` followed by `RUN rm .env` produces an image whose secret is invisible on top and fully recoverable with `docker save` and `tar`.</text>
</svg>
