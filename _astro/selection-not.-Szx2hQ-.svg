<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What feature selection is not</title>
  <style>
    .selection-not-bg   { fill: #f8fafc; }
    .selection-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .selection-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .selection-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .selection-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .selection-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .selection-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .selection-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .selection-not-row { opacity: 1; }
    .selection-not-r0 { animation-delay: 0.00s; }
    .selection-not-r1 { animation-delay: 0.45s; }
    .selection-not-r2 { animation-delay: 0.90s; }
    .selection-not-r3 { animation-delay: 1.35s; }
    .selection-not-r4 { animation-delay: 1.80s; }
    .selection-not-row { animation: selection-not-reveal 7.3s ease-in-out infinite; }
    @keyframes selection-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="selection-not-bg" width="980" height="390"/>
  <text class="selection-not-h1"  x="30" y="40">What feature selection is not</text>
  <text class="selection-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="selection-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="selection-not-name" x="46" y="122">The misconception</text>
  <text class="selection-not-desc" x="46" y="142">Commonly held.</text>
  <text class="selection-not-desc selection-not-row selection-not-r0" x="46" y="182">Selection always improves accuracy</text>
  <text class="selection-not-desc selection-not-row selection-not-r1" x="46" y="216">Importance scores identify causes</text>
  <text class="selection-not-desc selection-not-row selection-not-r2" x="46" y="250">Correlated features are interchangeable</text>
  <text class="selection-not-desc selection-not-row selection-not-r3" x="46" y="284">It can be done once, up front</text>
  <text class="selection-not-desc selection-not-row selection-not-r4" x="46" y="318">Selecting more is safer</text>
  <rect class="selection-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="selection-not-name" x="526" y="122">What is true</text>
  <text class="selection-not-desc" x="526" y="142">Actually.</text>
  <text class="selection-not-desc selection-not-row selection-not-r0" x="526" y="182">Often it trades a little accuracy for a lot of simplicity</text>
  <text class="selection-not-desc selection-not-row selection-not-r1" x="526" y="216">They identify predictive use only</text>
  <text class="selection-not-desc selection-not-row selection-not-r2" x="526" y="250">Dropping one shifts importance to the other</text>
  <text class="selection-not-desc selection-not-row selection-not-r3" x="526" y="284">It belongs inside the fold, every time</text>
  <text class="selection-not-desc selection-not-row selection-not-r4" x="526" y="318">Each extra feature is an ongoing liability</text>
  <text class="selection-not-sub" x="30" y="372">Correlated features sharing importance is why a single ranking misleads: two duplicated columns each look half as important as the information they carry.</text>
</svg>
