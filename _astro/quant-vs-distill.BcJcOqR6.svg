<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same weights, or new ones.">
  <title>Quantisation against distillation</title>
  <style>
    .quant-vs-distill-bg   { fill: #f8fafc; }
    .quant-vs-distill-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-vs-distill-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-vs-distill-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-vs-distill-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-vs-distill-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-vs-distill-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quant-vs-distill-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quant-vs-distill-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quant-vs-distill-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quant-vs-distill-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quant-vs-distill-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quant-vs-distill-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quant-vs-distill-row { opacity: 1; }
    .quant-vs-distill-r0 { animation-delay: 0.00s; }
    .quant-vs-distill-r1 { animation-delay: 0.45s; }
    .quant-vs-distill-r2 { animation-delay: 0.90s; }
    .quant-vs-distill-r3 { animation-delay: 1.35s; }
    .quant-vs-distill-r4 { animation-delay: 1.80s; }
    .quant-vs-distill-row { animation: quant-vs-distill-reveal 7.3s ease-in-out infinite; }
    @keyframes quant-vs-distill-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="quant-vs-distill-bg" width="980" height="390"/>
  <text class="quant-vs-distill-h1"  x="30" y="40">Quantisation against distillation</text>
  <text class="quant-vs-distill-sub" x="30" y="64">Same weights, or new ones.</text>
  <rect class="quant-vs-distill-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="quant-vs-distill-name" x="46" y="122">Quantisation</text>
  <text class="quant-vs-distill-desc" x="46" y="142">Same model, fewer bits.</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r0" x="46" y="182">No training required</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r1" x="46" y="216">Minutes to apply</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r2" x="46" y="250">Architecture unchanged</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r3" x="46" y="284">Four to eight times smaller</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r4" x="46" y="318">Reversible if it fails</text>
  <rect class="quant-vs-distill-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="quant-vs-distill-name" x="526" y="122">Distillation</text>
  <text class="quant-vs-distill-desc" x="526" y="142">A different model.</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r0" x="526" y="182">A full training run</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r1" x="526" y="216">Hours to days</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r2" x="526" y="250">A smaller architecture entirely</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r3" x="526" y="284">Ten times smaller or more</text>
  <text class="quant-vs-distill-desc quant-vs-distill-row quant-vs-distill-r4" x="526" y="318">And the teacher is still needed</text>
  <text class="quant-vs-distill-sub" x="30" y="372">They are usually combined rather than chosen between: distil to a smaller architecture first, then quantise the result, which multiplies the two savings.</text>
</svg>
