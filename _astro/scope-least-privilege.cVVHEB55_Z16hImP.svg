<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The one moment you get to say no.">
  <title>Reading a consent screen</title>
  <style>
    .scope-least-privilege-bg   { fill: #f8fafc; }
    .scope-least-privilege-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-least-privilege-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-least-privilege-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-least-privilege-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-least-privilege-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-least-privilege-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-least-privilege-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scope-least-privilege-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scope-least-privilege-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scope-least-privilege-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scope-least-privilege-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scope-least-privilege-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scope-least-privilege-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scope-least-privilege-stage { opacity: 1; }

    .scope-least-privilege-s0 { animation-delay: 0.00s; }
    .scope-least-privilege-e0 { animation-delay: 0.00s; }
    .scope-least-privilege-s1 { animation-delay: 1.28s; }
    .scope-least-privilege-e1 { animation-delay: 1.28s; }
    .scope-least-privilege-s2 { animation-delay: 2.56s; }
    .scope-least-privilege-e2 { animation-delay: 2.56s; }
    .scope-least-privilege-s3 { animation-delay: 3.84s; }
    .scope-least-privilege-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scope-least-privilege-conn  { animation: scope-least-privilege-trace 6.4s ease-in-out infinite; }
      .scope-least-privilege-stage { animation: scope-least-privilege-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scope-least-privilege-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scope-least-privilege-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scope-least-privilege-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scope-least-privilege-stage { animation: scope-least-privilege-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scope-least-privilege-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scope-least-privilege-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scope-least-privilege-bg" width="980" height="322"/>
  <text class="scope-least-privilege-h1"  x="30" y="40">Reading a consent screen</text>
  <text class="scope-least-privilege-sub" x="30" y="64">The one moment you get to say no.</text>
  <g class="scope-least-privilege-stage scope-least-privilege-s0">
    <rect class="scope-least-privilege-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scope-least-privilege-step" x="44" y="142">01</text>
    <text class="scope-least-privilege-name" x="70" y="142">Read what it is asking for</text>
    <text class="scope-least-privilege-desc" x="44" y="166">The screen lists it. Almost</text>
    <text class="scope-least-privilege-desc" x="44" y="182">nobody reads it.</text>
  </g>
  <line class="scope-least-privilege-line scope-least-privilege-conn scope-least-privilege-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scope-least-privilege-tip)"/>
  <g class="scope-least-privilege-stage scope-least-privilege-s1">
    <rect class="scope-least-privilege-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scope-least-privilege-step" x="280" y="142">02</text>
    <text class="scope-least-privilege-name" x="306" y="142">Compare with what it does</text>
    <text class="scope-least-privilege-desc" x="280" y="166">A photo printer needs to read</text>
    <text class="scope-least-privilege-desc" x="280" y="182">photos. It does not need to</text>
    <text class="scope-least-privilege-desc" x="280" y="198">delete them.</text>
    <text class="scope-least-privilege-edge" x="280" y="242">read vs write</text>
  </g>
  <line class="scope-least-privilege-line scope-least-privilege-conn scope-least-privilege-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scope-least-privilege-tip)"/>
  <g class="scope-least-privilege-stage scope-least-privilege-s2">
    <rect class="scope-least-privilege-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scope-least-privilege-step" x="516" y="142">03</text>
    <text class="scope-least-privilege-name" x="542" y="142">Refuse an over-broad request</text>
    <text class="scope-least-privilege-desc" x="516" y="166">Asking for more than the job</text>
    <text class="scope-least-privilege-desc" x="516" y="182">needs is a signal about the</text>
    <text class="scope-least-privilege-desc" x="516" y="198">application.</text>
  </g>
  <line class="scope-least-privilege-line scope-least-privilege-conn scope-least-privilege-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scope-least-privilege-tip)"/>
  <g class="scope-least-privilege-stage scope-least-privilege-s3">
    <rect class="scope-least-privilege-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scope-least-privilege-step" x="752" y="142">04</text>
    <text class="scope-least-privilege-name" x="778" y="142">And remember you can revoke</text>
    <text class="scope-least-privilege-desc" x="752" y="166">At the provider, later, without</text>
    <text class="scope-least-privilege-desc" x="752" y="182">changing your password.</text>
    <text class="scope-least-privilege-edge" x="752" y="242">revocable</text>
  </g>
  <text class="scope-least-privilege-sub" x="30" y="304">The asymmetry worth noticing: granting takes one click and revoking takes finding a settings page, so the moment of the consent screen is where the decision is cheapest to make well.</text>
</svg>
