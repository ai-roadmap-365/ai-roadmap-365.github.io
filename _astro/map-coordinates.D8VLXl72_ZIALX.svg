<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Direction and distance.">
  <title>Coordinates on a map</title>
  <style>
    .map-coordinates-bg   { fill: #f8fafc; }
    .map-coordinates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-coordinates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-coordinates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-coordinates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-coordinates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-coordinates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-coordinates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .map-coordinates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .map-coordinates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .map-coordinates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .map-coordinates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .map-coordinates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-coordinates-row { opacity: 1; }
    .map-coordinates-r0 { animation-delay: 0.00s; }
    .map-coordinates-r1 { animation-delay: 0.45s; }
    .map-coordinates-r2 { animation-delay: 0.90s; }
    .map-coordinates-r3 { animation-delay: 1.35s; }
    .map-coordinates-r4 { animation-delay: 1.80s; }
    .map-coordinates-row { animation: map-coordinates-reveal 7.3s ease-in-out infinite; }
    @keyframes map-coordinates-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="map-coordinates-bg" width="980" height="390"/>
  <text class="map-coordinates-h1"  x="30" y="40">Coordinates on a map</text>
  <text class="map-coordinates-sub" x="30" y="64">Direction and distance.</text>
  <rect class="map-coordinates-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="map-coordinates-name" x="46" y="122">By name</text>
  <text class="map-coordinates-desc" x="46" y="142">Discrete labels.</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r0" x="46" y="182">Each place has a name</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r1" x="46" y="216">No relationship between names</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r2" x="46" y="250">Cannot compute a distance</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r3" x="46" y="284">Cannot ask what is nearby</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r4" x="46" y="318">This is a categorical label</text>
  <rect class="map-coordinates-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="map-coordinates-name" x="526" y="122">By coordinates</text>
  <text class="map-coordinates-desc" x="526" y="142">Position in a space.</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r0" x="526" y="182">Each place has a position</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r1" x="526" y="216">Nearby places have nearby numbers</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r2" x="526" y="250">Distance is computable</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r3" x="526" y="284">Nearest neighbours are findable</text>
  <text class="map-coordinates-desc map-coordinates-row map-coordinates-r4" x="526" y="318">This is a vector</text>
  <text class="map-coordinates-sub" x="30" y="372">Moving from names to coordinates is exactly what an embedding does to words, and every capability in the right column follows from that move.</text>
</svg>
