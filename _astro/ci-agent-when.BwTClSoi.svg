<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Reversibility decides.">
  <title>What to dispatch, and what not to</title>
  <style>
    .ci-agent-when-bg   { fill: #f8fafc; }
    .ci-agent-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-agent-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ci-agent-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ci-agent-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ci-agent-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ci-agent-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ci-agent-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-agent-when-row { opacity: 1; }
    .ci-agent-when-r0 { animation-delay: 0.00s; }
    .ci-agent-when-r1 { animation-delay: 0.45s; }
    .ci-agent-when-r2 { animation-delay: 0.90s; }
    .ci-agent-when-r3 { animation-delay: 1.35s; }
    .ci-agent-when-r4 { animation-delay: 1.80s; }
    .ci-agent-when-row { animation: ci-agent-when-reveal 7.3s ease-in-out infinite; }
    @keyframes ci-agent-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ci-agent-when-bg" width="980" height="390"/>
  <text class="ci-agent-when-h1"  x="30" y="40">What to dispatch, and what not to</text>
  <text class="ci-agent-when-sub" x="30" y="64">Reversibility decides.</text>
  <rect class="ci-agent-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ci-agent-when-name" x="46" y="122">Dispatch it</text>
  <text class="ci-agent-when-desc" x="46" y="142">Bounded and reversible.</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r0" x="46" y="182">Automated pull request review</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r1" x="46" y="216">Bug fixes on labelled, reproducible issues</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r2" x="46" y="250">Dependency version upgrades</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r3" x="46" y="284">Test failure triage</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r4" x="46" y="318">Anything a draft PR can carry</text>
  <rect class="ci-agent-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ci-agent-when-name" x="526" y="122">Do not</text>
  <text class="ci-agent-when-desc" x="526" y="142">Irreversible or architectural.</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r0" x="526" y="182">Schema migrations with data-loss potential</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r1" x="526" y="216">Anything that cannot be rolled back</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r2" x="526" y="250">Never auto-merge to main</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r3" x="526" y="284">Human sign-off, always</text>
  <text class="ci-agent-when-desc ci-agent-when-row ci-agent-when-r4" x="526" y="318">And never grant deployment secrets</text>
  <text class="ci-agent-when-sub" x="30" y="372">The draft-PR requirement is what makes the left column safe: every outcome is a proposal a person reviews, so the worst case is a wasted review rather than a production change.</text>
</svg>
