<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="XML could express more. JSON could be implemented in an afternoon.">
  <title>Why JSON displaced XML</title>
  <style>
    .json-versus-xml-bg   { fill: #f8fafc; }
    .json-versus-xml-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-xml-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-xml-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-xml-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-xml-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-xml-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .json-versus-xml-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .json-versus-xml-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .json-versus-xml-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .json-versus-xml-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .json-versus-xml-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .json-versus-xml-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .json-versus-xml-row { opacity: 1; }
    .json-versus-xml-r0 { animation-delay: 0.00s; }
    .json-versus-xml-r1 { animation-delay: 0.45s; }
    .json-versus-xml-r2 { animation-delay: 0.90s; }
    .json-versus-xml-r3 { animation-delay: 1.35s; }
    .json-versus-xml-r4 { animation-delay: 1.80s; }
    .json-versus-xml-row { animation: json-versus-xml-reveal 7.3s ease-in-out infinite; }
    @keyframes json-versus-xml-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="json-versus-xml-bg" width="980" height="390"/>
  <text class="json-versus-xml-h1"  x="30" y="40">Why JSON displaced XML</text>
  <text class="json-versus-xml-sub" x="30" y="64">XML could express more. JSON could be implemented in an afternoon.</text>
  <rect class="json-versus-xml-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="json-versus-xml-name" x="46" y="122">XML</text>
  <text class="json-versus-xml-desc" x="46" y="142">Powerful, and heavy.</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r0" x="46" y="182">Every value wrapped in an open and close tag</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r1" x="46" y="216">Attributes and elements — two ways to say one thing</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r2" x="46" y="250">Namespaces, schemas, transformations</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r3" x="46" y="284">Needed a library and usually a toolchain</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r4" x="46" y="318">Still right for documents with mixed text</text>
  <rect class="json-versus-xml-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="json-versus-xml-name" x="526" y="122">JSON</text>
  <text class="json-versus-xml-desc" x="526" y="142">Less capable, and enough.</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r0" x="526" y="182">Six types, and a grammar on one page</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r1" x="526" y="216">One way to express a key and a value</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r2" x="526" y="250">No namespaces, no built-in schema</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r3" x="526" y="284">Parseable in any language in an afternoon</text>
  <text class="json-versus-xml-desc json-versus-xml-row json-versus-xml-r4" x="526" y="318">Browsers could already read it</text>
  <text class="json-versus-xml-sub" x="30" y="372">The lesson generalises: a format that does eighty percent with a tenth of the complexity usually wins, and the missing twenty percent gets layered on later as convention.</text>
</svg>
