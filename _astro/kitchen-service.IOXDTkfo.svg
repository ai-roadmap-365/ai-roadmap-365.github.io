<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The recipe is the easy part.">
  <title>A kitchen at service</title>
  <style>
    .kitchen-service-bg   { fill: #f8fafc; }
    .kitchen-service-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-service-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-service-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-service-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-service-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-service-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-service-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kitchen-service-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kitchen-service-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kitchen-service-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kitchen-service-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kitchen-service-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-service-row { opacity: 1; }
    .kitchen-service-r0 { animation-delay: 0.00s; }
    .kitchen-service-r1 { animation-delay: 0.45s; }
    .kitchen-service-r2 { animation-delay: 0.90s; }
    .kitchen-service-r3 { animation-delay: 1.35s; }
    .kitchen-service-r4 { animation-delay: 1.80s; }
    .kitchen-service-row { animation: kitchen-service-reveal 7.3s ease-in-out infinite; }
    @keyframes kitchen-service-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kitchen-service-bg" width="980" height="390"/>
  <text class="kitchen-service-h1"  x="30" y="40">A kitchen at service</text>
  <text class="kitchen-service-sub" x="30" y="64">The recipe is the easy part.</text>
  <rect class="kitchen-service-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-service-name" x="46" y="122">One dish, unhurried</text>
  <text class="kitchen-service-desc" x="46" y="142">The recipe.</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r0" x="46" y="182">Ingredients laid out in advance</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r1" x="46" y="216">No time pressure</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r2" x="46" y="250">One attempt, checked before serving</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r3" x="46" y="284">Nothing else happening</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r4" x="46" y="318">This is a model in a notebook</text>
  <rect class="kitchen-service-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-service-name" x="526" y="122">Service</text>
  <text class="kitchen-service-desc" x="526" y="142">Everything at once.</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r0" x="526" y="182">Ingredients fetched under pressure</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r1" x="526" y="216">Strict timing per order</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r2" x="526" y="250">Hundreds of orders concurrently</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r3" x="526" y="284">Something always goes wrong</text>
  <text class="kitchen-service-desc kitchen-service-row kitchen-service-r4" x="526" y="318">This is a model in production</text>
  <text class="kitchen-service-sub" x="30" y="372">The recipe is identical in both columns, which is precisely the point: the difficulty of serving has almost nothing to do with the model.</text>
</svg>
