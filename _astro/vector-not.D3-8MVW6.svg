<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a vector is not</title>
  <style>
    .vector-not-bg   { fill: #f8fafc; }
    .vector-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vector-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vector-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vector-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vector-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vector-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vector-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vector-not-row { opacity: 1; }
    .vector-not-r0 { animation-delay: 0.00s; }
    .vector-not-r1 { animation-delay: 0.45s; }
    .vector-not-r2 { animation-delay: 0.90s; }
    .vector-not-r3 { animation-delay: 1.35s; }
    .vector-not-r4 { animation-delay: 1.80s; }
    .vector-not-row { animation: vector-not-reveal 7.3s ease-in-out infinite; }
    @keyframes vector-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vector-not-bg" width="980" height="390"/>
  <text class="vector-not-h1"  x="30" y="40">Four things a vector is not</text>
  <text class="vector-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="vector-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vector-not-name" x="46" y="122">The misconception</text>
  <text class="vector-not-desc" x="46" y="142">Commonly held.</text>
  <text class="vector-not-desc vector-not-row vector-not-r0" x="46" y="182">A vector is an arrow in physical space</text>
  <text class="vector-not-desc vector-not-row vector-not-r1" x="46" y="216">Distance always means straight-line distance</text>
  <text class="vector-not-desc vector-not-row vector-not-r2" x="46" y="250">High dimensions behave like three</text>
  <text class="vector-not-desc vector-not-row vector-not-r3" x="46" y="284">Normalising loses information</text>
  <text class="vector-not-desc vector-not-row vector-not-r4" x="46" y="318">The dot product is just an operation</text>
  <rect class="vector-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vector-not-name" x="526" y="122">What is true</text>
  <text class="vector-not-desc" x="526" y="142">Actually.</text>
  <text class="vector-not-desc vector-not-row vector-not-r0" x="526" y="182">That is one reading of many</text>
  <text class="vector-not-desc vector-not-row vector-not-r1" x="526" y="216">Several metrics exist and disagree</text>
  <text class="vector-not-desc vector-not-row vector-not-r2" x="526" y="250">They behave very differently</text>
  <text class="vector-not-desc vector-not-row vector-not-r3" x="526" y="284">It separates direction from magnitude, deliberately</text>
  <text class="vector-not-desc vector-not-row vector-not-r4" x="526" y="318">It is a projection, an angle and a similarity</text>
  <text class="vector-not-sub" x="30" y="372">The high-dimensional row is the one that causes real errors, because intuition built in three dimensions is actively misleading at three hundred.</text>
</svg>
