<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Updating on evidence.">
  <title>A detective's reasoning</title>
  <style>
    .detective-bg   { fill: #f8fafc; }
    .detective-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detective-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detective-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detective-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detective-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detective-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .detective-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .detective-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .detective-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .detective-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .detective-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .detective-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .detective-row { opacity: 1; }
    .detective-r0 { animation-delay: 0.00s; }
    .detective-r1 { animation-delay: 0.45s; }
    .detective-r2 { animation-delay: 0.90s; }
    .detective-r3 { animation-delay: 1.35s; }
    .detective-r4 { animation-delay: 1.80s; }
    .detective-row { animation: detective-reveal 7.3s ease-in-out infinite; }
    @keyframes detective-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="detective-bg" width="980" height="390"/>
  <text class="detective-h1"  x="30" y="40">A detective's reasoning</text>
  <text class="detective-sub" x="30" y="64">Updating on evidence.</text>
  <rect class="detective-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="detective-name" x="46" y="122">Updating</text>
  <text class="detective-desc" x="46" y="142">Evidence plus context.</text>
  <text class="detective-desc detective-row detective-r0" x="46" y="182">Start from who was plausibly present</text>
  <text class="detective-desc detective-row detective-r1" x="46" y="216">Weigh each new clue</text>
  <text class="detective-desc detective-row detective-r2" x="46" y="250">Revise as evidence arrives</text>
  <text class="detective-desc detective-row detective-r3" x="46" y="284">Rare explanations need strong evidence</text>
  <text class="detective-desc detective-row detective-r4" x="46" y="318">This is Bayesian reasoning</text>
  <rect class="detective-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="detective-name" x="526" y="122">Evidence alone</text>
  <text class="detective-desc" x="526" y="142">No context.</text>
  <text class="detective-desc detective-row detective-r0" x="526" y="182">Ignore who was plausibly present</text>
  <text class="detective-desc detective-row detective-r1" x="526" y="216">Judge the clue in isolation</text>
  <text class="detective-desc detective-row detective-r2" x="526" y="250">Jump to the striking explanation</text>
  <text class="detective-desc detective-row detective-r3" x="526" y="284">Rare explanations accepted too easily</text>
  <text class="detective-desc detective-row detective-r4" x="526" y="318">This is base rate neglect</text>
  <text class="detective-sub" x="30" y="372">Rare explanations needing strong evidence is the whole content of the theorem, expressed as a rule of thumb that transfers well beyond statistics.</text>
</svg>
