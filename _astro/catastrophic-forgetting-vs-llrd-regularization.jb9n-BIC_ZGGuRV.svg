<svg role="img" aria-label="Catastrophic forgetting versus layer-wise learning rate decay diagram comparing weight disruption" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Catastrophic Forgetting vs. LLRD Regularization</title>
  <defs>
    <linearGradient id="bg231b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card231b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg231b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CATASTROPHIC FORGETTING VS. LLRD REGULARIZATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Preventing Pretrained Knowledge Erasure During Downstream Domain Fine-Tuning</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card231b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Uniform High Learning Rate (Catastrophic Forgetting) -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="195" y="48" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Uniform High LR (Naive Fine-Tuning)</text>
    
    <rect x="35" y="65" width="320" height="190" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="195" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Uniform LR across all layers (e.g. 1e-4)</text>
    <text x="195" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• Early random classification head gradients</text>
    <text x="195" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">  violently backpropagate through backbone</text>
    <text x="195" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Destroys general linguistic knowledge</text>
    <text x="195" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Overfits rapidly on small domain datasets</text>
    <text x="195" y="235" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Catastrophic Forgetting &amp; Instability</text>

    <!-- Right: Layer-wise Learning Rate Decay (LLRD) -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="565" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Layer-wise LR Decay (LLRD)</text>
    
    <rect x="405" y="65" width="320" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="565" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Geometric Decay: eta_l = eta_top * xi^{(L - l)}</text>
    <text x="565" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• Head gets full LR; early layers get tiny LR</text>
    <text x="565" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Preserves core foundational token features</text>
    <text x="565" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Adapts high-level semantics to custom domain</text>
    <text x="565" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Outperforms uniform tuning by +2.0 to +4.5% F1</text>
    <text x="565" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Robust Transfer Learning Stability</text>
  </g>
</svg>
