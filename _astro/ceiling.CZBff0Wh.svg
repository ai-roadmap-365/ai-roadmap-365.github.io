<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The irreducible ceiling</title>
  <style>
    .ceiling-bg   { fill: #f8fafc; }
    .ceiling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ceiling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ceiling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ceiling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ceiling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ceiling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ceiling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ceiling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ceiling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ceiling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ceiling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ceiling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ceiling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ceiling-stage { opacity: 1; }

    .ceiling-s0 { animation-delay: 0.00s; }
    .ceiling-e0 { animation-delay: 0.00s; }
    .ceiling-s1 { animation-delay: 1.28s; }
    .ceiling-e1 { animation-delay: 1.28s; }
    .ceiling-s2 { animation-delay: 2.56s; }
    .ceiling-e2 { animation-delay: 2.56s; }
    .ceiling-s3 { animation-delay: 3.84s; }
    .ceiling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ceiling-conn  { animation: ceiling-trace 6.4s ease-in-out infinite; }
      .ceiling-stage { animation: ceiling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ceiling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ceiling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ceiling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ceiling-stage { animation: ceiling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ceiling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ceiling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ceiling-bg" width="980" height="322"/>
  <text class="ceiling-h1"  x="30" y="40">The irreducible ceiling</text>
  <text class="ceiling-sub" x="30" y="64">Four steps.</text>
  <g class="ceiling-stage ceiling-s0">
    <rect class="ceiling-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ceiling-step" x="44" y="142">01</text>
    <text class="ceiling-name" x="70" y="142">Outcomes are partly random</text>
    <text class="ceiling-desc" x="44" y="166">Two identical inputs can have</text>
    <text class="ceiling-desc" x="44" y="182">different outcomes.</text>
  </g>
  <line class="ceiling-line ceiling-conn ceiling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ceiling-tip)"/>
  <g class="ceiling-stage ceiling-s1">
    <rect class="ceiling-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ceiling-step" x="280" y="142">02</text>
    <text class="ceiling-name" x="306" y="142">And some determining information was never recorded</text>
    <text class="ceiling-desc" x="280" y="166">It is not in the features, at</text>
    <text class="ceiling-desc" x="280" y="182">any quality.</text>
  </g>
  <line class="ceiling-line ceiling-conn ceiling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ceiling-tip)"/>
  <g class="ceiling-stage ceiling-s2">
    <rect class="ceiling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ceiling-step" x="516" y="142">03</text>
    <text class="ceiling-name" x="542" y="142">So there is a floor no model can go below</text>
    <text class="ceiling-desc" x="516" y="166">Which is a property of the data,</text>
    <text class="ceiling-desc" x="516" y="182">not the method.</text>
  </g>
  <line class="ceiling-line ceiling-conn ceiling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ceiling-tip)"/>
  <g class="ceiling-stage ceiling-s3">
    <rect class="ceiling-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ceiling-step" x="752" y="142">04</text>
    <text class="ceiling-name" x="778" y="142">Approaching it means the work is finished</text>
    <text class="ceiling-desc" x="752" y="166">Further effort buys nothing.</text>
  </g>
  <text class="ceiling-sub" x="30" y="304">Estimating this floor is what tells a team to stop, and its absence is why projects grind on optimising against noise long past any return.</text>
</svg>
