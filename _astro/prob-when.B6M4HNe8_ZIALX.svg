<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it misleads.">
  <title>When probability helps</title>
  <style>
    .prob-when-bg   { fill: #f8fafc; }
    .prob-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prob-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prob-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prob-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prob-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prob-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prob-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prob-when-row { opacity: 1; }
    .prob-when-r0 { animation-delay: 0.00s; }
    .prob-when-r1 { animation-delay: 0.45s; }
    .prob-when-r2 { animation-delay: 0.90s; }
    .prob-when-r3 { animation-delay: 1.35s; }
    .prob-when-r4 { animation-delay: 1.80s; }
    .prob-when-row { animation: prob-when-reveal 7.3s ease-in-out infinite; }
    @keyframes prob-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prob-when-bg" width="980" height="390"/>
  <text class="prob-when-h1"  x="30" y="40">When probability helps</text>
  <text class="prob-when-sub" x="30" y="64">And when it misleads.</text>
  <rect class="prob-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prob-when-name" x="46" y="122">It helps</text>
  <text class="prob-when-desc" x="46" y="142">Four cases.</text>
  <text class="prob-when-desc prob-when-row prob-when-r0" x="46" y="182">Repeatable processes</text>
  <text class="prob-when-desc prob-when-row prob-when-r1" x="46" y="216">Decisions under quantifiable risk</text>
  <text class="prob-when-desc prob-when-row prob-when-r2" x="46" y="250">Combining evidence</text>
  <text class="prob-when-desc prob-when-row prob-when-r3" x="46" y="284">Assessing test accuracy</text>
  <text class="prob-when-desc prob-when-row prob-when-r4" x="46" y="318">Any model producing a confidence</text>
  <rect class="prob-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prob-when-name" x="526" y="122">It misleads</text>
  <text class="prob-when-desc" x="526" y="142">Also four.</text>
  <text class="prob-when-desc prob-when-row prob-when-r0" x="526" y="182">Genuinely unprecedented events</text>
  <text class="prob-when-desc prob-when-row prob-when-r1" x="526" y="216">Where the outcome space is unknown</text>
  <text class="prob-when-desc prob-when-row prob-when-r2" x="526" y="250">Where the model is badly wrong</text>
  <text class="prob-when-desc prob-when-row prob-when-r3" x="526" y="284">When precision implies certainty</text>
  <text class="prob-when-desc prob-when-row prob-when-r4" x="526" y="318">Where the base rate is ignored</text>
  <text class="prob-when-sub" x="30" y="372">An unknown outcome space is the most serious of these, because a probability distribution cannot express the possibility it never enumerated.</text>
</svg>
