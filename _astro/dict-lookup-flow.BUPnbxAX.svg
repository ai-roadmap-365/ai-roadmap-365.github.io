<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" font-family="system-ui, sans-serif">
  <title>Choosing a dictionary access pattern: whether the key might be missing decides between square-bracket lookup, get with a default, and setdefault, and whether you are reading or writing</title>
  <rect x="0" y="0" width="780" height="560" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Which access pattern? (decide before you type d[key])</text>

  <!-- Start -->
  <rect x="300" y="58" width="180" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="390" y="81" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">You have a key</text>
  <text x="390" y="99" text-anchor="middle" font-size="14" fill="#1a202c">and a dictionary</text>

  <line x1="390" y1="110" x2="390" y2="138" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,138 384,126 396,126" fill="#1a202c"/>

  <!-- Decision 1: read or write -->
  <polygon points="390,148 500,200 390,252 280,200" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="390" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Reading or</text>
  <text x="390" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">writing?</text>

  <!-- Reading branch left -->
  <text x="230" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">reading</text>
  <line x1="280" y1="200" x2="180" y2="200" stroke="#1a202c" stroke-width="2"/>
  <polygon points="180,200 192,194 192,206" fill="#1a202c"/>

  <!-- Decision 2: might be missing -->
  <polygon points="100,150 190,200 100,250 10,200" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="100" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Might it be</text>
  <text x="100" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">missing?</text>

  <text x="100" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">maybe</text>
  <line x1="100" y1="250" x2="100" y2="290" stroke="#1a202c" stroke-width="2"/>
  <polygon points="100,290 94,278 106,278" fill="#1a202c"/>
  <rect x="20" y="292" width="160" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="100" y="317" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">d.get(key, default)</text>
  <text x="100" y="337" text-anchor="middle" font-size="14" fill="#1a202c">returns default,</text>
  <text x="100" y="353" text-anchor="middle" font-size="14" fill="#1a202c">no KeyError</text>

  <text x="235" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">must exist</text>
  <line x1="140" y1="165" x2="205" y2="140" stroke="#1a202c" stroke-width="2"/>
  <polygon points="205,140 191,140 198,151" fill="#1a202c"/>
  <rect x="210" y="108" width="150" height="26" fill="#f8fafc"/>
  <rect x="150" y="292" width="0" height="0"/>
  <rect x="205" y="292" width="160" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="285" y="317" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">d[key]</text>
  <text x="285" y="337" text-anchor="middle" font-size="14" fill="#1a202c">fast; raises</text>
  <text x="285" y="353" text-anchor="middle" font-size="14" fill="#1a202c">KeyError if absent</text>
  <line x1="100" y1="250" x2="100" y2="250" stroke="#1a202c" stroke-width="2"/>
  <line x1="150" y1="200" x2="205" y2="320" stroke="#1a202c" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Writing branch right -->
  <text x="560" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">writing</text>
  <line x1="500" y1="200" x2="600" y2="200" stroke="#1a202c" stroke-width="2"/>
  <polygon points="600,200 588,194 588,206" fill="#1a202c"/>

  <!-- Decision 3: build-or-append vs set -->
  <polygon points="690,150 780,200 690,250 600,200" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="690" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Group into a</text>
  <text x="690" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">missing key?</text>

  <text x="690" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="690" y1="250" x2="690" y2="290" stroke="#1a202c" stroke-width="2"/>
  <polygon points="690,290 684,278 696,278" fill="#1a202c"/>
  <rect x="600" y="292" width="170" height="86" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="685" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">d.setdefault(k, [])</text>
  <text x="685" y="336" text-anchor="middle" font-size="14" fill="#1a202c">makes the empty list</text>
  <text x="685" y="352" text-anchor="middle" font-size="14" fill="#1a202c">once, then .append();</text>
  <text x="685" y="368" text-anchor="middle" font-size="14" fill="#1a202c">or d.get(k, 0) + 1</text>

  <text x="530" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">just set</text>
  <line x1="620" y1="165" x2="560" y2="140" stroke="#1a202c" stroke-width="2"/>
  <polygon points="560,140 574,140 567,151" fill="#1a202c"/>
  <rect x="470" y="292" width="150" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="545" y="317" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">d[key] = value</text>
  <text x="545" y="337" text-anchor="middle" font-size="14" fill="#1a202c">add or overwrite;</text>
  <text x="545" y="353" text-anchor="middle" font-size="14" fill="#1a202c">or d.update() adds many</text>

  <!-- Footer note -->
  <rect x="60" y="420" width="660" height="100" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="390" y="446" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Rules of thumb</text>
  <text x="390" y="470" text-anchor="middle" font-size="14" fill="#1a202c">Use d[key] only when the key must be there; a missing key is a real bug you want to hear about.</text>
  <text x="390" y="490" text-anchor="middle" font-size="14" fill="#1a202c">Use d.get(key, default) to read safely with a fallback. Use "key in d" to just ask yes or no.</text>
  <text x="390" y="510" text-anchor="middle" font-size="14" fill="#1a202c">Use setdefault (or Counter / defaultdict) when counting or grouping into per-key collections.</text>
</svg>
