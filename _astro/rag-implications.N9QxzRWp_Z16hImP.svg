<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are governance.">
  <title>Four consequences of retrieval architecture</title>
  <style>
    .rag-implications-bg   { fill: #f8fafc; }
    .rag-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rag-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rag-implications-stage { opacity: 1; }

    .rag-implications-s0 { animation-delay: 0.00s; }
    .rag-implications-e0 { animation-delay: 0.00s; }
    .rag-implications-s1 { animation-delay: 1.28s; }
    .rag-implications-e1 { animation-delay: 1.28s; }
    .rag-implications-s2 { animation-delay: 2.56s; }
    .rag-implications-e2 { animation-delay: 2.56s; }
    .rag-implications-s3 { animation-delay: 3.84s; }
    .rag-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rag-implications-conn  { animation: rag-implications-trace 6.4s ease-in-out infinite; }
      .rag-implications-stage { animation: rag-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rag-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rag-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rag-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rag-implications-stage { animation: rag-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rag-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rag-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rag-implications-bg" width="980" height="322"/>
  <text class="rag-implications-h1"  x="30" y="40">Four consequences of retrieval architecture</text>
  <text class="rag-implications-sub" x="30" y="64">Two are governance.</text>
  <g class="rag-implications-stage rag-implications-s0">
    <rect class="rag-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rag-implications-step" x="44" y="142">01</text>
    <text class="rag-implications-name" x="70" y="142">Hallucination falls substantially</text>
    <text class="rag-implications-desc" x="44" y="166">Though it does not reach zero.</text>
  </g>
  <line class="rag-implications-line rag-implications-conn rag-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rag-implications-tip)"/>
  <g class="rag-implications-stage rag-implications-s1">
    <rect class="rag-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rag-implications-step" x="280" y="142">02</text>
    <text class="rag-implications-name" x="306" y="142">But every request carries retrieved passages</text>
    <text class="rag-implications-desc" x="280" y="166">Which is a large and recurring</text>
    <text class="rag-implications-desc" x="280" y="182">token cost.</text>
  </g>
  <line class="rag-implications-line rag-implications-conn rag-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rag-implications-tip)"/>
  <g class="rag-implications-stage rag-implications-s2">
    <rect class="rag-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rag-implications-step" x="516" y="142">03</text>
    <text class="rag-implications-name" x="542" y="142">And retrieval must respect permissions</text>
    <text class="rag-implications-desc" x="516" y="166">Or it becomes a very efficient</text>
    <text class="rag-implications-desc" x="516" y="182">data leak.</text>
  </g>
  <line class="rag-implications-line rag-implications-conn rag-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rag-implications-tip)"/>
  <g class="rag-implications-stage rag-implications-s3">
    <rect class="rag-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rag-implications-step" x="752" y="142">04</text>
    <text class="rag-implications-name" x="778" y="142">While stale documents produce confident stale answers</text>
    <text class="rag-implications-desc" x="752" y="166">So freshness is a pipeline</text>
    <text class="rag-implications-desc" x="752" y="182">requirement.</text>
  </g>
  <text class="rag-implications-sub" x="30" y="304">Permission-aware retrieval is the governance requirement that gets discovered late and expensively: an index built without tenant filters answers questions it should refuse.</text>
</svg>
