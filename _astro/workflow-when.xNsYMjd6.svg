<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it is ceremony.">
  <title>Where the full harness pays</title>
  <style>
    .workflow-when-bg   { fill: #f8fafc; }
    .workflow-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workflow-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workflow-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workflow-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workflow-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workflow-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-when-row { opacity: 1; }
    .workflow-when-r0 { animation-delay: 0.00s; }
    .workflow-when-r1 { animation-delay: 0.45s; }
    .workflow-when-r2 { animation-delay: 0.90s; }
    .workflow-when-r3 { animation-delay: 1.35s; }
    .workflow-when-r4 { animation-delay: 1.80s; }
    .workflow-when-row { animation: workflow-when-reveal 7.3s ease-in-out infinite; }
    @keyframes workflow-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="workflow-when-bg" width="980" height="390"/>
  <text class="workflow-when-h1"  x="30" y="40">Where the full harness pays</text>
  <text class="workflow-when-sub" x="30" y="64">And where it is ceremony.</text>
  <rect class="workflow-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="workflow-when-name" x="46" y="122">Use the harness</text>
  <text class="workflow-when-desc" x="46" y="142">Logic with a verifiable result.</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r0" x="46" y="182">Complex business logic</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r1" x="46" y="216">Backend APIs and data parsers</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r2" x="46" y="250">Algorithmic computation</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r3" x="46" y="284">Database migration pipelines</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r4" x="46" y="318">Legacy refactoring with existing tests</text>
  <rect class="workflow-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="workflow-when-name" x="526" y="122">Do not</text>
  <text class="workflow-when-desc" x="526" y="142">Nothing to assert.</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r0" x="526" y="182">CSS adjustments</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r1" x="526" y="216">Documentation</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r2" x="526" y="250">Anything judged by eye</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r3" x="526" y="284">A test would not capture the goal</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r4" x="526" y="318">And the loop has nothing to converge on</text>
  <text class="workflow-when-sub" x="30" y="372">"A test would not capture the goal" is the deciding question: the harness works by having something to converge on, so a task whose success is a matter of taste gets nothing from it.</text>
</svg>
