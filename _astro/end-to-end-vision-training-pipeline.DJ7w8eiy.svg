<svg role="img" aria-label="End-to-end computer vision training pipeline architecture showing data loading mixed precision forward pass gradient scaling and multi-metric validation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>End-to-End Vision Training Pipeline Architecture</title>
  <defs>
    <linearGradient id="bg215a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card215" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg215a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">END-TO-END COMPUTER VISION TRAINING HARNESS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Raw Image Ingestion to Mixed Precision Optimization and Multi-Metric Auditing</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card215)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Stage 1: Data Ingestion & Augmentation -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Data Ingestion &amp; Prep</text>
    <rect x="40" y="65" width="190" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Torchvision Pipeline</text>
    <text x="135" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• ImageFolder Dataset on Disk</text>
    <text x="135" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Stochastic v2 Transforms</text>
    <text x="135" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Multi-worker DataLoader</text>
    <text x="135" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Pin Memory for Fast DMA</text>
    <text x="135" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Batch Size: 64 / 128</text>
    <text x="135" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Output: (B, 3, 224, 224)</text>

    <!-- Stage 2: Mixed Precision GPU Engine -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Mixed Precision Engine</text>
    <rect x="285" y="65" width="190" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">AMP &amp; Backpropagation</text>
    <text x="380" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• torch.cuda.amp.autocast(fp16)</text>
    <text x="380" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• ResNet-50 / ConvNeXt Model</text>
    <text x="380" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• CrossEntropyLoss with Smoothing</text>
    <text x="380" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• GradScaler Backward &amp; Unscale</text>
    <text x="380" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Norm Clip &amp; AdamW Step</text>
    <text x="380" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">2x Speedup &amp; 50% VRAM Saved</text>

    <!-- Stage 3: Validation & Metric Auditing -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="625" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Metric Auditing</text>
    <rect x="530" y="65" width="190" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="625" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Evaluation &amp; Checkpoints</text>
    <text x="625" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• model.eval() &amp; torch.no_grad()</text>
    <text x="625" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Top-1 &amp; Top-5 Accuracy</text>
    <text x="625" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Macro F1 &amp; Per-Class Recall</text>
    <text x="625" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Normalized Confusion Matrix</text>
    <text x="625" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• EarlyStopping Best Save</text>
    <text x="625" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Atomic Production Artifacts</text>
  </g>
</svg>
