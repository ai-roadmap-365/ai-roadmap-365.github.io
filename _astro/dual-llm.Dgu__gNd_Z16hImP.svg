<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One model reads; the other acts.">
  <title>Dual-LLM quarantine</title>
  <style>
    .dual-llm-bg   { fill: #f8fafc; }
    .dual-llm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-llm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-llm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-llm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-llm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-llm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dual-llm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dual-llm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dual-llm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dual-llm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dual-llm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dual-llm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dual-llm-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dual-llm-stage { opacity: 1; }

    .dual-llm-s0 { animation-delay: 0.00s; }
    .dual-llm-e0 { animation-delay: 0.00s; }
    .dual-llm-s1 { animation-delay: 1.28s; }
    .dual-llm-e1 { animation-delay: 1.28s; }
    .dual-llm-s2 { animation-delay: 2.56s; }
    .dual-llm-e2 { animation-delay: 2.56s; }
    .dual-llm-s3 { animation-delay: 3.84s; }
    .dual-llm-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dual-llm-conn  { animation: dual-llm-trace 6.4s ease-in-out infinite; }
      .dual-llm-stage { animation: dual-llm-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dual-llm-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dual-llm-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dual-llm-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dual-llm-stage { animation: dual-llm-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dual-llm-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dual-llm-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dual-llm-bg" width="980" height="322"/>
  <text class="dual-llm-h1"  x="30" y="40">Dual-LLM quarantine</text>
  <text class="dual-llm-sub" x="30" y="64">One model reads; the other acts.</text>
  <g class="dual-llm-stage dual-llm-s0">
    <rect class="dual-llm-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dual-llm-step" x="44" y="142">01</text>
    <text class="dual-llm-name" x="70" y="142">The untrusted document goes to worker 1</text>
    <text class="dual-llm-desc" x="44" y="166">A sandboxed instance, alone with</text>
    <text class="dual-llm-desc" x="44" y="182">the text.</text>
  </g>
  <line class="dual-llm-line dual-llm-conn dual-llm-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dual-llm-tip)"/>
  <g class="dual-llm-stage dual-llm-s1">
    <rect class="dual-llm-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dual-llm-step" x="280" y="142">02</text>
    <text class="dual-llm-name" x="306" y="142">Worker 1 has no capability at all</text>
    <text class="dual-llm-desc" x="280" y="166">No tools, no network.</text>
    <text class="dual-llm-desc" x="280" y="182">Instructions in the text have</text>
    <text class="dual-llm-desc" x="280" y="198">nothing to reach.</text>
    <text class="dual-llm-edge" x="280" y="242">zero tools</text>
  </g>
  <line class="dual-llm-line dual-llm-conn dual-llm-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dual-llm-tip)"/>
  <g class="dual-llm-stage dual-llm-s2">
    <rect class="dual-llm-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dual-llm-step" x="516" y="142">03</text>
    <text class="dual-llm-name" x="542" y="142">It emits typed JSON</text>
    <text class="dual-llm-desc" x="516" y="166">Extracted fields, validated</text>
    <text class="dual-llm-desc" x="516" y="182">against a schema. Not prose.</text>
  </g>
  <line class="dual-llm-line dual-llm-conn dual-llm-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dual-llm-tip)"/>
  <g class="dual-llm-stage dual-llm-s3">
    <rect class="dual-llm-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dual-llm-step" x="752" y="142">04</text>
    <text class="dual-llm-name" x="778" y="142">Controller 2 acts on the payload</text>
    <text class="dual-llm-desc" x="752" y="166">It never sees the original text,</text>
    <text class="dual-llm-desc" x="752" y="182">so it cannot be instructed by</text>
    <text class="dual-llm-desc" x="752" y="198">it.</text>
    <text class="dual-llm-edge" x="752" y="242">immune</text>
  </g>
  <text class="dual-llm-sub" x="30" y="304">The reason this works is that the typed payload is a much narrower channel than prose: an instruction cannot survive being reduced to three named fields with declared types.</text>
</svg>
