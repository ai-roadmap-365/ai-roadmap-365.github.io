<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And what that permits.">
  <title>Why generation is bandwidth bound</title>
  <style>
    .speculative-bg   { fill: #f8fafc; }
    .speculative-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speculative-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .speculative-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .speculative-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .speculative-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .speculative-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .speculative-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .speculative-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .speculative-stage { opacity: 1; }

    .speculative-s0 { animation-delay: 0.00s; }
    .speculative-e0 { animation-delay: 0.00s; }
    .speculative-s1 { animation-delay: 1.28s; }
    .speculative-e1 { animation-delay: 1.28s; }
    .speculative-s2 { animation-delay: 2.56s; }
    .speculative-e2 { animation-delay: 2.56s; }
    .speculative-s3 { animation-delay: 3.84s; }
    .speculative-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .speculative-conn  { animation: speculative-trace 6.4s ease-in-out infinite; }
      .speculative-stage { animation: speculative-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes speculative-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes speculative-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .speculative-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .speculative-stage { animation: speculative-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes speculative-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="speculative-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="speculative-bg" width="980" height="322"/>
  <text class="speculative-h1"  x="30" y="40">Why generation is bandwidth bound</text>
  <text class="speculative-sub" x="30" y="64">And what that permits.</text>
  <g class="speculative-stage speculative-s0">
    <rect class="speculative-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="speculative-step" x="44" y="142">01</text>
    <text class="speculative-name" x="70" y="142">Each token reads every parameter</text>
    <text class="speculative-desc" x="44" y="166">From memory, to compute one</text>
    <text class="speculative-desc" x="44" y="182">step.</text>
  </g>
  <line class="speculative-line speculative-conn speculative-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#speculative-tip)"/>
  <g class="speculative-stage speculative-s1">
    <rect class="speculative-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="speculative-step" x="280" y="142">02</text>
    <text class="speculative-name" x="306" y="142">And does very little arithmetic with them</text>
    <text class="speculative-desc" x="280" y="166">One token's worth. Arithmetic</text>
    <text class="speculative-desc" x="280" y="182">intensity is very low.</text>
  </g>
  <line class="speculative-line speculative-conn speculative-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#speculative-tip)"/>
  <g class="speculative-stage speculative-s2">
    <rect class="speculative-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="speculative-step" x="516" y="142">03</text>
    <text class="speculative-name" x="542" y="142">So the accelerator waits on memory</text>
    <text class="speculative-desc" x="516" y="166">Compute units mostly idle.</text>
  </g>
  <line class="speculative-line speculative-conn speculative-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#speculative-tip)"/>
  <g class="speculative-stage speculative-s3">
    <rect class="speculative-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="speculative-step" x="752" y="142">04</text>
    <text class="speculative-name" x="778" y="142">Which speculative decoding exploits</text>
    <text class="speculative-desc" x="752" y="166">Verify several drafted tokens in</text>
    <text class="speculative-desc" x="752" y="182">one pass, using the idle</text>
    <text class="speculative-desc" x="752" y="198">compute.</text>
  </g>
  <text class="speculative-sub" x="30" y="304">This explains why batching helps generation so much: several requests reading the same parameters amortise the memory traffic, which is the dominant cost.</text>
</svg>
