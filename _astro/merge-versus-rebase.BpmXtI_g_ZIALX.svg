<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both give the same files. They leave very different histories.">
  <title>Two ways to combine work, and one rule about when</title>
  <style>
    .merge-versus-rebase-bg   { fill: #f8fafc; }
    .merge-versus-rebase-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-versus-rebase-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-versus-rebase-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-versus-rebase-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-versus-rebase-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-versus-rebase-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-versus-rebase-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .merge-versus-rebase-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .merge-versus-rebase-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .merge-versus-rebase-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .merge-versus-rebase-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .merge-versus-rebase-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-versus-rebase-row { opacity: 1; }
    .merge-versus-rebase-r0 { animation-delay: 0.00s; }
    .merge-versus-rebase-r1 { animation-delay: 0.45s; }
    .merge-versus-rebase-r2 { animation-delay: 0.90s; }
    .merge-versus-rebase-r3 { animation-delay: 1.35s; }
    .merge-versus-rebase-r4 { animation-delay: 1.80s; }
    .merge-versus-rebase-row { animation: merge-versus-rebase-reveal 7.3s ease-in-out infinite; }
    @keyframes merge-versus-rebase-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="merge-versus-rebase-bg" width="980" height="390"/>
  <text class="merge-versus-rebase-h1"  x="30" y="40">Two ways to combine work, and one rule about when</text>
  <text class="merge-versus-rebase-sub" x="30" y="64">Both give the same files. They leave very different histories.</text>
  <rect class="merge-versus-rebase-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="merge-versus-rebase-name" x="46" y="122">Merge</text>
  <text class="merge-versus-rebase-desc" x="46" y="142">Adds a commit joining two lines</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r0" x="46" y="182">History shows what actually happened</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r1" x="46" y="216">Nothing already pushed is rewritten</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r2" x="46" y="250">Safe on any branch, always</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r3" x="46" y="284">Produces a branching, less linear log</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r4" x="46" y="318">The right default on a shared branch</text>
  <rect class="merge-versus-rebase-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="merge-versus-rebase-name" x="526" y="122">Rebase</text>
  <text class="merge-versus-rebase-desc" x="526" y="142">Replays your commits as new ones</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r0" x="526" y="182">History reads as a straight line</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r1" x="526" y="216">Every replayed commit gets a NEW hash</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r2" x="526" y="250">Fine on your own unpushed work</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r3" x="526" y="284">Never on a branch someone else has pulled</text>
  <text class="merge-versus-rebase-desc merge-versus-rebase-row merge-versus-rebase-r4" x="526" y="318">Their history and yours silently diverge</text>
  <text class="merge-versus-rebase-sub" x="30" y="372">The rule is one sentence: do not rewrite history that others have already pulled.</text>
</svg>
