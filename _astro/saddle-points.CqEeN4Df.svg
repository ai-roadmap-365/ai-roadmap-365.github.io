<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The hazard changes with dimension.">
  <title>Saddle points, not local minima</title>
  <style>
    .saddle-points-bg   { fill: #f8fafc; }
    .saddle-points-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .saddle-points-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .saddle-points-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .saddle-points-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .saddle-points-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .saddle-points-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .saddle-points-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .saddle-points-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .saddle-points-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .saddle-points-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .saddle-points-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .saddle-points-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .saddle-points-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .saddle-points-stage { opacity: 1; }

    .saddle-points-s0 { animation-delay: 0.00s; }
    .saddle-points-e0 { animation-delay: 0.00s; }
    .saddle-points-s1 { animation-delay: 1.28s; }
    .saddle-points-e1 { animation-delay: 1.28s; }
    .saddle-points-s2 { animation-delay: 2.56s; }
    .saddle-points-e2 { animation-delay: 2.56s; }
    .saddle-points-s3 { animation-delay: 3.84s; }
    .saddle-points-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .saddle-points-conn  { animation: saddle-points-trace 6.4s ease-in-out infinite; }
      .saddle-points-stage { animation: saddle-points-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes saddle-points-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes saddle-points-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .saddle-points-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .saddle-points-stage { animation: saddle-points-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes saddle-points-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="saddle-points-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="saddle-points-bg" width="980" height="322"/>
  <text class="saddle-points-h1"  x="30" y="40">Saddle points, not local minima</text>
  <text class="saddle-points-sub" x="30" y="64">The hazard changes with dimension.</text>
  <g class="saddle-points-stage saddle-points-s0">
    <rect class="saddle-points-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="saddle-points-step" x="44" y="142">01</text>
    <text class="saddle-points-name" x="70" y="142">Gradient zero is not always a minimum</text>
    <text class="saddle-points-desc" x="44" y="166">It can curve up in some</text>
    <text class="saddle-points-desc" x="44" y="182">directions and down in others.</text>
  </g>
  <line class="saddle-points-line saddle-points-conn saddle-points-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#saddle-points-tip)"/>
  <g class="saddle-points-stage saddle-points-s1">
    <rect class="saddle-points-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="saddle-points-step" x="280" y="142">02</text>
    <text class="saddle-points-name" x="306" y="142">A local minimum needs every direction to curve up</text>
    <text class="saddle-points-desc" x="280" y="166">In a hundred thousand</text>
    <text class="saddle-points-desc" x="280" y="182">dimensions, that is vanishingly</text>
    <text class="saddle-points-desc" x="280" y="198">unlikely.</text>
    <text class="saddle-points-edge" x="280" y="242">rare</text>
  </g>
  <line class="saddle-points-line saddle-points-conn saddle-points-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#saddle-points-tip)"/>
  <g class="saddle-points-stage saddle-points-s2">
    <rect class="saddle-points-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="saddle-points-step" x="516" y="142">03</text>
    <text class="saddle-points-name" x="542" y="142">So most zero-gradient points are saddles</text>
    <text class="saddle-points-desc" x="516" y="166">Flat plateaus where plain</text>
    <text class="saddle-points-desc" x="516" y="182">descent stalls indefinitely.</text>
  </g>
  <line class="saddle-points-line saddle-points-conn saddle-points-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#saddle-points-tip)"/>
  <g class="saddle-points-stage saddle-points-s3">
    <rect class="saddle-points-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="saddle-points-step" x="752" y="142">04</text>
    <text class="saddle-points-name" x="778" y="142">Momentum carries through them</text>
    <text class="saddle-points-desc" x="752" y="166">Inertia crosses a flat region</text>
    <text class="saddle-points-desc" x="752" y="182">that a zero gradient cannot.</text>
  </g>
  <text class="saddle-points-sub" x="30" y="304">This reframing changed how the field thinks about optimisation: the old worry was getting stuck in a bad local minimum, and the real problem turned out to be plateaus that stall progress without trapping it.</text>
</svg>
