<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" height="100%" role="img" aria-label="Where the Estimation Error Actually Was showing a project median that looks acceptable while one area is well estimated and another is three times over">
  <title>Where the Estimation Error Actually Was</title>
  <defs>
    <style>
      .d364a-bg { fill: #f8fafc; }
      .d364a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d364a-good { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d364a-bad { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d364a-mid { fill: #fef9c3; stroke: #eab308; stroke-width: 2px; }
      .d364a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d364a-h { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .d364a-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d364a-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d364a-big { font-family: system-ui, sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
      .d364a-axis { stroke: #94a3b8; stroke-width: 1.5px; }
      .d364a-dash { stroke: #eab308; stroke-width: 2px; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect class="d364a-bg" width="900" height="470" />
  <text class="d364a-title" x="30" y="38">Where the Estimation Error Actually Was</text>
  <text class="d364a-s" x="30" y="60">The same project record, read two ways. Only one of them predicts anything.</text>

  <rect class="d364a-mid" x="30" y="82" width="380" height="112" rx="8" />
  <text class="d364a-h" x="50" y="108">What the project median says</text>
  <text class="d364a-big" x="50" y="146">1.20x</text>
  <text class="d364a-t" x="130" y="141">over at the median</text>
  <text class="d364a-s" x="130" y="160">6 tasks under-estimated, 0 over</text>
  <text class="d364a-s" x="50" y="180">Reads as a well-run project. Twenty percent is normal.</text>

  <rect class="d364a-card" x="440" y="82" width="430" height="112" rx="8" />
  <text class="d364a-h" x="460" y="108">What the same record says by area</text>
  <text class="d364a-t" x="460" y="134">familiar work</text>
  <text class="d364a-t" x="700" y="134">1.15x</text>
  <text class="d364a-t" x="460" y="158">unfamiliar work</text>
  <text class="d364a-t" x="700" y="158">3.33x</text>
  <text class="d364a-s" x="460" y="181">Two populations. The median describes neither.</text>

  <text class="d364a-h" x="30" y="234">Ratio of actual to estimated</text>
  <line class="d364a-axis" x1="150" y1="392" x2="860" y2="392" />
  <line class="d364a-axis" x1="150" y1="250" x2="150" y2="392" />
  <text class="d364a-s" x="150" y="410">1.0x</text>
  <text class="d364a-s" x="330" y="410">1.5x</text>
  <text class="d364a-s" x="510" y="410">2.5x</text>
  <text class="d364a-s" x="700" y="410">3.5x</text>

  <rect class="d364a-good" x="150" y="258" width="54" height="34" rx="4" />
  <text class="d364a-t" x="30" y="280">familiar</text>
  <text class="d364a-s" x="214" y="280">1.15x — estimated well</text>

  <rect class="d364a-bad" x="150" y="316" width="568" height="34" rx="4" />
  <text class="d364a-t" x="30" y="338">unfamiliar</text>
  <text class="d364a-s" x="500" y="338" fill="#7f1d1d">3.33x — three times over</text>

  <line class="d364a-dash" x1="222" y1="250" x2="222" y2="392" />
  <text class="d364a-s" x="230" y="246" fill="#a16207">project median 1.20x</text>

  <rect class="d364a-card" x="30" y="424" width="840" height="34" rx="6" />
  <text class="d364a-t" x="46" y="446">The finding is not "I underestimate". It is: I estimate familiar work well and unfamiliar work by a factor of three.</text>
</svg>
