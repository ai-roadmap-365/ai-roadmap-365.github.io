<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different objectives, similar outcomes.">
  <title>Three subword algorithms</title>
  <style>
    .tokeniser-algorithms-bg   { fill: #f8fafc; }
    .tokeniser-algorithms-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-algorithms-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-algorithms-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-algorithms-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-algorithms-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-algorithms-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tokeniser-algorithms-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tokeniser-algorithms-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tokeniser-algorithms-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tokeniser-algorithms-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tokeniser-algorithms-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tokeniser-algorithms-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tokeniser-algorithms-row { opacity: 1; }
    .tokeniser-algorithms-r0 { animation-delay: 0.00s; }
    .tokeniser-algorithms-r1 { animation-delay: 0.45s; }
    .tokeniser-algorithms-r2 { animation-delay: 0.90s; }
    .tokeniser-algorithms-r3 { animation-delay: 1.35s; }
    .tokeniser-algorithms-r4 { animation-delay: 1.80s; }
    .tokeniser-algorithms-row { animation: tokeniser-algorithms-reveal 7.3s ease-in-out infinite; }
    @keyframes tokeniser-algorithms-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tokeniser-algorithms-bg" width="980" height="390"/>
  <text class="tokeniser-algorithms-h1"  x="30" y="40">Three subword algorithms</text>
  <text class="tokeniser-algorithms-sub" x="30" y="64">Different objectives, similar outcomes.</text>
  <rect class="tokeniser-algorithms-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tokeniser-algorithms-name" x="46" y="122">Frequency-based merging</text>
  <text class="tokeniser-algorithms-desc" x="46" y="142">BPE and WordPiece.</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r0" x="46" y="182">Build up from characters</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r1" x="46" y="216">BPE merges the most frequent pair</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r2" x="46" y="250">WordPiece merges by likelihood gain</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r3" x="46" y="284">Greedy, and deterministic</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r4" x="46" y="318">Widely used in both directions</text>
  <rect class="tokeniser-algorithms-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tokeniser-algorithms-name" x="526" y="122">Likelihood-based pruning</text>
  <text class="tokeniser-algorithms-desc" x="526" y="142">Unigram.</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r0" x="526" y="182">Start large and prune down</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r1" x="526" y="216">Keep the pieces that best explain the corpus</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r2" x="526" y="250">Can produce several valid segmentations</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r3" x="526" y="284">Enables subword regularisation</text>
  <text class="tokeniser-algorithms-desc tokeniser-algorithms-row tokeniser-algorithms-r4" x="526" y="318">Common in multilingual models</text>
  <text class="tokeniser-algorithms-sub" x="30" y="372">The multiple-segmentation property of the unigram approach is genuinely useful: sampling different segmentations of the same text during training is a form of augmentation for language.</text>
</svg>
