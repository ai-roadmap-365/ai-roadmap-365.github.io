<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>Exponential backoff with jitter: a rejected request waits a growing, randomized delay before each retry until it succeeds or gives up</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Backoff and retry: surviving a 429</text>

  <!-- Send request -->
  <rect x="40" y="70" width="170" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="125" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Send request</text>
  <text x="125" y="118" text-anchor="middle" font-size="13" fill="#1a202c">GET /resource</text>

  <!-- Server responds 429 -->
  <rect x="295" y="70" width="180" height="64" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="385" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">429 Too Many</text>
  <text x="385" y="118" text-anchor="middle" font-size="13" fill="#1a202c">Requests (rejected)</text>

  <!-- Wait -->
  <rect x="560" y="70" width="170" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="2" rx="8"/>
  <text x="645" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Wait (grows)</text>
  <text x="645" y="118" text-anchor="middle" font-size="13" fill="#1a202c">then retry</text>

  <!-- arrows top row -->
  <line x1="210" y1="102" x2="287" y2="102" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="295,102 281,95 281,109" fill="#1d4ed8"/>
  <line x1="475" y1="102" x2="552" y2="102" stroke="#b45309" stroke-width="3"/>
  <polygon points="560,102 546,95 546,109" fill="#b45309"/>

  <!-- loop down and back -->
  <line x1="645" y1="134" x2="645" y2="170" stroke="#b45309" stroke-width="3"/>
  <line x1="645" y1="170" x2="125" y2="170" stroke="#b45309" stroke-width="3"/>
  <line x1="125" y1="170" x2="125" y2="140" stroke="#b45309" stroke-width="3"/>
  <polygon points="125,134 118,148 132,148" fill="#b45309"/>
  <text x="385" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">retry the request after waiting</text>

  <!-- growing delays timeline -->
  <text x="40" y="220" font-size="15" font-weight="bold" fill="#1a202c">The wait doubles each attempt (with jitter added):</text>
  <rect x="40" y="236" width="60" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="2" rx="6"/>
  <text x="70" y="258" text-anchor="middle" font-size="13" fill="#1a202c">~1s</text>
  <rect x="120" y="236" width="90" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="2" rx="6"/>
  <text x="165" y="258" text-anchor="middle" font-size="13" fill="#1a202c">~2s</text>
  <rect x="230" y="236" width="150" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="2" rx="6"/>
  <text x="305" y="258" text-anchor="middle" font-size="13" fill="#1a202c">~4s</text>
  <rect x="400" y="236" width="270" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="2" rx="6"/>
  <text x="535" y="258" text-anchor="middle" font-size="13" fill="#1a202c">~8s (capped)</text>
  <text x="690" y="258" font-size="20" fill="#b45309">&#8594;</text>

  <!-- jitter note -->
  <rect x="40" y="292" width="690" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="55" y="314" font-size="13" font-weight="bold" fill="#1a202c">Jitter = a small random amount added to each wait.</text>
  <text x="55" y="333" font-size="13" fill="#1a202c">Without it, every client retries at the same instant and stampedes the server all over again.</text>

  <!-- outcomes -->
  <rect x="40" y="366" width="330" height="72" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="8"/>
  <text x="205" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Success (2xx)</text>
  <text x="205" y="413" text-anchor="middle" font-size="13" fill="#1a202c">A retry finally goes through:</text>
  <text x="205" y="430" text-anchor="middle" font-size="13" fill="#1a202c">return the response.</text>

  <rect x="400" y="366" width="330" height="72" fill="#f1f5f9" stroke="#64748b" stroke-width="2" rx="8"/>
  <text x="565" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Give up gracefully</text>
  <text x="565" y="413" text-anchor="middle" font-size="13" fill="#1a202c">Hit the retry cap? Stop, report</text>
  <text x="565" y="430" text-anchor="middle" font-size="13" fill="#1a202c">a clear error — never loop forever.</text>

  <text x="70" y="358" font-size="12" fill="#15803d">If Retry-After header is present, wait exactly that long instead of guessing.</text>
</svg>
