<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All of them silent.">
  <title>Four pathologies without a pipeline</title>
  <style>
    .loader-pathologies-bg   { fill: #f8fafc; }
    .loader-pathologies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-pathologies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-pathologies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-pathologies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-pathologies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-pathologies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loader-pathologies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loader-pathologies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loader-pathologies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loader-pathologies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loader-pathologies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loader-pathologies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loader-pathologies-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loader-pathologies-stage { opacity: 1; }

    .loader-pathologies-s0 { animation-delay: 0.00s; }
    .loader-pathologies-e0 { animation-delay: 0.00s; }
    .loader-pathologies-s1 { animation-delay: 1.28s; }
    .loader-pathologies-e1 { animation-delay: 1.28s; }
    .loader-pathologies-s2 { animation-delay: 2.56s; }
    .loader-pathologies-e2 { animation-delay: 2.56s; }
    .loader-pathologies-s3 { animation-delay: 3.84s; }
    .loader-pathologies-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .loader-pathologies-conn  { animation: loader-pathologies-trace 6.4s ease-in-out infinite; }
      .loader-pathologies-stage { animation: loader-pathologies-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes loader-pathologies-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loader-pathologies-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loader-pathologies-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loader-pathologies-stage { animation: loader-pathologies-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loader-pathologies-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loader-pathologies-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loader-pathologies-bg" width="980" height="322"/>
  <text class="loader-pathologies-h1"  x="30" y="40">Four pathologies without a pipeline</text>
  <text class="loader-pathologies-sub" x="30" y="64">All of them silent.</text>
  <g class="loader-pathologies-stage loader-pathologies-s0">
    <rect class="loader-pathologies-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="loader-pathologies-step" x="44" y="142">01</text>
    <text class="loader-pathologies-name" x="70" y="142">Everything loaded into memory</text>
    <text class="loader-pathologies-desc" x="44" y="166">Works on a sample, fails on the</text>
    <text class="loader-pathologies-desc" x="44" y="182">real corpus.</text>
  </g>
  <line class="loader-pathologies-line loader-pathologies-conn loader-pathologies-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#loader-pathologies-tip)"/>
  <g class="loader-pathologies-stage loader-pathologies-s1">
    <rect class="loader-pathologies-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="loader-pathologies-step" x="280" y="142">02</text>
    <text class="loader-pathologies-name" x="306" y="142">Loading serialised with training</text>
    <text class="loader-pathologies-desc" x="280" y="166">The accelerator idles while the</text>
    <text class="loader-pathologies-desc" x="280" y="182">CPU decodes.</text>
  </g>
  <line class="loader-pathologies-line loader-pathologies-conn loader-pathologies-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#loader-pathologies-tip)"/>
  <g class="loader-pathologies-stage loader-pathologies-s2">
    <rect class="loader-pathologies-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="loader-pathologies-step" x="516" y="142">03</text>
    <text class="loader-pathologies-name" x="542" y="142">Augmentation applied once</text>
    <text class="loader-pathologies-desc" x="516" y="166">Fixed at preprocessing, so every</text>
    <text class="loader-pathologies-desc" x="516" y="182">epoch sees identical inputs.</text>
  </g>
  <line class="loader-pathologies-line loader-pathologies-conn loader-pathologies-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#loader-pathologies-tip)"/>
  <g class="loader-pathologies-stage loader-pathologies-s3">
    <rect class="loader-pathologies-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="loader-pathologies-step" x="752" y="142">04</text>
    <text class="loader-pathologies-name" x="778" y="142">Unreproducible ordering</text>
    <text class="loader-pathologies-desc" x="752" y="166">No seed, so a run cannot be</text>
    <text class="loader-pathologies-desc" x="752" y="182">repeated.</text>
  </g>
  <text class="loader-pathologies-sub" x="30" y="304">The third is the one that quietly costs accuracy: augmentation applied once at preprocessing is a larger dataset rather than a regulariser, and the distinction does not show up anywhere except the validation curve.</text>
</svg>
