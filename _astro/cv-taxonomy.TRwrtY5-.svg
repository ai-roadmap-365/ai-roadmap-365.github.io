<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Matched to data structure.">
  <title>Four splitting strategies</title>
  <style>
    .cv-taxonomy-bg   { fill: #f8fafc; }
    .cv-taxonomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-taxonomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-taxonomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-taxonomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-taxonomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-taxonomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cv-taxonomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cv-taxonomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cv-taxonomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cv-taxonomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cv-taxonomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cv-taxonomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cv-taxonomy-row { opacity: 1; }
    .cv-taxonomy-r0 { animation-delay: 0.00s; }
    .cv-taxonomy-r1 { animation-delay: 0.45s; }
    .cv-taxonomy-r2 { animation-delay: 0.90s; }
    .cv-taxonomy-r3 { animation-delay: 1.35s; }
    .cv-taxonomy-r4 { animation-delay: 1.80s; }
    .cv-taxonomy-row { animation: cv-taxonomy-reveal 7.3s ease-in-out infinite; }
    @keyframes cv-taxonomy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cv-taxonomy-bg" width="980" height="390"/>
  <text class="cv-taxonomy-h1"  x="30" y="40">Four splitting strategies</text>
  <text class="cv-taxonomy-sub" x="30" y="64">Matched to data structure.</text>
  <rect class="cv-taxonomy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cv-taxonomy-name" x="46" y="122">The data structure</text>
  <text class="cv-taxonomy-desc" x="46" y="142">What you have.</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r0" x="46" y="182">Independent rows, balanced classes</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r1" x="46" y="216">Independent rows, one class rare</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r2" x="46" y="250">Several rows per entity</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r3" x="46" y="284">Ordered in time</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r4" x="46" y="318">Both grouped and time-ordered</text>
  <rect class="cv-taxonomy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cv-taxonomy-name" x="526" y="122">The strategy</text>
  <text class="cv-taxonomy-desc" x="526" y="142">What to use.</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r0" x="526" y="182">Plain k-fold</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r1" x="526" y="216">Stratified k-fold</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r2" x="526" y="250">Group k-fold</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r3" x="526" y="284">Expanding window</text>
  <text class="cv-taxonomy-desc cv-taxonomy-row cv-taxonomy-r4" x="526" y="318">Grouped time-series split</text>
  <text class="cv-taxonomy-sub" x="30" y="372">Choosing the strategy from the data's structure rather than from habit is the whole discipline, and the default plain k-fold is wrong for most real datasets.</text>
</svg>
