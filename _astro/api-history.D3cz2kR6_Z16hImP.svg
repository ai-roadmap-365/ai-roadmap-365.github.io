<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward typed contracts.">
  <title>Four steps in web service design</title>
  <style>
    .api-history-bg   { fill: #f8fafc; }
    .api-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .api-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .api-history-stage { opacity: 1; }

    .api-history-s0 { animation-delay: 0.00s; }
    .api-history-e0 { animation-delay: 0.00s; }
    .api-history-s1 { animation-delay: 1.28s; }
    .api-history-e1 { animation-delay: 1.28s; }
    .api-history-s2 { animation-delay: 2.56s; }
    .api-history-e2 { animation-delay: 2.56s; }
    .api-history-s3 { animation-delay: 3.84s; }
    .api-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .api-history-conn  { animation: api-history-trace 6.4s ease-in-out infinite; }
      .api-history-stage { animation: api-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes api-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes api-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .api-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .api-history-stage { animation: api-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes api-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="api-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="api-history-bg" width="980" height="322"/>
  <text class="api-history-h1"  x="30" y="40">Four steps in web service design</text>
  <text class="api-history-sub" x="30" y="64">Toward typed contracts.</text>
  <g class="api-history-stage api-history-s0">
    <rect class="api-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="api-history-step" x="44" y="142">01</text>
    <text class="api-history-name" x="70" y="142">Scripts that read the request environment directly</text>
    <text class="api-history-desc" x="44" y="166">Verbose, and easy to get wrong.</text>
  </g>
  <line class="api-history-line api-history-conn api-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#api-history-tip)"/>
  <g class="api-history-stage api-history-s1">
    <rect class="api-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="api-history-step" x="280" y="142">02</text>
    <text class="api-history-name" x="306" y="142">Then heavyweight protocols with formal contracts</text>
    <text class="api-history-desc" x="280" y="166">Rigorous, and cumbersome.</text>
  </g>
  <line class="api-history-line api-history-conn api-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#api-history-tip)"/>
  <g class="api-history-stage api-history-s2">
    <rect class="api-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="api-history-step" x="516" y="142">03</text>
    <text class="api-history-name" x="542" y="142">Then resource-oriented design over plain formats</text>
    <text class="api-history-desc" x="516" y="166">Simpler, and less clearly</text>
    <text class="api-history-desc" x="516" y="182">specified.</text>
  </g>
  <line class="api-history-line api-history-conn api-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#api-history-tip)"/>
  <g class="api-history-stage api-history-s3">
    <rect class="api-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="api-history-step" x="752" y="142">04</text>
    <text class="api-history-name" x="778" y="142">And now typed frameworks generating the contract</text>
    <text class="api-history-desc" x="752" y="166">Which recovers rigour without</text>
    <text class="api-history-desc" x="752" y="182">the ceremony.</text>
  </g>
  <text class="api-history-sub" x="30" y="304">The last step is a genuine synthesis: the contract is derived from the code, so it is both machine-readable and impossible to leave stale.</text>
</svg>
