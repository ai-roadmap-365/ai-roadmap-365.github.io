<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rows, columns, and operating on all of it.">
  <title>A spreadsheet</title>
  <style>
    .spreadsheet-bg   { fill: #f8fafc; }
    .spreadsheet-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spreadsheet-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spreadsheet-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spreadsheet-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spreadsheet-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spreadsheet-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spreadsheet-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .spreadsheet-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .spreadsheet-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .spreadsheet-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .spreadsheet-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .spreadsheet-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spreadsheet-row { opacity: 1; }
    .spreadsheet-r0 { animation-delay: 0.00s; }
    .spreadsheet-r1 { animation-delay: 0.45s; }
    .spreadsheet-r2 { animation-delay: 0.90s; }
    .spreadsheet-r3 { animation-delay: 1.35s; }
    .spreadsheet-r4 { animation-delay: 1.80s; }
    .spreadsheet-row { animation: spreadsheet-reveal 7.3s ease-in-out infinite; }
    @keyframes spreadsheet-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="spreadsheet-bg" width="980" height="390"/>
  <text class="spreadsheet-h1"  x="30" y="40">A spreadsheet</text>
  <text class="spreadsheet-sub" x="30" y="64">Rows, columns, and operating on all of it.</text>
  <rect class="spreadsheet-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="spreadsheet-name" x="46" y="122">Cell by cell</text>
  <text class="spreadsheet-desc" x="46" y="142">One at a time.</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r0" x="46" y="182">A formula per cell</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r1" x="46" y="216">Explicit loops over rows</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r2" x="46" y="250">Slow, and error-prone at scale</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r3" x="46" y="284">Easy to get one cell wrong</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r4" x="46" y="318">This is loop-based code</text>
  <rect class="spreadsheet-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="spreadsheet-name" x="526" y="122">Whole columns at once</text>
  <text class="spreadsheet-desc" x="526" y="142">All together.</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r0" x="526" y="182">One operation on a whole range</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r1" x="526" y="216">No explicit loop</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r2" x="526" y="250">Fast, and uniformly applied</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r3" x="526" y="284">Wrong shape fails loudly</text>
  <text class="spreadsheet-desc spreadsheet-row spreadsheet-r4" x="526" y="318">This is vectorised code</text>
  <text class="spreadsheet-sub" x="30" y="372">Anyone who has dragged a formula across a spreadsheet has done vectorised thinking already, which is a useful bridge to the array style.</text>
</svg>
