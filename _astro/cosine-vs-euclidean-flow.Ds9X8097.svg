<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif"
     aria-labelledby="d103f-title d103f-desc" width="1200" height="880">
  <title id="d103f-title">Scaling one vector: the Euclidean gap grows while the angle, and therefore the cosine similarity, stays fixed at 1</title>
  <desc id="d103f-desc">An animated flow diagram. One article vector is drawn along a ray from the origin, then the same article written at twice and three times the length, marked further out along the identical ray. A travelling marker slides outwards from the first tip to the third while a growing gap bar reports 0, then 9.0554, then 18.1108. A table beside it shows the cosine similarity holding at exactly 1.0000 and the angle at 0 degrees for all three, and a band underneath gives the arithmetic that makes the cancellation exact.</desc>

  <style>
    .d103f-bg     { fill: #f8fafc; }
    .d103f-panel  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .d103f-band   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; rx: 10; }
    .d103f-warn   { fill: #fff7ed; stroke: #b45309; stroke-width: 1.5; rx: 10; }
    .d103f-h1     { fill: #1a202c; font-size: 30px; font-weight: 700; }
    .d103f-h2     { fill: #1d4ed8; font-size: 20px; font-weight: 700; }
    .d103f-t      { fill: #1a202c; font-size: 16px; }
    .d103f-tb     { fill: #1a202c; font-size: 16px; font-weight: 700; }
    .d103f-sm     { fill: #475569; font-size: 15px; }
    .d103f-mono   { fill: #1a202c; font-size: 16px;
                    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .d103f-monob  { fill: #1a202c; font-size: 16px; font-weight: 700;
                    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .d103f-grid   { stroke: #e2e8f0; stroke-width: 1; }
    .d103f-axis   { stroke: #94a3b8; stroke-width: 1.5; }
    .d103f-ray    { stroke: #1d4ed8; stroke-width: 3; fill: none; }
    .d103f-lb     { fill: #1d4ed8; font-size: 16px; font-weight: 700; }
    .d103f-lg     { fill: #b45309; font-size: 16px; font-weight: 700; }

    /* --- the gap bar, marching outwards --- */
    .d103f-gap {
      stroke: #b45309; stroke-width: 5; fill: none;
      stroke-dasharray: 12 8;
      animation: d103f-march 1.8s linear infinite;
    }
    @keyframes d103f-march { to { stroke-dashoffset: -20 } }

    /* --- the travelling tip marker --- */
    .d103f-token {
      fill: #b45309;
      animation: d103f-travel 6s ease-in-out infinite;
    }
    @keyframes d103f-travel {
      0%, 8%    { transform: translate(0px, 0px) }
      33%, 41%  { transform: translate(198px, -22px) }
      66%, 74%  { transform: translate(396px, -44px) }
      100%      { transform: translate(0px, 0px) }
    }

    /* --- the three rows lighting up in turn --- */
    .d103f-row { fill: #e0e7ff; animation: d103f-lift 6s ease-in-out infinite; }
    .d103f-r1  { animation-delay: 0s }
    .d103f-r2  { animation-delay: 2s }
    .d103f-r3  { animation-delay: 4s }
    @keyframes d103f-lift {
      0%, 26%, 100% { fill: #e0e7ff }
      6%, 20%       { fill: #bfdbfe }
    }

    /* --- the cosine column, which never changes: a steady pulse, never dim --- */
    .d103f-hold { fill: #dcfce7; animation: d103f-steady 6s ease-in-out infinite; }
    @keyframes d103f-steady {
      0%, 100% { fill: #dcfce7 }
      50%      { fill: #bbf7d0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .d103f-gap   { animation: none; stroke-dasharray: none }
      .d103f-token { animation: none; transform: translate(0px, 0px) }
      .d103f-row   { animation: none; fill: #e0e7ff }
      .d103f-hold  { animation: none; fill: #dcfce7 }
    }
  </style>

  <marker id="d103f-arrow" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
  </marker>

  <rect class="d103f-bg" x="0" y="0" width="1200" height="880" />

  <text class="d103f-h1" x="40" y="48">The same article, written longer and longer</text>
  <text class="d103f-t" x="40" y="80">roast-chicken, drawn in the two features it actually uses: cooking 9, money 1. Doubling and tripling every count moves the tip further out along the identical ray.</text>
  <text class="d103f-sm" x="40" y="104">The other two features are 0 in this article and contribute nothing to any of the numbers below, which is why they can be left off the picture without changing a single one of them.</text>

  <!-- ============================ THE RAY ============================ -->
  <rect class="d103f-panel" x="40" y="130" width="740" height="580" />
  <text class="d103f-h2" x="64" y="166">One direction, three lengths</text>

  <g>
    <line class="d103f-grid" x1="100" y1="560" x2="740" y2="560" />
    <line class="d103f-grid" x1="100" y1="600" x2="740" y2="600" />
    <line class="d103f-axis" x1="100" y1="640" x2="750" y2="640" />
    <line class="d103f-axis" x1="120" y1="670" x2="120" y2="520" />
    <text class="d103f-sm" x="700" y="666">cooking</text>
    <text class="d103f-sm" x="60" y="524">money</text>

    <line class="d103f-ray" x1="120" y1="640" x2="714" y2="574"
          marker-end="url(#d103f-arrow)" />

    <circle cx="318" cy="618" r="8" fill="#1d4ed8" />
    <circle cx="516" cy="596" r="8" fill="#1d4ed8" />
    <circle cx="714" cy="574" r="8" fill="#1d4ed8" />

    <text class="d103f-lb" x="286" y="600">[9, 1]</text>
    <text class="d103f-lb" x="482" y="578">[18, 2]</text>
    <text class="d103f-lb" x="680" y="556">[27, 3]</text>
    <text class="d103f-sm" x="286" y="580">1&#215;</text>
    <text class="d103f-sm" x="482" y="558">2&#215;</text>
    <text class="d103f-sm" x="680" y="536">3&#215;</text>

    <!-- the growing gap, measured from the 1x tip -->
    <line class="d103f-gap" x1="318" y1="618" x2="714" y2="574" />
    <circle class="d103f-token" cx="318" cy="618" r="11" />

    <text class="d103f-lg" x="360" y="700">Euclidean gap from the 1&#215; article:</text>
    <text class="d103f-lg" x="360" y="196">0.0000 at 1&#215;</text>
    <text class="d103f-lg" x="360" y="220">9.0554 at 2&#215;</text>
    <text class="d103f-lg" x="360" y="244">18.1108 at 3&#215;</text>
    <text class="d103f-sm" x="360" y="270">It grows without limit as the writer keeps writing.</text>

    <text class="d103f-tb" x="64" y="196">Angle between every pair here:</text>
    <text class="d103f-monob" x="64" y="222">0.00&#176;</text>
    <text class="d103f-tb" x="64" y="248">Cosine similarity:</text>
    <text class="d103f-monob" x="64" y="274">1.0000</text>
    <text class="d103f-sm" x="64" y="300">Both fixed. Neither moves at all.</text>
  </g>

  <!-- ============================ THE TABLE ============================ -->
  <rect class="d103f-panel" x="800" y="130" width="360" height="580" />
  <text class="d103f-h2" x="824" y="166">Measured, not asserted</text>

  <text class="d103f-tb" x="824" y="206">article</text>
  <text class="d103f-tb" x="960" y="206">|v|</text>
  <text class="d103f-tb" x="1046" y="206">gap</text>
  <text class="d103f-tb" x="1112" y="206">cos</text>
  <line class="d103f-axis" x1="824" y1="216" x2="1140" y2="216" />

  <rect class="d103f-row d103f-r1" x="816" y="228" width="248" height="44" rx="6" />
  <rect class="d103f-hold" x="1072" y="228" width="76" height="44" rx="6" />
  <text class="d103f-mono" x="824" y="256">[9, 1]</text>
  <text class="d103f-mono" x="944" y="256">9.0554</text>
  <text class="d103f-mono" x="1032" y="256">0.0000</text>
  <text class="d103f-monob" x="1084" y="256">1.0000</text>

  <rect class="d103f-row d103f-r2" x="816" y="284" width="248" height="44" rx="6" />
  <rect class="d103f-hold" x="1072" y="284" width="76" height="44" rx="6" />
  <text class="d103f-mono" x="824" y="312">[18, 2]</text>
  <text class="d103f-mono" x="936" y="312">18.1108</text>
  <text class="d103f-mono" x="1024" y="312">9.0554</text>
  <text class="d103f-monob" x="1084" y="312">1.0000</text>

  <rect class="d103f-row d103f-r3" x="816" y="340" width="248" height="44" rx="6" />
  <rect class="d103f-hold" x="1072" y="340" width="76" height="44" rx="6" />
  <text class="d103f-mono" x="824" y="368">[27, 3]</text>
  <text class="d103f-mono" x="936" y="368">27.1662</text>
  <text class="d103f-mono" x="1016" y="368">18.1108</text>
  <text class="d103f-monob" x="1084" y="368">1.0000</text>

  <text class="d103f-sm" x="824" y="412">Gap is measured from the 1&#215; article.</text>

  <rect class="d103f-warn" x="816" y="436" width="328" height="252" />
  <text class="d103f-tb" x="836" y="470">And the comparison that stings:</text>
  <text class="d103f-t" x="836" y="500">race-day-nutrition, an article mostly</text>
  <text class="d103f-t" x="836" y="522">about running, sits</text>
  <text class="d103f-monob" x="836" y="550">8.0623</text>
  <text class="d103f-t" x="836" y="578">from roast-chicken &#8212; nearer than</text>
  <text class="d103f-t" x="836" y="600">roast-chicken's own doubled copy at</text>
  <text class="d103f-monob" x="836" y="628">9.0554</text>
  <text class="d103f-t" x="836" y="656">Its cosine similarity is 0.5514,</text>
  <text class="d103f-t" x="836" y="678">which is not close to 1.0000 at all.</text>

  <!-- ============================ THE ARITHMETIC ============================ -->
  <rect class="d103f-band" x="40" y="730" width="1120" height="126" />
  <text class="d103f-tb" x="64" y="764">Why the cosine is exactly 1 and not merely close to it &#8212; the cancellation, with these numbers:</text>
  <text class="d103f-mono" x="64" y="796">v . 2v = 9(18) + 1(2) = 164        |v| = 9.055385        |2v| = 18.110770</text>
  <text class="d103f-mono" x="64" y="820">164 / (9.055385 &#215; 18.110770) = 1.0000000000</text>
  <text class="d103f-t" x="64" y="846">Scaling multiplies the top and the bottom by the same factor. The factor cancels. That is not a near-miss rounded off; it is an identity.</text>
</svg>
