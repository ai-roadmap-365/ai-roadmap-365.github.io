<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" role="img" aria-label="Rollback as a Pointer Swap versus a Rebuild showing the elapsed time of each while an incident is ongoing">
  <title>Rollback as a Pointer Swap versus a Rebuild</title>
  <defs>
    <style>
      .d359b-bg { fill: #f8fafc; }
      .d359b-bad { fill: #fecaca; stroke: #ef4444; stroke-width: 1px; }
      .d359b-good { fill: #bbf7d0; stroke: #22c55e; stroke-width: 1px; }
      .d359b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d359b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d359b-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d359b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d359b-key { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d359b-bg"/>
  <text x="40" y="40" class="d359b-title">Rollback as a Pointer Swap versus a Rebuild</text>
  <text x="40" y="64" class="d359b-sub">The incident lasts exactly as long as the rollback does. That makes rollback speed a design decision, not an implementation detail.</text>

  <text x="40" y="118" class="d359b-h">pointer swap</text>
  <rect x="200" y="102" width="60" height="30" class="d359b-bad"/>
  <text x="230" y="122" class="d359b-t" text-anchor="middle">~30s</text>
  <rect x="262" y="102" width="480" height="30" class="d359b-good"/>
  <text x="502" y="122" class="d359b-t" text-anchor="middle">serving correctly again</text>

  <text x="40" y="182" class="d359b-h">rebuild and redeploy</text>
  <rect x="200" y="166" width="420" height="30" class="d359b-bad"/>
  <text x="410" y="186" class="d359b-t" text-anchor="middle">build, push, roll out — as long as the deployment took</text>
  <rect x="622" y="166" width="120" height="30" class="d359b-good"/>
  <text x="682" y="186" class="d359b-t" text-anchor="middle">recovered</text>

  <rect x="200" y="222" width="16" height="14" class="d359b-bad"/>
  <text x="226" y="234" class="d359b-t">incident ongoing — users affected the whole time</text>
  <rect x="560" y="222" width="16" height="14" class="d359b-good"/>
  <text x="586" y="234" class="d359b-t">recovered</text>

  <text x="40" y="286" class="d359b-h">Why rollback must SWAP rather than discard</text>
  <text x="40" y="310" class="d359b-t">Keeping both versions means the rollback is itself reversible. That matters on the day the rollback turns out to have been</text>
  <text x="40" y="328" class="d359b-t">the mistake — the new version was fine and the real fault was elsewhere.</text>
  <text x="40" y="356" class="d359b-key">A deployment you cannot reverse is not a deployment. It is a commitment.</text>
  <text x="40" y="384" class="d359b-t">Which is why an irreversible migration is a release-blocking condition rather than a note in the pull request.</text>
</svg>
