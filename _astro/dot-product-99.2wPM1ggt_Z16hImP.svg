<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four readings.">
  <title>The dot product</title>
  <style>
    .dot-product-99-bg   { fill: #f8fafc; }
    .dot-product-99-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-product-99-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-product-99-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-product-99-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-product-99-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-product-99-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dot-product-99-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dot-product-99-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dot-product-99-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dot-product-99-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dot-product-99-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dot-product-99-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dot-product-99-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dot-product-99-stage { opacity: 1; }

    .dot-product-99-s0 { animation-delay: 0.00s; }
    .dot-product-99-e0 { animation-delay: 0.00s; }
    .dot-product-99-s1 { animation-delay: 1.28s; }
    .dot-product-99-e1 { animation-delay: 1.28s; }
    .dot-product-99-s2 { animation-delay: 2.56s; }
    .dot-product-99-e2 { animation-delay: 2.56s; }
    .dot-product-99-s3 { animation-delay: 3.84s; }
    .dot-product-99-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dot-product-99-conn  { animation: dot-product-99-trace 6.4s ease-in-out infinite; }
      .dot-product-99-stage { animation: dot-product-99-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dot-product-99-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dot-product-99-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dot-product-99-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dot-product-99-stage { animation: dot-product-99-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dot-product-99-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dot-product-99-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dot-product-99-bg" width="980" height="322"/>
  <text class="dot-product-99-h1"  x="30" y="40">The dot product</text>
  <text class="dot-product-99-sub" x="30" y="64">Four readings.</text>
  <g class="dot-product-99-stage dot-product-99-s0">
    <rect class="dot-product-99-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dot-product-99-step" x="44" y="142">01</text>
    <text class="dot-product-99-name" x="70" y="142">Multiply corresponding components and add</text>
    <text class="dot-product-99-desc" x="44" y="166">Which is the computation.</text>
  </g>
  <line class="dot-product-99-line dot-product-99-conn dot-product-99-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dot-product-99-tip)"/>
  <g class="dot-product-99-stage dot-product-99-s1">
    <rect class="dot-product-99-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dot-product-99-step" x="280" y="142">02</text>
    <text class="dot-product-99-name" x="306" y="142">It measures how much one vector points along the other</text>
    <text class="dot-product-99-desc" x="280" y="166">A projection.</text>
  </g>
  <line class="dot-product-99-line dot-product-99-conn dot-product-99-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dot-product-99-tip)"/>
  <g class="dot-product-99-stage dot-product-99-s2">
    <rect class="dot-product-99-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dot-product-99-step" x="516" y="142">03</text>
    <text class="dot-product-99-name" x="542" y="142">On unit vectors it is the cosine of the angle</text>
    <text class="dot-product-99-desc" x="516" y="166">Which is why cosine similarity</text>
    <text class="dot-product-99-desc" x="516" y="182">is a dot product.</text>
  </g>
  <line class="dot-product-99-line dot-product-99-conn dot-product-99-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dot-product-99-tip)"/>
  <g class="dot-product-99-stage dot-product-99-s3">
    <rect class="dot-product-99-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dot-product-99-step" x="752" y="142">04</text>
    <text class="dot-product-99-name" x="778" y="142">And its sign says same direction or opposite</text>
    <text class="dot-product-99-desc" x="752" y="166">Zero means perpendicular.</text>
  </g>
  <text class="dot-product-99-sub" x="30" y="304">This single operation is the most executed computation in AI, appearing in every attention score and every layer of every network.</text>
</svg>
