<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Splitting by time</title>
  <style>
    .time-144-bg   { fill: #f8fafc; }
    .time-144-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-144-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-144-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-144-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-144-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-144-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-144-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-144-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-144-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-144-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-144-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-144-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .time-144-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .time-144-stage { opacity: 1; }

    .time-144-s0 { animation-delay: 0.00s; }
    .time-144-e0 { animation-delay: 0.00s; }
    .time-144-s1 { animation-delay: 1.28s; }
    .time-144-e1 { animation-delay: 1.28s; }
    .time-144-s2 { animation-delay: 2.56s; }
    .time-144-e2 { animation-delay: 2.56s; }
    .time-144-s3 { animation-delay: 3.84s; }
    .time-144-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .time-144-conn  { animation: time-144-trace 6.4s ease-in-out infinite; }
      .time-144-stage { animation: time-144-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes time-144-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes time-144-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .time-144-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .time-144-stage { animation: time-144-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes time-144-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="time-144-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="time-144-bg" width="980" height="322"/>
  <text class="time-144-h1"  x="30" y="40">Splitting by time</text>
  <text class="time-144-sub" x="30" y="64">Four steps.</text>
  <g class="time-144-stage time-144-s0">
    <rect class="time-144-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="time-144-step" x="44" y="142">01</text>
    <text class="time-144-name" x="70" y="142">The data has an order in time</text>
    <text class="time-144-desc" x="44" y="166">Even when nothing obviously says</text>
    <text class="time-144-desc" x="44" y="182">so.</text>
  </g>
  <line class="time-144-line time-144-conn time-144-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#time-144-tip)"/>
  <g class="time-144-stage time-144-s1">
    <rect class="time-144-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="time-144-step" x="280" y="142">02</text>
    <text class="time-144-name" x="306" y="142">A random split trains on later rows</text>
    <text class="time-144-desc" x="280" y="166">And validates on earlier ones.</text>
  </g>
  <line class="time-144-line time-144-conn time-144-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#time-144-tip)"/>
  <g class="time-144-stage time-144-s2">
    <rect class="time-144-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="time-144-step" x="516" y="142">03</text>
    <text class="time-144-name" x="542" y="142">Which predicts the past from the future</text>
    <text class="time-144-desc" x="516" y="166">An ability the deployed model</text>
    <text class="time-144-desc" x="516" y="182">will not have.</text>
  </g>
  <line class="time-144-line time-144-conn time-144-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#time-144-tip)"/>
  <g class="time-144-stage time-144-s3">
    <rect class="time-144-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="time-144-step" x="752" y="142">04</text>
    <text class="time-144-name" x="778" y="142">So split chronologically, with a gap for the forecast horizon</text>
    <text class="time-144-desc" x="752" y="166">Which matches how it will</text>
    <text class="time-144-desc" x="752" y="182">actually run.</text>
  </g>
  <text class="time-144-sub" x="30" y="304">The gap matching the forecast horizon is the refinement usually skipped, and without it the evaluation quietly assumes information that arrives too late.</text>
</svg>
