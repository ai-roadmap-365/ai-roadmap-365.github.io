<svg role="img" aria-label="Yoon Kim TextCNN 1D convolutional feature map extraction showing multiple parallel filter window sizes sliding over word embedding matrix" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Yoon Kim (2014) TextCNN 1D Convolution Pipeline</title>
  <defs>
    <linearGradient id="bg223b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card223b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg223b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TEXTCNN (1D CONVOLUTION FOR TEXT) MECHANICS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Yoon Kim (2014): Parallel n-Gram Convolutions (k=2,3,4) with 1-Max-Pooling over Time</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card223b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. Word Embedding Matrix (Left) -->
    <rect x="25" y="25" width="160" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="105" y="48" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Sentence Embedding</text>
    <text x="105" y="65" fill="#94a3b8" font-size="8" text-anchor="middle">Shape: (N words × d dim)</text>
    
    <rect x="35" y="80" width="140" height="22" fill="#1e293b" stroke="#475569"/>
    <text x="105" y="95" fill="#cbd5e1" font-size="8" text-anchor="middle">"The" [0.12, 0.45, ...]</text>
    <rect x="35" y="105" width="140" height="22" fill="#1e293b" stroke="#475569"/>
    <text x="105" y="120" fill="#cbd5e1" font-size="8" text-anchor="middle">"movie" [0.89, -0.2, ...]</text>
    <rect x="35" y="130" width="140" height="22" fill="#1e293b" stroke="#475569"/>
    <text x="105" y="145" fill="#cbd5e1" font-size="8" text-anchor="middle">"was" [-0.1, 0.05, ...]</text>
    <rect x="35" y="155" width="140" height="22" fill="#1e293b" stroke="#475569"/>
    <text x="105" y="170" fill="#cbd5e1" font-size="8" text-anchor="middle">"not" [0.72, 0.31, ...]</text>
    <rect x="35" y="180" width="140" height="22" fill="#1e293b" stroke="#475569"/>
    <text x="105" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">"good" [0.95, -0.8, ...]</text>

    <!-- 2. Multi-Scale Filters (Center Left) -->
    <rect x="205" y="25" width="175" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="292" y="48" fill="#fbbf24" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">1D Conv Kernels</text>
    
    <rect x="215" y="75" width="155" height="45" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="292" y="95" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Filter Size k = 2 (Bigrams)</text>
    <text x="292" y="110" fill="#cbd5e1" font-size="8" text-anchor="middle">100 filters of shape (2 × d)</text>

    <rect x="215" y="130" width="155" height="55" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="292" y="152" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Filter Size k = 3 (Trigrams)</text>
    <text x="292" y="168" fill="#cbd5e1" font-size="8" text-anchor="middle">100 filters of shape (3 × d)</text>

    <rect x="215" y="195" width="155" height="65" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="292" y="220" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Filter Size k = 4 (4-grams)</text>
    <text x="292" y="238" fill="#cbd5e1" font-size="8" text-anchor="middle">100 filters of shape (4 × d)</text>

    <!-- 3. Feature Maps & Max Pooling (Center Right) -->
    <rect x="400" y="25" width="170" height="245" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="485" y="48" fill="#c084fc" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">1-Max Pooling</text>
    
    <rect x="410" y="80" width="150" height="35" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="485" y="102" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Max(Map_k2) -> 100 scalars</text>

    <rect x="410" y="135" width="150" height="35" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="485" y="157" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Max(Map_k3) -> 100 scalars</text>

    <rect x="410" y="190" width="150" height="35" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="485" y="212" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Max(Map_k4) -> 100 scalars</text>

    <!-- 4. Dense Classifier Head (Right) -->
    <rect x="590" y="25" width="145" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="662" y="48" fill="#34d399" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Dense Head</text>
    
    <rect x="600" y="80" width="125" height="90" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="662" y="105" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Concatenated</text>
    <text x="662" y="125" fill="#cbd5e1" font-size="8" text-anchor="middle">300-D Feature Vector</text>
    <text x="662" y="145" fill="#94a3b8" font-size="8" text-anchor="middle">+ Dropout(0.5)</text>

    <rect x="600" y="190" width="125" height="60" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="662" y="215" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">Softmax Logits</text>
    <text x="662" y="235" fill="#f8fafc" font-size="8" text-anchor="middle">Positive / Negative</text>
  </g>
</svg>
