<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is ceremony.">
  <title>When the full playbook applies</title>
  <style>
    .playbook-when-bg   { fill: #f8fafc; }
    .playbook-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .playbook-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .playbook-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .playbook-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .playbook-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .playbook-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .playbook-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .playbook-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .playbook-when-row { opacity: 1; }
    .playbook-when-r0 { animation-delay: 0.00s; }
    .playbook-when-r1 { animation-delay: 0.45s; }
    .playbook-when-r2 { animation-delay: 0.90s; }
    .playbook-when-r3 { animation-delay: 1.35s; }
    .playbook-when-r4 { animation-delay: 1.80s; }
    .playbook-when-row { animation: playbook-when-reveal 7.3s ease-in-out infinite; }
    @keyframes playbook-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="playbook-when-bg" width="980" height="390"/>
  <text class="playbook-when-h1"  x="30" y="40">When the full playbook applies</text>
  <text class="playbook-when-sub" x="30" y="64">And when it is ceremony.</text>
  <rect class="playbook-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="playbook-when-name" x="46" y="122">Full playbook</text>
  <text class="playbook-when-desc" x="46" y="142">Anything shipped.</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r0" x="46" y="182">Production features</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r1" x="46" y="216">Customer-facing API endpoints</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r2" x="46" y="250">Backend microservices</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r3" x="46" y="284">Database migrations</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r4" x="46" y="318">Anything a rollback plan would matter for</text>
  <rect class="playbook-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="playbook-when-name" x="526" y="122">Skip it</text>
  <text class="playbook-when-desc" x="526" y="142">Trivial and reversible.</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r0" x="526" y="182">A README typo</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r1" x="526" y="216">A CSS margin</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r2" x="526" y="250">No behaviour changes</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r3" x="526" y="284">No test could capture it</text>
  <text class="playbook-when-desc playbook-when-row playbook-when-r4" x="526" y="318">But still name the file</text>
  <text class="playbook-when-sub" x="30" y="372">The naming habit from Day 303 carries here too: even a trivial request benefits from being bounded, because an unbounded trivial request is how an agent decides to reformat a file.</text>
</svg>
