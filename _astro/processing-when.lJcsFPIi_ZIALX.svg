<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the signal that says it is time.">
  <title>When to invest in processing</title>
  <style>
    .processing-when-bg   { fill: #f8fafc; }
    .processing-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .processing-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .processing-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .processing-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .processing-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .processing-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .processing-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .processing-when-row { opacity: 1; }
    .processing-when-r0 { animation-delay: 0.00s; }
    .processing-when-r1 { animation-delay: 0.45s; }
    .processing-when-r2 { animation-delay: 0.90s; }
    .processing-when-r3 { animation-delay: 1.35s; }
    .processing-when-r4 { animation-delay: 1.80s; }
    .processing-when-row { animation: processing-when-reveal 7.3s ease-in-out infinite; }
    @keyframes processing-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="processing-when-bg" width="980" height="390"/>
  <text class="processing-when-h1"  x="30" y="40">When to invest in processing</text>
  <text class="processing-when-sub" x="30" y="64">And the signal that says it is time.</text>
  <rect class="processing-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="processing-when-name" x="46" y="122">Invest</text>
  <text class="processing-when-desc" x="46" y="142">Heterogeneous or external.</text>
  <text class="processing-when-desc processing-when-row processing-when-r0" x="46" y="182">A mixed corpus of formats</text>
  <text class="processing-when-desc processing-when-row processing-when-r1" x="46" y="216">Any material fraction scanned</text>
  <text class="processing-when-desc processing-when-row processing-when-r2" x="46" y="250">Tables carrying meaning answers depend on</text>
  <text class="processing-when-desc processing-when-row processing-when-r3" x="46" y="284">Documents from outside your control</text>
  <text class="processing-when-desc processing-when-row processing-when-r4" x="46" y="318">Where you cannot assume good behaviour</text>
  <rect class="processing-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="processing-when-name" x="526" y="122">Keep it simple</text>
  <text class="processing-when-desc" x="526" y="142">Uniform and born-digital.</text>
  <text class="processing-when-desc processing-when-row processing-when-r0" x="526" y="182">Markdown from a docs repository</text>
  <text class="processing-when-desc processing-when-row processing-when-r1" x="526" y="216">Plain-text exports from one system</text>
  <text class="processing-when-desc processing-when-row processing-when-r2" x="526" y="250">Format dispatch earns nothing here</text>
  <text class="processing-when-desc processing-when-row processing-when-r3" x="526" y="284">OCR routing earns nothing here</text>
  <text class="processing-when-desc processing-when-row processing-when-r4" x="526" y="318">Machinery without a job</text>
  <text class="processing-when-sub" x="30" y="372">The signal to invest is usually a specific complaint: somebody reports that a document they know exists never comes back in search, which is almost always an extraction failure nothing was watching for.</text>
</svg>
