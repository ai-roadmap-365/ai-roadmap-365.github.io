<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are advantages.">
  <title>Four consequences of linear regression</title>
  <style>
    .linreg-implications-bg   { fill: #f8fafc; }
    .linreg-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linreg-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .linreg-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .linreg-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .linreg-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .linreg-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .linreg-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .linreg-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .linreg-implications-stage { opacity: 1; }

    .linreg-implications-s0 { animation-delay: 0.00s; }
    .linreg-implications-e0 { animation-delay: 0.00s; }
    .linreg-implications-s1 { animation-delay: 1.28s; }
    .linreg-implications-e1 { animation-delay: 1.28s; }
    .linreg-implications-s2 { animation-delay: 2.56s; }
    .linreg-implications-e2 { animation-delay: 2.56s; }
    .linreg-implications-s3 { animation-delay: 3.84s; }
    .linreg-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .linreg-implications-conn  { animation: linreg-implications-trace 6.4s ease-in-out infinite; }
      .linreg-implications-stage { animation: linreg-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes linreg-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes linreg-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .linreg-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .linreg-implications-stage { animation: linreg-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes linreg-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="linreg-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="linreg-implications-bg" width="980" height="322"/>
  <text class="linreg-implications-h1"  x="30" y="40">Four consequences of linear regression</text>
  <text class="linreg-implications-sub" x="30" y="64">Two are advantages.</text>
  <g class="linreg-implications-stage linreg-implications-s0">
    <rect class="linreg-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-implications-step" x="44" y="142">01</text>
    <text class="linreg-implications-name" x="70" y="142">Coefficients are readable and defensible</text>
    <text class="linreg-implications-desc" x="44" y="166">Which regulated settings</text>
    <text class="linreg-implications-desc" x="44" y="182">require.</text>
  </g>
  <line class="linreg-implications-line linreg-implications-conn linreg-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#linreg-implications-tip)"/>
  <g class="linreg-implications-stage linreg-implications-s1">
    <rect class="linreg-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-implications-step" x="280" y="142">02</text>
    <text class="linreg-implications-name" x="306" y="142">And fitting is effectively instantaneous</text>
    <text class="linreg-implications-desc" x="280" y="166">At any scale that fits in</text>
    <text class="linreg-implications-desc" x="280" y="182">memory.</text>
  </g>
  <line class="linreg-implications-line linreg-implications-conn linreg-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#linreg-implications-tip)"/>
  <g class="linreg-implications-stage linreg-implications-s2">
    <rect class="linreg-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-implications-step" x="516" y="142">03</text>
    <text class="linreg-implications-name" x="542" y="142">But interpretation depends on the assumptions holding</text>
    <text class="linreg-implications-desc" x="516" y="166">Which the diagnostics have to</text>
    <text class="linreg-implications-desc" x="516" y="182">check.</text>
  </g>
  <line class="linreg-implications-line linreg-implications-conn linreg-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#linreg-implications-tip)"/>
  <g class="linreg-implications-stage linreg-implications-s3">
    <rect class="linreg-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-implications-step" x="752" y="142">04</text>
    <text class="linreg-implications-name" x="778" y="142">And coefficients get read as causal effects</text>
    <text class="linreg-implications-desc" x="752" y="166">Which they are not, and</text>
    <text class="linreg-implications-desc" x="752" y="182">stakeholders will assume</text>
    <text class="linreg-implications-desc" x="752" y="198">otherwise.</text>
  </g>
  <text class="linreg-implications-sub" x="30" y="304">Anticipating the causal misreading is part of presenting the model: the number will be quoted as an effect regardless of how carefully it was qualified.</text>
</svg>
