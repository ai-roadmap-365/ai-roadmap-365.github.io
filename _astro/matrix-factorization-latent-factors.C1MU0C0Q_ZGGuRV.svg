<svg role="img" aria-label="Matrix factorization diagram decomposing a sparse user item rating matrix R into dense user embedding matrix P and item embedding matrix Q with latent dimension k" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Matrix Factorization Latent Factor Decomposition</title>
  <defs>
    <linearGradient id="bg188a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card188" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg188a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MATRIX FACTORIZATION: LATENT FACTOR DECOMPOSITION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Decomposing Sparse Rating Matrix R (M x N) into User Embeddings P (M x K) and Item Embeddings Q (N x K)</text>
  <g transform="translate(40, 85)">
    <rect width="770" height="295" fill="url(#card188)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Matrix R -->
    <rect x="30" y="60" width="180" height="180" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="4"/>
    <text x="120" y="45" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">Rating Matrix R (M x N)</text>
    <text x="120" y="155" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="middle">Sparse Observed Ratings</text>
    <text x="245" y="160" fill="#f8fafc" font-family="system-ui" font-size="24" font-weight="700">≈</text>
    <!-- Matrix P -->
    <rect x="280" y="60" width="80" height="180" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="320" y="45" fill="#34d399" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">Users P (M x K)</text>
    <text x="395" y="160" fill="#f8fafc" font-family="system-ui" font-size="24" font-weight="700">×</text>
    <!-- Matrix Q^T -->
    <rect x="430" y="110" width="180" height="80" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="520" y="95" fill="#fbbf24" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">Items Q^T (K x N)</text>
    <text x="400" y="275" fill="#cbd5e1" font-family="system-ui" font-size="11" text-anchor="middle">Prediction: r_hat_{u,i} = mu + b_u + b_i + p_u . q_i | Loss: MSE with L2 Regularization</text>
  </g>
</svg>
