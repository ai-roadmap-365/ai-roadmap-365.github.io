<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="An untested control is an assumption.">
  <title>Prove the breaker trips</title>
  <style>
    .chaos-verification-bg   { fill: #f8fafc; }
    .chaos-verification-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chaos-verification-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chaos-verification-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chaos-verification-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chaos-verification-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chaos-verification-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chaos-verification-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chaos-verification-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chaos-verification-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chaos-verification-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chaos-verification-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chaos-verification-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chaos-verification-row { opacity: 1; }
    .chaos-verification-r0 { animation-delay: 0.00s; }
    .chaos-verification-r1 { animation-delay: 0.45s; }
    .chaos-verification-r2 { animation-delay: 0.90s; }
    .chaos-verification-r3 { animation-delay: 1.35s; }
    .chaos-verification-r4 { animation-delay: 1.80s; }
    .chaos-verification-row { animation: chaos-verification-reveal 7.3s ease-in-out infinite; }
    @keyframes chaos-verification-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chaos-verification-bg" width="980" height="390"/>
  <text class="chaos-verification-h1"  x="30" y="40">Prove the breaker trips</text>
  <text class="chaos-verification-sub" x="30" y="64">An untested control is an assumption.</text>
  <rect class="chaos-verification-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chaos-verification-name" x="46" y="122">Verified</text>
  <text class="chaos-verification-desc" x="46" y="142">Exercised deliberately.</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r0" x="46" y="182">Inject 500s on 5% of candidate requests</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r1" x="46" y="216">Confirm the trip within 500 ms</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r2" x="46" y="250">Inject 10-second delays</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r3" x="46" y="284">Confirm P99 alerts and load shedding</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r4" x="46" y="318">You know what a trip looks like</text>
  <rect class="chaos-verification-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chaos-verification-name" x="526" y="122">Assumed</text>
  <text class="chaos-verification-desc" x="526" y="142">Never seen to fire.</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r0" x="526" y="182">Configured, and untested</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r1" x="526" y="216">First trip happens during a real incident</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r2" x="526" y="250">Under conditions nobody rehearsed</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r3" x="526" y="284">A threshold that may be mis-set</text>
  <text class="chaos-verification-desc chaos-verification-row chaos-verification-r4" x="526" y="318">Indistinguishable from no breaker</text>
  <text class="chaos-verification-sub" x="30" y="372">This is Day 361's rule about reviews applied to controls: a mechanism you have never seen fail is indistinguishable from one that does nothing, and the difference matters only on the day it matters.</text>
</svg>
