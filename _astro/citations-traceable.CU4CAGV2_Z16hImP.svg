<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Grounding without traceability is still a claim.">
  <title>A citation makes an answer checkable</title>
  <style>
    .citations-traceable-bg   { fill: #f8fafc; }
    .citations-traceable-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-traceable-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-traceable-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-traceable-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-traceable-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-traceable-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .citations-traceable-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .citations-traceable-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .citations-traceable-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .citations-traceable-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .citations-traceable-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .citations-traceable-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .citations-traceable-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .citations-traceable-stage { opacity: 1; }

    .citations-traceable-s0 { animation-delay: 0.00s; }
    .citations-traceable-e0 { animation-delay: 0.00s; }
    .citations-traceable-s1 { animation-delay: 1.28s; }
    .citations-traceable-e1 { animation-delay: 1.28s; }
    .citations-traceable-s2 { animation-delay: 2.56s; }
    .citations-traceable-e2 { animation-delay: 2.56s; }
    .citations-traceable-s3 { animation-delay: 3.84s; }
    .citations-traceable-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .citations-traceable-conn  { animation: citations-traceable-trace 6.4s ease-in-out infinite; }
      .citations-traceable-stage { animation: citations-traceable-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes citations-traceable-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes citations-traceable-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .citations-traceable-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .citations-traceable-stage { animation: citations-traceable-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes citations-traceable-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="citations-traceable-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="citations-traceable-bg" width="980" height="322"/>
  <text class="citations-traceable-h1"  x="30" y="40">A citation makes an answer checkable</text>
  <text class="citations-traceable-sub" x="30" y="64">Grounding without traceability is still a claim.</text>
  <g class="citations-traceable-stage citations-traceable-s0">
    <rect class="citations-traceable-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="citations-traceable-step" x="44" y="142">01</text>
    <text class="citations-traceable-name" x="70" y="142">Each retrieved chunk carries an id</text>
    <text class="citations-traceable-desc" x="44" y="166">Assigned before it enters the</text>
    <text class="citations-traceable-desc" x="44" y="182">prompt, not after.</text>
  </g>
  <line class="citations-traceable-line citations-traceable-conn citations-traceable-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#citations-traceable-tip)"/>
  <g class="citations-traceable-stage citations-traceable-s1">
    <rect class="citations-traceable-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="citations-traceable-step" x="280" y="142">02</text>
    <text class="citations-traceable-name" x="306" y="142">The prompt asks for ids alongside claims</text>
    <text class="citations-traceable-desc" x="280" y="166">Part of the schema, not an</text>
    <text class="citations-traceable-desc" x="280" y="182">afterthought.</text>
    <text class="citations-traceable-edge" x="280" y="242">schema</text>
  </g>
  <line class="citations-traceable-line citations-traceable-conn citations-traceable-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#citations-traceable-tip)"/>
  <g class="citations-traceable-stage citations-traceable-s2">
    <rect class="citations-traceable-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="citations-traceable-step" x="516" y="142">03</text>
    <text class="citations-traceable-name" x="542" y="142">Validation checks the ids exist</text>
    <text class="citations-traceable-desc" x="516" y="166">A cited id that was never</text>
    <text class="citations-traceable-desc" x="516" y="182">retrieved is a fabrication, and</text>
    <text class="citations-traceable-desc" x="516" y="198">is detectable.</text>
  </g>
  <line class="citations-traceable-line citations-traceable-conn citations-traceable-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#citations-traceable-tip)"/>
  <g class="citations-traceable-stage citations-traceable-s3">
    <rect class="citations-traceable-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="citations-traceable-step" x="752" y="142">04</text>
    <text class="citations-traceable-name" x="778" y="142">The reader can follow it</text>
    <text class="citations-traceable-desc" x="752" y="166">Claim to passage, in one click.</text>
    <text class="citations-traceable-desc" x="752" y="182">Now the answer is checkable.</text>
  </g>
  <text class="citations-traceable-sub" x="30" y="304">The third step is what makes this more than presentation: comparing cited ids against retrieved ids turns an unverifiable claim into an automated check you can run over an evaluation set.</text>
</svg>
