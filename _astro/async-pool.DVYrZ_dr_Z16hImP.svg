<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four requirements beyond one subprocess.">
  <title>Managing several servers at once</title>
  <style>
    .async-pool-bg   { fill: #f8fafc; }
    .async-pool-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-pool-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-pool-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-pool-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-pool-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .async-pool-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .async-pool-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .async-pool-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .async-pool-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .async-pool-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .async-pool-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .async-pool-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .async-pool-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .async-pool-stage { opacity: 1; }

    .async-pool-s0 { animation-delay: 0.00s; }
    .async-pool-e0 { animation-delay: 0.00s; }
    .async-pool-s1 { animation-delay: 1.28s; }
    .async-pool-e1 { animation-delay: 1.28s; }
    .async-pool-s2 { animation-delay: 2.56s; }
    .async-pool-e2 { animation-delay: 2.56s; }
    .async-pool-s3 { animation-delay: 3.84s; }
    .async-pool-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .async-pool-conn  { animation: async-pool-trace 6.4s ease-in-out infinite; }
      .async-pool-stage { animation: async-pool-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes async-pool-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes async-pool-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .async-pool-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .async-pool-stage { animation: async-pool-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes async-pool-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="async-pool-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="async-pool-bg" width="980" height="322"/>
  <text class="async-pool-h1"  x="30" y="40">Managing several servers at once</text>
  <text class="async-pool-sub" x="30" y="64">Four requirements beyond one subprocess.</text>
  <g class="async-pool-stage async-pool-s0">
    <rect class="async-pool-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="async-pool-step" x="44" y="142">01</text>
    <text class="async-pool-name" x="70" y="142">Asynchronous pipes</text>
    <text class="async-pool-desc" x="44" y="166">Synchronous threads per server</text>
    <text class="async-pool-desc" x="44" y="182">produce latency and race</text>
    <text class="async-pool-desc" x="44" y="198">conditions.</text>
  </g>
  <line class="async-pool-line async-pool-conn async-pool-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#async-pool-tip)"/>
  <g class="async-pool-stage async-pool-s1">
    <rect class="async-pool-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="async-pool-step" x="280" y="142">02</text>
    <text class="async-pool-name" x="306" y="142">Detect a closed pipe</text>
    <text class="async-pool-desc" x="280" y="166">EOFError on readline. A segfault</text>
    <text class="async-pool-desc" x="280" y="182">or an OOM kill looks like</text>
    <text class="async-pool-desc" x="280" y="198">silence.</text>
  </g>
  <line class="async-pool-line async-pool-conn async-pool-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#async-pool-tip)"/>
  <g class="async-pool-stage async-pool-s2">
    <rect class="async-pool-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="async-pool-step" x="516" y="142">03</text>
    <text class="async-pool-name" x="542" y="142">Respawn and re-handshake</text>
    <text class="async-pool-desc" x="516" y="166">Reconnect, re-initialise,</text>
    <text class="async-pool-desc" x="516" y="182">re-list. The agent continues.</text>
  </g>
  <line class="async-pool-line async-pool-conn async-pool-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#async-pool-tip)"/>
  <g class="async-pool-stage async-pool-s3">
    <rect class="async-pool-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="async-pool-step" x="752" y="142">04</text>
    <text class="async-pool-name" x="778" y="142">Bound the pool</text>
    <text class="async-pool-desc" x="752" y="166">File descriptors are finite.</text>
    <text class="async-pool-desc" x="752" y="182">Close unused pipes deliberately.</text>
  </g>
  <text class="async-pool-sub" x="30" y="304">Respawning is Day 333's reconciliation loop at process scale: the client compares which servers should be running against which are, and closes the gap without asking why the gap appeared.</text>
</svg>
