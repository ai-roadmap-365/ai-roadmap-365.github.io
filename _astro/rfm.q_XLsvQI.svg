<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The recency-frequency-value framework</title>
  <style>
    .rfm-bg   { fill: #f8fafc; }
    .rfm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rfm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rfm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rfm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rfm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rfm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rfm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rfm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rfm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rfm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rfm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rfm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rfm-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rfm-stage { opacity: 1; }

    .rfm-s0 { animation-delay: 0.00s; }
    .rfm-e0 { animation-delay: 0.00s; }
    .rfm-s1 { animation-delay: 1.28s; }
    .rfm-e1 { animation-delay: 1.28s; }
    .rfm-s2 { animation-delay: 2.56s; }
    .rfm-e2 { animation-delay: 2.56s; }
    .rfm-s3 { animation-delay: 3.84s; }
    .rfm-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rfm-conn  { animation: rfm-trace 6.4s ease-in-out infinite; }
      .rfm-stage { animation: rfm-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rfm-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rfm-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rfm-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rfm-stage { animation: rfm-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rfm-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rfm-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rfm-bg" width="980" height="322"/>
  <text class="rfm-h1"  x="30" y="40">The recency-frequency-value framework</text>
  <text class="rfm-sub" x="30" y="64">Four steps.</text>
  <g class="rfm-stage rfm-s0">
    <rect class="rfm-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rfm-step" x="44" y="142">01</text>
    <text class="rfm-name" x="70" y="142">Recency: how long since the last interaction</text>
    <text class="rfm-desc" x="44" y="166">Usually the single strongest</text>
    <text class="rfm-desc" x="44" y="182">predictor.</text>
  </g>
  <line class="rfm-line rfm-conn rfm-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rfm-tip)"/>
  <g class="rfm-stage rfm-s1">
    <rect class="rfm-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rfm-step" x="280" y="142">02</text>
    <text class="rfm-name" x="306" y="142">Frequency: how often, over a window</text>
    <text class="rfm-desc" x="280" y="166">Which separates habit from</text>
    <text class="rfm-desc" x="280" y="182">one-off behaviour.</text>
  </g>
  <line class="rfm-line rfm-conn rfm-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rfm-tip)"/>
  <g class="rfm-stage rfm-s2">
    <rect class="rfm-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rfm-step" x="516" y="142">03</text>
    <text class="rfm-name" x="542" y="142">Monetary value: how much, in total or on average</text>
    <text class="rfm-desc" x="516" y="166">Which weights the business</text>
    <text class="rfm-desc" x="516" y="182">importance.</text>
  </g>
  <line class="rfm-line rfm-conn rfm-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rfm-tip)"/>
  <g class="rfm-stage rfm-s3">
    <rect class="rfm-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rfm-step" x="752" y="142">04</text>
    <text class="rfm-name" x="778" y="142">Combined, they describe behaviour interpretably</text>
    <text class="rfm-desc" x="752" y="166">Which is what makes the segments</text>
    <text class="rfm-desc" x="752" y="182">explainable.</text>
  </g>
  <text class="rfm-sub" x="30" y="304">These three are interpretable by construction, which is why they outperform richer feature sets for segmentation specifically: the output has to be explainable.</text>
</svg>
