<svg role="img" aria-label="PyTorch Tensor memory layout and computational autograd graph showing tensor storage stride device mapping and automatic differentiation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>PyTorch Tensor Architecture and Autograd Engine</title>
  <defs>
    <linearGradient id="bg202a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card202" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg202a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PYTORCH TENSOR ARCHITECTURE &amp; AUTOGRAD ENGINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Dynamic Computational Graph, Memory Strides, Device Agnosticism, and Automatic Differentiation</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card202)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Tensor Memory Block -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="50" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Tensor Internal Structure</text>
    <rect x="40" y="70" width="190" height="35" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="92" fill="#cbd5e1" font-size="9" text-anchor="middle">Storage Pointer (Flat 1D Array)</text>
    <rect x="40" y="115" width="190" height="35" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="137" fill="#cbd5e1" font-size="9" text-anchor="middle">Shape: (B, C, H, W) | Strides</text>
    <rect x="40" y="160" width="190" height="35" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="182" fill="#cbd5e1" font-size="9" text-anchor="middle">Dtype: float32, bfloat16, int64</text>
    <rect x="40" y="205" width="190" height="35" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="135" y="227" fill="#fbbf24" font-size="9" text-anchor="middle">Device: CPU / CUDA / MPS</text>

    <!-- Dynamic Autograd Graph -->
    <rect x="270" y="25" width="465" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="502" y="50" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Dynamic Tape Autograd Graph (Reverse Mode)</text>

    <!-- Node x -->
    <circle cx="330" cy="110" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="330" y="114" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">x</text>
    <text x="330" y="145" fill="#94a3b8" font-size="8" text-anchor="middle">requires_grad</text>

    <!-- Node w -->
    <circle cx="330" cy="200" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="330" y="204" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">W</text>
    <text x="330" y="235" fill="#94a3b8" font-size="8" text-anchor="middle">grad_fn=None</text>

    <!-- Op MatMul -->
    <rect x="420" y="135" width="60" height="40" fill="#1e293b" stroke="#c084fc" rx="4"/>
    <text x="450" y="160" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">MatMul</text>
    <line x1="352" y1="115" x2="420" y2="145" stroke="#64748b" stroke-width="1.5"/>
    <line x1="352" y1="195" x2="420" y2="165" stroke="#64748b" stroke-width="1.5"/>

    <!-- Op ReLU -->
    <rect x="540" y="135" width="50" height="40" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="565" y="160" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">ReLU</text>
    <line x1="480" y1="155" x2="540" y2="155" stroke="#64748b" stroke-width="1.5"/>

    <!-- Scalar Loss L -->
    <circle cx="670" cy="155" r="24" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="670" y="159" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">Loss</text>
    <line x1="590" y1="155" x2="646" y2="155" stroke="#64748b" stroke-width="1.5"/>
    <text x="670" y="200" fill="#34d399" font-size="9" text-anchor="middle">loss.backward()</text>
  </g>
</svg>
