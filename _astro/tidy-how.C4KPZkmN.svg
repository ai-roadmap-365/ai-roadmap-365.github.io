<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>What tidy data means</title>
  <style>
    .tidy-how-bg   { fill: #f8fafc; }
    .tidy-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tidy-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tidy-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tidy-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tidy-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tidy-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tidy-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tidy-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tidy-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tidy-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tidy-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tidy-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tidy-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tidy-how-stage { opacity: 1; }

    .tidy-how-s0 { animation-delay: 0.00s; }
    .tidy-how-e0 { animation-delay: 0.00s; }
    .tidy-how-s1 { animation-delay: 1.28s; }
    .tidy-how-e1 { animation-delay: 1.28s; }
    .tidy-how-s2 { animation-delay: 2.56s; }
    .tidy-how-e2 { animation-delay: 2.56s; }
    .tidy-how-s3 { animation-delay: 3.84s; }
    .tidy-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tidy-how-conn  { animation: tidy-how-trace 6.4s ease-in-out infinite; }
      .tidy-how-stage { animation: tidy-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tidy-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tidy-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tidy-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tidy-how-stage { animation: tidy-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tidy-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tidy-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tidy-how-bg" width="980" height="322"/>
  <text class="tidy-how-h1"  x="30" y="40">What tidy data means</text>
  <text class="tidy-how-sub" x="30" y="64">Four rules.</text>
  <g class="tidy-how-stage tidy-how-s0">
    <rect class="tidy-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tidy-how-step" x="44" y="142">01</text>
    <text class="tidy-how-name" x="70" y="142">Each variable is one column</text>
    <text class="tidy-how-desc" x="44" y="166">Not spread across several.</text>
  </g>
  <line class="tidy-how-line tidy-how-conn tidy-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tidy-how-tip)"/>
  <g class="tidy-how-stage tidy-how-s1">
    <rect class="tidy-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tidy-how-step" x="280" y="142">02</text>
    <text class="tidy-how-name" x="306" y="142">Each observation is one row</text>
    <text class="tidy-how-desc" x="280" y="166">Not several columns of one row.</text>
  </g>
  <line class="tidy-how-line tidy-how-conn tidy-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tidy-how-tip)"/>
  <g class="tidy-how-stage tidy-how-s2">
    <rect class="tidy-how-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tidy-how-step" x="516" y="142">03</text>
    <text class="tidy-how-name" x="542" y="142">Each value has its own cell</text>
    <text class="tidy-how-desc" x="516" y="166">Nothing packed into a string.</text>
  </g>
  <line class="tidy-how-line tidy-how-conn tidy-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tidy-how-tip)"/>
  <g class="tidy-how-stage tidy-how-s3">
    <rect class="tidy-how-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tidy-how-step" x="752" y="142">04</text>
    <text class="tidy-how-name" x="778" y="142">And every tool then works without reshaping</text>
    <text class="tidy-how-desc" x="752" y="166">Which is why it matters.</text>
  </g>
  <text class="tidy-how-sub" x="30" y="304">Tidy form is worth the initial reshaping because grouping, plotting and modelling all assume it, and fighting each of them separately costs far more.</text>
</svg>
