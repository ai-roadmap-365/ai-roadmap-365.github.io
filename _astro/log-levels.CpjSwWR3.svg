<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four of them.">
  <title>Choosing a level</title>
  <style>
    .log-levels-bg   { fill: #f8fafc; }
    .log-levels-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-levels-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-levels-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-levels-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-levels-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-levels-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .log-levels-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .log-levels-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .log-levels-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .log-levels-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .log-levels-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .log-levels-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .log-levels-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .log-levels-stage { opacity: 1; }

    .log-levels-s0 { animation-delay: 0.00s; }
    .log-levels-e0 { animation-delay: 0.00s; }
    .log-levels-s1 { animation-delay: 1.28s; }
    .log-levels-e1 { animation-delay: 1.28s; }
    .log-levels-s2 { animation-delay: 2.56s; }
    .log-levels-e2 { animation-delay: 2.56s; }
    .log-levels-s3 { animation-delay: 3.84s; }
    .log-levels-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .log-levels-conn  { animation: log-levels-trace 6.4s ease-in-out infinite; }
      .log-levels-stage { animation: log-levels-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes log-levels-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes log-levels-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .log-levels-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .log-levels-stage { animation: log-levels-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes log-levels-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="log-levels-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="log-levels-bg" width="980" height="322"/>
  <text class="log-levels-h1"  x="30" y="40">Choosing a level</text>
  <text class="log-levels-sub" x="30" y="64">Four of them.</text>
  <g class="log-levels-stage log-levels-s0">
    <rect class="log-levels-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="log-levels-step" x="44" y="142">01</text>
    <text class="log-levels-name" x="70" y="142">Debug: detail for someone diagnosing a problem</text>
    <text class="log-levels-desc" x="44" y="166">Off in production, usually.</text>
  </g>
  <line class="log-levels-line log-levels-conn log-levels-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#log-levels-tip)"/>
  <g class="log-levels-stage log-levels-s1">
    <rect class="log-levels-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="log-levels-step" x="280" y="142">02</text>
    <text class="log-levels-name" x="306" y="142">Info: the normal course of events</text>
    <text class="log-levels-desc" x="280" y="166">What happened, and when.</text>
  </g>
  <line class="log-levels-line log-levels-conn log-levels-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#log-levels-tip)"/>
  <g class="log-levels-stage log-levels-s2">
    <rect class="log-levels-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="log-levels-step" x="516" y="142">03</text>
    <text class="log-levels-name" x="542" y="142">Warning: something unexpected, but handled</text>
    <text class="log-levels-desc" x="516" y="166">Worth noticing, not acting on.</text>
  </g>
  <line class="log-levels-line log-levels-conn log-levels-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#log-levels-tip)"/>
  <g class="log-levels-stage log-levels-s3">
    <rect class="log-levels-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="log-levels-step" x="752" y="142">04</text>
    <text class="log-levels-name" x="778" y="142">And error: something failed and needs attention</text>
    <text class="log-levels-desc" x="752" y="166">Which should reach a person.</text>
  </g>
  <text class="log-levels-sub" x="30" y="304">Levels only work if they are used consistently, and the common failure is logging everything at one level, which makes the whole scheme useless.</text>
</svg>
