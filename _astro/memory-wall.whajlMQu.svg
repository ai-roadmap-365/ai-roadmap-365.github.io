<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Processors got fast much quicker than memory got close.">
  <title>The gap that every tier since exists to hide</title>
  <style>
    .memory-wall-bg   { fill: #f8fafc; }
    .memory-wall-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-wall-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-wall-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-wall-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-wall-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-wall-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .memory-wall-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .memory-wall-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .memory-wall-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .memory-wall-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .memory-wall-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .memory-wall-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .memory-wall-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .memory-wall-stage { opacity: 1; }

    .memory-wall-s0 { animation-delay: 0.00s; }
    .memory-wall-e0 { animation-delay: 0.00s; }
    .memory-wall-s1 { animation-delay: 1.28s; }
    .memory-wall-e1 { animation-delay: 1.28s; }
    .memory-wall-s2 { animation-delay: 2.56s; }
    .memory-wall-e2 { animation-delay: 2.56s; }
    .memory-wall-s3 { animation-delay: 3.84s; }
    .memory-wall-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .memory-wall-conn  { animation: memory-wall-trace 6.4s ease-in-out infinite; }
      .memory-wall-stage { animation: memory-wall-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes memory-wall-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes memory-wall-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .memory-wall-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .memory-wall-stage { animation: memory-wall-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes memory-wall-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="memory-wall-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="memory-wall-bg" width="980" height="322"/>
  <text class="memory-wall-h1"  x="30" y="40">The gap that every tier since exists to hide</text>
  <text class="memory-wall-sub" x="30" y="64">Processors got fast much quicker than memory got close.</text>
  <g class="memory-wall-stage memory-wall-s0">
    <rect class="memory-wall-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="memory-wall-step" x="44" y="142">01</text>
    <text class="memory-wall-name" x="70" y="142">1970s</text>
    <text class="memory-wall-desc" x="44" y="166">Processor and memory speeds are</text>
    <text class="memory-wall-desc" x="44" y="182">comparable.</text>
    <text class="memory-wall-edge" x="44" y="242">no cache needed</text>
  </g>
  <line class="memory-wall-line memory-wall-conn memory-wall-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#memory-wall-tip)"/>
  <g class="memory-wall-stage memory-wall-s1">
    <rect class="memory-wall-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="memory-wall-step" x="280" y="142">02</text>
    <text class="memory-wall-name" x="306" y="142">1980s</text>
    <text class="memory-wall-desc" x="280" y="166">Processors accelerate; memory</text>
    <text class="memory-wall-desc" x="280" y="182">does not keep up.</text>
    <text class="memory-wall-edge" x="280" y="242">the wall opens</text>
  </g>
  <line class="memory-wall-line memory-wall-conn memory-wall-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#memory-wall-tip)"/>
  <g class="memory-wall-stage memory-wall-s2">
    <rect class="memory-wall-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="memory-wall-step" x="516" y="142">03</text>
    <text class="memory-wall-name" x="542" y="142">1990s-2000s</text>
    <text class="memory-wall-desc" x="516" y="166">One cache becomes two, then</text>
    <text class="memory-wall-desc" x="516" y="182">three.</text>
    <text class="memory-wall-edge" x="516" y="242">L1, L2, L3</text>
  </g>
  <line class="memory-wall-line memory-wall-conn memory-wall-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#memory-wall-tip)"/>
  <g class="memory-wall-stage memory-wall-s3">
    <rect class="memory-wall-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="memory-wall-step" x="752" y="142">04</text>
    <text class="memory-wall-name" x="778" y="142">2016-</text>
    <text class="memory-wall-desc" x="752" y="166">Stacked memory on accelerators,</text>
    <text class="memory-wall-desc" x="752" y="182">terabytes per second.</text>
    <text class="memory-wall-edge" x="752" y="242">HBM</text>
  </g>
  <text class="memory-wall-sub" x="30" y="304">The wall never closed. Every tier in the pyramid is a way of hiding it.</text>
</svg>
