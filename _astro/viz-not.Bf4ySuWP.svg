<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a loss surface picture is not</title>
  <style>
    .viz-not-bg   { fill: #f8fafc; }
    .viz-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .viz-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .viz-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .viz-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .viz-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .viz-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz-not-row { opacity: 1; }
    .viz-not-r0 { animation-delay: 0.00s; }
    .viz-not-r1 { animation-delay: 0.45s; }
    .viz-not-r2 { animation-delay: 0.90s; }
    .viz-not-r3 { animation-delay: 1.35s; }
    .viz-not-r4 { animation-delay: 1.80s; }
    .viz-not-row { animation: viz-not-reveal 7.3s ease-in-out infinite; }
    @keyframes viz-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="viz-not-bg" width="980" height="390"/>
  <text class="viz-not-h1"  x="30" y="40">Four things a loss surface picture is not</text>
  <text class="viz-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="viz-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="viz-not-name" x="46" y="122">The misconception</text>
  <text class="viz-not-desc" x="46" y="142">Commonly held.</text>
  <text class="viz-not-desc viz-not-row viz-not-r0" x="46" y="182">The picture shows the real surface</text>
  <text class="viz-not-desc viz-not-row viz-not-r1" x="46" y="216">Local minima are the main obstacle</text>
  <text class="viz-not-desc viz-not-row viz-not-r2" x="46" y="250">A smooth-looking basin is smooth</text>
  <text class="viz-not-desc viz-not-row viz-not-r3" x="46" y="284">Two dimensions is representative</text>
  <text class="viz-not-desc viz-not-row viz-not-r4" x="46" y="318">Training loss tells you enough</text>
  <rect class="viz-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="viz-not-name" x="526" y="122">What is true</text>
  <text class="viz-not-desc" x="526" y="142">Actually.</text>
  <text class="viz-not-desc viz-not-row viz-not-r0" x="526" y="182">It is a two-dimensional slice</text>
  <text class="viz-not-desc viz-not-row viz-not-r1" x="526" y="216">Saddles and plateaus dominate</text>
  <text class="viz-not-desc viz-not-row viz-not-r2" x="526" y="250">Only along the chosen directions</text>
  <text class="viz-not-desc viz-not-row viz-not-r3" x="526" y="284">A million dimensions are not summarised by two</text>
  <text class="viz-not-desc viz-not-row viz-not-r4" x="526" y="318">Validation loss is what matters</text>
  <text class="viz-not-sub" x="30" y="372">The saddle point is the correction most worth internalising, because the mental image of a bumpy landscape full of traps is simply not what happens at scale.</text>
</svg>
