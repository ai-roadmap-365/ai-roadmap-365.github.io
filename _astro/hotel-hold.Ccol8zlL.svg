<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Reserved, spent, reconciled.">
  <title>A hotel incidental hold</title>
  <style>
    .hotel-hold-bg   { fill: #f8fafc; }
    .hotel-hold-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hotel-hold-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hotel-hold-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hotel-hold-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hotel-hold-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hotel-hold-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hotel-hold-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hotel-hold-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hotel-hold-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hotel-hold-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hotel-hold-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hotel-hold-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hotel-hold-row { opacity: 1; }
    .hotel-hold-r0 { animation-delay: 0.00s; }
    .hotel-hold-r1 { animation-delay: 0.45s; }
    .hotel-hold-r2 { animation-delay: 0.90s; }
    .hotel-hold-r3 { animation-delay: 1.35s; }
    .hotel-hold-r4 { animation-delay: 1.80s; }
    .hotel-hold-row { animation: hotel-hold-reveal 7.3s ease-in-out infinite; }
    @keyframes hotel-hold-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hotel-hold-bg" width="980" height="390"/>
  <text class="hotel-hold-h1"  x="30" y="40">A hotel incidental hold</text>
  <text class="hotel-hold-sub" x="30" y="64">Reserved, spent, reconciled.</text>
  <rect class="hotel-hold-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hotel-hold-name" x="46" y="122">Hold, then settle</text>
  <text class="hotel-hold-desc" x="46" y="142">Three steps.</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r0" x="46" y="182">A hold placed at check-in</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r1" x="46" y="216">Charges accumulate during the stay</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r2" x="46" y="250">The exact bill computed at check-out</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r3" x="46" y="284">The remainder of the hold released</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r4" x="46" y="318">Neither party is exposed</text>
  <rect class="hotel-hold-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hotel-hold-name" x="526" y="122">Charge afterwards</text>
  <text class="hotel-hold-desc" x="526" y="142">One step, and a risk.</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r0" x="526" y="182">No hold placed</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r1" x="526" y="216">Charges accumulate freely</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r2" x="526" y="250">The card may decline at check-out</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r3" x="526" y="284">The service was already provided</text>
  <text class="hotel-hold-desc hotel-hold-row hotel-hold-r4" x="526" y="318">The hotel absorbs the loss</text>
  <text class="hotel-hold-sub" x="30" y="372">Every AI platform without pre-authorisation is the right-hand column: the tokens are spent with a provider before anybody checks whether the customer can pay for them.</text>
</svg>
