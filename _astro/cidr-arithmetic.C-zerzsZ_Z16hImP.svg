<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The number is how many bits are fixed. The rest are yours.">
  <title>Reading a slash number</title>
  <style>
    .cidr-arithmetic-bg   { fill: #f8fafc; }
    .cidr-arithmetic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cidr-arithmetic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cidr-arithmetic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cidr-arithmetic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cidr-arithmetic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cidr-arithmetic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cidr-arithmetic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cidr-arithmetic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cidr-arithmetic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cidr-arithmetic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cidr-arithmetic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cidr-arithmetic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cidr-arithmetic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cidr-arithmetic-stage { opacity: 1; }

    .cidr-arithmetic-s0 { animation-delay: 0.00s; }
    .cidr-arithmetic-e0 { animation-delay: 0.00s; }
    .cidr-arithmetic-s1 { animation-delay: 1.28s; }
    .cidr-arithmetic-e1 { animation-delay: 1.28s; }
    .cidr-arithmetic-s2 { animation-delay: 2.56s; }
    .cidr-arithmetic-e2 { animation-delay: 2.56s; }
    .cidr-arithmetic-s3 { animation-delay: 3.84s; }
    .cidr-arithmetic-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cidr-arithmetic-conn  { animation: cidr-arithmetic-trace 6.4s ease-in-out infinite; }
      .cidr-arithmetic-stage { animation: cidr-arithmetic-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cidr-arithmetic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cidr-arithmetic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cidr-arithmetic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cidr-arithmetic-stage { animation: cidr-arithmetic-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cidr-arithmetic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cidr-arithmetic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cidr-arithmetic-bg" width="980" height="322"/>
  <text class="cidr-arithmetic-h1"  x="30" y="40">Reading a slash number</text>
  <text class="cidr-arithmetic-sub" x="30" y="64">The number is how many bits are fixed. The rest are yours.</text>
  <g class="cidr-arithmetic-stage cidr-arithmetic-s0">
    <rect class="cidr-arithmetic-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cidr-arithmetic-step" x="44" y="142">01</text>
    <text class="cidr-arithmetic-name" x="70" y="142">/32</text>
    <text class="cidr-arithmetic-desc" x="44" y="166">All 32 bits fixed. Exactly one</text>
    <text class="cidr-arithmetic-desc" x="44" y="182">address.</text>
    <text class="cidr-arithmetic-edge" x="44" y="242">1</text>
  </g>
  <line class="cidr-arithmetic-line cidr-arithmetic-conn cidr-arithmetic-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cidr-arithmetic-tip)"/>
  <g class="cidr-arithmetic-stage cidr-arithmetic-s1">
    <rect class="cidr-arithmetic-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cidr-arithmetic-step" x="280" y="142">02</text>
    <text class="cidr-arithmetic-name" x="306" y="142">/24</text>
    <text class="cidr-arithmetic-desc" x="280" y="166">24 fixed, 8 left. The classic</text>
    <text class="cidr-arithmetic-desc" x="280" y="182">home subnet.</text>
    <text class="cidr-arithmetic-edge" x="280" y="242">256</text>
  </g>
  <line class="cidr-arithmetic-line cidr-arithmetic-conn cidr-arithmetic-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cidr-arithmetic-tip)"/>
  <g class="cidr-arithmetic-stage cidr-arithmetic-s2">
    <rect class="cidr-arithmetic-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cidr-arithmetic-step" x="516" y="142">03</text>
    <text class="cidr-arithmetic-name" x="542" y="142">/16</text>
    <text class="cidr-arithmetic-desc" x="516" y="166">16 fixed, 16 left.</text>
    <text class="cidr-arithmetic-edge" x="516" y="242">65,536</text>
  </g>
  <line class="cidr-arithmetic-line cidr-arithmetic-conn cidr-arithmetic-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cidr-arithmetic-tip)"/>
  <g class="cidr-arithmetic-stage cidr-arithmetic-s3">
    <rect class="cidr-arithmetic-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cidr-arithmetic-step" x="752" y="142">04</text>
    <text class="cidr-arithmetic-name" x="778" y="142">/8</text>
    <text class="cidr-arithmetic-desc" x="752" y="166">8 fixed, 24 left. Each step down</text>
    <text class="cidr-arithmetic-desc" x="752" y="182">doubles the block.</text>
    <text class="cidr-arithmetic-edge" x="752" y="242">16.7 million</text>
  </g>
  <text class="cidr-arithmetic-sub" x="30" y="304">This is how routers summarise: one table entry saying "everything in 93.184.216.0/24 goes this way" stands in for 256 separate addresses.</text>
</svg>
