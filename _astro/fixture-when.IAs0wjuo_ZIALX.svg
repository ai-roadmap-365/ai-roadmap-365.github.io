<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use a fixture</title>
  <style>
    .fixture-when-bg   { fill: #f8fafc; }
    .fixture-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fixture-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fixture-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fixture-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fixture-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fixture-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fixture-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fixture-when-row { opacity: 1; }
    .fixture-when-r0 { animation-delay: 0.00s; }
    .fixture-when-r1 { animation-delay: 0.45s; }
    .fixture-when-r2 { animation-delay: 0.90s; }
    .fixture-when-r3 { animation-delay: 1.35s; }
    .fixture-when-r4 { animation-delay: 1.80s; }
    .fixture-when-row { animation: fixture-when-reveal 7.3s ease-in-out infinite; }
    @keyframes fixture-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fixture-when-bg" width="980" height="390"/>
  <text class="fixture-when-h1"  x="30" y="40">When to use a fixture</text>
  <text class="fixture-when-sub" x="30" y="64">And when not to.</text>
  <rect class="fixture-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fixture-when-name" x="46" y="122">Use a fixture</text>
  <text class="fixture-when-desc" x="46" y="142">Four cases.</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r0" x="46" y="182">Setup shared by several tests</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r1" x="46" y="216">Anything needing teardown</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r2" x="46" y="250">Expensive resources worth sharing</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r3" x="46" y="284">Temporary files and directories</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r4" x="46" y="318">Where the dependency should be visible</text>
  <rect class="fixture-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fixture-when-name" x="526" y="122">Something else</text>
  <text class="fixture-when-desc" x="526" y="142">Also four.</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r0" x="526" y="182">A one-line setup used once — inline it</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r1" x="526" y="216">A plain helper function reads better</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r2" x="526" y="250">Where a literal value would do</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r3" x="526" y="284">Where the fixture would only wrap a constructor</text>
  <text class="fixture-when-desc fixture-when-row fixture-when-r4" x="526" y="318">Where it adds indirection for nothing</text>
  <text class="fixture-when-sub" x="30" y="372">Inlining a single-use setup is usually clearer than a fixture, because the reader can see the whole test without following an indirection.</text>
</svg>
