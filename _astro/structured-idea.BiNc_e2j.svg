<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four approaches, increasing in reliability.">
  <title>Getting structured output</title>
  <style>
    .structured-idea-bg   { fill: #f8fafc; }
    .structured-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structured-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .structured-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .structured-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .structured-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .structured-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .structured-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .structured-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .structured-idea-stage { opacity: 1; }

    .structured-idea-s0 { animation-delay: 0.00s; }
    .structured-idea-e0 { animation-delay: 0.00s; }
    .structured-idea-s1 { animation-delay: 1.28s; }
    .structured-idea-e1 { animation-delay: 1.28s; }
    .structured-idea-s2 { animation-delay: 2.56s; }
    .structured-idea-e2 { animation-delay: 2.56s; }
    .structured-idea-s3 { animation-delay: 3.84s; }
    .structured-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .structured-idea-conn  { animation: structured-idea-trace 6.4s ease-in-out infinite; }
      .structured-idea-stage { animation: structured-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes structured-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes structured-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .structured-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .structured-idea-stage { animation: structured-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes structured-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="structured-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="structured-idea-bg" width="980" height="322"/>
  <text class="structured-idea-h1"  x="30" y="40">Getting structured output</text>
  <text class="structured-idea-sub" x="30" y="64">Four approaches, increasing in reliability.</text>
  <g class="structured-idea-stage structured-idea-s0">
    <rect class="structured-idea-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="structured-idea-step" x="44" y="142">01</text>
    <text class="structured-idea-name" x="70" y="142">Ask for the format in words</text>
    <text class="structured-idea-desc" x="44" y="166">Which mostly works. Which is the</text>
    <text class="structured-idea-desc" x="44" y="182">problem.</text>
  </g>
  <line class="structured-idea-line structured-idea-conn structured-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#structured-idea-tip)"/>
  <g class="structured-idea-stage structured-idea-s1">
    <rect class="structured-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="structured-idea-step" x="280" y="142">02</text>
    <text class="structured-idea-name" x="306" y="142">Add examples of the exact shape</text>
    <text class="structured-idea-desc" x="280" y="166">Which raises the success rate</text>
    <text class="structured-idea-desc" x="280" y="182">noticeably.</text>
  </g>
  <line class="structured-idea-line structured-idea-conn structured-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#structured-idea-tip)"/>
  <g class="structured-idea-stage structured-idea-s2">
    <rect class="structured-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="structured-idea-step" x="516" y="142">03</text>
    <text class="structured-idea-name" x="542" y="142">Supply a schema to the provider</text>
    <text class="structured-idea-desc" x="516" y="166">So the format is part of the</text>
    <text class="structured-idea-desc" x="516" y="182">request, not the prose.</text>
  </g>
  <line class="structured-idea-line structured-idea-conn structured-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#structured-idea-tip)"/>
  <g class="structured-idea-stage structured-idea-s3">
    <rect class="structured-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="structured-idea-step" x="752" y="142">04</text>
    <text class="structured-idea-name" x="778" y="142">Or constrain the sampler directly</text>
    <text class="structured-idea-desc" x="752" y="166">Which makes invalid output</text>
    <text class="structured-idea-desc" x="752" y="182">impossible.</text>
  </g>
  <text class="structured-idea-sub" x="30" y="304">The ladder is worth climbing only as far as the failure rate requires: constrained decoding is not free, and at low volume a retry is cheaper than the machinery.</text>
</svg>
