<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Comparing models fairly</title>
  <style>
    .model-tournament-bg   { fill: #f8fafc; }
    .model-tournament-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-tournament-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-tournament-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-tournament-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-tournament-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-tournament-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-tournament-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-tournament-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-tournament-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-tournament-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-tournament-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-tournament-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .model-tournament-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .model-tournament-stage { opacity: 1; }

    .model-tournament-s0 { animation-delay: 0.00s; }
    .model-tournament-e0 { animation-delay: 0.00s; }
    .model-tournament-s1 { animation-delay: 1.28s; }
    .model-tournament-e1 { animation-delay: 1.28s; }
    .model-tournament-s2 { animation-delay: 2.56s; }
    .model-tournament-e2 { animation-delay: 2.56s; }
    .model-tournament-s3 { animation-delay: 3.84s; }
    .model-tournament-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .model-tournament-conn  { animation: model-tournament-trace 6.4s ease-in-out infinite; }
      .model-tournament-stage { animation: model-tournament-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes model-tournament-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes model-tournament-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .model-tournament-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .model-tournament-stage { animation: model-tournament-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes model-tournament-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="model-tournament-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="model-tournament-bg" width="980" height="322"/>
  <text class="model-tournament-h1"  x="30" y="40">Comparing models fairly</text>
  <text class="model-tournament-sub" x="30" y="64">Four steps.</text>
  <g class="model-tournament-stage model-tournament-s0">
    <rect class="model-tournament-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="model-tournament-step" x="44" y="142">01</text>
    <text class="model-tournament-name" x="70" y="142">Use identical folds for every model</text>
    <text class="model-tournament-desc" x="44" y="166">Or you are comparing splits, not</text>
    <text class="model-tournament-desc" x="44" y="182">models.</text>
  </g>
  <line class="model-tournament-line model-tournament-conn model-tournament-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#model-tournament-tip)"/>
  <g class="model-tournament-stage model-tournament-s1">
    <rect class="model-tournament-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="model-tournament-step" x="280" y="142">02</text>
    <text class="model-tournament-name" x="306" y="142">Run each inside the same preprocessing pipeline</text>
    <text class="model-tournament-desc" x="280" y="166">Fitted per fold.</text>
  </g>
  <line class="model-tournament-line model-tournament-conn model-tournament-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#model-tournament-tip)"/>
  <g class="model-tournament-stage model-tournament-s2">
    <rect class="model-tournament-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="model-tournament-step" x="516" y="142">03</text>
    <text class="model-tournament-name" x="542" y="142">Repeat across several seeds</text>
    <text class="model-tournament-desc" x="516" y="166">Because a single run is noisy.</text>
  </g>
  <line class="model-tournament-line model-tournament-conn model-tournament-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#model-tournament-tip)"/>
  <g class="model-tournament-stage model-tournament-s3">
    <rect class="model-tournament-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="model-tournament-step" x="752" y="142">04</text>
    <text class="model-tournament-name" x="778" y="142">And compare distributions, not best scores</text>
    <text class="model-tournament-desc" x="752" y="166">Overlapping spreads mean no</text>
    <text class="model-tournament-desc" x="752" y="182">difference.</text>
  </g>
  <text class="model-tournament-sub" x="30" y="304">Comparing best scores across models rewards whichever got the luckiest seed, which is why the spread has to be reported alongside the mean.</text>
</svg>
