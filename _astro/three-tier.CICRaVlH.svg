<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Separated on purpose.">
  <title>Three tiers of system prompt</title>
  <style>
    .three-tier-bg   { fill: #f8fafc; }
    .three-tier-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-tier-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-tier-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-tier-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-tier-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-tier-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-tier-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-tier-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-tier-stage { opacity: 1; }

    .three-tier-s0 { animation-delay: 0.00s; }
    .three-tier-e0 { animation-delay: 0.00s; }
    .three-tier-s1 { animation-delay: 1.50s; }
    .three-tier-e1 { animation-delay: 1.50s; }
    .three-tier-s2 { animation-delay: 3.00s; }
    .three-tier-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-tier-conn  { animation: three-tier-trace 6s ease-in-out infinite; }
      .three-tier-stage { animation: three-tier-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-tier-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-tier-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-tier-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-tier-stage { animation: three-tier-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-tier-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-tier-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-tier-bg" width="980" height="322"/>
  <text class="three-tier-h1"  x="30" y="40">Three tiers of system prompt</text>
  <text class="three-tier-sub" x="30" y="64">Separated on purpose.</text>
  <g class="three-tier-stage three-tier-s0">
    <rect class="three-tier-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-tier-step" x="44" y="142">01</text>
    <text class="three-tier-name" x="70" y="142">Identity</text>
    <text class="three-tier-desc" x="44" y="166">Who the assistant is, and how it speaks.</text>
    <text class="three-tier-desc" x="44" y="182">Changes with the product.</text>
  </g>
  <line class="three-tier-line three-tier-conn three-tier-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-tier-tip)"/>
  <g class="three-tier-stage three-tier-s1">
    <rect class="three-tier-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-tier-step" x="359" y="142">02</text>
    <text class="three-tier-name" x="385" y="142">Capability</text>
    <text class="three-tier-desc" x="359" y="166">What it can do, and the tools it has. Changes</text>
    <text class="three-tier-desc" x="359" y="182">with the release.</text>
  </g>
  <line class="three-tier-line three-tier-conn three-tier-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-tier-tip)"/>
  <g class="three-tier-stage three-tier-s2">
    <rect class="three-tier-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-tier-step" x="674" y="142">03</text>
    <text class="three-tier-name" x="700" y="142">Constraints</text>
    <text class="three-tier-desc" x="674" y="166">What it must never do. Changes almost never.</text>
  </g>
  <text class="three-tier-sub" x="30" y="304">Keeping the layers separate is what stops a tone adjustment from quietly weakening a safety rule, which is the most common way system prompts regress.</text>
</svg>
