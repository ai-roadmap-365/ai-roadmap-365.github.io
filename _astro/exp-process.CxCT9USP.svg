<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Running an analysis end to end</title>
  <style>
    .exp-process-bg   { fill: #f8fafc; }
    .exp-process-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-process-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-process-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-process-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-process-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-process-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exp-process-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exp-process-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exp-process-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exp-process-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exp-process-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exp-process-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exp-process-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exp-process-stage { opacity: 1; }

    .exp-process-s0 { animation-delay: 0.00s; }
    .exp-process-e0 { animation-delay: 0.00s; }
    .exp-process-s1 { animation-delay: 1.28s; }
    .exp-process-e1 { animation-delay: 1.28s; }
    .exp-process-s2 { animation-delay: 2.56s; }
    .exp-process-e2 { animation-delay: 2.56s; }
    .exp-process-s3 { animation-delay: 3.84s; }
    .exp-process-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exp-process-conn  { animation: exp-process-trace 6.4s ease-in-out infinite; }
      .exp-process-stage { animation: exp-process-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exp-process-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exp-process-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exp-process-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exp-process-stage { animation: exp-process-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exp-process-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exp-process-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exp-process-bg" width="980" height="322"/>
  <text class="exp-process-h1"  x="30" y="40">Running an analysis end to end</text>
  <text class="exp-process-sub" x="30" y="64">Four steps.</text>
  <g class="exp-process-stage exp-process-s0">
    <rect class="exp-process-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exp-process-step" x="44" y="142">01</text>
    <text class="exp-process-name" x="70" y="142">Write the analysis plan before collecting data</text>
    <text class="exp-process-desc" x="44" y="166">Which prevents the search for</text>
    <text class="exp-process-desc" x="44" y="182">significance.</text>
  </g>
  <line class="exp-process-line exp-process-conn exp-process-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exp-process-tip)"/>
  <g class="exp-process-stage exp-process-s1">
    <rect class="exp-process-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exp-process-step" x="280" y="142">02</text>
    <text class="exp-process-name" x="306" y="142">Check the groups actually balanced</text>
    <text class="exp-process-desc" x="280" y="166">And that assignment worked.</text>
  </g>
  <line class="exp-process-line exp-process-conn exp-process-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exp-process-tip)"/>
  <g class="exp-process-stage exp-process-s2">
    <rect class="exp-process-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exp-process-step" x="516" y="142">03</text>
    <text class="exp-process-name" x="542" y="142">Estimate the effect with an interval</text>
    <text class="exp-process-desc" x="516" y="166">Not merely a verdict.</text>
  </g>
  <line class="exp-process-line exp-process-conn exp-process-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exp-process-tip)"/>
  <g class="exp-process-stage exp-process-s3">
    <rect class="exp-process-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exp-process-step" x="752" y="142">04</text>
    <text class="exp-process-name" x="778" y="142">And report everything, including what failed</text>
    <text class="exp-process-desc" x="752" y="166">Which is what makes it credible.</text>
  </g>
  <text class="exp-process-sub" x="30" y="304">Reporting what failed is the practice that distinguishes an honest analysis from a persuasive one, and it is what allows anyone else to trust the result.</text>
</svg>
