<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three common misreadings.">
  <title>What it is not</title>
  <style>
    .not-classifier-bg   { fill: #f8fafc; }
    .not-classifier-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-classifier-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-classifier-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-classifier-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-classifier-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-classifier-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-classifier-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-classifier-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-classifier-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-classifier-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-classifier-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-classifier-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-classifier-row { opacity: 1; }
    .not-classifier-r0 { animation-delay: 0.00s; }
    .not-classifier-r1 { animation-delay: 0.45s; }
    .not-classifier-r2 { animation-delay: 0.90s; }
    .not-classifier-r3 { animation-delay: 1.35s; }
    .not-classifier-r4 { animation-delay: 1.80s; }
    .not-classifier-row { animation: not-classifier-reveal 7.3s ease-in-out infinite; }
    @keyframes not-classifier-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-classifier-bg" width="980" height="390"/>
  <text class="not-classifier-h1"  x="30" y="40">What it is not</text>
  <text class="not-classifier-sub" x="30" y="64">Three common misreadings.</text>
  <rect class="not-classifier-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-classifier-name" x="46" y="122">The misconception</text>
  <text class="not-classifier-desc" x="46" y="142">Frequently assumed.</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r0" x="46" y="182">It is a regression, so it predicts numbers</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r1" x="46" y="216">Linear means it can only draw straight lines</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r2" x="46" y="250">The 0.5 threshold is part of the model</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r3" x="46" y="284">It requires balanced classes</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r4" x="46" y="318">It is too simple to be a real baseline</text>
  <rect class="not-classifier-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-classifier-name" x="526" y="122">What is true</text>
  <text class="not-classifier-desc" x="526" y="142">Actually.</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r0" x="526" y="182">It regresses log odds and classifies</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r1" x="526" y="216">Engineered features bend the boundary</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r2" x="526" y="250">The threshold is a separate business choice</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r3" x="526" y="284">It handles imbalance with reweighting</text>
  <text class="not-classifier-desc not-classifier-row not-classifier-r4" x="526" y="318">It beats complex models surprisingly often</text>
  <text class="not-classifier-sub" x="30" y="372">The threshold misconception causes real damage: a model reported as inaccurate is frequently a well-calibrated model being read at the wrong cut-off.</text>
</svg>
