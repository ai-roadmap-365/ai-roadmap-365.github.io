<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different by a factor of eighty.">
  <title>The advertised limit and the real one</title>
  <style>
    .headline-versus-binding-bg   { fill: #f8fafc; }
    .headline-versus-binding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .headline-versus-binding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .headline-versus-binding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .headline-versus-binding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .headline-versus-binding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .headline-versus-binding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .headline-versus-binding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .headline-versus-binding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .headline-versus-binding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .headline-versus-binding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .headline-versus-binding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .headline-versus-binding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .headline-versus-binding-row { opacity: 1; }
    .headline-versus-binding-r0 { animation-delay: 0.00s; }
    .headline-versus-binding-r1 { animation-delay: 0.45s; }
    .headline-versus-binding-r2 { animation-delay: 0.90s; }
    .headline-versus-binding-r3 { animation-delay: 1.35s; }
    .headline-versus-binding-r4 { animation-delay: 1.80s; }
    .headline-versus-binding-row { animation: headline-versus-binding-reveal 7.3s ease-in-out infinite; }
    @keyframes headline-versus-binding-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="headline-versus-binding-bg" width="980" height="390"/>
  <text class="headline-versus-binding-h1"  x="30" y="40">The advertised limit and the real one</text>
  <text class="headline-versus-binding-sub" x="30" y="64">Different by a factor of eighty.</text>
  <rect class="headline-versus-binding-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="headline-versus-binding-name" x="46" y="122">Advertised</text>
  <text class="headline-versus-binding-desc" x="46" y="142">Two million requests.</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r0" x="46" y="182">100x this workload's traffic</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r1" x="46" y="216">Genuinely enormous</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r2" x="46" y="250">On the front page</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r3" x="46" y="284">Chosen because developers notice it</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r4" x="46" y="318">And it never runs out</text>
  <rect class="headline-versus-binding-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="headline-versus-binding-name" x="526" y="122">Binding</text>
  <text class="headline-versus-binding-desc" x="526" y="142">One gigabyte of egress.</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r0" x="526" y="182">1.25x this workload's traffic</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r1" x="526" y="216">Not on the front page</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r2" x="526" y="250">Not on the pricing page either</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r3" x="526" y="284">A factor of eighty apart</text>
  <text class="headline-versus-binding-desc headline-versus-binding-row headline-versus-binding-r4" x="526" y="318">The tier ends here</text>
  <text class="headline-versus-binding-sub" x="30" y="372">This is the shape of nearly every free tier rather than a quirk of one provider: generous on the dimension in the headline, tight on one that is not, because that is what the budget is for.</text>
</svg>
