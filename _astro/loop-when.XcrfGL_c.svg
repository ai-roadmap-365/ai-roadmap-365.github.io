<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to loop</title>
  <style>
    .loop-when-bg   { fill: #f8fafc; }
    .loop-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loop-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loop-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loop-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loop-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loop-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-when-row { opacity: 1; }
    .loop-when-r0 { animation-delay: 0.00s; }
    .loop-when-r1 { animation-delay: 0.45s; }
    .loop-when-r2 { animation-delay: 0.90s; }
    .loop-when-r3 { animation-delay: 1.35s; }
    .loop-when-r4 { animation-delay: 1.80s; }
    .loop-when-row { animation: loop-when-reveal 7.3s ease-in-out infinite; }
    @keyframes loop-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="loop-when-bg" width="980" height="390"/>
  <text class="loop-when-h1"  x="30" y="40">When to loop</text>
  <text class="loop-when-sub" x="30" y="64">And when not to.</text>
  <rect class="loop-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="loop-when-name" x="46" y="122">Loop</text>
  <text class="loop-when-desc" x="46" y="142">Four cases.</text>
  <text class="loop-when-desc loop-when-row loop-when-r0" x="46" y="182">Side effects per item, such as writing</text>
  <text class="loop-when-desc loop-when-row loop-when-r1" x="46" y="216">Early exit on a condition</text>
  <text class="loop-when-desc loop-when-row loop-when-r2" x="46" y="250">Complex per-item logic</text>
  <text class="loop-when-desc loop-when-row loop-when-r3" x="46" y="284">Streaming something larger than memory</text>
  <text class="loop-when-desc loop-when-row loop-when-r4" x="46" y="318">Where clarity matters more than speed</text>
  <rect class="loop-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="loop-when-name" x="526" y="122">Use something else</text>
  <text class="loop-when-desc" x="526" y="142">Also four.</text>
  <text class="loop-when-desc loop-when-row loop-when-r0" x="526" y="182">Transforming or filtering — a comprehension</text>
  <text class="loop-when-desc loop-when-row loop-when-r1" x="526" y="216">Numerical work — a vectorised operation</text>
  <text class="loop-when-desc loop-when-row loop-when-r2" x="526" y="250">Aggregating — a built-in function</text>
  <text class="loop-when-desc loop-when-row loop-when-r3" x="526" y="284">Grouped work — a dataframe operation</text>
  <text class="loop-when-desc loop-when-row loop-when-r4" x="526" y="318">Where the loop would be quadratic</text>
  <text class="loop-when-sub" x="30" y="372">Writing a loop for numerical work is the most costly of these, since it discards the entire performance advantage of the array libraries underneath.</text>
</svg>
