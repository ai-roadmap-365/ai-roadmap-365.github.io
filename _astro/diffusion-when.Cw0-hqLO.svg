<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is not.">
  <title>When diffusion is the right family</title>
  <style>
    .diffusion-when-bg   { fill: #f8fafc; }
    .diffusion-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diffusion-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diffusion-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diffusion-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diffusion-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diffusion-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diffusion-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diffusion-when-row { opacity: 1; }
    .diffusion-when-r0 { animation-delay: 0.00s; }
    .diffusion-when-r1 { animation-delay: 0.45s; }
    .diffusion-when-r2 { animation-delay: 0.90s; }
    .diffusion-when-r3 { animation-delay: 1.35s; }
    .diffusion-when-r4 { animation-delay: 1.80s; }
    .diffusion-when-row { animation: diffusion-when-reveal 7.3s ease-in-out infinite; }
    @keyframes diffusion-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="diffusion-when-bg" width="980" height="390"/>
  <text class="diffusion-when-h1"  x="30" y="40">When diffusion is the right family</text>
  <text class="diffusion-when-sub" x="30" y="64">And when it is not.</text>
  <rect class="diffusion-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="diffusion-when-name" x="46" y="122">Use diffusion</text>
  <text class="diffusion-when-desc" x="46" y="142">Four cases.</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r0" x="46" y="182">Image and video generation</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r1" x="46" y="216">Audio and music synthesis</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r2" x="46" y="250">Inpainting and editing</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r3" x="46" y="284">Molecular and structural design</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r4" x="46" y="318">Where diversity matters as much as quality</text>
  <rect class="diffusion-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="diffusion-when-name" x="526" y="122">Use something else</text>
  <text class="diffusion-when-desc" x="526" y="142">Also four.</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r0" x="526" y="182">Text — autoregressive models remain better</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r1" x="526" y="216">Real-time generation at video rates</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r2" x="526" y="250">Very constrained compute budgets</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r3" x="526" y="284">Where one forward pass is the budget</text>
  <text class="diffusion-when-desc diffusion-when-row diffusion-when-r4" x="526" y="318">And exact reconstruction is needed</text>
  <text class="diffusion-when-sub" x="30" y="372">Text remains the clear exception: diffusion over discrete tokens has been tried repeatedly and autoregressive generation continues to win.</text>
</svg>
