<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things loading is not</title>
  <style>
    .load-not-bg   { fill: #f8fafc; }
    .load-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .load-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .load-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .load-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .load-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .load-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .load-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .load-not-row { opacity: 1; }
    .load-not-r0 { animation-delay: 0.00s; }
    .load-not-r1 { animation-delay: 0.45s; }
    .load-not-r2 { animation-delay: 0.90s; }
    .load-not-r3 { animation-delay: 1.35s; }
    .load-not-r4 { animation-delay: 1.80s; }
    .load-not-row { animation: load-not-reveal 7.3s ease-in-out infinite; }
    @keyframes load-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="load-not-bg" width="980" height="390"/>
  <text class="load-not-h1"  x="30" y="40">Four things loading is not</text>
  <text class="load-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="load-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="load-not-name" x="46" y="122">The misconception</text>
  <text class="load-not-desc" x="46" y="142">Commonly held.</text>
  <text class="load-not-desc load-not-row load-not-r0" x="46" y="182">If it loads, it loaded correctly</text>
  <text class="load-not-desc load-not-row load-not-r1" x="46" y="216">Type inference gets it right</text>
  <text class="load-not-desc load-not-row load-not-r2" x="46" y="250">The file format is what the extension says</text>
  <text class="load-not-desc load-not-row load-not-r3" x="46" y="284">Missing values are always blank</text>
  <text class="load-not-desc load-not-row load-not-r4" x="46" y="318">Column headers are reliable</text>
  <rect class="load-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="load-not-name" x="526" y="122">What is true</text>
  <text class="load-not-desc" x="526" y="142">Actually.</text>
  <text class="load-not-desc load-not-row load-not-r0" x="526" y="182">Silent truncation and mangling are common</text>
  <text class="load-not-desc load-not-row load-not-r1" x="526" y="216">Identifiers and dates often need declaring</text>
  <text class="load-not-desc load-not-row load-not-r2" x="526" y="250">Check the actual contents</text>
  <text class="load-not-desc load-not-row load-not-r3" x="526" y="284">They may be coded as sentinels</text>
  <text class="load-not-desc load-not-row load-not-r4" x="526" y="318">They may be duplicated or shifted</text>
  <text class="load-not-sub" x="30" y="372">Sentinel-coded missing values are a real trap, because a placeholder such as a large negative number will be averaged in as an ordinary observation.</text>
</svg>
