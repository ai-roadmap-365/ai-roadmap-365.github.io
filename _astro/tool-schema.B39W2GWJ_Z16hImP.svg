<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties that decide success.">
  <title>Describing a tool well</title>
  <style>
    .tool-schema-bg   { fill: #f8fafc; }
    .tool-schema-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-schema-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-schema-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-schema-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-schema-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-schema-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-schema-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-schema-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-schema-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-schema-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-schema-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-schema-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tool-schema-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tool-schema-stage { opacity: 1; }

    .tool-schema-s0 { animation-delay: 0.00s; }
    .tool-schema-e0 { animation-delay: 0.00s; }
    .tool-schema-s1 { animation-delay: 1.28s; }
    .tool-schema-e1 { animation-delay: 1.28s; }
    .tool-schema-s2 { animation-delay: 2.56s; }
    .tool-schema-e2 { animation-delay: 2.56s; }
    .tool-schema-s3 { animation-delay: 3.84s; }
    .tool-schema-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tool-schema-conn  { animation: tool-schema-trace 6.4s ease-in-out infinite; }
      .tool-schema-stage { animation: tool-schema-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tool-schema-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tool-schema-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tool-schema-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tool-schema-stage { animation: tool-schema-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tool-schema-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tool-schema-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tool-schema-bg" width="980" height="322"/>
  <text class="tool-schema-h1"  x="30" y="40">Describing a tool well</text>
  <text class="tool-schema-sub" x="30" y="64">Four properties that decide success.</text>
  <g class="tool-schema-stage tool-schema-s0">
    <rect class="tool-schema-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tool-schema-step" x="44" y="142">01</text>
    <text class="tool-schema-name" x="70" y="142">A name that says what it does</text>
    <text class="tool-schema-desc" x="44" y="166">Read as a verb phrase, not an</text>
    <text class="tool-schema-desc" x="44" y="182">internal identifier.</text>
  </g>
  <line class="tool-schema-line tool-schema-conn tool-schema-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tool-schema-tip)"/>
  <g class="tool-schema-stage tool-schema-s1">
    <rect class="tool-schema-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tool-schema-step" x="280" y="142">02</text>
    <text class="tool-schema-name" x="306" y="142">A description written for the model</text>
    <text class="tool-schema-desc" x="280" y="166">Including when to use it and</text>
    <text class="tool-schema-desc" x="280" y="182">when not to.</text>
  </g>
  <line class="tool-schema-line tool-schema-conn tool-schema-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tool-schema-tip)"/>
  <g class="tool-schema-stage tool-schema-s2">
    <rect class="tool-schema-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tool-schema-step" x="516" y="142">03</text>
    <text class="tool-schema-name" x="542" y="142">A parameter schema with types and required fields</text>
    <text class="tool-schema-desc" x="516" y="166">Which the provider can enforce</text>
    <text class="tool-schema-desc" x="516" y="182">during generation.</text>
  </g>
  <line class="tool-schema-line tool-schema-conn tool-schema-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tool-schema-tip)"/>
  <g class="tool-schema-stage tool-schema-s3">
    <rect class="tool-schema-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tool-schema-step" x="752" y="142">04</text>
    <text class="tool-schema-name" x="778" y="142">And explicit constraints</text>
    <text class="tool-schema-desc" x="752" y="166">Enumerations, ranges, formats.</text>
    <text class="tool-schema-desc" x="752" y="182">Ambiguity produces wrong</text>
    <text class="tool-schema-desc" x="752" y="198">arguments.</text>
  </g>
  <text class="tool-schema-sub" x="30" y="304">Most tool-calling failures are description failures rather than model failures: a tool the model calls at the wrong time was almost always described only in terms of what it does.</text>
</svg>
