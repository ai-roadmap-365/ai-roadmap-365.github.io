<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not bandwidth. Round trips.">
  <title>Every HTTP version fought the same enemy</title>
  <style>
    .http-versions-bg   { fill: #f8fafc; }
    .http-versions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-versions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-versions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-versions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-versions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-versions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .http-versions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .http-versions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .http-versions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .http-versions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .http-versions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .http-versions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .http-versions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .http-versions-stage { opacity: 1; }

    .http-versions-s0 { animation-delay: 0.00s; }
    .http-versions-e0 { animation-delay: 0.00s; }
    .http-versions-s1 { animation-delay: 1.28s; }
    .http-versions-e1 { animation-delay: 1.28s; }
    .http-versions-s2 { animation-delay: 2.56s; }
    .http-versions-e2 { animation-delay: 2.56s; }
    .http-versions-s3 { animation-delay: 3.84s; }
    .http-versions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .http-versions-conn  { animation: http-versions-trace 6.4s ease-in-out infinite; }
      .http-versions-stage { animation: http-versions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes http-versions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes http-versions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .http-versions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .http-versions-stage { animation: http-versions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes http-versions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="http-versions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="http-versions-bg" width="980" height="322"/>
  <text class="http-versions-h1"  x="30" y="40">Every HTTP version fought the same enemy</text>
  <text class="http-versions-sub" x="30" y="64">Not bandwidth. Round trips.</text>
  <g class="http-versions-stage http-versions-s0">
    <rect class="http-versions-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="http-versions-step" x="44" y="142">01</text>
    <text class="http-versions-name" x="70" y="142">HTTP/1.0</text>
    <text class="http-versions-desc" x="44" y="166">A new connection per resource.</text>
    <text class="http-versions-desc" x="44" y="182">Thirty images meant thirty</text>
    <text class="http-versions-desc" x="44" y="198">handshakes.</text>
    <text class="http-versions-edge" x="44" y="242">1990s</text>
  </g>
  <line class="http-versions-line http-versions-conn http-versions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#http-versions-tip)"/>
  <g class="http-versions-stage http-versions-s1">
    <rect class="http-versions-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="http-versions-step" x="280" y="142">02</text>
    <text class="http-versions-name" x="306" y="142">HTTP/1.1</text>
    <text class="http-versions-desc" x="280" y="166">Persistent connections: reuse</text>
    <text class="http-versions-desc" x="280" y="182">the pipe, skip the handshake.</text>
    <text class="http-versions-edge" x="280" y="242">1997</text>
  </g>
  <line class="http-versions-line http-versions-conn http-versions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#http-versions-tip)"/>
  <g class="http-versions-stage http-versions-s2">
    <rect class="http-versions-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="http-versions-step" x="516" y="142">03</text>
    <text class="http-versions-name" x="542" y="142">HTTP/2</text>
    <text class="http-versions-desc" x="516" y="166">Many requests multiplexed over</text>
    <text class="http-versions-desc" x="516" y="182">one connection, ending the</text>
    <text class="http-versions-desc" x="516" y="198">workarounds sites had built.</text>
    <text class="http-versions-edge" x="516" y="242">2015</text>
  </g>
  <line class="http-versions-line http-versions-conn http-versions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#http-versions-tip)"/>
  <g class="http-versions-stage http-versions-s3">
    <rect class="http-versions-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="http-versions-step" x="752" y="142">04</text>
    <text class="http-versions-name" x="778" y="142">HTTP/3</text>
    <text class="http-versions-desc" x="752" y="166">QUIC over UDP folds the</text>
    <text class="http-versions-desc" x="752" y="182">transport and security</text>
    <text class="http-versions-desc" x="752" y="198">handshakes into one.</text>
    <text class="http-versions-edge" x="752" y="242">1 RTT</text>
  </g>
  <text class="http-versions-sub" x="30" y="304">Read the dates against the diagram of setup cost: each version removed round trips, and none of them made the network faster.</text>
</svg>
