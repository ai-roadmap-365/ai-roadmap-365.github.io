<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Learn the shape once and you can read either.">
  <title>Both messages have the same four parts</title>
  <style>
    .message-shape-bg   { fill: #f8fafc; }
    .message-shape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-shape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-shape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-shape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-shape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-shape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .message-shape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .message-shape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .message-shape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .message-shape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .message-shape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .message-shape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .message-shape-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .message-shape-stage { opacity: 1; }

    .message-shape-s0 { animation-delay: 0.00s; }
    .message-shape-e0 { animation-delay: 0.00s; }
    .message-shape-s1 { animation-delay: 1.28s; }
    .message-shape-e1 { animation-delay: 1.28s; }
    .message-shape-s2 { animation-delay: 2.56s; }
    .message-shape-e2 { animation-delay: 2.56s; }
    .message-shape-s3 { animation-delay: 3.84s; }
    .message-shape-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .message-shape-conn  { animation: message-shape-trace 6.4s ease-in-out infinite; }
      .message-shape-stage { animation: message-shape-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes message-shape-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes message-shape-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .message-shape-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .message-shape-stage { animation: message-shape-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes message-shape-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="message-shape-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="message-shape-bg" width="980" height="322"/>
  <text class="message-shape-h1"  x="30" y="40">Both messages have the same four parts</text>
  <text class="message-shape-sub" x="30" y="64">Learn the shape once and you can read either.</text>
  <g class="message-shape-stage message-shape-s0">
    <rect class="message-shape-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="message-shape-step" x="44" y="142">01</text>
    <text class="message-shape-name" x="70" y="142">The first line</text>
    <text class="message-shape-desc" x="44" y="166">Request: method, path, version.</text>
    <text class="message-shape-desc" x="44" y="182">Response: version, code, reason.</text>
    <text class="message-shape-edge" x="44" y="242">line 1</text>
  </g>
  <line class="message-shape-line message-shape-conn message-shape-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#message-shape-tip)"/>
  <g class="message-shape-stage message-shape-s1">
    <rect class="message-shape-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="message-shape-step" x="280" y="142">02</text>
    <text class="message-shape-name" x="306" y="142">The headers</text>
    <text class="message-shape-desc" x="280" y="166">One per line, as Name: value.</text>
    <text class="message-shape-desc" x="280" y="182">Metadata about the message.</text>
  </g>
  <line class="message-shape-line message-shape-conn message-shape-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#message-shape-tip)"/>
  <g class="message-shape-stage message-shape-s2">
    <rect class="message-shape-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="message-shape-step" x="516" y="142">03</text>
    <text class="message-shape-name" x="542" y="142">A blank line</text>
    <text class="message-shape-desc" x="516" y="166">Mandatory. This is how the</text>
    <text class="message-shape-desc" x="516" y="182">receiver knows the headers</text>
    <text class="message-shape-desc" x="516" y="198">ended.</text>
    <text class="message-shape-edge" x="516" y="242">required</text>
  </g>
  <line class="message-shape-line message-shape-conn message-shape-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#message-shape-tip)"/>
  <g class="message-shape-stage message-shape-s3">
    <rect class="message-shape-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="message-shape-step" x="752" y="142">04</text>
    <text class="message-shape-name" x="778" y="142">The body</text>
    <text class="message-shape-desc" x="752" y="166">Optional. JSON, HTML, an image —</text>
    <text class="message-shape-desc" x="752" y="182">whatever Content-Type declared.</text>
  </g>
  <text class="message-shape-sub" x="30" y="304">That blank line is the single most common thing people get wrong when writing HTTP by hand, and its absence makes the server wait forever for headers that already finished.</text>
</svg>
