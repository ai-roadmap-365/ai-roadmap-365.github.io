<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Read the finish times, not the job list.">
  <title>Where the parallelism actually is</title>
  <style>
    .finish-table-bg   { fill: #f8fafc; }
    .finish-table-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finish-table-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finish-table-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finish-table-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finish-table-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finish-table-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finish-table-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .finish-table-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .finish-table-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .finish-table-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .finish-table-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .finish-table-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .finish-table-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .finish-table-stage { opacity: 1; }

    .finish-table-s0 { animation-delay: 0.00s; }
    .finish-table-e0 { animation-delay: 0.00s; }
    .finish-table-s1 { animation-delay: 1.28s; }
    .finish-table-e1 { animation-delay: 1.28s; }
    .finish-table-s2 { animation-delay: 2.56s; }
    .finish-table-e2 { animation-delay: 2.56s; }
    .finish-table-s3 { animation-delay: 3.84s; }
    .finish-table-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .finish-table-conn  { animation: finish-table-trace 6.4s ease-in-out infinite; }
      .finish-table-stage { animation: finish-table-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes finish-table-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes finish-table-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .finish-table-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .finish-table-stage { animation: finish-table-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes finish-table-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="finish-table-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="finish-table-bg" width="980" height="322"/>
  <text class="finish-table-h1"  x="30" y="40">Where the parallelism actually is</text>
  <text class="finish-table-sub" x="30" y="64">Read the finish times, not the job list.</text>
  <g class="finish-table-stage finish-table-s0">
    <rect class="finish-table-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="finish-table-step" x="44" y="142">01</text>
    <text class="finish-table-name" x="70" y="142">checkout at 0.3, install at 4.8</text>
    <text class="finish-table-desc" x="44" y="166">The head of the critical path.</text>
  </g>
  <line class="finish-table-line finish-table-conn finish-table-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#finish-table-tip)"/>
  <g class="finish-table-stage finish-table-s1">
    <rect class="finish-table-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="finish-table-step" x="280" y="142">02</text>
    <text class="finish-table-name" x="306" y="142">lint, licence-scan, docs-build, unit</text>
    <text class="finish-table-desc" x="280" y="166">All start at 4.8 — they depend</text>
    <text class="finish-table-desc" x="280" y="182">on install and nothing else.</text>
    <text class="finish-table-edge" x="280" y="242">parallel</text>
  </g>
  <line class="finish-table-line finish-table-conn finish-table-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#finish-table-tip)"/>
  <g class="finish-table-stage finish-table-s2">
    <rect class="finish-table-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="finish-table-step" x="516" y="142">03</text>
    <text class="finish-table-name" x="542" y="142">integration at 11.3</text>
    <text class="finish-table-desc" x="516" y="166">The long one on the path.</text>
  </g>
  <line class="finish-table-line finish-table-conn finish-table-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#finish-table-tip)"/>
  <g class="finish-table-stage finish-table-s3">
    <rect class="finish-table-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="finish-table-step" x="752" y="142">04</text>
    <text class="finish-table-name" x="778" y="142">deploy at 12.7</text>
    <text class="finish-table-desc" x="752" y="166">Waits for the last of three</text>
    <text class="finish-table-desc" x="752" y="182">dependencies, which is</text>
    <text class="finish-table-desc" x="752" y="198">integration.</text>
    <text class="finish-table-edge" x="752" y="242">wall clock</text>
  </g>
  <text class="finish-table-sub" x="30" y="304">The four middle jobs occupy 9.5 runner minutes and zero waiting minutes, which is exactly the shape that makes deleting them feel productive and change nothing anyone experiences.</text>
</svg>
