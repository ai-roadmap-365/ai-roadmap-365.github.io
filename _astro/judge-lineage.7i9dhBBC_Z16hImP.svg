<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Overlap failed, then G-Eval, then bias work.">
  <title>Three milestones for judges</title>
  <style>
    .judge-lineage-bg   { fill: #f8fafc; }
    .judge-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .judge-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .judge-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .judge-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .judge-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .judge-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .judge-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .judge-lineage-stage { opacity: 1; }

    .judge-lineage-s0 { animation-delay: 0.00s; }
    .judge-lineage-e0 { animation-delay: 0.00s; }
    .judge-lineage-s1 { animation-delay: 1.50s; }
    .judge-lineage-e1 { animation-delay: 1.50s; }
    .judge-lineage-s2 { animation-delay: 3.00s; }
    .judge-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .judge-lineage-conn  { animation: judge-lineage-trace 6s ease-in-out infinite; }
      .judge-lineage-stage { animation: judge-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes judge-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes judge-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .judge-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .judge-lineage-stage { animation: judge-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes judge-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="judge-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="judge-lineage-bg" width="980" height="322"/>
  <text class="judge-lineage-h1"  x="30" y="40">Three milestones for judges</text>
  <text class="judge-lineage-sub" x="30" y="64">Overlap failed, then G-Eval, then bias work.</text>
  <g class="judge-lineage-stage judge-lineage-s0">
    <rect class="judge-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="judge-lineage-step" x="44" y="142">01</text>
    <text class="judge-lineage-name" x="70" y="142">Overlap metrics fail, 2018-2022</text>
    <text class="judge-lineage-desc" x="44" y="166">BLEU and ROUGE shown to correlate near zero</text>
    <text class="judge-lineage-desc" x="44" y="182">with human judgement on dialogue.</text>
  </g>
  <line class="judge-lineage-line judge-lineage-conn judge-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#judge-lineage-tip)"/>
  <g class="judge-lineage-stage judge-lineage-s1">
    <rect class="judge-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="judge-lineage-step" x="359" y="142">02</text>
    <text class="judge-lineage-name" x="385" y="142">G-Eval, 2023</text>
    <text class="judge-lineage-desc" x="359" y="166">A multi-step rubric prompt outperforming</text>
    <text class="judge-lineage-desc" x="359" y="182">every existing automated metric.</text>
  </g>
  <line class="judge-lineage-line judge-lineage-conn judge-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#judge-lineage-tip)"/>
  <g class="judge-lineage-stage judge-lineage-s2">
    <rect class="judge-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="judge-lineage-step" x="674" y="142">03</text>
    <text class="judge-lineage-name" x="700" y="142">MT-Bench, 2023</text>
    <text class="judge-lineage-desc" x="674" y="166">Positional, verbosity and self-enhancement</text>
    <text class="judge-lineage-desc" x="674" y="182">biases documented and mitigated.</text>
  </g>
  <text class="judge-lineage-sub" x="30" y="304">The third step is what made judges usable in production rather than promising in papers: knowing the specific biases means each has a specific countermeasure rather than a general warning.</text>
</svg>
