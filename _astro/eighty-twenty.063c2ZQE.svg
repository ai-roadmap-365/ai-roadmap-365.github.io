<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four archetypes cause most outages.">
  <title>Where to spend curation effort</title>
  <style>
    .eighty-twenty-bg   { fill: #f8fafc; }
    .eighty-twenty-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eighty-twenty-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eighty-twenty-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eighty-twenty-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eighty-twenty-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eighty-twenty-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eighty-twenty-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eighty-twenty-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eighty-twenty-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eighty-twenty-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eighty-twenty-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eighty-twenty-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eighty-twenty-row { opacity: 1; }
    .eighty-twenty-r0 { animation-delay: 0.00s; }
    .eighty-twenty-r1 { animation-delay: 0.45s; }
    .eighty-twenty-r2 { animation-delay: 0.90s; }
    .eighty-twenty-r3 { animation-delay: 1.35s; }
    .eighty-twenty-r4 { animation-delay: 1.80s; }
    .eighty-twenty-row { animation: eighty-twenty-reveal 7.3s ease-in-out infinite; }
    @keyframes eighty-twenty-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eighty-twenty-bg" width="980" height="390"/>
  <text class="eighty-twenty-h1"  x="30" y="40">Where to spend curation effort</text>
  <text class="eighty-twenty-sub" x="30" y="64">Four archetypes cause most outages.</text>
  <rect class="eighty-twenty-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eighty-twenty-name" x="46" y="122">High yield</text>
  <text class="eighty-twenty-desc" x="46" y="142">Four archetypes.</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r0" x="46" y="182">Empty or missing parameters</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r1" x="46" y="216">Multi-intent queries in one message</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r2" x="46" y="250">Conflicting constraints</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r3" x="46" y="284">Unanswerable questions</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r4" x="46" y="318">150 verified examples</text>
  <rect class="eighty-twenty-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eighty-twenty-name" x="526" y="122">Low yield</text>
  <text class="eighty-twenty-desc" x="526" y="142">Volume without verification.</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r0" x="526" y="182">10,000 synthetic queries, unchecked</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r1" x="526" y="216">Mostly variations of the happy path</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r2" x="526" y="250">Noisy ground truth</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r3" x="526" y="284">A high score that means nothing</text>
  <text class="eighty-twenty-desc eighty-twenty-row eighty-twenty-r4" x="526" y="318">And expensive to run</text>
  <text class="eighty-twenty-sub" x="30" y="372">Adding ten cases a week from escalation tickets is the habit that beats any one-off curation project, because it tracks what is actually breaking rather than what was breaking when the dataset was built.</text>
</svg>
