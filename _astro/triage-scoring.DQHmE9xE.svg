<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three checks, one routing decision.">
  <title>Triaging before dispatch</title>
  <style>
    .triage-scoring-bg   { fill: #f8fafc; }
    .triage-scoring-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-scoring-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-scoring-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-scoring-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-scoring-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triage-scoring-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .triage-scoring-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .triage-scoring-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .triage-scoring-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .triage-scoring-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .triage-scoring-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .triage-scoring-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .triage-scoring-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .triage-scoring-stage { opacity: 1; }

    .triage-scoring-s0 { animation-delay: 0.00s; }
    .triage-scoring-e0 { animation-delay: 0.00s; }
    .triage-scoring-s1 { animation-delay: 1.50s; }
    .triage-scoring-e1 { animation-delay: 1.50s; }
    .triage-scoring-s2 { animation-delay: 3.00s; }
    .triage-scoring-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .triage-scoring-conn  { animation: triage-scoring-trace 6s ease-in-out infinite; }
      .triage-scoring-stage { animation: triage-scoring-arrive 6s ease-in-out infinite; }
    }
    @keyframes triage-scoring-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes triage-scoring-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .triage-scoring-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .triage-scoring-stage { animation: triage-scoring-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes triage-scoring-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="triage-scoring-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="triage-scoring-bg" width="980" height="322"/>
  <text class="triage-scoring-h1"  x="30" y="40">Triaging before dispatch</text>
  <text class="triage-scoring-sub" x="30" y="64">Three checks, one routing decision.</text>
  <g class="triage-scoring-stage triage-scoring-s0">
    <rect class="triage-scoring-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="triage-scoring-step" x="44" y="142">01</text>
    <text class="triage-scoring-name" x="70" y="142">Complexity score, 1 to 5</text>
    <text class="triage-scoring-desc" x="44" y="166">1-2 to an agent: typos, null checks,</text>
    <text class="triage-scoring-desc" x="44" y="182">deprecated calls. 4-5 to a human.</text>
    <text class="triage-scoring-edge" x="44" y="242">routing</text>
  </g>
  <line class="triage-scoring-line triage-scoring-conn triage-scoring-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#triage-scoring-tip)"/>
  <g class="triage-scoring-stage triage-scoring-s1">
    <rect class="triage-scoring-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="triage-scoring-step" x="359" y="142">02</text>
    <text class="triage-scoring-name" x="385" y="142">Impact analysis</text>
    <text class="triage-scoring-desc" x="359" y="166">AST scan for downstream modules; label by</text>
    <text class="triage-scoring-desc" x="359" y="182">component.</text>
  </g>
  <line class="triage-scoring-line triage-scoring-conn triage-scoring-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#triage-scoring-tip)"/>
  <g class="triage-scoring-stage triage-scoring-s2">
    <rect class="triage-scoring-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="triage-scoring-step" x="674" y="142">03</text>
    <text class="triage-scoring-name" x="700" y="142">Flaky test quarantine</text>
    <text class="triage-scoring-desc" x="674" y="166">Intermittent timing failures isolated rather</text>
    <text class="triage-scoring-desc" x="674" y="182">than "fixed".</text>
  </g>
  <text class="triage-scoring-sub" x="30" y="304">Triage is what keeps the acceptance rate high enough for people to keep trusting the pipeline: dispatching an agent at a complexity-5 architectural change produces a diff nobody merges.</text>
</svg>
