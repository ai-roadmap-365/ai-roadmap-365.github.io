<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" font-family="system-ui, sans-serif">
  <title>A storage decision tree: is it a big blob retrieved whole, is it structured and needing queries, does it need extreme speed — leading to object storage, a relational database, a NoSQL store, or a cache</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Which store should I use?</text>

  <!-- arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1a202c"/>
    </marker>
  </defs>

  <!-- Start -->
  <rect x="290" y="54" width="180" height="44" rx="22" fill="#1d4ed8"/>
  <text x="380" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">Start: data to store</text>

  <!-- Q1: big blob? -->
  <polygon points="380,118 500,158 380,198 260,158" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">A big blob you</text>
  <text x="380" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">fetch whole?</text>
  <line x1="380" y1="98" x2="380" y2="116" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q1 YES -> object -->
  <line x1="500" y1="158" x2="640" y2="158" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">yes</text>
  <rect x="640" y="136" width="110" height="46" rx="8" fill="#bfdbfe" stroke="#1a202c" stroke-width="1.5"/>
  <text x="695" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Object</text>
  <text x="695" y="176" text-anchor="middle" font-size="13" fill="#1a202c">storage</text>

  <!-- Q1 NO down to Q2 -->
  <line x1="380" y1="198" x2="380" y2="228" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="398" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">no</text>

  <!-- Q2: structured + queries? -->
  <polygon points="380,230 510,272 380,314 250,272" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Structured &amp; needs</text>
  <text x="380" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">queries / integrity?</text>

  <!-- Q2 YES -> relational -->
  <line x1="510" y1="272" x2="640" y2="272" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">yes</text>
  <rect x="640" y="250" width="110" height="46" rx="8" fill="#bfdbfe" stroke="#1a202c" stroke-width="1.5"/>
  <text x="695" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Relational</text>
  <text x="695" y="290" text-anchor="middle" font-size="13" fill="#1a202c">database (SQL)</text>

  <!-- Q2 NO down to Q3 -->
  <line x1="380" y1="314" x2="380" y2="344" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="398" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">no</text>

  <!-- Q3: extreme speed / just key lookups? -->
  <polygon points="380,346 512,388 380,430 248,388" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Needs extreme speed</text>
  <text x="380" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">for hot repeated reads?</text>

  <!-- Q3 YES -> cache -->
  <line x1="512" y1="388" x2="640" y2="388" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">yes</text>
  <rect x="640" y="366" width="110" height="46" rx="8" fill="#bfdbfe" stroke="#1a202c" stroke-width="1.5"/>
  <text x="695" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Cache</text>
  <text x="695" y="406" text-anchor="middle" font-size="12" fill="#1a202c">(over a real store)</text>

  <!-- Q3 NO -> NoSQL -->
  <line x1="380" y1="430" x2="380" y2="462" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="398" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">no</text>
  <rect x="270" y="464" width="220" height="52" rx="8" fill="#bfdbfe" stroke="#1a202c" stroke-width="1.5"/>
  <text x="380" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">NoSQL store</text>
  <text x="380" y="505" text-anchor="middle" font-size="12" fill="#1a202c">key-value · document · wide-column · graph</text>

  <text x="380" y="544" text-anchor="middle" font-size="13" fill="#1a202c">Simplest case of all: a handful of values one program reads? Just use a file.</text>
</svg>
