<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="d094fTitleId d094fDescId">
  <title id="d094fTitleId">A batch of raw records enters the validation boundary and the gate sorts them</title>
  <desc id="d094fDescId">Twelve raw JSON records travel from a stack into Reading.model_validate(raw). Most continue to accepted.jsonl with four typed Reading objects including RD-0001, pm25 12.4, band moderate. One token peels off to rejects.json, which shows one real error: loc humidity_pct, type less_than_equal, input 118, for record 4, RD-0005. A counter strip reads seen 12, accepted 4, rejected 8, run continues. With motion disabled every record, box and number is still shown in its resting position.</desc>

  <style>
    .d094f-bg      { fill: #f8fafc; }
    .d094f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d094f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d094f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d094f-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d094f-code    { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d094f-counter { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 16px; font-weight: 600; fill: #1a202c; }

    .d094f-box       { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d094f-stackcard { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .d094f-accbox    { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .d094f-rejbox    { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
    .d094f-counterbar{ fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; }

    /* Motion 3: gate lifts in colour as tokens arrive */
    .d094f-gate {
      fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2;
      animation: d094f-lift 5s ease-in-out infinite;
    }
    @keyframes d094f-lift {
      0%, 20%, 100% { fill: #e0e7ff; }
      8%, 14%       { fill: #bfdbfe; }
    }

    /* Motion 2: marching dashes on the two output wires */
    .d094f-wireAccept {
      fill: none; stroke: #047857; stroke-width: 2.5;
      stroke-dasharray: 10 8; animation: d094f-march 1.6s linear infinite;
    }
    .d094f-wireReject {
      fill: none; stroke: #c2410c; stroke-width: 2.5;
      stroke-dasharray: 10 8; animation: d094f-march 1.6s linear infinite;
    }
    .d094f-wireIn {
      fill: none; stroke: #1d4ed8; stroke-width: 2.5;
      stroke-dasharray: 10 8; animation: d094f-march 1.6s linear infinite;
    }
    @keyframes d094f-march { to { stroke-dashoffset: -18; } }

    /* Motion 1: tokens travelling from the stack into the gate, resting visible at the start */
    .d094f-tokenMain {
      fill: #1d4ed8; animation: d094f-travelMain 5s ease-in-out infinite;
    }
    @keyframes d094f-travelMain {
      0%   { transform: translate(0, 0);        opacity: 1; }
      10%  { transform: translate(0, 0);        opacity: 1; }
      50%  { transform: translate(380px, 0);    opacity: 1; }
      55%  { transform: translate(380px, 0);    opacity: 1; }
      92%  { transform: translate(714px, -70px); opacity: 1; }
      100% { transform: translate(714px, -70px); opacity: 1; }
    }

    .d094f-tokenReject {
      fill: #c2410c; animation: d094f-travelReject 5s ease-in-out infinite;
    }
    @keyframes d094f-travelReject {
      0%   { transform: translate(0, 0);         opacity: 1; }
      10%  { transform: translate(0, 0);         opacity: 1; }
      50%  { transform: translate(380px, 0);     opacity: 1; }
      55%  { transform: translate(380px, 0);     opacity: 1; }
      92%  { transform: translate(714px, 165px); opacity: 1; }
      100% { transform: translate(714px, 165px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d094f-gate        { animation: none; fill: #e0e7ff; }
      .d094f-wireAccept   { animation: none; stroke-dasharray: none; }
      .d094f-wireReject   { animation: none; stroke-dasharray: none; }
      .d094f-wireIn       { animation: none; stroke-dasharray: none; }
      .d094f-tokenMain    { animation: none; transform: none; opacity: 1; }
      .d094f-tokenReject  { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <rect class="d094f-bg" x="0" y="0" width="1000" height="700" />

  <text class="d094f-title" x="32" y="38">Raw records cross the boundary and the gate sorts them</text>
  <text class="d094f-sub" x="32" y="60">The batch does not crash on bad rows — each record is judged on its own.</text>

  <!-- Left: raw record stack -->
  <text class="d094f-label" x="130" y="98" text-anchor="middle">raw-readings.json — 12 records</text>
  <g>
    <rect class="d094f-stackcard" x="66" y="112" width="128" height="26" rx="4" />
    <rect class="d094f-stackcard" x="60" y="122" width="128" height="26" rx="4" />
    <rect class="d094f-stackcard" x="54" y="132" width="128" height="26" rx="4" />
    <rect class="d094f-stackcard" x="48" y="142" width="128" height="26" rx="4" />
    <rect class="d094f-stackcard" x="42" y="152" width="128" height="26" rx="4" />
    <rect class="d094f-box" x="36" y="162" width="128" height="34" rx="4" />
    <text class="d094f-code" x="100" y="184" text-anchor="middle">{ "reading_id": ... }</text>
  </g>

  <!-- Wire from stack into gate -->
  <path class="d094f-wireIn" d="M 174 220 L 388 220" marker-end="url(#d094f-arrowBlue)" />

  <!-- Middle: the gate -->
  <rect class="d094f-gate" x="392" y="184" width="216" height="72" rx="10" />
  <text class="d094f-code" x="500" y="214" text-anchor="middle">Reading.model_validate(raw)</text>
  <text class="d094f-small" x="500" y="234" text-anchor="middle">one record at a time</text>

  <!-- Wires from gate to outputs -->
  <path class="d094f-wireAccept" d="M 608 202 L 690 202 L 690 150 L 700 150" marker-end="url(#d094f-arrowGreen)" />
  <path class="d094f-wireReject" d="M 608 238 L 690 238 L 690 360 L 700 360" marker-end="url(#d094f-arrowAmber)" />

  <defs>
    <marker id="d094f-arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d094f-arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
    <marker id="d094f-arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
    </marker>
  </defs>

  <!-- Right top: accepted -->
  <rect class="d094f-accbox" x="700" y="100" width="268" height="100" rx="8" />
  <text class="d094f-label" x="716" y="126">accepted.jsonl — 4 records</text>
  <text class="d094f-code" x="716" y="150">Reading(reading_id="RD-0001",</text>
  <text class="d094f-code" x="732" y="170">pm25=12.4, band="moderate")</text>
  <text class="d094f-small" x="716" y="190">typed Reading objects, ready to use</text>

  <!-- Right bottom: rejects -->
  <rect class="d094f-rejbox" x="700" y="310" width="268" height="150" rx="8" />
  <text class="d094f-label" x="716" y="336">rejects.json — 8 records</text>
  <text class="d094f-small" x="716" y="354">record 4 (RD-0005):</text>
  <text class="d094f-code" x="716" y="376">{ "loc": ["humidity_pct"],</text>
  <text class="d094f-code" x="732" y="396">  "type": "less_than_equal",</text>
  <text class="d094f-code" x="732" y="416">  "input": 118 }</text>
  <text class="d094f-small" x="716" y="440">field-level errors, not a crash</text>

  <!-- Moving tokens, resting visible at the start (over the stack) -->
  <circle class="d094f-tokenMain" cx="120" cy="220" r="9" />
  <circle class="d094f-tokenReject" cx="120" cy="220" r="9" />

  <!-- Bottom: counter strip -->
  <rect class="d094f-counterbar" x="32" y="520" width="936" height="60" rx="10" />
  <text class="d094f-counter" x="500" y="558" text-anchor="middle">seen 12    accepted 4    rejected 8    run continues</text>

  <text class="d094f-small" x="32" y="620">Resting state: gate shaded, both wires drawn, a token waits at the stack.</text>
  <text class="d094f-small" x="32" y="642">With reduced motion requested, the animation stops and this resting state is what you see.</text>
</svg>
