<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Second-order is intractable here.">
  <title>First-order, deliberately</title>
  <style>
    .first-or-second-order-bg   { fill: #f8fafc; }
    .first-or-second-order-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-or-second-order-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-or-second-order-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-or-second-order-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-or-second-order-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-or-second-order-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .first-or-second-order-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .first-or-second-order-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .first-or-second-order-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .first-or-second-order-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .first-or-second-order-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .first-or-second-order-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .first-or-second-order-row { opacity: 1; }
    .first-or-second-order-r0 { animation-delay: 0.00s; }
    .first-or-second-order-r1 { animation-delay: 0.45s; }
    .first-or-second-order-r2 { animation-delay: 0.90s; }
    .first-or-second-order-r3 { animation-delay: 1.35s; }
    .first-or-second-order-r4 { animation-delay: 1.80s; }
    .first-or-second-order-row { animation: first-or-second-order-reveal 7.3s ease-in-out infinite; }
    @keyframes first-or-second-order-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="first-or-second-order-bg" width="980" height="390"/>
  <text class="first-or-second-order-h1"  x="30" y="40">First-order, deliberately</text>
  <text class="first-or-second-order-sub" x="30" y="64">Second-order is intractable here.</text>
  <rect class="first-or-second-order-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="first-or-second-order-name" x="46" y="122">First order</text>
  <text class="first-or-second-order-desc" x="46" y="142">Gradients only.</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r0" x="46" y="182">One value per parameter</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r1" x="46" y="216">Memory linear in parameter count</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r2" x="46" y="250">Curvature approximated by moment estimates</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r3" x="46" y="284">Practical at billions of parameters</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r4" x="46" y="318">What every deep learning optimiser is</text>
  <rect class="first-or-second-order-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="first-or-second-order-name" x="526" y="122">Second order</text>
  <text class="first-or-second-order-desc" x="526" y="142">Exact curvature.</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r0" x="526" y="182">A Hessian: parameters squared</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r1" x="526" y="216">Intractable beyond small models</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r2" x="526" y="250">Converges in far fewer steps</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r3" x="526" y="284">Each step is impossibly expensive</text>
  <text class="first-or-second-order-desc first-or-second-order-row first-or-second-order-r4" x="526" y="318">Useful on small problems only</text>
  <text class="first-or-second-order-sub" x="30" y="372">Adaptive methods are sometimes described as approximating curvature, and it is worth being precise: they scale per parameter by gradient magnitude, which is much cheaper and much weaker than curvature.</text>
</svg>
