<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What these methods are not</title>
  <style>
    .tsne-not-bg   { fill: #f8fafc; }
    .tsne-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tsne-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tsne-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tsne-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tsne-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tsne-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tsne-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tsne-not-row { opacity: 1; }
    .tsne-not-r0 { animation-delay: 0.00s; }
    .tsne-not-r1 { animation-delay: 0.45s; }
    .tsne-not-r2 { animation-delay: 0.90s; }
    .tsne-not-r3 { animation-delay: 1.35s; }
    .tsne-not-r4 { animation-delay: 1.80s; }
    .tsne-not-row { animation: tsne-not-reveal 7.3s ease-in-out infinite; }
    @keyframes tsne-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tsne-not-bg" width="980" height="390"/>
  <text class="tsne-not-h1"  x="30" y="40">What these methods are not</text>
  <text class="tsne-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="tsne-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tsne-not-name" x="46" y="122">The misconception</text>
  <text class="tsne-not-desc" x="46" y="142">Commonly held.</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r0" x="46" y="182">Cluster sizes in the plot are meaningful</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r1" x="46" y="216">Distances between clusters are meaningful</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r2" x="46" y="250">They can be used as preprocessing</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r3" x="46" y="284">The same data gives the same picture</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r4" x="46" y="318">A clear plot means clear structure</text>
  <rect class="tsne-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tsne-not-name" x="526" y="122">What is true</text>
  <text class="tsne-not-desc" x="526" y="142">Actually.</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r0" x="526" y="182">Sizes are artefacts of the layout</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r1" x="526" y="216">Only local neighbourhoods are reliable</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r2" x="526" y="250">They are visualisation, not features</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r3" x="526" y="284">Different seeds and parameters differ</text>
  <text class="tsne-not-desc tsne-not-row tsne-not-r4" x="526" y="318">They can produce clusters from noise</text>
  <text class="tsne-not-sub" x="30" y="372">Producing apparent clusters from pure noise is demonstrable and is the reason a plot alone is never evidence of structure — it needs confirming another way.</text>
</svg>
