<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="With rules, or without.">
  <title>A filing system</title>
  <style>
    .filing-cabinet-bg   { fill: #f8fafc; }
    .filing-cabinet-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-cabinet-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-cabinet-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-cabinet-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-cabinet-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-cabinet-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .filing-cabinet-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .filing-cabinet-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .filing-cabinet-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .filing-cabinet-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .filing-cabinet-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .filing-cabinet-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .filing-cabinet-row { opacity: 1; }
    .filing-cabinet-r0 { animation-delay: 0.00s; }
    .filing-cabinet-r1 { animation-delay: 0.45s; }
    .filing-cabinet-r2 { animation-delay: 0.90s; }
    .filing-cabinet-r3 { animation-delay: 1.35s; }
    .filing-cabinet-r4 { animation-delay: 1.80s; }
    .filing-cabinet-row { animation: filing-cabinet-reveal 7.3s ease-in-out infinite; }
    @keyframes filing-cabinet-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="filing-cabinet-bg" width="980" height="390"/>
  <text class="filing-cabinet-h1"  x="30" y="40">A filing system</text>
  <text class="filing-cabinet-sub" x="30" y="64">With rules, or without.</text>
  <rect class="filing-cabinet-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="filing-cabinet-name" x="46" y="122">Rules enforced</text>
  <text class="filing-cabinet-desc" x="46" y="142">Consistent.</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r0" x="46" y="182">Every form has the same fields</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r1" x="46" y="216">Incomplete forms are rejected</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r2" x="46" y="250">Cross-references are checked</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r3" x="46" y="284">Anyone can find anything</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r4" x="46" y="318">This is a schema with constraints</text>
  <rect class="filing-cabinet-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="filing-cabinet-name" x="526" y="122">No rules</text>
  <text class="filing-cabinet-desc" x="526" y="142">Divergent.</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r0" x="526" y="182">Each clerk uses their own layout</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r1" x="526" y="216">Anything is accepted</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r2" x="526" y="250">References point nowhere</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r3" x="526" y="284">Only the author can find things</text>
  <text class="filing-cabinet-desc filing-cabinet-row filing-cabinet-r4" x="526" y="318">This is a folder of files</text>
  <text class="filing-cabinet-sub" x="30" y="372">Only the author being able to find things is the failure mode that arrives slowly, and it is why structure pays off long after it is imposed.</text>
</svg>
