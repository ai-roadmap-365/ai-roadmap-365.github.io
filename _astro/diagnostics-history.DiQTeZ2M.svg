<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From statistics.">
  <title>Four steps in model diagnostics</title>
  <style>
    .diagnostics-history-bg   { fill: #f8fafc; }
    .diagnostics-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diagnostics-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diagnostics-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diagnostics-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diagnostics-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diagnostics-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diagnostics-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .diagnostics-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .diagnostics-history-stage { opacity: 1; }

    .diagnostics-history-s0 { animation-delay: 0.00s; }
    .diagnostics-history-e0 { animation-delay: 0.00s; }
    .diagnostics-history-s1 { animation-delay: 1.28s; }
    .diagnostics-history-e1 { animation-delay: 1.28s; }
    .diagnostics-history-s2 { animation-delay: 2.56s; }
    .diagnostics-history-e2 { animation-delay: 2.56s; }
    .diagnostics-history-s3 { animation-delay: 3.84s; }
    .diagnostics-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .diagnostics-history-conn  { animation: diagnostics-history-trace 6.4s ease-in-out infinite; }
      .diagnostics-history-stage { animation: diagnostics-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes diagnostics-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes diagnostics-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .diagnostics-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .diagnostics-history-stage { animation: diagnostics-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes diagnostics-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="diagnostics-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="diagnostics-history-bg" width="980" height="322"/>
  <text class="diagnostics-history-h1"  x="30" y="40">Four steps in model diagnostics</text>
  <text class="diagnostics-history-sub" x="30" y="64">From statistics.</text>
  <g class="diagnostics-history-stage diagnostics-history-s0">
    <rect class="diagnostics-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="diagnostics-history-step" x="44" y="142">01</text>
    <text class="diagnostics-history-name" x="70" y="142">Residual analysis in classical statistics</text>
    <text class="diagnostics-history-desc" x="44" y="166">Plotting what the model got</text>
    <text class="diagnostics-history-desc" x="44" y="182">wrong, and how.</text>
  </g>
  <line class="diagnostics-history-line diagnostics-history-conn diagnostics-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#diagnostics-history-tip)"/>
  <g class="diagnostics-history-stage diagnostics-history-s1">
    <rect class="diagnostics-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="diagnostics-history-step" x="280" y="142">02</text>
    <text class="diagnostics-history-name" x="306" y="142">The bias-variance decomposition formalised the trade</text>
    <text class="diagnostics-history-desc" x="280" y="166">Which gave the vocabulary.</text>
  </g>
  <line class="diagnostics-history-line diagnostics-history-conn diagnostics-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#diagnostics-history-tip)"/>
  <g class="diagnostics-history-stage diagnostics-history-s2">
    <rect class="diagnostics-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="diagnostics-history-step" x="516" y="142">03</text>
    <text class="diagnostics-history-name" x="542" y="142">Learning curves answered the data question</text>
    <text class="diagnostics-history-desc" x="516" y="166">Empirically, per problem.</text>
  </g>
  <line class="diagnostics-history-line diagnostics-history-conn diagnostics-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#diagnostics-history-tip)"/>
  <g class="diagnostics-history-stage diagnostics-history-s3">
    <rect class="diagnostics-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="diagnostics-history-step" x="752" y="142">04</text>
    <text class="diagnostics-history-name" x="778" y="142">And loss curves do the same for large models</text>
    <text class="diagnostics-history-desc" x="752" y="166">Read the same way, at a</text>
    <text class="diagnostics-history-desc" x="752" y="182">different scale.</text>
  </g>
  <text class="diagnostics-history-sub" x="30" y="304">The continuity is worth noticing: reading a large model's training and validation loss curves uses exactly the reasoning developed for classical regression.</text>
</svg>
