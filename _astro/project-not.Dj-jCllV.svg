<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What a complete project is not</title>
  <style>
    .project-not-bg   { fill: #f8fafc; }
    .project-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .project-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .project-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .project-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .project-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .project-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-not-row { opacity: 1; }
    .project-not-r0 { animation-delay: 0.00s; }
    .project-not-r1 { animation-delay: 0.45s; }
    .project-not-r2 { animation-delay: 0.90s; }
    .project-not-r3 { animation-delay: 1.35s; }
    .project-not-r4 { animation-delay: 1.80s; }
    .project-not-row { animation: project-not-reveal 7.3s ease-in-out infinite; }
    @keyframes project-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="project-not-bg" width="980" height="390"/>
  <text class="project-not-h1"  x="30" y="40">What a complete project is not</text>
  <text class="project-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="project-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="project-not-name" x="46" y="122">The misconception</text>
  <text class="project-not-desc" x="46" y="142">Commonly held.</text>
  <text class="project-not-desc project-not-row project-not-r0" x="46" y="182">A trained model is the deliverable</text>
  <text class="project-not-desc project-not-row project-not-r1" x="46" y="216">The best validation score wins</text>
  <text class="project-not-desc project-not-row project-not-r2" x="46" y="250">More model search means better results</text>
  <text class="project-not-desc project-not-row project-not-r3" x="46" y="284">The test score is the production score</text>
  <text class="project-not-desc project-not-row project-not-r4" x="46" y="318">Preprocessing is a preliminary step</text>
  <rect class="project-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="project-not-name" x="526" y="122">What is true</text>
  <text class="project-not-desc" x="526" y="142">Actually.</text>
  <text class="project-not-desc project-not-row project-not-r0" x="526" y="182">The pipeline, threshold and record are</text>
  <text class="project-not-desc project-not-row project-not-r1" x="526" y="216">Only if it beats the spread</text>
  <text class="project-not-desc project-not-row project-not-r2" x="526" y="250">Error analysis beats search, usually</text>
  <text class="project-not-desc project-not-row project-not-r3" x="526" y="284">It is an estimate, on data that ages</text>
  <text class="project-not-desc project-not-row project-not-r4" x="526" y="318">It is part of the model</text>
  <text class="project-not-sub" x="30" y="372">The last row is the one that causes production incidents: preprocessing separated from the model will drift out of step with it.</text>
</svg>
