<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Assertion rewriting</title>
  <style>
    .assertion-rewriting-bg   { fill: #f8fafc; }
    .assertion-rewriting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertion-rewriting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertion-rewriting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertion-rewriting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertion-rewriting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assertion-rewriting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assertion-rewriting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assertion-rewriting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assertion-rewriting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assertion-rewriting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assertion-rewriting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assertion-rewriting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .assertion-rewriting-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .assertion-rewriting-stage { opacity: 1; }

    .assertion-rewriting-s0 { animation-delay: 0.00s; }
    .assertion-rewriting-e0 { animation-delay: 0.00s; }
    .assertion-rewriting-s1 { animation-delay: 1.28s; }
    .assertion-rewriting-e1 { animation-delay: 1.28s; }
    .assertion-rewriting-s2 { animation-delay: 2.56s; }
    .assertion-rewriting-e2 { animation-delay: 2.56s; }
    .assertion-rewriting-s3 { animation-delay: 3.84s; }
    .assertion-rewriting-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .assertion-rewriting-conn  { animation: assertion-rewriting-trace 6.4s ease-in-out infinite; }
      .assertion-rewriting-stage { animation: assertion-rewriting-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes assertion-rewriting-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes assertion-rewriting-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .assertion-rewriting-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .assertion-rewriting-stage { animation: assertion-rewriting-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes assertion-rewriting-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="assertion-rewriting-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="assertion-rewriting-bg" width="980" height="322"/>
  <text class="assertion-rewriting-h1"  x="30" y="40">Assertion rewriting</text>
  <text class="assertion-rewriting-sub" x="30" y="64">Four steps.</text>
  <g class="assertion-rewriting-stage assertion-rewriting-s0">
    <rect class="assertion-rewriting-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="assertion-rewriting-step" x="44" y="142">01</text>
    <text class="assertion-rewriting-name" x="70" y="142">You write a plain assertion</text>
    <text class="assertion-rewriting-desc" x="44" y="166">With no special method to</text>
    <text class="assertion-rewriting-desc" x="44" y="182">remember.</text>
  </g>
  <line class="assertion-rewriting-line assertion-rewriting-conn assertion-rewriting-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#assertion-rewriting-tip)"/>
  <g class="assertion-rewriting-stage assertion-rewriting-s1">
    <rect class="assertion-rewriting-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="assertion-rewriting-step" x="280" y="142">02</text>
    <text class="assertion-rewriting-name" x="306" y="142">The framework rewrites it before running</text>
    <text class="assertion-rewriting-desc" x="280" y="166">At import time.</text>
  </g>
  <line class="assertion-rewriting-line assertion-rewriting-conn assertion-rewriting-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#assertion-rewriting-tip)"/>
  <g class="assertion-rewriting-stage assertion-rewriting-s2">
    <rect class="assertion-rewriting-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="assertion-rewriting-step" x="516" y="142">03</text>
    <text class="assertion-rewriting-name" x="542" y="142">So a failure reports both sides and the difference</text>
    <text class="assertion-rewriting-desc" x="516" y="166">Rather than just that it failed.</text>
  </g>
  <line class="assertion-rewriting-line assertion-rewriting-conn assertion-rewriting-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#assertion-rewriting-tip)"/>
  <g class="assertion-rewriting-stage assertion-rewriting-s3">
    <rect class="assertion-rewriting-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="assertion-rewriting-step" x="752" y="142">04</text>
    <text class="assertion-rewriting-name" x="778" y="142">Which is why there is no library of assertion methods</text>
    <text class="assertion-rewriting-desc" x="752" y="166">One keyword covers everything.</text>
  </g>
  <text class="assertion-rewriting-sub" x="30" y="304">This is why the framework needs no assertEqual-style vocabulary: the rewriting extracts the detail that those methods exist to provide elsewhere.</text>
</svg>
