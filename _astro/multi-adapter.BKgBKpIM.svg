<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Many adapters, one backbone</title>
  <style>
    .multi-adapter-bg   { fill: #f8fafc; }
    .multi-adapter-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-adapter-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-adapter-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-adapter-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-adapter-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-adapter-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multi-adapter-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multi-adapter-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multi-adapter-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multi-adapter-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multi-adapter-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multi-adapter-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multi-adapter-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multi-adapter-stage { opacity: 1; }

    .multi-adapter-s0 { animation-delay: 0.00s; }
    .multi-adapter-e0 { animation-delay: 0.00s; }
    .multi-adapter-s1 { animation-delay: 1.28s; }
    .multi-adapter-e1 { animation-delay: 1.28s; }
    .multi-adapter-s2 { animation-delay: 2.56s; }
    .multi-adapter-e2 { animation-delay: 2.56s; }
    .multi-adapter-s3 { animation-delay: 3.84s; }
    .multi-adapter-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .multi-adapter-conn  { animation: multi-adapter-trace 6.4s ease-in-out infinite; }
      .multi-adapter-stage { animation: multi-adapter-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes multi-adapter-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multi-adapter-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multi-adapter-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multi-adapter-stage { animation: multi-adapter-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multi-adapter-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multi-adapter-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multi-adapter-bg" width="980" height="322"/>
  <text class="multi-adapter-h1"  x="30" y="40">Many adapters, one backbone</text>
  <text class="multi-adapter-sub" x="30" y="64">Four steps.</text>
  <g class="multi-adapter-stage multi-adapter-s0">
    <rect class="multi-adapter-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="multi-adapter-step" x="44" y="142">01</text>
    <text class="multi-adapter-name" x="70" y="142">Load the base model once</text>
    <text class="multi-adapter-desc" x="44" y="166">Which is the expensive part, in</text>
    <text class="multi-adapter-desc" x="44" y="182">memory.</text>
  </g>
  <line class="multi-adapter-line multi-adapter-conn multi-adapter-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#multi-adapter-tip)"/>
  <g class="multi-adapter-stage multi-adapter-s1">
    <rect class="multi-adapter-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="multi-adapter-step" x="280" y="142">02</text>
    <text class="multi-adapter-name" x="306" y="142">Keep adapters alongside it</text>
    <text class="multi-adapter-desc" x="280" y="166">Megabytes each, dozens at a</text>
    <text class="multi-adapter-desc" x="280" y="182">time.</text>
  </g>
  <line class="multi-adapter-line multi-adapter-conn multi-adapter-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#multi-adapter-tip)"/>
  <g class="multi-adapter-stage multi-adapter-s2">
    <rect class="multi-adapter-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="multi-adapter-step" x="516" y="142">03</text>
    <text class="multi-adapter-name" x="542" y="142">Select one per request</text>
    <text class="multi-adapter-desc" x="516" y="166">By tenant, task or customer.</text>
  </g>
  <line class="multi-adapter-line multi-adapter-conn multi-adapter-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#multi-adapter-tip)"/>
  <g class="multi-adapter-stage multi-adapter-s3">
    <rect class="multi-adapter-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="multi-adapter-step" x="752" y="142">04</text>
    <text class="multi-adapter-name" x="778" y="142">So specialisation costs almost nothing</text>
    <text class="multi-adapter-desc" x="752" y="166">Per additional task served.</text>
    <text class="multi-adapter-edge" x="752" y="242">one GPU</text>
  </g>
  <text class="multi-adapter-sub" x="30" y="304">This is what makes per-customer model specialisation economically viable: the marginal cost of another specialised behaviour is a small file rather than another deployment.</text>
</svg>
