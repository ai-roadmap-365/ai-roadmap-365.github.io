<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Tables need different handling</title>
  <style>
    .tables-bg   { fill: #f8fafc; }
    .tables-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tables-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tables-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tables-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tables-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tables-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tables-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tables-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tables-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tables-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tables-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tables-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tables-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tables-stage { opacity: 1; }

    .tables-s0 { animation-delay: 0.00s; }
    .tables-e0 { animation-delay: 0.00s; }
    .tables-s1 { animation-delay: 1.28s; }
    .tables-e1 { animation-delay: 1.28s; }
    .tables-s2 { animation-delay: 2.56s; }
    .tables-e2 { animation-delay: 2.56s; }
    .tables-s3 { animation-delay: 3.84s; }
    .tables-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tables-conn  { animation: tables-trace 6.4s ease-in-out infinite; }
      .tables-stage { animation: tables-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tables-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tables-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tables-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tables-stage { animation: tables-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tables-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tables-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tables-bg" width="980" height="322"/>
  <text class="tables-h1"  x="30" y="40">Tables need different handling</text>
  <text class="tables-sub" x="30" y="64">Four steps.</text>
  <g class="tables-stage tables-s0">
    <rect class="tables-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tables-step" x="44" y="142">01</text>
    <text class="tables-name" x="70" y="142">Splitting a table mid-rows destroys it</text>
    <text class="tables-desc" x="44" y="166">Headers separated from the data</text>
    <text class="tables-desc" x="44" y="182">they label.</text>
  </g>
  <line class="tables-line tables-conn tables-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tables-tip)"/>
  <g class="tables-stage tables-s1">
    <rect class="tables-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tables-step" x="280" y="142">02</text>
    <text class="tables-name" x="306" y="142">Keep small tables whole</text>
    <text class="tables-desc" x="280" y="166">As a single chunk, whatever the</text>
    <text class="tables-desc" x="280" y="182">size rule says.</text>
  </g>
  <line class="tables-line tables-conn tables-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tables-tip)"/>
  <g class="tables-stage tables-s2">
    <rect class="tables-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tables-step" x="516" y="142">03</text>
    <text class="tables-name" x="542" y="142">Expand large ones into row-level statements</text>
    <text class="tables-desc" x="516" y="166">Each carrying the column headers</text>
    <text class="tables-desc" x="516" y="182">with it.</text>
  </g>
  <line class="tables-line tables-conn tables-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tables-tip)"/>
  <g class="tables-stage tables-s3">
    <rect class="tables-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tables-step" x="752" y="142">04</text>
    <text class="tables-name" x="778" y="142">And index a summary alongside</text>
    <text class="tables-desc" x="752" y="166">So questions about the table as</text>
    <text class="tables-desc" x="752" y="182">a whole match something.</text>
  </g>
  <text class="tables-sub" x="30" y="304">Carrying the headers into each row is the detail that makes row-level chunks retrievable: a row of bare values has almost no semantic content to embed.</text>
</svg>
