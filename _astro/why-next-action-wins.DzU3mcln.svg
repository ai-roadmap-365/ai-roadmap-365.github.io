<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="It removes a decision at the moment of action.">
  <title>Why a next action outperforms a topic</title>
  <style>
    .why-next-action-wins-bg   { fill: #f8fafc; }
    .why-next-action-wins-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-next-action-wins-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-next-action-wins-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-next-action-wins-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-next-action-wins-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-next-action-wins-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-next-action-wins-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-next-action-wins-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-next-action-wins-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-next-action-wins-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-next-action-wins-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-next-action-wins-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .why-next-action-wins-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .why-next-action-wins-stage { opacity: 1; }

    .why-next-action-wins-s0 { animation-delay: 0.00s; }
    .why-next-action-wins-e0 { animation-delay: 0.00s; }
    .why-next-action-wins-s1 { animation-delay: 1.28s; }
    .why-next-action-wins-e1 { animation-delay: 1.28s; }
    .why-next-action-wins-s2 { animation-delay: 2.56s; }
    .why-next-action-wins-e2 { animation-delay: 2.56s; }
    .why-next-action-wins-s3 { animation-delay: 3.84s; }
    .why-next-action-wins-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .why-next-action-wins-conn  { animation: why-next-action-wins-trace 6.4s ease-in-out infinite; }
      .why-next-action-wins-stage { animation: why-next-action-wins-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes why-next-action-wins-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes why-next-action-wins-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .why-next-action-wins-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .why-next-action-wins-stage { animation: why-next-action-wins-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes why-next-action-wins-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="why-next-action-wins-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="why-next-action-wins-bg" width="980" height="322"/>
  <text class="why-next-action-wins-h1"  x="30" y="40">Why a next action outperforms a topic</text>
  <text class="why-next-action-wins-sub" x="30" y="64">It removes a decision at the moment of action.</text>
  <g class="why-next-action-wins-stage why-next-action-wins-s0">
    <rect class="why-next-action-wins-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="why-next-action-wins-step" x="44" y="142">01</text>
    <text class="why-next-action-wins-name" x="70" y="142">A topic leaves a decision</text>
    <text class="why-next-action-wins-desc" x="44" y="166">"Get better at distributed</text>
    <text class="why-next-action-wins-desc" x="44" y="182">systems." Starting requires</text>
    <text class="why-next-action-wins-desc" x="44" y="198">deciding how.</text>
  </g>
  <line class="why-next-action-wins-line why-next-action-wins-conn why-next-action-wins-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#why-next-action-wins-tip)"/>
  <g class="why-next-action-wins-stage why-next-action-wins-s1">
    <rect class="why-next-action-wins-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="why-next-action-wins-step" x="280" y="142">02</text>
    <text class="why-next-action-wins-name" x="306" y="142">The decision is made when tired</text>
    <text class="why-next-action-wins-desc" x="280" y="166">At the moment of action, which</text>
    <text class="why-next-action-wins-desc" x="280" y="182">is exactly when it goes unmade.</text>
  </g>
  <line class="why-next-action-wins-line why-next-action-wins-conn why-next-action-wins-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#why-next-action-wins-tip)"/>
  <g class="why-next-action-wins-stage why-next-action-wins-s2">
    <rect class="why-next-action-wins-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="why-next-action-wins-step" x="516" y="142">03</text>
    <text class="why-next-action-wins-name" x="542" y="142">A next action has decided already</text>
    <text class="why-next-action-wins-desc" x="516" y="166">"Port the retrieval service to</text>
    <text class="why-next-action-wins-desc" x="516" y="182">two replicas and measure the</text>
    <text class="why-next-action-wins-desc" x="516" y="198">tail."</text>
  </g>
  <line class="why-next-action-wins-line why-next-action-wins-conn why-next-action-wins-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#why-next-action-wins-tip)"/>
  <g class="why-next-action-wins-stage why-next-action-wins-s3">
    <rect class="why-next-action-wins-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="why-next-action-wins-step" x="752" y="142">04</text>
    <text class="why-next-action-wins-name" x="778" y="142">So the action starts</text>
    <text class="why-next-action-wins-desc" x="752" y="166">Unglamorous mechanism,</text>
    <text class="why-next-action-wins-desc" x="752" y="182">substantial effect.</text>
    <text class="why-next-action-wins-edge" x="752" y="242">acted on</text>
  </g>
  <text class="why-next-action-wins-sub" x="30" y="304">This is the entire basis of the actionability check in today's lab: it is not testing enthusiasm, it is testing whether the decision about how to start has already been made in writing.</text>
</svg>
