<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each was a day of this week.">
  <title>Six pillars, one request path</title>
  <style>
    .six-pillars-app-bg   { fill: #f8fafc; }
    .six-pillars-app-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-app-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-app-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-app-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-app-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-app-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .six-pillars-app-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .six-pillars-app-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .six-pillars-app-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .six-pillars-app-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .six-pillars-app-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .six-pillars-app-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .six-pillars-app-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .six-pillars-app-stage { opacity: 1; }

    .six-pillars-app-s0 { animation-delay: 0.00s; }
    .six-pillars-app-e0 { animation-delay: 0.00s; }
    .six-pillars-app-s1 { animation-delay: 1.37s; }
    .six-pillars-app-e1 { animation-delay: 1.37s; }
    .six-pillars-app-s2 { animation-delay: 2.74s; }
    .six-pillars-app-e2 { animation-delay: 2.74s; }
    .six-pillars-app-s3 { animation-delay: 4.11s; }
    .six-pillars-app-e3 { animation-delay: 4.11s; }
    .six-pillars-app-s4 { animation-delay: 5.49s; }
    .six-pillars-app-e4 { animation-delay: 5.49s; }
    .six-pillars-app-s5 { animation-delay: 6.86s; }
    .six-pillars-app-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .six-pillars-app-conn  { animation: six-pillars-app-trace 9.600000000000001s ease-in-out infinite; }
      .six-pillars-app-stage { animation: six-pillars-app-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes six-pillars-app-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes six-pillars-app-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .six-pillars-app-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .six-pillars-app-stage { animation: six-pillars-app-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes six-pillars-app-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="six-pillars-app-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="six-pillars-app-bg" width="980" height="322"/>
  <text class="six-pillars-app-h1"  x="30" y="40">Six pillars, one request path</text>
  <text class="six-pillars-app-sub" x="30" y="64">Each was a day of this week.</text>
  <g class="six-pillars-app-stage six-pillars-app-s0">
    <rect class="six-pillars-app-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-app-step" x="44" y="142">01</text>
    <text class="six-pillars-app-name" x="70" y="142">Topology</text>
    <text class="six-pillars-app-desc" x="44" y="166">Client, edge,</text>
    <text class="six-pillars-app-desc" x="44" y="182">orchestration,</text>
    <text class="six-pillars-app-desc" x="44" y="198">router, workers.</text>
    <text class="six-pillars-app-edge" x="44" y="242">Day 316</text>
  </g>
  <line class="six-pillars-app-line six-pillars-app-conn six-pillars-app-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#six-pillars-app-tip)"/>
  <g class="six-pillars-app-stage six-pillars-app-s1">
    <rect class="six-pillars-app-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-app-step" x="201" y="142">02</text>
    <text class="six-pillars-app-name" x="227" y="142">Backend patterns</text>
    <text class="six-pillars-app-desc" x="201" y="166">Streaming,</text>
    <text class="six-pillars-app-desc" x="201" y="182">idempotency, circuit</text>
    <text class="six-pillars-app-desc" x="201" y="198">breaking.</text>
    <text class="six-pillars-app-edge" x="201" y="242">Day 317</text>
  </g>
  <line class="six-pillars-app-line six-pillars-app-conn six-pillars-app-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#six-pillars-app-tip)"/>
  <g class="six-pillars-app-stage six-pillars-app-s2">
    <rect class="six-pillars-app-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-app-step" x="358" y="142">03</text>
    <text class="six-pillars-app-name" x="384" y="142">Chat UX</text>
    <text class="six-pillars-app-desc" x="358" y="166">Optimistic</text>
    <text class="six-pillars-app-desc" x="358" y="182">rendering, scroll</text>
    <text class="six-pillars-app-desc" x="358" y="198">anchoring, abort.</text>
    <text class="six-pillars-app-edge" x="358" y="242">Day 318</text>
  </g>
  <line class="six-pillars-app-line six-pillars-app-conn six-pillars-app-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#six-pillars-app-tip)"/>
  <g class="six-pillars-app-stage six-pillars-app-s3">
    <rect class="six-pillars-app-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-app-step" x="515" y="142">04</text>
    <text class="six-pillars-app-name" x="541" y="142">Auth and billing</text>
    <text class="six-pillars-app-desc" x="515" y="166">Dual rate limits,</text>
    <text class="six-pillars-app-desc" x="515" y="182">two-phase credit</text>
    <text class="six-pillars-app-desc" x="515" y="198">settlement.</text>
    <text class="six-pillars-app-edge" x="515" y="242">Day 319</text>
  </g>
  <line class="six-pillars-app-line six-pillars-app-conn six-pillars-app-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#six-pillars-app-tip)"/>
  <g class="six-pillars-app-stage six-pillars-app-s4">
    <rect class="six-pillars-app-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-app-step" x="672" y="142">05</text>
    <text class="six-pillars-app-name" x="698" y="142">Caching</text>
    <text class="six-pillars-app-desc" x="672" y="166">Exact, semantic and</text>
    <text class="six-pillars-app-desc" x="672" y="182">provider prefix.</text>
    <text class="six-pillars-app-edge" x="672" y="242">Day 320</text>
  </g>
  <line class="six-pillars-app-line six-pillars-app-conn six-pillars-app-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#six-pillars-app-tip)"/>
  <g class="six-pillars-app-stage six-pillars-app-s5">
    <rect class="six-pillars-app-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-app-step" x="829" y="142">06</text>
    <text class="six-pillars-app-name" x="855" y="142">Vendor routing</text>
    <text class="six-pillars-app-desc" x="829" y="166">Failover and cost</text>
    <text class="six-pillars-app-desc" x="829" y="182">cascading.</text>
    <text class="six-pillars-app-edge" x="829" y="242">Day 321</text>
  </g>
  <text class="six-pillars-app-sub" x="30" y="304">Each pillar is individually useful and the value is in the joins: caching that is not tenant-scoped is a data leak, and billing that does not see cache hits charges for work that never happened.</text>
</svg>
