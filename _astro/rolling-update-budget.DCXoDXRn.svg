<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The budget is spent until readiness arrives.">
  <title>Why a rollout pass does nothing</title>
  <style>
    .rolling-update-budget-bg   { fill: #f8fafc; }
    .rolling-update-budget-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rolling-update-budget-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rolling-update-budget-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rolling-update-budget-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rolling-update-budget-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rolling-update-budget-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rolling-update-budget-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rolling-update-budget-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rolling-update-budget-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rolling-update-budget-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rolling-update-budget-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rolling-update-budget-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rolling-update-budget-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rolling-update-budget-stage { opacity: 1; }

    .rolling-update-budget-s0 { animation-delay: 0.00s; }
    .rolling-update-budget-e0 { animation-delay: 0.00s; }
    .rolling-update-budget-s1 { animation-delay: 1.28s; }
    .rolling-update-budget-e1 { animation-delay: 1.28s; }
    .rolling-update-budget-s2 { animation-delay: 2.56s; }
    .rolling-update-budget-e2 { animation-delay: 2.56s; }
    .rolling-update-budget-s3 { animation-delay: 3.84s; }
    .rolling-update-budget-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rolling-update-budget-conn  { animation: rolling-update-budget-trace 6.4s ease-in-out infinite; }
      .rolling-update-budget-stage { animation: rolling-update-budget-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rolling-update-budget-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rolling-update-budget-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rolling-update-budget-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rolling-update-budget-stage { animation: rolling-update-budget-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rolling-update-budget-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rolling-update-budget-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rolling-update-budget-bg" width="980" height="322"/>
  <text class="rolling-update-budget-h1"  x="30" y="40">Why a rollout pass does nothing</text>
  <text class="rolling-update-budget-sub" x="30" y="64">The budget is spent until readiness arrives.</text>
  <g class="rolling-update-budget-stage rolling-update-budget-s0">
    <rect class="rolling-update-budget-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rolling-update-budget-step" x="44" y="142">01</text>
    <text class="rolling-update-budget-name" x="70" y="142">maxUnavailable sets a floor</text>
    <text class="rolling-update-budget-desc" x="44" y="166">How many must keep serving.</text>
    <text class="rolling-update-budget-desc" x="44" y="182">Three replicas, maxUnavailable</text>
    <text class="rolling-update-budget-desc" x="44" y="198">1: at least two.</text>
    <text class="rolling-update-budget-edge" x="44" y="242">floor</text>
  </g>
  <line class="rolling-update-budget-line rolling-update-budget-conn rolling-update-budget-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rolling-update-budget-tip)"/>
  <g class="rolling-update-budget-stage rolling-update-budget-s1">
    <rect class="rolling-update-budget-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rolling-update-budget-step" x="280" y="142">02</text>
    <text class="rolling-update-budget-name" x="306" y="142">maxSurge sets a ceiling</text>
    <text class="rolling-update-budget-desc" x="280" y="166">How many pods may exist</text>
    <text class="rolling-update-budget-desc" x="280" y="182">temporarily. Protects the</text>
    <text class="rolling-update-budget-desc" x="280" y="198">cluster.</text>
    <text class="rolling-update-budget-edge" x="280" y="242">ceiling</text>
  </g>
  <line class="rolling-update-budget-line rolling-update-budget-conn rolling-update-budget-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rolling-update-budget-tip)"/>
  <g class="rolling-update-budget-stage rolling-update-budget-s2">
    <rect class="rolling-update-budget-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rolling-update-budget-step" x="516" y="142">03</text>
    <text class="rolling-update-budget-name" x="542" y="142">Replace up to the budget, then wait</text>
    <text class="rolling-update-budget-desc" x="516" y="166">A pass returns zero actions</text>
    <text class="rolling-update-budget-desc" x="516" y="182">while the rollout is plainly</text>
    <text class="rolling-update-budget-desc" x="516" y="198">unfinished.</text>
    <text class="rolling-update-budget-edge" x="516" y="242">0 actions</text>
  </g>
  <line class="rolling-update-budget-line rolling-update-budget-conn rolling-update-budget-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rolling-update-budget-tip)"/>
  <g class="rolling-update-budget-stage rolling-update-budget-s3">
    <rect class="rolling-update-budget-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rolling-update-budget-step" x="752" y="142">04</text>
    <text class="rolling-update-budget-name" x="778" y="142">Resume when the new pods are ready</text>
    <text class="rolling-update-budget-desc" x="752" y="166">Observed minimum serving:</text>
    <text class="rolling-update-budget-desc" x="752" y="182">exactly two. Budget fully used,</text>
    <text class="rolling-update-budget-desc" x="752" y="198">never exceeded.</text>
  </g>
  <text class="rolling-update-budget-sub" x="30" y="304">"Nothing to do this pass" and "the work is complete" are different questions, and conflating them is what made an earlier version of this lab declare victory with two pods still on the old image.</text>
</svg>
