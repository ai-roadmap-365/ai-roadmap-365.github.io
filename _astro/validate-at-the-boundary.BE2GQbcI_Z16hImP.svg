<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Rather than defensively, everywhere.">
  <title>Validate once, at the edge</title>
  <style>
    .validate-at-the-boundary-bg   { fill: #f8fafc; }
    .validate-at-the-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validate-at-the-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validate-at-the-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validate-at-the-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validate-at-the-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validate-at-the-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .validate-at-the-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .validate-at-the-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .validate-at-the-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .validate-at-the-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .validate-at-the-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .validate-at-the-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .validate-at-the-boundary-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .validate-at-the-boundary-stage { opacity: 1; }

    .validate-at-the-boundary-s0 { animation-delay: 0.00s; }
    .validate-at-the-boundary-e0 { animation-delay: 0.00s; }
    .validate-at-the-boundary-s1 { animation-delay: 1.28s; }
    .validate-at-the-boundary-e1 { animation-delay: 1.28s; }
    .validate-at-the-boundary-s2 { animation-delay: 2.56s; }
    .validate-at-the-boundary-e2 { animation-delay: 2.56s; }
    .validate-at-the-boundary-s3 { animation-delay: 3.84s; }
    .validate-at-the-boundary-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .validate-at-the-boundary-conn  { animation: validate-at-the-boundary-trace 6.4s ease-in-out infinite; }
      .validate-at-the-boundary-stage { animation: validate-at-the-boundary-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes validate-at-the-boundary-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes validate-at-the-boundary-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .validate-at-the-boundary-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .validate-at-the-boundary-stage { animation: validate-at-the-boundary-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes validate-at-the-boundary-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="validate-at-the-boundary-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="validate-at-the-boundary-bg" width="980" height="322"/>
  <text class="validate-at-the-boundary-h1"  x="30" y="40">Validate once, at the edge</text>
  <text class="validate-at-the-boundary-sub" x="30" y="64">Rather than defensively, everywhere.</text>
  <g class="validate-at-the-boundary-stage validate-at-the-boundary-s0">
    <rect class="validate-at-the-boundary-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="validate-at-the-boundary-step" x="44" y="142">01</text>
    <text class="validate-at-the-boundary-name" x="70" y="142">Input arrives untrusted</text>
    <text class="validate-at-the-boundary-desc" x="44" y="166">From a file, an argument, a</text>
    <text class="validate-at-the-boundary-desc" x="44" y="182">request. Nothing is known about</text>
    <text class="validate-at-the-boundary-desc" x="44" y="198">it yet.</text>
  </g>
  <line class="validate-at-the-boundary-line validate-at-the-boundary-conn validate-at-the-boundary-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#validate-at-the-boundary-tip)"/>
  <g class="validate-at-the-boundary-stage validate-at-the-boundary-s1">
    <rect class="validate-at-the-boundary-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="validate-at-the-boundary-step" x="280" y="142">02</text>
    <text class="validate-at-the-boundary-name" x="306" y="142">Validate it once, here</text>
    <text class="validate-at-the-boundary-desc" x="280" y="166">Types, ranges, required fields.</text>
    <text class="validate-at-the-boundary-desc" x="280" y="182">One place, auditable.</text>
    <text class="validate-at-the-boundary-edge" x="280" y="242">one place</text>
  </g>
  <line class="validate-at-the-boundary-line validate-at-the-boundary-conn validate-at-the-boundary-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#validate-at-the-boundary-tip)"/>
  <g class="validate-at-the-boundary-stage validate-at-the-boundary-s2">
    <rect class="validate-at-the-boundary-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="validate-at-the-boundary-step" x="516" y="142">03</text>
    <text class="validate-at-the-boundary-name" x="542" y="142">Now everything inside can trust it</text>
    <text class="validate-at-the-boundary-desc" x="516" y="166">No defensive checks scattered</text>
    <text class="validate-at-the-boundary-desc" x="516" y="182">through the logic.</text>
  </g>
  <line class="validate-at-the-boundary-line validate-at-the-boundary-conn validate-at-the-boundary-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#validate-at-the-boundary-tip)"/>
  <g class="validate-at-the-boundary-stage validate-at-the-boundary-s3">
    <rect class="validate-at-the-boundary-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="validate-at-the-boundary-step" x="752" y="142">04</text>
    <text class="validate-at-the-boundary-name" x="778" y="142">So the checks are findable</text>
    <text class="validate-at-the-boundary-desc" x="752" y="166">A reviewer can see every</text>
    <text class="validate-at-the-boundary-desc" x="752" y="182">assumption in one function.</text>
    <text class="validate-at-the-boundary-edge" x="752" y="242">reviewable</text>
  </g>
  <text class="validate-at-the-boundary-sub" x="30" y="304">Checking defensively in twenty functions is both more code and less safe: the checks drift apart, none of them is authoritative, and no reviewer can tell which assumptions actually hold.</text>
</svg>
