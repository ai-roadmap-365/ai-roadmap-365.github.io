<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different scope, different question.">
  <title>A retrospective is not a post-mortem</title>
  <style>
    .retro-versus-postmortem-bg   { fill: #f8fafc; }
    .retro-versus-postmortem-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-versus-postmortem-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-versus-postmortem-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-versus-postmortem-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-versus-postmortem-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-versus-postmortem-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retro-versus-postmortem-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retro-versus-postmortem-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retro-versus-postmortem-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retro-versus-postmortem-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retro-versus-postmortem-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retro-versus-postmortem-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retro-versus-postmortem-row { opacity: 1; }
    .retro-versus-postmortem-r0 { animation-delay: 0.00s; }
    .retro-versus-postmortem-r1 { animation-delay: 0.45s; }
    .retro-versus-postmortem-r2 { animation-delay: 0.90s; }
    .retro-versus-postmortem-r3 { animation-delay: 1.35s; }
    .retro-versus-postmortem-r4 { animation-delay: 1.80s; }
    .retro-versus-postmortem-row { animation: retro-versus-postmortem-reveal 7.3s ease-in-out infinite; }
    @keyframes retro-versus-postmortem-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="retro-versus-postmortem-bg" width="980" height="390"/>
  <text class="retro-versus-postmortem-h1"  x="30" y="40">A retrospective is not a post-mortem</text>
  <text class="retro-versus-postmortem-sub" x="30" y="64">Different scope, different question.</text>
  <rect class="retro-versus-postmortem-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="retro-versus-postmortem-name" x="46" y="122">Retrospective</text>
  <text class="retro-versus-postmortem-desc" x="46" y="142">A whole project.</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r0" x="46" y="182">Runs once, at the end</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r1" x="46" y="216">Covers estimation, process and incidents</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r2" x="46" y="250">Includes what went well</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r3" x="46" y="284">Output: findings for the next project</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r4" x="46" y="318">Needs enough tasks for a median</text>
  <rect class="retro-versus-postmortem-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="retro-versus-postmortem-name" x="526" y="122">Post-mortem</text>
  <text class="retro-versus-postmortem-desc" x="526" y="142">One incident.</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r0" x="526" y="182">Runs after each incident</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r1" x="526" y="216">Reconstructs one timeline</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r2" x="526" y="250">Asks what made it possible</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r3" x="526" y="284">Output: controls for this system</text>
  <text class="retro-versus-postmortem-desc retro-versus-postmortem-row retro-versus-postmortem-r4" x="526" y="318">Runs regardless of project size</text>
  <text class="retro-versus-postmortem-sub" x="30" y="372">Calibration belongs only to the left column and is the more transferable of the two outputs: knowing how wrong you are is easier to acquire than being right, and it does not require becoming a better estimator at all.</text>
</svg>
