<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What domain modelling is</title>
  <style>
    .domain-idea-bg   { fill: #f8fafc; }
    .domain-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .domain-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .domain-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .domain-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .domain-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .domain-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .domain-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .domain-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .domain-idea-stage { opacity: 1; }

    .domain-idea-s0 { animation-delay: 0.00s; }
    .domain-idea-e0 { animation-delay: 0.00s; }
    .domain-idea-s1 { animation-delay: 1.28s; }
    .domain-idea-e1 { animation-delay: 1.28s; }
    .domain-idea-s2 { animation-delay: 2.56s; }
    .domain-idea-e2 { animation-delay: 2.56s; }
    .domain-idea-s3 { animation-delay: 3.84s; }
    .domain-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .domain-idea-conn  { animation: domain-idea-trace 6.4s ease-in-out infinite; }
      .domain-idea-stage { animation: domain-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes domain-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes domain-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .domain-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .domain-idea-stage { animation: domain-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes domain-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="domain-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="domain-idea-bg" width="980" height="322"/>
  <text class="domain-idea-h1"  x="30" y="40">What domain modelling is</text>
  <text class="domain-idea-sub" x="30" y="64">Four steps.</text>
  <g class="domain-idea-stage domain-idea-s0">
    <rect class="domain-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="domain-idea-step" x="44" y="142">01</text>
    <text class="domain-idea-name" x="70" y="142">Describe the domain in plain sentences</text>
    <text class="domain-idea-desc" x="44" y="166">As the people who work in it</text>
    <text class="domain-idea-desc" x="44" y="182">would.</text>
  </g>
  <line class="domain-idea-line domain-idea-conn domain-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#domain-idea-tip)"/>
  <g class="domain-idea-stage domain-idea-s1">
    <rect class="domain-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="domain-idea-step" x="280" y="142">02</text>
    <text class="domain-idea-name" x="306" y="142">The nouns become types; the verbs become methods</text>
    <text class="domain-idea-desc" x="280" y="166">Which is a surprisingly reliable</text>
    <text class="domain-idea-desc" x="280" y="182">first pass.</text>
  </g>
  <line class="domain-idea-line domain-idea-conn domain-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#domain-idea-tip)"/>
  <g class="domain-idea-stage domain-idea-s2">
    <rect class="domain-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="domain-idea-step" x="516" y="142">03</text>
    <text class="domain-idea-name" x="542" y="142">Separate the things with identity from the values</text>
    <text class="domain-idea-desc" x="516" y="166">Which decides equality and</text>
    <text class="domain-idea-desc" x="516" y="182">mutability.</text>
  </g>
  <line class="domain-idea-line domain-idea-conn domain-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#domain-idea-tip)"/>
  <g class="domain-idea-stage domain-idea-s3">
    <rect class="domain-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="domain-idea-step" x="752" y="142">04</text>
    <text class="domain-idea-name" x="778" y="142">Then name the rules that must always hold</text>
    <text class="domain-idea-desc" x="752" y="166">And decide where each is</text>
    <text class="domain-idea-desc" x="752" y="182">enforced.</text>
  </g>
  <text class="domain-idea-sub" x="30" y="304">Writing the domain in the domain's own words first is what keeps the model checkable by the people who understand the business rather than only by programmers.</text>
</svg>
