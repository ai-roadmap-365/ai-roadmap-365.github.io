<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Model Card Governance Flow</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .box-step { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .wire-active { stroke: #10b981; stroke-width: 2; fill: none; stroke-dasharray: 6; animation: dash 2s linear infinite; marker-end: url(#arrow-green); }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) {
      .wire-active { animation: none !important; stroke-dasharray: none; }
    }
  </style>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Automated Continuous Model Card Generation</text>
  <text x="450" y="65" class="text-sub">CI/CD Governance Pipeline: Code Commit to Regulatory Publishing</text>

  <!-- Step 1: Model Training -->
  <rect x="50" y="120" width="220" height="180" class="box-step" />
  <text x="160" y="150" class="text-title">1. CI/CD Training</text>
  <text x="160" y="180" class="text-sub">Automated pipeline</text>
  <text x="160" y="205" class="text-sub">fits candidate model</text>
  <text x="160" y="230" class="text-sub">on clean training split</text>
  <text x="160" y="265" class="text-sub" fill="#a7f3d0">Artifacts to Registry</text>

  <!-- Step 2: Automated Audit -->
  <rect x="340" y="120" width="220" height="180" class="box-step" />
  <text x="450" y="150" class="text-title">2. Automated Audit</text>
  <text x="450" y="180" class="text-sub">Executes Fairlearn test,</text>
  <text x="450" y="205" class="text-sub">slice performance audit,</text>
  <text x="450" y="230" class="text-sub">and SHAP explanations</text>
  <text x="450" y="265" class="text-sub" fill="#a7f3d0">Schema Validation</text>

  <!-- Step 3: Model Card Release -->
  <rect x="630" y="120" width="220" height="180" class="box-step" />
  <text x="740" y="150" class="text-title">3. Model Card Release</text>
  <text x="740" y="180" class="text-sub">Compiles Markdown/HTML</text>
  <text x="740" y="205" class="text-sub">attaches to MLflow Run,</text>
  <text x="740" y="230" class="text-sub">publishes to portal</text>
  <text x="740" y="265" class="text-sub" fill="#a7f3d0">Ready for Deployment</text>

  <!-- Wires -->
  <path d="M 270 210 L 340 210" class="wire-active" />
  <path d="M 560 210 L 630 210" class="wire-active" />

  <!-- Bottom: Compliance Guarantee -->
  <rect x="100" y="340" width="700" height="110" class="box" />
  <text x="450" y="375" class="text-title">Regulatory &amp; Compliance Sign-Off</text>
  <text x="450" y="405" class="text-sub">Every deployed model artifact has an immutable, cryptographically verifiable</text>
  <text x="450" y="425" class="text-sub">Model Card satisfying EU AI Act Article 11 technical documentation standards.</text>
</svg>
