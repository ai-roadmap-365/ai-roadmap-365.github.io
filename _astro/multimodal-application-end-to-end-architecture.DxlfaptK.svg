<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Multimodal Application End to End Architecture">
  <title>Multimodal Application End to End Architecture</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d287a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d287a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d287a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d287a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d287a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d287a-arrowhead); }
      .d287a-pulse { animation: d287a-glow 2.5s infinite ease-in-out; }
      @keyframes d287a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d287a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d287a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d287a-box" x="0" y="0" width="220" height="200" />
    <text class="d287a-header" x="15" y="30">1. Multimodal Inputs</text>
    <text class="d287a-text" x="15" y="60">• Voice Audio (16 kHz PCM)</text>
    <text class="d287a-text" x="15" y="85">• Image / Screenshot</text>
    <text class="d287a-accent" x="15" y="140">Audio &amp; Vision Ingestion</text>

    <path class="d287a-arrow" d="M 220 100 L 280 100" />

    <rect class="d287a-box d287a-pulse" x="280" y="0" width="240" height="200" />
    <text class="d287a-header" x="15" y="30">2. Core Orchestrator</text>
    <text class="d287a-text" x="15" y="60">• Whisper ASR Transcriber</text>
    <text class="d287a-text" x="15" y="85">• VLM Grounded Reasoner</text>
    <text class="d287a-text" x="15" y="110">• Latent Diffusion Synthesizer</text>
    <text class="d287a-accent" x="15" y="160">Multi-Model Pipeline</text>

    <path class="d287a-arrow" d="M 520 100 L 580 100" />

    <rect class="d287a-box" x="580" y="0" width="200" height="200" />
    <text class="d287a-header" x="15" y="30">3. Verified Outputs</text>
    <text class="d287a-text" x="15" y="60">• Text Response + Citations</text>
    <text class="d287a-text" x="15" y="85">• Synthesized Visuals</text>
    <text class="d287a-text" x="15" y="110">• C2PA Provenance Seal</text>
    <text class="d287a-accent" x="15" y="160">Enterprise Application</text>
  </g>

</svg>