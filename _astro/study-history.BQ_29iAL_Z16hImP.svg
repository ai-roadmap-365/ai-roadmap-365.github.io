<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward openness.">
  <title>Four steps in study practice</title>
  <style>
    .study-history-bg   { fill: #f8fafc; }
    .study-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .study-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .study-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .study-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .study-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .study-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .study-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .study-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .study-history-stage { opacity: 1; }

    .study-history-s0 { animation-delay: 0.00s; }
    .study-history-e0 { animation-delay: 0.00s; }
    .study-history-s1 { animation-delay: 1.28s; }
    .study-history-e1 { animation-delay: 1.28s; }
    .study-history-s2 { animation-delay: 2.56s; }
    .study-history-e2 { animation-delay: 2.56s; }
    .study-history-s3 { animation-delay: 3.84s; }
    .study-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .study-history-conn  { animation: study-history-trace 6.4s ease-in-out infinite; }
      .study-history-stage { animation: study-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes study-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes study-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .study-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .study-history-stage { animation: study-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes study-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="study-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="study-history-bg" width="980" height="322"/>
  <text class="study-history-h1"  x="30" y="40">Four steps in study practice</text>
  <text class="study-history-sub" x="30" y="64">Toward openness.</text>
  <g class="study-history-stage study-history-s0">
    <rect class="study-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="study-history-step" x="44" y="142">01</text>
    <text class="study-history-name" x="70" y="142">Reporting conclusions, with the method summarised</text>
    <text class="study-history-desc" x="44" y="166">Which could not be checked.</text>
  </g>
  <line class="study-history-line study-history-conn study-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#study-history-tip)"/>
  <g class="study-history-stage study-history-s1">
    <rect class="study-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="study-history-step" x="280" y="142">02</text>
    <text class="study-history-name" x="306" y="142">Then detailed method sections</text>
    <text class="study-history-desc" x="280" y="166">Which could be followed, in</text>
    <text class="study-history-desc" x="280" y="182">principle.</text>
  </g>
  <line class="study-history-line study-history-conn study-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#study-history-tip)"/>
  <g class="study-history-stage study-history-s2">
    <rect class="study-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="study-history-step" x="516" y="142">03</text>
    <text class="study-history-name" x="542" y="142">Then data and code shared alongside</text>
    <text class="study-history-desc" x="516" y="166">Which could actually be rerun.</text>
  </g>
  <line class="study-history-line study-history-conn study-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#study-history-tip)"/>
  <g class="study-history-stage study-history-s3">
    <rect class="study-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="study-history-step" x="752" y="142">04</text>
    <text class="study-history-name" x="778" y="142">And full reproducibility as an expectation</text>
    <text class="study-history-desc" x="752" y="166">Environment included.</text>
  </g>
  <text class="study-history-sub" x="30" y="304">The progression is entirely toward checkability, and each step was driven by findings that turned out not to hold when someone tried to reproduce them.</text>
</svg>
