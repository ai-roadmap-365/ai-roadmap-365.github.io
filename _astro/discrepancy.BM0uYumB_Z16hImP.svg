<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four causes, in likelihood order.">
  <title>Where the numbers diverge</title>
  <style>
    .discrepancy-bg   { fill: #f8fafc; }
    .discrepancy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .discrepancy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .discrepancy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .discrepancy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .discrepancy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .discrepancy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .discrepancy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .discrepancy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .discrepancy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .discrepancy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .discrepancy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .discrepancy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .discrepancy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .discrepancy-stage { opacity: 1; }

    .discrepancy-s0 { animation-delay: 0.00s; }
    .discrepancy-e0 { animation-delay: 0.00s; }
    .discrepancy-s1 { animation-delay: 1.28s; }
    .discrepancy-e1 { animation-delay: 1.28s; }
    .discrepancy-s2 { animation-delay: 2.56s; }
    .discrepancy-e2 { animation-delay: 2.56s; }
    .discrepancy-s3 { animation-delay: 3.84s; }
    .discrepancy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .discrepancy-conn  { animation: discrepancy-trace 6.4s ease-in-out infinite; }
      .discrepancy-stage { animation: discrepancy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes discrepancy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes discrepancy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .discrepancy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .discrepancy-stage { animation: discrepancy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes discrepancy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="discrepancy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="discrepancy-bg" width="980" height="322"/>
  <text class="discrepancy-h1"  x="30" y="40">Where the numbers diverge</text>
  <text class="discrepancy-sub" x="30" y="64">Four causes, in likelihood order.</text>
  <g class="discrepancy-stage discrepancy-s0">
    <rect class="discrepancy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="discrepancy-step" x="44" y="142">01</text>
    <text class="discrepancy-name" x="70" y="142">A bug in your implementation</text>
    <text class="discrepancy-desc" x="44" y="166">By far the most likely. Assume</text>
    <text class="discrepancy-desc" x="44" y="182">this first.</text>
  </g>
  <line class="discrepancy-line discrepancy-conn discrepancy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#discrepancy-tip)"/>
  <g class="discrepancy-stage discrepancy-s1">
    <rect class="discrepancy-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="discrepancy-step" x="280" y="142">02</text>
    <text class="discrepancy-name" x="306" y="142">An unstated detail</text>
    <text class="discrepancy-desc" x="280" y="166">Warmup, clipping, a</text>
    <text class="discrepancy-desc" x="280" y="182">preprocessing step nobody wrote</text>
    <text class="discrepancy-desc" x="280" y="198">down.</text>
  </g>
  <line class="discrepancy-line discrepancy-conn discrepancy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#discrepancy-tip)"/>
  <g class="discrepancy-stage discrepancy-s2">
    <rect class="discrepancy-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="discrepancy-step" x="516" y="142">03</text>
    <text class="discrepancy-name" x="542" y="142">A different evaluation protocol</text>
    <text class="discrepancy-desc" x="516" y="166">Which split, which metric</text>
    <text class="discrepancy-desc" x="516" y="182">variant, averaged how.</text>
  </g>
  <line class="discrepancy-line discrepancy-conn discrepancy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#discrepancy-tip)"/>
  <g class="discrepancy-stage discrepancy-s3">
    <rect class="discrepancy-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="discrepancy-step" x="752" y="142">04</text>
    <text class="discrepancy-name" x="778" y="142">Or genuine run-to-run variance</text>
    <text class="discrepancy-desc" x="752" y="166">Which is why several seeds are</text>
    <text class="discrepancy-desc" x="752" y="182">required to claim anything.</text>
  </g>
  <text class="discrepancy-sub" x="30" y="304">Working the list in this order saves the most time, because the explanation people reach for last is usually the one they should have checked first.</text>
</svg>
