<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img">
  <title>Hierarchical Supervisor Subagent Delegation</title>
  <defs>
    <style>
      .d293f-bg { fill: #f8fafc; }
      .d293f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d293f-lead { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d293f-worker { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d293f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d293f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d293f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d293f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .d293f-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d293f-bg" />
  
  <text x="40" y="40" class="d293f-title">Hierarchical Supervisor Subagent Delegation</text>
  <text x="40" y="65" class="d293f-subtitle">Hierarchical Supervisor Subagent Delegation diagram showing task dispatch from Lead Supervisor to Specialized Research, Code, and Review agents</text>
  
  <!-- Lead Supervisor -->
  <rect x="300" y="100" width="300" height="90" class="d293f-lead" />
  <text x="320" y="130" class="d293f-header" fill="#1d4ed8">Lead Supervisor Agent</text>
  <text x="320" y="150" class="d293f-text">• Decomposes user goal into sub-tasks</text>
  <text x="320" y="165" class="d293f-text">• Evaluates worker outputs and synthesizes</text>
  
  <!-- Worker 1: Researcher -->
  <rect x="40" y="270" width="240" height="120" class="d293f-worker" />
  <text x="55" y="300" class="d293f-header" fill="#15803d">Worker 1: Researcher</text>
  <text x="55" y="320" class="d293f-text">• Web search &amp; paper fetching</text>
  <text x="55" y="335" class="d293f-text">• Extracts verified citations</text>
  <text x="55" y="355" class="d293f-text" font-weight="600">Tool: search_kb, fetch_url</text>
  
  <!-- Worker 2: Coder -->
  <rect x="330" y="270" width="240" height="120" class="d293f-worker" />
  <text x="345" y="300" class="d293f-header" fill="#15803d">Worker 2: Coder</text>
  <text x="345" y="320" class="d293f-text">• Generates &amp; compiles Python</text>
  <text x="345" y="335" class="d293f-text">• Executes unit test suites</text>
  <text x="345" y="355" class="d293f-text" font-weight="600">Tool: python_sandbox, pytest</text>
  
  <!-- Worker 3: Critic -->
  <rect x="620" y="270" width="240" height="120" class="d293f-worker" />
  <text x="635" y="300" class="d293f-header" fill="#15803d">Worker 3: Critic / Linter</text>
  <text x="635" y="320" class="d293f-text">• Security vulnerability scan</text>
  <text x="635" y="335" class="d293f-text">• Verifies hallucination checks</text>
  <text x="635" y="355" class="d293f-text" font-weight="600">Tool: bandit, ruff, ast_eval</text>
  
  <!-- Flow Lines -->
  <path d="M 370 190 L 160 270" class="d293f-flow" stroke="#3b82f6" />
  <path d="M 450 190 L 450 270" class="d293f-flow" stroke="#3b82f6" />
  <path d="M 530 190 L 740 270" class="d293f-flow" stroke="#3b82f6" />
</svg>