<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things norms are not</title>
  <style>
    .norm-not-bg   { fill: #f8fafc; }
    .norm-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .norm-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .norm-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .norm-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .norm-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .norm-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .norm-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .norm-not-row { opacity: 1; }
    .norm-not-r0 { animation-delay: 0.00s; }
    .norm-not-r1 { animation-delay: 0.45s; }
    .norm-not-r2 { animation-delay: 0.90s; }
    .norm-not-r3 { animation-delay: 1.35s; }
    .norm-not-r4 { animation-delay: 1.80s; }
    .norm-not-row { animation: norm-not-reveal 7.3s ease-in-out infinite; }
    @keyframes norm-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="norm-not-bg" width="980" height="390"/>
  <text class="norm-not-h1"  x="30" y="40">Four things norms are not</text>
  <text class="norm-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="norm-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="norm-not-name" x="46" y="122">The misconception</text>
  <text class="norm-not-desc" x="46" y="142">Commonly held.</text>
  <text class="norm-not-desc norm-not-row norm-not-r0" x="46" y="182">Distance means straight-line distance</text>
  <text class="norm-not-desc norm-not-row norm-not-r1" x="46" y="216">Any similarity measure is a distance</text>
  <text class="norm-not-desc norm-not-row norm-not-r2" x="46" y="250">The choice of norm rarely matters</text>
  <text class="norm-not-desc norm-not-row norm-not-r3" x="46" y="284">Scaling is a preprocessing detail</text>
  <text class="norm-not-desc norm-not-row norm-not-r4" x="46" y="318">All norms behave alike in high dimensions</text>
  <rect class="norm-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="norm-not-name" x="526" y="122">What is true</text>
  <text class="norm-not-desc" x="526" y="142">Actually.</text>
  <text class="norm-not-desc norm-not-row norm-not-r0" x="526" y="182">It is one member of a family</text>
  <text class="norm-not-desc norm-not-row norm-not-r1" x="526" y="216">Some violate the triangle inequality</text>
  <text class="norm-not-desc norm-not-row norm-not-r2" x="526" y="250">It changes which items rank as nearest</text>
  <text class="norm-not-desc norm-not-row norm-not-r3" x="526" y="284">It usually decides the answer</text>
  <text class="norm-not-desc norm-not-row norm-not-r4" x="526" y="318">Grid distance degrades more slowly</text>
  <text class="norm-not-sub" x="30" y="372">The last row is a practical reason to prefer grid distance in very high dimensions, where straight-line distance concentrates faster.</text>
</svg>
