<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The ceremony should match the stakes.">
  <title>When full scoping rigour is not worth it</title>
  <style>
    .scope-lightweight-bg   { fill: #f8fafc; }
    .scope-lightweight-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-lightweight-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-lightweight-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-lightweight-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-lightweight-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-lightweight-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-lightweight-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scope-lightweight-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scope-lightweight-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scope-lightweight-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scope-lightweight-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scope-lightweight-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-lightweight-row { opacity: 1; }
    .scope-lightweight-r0 { animation-delay: 0.00s; }
    .scope-lightweight-r1 { animation-delay: 0.45s; }
    .scope-lightweight-r2 { animation-delay: 0.90s; }
    .scope-lightweight-r3 { animation-delay: 1.35s; }
    .scope-lightweight-r4 { animation-delay: 1.80s; }
    .scope-lightweight-row { animation: scope-lightweight-reveal 7.3s ease-in-out infinite; }
    @keyframes scope-lightweight-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scope-lightweight-bg" width="980" height="390"/>
  <text class="scope-lightweight-h1"  x="30" y="40">When full scoping rigour is not worth it</text>
  <text class="scope-lightweight-sub" x="30" y="64">The ceremony should match the stakes.</text>
  <rect class="scope-lightweight-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scope-lightweight-name" x="46" y="122">Full rigour</text>
  <text class="scope-lightweight-desc" x="46" y="142">Where the cost of drift is high.</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r0" x="46" y="182">Two weeks or more of work</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r1" x="46" y="216">More than one person involved</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r2" x="46" y="250">A real deadline you cannot move</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r3" x="46" y="284">Money is being spent per request</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r4" x="46" y="318">It will be shown to someone who matters</text>
  <rect class="scope-lightweight-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scope-lightweight-name" x="526" y="122">Keep it light</text>
  <text class="scope-lightweight-desc" x="526" y="142">Where the charter costs more than it saves.</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r0" x="526" y="182">An afternoon's experiment</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r1" x="526" y="216">One person, throwaway</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r2" x="526" y="250">No deadline and no audience</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r3" x="526" y="284">Learning something, not shipping it</text>
  <text class="scope-lightweight-desc scope-lightweight-row scope-lightweight-r4" x="526" y="318">Write two lines and start</text>
  <text class="scope-lightweight-sub" x="30" y="372">The failure in both directions is real: a two-week project with no boundary never finishes, and an afternoon's experiment with a charter never starts.</text>
</svg>
