<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Pick the one whose hard part you want to demonstrate.">
  <title>Choosing an archetype</title>
  <style>
    .archetype-choice-bg   { fill: #f8fafc; }
    .archetype-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .archetype-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .archetype-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .archetype-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .archetype-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .archetype-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .archetype-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .archetype-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .archetype-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .archetype-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .archetype-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .archetype-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .archetype-choice-row { opacity: 1; }
    .archetype-choice-r0 { animation-delay: 0.00s; }
    .archetype-choice-r1 { animation-delay: 0.45s; }
    .archetype-choice-r2 { animation-delay: 0.90s; }
    .archetype-choice-r3 { animation-delay: 1.35s; }
    .archetype-choice-r4 { animation-delay: 1.80s; }
    .archetype-choice-row { animation: archetype-choice-reveal 7.3s ease-in-out infinite; }
    @keyframes archetype-choice-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="archetype-choice-bg" width="980" height="390"/>
  <text class="archetype-choice-h1"  x="30" y="40">Choosing an archetype</text>
  <text class="archetype-choice-sub" x="30" y="64">Pick the one whose hard part you want to demonstrate.</text>
  <rect class="archetype-choice-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="archetype-choice-name" x="46" y="122">A retrieval system</text>
  <text class="archetype-choice-desc" x="46" y="142">The hard part is precision.</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r0" x="46" y="182">Chunking, embedding, hybrid search</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r1" x="46" y="216">Reranking, and measuring whether it helped</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r2" x="46" y="250">Grounding and citation</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r3" x="46" y="284">Evaluation is tractable and convincing</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r4" x="46" y="318">Fails in ways you can measure</text>
  <rect class="archetype-choice-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="archetype-choice-name" x="526" y="122">An agent</text>
  <text class="archetype-choice-desc" x="526" y="142">The hard part is control.</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r0" x="526" y="182">Tool schemas and argument validation</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r1" x="526" y="216">Bounding loops and cost</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r2" x="526" y="250">Recovering from a bad tool result</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r3" x="526" y="284">Evaluation is genuinely harder</text>
  <text class="archetype-choice-desc archetype-choice-row archetype-choice-r4" x="526" y="318">Fails in ways that are expensive</text>
  <text class="archetype-choice-sub" x="30" y="372">Neither is better. Choose the one whose difficulty you want on your record, and be aware that the agent archetype spends more of its budget on control and less on the feature itself.</text>
</svg>
