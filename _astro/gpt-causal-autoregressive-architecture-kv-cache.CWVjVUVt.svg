<svg role="img" aria-label="GPT causal autoregressive architecture diagram showing lower triangular causal attention mask next token prediction and KV cache mechanism" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>GPT Causal Architecture and KV-Cache Mechanism</title>
  <defs>
    <linearGradient id="bg229a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card229" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg229a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">GPT CAUSAL AUTOREGRESSIVE GENERATION &amp; KV-CACHE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Radford et al. (2018–2020): Left-to-Right Language Modeling &amp; O(1) Rollout Latency</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card229)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left Box: Causal Attention Mask Matrix -->
    <rect x="25" y="25" width="340" height="255" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="195" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Causal Lower-Triangular Mask</text>
    
    <g transform="translate(65, 70)">
      <!-- Matrix Grid: 4x4 -->
      <!-- Row 0: The -->
      <rect x="0" y="0" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="25" y="22" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">1.0</text>
      <rect x="60" y="0" width="50" height="35" fill="#1e293b" stroke="#f43f5e" rx="2"/>
      <text x="85" y="22" fill="#fb7185" font-size="8" text-anchor="middle">-inf</text>
      <rect x="120" y="0" width="50" height="35" fill="#1e293b" stroke="#f43f5e" rx="2"/>
      <text x="145" y="22" fill="#fb7185" font-size="8" text-anchor="middle">-inf</text>
      <rect x="180" y="0" width="50" height="35" fill="#1e293b" stroke="#f43f5e" rx="2"/>
      <text x="205" y="22" fill="#fb7185" font-size="8" text-anchor="middle">-inf</text>

      <!-- Row 1: model -->
      <rect x="0" y="45" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="25" y="67" fill="#ffffff" font-size="9" text-anchor="middle">0.4</text>
      <rect x="60" y="45" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="85" y="67" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">0.6</text>
      <rect x="120" y="45" width="50" height="35" fill="#1e293b" stroke="#f43f5e" rx="2"/>
      <text x="145" y="67" fill="#fb7185" font-size="8" text-anchor="middle">-inf</text>
      <rect x="180" y="45" width="50" height="35" fill="#1e293b" stroke="#f43f5e" rx="2"/>
      <text x="205" y="67" fill="#fb7185" font-size="8" text-anchor="middle">-inf</text>

      <!-- Row 2: can -->
      <rect x="0" y="90" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="25" y="112" fill="#ffffff" font-size="9" text-anchor="middle">0.2</text>
      <rect x="60" y="90" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="85" y="112" fill="#ffffff" font-size="9" text-anchor="middle">0.5</text>
      <rect x="120" y="90" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="145" y="112" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">0.3</text>
      <rect x="180" y="90" width="50" height="35" fill="#1e293b" stroke="#f43f5e" rx="2"/>
      <text x="205" y="112" fill="#fb7185" font-size="8" text-anchor="middle">-inf</text>

      <!-- Row 3: generate -->
      <rect x="0" y="135" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="25" y="157" fill="#ffffff" font-size="9" text-anchor="middle">0.1</text>
      <rect x="60" y="135" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="85" y="157" fill="#ffffff" font-size="9" text-anchor="middle">0.3</text>
      <rect x="120" y="135" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="145" y="157" fill="#ffffff" font-size="9" text-anchor="middle">0.4</text>
      <rect x="180" y="135" width="50" height="35" fill="#0284c7" stroke="#38bdf8" rx="2"/>
      <text x="205" y="157" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">0.2</text>
    </g>
    <text x="195" y="265" fill="#94a3b8" font-size="8" text-anchor="middle">Strict Left-to-Right: Token t can only see tokens &lt;= t</text>

    <!-- Right Box: KV-Cache Rollout Engine -->
    <rect x="395" y="25" width="340" height="255" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="565" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Fast Inference with KV-Caching</text>
    
    <rect x="415" y="65" width="300" height="60" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="565" y="85" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Persistent KV-Cache in VRAM</text>
    <text x="565" y="105" fill="#cbd5e1" font-size="8" text-anchor="middle">Cached Keys: [K_0, K_1, ..., K_{t-1}] | Cached Values: [V_0, ..., V_{t-1}]</text>

    <!-- Appending New Step -->
    <rect x="415" y="140" width="300" height="75" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="565" y="160" fill="#a7f3d0" font-size="9" font-weight="700" text-anchor="middle">Generation Step t (Single Token x_t)</text>
    <text x="565" y="180" fill="#f8fafc" font-size="8" text-anchor="middle">1. Compute only current q_t, k_t, v_t (1x FLOPs!)</text>
    <text x="565" y="198" fill="#f8fafc" font-size="8" text-anchor="middle">2. Append k_t, v_t to Cache -&gt; Attn(q_t, K_{all}, V_{all})</text>

    <rect x="415" y="230" width="300" height="35" fill="#065f46" stroke="#10b981" rx="4"/>
    <text x="565" y="252" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Rollout Latency: O(1) FLOPs per Token (vs O(N))</text>
  </g>
</svg>
