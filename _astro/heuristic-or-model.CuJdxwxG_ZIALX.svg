<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Gate with one, escalate to the other.">
  <title>Heuristics or a model</title>
  <style>
    .heuristic-or-model-bg   { fill: #f8fafc; }
    .heuristic-or-model-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .heuristic-or-model-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .heuristic-or-model-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .heuristic-or-model-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .heuristic-or-model-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .heuristic-or-model-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .heuristic-or-model-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .heuristic-or-model-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .heuristic-or-model-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .heuristic-or-model-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .heuristic-or-model-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .heuristic-or-model-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .heuristic-or-model-row { opacity: 1; }
    .heuristic-or-model-r0 { animation-delay: 0.00s; }
    .heuristic-or-model-r1 { animation-delay: 0.45s; }
    .heuristic-or-model-r2 { animation-delay: 0.90s; }
    .heuristic-or-model-r3 { animation-delay: 1.35s; }
    .heuristic-or-model-r4 { animation-delay: 1.80s; }
    .heuristic-or-model-row { animation: heuristic-or-model-reveal 7.3s ease-in-out infinite; }
    @keyframes heuristic-or-model-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="heuristic-or-model-bg" width="980" height="390"/>
  <text class="heuristic-or-model-h1"  x="30" y="40">Heuristics or a model</text>
  <text class="heuristic-or-model-sub" x="30" y="64">Gate with one, escalate to the other.</text>
  <rect class="heuristic-or-model-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="heuristic-or-model-name" x="46" y="122">Heuristics</text>
  <text class="heuristic-or-model-desc" x="46" y="142">Negligible cost.</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r0" x="46" y="182">Character statistics over the output</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r1" x="46" y="216">Catches catastrophic failure reliably</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r2" x="46" y="250">Runs on every document</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r3" x="46" y="284">Cannot see broken reading order</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r4" x="46" y="318">The right thing to gate on</text>
  <rect class="heuristic-or-model-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="heuristic-or-model-name" x="526" y="122">A model</text>
  <text class="heuristic-or-model-desc" x="526" y="142">Comparable to extraction.</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r0" x="526" y="182">Judges subtler damage</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r1" x="526" y="216">Detects spliced columns and lost structure</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r2" x="526" y="250">Too expensive for every document</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r3" x="526" y="284">Right for classes where subtle failure is common</text>
  <text class="heuristic-or-model-desc heuristic-or-model-row heuristic-or-model-r4" x="526" y="318">And expensive when it happens</text>
  <text class="heuristic-or-model-sub" x="30" y="372">Using heuristics as the gate and reserving models for specific document classes is the cost-aware arrangement: the cheap check runs everywhere, and the expensive one runs where it earns its cost.</text>
</svg>
