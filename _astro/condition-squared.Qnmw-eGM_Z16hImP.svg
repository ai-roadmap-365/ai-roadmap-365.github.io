<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Squaring the condition number</title>
  <style>
    .condition-squared-bg   { fill: #f8fafc; }
    .condition-squared-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-squared-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-squared-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-squared-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-squared-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .condition-squared-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .condition-squared-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .condition-squared-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .condition-squared-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .condition-squared-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .condition-squared-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .condition-squared-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .condition-squared-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .condition-squared-stage { opacity: 1; }

    .condition-squared-s0 { animation-delay: 0.00s; }
    .condition-squared-e0 { animation-delay: 0.00s; }
    .condition-squared-s1 { animation-delay: 1.28s; }
    .condition-squared-e1 { animation-delay: 1.28s; }
    .condition-squared-s2 { animation-delay: 2.56s; }
    .condition-squared-e2 { animation-delay: 2.56s; }
    .condition-squared-s3 { animation-delay: 3.84s; }
    .condition-squared-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .condition-squared-conn  { animation: condition-squared-trace 6.4s ease-in-out infinite; }
      .condition-squared-stage { animation: condition-squared-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes condition-squared-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes condition-squared-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .condition-squared-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .condition-squared-stage { animation: condition-squared-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes condition-squared-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="condition-squared-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="condition-squared-bg" width="980" height="322"/>
  <text class="condition-squared-h1"  x="30" y="40">Squaring the condition number</text>
  <text class="condition-squared-sub" x="30" y="64">Four steps.</text>
  <g class="condition-squared-stage condition-squared-s0">
    <rect class="condition-squared-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="condition-squared-step" x="44" y="142">01</text>
    <text class="condition-squared-name" x="70" y="142">The textbook route forms a product of the data matrix with itself</text>
    <text class="condition-squared-desc" x="44" y="166">Then solves the resulting</text>
    <text class="condition-squared-desc" x="44" y="182">system.</text>
  </g>
  <line class="condition-squared-line condition-squared-conn condition-squared-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#condition-squared-tip)"/>
  <g class="condition-squared-stage condition-squared-s1">
    <rect class="condition-squared-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="condition-squared-step" x="280" y="142">02</text>
    <text class="condition-squared-name" x="306" y="142">Which squares the condition number</text>
    <text class="condition-squared-desc" x="280" y="166">Exactly, not approximately.</text>
  </g>
  <line class="condition-squared-line condition-squared-conn condition-squared-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#condition-squared-tip)"/>
  <g class="condition-squared-stage condition-squared-s2">
    <rect class="condition-squared-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="condition-squared-step" x="516" y="142">03</text>
    <text class="condition-squared-name" x="542" y="142">So a moderately awkward matrix becomes a severe one</text>
    <text class="condition-squared-desc" x="516" y="166">And available precision is</text>
    <text class="condition-squared-desc" x="516" y="182">consumed.</text>
  </g>
  <line class="condition-squared-line condition-squared-conn condition-squared-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#condition-squared-tip)"/>
  <g class="condition-squared-stage condition-squared-s3">
    <rect class="condition-squared-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="condition-squared-step" x="752" y="142">04</text>
    <text class="condition-squared-name" x="778" y="142">Producing coefficients that are numerically meaningless</text>
    <text class="condition-squared-desc" x="752" y="166">While the code raises no error</text>
    <text class="condition-squared-desc" x="752" y="182">at all.</text>
  </g>
  <text class="condition-squared-sub" x="30" y="304">That the relationship is exact rather than approximate is what makes this predictable: you can compute in advance how much precision a given matrix will cost.</text>
</svg>
