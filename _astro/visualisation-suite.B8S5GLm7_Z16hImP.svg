<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four views.">
  <title>What to put in a model report</title>
  <style>
    .visualisation-suite-bg   { fill: #f8fafc; }
    .visualisation-suite-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visualisation-suite-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visualisation-suite-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visualisation-suite-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visualisation-suite-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .visualisation-suite-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .visualisation-suite-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .visualisation-suite-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .visualisation-suite-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .visualisation-suite-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .visualisation-suite-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .visualisation-suite-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .visualisation-suite-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .visualisation-suite-stage { opacity: 1; }

    .visualisation-suite-s0 { animation-delay: 0.00s; }
    .visualisation-suite-e0 { animation-delay: 0.00s; }
    .visualisation-suite-s1 { animation-delay: 1.28s; }
    .visualisation-suite-e1 { animation-delay: 1.28s; }
    .visualisation-suite-s2 { animation-delay: 2.56s; }
    .visualisation-suite-e2 { animation-delay: 2.56s; }
    .visualisation-suite-s3 { animation-delay: 3.84s; }
    .visualisation-suite-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .visualisation-suite-conn  { animation: visualisation-suite-trace 6.4s ease-in-out infinite; }
      .visualisation-suite-stage { animation: visualisation-suite-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes visualisation-suite-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes visualisation-suite-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .visualisation-suite-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .visualisation-suite-stage { animation: visualisation-suite-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes visualisation-suite-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="visualisation-suite-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="visualisation-suite-bg" width="980" height="322"/>
  <text class="visualisation-suite-h1"  x="30" y="40">What to put in a model report</text>
  <text class="visualisation-suite-sub" x="30" y="64">Four views.</text>
  <g class="visualisation-suite-stage visualisation-suite-s0">
    <rect class="visualisation-suite-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="visualisation-suite-step" x="44" y="142">01</text>
    <text class="visualisation-suite-name" x="70" y="142">Global importance, from permutation</text>
    <text class="visualisation-suite-desc" x="44" y="166">What the model relies on</text>
    <text class="visualisation-suite-desc" x="44" y="182">overall.</text>
  </g>
  <line class="visualisation-suite-line visualisation-suite-conn visualisation-suite-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#visualisation-suite-tip)"/>
  <g class="visualisation-suite-stage visualisation-suite-s1">
    <rect class="visualisation-suite-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="visualisation-suite-step" x="280" y="142">02</text>
    <text class="visualisation-suite-name" x="306" y="142">Dependence plots for the top features</text>
    <text class="visualisation-suite-desc" x="280" y="166">How each one moves the</text>
    <text class="visualisation-suite-desc" x="280" y="182">prediction.</text>
  </g>
  <line class="visualisation-suite-line visualisation-suite-conn visualisation-suite-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#visualisation-suite-tip)"/>
  <g class="visualisation-suite-stage visualisation-suite-s2">
    <rect class="visualisation-suite-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="visualisation-suite-step" x="516" y="142">03</text>
    <text class="visualisation-suite-name" x="542" y="142">Local attribution for representative cases</text>
    <text class="visualisation-suite-desc" x="516" y="166">Including some the model got</text>
    <text class="visualisation-suite-desc" x="516" y="182">wrong.</text>
  </g>
  <line class="visualisation-suite-line visualisation-suite-conn visualisation-suite-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#visualisation-suite-tip)"/>
  <g class="visualisation-suite-stage visualisation-suite-s3">
    <rect class="visualisation-suite-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="visualisation-suite-step" x="752" y="142">04</text>
    <text class="visualisation-suite-name" x="778" y="142">And the same aggregated per subgroup</text>
    <text class="visualisation-suite-desc" x="752" y="166">Which is the fairness view.</text>
  </g>
  <text class="visualisation-suite-sub" x="30" y="304">Including cases the model got wrong is what makes a report honest rather than promotional, and it is usually where the most useful discussion starts.</text>
</svg>
