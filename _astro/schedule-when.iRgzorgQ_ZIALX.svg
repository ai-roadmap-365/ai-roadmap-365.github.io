<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Known budget, or unknown.">
  <title>Choosing a schedule</title>
  <style>
    .schedule-when-bg   { fill: #f8fafc; }
    .schedule-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedule-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedule-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedule-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedule-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedule-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-when-row { opacity: 1; }
    .schedule-when-r0 { animation-delay: 0.00s; }
    .schedule-when-r1 { animation-delay: 0.45s; }
    .schedule-when-r2 { animation-delay: 0.90s; }
    .schedule-when-r3 { animation-delay: 1.35s; }
    .schedule-when-r4 { animation-delay: 1.80s; }
    .schedule-when-row { animation: schedule-when-reveal 7.3s ease-in-out infinite; }
    @keyframes schedule-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="schedule-when-bg" width="980" height="390"/>
  <text class="schedule-when-h1"  x="30" y="40">Choosing a schedule</text>
  <text class="schedule-when-sub" x="30" y="64">Known budget, or unknown.</text>
  <rect class="schedule-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="schedule-when-name" x="46" y="122">Warmup plus cosine</text>
  <text class="schedule-when-desc" x="46" y="142">Known step budget.</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r0" x="46" y="182">Pre-training or fine-tuning to a fixed length</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r1" x="46" y="216">Transformers and convolutional networks alike</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r2" x="46" y="250">Deterministic and reproducible</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r3" x="46" y="284">The default recipe</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r4" x="46" y="318">Requires knowing the total steps</text>
  <rect class="schedule-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="schedule-when-name" x="526" y="122">Plateau reduction</text>
  <text class="schedule-when-desc" x="526" y="142">Unknown budget.</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r0" x="526" y="182">Train until it stops improving</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r1" x="526" y="216">Reduces on a validation signal</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r2" x="526" y="250">Pairs naturally with early stopping</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r3" x="526" y="284">Reactive rather than planned</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r4" x="526" y="318">When the run length is not fixed</text>
  <text class="schedule-when-sub" x="30" y="372">Almost every published training recipe uses the left column, which reflects that most large-scale training has a fixed compute budget decided before the run rather than a convergence criterion.</text>
</svg>
