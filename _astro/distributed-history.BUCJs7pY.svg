<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From parameter servers to sharding.">
  <title>Four steps to cluster-scale training</title>
  <style>
    .distributed-history-bg   { fill: #f8fafc; }
    .distributed-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distributed-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distributed-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distributed-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distributed-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distributed-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distributed-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .distributed-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .distributed-history-stage { opacity: 1; }

    .distributed-history-s0 { animation-delay: 0.00s; }
    .distributed-history-e0 { animation-delay: 0.00s; }
    .distributed-history-s1 { animation-delay: 1.28s; }
    .distributed-history-e1 { animation-delay: 1.28s; }
    .distributed-history-s2 { animation-delay: 2.56s; }
    .distributed-history-e2 { animation-delay: 2.56s; }
    .distributed-history-s3 { animation-delay: 3.84s; }
    .distributed-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .distributed-history-conn  { animation: distributed-history-trace 6.4s ease-in-out infinite; }
      .distributed-history-stage { animation: distributed-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes distributed-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes distributed-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .distributed-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .distributed-history-stage { animation: distributed-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes distributed-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="distributed-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="distributed-history-bg" width="980" height="322"/>
  <text class="distributed-history-h1"  x="30" y="40">Four steps to cluster-scale training</text>
  <text class="distributed-history-sub" x="30" y="64">From parameter servers to sharding.</text>
  <g class="distributed-history-stage distributed-history-s0">
    <rect class="distributed-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-history-step" x="44" y="142">01</text>
    <text class="distributed-history-name" x="70" y="142">A central parameter server</text>
    <text class="distributed-history-desc" x="44" y="166">Which became the bottleneck as</text>
    <text class="distributed-history-desc" x="44" y="182">clusters grew.</text>
  </g>
  <line class="distributed-history-line distributed-history-conn distributed-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#distributed-history-tip)"/>
  <g class="distributed-history-stage distributed-history-s1">
    <rect class="distributed-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-history-step" x="280" y="142">02</text>
    <text class="distributed-history-name" x="306" y="142">Ring-based averaging</text>
    <text class="distributed-history-desc" x="280" y="166">No central node, and traffic</text>
    <text class="distributed-history-desc" x="280" y="182">independent of cluster size.</text>
  </g>
  <line class="distributed-history-line distributed-history-conn distributed-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#distributed-history-tip)"/>
  <g class="distributed-history-stage distributed-history-s2">
    <rect class="distributed-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-history-step" x="516" y="142">03</text>
    <text class="distributed-history-name" x="542" y="142">Shard the optimiser state</text>
    <text class="distributed-history-desc" x="516" y="166">Removing the redundant copy on</text>
    <text class="distributed-history-desc" x="516" y="182">every device.</text>
  </g>
  <line class="distributed-history-line distributed-history-conn distributed-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#distributed-history-tip)"/>
  <g class="distributed-history-stage distributed-history-s3">
    <rect class="distributed-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="distributed-history-step" x="752" y="142">04</text>
    <text class="distributed-history-name" x="778" y="142">Then combine several axes</text>
    <text class="distributed-history-desc" x="752" y="166">Data, tensor and pipeline</text>
    <text class="distributed-history-desc" x="752" y="182">together, mapped to the network.</text>
  </g>
  <text class="distributed-history-sub" x="30" y="304">Each step removed a different redundancy rather than adding capability, which is why the progression reads as a sequence of bottlenecks discovered and eliminated.</text>
</svg>
