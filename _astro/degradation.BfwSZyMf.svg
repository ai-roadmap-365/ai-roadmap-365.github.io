<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four failures, four decisions.">
  <title>Planned degradation</title>
  <style>
    .degradation-bg   { fill: #f8fafc; }
    .degradation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .degradation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .degradation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .degradation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .degradation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .degradation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .degradation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .degradation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .degradation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .degradation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .degradation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .degradation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .degradation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .degradation-stage { opacity: 1; }

    .degradation-s0 { animation-delay: 0.00s; }
    .degradation-e0 { animation-delay: 0.00s; }
    .degradation-s1 { animation-delay: 1.28s; }
    .degradation-e1 { animation-delay: 1.28s; }
    .degradation-s2 { animation-delay: 2.56s; }
    .degradation-e2 { animation-delay: 2.56s; }
    .degradation-s3 { animation-delay: 3.84s; }
    .degradation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .degradation-conn  { animation: degradation-trace 6.4s ease-in-out infinite; }
      .degradation-stage { animation: degradation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes degradation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes degradation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .degradation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .degradation-stage { animation: degradation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes degradation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="degradation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="degradation-bg" width="980" height="322"/>
  <text class="degradation-h1"  x="30" y="40">Planned degradation</text>
  <text class="degradation-sub" x="30" y="64">Four failures, four decisions.</text>
  <g class="degradation-stage degradation-s0">
    <rect class="degradation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="degradation-step" x="44" y="142">01</text>
    <text class="degradation-name" x="70" y="142">The index is unavailable</text>
    <text class="degradation-desc" x="44" y="166">Fall back to keyword search over</text>
    <text class="degradation-desc" x="44" y="182">cached documents.</text>
  </g>
  <line class="degradation-line degradation-conn degradation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#degradation-tip)"/>
  <g class="degradation-stage degradation-s1">
    <rect class="degradation-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="degradation-step" x="280" y="142">02</text>
    <text class="degradation-name" x="306" y="142">The model is unavailable</text>
    <text class="degradation-desc" x="280" y="166">Return the ranked sources</text>
    <text class="degradation-desc" x="280" y="182">without a written answer.</text>
  </g>
  <line class="degradation-line degradation-conn degradation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#degradation-tip)"/>
  <g class="degradation-stage degradation-s2">
    <rect class="degradation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="degradation-step" x="516" y="142">03</text>
    <text class="degradation-name" x="542" y="142">The request times out</text>
    <text class="degradation-desc" x="516" y="166">Return what was retrieved, and</text>
    <text class="degradation-desc" x="516" y="182">say the answer was not</text>
    <text class="degradation-desc" x="516" y="198">generated.</text>
  </g>
  <line class="degradation-line degradation-conn degradation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#degradation-tip)"/>
  <g class="degradation-stage degradation-s3">
    <rect class="degradation-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="degradation-step" x="752" y="142">04</text>
    <text class="degradation-name" x="778" y="142">Retrieval returns too little</text>
    <text class="degradation-desc" x="752" y="166">Abstain, rather than answering</text>
    <text class="degradation-desc" x="752" y="182">from thin context.</text>
  </g>
  <text class="degradation-sub" x="30" y="304">Every one of these degrades to something useful rather than to an error page, which is only possible because the decisions were made before the incident.</text>
</svg>
