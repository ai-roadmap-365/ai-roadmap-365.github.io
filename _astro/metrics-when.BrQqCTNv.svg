<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what the errors cost.">
  <title>Which metric when</title>
  <style>
    .metrics-when-bg   { fill: #f8fafc; }
    .metrics-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metrics-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metrics-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metrics-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metrics-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metrics-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-when-row { opacity: 1; }
    .metrics-when-r0 { animation-delay: 0.00s; }
    .metrics-when-r1 { animation-delay: 0.45s; }
    .metrics-when-r2 { animation-delay: 0.90s; }
    .metrics-when-r3 { animation-delay: 1.35s; }
    .metrics-when-r4 { animation-delay: 1.80s; }
    .metrics-when-row { animation: metrics-when-reveal 7.3s ease-in-out infinite; }
    @keyframes metrics-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metrics-when-bg" width="980" height="390"/>
  <text class="metrics-when-h1"  x="30" y="40">Which metric when</text>
  <text class="metrics-when-sub" x="30" y="64">By what the errors cost.</text>
  <rect class="metrics-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-when-name" x="46" y="122">The situation</text>
  <text class="metrics-when-desc" x="46" y="142">What you face.</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r0" x="46" y="182">Misses are expensive, alarms are cheap</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r1" x="46" y="216">Alarms are expensive, misses are tolerable</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r2" x="46" y="250">Both matter roughly equally</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r3" x="46" y="284">Classes are heavily imbalanced</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r4" x="46" y="318">Costs are known in real units</text>
  <rect class="metrics-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-when-name" x="526" y="122">The metric</text>
  <text class="metrics-when-desc" x="526" y="142">What to use.</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r0" x="526" y="182">Recall, at a fixed precision floor</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r1" x="526" y="216">Precision, at a fixed recall floor</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r2" x="526" y="250">The combined score, plus the matrix</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r3" x="526" y="284">Precision-recall curve, not the other one</text>
  <text class="metrics-when-desc metrics-when-row metrics-when-r4" x="526" y="318">Expected cost, directly</text>
  <text class="metrics-when-sub" x="30" y="372">The last row is the best answer whenever it is available: optimising expected cost in real units removes the need to choose a proxy metric at all.</text>
</svg>
