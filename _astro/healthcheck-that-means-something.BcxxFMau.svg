<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not one that repeats what the runtime knows.">
  <title>A healthcheck that carries information</title>
  <style>
    .healthcheck-that-means-something-bg   { fill: #f8fafc; }
    .healthcheck-that-means-something-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .healthcheck-that-means-something-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .healthcheck-that-means-something-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .healthcheck-that-means-something-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .healthcheck-that-means-something-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .healthcheck-that-means-something-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .healthcheck-that-means-something-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .healthcheck-that-means-something-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .healthcheck-that-means-something-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .healthcheck-that-means-something-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .healthcheck-that-means-something-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .healthcheck-that-means-something-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .healthcheck-that-means-something-row { opacity: 1; }
    .healthcheck-that-means-something-r0 { animation-delay: 0.00s; }
    .healthcheck-that-means-something-r1 { animation-delay: 0.45s; }
    .healthcheck-that-means-something-r2 { animation-delay: 0.90s; }
    .healthcheck-that-means-something-r3 { animation-delay: 1.35s; }
    .healthcheck-that-means-something-r4 { animation-delay: 1.80s; }
    .healthcheck-that-means-something-row { animation: healthcheck-that-means-something-reveal 7.3s ease-in-out infinite; }
    @keyframes healthcheck-that-means-something-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="healthcheck-that-means-something-bg" width="980" height="390"/>
  <text class="healthcheck-that-means-something-h1"  x="30" y="40">A healthcheck that carries information</text>
  <text class="healthcheck-that-means-something-sub" x="30" y="64">Not one that repeats what the runtime knows.</text>
  <rect class="healthcheck-that-means-something-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="healthcheck-that-means-something-name" x="46" y="122">Meaningful</text>
  <text class="healthcheck-that-means-something-desc" x="46" y="142">Verifies the thing depended on.</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r0" x="46" y="182">The database accepts connections</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r1" x="46" y="216">The model is loaded</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r2" x="46" y="250">The index is warm</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r3" x="46" y="284">A dependant can trust it</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r4" x="46" y="318">Costs a query, per interval</text>
  <rect class="healthcheck-that-means-something-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="healthcheck-that-means-something-name" x="526" y="122">Uninformative</text>
  <text class="healthcheck-that-means-something-desc" x="526" y="142">Duplicates what the runtime knows.</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r0" x="526" y="182">Returns 200 whenever the process is alive</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r1" x="526" y="216">True from the first millisecond</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r2" x="526" y="250">Carries no information</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r3" x="526" y="284">service_healthy becomes service_started</text>
  <text class="healthcheck-that-means-something-desc healthcheck-that-means-something-row healthcheck-that-means-something-r4" x="526" y="318">And service_healthy with no check never passes</text>
  <text class="healthcheck-that-means-something-sub" x="30" y="372">The last row is a real failure the lab reports: `condition: service_healthy` on a service that declares no healthcheck can never be satisfied, so the stack hangs rather than starting early.</text>
</svg>
