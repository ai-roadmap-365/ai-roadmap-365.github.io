<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All of them are breadth, not depth.">
  <title>Four bottlenecks agents remove</title>
  <style>
    .agent-benefits-bg   { fill: #f8fafc; }
    .agent-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .agent-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .agent-benefits-stage { opacity: 1; }

    .agent-benefits-s0 { animation-delay: 0.00s; }
    .agent-benefits-e0 { animation-delay: 0.00s; }
    .agent-benefits-s1 { animation-delay: 1.28s; }
    .agent-benefits-e1 { animation-delay: 1.28s; }
    .agent-benefits-s2 { animation-delay: 2.56s; }
    .agent-benefits-e2 { animation-delay: 2.56s; }
    .agent-benefits-s3 { animation-delay: 3.84s; }
    .agent-benefits-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .agent-benefits-conn  { animation: agent-benefits-trace 6.4s ease-in-out infinite; }
      .agent-benefits-stage { animation: agent-benefits-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes agent-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes agent-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .agent-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .agent-benefits-stage { animation: agent-benefits-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes agent-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="agent-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="agent-benefits-bg" width="980" height="322"/>
  <text class="agent-benefits-h1"  x="30" y="40">Four bottlenecks agents remove</text>
  <text class="agent-benefits-sub" x="30" y="64">All of them are breadth, not depth.</text>
  <g class="agent-benefits-stage agent-benefits-s0">
    <rect class="agent-benefits-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="agent-benefits-step" x="44" y="142">01</text>
    <text class="agent-benefits-name" x="70" y="142">Multi-file coherence</text>
    <text class="agent-benefits-desc" x="44" y="166">A model, a route, a client</text>
    <text class="agent-benefits-desc" x="44" y="182">binding and a test, changed</text>
    <text class="agent-benefits-desc" x="44" y="198">together.</text>
  </g>
  <line class="agent-benefits-line agent-benefits-conn agent-benefits-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#agent-benefits-tip)"/>
  <g class="agent-benefits-stage agent-benefits-s1">
    <rect class="agent-benefits-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="agent-benefits-step" x="280" y="142">02</text>
    <text class="agent-benefits-name" x="306" y="142">Migration drudgery</text>
    <text class="agent-benefits-desc" x="280" y="166">An SDK bump across fifty</text>
    <text class="agent-benefits-desc" x="280" y="182">services, in parallel.</text>
  </g>
  <line class="agent-benefits-line agent-benefits-conn agent-benefits-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#agent-benefits-tip)"/>
  <g class="agent-benefits-stage agent-benefits-s2">
    <rect class="agent-benefits-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="agent-benefits-step" x="516" y="142">03</text>
    <text class="agent-benefits-name" x="542" y="142">Stack-trace diagnosis</text>
    <text class="agent-benefits-desc" x="516" y="166">File and line from the</text>
    <text class="agent-benefits-desc" x="516" y="182">traceback, straight to a</text>
    <text class="agent-benefits-desc" x="516" y="198">targeted fix.</text>
  </g>
  <line class="agent-benefits-line agent-benefits-conn agent-benefits-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#agent-benefits-tip)"/>
  <g class="agent-benefits-stage agent-benefits-s3">
    <rect class="agent-benefits-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="agent-benefits-step" x="752" y="142">04</text>
    <text class="agent-benefits-name" x="778" y="142">Unfamiliar frameworks</text>
    <text class="agent-benefits-desc" x="752" y="166">Architectural quality in a stack</text>
    <text class="agent-benefits-desc" x="752" y="182">you have not used before.</text>
  </g>
  <text class="agent-benefits-sub" x="30" y="304">The second is where the economics are clearest: repetitive mechanical change across many repositories is work that scales linearly with headcount and does not scale with skill.</text>
</svg>
