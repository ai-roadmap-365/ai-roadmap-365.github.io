<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One idea, three architectures.">
  <title>Where gating went next</title>
  <style>
    .gating-legacy-bg   { fill: #f8fafc; }
    .gating-legacy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gating-legacy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gating-legacy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gating-legacy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gating-legacy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gating-legacy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gating-legacy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gating-legacy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gating-legacy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gating-legacy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gating-legacy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gating-legacy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gating-legacy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gating-legacy-stage { opacity: 1; }

    .gating-legacy-s0 { animation-delay: 0.00s; }
    .gating-legacy-e0 { animation-delay: 0.00s; }
    .gating-legacy-s1 { animation-delay: 1.50s; }
    .gating-legacy-e1 { animation-delay: 1.50s; }
    .gating-legacy-s2 { animation-delay: 3.00s; }
    .gating-legacy-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .gating-legacy-conn  { animation: gating-legacy-trace 6s ease-in-out infinite; }
      .gating-legacy-stage { animation: gating-legacy-arrive 6s ease-in-out infinite; }
    }
    @keyframes gating-legacy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gating-legacy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gating-legacy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gating-legacy-stage { animation: gating-legacy-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gating-legacy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gating-legacy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gating-legacy-bg" width="980" height="322"/>
  <text class="gating-legacy-h1"  x="30" y="40">Where gating went next</text>
  <text class="gating-legacy-sub" x="30" y="64">One idea, three architectures.</text>
  <g class="gating-legacy-stage gating-legacy-s0">
    <rect class="gating-legacy-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="gating-legacy-step" x="44" y="142">01</text>
    <text class="gating-legacy-name" x="70" y="142">The LSTM cell state</text>
    <text class="gating-legacy-desc" x="44" y="166">An additive path through time, gated.</text>
  </g>
  <line class="gating-legacy-line gating-legacy-conn gating-legacy-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#gating-legacy-tip)"/>
  <g class="gating-legacy-stage gating-legacy-s1">
    <rect class="gating-legacy-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="gating-legacy-step" x="359" y="142">02</text>
    <text class="gating-legacy-name" x="385" y="142">Highway networks</text>
    <text class="gating-legacy-desc" x="359" y="166">The same gated additive path through depth</text>
    <text class="gating-legacy-desc" x="359" y="182">rather than time.</text>
  </g>
  <line class="gating-legacy-line gating-legacy-conn gating-legacy-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#gating-legacy-tip)"/>
  <g class="gating-legacy-stage gating-legacy-s2">
    <rect class="gating-legacy-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="gating-legacy-step" x="674" y="142">03</text>
    <text class="gating-legacy-name" x="700" y="142">Residual connections</text>
    <text class="gating-legacy-desc" x="674" y="166">The gate removed entirely — always open.</text>
    <text class="gating-legacy-desc" x="674" y="182">Simpler, and better.</text>
  </g>
  <text class="gating-legacy-sub" x="30" y="304">The simplification in the third step is instructive: removing the learned gate and always passing the identity through worked better than learning when to pass it.</text>
</svg>
