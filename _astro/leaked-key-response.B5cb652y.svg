<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Revoke first. Everything else is second.">
  <title>What to do the moment a key is exposed</title>
  <style>
    .leaked-key-response-bg   { fill: #f8fafc; }
    .leaked-key-response-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaked-key-response-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaked-key-response-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaked-key-response-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaked-key-response-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaked-key-response-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leaked-key-response-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leaked-key-response-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leaked-key-response-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leaked-key-response-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leaked-key-response-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leaked-key-response-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .leaked-key-response-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .leaked-key-response-stage { opacity: 1; }

    .leaked-key-response-s0 { animation-delay: 0.00s; }
    .leaked-key-response-e0 { animation-delay: 0.00s; }
    .leaked-key-response-s1 { animation-delay: 1.28s; }
    .leaked-key-response-e1 { animation-delay: 1.28s; }
    .leaked-key-response-s2 { animation-delay: 2.56s; }
    .leaked-key-response-e2 { animation-delay: 2.56s; }
    .leaked-key-response-s3 { animation-delay: 3.84s; }
    .leaked-key-response-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .leaked-key-response-conn  { animation: leaked-key-response-trace 6.4s ease-in-out infinite; }
      .leaked-key-response-stage { animation: leaked-key-response-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes leaked-key-response-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes leaked-key-response-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .leaked-key-response-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .leaked-key-response-stage { animation: leaked-key-response-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes leaked-key-response-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="leaked-key-response-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="leaked-key-response-bg" width="980" height="322"/>
  <text class="leaked-key-response-h1"  x="30" y="40">What to do the moment a key is exposed</text>
  <text class="leaked-key-response-sub" x="30" y="64">Revoke first. Everything else is second.</text>
  <g class="leaked-key-response-stage leaked-key-response-s0">
    <rect class="leaked-key-response-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="leaked-key-response-step" x="44" y="142">01</text>
    <text class="leaked-key-response-name" x="70" y="142">Revoke it at the provider</text>
    <text class="leaked-key-response-desc" x="44" y="166">Before anything else. This is</text>
    <text class="leaked-key-response-desc" x="44" y="182">the only step that actually</text>
    <text class="leaked-key-response-desc" x="44" y="198">stops the bleeding.</text>
    <text class="leaked-key-response-edge" x="44" y="242">first</text>
  </g>
  <line class="leaked-key-response-line leaked-key-response-conn leaked-key-response-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#leaked-key-response-tip)"/>
  <g class="leaked-key-response-stage leaked-key-response-s1">
    <rect class="leaked-key-response-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="leaked-key-response-step" x="280" y="142">02</text>
    <text class="leaked-key-response-name" x="306" y="142">Issue a replacement</text>
    <text class="leaked-key-response-desc" x="280" y="166">Narrower than the old one, if</text>
    <text class="leaked-key-response-desc" x="280" y="182">the old one was broader than it</text>
    <text class="leaked-key-response-desc" x="280" y="198">needed to be.</text>
  </g>
  <line class="leaked-key-response-line leaked-key-response-conn leaked-key-response-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#leaked-key-response-tip)"/>
  <g class="leaked-key-response-stage leaked-key-response-s2">
    <rect class="leaked-key-response-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="leaked-key-response-step" x="516" y="142">03</text>
    <text class="leaked-key-response-name" x="542" y="142">Check the usage log</text>
    <text class="leaked-key-response-desc" x="516" y="166">Was it used? By whom, and for</text>
    <text class="leaked-key-response-desc" x="516" y="182">what? Metered APIs make this</text>
    <text class="leaked-key-response-desc" x="516" y="198">visible.</text>
  </g>
  <line class="leaked-key-response-line leaked-key-response-conn leaked-key-response-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#leaked-key-response-tip)"/>
  <g class="leaked-key-response-stage leaked-key-response-s3">
    <rect class="leaked-key-response-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="leaked-key-response-step" x="752" y="142">04</text>
    <text class="leaked-key-response-name" x="778" y="142">Then clean up the source</text>
    <text class="leaked-key-response-desc" x="752" y="166">Deleting the commit does NOT</text>
    <text class="leaked-key-response-desc" x="752" y="182">help — git keeps the history,</text>
    <text class="leaked-key-response-desc" x="752" y="198">and scanners already saw it.</text>
    <text class="leaked-key-response-edge" x="752" y="242">last</text>
  </g>
  <text class="leaked-key-response-sub" x="30" y="304">Public repositories are scanned continuously, and a committed key is typically found in minutes rather than days. Assume it was seen; act as though it was used.</text>
</svg>
