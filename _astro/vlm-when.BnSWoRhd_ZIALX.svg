<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use a vision-language model</title>
  <style>
    .vlm-when-bg   { fill: #f8fafc; }
    .vlm-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vlm-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vlm-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vlm-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vlm-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vlm-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vlm-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vlm-when-row { opacity: 1; }
    .vlm-when-r0 { animation-delay: 0.00s; }
    .vlm-when-r1 { animation-delay: 0.45s; }
    .vlm-when-r2 { animation-delay: 0.90s; }
    .vlm-when-r3 { animation-delay: 1.35s; }
    .vlm-when-r4 { animation-delay: 1.80s; }
    .vlm-when-row { animation: vlm-when-reveal 7.3s ease-in-out infinite; }
    @keyframes vlm-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vlm-when-bg" width="980" height="390"/>
  <text class="vlm-when-h1"  x="30" y="40">When to use a vision-language model</text>
  <text class="vlm-when-sub" x="30" y="64">And when not to.</text>
  <rect class="vlm-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vlm-when-name" x="46" y="122">Use one</text>
  <text class="vlm-when-desc" x="46" y="142">Four cases.</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r0" x="46" y="182">Documents with varied layouts</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r1" x="46" y="216">Charts, diagrams and screenshots</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r2" x="46" y="250">Questions about image content</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r3" x="46" y="284">Accessibility descriptions</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r4" x="46" y="318">Where structure matters as much as text</text>
  <rect class="vlm-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vlm-when-name" x="526" y="122">Use something else</text>
  <text class="vlm-when-desc" x="526" y="142">Also four.</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r0" x="526" y="182">Digital text — extract it directly</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r1" x="526" y="216">Fixed forms at very high volume</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r2" x="526" y="250">Pure classification — a small vision model is cheaper</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r3" x="526" y="284">Real-time video</text>
  <text class="vlm-when-desc vlm-when-row vlm-when-r4" x="526" y="318">Where exactness is required</text>
  <text class="vlm-when-sub" x="30" y="372">Reaching for a large multimodal model to classify images into a few categories is the common inefficiency here: a small trained classifier is faster, cheaper and usually better.</text>
</svg>
