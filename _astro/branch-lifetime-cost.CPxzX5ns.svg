<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="How long work sits away from main.">
  <title>Every workflow is managing the same thing</title>
  <style>
    .branch-lifetime-cost-bg   { fill: #f8fafc; }
    .branch-lifetime-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .branch-lifetime-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .branch-lifetime-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .branch-lifetime-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .branch-lifetime-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .branch-lifetime-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .branch-lifetime-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .branch-lifetime-cost-row { opacity: 1; }
    .branch-lifetime-cost-r0 { animation-delay: 0.00s; }
    .branch-lifetime-cost-r1 { animation-delay: 0.45s; }
    .branch-lifetime-cost-r2 { animation-delay: 0.90s; }
    .branch-lifetime-cost-r3 { animation-delay: 1.35s; }
    .branch-lifetime-cost-r4 { animation-delay: 1.80s; }
    .branch-lifetime-cost-row { animation: branch-lifetime-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes branch-lifetime-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="branch-lifetime-cost-bg" width="980" height="390"/>
  <text class="branch-lifetime-cost-h1"  x="30" y="40">Every workflow is managing the same thing</text>
  <text class="branch-lifetime-cost-sub" x="30" y="64">How long work sits away from main.</text>
  <rect class="branch-lifetime-cost-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="branch-lifetime-cost-name" x="46" y="122">Hours to days</text>
  <text class="branch-lifetime-cost-desc" x="46" y="142">Small, constant integration.</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r0" x="46" y="182">Main has barely moved</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r1" x="46" y="216">Conflicts are small or absent</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r2" x="46" y="250">The change is small enough to review</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r3" x="46" y="284">Integration risk is spread thin</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r4" x="46" y="318">Needs good tests to be safe</text>
  <rect class="branch-lifetime-cost-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="branch-lifetime-cost-name" x="526" y="122">Weeks to months</text>
  <text class="branch-lifetime-cost-desc" x="526" y="142">One large, risky integration.</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r0" x="526" y="182">Main is unrecognisable</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r1" x="526" y="216">Conflicts across many files</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r2" x="526" y="250">Too large to review meaningfully</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r3" x="526" y="284">All the risk lands on one day</text>
  <text class="branch-lifetime-cost-desc branch-lifetime-cost-row branch-lifetime-cost-r4" x="526" y="318">No amount of process makes this easy</text>
  <text class="branch-lifetime-cost-sub" x="30" y="372">Trunk-based, GitHub Flow and Git Flow are three answers to the same question. They differ in how much structure they add, and every one of them gets harder as the branch gets older.</text>
</svg>
