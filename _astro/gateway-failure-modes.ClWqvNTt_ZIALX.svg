<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each maps to one component.">
  <title>Four failures and their controls</title>
  <style>
    .gateway-failure-modes-bg   { fill: #f8fafc; }
    .gateway-failure-modes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-failure-modes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-failure-modes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-failure-modes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-failure-modes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-failure-modes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-failure-modes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gateway-failure-modes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gateway-failure-modes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gateway-failure-modes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gateway-failure-modes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gateway-failure-modes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-failure-modes-row { opacity: 1; }
    .gateway-failure-modes-r0 { animation-delay: 0.00s; }
    .gateway-failure-modes-r1 { animation-delay: 0.45s; }
    .gateway-failure-modes-r2 { animation-delay: 0.90s; }
    .gateway-failure-modes-r3 { animation-delay: 1.35s; }
    .gateway-failure-modes-r4 { animation-delay: 1.80s; }
    .gateway-failure-modes-row { animation: gateway-failure-modes-reveal 7.3s ease-in-out infinite; }
    @keyframes gateway-failure-modes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gateway-failure-modes-bg" width="980" height="390"/>
  <text class="gateway-failure-modes-h1"  x="30" y="40">Four failures and their controls</text>
  <text class="gateway-failure-modes-sub" x="30" y="64">Each maps to one component.</text>
  <rect class="gateway-failure-modes-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gateway-failure-modes-name" x="46" y="122">The failure</text>
  <text class="gateway-failure-modes-desc" x="46" y="142">All four are common.</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r0" x="46" y="182">Long query lands on a saturated worker</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r1" x="46" y="216">Liveness kills a pod loading weights</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r2" x="46" y="250">One crash floods the survivors</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r3" x="46" y="284">A rollout truncates streaming responses</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r4" x="46" y="318">CPU autoscaling on a saturated GPU</text>
  <rect class="gateway-failure-modes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gateway-failure-modes-name" x="526" y="122">The control</text>
  <text class="gateway-failure-modes-desc" x="526" y="142">One each.</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r0" x="526" y="182">Least-outstanding-requests routing</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r1" x="526" y="216">A startup probe with a 180s budget</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r2" x="526" y="250">A circuit breaker with a fallback</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r3" x="526" y="284">PreStop draining, 30 seconds</text>
  <text class="gateway-failure-modes-desc gateway-failure-modes-row gateway-failure-modes-r4" x="526" y="318">Scale on queue depth instead</text>
  <text class="gateway-failure-modes-sub" x="30" y="372">The last row is worth stating plainly: a GPU worker at full KV-cache saturation can show modest host CPU, so a CPU-based autoscaler will decline to add capacity exactly when the queue is growing.</text>
</svg>
