<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Linked or coincidental.">
  <title>Two dials moving together</title>
  <style>
    .two-dials-bg   { fill: #f8fafc; }
    .two-dials-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-dials-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-dials-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-dials-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-dials-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-dials-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-dials-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-dials-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-dials-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-dials-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-dials-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-dials-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-dials-row { opacity: 1; }
    .two-dials-r0 { animation-delay: 0.00s; }
    .two-dials-r1 { animation-delay: 0.45s; }
    .two-dials-r2 { animation-delay: 0.90s; }
    .two-dials-r3 { animation-delay: 1.35s; }
    .two-dials-r4 { animation-delay: 1.80s; }
    .two-dials-row { animation: two-dials-reveal 7.3s ease-in-out infinite; }
    @keyframes two-dials-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="two-dials-bg" width="980" height="390"/>
  <text class="two-dials-h1"  x="30" y="40">Two dials moving together</text>
  <text class="two-dials-sub" x="30" y="64">Linked or coincidental.</text>
  <rect class="two-dials-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="two-dials-name" x="46" y="122">Directly linked</text>
  <text class="two-dials-desc" x="46" y="142">One drives the other.</text>
  <text class="two-dials-desc two-dials-row two-dials-r0" x="46" y="182">Turning one moves the other</text>
  <text class="two-dials-desc two-dials-row two-dials-r1" x="46" y="216">Blocking one stops the other</text>
  <text class="two-dials-desc two-dials-row two-dials-r2" x="46" y="250">The link is mechanical</text>
  <text class="two-dials-desc two-dials-row two-dials-r3" x="46" y="284">Intervention confirms it</text>
  <text class="two-dials-desc two-dials-row two-dials-r4" x="46" y="318">This is causation</text>
  <rect class="two-dials-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="two-dials-name" x="526" y="122">Driven by a third</text>
  <text class="two-dials-desc" x="526" y="142">Neither drives.</text>
  <text class="two-dials-desc two-dials-row two-dials-r0" x="526" y="182">Both move together</text>
  <text class="two-dials-desc two-dials-row two-dials-r1" x="526" y="216">Blocking one changes nothing</text>
  <text class="two-dials-desc two-dials-row two-dials-r2" x="526" y="250">No link between them</text>
  <text class="two-dials-desc two-dials-row two-dials-r3" x="526" y="284">Intervention reveals the truth</text>
  <text class="two-dials-desc two-dials-row two-dials-r4" x="526" y="318">This is confounding</text>
  <text class="two-dials-sub" x="30" y="372">Intervention distinguishing the two is exactly why experiments matter: observation alone cannot separate a mechanism from a shared driver.</text>
</svg>
