<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different shapes of boundary.">
  <title>Logistic regression against trees</title>
  <style>
    .logreg-vs-tree-bg   { fill: #f8fafc; }
    .logreg-vs-tree-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-tree-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-tree-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-tree-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-tree-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-tree-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logreg-vs-tree-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logreg-vs-tree-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logreg-vs-tree-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logreg-vs-tree-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logreg-vs-tree-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logreg-vs-tree-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logreg-vs-tree-row { opacity: 1; }
    .logreg-vs-tree-r0 { animation-delay: 0.00s; }
    .logreg-vs-tree-r1 { animation-delay: 0.45s; }
    .logreg-vs-tree-r2 { animation-delay: 0.90s; }
    .logreg-vs-tree-r3 { animation-delay: 1.35s; }
    .logreg-vs-tree-r4 { animation-delay: 1.80s; }
    .logreg-vs-tree-row { animation: logreg-vs-tree-reveal 7.3s ease-in-out infinite; }
    @keyframes logreg-vs-tree-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="logreg-vs-tree-bg" width="980" height="390"/>
  <text class="logreg-vs-tree-h1"  x="30" y="40">Logistic regression against trees</text>
  <text class="logreg-vs-tree-sub" x="30" y="64">Different shapes of boundary.</text>
  <rect class="logreg-vs-tree-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="logreg-vs-tree-name" x="46" y="122">Linear</text>
  <text class="logreg-vs-tree-desc" x="46" y="142">One smooth boundary.</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r0" x="46" y="182">A single hyperplane</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r1" x="46" y="216">Smooth probability gradient</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r2" x="46" y="250">Extrapolates beyond the training range</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r3" x="46" y="284">Needs feature scaling</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r4" x="46" y="318">Interpretable as weights</text>
  <rect class="logreg-vs-tree-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="logreg-vs-tree-name" x="526" y="122">Tree-based</text>
  <text class="logreg-vs-tree-desc" x="526" y="142">Axis-aligned steps.</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r0" x="526" y="182">Many rectangular regions</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r1" x="526" y="216">Piecewise-constant probabilities</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r2" x="526" y="250">Cannot extrapolate at all</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r3" x="526" y="284">Scale-invariant</text>
  <text class="logreg-vs-tree-desc logreg-vs-tree-row logreg-vs-tree-r4" x="526" y="318">Interpretable as rules</text>
  <text class="logreg-vs-tree-sub" x="30" y="372">Inability to extrapolate is the tree's most consequential limitation and is rarely mentioned: outside the training range it predicts a constant.</text>
</svg>
