<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward incrementalism.">
  <title>Four steps in design thinking</title>
  <style>
    .design-history-bg   { fill: #f8fafc; }
    .design-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .design-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .design-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .design-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .design-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .design-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .design-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .design-history-stage { opacity: 1; }

    .design-history-s0 { animation-delay: 0.00s; }
    .design-history-e0 { animation-delay: 0.00s; }
    .design-history-s1 { animation-delay: 1.28s; }
    .design-history-e1 { animation-delay: 1.28s; }
    .design-history-s2 { animation-delay: 2.56s; }
    .design-history-e2 { animation-delay: 2.56s; }
    .design-history-s3 { animation-delay: 3.84s; }
    .design-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .design-history-conn  { animation: design-history-trace 6.4s ease-in-out infinite; }
      .design-history-stage { animation: design-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes design-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes design-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .design-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .design-history-stage { animation: design-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes design-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="design-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="design-history-bg" width="980" height="322"/>
  <text class="design-history-h1"  x="30" y="40">Four steps in design thinking</text>
  <text class="design-history-sub" x="30" y="64">Toward incrementalism.</text>
  <g class="design-history-stage design-history-s0">
    <rect class="design-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="design-history-step" x="44" y="142">01</text>
    <text class="design-history-name" x="70" y="142">Design everything before writing anything</text>
    <text class="design-history-desc" x="44" y="166">Which assumed the requirements</text>
    <text class="design-history-desc" x="44" y="182">were known.</text>
  </g>
  <line class="design-history-line design-history-conn design-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#design-history-tip)"/>
  <g class="design-history-stage design-history-s1">
    <rect class="design-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="design-history-step" x="280" y="142">02</text>
    <text class="design-history-name" x="306" y="142">Then structured decomposition</text>
    <text class="design-history-desc" x="280" y="166">Which gave a vocabulary for</text>
    <text class="design-history-desc" x="280" y="182">boundaries.</text>
  </g>
  <line class="design-history-line design-history-conn design-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#design-history-tip)"/>
  <g class="design-history-stage design-history-s2">
    <rect class="design-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="design-history-step" x="516" y="142">03</text>
    <text class="design-history-name" x="542" y="142">Then catalogued patterns</text>
    <text class="design-history-desc" x="516" y="166">Useful as vocabulary, and</text>
    <text class="design-history-desc" x="516" y="182">over-applied as goals.</text>
  </g>
  <line class="design-history-line design-history-conn design-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#design-history-tip)"/>
  <g class="design-history-stage design-history-s3">
    <rect class="design-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="design-history-step" x="752" y="142">04</text>
    <text class="design-history-name" x="778" y="142">And incremental design, adjusted as understanding grows</text>
    <text class="design-history-desc" x="752" y="166">Which is where practice sits</text>
    <text class="design-history-desc" x="752" y="182">now.</text>
  </g>
  <text class="design-history-sub" x="30" y="304">The shift was driven by the observation that requirements are rarely known in advance, which makes a design fixed up front a bet rather than a plan.</text>
</svg>
