<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four facts.">
  <title>Comprehension performance</title>
  <style>
    .comprehension-perf-bg   { fill: #f8fafc; }
    .comprehension-perf-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-perf-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-perf-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-perf-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-perf-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-perf-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .comprehension-perf-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .comprehension-perf-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .comprehension-perf-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .comprehension-perf-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .comprehension-perf-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .comprehension-perf-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .comprehension-perf-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .comprehension-perf-stage { opacity: 1; }

    .comprehension-perf-s0 { animation-delay: 0.00s; }
    .comprehension-perf-e0 { animation-delay: 0.00s; }
    .comprehension-perf-s1 { animation-delay: 1.28s; }
    .comprehension-perf-e1 { animation-delay: 1.28s; }
    .comprehension-perf-s2 { animation-delay: 2.56s; }
    .comprehension-perf-e2 { animation-delay: 2.56s; }
    .comprehension-perf-s3 { animation-delay: 3.84s; }
    .comprehension-perf-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .comprehension-perf-conn  { animation: comprehension-perf-trace 6.4s ease-in-out infinite; }
      .comprehension-perf-stage { animation: comprehension-perf-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes comprehension-perf-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes comprehension-perf-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .comprehension-perf-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .comprehension-perf-stage { animation: comprehension-perf-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes comprehension-perf-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="comprehension-perf-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="comprehension-perf-bg" width="980" height="322"/>
  <text class="comprehension-perf-h1"  x="30" y="40">Comprehension performance</text>
  <text class="comprehension-perf-sub" x="30" y="64">Four facts.</text>
  <g class="comprehension-perf-stage comprehension-perf-s0">
    <rect class="comprehension-perf-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-perf-step" x="44" y="142">01</text>
    <text class="comprehension-perf-name" x="70" y="142">A comprehension has a specialised faster path</text>
    <text class="comprehension-perf-desc" x="44" y="166">Than the equivalent loop with an</text>
    <text class="comprehension-perf-desc" x="44" y="182">append.</text>
  </g>
  <line class="comprehension-perf-line comprehension-perf-conn comprehension-perf-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#comprehension-perf-tip)"/>
  <g class="comprehension-perf-stage comprehension-perf-s1">
    <rect class="comprehension-perf-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-perf-step" x="280" y="142">02</text>
    <text class="comprehension-perf-name" x="306" y="142">But it builds the whole collection in memory</text>
    <text class="comprehension-perf-desc" x="280" y="166">Which a generator does not.</text>
  </g>
  <line class="comprehension-perf-line comprehension-perf-conn comprehension-perf-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#comprehension-perf-tip)"/>
  <g class="comprehension-perf-stage comprehension-perf-s2">
    <rect class="comprehension-perf-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-perf-step" x="516" y="142">03</text>
    <text class="comprehension-perf-name" x="542" y="142">A generator expression trades that for laziness</text>
    <text class="comprehension-perf-desc" x="516" y="166">Constant memory, produced on</text>
    <text class="comprehension-perf-desc" x="516" y="182">demand.</text>
  </g>
  <line class="comprehension-perf-line comprehension-perf-conn comprehension-perf-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#comprehension-perf-tip)"/>
  <g class="comprehension-perf-stage comprehension-perf-s3">
    <rect class="comprehension-perf-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-perf-step" x="752" y="142">04</text>
    <text class="comprehension-perf-name" x="778" y="142">And neither approaches vectorised numerical code</text>
    <text class="comprehension-perf-desc" x="752" y="166">Which is a different order of</text>
    <text class="comprehension-perf-desc" x="752" y="182">magnitude.</text>
  </g>
  <text class="comprehension-perf-sub" x="30" y="304">The last point is worth stating plainly: for numerical work, a comprehension is a faster loop, and a vectorised operation is a different thing entirely.</text>
</svg>
