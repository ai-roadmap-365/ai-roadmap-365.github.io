<svg role="img" aria-label="Time series decomposition chart separating raw signal into underlying trend cyclical seasonality and stationary residual noise components" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Classical Time Series Decomposition</title>
  <defs>
    <linearGradient id="bg192a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg192a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TIME SERIES DECOMPOSITION: SIGNAL = TREND + SEASONALITY + NOISE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Additive vs Multiplicative Classical Structural Decomposition</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#card192)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Observed Signal -->
    <text x="70" y="45" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">1. Observed Y(t)</text>
    <path d="M 180 40 Q 300 15 450 35 T 700 20" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- Trend T(t) -->
    <text x="70" y="105" fill="#10b981" font-family="system-ui" font-size="11" font-weight="700">2. Trend T(t)</text>
    <line x1="180" y1="115" x2="700" y2="85" stroke="#34d399" stroke-width="2.5"/>
    <!-- Seasonality S(t) -->
    <text x="70" y="165" fill="#f59e0b" font-family="system-ui" font-size="11" font-weight="700">3. Seasonal S(t)</text>
    <path d="M 180 165 Q 220 145 260 165 T 340 165 T 420 165 T 500 165 T 580 165 T 660 165 T 700 165" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <!-- Residual R(t) -->
    <text x="70" y="225" fill="#ec4899" font-family="system-ui" font-size="11" font-weight="700">4. Residual R(t)</text>
    <path d="M 180 225 L 220 215 L 260 230 L 300 220 L 340 228 L 380 218 L 420 224 L 460 215 L 500 225 L 540 220 L 580 230 L 620 218 L 660 224 L 700 220" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <text x="375" y="275" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Stationary Residuals: Zero Mean, Constant Variance, No Autocorrelation</text>
  </g>
</svg>
