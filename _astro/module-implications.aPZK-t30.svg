<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are practical.">
  <title>Four consequences of structure</title>
  <style>
    .module-implications-bg   { fill: #f8fafc; }
    .module-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .module-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .module-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .module-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .module-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .module-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .module-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .module-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .module-implications-stage { opacity: 1; }

    .module-implications-s0 { animation-delay: 0.00s; }
    .module-implications-e0 { animation-delay: 0.00s; }
    .module-implications-s1 { animation-delay: 1.28s; }
    .module-implications-e1 { animation-delay: 1.28s; }
    .module-implications-s2 { animation-delay: 2.56s; }
    .module-implications-e2 { animation-delay: 2.56s; }
    .module-implications-s3 { animation-delay: 3.84s; }
    .module-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .module-implications-conn  { animation: module-implications-trace 6.4s ease-in-out infinite; }
      .module-implications-stage { animation: module-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes module-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes module-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .module-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .module-implications-stage { animation: module-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes module-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="module-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="module-implications-bg" width="980" height="322"/>
  <text class="module-implications-h1"  x="30" y="40">Four consequences of structure</text>
  <text class="module-implications-sub" x="30" y="64">Two are practical.</text>
  <g class="module-implications-stage module-implications-s0">
    <rect class="module-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="module-implications-step" x="44" y="142">01</text>
    <text class="module-implications-name" x="70" y="142">Code becomes reusable across projects</text>
    <text class="module-implications-desc" x="44" y="166">Which is the main return.</text>
  </g>
  <line class="module-implications-line module-implications-conn module-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#module-implications-tip)"/>
  <g class="module-implications-stage module-implications-s1">
    <rect class="module-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="module-implications-step" x="280" y="142">02</text>
    <text class="module-implications-name" x="306" y="142">And testable, because modules import independently</text>
    <text class="module-implications-desc" x="280" y="166">Without running a whole program.</text>
  </g>
  <line class="module-implications-line module-implications-conn module-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#module-implications-tip)"/>
  <g class="module-implications-stage module-implications-s2">
    <rect class="module-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="module-implications-step" x="516" y="142">03</text>
    <text class="module-implications-name" x="542" y="142">While the import graph documents the dependencies</text>
    <text class="module-implications-desc" x="516" y="166">And circularity in it signals a</text>
    <text class="module-implications-desc" x="516" y="182">design problem.</text>
  </g>
  <line class="module-implications-line module-implications-conn module-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#module-implications-tip)"/>
  <g class="module-implications-stage module-implications-s3">
    <rect class="module-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="module-implications-step" x="752" y="142">04</text>
    <text class="module-implications-name" x="778" y="142">At the cost of import-time work</text>
    <text class="module-implications-desc" x="752" y="166">Which slows startup if modules</text>
    <text class="module-implications-desc" x="752" y="182">do work on import.</text>
  </g>
  <text class="module-implications-sub" x="30" y="304">Import-time work slowing startup is worth watching in command-line tools, where a module that loads a large model on import makes a help flag take ten seconds.</text>
</svg>
