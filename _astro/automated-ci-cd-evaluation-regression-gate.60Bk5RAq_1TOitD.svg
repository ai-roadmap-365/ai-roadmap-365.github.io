<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Automated CI/CD Evaluation Regression Gate">
  <title>Automated CI/CD Evaluation Regression Gate</title>
  <defs>
    <style>
      .d356b-bg { fill: #f8fafc; }
      .d356b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d356b-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d356b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d356b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d356b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .d356b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d356b-bg" />
  
  <text x="40" y="40" class="d356a-title">CI/CD Evaluation Regression Gate Flow</text>
  <text x="40" y="65" class="d356a-subtitle">Automated CI/CD Evaluation Regression Gate showing Git Push, Golden Dataset Evaluation, Metric Assertion Gate, and Deployment Block on Regression</text>
  
  <!-- Step 1 -->
  <rect x="40" y="110" width="185" height="270" class="d356b-step" />
  <text x="55" y="145" class="d356b-header" fill="#1d4ed8">1. Pull Request</text>
  <text x="55" y="180" class="d356b-text">• Developer edits prompt</text>
  <text x="55" y="205" class="d356b-text">• Git push to origin</text>
  <text x="55" y="230" class="d356b-text">• GitHub Actions trigger</text>
  <text x="55" y="300" class="d356b-text" font-weight="600">Automated Pipeline</text>
  
  <!-- Step 2 -->
  <rect x="250" y="110" width="185" height="270" class="d356b-step" />
  <text x="265" y="145" class="d356b-header" fill="#1d4ed8">2. Run Golden Suite</text>
  <text x="265" y="180" class="d356b-text">• 50 Benchmark queries</text>
  <text x="265" y="205" class="d356b-text">• Execute RAG pipeline</text>
  <text x="265" y="230" class="d356b-text">• Capture context &amp; text</text>
  <text x="265" y="300" class="d356b-text" font-weight="600">Deterministic Test</text>
  
  <!-- Step 3 -->
  <rect x="460" y="110" width="185" height="270" class="d356b-step" />
  <text x="475" y="145" class="d356b-header" fill="#1d4ed8">3. Judge Scoring</text>
  <text x="475" y="180" class="d356b-text">• Faithfulness eval</text>
  <text x="475" y="205" class="d356b-text">• Context recall eval</text>
  <text x="475" y="230" class="d356b-text">• Answer relevancy eval</text>
  <text x="475" y="300" class="d356b-text" font-weight="600">Quantitative Scores</text>
  
  <!-- Step 4 -->
  <rect x="670" y="110" width="190" height="270" class="d356b-step" />
  <text x="685" y="145" class="d356b-header" fill="#1d4ed8">4. Quality Gate</text>
  <text x="685" y="180" class="d356b-text">• Assert Faithfulness &gt;= 0.90</text>
  <text x="685" y="205" class="d356b-text">• Assert Recall &gt;= 0.85</text>
  <text x="685" y="230" class="d356b-text">• If PASS: Merge &amp; Deploy</text>
  <text x="685" y="255" class="d356b-text">• If FAIL: Block PR</text>
  <text x="685" y="300" class="d356b-text" font-weight="600">Zero Regressions</text>
</svg>