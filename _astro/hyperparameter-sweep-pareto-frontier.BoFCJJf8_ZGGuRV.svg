<svg role="img" aria-label="Hyperparameter sweep Pareto frontier plotting learning rate vs validation loss identifying optimal configuration" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Hyperparameter Sweeps &amp; Pareto Frontier</title>
  <defs>
    <linearGradient id="bg235b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card235b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg235b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">HYPERPARAMETER SWEEP: EXPLORING THE CONFIGURATION SPACE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Parallel Coordinate Plot &amp; Bayesian Pareto Optimization (Learning Rate vs. Weight Decay)</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card235b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Axes -->
    <line x1="80" y1="240" x2="660" y2="240" stroke="#94a3b8" stroke-width="2"/>
    <text x="370" y="270" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">Learning Rate (Log Scale: 1e-5 to 1e-2)</text>

    <line x1="80" y1="240" x2="80" y2="30" stroke="#94a3b8" stroke-width="2"/>
    <text x="35" y="135" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" transform="rotate(-90 35 135)">Validation Loss</text>

    <!-- Run Points -->
    <!-- Underfitting / Too Slow (Low LR) -->
    <circle cx="120" cy="180" r="5" fill="#38bdf8"/>
    <circle cx="160" cy="150" r="5" fill="#38bdf8"/>
    <text x="140" y="210" fill="#38bdf8" font-size="8" text-anchor="middle">Underfitting Zone</text>

    <!-- Optimal Pareto Valley -->
    <circle cx="320" cy="75" r="5" fill="#10b981"/>
    <circle cx="360" cy="65" r="7" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
    <circle cx="400" cy="80" r="5" fill="#10b981"/>
    <text x="360" y="48" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Best Run: LR=3e-4, Loss=0.185</text>

    <!-- Runaway Divergence (High LR) -->
    <circle cx="560" cy="190" r="5" fill="#f43f5e"/>
    <circle cx="620" cy="225" r="6" fill="#f43f5e"/>
    <text x="590" y="170" fill="#fb7185" font-size="8" text-anchor="middle">Exploding / NaN Zone</text>

    <!-- Sweep Types Legend -->
    <g transform="translate(100, 20)">
      <rect width="520" height="22" fill="#0f172a" stroke="#64748b" rx="3"/>
      <text x="260" y="15" fill="#cbd5e1" font-size="8" text-anchor="middle">Sweep Methods: Grid Search (Exhaustive) | Random Search (Efficient) | Bayesian Optimization (Adaptive)</text>
    </g>
  </g>
</svg>
