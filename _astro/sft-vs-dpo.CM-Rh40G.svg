<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two kinds of data.">
  <title>Demonstrations against preferences</title>
  <style>
    .sft-vs-dpo-bg   { fill: #f8fafc; }
    .sft-vs-dpo-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sft-vs-dpo-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sft-vs-dpo-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sft-vs-dpo-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sft-vs-dpo-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sft-vs-dpo-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sft-vs-dpo-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sft-vs-dpo-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sft-vs-dpo-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sft-vs-dpo-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sft-vs-dpo-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sft-vs-dpo-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sft-vs-dpo-row { opacity: 1; }
    .sft-vs-dpo-r0 { animation-delay: 0.00s; }
    .sft-vs-dpo-r1 { animation-delay: 0.45s; }
    .sft-vs-dpo-r2 { animation-delay: 0.90s; }
    .sft-vs-dpo-r3 { animation-delay: 1.35s; }
    .sft-vs-dpo-r4 { animation-delay: 1.80s; }
    .sft-vs-dpo-row { animation: sft-vs-dpo-reveal 7.3s ease-in-out infinite; }
    @keyframes sft-vs-dpo-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sft-vs-dpo-bg" width="980" height="390"/>
  <text class="sft-vs-dpo-h1"  x="30" y="40">Demonstrations against preferences</text>
  <text class="sft-vs-dpo-sub" x="30" y="64">Two kinds of data.</text>
  <rect class="sft-vs-dpo-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sft-vs-dpo-name" x="46" y="122">Demonstrations</text>
  <text class="sft-vs-dpo-desc" x="46" y="142">One good answer.</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r0" x="46" y="182">A written ideal response per prompt</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r1" x="46" y="216">Expensive to produce</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r2" x="46" y="250">Teaches format and style</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r3" x="46" y="284">Cannot express what to avoid</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r4" x="46" y="318">Always the first stage</text>
  <rect class="sft-vs-dpo-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sft-vs-dpo-name" x="526" y="122">Preferences</text>
  <text class="sft-vs-dpo-desc" x="526" y="142">Two answers, ranked.</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r0" x="526" y="182">A better and a worse response</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r1" x="526" y="216">Much cheaper to collect</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r2" x="526" y="250">Teaches judgment between options</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r3" x="526" y="284">Expresses what to avoid directly</text>
  <text class="sft-vs-dpo-desc sft-vs-dpo-row sft-vs-dpo-r4" x="526" y="318">Always the second stage</text>
  <text class="sft-vs-dpo-sub" x="30" y="372">The ordering is not arbitrary: preference training refines a model that already answers in the right shape, and applied to a base model it has almost nothing to work with.</text>
</svg>
