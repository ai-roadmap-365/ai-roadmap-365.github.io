<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" role="img" font-family="system-ui, sans-serif">
  <title>How patch resolves a target, step by step: at import time a from-import binds one function object to two names; patch splits its target string at the last dot and replaces an attribute on the named module; naming the module where the function was defined reaches nobody and the real function still runs, while naming the module that looks the name up replaces what the code under test actually calls; on exit the original attribute is always put back</title>
  <rect x="0" y="0" width="900" height="820" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">How patch() resolves a target — and why the wrong one fails silently</text>

  <!-- Step 1 -->
  <rect x="120" y="56" width="660" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. Import time — the binding happens once, before any test runs</text>
  <text x="450" y="106" text-anchor="middle" font-size="14" fill="#1a202c">report_v1.py executes: from sensor_service import fetch_readings</text>
  <text x="450" y="126" text-anchor="middle" font-size="14" fill="#1d4ed8">this copies a reference into report_v1's own namespace</text>
  <line x1="450" y1="132" x2="450" y2="154" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,157 444,143 456,143" fill="#1a202c"/>

  <!-- Step 2 -->
  <rect x="120" y="158" width="660" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. Two names, one function object</text>
  <text x="450" y="208" text-anchor="middle" font-size="14" fill="#1a202c">sensor_service.fetch_readings  and  report_v1.fetch_readings</text>
  <text x="450" y="228" text-anchor="middle" font-size="14" fill="#1d4ed8">the code under test only ever looks up the second one</text>
  <line x1="450" y1="234" x2="450" y2="256" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,259 444,245 456,245" fill="#1a202c"/>

  <!-- Step 3 -->
  <rect x="120" y="260" width="660" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. patch("a.b.c") splits the string at the LAST dot</text>
  <text x="450" y="310" text-anchor="middle" font-size="14" fill="#1a202c">import "a.b", then setattr(that module, "c", the double)</text>
  <text x="450" y="330" text-anchor="middle" font-size="14" fill="#1d4ed8">the attribute must already exist, or patch raises AttributeError</text>

  <!-- Decision -->
  <polygon points="450,346 640,406 450,466 260,406" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. Which module did</text>
  <text x="450" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">you name?</text>

  <!-- Left branch label -->
  <line x1="260" y1="406" x2="180" y2="406" stroke="#1a202c" stroke-width="2"/>
  <line x1="180" y1="406" x2="180" y2="486" stroke="#1a202c" stroke-width="2"/>
  <polygon points="180,489 174,475 186,475" fill="#1a202c"/>
  <text x="222" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">defined</text>

  <!-- Right branch label -->
  <line x1="640" y1="406" x2="720" y2="406" stroke="#1a202c" stroke-width="2"/>
  <line x1="720" y1="406" x2="720" y2="486" stroke="#1a202c" stroke-width="2"/>
  <polygon points="720,489 714,475 726,475" fill="#1a202c"/>
  <text x="682" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">looked up</text>

  <!-- Wrong branch box -->
  <rect x="40" y="490" width="380" height="176" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="230" y="516" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">patch("sensor_service.fetch_readings")</text>
  <text x="230" y="540" text-anchor="middle" font-size="14" fill="#1a202c">the attribute on sensor_service is replaced</text>
  <text x="230" y="562" text-anchor="middle" font-size="14" fill="#1a202c">report_v1 still holds the original reference</text>
  <text x="230" y="588" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">the REAL function runs</text>
  <text x="230" y="612" text-anchor="middle" font-size="14" fill="#1a202c">0.40 s · random values · no error raised</text>
  <text x="230" y="638" text-anchor="middle" font-size="14" fill="#1d4ed8">the test fails, or worse, passes by luck</text>
  <text x="230" y="658" text-anchor="middle" font-size="14" fill="#1d4ed8">the tell is the clock: a stub is instant</text>

  <!-- Right branch box -->
  <rect x="480" y="490" width="380" height="176" fill="#ffffff" stroke="#1a202c" stroke-width="3" rx="8"/>
  <text x="670" y="516" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">patch("report_v1.fetch_readings")</text>
  <text x="670" y="540" text-anchor="middle" font-size="14" fill="#1a202c">the attribute on report_v1 is replaced</text>
  <text x="670" y="562" text-anchor="middle" font-size="14" fill="#1a202c">the call inside report_v1 finds the double</text>
  <text x="670" y="588" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">the double runs</text>
  <text x="670" y="612" text-anchor="middle" font-size="14" fill="#1a202c">0.00 s · the same values every run</text>
  <text x="670" y="638" text-anchor="middle" font-size="14" fill="#1d4ed8">the test asserts what it meant to assert</text>
  <text x="670" y="658" text-anchor="middle" font-size="14" fill="#1d4ed8">build it with autospec, or it lies too</text>

  <!-- Undo -->
  <line x1="230" y1="668" x2="230" y2="696" stroke="#1a202c" stroke-width="2"/>
  <polygon points="230,699 224,685 236,685" fill="#1a202c"/>
  <line x1="670" y1="668" x2="670" y2="696" stroke="#1a202c" stroke-width="2"/>
  <polygon points="670,699 664,685 676,685" fill="#1a202c"/>
  <rect x="120" y="700" width="660" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="726" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5. On exit — the with block ends, or the decorated test returns</text>
  <text x="450" y="750" text-anchor="middle" font-size="14" fill="#1a202c">setattr puts the original object back, even if the test raised</text>
  <text x="450" y="770" text-anchor="middle" font-size="14" fill="#1d4ed8">patcher.start() with no stop() skips this step, and leaks into every later test</text>

  <text x="450" y="806" text-anchor="middle" font-size="15" fill="#1a202c">If report_v1 had said "import sensor_service" instead, the two branches would swap places. Read the import, then choose the target.</text>
</svg>
