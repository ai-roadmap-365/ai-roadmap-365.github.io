<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four layers, each with a compatible range.">
  <title>The dependency graph that causes most AI setup pain</title>
  <style>
    .gpu-stack-versions-bg   { fill: #f8fafc; }
    .gpu-stack-versions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-stack-versions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-stack-versions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-stack-versions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-stack-versions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-stack-versions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gpu-stack-versions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gpu-stack-versions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gpu-stack-versions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gpu-stack-versions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gpu-stack-versions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gpu-stack-versions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gpu-stack-versions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gpu-stack-versions-stage { opacity: 1; }

    .gpu-stack-versions-s0 { animation-delay: 0.00s; }
    .gpu-stack-versions-e0 { animation-delay: 0.00s; }
    .gpu-stack-versions-s1 { animation-delay: 1.28s; }
    .gpu-stack-versions-e1 { animation-delay: 1.28s; }
    .gpu-stack-versions-s2 { animation-delay: 2.56s; }
    .gpu-stack-versions-e2 { animation-delay: 2.56s; }
    .gpu-stack-versions-s3 { animation-delay: 3.84s; }
    .gpu-stack-versions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gpu-stack-versions-conn  { animation: gpu-stack-versions-trace 6.4s ease-in-out infinite; }
      .gpu-stack-versions-stage { animation: gpu-stack-versions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gpu-stack-versions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gpu-stack-versions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gpu-stack-versions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gpu-stack-versions-stage { animation: gpu-stack-versions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gpu-stack-versions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gpu-stack-versions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gpu-stack-versions-bg" width="980" height="322"/>
  <text class="gpu-stack-versions-h1"  x="30" y="40">The dependency graph that causes most AI setup pain</text>
  <text class="gpu-stack-versions-sub" x="30" y="64">Four layers, each with a compatible range.</text>
  <g class="gpu-stack-versions-stage gpu-stack-versions-s0">
    <rect class="gpu-stack-versions-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-stack-versions-step" x="44" y="142">01</text>
    <text class="gpu-stack-versions-name" x="70" y="142">The kernel driver</text>
    <text class="gpu-stack-versions-desc" x="44" y="166">Installed on the host. A kernel</text>
    <text class="gpu-stack-versions-desc" x="44" y="182">component, as Day 6 explained.</text>
    <text class="gpu-stack-versions-edge" x="44" y="242">host only</text>
  </g>
  <line class="gpu-stack-versions-line gpu-stack-versions-conn gpu-stack-versions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gpu-stack-versions-tip)"/>
  <g class="gpu-stack-versions-stage gpu-stack-versions-s1">
    <rect class="gpu-stack-versions-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-stack-versions-step" x="280" y="142">02</text>
    <text class="gpu-stack-versions-name" x="306" y="142">The CUDA runtime</text>
    <text class="gpu-stack-versions-desc" x="280" y="166">Must be within the range the</text>
    <text class="gpu-stack-versions-desc" x="280" y="182">driver supports.</text>
  </g>
  <line class="gpu-stack-versions-line gpu-stack-versions-conn gpu-stack-versions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gpu-stack-versions-tip)"/>
  <g class="gpu-stack-versions-stage gpu-stack-versions-s2">
    <rect class="gpu-stack-versions-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-stack-versions-step" x="516" y="142">03</text>
    <text class="gpu-stack-versions-name" x="542" y="142">cuDNN and friends</text>
    <text class="gpu-stack-versions-desc" x="516" y="166">Pinned to a CUDA version, not</text>
    <text class="gpu-stack-versions-desc" x="516" y="182">merely compatible with one.</text>
  </g>
  <line class="gpu-stack-versions-line gpu-stack-versions-conn gpu-stack-versions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gpu-stack-versions-tip)"/>
  <g class="gpu-stack-versions-stage gpu-stack-versions-s3">
    <rect class="gpu-stack-versions-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-stack-versions-step" x="752" y="142">04</text>
    <text class="gpu-stack-versions-name" x="778" y="142">The framework build</text>
    <text class="gpu-stack-versions-desc" x="752" y="166">torch is published per CUDA</text>
    <text class="gpu-stack-versions-desc" x="752" y="182">version. The wheel you get</text>
    <text class="gpu-stack-versions-desc" x="752" y="198">depends on the platform</text>
    <text class="gpu-stack-versions-edge" x="752" y="242">cu121</text>
  </g>
  <text class="gpu-stack-versions-sub" x="30" y="304">This is why conda earns its place in AI work: it manages the non-Python layers that pip cannot see, and why containers solve the problem so decisively.</text>
</svg>
