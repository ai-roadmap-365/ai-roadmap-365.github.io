<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Perceived time, not real time.">
  <title>Why streaming exists</title>
  <style>
    .streaming-idea-bg   { fill: #f8fafc; }
    .streaming-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .streaming-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .streaming-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .streaming-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .streaming-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .streaming-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .streaming-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .streaming-idea-stage { opacity: 1; }

    .streaming-idea-s0 { animation-delay: 0.00s; }
    .streaming-idea-e0 { animation-delay: 0.00s; }
    .streaming-idea-s1 { animation-delay: 1.28s; }
    .streaming-idea-e1 { animation-delay: 1.28s; }
    .streaming-idea-s2 { animation-delay: 2.56s; }
    .streaming-idea-e2 { animation-delay: 2.56s; }
    .streaming-idea-s3 { animation-delay: 3.84s; }
    .streaming-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .streaming-idea-conn  { animation: streaming-idea-trace 6.4s ease-in-out infinite; }
      .streaming-idea-stage { animation: streaming-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes streaming-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes streaming-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .streaming-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .streaming-idea-stage { animation: streaming-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes streaming-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="streaming-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="streaming-idea-bg" width="980" height="322"/>
  <text class="streaming-idea-h1"  x="30" y="40">Why streaming exists</text>
  <text class="streaming-idea-sub" x="30" y="64">Perceived time, not real time.</text>
  <g class="streaming-idea-stage streaming-idea-s0">
    <rect class="streaming-idea-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-idea-step" x="44" y="142">01</text>
    <text class="streaming-idea-name" x="70" y="142">Without streaming, nothing appears until the end</text>
    <text class="streaming-idea-desc" x="44" y="166">Twenty seconds of blank screen</text>
    <text class="streaming-idea-desc" x="44" y="182">for a long answer.</text>
  </g>
  <line class="streaming-idea-line streaming-idea-conn streaming-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#streaming-idea-tip)"/>
  <g class="streaming-idea-stage streaming-idea-s1">
    <rect class="streaming-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-idea-step" x="280" y="142">02</text>
    <text class="streaming-idea-name" x="306" y="142">Which users read as broken</text>
    <text class="streaming-idea-desc" x="280" y="166">Long before it is actually slow.</text>
  </g>
  <line class="streaming-idea-line streaming-idea-conn streaming-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#streaming-idea-tip)"/>
  <g class="streaming-idea-stage streaming-idea-s2">
    <rect class="streaming-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-idea-step" x="516" y="142">03</text>
    <text class="streaming-idea-name" x="542" y="142">Stream each token as it is produced</text>
    <text class="streaming-idea-desc" x="516" y="166">First words in under a second.</text>
  </g>
  <line class="streaming-idea-line streaming-idea-conn streaming-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#streaming-idea-tip)"/>
  <g class="streaming-idea-stage streaming-idea-s3">
    <rect class="streaming-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-idea-step" x="752" y="142">04</text>
    <text class="streaming-idea-name" x="778" y="142">The total time is identical</text>
    <text class="streaming-idea-desc" x="752" y="166">Only the experience changed.</text>
    <text class="streaming-idea-desc" x="752" y="182">Which is enough.</text>
  </g>
  <text class="streaming-idea-sub" x="30" y="304">That total time is unchanged is worth being explicit about: streaming buys nothing measurable except the one thing users actually respond to.</text>
</svg>
