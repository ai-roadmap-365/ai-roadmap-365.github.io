<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four trades.">
  <title>What is traded for what</title>
  <style>
    .nosql-tradeoff-bg   { fill: #f8fafc; }
    .nosql-tradeoff-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-tradeoff-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-tradeoff-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-tradeoff-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-tradeoff-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-tradeoff-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nosql-tradeoff-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nosql-tradeoff-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nosql-tradeoff-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nosql-tradeoff-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nosql-tradeoff-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nosql-tradeoff-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nosql-tradeoff-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nosql-tradeoff-stage { opacity: 1; }

    .nosql-tradeoff-s0 { animation-delay: 0.00s; }
    .nosql-tradeoff-e0 { animation-delay: 0.00s; }
    .nosql-tradeoff-s1 { animation-delay: 1.28s; }
    .nosql-tradeoff-e1 { animation-delay: 1.28s; }
    .nosql-tradeoff-s2 { animation-delay: 2.56s; }
    .nosql-tradeoff-e2 { animation-delay: 2.56s; }
    .nosql-tradeoff-s3 { animation-delay: 3.84s; }
    .nosql-tradeoff-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nosql-tradeoff-conn  { animation: nosql-tradeoff-trace 6.4s ease-in-out infinite; }
      .nosql-tradeoff-stage { animation: nosql-tradeoff-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nosql-tradeoff-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nosql-tradeoff-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nosql-tradeoff-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nosql-tradeoff-stage { animation: nosql-tradeoff-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nosql-tradeoff-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nosql-tradeoff-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nosql-tradeoff-bg" width="980" height="322"/>
  <text class="nosql-tradeoff-h1"  x="30" y="40">What is traded for what</text>
  <text class="nosql-tradeoff-sub" x="30" y="64">Four trades.</text>
  <g class="nosql-tradeoff-stage nosql-tradeoff-s0">
    <rect class="nosql-tradeoff-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-tradeoff-step" x="44" y="142">01</text>
    <text class="nosql-tradeoff-name" x="70" y="142">Schema flexibility, at the cost of enforced structure</text>
    <text class="nosql-tradeoff-desc" x="44" y="166">The application must check</text>
    <text class="nosql-tradeoff-desc" x="44" y="182">instead.</text>
  </g>
  <line class="nosql-tradeoff-line nosql-tradeoff-conn nosql-tradeoff-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nosql-tradeoff-tip)"/>
  <g class="nosql-tradeoff-stage nosql-tradeoff-s1">
    <rect class="nosql-tradeoff-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-tradeoff-step" x="280" y="142">02</text>
    <text class="nosql-tradeoff-name" x="306" y="142">Fast key access, at the cost of joins</text>
    <text class="nosql-tradeoff-desc" x="280" y="166">Related data must be</text>
    <text class="nosql-tradeoff-desc" x="280" y="182">denormalised.</text>
  </g>
  <line class="nosql-tradeoff-line nosql-tradeoff-conn nosql-tradeoff-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nosql-tradeoff-tip)"/>
  <g class="nosql-tradeoff-stage nosql-tradeoff-s2">
    <rect class="nosql-tradeoff-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-tradeoff-step" x="516" y="142">03</text>
    <text class="nosql-tradeoff-name" x="542" y="142">Availability, at the cost of immediate consistency</text>
    <text class="nosql-tradeoff-desc" x="516" y="166">In distributed designs.</text>
  </g>
  <line class="nosql-tradeoff-line nosql-tradeoff-conn nosql-tradeoff-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nosql-tradeoff-tip)"/>
  <g class="nosql-tradeoff-stage nosql-tradeoff-s3">
    <rect class="nosql-tradeoff-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-tradeoff-step" x="752" y="142">04</text>
    <text class="nosql-tradeoff-name" x="778" y="142">And horizontal scale, at the cost of complexity</text>
    <text class="nosql-tradeoff-desc" x="752" y="166">Which is real operational work.</text>
  </g>
  <text class="nosql-tradeoff-sub" x="30" y="304">The schema does not disappear when it is not declared; it moves into the application, where several versions of it can disagree at once.</text>
</svg>
