<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four kinds.">
  <title>What a test double is</title>
  <style>
    .mock-idea-bg   { fill: #f8fafc; }
    .mock-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mock-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mock-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mock-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mock-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mock-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mock-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mock-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mock-idea-stage { opacity: 1; }

    .mock-idea-s0 { animation-delay: 0.00s; }
    .mock-idea-e0 { animation-delay: 0.00s; }
    .mock-idea-s1 { animation-delay: 1.28s; }
    .mock-idea-e1 { animation-delay: 1.28s; }
    .mock-idea-s2 { animation-delay: 2.56s; }
    .mock-idea-e2 { animation-delay: 2.56s; }
    .mock-idea-s3 { animation-delay: 3.84s; }
    .mock-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mock-idea-conn  { animation: mock-idea-trace 6.4s ease-in-out infinite; }
      .mock-idea-stage { animation: mock-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mock-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mock-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mock-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mock-idea-stage { animation: mock-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mock-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mock-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mock-idea-bg" width="980" height="322"/>
  <text class="mock-idea-h1"  x="30" y="40">What a test double is</text>
  <text class="mock-idea-sub" x="30" y="64">Four kinds.</text>
  <g class="mock-idea-stage mock-idea-s0">
    <rect class="mock-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mock-idea-step" x="44" y="142">01</text>
    <text class="mock-idea-name" x="70" y="142">A stub returns canned answers</text>
    <text class="mock-idea-desc" x="44" y="166">With no logic of its own.</text>
  </g>
  <line class="mock-idea-line mock-idea-conn mock-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mock-idea-tip)"/>
  <g class="mock-idea-stage mock-idea-s1">
    <rect class="mock-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mock-idea-step" x="280" y="142">02</text>
    <text class="mock-idea-name" x="306" y="142">A fake is a working lightweight implementation</text>
    <text class="mock-idea-desc" x="280" y="166">An in-memory store, say.</text>
  </g>
  <line class="mock-idea-line mock-idea-conn mock-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mock-idea-tip)"/>
  <g class="mock-idea-stage mock-idea-s2">
    <rect class="mock-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mock-idea-step" x="516" y="142">03</text>
    <text class="mock-idea-name" x="542" y="142">A mock asserts how it was called</text>
    <text class="mock-idea-desc" x="516" y="166">Which couples the test to the</text>
    <text class="mock-idea-desc" x="516" y="182">interaction.</text>
  </g>
  <line class="mock-idea-line mock-idea-conn mock-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mock-idea-tip)"/>
  <g class="mock-idea-stage mock-idea-s3">
    <rect class="mock-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mock-idea-step" x="752" y="142">04</text>
    <text class="mock-idea-name" x="778" y="142">And a spy records calls for later inspection</text>
    <text class="mock-idea-desc" x="752" y="166">Without dictating them.</text>
  </g>
  <text class="mock-idea-sub" x="30" y="304">The distinction that matters is between doubles that supply data and doubles that assert on interactions, because only the second kind breaks on refactoring.</text>
</svg>
