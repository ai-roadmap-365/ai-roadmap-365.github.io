<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four elements.">
  <title>Reading a time series plot</title>
  <style>
    .ts-how-bg   { fill: #f8fafc; }
    .ts-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ts-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ts-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ts-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ts-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ts-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ts-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ts-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ts-how-stage { opacity: 1; }

    .ts-how-s0 { animation-delay: 0.00s; }
    .ts-how-e0 { animation-delay: 0.00s; }
    .ts-how-s1 { animation-delay: 1.28s; }
    .ts-how-e1 { animation-delay: 1.28s; }
    .ts-how-s2 { animation-delay: 2.56s; }
    .ts-how-e2 { animation-delay: 2.56s; }
    .ts-how-s3 { animation-delay: 3.84s; }
    .ts-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ts-how-conn  { animation: ts-how-trace 6.4s ease-in-out infinite; }
      .ts-how-stage { animation: ts-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ts-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ts-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ts-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ts-how-stage { animation: ts-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ts-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ts-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ts-how-bg" width="980" height="322"/>
  <text class="ts-how-h1"  x="30" y="40">Reading a time series plot</text>
  <text class="ts-how-sub" x="30" y="64">Four elements.</text>
  <g class="ts-how-stage ts-how-s0">
    <rect class="ts-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ts-how-step" x="44" y="142">01</text>
    <text class="ts-how-name" x="70" y="142">The long-run direction, ignoring wiggles</text>
    <text class="ts-how-desc" x="44" y="166">Which is the trend.</text>
  </g>
  <line class="ts-how-line ts-how-conn ts-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ts-how-tip)"/>
  <g class="ts-how-stage ts-how-s1">
    <rect class="ts-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ts-how-step" x="280" y="142">02</text>
    <text class="ts-how-name" x="306" y="142">Repeating patterns at fixed intervals</text>
    <text class="ts-how-desc" x="280" y="166">Daily, weekly, annual.</text>
  </g>
  <line class="ts-how-line ts-how-conn ts-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ts-how-tip)"/>
  <g class="ts-how-stage ts-how-s2">
    <rect class="ts-how-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ts-how-step" x="516" y="142">03</text>
    <text class="ts-how-name" x="542" y="142">Sudden level shifts at a point in time</text>
    <text class="ts-how-desc" x="516" y="166">Which usually indicate a change</text>
    <text class="ts-how-desc" x="516" y="182">in process.</text>
  </g>
  <line class="ts-how-line ts-how-conn ts-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ts-how-tip)"/>
  <g class="ts-how-stage ts-how-s3">
    <rect class="ts-how-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ts-how-step" x="752" y="142">04</text>
    <text class="ts-how-name" x="778" y="142">And gaps, which must be shown as gaps</text>
    <text class="ts-how-desc" x="752" y="166">Not connected by a line.</text>
  </g>
  <text class="ts-how-sub" x="30" y="304">Connecting across a gap is a genuine distortion, because the line implies observations that were never made and a continuity that may not hold.</text>
</svg>
