<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The cycle repeats billions of times a second. Every program you run is this loop.">
  <title>One instruction, four stages</title>
  <style>
    .fetch-decode-execute-cycle-bg   { fill: #f8fafc; }
    .fetch-decode-execute-cycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fetch-decode-execute-cycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fetch-decode-execute-cycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fetch-decode-execute-cycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fetch-decode-execute-cycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fetch-decode-execute-cycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fetch-decode-execute-cycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fetch-decode-execute-cycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fetch-decode-execute-cycle-stage { opacity: 1; }

    .fetch-decode-execute-cycle-s0 { animation-delay: 0.00s; }
    .fetch-decode-execute-cycle-e0 { animation-delay: 0.00s; }
    .fetch-decode-execute-cycle-s1 { animation-delay: 1.28s; }
    .fetch-decode-execute-cycle-e1 { animation-delay: 1.28s; }
    .fetch-decode-execute-cycle-s2 { animation-delay: 2.56s; }
    .fetch-decode-execute-cycle-e2 { animation-delay: 2.56s; }
    .fetch-decode-execute-cycle-s3 { animation-delay: 3.84s; }
    .fetch-decode-execute-cycle-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fetch-decode-execute-cycle-conn  { animation: fetch-decode-execute-cycle-trace 6.4s ease-in-out infinite; }
      .fetch-decode-execute-cycle-stage { animation: fetch-decode-execute-cycle-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fetch-decode-execute-cycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fetch-decode-execute-cycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fetch-decode-execute-cycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fetch-decode-execute-cycle-stage { animation: fetch-decode-execute-cycle-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fetch-decode-execute-cycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fetch-decode-execute-cycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fetch-decode-execute-cycle-bg" width="980" height="322"/>
  <text class="fetch-decode-execute-cycle-h1"  x="30" y="40">One instruction, four stages</text>
  <text class="fetch-decode-execute-cycle-sub" x="30" y="64">The cycle repeats billions of times a second. Every program you run is this loop.</text>
  <g class="fetch-decode-execute-cycle-stage fetch-decode-execute-cycle-s0">
    <rect class="fetch-decode-execute-cycle-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fetch-decode-execute-cycle-step" x="44" y="142">01</text>
    <text class="fetch-decode-execute-cycle-name" x="70" y="142">Fetch</text>
    <text class="fetch-decode-execute-cycle-desc" x="44" y="166">The program counter names an</text>
    <text class="fetch-decode-execute-cycle-desc" x="44" y="182">address; memory answers with the</text>
    <text class="fetch-decode-execute-cycle-desc" x="44" y="198">instruction.</text>
    <text class="fetch-decode-execute-cycle-edge" x="44" y="242">PC advances</text>
  </g>
  <line class="fetch-decode-execute-cycle-line fetch-decode-execute-cycle-conn fetch-decode-execute-cycle-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fetch-decode-execute-cycle-tip)"/>
  <g class="fetch-decode-execute-cycle-stage fetch-decode-execute-cycle-s1">
    <rect class="fetch-decode-execute-cycle-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fetch-decode-execute-cycle-step" x="280" y="142">02</text>
    <text class="fetch-decode-execute-cycle-name" x="306" y="142">Decode</text>
    <text class="fetch-decode-execute-cycle-desc" x="280" y="166">The control unit works out what</text>
    <text class="fetch-decode-execute-cycle-desc" x="280" y="182">the bits mean and which units to</text>
    <text class="fetch-decode-execute-cycle-desc" x="280" y="198">wake.</text>
    <text class="fetch-decode-execute-cycle-edge" x="280" y="242">control unit</text>
  </g>
  <line class="fetch-decode-execute-cycle-line fetch-decode-execute-cycle-conn fetch-decode-execute-cycle-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fetch-decode-execute-cycle-tip)"/>
  <g class="fetch-decode-execute-cycle-stage fetch-decode-execute-cycle-s2">
    <rect class="fetch-decode-execute-cycle-hi" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fetch-decode-execute-cycle-step" x="516" y="142">03</text>
    <text class="fetch-decode-execute-cycle-name" x="542" y="142">Execute</text>
    <text class="fetch-decode-execute-cycle-desc" x="516" y="166">The arithmetic unit does the</text>
    <text class="fetch-decode-execute-cycle-desc" x="516" y="182">work on values held in</text>
    <text class="fetch-decode-execute-cycle-desc" x="516" y="198">registers.</text>
    <text class="fetch-decode-execute-cycle-edge" x="516" y="242">ALU</text>
  </g>
  <line class="fetch-decode-execute-cycle-line fetch-decode-execute-cycle-conn fetch-decode-execute-cycle-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fetch-decode-execute-cycle-tip)"/>
  <g class="fetch-decode-execute-cycle-stage fetch-decode-execute-cycle-s3">
    <rect class="fetch-decode-execute-cycle-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fetch-decode-execute-cycle-step" x="752" y="142">04</text>
    <text class="fetch-decode-execute-cycle-name" x="778" y="142">Write back</text>
    <text class="fetch-decode-execute-cycle-desc" x="752" y="166">The result is stored back into a</text>
    <text class="fetch-decode-execute-cycle-desc" x="752" y="182">register or out to memory.</text>
    <text class="fetch-decode-execute-cycle-edge" x="752" y="242">registers</text>
  </g>
  <text class="fetch-decode-execute-cycle-sub" x="30" y="304">An instruction can overwrite the already-advanced program counter — that is exactly what a jump or a loop is.</text>
</svg>
