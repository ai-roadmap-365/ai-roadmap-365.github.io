<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both isolate. Only one boots an operating system.">
  <title>Why a container starts in a second</title>
  <style>
    .vm-versus-container-bg   { fill: #f8fafc; }
    .vm-versus-container-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vm-versus-container-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vm-versus-container-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vm-versus-container-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vm-versus-container-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vm-versus-container-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vm-versus-container-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vm-versus-container-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vm-versus-container-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vm-versus-container-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vm-versus-container-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vm-versus-container-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vm-versus-container-row { opacity: 1; }
    .vm-versus-container-r0 { animation-delay: 0.00s; }
    .vm-versus-container-r1 { animation-delay: 0.45s; }
    .vm-versus-container-r2 { animation-delay: 0.90s; }
    .vm-versus-container-r3 { animation-delay: 1.35s; }
    .vm-versus-container-r4 { animation-delay: 1.80s; }
    .vm-versus-container-row { animation: vm-versus-container-reveal 7.3s ease-in-out infinite; }
    @keyframes vm-versus-container-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vm-versus-container-bg" width="980" height="390"/>
  <text class="vm-versus-container-h1"  x="30" y="40">Why a container starts in a second</text>
  <text class="vm-versus-container-sub" x="30" y="64">Both isolate. Only one boots an operating system.</text>
  <rect class="vm-versus-container-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vm-versus-container-name" x="46" y="122">Virtual machine</text>
  <text class="vm-versus-container-desc" x="46" y="142">Virtualises the hardware.</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r0" x="46" y="182">Its own full kernel, booted from scratch</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r1" x="46" y="216">Gigabytes of guest operating system</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r2" x="46" y="250">Startup measured in tens of seconds</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r3" x="46" y="284">Isolation enforced by the hypervisor</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r4" x="46" y="318">Can run a different OS entirely</text>
  <rect class="vm-versus-container-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vm-versus-container-name" x="526" y="122">Container</text>
  <text class="vm-versus-container-desc" x="526" y="142">Virtualises the operating system's view.</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r0" x="526" y="182">Shares the host's running kernel</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r1" x="526" y="216">Megabytes — just your program and its libraries</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r2" x="526" y="250">Startup measured in a second</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r3" x="526" y="284">Isolation from kernel namespaces and cgroups</text>
  <text class="vm-versus-container-desc vm-versus-container-row vm-versus-container-r4" x="526" y="318">Must match the host kernel's OS family</text>
  <text class="vm-versus-container-sub" x="30" y="372">This is why a GPU container still needs the driver on the host: the container is borrowing the host's kernel, and drivers are kernel components.</text>
</svg>
