<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three checks, in order, and the first no wins.">
  <title>Attributing a bad answer</title>
  <style>
    .failure-attribution-bg   { fill: #f8fafc; }
    .failure-attribution-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-attribution-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-attribution-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-attribution-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-attribution-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-attribution-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .failure-attribution-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .failure-attribution-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .failure-attribution-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .failure-attribution-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .failure-attribution-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .failure-attribution-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .failure-attribution-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .failure-attribution-stage { opacity: 1; }

    .failure-attribution-s0 { animation-delay: 0.00s; }
    .failure-attribution-e0 { animation-delay: 0.00s; }
    .failure-attribution-s1 { animation-delay: 1.28s; }
    .failure-attribution-e1 { animation-delay: 1.28s; }
    .failure-attribution-s2 { animation-delay: 2.56s; }
    .failure-attribution-e2 { animation-delay: 2.56s; }
    .failure-attribution-s3 { animation-delay: 3.84s; }
    .failure-attribution-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .failure-attribution-conn  { animation: failure-attribution-trace 6.4s ease-in-out infinite; }
      .failure-attribution-stage { animation: failure-attribution-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes failure-attribution-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes failure-attribution-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .failure-attribution-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .failure-attribution-stage { animation: failure-attribution-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes failure-attribution-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="failure-attribution-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="failure-attribution-bg" width="980" height="322"/>
  <text class="failure-attribution-h1"  x="30" y="40">Attributing a bad answer</text>
  <text class="failure-attribution-sub" x="30" y="64">Three checks, in order, and the first no wins.</text>
  <g class="failure-attribution-stage failure-attribution-s0">
    <rect class="failure-attribution-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="failure-attribution-step" x="44" y="142">01</text>
    <text class="failure-attribution-name" x="70" y="142">Was the passage retrieved at all?</text>
    <text class="failure-attribution-desc" x="44" y="166">Check the shortlist. If not, it</text>
    <text class="failure-attribution-desc" x="44" y="182">is a retrieval problem and</text>
    <text class="failure-attribution-desc" x="44" y="198">nothing else matters.</text>
    <text class="failure-attribution-edge" x="44" y="242">retrieval</text>
  </g>
  <line class="failure-attribution-line failure-attribution-conn failure-attribution-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#failure-attribution-tip)"/>
  <g class="failure-attribution-stage failure-attribution-s1">
    <rect class="failure-attribution-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="failure-attribution-step" x="280" y="142">02</text>
    <text class="failure-attribution-name" x="306" y="142">Did it survive into the prompt?</text>
    <text class="failure-attribution-desc" x="280" y="166">Truncation drops passages</text>
    <text class="failure-attribution-desc" x="280" y="182">silently — day 354's case.</text>
    <text class="failure-attribution-edge" x="280" y="242">truncation</text>
  </g>
  <line class="failure-attribution-line failure-attribution-conn failure-attribution-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#failure-attribution-tip)"/>
  <g class="failure-attribution-stage failure-attribution-s2">
    <rect class="failure-attribution-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="failure-attribution-step" x="516" y="142">03</text>
    <text class="failure-attribution-name" x="542" y="142">Did the model use it?</text>
    <text class="failure-attribution-desc" x="516" y="166">Present in context and absent</text>
    <text class="failure-attribution-desc" x="516" y="182">from the answer is a generation</text>
    <text class="failure-attribution-desc" x="516" y="198">problem.</text>
    <text class="failure-attribution-edge" x="516" y="242">generation</text>
  </g>
  <line class="failure-attribution-line failure-attribution-conn failure-attribution-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#failure-attribution-tip)"/>
  <g class="failure-attribution-stage failure-attribution-s3">
    <rect class="failure-attribution-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="failure-attribution-step" x="752" y="142">04</text>
    <text class="failure-attribution-name" x="778" y="142">Fix the stage you found</text>
    <text class="failure-attribution-desc" x="752" y="166">Not the one you assumed. They</text>
    <text class="failure-attribution-desc" x="752" y="182">need entirely different work.</text>
  </g>
  <text class="failure-attribution-sub" x="30" y="304">Without this ordering the default response to a bad answer is to change the prompt, which is the third stage — and prompt changes cannot fix a passage that was never retrieved.</text>
</svg>
