<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Filtering is not partitioning.">
  <title>Isolating tenants in a vector index</title>
  <style>
    .tenant-isolation-bg   { fill: #f8fafc; }
    .tenant-isolation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-isolation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-isolation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-isolation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-isolation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-isolation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tenant-isolation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tenant-isolation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tenant-isolation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tenant-isolation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tenant-isolation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tenant-isolation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tenant-isolation-row { opacity: 1; }
    .tenant-isolation-r0 { animation-delay: 0.00s; }
    .tenant-isolation-r1 { animation-delay: 0.45s; }
    .tenant-isolation-r2 { animation-delay: 0.90s; }
    .tenant-isolation-r3 { animation-delay: 1.35s; }
    .tenant-isolation-r4 { animation-delay: 1.80s; }
    .tenant-isolation-row { animation: tenant-isolation-reveal 7.3s ease-in-out infinite; }
    @keyframes tenant-isolation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tenant-isolation-bg" width="980" height="390"/>
  <text class="tenant-isolation-h1"  x="30" y="40">Isolating tenants in a vector index</text>
  <text class="tenant-isolation-sub" x="30" y="64">Filtering is not partitioning.</text>
  <rect class="tenant-isolation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tenant-isolation-name" x="46" y="122">Hard isolation</text>
  <text class="tenant-isolation-desc" x="46" y="142">Separate by construction.</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r0" x="46" y="182">Per-tenant collections or namespaces</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r1" x="46" y="216">A missing filter cannot leak</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r2" x="46" y="250">Enforced at the storage layer</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r3" x="46" y="284">Verifiable by inspection</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r4" x="46" y="318">Costs a little more to operate</text>
  <rect class="tenant-isolation-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tenant-isolation-name" x="526" y="122">Filtered only</text>
  <text class="tenant-isolation-desc" x="526" y="142">One index, a where clause.</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r0" x="526" y="182">All tenants in one collection</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r1" x="526" y="216">Correctness depends on every query</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r2" x="526" y="250">One omitted filter is a breach</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r3" x="526" y="284">And similarity search will find neighbours</text>
  <text class="tenant-isolation-desc tenant-isolation-row tenant-isolation-r4" x="526" y="318">Cheaper, until it is not</text>
  <text class="tenant-isolation-sub" x="30" y="372">Similarity search makes this sharper than it would be for a relational table: an unfiltered vector query does not return a random other tenant's row, it returns their most relevant one.</text>
</svg>
