<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four tiers.">
  <title>The baseline ladder</title>
  <style>
    .baseline-ladder-bg   { fill: #f8fafc; }
    .baseline-ladder-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-ladder-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-ladder-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-ladder-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-ladder-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-ladder-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baseline-ladder-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .baseline-ladder-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .baseline-ladder-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .baseline-ladder-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .baseline-ladder-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .baseline-ladder-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .baseline-ladder-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .baseline-ladder-stage { opacity: 1; }

    .baseline-ladder-s0 { animation-delay: 0.00s; }
    .baseline-ladder-e0 { animation-delay: 0.00s; }
    .baseline-ladder-s1 { animation-delay: 1.28s; }
    .baseline-ladder-e1 { animation-delay: 1.28s; }
    .baseline-ladder-s2 { animation-delay: 2.56s; }
    .baseline-ladder-e2 { animation-delay: 2.56s; }
    .baseline-ladder-s3 { animation-delay: 3.84s; }
    .baseline-ladder-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .baseline-ladder-conn  { animation: baseline-ladder-trace 6.4s ease-in-out infinite; }
      .baseline-ladder-stage { animation: baseline-ladder-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes baseline-ladder-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes baseline-ladder-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .baseline-ladder-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .baseline-ladder-stage { animation: baseline-ladder-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes baseline-ladder-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="baseline-ladder-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="baseline-ladder-bg" width="980" height="322"/>
  <text class="baseline-ladder-h1"  x="30" y="40">The baseline ladder</text>
  <text class="baseline-ladder-sub" x="30" y="64">Four tiers.</text>
  <g class="baseline-ladder-stage baseline-ladder-s0">
    <rect class="baseline-ladder-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-ladder-step" x="44" y="142">01</text>
    <text class="baseline-ladder-name" x="70" y="142">The trivial baseline</text>
    <text class="baseline-ladder-desc" x="44" y="166">Always predict the majority, or</text>
    <text class="baseline-ladder-desc" x="44" y="182">the mean. The absolute floor.</text>
  </g>
  <line class="baseline-ladder-line baseline-ladder-conn baseline-ladder-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#baseline-ladder-tip)"/>
  <g class="baseline-ladder-stage baseline-ladder-s1">
    <rect class="baseline-ladder-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-ladder-step" x="280" y="142">02</text>
    <text class="baseline-ladder-name" x="306" y="142">The existing business rule</text>
    <text class="baseline-ladder-desc" x="280" y="166">What the model would actually</text>
    <text class="baseline-ladder-desc" x="280" y="182">replace.</text>
  </g>
  <line class="baseline-ladder-line baseline-ladder-conn baseline-ladder-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#baseline-ladder-tip)"/>
  <g class="baseline-ladder-stage baseline-ladder-s2">
    <rect class="baseline-ladder-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-ladder-step" x="516" y="142">03</text>
    <text class="baseline-ladder-name" x="542" y="142">A simple model</text>
    <text class="baseline-ladder-desc" x="516" y="166">Logistic or linear regression,</text>
    <text class="baseline-ladder-desc" x="516" y="182">fitted in minutes.</text>
  </g>
  <line class="baseline-ladder-line baseline-ladder-conn baseline-ladder-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#baseline-ladder-tip)"/>
  <g class="baseline-ladder-stage baseline-ladder-s3">
    <rect class="baseline-ladder-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-ladder-step" x="752" y="142">04</text>
    <text class="baseline-ladder-name" x="778" y="142">Then the complex model</text>
    <text class="baseline-ladder-desc" x="752" y="166">Which must beat all three to be</text>
    <text class="baseline-ladder-desc" x="752" y="182">worth anything.</text>
  </g>
  <text class="baseline-ladder-sub" x="30" y="304">The second tier is the one that is skipped and the one that matters: a model beating chance but losing to the existing rule is a project that should stop.</text>
</svg>
