<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Memory, tuning, stability and defaults.">
  <title>Four consequences of optimiser choice</title>
  <style>
    .optimiser-implications-bg   { fill: #f8fafc; }
    .optimiser-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .optimiser-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .optimiser-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .optimiser-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .optimiser-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .optimiser-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .optimiser-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .optimiser-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .optimiser-implications-stage { opacity: 1; }

    .optimiser-implications-s0 { animation-delay: 0.00s; }
    .optimiser-implications-e0 { animation-delay: 0.00s; }
    .optimiser-implications-s1 { animation-delay: 1.28s; }
    .optimiser-implications-e1 { animation-delay: 1.28s; }
    .optimiser-implications-s2 { animation-delay: 2.56s; }
    .optimiser-implications-e2 { animation-delay: 2.56s; }
    .optimiser-implications-s3 { animation-delay: 3.84s; }
    .optimiser-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .optimiser-implications-conn  { animation: optimiser-implications-trace 6.4s ease-in-out infinite; }
      .optimiser-implications-stage { animation: optimiser-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes optimiser-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes optimiser-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .optimiser-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .optimiser-implications-stage { animation: optimiser-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes optimiser-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="optimiser-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="optimiser-implications-bg" width="980" height="322"/>
  <text class="optimiser-implications-h1"  x="30" y="40">Four consequences of optimiser choice</text>
  <text class="optimiser-implications-sub" x="30" y="64">Memory, tuning, stability and defaults.</text>
  <g class="optimiser-implications-stage optimiser-implications-s0">
    <rect class="optimiser-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="optimiser-implications-step" x="44" y="142">01</text>
    <text class="optimiser-implications-name" x="70" y="142">State is memory</text>
    <text class="optimiser-implications-desc" x="44" y="166">Adam stores two values per</text>
    <text class="optimiser-implications-desc" x="44" y="182">parameter: three times the</text>
    <text class="optimiser-implications-desc" x="44" y="198">parameter memory to train.</text>
    <text class="optimiser-implications-edge" x="44" y="242">3x</text>
  </g>
  <line class="optimiser-implications-line optimiser-implications-conn optimiser-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#optimiser-implications-tip)"/>
  <g class="optimiser-implications-stage optimiser-implications-s1">
    <rect class="optimiser-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="optimiser-implications-step" x="280" y="142">02</text>
    <text class="optimiser-implications-name" x="306" y="142">Adaptivity reduces tuning</text>
    <text class="optimiser-implications-desc" x="280" y="166">A learning rate that works</text>
    <text class="optimiser-implications-desc" x="280" y="182">across architectures, which is</text>
    <text class="optimiser-implications-desc" x="280" y="198">most of Adam's appeal.</text>
  </g>
  <line class="optimiser-implications-line optimiser-implications-conn optimiser-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#optimiser-implications-tip)"/>
  <g class="optimiser-implications-stage optimiser-implications-s2">
    <rect class="optimiser-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="optimiser-implications-step" x="516" y="142">03</text>
    <text class="optimiser-implications-name" x="542" y="142">Epsilon prevents division by zero</text>
    <text class="optimiser-implications-desc" x="516" y="166">And its value affects behaviour</text>
    <text class="optimiser-implications-desc" x="516" y="182">on very small gradients.</text>
  </g>
  <line class="optimiser-implications-line optimiser-implications-conn optimiser-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#optimiser-implications-tip)"/>
  <g class="optimiser-implications-stage optimiser-implications-s3">
    <rect class="optimiser-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="optimiser-implications-step" x="752" y="142">04</text>
    <text class="optimiser-implications-name" x="778" y="142">Defaults differ by domain</text>
    <text class="optimiser-implications-desc" x="752" y="166">Momentum SGD for vision; AdamW</text>
    <text class="optimiser-implications-desc" x="752" y="182">for language.</text>
  </g>
  <text class="optimiser-implications-sub" x="30" y="304">The memory figure decides architecture at scale: a model that fits in memory for inference may not fit for training, purely because of optimiser state.</text>
</svg>
