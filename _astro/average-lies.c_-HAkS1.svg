<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A single number over a distribution says nothing about its shape.">
  <title>Why percentiles and not averages</title>
  <style>
    .average-lies-bg   { fill: #f8fafc; }
    .average-lies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .average-lies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .average-lies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .average-lies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .average-lies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .average-lies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .average-lies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .average-lies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .average-lies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .average-lies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .average-lies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .average-lies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .average-lies-row { opacity: 1; }
    .average-lies-r0 { animation-delay: 0.00s; }
    .average-lies-r1 { animation-delay: 0.45s; }
    .average-lies-r2 { animation-delay: 0.90s; }
    .average-lies-r3 { animation-delay: 1.35s; }
    .average-lies-r4 { animation-delay: 1.80s; }
    .average-lies-row { animation: average-lies-reveal 7.3s ease-in-out infinite; }
    @keyframes average-lies-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="average-lies-bg" width="980" height="390"/>
  <text class="average-lies-h1"  x="30" y="40">Why percentiles and not averages</text>
  <text class="average-lies-sub" x="30" y="64">A single number over a distribution says nothing about its shape.</text>
  <rect class="average-lies-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="average-lies-name" x="46" y="122">"Average 200 ms"</text>
  <text class="average-lies-desc" x="46" y="142">Looks healthy.</text>
  <text class="average-lies-desc average-lies-row average-lies-r0" x="46" y="182">One number for every request</text>
  <text class="average-lies-desc average-lies-row average-lies-r1" x="46" y="216">Hides the shape entirely</text>
  <text class="average-lies-desc average-lies-row average-lies-r2" x="46" y="250">95 fast requests offset 5 terrible ones</text>
  <text class="average-lies-desc average-lies-row average-lies-r3" x="46" y="284">The dashboard stays green</text>
  <text class="average-lies-desc average-lies-row average-lies-r4" x="46" y="318">And users are complaining</text>
  <rect class="average-lies-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="average-lies-name" x="526" y="122">p50 180, p95 790, p99 4180</text>
  <text class="average-lies-desc" x="526" y="142">Describes what people experience.</text>
  <text class="average-lies-desc average-lies-row average-lies-r0" x="526" y="182">Half of requests under 180 ms</text>
  <text class="average-lies-desc average-lies-row average-lies-r1" x="526" y="216">One in twenty over 790 ms</text>
  <text class="average-lies-desc average-lies-row average-lies-r2" x="526" y="250">One in a hundred over four seconds</text>
  <text class="average-lies-desc average-lies-row average-lies-r3" x="526" y="284">The tail is visible, and measurable</text>
  <text class="average-lies-desc average-lies-row average-lies-r4" x="526" y="318">This is what users actually feel</text>
  <text class="average-lies-sub" x="30" y="372">The unlucky one-in-twenty is the person who complains, churns, and tells other people. Averages are the statistic that systematically hides exactly the users you most need to know about.</text>
</svg>
