<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things fetching data is not</title>
  <style>
    .api135-not-bg   { fill: #f8fafc; }
    .api135-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api135-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api135-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api135-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api135-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api135-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api135-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api135-not-row { opacity: 1; }
    .api135-not-r0 { animation-delay: 0.00s; }
    .api135-not-r1 { animation-delay: 0.45s; }
    .api135-not-r2 { animation-delay: 0.90s; }
    .api135-not-r3 { animation-delay: 1.35s; }
    .api135-not-r4 { animation-delay: 1.80s; }
    .api135-not-row { animation: api135-not-reveal 7.3s ease-in-out infinite; }
    @keyframes api135-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="api135-not-bg" width="980" height="390"/>
  <text class="api135-not-h1"  x="30" y="40">Four things fetching data is not</text>
  <text class="api135-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="api135-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="api135-not-name" x="46" y="122">The misconception</text>
  <text class="api135-not-desc" x="46" y="142">Commonly held.</text>
  <text class="api135-not-desc api135-not-row api135-not-r0" x="46" y="182">One request returns everything</text>
  <text class="api135-not-desc api135-not-row api135-not-r1" x="46" y="216">The response shape is stable</text>
  <text class="api135-not-desc api135-not-row api135-not-r2" x="46" y="250">A successful response means complete data</text>
  <text class="api135-not-desc api135-not-row api135-not-r3" x="46" y="284">Types come through correctly</text>
  <text class="api135-not-desc api135-not-row api135-not-r4" x="46" y="318">Refetching is harmless</text>
  <rect class="api135-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="api135-not-name" x="526" y="122">What is true</text>
  <text class="api135-not-desc" x="526" y="142">Actually.</text>
  <text class="api135-not-desc api135-not-row api135-not-r0" x="526" y="182">Pagination is nearly always required</text>
  <text class="api135-not-desc api135-not-row api135-not-r1" x="526" y="216">Providers change fields without notice</text>
  <text class="api135-not-desc api135-not-row api135-not-r2" x="526" y="250">Partial pages and silent caps are common</text>
  <text class="api135-not-desc api135-not-row api135-not-r3" x="526" y="284">Numbers arrive as strings; dates as text</text>
  <text class="api135-not-desc api135-not-row api135-not-r4" x="526" y="318">It costs the provider, and may be limited</text>
  <text class="api135-not-sub" x="30" y="372">Silent result caps are a genuine trap: an interface that quietly returns at most a thousand records looks identical to one returning everything.</text>
</svg>
