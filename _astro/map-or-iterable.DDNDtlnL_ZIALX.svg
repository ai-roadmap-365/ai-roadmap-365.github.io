<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Whether random access exists.">
  <title>Indexed, or streamed</title>
  <style>
    .map-or-iterable-bg   { fill: #f8fafc; }
    .map-or-iterable-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-or-iterable-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-or-iterable-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-or-iterable-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-or-iterable-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-or-iterable-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-or-iterable-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .map-or-iterable-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .map-or-iterable-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .map-or-iterable-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .map-or-iterable-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .map-or-iterable-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-or-iterable-row { opacity: 1; }
    .map-or-iterable-r0 { animation-delay: 0.00s; }
    .map-or-iterable-r1 { animation-delay: 0.45s; }
    .map-or-iterable-r2 { animation-delay: 0.90s; }
    .map-or-iterable-r3 { animation-delay: 1.35s; }
    .map-or-iterable-r4 { animation-delay: 1.80s; }
    .map-or-iterable-row { animation: map-or-iterable-reveal 7.3s ease-in-out infinite; }
    @keyframes map-or-iterable-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="map-or-iterable-bg" width="980" height="390"/>
  <text class="map-or-iterable-h1"  x="30" y="40">Indexed, or streamed</text>
  <text class="map-or-iterable-sub" x="30" y="64">Whether random access exists.</text>
  <rect class="map-or-iterable-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="map-or-iterable-name" x="46" y="122">Map-style</text>
  <text class="map-or-iterable-desc" x="46" y="142">Random access by index.</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r0" x="46" y="182">Length is known</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r1" x="46" y="216">Any sample by index</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r2" x="46" y="250">Shuffling is a permutation of indices</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r3" x="46" y="284">Workers split the index range</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r4" x="46" y="318">The common case</text>
  <rect class="map-or-iterable-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="map-or-iterable-name" x="526" y="122">Iterable</text>
  <text class="map-or-iterable-desc" x="526" y="142">A stream.</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r0" x="526" y="182">No length, no indexing</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r1" x="526" y="216">Data arrives in order</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r2" x="526" y="250">Shuffling needs a buffer</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r3" x="526" y="284">Workers must not duplicate the stream</text>
  <text class="map-or-iterable-desc map-or-iterable-row map-or-iterable-r4" x="526" y="318">For web-scale or live data</text>
  <text class="map-or-iterable-sub" x="30" y="372">Worker duplication is the specific trap with streaming datasets: without explicit sharding, every worker reads the same stream and the model sees each sample as many times as there are workers.</text>
</svg>
