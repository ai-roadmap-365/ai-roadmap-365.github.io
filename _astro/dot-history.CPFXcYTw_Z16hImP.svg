<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From geometry to attention.">
  <title>Four steps for the dot product</title>
  <style>
    .dot-history-bg   { fill: #f8fafc; }
    .dot-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dot-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dot-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dot-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dot-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dot-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dot-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dot-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dot-history-stage { opacity: 1; }

    .dot-history-s0 { animation-delay: 0.00s; }
    .dot-history-e0 { animation-delay: 0.00s; }
    .dot-history-s1 { animation-delay: 1.28s; }
    .dot-history-e1 { animation-delay: 1.28s; }
    .dot-history-s2 { animation-delay: 2.56s; }
    .dot-history-e2 { animation-delay: 2.56s; }
    .dot-history-s3 { animation-delay: 3.84s; }
    .dot-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dot-history-conn  { animation: dot-history-trace 6.4s ease-in-out infinite; }
      .dot-history-stage { animation: dot-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dot-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dot-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dot-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dot-history-stage { animation: dot-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dot-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dot-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dot-history-bg" width="980" height="322"/>
  <text class="dot-history-h1"  x="30" y="40">Four steps for the dot product</text>
  <text class="dot-history-sub" x="30" y="64">From geometry to attention.</text>
  <g class="dot-history-stage dot-history-s0">
    <rect class="dot-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dot-history-step" x="44" y="142">01</text>
    <text class="dot-history-name" x="70" y="142">Defined geometrically, for projection and work</text>
    <text class="dot-history-desc" x="44" y="166">In physics and geometry.</text>
  </g>
  <line class="dot-history-line dot-history-conn dot-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dot-history-tip)"/>
  <g class="dot-history-stage dot-history-s1">
    <rect class="dot-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dot-history-step" x="280" y="142">02</text>
    <text class="dot-history-name" x="306" y="142">Then adopted for document similarity</text>
    <text class="dot-history-desc" x="280" y="166">Term vectors, compared by angle.</text>
  </g>
  <line class="dot-history-line dot-history-conn dot-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dot-history-tip)"/>
  <g class="dot-history-stage dot-history-s2">
    <rect class="dot-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dot-history-step" x="516" y="142">03</text>
    <text class="dot-history-name" x="542" y="142">And for learned embeddings</text>
    <text class="dot-history-desc" x="516" y="166">Where the vectors mean something</text>
    <text class="dot-history-desc" x="516" y="182">richer.</text>
  </g>
  <line class="dot-history-line dot-history-conn dot-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dot-history-tip)"/>
  <g class="dot-history-stage dot-history-s3">
    <rect class="dot-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dot-history-step" x="752" y="142">04</text>
    <text class="dot-history-name" x="778" y="142">And now for attention scores</text>
    <text class="dot-history-desc" x="752" y="166">Billions of dot products per</text>
    <text class="dot-history-desc" x="752" y="182">forward pass.</text>
  </g>
  <text class="dot-history-sub" x="30" y="304">The same operation spanning classical geometry and modern attention is a good example of how few genuinely distinct ideas the field rests on.</text>
</svg>
