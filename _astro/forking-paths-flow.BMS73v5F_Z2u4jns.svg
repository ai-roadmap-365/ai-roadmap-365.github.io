<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="d136fTitleId d136fDescId">
  <title id="d136fTitleId">One dataset branches through choices of subset, outcome and cutoff; one path lights up as significant</title>
  <desc id="d136fDescId">A single dataset on the left splits into two subset choices, each splitting into two outcome choices, each splitting into two cutoff choices -- eight candidate analyses in total. A travelling token follows one specific path to a leaf marked "p less than 0.05, reported," which is highlighted gold. The other seven leaves are drawn in muted grey and marked "not reported," staying fully visible throughout.</desc>

  <style>
    .d136f-bg     { fill: #f8fafc; }
    .d136f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d136f-sub    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #475569; }
    .d136f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d136f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d136f-leaf-label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #475569; }

    .d136f-datasetbox { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d136f-stagebox   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d136f-winbox     { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
    .d136f-losebox    { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }

    /* Resting wires: visible plain lines. The winning path also gets a
       marching-dash overlay; losing paths never animate below full opacity. */
    .d136f-wire       { stroke: #cbd5e1; stroke-width: 2; fill: none; }
    .d136f-winwire {
      stroke: #b45309; stroke-width: 3; fill: none;
      stroke-dasharray: 9 7; animation: d136f-march 1.4s linear infinite;
    }
    @keyframes d136f-march { to { stroke-dashoffset: -16; } }

    /* The travelling token follows the winning path only. */
    .d136f-token { fill: #b45309; animation: d136f-travel 6s ease-in-out infinite; }
    @keyframes d136f-travel {
      0%   { offset-distance: 0%;   opacity: 1; }
      6%   { offset-distance: 0%;   opacity: 1; }
      94%  { offset-distance: 100%; opacity: 1; }
      100% { offset-distance: 100%; opacity: 1; }
    }
    .d136f-token {
      offset-path: path('M 105 305 L 295 190 L 495 227 L 700 165 L 815 150');
      offset-rotate: 0deg;
    }

    /* The winning leaf lights up once the token arrives. */
    .d136f-winbox { animation: d136f-glow 6s ease-in-out infinite; }
    @keyframes d136f-glow {
      0%, 88%   { fill: #fef3c7; }
      92%, 100% { fill: #fde68a; }
    }

    /* The seven losing leaves stay fully legible; a gentle dim (never below
       0.85) plays only while the winner is glowing, so the still frame at
       rest (and every reduced-motion frame) shows all eight at full clarity. */
    .d136f-losebox { animation: d136f-dim 6s ease-in-out infinite; }
    @keyframes d136f-dim {
      0%, 82%, 100% { opacity: 1; }
      92%           { opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d136f-winwire { animation: none; stroke-dasharray: none; }
      .d136f-token   { animation: none; offset-distance: 100%; opacity: 1; }
      .d136f-winbox  { animation: none; fill: #fde68a; }
      .d136f-losebox { animation: none; opacity: 1; }
    }
  </style>

  <rect class="d136f-bg" x="0" y="0" width="1000" height="620" />

  <text class="d136f-title" x="32" y="42">One dataset, three silent choices, eight candidate analyses</text>
  <text class="d136f-sub" x="32" y="66">The reported result is a selection among these eight, not a discovery -- and this is the general shape of the method, not this lesson's exact candidate count.</text>

  <!-- Dataset -->
  <rect class="d136f-datasetbox" x="30" y="270" width="150" height="70" rx="10" />
  <text class="d136f-label" x="105" y="300" text-anchor="middle">Dataset</text>
  <text class="d136f-small" x="105" y="320" text-anchor="middle">no real signal</text>

  <!-- Stage 1: subset choice (2 branches) -->
  <text class="d136f-small" x="230" y="150" text-anchor="middle">subset:</text>
  <rect class="d136f-stagebox" x="220" y="160" width="150" height="60" rx="8" />
  <text class="d136f-leaf-label" x="295" y="196" text-anchor="middle">region = west</text>

  <text class="d136f-small" x="230" y="440" text-anchor="middle">subset:</text>
  <rect class="d136f-stagebox" x="220" y="450" width="150" height="60" rx="8" />
  <text class="d136f-leaf-label" x="295" y="486" text-anchor="middle">tenure &gt; 1 year</text>

  <path class="d136f-wire" d="M 180 290 L 220 190" />
  <path class="d136f-wire" d="M 180 320 L 220 480" />

  <!-- Stage 2: outcome choice (4 branches) -->
  <rect class="d136f-stagebox" x="420" y="70" width="150" height="55" rx="8" />
  <text class="d136f-leaf-label" x="495" y="103" text-anchor="middle">outcome: revenue</text>

  <rect class="d136f-stagebox" x="420" y="200" width="150" height="55" rx="8" />
  <text class="d136f-leaf-label" x="495" y="233" text-anchor="middle">outcome: sessions</text>

  <rect class="d136f-stagebox" x="420" y="340" width="150" height="55" rx="8" />
  <text class="d136f-leaf-label" x="495" y="373" text-anchor="middle">outcome: revenue</text>

  <rect class="d136f-stagebox" x="420" y="470" width="150" height="55" rx="8" />
  <text class="d136f-leaf-label" x="495" y="503" text-anchor="middle">outcome: sessions</text>

  <path class="d136f-wire" d="M 370 185 L 420 98" />
  <path class="d136f-wire" d="M 370 195 L 420 227" />
  <path class="d136f-wire" d="M 370 475 L 420 367" />
  <path class="d136f-wire" d="M 370 485 L 420 497" />

  <!-- Stage 3: cutoff choice (8 leaves) -->
  <g>
    <rect class="d136f-losebox" x="700" y="20" width="230" height="46" rx="8" />
    <text class="d136f-leaf-label" x="815" y="40" text-anchor="middle">cutoff: 30 days</text>
    <text class="d136f-leaf-label" x="815" y="57" text-anchor="middle">not reported</text>
    <path class="d136f-wire" d="M 570 90 L 700 43" />
  </g>
  <g>
    <rect class="d136f-losebox" x="700" y="80" width="230" height="46" rx="8" />
    <text class="d136f-leaf-label" x="815" y="100" text-anchor="middle">cutoff: 90 days</text>
    <text class="d136f-leaf-label" x="815" y="117" text-anchor="middle">not reported</text>
    <path class="d136f-wire" d="M 570 100 L 700 103" />
  </g>

  <g>
    <rect class="d136f-winbox" x="700" y="127" width="230" height="46" rx="8" />
    <text class="d136f-leaf-label" x="815" y="147" text-anchor="middle" font-weight="600">cutoff: 90 days</text>
    <text class="d136f-leaf-label" x="815" y="164" text-anchor="middle" font-weight="600">p &lt; 0.05 -- reported</text>
  </g>
  <path class="d136f-winwire" d="M 570 220 C 640 190, 660 160, 700 150" />

  <g>
    <rect class="d136f-losebox" x="700" y="207" width="230" height="46" rx="8" />
    <text class="d136f-leaf-label" x="815" y="227" text-anchor="middle">cutoff: 30 days</text>
    <text class="d136f-leaf-label" x="815" y="244" text-anchor="middle">not reported</text>
    <path class="d136f-wire" d="M 570 235 L 700 230" />
  </g>

  <g>
    <rect class="d136f-losebox" x="700" y="330" width="230" height="46" rx="8" />
    <text class="d136f-leaf-label" x="815" y="350" text-anchor="middle">cutoff: 90 days</text>
    <text class="d136f-leaf-label" x="815" y="367" text-anchor="middle">not reported</text>
    <path class="d136f-wire" d="M 570 360 L 700 353" />
  </g>
  <g>
    <rect class="d136f-losebox" x="700" y="390" width="230" height="46" rx="8" />
    <text class="d136f-leaf-label" x="815" y="410" text-anchor="middle">cutoff: 30 days</text>
    <text class="d136f-leaf-label" x="815" y="427" text-anchor="middle">not reported</text>
    <path class="d136f-wire" d="M 570 375 L 700 413" />
  </g>
  <g>
    <rect class="d136f-losebox" x="700" y="470" width="230" height="46" rx="8" />
    <text class="d136f-leaf-label" x="815" y="490" text-anchor="middle">cutoff: 90 days</text>
    <text class="d136f-leaf-label" x="815" y="507" text-anchor="middle">not reported</text>
    <path class="d136f-wire" d="M 570 490 L 700 493" />
  </g>
  <g>
    <rect class="d136f-losebox" x="700" y="530" width="230" height="46" rx="8" />
    <text class="d136f-leaf-label" x="815" y="550" text-anchor="middle">cutoff: 30 days</text>
    <text class="d136f-leaf-label" x="815" y="567" text-anchor="middle">not reported</text>
    <path class="d136f-wire" d="M 570 500 L 700 553" />
  </g>

  <!-- Travelling token, drawn last so it renders above the wires -->
  <circle class="d136f-token" r="8" />

  <text class="d136f-small" x="32" y="600">One of eight candidate analyses reached p &lt; 0.05 and got written up. The other seven are just as real, and just as available to try -- they simply did not look interesting.</text>
</svg>
