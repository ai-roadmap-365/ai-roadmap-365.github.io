<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which one generalises.">
  <title>Any boundary against the widest one</title>
  <style>
    .boundary-vs-margin-bg   { fill: #f8fafc; }
    .boundary-vs-margin-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-margin-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-margin-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-margin-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-margin-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-margin-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-vs-margin-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boundary-vs-margin-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boundary-vs-margin-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boundary-vs-margin-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boundary-vs-margin-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boundary-vs-margin-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-vs-margin-row { opacity: 1; }
    .boundary-vs-margin-r0 { animation-delay: 0.00s; }
    .boundary-vs-margin-r1 { animation-delay: 0.45s; }
    .boundary-vs-margin-r2 { animation-delay: 0.90s; }
    .boundary-vs-margin-r3 { animation-delay: 1.35s; }
    .boundary-vs-margin-r4 { animation-delay: 1.80s; }
    .boundary-vs-margin-row { animation: boundary-vs-margin-reveal 7.3s ease-in-out infinite; }
    @keyframes boundary-vs-margin-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="boundary-vs-margin-bg" width="980" height="390"/>
  <text class="boundary-vs-margin-h1"  x="30" y="40">Any boundary against the widest one</text>
  <text class="boundary-vs-margin-sub" x="30" y="64">Which one generalises.</text>
  <rect class="boundary-vs-margin-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="boundary-vs-margin-name" x="46" y="122">Any separating boundary</text>
  <text class="boundary-vs-margin-desc" x="46" y="142">Fits the training data.</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r0" x="46" y="182">Many are equally correct on the training set</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r1" x="46" y="216">May pass close to points</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r2" x="46" y="250">Sensitive to small changes in data</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r3" x="46" y="284">No principle selects among them</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r4" x="46" y="318">What logistic regression finds</text>
  <rect class="boundary-vs-margin-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="boundary-vs-margin-name" x="526" y="122">The widest margin</text>
  <text class="boundary-vs-margin-desc" x="526" y="142">Fits with the most room.</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r0" x="526" y="182">A unique choice among them</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r1" x="526" y="216">Maximises distance to the nearest points</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r2" x="526" y="250">Robust to small perturbations</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r3" x="526" y="284">A clear selection principle</text>
  <text class="boundary-vs-margin-desc boundary-vs-margin-row boundary-vs-margin-r4" x="526" y="318">What support vector machines find</text>
  <text class="boundary-vs-margin-sub" x="30" y="372">That many boundaries fit equally well but generalise differently is the observation that motivated support vector machines, covered later in this course.</text>
</svg>
