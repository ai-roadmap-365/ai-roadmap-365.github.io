<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Wrapper selection</title>
  <style>
    .wrapper-bg   { fill: #f8fafc; }
    .wrapper-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrapper-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrapper-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrapper-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrapper-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrapper-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .wrapper-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .wrapper-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .wrapper-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .wrapper-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .wrapper-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .wrapper-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .wrapper-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .wrapper-stage { opacity: 1; }

    .wrapper-s0 { animation-delay: 0.00s; }
    .wrapper-e0 { animation-delay: 0.00s; }
    .wrapper-s1 { animation-delay: 1.28s; }
    .wrapper-e1 { animation-delay: 1.28s; }
    .wrapper-s2 { animation-delay: 2.56s; }
    .wrapper-e2 { animation-delay: 2.56s; }
    .wrapper-s3 { animation-delay: 3.84s; }
    .wrapper-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .wrapper-conn  { animation: wrapper-trace 6.4s ease-in-out infinite; }
      .wrapper-stage { animation: wrapper-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes wrapper-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes wrapper-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .wrapper-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .wrapper-stage { animation: wrapper-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes wrapper-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="wrapper-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="wrapper-bg" width="980" height="322"/>
  <text class="wrapper-h1"  x="30" y="40">Wrapper selection</text>
  <text class="wrapper-sub" x="30" y="64">Four steps.</text>
  <g class="wrapper-stage wrapper-s0">
    <rect class="wrapper-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="wrapper-step" x="44" y="142">01</text>
    <text class="wrapper-name" x="70" y="142">Fit the model on every feature</text>
    <text class="wrapper-desc" x="44" y="166">And rank them by the model's own</text>
    <text class="wrapper-desc" x="44" y="182">importance.</text>
  </g>
  <line class="wrapper-line wrapper-conn wrapper-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#wrapper-tip)"/>
  <g class="wrapper-stage wrapper-s1">
    <rect class="wrapper-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="wrapper-step" x="280" y="142">02</text>
    <text class="wrapper-name" x="306" y="142">Remove the weakest</text>
    <text class="wrapper-desc" x="280" y="166">One, or a fraction, at a time.</text>
  </g>
  <line class="wrapper-line wrapper-conn wrapper-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#wrapper-tip)"/>
  <g class="wrapper-stage wrapper-s2">
    <rect class="wrapper-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="wrapper-step" x="516" y="142">03</text>
    <text class="wrapper-name" x="542" y="142">Refit and repeat</text>
    <text class="wrapper-desc" x="516" y="166">Which is why it is expensive.</text>
  </g>
  <line class="wrapper-line wrapper-conn wrapper-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#wrapper-tip)"/>
  <g class="wrapper-stage wrapper-s3">
    <rect class="wrapper-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="wrapper-step" x="752" y="142">04</text>
    <text class="wrapper-name" x="778" y="142">Stopping when validation performance drops</text>
    <text class="wrapper-desc" x="752" y="166">Which identifies the useful</text>
    <text class="wrapper-desc" x="752" y="182">subset.</text>
  </g>
  <text class="wrapper-sub" x="30" y="304">Refitting after each removal is what makes this better than a single ranking: importance shifts once a correlated feature is gone.</text>
</svg>
