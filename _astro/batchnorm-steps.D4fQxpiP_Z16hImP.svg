<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five steps, two of them learned.">
  <title>Batch normalisation, step by step</title>
  <style>
    .batchnorm-steps-bg   { fill: #f8fafc; }
    .batchnorm-steps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-steps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-steps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-steps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-steps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-steps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .batchnorm-steps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .batchnorm-steps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .batchnorm-steps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .batchnorm-steps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .batchnorm-steps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .batchnorm-steps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .batchnorm-steps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .batchnorm-steps-stage { opacity: 1; }

    .batchnorm-steps-s0 { animation-delay: 0.00s; }
    .batchnorm-steps-e0 { animation-delay: 0.00s; }
    .batchnorm-steps-s1 { animation-delay: 1.33s; }
    .batchnorm-steps-e1 { animation-delay: 1.33s; }
    .batchnorm-steps-s2 { animation-delay: 2.67s; }
    .batchnorm-steps-e2 { animation-delay: 2.67s; }
    .batchnorm-steps-s3 { animation-delay: 4.00s; }
    .batchnorm-steps-e3 { animation-delay: 4.00s; }
    .batchnorm-steps-s4 { animation-delay: 5.33s; }
    .batchnorm-steps-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .batchnorm-steps-conn  { animation: batchnorm-steps-trace 8s ease-in-out infinite; }
      .batchnorm-steps-stage { animation: batchnorm-steps-arrive 8s ease-in-out infinite; }
    }
    @keyframes batchnorm-steps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes batchnorm-steps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .batchnorm-steps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .batchnorm-steps-stage { animation: batchnorm-steps-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes batchnorm-steps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="batchnorm-steps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="batchnorm-steps-bg" width="980" height="322"/>
  <text class="batchnorm-steps-h1"  x="30" y="40">Batch normalisation, step by step</text>
  <text class="batchnorm-steps-sub" x="30" y="64">Five steps, two of them learned.</text>
  <g class="batchnorm-steps-stage batchnorm-steps-s0">
    <rect class="batchnorm-steps-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="batchnorm-steps-step" x="44" y="142">01</text>
    <text class="batchnorm-steps-name" x="70" y="142">Mean across the batch</text>
    <text class="batchnorm-steps-desc" x="44" y="166">Per feature channel.</text>
  </g>
  <line class="batchnorm-steps-line batchnorm-steps-conn batchnorm-steps-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#batchnorm-steps-tip)"/>
  <g class="batchnorm-steps-stage batchnorm-steps-s1">
    <rect class="batchnorm-steps-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="batchnorm-steps-step" x="233" y="142">02</text>
    <text class="batchnorm-steps-name" x="259" y="142">Variance across the batch</text>
    <text class="batchnorm-steps-desc" x="233" y="166">Same axis.</text>
  </g>
  <line class="batchnorm-steps-line batchnorm-steps-conn batchnorm-steps-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#batchnorm-steps-tip)"/>
  <g class="batchnorm-steps-stage batchnorm-steps-s2">
    <rect class="batchnorm-steps-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="batchnorm-steps-step" x="422" y="142">03</text>
    <text class="batchnorm-steps-name" x="448" y="142">Standardise</text>
    <text class="batchnorm-steps-desc" x="422" y="166">Zero mean, unit variance,</text>
    <text class="batchnorm-steps-desc" x="422" y="182">with an epsilon for</text>
    <text class="batchnorm-steps-desc" x="422" y="198">stability.</text>
  </g>
  <line class="batchnorm-steps-line batchnorm-steps-conn batchnorm-steps-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#batchnorm-steps-tip)"/>
  <g class="batchnorm-steps-stage batchnorm-steps-s3">
    <rect class="batchnorm-steps-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="batchnorm-steps-step" x="611" y="142">04</text>
    <text class="batchnorm-steps-name" x="637" y="142">A learned scale and shift</text>
    <text class="batchnorm-steps-desc" x="611" y="166">So the layer can undo the</text>
    <text class="batchnorm-steps-desc" x="611" y="182">normalisation if that is</text>
    <text class="batchnorm-steps-desc" x="611" y="198">better.</text>
    <text class="batchnorm-steps-edge" x="611" y="242">learned</text>
  </g>
  <line class="batchnorm-steps-line batchnorm-steps-conn batchnorm-steps-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#batchnorm-steps-tip)"/>
  <g class="batchnorm-steps-stage batchnorm-steps-s4">
    <rect class="batchnorm-steps-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="batchnorm-steps-step" x="800" y="142">05</text>
    <text class="batchnorm-steps-name" x="826" y="142">Update running statistics</text>
    <text class="batchnorm-steps-desc" x="800" y="166">For use at inference,</text>
    <text class="batchnorm-steps-desc" x="800" y="182">where there is no batch</text>
    <text class="batchnorm-steps-desc" x="800" y="198">to average over.</text>
  </g>
  <text class="batchnorm-steps-sub" x="30" y="304">The learned affine transform matters conceptually: without it, normalisation would constrain every layer's output distribution, and with it the network can choose any distribution it wants — starting from a well-conditioned one.</text>
</svg>
