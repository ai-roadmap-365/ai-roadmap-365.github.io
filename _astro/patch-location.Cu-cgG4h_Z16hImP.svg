<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Patch where it is used</title>
  <style>
    .patch-location-bg   { fill: #f8fafc; }
    .patch-location-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patch-location-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patch-location-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patch-location-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patch-location-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patch-location-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .patch-location-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .patch-location-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .patch-location-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .patch-location-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .patch-location-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .patch-location-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .patch-location-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .patch-location-stage { opacity: 1; }

    .patch-location-s0 { animation-delay: 0.00s; }
    .patch-location-e0 { animation-delay: 0.00s; }
    .patch-location-s1 { animation-delay: 1.28s; }
    .patch-location-e1 { animation-delay: 1.28s; }
    .patch-location-s2 { animation-delay: 2.56s; }
    .patch-location-e2 { animation-delay: 2.56s; }
    .patch-location-s3 { animation-delay: 3.84s; }
    .patch-location-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .patch-location-conn  { animation: patch-location-trace 6.4s ease-in-out infinite; }
      .patch-location-stage { animation: patch-location-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes patch-location-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes patch-location-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .patch-location-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .patch-location-stage { animation: patch-location-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes patch-location-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="patch-location-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="patch-location-bg" width="980" height="322"/>
  <text class="patch-location-h1"  x="30" y="40">Patch where it is used</text>
  <text class="patch-location-sub" x="30" y="64">Four steps.</text>
  <g class="patch-location-stage patch-location-s0">
    <rect class="patch-location-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="patch-location-step" x="44" y="142">01</text>
    <text class="patch-location-name" x="70" y="142">Importing a name binds it in the importing module</text>
    <text class="patch-location-desc" x="44" y="166">A separate reference from the</text>
    <text class="patch-location-desc" x="44" y="182">original.</text>
  </g>
  <line class="patch-location-line patch-location-conn patch-location-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#patch-location-tip)"/>
  <g class="patch-location-stage patch-location-s1">
    <rect class="patch-location-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="patch-location-step" x="280" y="142">02</text>
    <text class="patch-location-name" x="306" y="142">Patching the original leaves that binding untouched</text>
    <text class="patch-location-desc" x="280" y="166">So the real thing is still</text>
    <text class="patch-location-desc" x="280" y="182">called.</text>
  </g>
  <line class="patch-location-line patch-location-conn patch-location-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#patch-location-tip)"/>
  <g class="patch-location-stage patch-location-s2">
    <rect class="patch-location-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="patch-location-step" x="516" y="142">03</text>
    <text class="patch-location-name" x="542" y="142">Patch the name in the module that uses it</text>
    <text class="patch-location-desc" x="516" y="166">Which is the reference actually</text>
    <text class="patch-location-desc" x="516" y="182">consulted.</text>
  </g>
  <line class="patch-location-line patch-location-conn patch-location-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#patch-location-tip)"/>
  <g class="patch-location-stage patch-location-s3">
    <rect class="patch-location-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="patch-location-step" x="752" y="142">04</text>
    <text class="patch-location-name" x="778" y="142">Which is why the target string looks wrong at first</text>
    <text class="patch-location-desc" x="752" y="166">It names the consumer, not the</text>
    <text class="patch-location-desc" x="752" y="182">source.</text>
  </g>
  <text class="patch-location-sub" x="30" y="304">This single rule accounts for most of the confusion with patching, and it follows directly from how imports bind names.</text>
</svg>
