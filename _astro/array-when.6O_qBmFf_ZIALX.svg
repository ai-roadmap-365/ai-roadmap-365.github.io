<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use arrays</title>
  <style>
    .array-when-bg   { fill: #f8fafc; }
    .array-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .array-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .array-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .array-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .array-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .array-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .array-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .array-when-row { opacity: 1; }
    .array-when-r0 { animation-delay: 0.00s; }
    .array-when-r1 { animation-delay: 0.45s; }
    .array-when-r2 { animation-delay: 0.90s; }
    .array-when-r3 { animation-delay: 1.35s; }
    .array-when-r4 { animation-delay: 1.80s; }
    .array-when-row { animation: array-when-reveal 7.3s ease-in-out infinite; }
    @keyframes array-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="array-when-bg" width="980" height="390"/>
  <text class="array-when-h1"  x="30" y="40">When to use arrays</text>
  <text class="array-when-sub" x="30" y="64">And when not to.</text>
  <rect class="array-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="array-when-name" x="46" y="122">Use arrays</text>
  <text class="array-when-desc" x="46" y="142">Four cases.</text>
  <text class="array-when-desc array-when-row array-when-r0" x="46" y="182">Numerical data of one type</text>
  <text class="array-when-desc array-when-row array-when-r1" x="46" y="216">The same operation across many values</text>
  <text class="array-when-desc array-when-row array-when-r2" x="46" y="250">Anything feeding a model</text>
  <text class="array-when-desc array-when-row array-when-r3" x="46" y="284">Where speed matters</text>
  <text class="array-when-desc array-when-row array-when-r4" x="46" y="318">Fixed, known shapes</text>
  <rect class="array-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="array-when-name" x="526" y="122">Use something else</text>
  <text class="array-when-desc" x="526" y="142">Also four.</text>
  <text class="array-when-desc array-when-row array-when-r0" x="526" y="182">Mixed types per column — a dataframe</text>
  <text class="array-when-desc array-when-row array-when-r1" x="526" y="216">Ragged or variable-length data</text>
  <text class="array-when-desc array-when-row array-when-r2" x="526" y="250">Small collections where clarity wins</text>
  <text class="array-when-desc array-when-row array-when-r3" x="526" y="284">Per-element differing logic</text>
  <text class="array-when-desc array-when-row array-when-r4" x="526" y="318">Text, before it is encoded</text>
  <text class="array-when-sub" x="30" y="372">Reaching for an array when a dataframe is wanted produces code that fights the data, which is a common early mistake and easily corrected.</text>
</svg>
