<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four responsibilities, one component.">
  <title>What the gateway owns</title>
  <style>
    .gateway-responsibilities-bg   { fill: #f8fafc; }
    .gateway-responsibilities-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-responsibilities-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gateway-responsibilities-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gateway-responsibilities-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gateway-responsibilities-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gateway-responsibilities-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gateway-responsibilities-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gateway-responsibilities-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gateway-responsibilities-stage { opacity: 1; }

    .gateway-responsibilities-s0 { animation-delay: 0.00s; }
    .gateway-responsibilities-e0 { animation-delay: 0.00s; }
    .gateway-responsibilities-s1 { animation-delay: 1.28s; }
    .gateway-responsibilities-e1 { animation-delay: 1.28s; }
    .gateway-responsibilities-s2 { animation-delay: 2.56s; }
    .gateway-responsibilities-e2 { animation-delay: 2.56s; }
    .gateway-responsibilities-s3 { animation-delay: 3.84s; }
    .gateway-responsibilities-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gateway-responsibilities-conn  { animation: gateway-responsibilities-trace 6.4s ease-in-out infinite; }
      .gateway-responsibilities-stage { animation: gateway-responsibilities-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gateway-responsibilities-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gateway-responsibilities-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gateway-responsibilities-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gateway-responsibilities-stage { animation: gateway-responsibilities-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gateway-responsibilities-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gateway-responsibilities-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gateway-responsibilities-bg" width="980" height="322"/>
  <text class="gateway-responsibilities-h1"  x="30" y="40">What the gateway owns</text>
  <text class="gateway-responsibilities-sub" x="30" y="64">Four responsibilities, one component.</text>
  <g class="gateway-responsibilities-stage gateway-responsibilities-s0">
    <rect class="gateway-responsibilities-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-responsibilities-step" x="44" y="142">01</text>
    <text class="gateway-responsibilities-name" x="70" y="142">Route by outstanding requests</text>
    <text class="gateway-responsibilities-desc" x="44" y="166">Least-Outstanding-Requests, not</text>
    <text class="gateway-responsibilities-desc" x="44" y="182">round robin. Durations vary by</text>
    <text class="gateway-responsibilities-desc" x="44" y="198">400x.</text>
    <text class="gateway-responsibilities-edge" x="44" y="242">LOR</text>
  </g>
  <line class="gateway-responsibilities-line gateway-responsibilities-conn gateway-responsibilities-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gateway-responsibilities-tip)"/>
  <g class="gateway-responsibilities-stage gateway-responsibilities-s1">
    <rect class="gateway-responsibilities-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-responsibilities-step" x="280" y="142">02</text>
    <text class="gateway-responsibilities-name" x="306" y="142">Track replica health</text>
    <text class="gateway-responsibilities-desc" x="280" y="166">Consecutive failures per worker,</text>
    <text class="gateway-responsibilities-desc" x="280" y="182">so one bad pod leaves the pool.</text>
  </g>
  <line class="gateway-responsibilities-line gateway-responsibilities-conn gateway-responsibilities-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gateway-responsibilities-tip)"/>
  <g class="gateway-responsibilities-stage gateway-responsibilities-s2">
    <rect class="gateway-responsibilities-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-responsibilities-step" x="516" y="142">03</text>
    <text class="gateway-responsibilities-name" x="542" y="142">Break the circuit</text>
    <text class="gateway-responsibilities-desc" x="516" y="166">Stop forwarding to a failing</text>
    <text class="gateway-responsibilities-desc" x="516" y="182">backend and answer immediately</text>
    <text class="gateway-responsibilities-desc" x="516" y="198">instead.</text>
  </g>
  <line class="gateway-responsibilities-line gateway-responsibilities-conn gateway-responsibilities-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gateway-responsibilities-tip)"/>
  <g class="gateway-responsibilities-stage gateway-responsibilities-s3">
    <rect class="gateway-responsibilities-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-responsibilities-step" x="752" y="142">04</text>
    <text class="gateway-responsibilities-name" x="778" y="142">Record telemetry</text>
    <text class="gateway-responsibilities-desc" x="752" y="166">TTFT, inter-token latency, queue</text>
    <text class="gateway-responsibilities-desc" x="752" y="182">depth, error rate — the SRE</text>
    <text class="gateway-responsibilities-desc" x="752" y="198">view.</text>
  </g>
  <text class="gateway-responsibilities-sub" x="30" y="304">The first is the AI-specific one: a web request takes a predictable few hundred milliseconds, and an LLM request takes anywhere from fifty milliseconds to twenty seconds, which makes a queue-blind balancer actively harmful.</text>
</svg>
