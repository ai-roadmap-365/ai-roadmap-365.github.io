<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Tools are the difference.">
  <title>An electrician, or advice from an armchair</title>
  <style>
    .electrician-analogy-bg   { fill: #f8fafc; }
    .electrician-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electrician-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electrician-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electrician-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electrician-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electrician-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .electrician-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .electrician-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .electrician-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .electrician-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .electrician-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .electrician-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .electrician-analogy-row { opacity: 1; }
    .electrician-analogy-r0 { animation-delay: 0.00s; }
    .electrician-analogy-r1 { animation-delay: 0.45s; }
    .electrician-analogy-r2 { animation-delay: 0.90s; }
    .electrician-analogy-r3 { animation-delay: 1.35s; }
    .electrician-analogy-r4 { animation-delay: 1.80s; }
    .electrician-analogy-row { animation: electrician-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes electrician-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="electrician-analogy-bg" width="980" height="390"/>
  <text class="electrician-analogy-h1"  x="30" y="40">An electrician, or advice from an armchair</text>
  <text class="electrician-analogy-sub" x="30" y="64">Tools are the difference.</text>
  <rect class="electrician-analogy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="electrician-analogy-name" x="46" y="122">On site, with tools</text>
  <text class="electrician-analogy-desc" x="46" y="142">Measures, then decides.</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r0" x="46" y="182">Inspects the panel, hears the complaint</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r1" x="46" y="216">Plans: test the breaker, then the ground</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r2" x="46" y="250">Multimeter reads 120V steady</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r3" x="46" y="284">Updates: the fault is downstream</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r4" x="46" y="318">Tightens the neutral, re-tests under load</text>
  <rect class="electrician-analogy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="electrician-analogy-name" x="526" y="122">From an armchair</text>
  <text class="electrician-analogy-desc" x="526" y="142">Guesses, and cannot check.</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r0" x="526" y="182">Hears a description, second-hand</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r1" x="526" y="216">Forms a plausible theory</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r2" x="526" y="250">No instrument, no reading</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r3" x="526" y="284">Nothing updates the theory</text>
  <text class="electrician-analogy-desc electrician-analogy-row electrician-analogy-r4" x="526" y="318">Cannot verify anything at all</text>
  <text class="electrician-analogy-sub" x="30" y="372">"Neither tools nor hands to verify anything" is the exact position of a stateless model, and it explains why the same model becomes dramatically more reliable the moment it can run something.</text>
</svg>
