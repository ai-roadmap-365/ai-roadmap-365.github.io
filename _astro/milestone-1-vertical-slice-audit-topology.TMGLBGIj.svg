<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Milestone 1 Vertical Slice Audit Topology">
  <title>Milestone 1 Vertical Slice Audit Topology</title>
  <defs>
    <style>
      .d357a-bg { fill: #f8fafc; }
      .d357a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d357a-ret { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d357a-cor { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d357a-aud { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d357a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d357a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d357a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d357a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d357a-bg" />
  
  <text x="40" y="40" class="d357a-title">Milestone 1 Vertical Slice Audit Topology</text>
  <text x="40" y="65" class="d357a-subtitle">Milestone 1 Vertical Slice Audit Topology showing Ingress API, Hybrid Retrieval Layer, Core AI Router, Tool Sandbox, Pydantic Egress, and Audit Metrics</text>
  
  <!-- Retrieval Layer Audit -->
  <rect x="40" y="110" width="250" height="280" class="d357a-ret" />
  <text x="55" y="145" class="d357a-header" fill="#1d4ed8">1. Data &amp; Retrieval Layer</text>
  <text x="55" y="180" class="d357a-text">• Hybrid Dense + BM25 RRF</text>
  <text x="55" y="205" class="d357a-text">• Reranking &amp; Deduplication</text>
  <text x="55" y="230" class="d357a-text">• Metadata Scoping</text>
  <text x="55" y="255" class="d357a-text">• Latency: 65ms (Target &lt;100ms)</text>
  <text x="55" y="300" class="d357a-text" font-weight="600" fill="#1d4ed8">Audit Status: PASS</text>
  
  <!-- Core AI & Agent Audit -->
  <rect x="315" y="110" width="270" height="280" class="d357a-cor" />
  <text x="330" y="145" class="d357a-header" fill="#15803d">2. Core AI &amp; Tool Engine</text>
  <text x="330" y="180" class="d357a-text">• Pydantic Output Validation</text>
  <text x="330" y="205" class="d357a-text">• Circuit Breaker Failover</text>
  <text x="330" y="230" class="d357a-text">• Sandboxed ReAct Dispatcher</text>
  <text x="330" y="255" class="d357a-text">• Schema Accuracy: 100.0%</text>
  <text x="330" y="300" class="d357a-text" font-weight="600" fill="#15803d">Audit Status: PASS</text>
  
  <!-- Evaluation Audit -->
  <rect x="610" y="110" width="250" height="280" class="d357a-aud" />
  <text x="625" y="145" class="d357a-header" fill="#7e22ce">3. Testing &amp; Evals Gate</text>
  <text x="625" y="180" class="d357a-text">• Faithfulness: 0.952 (&gt;=0.90)</text>
  <text x="625" y="205" class="d357a-text">• Context Recall: 0.914 (&gt;=0.85)</text>
  <text x="625" y="230" class="d357a-text">• Zero Unhandled Exceptions</text>
  <text x="625" y="255" class="d357a-text">• End-to-End Latency: 525ms</text>
  <text x="625" y="300" class="d357a-text" font-weight="600" fill="#7e22ce">Audit Status: APPROVED</text>
</svg>