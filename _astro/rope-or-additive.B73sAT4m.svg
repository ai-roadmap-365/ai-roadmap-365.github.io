<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where position enters the computation.">
  <title>Additive, or rotary</title>
  <style>
    .rope-or-additive-bg   { fill: #f8fafc; }
    .rope-or-additive-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rope-or-additive-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rope-or-additive-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rope-or-additive-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rope-or-additive-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rope-or-additive-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rope-or-additive-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rope-or-additive-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rope-or-additive-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rope-or-additive-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rope-or-additive-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rope-or-additive-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rope-or-additive-row { opacity: 1; }
    .rope-or-additive-r0 { animation-delay: 0.00s; }
    .rope-or-additive-r1 { animation-delay: 0.45s; }
    .rope-or-additive-r2 { animation-delay: 0.90s; }
    .rope-or-additive-r3 { animation-delay: 1.35s; }
    .rope-or-additive-r4 { animation-delay: 1.80s; }
    .rope-or-additive-row { animation: rope-or-additive-reveal 7.3s ease-in-out infinite; }
    @keyframes rope-or-additive-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rope-or-additive-bg" width="980" height="390"/>
  <text class="rope-or-additive-h1"  x="30" y="40">Additive, or rotary</text>
  <text class="rope-or-additive-sub" x="30" y="64">Where position enters the computation.</text>
  <rect class="rope-or-additive-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rope-or-additive-name" x="46" y="122">Additive</text>
  <text class="rope-or-additive-desc" x="46" y="142">Added to the input.</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r0" x="46" y="182">A vector added to token embeddings</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r1" x="46" y="216">Absolute position, at the bottom</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r2" x="46" y="250">Every layer inherits it indirectly</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r3" x="46" y="284">Extrapolation beyond training length is poor</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r4" x="46" y="318">The original formulation</text>
  <rect class="rope-or-additive-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rope-or-additive-name" x="526" y="122">Rotary</text>
  <text class="rope-or-additive-desc" x="526" y="142">Applied inside attention.</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r0" x="526" y="182">Queries and keys rotated by position</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r1" x="526" y="216">Relative position appears in the dot product</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r2" x="526" y="250">Applied at every layer, directly</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r3" x="526" y="284">Extrapolates further</text>
  <text class="rope-or-additive-desc rope-or-additive-row rope-or-additive-r4" x="526" y="318">The modern standard</text>
  <text class="rope-or-additive-sub" x="30" y="372">Encoding relative rather than absolute position is what improves extrapolation: what matters for most language relationships is how far apart two tokens are, not where they sit in the sequence.</text>
</svg>
