<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the correctly written one is 18 GB.">
  <title>Three packagings, one service</title>
  <style>
    .packaging-cost-gradient-bg   { fill: #f8fafc; }
    .packaging-cost-gradient-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-cost-gradient-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-cost-gradient-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-cost-gradient-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-cost-gradient-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-cost-gradient-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packaging-cost-gradient-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packaging-cost-gradient-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packaging-cost-gradient-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packaging-cost-gradient-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packaging-cost-gradient-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packaging-cost-gradient-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .packaging-cost-gradient-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .packaging-cost-gradient-stage { opacity: 1; }

    .packaging-cost-gradient-s0 { animation-delay: 0.00s; }
    .packaging-cost-gradient-e0 { animation-delay: 0.00s; }
    .packaging-cost-gradient-s1 { animation-delay: 1.28s; }
    .packaging-cost-gradient-e1 { animation-delay: 1.28s; }
    .packaging-cost-gradient-s2 { animation-delay: 2.56s; }
    .packaging-cost-gradient-e2 { animation-delay: 2.56s; }
    .packaging-cost-gradient-s3 { animation-delay: 3.84s; }
    .packaging-cost-gradient-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .packaging-cost-gradient-conn  { animation: packaging-cost-gradient-trace 6.4s ease-in-out infinite; }
      .packaging-cost-gradient-stage { animation: packaging-cost-gradient-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes packaging-cost-gradient-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes packaging-cost-gradient-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .packaging-cost-gradient-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .packaging-cost-gradient-stage { animation: packaging-cost-gradient-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes packaging-cost-gradient-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="packaging-cost-gradient-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="packaging-cost-gradient-bg" width="980" height="322"/>
  <text class="packaging-cost-gradient-h1"  x="30" y="40">Three packagings, one service</text>
  <text class="packaging-cost-gradient-sub" x="30" y="64">And the correctly written one is 18 GB.</text>
  <g class="packaging-cost-gradient-stage packaging-cost-gradient-s0">
    <rect class="packaging-cost-gradient-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="packaging-cost-gradient-step" x="44" y="142">01</text>
    <text class="packaging-cost-gradient-name" x="70" y="142">Single stage, full base, weights in</text>
    <text class="packaging-cost-gradient-desc" x="44" y="166">21,128 MB. Rollout to 20 nodes:</text>
    <text class="packaging-cost-gradient-desc" x="44" y="182">16,902s.</text>
    <text class="packaging-cost-gradient-edge" x="44" y="242">4h 42m</text>
  </g>
  <line class="packaging-cost-gradient-line packaging-cost-gradient-conn packaging-cost-gradient-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#packaging-cost-gradient-tip)"/>
  <g class="packaging-cost-gradient-stage packaging-cost-gradient-s1">
    <rect class="packaging-cost-gradient-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="packaging-cost-gradient-step" x="280" y="142">02</text>
    <text class="packaging-cost-gradient-name" x="306" y="142">Multi-stage, slim, weights in</text>
    <text class="packaging-cost-gradient-desc" x="280" y="166">18,053 MB. Correct by every</text>
    <text class="packaging-cost-gradient-desc" x="280" y="182">standard piece of advice.</text>
    <text class="packaging-cost-gradient-edge" x="280" y="242">4h 01m</text>
  </g>
  <line class="packaging-cost-gradient-line packaging-cost-gradient-conn packaging-cost-gradient-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#packaging-cost-gradient-tip)"/>
  <g class="packaging-cost-gradient-stage packaging-cost-gradient-s2">
    <rect class="packaging-cost-gradient-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="packaging-cost-gradient-step" x="516" y="142">03</text>
    <text class="packaging-cost-gradient-name" x="542" y="142">Multi-stage, slim, weights mounted</text>
    <text class="packaging-cost-gradient-desc" x="516" y="166">4,553 MB. No findings.</text>
    <text class="packaging-cost-gradient-edge" x="516" y="242">1h 01m</text>
  </g>
  <line class="packaging-cost-gradient-line packaging-cost-gradient-conn packaging-cost-gradient-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#packaging-cost-gradient-tip)"/>
  <g class="packaging-cost-gradient-stage packaging-cost-gradient-s3">
    <rect class="packaging-cost-gradient-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="packaging-cost-gradient-step" x="752" y="142">04</text>
    <text class="packaging-cost-gradient-name" x="778" y="142">Same service throughout</text>
    <text class="packaging-cost-gradient-desc" x="752" y="166">Same framework, same model. The</text>
    <text class="packaging-cost-gradient-desc" x="752" y="182">model is no longer travelling in</text>
    <text class="packaging-cost-gradient-desc" x="752" y="198">the image.</text>
  </g>
  <text class="packaging-cost-gradient-sub" x="30" y="304">Plan 2 is the trap: it passes every review a web-application reviewer would run, and it still takes four hours to reach twenty nodes because the finding that remains is one no general guide teaches you to look for.</text>
</svg>
