<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why search is a matrix multiplication</title>
  <style>
    .batch-search-bg   { fill: #f8fafc; }
    .batch-search-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-search-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-search-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-search-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-search-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-search-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .batch-search-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .batch-search-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .batch-search-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .batch-search-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .batch-search-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .batch-search-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .batch-search-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .batch-search-stage { opacity: 1; }

    .batch-search-s0 { animation-delay: 0.00s; }
    .batch-search-e0 { animation-delay: 0.00s; }
    .batch-search-s1 { animation-delay: 1.28s; }
    .batch-search-e1 { animation-delay: 1.28s; }
    .batch-search-s2 { animation-delay: 2.56s; }
    .batch-search-e2 { animation-delay: 2.56s; }
    .batch-search-s3 { animation-delay: 3.84s; }
    .batch-search-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .batch-search-conn  { animation: batch-search-trace 6.4s ease-in-out infinite; }
      .batch-search-stage { animation: batch-search-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes batch-search-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes batch-search-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .batch-search-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .batch-search-stage { animation: batch-search-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes batch-search-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="batch-search-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="batch-search-bg" width="980" height="322"/>
  <text class="batch-search-h1"  x="30" y="40">Why search is a matrix multiplication</text>
  <text class="batch-search-sub" x="30" y="64">Four steps.</text>
  <g class="batch-search-stage batch-search-s0">
    <rect class="batch-search-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="batch-search-step" x="44" y="142">01</text>
    <text class="batch-search-name" x="70" y="142">Comparing one query to each vector in a loop</text>
    <text class="batch-search-desc" x="44" y="166">Correct, and very slow.</text>
  </g>
  <line class="batch-search-line batch-search-conn batch-search-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#batch-search-tip)"/>
  <g class="batch-search-stage batch-search-s1">
    <rect class="batch-search-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="batch-search-step" x="280" y="142">02</text>
    <text class="batch-search-name" x="306" y="142">The same computation is one matrix multiplication</text>
    <text class="batch-search-desc" x="280" y="166">Query against the whole corpus</text>
    <text class="batch-search-desc" x="280" y="182">at once.</text>
  </g>
  <line class="batch-search-line batch-search-conn batch-search-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#batch-search-tip)"/>
  <g class="batch-search-stage batch-search-s2">
    <rect class="batch-search-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="batch-search-step" x="516" y="142">03</text>
    <text class="batch-search-name" x="542" y="142">Which optimised numerical libraries do extremely fast</text>
    <text class="batch-search-desc" x="516" y="166">Decades of tuning, already done.</text>
  </g>
  <line class="batch-search-line batch-search-conn batch-search-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#batch-search-tip)"/>
  <g class="batch-search-stage batch-search-s3">
    <rect class="batch-search-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="batch-search-step" x="752" y="142">04</text>
    <text class="batch-search-name" x="778" y="142">And several queries batch into the same operation</text>
    <text class="batch-search-desc" x="752" y="166">Which is close to free.</text>
    <text class="batch-search-edge" x="752" y="242">batched</text>
  </g>
  <text class="batch-search-sub" x="30" y="304">This is why exact search remains viable at surprising scale: the operation maps onto exactly the primitive that hardware and numerical libraries are best at.</text>
</svg>
