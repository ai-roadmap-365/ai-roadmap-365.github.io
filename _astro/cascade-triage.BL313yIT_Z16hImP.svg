<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three signals, all under ten milliseconds.">
  <title>Triaging cheaply</title>
  <style>
    .cascade-triage-bg   { fill: #f8fafc; }
    .cascade-triage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-triage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-triage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-triage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-triage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-triage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cascade-triage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cascade-triage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cascade-triage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cascade-triage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cascade-triage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cascade-triage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cascade-triage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cascade-triage-stage { opacity: 1; }

    .cascade-triage-s0 { animation-delay: 0.00s; }
    .cascade-triage-e0 { animation-delay: 0.00s; }
    .cascade-triage-s1 { animation-delay: 1.28s; }
    .cascade-triage-e1 { animation-delay: 1.28s; }
    .cascade-triage-s2 { animation-delay: 2.56s; }
    .cascade-triage-e2 { animation-delay: 2.56s; }
    .cascade-triage-s3 { animation-delay: 3.84s; }
    .cascade-triage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cascade-triage-conn  { animation: cascade-triage-trace 6.4s ease-in-out infinite; }
      .cascade-triage-stage { animation: cascade-triage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cascade-triage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cascade-triage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cascade-triage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cascade-triage-stage { animation: cascade-triage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cascade-triage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cascade-triage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cascade-triage-bg" width="980" height="322"/>
  <text class="cascade-triage-h1"  x="30" y="40">Triaging cheaply</text>
  <text class="cascade-triage-sub" x="30" y="64">Three signals, all under ten milliseconds.</text>
  <g class="cascade-triage-stage cascade-triage-s0">
    <rect class="cascade-triage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cascade-triage-step" x="44" y="142">01</text>
    <text class="cascade-triage-name" x="70" y="142">Length and symbols</text>
    <text class="cascade-triage-desc" x="44" y="166">Under fifteen words, no code:</text>
    <text class="cascade-triage-desc" x="44" y="182">start with a compact model.</text>
  </g>
  <line class="cascade-triage-line cascade-triage-conn cascade-triage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cascade-triage-tip)"/>
  <g class="cascade-triage-stage cascade-triage-s1">
    <rect class="cascade-triage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cascade-triage-step" x="280" y="142">02</text>
    <text class="cascade-triage-name" x="306" y="142">Embedding centroids</text>
    <text class="cascade-triage-desc" x="280" y="166">Compare against precomputed</text>
    <text class="cascade-triage-desc" x="280" y="182">clusters of known hard tasks.</text>
    <text class="cascade-triage-edge" x="280" y="242">&lt;10 ms</text>
  </g>
  <line class="cascade-triage-line cascade-triage-conn cascade-triage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cascade-triage-tip)"/>
  <g class="cascade-triage-stage cascade-triage-s2">
    <rect class="cascade-triage-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cascade-triage-step" x="516" y="142">03</text>
    <text class="cascade-triage-name" x="542" y="142">Confidence escalation</text>
    <text class="cascade-triage-desc" x="516" y="166">The small model answers; below a</text>
    <text class="cascade-triage-desc" x="516" y="182">confidence threshold, escalate.</text>
  </g>
  <line class="cascade-triage-line cascade-triage-conn cascade-triage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cascade-triage-tip)"/>
  <g class="cascade-triage-stage cascade-triage-s3">
    <rect class="cascade-triage-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cascade-triage-step" x="752" y="142">04</text>
    <text class="cascade-triage-name" x="778" y="142">Triage must be cheaper than the saving</text>
    <text class="cascade-triage-desc" x="752" y="166">A frontier model classifying</text>
    <text class="cascade-triage-desc" x="752" y="182">difficulty defeats the purpose</text>
    <text class="cascade-triage-desc" x="752" y="198">entirely.</text>
  </g>
  <text class="cascade-triage-sub" x="30" y="304">The confidence-escalation path is the most robust of the three because it uses the small model's own uncertainty rather than a proxy for difficulty computed before anything was attempted.</text>
</svg>
