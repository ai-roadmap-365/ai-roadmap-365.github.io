<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward automation.">
  <title>Four steps in testing practice</title>
  <style>
    .test-history-bg   { fill: #f8fafc; }
    .test-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .test-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .test-history-stage { opacity: 1; }

    .test-history-s0 { animation-delay: 0.00s; }
    .test-history-e0 { animation-delay: 0.00s; }
    .test-history-s1 { animation-delay: 1.28s; }
    .test-history-e1 { animation-delay: 1.28s; }
    .test-history-s2 { animation-delay: 2.56s; }
    .test-history-e2 { animation-delay: 2.56s; }
    .test-history-s3 { animation-delay: 3.84s; }
    .test-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .test-history-conn  { animation: test-history-trace 6.4s ease-in-out infinite; }
      .test-history-stage { animation: test-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes test-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes test-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .test-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .test-history-stage { animation: test-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes test-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="test-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="test-history-bg" width="980" height="322"/>
  <text class="test-history-h1"  x="30" y="40">Four steps in testing practice</text>
  <text class="test-history-sub" x="30" y="64">Toward automation.</text>
  <g class="test-history-stage test-history-s0">
    <rect class="test-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="test-history-step" x="44" y="142">01</text>
    <text class="test-history-name" x="70" y="142">Manual testing before release</text>
    <text class="test-history-desc" x="44" y="166">Slow, and not repeatable.</text>
  </g>
  <line class="test-history-line test-history-conn test-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#test-history-tip)"/>
  <g class="test-history-stage test-history-s1">
    <rect class="test-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="test-history-step" x="280" y="142">02</text>
    <text class="test-history-name" x="306" y="142">Then unit test frameworks</text>
    <text class="test-history-desc" x="280" y="166">Which made verification</text>
    <text class="test-history-desc" x="280" y="182">repeatable.</text>
  </g>
  <line class="test-history-line test-history-conn test-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#test-history-tip)"/>
  <g class="test-history-stage test-history-s2">
    <rect class="test-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="test-history-step" x="516" y="142">03</text>
    <text class="test-history-name" x="542" y="142">Then running them on every change automatically</text>
    <text class="test-history-desc" x="516" y="166">Which made them a gate rather</text>
    <text class="test-history-desc" x="516" y="182">than a habit.</text>
  </g>
  <line class="test-history-line test-history-conn test-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#test-history-tip)"/>
  <g class="test-history-stage test-history-s3">
    <rect class="test-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="test-history-step" x="752" y="142">04</text>
    <text class="test-history-name" x="778" y="142">And generated inputs, which find cases nobody wrote</text>
    <text class="test-history-desc" x="752" y="166">Property-based testing.</text>
  </g>
  <text class="test-history-sub" x="30" y="304">Running automatically on every change is what turned testing from a discipline requiring willpower into a property of the system.</text>
</svg>
