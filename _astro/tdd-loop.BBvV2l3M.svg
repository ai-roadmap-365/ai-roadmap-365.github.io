<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three steps, repeated.">
  <title>The loop</title>
  <style>
    .tdd-loop-bg   { fill: #f8fafc; }
    .tdd-loop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-loop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-loop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-loop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-loop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-loop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tdd-loop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tdd-loop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tdd-loop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tdd-loop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tdd-loop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tdd-loop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tdd-loop-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tdd-loop-stage { opacity: 1; }

    .tdd-loop-s0 { animation-delay: 0.00s; }
    .tdd-loop-e0 { animation-delay: 0.00s; }
    .tdd-loop-s1 { animation-delay: 1.50s; }
    .tdd-loop-e1 { animation-delay: 1.50s; }
    .tdd-loop-s2 { animation-delay: 3.00s; }
    .tdd-loop-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .tdd-loop-conn  { animation: tdd-loop-trace 6s ease-in-out infinite; }
      .tdd-loop-stage { animation: tdd-loop-arrive 6s ease-in-out infinite; }
    }
    @keyframes tdd-loop-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tdd-loop-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tdd-loop-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tdd-loop-stage { animation: tdd-loop-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tdd-loop-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tdd-loop-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tdd-loop-bg" width="980" height="322"/>
  <text class="tdd-loop-h1"  x="30" y="40">The loop</text>
  <text class="tdd-loop-sub" x="30" y="64">Three steps, repeated.</text>
  <g class="tdd-loop-stage tdd-loop-s0">
    <rect class="tdd-loop-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="tdd-loop-step" x="44" y="142">01</text>
    <text class="tdd-loop-name" x="70" y="142">Write a failing test for the next behaviour</text>
    <text class="tdd-loop-desc" x="44" y="166">And watch it fail, which verifies the test.</text>
  </g>
  <line class="tdd-loop-line tdd-loop-conn tdd-loop-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#tdd-loop-tip)"/>
  <g class="tdd-loop-stage tdd-loop-s1">
    <rect class="tdd-loop-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="tdd-loop-step" x="359" y="142">02</text>
    <text class="tdd-loop-name" x="385" y="142">Write the least code that makes it pass</text>
    <text class="tdd-loop-desc" x="359" y="166">Deliberately minimal.</text>
  </g>
  <line class="tdd-loop-line tdd-loop-conn tdd-loop-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#tdd-loop-tip)"/>
  <g class="tdd-loop-stage tdd-loop-s2">
    <rect class="tdd-loop-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="tdd-loop-step" x="674" y="142">03</text>
    <text class="tdd-loop-name" x="700" y="142">Then improve the design, with the test holding</text>
    <text class="tdd-loop-desc" x="674" y="166">Which is where the quality comes from.</text>
  </g>
  <text class="tdd-loop-sub" x="30" y="304">Watching the test fail first is not ceremony: a test that passes before the code exists is testing nothing, and that happens more often than people expect.</text>
</svg>
