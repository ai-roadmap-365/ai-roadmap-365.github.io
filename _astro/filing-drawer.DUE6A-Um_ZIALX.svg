<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Insertion at the front is expensive.">
  <title>A drawer of numbered slots</title>
  <style>
    .filing-drawer-bg   { fill: #f8fafc; }
    .filing-drawer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-drawer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-drawer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-drawer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-drawer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-drawer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .filing-drawer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .filing-drawer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .filing-drawer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .filing-drawer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .filing-drawer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .filing-drawer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .filing-drawer-row { opacity: 1; }
    .filing-drawer-r0 { animation-delay: 0.00s; }
    .filing-drawer-r1 { animation-delay: 0.45s; }
    .filing-drawer-r2 { animation-delay: 0.90s; }
    .filing-drawer-r3 { animation-delay: 1.35s; }
    .filing-drawer-r4 { animation-delay: 1.80s; }
    .filing-drawer-row { animation: filing-drawer-reveal 7.3s ease-in-out infinite; }
    @keyframes filing-drawer-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="filing-drawer-bg" width="980" height="390"/>
  <text class="filing-drawer-h1"  x="30" y="40">A drawer of numbered slots</text>
  <text class="filing-drawer-sub" x="30" y="64">Insertion at the front is expensive.</text>
  <rect class="filing-drawer-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="filing-drawer-name" x="46" y="122">Adding at the end</text>
  <text class="filing-drawer-desc" x="46" y="142">One action.</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r0" x="46" y="182">Put it in the next free slot</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r1" x="46" y="216">Nothing else moves</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r2" x="46" y="250">Constant effort</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r3" x="46" y="284">Cheap however full the drawer</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r4" x="46" y="318">This is appending</text>
  <rect class="filing-drawer-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="filing-drawer-name" x="526" y="122">Adding at the front</text>
  <text class="filing-drawer-desc" x="526" y="142">Everything shifts.</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r0" x="526" y="182">Every item moves back one slot</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r1" x="526" y="216">The whole drawer is touched</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r2" x="526" y="250">Effort grows with the contents</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r3" x="526" y="284">Expensive, and worse as it fills</text>
  <text class="filing-drawer-desc filing-drawer-row filing-drawer-r4" x="526" y="318">This is inserting at position zero</text>
  <text class="filing-drawer-sub" x="30" y="372">Anyone who has reorganised a full drawer understands this cost immediately, and it is exactly why a deque exists for queue-like work.</text>
</svg>
