<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What a hypothesis test does</title>
  <style>
    .test-idea-bg   { fill: #f8fafc; }
    .test-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .test-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .test-idea-stage { opacity: 1; }

    .test-idea-s0 { animation-delay: 0.00s; }
    .test-idea-e0 { animation-delay: 0.00s; }
    .test-idea-s1 { animation-delay: 1.28s; }
    .test-idea-e1 { animation-delay: 1.28s; }
    .test-idea-s2 { animation-delay: 2.56s; }
    .test-idea-e2 { animation-delay: 2.56s; }
    .test-idea-s3 { animation-delay: 3.84s; }
    .test-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .test-idea-conn  { animation: test-idea-trace 6.4s ease-in-out infinite; }
      .test-idea-stage { animation: test-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes test-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes test-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .test-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .test-idea-stage { animation: test-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes test-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="test-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="test-idea-bg" width="980" height="322"/>
  <text class="test-idea-h1"  x="30" y="40">What a hypothesis test does</text>
  <text class="test-idea-sub" x="30" y="64">Four steps.</text>
  <g class="test-idea-stage test-idea-s0">
    <rect class="test-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="test-idea-step" x="44" y="142">01</text>
    <text class="test-idea-name" x="70" y="142">Assume nothing is going on: the null hypothesis</text>
    <text class="test-idea-desc" x="44" y="166">Which is what you try to reject.</text>
  </g>
  <line class="test-idea-line test-idea-conn test-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#test-idea-tip)"/>
  <g class="test-idea-stage test-idea-s1">
    <rect class="test-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="test-idea-step" x="280" y="142">02</text>
    <text class="test-idea-name" x="306" y="142">Compute a statistic from the observed data</text>
    <text class="test-idea-desc" x="280" y="166">Summarising the difference seen.</text>
  </g>
  <line class="test-idea-line test-idea-conn test-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#test-idea-tip)"/>
  <g class="test-idea-stage test-idea-s2">
    <rect class="test-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="test-idea-step" x="516" y="142">03</text>
    <text class="test-idea-name" x="542" y="142">Ask how likely such data would be under the null</text>
    <text class="test-idea-desc" x="516" y="166">Which is the p-value.</text>
  </g>
  <line class="test-idea-line test-idea-conn test-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#test-idea-tip)"/>
  <g class="test-idea-stage test-idea-s3">
    <rect class="test-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="test-idea-step" x="752" y="142">04</text>
    <text class="test-idea-name" x="778" y="142">And reject the null if that is sufficiently unlikely</text>
    <text class="test-idea-desc" x="752" y="166">By a threshold chosen in</text>
    <text class="test-idea-desc" x="752" y="182">advance.</text>
  </g>
  <text class="test-idea-sub" x="30" y="304">Choosing the threshold in advance is not a formality: choosing it afterwards turns a test into a search for whichever cutoff produces the desired verdict.</text>
</svg>
