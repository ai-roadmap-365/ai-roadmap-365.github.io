<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The order matters.">
  <title>Chunk then embed, or embed then chunk</title>
  <style>
    .late-chunking-bg   { fill: #f8fafc; }
    .late-chunking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .late-chunking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .late-chunking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .late-chunking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .late-chunking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .late-chunking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .late-chunking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .late-chunking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .late-chunking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .late-chunking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .late-chunking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .late-chunking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .late-chunking-row { opacity: 1; }
    .late-chunking-r0 { animation-delay: 0.00s; }
    .late-chunking-r1 { animation-delay: 0.45s; }
    .late-chunking-r2 { animation-delay: 0.90s; }
    .late-chunking-r3 { animation-delay: 1.35s; }
    .late-chunking-r4 { animation-delay: 1.80s; }
    .late-chunking-row { animation: late-chunking-reveal 7.3s ease-in-out infinite; }
    @keyframes late-chunking-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="late-chunking-bg" width="980" height="390"/>
  <text class="late-chunking-h1"  x="30" y="40">Chunk then embed, or embed then chunk</text>
  <text class="late-chunking-sub" x="30" y="64">The order matters.</text>
  <rect class="late-chunking-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="late-chunking-name" x="46" y="122">Chunk, then embed</text>
  <text class="late-chunking-desc" x="46" y="142">The usual order.</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r0" x="46" y="182">Each chunk encoded in isolation</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r1" x="46" y="216">No knowledge of surrounding text</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r2" x="46" y="250">Pronouns and references unresolved</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r3" x="46" y="284">Works with any embedding model</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r4" x="46" y="318">The standard pipeline</text>
  <rect class="late-chunking-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="late-chunking-name" x="526" y="122">Embed, then chunk</text>
  <text class="late-chunking-desc" x="526" y="142">Context preserved.</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r0" x="526" y="182">The whole document encoded first</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r1" x="526" y="216">Every token sees the full context</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r2" x="526" y="250">References resolved before pooling</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r3" x="526" y="284">Needs a long-context embedding model</text>
  <text class="late-chunking-desc late-chunking-row late-chunking-r4" x="526" y="318">Measurably better retrieval</text>
  <text class="late-chunking-sub" x="30" y="372">Encoding first means a chunk saying 'it increased by twelve percent' carries what 'it' referred to, which the isolated version simply cannot.</text>
</svg>
