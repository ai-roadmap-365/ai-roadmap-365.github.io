<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Circuit Breaker and Health Probe State Machine">
  <title>Circuit Breaker and Health Probe State Machine</title>
  <defs>
    <style>
      .d336b-bg { fill: #f8fafc; }
      .d336b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d336b-cls { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d336b-opn { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d336b-hlf { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2px; rx: 8px; }
      .d336b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d336b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d336b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d336b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d336b-bg" />
  
  <text x="40" y="40" class="d336a-title">Circuit Breaker &amp; Probe State Machine</text>
  <text x="40" y="65" class="d336a-subtitle">Circuit Breaker and Health Probe State Machine showing Closed (Normal), Open (Failing Fast), and Half-Open (Canary Testing) States with Startup and Readiness Probes</text>
  
  <!-- Closed State -->
  <rect x="40" y="110" width="250" height="270" class="d336b-cls" />
  <text x="55" y="145" class="d336b-header" fill="#15803d">1. CLOSED (Normal Operation)</text>
  <text x="55" y="180" class="d336b-text">• 100% Traffic routed to replicas</text>
  <text x="55" y="205" class="d336b-text">• Readiness Probe: 200 OK</text>
  <text x="55" y="230" class="d336b-text">• Error rate &lt; 10%</text>
  <text x="55" y="260" class="d336b-text">• **Trip Condition:**</text>
  <text x="55" y="280" class="d336b-text">  5 consecutive 500 errors ➔ OPEN</text>
  <text x="55" y="320" class="d336b-text" font-weight="600" fill="#15803d">Healthy Serving State</text>
  
  <!-- Open State -->
  <rect x="325" y="110" width="250" height="270" class="d336b-opn" />
  <text x="340" y="145" class="d336b-header" fill="#b91c1c">2. OPEN (Failing Fast)</text>
  <text x="340" y="180" class="d336b-text">• Zero traffic sent to failing replica</text>
  <text x="340" y="205" class="d336b-text">• Gateway returns cached fallback</text>
  <text x="340" y="230" class="d336b-text">• Prevents GPU cascade collapse</text>
  <text x="340" y="260" class="d336b-text">• **Cooldown Window:**</text>
  <text x="340" y="280" class="d336b-text">  Wait 30 seconds ➔ HALF-OPEN</text>
  <text x="340" y="320" class="d336b-text" font-weight="600" fill="#b91c1c">Protected Recovery</text>
  
  <!-- Half-Open State -->
  <rect x="610" y="110" width="250" height="270" class="d336b-hlf" />
  <text x="625" y="145" class="d336b-header" fill="#b45309">3. HALF-OPEN (Canary Trial)</text>
  <text x="625" y="180" class="d336b-text">• Sends 1 trial probe request</text>
  <text x="625" y="205" class="d336b-text">• **If Trial Succeeds:**</text>
  <text x="625" y="225" class="d336b-text">  Reset error count ➔ CLOSED</text>
  <text x="625" y="255" class="d336b-text">• **If Trial Fails:**</text>
  <text x="625" y="275" class="d336b-text">  Re-trip immediately ➔ OPEN</text>
  <text x="625" y="320" class="d336b-text" font-weight="600" fill="#b45309">Safe Self-Healing</text>
</svg>