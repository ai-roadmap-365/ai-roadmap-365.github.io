<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what is voluntary.">
  <title>Where governance is mandatory</title>
  <style>
    .governance-when-bg   { fill: #f8fafc; }
    .governance-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .governance-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .governance-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .governance-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .governance-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .governance-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .governance-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .governance-when-row { opacity: 1; }
    .governance-when-r0 { animation-delay: 0.00s; }
    .governance-when-r1 { animation-delay: 0.45s; }
    .governance-when-r2 { animation-delay: 0.90s; }
    .governance-when-r3 { animation-delay: 1.35s; }
    .governance-when-r4 { animation-delay: 1.80s; }
    .governance-when-row { animation: governance-when-reveal 7.3s ease-in-out infinite; }
    @keyframes governance-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="governance-when-bg" width="980" height="390"/>
  <text class="governance-when-h1"  x="30" y="40">Where governance is mandatory</text>
  <text class="governance-when-sub" x="30" y="64">And what is voluntary.</text>
  <rect class="governance-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="governance-when-name" x="46" y="122">Mandatory</text>
  <text class="governance-when-desc" x="46" y="142">Production and high-risk.</text>
  <text class="governance-when-desc governance-when-row governance-when-r0" x="46" y="182">Any enterprise AI system in production</text>
  <text class="governance-when-desc governance-when-row governance-when-r1" x="46" y="216">Hiring, lending, healthcare, education</text>
  <text class="governance-when-desc governance-when-row governance-when-r2" x="46" y="250">Law enforcement applications</text>
  <text class="governance-when-desc governance-when-row governance-when-r3" x="46" y="284">Anything sold into the EU</text>
  <text class="governance-when-desc governance-when-row governance-when-r4" x="46" y="318">Anything a procurement team will review</text>
  <rect class="governance-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="governance-when-name" x="526" y="122">Voluntary</text>
  <text class="governance-when-desc" x="526" y="142">Internal prototypes.</text>
  <text class="governance-when-desc governance-when-row governance-when-r0" x="526" y="182">Developer prototyping scripts</text>
  <text class="governance-when-desc governance-when-row governance-when-r1" x="526" y="216">No external users, no decisions about people</text>
  <text class="governance-when-desc governance-when-row governance-when-r2" x="526" y="250">But record the risk tier anyway</text>
  <text class="governance-when-desc governance-when-row governance-when-r3" x="526" y="284">It takes one line</text>
  <text class="governance-when-desc governance-when-row governance-when-r4" x="526" y="318">And it is the field people forget</text>
  <text class="governance-when-sub" x="30" y="372">Recording the tier even for a prototype is worth the line because prototypes become products: the classification is cheapest to make when the system is small and nobody is arguing about the answer.</text>
</svg>
