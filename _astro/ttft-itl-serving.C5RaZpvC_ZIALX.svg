<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Optimised differently.">
  <title>Two latency targets</title>
  <style>
    .ttft-itl-serving-bg   { fill: #f8fafc; }
    .ttft-itl-serving-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-serving-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-serving-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-serving-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-serving-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-serving-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ttft-itl-serving-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ttft-itl-serving-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ttft-itl-serving-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ttft-itl-serving-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ttft-itl-serving-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ttft-itl-serving-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ttft-itl-serving-row { opacity: 1; }
    .ttft-itl-serving-r0 { animation-delay: 0.00s; }
    .ttft-itl-serving-r1 { animation-delay: 0.45s; }
    .ttft-itl-serving-r2 { animation-delay: 0.90s; }
    .ttft-itl-serving-r3 { animation-delay: 1.35s; }
    .ttft-itl-serving-r4 { animation-delay: 1.80s; }
    .ttft-itl-serving-row { animation: ttft-itl-serving-reveal 7.3s ease-in-out infinite; }
    @keyframes ttft-itl-serving-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ttft-itl-serving-bg" width="980" height="390"/>
  <text class="ttft-itl-serving-h1"  x="30" y="40">Two latency targets</text>
  <text class="ttft-itl-serving-sub" x="30" y="64">Optimised differently.</text>
  <rect class="ttft-itl-serving-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ttft-itl-serving-name" x="46" y="122">Time to first token</text>
  <text class="ttft-itl-serving-desc" x="46" y="142">Responsiveness.</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r0" x="46" y="182">Dominated by prompt processing</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r1" x="46" y="216">Improved by prefix caching</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r2" x="46" y="250">Hurt by large batches waiting to form</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r3" x="46" y="284">What users judge speed on</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r4" x="46" y="318">Target: under a second</text>
  <rect class="ttft-itl-serving-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ttft-itl-serving-name" x="526" y="122">Inter-token latency</text>
  <text class="ttft-itl-serving-desc" x="526" y="142">Reading speed.</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r0" x="526" y="182">Dominated by memory bandwidth</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r1" x="526" y="216">Improved by quantisation and sharding</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r2" x="526" y="250">Hurt by very large batches</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r3" x="526" y="284">Determines total duration</text>
  <text class="ttft-itl-serving-desc ttft-itl-serving-row ttft-itl-serving-r4" x="526" y="318">Target: faster than reading</text>
  <text class="ttft-itl-serving-sub" x="30" y="372">These pull against each other through batch size, which is why a serving target has to name which one it means rather than asking for low latency.</text>
</svg>
