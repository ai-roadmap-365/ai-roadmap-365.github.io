<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Neighbour probabilities</title>
  <style>
    .affinities-bg   { fill: #f8fafc; }
    .affinities-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .affinities-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .affinities-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .affinities-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .affinities-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .affinities-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .affinities-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .affinities-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .affinities-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .affinities-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .affinities-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .affinities-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .affinities-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .affinities-stage { opacity: 1; }

    .affinities-s0 { animation-delay: 0.00s; }
    .affinities-e0 { animation-delay: 0.00s; }
    .affinities-s1 { animation-delay: 1.28s; }
    .affinities-e1 { animation-delay: 1.28s; }
    .affinities-s2 { animation-delay: 2.56s; }
    .affinities-e2 { animation-delay: 2.56s; }
    .affinities-s3 { animation-delay: 3.84s; }
    .affinities-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .affinities-conn  { animation: affinities-trace 6.4s ease-in-out infinite; }
      .affinities-stage { animation: affinities-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes affinities-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes affinities-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .affinities-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .affinities-stage { animation: affinities-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes affinities-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="affinities-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="affinities-bg" width="980" height="322"/>
  <text class="affinities-h1"  x="30" y="40">Neighbour probabilities</text>
  <text class="affinities-sub" x="30" y="64">Four steps.</text>
  <g class="affinities-stage affinities-s0">
    <rect class="affinities-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="affinities-step" x="44" y="142">01</text>
    <text class="affinities-name" x="70" y="142">Compute distances from each point to every other</text>
    <text class="affinities-desc" x="44" y="166">In the original high-dimensional</text>
    <text class="affinities-desc" x="44" y="182">space.</text>
  </g>
  <line class="affinities-line affinities-conn affinities-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#affinities-tip)"/>
  <g class="affinities-stage affinities-s1">
    <rect class="affinities-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="affinities-step" x="280" y="142">02</text>
    <text class="affinities-name" x="306" y="142">Convert them to similarities with a bell-shaped kernel</text>
    <text class="affinities-desc" x="280" y="166">Near points similar, far points</text>
    <text class="affinities-desc" x="280" y="182">nearly zero.</text>
  </g>
  <line class="affinities-line affinities-conn affinities-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#affinities-tip)"/>
  <g class="affinities-stage affinities-s2">
    <rect class="affinities-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="affinities-step" x="516" y="142">03</text>
    <text class="affinities-name" x="542" y="142">Normalise so each point's similarities sum to one</text>
    <text class="affinities-desc" x="516" y="166">Giving a probability</text>
    <text class="affinities-desc" x="516" y="182">distribution per point.</text>
  </g>
  <line class="affinities-line affinities-conn affinities-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#affinities-tip)"/>
  <g class="affinities-stage affinities-s3">
    <rect class="affinities-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="affinities-step" x="752" y="142">04</text>
    <text class="affinities-name" x="778" y="142">With a width set by the perplexity parameter</text>
    <text class="affinities-desc" x="752" y="166">Which is effectively how many</text>
    <text class="affinities-desc" x="752" y="182">neighbours count.</text>
  </g>
  <text class="affinities-sub" x="30" y="304">Perplexity is the parameter that changes the picture most, and running the method at several values is the only reliable way to see which structure is stable.</text>
</svg>
