<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two hundred times cheaper, conditionally.">
  <title>Full rebuild against incremental</title>
  <style>
    .incremental-economics-bg   { fill: #f8fafc; }
    .incremental-economics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incremental-economics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incremental-economics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incremental-economics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incremental-economics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incremental-economics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .incremental-economics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .incremental-economics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .incremental-economics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .incremental-economics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .incremental-economics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .incremental-economics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .incremental-economics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .incremental-economics-stage { opacity: 1; }

    .incremental-economics-s0 { animation-delay: 0.00s; }
    .incremental-economics-e0 { animation-delay: 0.00s; }
    .incremental-economics-s1 { animation-delay: 1.28s; }
    .incremental-economics-e1 { animation-delay: 1.28s; }
    .incremental-economics-s2 { animation-delay: 2.56s; }
    .incremental-economics-e2 { animation-delay: 2.56s; }
    .incremental-economics-s3 { animation-delay: 3.84s; }
    .incremental-economics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .incremental-economics-conn  { animation: incremental-economics-trace 6.4s ease-in-out infinite; }
      .incremental-economics-stage { animation: incremental-economics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes incremental-economics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes incremental-economics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .incremental-economics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .incremental-economics-stage { animation: incremental-economics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes incremental-economics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="incremental-economics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="incremental-economics-bg" width="980" height="322"/>
  <text class="incremental-economics-h1"  x="30" y="40">Full rebuild against incremental</text>
  <text class="incremental-economics-sub" x="30" y="64">Two hundred times cheaper, conditionally.</text>
  <g class="incremental-economics-stage incremental-economics-s0">
    <rect class="incremental-economics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="incremental-economics-step" x="44" y="142">01</text>
    <text class="incremental-economics-name" x="70" y="142">Full rebuild: 100,000 articles</text>
    <text class="incremental-economics-desc" x="44" y="166">Re-extracted, re-chunked,</text>
    <text class="incremental-economics-desc" x="44" y="182">re-embedded nightly. Hours, and</text>
    <text class="incremental-economics-desc" x="44" y="198">the same cost regardless.</text>
  </g>
  <line class="incremental-economics-line incremental-economics-conn incremental-economics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#incremental-economics-tip)"/>
  <g class="incremental-economics-stage incremental-economics-s1">
    <rect class="incremental-economics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="incremental-economics-step" x="280" y="142">02</text>
    <text class="incremental-economics-name" x="306" y="142">Incremental: about 500 modified</text>
    <text class="incremental-economics-desc" x="280" y="166">Asked for by cursor.</text>
  </g>
  <line class="incremental-economics-line incremental-economics-conn incremental-economics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#incremental-economics-tip)"/>
  <g class="incremental-economics-stage incremental-economics-s2">
    <rect class="incremental-economics-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="incremental-economics-step" x="516" y="142">03</text>
    <text class="incremental-economics-name" x="542" y="142">Of which about 480 genuinely changed</text>
    <text class="incremental-economics-desc" x="516" y="166">The content hash proves the rest</text>
    <text class="incremental-economics-desc" x="516" y="182">were touched without changing.</text>
    <text class="incremental-economics-edge" x="516" y="242">the hash</text>
  </g>
  <line class="incremental-economics-line incremental-economics-conn incremental-economics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#incremental-economics-tip)"/>
  <g class="incremental-economics-stage incremental-economics-s3">
    <rect class="incremental-economics-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="incremental-economics-step" x="752" y="142">04</text>
    <text class="incremental-economics-name" x="778" y="142">Roughly 200x cheaper</text>
    <text class="incremental-economics-desc" x="752" y="166">But only if hashes and stable</text>
    <text class="incremental-economics-desc" x="752" y="182">ids both hold.</text>
  </g>
  <text class="incremental-economics-sub" x="30" y="304">Remove either invariant and the incremental run is not cheaper, it is simply wrong: without the hash it re-embeds unnecessarily, and without stable ids it duplicates.</text>
</svg>
