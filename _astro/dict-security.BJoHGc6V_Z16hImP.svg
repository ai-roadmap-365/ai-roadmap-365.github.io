<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three concerns.">
  <title>Dictionaries and security</title>
  <style>
    .dict-security-bg   { fill: #f8fafc; }
    .dict-security-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-security-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-security-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-security-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-security-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-security-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dict-security-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dict-security-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dict-security-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dict-security-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dict-security-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dict-security-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dict-security-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dict-security-stage { opacity: 1; }

    .dict-security-s0 { animation-delay: 0.00s; }
    .dict-security-e0 { animation-delay: 0.00s; }
    .dict-security-s1 { animation-delay: 1.50s; }
    .dict-security-e1 { animation-delay: 1.50s; }
    .dict-security-s2 { animation-delay: 3.00s; }
    .dict-security-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .dict-security-conn  { animation: dict-security-trace 6s ease-in-out infinite; }
      .dict-security-stage { animation: dict-security-arrive 6s ease-in-out infinite; }
    }
    @keyframes dict-security-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dict-security-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dict-security-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dict-security-stage { animation: dict-security-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dict-security-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dict-security-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dict-security-bg" width="980" height="322"/>
  <text class="dict-security-h1"  x="30" y="40">Dictionaries and security</text>
  <text class="dict-security-sub" x="30" y="64">Three concerns.</text>
  <g class="dict-security-stage dict-security-s0">
    <rect class="dict-security-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="dict-security-step" x="44" y="142">01</text>
    <text class="dict-security-name" x="70" y="142">Adversarial keys can force collisions</text>
    <text class="dict-security-desc" x="44" y="166">Turning constant lookup into a linear scan.</text>
  </g>
  <line class="dict-security-line dict-security-conn dict-security-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#dict-security-tip)"/>
  <g class="dict-security-stage dict-security-s1">
    <rect class="dict-security-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="dict-security-step" x="359" y="142">02</text>
    <text class="dict-security-name" x="385" y="142">Which per-process hash randomisation defends against</text>
    <text class="dict-security-desc" x="359" y="166">And is why hashes differ between runs.</text>
  </g>
  <line class="dict-security-line dict-security-conn dict-security-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#dict-security-tip)"/>
  <g class="dict-security-stage dict-security-s2">
    <rect class="dict-security-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="dict-security-step" x="674" y="142">03</text>
    <text class="dict-security-name" x="700" y="142">And keys built from user input can collide with your own</text>
    <text class="dict-security-desc" x="674" y="166">So namespace them rather than merging</text>
    <text class="dict-security-desc" x="674" y="182">blindly.</text>
  </g>
  <text class="dict-security-sub" x="30" y="304">Merging a user-supplied dictionary into a configuration dictionary is the concrete version of the third point, and it lets a caller override anything you did not expect.</text>
</svg>
