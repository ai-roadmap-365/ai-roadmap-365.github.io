<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What leakage is</title>
  <style>
    .leakage-idea-bg   { fill: #f8fafc; }
    .leakage-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leakage-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leakage-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leakage-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leakage-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leakage-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .leakage-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .leakage-idea-stage { opacity: 1; }

    .leakage-idea-s0 { animation-delay: 0.00s; }
    .leakage-idea-e0 { animation-delay: 0.00s; }
    .leakage-idea-s1 { animation-delay: 1.28s; }
    .leakage-idea-e1 { animation-delay: 1.28s; }
    .leakage-idea-s2 { animation-delay: 2.56s; }
    .leakage-idea-e2 { animation-delay: 2.56s; }
    .leakage-idea-s3 { animation-delay: 3.84s; }
    .leakage-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .leakage-idea-conn  { animation: leakage-idea-trace 6.4s ease-in-out infinite; }
      .leakage-idea-stage { animation: leakage-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes leakage-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes leakage-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .leakage-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .leakage-idea-stage { animation: leakage-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes leakage-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="leakage-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="leakage-idea-bg" width="980" height="322"/>
  <text class="leakage-idea-h1"  x="30" y="40">What leakage is</text>
  <text class="leakage-idea-sub" x="30" y="64">Four steps.</text>
  <g class="leakage-idea-stage leakage-idea-s0">
    <rect class="leakage-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-idea-step" x="44" y="142">01</text>
    <text class="leakage-idea-name" x="70" y="142">Information about the answer reaches the model</text>
    <text class="leakage-idea-desc" x="44" y="166">Through a route that will not</text>
    <text class="leakage-idea-desc" x="44" y="182">exist at prediction time.</text>
  </g>
  <line class="leakage-idea-line leakage-idea-conn leakage-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#leakage-idea-tip)"/>
  <g class="leakage-idea-stage leakage-idea-s1">
    <rect class="leakage-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-idea-step" x="280" y="142">02</text>
    <text class="leakage-idea-name" x="306" y="142">So validation scores are excellent</text>
    <text class="leakage-idea-desc" x="280" y="166">Sometimes suspiciously so.</text>
  </g>
  <line class="leakage-idea-line leakage-idea-conn leakage-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#leakage-idea-tip)"/>
  <g class="leakage-idea-stage leakage-idea-s2">
    <rect class="leakage-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-idea-step" x="516" y="142">03</text>
    <text class="leakage-idea-name" x="542" y="142">And production performance collapses</text>
    <text class="leakage-idea-desc" x="516" y="166">Because the route is gone.</text>
  </g>
  <line class="leakage-idea-line leakage-idea-conn leakage-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#leakage-idea-tip)"/>
  <g class="leakage-idea-stage leakage-idea-s3">
    <rect class="leakage-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-idea-step" x="752" y="142">04</text>
    <text class="leakage-idea-name" x="778" y="142">It is stable across folds and seeds</text>
    <text class="leakage-idea-desc" x="752" y="166">Which is exactly why it</text>
    <text class="leakage-idea-desc" x="752" y="182">convinces.</text>
  </g>
  <text class="leakage-idea-sub" x="30" y="304">Stability is what makes leakage so dangerous: every check that would catch randomness passes, because the leak is present in every fold equally.</text>
</svg>
