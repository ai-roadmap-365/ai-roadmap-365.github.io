<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Demographic parity</title>
  <style>
    .demographic-parity-bg   { fill: #f8fafc; }
    .demographic-parity-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demographic-parity-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demographic-parity-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demographic-parity-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demographic-parity-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demographic-parity-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .demographic-parity-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .demographic-parity-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .demographic-parity-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .demographic-parity-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .demographic-parity-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .demographic-parity-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .demographic-parity-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .demographic-parity-stage { opacity: 1; }

    .demographic-parity-s0 { animation-delay: 0.00s; }
    .demographic-parity-e0 { animation-delay: 0.00s; }
    .demographic-parity-s1 { animation-delay: 1.28s; }
    .demographic-parity-e1 { animation-delay: 1.28s; }
    .demographic-parity-s2 { animation-delay: 2.56s; }
    .demographic-parity-e2 { animation-delay: 2.56s; }
    .demographic-parity-s3 { animation-delay: 3.84s; }
    .demographic-parity-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .demographic-parity-conn  { animation: demographic-parity-trace 6.4s ease-in-out infinite; }
      .demographic-parity-stage { animation: demographic-parity-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes demographic-parity-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes demographic-parity-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .demographic-parity-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .demographic-parity-stage { animation: demographic-parity-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes demographic-parity-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="demographic-parity-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="demographic-parity-bg" width="980" height="322"/>
  <text class="demographic-parity-h1"  x="30" y="40">Demographic parity</text>
  <text class="demographic-parity-sub" x="30" y="64">Four steps.</text>
  <g class="demographic-parity-stage demographic-parity-s0">
    <rect class="demographic-parity-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="demographic-parity-step" x="44" y="142">01</text>
    <text class="demographic-parity-name" x="70" y="142">Compute the positive prediction rate per group</text>
    <text class="demographic-parity-desc" x="44" y="166">Regardless of the true outcome.</text>
  </g>
  <line class="demographic-parity-line demographic-parity-conn demographic-parity-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#demographic-parity-tip)"/>
  <g class="demographic-parity-stage demographic-parity-s1">
    <rect class="demographic-parity-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="demographic-parity-step" x="280" y="142">02</text>
    <text class="demographic-parity-name" x="306" y="142">Take the ratio of the lowest to the highest</text>
    <text class="demographic-parity-desc" x="280" y="166">Which is the disparate impact</text>
    <text class="demographic-parity-desc" x="280" y="182">ratio.</text>
  </g>
  <line class="demographic-parity-line demographic-parity-conn demographic-parity-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#demographic-parity-tip)"/>
  <g class="demographic-parity-stage demographic-parity-s2">
    <rect class="demographic-parity-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="demographic-parity-step" x="516" y="142">03</text>
    <text class="demographic-parity-name" x="542" y="142">A ratio below four-fifths is a legal warning sign</text>
    <text class="demographic-parity-desc" x="516" y="166">In several jurisdictions, as a</text>
    <text class="demographic-parity-desc" x="516" y="182">rule of thumb.</text>
  </g>
  <line class="demographic-parity-line demographic-parity-conn demographic-parity-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#demographic-parity-tip)"/>
  <g class="demographic-parity-stage demographic-parity-s3">
    <rect class="demographic-parity-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="demographic-parity-step" x="752" y="142">04</text>
    <text class="demographic-parity-name" x="778" y="142">But it ignores genuine base-rate differences</text>
    <text class="demographic-parity-desc" x="752" y="166">Which is why it is contested.</text>
  </g>
  <text class="demographic-parity-sub" x="30" y="304">The four-fifths rule is a screening threshold rather than a legal test, but it is widely used as a first check and is cheap to compute.</text>
</svg>
