<svg role="img" aria-label="CLI AI assistant terminal REPL architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>CLI AI Assistant Terminal REPL Architecture</title>
  <defs>
    <linearGradient id="bg259a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card259" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg259a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CLI AI ASSISTANT TERMINAL ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Interactive REPL, Real-Time Streaming, Tool Execution Router, and Memory Sliders</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card259)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- User Input REPL -->
    <rect x="25" y="25" width="165" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="107" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Terminal REPL</text>
    <rect x="35" y="70" width="145" height="60" fill="#1e293b" rx="4"/>
    <text x="45" y="90" fill="#38bdf8" font-size="8" font-weight="700">prompt_toolkit:</text>
    <text x="45" y="105" fill="#cbd5e1" font-size="7">• Multi-line input</text>
    <text x="45" y="118" fill="#cbd5e1" font-size="7">• History buffer</text>
    <text x="107" y="245" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">User CLI Ingress</text>

    <!-- Context & Cost Controller -->
    <rect x="210" y="25" width="165" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="292" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Context &amp; Ledger</text>
    <rect x="220" y="70" width="145" height="85" fill="#1e293b" rx="4"/>
    <text x="230" y="90" fill="#fbbf24" font-size="8" font-weight="700">Memory Controls:</text>
    <text x="230" y="105" fill="#cbd5e1" font-size="7">• Sliding Context Window</text>
    <text x="230" y="118" fill="#cbd5e1" font-size="7">• KV Cache Breakpoint</text>
    <text x="230" y="132" fill="#cbd5e1" font-size="7">• Token Bucket Limiter</text>
    <text x="230" y="145" fill="#34d399" font-size="7">• Cost Ledger ($)</text>
    <text x="292" y="245" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Session Manager</text>

    <!-- LLM Stream & Live UI -->
    <rect x="395" y="25" width="165" height="255" fill="#0f172a" stroke="#a855f7" rx="6"/>
    <text x="477" y="50" fill="#a855f7" font-size="10" font-weight="700" text-anchor="middle">3. Streamer &amp; Rich UI</text>
    <rect x="405" y="70" width="145" height="85" fill="#1e293b" rx="4"/>
    <text x="415" y="90" fill="#a855f7" font-size="8" font-weight="700">Rich Terminal UI:</text>
    <text x="415" y="105" fill="#cbd5e1" font-size="7">• live.update(Markdown)</text>
    <text x="415" y="118" fill="#cbd5e1" font-size="7">• Syntax Highlight</text>
    <text x="415" y="132" fill="#cbd5e1" font-size="7">• Typewriter Effect</text>
    <text x="415" y="145" fill="#34d399" font-size="7">• Sub-500ms TTFT</text>
    <text x="477" y="245" fill="#a855f7" font-size="8" font-weight="700" text-anchor="middle">Real-Time Output</text>

    <!-- Tool Dispatch Engine -->
    <rect x="580" y="25" width="155" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="657" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">4. Tool Dispatcher</text>
    <rect x="590" y="70" width="135" height="85" fill="#1e293b" rx="4"/>
    <text x="600" y="90" fill="#34d399" font-size="8" font-weight="700">Local Tool Suite:</text>
    <text x="600" y="105" fill="#cbd5e1" font-size="7">• read_file()</text>
    <text x="600" y="118" fill="#cbd5e1" font-size="7">• execute_shell()</text>
    <text x="600" y="132" fill="#cbd5e1" font-size="7">• calculate_math()</text>
    <text x="600" y="145" fill="#fbbf24" font-size="7">• Safe Sandboxing</text>
    <text x="657" y="245" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Local Tool Execution</text>
  </g>
</svg>
