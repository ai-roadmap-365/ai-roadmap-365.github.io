<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where not to.">
  <title>Where to type</title>
  <style>
    .typing-when-bg   { fill: #f8fafc; }
    .typing-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .typing-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .typing-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .typing-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .typing-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .typing-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .typing-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .typing-when-row { opacity: 1; }
    .typing-when-r0 { animation-delay: 0.00s; }
    .typing-when-r1 { animation-delay: 0.45s; }
    .typing-when-r2 { animation-delay: 0.90s; }
    .typing-when-r3 { animation-delay: 1.35s; }
    .typing-when-r4 { animation-delay: 1.80s; }
    .typing-when-row { animation: typing-when-reveal 7.3s ease-in-out infinite; }
    @keyframes typing-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="typing-when-bg" width="980" height="390"/>
  <text class="typing-when-h1"  x="30" y="40">Where to type</text>
  <text class="typing-when-sub" x="30" y="64">And where not to.</text>
  <rect class="typing-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="typing-when-name" x="46" y="122">Type it</text>
  <text class="typing-when-desc" x="46" y="142">Four places.</text>
  <text class="typing-when-desc typing-when-row typing-when-r0" x="46" y="182">Public interfaces and module boundaries</text>
  <text class="typing-when-desc typing-when-row typing-when-r1" x="46" y="216">Shared libraries</text>
  <text class="typing-when-desc typing-when-row typing-when-r2" x="46" y="250">Long-lived production code</text>
  <text class="typing-when-desc typing-when-row typing-when-r3" x="46" y="284">Data structures and records</text>
  <text class="typing-when-desc typing-when-row typing-when-r4" x="46" y="318">Anywhere several people work</text>
  <rect class="typing-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="typing-when-name" x="526" y="122">Skip it</text>
  <text class="typing-when-desc" x="526" y="142">Also four.</text>
  <text class="typing-when-desc typing-when-row typing-when-r0" x="526" y="182">Throwaway scripts</text>
  <text class="typing-when-desc typing-when-row typing-when-r1" x="526" y="216">Exploratory notebooks</text>
  <text class="typing-when-desc typing-when-row typing-when-r2" x="526" y="250">Obvious locals</text>
  <text class="typing-when-desc typing-when-row typing-when-r3" x="526" y="284">Where the annotation exceeds the code</text>
  <text class="typing-when-desc typing-when-row typing-when-r4" x="526" y="318">Where the type is genuinely dynamic</text>
  <text class="typing-when-sub" x="30" y="372">Typing the boundaries and leaving the interiors bare captures most of the value for a small fraction of the effort, which is what gradual typing is designed for.</text>
</svg>
