<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One name, two possible values.">
  <title>When a conditional should be an expression</title>
  <style>
    .ternary-shape-bg   { fill: #f8fafc; }
    .ternary-shape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ternary-shape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ternary-shape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ternary-shape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ternary-shape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ternary-shape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ternary-shape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ternary-shape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ternary-shape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ternary-shape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ternary-shape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ternary-shape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ternary-shape-row { opacity: 1; }
    .ternary-shape-r0 { animation-delay: 0.00s; }
    .ternary-shape-r1 { animation-delay: 0.45s; }
    .ternary-shape-r2 { animation-delay: 0.90s; }
    .ternary-shape-r3 { animation-delay: 1.35s; }
    .ternary-shape-r4 { animation-delay: 1.80s; }
    .ternary-shape-row { animation: ternary-shape-reveal 7.3s ease-in-out infinite; }
    @keyframes ternary-shape-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ternary-shape-bg" width="980" height="390"/>
  <text class="ternary-shape-h1"  x="30" y="40">When a conditional should be an expression</text>
  <text class="ternary-shape-sub" x="30" y="64">One name, two possible values.</text>
  <rect class="ternary-shape-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ternary-shape-name" x="46" y="122">An if statement</text>
  <text class="ternary-shape-desc" x="46" y="142">Four lines to set one name.</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r0" x="46" y="182">Assign in each branch</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r1" x="46" y="216">Fine, and slightly noisy</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r2" x="46" y="250">Necessary when a branch does more</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r3" x="46" y="284">Necessary when there are three cases</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r4" x="46" y="318">The safe default</text>
  <rect class="ternary-shape-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ternary-shape-name" x="526" y="122">A conditional expression</text>
  <text class="ternary-shape-desc" x="526" y="142">One line, value first.</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r0" x="526" y="182">label = "empty" if not rows else summary</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r1" x="526" y="216">The common value reads first</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r2" x="526" y="250">Only when BOTH branches are just values</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r3" x="526" y="284">Never nested — two levels is worse than an if</text>
  <text class="ternary-shape-desc ternary-shape-row ternary-shape-r4" x="526" y="318">Reads badly the moment it wraps</text>
  <text class="ternary-shape-sub" x="30" y="372">The word order is unusual on purpose: the value you expect most often comes first, so the line reads as a statement about the normal case with the exception attached.</text>
</svg>
