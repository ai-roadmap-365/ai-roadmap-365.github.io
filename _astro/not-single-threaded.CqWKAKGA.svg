<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two habits from prototyping.">
  <title>What serving infrastructure replaces</title>
  <style>
    .not-single-threaded-bg   { fill: #f8fafc; }
    .not-single-threaded-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-single-threaded-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-single-threaded-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-single-threaded-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-single-threaded-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-single-threaded-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-single-threaded-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-single-threaded-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-single-threaded-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-single-threaded-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-single-threaded-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-single-threaded-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-single-threaded-row { opacity: 1; }
    .not-single-threaded-r0 { animation-delay: 0.00s; }
    .not-single-threaded-r1 { animation-delay: 0.45s; }
    .not-single-threaded-r2 { animation-delay: 0.90s; }
    .not-single-threaded-r3 { animation-delay: 1.35s; }
    .not-single-threaded-r4 { animation-delay: 1.80s; }
    .not-single-threaded-row { animation: not-single-threaded-reveal 7.3s ease-in-out infinite; }
    @keyframes not-single-threaded-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-single-threaded-bg" width="980" height="390"/>
  <text class="not-single-threaded-h1"  x="30" y="40">What serving infrastructure replaces</text>
  <text class="not-single-threaded-sub" x="30" y="64">Two habits from prototyping.</text>
  <rect class="not-single-threaded-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-single-threaded-name" x="46" y="122">Serving infrastructure</text>
  <text class="not-single-threaded-desc" x="46" y="142">Four mechanisms.</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r0" x="46" y="182">NVLink fabrics for tensor parallelism</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r1" x="46" y="216">Requests packed into unified batch tensors</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r2" x="46" y="250">Ensembles chained in shared GPU memory</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r3" x="46" y="284">Copies overlapped with compute via CUDA streams</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r4" x="46" y="318">Pinned memory for asynchronous DMA</text>
  <rect class="not-single-threaded-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-single-threaded-name" x="526" y="122">Prototyping habits</text>
  <text class="not-single-threaded-desc" x="526" y="142">Two, both costly.</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r0" x="526" y="182">One prompt at a time, single-threaded</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r1" x="526" y="216">85% of matrix capacity lost to launch overhead</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r2" x="526" y="250">Float tensors over HTTP between stages</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r3" x="526" y="284">50 ms of serialisation per hop</text>
  <text class="not-single-threaded-desc not-single-threaded-row not-single-threaded-r4" x="526" y="318">Correct, and an order of magnitude off</text>
  <text class="not-single-threaded-sub" x="30" y="372">The ensemble row saves 50 ms of network serialisation by keeping three stages in shared GPU memory, which is a larger saving than most model-level optimisations and requires no change to any model.</text>
</svg>
