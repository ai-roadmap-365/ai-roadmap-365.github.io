<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Reordering usually beats making any one stage faster.">
  <title>Why stage order is the main optimisation</title>
  <style>
    .cheap-first-bg   { fill: #f8fafc; }
    .cheap-first-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cheap-first-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cheap-first-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cheap-first-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cheap-first-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cheap-first-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cheap-first-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cheap-first-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cheap-first-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cheap-first-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cheap-first-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cheap-first-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cheap-first-row { opacity: 1; }
    .cheap-first-r0 { animation-delay: 0.00s; }
    .cheap-first-r1 { animation-delay: 0.45s; }
    .cheap-first-r2 { animation-delay: 0.90s; }
    .cheap-first-r3 { animation-delay: 1.35s; }
    .cheap-first-r4 { animation-delay: 1.80s; }
    .cheap-first-row { animation: cheap-first-reveal 7.3s ease-in-out infinite; }
    @keyframes cheap-first-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cheap-first-bg" width="980" height="390"/>
  <text class="cheap-first-h1"  x="30" y="40">Why stage order is the main optimisation</text>
  <text class="cheap-first-sub" x="30" y="64">Reordering usually beats making any one stage faster.</text>
  <rect class="cheap-first-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cheap-first-name" x="46" y="122">Expensive first</text>
  <text class="cheap-first-desc" x="46" y="142">Build, test, lint.</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r0" x="46" y="182">A typo costs a full build</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r1" x="46" y="216">Then a full test run</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r2" x="46" y="250">Then the lint catches it</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r3" x="46" y="284">Ten minutes to learn about one character</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r4" x="46" y="318">And that happens all day</text>
  <rect class="cheap-first-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cheap-first-name" x="526" y="122">Cheapest first</text>
  <text class="cheap-first-desc" x="526" y="142">Lint, test, build, deploy.</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r0" x="526" y="182">Lint runs in a second</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r1" x="526" y="216">Most failures stop there</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r2" x="526" y="250">Tests only run on plausible code</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r3" x="526" y="284">Builds only on tested code</text>
  <text class="cheap-first-desc cheap-first-row cheap-first-r4" x="526" y="318">Deploy touches the real world last</text>
  <text class="cheap-first-sub" x="30" y="372">The ordering is not about the total time of a successful run, which is the same either way. It is about the time to discover a failure, and most runs that fail, fail early.</text>
</svg>
