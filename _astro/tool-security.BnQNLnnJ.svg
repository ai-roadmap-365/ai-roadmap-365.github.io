<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four controls, in order of value.">
  <title>Securing tool access</title>
  <style>
    .tool-security-bg   { fill: #f8fafc; }
    .tool-security-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-security-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-security-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-security-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-security-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-security-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-security-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-security-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-security-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-security-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-security-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-security-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tool-security-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tool-security-stage { opacity: 1; }

    .tool-security-s0 { animation-delay: 0.00s; }
    .tool-security-e0 { animation-delay: 0.00s; }
    .tool-security-s1 { animation-delay: 1.28s; }
    .tool-security-e1 { animation-delay: 1.28s; }
    .tool-security-s2 { animation-delay: 2.56s; }
    .tool-security-e2 { animation-delay: 2.56s; }
    .tool-security-s3 { animation-delay: 3.84s; }
    .tool-security-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tool-security-conn  { animation: tool-security-trace 6.4s ease-in-out infinite; }
      .tool-security-stage { animation: tool-security-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tool-security-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tool-security-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tool-security-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tool-security-stage { animation: tool-security-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tool-security-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tool-security-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tool-security-bg" width="980" height="322"/>
  <text class="tool-security-h1"  x="30" y="40">Securing tool access</text>
  <text class="tool-security-sub" x="30" y="64">Four controls, in order of value.</text>
  <g class="tool-security-stage tool-security-s0">
    <rect class="tool-security-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tool-security-step" x="44" y="142">01</text>
    <text class="tool-security-name" x="70" y="142">Least privilege on every tool</text>
    <text class="tool-security-desc" x="44" y="166">Read-only where possible. Scoped</text>
    <text class="tool-security-desc" x="44" y="182">credentials always.</text>
  </g>
  <line class="tool-security-line tool-security-conn tool-security-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tool-security-tip)"/>
  <g class="tool-security-stage tool-security-s1">
    <rect class="tool-security-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tool-security-step" x="280" y="142">02</text>
    <text class="tool-security-name" x="306" y="142">Validate arguments in code</text>
    <text class="tool-security-desc" x="280" y="166">Never pass a model-supplied</text>
    <text class="tool-security-desc" x="280" y="182">string to a shell or a query.</text>
  </g>
  <line class="tool-security-line tool-security-conn tool-security-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tool-security-tip)"/>
  <g class="tool-security-stage tool-security-s2">
    <rect class="tool-security-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tool-security-step" x="516" y="142">03</text>
    <text class="tool-security-name" x="542" y="142">Require approval for irreversible actions</text>
    <text class="tool-security-desc" x="516" y="166">Deleting, sending, paying,</text>
    <text class="tool-security-desc" x="516" y="182">deploying.</text>
  </g>
  <line class="tool-security-line tool-security-conn tool-security-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tool-security-tip)"/>
  <g class="tool-security-stage tool-security-s3">
    <rect class="tool-security-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tool-security-step" x="752" y="142">04</text>
    <text class="tool-security-name" x="778" y="142">And log every call with what triggered it</text>
    <text class="tool-security-desc" x="752" y="166">So an incident can be</text>
    <text class="tool-security-desc" x="752" y="182">reconstructed.</text>
  </g>
  <text class="tool-security-sub" x="30" y="304">Tool output is untrusted input on the way back as well: a document fetched by a tool can carry an injection, which is how a read-only tool becomes part of an attack.</text>
</svg>
