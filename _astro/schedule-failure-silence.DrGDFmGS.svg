<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not with a crash. With nothing at all.">
  <title>How a scheduled job fails</title>
  <style>
    .schedule-failure-silence-bg   { fill: #f8fafc; }
    .schedule-failure-silence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-failure-silence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-failure-silence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-failure-silence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-failure-silence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-failure-silence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-failure-silence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedule-failure-silence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedule-failure-silence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedule-failure-silence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedule-failure-silence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedule-failure-silence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schedule-failure-silence-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schedule-failure-silence-stage { opacity: 1; }

    .schedule-failure-silence-s0 { animation-delay: 0.00s; }
    .schedule-failure-silence-e0 { animation-delay: 0.00s; }
    .schedule-failure-silence-s1 { animation-delay: 1.28s; }
    .schedule-failure-silence-e1 { animation-delay: 1.28s; }
    .schedule-failure-silence-s2 { animation-delay: 2.56s; }
    .schedule-failure-silence-e2 { animation-delay: 2.56s; }
    .schedule-failure-silence-s3 { animation-delay: 3.84s; }
    .schedule-failure-silence-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .schedule-failure-silence-conn  { animation: schedule-failure-silence-trace 6.4s ease-in-out infinite; }
      .schedule-failure-silence-stage { animation: schedule-failure-silence-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes schedule-failure-silence-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schedule-failure-silence-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schedule-failure-silence-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schedule-failure-silence-stage { animation: schedule-failure-silence-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schedule-failure-silence-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schedule-failure-silence-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schedule-failure-silence-bg" width="980" height="322"/>
  <text class="schedule-failure-silence-h1"  x="30" y="40">How a scheduled job fails</text>
  <text class="schedule-failure-silence-sub" x="30" y="64">Not with a crash. With nothing at all.</text>
  <g class="schedule-failure-silence-stage schedule-failure-silence-s0">
    <rect class="schedule-failure-silence-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-failure-silence-step" x="44" y="142">01</text>
    <text class="schedule-failure-silence-name" x="70" y="142">Something changes</text>
    <text class="schedule-failure-silence-desc" x="44" y="166">A path moves, a credential</text>
    <text class="schedule-failure-silence-desc" x="44" y="182">expires, a disk fills.</text>
  </g>
  <line class="schedule-failure-silence-line schedule-failure-silence-conn schedule-failure-silence-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#schedule-failure-silence-tip)"/>
  <g class="schedule-failure-silence-stage schedule-failure-silence-s1">
    <rect class="schedule-failure-silence-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-failure-silence-step" x="280" y="142">02</text>
    <text class="schedule-failure-silence-name" x="306" y="142">The job fails</text>
    <text class="schedule-failure-silence-desc" x="280" y="166">Exit code non-zero. Nothing is</text>
    <text class="schedule-failure-silence-desc" x="280" y="182">watching it.</text>
  </g>
  <line class="schedule-failure-silence-line schedule-failure-silence-conn schedule-failure-silence-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#schedule-failure-silence-tip)"/>
  <g class="schedule-failure-silence-stage schedule-failure-silence-s2">
    <rect class="schedule-failure-silence-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-failure-silence-step" x="516" y="142">03</text>
    <text class="schedule-failure-silence-name" x="542" y="142">Nobody is told</text>
    <text class="schedule-failure-silence-desc" x="516" y="166">No screen, no alert. The output</text>
    <text class="schedule-failure-silence-desc" x="516" y="182">went nowhere.</text>
    <text class="schedule-failure-silence-edge" x="516" y="242">silence</text>
  </g>
  <line class="schedule-failure-silence-line schedule-failure-silence-conn schedule-failure-silence-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#schedule-failure-silence-tip)"/>
  <g class="schedule-failure-silence-stage schedule-failure-silence-s3">
    <rect class="schedule-failure-silence-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-failure-silence-step" x="752" y="142">04</text>
    <text class="schedule-failure-silence-name" x="778" y="142">Discovered much later</text>
    <text class="schedule-failure-silence-desc" x="752" y="166">By the missing data downstream,</text>
    <text class="schedule-failure-silence-desc" x="752" y="182">weeks after the fact.</text>
    <text class="schedule-failure-silence-edge" x="752" y="242">weeks</text>
  </g>
  <text class="schedule-failure-silence-sub" x="30" y="304">This is why logging and a meaningful exit code are not polish. They are the only difference between automation and a machine quietly doing nothing.</text>
</svg>
