<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is what arrived. The other is what exists now.">
  <title>The source and the page are different things</title>
  <style>
    .source-versus-dom-bg   { fill: #f8fafc; }
    .source-versus-dom-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .source-versus-dom-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .source-versus-dom-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .source-versus-dom-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .source-versus-dom-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .source-versus-dom-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .source-versus-dom-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .source-versus-dom-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .source-versus-dom-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .source-versus-dom-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .source-versus-dom-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .source-versus-dom-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .source-versus-dom-row { opacity: 1; }
    .source-versus-dom-r0 { animation-delay: 0.00s; }
    .source-versus-dom-r1 { animation-delay: 0.45s; }
    .source-versus-dom-r2 { animation-delay: 0.90s; }
    .source-versus-dom-r3 { animation-delay: 1.35s; }
    .source-versus-dom-r4 { animation-delay: 1.80s; }
    .source-versus-dom-row { animation: source-versus-dom-reveal 7.3s ease-in-out infinite; }
    @keyframes source-versus-dom-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="source-versus-dom-bg" width="980" height="390"/>
  <text class="source-versus-dom-h1"  x="30" y="40">The source and the page are different things</text>
  <text class="source-versus-dom-sub" x="30" y="64">One is what arrived. The other is what exists now.</text>
  <rect class="source-versus-dom-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="source-versus-dom-name" x="46" y="122">View source</text>
  <text class="source-versus-dom-desc" x="46" y="142">The bytes the server sent.</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r0" x="46" y="182">Exactly what arrived over the wire</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r1" x="46" y="216">Never changes after it loads</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r2" x="46" y="250">What curl and requests receive</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r3" x="46" y="284">May be an almost empty shell</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r4" x="46" y="318">Frozen at the moment of delivery</text>
  <rect class="source-versus-dom-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="source-versus-dom-name" x="526" y="122">The DOM</text>
  <text class="source-versus-dom-desc" x="526" y="142">The tree as it is right now.</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r0" x="526" y="182">Built from the source, then modified</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r1" x="526" y="216">Changes every time a script runs</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r2" x="526" y="250">What the Elements panel shows</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r3" x="526" y="284">What the user actually sees</text>
  <text class="source-versus-dom-desc source-versus-dom-row source-versus-dom-r4" x="526" y="318">Live — edit it and the page changes</text>
  <text class="source-versus-dom-sub" x="30" y="372">This single distinction explains most scraping failures, most "the element is not there" bugs, and why Playwright exists alongside requests.</text>
</svg>
