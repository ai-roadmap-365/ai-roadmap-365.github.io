<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="git clean removes what git status calls untracked.">
  <title>The other command that destroys work</title>
  <style>
    .git-clean-bg   { fill: #f8fafc; }
    .git-clean-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .git-clean-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .git-clean-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .git-clean-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .git-clean-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .git-clean-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .git-clean-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .git-clean-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .git-clean-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .git-clean-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .git-clean-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .git-clean-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .git-clean-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .git-clean-stage { opacity: 1; }

    .git-clean-s0 { animation-delay: 0.00s; }
    .git-clean-e0 { animation-delay: 0.00s; }
    .git-clean-s1 { animation-delay: 1.28s; }
    .git-clean-e1 { animation-delay: 1.28s; }
    .git-clean-s2 { animation-delay: 2.56s; }
    .git-clean-e2 { animation-delay: 2.56s; }
    .git-clean-s3 { animation-delay: 3.84s; }
    .git-clean-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .git-clean-conn  { animation: git-clean-trace 6.4s ease-in-out infinite; }
      .git-clean-stage { animation: git-clean-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes git-clean-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes git-clean-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .git-clean-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .git-clean-stage { animation: git-clean-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes git-clean-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="git-clean-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="git-clean-bg" width="980" height="322"/>
  <text class="git-clean-h1"  x="30" y="40">The other command that destroys work</text>
  <text class="git-clean-sub" x="30" y="64">git clean removes what git status calls untracked.</text>
  <g class="git-clean-stage git-clean-s0">
    <rect class="git-clean-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="git-clean-step" x="44" y="142">01</text>
    <text class="git-clean-name" x="70" y="142">It removes UNTRACKED files</text>
    <text class="git-clean-desc" x="44" y="166">Not modified ones. Files git was</text>
    <text class="git-clean-desc" x="44" y="182">never recording at all.</text>
    <text class="git-clean-edge" x="44" y="242">untracked</text>
  </g>
  <line class="git-clean-line git-clean-conn git-clean-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#git-clean-tip)"/>
  <g class="git-clean-stage git-clean-s1">
    <rect class="git-clean-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="git-clean-step" x="280" y="142">02</text>
    <text class="git-clean-name" x="306" y="142">Always -n first</text>
    <text class="git-clean-desc" x="280" y="166">git clean -n lists what would</text>
    <text class="git-clean-desc" x="280" y="182">go. This is not optional.</text>
    <text class="git-clean-edge" x="280" y="242">dry run</text>
  </g>
  <line class="git-clean-line git-clean-conn git-clean-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#git-clean-tip)"/>
  <g class="git-clean-stage git-clean-s2">
    <rect class="git-clean-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="git-clean-step" x="516" y="142">03</text>
    <text class="git-clean-name" x="542" y="142">-d adds directories; -x adds ignored files</text>
    <text class="git-clean-desc" x="516" y="166">-dx will remove your .env and</text>
    <text class="git-clean-desc" x="516" y="182">your virtual environment.</text>
    <text class="git-clean-edge" x="516" y="242">-dx</text>
  </g>
  <line class="git-clean-line git-clean-conn git-clean-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#git-clean-tip)"/>
  <g class="git-clean-stage git-clean-s3">
    <rect class="git-clean-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="git-clean-step" x="752" y="142">04</text>
    <text class="git-clean-name" x="778" y="142">The reflog cannot help</text>
    <text class="git-clean-desc" x="752" y="166">These were never committed, so</text>
    <text class="git-clean-desc" x="752" y="182">nothing ever recorded them.</text>
  </g>
  <text class="git-clean-sub" x="30" y="304">This sits alongside reset --hard and restore &lt;file&gt; as the third genuinely irreversible command, and it is the one people meet by accident while trying to tidy a working directory.</text>
</svg>
