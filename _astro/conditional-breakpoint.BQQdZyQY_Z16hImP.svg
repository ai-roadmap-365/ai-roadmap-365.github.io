<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The technique that makes a debugger usable on real data.">
  <title>Stopping on the one iteration that matters</title>
  <style>
    .conditional-breakpoint-bg   { fill: #f8fafc; }
    .conditional-breakpoint-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conditional-breakpoint-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conditional-breakpoint-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conditional-breakpoint-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conditional-breakpoint-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conditional-breakpoint-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conditional-breakpoint-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conditional-breakpoint-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conditional-breakpoint-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conditional-breakpoint-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conditional-breakpoint-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conditional-breakpoint-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .conditional-breakpoint-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .conditional-breakpoint-stage { opacity: 1; }

    .conditional-breakpoint-s0 { animation-delay: 0.00s; }
    .conditional-breakpoint-e0 { animation-delay: 0.00s; }
    .conditional-breakpoint-s1 { animation-delay: 1.28s; }
    .conditional-breakpoint-e1 { animation-delay: 1.28s; }
    .conditional-breakpoint-s2 { animation-delay: 2.56s; }
    .conditional-breakpoint-e2 { animation-delay: 2.56s; }
    .conditional-breakpoint-s3 { animation-delay: 3.84s; }
    .conditional-breakpoint-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .conditional-breakpoint-conn  { animation: conditional-breakpoint-trace 6.4s ease-in-out infinite; }
      .conditional-breakpoint-stage { animation: conditional-breakpoint-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes conditional-breakpoint-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes conditional-breakpoint-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .conditional-breakpoint-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .conditional-breakpoint-stage { animation: conditional-breakpoint-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes conditional-breakpoint-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="conditional-breakpoint-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="conditional-breakpoint-bg" width="980" height="322"/>
  <text class="conditional-breakpoint-h1"  x="30" y="40">Stopping on the one iteration that matters</text>
  <text class="conditional-breakpoint-sub" x="30" y="64">The technique that makes a debugger usable on real data.</text>
  <g class="conditional-breakpoint-stage conditional-breakpoint-s0">
    <rect class="conditional-breakpoint-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="conditional-breakpoint-step" x="44" y="142">01</text>
    <text class="conditional-breakpoint-name" x="70" y="142">The loop runs 5,000 times</text>
    <text class="conditional-breakpoint-desc" x="44" y="166">And fails once. Stepping through</text>
    <text class="conditional-breakpoint-desc" x="44" y="182">is not an option.</text>
  </g>
  <line class="conditional-breakpoint-line conditional-breakpoint-conn conditional-breakpoint-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#conditional-breakpoint-tip)"/>
  <g class="conditional-breakpoint-stage conditional-breakpoint-s1">
    <rect class="conditional-breakpoint-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="conditional-breakpoint-step" x="280" y="142">02</text>
    <text class="conditional-breakpoint-name" x="306" y="142">Add a condition to the breakpoint</text>
    <text class="conditional-breakpoint-desc" x="280" y="166">Stop only when row['amount'] is</text>
    <text class="conditional-breakpoint-desc" x="280" y="182">None, or when i == 4732.</text>
    <text class="conditional-breakpoint-edge" x="280" y="242">condition</text>
  </g>
  <line class="conditional-breakpoint-line conditional-breakpoint-conn conditional-breakpoint-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#conditional-breakpoint-tip)"/>
  <g class="conditional-breakpoint-stage conditional-breakpoint-s2">
    <rect class="conditional-breakpoint-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="conditional-breakpoint-step" x="516" y="142">03</text>
    <text class="conditional-breakpoint-name" x="542" y="142">Run normally</text>
    <text class="conditional-breakpoint-desc" x="516" y="166">It executes at full speed until</text>
    <text class="conditional-breakpoint-desc" x="516" y="182">the condition holds.</text>
    <text class="conditional-breakpoint-edge" x="516" y="242">full speed</text>
  </g>
  <line class="conditional-breakpoint-line conditional-breakpoint-conn conditional-breakpoint-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#conditional-breakpoint-tip)"/>
  <g class="conditional-breakpoint-stage conditional-breakpoint-s3">
    <rect class="conditional-breakpoint-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="conditional-breakpoint-step" x="752" y="142">04</text>
    <text class="conditional-breakpoint-name" x="778" y="142">Now inspect</text>
    <text class="conditional-breakpoint-desc" x="752" y="166">Every variable, at exactly the</text>
    <text class="conditional-breakpoint-desc" x="752" y="182">moment it went wrong.</text>
  </g>
  <text class="conditional-breakpoint-sub" x="30" y="304">Without conditions, a debugger is only practical on small inputs. With them, it works on the same data that produced the bug — which is usually the only data that reproduces it.</text>
</svg>
