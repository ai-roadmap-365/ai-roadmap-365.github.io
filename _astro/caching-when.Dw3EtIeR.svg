<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it is dangerous.">
  <title>Where caching pays</title>
  <style>
    .caching-when-bg   { fill: #f8fafc; }
    .caching-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .caching-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .caching-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .caching-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .caching-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .caching-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .caching-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .caching-when-row { opacity: 1; }
    .caching-when-r0 { animation-delay: 0.00s; }
    .caching-when-r1 { animation-delay: 0.45s; }
    .caching-when-r2 { animation-delay: 0.90s; }
    .caching-when-r3 { animation-delay: 1.35s; }
    .caching-when-r4 { animation-delay: 1.80s; }
    .caching-when-row { animation: caching-when-reveal 7.3s ease-in-out infinite; }
    @keyframes caching-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="caching-when-bg" width="980" height="390"/>
  <text class="caching-when-h1"  x="30" y="40">Where caching pays</text>
  <text class="caching-when-sub" x="30" y="64">And where it is dangerous.</text>
  <rect class="caching-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="caching-when-name" x="46" y="122">Cache it</text>
  <text class="caching-when-desc" x="46" y="142">Repetitive, with a big prefix.</text>
  <text class="caching-when-desc caching-when-row caching-when-r0" x="46" y="182">High-volume support and documentation bots</text>
  <text class="caching-when-desc caching-when-row caching-when-r1" x="46" y="216">Large static system prompts</text>
  <text class="caching-when-desc caching-when-row caching-when-r2" x="46" y="250">Long documents queried repeatedly</text>
  <text class="caching-when-desc caching-when-row caching-when-r3" x="46" y="284">30-50% of queries are paraphrases</text>
  <text class="caching-when-desc caching-when-row caching-when-r4" x="46" y="318">Cost and latency both improve</text>
  <rect class="caching-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="caching-when-name" x="526" y="122">Do not cache semantically</text>
  <text class="caching-when-desc" x="526" y="142">Dynamic or personal.</text>
  <text class="caching-when-desc caching-when-row caching-when-r0" x="526" y="182">Real-time prices or state</text>
  <text class="caching-when-desc caching-when-row caching-when-r1" x="526" y="216">Anything personalised per user</text>
  <text class="caching-when-desc caching-when-row caching-when-r2" x="526" y="250">Anything with a private identifier</text>
  <text class="caching-when-desc caching-when-row caching-when-r3" x="526" y="284">A near-match is a wrong answer</text>
  <text class="caching-when-desc caching-when-row caching-when-r4" x="526" y="318">Exact caching may still be safe</text>
  <text class="caching-when-sub" x="30" y="372">The distinction between the two cache tiers matters here: exact hashing on a personalised query is merely useless, and semantic matching on one is actively wrong.</text>
</svg>
