<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the one thing to do regardless.">
  <title>Where the full stack is required</title>
  <style>
    .privacy-when-bg   { fill: #f8fafc; }
    .privacy-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .privacy-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .privacy-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .privacy-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .privacy-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .privacy-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-when-row { opacity: 1; }
    .privacy-when-r0 { animation-delay: 0.00s; }
    .privacy-when-r1 { animation-delay: 0.45s; }
    .privacy-when-r2 { animation-delay: 0.90s; }
    .privacy-when-r3 { animation-delay: 1.35s; }
    .privacy-when-r4 { animation-delay: 1.80s; }
    .privacy-when-row { animation: privacy-when-reveal 7.3s ease-in-out infinite; }
    @keyframes privacy-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="privacy-when-bg" width="980" height="390"/>
  <text class="privacy-when-h1"  x="30" y="40">Where the full stack is required</text>
  <text class="privacy-when-sub" x="30" y="64">And the one thing to do regardless.</text>
  <rect class="privacy-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="privacy-when-name" x="46" y="122">Full controls</text>
  <text class="privacy-when-desc" x="46" y="142">Regulated or user-generated.</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r0" x="46" y="182">Healthcare, banking, fintech, HR</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r1" x="46" y="216">Support tickets and conversational chats</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r2" x="46" y="250">Datasets crossing tenant boundaries</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r3" x="46" y="284">Anything a subject could request erasure of</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r4" x="46" y="318">Anything a regulator could ask about</text>
  <rect class="privacy-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="privacy-when-name" x="526" y="122">Lighter handling</text>
  <text class="privacy-when-desc" x="526" y="142">No real people in it.</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r0" x="526" y="182">Synthetic benchmarking datasets</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r1" x="526" y="216">Zero real human data</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r2" x="526" y="250">No vault, no epsilon budget</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r3" x="526" y="284">But de-identify before embedding anyway</text>
  <text class="privacy-when-desc privacy-when-row privacy-when-r4" x="526" y="318">A vector index is hard to erase from</text>
  <text class="privacy-when-sub" x="30" y="372">The caveat on the right is the one that catches teams out: embeddings are derived personal data, and an index built from unredacted text is far harder to remove a person from than a table is.</text>
</svg>
