<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five stages, three modalities.">
  <title>The multimodal pipeline</title>
  <style>
    .multimodal-idea-bg   { fill: #f8fafc; }
    .multimodal-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multimodal-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multimodal-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multimodal-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multimodal-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multimodal-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multimodal-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multimodal-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multimodal-idea-stage { opacity: 1; }

    .multimodal-idea-s0 { animation-delay: 0.00s; }
    .multimodal-idea-e0 { animation-delay: 0.00s; }
    .multimodal-idea-s1 { animation-delay: 1.33s; }
    .multimodal-idea-e1 { animation-delay: 1.33s; }
    .multimodal-idea-s2 { animation-delay: 2.67s; }
    .multimodal-idea-e2 { animation-delay: 2.67s; }
    .multimodal-idea-s3 { animation-delay: 4.00s; }
    .multimodal-idea-e3 { animation-delay: 4.00s; }
    .multimodal-idea-s4 { animation-delay: 5.33s; }
    .multimodal-idea-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .multimodal-idea-conn  { animation: multimodal-idea-trace 8s ease-in-out infinite; }
      .multimodal-idea-stage { animation: multimodal-idea-arrive 8s ease-in-out infinite; }
    }
    @keyframes multimodal-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multimodal-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multimodal-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multimodal-idea-stage { animation: multimodal-idea-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multimodal-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multimodal-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multimodal-idea-bg" width="980" height="322"/>
  <text class="multimodal-idea-h1"  x="30" y="40">The multimodal pipeline</text>
  <text class="multimodal-idea-sub" x="30" y="64">Five stages, three modalities.</text>
  <g class="multimodal-idea-stage multimodal-idea-s0">
    <rect class="multimodal-idea-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="multimodal-idea-step" x="44" y="142">01</text>
    <text class="multimodal-idea-name" x="70" y="142">Ingest whatever arrives</text>
    <text class="multimodal-idea-desc" x="44" y="166">Audio, images, documents,</text>
    <text class="multimodal-idea-desc" x="44" y="182">text. Each detected, not</text>
    <text class="multimodal-idea-desc" x="44" y="198">assumed.</text>
  </g>
  <line class="multimodal-idea-line multimodal-idea-conn multimodal-idea-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#multimodal-idea-tip)"/>
  <g class="multimodal-idea-stage multimodal-idea-s1">
    <rect class="multimodal-idea-good" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="multimodal-idea-step" x="233" y="142">02</text>
    <text class="multimodal-idea-name" x="259" y="142">Process each in its own modality</text>
    <text class="multimodal-idea-desc" x="233" y="166">Transcription, vision,</text>
    <text class="multimodal-idea-desc" x="233" y="182">extraction.</text>
  </g>
  <line class="multimodal-idea-line multimodal-idea-conn multimodal-idea-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#multimodal-idea-tip)"/>
  <g class="multimodal-idea-stage multimodal-idea-s2">
    <rect class="multimodal-idea-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="multimodal-idea-step" x="422" y="142">03</text>
    <text class="multimodal-idea-name" x="448" y="142">Fuse into one representation</text>
    <text class="multimodal-idea-desc" x="422" y="166">Which is where the seams</text>
    <text class="multimodal-idea-desc" x="422" y="182">are.</text>
  </g>
  <line class="multimodal-idea-line multimodal-idea-conn multimodal-idea-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#multimodal-idea-tip)"/>
  <g class="multimodal-idea-stage multimodal-idea-s3">
    <rect class="multimodal-idea-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="multimodal-idea-step" x="611" y="142">04</text>
    <text class="multimodal-idea-name" x="637" y="142">Generate the response</text>
    <text class="multimodal-idea-desc" x="611" y="166">Grounded in what every</text>
    <text class="multimodal-idea-desc" x="611" y="182">stage produced.</text>
  </g>
  <line class="multimodal-idea-line multimodal-idea-conn multimodal-idea-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#multimodal-idea-tip)"/>
  <g class="multimodal-idea-stage multimodal-idea-s4">
    <rect class="multimodal-idea-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="multimodal-idea-step" x="800" y="142">05</text>
    <text class="multimodal-idea-name" x="826" y="142">And attach provenance throughout</text>
    <text class="multimodal-idea-desc" x="800" y="166">Or it is lost at the</text>
    <text class="multimodal-idea-desc" x="800" y="182">first transformation.</text>
  </g>
  <text class="multimodal-idea-sub" x="30" y="304">The fusion stage is where these systems actually fail: each modality works in isolation, and reconciling their outputs is the part nobody budgets for.</text>
</svg>
