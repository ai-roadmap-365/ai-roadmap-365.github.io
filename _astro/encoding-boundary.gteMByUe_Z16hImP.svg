<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The one place you must choose an encoding.">
  <title>Where text becomes bytes</title>
  <style>
    .encoding-boundary-bg   { fill: #f8fafc; }
    .encoding-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoding-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoding-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoding-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoding-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoding-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoding-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .encoding-boundary-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .encoding-boundary-stage { opacity: 1; }

    .encoding-boundary-s0 { animation-delay: 0.00s; }
    .encoding-boundary-e0 { animation-delay: 0.00s; }
    .encoding-boundary-s1 { animation-delay: 1.28s; }
    .encoding-boundary-e1 { animation-delay: 1.28s; }
    .encoding-boundary-s2 { animation-delay: 2.56s; }
    .encoding-boundary-e2 { animation-delay: 2.56s; }
    .encoding-boundary-s3 { animation-delay: 3.84s; }
    .encoding-boundary-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .encoding-boundary-conn  { animation: encoding-boundary-trace 6.4s ease-in-out infinite; }
      .encoding-boundary-stage { animation: encoding-boundary-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes encoding-boundary-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes encoding-boundary-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .encoding-boundary-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .encoding-boundary-stage { animation: encoding-boundary-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes encoding-boundary-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="encoding-boundary-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="encoding-boundary-bg" width="980" height="322"/>
  <text class="encoding-boundary-h1"  x="30" y="40">Where text becomes bytes</text>
  <text class="encoding-boundary-sub" x="30" y="64">The one place you must choose an encoding.</text>
  <g class="encoding-boundary-stage encoding-boundary-s0">
    <rect class="encoding-boundary-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-boundary-step" x="44" y="142">01</text>
    <text class="encoding-boundary-name" x="70" y="142">str in memory</text>
    <text class="encoding-boundary-desc" x="44" y="166">Abstract characters. No encoding</text>
    <text class="encoding-boundary-desc" x="44" y="182">involved yet.</text>
  </g>
  <line class="encoding-boundary-line encoding-boundary-conn encoding-boundary-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#encoding-boundary-tip)"/>
  <g class="encoding-boundary-stage encoding-boundary-s1">
    <rect class="encoding-boundary-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-boundary-step" x="280" y="142">02</text>
    <text class="encoding-boundary-name" x="306" y="142">.encode("utf-8")</text>
    <text class="encoding-boundary-desc" x="280" y="166">Now bytes. This is the moment</text>
    <text class="encoding-boundary-desc" x="280" y="182">the encoding is chosen.</text>
    <text class="encoding-boundary-edge" x="280" y="242">to bytes</text>
  </g>
  <line class="encoding-boundary-line encoding-boundary-conn encoding-boundary-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#encoding-boundary-tip)"/>
  <g class="encoding-boundary-stage encoding-boundary-s2">
    <rect class="encoding-boundary-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-boundary-step" x="516" y="142">03</text>
    <text class="encoding-boundary-name" x="542" y="142">Written, sent, stored</text>
    <text class="encoding-boundary-desc" x="516" y="166">Files and sockets carry bytes</text>
    <text class="encoding-boundary-desc" x="516" y="182">and nothing else.</text>
  </g>
  <line class="encoding-boundary-line encoding-boundary-conn encoding-boundary-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#encoding-boundary-tip)"/>
  <g class="encoding-boundary-stage encoding-boundary-s3">
    <rect class="encoding-boundary-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-boundary-step" x="752" y="142">04</text>
    <text class="encoding-boundary-name" x="778" y="142">.decode(...)</text>
    <text class="encoding-boundary-desc" x="752" y="166">Wrong encoding here gives</text>
    <text class="encoding-boundary-desc" x="752" y="182">mojibake, not an error.</text>
    <text class="encoding-boundary-edge" x="752" y="242">silent</text>
  </g>
  <text class="encoding-boundary-sub" x="30" y="304">UTF-8 is the default and the right answer. The failure is silent because the bytes are valid under the wrong encoding too — which is exactly why it goes unnoticed until the data is old.</text>
</svg>
