<svg role="img" aria-label="Experiment Tracking system architecture diagram showing training loop telemetry artifact registry and dashboard comparison" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>MLOps Experiment Tracking Architecture</title>
  <defs>
    <linearGradient id="bg235a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card235" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg235a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MLOPS EXPERIMENT TRACKING ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Reproducibility: Lineage, Code Git SHA, Hyperparameters, Metrics &amp; Artifact Storage</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card235)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Training Runtime Inputs -->
    <rect x="25" y="25" width="200" height="255" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="125" y="50" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Reproducibility Context</text>
    <rect x="40" y="65" width="170" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="125" y="88" fill="#cbd5e1" font-size="9" text-anchor="middle">Git Commit SHA &amp; Diff</text>
    <rect x="40" y="115" width="170" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="125" y="138" fill="#cbd5e1" font-size="9" text-anchor="middle">Data Version / Hash (DVC)</text>
    <rect x="40" y="165" width="170" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="125" y="188" fill="#cbd5e1" font-size="9" text-anchor="middle">Hyperparams &amp; Seeds</text>
    <rect x="40" y="215" width="170" height="50" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="125" y="235" fill="#cbd5e1" font-size="8" text-anchor="middle">Environment &amp; Hardware</text>
    <text x="125" y="252" fill="#94a3b8" font-size="7" text-anchor="middle">PyTorch 2.4, CUDA 12.4</text>

    <!-- Center: Training Loop Logger -->
    <rect x="255" y="25" width="240" height="255" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="375" y="50" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Training Telemetry Stream</text>
    
    <rect x="270" y="65" width="210" height="60" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="375" y="85" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Step &amp; Epoch Metrics</text>
    <text x="375" y="103" fill="#cbd5e1" font-size="8" text-anchor="middle">• Train Loss &amp; Val Loss</text>
    <text x="375" y="117" fill="#cbd5e1" font-size="8" text-anchor="middle">• Accuracy, F1, Perplexity</text>

    <rect x="270" y="135" width="210" height="60" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="375" y="155" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">System &amp; Hardware Telemetry</text>
    <text x="375" y="173" fill="#cbd5e1" font-size="8" text-anchor="middle">• GPU Power (Watts) &amp; Temp</text>
    <text x="375" y="187" fill="#cbd5e1" font-size="8" text-anchor="middle">• VRAM Allocated (GB) &amp; MFU %</text>

    <rect x="270" y="205" width="210" height="60" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="375" y="225" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Weight &amp; Grad Histograms</text>
    <text x="375" y="243" fill="#cbd5e1" font-size="8" text-anchor="middle">• Gradient Norms &amp; Outliers</text>
    <text x="375" y="257" fill="#cbd5e1" font-size="8" text-anchor="middle">• Learning Rate Schedule</text>

    <!-- Right: Central Experiment Registry & Artifact Store -->
    <rect x="525" y="25" width="210" height="255" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="630" y="50" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Registry &amp; Visualizer</text>
    
    <rect x="540" y="65" width="180" height="60" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="630" y="85" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Interactive Dashboards</text>
    <text x="630" y="103" fill="#cbd5e1" font-size="8" text-anchor="middle">W&amp;B / MLflow / TensorBoard</text>
    <text x="630" y="117" fill="#94a3b8" font-size="8" text-anchor="middle">Multi-Run Comparisons</text>

    <rect x="540" y="135" width="180" height="60" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="630" y="155" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Model Artifact Registry</text>
    <text x="630" y="173" fill="#cbd5e1" font-size="8" text-anchor="middle">Versioned Model Checkpoints</text>
    <text x="630" y="187" fill="#94a3b8" font-size="8" text-anchor="middle">ONNX / PyTorch SafeTensors</text>

    <rect x="540" y="205" width="180" height="60" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="630" y="225" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Hyperparameter Sweeps</text>
    <text x="630" y="243" fill="#cbd5e1" font-size="8" text-anchor="middle">Bayesian Optimization</text>
    <text x="630" y="257" fill="#94a3b8" font-size="8" text-anchor="middle">Hyperband Early Stopping</text>
  </g>
</svg>
