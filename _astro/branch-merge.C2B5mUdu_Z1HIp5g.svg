<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" font-family="system-ui, sans-serif">
  <title>A feature branch diverging from main and merging back at a merge commit</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Branching and merging: one feature branch</text>

  <!-- main line label -->
  <text x="40" y="175" text-anchor="start" font-size="15" font-weight="bold" fill="#1a202c">main</text>
  <text x="40" y="300" text-anchor="start" font-size="15" font-weight="bold" fill="#1d4ed8">feature</text>

  <!-- main branch commit path -->
  <line x1="120" y1="170" x2="660" y2="170" stroke="#1a202c" stroke-width="3"/>
  <!-- feature branch path: diverges from C2, runs lower, merges into M -->
  <line x1="250" y1="170" x2="330" y2="290" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="330" y1="290" x2="520" y2="290" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="520" y1="290" x2="600" y2="170" stroke="#1d4ed8" stroke-width="3"/>

  <!-- main commits -->
  <circle cx="140" cy="170" r="16" fill="#dbeafe" stroke="#1a202c" stroke-width="2"/>
  <text x="140" y="175" text-anchor="middle" font-size="14" fill="#1a202c">C1</text>
  <circle cx="250" cy="170" r="16" fill="#dbeafe" stroke="#1a202c" stroke-width="2"/>
  <text x="250" y="175" text-anchor="middle" font-size="14" fill="#1a202c">C2</text>
  <circle cx="420" cy="170" r="16" fill="#dbeafe" stroke="#1a202c" stroke-width="2"/>
  <text x="420" y="175" text-anchor="middle" font-size="14" fill="#1a202c">C3</text>

  <!-- feature commits -->
  <circle cx="360" cy="290" r="16" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="295" text-anchor="middle" font-size="14" fill="#1a202c">F1</text>
  <circle cx="490" cy="290" r="16" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="490" y="295" text-anchor="middle" font-size="14" fill="#1a202c">F2</text>

  <!-- merge commit -->
  <circle cx="600" cy="170" r="20" fill="#1d4ed8" stroke="#1a202c" stroke-width="2"/>
  <text x="600" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">M</text>

  <!-- annotations -->
  <text x="250" y="140" text-anchor="middle" font-size="13" fill="#1d4ed8">branch off here</text>
  <line x1="250" y1="148" x2="250" y2="156" stroke="#1d4ed8" stroke-width="2"/>

  <text x="600" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">merge commit</text>
  <text x="600" y="148" text-anchor="middle" font-size="13" fill="#1a202c">(two parents: C3 and F2)</text>

  <text x="425" y="330" text-anchor="middle" font-size="13" fill="#1d4ed8">work happens in isolation on the branch</text>

  <!-- HEAD / branch pointer note -->
  <rect x="120" y="360" width="520" height="42" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="386" text-anchor="middle" font-size="14" fill="#1a202c">A branch is just a movable pointer to a commit; making one is cheap and instant.</text>
</svg>
