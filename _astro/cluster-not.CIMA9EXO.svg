<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What these methods are not</title>
  <style>
    .cluster-not-bg   { fill: #f8fafc; }
    .cluster-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cluster-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cluster-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cluster-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cluster-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cluster-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cluster-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cluster-not-row { opacity: 1; }
    .cluster-not-r0 { animation-delay: 0.00s; }
    .cluster-not-r1 { animation-delay: 0.45s; }
    .cluster-not-r2 { animation-delay: 0.90s; }
    .cluster-not-r3 { animation-delay: 1.35s; }
    .cluster-not-r4 { animation-delay: 1.80s; }
    .cluster-not-row { animation: cluster-not-reveal 7.3s ease-in-out infinite; }
    @keyframes cluster-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cluster-not-bg" width="980" height="390"/>
  <text class="cluster-not-h1"  x="30" y="40">What these methods are not</text>
  <text class="cluster-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="cluster-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cluster-not-name" x="46" y="122">The misconception</text>
  <text class="cluster-not-desc" x="46" y="142">Commonly held.</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r0" x="46" y="182">Density clustering has no parameters</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r1" x="46" y="216">The dendrogram gives the right cluster count</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r2" x="46" y="250">Noise points are errors</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r3" x="46" y="284">They work in any number of dimensions</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r4" x="46" y="318">Any clustering result is meaningful</text>
  <rect class="cluster-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cluster-not-name" x="526" y="122">What is true</text>
  <text class="cluster-not-desc" x="526" y="142">Actually.</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r0" x="526" y="182">It has two, and one is hard to set</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r1" x="526" y="216">It shows options; you still choose</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r2" x="526" y="250">They are a legitimate output, and often the interesting one</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r3" x="526" y="284">They degrade in high dimensions like all distance methods</text>
  <text class="cluster-not-desc cluster-not-row cluster-not-r4" x="526" y="318">Validate against something external</text>
  <text class="cluster-not-sub" x="30" y="372">Noise points being the interesting output is worth emphasising: in fraud and fault detection, the points that belong to no cluster are the whole purpose.</text>
</svg>
