<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And neither is encryption.">
  <title>Pseudonymisation is not anonymisation</title>
  <style>
    .pseudonymisation-limits-bg   { fill: #f8fafc; }
    .pseudonymisation-limits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudonymisation-limits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudonymisation-limits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudonymisation-limits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudonymisation-limits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudonymisation-limits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pseudonymisation-limits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pseudonymisation-limits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pseudonymisation-limits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pseudonymisation-limits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pseudonymisation-limits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pseudonymisation-limits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pseudonymisation-limits-row { opacity: 1; }
    .pseudonymisation-limits-r0 { animation-delay: 0.00s; }
    .pseudonymisation-limits-r1 { animation-delay: 0.45s; }
    .pseudonymisation-limits-r2 { animation-delay: 0.90s; }
    .pseudonymisation-limits-r3 { animation-delay: 1.35s; }
    .pseudonymisation-limits-r4 { animation-delay: 1.80s; }
    .pseudonymisation-limits-row { animation: pseudonymisation-limits-reveal 7.3s ease-in-out infinite; }
    @keyframes pseudonymisation-limits-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pseudonymisation-limits-bg" width="980" height="390"/>
  <text class="pseudonymisation-limits-h1"  x="30" y="40">Pseudonymisation is not anonymisation</text>
  <text class="pseudonymisation-limits-sub" x="30" y="64">And neither is encryption.</text>
  <rect class="pseudonymisation-limits-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pseudonymisation-limits-name" x="46" y="122">Pseudonymisation</text>
  <text class="pseudonymisation-limits-desc" x="46" y="142">Still personal data.</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r0" x="46" y="182">Records remain linkable</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r1" x="46" y="216">Stable tokens preserve joins</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r2" x="46" y="250">Reversible with the salt</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r3" x="46" y="284">Regulated as personal data under most laws</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r4" x="46" y="318">Useful, and not a get-out</text>
  <rect class="pseudonymisation-limits-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pseudonymisation-limits-name" x="526" y="122">Not the same as</text>
  <text class="pseudonymisation-limits-desc" x="526" y="142">Two things it is confused with.</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r0" x="526" y="182">Encryption protects from people without the key</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r1" x="526" y="216">You have the key, and so does your system</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r2" x="526" y="250">Anonymisation removes linkability</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r3" x="526" y="284">Which is much harder than it sounds</text>
  <text class="pseudonymisation-limits-desc pseudonymisation-limits-row pseudonymisation-limits-r4" x="526" y="318">And a regex is not a detector for free text</text>
  <text class="pseudonymisation-limits-sub" x="30" y="372">Pattern detectors catch structured identifiers reliably and free-text names, addresses and contextual identifiers unreliably, which is a limit worth stating rather than discovering.</text>
</svg>
