<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From loose scripts.">
  <title>Four steps toward toolkits</title>
  <style>
    .toolkit-history-bg   { fill: #f8fafc; }
    .toolkit-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toolkit-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .toolkit-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .toolkit-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .toolkit-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .toolkit-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .toolkit-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .toolkit-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .toolkit-history-stage { opacity: 1; }

    .toolkit-history-s0 { animation-delay: 0.00s; }
    .toolkit-history-e0 { animation-delay: 0.00s; }
    .toolkit-history-s1 { animation-delay: 1.28s; }
    .toolkit-history-e1 { animation-delay: 1.28s; }
    .toolkit-history-s2 { animation-delay: 2.56s; }
    .toolkit-history-e2 { animation-delay: 2.56s; }
    .toolkit-history-s3 { animation-delay: 3.84s; }
    .toolkit-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .toolkit-history-conn  { animation: toolkit-history-trace 6.4s ease-in-out infinite; }
      .toolkit-history-stage { animation: toolkit-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes toolkit-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes toolkit-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .toolkit-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .toolkit-history-stage { animation: toolkit-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes toolkit-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="toolkit-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="toolkit-history-bg" width="980" height="322"/>
  <text class="toolkit-history-h1"  x="30" y="40">Four steps toward toolkits</text>
  <text class="toolkit-history-sub" x="30" y="64">From loose scripts.</text>
  <g class="toolkit-history-stage toolkit-history-s0">
    <rect class="toolkit-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-history-step" x="44" y="142">01</text>
    <text class="toolkit-history-name" x="70" y="142">Loose scripts, copied between machines</text>
    <text class="toolkit-history-desc" x="44" y="166">Each one slightly different.</text>
  </g>
  <line class="toolkit-history-line toolkit-history-conn toolkit-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#toolkit-history-tip)"/>
  <g class="toolkit-history-stage toolkit-history-s1">
    <rect class="toolkit-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-history-step" x="280" y="142">02</text>
    <text class="toolkit-history-name" x="306" y="142">Then a shared directory on the path</text>
    <text class="toolkit-history-desc" x="280" y="166">Which at least gave one copy.</text>
  </g>
  <line class="toolkit-history-line toolkit-history-conn toolkit-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#toolkit-history-tip)"/>
  <g class="toolkit-history-stage toolkit-history-s2">
    <rect class="toolkit-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-history-step" x="516" y="142">03</text>
    <text class="toolkit-history-name" x="542" y="142">Then packaged tools with declared dependencies</text>
    <text class="toolkit-history-desc" x="516" y="166">Installable anywhere.</text>
  </g>
  <line class="toolkit-history-line toolkit-history-conn toolkit-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#toolkit-history-tip)"/>
  <g class="toolkit-history-stage toolkit-history-s3">
    <rect class="toolkit-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-history-step" x="752" y="142">04</text>
    <text class="toolkit-history-name" x="778" y="142">And subcommand suites under one name</text>
    <text class="toolkit-history-desc" x="752" y="166">Which is how large toolkits stay</text>
    <text class="toolkit-history-desc" x="752" y="182">learnable.</text>
  </g>
  <text class="toolkit-history-sub" x="30" y="304">Each step reduced the number of divergent copies, which is the underlying problem: a copied script is a fork nobody is tracking.</text>
</svg>
