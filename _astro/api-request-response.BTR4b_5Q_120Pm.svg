<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>The request and response flow of a web API call: a client builds a request to an endpoint, the server processes it, and returns a response with a status and body</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One web API call: request out, response back</text>

  <!-- Client -->
  <rect x="30" y="90" width="150" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="105" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Client</text>
  <text x="105" y="150" text-anchor="middle" font-size="14" fill="#1a202c">builds a request</text>

  <!-- Endpoint -->
  <rect x="300" y="90" width="160" height="90" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Endpoint</text>
  <text x="380" y="144" text-anchor="middle" font-size="14" fill="#1a202c">a URL the API</text>
  <text x="380" y="162" text-anchor="middle" font-size="14" fill="#1a202c">answers at</text>

  <!-- Server -->
  <rect x="580" y="90" width="150" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="655" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Server</text>
  <text x="655" y="144" text-anchor="middle" font-size="14" fill="#1a202c">does the work,</text>
  <text x="655" y="162" text-anchor="middle" font-size="14" fill="#1a202c">builds a response</text>

  <!-- Request arrows -->
  <line x1="180" y1="135" x2="292" y2="135" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="300,135 286,128 286,142" fill="#1d4ed8"/>
  <line x1="460" y1="135" x2="572" y2="135" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="580,135 566,128 566,142" fill="#1d4ed8"/>
  <text x="380" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">REQUEST: method + path + parameters + body</text>

  <!-- Response arrow (server back to client, lower) -->
  <line x1="655" y1="180" x2="655" y2="250" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="655" y1="250" x2="105" y2="250" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="105" y1="250" x2="105" y2="188" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="105,180 98,194 112,194" fill="#1d4ed8"/>
  <text x="380" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">4. RESPONSE: status code + headers + JSON body</text>

  <!-- Example strip -->
  <rect x="30" y="300" width="700" height="110" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Worked example</text>
  <text x="380" y="352" text-anchor="middle" font-size="14" fill="#1a202c">Request:  GET https://jsonplaceholder.typicode.com/todos/1</text>
  <text x="380" y="376" text-anchor="middle" font-size="14" fill="#1a202c">Response: HTTP 200  ->  { "id": 1, "title": "delectus aut autem", "completed": false }</text>
  <text x="380" y="398" text-anchor="middle" font-size="14" fill="#1a202c">The client reads the named fields out of the JSON body.</text>
</svg>
