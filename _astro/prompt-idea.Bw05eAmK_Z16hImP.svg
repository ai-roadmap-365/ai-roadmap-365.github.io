<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Why structure beats phrasing</title>
  <style>
    .prompt-idea-bg   { fill: #f8fafc; }
    .prompt-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-idea-stage { opacity: 1; }

    .prompt-idea-s0 { animation-delay: 0.00s; }
    .prompt-idea-e0 { animation-delay: 0.00s; }
    .prompt-idea-s1 { animation-delay: 1.28s; }
    .prompt-idea-e1 { animation-delay: 1.28s; }
    .prompt-idea-s2 { animation-delay: 2.56s; }
    .prompt-idea-e2 { animation-delay: 2.56s; }
    .prompt-idea-s3 { animation-delay: 3.84s; }
    .prompt-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-idea-conn  { animation: prompt-idea-trace 6.4s ease-in-out infinite; }
      .prompt-idea-stage { animation: prompt-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prompt-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-idea-stage { animation: prompt-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-idea-bg" width="980" height="322"/>
  <text class="prompt-idea-h1"  x="30" y="40">Why structure beats phrasing</text>
  <text class="prompt-idea-sub" x="30" y="64">Four reasons.</text>
  <g class="prompt-idea-stage prompt-idea-s0">
    <rect class="prompt-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-idea-step" x="44" y="142">01</text>
    <text class="prompt-idea-name" x="70" y="142">Most bad output comes from an ambiguous request</text>
    <text class="prompt-idea-desc" x="44" y="166">Not from insufficiently clever</text>
    <text class="prompt-idea-desc" x="44" y="182">wording.</text>
  </g>
  <line class="prompt-idea-line prompt-idea-conn prompt-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prompt-idea-tip)"/>
  <g class="prompt-idea-stage prompt-idea-s1">
    <rect class="prompt-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-idea-step" x="280" y="142">02</text>
    <text class="prompt-idea-name" x="306" y="142">Structure removes the ambiguity</text>
    <text class="prompt-idea-desc" x="280" y="166">Sections, delimiters, an</text>
    <text class="prompt-idea-desc" x="280" y="182">explicit format.</text>
  </g>
  <line class="prompt-idea-line prompt-idea-conn prompt-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prompt-idea-tip)"/>
  <g class="prompt-idea-stage prompt-idea-s2">
    <rect class="prompt-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-idea-step" x="516" y="142">03</text>
    <text class="prompt-idea-name" x="542" y="142">Examples remove the rest</text>
    <text class="prompt-idea-desc" x="516" y="166">Showing beats describing,</text>
    <text class="prompt-idea-desc" x="516" y="182">consistently.</text>
  </g>
  <line class="prompt-idea-line prompt-idea-conn prompt-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prompt-idea-tip)"/>
  <g class="prompt-idea-stage prompt-idea-s3">
    <rect class="prompt-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-idea-step" x="752" y="142">04</text>
    <text class="prompt-idea-name" x="778" y="142">Then iterate against an evaluation set</text>
    <text class="prompt-idea-desc" x="752" y="166">Because intuitions about prompts</text>
    <text class="prompt-idea-desc" x="752" y="182">are unreliable.</text>
    <text class="prompt-idea-edge" x="752" y="242">measure</text>
  </g>
  <text class="prompt-idea-sub" x="30" y="304">The unreliability of intuition here is well established: prompt changes that feel obviously better frequently score worse, which is the entire argument for the previous lesson.</text>
</svg>
