<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three truth tables, one impossibility.">
  <title>Why XOR breaks it</title>
  <style>
    .xor-barrier-bg   { fill: #f8fafc; }
    .xor-barrier-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xor-barrier-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xor-barrier-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xor-barrier-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xor-barrier-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xor-barrier-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .xor-barrier-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .xor-barrier-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .xor-barrier-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .xor-barrier-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .xor-barrier-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .xor-barrier-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .xor-barrier-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .xor-barrier-stage { opacity: 1; }

    .xor-barrier-s0 { animation-delay: 0.00s; }
    .xor-barrier-e0 { animation-delay: 0.00s; }
    .xor-barrier-s1 { animation-delay: 1.28s; }
    .xor-barrier-e1 { animation-delay: 1.28s; }
    .xor-barrier-s2 { animation-delay: 2.56s; }
    .xor-barrier-e2 { animation-delay: 2.56s; }
    .xor-barrier-s3 { animation-delay: 3.84s; }
    .xor-barrier-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .xor-barrier-conn  { animation: xor-barrier-trace 6.4s ease-in-out infinite; }
      .xor-barrier-stage { animation: xor-barrier-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes xor-barrier-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes xor-barrier-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .xor-barrier-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .xor-barrier-stage { animation: xor-barrier-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes xor-barrier-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="xor-barrier-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="xor-barrier-bg" width="980" height="322"/>
  <text class="xor-barrier-h1"  x="30" y="40">Why XOR breaks it</text>
  <text class="xor-barrier-sub" x="30" y="64">Three truth tables, one impossibility.</text>
  <g class="xor-barrier-stage xor-barrier-s0">
    <rect class="xor-barrier-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="xor-barrier-step" x="44" y="142">01</text>
    <text class="xor-barrier-name" x="70" y="142">AND is separable</text>
    <text class="xor-barrier-desc" x="44" y="166">One corner against three. A line</text>
    <text class="xor-barrier-desc" x="44" y="182">at x + y = 1.5.</text>
    <text class="xor-barrier-edge" x="44" y="242">one line</text>
  </g>
  <line class="xor-barrier-line xor-barrier-conn xor-barrier-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#xor-barrier-tip)"/>
  <g class="xor-barrier-stage xor-barrier-s1">
    <rect class="xor-barrier-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="xor-barrier-step" x="280" y="142">02</text>
    <text class="xor-barrier-name" x="306" y="142">OR is separable</text>
    <text class="xor-barrier-desc" x="280" y="166">Three corners against one. A</text>
    <text class="xor-barrier-desc" x="280" y="182">line at x + y = 0.5.</text>
  </g>
  <line class="xor-barrier-line xor-barrier-conn xor-barrier-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#xor-barrier-tip)"/>
  <g class="xor-barrier-stage xor-barrier-s2">
    <rect class="xor-barrier-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="xor-barrier-step" x="516" y="142">03</text>
    <text class="xor-barrier-name" x="542" y="142">XOR is not</text>
    <text class="xor-barrier-desc" x="516" y="166">The positive points sit on the</text>
    <text class="xor-barrier-desc" x="516" y="182">opposite diagonal from the</text>
    <text class="xor-barrier-desc" x="516" y="198">negatives.</text>
    <text class="xor-barrier-edge" x="516" y="242">impossible</text>
  </g>
  <line class="xor-barrier-line xor-barrier-conn xor-barrier-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#xor-barrier-tip)"/>
  <g class="xor-barrier-stage xor-barrier-s3">
    <rect class="xor-barrier-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="xor-barrier-step" x="752" y="142">04</text>
    <text class="xor-barrier-name" x="778" y="142">Two layers solve it</text>
    <text class="xor-barrier-desc" x="752" y="166">A hidden layer maps the square</text>
    <text class="xor-barrier-desc" x="752" y="182">into a space where one line</text>
    <text class="xor-barrier-desc" x="752" y="198">suffices.</text>
  </g>
  <text class="xor-barrier-sub" x="30" y="304">The hidden layer is not adding capacity by being bigger — it is changing the coordinate system, and in the new coordinates the problem is separable again.</text>
</svg>
