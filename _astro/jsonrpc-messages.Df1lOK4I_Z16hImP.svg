<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Request, response, notification.">
  <title>Three message shapes</title>
  <style>
    .jsonrpc-messages-bg   { fill: #f8fafc; }
    .jsonrpc-messages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonrpc-messages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonrpc-messages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonrpc-messages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonrpc-messages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonrpc-messages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .jsonrpc-messages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .jsonrpc-messages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .jsonrpc-messages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .jsonrpc-messages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .jsonrpc-messages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .jsonrpc-messages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .jsonrpc-messages-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .jsonrpc-messages-stage { opacity: 1; }

    .jsonrpc-messages-s0 { animation-delay: 0.00s; }
    .jsonrpc-messages-e0 { animation-delay: 0.00s; }
    .jsonrpc-messages-s1 { animation-delay: 1.28s; }
    .jsonrpc-messages-e1 { animation-delay: 1.28s; }
    .jsonrpc-messages-s2 { animation-delay: 2.56s; }
    .jsonrpc-messages-e2 { animation-delay: 2.56s; }
    .jsonrpc-messages-s3 { animation-delay: 3.84s; }
    .jsonrpc-messages-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .jsonrpc-messages-conn  { animation: jsonrpc-messages-trace 6.4s ease-in-out infinite; }
      .jsonrpc-messages-stage { animation: jsonrpc-messages-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes jsonrpc-messages-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes jsonrpc-messages-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .jsonrpc-messages-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .jsonrpc-messages-stage { animation: jsonrpc-messages-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes jsonrpc-messages-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="jsonrpc-messages-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="jsonrpc-messages-bg" width="980" height="322"/>
  <text class="jsonrpc-messages-h1"  x="30" y="40">Three message shapes</text>
  <text class="jsonrpc-messages-sub" x="30" y="64">Request, response, notification.</text>
  <g class="jsonrpc-messages-stage jsonrpc-messages-s0">
    <rect class="jsonrpc-messages-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="jsonrpc-messages-step" x="44" y="142">01</text>
    <text class="jsonrpc-messages-name" x="70" y="142">Request</text>
    <text class="jsonrpc-messages-desc" x="44" y="166">jsonrpc, a unique id, a method,</text>
    <text class="jsonrpc-messages-desc" x="44" y="182">and params.</text>
  </g>
  <line class="jsonrpc-messages-line jsonrpc-messages-conn jsonrpc-messages-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#jsonrpc-messages-tip)"/>
  <g class="jsonrpc-messages-stage jsonrpc-messages-s1">
    <rect class="jsonrpc-messages-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="jsonrpc-messages-step" x="280" y="142">02</text>
    <text class="jsonrpc-messages-name" x="306" y="142">Response</text>
    <text class="jsonrpc-messages-desc" x="280" y="166">Echoes the id, and carries</text>
    <text class="jsonrpc-messages-desc" x="280" y="182">result or error.</text>
  </g>
  <line class="jsonrpc-messages-line jsonrpc-messages-conn jsonrpc-messages-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#jsonrpc-messages-tip)"/>
  <g class="jsonrpc-messages-stage jsonrpc-messages-s2">
    <rect class="jsonrpc-messages-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="jsonrpc-messages-step" x="516" y="142">03</text>
    <text class="jsonrpc-messages-name" x="542" y="142">Notification</text>
    <text class="jsonrpc-messages-desc" x="516" y="166">No id, one way. The receiver</text>
    <text class="jsonrpc-messages-desc" x="516" y="182">must not reply.</text>
    <text class="jsonrpc-messages-edge" x="516" y="242">streaming</text>
  </g>
  <line class="jsonrpc-messages-line jsonrpc-messages-conn jsonrpc-messages-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#jsonrpc-messages-tip)"/>
  <g class="jsonrpc-messages-stage jsonrpc-messages-s3">
    <rect class="jsonrpc-messages-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="jsonrpc-messages-step" x="752" y="142">04</text>
    <text class="jsonrpc-messages-name" x="778" y="142">Tool failures are results</text>
    <text class="jsonrpc-messages-desc" x="752" y="166">isError: true inside result, so</text>
    <text class="jsonrpc-messages-desc" x="752" y="182">the model can read the message.</text>
    <text class="jsonrpc-messages-edge" x="752" y="242">not an error</text>
  </g>
  <text class="jsonrpc-messages-sub" x="30" y="304">The last row is a genuine design decision rather than an accident: a SQL syntax error is information the model should act on, and a protocol-level error is something the client must handle.</text>
</svg>
