<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" font-family="system-ui, sans-serif">
  <title>An annotated JSON object showing how the six JSON value types nest inside one another</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a JSON object</text>

  <!-- Outer object box -->
  <rect x="40" y="60" width="480" height="470" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="60" y="88" font-size="15" font-family="monospace" fill="#1a202c">{</text>

  <!-- string -->
  <text x="80" y="118" font-size="15" font-family="monospace" fill="#1a202c">"station": "Nimbus-7",</text>
  <!-- boolean -->
  <text x="80" y="148" font-size="15" font-family="monospace" fill="#1a202c">"active": true,</text>
  <!-- number -->
  <text x="80" y="178" font-size="15" font-family="monospace" fill="#1a202c">"elevation_m": 512,</text>

  <!-- nested object -->
  <rect x="70" y="196" width="330" height="86" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="80" y="220" font-size="15" font-family="monospace" fill="#1a202c">"coordinates": {</text>
  <text x="100" y="244" font-size="15" font-family="monospace" fill="#1a202c">"lat": 26.9124,</text>
  <text x="100" y="268" font-size="15" font-family="monospace" fill="#1a202c">"lon": 75.7873</text>
  <text x="80" y="292" font-size="15" font-family="monospace" fill="#1a202c">},</text>

  <!-- array -->
  <rect x="70" y="308" width="330" height="58" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="80" y="332" font-size="15" font-family="monospace" fill="#1a202c">"sensors": [</text>
  <text x="100" y="356" font-size="15" font-family="monospace" fill="#1a202c">"temp", "humidity", "pressure"</text>

  <text x="80" y="392" font-size="15" font-family="monospace" fill="#1a202c">],</text>
  <!-- null -->
  <text x="80" y="422" font-size="15" font-family="monospace" fill="#1a202c">"notes": null</text>
  <text x="60" y="452" font-size="15" font-family="monospace" fill="#1a202c">}</text>

  <!-- key/value annotation -->
  <text x="80" y="492" font-size="13" fill="#1d4ed8">Each entry is a "key": value pair, separated by commas.</text>
  <text x="80" y="512" font-size="13" fill="#1d4ed8">Keys are always double-quoted strings.</text>

  <!-- Type callouts on the right -->
  <line x1="300" y1="113" x2="560" y2="113" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="566" y="118" font-size="14" fill="#1a202c">string</text>

  <line x1="235" y1="143" x2="560" y2="143" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="566" y="148" font-size="14" fill="#1a202c">boolean (true / false)</text>

  <line x1="270" y1="173" x2="560" y2="173" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="566" y="178" font-size="14" fill="#1a202c">number</text>

  <line x1="405" y1="239" x2="560" y2="239" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="566" y="244" font-size="14" fill="#1a202c">object nested</text>
  <text x="566" y="262" font-size="14" fill="#1a202c">inside an object</text>

  <line x1="405" y1="337" x2="560" y2="337" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="566" y="342" font-size="14" fill="#1a202c">array (ordered list)</text>

  <line x1="200" y1="417" x2="560" y2="417" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="566" y="422" font-size="14" fill="#1a202c">null (empty value)</text>

  <text x="380" y="548" text-anchor="middle" font-size="14" fill="#1a202c">Six value types — object, array, string, number, boolean, null — nest to any depth.</text>
</svg>
