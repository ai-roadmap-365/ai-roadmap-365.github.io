<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="d127fTitleId d127fDescId">
  <title id="d127fTitleId">A question arriving, its data types being read, and the decision path lighting up to one recommended chart with the rejected branches still visible</title>
  <desc id="d127fDescId">A question card reading "which of these eight regions grew fastest?" feeds a node that reads the data types: region is nominal, growth is quantitative, and the number of values is eight. Five question-kind branches fan out — comparison, distribution, relationship, composition, change over time — and the comparison branch is the live one. It reaches a size gate that asks whether the number of values is five or fewer; eight is not, so the table outcome is passed over and the sorted horizontal bar is recommended. The other four branches stay drawn in grey with their own outcomes, and a pie chart box sits at the bottom marked as never recommended.</desc>

  <style>
    .d127f-bg      { fill: #f8fafc; }
    .d127f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 700; fill: #1a202c; }
    .d127f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; fill: #334155; }
    .d127f-head    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d127f-body    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d127f-dim     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #64748b; }
    .d127f-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d127f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; fill: #334155; }
    .d127f-tag     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 700; fill: #ffffff; }

    .d127f-live    { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
    .d127f-gate    { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .d127f-chosen  { fill: #dcfce7; stroke: #047857; stroke-width: 2.5; }
    .d127f-passed  { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
    .d127f-never   { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .d127f-capbox  { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }

    .d127f-wire    { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .d127f-strike  { stroke: #b91c1c; stroke-width: 2.5; }

    /* Motion 1: the live path is a flowing connection. At rest (reduced
       motion) the dashes become a solid accent line, so a still reader
       sees a clean arrow rather than a frozen dotted one. */
    .d127f-livewire {
      stroke: #1d4ed8; stroke-width: 3; fill: none;
      stroke-dasharray: 10 8;
      animation: d127f-march 1.8s linear infinite;
    }
    @keyframes d127f-march { to { stroke-dashoffset: -18; } }

    /* Motion 2: a token carrying the question travels the decision path. */
    .d127f-token {
      offset-path: path('M 150 168 L 395 168 L 505 168 L 505 76 L 640 76 L 762 76 L 850 96 L 962 140 L 1080 140');
      offset-rotate: 0deg;
      animation: d127f-travel 7s ease-in-out infinite;
    }
    @keyframes d127f-travel {
      0%, 5%    { offset-distance: 0%; }
      25%       { offset-distance: 26%; }
      45%       { offset-distance: 48%; }
      65%       { offset-distance: 70%; }
      88%, 100% { offset-distance: 100%; }
    }

    /* Motion 3: the five stages of the decision light up in order. The
       resting fill is the normal one, so nothing is hidden when still. */
    .d127f-stage  { animation: d127f-lift 7s ease-in-out infinite; }
    .d127f-s1     { animation-delay: 0s; }
    .d127f-s2     { animation-delay: 1.2s; }
    .d127f-s3     { animation-delay: 2.4s; }
    .d127f-s4     { animation-delay: 3.6s; }
    @keyframes d127f-lift {
      0%, 18%, 100% { fill: #eff6ff; }
      6%, 12%       { fill: #bfdbfe; }
    }
    .d127f-stagegate { animation: d127f-liftgate 7s ease-in-out infinite; animation-delay: 3.6s; }
    @keyframes d127f-liftgate {
      0%, 18%, 100% { fill: #fef3c7; }
      6%, 12%       { fill: #fde68a; }
    }
    .d127f-stagewin { animation: d127f-liftwin 7s ease-in-out infinite; animation-delay: 4.8s; }
    @keyframes d127f-liftwin {
      0%, 22%, 100% { fill: #dcfce7; }
      8%, 16%       { fill: #86efac; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d127f-livewire { animation: none; stroke-dasharray: none; }
      .d127f-token    { animation: none; offset-distance: 0%; }
      .d127f-stage    { animation: none; fill: #eff6ff; }
      .d127f-stagegate{ animation: none; fill: #fef3c7; }
      .d127f-stagewin { animation: none; fill: #dcfce7; }
    }
  </style>

  <defs>
    <marker id="d127f-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="d127f-tiplive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d127f-bg" x="0" y="0" width="1200" height="620" />

  <text class="d127f-title" x="30" y="38">One question in, one instrument out — and the branches it did not take</text>
  <text class="d127f-sub" x="30" y="62">The blue path is the live decision. Grey boxes are real answers to different questions. The red box is never an answer to any of them.</text>

  <!-- ============ stage 1: the question ============ -->
  <rect class="d127f-live d127f-stage d127f-s1" x="30" y="120" width="240" height="96" rx="8" />
  <text class="d127f-head" x="46" y="146">The question</text>
  <text class="d127f-body" x="46" y="170">Which of these eight</text>
  <text class="d127f-body" x="46" y="190">regions grew fastest?</text>
  <text class="d127f-dim" x="46" y="209">a ranking question</text>

  <line class="d127f-livewire" x1="270" y1="168" x2="292" y2="168" marker-end="url(#d127f-tiplive)" />

  <!-- ============ stage 2: read the data types ============ -->
  <rect class="d127f-live d127f-stage d127f-s2" x="300" y="118" width="200" height="100" rx="8" />
  <text class="d127f-head" x="316" y="142">Read the types</text>
  <text class="d127f-mono" x="316" y="164">region: nominal</text>
  <text class="d127f-mono" x="316" y="184">growth: quantitative</text>
  <text class="d127f-mono" x="316" y="204">n = 8</text>

  <!-- fan out to the five question kinds -->
  <path class="d127f-livewire" d="M 500 168 L 512 168 L 512 76 L 528 76" marker-end="url(#d127f-tiplive)" />
  <path class="d127f-wire" d="M 500 168 L 512 168 L 512 141 L 528 141" marker-end="url(#d127f-tip)" />
  <path class="d127f-wire" d="M 500 168 L 512 168 L 512 206 L 528 206" marker-end="url(#d127f-tip)" />
  <path class="d127f-wire" d="M 500 168 L 512 168 L 512 271 L 528 271" marker-end="url(#d127f-tip)" />
  <path class="d127f-wire" d="M 500 168 L 512 168 L 512 336 L 528 336" marker-end="url(#d127f-tip)" />

  <!-- ============ stage 3: the five question kinds ============ -->
  <rect class="d127f-live d127f-stage d127f-s3" x="530" y="50" width="210" height="52" rx="6" />
  <text class="d127f-head" x="546" y="72">comparison</text>
  <text class="d127f-dim" x="546" y="91">which is biggest?</text>

  <rect class="d127f-passed" x="530" y="115" width="210" height="52" rx="6" />
  <text class="d127f-body" x="546" y="137">distribution</text>
  <text class="d127f-dim" x="546" y="156">what shape is it?</text>

  <rect class="d127f-passed" x="530" y="180" width="210" height="52" rx="6" />
  <text class="d127f-body" x="546" y="202">relationship</text>
  <text class="d127f-dim" x="546" y="221">does x move with y?</text>

  <rect class="d127f-passed" x="530" y="245" width="210" height="52" rx="6" />
  <text class="d127f-body" x="546" y="267">composition</text>
  <text class="d127f-dim" x="546" y="286">parts of a whole</text>

  <rect class="d127f-passed" x="530" y="310" width="210" height="52" rx="6" />
  <text class="d127f-body" x="546" y="332">change over time</text>
  <text class="d127f-dim" x="546" y="351">what happened?</text>

  <!-- ============ stage 4: the size gate ============ -->
  <line class="d127f-livewire" x1="740" y1="76" x2="762" y2="76" marker-end="url(#d127f-tiplive)" />
  <rect class="d127f-gate d127f-stagegate" x="770" y="46" width="170" height="88" rx="8" />
  <text class="d127f-head" x="786" y="72">Size gate</text>
  <text class="d127f-mono" x="786" y="94">n &lt;= 5 ?</text>
  <text class="d127f-dim" x="786" y="118">8 is not. Chart it.</text>

  <path class="d127f-wire" d="M 940 66 L 962 66 L 962 56 L 976 56" marker-end="url(#d127f-tip)" />
  <path class="d127f-livewire" d="M 940 110 L 962 110 L 962 140 L 976 140" marker-end="url(#d127f-tiplive)" />

  <!-- ============ stage 5: the outcomes ============ -->
  <rect class="d127f-passed" x="978" y="33" width="200" height="46" rx="6" />
  <text class="d127f-body" x="994" y="53">table</text>
  <text class="d127f-dim" x="994" y="71">if n had been 5 or fewer</text>

  <rect class="d127f-chosen d127f-stagewin" x="978" y="113" width="200" height="56" rx="6" />
  <text class="d127f-head" x="994" y="137">sorted horizontal bar</text>
  <text class="d127f-dim" x="994" y="157">position on a common scale</text>

  <line class="d127f-wire" x1="740" y1="141" x2="976" y2="196" marker-end="url(#d127f-tip)" />
  <rect class="d127f-passed" x="978" y="180" width="200" height="46" rx="6" />
  <text class="d127f-body" x="994" y="200">histogram</text>
  <text class="d127f-dim" x="994" y="218">one variable, its shape</text>

  <line class="d127f-wire" x1="740" y1="206" x2="976" y2="263" marker-end="url(#d127f-tip)" />
  <rect class="d127f-passed" x="978" y="247" width="200" height="46" rx="6" />
  <text class="d127f-body" x="994" y="267">scatter, then hexbin</text>
  <text class="d127f-dim" x="994" y="285">past 2000 points</text>

  <line class="d127f-wire" x1="740" y1="271" x2="976" y2="330" marker-end="url(#d127f-tip)" />
  <rect class="d127f-passed" x="978" y="314" width="200" height="46" rx="6" />
  <text class="d127f-body" x="994" y="334">stacked bar</text>
  <text class="d127f-dim" x="994" y="352">parts, ordered and labelled</text>

  <line class="d127f-wire" x1="740" y1="336" x2="976" y2="397" marker-end="url(#d127f-tip)" />
  <rect class="d127f-passed" x="978" y="381" width="200" height="46" rx="6" />
  <text class="d127f-body" x="994" y="401">line</text>
  <text class="d127f-dim" x="994" y="419">small multiples past 8</text>

  <!-- the outcome nothing reaches -->
  <rect class="d127f-never" x="978" y="448" width="200" height="46" rx="6" />
  <text class="d127f-body" x="994" y="468">pie chart</text>
  <text class="d127f-dim" x="994" y="486">no branch leads here</text>
  <line class="d127f-strike" x1="988" y1="492" x2="1168" y2="452" />

  <!-- the travelling token, drawn last so it rides above everything -->
  <circle class="d127f-token" r="10" fill="#1d4ed8" />

  <!-- ============ caption band ============ -->
  <rect class="d127f-capbox" x="30" y="448" width="920" height="140" rx="8" />
  <text class="d127f-caption" x="52" y="476">The rejected branches are drawn, not hidden, because they are the whole argument. Every grey box is the right answer to a</text>
  <text class="d127f-caption" x="52" y="500">question somebody could reasonably have asked about this same data — "how is growth distributed?", "does growth track</text>
  <text class="d127f-caption" x="52" y="524">headcount?" — and none of them answers the one that was actually asked. Changing the question changes the instrument.</text>
  <text class="d127f-caption" x="52" y="556">The table branch is live too: had there been three regions rather than eight, the gate would have sent the token there instead.</text>
  <text class="d127f-caption" x="52" y="578">Only the pie chart is unreachable, because judging angle is ranked fourth where the sorted bar's position is ranked first.</text>
</svg>
