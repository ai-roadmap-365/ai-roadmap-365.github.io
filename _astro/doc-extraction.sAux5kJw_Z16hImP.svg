<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Extracting structure from a scan</title>
  <style>
    .doc-extraction-bg   { fill: #f8fafc; }
    .doc-extraction-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-extraction-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-extraction-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-extraction-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-extraction-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-extraction-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .doc-extraction-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .doc-extraction-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .doc-extraction-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .doc-extraction-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .doc-extraction-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .doc-extraction-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .doc-extraction-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .doc-extraction-stage { opacity: 1; }

    .doc-extraction-s0 { animation-delay: 0.00s; }
    .doc-extraction-e0 { animation-delay: 0.00s; }
    .doc-extraction-s1 { animation-delay: 1.28s; }
    .doc-extraction-e1 { animation-delay: 1.28s; }
    .doc-extraction-s2 { animation-delay: 2.56s; }
    .doc-extraction-e2 { animation-delay: 2.56s; }
    .doc-extraction-s3 { animation-delay: 3.84s; }
    .doc-extraction-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .doc-extraction-conn  { animation: doc-extraction-trace 6.4s ease-in-out infinite; }
      .doc-extraction-stage { animation: doc-extraction-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes doc-extraction-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes doc-extraction-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .doc-extraction-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .doc-extraction-stage { animation: doc-extraction-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes doc-extraction-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="doc-extraction-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="doc-extraction-bg" width="980" height="322"/>
  <text class="doc-extraction-h1"  x="30" y="40">Extracting structure from a scan</text>
  <text class="doc-extraction-sub" x="30" y="64">Four steps.</text>
  <g class="doc-extraction-stage doc-extraction-s0">
    <rect class="doc-extraction-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="doc-extraction-step" x="44" y="142">01</text>
    <text class="doc-extraction-name" x="70" y="142">Send the page image directly</text>
    <text class="doc-extraction-desc" x="44" y="166">No separate character</text>
    <text class="doc-extraction-desc" x="44" y="182">recognition step is needed.</text>
  </g>
  <line class="doc-extraction-line doc-extraction-conn doc-extraction-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#doc-extraction-tip)"/>
  <g class="doc-extraction-stage doc-extraction-s1">
    <rect class="doc-extraction-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="doc-extraction-step" x="280" y="142">02</text>
    <text class="doc-extraction-name" x="306" y="142">Supply the schema you want back</text>
    <text class="doc-extraction-desc" x="280" y="166">Fields, types, and which are</text>
    <text class="doc-extraction-desc" x="280" y="182">required.</text>
  </g>
  <line class="doc-extraction-line doc-extraction-conn doc-extraction-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#doc-extraction-tip)"/>
  <g class="doc-extraction-stage doc-extraction-s2">
    <rect class="doc-extraction-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="doc-extraction-step" x="516" y="142">03</text>
    <text class="doc-extraction-name" x="542" y="142">The model reads and fills it</text>
    <text class="doc-extraction-desc" x="516" y="166">Including handwriting, and</text>
    <text class="doc-extraction-desc" x="516" y="182">inconsistent layouts.</text>
  </g>
  <line class="doc-extraction-line doc-extraction-conn doc-extraction-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#doc-extraction-tip)"/>
  <g class="doc-extraction-stage doc-extraction-s3">
    <rect class="doc-extraction-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="doc-extraction-step" x="752" y="142">04</text>
    <text class="doc-extraction-name" x="778" y="142">Then validate against the document</text>
    <text class="doc-extraction-desc" x="752" y="166">Totals, dates and identifiers</text>
    <text class="doc-extraction-desc" x="752" y="182">checked in code.</text>
  </g>
  <text class="doc-extraction-sub" x="30" y="304">Independent validation matters more here than in text extraction: a misread digit produces a plausible number rather than an error, and only arithmetic catches it.</text>
</svg>
