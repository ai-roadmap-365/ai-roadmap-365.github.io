<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rungs, each with a decision.">
  <title>The ladder from zero risk to full</title>
  <style>
    .release-ladder-bg   { fill: #f8fafc; }
    .release-ladder-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-ladder-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-ladder-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-ladder-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-ladder-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-ladder-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .release-ladder-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .release-ladder-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .release-ladder-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .release-ladder-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .release-ladder-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .release-ladder-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .release-ladder-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .release-ladder-stage { opacity: 1; }

    .release-ladder-s0 { animation-delay: 0.00s; }
    .release-ladder-e0 { animation-delay: 0.00s; }
    .release-ladder-s1 { animation-delay: 1.28s; }
    .release-ladder-e1 { animation-delay: 1.28s; }
    .release-ladder-s2 { animation-delay: 2.56s; }
    .release-ladder-e2 { animation-delay: 2.56s; }
    .release-ladder-s3 { animation-delay: 3.84s; }
    .release-ladder-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .release-ladder-conn  { animation: release-ladder-trace 6.4s ease-in-out infinite; }
      .release-ladder-stage { animation: release-ladder-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes release-ladder-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes release-ladder-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .release-ladder-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .release-ladder-stage { animation: release-ladder-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes release-ladder-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="release-ladder-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="release-ladder-bg" width="980" height="322"/>
  <text class="release-ladder-h1"  x="30" y="40">The ladder from zero risk to full</text>
  <text class="release-ladder-sub" x="30" y="64">Four rungs, each with a decision.</text>
  <g class="release-ladder-stage release-ladder-s0">
    <rect class="release-ladder-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="release-ladder-step" x="44" y="142">01</text>
    <text class="release-ladder-name" x="70" y="142">Shadow</text>
    <text class="release-ladder-desc" x="44" y="166">The candidate sees real prompts;</text>
    <text class="release-ladder-desc" x="44" y="182">users see none of its answers.</text>
    <text class="release-ladder-edge" x="44" y="242">zero risk</text>
  </g>
  <line class="release-ladder-line release-ladder-conn release-ladder-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#release-ladder-tip)"/>
  <g class="release-ladder-stage release-ladder-s1">
    <rect class="release-ladder-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="release-ladder-step" x="280" y="142">02</text>
    <text class="release-ladder-name" x="306" y="142">Canary at 5%</text>
    <text class="release-ladder-desc" x="280" y="166">Real users, small blast radius.</text>
    <text class="release-ladder-desc" x="280" y="182">Watch P95 and error rate.</text>
  </g>
  <line class="release-ladder-line release-ladder-conn release-ladder-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#release-ladder-tip)"/>
  <g class="release-ladder-stage release-ladder-s2">
    <rect class="release-ladder-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="release-ladder-step" x="516" y="142">03</text>
    <text class="release-ladder-name" x="542" y="142">Ramp: 20%, 50%</text>
    <text class="release-ladder-desc" x="516" y="166">Each step is a decision on</text>
    <text class="release-ladder-desc" x="516" y="182">evidence, not on elapsed time.</text>
  </g>
  <line class="release-ladder-line release-ladder-conn release-ladder-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#release-ladder-tip)"/>
  <g class="release-ladder-stage release-ladder-s3">
    <rect class="release-ladder-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="release-ladder-step" x="752" y="142">04</text>
    <text class="release-ladder-name" x="778" y="142">100%</text>
    <text class="release-ladder-desc" x="752" y="166">With an automated rollback</text>
    <text class="release-ladder-desc" x="752" y="182">trigger still armed.</text>
    <text class="release-ladder-edge" x="752" y="242">still reversible</text>
  </g>
  <text class="release-ladder-sub" x="30" y="304">The first rung is the one only AI systems get cheaply: inference on a mirrored prompt is a pure function, so the candidate can be exercised on authentic traffic with nothing returned to anybody.</text>
</svg>
