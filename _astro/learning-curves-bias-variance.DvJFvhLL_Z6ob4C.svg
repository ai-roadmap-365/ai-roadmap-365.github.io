<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Learning Curves Bias Variance</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .axis { stroke: var(--border-subtle, #475569); stroke-width: 2; }
    .curve-train { stroke: #3b82f6; stroke-width: 3; fill: none; }
    .curve-val { stroke: #ef4444; stroke-width: 3; fill: none; }
    .gap-shade { fill: rgba(239, 68, 68, 0.15); }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; }
  </style>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Learning Curve Diagnostics: High Bias vs High Variance</text>
  <text x="450" y="65" class="text-sub">Training Error vs Validation Error as a Function of Training Dataset Size (m)</text>

  <!-- Panel 1: High Bias (Underfitting) -->
  <rect x="50" y="90" width="380" height="350" class="box" />
  <text x="240" y="120" class="text-title">High Bias (Underfitting)</text>
  <text x="240" y="140" class="text-sub">Asymptotes Early — More Data DOES NOT Help</text>

  <line x1="90" y1="380" x2="390" y2="380" class="axis" />
  <line x1="90" y1="380" x2="90" y2="160" class="axis" />
  <text x="240" y="410" class="text-sub">Training Size (m)</text>
  <text x="75" y="270" class="text-sub" transform="rotate(-90 75 270)">Error</text>

  <!-- High bias curves: both flatten at high error -->
  <path d="M 100 320 Q 200 230 380 220" class="curve-train" />
  <path d="M 100 170 Q 200 210 380 210" class="curve-val" />
  <text x="320" y="245" class="text-label" fill="#3b82f6">Train Error</text>
  <text x="320" y="195" class="text-label" fill="#ef4444">Val Error</text>
  <text x="240" y="340" class="text-sub" fill="#f59e0b">Narrow Gap, High Error Plateau</text>

  <!-- Panel 2: High Variance (Overfitting) -->
  <rect x="470" y="90" width="380" height="350" class="box" />
  <text x="660" y="120" class="text-title">High Variance (Overfitting)</text>
  <text x="660" y="140" class="text-sub">Wide Generalization Gap — More Data Helps</text>

  <line x1="510" y1="380" x2="810" y2="380" class="axis" />
  <line x1="510" y1="380" x2="510" y2="160" class="axis" />
  <text x="660" y="410" class="text-sub">Training Size (m)</text>
  <text x="495" y="270" class="text-sub" transform="rotate(-90 495 270)">Error</text>

  <!-- High variance curves: wide gap, val decreasing -->
  <path d="M 520 370 Q 620 350 800 330" class="curve-train" />
  <path d="M 520 170 Q 620 230 800 250" class="curve-val" />
  <text x="740" y="350" class="text-label" fill="#3b82f6">Train Error</text>
  <text x="740" y="235" class="text-label" fill="#ef4444">Val Error</text>
  <text x="660" y="295" class="text-sub" fill="#ef4444">Large Generalization Gap</text>
</svg>
