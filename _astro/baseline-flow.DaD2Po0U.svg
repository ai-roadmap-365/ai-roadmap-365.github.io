<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" role="img" aria-labelledby="d132f-title d132f-desc" width="1060" height="620">
  <title id="d132f-title">The baseline sliding up from zero: the drawn bar ratio grows while the data ratio stays fixed at 1.02 and the lie factor climbs</title>
  <desc id="d132f-desc">An animated flow diagram in four stages. As the y-axis floor rises from 0 to 90, 95 and 99, the two bars for 100 and 102 grow further apart in drawn height while the caption stating the true data ratio never changes.</desc>

  <style>
    .d132f-bg      { fill: #f8fafc; }
    .d132f-title   { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d132f-sub     { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; }
    .d132f-stage   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .d132f-head    { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d132f-small   { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d132f-axis    { stroke: #1a202c; stroke-width: 2; fill: none; }
    .d132f-barA    { fill: #1d4ed8; }
    .d132f-barB    { fill: #60a5fa; }
    .d132f-fixed   { fill: #15803d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d132f-lf      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; }
    .d132f-note    { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-style: italic; }
    .d132f-floor   { stroke: #b91c1c; stroke-width: 3; fill: none; }
    .d132f-band    { fill: #fee2e2; }

    /* Each stage lifts in turn, so the eye reads them left to right. */
    .d132f-card { animation: d132f-lift 8s ease-in-out infinite; }
    .d132f-c1 { animation-delay: 0s; }
    .d132f-c2 { animation-delay: 2s; }
    .d132f-c3 { animation-delay: 4s; }
    .d132f-c4 { animation-delay: 6s; }
    @keyframes d132f-lift {
      0%, 20%, 100% { stroke: #cbd5e1; stroke-width: 1.5; }
      4%, 16%       { stroke: #1d4ed8; stroke-width: 3.5; }
    }

    /* The red floor bar swells as the truncation deepens. */
    .d132f-cut { animation: d132f-swell 8s ease-in-out infinite; }
    .d132f-k1 { animation-delay: 0s; }
    .d132f-k2 { animation-delay: 2s; }
    .d132f-k3 { animation-delay: 4s; }
    .d132f-k4 { animation-delay: 6s; }
    @keyframes d132f-swell {
      0%, 20%, 100% { opacity: 0.85; }
      6%, 14%       { opacity: 1; }
    }

    /* The travelling marker walks the lie-factor scale at the foot. */
    .d132f-token { animation: d132f-walk 8s ease-in-out infinite; }
    @keyframes d132f-walk {
      0%,   12% { transform: translateX(0px); }
      25%,  37% { transform: translateX(230px); }
      50%,  62% { transform: translateX(460px); }
      75%, 100% { transform: translateX(690px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .d132f-card  { animation: none; stroke: #cbd5e1; stroke-width: 1.5; }
      .d132f-cut   { animation: none; opacity: 1; }
      .d132f-token { animation: none; transform: translateX(690px); }
    }
  </style>

  <rect class="d132f-bg" x="0" y="0" width="1060" height="620" />

  <text class="d132f-title" x="530" y="40" text-anchor="middle">Slide the baseline up. Watch what does not change.</text>
  <text class="d132f-sub" x="530" y="68" text-anchor="middle">Two bars, 100 and 102, at four y-axis floors. Every drawn height below was measured, not sketched.</text>

  <!-- ================= STAGE 1: baseline 0 ================= -->
  <rect class="d132f-stage d132f-card d132f-c1" x="30" y="95" width="230" height="330" />
  <text class="d132f-head" x="145" y="124" text-anchor="middle">y axis from 0</text>
  <path class="d132f-axis" d="M 75 350 L 75 155 M 75 350 L 225 350" />
  <rect class="d132f-barA" x="100" y="163" width="40" height="187" />
  <rect class="d132f-barB" x="160" y="159" width="40" height="191" />
  <path class="d132f-floor d132f-cut d132f-k1" d="M 68 350 L 232 350" />
  <text class="d132f-small" x="60" y="355" text-anchor="end">0</text>
  <text class="d132f-small" x="145" y="374" text-anchor="middle">drawn ratio 1.02</text>
  <text class="d132f-fixed" x="145" y="398" text-anchor="middle">data ratio 1.02</text>
  <text class="d132f-lf" x="145" y="420" text-anchor="middle" fill="#15803d">lie factor 1.00</text>

  <!-- ================= STAGE 2: baseline 90 ================= -->
  <rect class="d132f-stage d132f-card d132f-c2" x="290" y="95" width="230" height="330" />
  <text class="d132f-head" x="405" y="124" text-anchor="middle">y axis from 90</text>
  <rect class="d132f-band" x="335" y="333" width="150" height="17" />
  <path class="d132f-axis" d="M 335 350 L 335 155 M 335 350 L 485 350" />
  <rect class="d132f-barA" x="360" y="190" width="40" height="160" />
  <rect class="d132f-barB" x="420" y="158" width="40" height="192" />
  <path class="d132f-floor d132f-cut d132f-k2" d="M 328 350 L 492 350" />
  <text class="d132f-small" x="320" y="355" text-anchor="end">90</text>
  <text class="d132f-small" x="405" y="374" text-anchor="middle">drawn ratio 1.20</text>
  <text class="d132f-fixed" x="405" y="398" text-anchor="middle">data ratio 1.02</text>
  <text class="d132f-lf" x="405" y="420" text-anchor="middle" fill="#b45309">lie factor 1.18</text>

  <!-- ================= STAGE 3: baseline 95 ================= -->
  <rect class="d132f-stage d132f-card d132f-c3" x="550" y="95" width="230" height="330" />
  <text class="d132f-head" x="665" y="124" text-anchor="middle">y axis from 95</text>
  <rect class="d132f-band" x="595" y="322" width="150" height="28" />
  <path class="d132f-axis" d="M 595 350 L 595 155 M 595 350 L 745 350" />
  <rect class="d132f-barA" x="620" y="212" width="40" height="138" />
  <rect class="d132f-barB" x="680" y="157" width="40" height="193" />
  <path class="d132f-floor d132f-cut d132f-k3" d="M 588 350 L 752 350" />
  <text class="d132f-small" x="580" y="355" text-anchor="end">95</text>
  <text class="d132f-small" x="665" y="374" text-anchor="middle">drawn ratio 1.40</text>
  <text class="d132f-fixed" x="665" y="398" text-anchor="middle">data ratio 1.02</text>
  <text class="d132f-lf" x="665" y="420" text-anchor="middle" fill="#c2410c">lie factor 1.37</text>

  <!-- ================= STAGE 4: baseline 99 ================= -->
  <rect class="d132f-stage d132f-card d132f-c4" x="810" y="95" width="230" height="330" />
  <text class="d132f-head" x="925" y="124" text-anchor="middle">y axis from 99</text>
  <rect class="d132f-band" x="855" y="303" width="150" height="47" />
  <path class="d132f-axis" d="M 855 350 L 855 155 M 855 350 L 1005 350" />
  <rect class="d132f-barA" x="880" y="285" width="40" height="65" />
  <rect class="d132f-barB" x="940" y="155" width="40" height="195" />
  <path class="d132f-floor d132f-cut d132f-k4" d="M 848 350 L 1012 350" />
  <text class="d132f-small" x="840" y="355" text-anchor="end">99</text>
  <text class="d132f-small" x="925" y="374" text-anchor="middle">drawn ratio 3.00</text>
  <text class="d132f-fixed" x="925" y="398" text-anchor="middle">data ratio 1.02</text>
  <text class="d132f-lf" x="925" y="420" text-anchor="middle" fill="#b91c1c">lie factor 2.94</text>

  <!-- ================= the lie-factor scale ================= -->
  <text class="d132f-sub" x="30" y="470" >lie factor</text>
  <path class="d132f-axis" d="M 145 500 L 925 500" />
  <circle cx="145" cy="500" r="6" fill="#15803d" />
  <circle cx="405" cy="500" r="6" fill="#b45309" />
  <circle cx="665" cy="500" r="6" fill="#c2410c" />
  <circle cx="925" cy="500" r="6" fill="#b91c1c" />
  <text class="d132f-small" x="145" y="524" text-anchor="middle">1.00</text>
  <text class="d132f-small" x="405" y="524" text-anchor="middle">1.18</text>
  <text class="d132f-small" x="665" y="524" text-anchor="middle">1.37</text>
  <text class="d132f-small" x="925" y="524" text-anchor="middle">2.94</text>
  <path class="d132f-token" d="M 145 478 L 137 464 L 153 464 Z" fill="#1d4ed8" />
  <text class="d132f-small" x="945" y="482">Tufte calls anything outside 0.95 to 1.05 a distortion</text>

  <text class="d132f-note" x="530" y="574" text-anchor="middle">The green line never moves: the data ratio is 1.02 at every stage. Only the picture changes.</text>
  <text class="d132f-sub" x="530" y="600" text-anchor="middle">A bar encodes value as length from the baseline, so cutting the baseline breaks the encoding. A line on these same floors keeps a lie factor of exactly 1.00.</text>
</svg>
