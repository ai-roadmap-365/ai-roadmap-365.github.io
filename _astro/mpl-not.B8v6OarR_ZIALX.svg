<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things the plotting library is not</title>
  <style>
    .mpl-not-bg   { fill: #f8fafc; }
    .mpl-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mpl-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mpl-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mpl-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mpl-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mpl-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mpl-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mpl-not-row { opacity: 1; }
    .mpl-not-r0 { animation-delay: 0.00s; }
    .mpl-not-r1 { animation-delay: 0.45s; }
    .mpl-not-r2 { animation-delay: 0.90s; }
    .mpl-not-r3 { animation-delay: 1.35s; }
    .mpl-not-r4 { animation-delay: 1.80s; }
    .mpl-not-row { animation: mpl-not-reveal 7.3s ease-in-out infinite; }
    @keyframes mpl-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mpl-not-bg" width="980" height="390"/>
  <text class="mpl-not-h1"  x="30" y="40">Four things the plotting library is not</text>
  <text class="mpl-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="mpl-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mpl-not-name" x="46" y="122">The misconception</text>
  <text class="mpl-not-desc" x="46" y="142">Commonly held.</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r0" x="46" y="182">The default style is publication-ready</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r1" x="46" y="216">One command per chart is enough</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r2" x="46" y="250">The implicit interface is simpler</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r3" x="46" y="284">Saving to any format is equivalent</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r4" x="46" y="318">It is only for final output</text>
  <rect class="mpl-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mpl-not-name" x="526" y="122">What is true</text>
  <text class="mpl-not-desc" x="526" y="142">Actually.</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r0" x="526" y="182">Defaults need labels, sizing and restraint</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r1" x="526" y="216">Labels and captions are required</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r2" x="526" y="250">It is shorter, and ambiguous in scripts</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r3" x="526" y="284">Vector formats scale; raster ones do not</text>
  <text class="mpl-not-desc mpl-not-row mpl-not-r4" x="526" y="318">Most plots are for you, while exploring</text>
  <text class="mpl-not-sub" x="30" y="372">Most plots being for yourself is worth remembering, since it means speed matters more than polish for the great majority of charts you will produce.</text>
</svg>
