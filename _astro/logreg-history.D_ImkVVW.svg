<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From population growth to machine learning.">
  <title>Four steps to logistic regression</title>
  <style>
    .logreg-history-bg   { fill: #f8fafc; }
    .logreg-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logreg-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logreg-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logreg-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logreg-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logreg-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logreg-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .logreg-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .logreg-history-stage { opacity: 1; }

    .logreg-history-s0 { animation-delay: 0.00s; }
    .logreg-history-e0 { animation-delay: 0.00s; }
    .logreg-history-s1 { animation-delay: 1.28s; }
    .logreg-history-e1 { animation-delay: 1.28s; }
    .logreg-history-s2 { animation-delay: 2.56s; }
    .logreg-history-e2 { animation-delay: 2.56s; }
    .logreg-history-s3 { animation-delay: 3.84s; }
    .logreg-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .logreg-history-conn  { animation: logreg-history-trace 6.4s ease-in-out infinite; }
      .logreg-history-stage { animation: logreg-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes logreg-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes logreg-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .logreg-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .logreg-history-stage { animation: logreg-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes logreg-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="logreg-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="logreg-history-bg" width="980" height="322"/>
  <text class="logreg-history-h1"  x="30" y="40">Four steps to logistic regression</text>
  <text class="logreg-history-sub" x="30" y="64">From population growth to machine learning.</text>
  <g class="logreg-history-stage logreg-history-s0">
    <rect class="logreg-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-history-step" x="44" y="142">01</text>
    <text class="logreg-history-name" x="70" y="142">A curve for constrained population growth</text>
    <text class="logreg-history-desc" x="44" y="166">In the nineteenth century, with</text>
    <text class="logreg-history-desc" x="44" y="182">nothing to do with</text>
    <text class="logreg-history-desc" x="44" y="198">classification.</text>
  </g>
  <line class="logreg-history-line logreg-history-conn logreg-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#logreg-history-tip)"/>
  <g class="logreg-history-stage logreg-history-s1">
    <rect class="logreg-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-history-step" x="280" y="142">02</text>
    <text class="logreg-history-name" x="306" y="142">Formalised as the logit transformation</text>
    <text class="logreg-history-desc" x="280" y="166">For modelling proportions in</text>
    <text class="logreg-history-desc" x="280" y="182">statistics.</text>
  </g>
  <line class="logreg-history-line logreg-history-conn logreg-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#logreg-history-tip)"/>
  <g class="logreg-history-stage logreg-history-s2">
    <rect class="logreg-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-history-step" x="516" y="142">03</text>
    <text class="logreg-history-name" x="542" y="142">Adopted across medicine and economics</text>
    <text class="logreg-history-desc" x="516" y="166">Where interpretable coefficients</text>
    <text class="logreg-history-desc" x="516" y="182">were essential.</text>
  </g>
  <line class="logreg-history-line logreg-history-conn logreg-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#logreg-history-tip)"/>
  <g class="logreg-history-stage logreg-history-s3">
    <rect class="logreg-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-history-step" x="752" y="142">04</text>
    <text class="logreg-history-name" x="778" y="142">Then recognised as a one-layer neural network</text>
    <text class="logreg-history-desc" x="752" y="166">Which is where the field</text>
    <text class="logreg-history-desc" x="752" y="182">rejoined it.</text>
  </g>
  <text class="logreg-history-sub" x="30" y="304">A curve invented to model bounded growth turned out to be exactly the shape needed to bound a linear predictor, which is a recurring kind of accident in this field.</text>
</svg>
