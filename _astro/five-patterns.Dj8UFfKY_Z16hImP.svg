<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which cover almost everything.">
  <title>Five iteration patterns</title>
  <style>
    .five-patterns-bg   { fill: #f8fafc; }
    .five-patterns-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-patterns-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-patterns-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-patterns-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-patterns-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-patterns-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .five-patterns-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .five-patterns-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .five-patterns-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .five-patterns-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .five-patterns-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .five-patterns-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .five-patterns-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .five-patterns-stage { opacity: 1; }

    .five-patterns-s0 { animation-delay: 0.00s; }
    .five-patterns-e0 { animation-delay: 0.00s; }
    .five-patterns-s1 { animation-delay: 1.33s; }
    .five-patterns-e1 { animation-delay: 1.33s; }
    .five-patterns-s2 { animation-delay: 2.67s; }
    .five-patterns-e2 { animation-delay: 2.67s; }
    .five-patterns-s3 { animation-delay: 4.00s; }
    .five-patterns-e3 { animation-delay: 4.00s; }
    .five-patterns-s4 { animation-delay: 5.33s; }
    .five-patterns-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .five-patterns-conn  { animation: five-patterns-trace 8s ease-in-out infinite; }
      .five-patterns-stage { animation: five-patterns-arrive 8s ease-in-out infinite; }
    }
    @keyframes five-patterns-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes five-patterns-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .five-patterns-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .five-patterns-stage { animation: five-patterns-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes five-patterns-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="five-patterns-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="five-patterns-bg" width="980" height="322"/>
  <text class="five-patterns-h1"  x="30" y="40">Five iteration patterns</text>
  <text class="five-patterns-sub" x="30" y="64">Which cover almost everything.</text>
  <g class="five-patterns-stage five-patterns-s0">
    <rect class="five-patterns-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="five-patterns-step" x="44" y="142">01</text>
    <text class="five-patterns-name" x="70" y="142">Transform: one output per input</text>
    <text class="five-patterns-desc" x="44" y="166">Which a comprehension</text>
    <text class="five-patterns-desc" x="44" y="182">expresses better.</text>
  </g>
  <line class="five-patterns-line five-patterns-conn five-patterns-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#five-patterns-tip)"/>
  <g class="five-patterns-stage five-patterns-s1">
    <rect class="five-patterns-good" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="five-patterns-step" x="233" y="142">02</text>
    <text class="five-patterns-name" x="259" y="142">Filter: keep some inputs</text>
    <text class="five-patterns-desc" x="233" y="166">Also a comprehension.</text>
  </g>
  <line class="five-patterns-line five-patterns-conn five-patterns-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#five-patterns-tip)"/>
  <g class="five-patterns-stage five-patterns-s2">
    <rect class="five-patterns-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="five-patterns-step" x="422" y="142">03</text>
    <text class="five-patterns-name" x="448" y="142">Accumulate: fold into a single value</text>
    <text class="five-patterns-desc" x="422" y="166">Sum, maximum, count.</text>
  </g>
  <line class="five-patterns-line five-patterns-conn five-patterns-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#five-patterns-tip)"/>
  <g class="five-patterns-stage five-patterns-s3">
    <rect class="five-patterns-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="five-patterns-step" x="611" y="142">04</text>
    <text class="five-patterns-name" x="637" y="142">Search: stop at the first match</text>
    <text class="five-patterns-desc" x="611" y="166">Which is where break</text>
    <text class="five-patterns-desc" x="611" y="182">belongs.</text>
  </g>
  <line class="five-patterns-line five-patterns-conn five-patterns-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#five-patterns-tip)"/>
  <g class="five-patterns-stage five-patterns-s4">
    <rect class="five-patterns-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="five-patterns-step" x="800" y="142">05</text>
    <text class="five-patterns-name" x="826" y="142">And pairwise: consider adjacent items</text>
    <text class="five-patterns-desc" x="800" y="166">Which needs care at the</text>
    <text class="five-patterns-desc" x="800" y="182">boundaries.</text>
  </g>
  <text class="five-patterns-sub" x="30" y="304">Recognising which pattern you are writing usually reveals a clearer form for it, and the first two are almost always better as comprehensions.</text>
</svg>
