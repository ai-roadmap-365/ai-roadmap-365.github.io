<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rather than merely accurately.">
  <title>Grouping customers usefully</title>
  <style>
    .market-stall-bg   { fill: #f8fafc; }
    .market-stall-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .market-stall-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .market-stall-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .market-stall-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .market-stall-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .market-stall-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .market-stall-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .market-stall-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .market-stall-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .market-stall-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .market-stall-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .market-stall-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .market-stall-row { opacity: 1; }
    .market-stall-r0 { animation-delay: 0.00s; }
    .market-stall-r1 { animation-delay: 0.45s; }
    .market-stall-r2 { animation-delay: 0.90s; }
    .market-stall-r3 { animation-delay: 1.35s; }
    .market-stall-r4 { animation-delay: 1.80s; }
    .market-stall-row { animation: market-stall-reveal 7.3s ease-in-out infinite; }
    @keyframes market-stall-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="market-stall-bg" width="980" height="390"/>
  <text class="market-stall-h1"  x="30" y="40">Grouping customers usefully</text>
  <text class="market-stall-sub" x="30" y="64">Rather than merely accurately.</text>
  <rect class="market-stall-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="market-stall-name" x="46" y="122">Statistically clean</text>
  <text class="market-stall-desc" x="46" y="142">Well separated.</text>
  <text class="market-stall-desc market-stall-row market-stall-r0" x="46" y="182">Optimal by every cluster metric</text>
  <text class="market-stall-desc market-stall-row market-stall-r1" x="46" y="216">Fourteen distinct segments</text>
  <text class="market-stall-desc market-stall-row market-stall-r2" x="46" y="250">Described by factor loadings</text>
  <text class="market-stall-desc market-stall-row market-stall-r3" x="46" y="284">Nobody knows what to do with them</text>
  <text class="market-stall-desc market-stall-row market-stall-r4" x="46" y="318">This is clustering as an end</text>
  <rect class="market-stall-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="market-stall-name" x="526" y="122">Operationally useful</text>
  <text class="market-stall-desc" x="526" y="142">Actionable.</text>
  <text class="market-stall-desc market-stall-row market-stall-r0" x="526" y="182">Slightly worse by every metric</text>
  <text class="market-stall-desc market-stall-row market-stall-r1" x="526" y="216">Five segments</text>
  <text class="market-stall-desc market-stall-row market-stall-r2" x="526" y="250">Described in a sentence each</text>
  <text class="market-stall-desc market-stall-row market-stall-r3" x="526" y="284">Each has a different campaign</text>
  <text class="market-stall-desc market-stall-row market-stall-r4" x="526" y="318">This is segmentation as a means</text>
  <text class="market-stall-sub" x="30" y="372">Accepting a worse metric for a usable result is the correct trade here, and it is the point at which statistical and business judgment have to meet.</text>
</svg>
