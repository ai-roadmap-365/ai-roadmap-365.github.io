<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And when each fits.">
  <title>Three distance metrics</title>
  <style>
    .distance-metrics-bg   { fill: #f8fafc; }
    .distance-metrics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-metrics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-metrics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-metrics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-metrics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-metrics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distance-metrics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distance-metrics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distance-metrics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distance-metrics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distance-metrics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distance-metrics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .distance-metrics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .distance-metrics-stage { opacity: 1; }

    .distance-metrics-s0 { animation-delay: 0.00s; }
    .distance-metrics-e0 { animation-delay: 0.00s; }
    .distance-metrics-s1 { animation-delay: 1.50s; }
    .distance-metrics-e1 { animation-delay: 1.50s; }
    .distance-metrics-s2 { animation-delay: 3.00s; }
    .distance-metrics-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .distance-metrics-conn  { animation: distance-metrics-trace 6s ease-in-out infinite; }
      .distance-metrics-stage { animation: distance-metrics-arrive 6s ease-in-out infinite; }
    }
    @keyframes distance-metrics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes distance-metrics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .distance-metrics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .distance-metrics-stage { animation: distance-metrics-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes distance-metrics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="distance-metrics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="distance-metrics-bg" width="980" height="322"/>
  <text class="distance-metrics-h1"  x="30" y="40">Three distance metrics</text>
  <text class="distance-metrics-sub" x="30" y="64">And when each fits.</text>
  <g class="distance-metrics-stage distance-metrics-s0">
    <rect class="distance-metrics-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="distance-metrics-step" x="44" y="142">01</text>
    <text class="distance-metrics-name" x="70" y="142">Straight-line distance</text>
    <text class="distance-metrics-desc" x="44" y="166">The default, and sensitive to scale and</text>
    <text class="distance-metrics-desc" x="44" y="182">dimension.</text>
  </g>
  <line class="distance-metrics-line distance-metrics-conn distance-metrics-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#distance-metrics-tip)"/>
  <g class="distance-metrics-stage distance-metrics-s1">
    <rect class="distance-metrics-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="distance-metrics-step" x="359" y="142">02</text>
    <text class="distance-metrics-name" x="385" y="142">Sum of absolute differences</text>
    <text class="distance-metrics-desc" x="359" y="166">More robust to outliers, and better in high</text>
    <text class="distance-metrics-desc" x="359" y="182">dimensions.</text>
  </g>
  <line class="distance-metrics-line distance-metrics-conn distance-metrics-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#distance-metrics-tip)"/>
  <g class="distance-metrics-stage distance-metrics-s2">
    <rect class="distance-metrics-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="distance-metrics-step" x="674" y="142">03</text>
    <text class="distance-metrics-name" x="700" y="142">Angle between vectors</text>
    <text class="distance-metrics-desc" x="674" y="166">Ignores magnitude entirely. The choice for</text>
    <text class="distance-metrics-desc" x="674" y="182">text.</text>
    <text class="distance-metrics-edge" x="674" y="242">direction only</text>
  </g>
  <text class="distance-metrics-sub" x="30" y="304">Cosine distance ignoring magnitude is exactly what makes it right for text, where a long document and a short one on the same topic should count as close.</text>
</svg>
