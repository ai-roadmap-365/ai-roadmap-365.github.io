<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" role="img" aria-label="Exact versus IVF Search showing a query compared against every vector in exact search, against centroids then a subset of lists in IVF, and the neighbour missed when it sits in an unprobed list">
  <title>Exact versus IVF Search</title>
  <defs>
    <style>
      .d326a-bg { fill: #f8fafc; }
      .d326a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d326a-probed { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d326a-skipped { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2px; stroke-dasharray: 4 3; }
      .d326a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d326a-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d326a-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d326a-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d326a-miss { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
      .d326a-dot { fill: #64748b; }
      .d326a-hit { fill: #16a34a; }
      .d326a-lost { fill: #ef4444; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d326a-bg"/>
  <text x="40" y="40" class="d326a-title">Exact versus IVF Search</text>
  <text x="40" y="64" class="d326a-sub">Approximate search is not a faster algorithm. It is the same algorithm over fewer vectors — and the ones it skips sometimes matter.</text>

  <rect x="40" y="95" width="380" height="230" rx="8" class="d326a-panel"/>
  <text x="230" y="124" class="d326a-h" text-anchor="middle">Exact — compare against all 2,000</text>
  <g class="d326a-dot">
    <circle cx="90" cy="160" r="4"/><circle cx="130" cy="180" r="4"/><circle cx="170" cy="155" r="4"/>
    <circle cx="210" cy="195" r="4"/><circle cx="250" cy="165" r="4"/><circle cx="290" cy="185" r="4"/>
    <circle cx="330" cy="160" r="4"/><circle cx="110" cy="230" r="4"/><circle cx="150" cy="250" r="4"/>
    <circle cx="190" cy="225" r="4"/><circle cx="270" cy="245" r="4"/><circle cx="310" cy="230" r="4"/>
  </g>
  <circle cx="230" cy="205" r="6" class="d326a-hit"/>
  <text x="230" y="290" class="d326a-t" text-anchor="middle">40,000 comparisons. Recall 1.00.</text>
  <text x="230" y="308" class="d326a-t" text-anchor="middle">Cannot be wrong. Cannot be fast.</text>

  <rect x="470" y="95" width="390" height="230" rx="8" class="d326a-panel"/>
  <text x="665" y="124" class="d326a-h" text-anchor="middle">IVF, nprobe=1 — compare against one list</text>

  <rect x="495" y="140" width="110" height="80" rx="6" class="d326a-probed"/>
  <text x="550" y="160" class="d326a-t" text-anchor="middle">probed list</text>
  <g class="d326a-dot"><circle cx="520" cy="185" r="4"/><circle cx="555" cy="200" r="4"/><circle cx="585" cy="180" r="4"/></g>
  <circle cx="545" cy="172" r="6" class="d326a-hit"/>

  <rect x="625" y="140" width="105" height="80" rx="6" class="d326a-skipped"/>
  <text x="677" y="160" class="d326a-t" text-anchor="middle">skipped</text>
  <g class="d326a-dot"><circle cx="650" cy="185" r="4"/><circle cx="685" cy="200" r="4"/><circle cx="710" cy="180" r="4"/></g>
  <circle cx="672" cy="172" r="6" class="d326a-lost"/>

  <rect x="750" y="140" width="90" height="80" rx="6" class="d326a-skipped"/>
  <text x="795" y="160" class="d326a-t" text-anchor="middle">skipped</text>
  <g class="d326a-dot"><circle cx="775" cy="185" r="4"/><circle cx="810" cy="200" r="4"/></g>

  <text x="665" y="252" class="d326a-miss" text-anchor="middle">The red neighbour is in a list you did not probe.</text>
  <text x="665" y="272" class="d326a-miss" text-anchor="middle">It is not down-ranked. It is ABSENT.</text>
  <text x="665" y="296" class="d326a-t" text-anchor="middle">6,192 comparisons. Recall 0.81. 6.5x cheaper.</text>

  <text x="40" y="370" class="d326a-h">Why a reranker cannot save you here</text>
  <text x="40" y="392" class="d326a-t">A reranker reorders candidates. A document the index never returned was never a candidate, so no amount of downstream</text>
  <text x="40" y="412" class="d326a-t">cleverness recovers it. That is why recall matters more than precision at the retrieval stage.</text>
  <text x="40" y="436" class="d326a-t">Probing every list reaches recall 1.00 — and costs 40,160 comparisons, MORE than exact search's 40,000.</text>
</svg>
