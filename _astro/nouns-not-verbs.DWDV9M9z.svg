<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="Paths name things. Methods name actions.">
  <title>The one rule that makes an API guessable</title>
  <style>
    .nouns-not-verbs-bg   { fill: #f8fafc; }
    .nouns-not-verbs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nouns-not-verbs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nouns-not-verbs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nouns-not-verbs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nouns-not-verbs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nouns-not-verbs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nouns-not-verbs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nouns-not-verbs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nouns-not-verbs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nouns-not-verbs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nouns-not-verbs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nouns-not-verbs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nouns-not-verbs-row { opacity: 1; }
    .nouns-not-verbs-r0 { animation-delay: 0.00s; }
    .nouns-not-verbs-r1 { animation-delay: 0.45s; }
    .nouns-not-verbs-r2 { animation-delay: 0.90s; }
    .nouns-not-verbs-r3 { animation-delay: 1.35s; }
    .nouns-not-verbs-r4 { animation-delay: 1.80s; }
    .nouns-not-verbs-r5 { animation-delay: 2.25s; }
    .nouns-not-verbs-row { animation: nouns-not-verbs-reveal 7.7s ease-in-out infinite; }
    @keyframes nouns-not-verbs-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nouns-not-verbs-bg" width="980" height="424"/>
  <text class="nouns-not-verbs-h1"  x="30" y="40">The one rule that makes an API guessable</text>
  <text class="nouns-not-verbs-sub" x="30" y="64">Paths name things. Methods name actions.</text>
  <rect class="nouns-not-verbs-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nouns-not-verbs-name" x="46" y="122">Verbs in the path</text>
  <text class="nouns-not-verbs-desc" x="46" y="142">A bespoke vocabulary.</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r0" x="46" y="182">/getUser, /createUser, /deleteUser</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r1" x="46" y="216">/users/1/delete, /orders/listAll</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r2" x="46" y="250">Every operation is a new name to learn</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r3" x="46" y="284">Nothing is guessable</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r4" x="46" y="318">HTTP methods carry no meaning</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r5" x="46" y="352">Caches and proxies cannot help</text>
  <rect class="nouns-not-verbs-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nouns-not-verbs-name" x="526" y="122">Nouns in the path</text>
  <text class="nouns-not-verbs-desc" x="526" y="142">One pattern, applied everywhere.</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r0" x="526" y="182">/users and /users/1</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r1" x="526" y="216">GET, POST, PUT, PATCH, DELETE</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r2" x="526" y="250">Learn the pattern once</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r3" x="526" y="284">Guess correctly before reading the docs</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r4" x="526" y="318">The method IS the operation</text>
  <text class="nouns-not-verbs-desc nouns-not-verbs-row nouns-not-verbs-r5" x="526" y="352">GET is cacheable for free</text>
  <text class="nouns-not-verbs-sub" x="30" y="406">If an operation genuinely resists this, it probably deserves to be a resource of its own — a job, a run, a search — rather than a verb bolted onto someone else's path.</text>
</svg>
