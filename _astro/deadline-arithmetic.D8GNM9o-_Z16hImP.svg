<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The only calculation that matters in week 51.">
  <title>Working backwards from the deadline</title>
  <style>
    .deadline-arithmetic-bg   { fill: #f8fafc; }
    .deadline-arithmetic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deadline-arithmetic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deadline-arithmetic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deadline-arithmetic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deadline-arithmetic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deadline-arithmetic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deadline-arithmetic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deadline-arithmetic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deadline-arithmetic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deadline-arithmetic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deadline-arithmetic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deadline-arithmetic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deadline-arithmetic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deadline-arithmetic-stage { opacity: 1; }

    .deadline-arithmetic-s0 { animation-delay: 0.00s; }
    .deadline-arithmetic-e0 { animation-delay: 0.00s; }
    .deadline-arithmetic-s1 { animation-delay: 1.28s; }
    .deadline-arithmetic-e1 { animation-delay: 1.28s; }
    .deadline-arithmetic-s2 { animation-delay: 2.56s; }
    .deadline-arithmetic-e2 { animation-delay: 2.56s; }
    .deadline-arithmetic-s3 { animation-delay: 3.84s; }
    .deadline-arithmetic-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .deadline-arithmetic-conn  { animation: deadline-arithmetic-trace 6.4s ease-in-out infinite; }
      .deadline-arithmetic-stage { animation: deadline-arithmetic-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes deadline-arithmetic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deadline-arithmetic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deadline-arithmetic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deadline-arithmetic-stage { animation: deadline-arithmetic-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deadline-arithmetic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deadline-arithmetic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deadline-arithmetic-bg" width="980" height="322"/>
  <text class="deadline-arithmetic-h1"  x="30" y="40">Working backwards from the deadline</text>
  <text class="deadline-arithmetic-sub" x="30" y="64">The only calculation that matters in week 51.</text>
  <g class="deadline-arithmetic-stage deadline-arithmetic-s0">
    <rect class="deadline-arithmetic-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="deadline-arithmetic-step" x="44" y="142">01</text>
    <text class="deadline-arithmetic-name" x="70" y="142">The delivery date</text>
    <text class="deadline-arithmetic-desc" x="44" y="166">Fixed. Everything else is</text>
    <text class="deadline-arithmetic-desc" x="44" y="182">negotiable; this is not.</text>
    <text class="deadline-arithmetic-edge" x="44" y="242">fixed</text>
  </g>
  <line class="deadline-arithmetic-line deadline-arithmetic-conn deadline-arithmetic-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#deadline-arithmetic-tip)"/>
  <g class="deadline-arithmetic-stage deadline-arithmetic-s1">
    <rect class="deadline-arithmetic-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="deadline-arithmetic-step" x="280" y="142">02</text>
    <text class="deadline-arithmetic-name" x="306" y="142">Minus documentation and demo</text>
    <text class="deadline-arithmetic-desc" x="280" y="166">Two days, realistically. They</text>
    <text class="deadline-arithmetic-desc" x="280" y="182">are not optional and never take</text>
    <text class="deadline-arithmetic-desc" x="280" y="198">zero.</text>
    <text class="deadline-arithmetic-edge" x="280" y="242">-2d</text>
  </g>
  <line class="deadline-arithmetic-line deadline-arithmetic-conn deadline-arithmetic-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#deadline-arithmetic-tip)"/>
  <g class="deadline-arithmetic-stage deadline-arithmetic-s2">
    <rect class="deadline-arithmetic-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="deadline-arithmetic-step" x="516" y="142">03</text>
    <text class="deadline-arithmetic-name" x="542" y="142">Minus a freeze</text>
    <text class="deadline-arithmetic-desc" x="516" y="166">One day of no changes, to find</text>
    <text class="deadline-arithmetic-desc" x="516" y="182">what the last change broke.</text>
    <text class="deadline-arithmetic-edge" x="516" y="242">-1d</text>
  </g>
  <line class="deadline-arithmetic-line deadline-arithmetic-conn deadline-arithmetic-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#deadline-arithmetic-tip)"/>
  <g class="deadline-arithmetic-stage deadline-arithmetic-s3">
    <rect class="deadline-arithmetic-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="deadline-arithmetic-step" x="752" y="142">04</text>
    <text class="deadline-arithmetic-name" x="778" y="142">What is left is your feature budget</text>
    <text class="deadline-arithmetic-desc" x="752" y="166">Usually about half what the plan</text>
    <text class="deadline-arithmetic-desc" x="752" y="182">assumed.</text>
    <text class="deadline-arithmetic-edge" x="752" y="242">the truth</text>
  </g>
  <text class="deadline-arithmetic-sub" x="30" y="304">Almost every capstone that misses its deadline does so because this arithmetic was never done — the freeze and the documentation were assumed to fit into time that had already been spent.</text>
</svg>
