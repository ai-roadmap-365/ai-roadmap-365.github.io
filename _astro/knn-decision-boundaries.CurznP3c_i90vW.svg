<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="KNN Decision Boundaries Comparison">
  <title>k-Nearest Neighbors Decision Boundaries: k=1 vs k=15</title>
  <defs>
    <style>
      .d157a-bg { fill: #f8fafc; }
      .d157a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d157a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d157a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
      .d157a-math { fill: #0f172a; font-family: "Courier New", monospace; font-size: 14px; font-weight: 600; }
      .d157a-c0 { fill: #ef4444; }
      .d157a-c1 { fill: #3b82f6; }
      .d157a-bound1 { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 4 2; }
      .d157a-bound15 { stroke: #2563eb; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d157a-bg" />

  <text x="40" y="45" class="d157a-header" font-size="22">k-Nearest Neighbors: Bias-Variance in Decision Space</text>
  <text x="40" y="70" class="d157a-text">Contrasting 1-NN (high variance, jagged Voronoi) with 15-NN (smooth, regularized)</text>

  <!-- Panel 1: k=1 -->
  <rect x="40" y="100" width="390" height="340" class="d157a-card" />
  <text x="60" y="130" class="d157a-header" font-size="16" fill="#dc2626">1. 1-NN (Overfitting / High Variance)</text>
  <text x="60" y="155" class="d157a-math">k = 1: Voronoi Tessellation</text>
  <text x="60" y="175" class="d157a-text" font-size="12" fill="#64748b">Training error = 0% | Sensitive to single outliers</text>

  <!-- Jagged boundary lines -->
  <path d="M 80 280 L 160 260 L 200 320 L 280 240 L 340 310 L 400 270" class="d157a-bound1" />
  <circle cx="200" cy="220" r="25" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="2 2" />

  <!-- Data points -->
  <circle cx="120" cy="330" r="6" class="d157a-c0" />
  <circle cx="180" cy="350" r="6" class="d157a-c0" />
  <circle cx="260" cy="330" r="6" class="d157a-c0" />
  <circle cx="200" cy="220" r="6" class="d157a-c0" /> <!-- Outlier island -->

  <circle cx="140" cy="220" r="6" class="d157a-c1" />
  <circle cx="240" cy="200" r="6" class="d157a-c1" />
  <circle cx="320" cy="230" r="6" class="d157a-c1" />
  <circle cx="360" cy="180" r="6" class="d157a-c1" />

  <text x="70" y="415" class="d157a-text" font-size="12" fill="#b91c1c">Outlier creates an isolated classification island</text>

  <!-- Panel 2: k=15 -->
  <rect x="470" y="100" width="390" height="340" class="d157a-card" />
  <text x="490" y="130" class="d157a-header" font-size="16" fill="#1d4ed8">2. 15-NN (Smooth / Balanced Variance)</text>
  <text x="490" y="155" class="d157a-math">k = 15: Neighborhood Majority Voting</text>
  <text x="490" y="175" class="d157a-text" font-size="12" fill="#64748b">Outliers outvoted | Smooth global separation</text>

  <!-- Smooth boundary line -->
  <path d="M 510 270 Q 640 290 700 240 T 830 220" class="d157a-bound15" />

  <!-- Data points -->
  <circle cx="550" cy="330" r="6" class="d157a-c0" />
  <circle cx="610" cy="350" r="6" class="d157a-c0" />
  <circle cx="690" cy="330" r="6" class="d157a-c0" />
  <circle cx="630" cy="220" r="6" class="d157a-c0" /> <!-- Outlier outvoted -->

  <circle cx="570" cy="220" r="6" class="d157a-c1" />
  <circle cx="670" cy="200" r="6" class="d157a-c1" />
  <circle cx="750" cy="230" r="6" class="d157a-c1" />
  <circle cx="790" cy="180" r="6" class="d157a-c1" />

  <text x="500" y="415" class="d157a-text" font-size="12" fill="#1e40af">Smooth boundary ignores isolated noise</text>
</svg>
