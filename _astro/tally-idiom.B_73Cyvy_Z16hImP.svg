<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The single most useful idiom on the command line.">
  <title>sort | uniq -c | sort -rn</title>
  <style>
    .tally-idiom-bg   { fill: #f8fafc; }
    .tally-idiom-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tally-idiom-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tally-idiom-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tally-idiom-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tally-idiom-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tally-idiom-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tally-idiom-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tally-idiom-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tally-idiom-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tally-idiom-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tally-idiom-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tally-idiom-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tally-idiom-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tally-idiom-stage { opacity: 1; }

    .tally-idiom-s0 { animation-delay: 0.00s; }
    .tally-idiom-e0 { animation-delay: 0.00s; }
    .tally-idiom-s1 { animation-delay: 1.28s; }
    .tally-idiom-e1 { animation-delay: 1.28s; }
    .tally-idiom-s2 { animation-delay: 2.56s; }
    .tally-idiom-e2 { animation-delay: 2.56s; }
    .tally-idiom-s3 { animation-delay: 3.84s; }
    .tally-idiom-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tally-idiom-conn  { animation: tally-idiom-trace 6.4s ease-in-out infinite; }
      .tally-idiom-stage { animation: tally-idiom-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tally-idiom-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tally-idiom-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tally-idiom-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tally-idiom-stage { animation: tally-idiom-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tally-idiom-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tally-idiom-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tally-idiom-bg" width="980" height="322"/>
  <text class="tally-idiom-h1"  x="30" y="40">sort | uniq -c | sort -rn</text>
  <text class="tally-idiom-sub" x="30" y="64">The single most useful idiom on the command line.</text>
  <g class="tally-idiom-stage tally-idiom-s0">
    <rect class="tally-idiom-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tally-idiom-step" x="44" y="142">01</text>
    <text class="tally-idiom-name" x="70" y="142">Extract the column</text>
    <text class="tally-idiom-desc" x="44" y="166">cut -d' ' -f1 — one value per</text>
    <text class="tally-idiom-desc" x="44" y="182">line, unsorted.</text>
    <text class="tally-idiom-edge" x="44" y="242">cut</text>
  </g>
  <line class="tally-idiom-line tally-idiom-conn tally-idiom-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tally-idiom-tip)"/>
  <g class="tally-idiom-stage tally-idiom-s1">
    <rect class="tally-idiom-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tally-idiom-step" x="280" y="142">02</text>
    <text class="tally-idiom-name" x="306" y="142">sort</text>
    <text class="tally-idiom-desc" x="280" y="166">Identical values become</text>
    <text class="tally-idiom-desc" x="280" y="182">adjacent. This step is not</text>
    <text class="tally-idiom-desc" x="280" y="198">optional.</text>
    <text class="tally-idiom-edge" x="280" y="242">sort</text>
  </g>
  <line class="tally-idiom-line tally-idiom-conn tally-idiom-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tally-idiom-tip)"/>
  <g class="tally-idiom-stage tally-idiom-s2">
    <rect class="tally-idiom-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tally-idiom-step" x="516" y="142">03</text>
    <text class="tally-idiom-name" x="542" y="142">uniq -c</text>
    <text class="tally-idiom-desc" x="516" y="166">Collapses each RUN into one line</text>
    <text class="tally-idiom-desc" x="516" y="182">with its count. Only adjacent</text>
    <text class="tally-idiom-desc" x="516" y="198">lines.</text>
    <text class="tally-idiom-edge" x="516" y="242">uniq -c</text>
  </g>
  <line class="tally-idiom-line tally-idiom-conn tally-idiom-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tally-idiom-tip)"/>
  <g class="tally-idiom-stage tally-idiom-s3">
    <rect class="tally-idiom-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tally-idiom-step" x="752" y="142">04</text>
    <text class="tally-idiom-name" x="778" y="142">sort -rn</text>
    <text class="tally-idiom-desc" x="752" y="166">Numeric, reversed. The biggest</text>
    <text class="tally-idiom-desc" x="752" y="182">count is now first.</text>
    <text class="tally-idiom-edge" x="752" y="242">sort -rn</text>
  </g>
  <text class="tally-idiom-sub" x="30" y="304">uniq only sees adjacent lines. Forgetting the first sort is the most common mistake with this idiom, and it fails quietly with plausible-looking wrong numbers.</text>
</svg>
