<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what you need.">
  <title>Which clustering method when</title>
  <style>
    .cluster-when-bg   { fill: #f8fafc; }
    .cluster-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cluster-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cluster-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cluster-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cluster-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cluster-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cluster-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cluster-when-row { opacity: 1; }
    .cluster-when-r0 { animation-delay: 0.00s; }
    .cluster-when-r1 { animation-delay: 0.45s; }
    .cluster-when-r2 { animation-delay: 0.90s; }
    .cluster-when-r3 { animation-delay: 1.35s; }
    .cluster-when-r4 { animation-delay: 1.80s; }
    .cluster-when-row { animation: cluster-when-reveal 7.3s ease-in-out infinite; }
    @keyframes cluster-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cluster-when-bg" width="980" height="390"/>
  <text class="cluster-when-h1"  x="30" y="40">Which clustering method when</text>
  <text class="cluster-when-sub" x="30" y="64">By what you need.</text>
  <rect class="cluster-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cluster-when-name" x="46" y="122">The requirement</text>
  <text class="cluster-when-desc" x="46" y="142">What you need.</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r0" x="46" y="182">Speed on very large data</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r1" x="46" y="216">Arbitrary cluster shapes</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r2" x="46" y="250">Outliers identified, not absorbed</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r3" x="46" y="284">A hierarchy to explore</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r4" x="46" y="318">Clusters of differing density</text>
  <rect class="cluster-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cluster-when-name" x="526" y="122">The method</text>
  <text class="cluster-when-desc" x="526" y="142">What to use.</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r0" x="526" y="182">K-means, with careful seeding</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r1" x="526" y="216">Density-based</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r2" x="526" y="250">Density-based, which labels noise</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r3" x="526" y="284">Agglomerative, with Ward linkage</text>
  <text class="cluster-when-desc cluster-when-row cluster-when-r4" x="526" y="318">Hierarchical density-based</text>
  <text class="cluster-when-sub" x="30" y="372">The last row is the most capable general choice and the one to reach for when nothing about the data is known in advance.</text>
</svg>
