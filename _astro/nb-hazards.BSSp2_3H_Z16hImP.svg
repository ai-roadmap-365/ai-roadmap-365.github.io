<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four hazards.">
  <title>Where notebooks go wrong</title>
  <style>
    .nb-hazards-bg   { fill: #f8fafc; }
    .nb-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nb-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nb-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nb-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nb-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nb-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nb-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nb-hazards-stage { opacity: 1; }

    .nb-hazards-s0 { animation-delay: 0.00s; }
    .nb-hazards-e0 { animation-delay: 0.00s; }
    .nb-hazards-s1 { animation-delay: 1.28s; }
    .nb-hazards-e1 { animation-delay: 1.28s; }
    .nb-hazards-s2 { animation-delay: 2.56s; }
    .nb-hazards-e2 { animation-delay: 2.56s; }
    .nb-hazards-s3 { animation-delay: 3.84s; }
    .nb-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nb-hazards-conn  { animation: nb-hazards-trace 6.4s ease-in-out infinite; }
      .nb-hazards-stage { animation: nb-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nb-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nb-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nb-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nb-hazards-stage { animation: nb-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nb-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nb-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nb-hazards-bg" width="980" height="322"/>
  <text class="nb-hazards-h1"  x="30" y="40">Where notebooks go wrong</text>
  <text class="nb-hazards-sub" x="30" y="64">Four hazards.</text>
  <g class="nb-hazards-stage nb-hazards-s0">
    <rect class="nb-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nb-hazards-step" x="44" y="142">01</text>
    <text class="nb-hazards-name" x="70" y="142">Cells run out of order, then edited</text>
    <text class="nb-hazards-desc" x="44" y="166">So the visible code never</text>
    <text class="nb-hazards-desc" x="44" y="182">produced the output.</text>
  </g>
  <line class="nb-hazards-line nb-hazards-conn nb-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nb-hazards-tip)"/>
  <g class="nb-hazards-stage nb-hazards-s1">
    <rect class="nb-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nb-hazards-step" x="280" y="142">02</text>
    <text class="nb-hazards-name" x="306" y="142">Variables surviving from deleted cells</text>
    <text class="nb-hazards-desc" x="280" y="166">Which exist only in that</text>
    <text class="nb-hazards-desc" x="280" y="182">session.</text>
  </g>
  <line class="nb-hazards-line nb-hazards-conn nb-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nb-hazards-tip)"/>
  <g class="nb-hazards-stage nb-hazards-s2">
    <rect class="nb-hazards-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nb-hazards-step" x="516" y="142">03</text>
    <text class="nb-hazards-name" x="542" y="142">Absolute paths to one machine's filesystem</text>
    <text class="nb-hazards-desc" x="516" y="166">Which nobody else has.</text>
  </g>
  <line class="nb-hazards-line nb-hazards-conn nb-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nb-hazards-tip)"/>
  <g class="nb-hazards-stage nb-hazards-s3">
    <rect class="nb-hazards-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nb-hazards-step" x="752" y="142">04</text>
    <text class="nb-hazards-name" x="778" y="142">And library versions unrecorded</text>
    <text class="nb-hazards-desc" x="752" y="166">So behaviour changes silently</text>
    <text class="nb-hazards-desc" x="752" y="182">over time.</text>
  </g>
  <text class="nb-hazards-sub" x="30" y="304">The visible code never having produced the visible output is the deepest problem with notebooks, and it is invisible to anyone reading the file.</text>
</svg>
