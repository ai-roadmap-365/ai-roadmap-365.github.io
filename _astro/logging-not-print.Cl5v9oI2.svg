<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The moment nobody is watching.">
  <title>When print should become logging</title>
  <style>
    .logging-not-print-bg   { fill: #f8fafc; }
    .logging-not-print-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-print-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-print-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-print-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-print-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-print-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-not-print-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logging-not-print-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logging-not-print-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logging-not-print-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logging-not-print-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logging-not-print-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-not-print-row { opacity: 1; }
    .logging-not-print-r0 { animation-delay: 0.00s; }
    .logging-not-print-r1 { animation-delay: 0.45s; }
    .logging-not-print-r2 { animation-delay: 0.90s; }
    .logging-not-print-r3 { animation-delay: 1.35s; }
    .logging-not-print-r4 { animation-delay: 1.80s; }
    .logging-not-print-row { animation: logging-not-print-reveal 7.3s ease-in-out infinite; }
    @keyframes logging-not-print-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="logging-not-print-bg" width="980" height="390"/>
  <text class="logging-not-print-h1"  x="30" y="40">When print should become logging</text>
  <text class="logging-not-print-sub" x="30" y="64">The moment nobody is watching.</text>
  <rect class="logging-not-print-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="logging-not-print-name" x="46" y="122">print</text>
  <text class="logging-not-print-desc" x="46" y="142">Fine while you are watching.</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r0" x="46" y="182">One destination, chosen per call</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r1" x="46" y="216">No levels — everything or nothing</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r2" x="46" y="250">No timestamps unless you add them</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r3" x="46" y="284">Removing debug output means editing code</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r4" x="46" y="318">Perfect for a script you run by hand</text>
  <rect class="logging-not-print-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="logging-not-print-name" x="526" y="122">logging</text>
  <text class="logging-not-print-desc" x="526" y="142">For anything unattended.</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r0" x="526" y="182">Levels: DEBUG through CRITICAL</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r1" x="526" y="216">Filter at runtime without editing</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r2" x="526" y="250">Timestamps and module names for free</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r3" x="526" y="284">Destinations configured once, centrally</text>
  <text class="logging-not-print-desc logging-not-print-row logging-not-print-r4" x="526" y="318">Day 40's structured logs start here</text>
  <text class="logging-not-print-sub" x="30" y="372">The signal to switch is Day 14's: a job that runs on a schedule fails silently, and a log with levels and timestamps is what turns that from a mystery into a line you can read at 3am.</text>
</svg>
