<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A small distinction that wastes real time.">
  <title>$SHELL is not the shell you are in</title>
  <style>
    .shell-versus-running-shell-bg   { fill: #f8fafc; }
    .shell-versus-running-shell-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-running-shell-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-running-shell-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-running-shell-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-running-shell-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-running-shell-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-versus-running-shell-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shell-versus-running-shell-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shell-versus-running-shell-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shell-versus-running-shell-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shell-versus-running-shell-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shell-versus-running-shell-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-versus-running-shell-row { opacity: 1; }
    .shell-versus-running-shell-r0 { animation-delay: 0.00s; }
    .shell-versus-running-shell-r1 { animation-delay: 0.45s; }
    .shell-versus-running-shell-r2 { animation-delay: 0.90s; }
    .shell-versus-running-shell-r3 { animation-delay: 1.35s; }
    .shell-versus-running-shell-r4 { animation-delay: 1.80s; }
    .shell-versus-running-shell-row { animation: shell-versus-running-shell-reveal 7.3s ease-in-out infinite; }
    @keyframes shell-versus-running-shell-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shell-versus-running-shell-bg" width="980" height="390"/>
  <text class="shell-versus-running-shell-h1"  x="30" y="40">$SHELL is not the shell you are in</text>
  <text class="shell-versus-running-shell-sub" x="30" y="64">A small distinction that wastes real time.</text>
  <rect class="shell-versus-running-shell-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shell-versus-running-shell-name" x="46" y="122">$SHELL</text>
  <text class="shell-versus-running-shell-desc" x="46" y="142">Your configured login shell.</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r0" x="46" y="182">Set once, at login</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r1" x="46" y="216">Does not change when you start another shell</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r2" x="46" y="250">Type bash inside zsh and it still says zsh</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r3" x="46" y="284">What other programs read to guess your preference</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r4" x="46" y="318">Not what is reading your keystrokes</text>
  <rect class="shell-versus-running-shell-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shell-versus-running-shell-name" x="526" y="122">The running shell</text>
  <text class="shell-versus-running-shell-desc" x="526" y="142">What is actually interpreting this line.</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r0" x="526" y="182">echo $0, or ps -p $$</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r1" x="526" y="216">Changes the moment you start another</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r2" x="526" y="250">This is what decides which config file matters</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r3" x="526" y="284">This is what your syntax must satisfy</text>
  <text class="shell-versus-running-shell-desc shell-versus-running-shell-row shell-versus-running-shell-r4" x="526" y="318">Check this one when config edits do nothing</text>
  <text class="shell-versus-running-shell-sub" x="30" y="372">This is why "my .zshrc changes do nothing" is so common: the person is in bash, started from zsh, and $SHELL is still confidently reporting zsh.</text>
</svg>
