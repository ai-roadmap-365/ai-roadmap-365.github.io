<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both run out silently otherwise.">
  <title>Budget money and time before building</title>
  <style>
    .cost-and-time-box-bg   { fill: #f8fafc; }
    .cost-and-time-box-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-and-time-box-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-and-time-box-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-and-time-box-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-and-time-box-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-and-time-box-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-and-time-box-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-and-time-box-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-and-time-box-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-and-time-box-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-and-time-box-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-and-time-box-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-and-time-box-row { opacity: 1; }
    .cost-and-time-box-r0 { animation-delay: 0.00s; }
    .cost-and-time-box-r1 { animation-delay: 0.45s; }
    .cost-and-time-box-r2 { animation-delay: 0.90s; }
    .cost-and-time-box-r3 { animation-delay: 1.35s; }
    .cost-and-time-box-r4 { animation-delay: 1.80s; }
    .cost-and-time-box-row { animation: cost-and-time-box-reveal 7.3s ease-in-out infinite; }
    @keyframes cost-and-time-box-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cost-and-time-box-bg" width="980" height="390"/>
  <text class="cost-and-time-box-h1"  x="30" y="40">Budget money and time before building</text>
  <text class="cost-and-time-box-sub" x="30" y="64">Both run out silently otherwise.</text>
  <rect class="cost-and-time-box-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cost-and-time-box-name" x="46" y="122">No budget set</text>
  <text class="cost-and-time-box-desc" x="46" y="142">You find out afterwards.</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r0" x="46" y="182">Token spend discovered on the invoice</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r1" x="46" y="216">A retry loop costs more than the project</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r2" x="46" y="250">No signal that a design is too expensive</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r3" x="46" y="284">Time absorbed by the most interesting part</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r4" x="46" y="318">The demo is unfinished on the deadline</text>
  <rect class="cost-and-time-box-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cost-and-time-box-name" x="526" y="122">Budgeted up front</text>
  <text class="cost-and-time-box-desc" x="526" y="142">The limit is a design input.</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r0" x="526" y="182">A per-run token ceiling, decided early</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r1" x="526" y="216">Spend limits on the key, per Day 25</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r2" x="526" y="250">An expensive design is rejected before it is built</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r3" x="526" y="284">Milestones time-boxed, not open-ended</text>
  <text class="cost-and-time-box-desc cost-and-time-box-row cost-and-time-box-r4" x="526" y="318">Something demonstrable exists throughout</text>
  <text class="cost-and-time-box-sub" x="30" y="372">A cost ceiling is a design constraint in the same way latency is: it rules out architectures early, when changing them is cheap, rather than after they are built.</text>
</svg>
