<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The request shape changed.">
  <title>A web app, or a compound AI system</title>
  <style>
    .three-tier-or-compound-bg   { fill: #f8fafc; }
    .three-tier-or-compound-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-or-compound-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-or-compound-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-or-compound-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-or-compound-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tier-or-compound-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-tier-or-compound-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-tier-or-compound-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-tier-or-compound-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-tier-or-compound-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-tier-or-compound-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-tier-or-compound-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-tier-or-compound-row { opacity: 1; }
    .three-tier-or-compound-r0 { animation-delay: 0.00s; }
    .three-tier-or-compound-r1 { animation-delay: 0.45s; }
    .three-tier-or-compound-r2 { animation-delay: 0.90s; }
    .three-tier-or-compound-r3 { animation-delay: 1.35s; }
    .three-tier-or-compound-r4 { animation-delay: 1.80s; }
    .three-tier-or-compound-row { animation: three-tier-or-compound-reveal 7.3s ease-in-out infinite; }
    @keyframes three-tier-or-compound-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="three-tier-or-compound-bg" width="980" height="390"/>
  <text class="three-tier-or-compound-h1"  x="30" y="40">A web app, or a compound AI system</text>
  <text class="three-tier-or-compound-sub" x="30" y="64">The request shape changed.</text>
  <rect class="three-tier-or-compound-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="three-tier-or-compound-name" x="46" y="122">Classic three-tier</text>
  <text class="three-tier-or-compound-desc" x="46" y="142">Deterministic and fast.</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r0" x="46" y="182">Browser, app server, database</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r1" x="46" y="216">Requests under 100 ms</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r2" x="46" y="250">Synchronous, and cheap to retry</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r3" x="46" y="284">No per-request marginal cost</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r4" x="46" y="318">Failure is binary</text>
  <rect class="three-tier-or-compound-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="three-tier-or-compound-name" x="526" y="122">Compound AI</text>
  <text class="three-tier-or-compound-desc" x="526" y="142">Slow, streamed, metered.</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r0" x="526" y="182">Streaming gateway and context store</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r1" x="526" y="216">Requests of 5-15 seconds</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r2" x="526" y="250">Long-lived connections</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r3" x="526" y="284">Cost per token, per tenant</text>
  <text class="three-tier-or-compound-desc three-tier-or-compound-row three-tier-or-compound-r4" x="526" y="318">Failure is often partial</text>
  <text class="three-tier-or-compound-sub" x="30" y="372">The middle-era anti-pattern is worth naming: bolting a provider call onto an existing synchronous endpoint produces fifteen-second spinners, leaked keys and unbounded bills, all at once.</text>
</svg>
