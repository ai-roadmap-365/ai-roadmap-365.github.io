<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="LLM as Judge Architecture and Rubric Flow">
  <title>LLM as Judge Architecture and Rubric Flow</title>
  <defs>
    <style>
      .d311a-bg { fill: #f8fafc; }
      .d311a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d311a-in { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d311a-rub { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d311a-llm { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d311a-out { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d311a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d311a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d311a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d311a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d311a-bg" />
  
  <text x="40" y="40" class="d311a-title">Rubric-Anchored LLM-as-a-Judge Architecture</text>
  <text x="40" y="65" class="d311a-subtitle">LLM as Judge Architecture and Rubric Flow showing Input Query, Retrieved Context, Candidate Output, Structured Prompt Rubric, Judge LLM, and JSON Score with Reasoning</text>
  
  <!-- Step 1: Input Bundle -->
  <rect x="40" y="110" width="180" height="270" class="d311a-in" />
  <text x="55" y="140" class="d311a-header" fill="#1d4ed8">1. Input Bundle</text>
  <text x="55" y="170" class="d311a-text">• User Query / Prompt</text>
  <text x="55" y="190" class="d311a-text">• Retrieved Context Docs</text>
  <text x="55" y="210" class="d311a-text">• Candidate Output</text>
  <text x="55" y="230" class="d311a-text">• Ground Truth Ref</text>
  <text x="55" y="260" class="d311a-text" font-weight="600">Payload:</text>
  <text x="55" y="280" class="d311a-text">Structured eval input</text>
  
  <!-- Step 2: Anchored Rubric -->
  <rect x="250" y="110" width="180" height="270" class="d311a-rub" />
  <text x="265" y="140" class="d311a-header" fill="#7e22ce">2. Anchored Rubric</text>
  <text x="265" y="170" class="d311a-text">• Score 1: Hallucinated</text>
  <text x="265" y="190" class="d311a-text">• Score 3: Partially true</text>
  <text x="265" y="210" class="d311a-text">• Score 5: 100% Grounded</text>
  <text x="265" y="230" class="d311a-text">• Chain-of-Thought req</text>
  <text x="265" y="260" class="d311a-text" font-weight="600">Format:</text>
  <text x="265" y="280" class="d311a-text">Pydantic JSON schema</text>
  
  <!-- Step 3: Judge Model -->
  <rect x="460" y="110" width="180" height="270" class="d311a-llm" />
  <text x="475" y="140" class="d311a-header" fill="#a16207">3. Judge Execution</text>
  <text x="475" y="170" class="d311a-text">• Teacher LLM (GPT-4 /</text>
  <text x="475" y="185" class="d311a-text">  Claude 3.5 Sonnet)</text>
  <text x="475" y="210" class="d311a-text">• Temperature = 0.0</text>
  <text x="475" y="230" class="d311a-text">• JSON schema mode</text>
  <text x="475" y="260" class="d311a-text" font-weight="600">Process:</text>
  <text x="475" y="280" class="d311a-text">Critique → Score</text>
  
  <!-- Step 4: Structured Output -->
  <rect x="670" y="110" width="190" height="270" class="d311a-out" />
  <text x="685" y="140" class="d311a-header" fill="#15803d">4. Evaluated Output</text>
  <text x="685" y="170" class="d311a-text">• `score`: 5</text>
  <text x="685" y="190" class="d311a-text">• `reasoning`: "All facts</text>
  <text x="685" y="205" class="d311a-text">  match context doc 2"</text>
  <text x="685" y="230" class="d311a-text">• `pass`: true</text>
  <text x="685" y="260" class="d311a-text" font-weight="600">Action:</text>
  <text x="685" y="280" class="d311a-text">CI regression ledger</text>
</svg>