<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Confusing fetch and pull is the source of most surprising merges.">
  <title>Four commands, and which direction each moves</title>
  <style>
    .clone-fetch-pull-push-bg   { fill: #f8fafc; }
    .clone-fetch-pull-push-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clone-fetch-pull-push-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clone-fetch-pull-push-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clone-fetch-pull-push-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clone-fetch-pull-push-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clone-fetch-pull-push-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clone-fetch-pull-push-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .clone-fetch-pull-push-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .clone-fetch-pull-push-stage { opacity: 1; }

    .clone-fetch-pull-push-s0 { animation-delay: 0.00s; }
    .clone-fetch-pull-push-e0 { animation-delay: 0.00s; }
    .clone-fetch-pull-push-s1 { animation-delay: 1.28s; }
    .clone-fetch-pull-push-e1 { animation-delay: 1.28s; }
    .clone-fetch-pull-push-s2 { animation-delay: 2.56s; }
    .clone-fetch-pull-push-e2 { animation-delay: 2.56s; }
    .clone-fetch-pull-push-s3 { animation-delay: 3.84s; }
    .clone-fetch-pull-push-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .clone-fetch-pull-push-conn  { animation: clone-fetch-pull-push-trace 6.4s ease-in-out infinite; }
      .clone-fetch-pull-push-stage { animation: clone-fetch-pull-push-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes clone-fetch-pull-push-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes clone-fetch-pull-push-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .clone-fetch-pull-push-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .clone-fetch-pull-push-stage { animation: clone-fetch-pull-push-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes clone-fetch-pull-push-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="clone-fetch-pull-push-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="clone-fetch-pull-push-bg" width="980" height="322"/>
  <text class="clone-fetch-pull-push-h1"  x="30" y="40">Four commands, and which direction each moves</text>
  <text class="clone-fetch-pull-push-sub" x="30" y="64">Confusing fetch and pull is the source of most surprising merges.</text>
  <g class="clone-fetch-pull-push-stage clone-fetch-pull-push-s0">
    <rect class="clone-fetch-pull-push-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="clone-fetch-pull-push-step" x="44" y="142">01</text>
    <text class="clone-fetch-pull-push-name" x="70" y="142">clone</text>
    <text class="clone-fetch-pull-push-desc" x="44" y="166">Copy the whole repository and</text>
    <text class="clone-fetch-pull-push-desc" x="44" y="182">its full history, once.</text>
    <text class="clone-fetch-pull-push-edge" x="44" y="242">remote to you</text>
  </g>
  <line class="clone-fetch-pull-push-line clone-fetch-pull-push-conn clone-fetch-pull-push-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#clone-fetch-pull-push-tip)"/>
  <g class="clone-fetch-pull-push-stage clone-fetch-pull-push-s1">
    <rect class="clone-fetch-pull-push-hi" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="clone-fetch-pull-push-step" x="280" y="142">02</text>
    <text class="clone-fetch-pull-push-name" x="306" y="142">fetch</text>
    <text class="clone-fetch-pull-push-desc" x="280" y="166">Download new commits. Changes</text>
    <text class="clone-fetch-pull-push-desc" x="280" y="182">nothing you are working on.</text>
    <text class="clone-fetch-pull-push-edge" x="280" y="242">safe, always</text>
  </g>
  <line class="clone-fetch-pull-push-line clone-fetch-pull-push-conn clone-fetch-pull-push-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#clone-fetch-pull-push-tip)"/>
  <g class="clone-fetch-pull-push-stage clone-fetch-pull-push-s2">
    <rect class="clone-fetch-pull-push-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="clone-fetch-pull-push-step" x="516" y="142">03</text>
    <text class="clone-fetch-pull-push-name" x="542" y="142">pull</text>
    <text class="clone-fetch-pull-push-desc" x="516" y="166">fetch, then merge into your</text>
    <text class="clone-fetch-pull-push-desc" x="516" y="182">current branch.</text>
    <text class="clone-fetch-pull-push-edge" x="516" y="242">can conflict</text>
  </g>
  <line class="clone-fetch-pull-push-line clone-fetch-pull-push-conn clone-fetch-pull-push-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#clone-fetch-pull-push-tip)"/>
  <g class="clone-fetch-pull-push-stage clone-fetch-pull-push-s3">
    <rect class="clone-fetch-pull-push-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="clone-fetch-pull-push-step" x="752" y="142">04</text>
    <text class="clone-fetch-pull-push-name" x="778" y="142">push</text>
    <text class="clone-fetch-pull-push-desc" x="752" y="166">Send your commits up, if the</text>
    <text class="clone-fetch-pull-push-desc" x="752" y="182">remote has not moved on.</text>
    <text class="clone-fetch-pull-push-edge" x="752" y="242">you to remote</text>
  </g>
  <text class="clone-fetch-pull-push-sub" x="30" y="304">fetch is always safe because it only updates tracking branches. pull is fetch plus a merge you did not separately ask for.</text>
</svg>
