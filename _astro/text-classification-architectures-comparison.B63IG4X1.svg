<svg role="img" aria-label="Comparison of neural text classification architectures including EmbeddingBag average pooling TextCNN 1D convolutions and Bidirectional LSTM pooling" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Neural Text Classification Architecture Comparison</title>
  <defs>
    <linearGradient id="bg223a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card223" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg223a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">NEURAL TEXT CLASSIFICATION ARCHITECTURAL SPECTRUM</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Trading Off Computational Latency, Parameter Count, and Local vs Global Sequence Awareness</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card223)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Model 1: EmbeddingBag -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Neural BoW (EmbeddingBag)</text>
    <rect x="35" y="65" width="200" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Global Mean Pooling</text>
    <text x="135" y="110" fill="#cbd5e1" font-size="8" text-anchor="middle">v_doc = (1/N) * Σ v(w_i)</text>
    <text x="135" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Ultra-fast (0.1 ms latency)</text>
    <text x="135" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• No word order awareness</text>
    <text x="135" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• FastText baseline</text>
    <text x="135" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Perfect for long keyword docs</text>
    <text x="135" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Max Throughput</text>

    <!-- Model 2: TextCNN -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. TextCNN (1D Convolutions)</text>
    <rect x="280" y="65" width="200" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Multi-Scale n-Gram Filters</text>
    <text x="380" y="110" fill="#cbd5e1" font-size="8" text-anchor="middle">Filters k in [3, 4, 5] + MaxPool</text>
    <text x="380" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Captures local key phrases</text>
    <text x="380" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Highly parallelizable on GPU</text>
    <text x="380" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Yoon Kim (2014) benchmark</text>
    <text x="380" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Robust phrase detection</text>
    <text x="380" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Local Phrase Specialist</text>

    <!-- Model 3: BiLSTM -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="625" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Bidirectional LSTM</text>
    <rect x="525" y="65" width="200" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="625" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Full Sequential Context</text>
    <text x="625" y="110" fill="#cbd5e1" font-size="8" text-anchor="middle">h_doc = [h_fwd_T, h_bwd_1]</text>
    <text x="625" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Full long-range context</text>
    <text x="625" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Handles negations ("not bad")</text>
    <text x="625" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Sequential execution</text>
    <text x="625" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Higher compute footprint</text>
    <text x="625" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Rich Global Semantics</text>
  </g>
</svg>
