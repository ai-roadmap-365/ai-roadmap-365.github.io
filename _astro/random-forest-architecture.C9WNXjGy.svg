<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Random Forest Architecture Diagram">
  <title>Random Forest Architecture</title>
  <defs>
    <style>
      .d163a-bg { fill: #f8fafc; }
      .d163a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 6; }
      .d163a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d163a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d163a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d163a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d163a-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d163a-arr); fill: none; }
      .d163a-tree-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 6; }
      .d163a-vote-box { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 8; }
    </style>
    <marker id="d163a-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d163a-bg" />

  <text x="40" y="45" class="d163a-header" font-size="22">Random Forest Architecture &amp; Ensemble Flow</text>
  <text x="40" y="70" class="d163a-text">Bootstrap Aggregation (Bagging) + Random Feature Subspaces ➔ Parallel Trees ➔ Majority Vote</text>

  <!-- 1. Original Dataset -->
  <rect x="40" y="190" width="160" height="90" class="d163a-box" fill="#f1f5f9" />
  <text x="55" y="220" class="d163a-title" fill="#0f172a">Training Dataset</text>
  <text x="55" y="240" class="d163a-math">N samples, D features</text>
  <text x="55" y="260" class="d163a-text" font-size="11" fill="#64748b">(X, y)</text>

  <!-- Arrows to 3 Bootstrap Bags -->
  <path d="M 200 210 L 260 140" class="d163a-arrow" />
  <path d="M 200 235 L 260 235" class="d163a-arrow" />
  <path d="M 200 260 L 260 330" class="d163a-arrow" />

  <!-- 2. Bootstrap Bags -->
  <!-- Bag 1 -->
  <rect x="260" y="110" width="150" height="60" class="d163a-box" />
  <text x="275" y="135" class="d163a-title">Bootstrap Sample 1</text>
  <text x="275" y="155" class="d163a-math">N samples (~63.2%)</text>

  <!-- Bag 2 -->
  <rect x="260" y="205" width="150" height="60" class="d163a-box" />
  <text x="275" y="230" class="d163a-title">Bootstrap Sample 2</text>
  <text x="275" y="250" class="d163a-math">N samples (~63.2%)</text>

  <!-- Bag B -->
  <rect x="260" y="300" width="150" height="60" class="d163a-box" />
  <text x="275" y="325" class="d163a-title">Bootstrap Sample B</text>
  <text x="275" y="345" class="d163a-math">N samples (~63.2%)</text>

  <!-- Arrows to Trees -->
  <path d="M 410 140 L 470 140" class="d163a-arrow" />
  <path d="M 410 235 L 470 235" class="d163a-arrow" />
  <path d="M 410 330 L 470 330" class="d163a-arrow" />

  <!-- 3. Randomized Trees -->
  <!-- Tree 1 -->
  <rect x="470" y="110" width="160" height="60" class="d163a-tree-box" />
  <text x="485" y="135" class="d163a-title" fill="#1d4ed8">Tree 1 (m = √D)</text>
  <text x="485" y="155" class="d163a-math" fill="#2563eb">Prediction: Class A</text>

  <!-- Tree 2 -->
  <rect x="470" y="205" width="160" height="60" class="d163a-tree-box" />
  <text x="485" y="230" class="d163a-title" fill="#1d4ed8">Tree 2 (m = √D)</text>
  <text x="485" y="250" class="d163a-math" fill="#2563eb">Prediction: Class A</text>

  <!-- Tree B -->
  <rect x="470" y="300" width="160" height="60" class="d163a-tree-box" />
  <text x="485" y="325" class="d163a-title" fill="#1d4ed8">Tree B (m = √D)</text>
  <text x="485" y="345" class="d163a-math" fill="#2563eb">Prediction: Class B</text>

  <!-- Arrows to Aggregator -->
  <path d="M 630 140 L 700 210" class="d163a-arrow" />
  <path d="M 630 235 L 700 235" class="d163a-arrow" />
  <path d="M 630 330 L 700 260" class="d163a-arrow" />

  <!-- 4. Majority Vote / Ensemble Prediction -->
  <rect x="700" y="190" width="160" height="90" class="d163a-vote-box" />
  <text x="720" y="220" class="d163a-title" fill="#15803d">Majority Voting</text>
  <text x="720" y="240" class="d163a-math" fill="#166534">mode(y_1, ..., y_B)</text>
  <text x="720" y="260" class="d163a-title" font-size="14" fill="#15803d">Final: Class A</text>

  <!-- Explanatory footer -->
  <text x="40" y="420" class="d163a-text" font-size="12">Variance Reduction: Var(f̄) = ρ · σ² + ((1 - ρ)/B) · σ². As B ➔ ∞, variance drops to ρ · σ². Random subspaces keep ρ small!</text>
</svg>
