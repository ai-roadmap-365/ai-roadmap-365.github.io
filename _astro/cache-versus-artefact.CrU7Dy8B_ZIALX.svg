<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Confusing them fails only on a cold runner.">
  <title>A cache may be missing; an artefact may not</title>
  <style>
    .cache-versus-artefact-bg   { fill: #f8fafc; }
    .cache-versus-artefact-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-versus-artefact-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-versus-artefact-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-versus-artefact-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-versus-artefact-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-versus-artefact-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-versus-artefact-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cache-versus-artefact-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cache-versus-artefact-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cache-versus-artefact-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cache-versus-artefact-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cache-versus-artefact-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-versus-artefact-row { opacity: 1; }
    .cache-versus-artefact-r0 { animation-delay: 0.00s; }
    .cache-versus-artefact-r1 { animation-delay: 0.45s; }
    .cache-versus-artefact-r2 { animation-delay: 0.90s; }
    .cache-versus-artefact-r3 { animation-delay: 1.35s; }
    .cache-versus-artefact-r4 { animation-delay: 1.80s; }
    .cache-versus-artefact-row { animation: cache-versus-artefact-reveal 7.3s ease-in-out infinite; }
    @keyframes cache-versus-artefact-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cache-versus-artefact-bg" width="980" height="390"/>
  <text class="cache-versus-artefact-h1"  x="30" y="40">A cache may be missing; an artefact may not</text>
  <text class="cache-versus-artefact-sub" x="30" y="64">Confusing them fails only on a cold runner.</text>
  <rect class="cache-versus-artefact-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cache-versus-artefact-name" x="46" y="122">Cache</text>
  <text class="cache-versus-artefact-desc" x="46" y="142">An optimisation.</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r0" x="46" y="182">May be absent, legitimately</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r1" x="46" y="216">The build must work without it</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r2" x="46" y="250">Scoped by key</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r3" x="46" y="284">A miss costs time, not correctness</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r4" x="46" y="318">Restoring is best-effort</text>
  <rect class="cache-versus-artefact-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cache-versus-artefact-name" x="526" y="122">Artefact</text>
  <text class="cache-versus-artefact-desc" x="526" y="142">Output.</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r0" x="526" y="182">Must be present</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r1" x="526" y="216">A later job consumes it</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r2" x="526" y="250">Failing to find one is a real failure</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r3" x="526" y="284">Retained deliberately</text>
  <text class="cache-versus-artefact-desc cache-versus-artefact-row cache-versus-artefact-r4" x="526" y="318">Not an optimisation</text>
  <text class="cache-versus-artefact-sub" x="30" y="372">Treating a cache as guaranteed produces the worst kind of intermittent failure: everything passes on a warm runner and fails on the first cold one, which is usually the release.</text>
</svg>
