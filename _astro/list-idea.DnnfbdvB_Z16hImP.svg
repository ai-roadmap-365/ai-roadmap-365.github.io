<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What a list is</title>
  <style>
    .list-idea-bg   { fill: #f8fafc; }
    .list-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .list-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .list-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .list-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .list-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .list-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .list-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .list-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .list-idea-stage { opacity: 1; }

    .list-idea-s0 { animation-delay: 0.00s; }
    .list-idea-e0 { animation-delay: 0.00s; }
    .list-idea-s1 { animation-delay: 1.28s; }
    .list-idea-e1 { animation-delay: 1.28s; }
    .list-idea-s2 { animation-delay: 2.56s; }
    .list-idea-e2 { animation-delay: 2.56s; }
    .list-idea-s3 { animation-delay: 3.84s; }
    .list-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .list-idea-conn  { animation: list-idea-trace 6.4s ease-in-out infinite; }
      .list-idea-stage { animation: list-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes list-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes list-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .list-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .list-idea-stage { animation: list-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes list-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="list-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="list-idea-bg" width="980" height="322"/>
  <text class="list-idea-h1"  x="30" y="40">What a list is</text>
  <text class="list-idea-sub" x="30" y="64">Four properties.</text>
  <g class="list-idea-stage list-idea-s0">
    <rect class="list-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="list-idea-step" x="44" y="142">01</text>
    <text class="list-idea-name" x="70" y="142">Ordered: position is meaningful and stable</text>
    <text class="list-idea-desc" x="44" y="166">Which is what distinguishes it</text>
    <text class="list-idea-desc" x="44" y="182">from a set.</text>
  </g>
  <line class="list-idea-line list-idea-conn list-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#list-idea-tip)"/>
  <g class="list-idea-stage list-idea-s1">
    <rect class="list-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="list-idea-step" x="280" y="142">02</text>
    <text class="list-idea-name" x="306" y="142">Mutable: it can be changed in place</text>
    <text class="list-idea-desc" x="280" y="166">Which is convenient and a source</text>
    <text class="list-idea-desc" x="280" y="182">of bugs.</text>
  </g>
  <line class="list-idea-line list-idea-conn list-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#list-idea-tip)"/>
  <g class="list-idea-stage list-idea-s2">
    <rect class="list-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="list-idea-step" x="516" y="142">03</text>
    <text class="list-idea-name" x="542" y="142">Heterogeneous: any types, mixed freely</text>
    <text class="list-idea-desc" x="516" y="166">Which arrays cannot do.</text>
  </g>
  <line class="list-idea-line list-idea-conn list-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#list-idea-tip)"/>
  <g class="list-idea-stage list-idea-s3">
    <rect class="list-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="list-idea-step" x="752" y="142">04</text>
    <text class="list-idea-name" x="778" y="142">And it grows as needed</text>
    <text class="list-idea-desc" x="752" y="166">With amortised cheap appends.</text>
  </g>
  <text class="list-idea-sub" x="30" y="304">Mutability being both the convenience and the hazard is the theme of this lesson: shared references and in-place changes account for most list surprises.</text>
</svg>
