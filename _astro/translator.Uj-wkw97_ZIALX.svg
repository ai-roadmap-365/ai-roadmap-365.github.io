<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fluent, or not.">
  <title>Working through a translator</title>
  <style>
    .translator-bg   { fill: #f8fafc; }
    .translator-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translator-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translator-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translator-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translator-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translator-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .translator-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .translator-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .translator-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .translator-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .translator-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .translator-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .translator-row { opacity: 1; }
    .translator-r0 { animation-delay: 0.00s; }
    .translator-r1 { animation-delay: 0.45s; }
    .translator-r2 { animation-delay: 0.90s; }
    .translator-r3 { animation-delay: 1.35s; }
    .translator-r4 { animation-delay: 1.80s; }
    .translator-row { animation: translator-reveal 7.3s ease-in-out infinite; }
    @keyframes translator-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="translator-bg" width="980" height="390"/>
  <text class="translator-h1"  x="30" y="40">Working through a translator</text>
  <text class="translator-sub" x="30" y="64">Fluent, or not.</text>
  <rect class="translator-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="translator-name" x="46" y="122">Through a translator</text>
  <text class="translator-desc" x="46" y="142">Convenient.</text>
  <text class="translator-desc translator-row translator-r0" x="46" y="182">You speak your own language</text>
  <text class="translator-desc translator-row translator-r1" x="46" y="216">Most things come across correctly</text>
  <text class="translator-desc translator-row translator-r2" x="46" y="250">Idioms get flattened</text>
  <text class="translator-desc translator-row translator-r3" x="46" y="284">You cannot tell what was said exactly</text>
  <text class="translator-desc translator-row translator-r4" x="46" y="318">This is an object mapper</text>
  <rect class="translator-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="translator-name" x="526" y="122">Speaking directly</text>
  <text class="translator-desc" x="526" y="142">Precise.</text>
  <text class="translator-desc translator-row translator-r0" x="526" y="182">You must know the language</text>
  <text class="translator-desc translator-row translator-r1" x="526" y="216">Nothing is lost</text>
  <text class="translator-desc translator-row translator-r2" x="526" y="250">Idioms are available</text>
  <text class="translator-desc translator-row translator-r3" x="526" y="284">You know exactly what was said</text>
  <text class="translator-desc translator-row translator-r4" x="526" y="318">This is writing the query yourself</text>
  <text class="translator-sub" x="30" y="372">Not knowing exactly what was said is fine until it matters, which is why every serious mapper offers a way to log the statements it generates.</text>
</svg>
