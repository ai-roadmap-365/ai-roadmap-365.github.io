<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" role="img" aria-labelledby="d128aTitleId d128aDescId">
  <title id="d128aTitleId">The Figure/Axes/Artist object model, labelled on a real chart</title>
  <desc id="d128aDescId">A single rendered line chart with every structural part called out: an outer Figure boundary containing one Axes, and within the Axes the spines, ticks, tick labels, x-axis label, y-axis label, title, legend and the plotted line itself, each labelled as the specific object matplotlib returns for it.</desc>

  <style>
    .d128a-bg      { fill: #f8fafc; }
    .d128a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d128a-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d128a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1d4ed8; font-weight: 600; }
    .d128a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #475569; }
    .d128a-figbox  { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 5; }
    .d128a-axbox   { fill: #ffffff; stroke: #1a202c; stroke-width: 1.5; }
    .d128a-leader  { stroke: #1d4ed8; stroke-width: 1.25; fill: none; }
    .d128a-tick    { stroke: #1a202c; stroke-width: 1.25; }
    .d128a-ticklabel { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #1a202c; }
    .d128a-line    { fill: none; stroke: #b91c1c; stroke-width: 2.5; }
    .d128a-legendbox { fill: #ffffff; stroke: #1a202c; stroke-width: 1; }
  </style>

  <rect class="d128a-bg" x="0" y="0" width="1040" height="620" />
  <text class="d128a-title" x="30" y="36">A chart is a data structure that happens to render as a picture</text>
  <text class="d128a-caption" x="30" y="58">every labelled part below is a real, readable Python object</text>

  <!-- FIGURE boundary -->
  <rect class="d128a-figbox" x="60" y="80" width="920" height="480" rx="10" />
  <text class="d128a-label" x="80" y="105">FIGURE -- the whole canvas; what fig.savefig() writes to disk</text>

  <!-- AXES box -->
  <rect class="d128a-axbox" x="140" y="150" width="760" height="330" />
  <text class="d128a-label" x="150" y="138">AXES -- one plotting area, with its own x/y coordinates (ax)</text>

  <!-- title -->
  <text class="d128a-ticklabel" x="520" y="175" text-anchor="middle" font-weight="700">Sensor reading by depth</text>
  <line class="d128a-leader" x1="520" y1="182" x2="520" y2="130" />
  <text class="d128a-label" x="530" y="122">title (ax.set_title)</text>

  <!-- plotted line (Artist) -->
  <polyline class="d128a-line" points="180,440 280,380 380,410 480,340 580,360 680,290 780,320 860,260" />
  <line class="d128a-leader" x1="680" y1="290" x2="820" y2="200" />
  <text class="d128a-label" x="700" y="195">Line2D -- an Artist, stored in ax.lines</text>
  <text class="d128a-sub" x="700" y="212">ax.lines[0].get_xydata() reads it back exactly</text>

  <!-- spines -->
  <line class="d128a-leader" x1="140" y1="480" x2="100" y2="530" />
  <text class="d128a-label" x="70" y="546">spines (the 4 border lines)</text>

  <!-- ticks + tick labels, x axis -->
  <g>
    <line class="d128a-tick" x1="180" y1="480" x2="180" y2="488" />
    <line class="d128a-tick" x1="380" y1="480" x2="380" y2="488" />
    <line class="d128a-tick" x1="580" y1="480" x2="580" y2="488" />
    <line class="d128a-tick" x1="780" y1="480" x2="780" y2="488" />
    <text class="d128a-ticklabel" x="180" y="502" text-anchor="middle">0</text>
    <text class="d128a-ticklabel" x="380" y="502" text-anchor="middle">10</text>
    <text class="d128a-ticklabel" x="580" y="502" text-anchor="middle">20</text>
    <text class="d128a-ticklabel" x="780" y="502" text-anchor="middle">30</text>
  </g>
  <line class="d128a-leader" x1="380" y1="490" x2="330" y2="530" />
  <text class="d128a-label" x="250" y="546">ticks and tick labels (ax.set_xticks)</text>

  <!-- x-axis label -->
  <text class="d128a-ticklabel" x="520" y="500" text-anchor="middle">depth (m)</text>
  <line class="d128a-leader" x1="520" y1="500" x2="520" y2="530" />
  <text class="d128a-label" x="430" y="546">x-axis label (ax.set_xlabel)</text>

  <!-- y-axis label -->
  <g transform="translate(115,340) rotate(-90)">
    <text class="d128a-ticklabel" text-anchor="middle">reading</text>
  </g>
  <line class="d128a-leader" x1="120" y1="340" x2="80" y2="380" />
  <text class="d128a-label" x="80" y="398" transform="translate(0,0)">y-axis label</text>
  <text class="d128a-label" x="80" y="414">(ax.set_ylabel)</text>

  <!-- legend -->
  <rect class="d128a-legendbox" x="700" y="165" width="150" height="40" />
  <line class="d128a-line" x1="710" y1="180" x2="735" y2="180" />
  <text class="d128a-ticklabel" x="742" y="184">reading</text>
  <line class="d128a-leader" x1="850" y1="185" x2="900" y2="150" />
  <text class="d128a-label" x="820" y="140">legend (ax.legend())</text>
  <text class="d128a-sub" x="700" y="222">legend.get_texts() reads the labels back, in plotting order</text>

  <text class="d128a-caption" x="80" y="600">A Figure holds one or more Axes. An Axes owns every Artist drawn inside it -- its lines, its labels, its legend -- as real, readable Python objects, which is what makes a chart testable.</text>
</svg>
