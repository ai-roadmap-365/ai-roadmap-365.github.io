<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Ask whether they are near enough, not identical.">
  <title>Never compare floats with ==</title>
  <style>
    .equals-or-isclose-bg   { fill: #f8fafc; }
    .equals-or-isclose-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .equals-or-isclose-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .equals-or-isclose-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .equals-or-isclose-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .equals-or-isclose-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .equals-or-isclose-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .equals-or-isclose-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .equals-or-isclose-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .equals-or-isclose-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .equals-or-isclose-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .equals-or-isclose-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .equals-or-isclose-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .equals-or-isclose-row { opacity: 1; }
    .equals-or-isclose-r0 { animation-delay: 0.00s; }
    .equals-or-isclose-r1 { animation-delay: 0.45s; }
    .equals-or-isclose-r2 { animation-delay: 0.90s; }
    .equals-or-isclose-r3 { animation-delay: 1.35s; }
    .equals-or-isclose-r4 { animation-delay: 1.80s; }
    .equals-or-isclose-row { animation: equals-or-isclose-reveal 7.3s ease-in-out infinite; }
    @keyframes equals-or-isclose-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="equals-or-isclose-bg" width="980" height="390"/>
  <text class="equals-or-isclose-h1"  x="30" y="40">Never compare floats with ==</text>
  <text class="equals-or-isclose-sub" x="30" y="64">Ask whether they are near enough, not identical.</text>
  <rect class="equals-or-isclose-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="equals-or-isclose-name" x="46" y="122">a == b</text>
  <text class="equals-or-isclose-desc" x="46" y="142">Did two approximations land identically?</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r0" x="46" y="182">0.1 + 0.2 == 0.3 is False</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r1" x="46" y="216">Passes on one machine, fails on another</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r2" x="46" y="250">Depends on the order of operations</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r3" x="46" y="284">Almost never the question you mean</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r4" x="46" y="318">A test written this way is a flaky test</text>
  <rect class="equals-or-isclose-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="equals-or-isclose-name" x="526" y="122">math.isclose(a, b)</text>
  <text class="equals-or-isclose-desc" x="526" y="142">Are they near enough?</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r0" x="526" y="182">Relative tolerance by default</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r1" x="526" y="216">abs_tol for values near zero</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r2" x="526" y="250">Order of operations stops mattering</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r3" x="526" y="284">This is what a measurement comparison means</text>
  <text class="equals-or-isclose-desc equals-or-isclose-row equals-or-isclose-r4" x="526" y="318">One import, one line</text>
  <text class="equals-or-isclose-sub" x="30" y="372">Near zero, relative tolerance is meaningless — a millionth is not close to zero in relative terms. Pass abs_tol whenever the expected value could be zero.</text>
</svg>
