<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="They store their outputs inside the file.">
  <title>Why notebooks fight version control</title>
  <style>
    .notebooks-in-git-bg   { fill: #f8fafc; }
    .notebooks-in-git-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebooks-in-git-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebooks-in-git-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebooks-in-git-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebooks-in-git-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .notebooks-in-git-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .notebooks-in-git-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .notebooks-in-git-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .notebooks-in-git-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .notebooks-in-git-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .notebooks-in-git-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .notebooks-in-git-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .notebooks-in-git-row { opacity: 1; }
    .notebooks-in-git-r0 { animation-delay: 0.00s; }
    .notebooks-in-git-r1 { animation-delay: 0.45s; }
    .notebooks-in-git-r2 { animation-delay: 0.90s; }
    .notebooks-in-git-r3 { animation-delay: 1.35s; }
    .notebooks-in-git-r4 { animation-delay: 1.80s; }
    .notebooks-in-git-row { animation: notebooks-in-git-reveal 7.3s ease-in-out infinite; }
    @keyframes notebooks-in-git-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="notebooks-in-git-bg" width="980" height="390"/>
  <text class="notebooks-in-git-h1"  x="30" y="40">Why notebooks fight version control</text>
  <text class="notebooks-in-git-sub" x="30" y="64">They store their outputs inside the file.</text>
  <rect class="notebooks-in-git-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="notebooks-in-git-name" x="46" y="122">Committed with outputs</text>
  <text class="notebooks-in-git-desc" x="46" y="142">The default, and painful.</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r0" x="46" y="182">Every re-run changes the whole file</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r1" x="46" y="216">Diffs are thousands of lines of base64</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r2" x="46" y="250">Embedded images balloon the repository</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r3" x="46" y="284">Execution counts change with no code change</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r4" x="46" y="318">Output may contain data you did not mean to publish</text>
  <rect class="notebooks-in-git-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="notebooks-in-git-name" x="526" y="122">Outputs stripped</text>
  <text class="notebooks-in-git-desc" x="526" y="142">One filter, set up once.</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r0" x="526" y="182">Only real code changes appear</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r1" x="526" y="216">Diffs are readable and reviewable</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r2" x="526" y="250">Repository stays small</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r3" x="526" y="284">Re-running produces no diff at all</text>
  <text class="notebooks-in-git-desc notebooks-in-git-row notebooks-in-git-r4" x="526" y="318">Nothing leaks through a rendered cell</text>
  <text class="notebooks-in-git-sub" x="30" y="372">The output is also the least reproducible part of a notebook: it was produced by a state you did not record. Stripping it and recording the commit hash is the more honest trade.</text>
</svg>
