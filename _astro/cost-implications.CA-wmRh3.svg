<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is an attack.">
  <title>Five consequences of metered inference</title>
  <style>
    .cost-implications-bg   { fill: #f8fafc; }
    .cost-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-implications-stage { opacity: 1; }

    .cost-implications-s0 { animation-delay: 0.00s; }
    .cost-implications-e0 { animation-delay: 0.00s; }
    .cost-implications-s1 { animation-delay: 1.33s; }
    .cost-implications-e1 { animation-delay: 1.33s; }
    .cost-implications-s2 { animation-delay: 2.67s; }
    .cost-implications-e2 { animation-delay: 2.67s; }
    .cost-implications-s3 { animation-delay: 4.00s; }
    .cost-implications-e3 { animation-delay: 4.00s; }
    .cost-implications-s4 { animation-delay: 5.33s; }
    .cost-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-implications-conn  { animation: cost-implications-trace 8s ease-in-out infinite; }
      .cost-implications-stage { animation: cost-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes cost-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-implications-stage { animation: cost-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-implications-bg" width="980" height="322"/>
  <text class="cost-implications-h1"  x="30" y="40">Five consequences of metered inference</text>
  <text class="cost-implications-sub" x="30" y="64">One is an attack.</text>
  <g class="cost-implications-stage cost-implications-s0">
    <rect class="cost-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="cost-implications-step" x="44" y="142">01</text>
    <text class="cost-implications-name" x="70" y="142">Denial-of-wallet</text>
    <text class="cost-implications-desc" x="44" y="166">Recursive tool calls or a</text>
    <text class="cost-implications-desc" x="44" y="182">scripted client. No</text>
    <text class="cost-implications-desc" x="44" y="198">vulnerability required.</text>
    <text class="cost-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="cost-implications-line cost-implications-conn cost-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#cost-implications-tip)"/>
  <g class="cost-implications-stage cost-implications-s1">
    <rect class="cost-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="cost-implications-step" x="233" y="142">02</text>
    <text class="cost-implications-name" x="259" y="142">A shared cache can leak</text>
    <text class="cost-implications-desc" x="233" y="166">Key on tenant as well as</text>
    <text class="cost-implications-desc" x="233" y="182">content; prompts and</text>
    <text class="cost-implications-desc" x="233" y="198">responses are user data.</text>
    <text class="cost-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="cost-implications-line cost-implications-conn cost-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#cost-implications-tip)"/>
  <g class="cost-implications-stage cost-implications-s2">
    <rect class="cost-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="cost-implications-step" x="422" y="142">03</text>
    <text class="cost-implications-name" x="448" y="142">Levers trade differently</text>
    <text class="cost-implications-desc" x="422" y="166">Caching helps cost and</text>
    <text class="cost-implications-desc" x="422" y="182">latency; batching helps</text>
    <text class="cost-implications-desc" x="422" y="198">cost and hurts latency.</text>
  </g>
  <line class="cost-implications-line cost-implications-conn cost-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#cost-implications-tip)"/>
  <g class="cost-implications-stage cost-implications-s3">
    <rect class="cost-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="cost-implications-step" x="611" y="142">04</text>
    <text class="cost-implications-name" x="637" y="142">The bill scales linearly</text>
    <text class="cost-implications-desc" x="611" y="166">No amortisation. There is</text>
    <text class="cost-implications-desc" x="611" y="182">no economy of scale in</text>
    <text class="cost-implications-desc" x="611" y="198">tokens.</text>
    <text class="cost-implications-edge" x="611" y="242">scalability</text>
  </g>
  <line class="cost-implications-line cost-implications-conn cost-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#cost-implications-tip)"/>
  <g class="cost-implications-stage cost-implications-s4">
    <rect class="cost-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="cost-implications-step" x="800" y="142">05</text>
    <text class="cost-implications-name" x="826" y="142">Input usually dominates the total</text>
    <text class="cost-implications-desc" x="800" y="166">Output costs more per</text>
    <text class="cost-implications-desc" x="800" y="182">token; you send far more</text>
    <text class="cost-implications-desc" x="800" y="198">input. Measure it.</text>
  </g>
  <text class="cost-implications-sub" x="30" y="304">The third row is worth keeping straight when someone proposes a change on cost grounds: batching is a real saving that a latency-sensitive product cannot accept.</text>
</svg>
