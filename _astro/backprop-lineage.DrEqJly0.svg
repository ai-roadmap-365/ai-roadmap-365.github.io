<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Discovered, applied, popularised, generalised.">
  <title>Four steps to autograd</title>
  <style>
    .backprop-lineage-bg   { fill: #f8fafc; }
    .backprop-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backprop-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backprop-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backprop-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backprop-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backprop-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backprop-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .backprop-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .backprop-lineage-stage { opacity: 1; }

    .backprop-lineage-s0 { animation-delay: 0.00s; }
    .backprop-lineage-e0 { animation-delay: 0.00s; }
    .backprop-lineage-s1 { animation-delay: 1.28s; }
    .backprop-lineage-e1 { animation-delay: 1.28s; }
    .backprop-lineage-s2 { animation-delay: 2.56s; }
    .backprop-lineage-e2 { animation-delay: 2.56s; }
    .backprop-lineage-s3 { animation-delay: 3.84s; }
    .backprop-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .backprop-lineage-conn  { animation: backprop-lineage-trace 6.4s ease-in-out infinite; }
      .backprop-lineage-stage { animation: backprop-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes backprop-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes backprop-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .backprop-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .backprop-lineage-stage { animation: backprop-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes backprop-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="backprop-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="backprop-lineage-bg" width="980" height="322"/>
  <text class="backprop-lineage-h1"  x="30" y="40">Four steps to autograd</text>
  <text class="backprop-lineage-sub" x="30" y="64">Discovered, applied, popularised, generalised.</text>
  <g class="backprop-lineage-stage backprop-lineage-s0">
    <rect class="backprop-lineage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-lineage-step" x="44" y="142">01</text>
    <text class="backprop-lineage-name" x="70" y="142">1970: reverse-mode differentiation</text>
    <text class="backprop-lineage-desc" x="44" y="166">Linnainmaa. The general</text>
    <text class="backprop-lineage-desc" x="44" y="182">mathematical formulation, in a</text>
    <text class="backprop-lineage-desc" x="44" y="198">master's thesis.</text>
  </g>
  <line class="backprop-lineage-line backprop-lineage-conn backprop-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#backprop-lineage-tip)"/>
  <g class="backprop-lineage-stage backprop-lineage-s1">
    <rect class="backprop-lineage-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-lineage-step" x="280" y="142">02</text>
    <text class="backprop-lineage-name" x="306" y="142">1974: applied to neural networks</text>
    <text class="backprop-lineage-desc" x="280" y="166">Werbos. Correct, and largely</text>
    <text class="backprop-lineage-desc" x="280" y="182">unnoticed at the time.</text>
  </g>
  <line class="backprop-lineage-line backprop-lineage-conn backprop-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#backprop-lineage-tip)"/>
  <g class="backprop-lineage-stage backprop-lineage-s2">
    <rect class="backprop-lineage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-lineage-step" x="516" y="142">03</text>
    <text class="backprop-lineage-name" x="542" y="142">1986: demonstrated empirically</text>
    <text class="backprop-lineage-desc" x="516" y="166">Rumelhart, Hinton and Williams.</text>
    <text class="backprop-lineage-desc" x="516" y="182">Networks learning internal</text>
    <text class="backprop-lineage-desc" x="516" y="198">representations.</text>
  </g>
  <line class="backprop-lineage-line backprop-lineage-conn backprop-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#backprop-lineage-tip)"/>
  <g class="backprop-lineage-stage backprop-lineage-s3">
    <rect class="backprop-lineage-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-lineage-step" x="752" y="142">04</text>
    <text class="backprop-lineage-name" x="778" y="142">2010s: autograd</text>
    <text class="backprop-lineage-desc" x="752" y="166">Arbitrary tensor operations</text>
    <text class="backprop-lineage-desc" x="752" y="182">traced dynamically, not four</text>
    <text class="backprop-lineage-desc" x="752" y="198">fixed equations.</text>
  </g>
  <text class="backprop-lineage-sub" x="30" y="304">The sixteen-year gap between the second and third rows is a recurring shape in this field: the mathematics was published, correct and ignored until somebody demonstrated it working on a problem people cared about.</text>
</svg>
