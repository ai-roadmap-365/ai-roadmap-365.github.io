<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four signs and four fixes.">
  <title>Diagnosing overfitting</title>
  <style>
    .overfitting-diag-bg   { fill: #f8fafc; }
    .overfitting-diag-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overfitting-diag-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overfitting-diag-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overfitting-diag-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overfitting-diag-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overfitting-diag-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .overfitting-diag-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .overfitting-diag-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .overfitting-diag-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .overfitting-diag-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .overfitting-diag-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .overfitting-diag-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .overfitting-diag-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .overfitting-diag-stage { opacity: 1; }

    .overfitting-diag-s0 { animation-delay: 0.00s; }
    .overfitting-diag-e0 { animation-delay: 0.00s; }
    .overfitting-diag-s1 { animation-delay: 1.28s; }
    .overfitting-diag-e1 { animation-delay: 1.28s; }
    .overfitting-diag-s2 { animation-delay: 2.56s; }
    .overfitting-diag-e2 { animation-delay: 2.56s; }
    .overfitting-diag-s3 { animation-delay: 3.84s; }
    .overfitting-diag-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .overfitting-diag-conn  { animation: overfitting-diag-trace 6.4s ease-in-out infinite; }
      .overfitting-diag-stage { animation: overfitting-diag-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes overfitting-diag-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes overfitting-diag-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .overfitting-diag-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .overfitting-diag-stage { animation: overfitting-diag-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes overfitting-diag-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="overfitting-diag-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="overfitting-diag-bg" width="980" height="322"/>
  <text class="overfitting-diag-h1"  x="30" y="40">Diagnosing overfitting</text>
  <text class="overfitting-diag-sub" x="30" y="64">Four signs and four fixes.</text>
  <g class="overfitting-diag-stage overfitting-diag-s0">
    <rect class="overfitting-diag-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="overfitting-diag-step" x="44" y="142">01</text>
    <text class="overfitting-diag-name" x="70" y="142">Training error is very low, validation far higher</text>
    <text class="overfitting-diag-desc" x="44" y="166">A persistent gap that does not</text>
    <text class="overfitting-diag-desc" x="44" y="182">close.</text>
  </g>
  <line class="overfitting-diag-line overfitting-diag-conn overfitting-diag-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#overfitting-diag-tip)"/>
  <g class="overfitting-diag-stage overfitting-diag-s1">
    <rect class="overfitting-diag-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="overfitting-diag-step" x="280" y="142">02</text>
    <text class="overfitting-diag-name" x="306" y="142">The model is fitting the sample, not the pattern</text>
    <text class="overfitting-diag-desc" x="280" y="166">It has too much freedom.</text>
  </g>
  <line class="overfitting-diag-line overfitting-diag-conn overfitting-diag-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#overfitting-diag-tip)"/>
  <g class="overfitting-diag-stage overfitting-diag-s2">
    <rect class="overfitting-diag-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="overfitting-diag-step" x="516" y="142">03</text>
    <text class="overfitting-diag-name" x="542" y="142">Regularise, simplify, or select fewer features</text>
    <text class="overfitting-diag-desc" x="516" y="166">All of which constrain it.</text>
  </g>
  <line class="overfitting-diag-line overfitting-diag-conn overfitting-diag-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#overfitting-diag-tip)"/>
  <g class="overfitting-diag-stage overfitting-diag-s3">
    <rect class="overfitting-diag-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="overfitting-diag-step" x="752" y="142">04</text>
    <text class="overfitting-diag-name" x="778" y="142">And more data genuinely helps here</text>
    <text class="overfitting-diag-desc" x="752" y="166">Unlike the underfitting case.</text>
  </g>
  <text class="overfitting-diag-sub" x="30" y="304">That more data helps overfitting and not underfitting is the single most useful asymmetry in this lesson, and it is why the diagnosis has to come first.</text>
</svg>
