<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="You may resume from any photograph.">
  <title>A recipe photographed at every step</title>
  <style>
    .photograph-analogy-bg   { fill: #f8fafc; }
    .photograph-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .photograph-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .photograph-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .photograph-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .photograph-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .photograph-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .photograph-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .photograph-analogy-row { opacity: 1; }
    .photograph-analogy-r0 { animation-delay: 0.00s; }
    .photograph-analogy-r1 { animation-delay: 0.45s; }
    .photograph-analogy-r2 { animation-delay: 0.90s; }
    .photograph-analogy-r3 { animation-delay: 1.35s; }
    .photograph-analogy-r4 { animation-delay: 1.80s; }
    .photograph-analogy-row { animation: photograph-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes photograph-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="photograph-analogy-bg" width="980" height="390"/>
  <text class="photograph-analogy-h1"  x="30" y="40">A recipe photographed at every step</text>
  <text class="photograph-analogy-sub" x="30" y="64">You may resume from any photograph.</text>
  <rect class="photograph-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="photograph-analogy-name" x="46" y="122">Changed at step two</text>
  <text class="photograph-analogy-desc" x="46" y="142">Almost the whole dish again.</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r0" x="46" y="182">Every photograph from two onward is worthless</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r1" x="46" y="216">Steps three to ten are repeated</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r2" x="46" y="250">The cooking is identical</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r3" x="46" y="284">Only the position changed</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r4" x="46" y="318">This is COPY . . at line three</text>
  <rect class="photograph-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="photograph-analogy-name" x="526" y="122">Changed at step nine</text>
  <text class="photograph-analogy-desc" x="526" y="142">Resume from photograph eight.</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r0" x="526" y="182">Photographs one to eight still hold</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r1" x="526" y="216">One step is repeated</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r2" x="526" y="250">The cooking is identical</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r3" x="526" y="284">Only the position changed</text>
  <text class="photograph-analogy-desc photograph-analogy-row photograph-analogy-r4" x="526" y="318">This is COPY src/ at the bottom</text>
  <text class="photograph-analogy-sub" x="30" y="372">And the part that maps exactly: you cannot resume from photograph nine because step nine is unchanged — step nine assumed the pan looked like photograph eight, so if eight is gone, nine is gone too.</text>
</svg>
