<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Because reviews are not uniformly positive.">
  <title>Aspect-based sentiment</title>
  <style>
    .absa-bg   { fill: #f8fafc; }
    .absa-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absa-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absa-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absa-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absa-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absa-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .absa-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .absa-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .absa-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .absa-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .absa-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .absa-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .absa-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .absa-stage { opacity: 1; }

    .absa-s0 { animation-delay: 0.00s; }
    .absa-e0 { animation-delay: 0.00s; }
    .absa-s1 { animation-delay: 1.50s; }
    .absa-e1 { animation-delay: 1.50s; }
    .absa-s2 { animation-delay: 3.00s; }
    .absa-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .absa-conn  { animation: absa-trace 6s ease-in-out infinite; }
      .absa-stage { animation: absa-arrive 6s ease-in-out infinite; }
    }
    @keyframes absa-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes absa-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .absa-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .absa-stage { animation: absa-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes absa-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="absa-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="absa-bg" width="980" height="322"/>
  <text class="absa-h1"  x="30" y="40">Aspect-based sentiment</text>
  <text class="absa-sub" x="30" y="64">Because reviews are not uniformly positive.</text>
  <g class="absa-stage absa-s0">
    <rect class="absa-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="absa-step" x="44" y="142">01</text>
    <text class="absa-name" x="70" y="142">Real reviews are mixed</text>
    <text class="absa-desc" x="44" y="166">"The food was excellent, the service was</text>
    <text class="absa-desc" x="44" y="182">appalling."</text>
  </g>
  <line class="absa-line absa-conn absa-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#absa-tip)"/>
  <g class="absa-stage absa-s1">
    <rect class="absa-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="absa-step" x="359" y="142">02</text>
    <text class="absa-name" x="385" y="142">An overall score averages them away</text>
    <text class="absa-desc" x="359" y="166">Producing a neutral rating that describes</text>
    <text class="absa-desc" x="359" y="182">nothing.</text>
  </g>
  <line class="absa-line absa-conn absa-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#absa-tip)"/>
  <g class="absa-stage absa-s2">
    <rect class="absa-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="absa-step" x="674" y="142">03</text>
    <text class="absa-name" x="700" y="142">Extract aspects, then score each</text>
    <text class="absa-desc" x="674" y="166">Food: positive. Service: negative.</text>
    <text class="absa-desc" x="674" y="182">Actionable.</text>
  </g>
  <text class="absa-sub" x="30" y="304">The averaging failure is what makes overall sentiment much less useful commercially than it appears: a business acts on which aspect is failing, and a neutral score names nothing to fix.</text>
</svg>
