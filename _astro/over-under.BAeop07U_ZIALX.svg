<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Opposite remedies.">
  <title>The two ways to fail</title>
  <style>
    .over-under-bg   { fill: #f8fafc; }
    .over-under-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .over-under-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .over-under-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .over-under-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .over-under-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .over-under-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .over-under-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .over-under-row { opacity: 1; }
    .over-under-r0 { animation-delay: 0.00s; }
    .over-under-r1 { animation-delay: 0.45s; }
    .over-under-r2 { animation-delay: 0.90s; }
    .over-under-r3 { animation-delay: 1.35s; }
    .over-under-r4 { animation-delay: 1.80s; }
    .over-under-row { animation: over-under-reveal 7.3s ease-in-out infinite; }
    @keyframes over-under-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="over-under-bg" width="980" height="390"/>
  <text class="over-under-h1"  x="30" y="40">The two ways to fail</text>
  <text class="over-under-sub" x="30" y="64">Opposite remedies.</text>
  <rect class="over-under-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="over-under-name" x="46" y="122">Underfitting</text>
  <text class="over-under-desc" x="46" y="142">Too simple.</text>
  <text class="over-under-desc over-under-row over-under-r0" x="46" y="182">Poor on training data</text>
  <text class="over-under-desc over-under-row over-under-r1" x="46" y="216">Poor on unseen data, and about the same</text>
  <text class="over-under-desc over-under-row over-under-r2" x="46" y="250">The model cannot represent the pattern</text>
  <text class="over-under-desc over-under-row over-under-r3" x="46" y="284">More data changes nothing</text>
  <text class="over-under-desc over-under-row over-under-r4" x="46" y="318">Fix: more capacity, or better features</text>
  <rect class="over-under-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="over-under-name" x="526" y="122">Overfitting</text>
  <text class="over-under-desc" x="526" y="142">Too flexible.</text>
  <text class="over-under-desc over-under-row over-under-r0" x="526" y="182">Excellent on training data</text>
  <text class="over-under-desc over-under-row over-under-r1" x="526" y="216">Much worse on unseen data</text>
  <text class="over-under-desc over-under-row over-under-r2" x="526" y="250">The model memorised the sample</text>
  <text class="over-under-desc over-under-row over-under-r3" x="526" y="284">More data helps directly</text>
  <text class="over-under-desc over-under-row over-under-r4" x="526" y="318">Fix: regularise, or simplify</text>
  <text class="over-under-sub" x="30" y="372">The remedies are opposites, which is why diagnosing before treating matters more here than almost anywhere else in the curriculum.</text>
</svg>
