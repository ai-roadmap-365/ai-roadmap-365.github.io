<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different jobs.">
  <title>Formatter against linter</title>
  <style>
    .format-lint-bg   { fill: #f8fafc; }
    .format-lint-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-lint-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-lint-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-lint-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-lint-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-lint-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .format-lint-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .format-lint-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .format-lint-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .format-lint-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .format-lint-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .format-lint-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .format-lint-row { opacity: 1; }
    .format-lint-r0 { animation-delay: 0.00s; }
    .format-lint-r1 { animation-delay: 0.45s; }
    .format-lint-r2 { animation-delay: 0.90s; }
    .format-lint-r3 { animation-delay: 1.35s; }
    .format-lint-r4 { animation-delay: 1.80s; }
    .format-lint-row { animation: format-lint-reveal 7.3s ease-in-out infinite; }
    @keyframes format-lint-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="format-lint-bg" width="980" height="390"/>
  <text class="format-lint-h1"  x="30" y="40">Formatter against linter</text>
  <text class="format-lint-sub" x="30" y="64">Different jobs.</text>
  <rect class="format-lint-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="format-lint-name" x="46" y="122">A formatter</text>
  <text class="format-lint-desc" x="46" y="142">Rewrites.</text>
  <text class="format-lint-desc format-lint-row format-lint-r0" x="46" y="182">Changes layout automatically</text>
  <text class="format-lint-desc format-lint-row format-lint-r1" x="46" y="216">No decisions to argue about</text>
  <text class="format-lint-desc format-lint-row format-lint-r2" x="46" y="250">Never changes behaviour</text>
  <text class="format-lint-desc format-lint-row format-lint-r3" x="46" y="284">Runs on save</text>
  <text class="format-lint-desc format-lint-row format-lint-r4" x="46" y="318">Ends style debates</text>
  <rect class="format-lint-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="format-lint-name" x="526" y="122">A linter</text>
  <text class="format-lint-desc" x="526" y="142">Reports.</text>
  <text class="format-lint-desc format-lint-row format-lint-r0" x="526" y="182">Flags problems for you to fix</text>
  <text class="format-lint-desc format-lint-row format-lint-r1" x="526" y="216">Rules can be configured and argued about</text>
  <text class="format-lint-desc format-lint-row format-lint-r2" x="526" y="250">Some fixes change behaviour</text>
  <text class="format-lint-desc format-lint-row format-lint-r3" x="526" y="284">Runs in the build</text>
  <text class="format-lint-desc format-lint-row format-lint-r4" x="526" y="318">Finds real defects</text>
  <text class="format-lint-sub" x="30" y="372">Letting the formatter own layout and the linter own correctness is what keeps the configuration small and the arguments few.</text>
</svg>
