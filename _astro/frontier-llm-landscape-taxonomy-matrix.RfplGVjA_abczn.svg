<svg role="img" aria-label="Frontier LLM landscape taxonomy matrix categorizing leading AI models by capability, latency, and cost" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>The Frontier LLM Landscape Taxonomy</title>
  <defs>
    <linearGradient id="bg241a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card241" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg241a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">FRONTIER LLM LANDSCAPE TAXONOMY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Capability vs. Cost &amp; Latency Across Proprietary APIs and Open Weights</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card241)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Quadrant 1: Frontier Commercial Tier -->
    <rect x="25" y="25" width="345" height="120" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="197" y="48" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Frontier Flagship Tier (High Cap / Moderate Cost)</text>
    <text x="40" y="70" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">Claude 3.5 Sonnet:</tspan> SOTA coding, reasoning, artifacts ($3/$15 per M)</text>
    <text x="40" y="88" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">GPT-4o:</tspan> Omnichannel native audio/vision, fast multimodal ($2.50/$10)</text>
    <text x="40" y="106" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">Gemini 1.5 Pro:</tspan> 2,000,000 token context window, deep retrieval</text>
    <text x="40" y="124" fill="#94a3b8" font-size="8">• <tspan fill="#f8fafc" font-weight="700">OpenAI o1 / o3-mini:</tspan> Native test-time chain-of-thought reasoning</text>

    <!-- Quadrant 2: Fast Workhorse Tier -->
    <rect x="390" y="25" width="345" height="120" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="562" y="48" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">High-Speed Workhorse Tier (Ultra-Low Latency &amp; Cost)</text>
    <text x="405" y="70" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">Gemini 2.0 Flash:</tspan> 200+ tok/sec, multimodal, ultra-cheap ($0.10/$0.40)</text>
    <text x="405" y="88" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">Claude 3.5 Haiku:</tspan> Sub-second latency, near-Sonnet speed</text>
    <text x="405" y="106" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">GPT-4o-mini:</tspan> High-throughput lightweight classifier &amp; parser ($0.15/$0.60)</text>
    <text x="405" y="124" fill="#94a3b8" font-size="8">• Best for: high-volume summarization, JSON parsing, routing</text>

    <!-- Quadrant 3: Open Weights Frontier -->
    <rect x="25" y="160" width="345" height="120" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="197" y="183" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Open-Weights Flagships (Self-Hostable SOTA)</text>
    <text x="40" y="205" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">LLaMA-3.1 405B:</tspan> Dense frontier open weights, synthetic data teacher</text>
    <text x="40" y="223" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">DeepSeek-V3 / R1:</tspan> 671B MoE (37B active), MLA attention, SOTA math</text>
    <text x="40" y="241" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">Qwen-2.5 72B:</tspan> Exceptional coding, multilingual mastery, 128k context</text>
    <text x="40" y="259" fill="#94a3b8" font-size="8">• Best for: data privacy, air-gapped VPCs, custom fine-tuning</text>

    <!-- Quadrant 4: Edge & Local Models -->
    <rect x="390" y="160" width="345" height="120" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="562" y="183" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">Local &amp; Edge Workhorses (On-Device &amp; Laptop)</text>
    <text x="405" y="205" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">LLaMA-3.1 8B / 70B:</tspan> The standard open foundation backbone</text>
    <text x="405" y="223" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">Gemma-2 9B / 27B:</tspan> Google architecture, sliding window attention</text>
    <text x="405" y="241" fill="#cbd5e1" font-size="8">• <tspan fill="#f8fafc" font-weight="700">Phi-3.5 / 4 (Microsoft):</tspan> Highly filtered textbook pretraining</text>
    <text x="405" y="259" fill="#94a3b8" font-size="8">• Best for: Apple Silicon / Ollama local execution, mobile apps</text>
  </g>
</svg>
