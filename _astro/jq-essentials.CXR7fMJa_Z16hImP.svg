<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="These cover almost everything. The rest is a rabbit hole.">
  <title>The four bits of jq worth learning</title>
  <style>
    .jq-essentials-bg   { fill: #f8fafc; }
    .jq-essentials-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jq-essentials-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jq-essentials-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jq-essentials-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jq-essentials-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jq-essentials-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .jq-essentials-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .jq-essentials-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .jq-essentials-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .jq-essentials-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .jq-essentials-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .jq-essentials-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .jq-essentials-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .jq-essentials-stage { opacity: 1; }

    .jq-essentials-s0 { animation-delay: 0.00s; }
    .jq-essentials-e0 { animation-delay: 0.00s; }
    .jq-essentials-s1 { animation-delay: 1.28s; }
    .jq-essentials-e1 { animation-delay: 1.28s; }
    .jq-essentials-s2 { animation-delay: 2.56s; }
    .jq-essentials-e2 { animation-delay: 2.56s; }
    .jq-essentials-s3 { animation-delay: 3.84s; }
    .jq-essentials-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .jq-essentials-conn  { animation: jq-essentials-trace 6.4s ease-in-out infinite; }
      .jq-essentials-stage { animation: jq-essentials-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes jq-essentials-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes jq-essentials-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .jq-essentials-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .jq-essentials-stage { animation: jq-essentials-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes jq-essentials-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="jq-essentials-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="jq-essentials-bg" width="980" height="322"/>
  <text class="jq-essentials-h1"  x="30" y="40">The four bits of jq worth learning</text>
  <text class="jq-essentials-sub" x="30" y="64">These cover almost everything. The rest is a rabbit hole.</text>
  <g class="jq-essentials-stage jq-essentials-s0">
    <rect class="jq-essentials-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="jq-essentials-step" x="44" y="142">01</text>
    <text class="jq-essentials-name" x="70" y="142">A path</text>
    <text class="jq-essentials-desc" x="44" y="166">.current.temperature_2m — enter</text>
    <text class="jq-essentials-desc" x="44" y="182">each object in turn.</text>
    <text class="jq-essentials-edge" x="44" y="242">.a.b</text>
  </g>
  <line class="jq-essentials-line jq-essentials-conn jq-essentials-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#jq-essentials-tip)"/>
  <g class="jq-essentials-stage jq-essentials-s1">
    <rect class="jq-essentials-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="jq-essentials-step" x="280" y="142">02</text>
    <text class="jq-essentials-name" x="306" y="142">An array index</text>
    <text class="jq-essentials-desc" x="280" y="166">.choices[0].message.content —</text>
    <text class="jq-essentials-desc" x="280" y="182">the first element, then onward.</text>
    <text class="jq-essentials-edge" x="280" y="242">[0]</text>
  </g>
  <line class="jq-essentials-line jq-essentials-conn jq-essentials-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#jq-essentials-tip)"/>
  <g class="jq-essentials-stage jq-essentials-s2">
    <rect class="jq-essentials-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="jq-essentials-step" x="516" y="142">03</text>
    <text class="jq-essentials-name" x="542" y="142">select</text>
    <text class="jq-essentials-desc" x="516" y="166">.items[] | select(.active) —</text>
    <text class="jq-essentials-desc" x="516" y="182">keep only what matches.</text>
    <text class="jq-essentials-edge" x="516" y="242">select</text>
  </g>
  <line class="jq-essentials-line jq-essentials-conn jq-essentials-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#jq-essentials-tip)"/>
  <g class="jq-essentials-stage jq-essentials-s3">
    <rect class="jq-essentials-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="jq-essentials-step" x="752" y="142">04</text>
    <text class="jq-essentials-name" x="778" y="142">-r for raw output</text>
    <text class="jq-essentials-desc" x="752" y="166">Strings without their quotes,</text>
    <text class="jq-essentials-desc" x="752" y="182">which matters the moment you use</text>
    <text class="jq-essentials-desc" x="752" y="198">the value.</text>
    <text class="jq-essentials-edge" x="752" y="242">-r</text>
  </g>
  <text class="jq-essentials-sub" x="30" y="304">Learn these four and stop. jq is a complete programming language, and the point at which you need the rest of it is the point at which you should be writing Python.</text>
</svg>
