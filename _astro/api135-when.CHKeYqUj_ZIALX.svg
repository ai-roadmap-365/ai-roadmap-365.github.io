<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to fetch programmatically</title>
  <style>
    .api135-when-bg   { fill: #f8fafc; }
    .api135-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api135-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api135-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api135-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api135-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api135-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api135-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api135-when-row { opacity: 1; }
    .api135-when-r0 { animation-delay: 0.00s; }
    .api135-when-r1 { animation-delay: 0.45s; }
    .api135-when-r2 { animation-delay: 0.90s; }
    .api135-when-r3 { animation-delay: 1.35s; }
    .api135-when-r4 { animation-delay: 1.80s; }
    .api135-when-row { animation: api135-when-reveal 7.3s ease-in-out infinite; }
    @keyframes api135-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="api135-when-bg" width="980" height="390"/>
  <text class="api135-when-h1"  x="30" y="40">When to fetch programmatically</text>
  <text class="api135-when-sub" x="30" y="64">And when not to.</text>
  <rect class="api135-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="api135-when-name" x="46" y="122">Fetch it</text>
  <text class="api135-when-desc" x="46" y="142">Four cases.</text>
  <text class="api135-when-desc api135-when-row api135-when-r0" x="46" y="182">Data that updates and must be current</text>
  <text class="api135-when-desc api135-when-row api135-when-r1" x="46" y="216">A subset of a very large source</text>
  <text class="api135-when-desc api135-when-row api135-when-r2" x="46" y="250">Repeated collection on a schedule</text>
  <text class="api135-when-desc api135-when-row api135-when-r3" x="46" y="284">Where a bulk download is unavailable</text>
  <text class="api135-when-desc api135-when-row api135-when-r4" x="46" y="318">Where the terms permit it</text>
  <rect class="api135-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="api135-when-name" x="526" y="122">Do not</text>
  <text class="api135-when-desc" x="526" y="142">Also four.</text>
  <text class="api135-when-desc api135-when-row api135-when-r0" x="526" y="182">A bulk download exists — use it</text>
  <text class="api135-when-desc api135-when-row api135-when-r1" x="526" y="216">A one-off look at static data</text>
  <text class="api135-when-desc api135-when-row api135-when-r2" x="526" y="250">Where the quota cannot cover it</text>
  <text class="api135-when-desc api135-when-row api135-when-r3" x="526" y="284">Where the terms forbid your use</text>
  <text class="api135-when-desc api135-when-row api135-when-r4" x="526" y="318">Where a cached copy would do</text>
  <text class="api135-when-sub" x="30" y="372">Preferring a bulk download when one exists saves quota, time and complexity, and it is frequently overlooked in favour of the more interesting interface.</text>
</svg>
