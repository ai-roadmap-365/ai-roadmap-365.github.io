<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Only the string passes between them.">
  <title>Two programs that never share memory</title>
  <style>
    .serialize-parse-symmetry-bg   { fill: #f8fafc; }
    .serialize-parse-symmetry-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialize-parse-symmetry-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialize-parse-symmetry-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialize-parse-symmetry-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialize-parse-symmetry-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialize-parse-symmetry-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serialize-parse-symmetry-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .serialize-parse-symmetry-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .serialize-parse-symmetry-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .serialize-parse-symmetry-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .serialize-parse-symmetry-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .serialize-parse-symmetry-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .serialize-parse-symmetry-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .serialize-parse-symmetry-stage { opacity: 1; }

    .serialize-parse-symmetry-s0 { animation-delay: 0.00s; }
    .serialize-parse-symmetry-e0 { animation-delay: 0.00s; }
    .serialize-parse-symmetry-s1 { animation-delay: 1.28s; }
    .serialize-parse-symmetry-e1 { animation-delay: 1.28s; }
    .serialize-parse-symmetry-s2 { animation-delay: 2.56s; }
    .serialize-parse-symmetry-e2 { animation-delay: 2.56s; }
    .serialize-parse-symmetry-s3 { animation-delay: 3.84s; }
    .serialize-parse-symmetry-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .serialize-parse-symmetry-conn  { animation: serialize-parse-symmetry-trace 6.4s ease-in-out infinite; }
      .serialize-parse-symmetry-stage { animation: serialize-parse-symmetry-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes serialize-parse-symmetry-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes serialize-parse-symmetry-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .serialize-parse-symmetry-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .serialize-parse-symmetry-stage { animation: serialize-parse-symmetry-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes serialize-parse-symmetry-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="serialize-parse-symmetry-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="serialize-parse-symmetry-bg" width="980" height="322"/>
  <text class="serialize-parse-symmetry-h1"  x="30" y="40">Two programs that never share memory</text>
  <text class="serialize-parse-symmetry-sub" x="30" y="64">Only the string passes between them.</text>
  <g class="serialize-parse-symmetry-stage serialize-parse-symmetry-s0">
    <rect class="serialize-parse-symmetry-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="serialize-parse-symmetry-step" x="44" y="142">01</text>
    <text class="serialize-parse-symmetry-name" x="70" y="142">A value in memory</text>
    <text class="serialize-parse-symmetry-desc" x="44" y="166">A dictionary, a list, a number —</text>
    <text class="serialize-parse-symmetry-desc" x="44" y="182">in one language's own</text>
    <text class="serialize-parse-symmetry-desc" x="44" y="198">representation.</text>
  </g>
  <line class="serialize-parse-symmetry-line serialize-parse-symmetry-conn serialize-parse-symmetry-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#serialize-parse-symmetry-tip)"/>
  <g class="serialize-parse-symmetry-stage serialize-parse-symmetry-s1">
    <rect class="serialize-parse-symmetry-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="serialize-parse-symmetry-step" x="280" y="142">02</text>
    <text class="serialize-parse-symmetry-name" x="306" y="142">Serialize</text>
    <text class="serialize-parse-symmetry-desc" x="280" y="166">Walk it and write the matching</text>
    <text class="serialize-parse-symmetry-desc" x="280" y="182">text. Objects become braces,</text>
    <text class="serialize-parse-symmetry-desc" x="280" y="198">lists become brackets.</text>
    <text class="serialize-parse-symmetry-edge" x="280" y="242">to text</text>
  </g>
  <line class="serialize-parse-symmetry-line serialize-parse-symmetry-conn serialize-parse-symmetry-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#serialize-parse-symmetry-tip)"/>
  <g class="serialize-parse-symmetry-stage serialize-parse-symmetry-s2">
    <rect class="serialize-parse-symmetry-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="serialize-parse-symmetry-step" x="516" y="142">03</text>
    <text class="serialize-parse-symmetry-name" x="542" y="142">It travels as plain bytes</text>
    <text class="serialize-parse-symmetry-desc" x="516" y="166">Over a network, or into a file.</text>
    <text class="serialize-parse-symmetry-desc" x="516" y="182">Nothing about the original</text>
    <text class="serialize-parse-symmetry-desc" x="516" y="198">language survives.</text>
    <text class="serialize-parse-symmetry-edge" x="516" y="242">bytes</text>
  </g>
  <line class="serialize-parse-symmetry-line serialize-parse-symmetry-conn serialize-parse-symmetry-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#serialize-parse-symmetry-tip)"/>
  <g class="serialize-parse-symmetry-stage serialize-parse-symmetry-s3">
    <rect class="serialize-parse-symmetry-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="serialize-parse-symmetry-step" x="752" y="142">04</text>
    <text class="serialize-parse-symmetry-name" x="778" y="142">Parse</text>
    <text class="serialize-parse-symmetry-desc" x="752" y="166">Read it back into an equivalent</text>
    <text class="serialize-parse-symmetry-desc" x="752" y="182">value, in whatever language is</text>
    <text class="serialize-parse-symmetry-desc" x="752" y="198">receiving.</text>
    <text class="serialize-parse-symmetry-edge" x="752" y="242">to value</text>
  </g>
  <text class="serialize-parse-symmetry-sub" x="30" y="304">This is why the string must be self-contained: nothing crosses but the text, so anything the receiver needs and cannot see in it is simply gone.</text>
</svg>
