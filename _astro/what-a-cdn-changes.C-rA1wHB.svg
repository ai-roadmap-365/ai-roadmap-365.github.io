<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Distance, and nothing else.">
  <title>What a content delivery network actually buys</title>
  <style>
    .what-a-cdn-changes-bg   { fill: #f8fafc; }
    .what-a-cdn-changes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-cdn-changes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-cdn-changes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-cdn-changes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-cdn-changes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-cdn-changes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-a-cdn-changes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .what-a-cdn-changes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .what-a-cdn-changes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .what-a-cdn-changes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .what-a-cdn-changes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .what-a-cdn-changes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-a-cdn-changes-row { opacity: 1; }
    .what-a-cdn-changes-r0 { animation-delay: 0.00s; }
    .what-a-cdn-changes-r1 { animation-delay: 0.45s; }
    .what-a-cdn-changes-r2 { animation-delay: 0.90s; }
    .what-a-cdn-changes-r3 { animation-delay: 1.35s; }
    .what-a-cdn-changes-r4 { animation-delay: 1.80s; }
    .what-a-cdn-changes-row { animation: what-a-cdn-changes-reveal 7.3s ease-in-out infinite; }
    @keyframes what-a-cdn-changes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="what-a-cdn-changes-bg" width="980" height="390"/>
  <text class="what-a-cdn-changes-h1"  x="30" y="40">What a content delivery network actually buys</text>
  <text class="what-a-cdn-changes-sub" x="30" y="64">Distance, and nothing else.</text>
  <rect class="what-a-cdn-changes-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="what-a-cdn-changes-name" x="46" y="122">One origin</text>
  <text class="what-a-cdn-changes-desc" x="46" y="142">Everyone reaches the same machine.</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r0" x="46" y="182">Near users cost 20 ms per round trip</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r1" x="46" y="216">Distant users cost 150 ms or more</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r2" x="46" y="250">Setup alone is three or four of those</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r3" x="46" y="284">A faster server changes none of it</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r4" x="46" y="318">Physics, not capacity</text>
  <rect class="what-a-cdn-changes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="what-a-cdn-changes-name" x="526" y="122">Edge locations</text>
  <text class="what-a-cdn-changes-desc" x="526" y="142">A copy near each user.</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r0" x="526" y="182">Almost everyone is now near a copy</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r1" x="526" y="216">Round trips fall to tens of milliseconds</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r2" x="526" y="250">Handshakes terminate at the edge too</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r3" x="526" y="284">The origin serves the edges, not the world</text>
  <text class="what-a-cdn-changes-desc what-a-cdn-changes-row what-a-cdn-changes-r4" x="526" y="318">The product IS the shorter distance</text>
  <text class="what-a-cdn-changes-sub" x="30" y="372">This is why a CDN helps a slow site more than a bigger server does, and why it does nothing at all for a request that must reach your database anyway.</text>
</svg>
