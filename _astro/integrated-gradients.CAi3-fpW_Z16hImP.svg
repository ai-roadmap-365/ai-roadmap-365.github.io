<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two axioms they violate.">
  <title>Why plain gradients are not enough</title>
  <style>
    .integrated-gradients-bg   { fill: #f8fafc; }
    .integrated-gradients-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-gradients-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-gradients-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-gradients-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-gradients-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-gradients-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .integrated-gradients-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .integrated-gradients-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .integrated-gradients-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .integrated-gradients-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .integrated-gradients-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .integrated-gradients-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .integrated-gradients-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .integrated-gradients-stage { opacity: 1; }

    .integrated-gradients-s0 { animation-delay: 0.00s; }
    .integrated-gradients-e0 { animation-delay: 0.00s; }
    .integrated-gradients-s1 { animation-delay: 1.28s; }
    .integrated-gradients-e1 { animation-delay: 1.28s; }
    .integrated-gradients-s2 { animation-delay: 2.56s; }
    .integrated-gradients-e2 { animation-delay: 2.56s; }
    .integrated-gradients-s3 { animation-delay: 3.84s; }
    .integrated-gradients-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .integrated-gradients-conn  { animation: integrated-gradients-trace 6.4s ease-in-out infinite; }
      .integrated-gradients-stage { animation: integrated-gradients-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes integrated-gradients-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes integrated-gradients-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .integrated-gradients-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .integrated-gradients-stage { animation: integrated-gradients-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes integrated-gradients-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="integrated-gradients-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="integrated-gradients-bg" width="980" height="322"/>
  <text class="integrated-gradients-h1"  x="30" y="40">Why plain gradients are not enough</text>
  <text class="integrated-gradients-sub" x="30" y="64">Two axioms they violate.</text>
  <g class="integrated-gradients-stage integrated-gradients-s0">
    <rect class="integrated-gradients-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="integrated-gradients-step" x="44" y="142">01</text>
    <text class="integrated-gradients-name" x="70" y="142">Sensitivity fails at saturation</text>
    <text class="integrated-gradients-desc" x="44" y="166">A feature that determines the</text>
    <text class="integrated-gradients-desc" x="44" y="182">output can have zero gradient</text>
    <text class="integrated-gradients-desc" x="44" y="198">there.</text>
  </g>
  <line class="integrated-gradients-line integrated-gradients-conn integrated-gradients-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#integrated-gradients-tip)"/>
  <g class="integrated-gradients-stage integrated-gradients-s1">
    <rect class="integrated-gradients-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="integrated-gradients-step" x="280" y="142">02</text>
    <text class="integrated-gradients-name" x="306" y="142">Completeness fails too</text>
    <text class="integrated-gradients-desc" x="280" y="166">Attributions do not sum to the</text>
    <text class="integrated-gradients-desc" x="280" y="182">difference from a baseline.</text>
  </g>
  <line class="integrated-gradients-line integrated-gradients-conn integrated-gradients-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#integrated-gradients-tip)"/>
  <g class="integrated-gradients-stage integrated-gradients-s2">
    <rect class="integrated-gradients-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="integrated-gradients-step" x="516" y="142">03</text>
    <text class="integrated-gradients-name" x="542" y="142">Integrate along a path from a baseline</text>
    <text class="integrated-gradients-desc" x="516" y="166">Accumulating gradients between</text>
    <text class="integrated-gradients-desc" x="516" y="182">an empty input and the real one.</text>
    <text class="integrated-gradients-edge" x="516" y="242">path</text>
  </g>
  <line class="integrated-gradients-line integrated-gradients-conn integrated-gradients-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#integrated-gradients-tip)"/>
  <g class="integrated-gradients-stage integrated-gradients-s3">
    <rect class="integrated-gradients-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="integrated-gradients-step" x="752" y="142">04</text>
    <text class="integrated-gradients-name" x="778" y="142">Which satisfies both axioms</text>
    <text class="integrated-gradients-desc" x="752" y="166">At the cost of many forward</text>
    <text class="integrated-gradients-desc" x="752" y="182">passes.</text>
  </g>
  <text class="integrated-gradients-sub" x="30" y="304">Saturation is a real and common condition rather than a corner case: a confidently classified example sits where the output has flattened, and that is exactly where plain gradients report nothing.</text>
</svg>
