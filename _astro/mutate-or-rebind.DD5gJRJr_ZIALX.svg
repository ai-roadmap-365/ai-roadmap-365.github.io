<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One changes the object; one moves the label.">
  <title>Mutating and rebinding look similar and are not</title>
  <style>
    .mutate-or-rebind-bg   { fill: #f8fafc; }
    .mutate-or-rebind-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutate-or-rebind-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutate-or-rebind-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutate-or-rebind-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutate-or-rebind-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutate-or-rebind-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mutate-or-rebind-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mutate-or-rebind-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mutate-or-rebind-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mutate-or-rebind-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mutate-or-rebind-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mutate-or-rebind-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mutate-or-rebind-row { opacity: 1; }
    .mutate-or-rebind-r0 { animation-delay: 0.00s; }
    .mutate-or-rebind-r1 { animation-delay: 0.45s; }
    .mutate-or-rebind-r2 { animation-delay: 0.90s; }
    .mutate-or-rebind-r3 { animation-delay: 1.35s; }
    .mutate-or-rebind-r4 { animation-delay: 1.80s; }
    .mutate-or-rebind-row { animation: mutate-or-rebind-reveal 7.3s ease-in-out infinite; }
    @keyframes mutate-or-rebind-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mutate-or-rebind-bg" width="980" height="390"/>
  <text class="mutate-or-rebind-h1"  x="30" y="40">Mutating and rebinding look similar and are not</text>
  <text class="mutate-or-rebind-sub" x="30" y="64">One changes the object; one moves the label.</text>
  <rect class="mutate-or-rebind-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mutate-or-rebind-name" x="46" y="122">b.append(4)</text>
  <text class="mutate-or-rebind-desc" x="46" y="142">Changes the object.</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r0" x="46" y="182">The one list gains an element</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r1" x="46" y="216">a sees it too — same object</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r2" x="46" y="250">id(a) and id(b) are unchanged</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r3" x="46" y="284">This is what surprises callers</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r4" x="46" y="318">Only possible on mutable types</text>
  <rect class="mutate-or-rebind-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mutate-or-rebind-name" x="526" y="122">b = "hello"</text>
  <text class="mutate-or-rebind-desc" x="526" y="142">Moves the label.</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r0" x="526" y="182">A new string object is created</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r1" x="526" y="216">b now points at it</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r2" x="526" y="250">a is completely untouched</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r3" x="526" y="284">id(b) changes; id(a) does not</text>
  <text class="mutate-or-rebind-desc mutate-or-rebind-row mutate-or-rebind-r4" x="526" y="318">Works on any type</text>
  <text class="mutate-or-rebind-sub" x="30" y="372">Watch it with id(): after a string "modification" the id changes because a new object was made, and after a list mutation it stays the same because there is still one object.</text>
</svg>
