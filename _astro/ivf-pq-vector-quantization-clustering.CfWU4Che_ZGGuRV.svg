<svg role="img" aria-label="IVF-PQ vector quantization clustering diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>IVF-PQ Inverted File with Product Quantization</title>
  <defs>
    <linearGradient id="bg262b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card262b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg262b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">IVF-PQ: INVERTED FILE &amp; PRODUCT QUANTIZATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Clustering Voronoi Cells Combined with Sub-Vector Centroid Byte Encoding</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card262b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. IVF Voronoi Partitioning -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="195" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. IVF (Inverted File Partitioning)</text>
    
    <rect x="40" y="70" width="310" height="85" fill="#1e293b" rx="4"/>
    <text x="50" y="90" fill="#cbd5e1" font-size="8">• K-Means clusters space into C Voronoi centroids</text>
    <text x="50" y="105" fill="#34d399" font-size="8">• Query only visits nprobe closest centroids</text>
    <text x="50" y="120" fill="#34d399" font-size="8">• Prunes 95% - 99% of unpromising vectors</text>
    <text x="50" y="135" fill="#cbd5e1" font-size="8">• Inverted List: Centroid_ID -&gt; [Doc_1, Doc_2, ...]</text>

    <circle cx="100" cy="205" r="28" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8"/>
    <circle cx="100" cy="205" r="4" fill="#38bdf8"/>
    <text x="100" y="225" fill="#38bdf8" font-size="7" text-anchor="middle">Cluster A</text>

    <circle cx="200" cy="190" r="28" fill="#34d399" fill-opacity="0.2" stroke="#34d399"/>
    <circle cx="200" cy="190" r="4" fill="#34d399"/>
    <text x="200" y="225" fill="#34d399" font-size="7" text-anchor="middle">Cluster B (Selected)</text>

    <circle cx="290" cy="210" r="28" fill="#fb7185" fill-opacity="0.2" stroke="#fb7185"/>
    <circle cx="290" cy="210" r="4" fill="#fb7185"/>
    <text x="290" y="225" fill="#fb7185" font-size="7" text-anchor="middle">Cluster C</text>

    <!-- 2. Product Quantization -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="565" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2. Product Quantization (PQ)</text>
    
    <rect x="410" y="70" width="310" height="85" fill="#1e293b" rx="4"/>
    <text x="420" y="90" fill="#cbd5e1" font-size="8">• Split 1536d vector into m = 96 sub-vectors (16d each)</text>
    <text x="420" y="105" fill="#34d399" font-size="8">• Quantize each sub-vector to nearest centroid byte (0-255)</text>
    <text x="420" y="120" fill="#34d399" font-size="8">• Storage: 6,144 bytes -&gt; 96 bytes (64x reduction!)</text>
    <text x="420" y="135" fill="#34d399" font-size="8">• Asymmetric Distance Computation (ADC) via lookup</text>

    <rect x="410" y="170" width="310" height="80" fill="#0f172a" stroke="#34d399" rx="4"/>
    <text x="420" y="190" fill="#38bdf8" font-size="8" font-weight="700">100M Vector Memory Requirement:</text>
    <text x="420" y="208" fill="#fb7185" font-size="8">• Raw FP32: 614.4 GB RAM</text>
    <text x="420" y="225" fill="#34d399" font-size="8" font-weight="700">• IVF-PQ (m=96): 9.6 GB RAM (Fits on a single server!)</text>
  </g>
</svg>
