<svg role="img" aria-label="Enterprise Model Registry architecture showing artifact hashing metadata schema contracts stage promotion and immutable blob storage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Enterprise Model Registry &amp; Lineage Architecture</title>
  <defs>
    <linearGradient id="bg193b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="regCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg193b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MODEL REGISTRY: ARTIFACT LINEAGE &amp; PROMOTION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Tracking Cryptographic SHA-256 Hashes, Training Datasets, and Stage Transitions</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#regCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Training Run -->
    <rect x="30" y="40" width="190" height="110" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="125" y="65" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Training Experiment</text>
    <text x="45" y="90" fill="#cbd5e1" font-family="system-ui" font-size="9">• Git Commit: a8f42c1</text>
    <text x="45" y="110" fill="#cbd5e1" font-family="system-ui" font-size="9">• Dataset Hash: dvc:8c3a..</text>
    <text x="45" y="130" fill="#cbd5e1" font-family="system-ui" font-size="9">• Metrics: PR-AUC 0.884</text>
    <!-- Arrow -->
    <line x1="220" y1="95" x2="280" y2="95" stroke="#64748b" stroke-width="2"/>
    <!-- Registry DB -->
    <rect x="280" y="30" width="200" height="235" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="380" y="55" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Model Registry Catalog</text>
    <rect x="295" y="70" width="170" height="40" fill="#1e293b" stroke="#64748b" rx="4"/>
    <text x="380" y="88" fill="#e2e8f0" font-family="system-ui" font-size="9" text-anchor="middle">v1.0.0 [ARCHIVED]</text>
    <text x="380" y="102" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">SHA-256: 3b1a8f... (S3 Bucket)</text>
    <rect x="295" y="120" width="170" height="40" fill="#1e293b" stroke="#3b82f6" rx="4"/>
    <text x="380" y="138" fill="#60a5fa" font-family="system-ui" font-size="9" text-anchor="middle">v1.1.0 [STAGING]</text>
    <text x="380" y="152" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">SHA-256: 7f4d2e... (S3 Bucket)</text>
    <rect x="295" y="170" width="170" height="40" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="380" y="188" fill="#34d399" font-family="system-ui" font-size="9" text-anchor="middle">v1.2.0 [PRODUCTION]</text>
    <text x="380" y="202" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">SHA-256: 9e8c4a... (S3 Bucket)</text>
    <!-- Arrow -->
    <line x1="480" y1="145" x2="540" y2="145" stroke="#64748b" stroke-width="2"/>
    <!-- Serving Pods -->
    <rect x="540" y="40" width="180" height="210" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="630" y="65" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Production Serving Pods</text>
    <text x="555" y="95" fill="#cbd5e1" font-family="system-ui" font-size="9">1. Pull Model by Name:tag</text>
    <text x="555" y="120" fill="#cbd5e1" font-family="system-ui" font-size="9">2. Verify SHA-256 Hash</text>
    <text x="555" y="145" fill="#cbd5e1" font-family="system-ui" font-size="9">3. Enforce Input Schema</text>
    <text x="555" y="170" fill="#cbd5e1" font-family="system-ui" font-size="9">4. Cold-Start Warmup</text>
    <text x="555" y="195" fill="#cbd5e1" font-family="system-ui" font-size="9">5. Route Live API QPS</text>
  </g>
</svg>
