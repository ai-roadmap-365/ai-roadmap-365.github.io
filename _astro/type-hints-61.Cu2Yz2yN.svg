<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four benefits.">
  <title>Type hints</title>
  <style>
    .type-hints-61-bg   { fill: #f8fafc; }
    .type-hints-61-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .type-hints-61-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .type-hints-61-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .type-hints-61-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .type-hints-61-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .type-hints-61-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .type-hints-61-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .type-hints-61-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .type-hints-61-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .type-hints-61-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .type-hints-61-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .type-hints-61-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .type-hints-61-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .type-hints-61-stage { opacity: 1; }

    .type-hints-61-s0 { animation-delay: 0.00s; }
    .type-hints-61-e0 { animation-delay: 0.00s; }
    .type-hints-61-s1 { animation-delay: 1.28s; }
    .type-hints-61-e1 { animation-delay: 1.28s; }
    .type-hints-61-s2 { animation-delay: 2.56s; }
    .type-hints-61-e2 { animation-delay: 2.56s; }
    .type-hints-61-s3 { animation-delay: 3.84s; }
    .type-hints-61-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .type-hints-61-conn  { animation: type-hints-61-trace 6.4s ease-in-out infinite; }
      .type-hints-61-stage { animation: type-hints-61-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes type-hints-61-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes type-hints-61-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .type-hints-61-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .type-hints-61-stage { animation: type-hints-61-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes type-hints-61-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="type-hints-61-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="type-hints-61-bg" width="980" height="322"/>
  <text class="type-hints-61-h1"  x="30" y="40">Type hints</text>
  <text class="type-hints-61-sub" x="30" y="64">Four benefits.</text>
  <g class="type-hints-61-stage type-hints-61-s0">
    <rect class="type-hints-61-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="type-hints-61-step" x="44" y="142">01</text>
    <text class="type-hints-61-name" x="70" y="142">They document the contract at the signature</text>
    <text class="type-hints-61-desc" x="44" y="166">Where a reader looks first.</text>
  </g>
  <line class="type-hints-61-line type-hints-61-conn type-hints-61-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#type-hints-61-tip)"/>
  <g class="type-hints-61-stage type-hints-61-s1">
    <rect class="type-hints-61-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="type-hints-61-step" x="280" y="142">02</text>
    <text class="type-hints-61-name" x="306" y="142">And a checker verifies they are true</text>
    <text class="type-hints-61-desc" x="280" y="166">Which comments cannot offer.</text>
  </g>
  <line class="type-hints-61-line type-hints-61-conn type-hints-61-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#type-hints-61-tip)"/>
  <g class="type-hints-61-stage type-hints-61-s2">
    <rect class="type-hints-61-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="type-hints-61-step" x="516" y="142">03</text>
    <text class="type-hints-61-name" x="542" y="142">While editors use them for completion and navigation</text>
    <text class="type-hints-61-desc" x="516" y="166">Which speeds everything up.</text>
  </g>
  <line class="type-hints-61-line type-hints-61-conn type-hints-61-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#type-hints-61-tip)"/>
  <g class="type-hints-61-stage type-hints-61-s3">
    <rect class="type-hints-61-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="type-hints-61-step" x="752" y="142">04</text>
    <text class="type-hints-61-name" x="778" y="142">And writing them exposes muddled designs</text>
    <text class="type-hints-61-desc" x="752" y="166">A type that is hard to name is</text>
    <text class="type-hints-61-desc" x="752" y="182">usually a design problem.</text>
  </g>
  <text class="type-hints-61-sub" x="30" y="304">The design pressure is the underrated benefit: a parameter that can be three unrelated types is usually three functions wearing one name.</text>
</svg>
