<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-labelledby="d125fTitleId d125fDescId">
  <title id="d125fTitleId">Every imputed value lands on the one line that cannot move</title>
  <desc id="d125fDescId">A histogram with a gap at its centre bin, where missing values belong. Tokens representing the missing values travel one at a time into the centre bin, which grows into a spike that was never in the original data. A horizontal line marks the column's mean and never moves throughout. A caption states that every imputed value lands on this unmoving line, which is why checking the mean after imputation proves nothing.</desc>

  <style>
    .d125f-bg      { fill: #f8fafc; }
    .d125f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d125f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d125f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #1a202c; }
    .d125f-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d125f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d125f-axis    { stroke: #64748b; stroke-width: 1.5; }
    .d125f-bar     { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.25; }
    .d125f-meanline{ stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 6 4; }
    .d125f-meanlbl { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .d125f-band    { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; }

    /* Motion 3 -- the centre bin grows in four staggered steps as tokens arrive. */
    .d125f-spike {
      transform-box: fill-box;
      transform-origin: bottom;
      animation: d125f-grow 7s ease-in-out infinite;
    }
    @keyframes d125f-grow {
      0%, 8%   { transform: scaleY(0.14); }
      28%      { transform: scaleY(0.40); }
      48%      { transform: scaleY(0.66); }
      68%, 100%{ transform: scaleY(1.0); }
    }

    /* Motion 1 -- four tokens travel from their resting spot into the centre bin,
       one after another, each resting fully visible before it moves. */
    .d125f-token { fill: #1d4ed8; animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .d125f-t1 { animation-name: d125f-move1; }
    .d125f-t2 { animation-name: d125f-move2; }
    .d125f-t3 { animation-name: d125f-move3; }
    .d125f-t4 { animation-name: d125f-move4; }
    @keyframes d125f-move1 {
      0%, 6%   { transform: translate(0, 0); opacity: 1; }
      22%, 100%{ transform: translate(0, -6px); opacity: 0.25; }
    }
    @keyframes d125f-move2 {
      0%, 18%  { transform: translate(0, 0); opacity: 1; }
      34%, 100%{ transform: translate(0, -6px); opacity: 0.25; }
    }
    @keyframes d125f-move3 {
      0%, 38%  { transform: translate(0, 0); opacity: 1; }
      54%, 100%{ transform: translate(0, -6px); opacity: 0.25; }
    }
    @keyframes d125f-move4 {
      0%, 58%  { transform: translate(0, 0); opacity: 1; }
      74%, 100%{ transform: translate(0, -6px); opacity: 0.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d125f-spike { animation: none; transform: scaleY(1.0); }
      .d125f-token { animation: none; transform: translate(0, -6px); opacity: 0.25; }
    }
  </style>

  <rect class="d125f-bg" x="0" y="0" width="980" height="480" />

  <text class="d125f-title" x="28" y="34">Every imputed value lands on the mean -- which never moves</text>
  <text class="d125f-sub" x="28" y="54">Watch the spike grow at the centre while the mean line beneath stays exactly where it started</text>

  <!-- ============================ HISTOGRAM ============================ -->
  <g>
    <line class="d125f-axis" x1="80" y1="330" x2="860" y2="330" />
    <line class="d125f-axis" x1="80" y1="90" x2="80" y2="330" />

    <!-- seven bars; bar 4 (index 3, centre) is the animated spike -->
    <rect class="d125f-bar" x="100" y="250" width="80" height="80" />
    <rect class="d125f-bar" x="190" y="190" width="80" height="140" />
    <rect class="d125f-bar" x="280" y="150" width="80" height="180" />

    <!-- centre bin: resting height is short (gap); grows via the spike animation -->
    <rect class="d125f-bar d125f-spike" x="370" y="70" width="80" height="260" />

    <rect class="d125f-bar" x="460" y="140" width="80" height="190" />
    <rect class="d125f-bar" x="550" y="200" width="80" height="130" />
    <rect class="d125f-bar" x="640" y="260" width="80" height="70" />

    <text class="d125f-small" x="90" y="346">low</text>
    <text class="d125f-small" x="670" y="346">high</text>
    <text class="d125f-label" x="380" y="360" text-anchor="middle">missing values arrive here</text>
  </g>

  <!-- ============================ TOKENS (resting beside the histogram, travel into the centre bin) ============================ -->
  <g>
    <circle class="d125f-token d125f-t1" cx="740" cy="400" r="9" />
    <circle class="d125f-token d125f-t2" cx="770" cy="400" r="9" />
    <circle class="d125f-token d125f-t3" cx="800" cy="400" r="9" />
    <circle class="d125f-token d125f-t4" cx="830" cy="400" r="9" />
    <text class="d125f-small" x="700" y="428">4 missing values, waiting</text>
  </g>

  <!-- ============================ MEAN LINE (never moves) ============================ -->
  <line class="d125f-meanline" x1="80" y1="230" x2="860" y2="230" />
  <text class="d125f-meanlbl" x="866" y="235">mean (fixed)</text>

  <!-- ============================ CAPTION BAND ============================ -->
  <rect class="d125f-band" x="16" y="400" width="640" height="66" />
  <text class="d125f-caption" x="30" y="424" font-weight="700">The mean line never moves, in any frame of this animation.</text>
  <text class="d125f-caption" x="30" y="446">That is exactly why checking the mean after imputation proves nothing --</text>
  <text class="d125f-caption" x="30" y="462">the spread and any real correlation moved instead. See "How it works."</text>
</svg>
