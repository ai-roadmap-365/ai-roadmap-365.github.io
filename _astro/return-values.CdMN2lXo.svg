<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four facts.">
  <title>Return values</title>
  <style>
    .return-values-bg   { fill: #f8fafc; }
    .return-values-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .return-values-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .return-values-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .return-values-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .return-values-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .return-values-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .return-values-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .return-values-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .return-values-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .return-values-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .return-values-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .return-values-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .return-values-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .return-values-stage { opacity: 1; }

    .return-values-s0 { animation-delay: 0.00s; }
    .return-values-e0 { animation-delay: 0.00s; }
    .return-values-s1 { animation-delay: 1.28s; }
    .return-values-e1 { animation-delay: 1.28s; }
    .return-values-s2 { animation-delay: 2.56s; }
    .return-values-e2 { animation-delay: 2.56s; }
    .return-values-s3 { animation-delay: 3.84s; }
    .return-values-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .return-values-conn  { animation: return-values-trace 6.4s ease-in-out infinite; }
      .return-values-stage { animation: return-values-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes return-values-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes return-values-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .return-values-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .return-values-stage { animation: return-values-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes return-values-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="return-values-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="return-values-bg" width="980" height="322"/>
  <text class="return-values-h1"  x="30" y="40">Return values</text>
  <text class="return-values-sub" x="30" y="64">Four facts.</text>
  <g class="return-values-stage return-values-s0">
    <rect class="return-values-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="return-values-step" x="44" y="142">01</text>
    <text class="return-values-name" x="70" y="142">A function with no return statement returns None</text>
    <text class="return-values-desc" x="44" y="166">Implicitly, and silently.</text>
  </g>
  <line class="return-values-line return-values-conn return-values-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#return-values-tip)"/>
  <g class="return-values-stage return-values-s1">
    <rect class="return-values-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="return-values-step" x="280" y="142">02</text>
    <text class="return-values-name" x="306" y="142">Returning several values returns a tuple</text>
    <text class="return-values-desc" x="280" y="166">Which the caller can unpack.</text>
  </g>
  <line class="return-values-line return-values-conn return-values-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#return-values-tip)"/>
  <g class="return-values-stage return-values-s2">
    <rect class="return-values-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="return-values-step" x="516" y="142">03</text>
    <text class="return-values-name" x="542" y="142">So multiple returns need no special syntax</text>
    <text class="return-values-desc" x="516" y="166">Unlike many languages.</text>
  </g>
  <line class="return-values-line return-values-conn return-values-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#return-values-tip)"/>
  <g class="return-values-stage return-values-s3">
    <rect class="return-values-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="return-values-step" x="752" y="142">04</text>
    <text class="return-values-name" x="778" y="142">But a function returning None and one returning a value</text>
    <text class="return-values-desc" x="752" y="166">Should not be the same function.</text>
  </g>
  <text class="return-values-sub" x="30" y="304">A function that sometimes returns a value and sometimes returns None forces every caller to check, which is a design smell rather than flexibility.</text>
</svg>
