<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which conventional software is not.">
  <title>A metered utility</title>
  <style>
    .utility-bill-bg   { fill: #f8fafc; }
    .utility-bill-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utility-bill-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utility-bill-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utility-bill-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utility-bill-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utility-bill-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .utility-bill-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .utility-bill-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .utility-bill-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .utility-bill-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .utility-bill-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .utility-bill-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .utility-bill-row { opacity: 1; }
    .utility-bill-r0 { animation-delay: 0.00s; }
    .utility-bill-r1 { animation-delay: 0.45s; }
    .utility-bill-r2 { animation-delay: 0.90s; }
    .utility-bill-r3 { animation-delay: 1.35s; }
    .utility-bill-r4 { animation-delay: 1.80s; }
    .utility-bill-row { animation: utility-bill-reveal 7.3s ease-in-out infinite; }
    @keyframes utility-bill-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="utility-bill-bg" width="980" height="390"/>
  <text class="utility-bill-h1"  x="30" y="40">A metered utility</text>
  <text class="utility-bill-sub" x="30" y="64">Which conventional software is not.</text>
  <rect class="utility-bill-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="utility-bill-name" x="46" y="122">Fixed capacity</text>
  <text class="utility-bill-desc" x="46" y="142">Paid whether used or not.</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r0" x="46" y="182">A server costs the same all month</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r1" x="46" y="216">A bug wastes capacity, not money</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r2" x="46" y="250">Cost known in advance</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r3" x="46" y="284">Scaling is a planning decision</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r4" x="46" y="318">This is conventional hosting</text>
  <rect class="utility-bill-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="utility-bill-name" x="526" y="122">Metered usage</text>
  <text class="utility-bill-desc" x="526" y="142">Paid per unit.</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r0" x="526" y="182">Every request costs money</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r1" x="526" y="216">A retry loop costs money quickly</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r2" x="526" y="250">Cost known only afterwards</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r3" x="526" y="284">Scaling is a spending decision</text>
  <text class="utility-bill-desc utility-bill-row utility-bill-r4" x="526" y="318">This is a model API</text>
  <text class="utility-bill-sub" x="30" y="372">The shift catches teams from a fixed-cost background: an infinite loop that used to peg a processor now produces an invoice.</text>
</svg>
