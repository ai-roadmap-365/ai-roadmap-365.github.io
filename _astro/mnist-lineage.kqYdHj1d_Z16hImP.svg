<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A benchmark, and what came after it.">
  <title>Why MNIST mattered</title>
  <style>
    .mnist-lineage-bg   { fill: #f8fafc; }
    .mnist-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mnist-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mnist-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mnist-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mnist-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mnist-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mnist-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mnist-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mnist-lineage-stage { opacity: 1; }

    .mnist-lineage-s0 { animation-delay: 0.00s; }
    .mnist-lineage-e0 { animation-delay: 0.00s; }
    .mnist-lineage-s1 { animation-delay: 1.50s; }
    .mnist-lineage-e1 { animation-delay: 1.50s; }
    .mnist-lineage-s2 { animation-delay: 3.00s; }
    .mnist-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .mnist-lineage-conn  { animation: mnist-lineage-trace 6s ease-in-out infinite; }
      .mnist-lineage-stage { animation: mnist-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes mnist-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mnist-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mnist-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mnist-lineage-stage { animation: mnist-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mnist-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mnist-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mnist-lineage-bg" width="980" height="322"/>
  <text class="mnist-lineage-h1"  x="30" y="40">Why MNIST mattered</text>
  <text class="mnist-lineage-sub" x="30" y="64">A benchmark, and what came after it.</text>
  <g class="mnist-lineage-stage mnist-lineage-s0">
    <rect class="mnist-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="mnist-lineage-step" x="44" y="142">01</text>
    <text class="mnist-lineage-name" x="70" y="142">1998: MNIST published</text>
    <text class="mnist-lineage-desc" x="44" y="166">Handwritten digits, a fixed split, and a</text>
    <text class="mnist-lineage-desc" x="44" y="182">leaderboard.</text>
    <text class="mnist-lineage-edge" x="44" y="242">comparable</text>
  </g>
  <line class="mnist-lineage-line mnist-lineage-conn mnist-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#mnist-lineage-tip)"/>
  <g class="mnist-lineage-stage mnist-lineage-s1">
    <rect class="mnist-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="mnist-lineage-step" x="359" y="142">02</text>
    <text class="mnist-lineage-name" x="385" y="142">Saturated within a decade</text>
    <text class="mnist-lineage-desc" x="359" y="166">Modern methods exceed 99.7%, and the</text>
    <text class="mnist-lineage-desc" x="359" y="182">remaining errors are ambiguous digits.</text>
  </g>
  <line class="mnist-lineage-line mnist-lineage-conn mnist-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#mnist-lineage-tip)"/>
  <g class="mnist-lineage-stage mnist-lineage-s2">
    <rect class="mnist-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="mnist-lineage-step" x="674" y="142">03</text>
    <text class="mnist-lineage-name" x="700" y="142">Successors followed</text>
    <text class="mnist-lineage-desc" x="674" y="166">Larger, harder benchmarks — the pattern MNIST</text>
    <text class="mnist-lineage-desc" x="674" y="182">established.</text>
  </g>
  <text class="mnist-lineage-sub" x="30" y="304">Saturation is what a successful benchmark eventually does, and the lesson is not that MNIST became useless: the practice of publishing a fixed evaluation set is what it actually contributed.</text>
</svg>
