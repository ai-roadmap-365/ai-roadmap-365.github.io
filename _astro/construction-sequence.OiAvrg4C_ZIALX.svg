<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Some mistakes cannot be undone.">
  <title>Building in the right order</title>
  <style>
    .construction-sequence-bg   { fill: #f8fafc; }
    .construction-sequence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .construction-sequence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .construction-sequence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .construction-sequence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .construction-sequence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .construction-sequence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .construction-sequence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .construction-sequence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .construction-sequence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .construction-sequence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .construction-sequence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .construction-sequence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .construction-sequence-row { opacity: 1; }
    .construction-sequence-r0 { animation-delay: 0.00s; }
    .construction-sequence-r1 { animation-delay: 0.45s; }
    .construction-sequence-r2 { animation-delay: 0.90s; }
    .construction-sequence-r3 { animation-delay: 1.35s; }
    .construction-sequence-r4 { animation-delay: 1.80s; }
    .construction-sequence-row { animation: construction-sequence-reveal 7.3s ease-in-out infinite; }
    @keyframes construction-sequence-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="construction-sequence-bg" width="980" height="390"/>
  <text class="construction-sequence-h1"  x="30" y="40">Building in the right order</text>
  <text class="construction-sequence-sub" x="30" y="64">Some mistakes cannot be undone.</text>
  <rect class="construction-sequence-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="construction-sequence-name" x="46" y="122">Wrong order</text>
  <text class="construction-sequence-desc" x="46" y="142">Looks finished.</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r0" x="46" y="182">Plaster before the wiring</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r1" x="46" y="216">Everything appears complete</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r2" x="46" y="250">The fault is hidden behind the finish</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r3" x="46" y="284">Fixing it means undoing the later work</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r4" x="46" y="318">This is preprocessing before splitting</text>
  <rect class="construction-sequence-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="construction-sequence-name" x="526" y="122">Right order</text>
  <text class="construction-sequence-desc" x="526" y="142">Is finished.</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r0" x="526" y="182">Wiring, inspection, then plaster</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r1" x="526" y="216">Each stage checked before the next</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r2" x="526" y="250">Faults caught at their own stage</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r3" x="526" y="284">Nothing to undo</text>
  <text class="construction-sequence-desc construction-sequence-row construction-sequence-r4" x="526" y="318">This is a contracted pipeline</text>
  <text class="construction-sequence-sub" x="30" y="372">Both buildings look identical when finished, which is exactly the problem: the ordering error is invisible in the result and decisive in the outcome.</text>
</svg>
