<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Customization Triad Decision Matrix">
  <title>Customization Triad Decision Matrix</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d274a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d274a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d274a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d274a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d274a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d274a-arrowhead); }
      .d274a-pulse { animation: d274a-glow 2.5s infinite ease-in-out; }
      @keyframes d274a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d274a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d274a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d274a-box d274a-pulse" x="0" y="0" width="220" height="280" />
    <text class="d274a-header" x="20" y="35">In-Context Prompting</text>
    <text class="d274a-text" x="20" y="70">• Parametric: Unaltered Base</text>
    <text class="d274a-text" x="20" y="95">• Context: Few-Shot Examples</text>
    <text class="d274a-text" x="20" y="120">• Latency: High Prompt TTFT</text>
    <text class="d274a-text" x="20" y="145">• Cost: O(N^2) Token Billing</text>
    <text class="d274a-text" x="20" y="170">• Updates: Zero-deployment</text>
    <text class="d274a-accent" x="20" y="220">Best for: Fast Prototypes</text>
  </g>
  <g transform="translate(290, 40)">
    <rect class="d274a-box d274a-pulse" x="0" y="0" width="220" height="280" />
    <text class="d274a-header" x="20" y="35">RAG (Hybrid Retrieval)</text>
    <text class="d274a-text" x="20" y="70">• Parametric: Frozen Weights</text>
    <text class="d274a-text" x="20" y="95">• Context: Dynamic Passages</text>
    <text class="d274a-text" x="20" y="120">• Latency: Search + Generation</text>
    <text class="d274a-text" x="20" y="145">• Grounding: Exact Citations</text>
    <text class="d274a-text" x="20" y="170">• Updates: Instant via Index</text>
    <text class="d274a-accent" x="20" y="220">Best for: Volatile Facts</text>
  </g>
  <g transform="translate(540, 40)">
    <rect class="d274a-box d274a-pulse" x="0" y="0" width="220" height="280" />
    <text class="d274a-header" x="20" y="35">Fine-Tuning (LoRA/PEFT)</text>
    <text class="d274a-text" x="20" y="70">• Parametric: Adapted Delta W</text>
    <text class="d274a-text" x="20" y="95">• Context: Minimal Prompt</text>
    <text class="d274a-text" x="20" y="120">• Latency: Lowest TTFT</text>
    <text class="d274a-text" x="20" y="145">• Cost: Fixed Compute + Serving</text>
    <text class="d274a-text" x="20" y="170">• Updates: Retraining Cycle</text>
    <text class="d274a-accent" x="20" y="220">Best for: Formats &amp; Style</text>
  </g>

</svg>