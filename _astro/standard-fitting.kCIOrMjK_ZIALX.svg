<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Interchangeable by agreement.">
  <title>A standard thread</title>
  <style>
    .standard-fitting-bg   { fill: #f8fafc; }
    .standard-fitting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-fitting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-fitting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-fitting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-fitting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-fitting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .standard-fitting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .standard-fitting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .standard-fitting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .standard-fitting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .standard-fitting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .standard-fitting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .standard-fitting-row { opacity: 1; }
    .standard-fitting-r0 { animation-delay: 0.00s; }
    .standard-fitting-r1 { animation-delay: 0.45s; }
    .standard-fitting-r2 { animation-delay: 0.90s; }
    .standard-fitting-r3 { animation-delay: 1.35s; }
    .standard-fitting-r4 { animation-delay: 1.80s; }
    .standard-fitting-row { animation: standard-fitting-reveal 7.3s ease-in-out infinite; }
    @keyframes standard-fitting-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="standard-fitting-bg" width="980" height="390"/>
  <text class="standard-fitting-h1"  x="30" y="40">A standard thread</text>
  <text class="standard-fitting-sub" x="30" y="64">Interchangeable by agreement.</text>
  <rect class="standard-fitting-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="standard-fitting-name" x="46" y="122">Bespoke fittings</text>
  <text class="standard-fitting-desc" x="46" y="142">Each unique.</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r0" x="46" y="182">Every manufacturer's own design</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r1" x="46" y="216">Nothing interchanges</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r2" x="46" y="250">Switching means replacing everything</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r3" x="46" y="284">No shared tooling</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r4" x="46" y="318">This is incompatible libraries</text>
  <rect class="standard-fitting-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="standard-fitting-name" x="526" y="122">A standard thread</text>
  <text class="standard-fitting-desc" x="526" y="142">Interchangeable.</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r0" x="526" y="182">One agreed specification</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r1" x="526" y="216">Any part fits any other</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r2" x="526" y="250">Switching costs nothing</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r3" x="526" y="284">Shared tooling for all of it</text>
  <text class="standard-fitting-desc standard-fitting-row standard-fitting-r4" x="526" y="318">This is a shared estimator interface</text>
  <text class="standard-fitting-sub" x="30" y="372">The value of a standard is entirely in what it enables around it, which is why the interface matters far more than any of its particular design choices.</text>
</svg>
