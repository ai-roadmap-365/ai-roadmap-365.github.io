<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Exporting is the difference, and a child never hands anything back.">
  <title>Why the variable you set does not reach your script</title>
  <style>
    .shell-versus-environment-bg   { fill: #f8fafc; }
    .shell-versus-environment-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-environment-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-environment-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-environment-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-environment-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-versus-environment-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-versus-environment-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shell-versus-environment-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shell-versus-environment-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shell-versus-environment-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shell-versus-environment-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shell-versus-environment-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-versus-environment-row { opacity: 1; }
    .shell-versus-environment-r0 { animation-delay: 0.00s; }
    .shell-versus-environment-r1 { animation-delay: 0.45s; }
    .shell-versus-environment-r2 { animation-delay: 0.90s; }
    .shell-versus-environment-r3 { animation-delay: 1.35s; }
    .shell-versus-environment-r4 { animation-delay: 1.80s; }
    .shell-versus-environment-row { animation: shell-versus-environment-reveal 7.3s ease-in-out infinite; }
    @keyframes shell-versus-environment-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shell-versus-environment-bg" width="980" height="390"/>
  <text class="shell-versus-environment-h1"  x="30" y="40">Why the variable you set does not reach your script</text>
  <text class="shell-versus-environment-sub" x="30" y="64">Exporting is the difference, and a child never hands anything back.</text>
  <rect class="shell-versus-environment-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shell-versus-environment-name" x="46" y="122">NAME=value</text>
  <text class="shell-versus-environment-desc" x="46" y="142">Private to this shell</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r0" x="46" y="182">Visible to commands you type here</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r1" x="46" y="216">NOT visible to a script you run</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r2" x="46" y="250">Gone when the shell exits</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r3" x="46" y="284">Useful for loop counters and temporary work</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r4" x="46" y="318">The usual cause of 'my script cannot see it'</text>
  <rect class="shell-versus-environment-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shell-versus-environment-name" x="526" y="122">export NAME=value</text>
  <text class="shell-versus-environment-desc" x="526" y="142">Inherited by every child</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r0" x="526" y="182">Copied into each child process at launch</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r1" x="526" y="216">The child's changes never flow back</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r2" x="526" y="250">How API keys, CUDA_VISIBLE_DEVICES and HF_HOME travel</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r3" x="526" y="284">Still gone when the shell exits — put it in a config file to persist</text>
  <text class="shell-versus-environment-desc shell-versus-environment-row shell-versus-environment-r4" x="526" y="318">A running job keeps the copy it was given</text>
  <text class="shell-versus-environment-sub" x="30" y="372">A variable exported now has no effect on a job that started a minute ago. It already has its copy.</text>
</svg>
