<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things an experiment is not</title>
  <style>
    .exp-not-bg   { fill: #f8fafc; }
    .exp-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exp-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exp-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exp-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exp-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exp-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exp-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exp-not-row { opacity: 1; }
    .exp-not-r0 { animation-delay: 0.00s; }
    .exp-not-r1 { animation-delay: 0.45s; }
    .exp-not-r2 { animation-delay: 0.90s; }
    .exp-not-r3 { animation-delay: 1.35s; }
    .exp-not-r4 { animation-delay: 1.80s; }
    .exp-not-row { animation: exp-not-reveal 7.3s ease-in-out infinite; }
    @keyframes exp-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exp-not-bg" width="980" height="390"/>
  <text class="exp-not-h1"  x="30" y="40">Four things an experiment is not</text>
  <text class="exp-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="exp-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exp-not-name" x="46" y="122">The misconception</text>
  <text class="exp-not-desc" x="46" y="142">Commonly held.</text>
  <text class="exp-not-desc exp-not-row exp-not-r0" x="46" y="182">A significant result proves the mechanism</text>
  <text class="exp-not-desc exp-not-row exp-not-r1" x="46" y="216">The effect will hold elsewhere</text>
  <text class="exp-not-desc exp-not-row exp-not-r2" x="46" y="250">Randomisation guarantees balance</text>
  <text class="exp-not-desc exp-not-row exp-not-r3" x="46" y="284">Bigger effects are more believable</text>
  <text class="exp-not-desc exp-not-row exp-not-r4" x="46" y="318">One experiment settles it</text>
  <rect class="exp-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exp-not-name" x="526" y="122">What is true</text>
  <text class="exp-not-desc" x="526" y="142">Actually.</text>
  <text class="exp-not-desc exp-not-row exp-not-r0" x="526" y="182">It shows an effect, not why</text>
  <text class="exp-not-desc exp-not-row exp-not-r1" x="526" y="216">External validity is a separate question</text>
  <text class="exp-not-desc exp-not-row exp-not-r2" x="526" y="250">It balances in expectation, not always</text>
  <text class="exp-not-desc exp-not-row exp-not-r3" x="526" y="284">Large effects in small samples are suspect</text>
  <text class="exp-not-desc exp-not-row exp-not-r4" x="526" y="318">Replication is what settles things</text>
  <text class="exp-not-sub" x="30" y="372">Large effects in small samples being suspect is a genuinely useful heuristic, because small studies only reach significance when the estimated effect is large.</text>
</svg>
