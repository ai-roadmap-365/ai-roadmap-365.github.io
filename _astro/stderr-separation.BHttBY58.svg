<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two output streams, deliberately kept apart.">
  <title>Why errors do not poison your pipeline</title>
  <style>
    .stderr-separation-bg   { fill: #f8fafc; }
    .stderr-separation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stderr-separation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stderr-separation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stderr-separation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stderr-separation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stderr-separation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stderr-separation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stderr-separation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stderr-separation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stderr-separation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stderr-separation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stderr-separation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stderr-separation-row { opacity: 1; }
    .stderr-separation-r0 { animation-delay: 0.00s; }
    .stderr-separation-r1 { animation-delay: 0.45s; }
    .stderr-separation-r2 { animation-delay: 0.90s; }
    .stderr-separation-r3 { animation-delay: 1.35s; }
    .stderr-separation-r4 { animation-delay: 1.80s; }
    .stderr-separation-row { animation: stderr-separation-reveal 7.3s ease-in-out infinite; }
    @keyframes stderr-separation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stderr-separation-bg" width="980" height="390"/>
  <text class="stderr-separation-h1"  x="30" y="40">Why errors do not poison your pipeline</text>
  <text class="stderr-separation-sub" x="30" y="64">Two output streams, deliberately kept apart.</text>
  <rect class="stderr-separation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stderr-separation-name" x="46" y="122">stdout (fd 1)</text>
  <text class="stderr-separation-desc" x="46" y="142">The data.</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r0" x="46" y="182">What the program produced</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r1" x="46" y="216">This is what | carries</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r2" x="46" y="250">This is what &gt; captures</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r3" x="46" y="284">Should be clean and parseable</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r4" x="46" y="318">Silent when there is nothing to say</text>
  <rect class="stderr-separation-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stderr-separation-name" x="526" y="122">stderr (fd 2)</text>
  <text class="stderr-separation-desc" x="526" y="142">The commentary.</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r0" x="526" y="182">Warnings, errors, progress bars</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r1" x="526" y="216">NOT carried by a plain pipe</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r2" x="526" y="250">Redirected separately with 2&gt;</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r3" x="526" y="284">Reaches your screen even mid-pipeline</text>
  <text class="stderr-separation-desc stderr-separation-row stderr-separation-r4" x="526" y="318">2&gt;&amp;1 merges it into stdout when you want it</text>
  <text class="stderr-separation-sub" x="30" y="372">This separation is why a broken command in a pipeline shows you the error instead of silently feeding the message into the next stage as if it were data.</text>
</svg>
