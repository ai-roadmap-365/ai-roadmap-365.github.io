<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, one of them scaling.">
  <title>How mixed precision stays correct</title>
  <style>
    .amp-mechanics-bg   { fill: #f8fafc; }
    .amp-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .amp-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .amp-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .amp-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .amp-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .amp-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .amp-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .amp-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .amp-mechanics-stage { opacity: 1; }

    .amp-mechanics-s0 { animation-delay: 0.00s; }
    .amp-mechanics-e0 { animation-delay: 0.00s; }
    .amp-mechanics-s1 { animation-delay: 1.28s; }
    .amp-mechanics-e1 { animation-delay: 1.28s; }
    .amp-mechanics-s2 { animation-delay: 2.56s; }
    .amp-mechanics-e2 { animation-delay: 2.56s; }
    .amp-mechanics-s3 { animation-delay: 3.84s; }
    .amp-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .amp-mechanics-conn  { animation: amp-mechanics-trace 6.4s ease-in-out infinite; }
      .amp-mechanics-stage { animation: amp-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes amp-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes amp-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .amp-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .amp-mechanics-stage { animation: amp-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes amp-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="amp-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="amp-mechanics-bg" width="980" height="322"/>
  <text class="amp-mechanics-h1"  x="30" y="40">How mixed precision stays correct</text>
  <text class="amp-mechanics-sub" x="30" y="64">Four steps, one of them scaling.</text>
  <g class="amp-mechanics-stage amp-mechanics-s0">
    <rect class="amp-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="amp-mechanics-step" x="44" y="142">01</text>
    <text class="amp-mechanics-name" x="70" y="142">Autocast the forward pass</text>
    <text class="amp-mechanics-desc" x="44" y="166">Matrix operations in half</text>
    <text class="amp-mechanics-desc" x="44" y="182">precision; sensitive reductions</text>
    <text class="amp-mechanics-desc" x="44" y="198">kept in full.</text>
  </g>
  <line class="amp-mechanics-line amp-mechanics-conn amp-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#amp-mechanics-tip)"/>
  <g class="amp-mechanics-stage amp-mechanics-s1">
    <rect class="amp-mechanics-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="amp-mechanics-step" x="280" y="142">02</text>
    <text class="amp-mechanics-name" x="306" y="142">Scale the loss</text>
    <text class="amp-mechanics-desc" x="280" y="166">By a large factor, so small</text>
    <text class="amp-mechanics-desc" x="280" y="182">gradients land inside the</text>
    <text class="amp-mechanics-desc" x="280" y="198">representable range.</text>
  </g>
  <line class="amp-mechanics-line amp-mechanics-conn amp-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#amp-mechanics-tip)"/>
  <g class="amp-mechanics-stage amp-mechanics-s2">
    <rect class="amp-mechanics-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="amp-mechanics-step" x="516" y="142">03</text>
    <text class="amp-mechanics-name" x="542" y="142">Unscale before the optimiser step</text>
    <text class="amp-mechanics-desc" x="516" y="166">Otherwise the update is scaled</text>
    <text class="amp-mechanics-desc" x="516" y="182">too.</text>
  </g>
  <line class="amp-mechanics-line amp-mechanics-conn amp-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#amp-mechanics-tip)"/>
  <g class="amp-mechanics-stage amp-mechanics-s3">
    <rect class="amp-mechanics-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="amp-mechanics-step" x="752" y="142">04</text>
    <text class="amp-mechanics-name" x="778" y="142">Adjust the scale dynamically</text>
    <text class="amp-mechanics-desc" x="752" y="166">Halve it on overflow, raise it</text>
    <text class="amp-mechanics-desc" x="752" y="182">slowly otherwise.</text>
  </g>
  <text class="amp-mechanics-sub" x="30" y="304">The scaling factor is chosen automatically and adaptively, which is what makes mixed precision safe to enable by default rather than a numerical experiment per model.</text>
</svg>
