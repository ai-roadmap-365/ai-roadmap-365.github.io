<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Licence, fidelity and cost.">
  <title>Choosing an extractor</title>
  <style>
    .extraction-tooling-bg   { fill: #f8fafc; }
    .extraction-tooling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-tooling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-tooling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-tooling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-tooling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-tooling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .extraction-tooling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .extraction-tooling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .extraction-tooling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .extraction-tooling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .extraction-tooling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .extraction-tooling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .extraction-tooling-row { opacity: 1; }
    .extraction-tooling-r0 { animation-delay: 0.00s; }
    .extraction-tooling-r1 { animation-delay: 0.45s; }
    .extraction-tooling-r2 { animation-delay: 0.90s; }
    .extraction-tooling-r3 { animation-delay: 1.35s; }
    .extraction-tooling-r4 { animation-delay: 1.80s; }
    .extraction-tooling-row { animation: extraction-tooling-reveal 7.3s ease-in-out infinite; }
    @keyframes extraction-tooling-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="extraction-tooling-bg" width="980" height="390"/>
  <text class="extraction-tooling-h1"  x="30" y="40">Choosing an extractor</text>
  <text class="extraction-tooling-sub" x="30" y="64">Licence, fidelity and cost.</text>
  <rect class="extraction-tooling-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="extraction-tooling-name" x="46" y="122">Lightweight</text>
  <text class="extraction-tooling-desc" x="46" y="142">Fast, and limited.</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r0" x="46" y="182">Pure-Python PDF readers for born-digital files</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r1" x="46" y="216">Position-aware libraries with real table extraction</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r2" x="46" y="250">Very fast options exist under copyleft licences</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r3" x="46" y="284">Check the licence before adopting</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r4" x="46" y="318">OCR as the escalation path</text>
  <rect class="extraction-tooling-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="extraction-tooling-name" x="526" y="122">Full pipelines</text>
  <text class="extraction-tooling-desc" x="526" y="142">More capable, heavier.</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r0" x="526" y="182">Bundled detection, layout and tables</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r1" x="526" y="216">Considerable work saved</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r2" x="526" y="250">A heavier dependency to carry</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r3" x="526" y="284">Commercial services price per page</text>
  <text class="extraction-tooling-desc extraction-tooling-row extraction-tooling-r4" x="526" y="318">And send your documents elsewhere</text>
  <text class="extraction-tooling-sub" x="30" y="372">The licence check is a real constraint rather than a formality: one of the fastest and highest-quality PDF libraries is copyleft, which is a decision for a closed-source product rather than a preference.</text>
</svg>
