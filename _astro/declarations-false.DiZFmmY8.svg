<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Declarations can be false</title>
  <style>
    .declarations-false-bg   { fill: #f8fafc; }
    .declarations-false-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .declarations-false-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .declarations-false-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .declarations-false-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .declarations-false-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .declarations-false-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .declarations-false-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .declarations-false-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .declarations-false-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .declarations-false-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .declarations-false-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .declarations-false-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .declarations-false-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .declarations-false-stage { opacity: 1; }

    .declarations-false-s0 { animation-delay: 0.00s; }
    .declarations-false-e0 { animation-delay: 0.00s; }
    .declarations-false-s1 { animation-delay: 1.28s; }
    .declarations-false-e1 { animation-delay: 1.28s; }
    .declarations-false-s2 { animation-delay: 2.56s; }
    .declarations-false-e2 { animation-delay: 2.56s; }
    .declarations-false-s3 { animation-delay: 3.84s; }
    .declarations-false-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .declarations-false-conn  { animation: declarations-false-trace 6.4s ease-in-out infinite; }
      .declarations-false-stage { animation: declarations-false-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes declarations-false-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes declarations-false-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .declarations-false-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .declarations-false-stage { animation: declarations-false-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes declarations-false-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="declarations-false-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="declarations-false-bg" width="980" height="322"/>
  <text class="declarations-false-h1"  x="30" y="40">Declarations can be false</text>
  <text class="declarations-false-sub" x="30" y="64">Four steps.</text>
  <g class="declarations-false-stage declarations-false-s0">
    <rect class="declarations-false-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="declarations-false-step" x="44" y="142">01</text>
    <text class="declarations-false-name" x="70" y="142">A stage declares what it expects and produces</text>
    <text class="declarations-false-desc" x="44" y="166">Which is an improvement on</text>
    <text class="declarations-false-desc" x="44" y="182">nothing.</text>
  </g>
  <line class="declarations-false-line declarations-false-conn declarations-false-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#declarations-false-tip)"/>
  <g class="declarations-false-stage declarations-false-s1">
    <rect class="declarations-false-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="declarations-false-step" x="280" y="142">02</text>
    <text class="declarations-false-name" x="306" y="142">But a declaration is a claim, not a guarantee</text>
    <text class="declarations-false-desc" x="280" y="166">The code can do otherwise.</text>
  </g>
  <line class="declarations-false-line declarations-false-conn declarations-false-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#declarations-false-tip)"/>
  <g class="declarations-false-stage declarations-false-s2">
    <rect class="declarations-false-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="declarations-false-step" x="516" y="142">03</text>
    <text class="declarations-false-name" x="542" y="142">And upstream data changes without telling you</text>
    <text class="declarations-false-desc" x="516" y="166">So a true declaration becomes</text>
    <text class="declarations-false-desc" x="516" y="182">false.</text>
  </g>
  <line class="declarations-false-line declarations-false-conn declarations-false-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#declarations-false-tip)"/>
  <g class="declarations-false-stage declarations-false-s3">
    <rect class="declarations-false-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="declarations-false-step" x="752" y="142">04</text>
    <text class="declarations-false-name" x="778" y="142">So check the contract at runtime</text>
    <text class="declarations-false-desc" x="752" y="166">Which turns a claim into a gate.</text>
  </g>
  <text class="declarations-false-sub" x="30" y="304">This is the same distinction as between a rule and a gate that runs through the whole curriculum: an unchecked declaration eventually stops being true.</text>
</svg>
