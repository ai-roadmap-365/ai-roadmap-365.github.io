<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are risks.">
  <title>Four consequences of statistical plotting layers</title>
  <style>
    .sns-implications-bg   { fill: #f8fafc; }
    .sns-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sns-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sns-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sns-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sns-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sns-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sns-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sns-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sns-implications-stage { opacity: 1; }

    .sns-implications-s0 { animation-delay: 0.00s; }
    .sns-implications-e0 { animation-delay: 0.00s; }
    .sns-implications-s1 { animation-delay: 1.28s; }
    .sns-implications-e1 { animation-delay: 1.28s; }
    .sns-implications-s2 { animation-delay: 2.56s; }
    .sns-implications-e2 { animation-delay: 2.56s; }
    .sns-implications-s3 { animation-delay: 3.84s; }
    .sns-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sns-implications-conn  { animation: sns-implications-trace 6.4s ease-in-out infinite; }
      .sns-implications-stage { animation: sns-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sns-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sns-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sns-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sns-implications-stage { animation: sns-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sns-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sns-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sns-implications-bg" width="980" height="322"/>
  <text class="sns-implications-h1"  x="30" y="40">Four consequences of statistical plotting layers</text>
  <text class="sns-implications-sub" x="30" y="64">Two are risks.</text>
  <g class="sns-implications-stage sns-implications-s0">
    <rect class="sns-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sns-implications-step" x="44" y="142">01</text>
    <text class="sns-implications-name" x="70" y="142">Exploration becomes much faster</text>
    <text class="sns-implications-desc" x="44" y="166">Which changes how much you look.</text>
  </g>
  <line class="sns-implications-line sns-implications-conn sns-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sns-implications-tip)"/>
  <g class="sns-implications-stage sns-implications-s1">
    <rect class="sns-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sns-implications-step" x="280" y="142">02</text>
    <text class="sns-implications-name" x="306" y="142">And the defaults are usually better</text>
    <text class="sns-implications-desc" x="280" y="166">Readable without adjustment.</text>
  </g>
  <line class="sns-implications-line sns-implications-conn sns-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sns-implications-tip)"/>
  <g class="sns-implications-stage sns-implications-s2">
    <rect class="sns-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sns-implications-step" x="516" y="142">03</text>
    <text class="sns-implications-name" x="542" y="142">But the statistics computed are easy to overlook</text>
    <text class="sns-implications-desc" x="516" y="166">A band may not mean what you</text>
    <text class="sns-implications-desc" x="516" y="182">assume.</text>
  </g>
  <line class="sns-implications-line sns-implications-conn sns-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sns-implications-tip)"/>
  <g class="sns-implications-stage sns-implications-s3">
    <rect class="sns-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sns-implications-step" x="752" y="142">04</text>
    <text class="sns-implications-name" x="778" y="142">And the chart depends on the library's choices</text>
    <text class="sns-implications-desc" x="752" y="166">Which change between versions.</text>
  </g>
  <text class="sns-implications-sub" x="30" y="304">A confidence band appearing without being requested is convenient and occasionally misleading, which is why knowing what transform ran matters.</text>
</svg>
