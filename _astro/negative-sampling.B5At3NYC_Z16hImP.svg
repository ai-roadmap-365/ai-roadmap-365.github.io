<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A softmax over half a million words.">
  <title>Why negative sampling exists</title>
  <style>
    .negative-sampling-bg   { fill: #f8fafc; }
    .negative-sampling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-sampling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-sampling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-sampling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-sampling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-sampling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .negative-sampling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .negative-sampling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .negative-sampling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .negative-sampling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .negative-sampling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .negative-sampling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .negative-sampling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .negative-sampling-stage { opacity: 1; }

    .negative-sampling-s0 { animation-delay: 0.00s; }
    .negative-sampling-e0 { animation-delay: 0.00s; }
    .negative-sampling-s1 { animation-delay: 1.28s; }
    .negative-sampling-e1 { animation-delay: 1.28s; }
    .negative-sampling-s2 { animation-delay: 2.56s; }
    .negative-sampling-e2 { animation-delay: 2.56s; }
    .negative-sampling-s3 { animation-delay: 3.84s; }
    .negative-sampling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .negative-sampling-conn  { animation: negative-sampling-trace 6.4s ease-in-out infinite; }
      .negative-sampling-stage { animation: negative-sampling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes negative-sampling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes negative-sampling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .negative-sampling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .negative-sampling-stage { animation: negative-sampling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes negative-sampling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="negative-sampling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="negative-sampling-bg" width="980" height="322"/>
  <text class="negative-sampling-h1"  x="30" y="40">Why negative sampling exists</text>
  <text class="negative-sampling-sub" x="30" y="64">A softmax over half a million words.</text>
  <g class="negative-sampling-stage negative-sampling-s0">
    <rect class="negative-sampling-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="negative-sampling-step" x="44" y="142">01</text>
    <text class="negative-sampling-name" x="70" y="142">The exact objective needs a full softmax</text>
    <text class="negative-sampling-desc" x="44" y="166">Normalising over every word in</text>
    <text class="negative-sampling-desc" x="44" y="182">the vocabulary, on every update.</text>
  </g>
  <line class="negative-sampling-line negative-sampling-conn negative-sampling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#negative-sampling-tip)"/>
  <g class="negative-sampling-stage negative-sampling-s1">
    <rect class="negative-sampling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="negative-sampling-step" x="280" y="142">02</text>
    <text class="negative-sampling-name" x="306" y="142">Which is intractable at scale</text>
    <text class="negative-sampling-desc" x="280" y="166">Half a million terms per token,</text>
    <text class="negative-sampling-desc" x="280" y="182">per step.</text>
  </g>
  <line class="negative-sampling-line negative-sampling-conn negative-sampling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#negative-sampling-tip)"/>
  <g class="negative-sampling-stage negative-sampling-s2">
    <rect class="negative-sampling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="negative-sampling-step" x="516" y="142">03</text>
    <text class="negative-sampling-name" x="542" y="142">Reformulate as binary classification</text>
    <text class="negative-sampling-desc" x="516" y="166">Is this pair real, or sampled</text>
    <text class="negative-sampling-desc" x="516" y="182">noise?</text>
    <text class="negative-sampling-edge" x="516" y="242">K negatives</text>
  </g>
  <line class="negative-sampling-line negative-sampling-conn negative-sampling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#negative-sampling-tip)"/>
  <g class="negative-sampling-stage negative-sampling-s3">
    <rect class="negative-sampling-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="negative-sampling-step" x="752" y="142">04</text>
    <text class="negative-sampling-name" x="778" y="142">A handful of negatives per positive</text>
    <text class="negative-sampling-desc" x="752" y="166">Constant cost per update instead</text>
    <text class="negative-sampling-desc" x="752" y="182">of vocabulary-sized.</text>
  </g>
  <text class="negative-sampling-sub" x="30" y="304">This reformulation is the reason the method was practical at all, and the same trick — replacing a normalisation with a discrimination task — recurs throughout representation learning.</text>
</svg>
