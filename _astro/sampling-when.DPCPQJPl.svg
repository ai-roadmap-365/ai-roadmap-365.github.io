<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to set it to zero.">
  <title>When to raise the temperature</title>
  <style>
    .sampling-when-bg   { fill: #f8fafc; }
    .sampling-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sampling-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sampling-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sampling-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sampling-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sampling-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sampling-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sampling-when-row { opacity: 1; }
    .sampling-when-r0 { animation-delay: 0.00s; }
    .sampling-when-r1 { animation-delay: 0.45s; }
    .sampling-when-r2 { animation-delay: 0.90s; }
    .sampling-when-r3 { animation-delay: 1.35s; }
    .sampling-when-r4 { animation-delay: 1.80s; }
    .sampling-when-row { animation: sampling-when-reveal 7.3s ease-in-out infinite; }
    @keyframes sampling-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sampling-when-bg" width="980" height="390"/>
  <text class="sampling-when-h1"  x="30" y="40">When to raise the temperature</text>
  <text class="sampling-when-sub" x="30" y="64">And when to set it to zero.</text>
  <rect class="sampling-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sampling-when-name" x="46" y="122">Higher temperature</text>
  <text class="sampling-when-desc" x="46" y="142">Variety wanted.</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r0" x="46" y="182">Creative writing and ideation</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r1" x="46" y="216">Generating multiple options</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r2" x="46" y="250">Synthetic data generation</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r3" x="46" y="284">Brainstorming and exploration</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r4" x="46" y="318">Where repetition would be a fault</text>
  <rect class="sampling-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sampling-when-name" x="526" y="122">Near zero</text>
  <text class="sampling-when-desc" x="526" y="142">Consistency wanted.</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r0" x="526" y="182">Classification and extraction</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r1" x="526" y="216">Structured output</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r2" x="526" y="250">Anything with one correct answer</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r3" x="526" y="284">Reproducible evaluation</text>
  <text class="sampling-when-desc sampling-when-row sampling-when-r4" x="526" y="318">And anything a test asserts on</text>
  <text class="sampling-when-sub" x="30" y="372">Most production tasks want the low end, which is worth stating because the defaults on most interfaces are tuned for conversation rather than for extraction.</text>
</svg>
