<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="You need both, for different reasons.">
  <title>Prevention and detection</title>
  <style>
    .canary-tokens-bg   { fill: #f8fafc; }
    .canary-tokens-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-tokens-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-tokens-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-tokens-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-tokens-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-tokens-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .canary-tokens-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .canary-tokens-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .canary-tokens-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .canary-tokens-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .canary-tokens-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .canary-tokens-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .canary-tokens-row { opacity: 1; }
    .canary-tokens-r0 { animation-delay: 0.00s; }
    .canary-tokens-r1 { animation-delay: 0.45s; }
    .canary-tokens-r2 { animation-delay: 0.90s; }
    .canary-tokens-r3 { animation-delay: 1.35s; }
    .canary-tokens-r4 { animation-delay: 1.80s; }
    .canary-tokens-row { animation: canary-tokens-reveal 7.3s ease-in-out infinite; }
    @keyframes canary-tokens-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="canary-tokens-bg" width="980" height="390"/>
  <text class="canary-tokens-h1"  x="30" y="40">Prevention and detection</text>
  <text class="canary-tokens-sub" x="30" y="64">You need both, for different reasons.</text>
  <rect class="canary-tokens-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="canary-tokens-name" x="46" y="122">Prevention</text>
  <text class="canary-tokens-desc" x="46" y="142">Reduces the surface.</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r0" x="46" y="182">Delimiters, escaping, quarantine</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r1" x="46" y="216">Cheap, deterministic, always on</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r2" x="46" y="250">Blocks the attacks you anticipated</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r3" x="46" y="284">Silent when it works</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r4" x="46" y="318">And silent when it does not</text>
  <rect class="canary-tokens-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="canary-tokens-name" x="526" y="122">Detection</text>
  <text class="canary-tokens-desc" x="526" y="142">Reports success.</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r0" x="526" y="182">A unique token per session</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r1" x="526" y="216">Present in the completion: the prompt leaked</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r2" x="526" y="250">Drop the response, alert security</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r3" x="526" y="284">Catches a novel jailbreak in real time</text>
  <text class="canary-tokens-desc canary-tokens-row canary-tokens-r4" x="526" y="318">The only control that tells you</text>
  <text class="canary-tokens-sub" x="30" y="372">A defence you cannot observe failing is a defence you will trust for exactly as long as it takes somebody to publish your system prompt on a forum, which is the argument for the right-hand column.</text>
</svg>
