<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What a metric is</title>
  <style>
    .metric-is-bg   { fill: #f8fafc; }
    .metric-is-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-is-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-is-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-is-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-is-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-is-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-is-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-is-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-is-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-is-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-is-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-is-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .metric-is-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .metric-is-stage { opacity: 1; }

    .metric-is-s0 { animation-delay: 0.00s; }
    .metric-is-e0 { animation-delay: 0.00s; }
    .metric-is-s1 { animation-delay: 1.28s; }
    .metric-is-e1 { animation-delay: 1.28s; }
    .metric-is-s2 { animation-delay: 2.56s; }
    .metric-is-e2 { animation-delay: 2.56s; }
    .metric-is-s3 { animation-delay: 3.84s; }
    .metric-is-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .metric-is-conn  { animation: metric-is-trace 6.4s ease-in-out infinite; }
      .metric-is-stage { animation: metric-is-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes metric-is-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes metric-is-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .metric-is-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .metric-is-stage { animation: metric-is-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes metric-is-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="metric-is-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="metric-is-bg" width="980" height="322"/>
  <text class="metric-is-h1"  x="30" y="40">What a metric is</text>
  <text class="metric-is-sub" x="30" y="64">Four properties.</text>
  <g class="metric-is-stage metric-is-s0">
    <rect class="metric-is-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="metric-is-step" x="44" y="142">01</text>
    <text class="metric-is-name" x="70" y="142">A summary of many predictions into one number</text>
    <text class="metric-is-desc" x="44" y="166">Which necessarily discards</text>
    <text class="metric-is-desc" x="44" y="182">information.</text>
  </g>
  <line class="metric-is-line metric-is-conn metric-is-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#metric-is-tip)"/>
  <g class="metric-is-stage metric-is-s1">
    <rect class="metric-is-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="metric-is-step" x="280" y="142">02</text>
    <text class="metric-is-name" x="306" y="142">Encoding an assumption about what errors cost</text>
    <text class="metric-is-desc" x="280" y="166">Whether or not that assumption</text>
    <text class="metric-is-desc" x="280" y="182">was stated.</text>
  </g>
  <line class="metric-is-line metric-is-conn metric-is-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#metric-is-tip)"/>
  <g class="metric-is-stage metric-is-s2">
    <rect class="metric-is-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="metric-is-step" x="516" y="142">03</text>
    <text class="metric-is-name" x="542" y="142">Usually computed at one threshold</text>
    <text class="metric-is-desc" x="516" y="166">So it describes an operating</text>
    <text class="metric-is-desc" x="516" y="182">point, not a model.</text>
  </g>
  <line class="metric-is-line metric-is-conn metric-is-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#metric-is-tip)"/>
  <g class="metric-is-stage metric-is-s3">
    <rect class="metric-is-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="metric-is-step" x="752" y="142">04</text>
    <text class="metric-is-name" x="778" y="142">And meaningful only against a baseline</text>
    <text class="metric-is-desc" x="752" y="166">Which the class balance sets.</text>
  </g>
  <text class="metric-is-sub" x="30" y="304">Every metric encodes a cost assumption whether or not anyone stated it, which is why choosing one by default is choosing an assumption by default.</text>
</svg>
