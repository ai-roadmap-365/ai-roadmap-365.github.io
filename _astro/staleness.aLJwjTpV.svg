<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which only retrieval solves.">
  <title>The staleness problem</title>
  <style>
    .staleness-bg   { fill: #f8fafc; }
    .staleness-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .staleness-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .staleness-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .staleness-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .staleness-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .staleness-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .staleness-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .staleness-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .staleness-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .staleness-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .staleness-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .staleness-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .staleness-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .staleness-stage { opacity: 1; }

    .staleness-s0 { animation-delay: 0.00s; }
    .staleness-e0 { animation-delay: 0.00s; }
    .staleness-s1 { animation-delay: 1.28s; }
    .staleness-e1 { animation-delay: 1.28s; }
    .staleness-s2 { animation-delay: 2.56s; }
    .staleness-e2 { animation-delay: 2.56s; }
    .staleness-s3 { animation-delay: 3.84s; }
    .staleness-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .staleness-conn  { animation: staleness-trace 6.4s ease-in-out infinite; }
      .staleness-stage { animation: staleness-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes staleness-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes staleness-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .staleness-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .staleness-stage { animation: staleness-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes staleness-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="staleness-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="staleness-bg" width="980" height="322"/>
  <text class="staleness-h1"  x="30" y="40">The staleness problem</text>
  <text class="staleness-sub" x="30" y="64">Which only retrieval solves.</text>
  <g class="staleness-stage staleness-s0">
    <rect class="staleness-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="staleness-step" x="44" y="142">01</text>
    <text class="staleness-name" x="70" y="142">Training ends at a fixed date</text>
    <text class="staleness-desc" x="44" y="166">Everything after it is unknown</text>
    <text class="staleness-desc" x="44" y="182">to the weights.</text>
  </g>
  <line class="staleness-line staleness-conn staleness-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#staleness-tip)"/>
  <g class="staleness-stage staleness-s1">
    <rect class="staleness-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="staleness-step" x="280" y="142">02</text>
    <text class="staleness-name" x="306" y="142">But the model answers anyway</text>
    <text class="staleness-desc" x="280" y="166">Confidently, from what it last</text>
    <text class="staleness-desc" x="280" y="182">knew.</text>
  </g>
  <line class="staleness-line staleness-conn staleness-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#staleness-tip)"/>
  <g class="staleness-stage staleness-s2">
    <rect class="staleness-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="staleness-step" x="516" y="142">03</text>
    <text class="staleness-name" x="542" y="142">Fine-tuning to update facts is slow and unreliable</text>
    <text class="staleness-desc" x="516" y="166">And has to be repeated on every</text>
    <text class="staleness-desc" x="516" y="182">change.</text>
  </g>
  <line class="staleness-line staleness-conn staleness-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#staleness-tip)"/>
  <g class="staleness-stage staleness-s3">
    <rect class="staleness-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="staleness-step" x="752" y="142">04</text>
    <text class="staleness-name" x="778" y="142">Retrieval updates in seconds</text>
    <text class="staleness-desc" x="752" y="166">By changing a document.</text>
  </g>
  <text class="staleness-sub" x="30" y="304">The unreliability of teaching facts by fine-tuning is the part that surprises people: the model learns the style of the new facts more readily than the facts themselves.</text>
</svg>
