<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Throughput against latency.">
  <title>Single against batch endpoints</title>
  <style>
    .batch-endpoint-bg   { fill: #f8fafc; }
    .batch-endpoint-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-endpoint-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-endpoint-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-endpoint-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-endpoint-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-endpoint-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .batch-endpoint-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .batch-endpoint-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .batch-endpoint-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .batch-endpoint-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .batch-endpoint-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .batch-endpoint-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .batch-endpoint-row { opacity: 1; }
    .batch-endpoint-r0 { animation-delay: 0.00s; }
    .batch-endpoint-r1 { animation-delay: 0.45s; }
    .batch-endpoint-r2 { animation-delay: 0.90s; }
    .batch-endpoint-r3 { animation-delay: 1.35s; }
    .batch-endpoint-r4 { animation-delay: 1.80s; }
    .batch-endpoint-row { animation: batch-endpoint-reveal 7.3s ease-in-out infinite; }
    @keyframes batch-endpoint-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="batch-endpoint-bg" width="980" height="390"/>
  <text class="batch-endpoint-h1"  x="30" y="40">Single against batch endpoints</text>
  <text class="batch-endpoint-sub" x="30" y="64">Throughput against latency.</text>
  <rect class="batch-endpoint-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="batch-endpoint-name" x="46" y="122">One at a time</text>
  <text class="batch-endpoint-desc" x="46" y="142">Lowest latency.</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r0" x="46" y="182">A request produces one prediction</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r1" x="46" y="216">Minimal latency per request</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r2" x="46" y="250">Simple to reason about</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r3" x="46" y="284">Poor hardware utilisation</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r4" x="46" y="318">Right for interactive use</text>
  <rect class="batch-endpoint-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="batch-endpoint-name" x="526" y="122">Batched</text>
  <text class="batch-endpoint-desc" x="526" y="142">Highest throughput.</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r0" x="526" y="182">Many predictions in one call</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r1" x="526" y="216">Vectorised, so far more efficient</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r2" x="526" y="250">Latency rises with batch size</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r3" x="526" y="284">Excellent utilisation</text>
  <text class="batch-endpoint-desc batch-endpoint-row batch-endpoint-r4" x="526" y="318">Right for bulk and offline scoring</text>
  <text class="batch-endpoint-sub" x="30" y="372">This is the same trade as language model serving, and the resolution is the same: batch where nobody is waiting, and keep the interactive path unbatched.</text>
</svg>
