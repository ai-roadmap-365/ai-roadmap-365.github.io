<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What you average over decides.">
  <title>BatchNorm or LayerNorm</title>
  <style>
    .batchnorm-or-layernorm-bg   { fill: #f8fafc; }
    .batchnorm-or-layernorm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-or-layernorm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-or-layernorm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-or-layernorm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-or-layernorm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batchnorm-or-layernorm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .batchnorm-or-layernorm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .batchnorm-or-layernorm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .batchnorm-or-layernorm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .batchnorm-or-layernorm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .batchnorm-or-layernorm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .batchnorm-or-layernorm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .batchnorm-or-layernorm-row { opacity: 1; }
    .batchnorm-or-layernorm-r0 { animation-delay: 0.00s; }
    .batchnorm-or-layernorm-r1 { animation-delay: 0.45s; }
    .batchnorm-or-layernorm-r2 { animation-delay: 0.90s; }
    .batchnorm-or-layernorm-r3 { animation-delay: 1.35s; }
    .batchnorm-or-layernorm-r4 { animation-delay: 1.80s; }
    .batchnorm-or-layernorm-row { animation: batchnorm-or-layernorm-reveal 7.3s ease-in-out infinite; }
    @keyframes batchnorm-or-layernorm-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="batchnorm-or-layernorm-bg" width="980" height="390"/>
  <text class="batchnorm-or-layernorm-h1"  x="30" y="40">BatchNorm or LayerNorm</text>
  <text class="batchnorm-or-layernorm-sub" x="30" y="64">What you average over decides.</text>
  <rect class="batchnorm-or-layernorm-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="batchnorm-or-layernorm-name" x="46" y="122">BatchNorm</text>
  <text class="batchnorm-or-layernorm-desc" x="46" y="142">Across the batch, per channel.</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r0" x="46" y="182">Statistics depend on other samples</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r1" x="46" y="216">Needs a reasonably large batch</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r2" x="46" y="250">Different behaviour in train and eval</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r3" x="46" y="284">Excellent for convolutional vision</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r4" x="46" y="318">Awkward for variable-length sequences</text>
  <rect class="batchnorm-or-layernorm-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="batchnorm-or-layernorm-name" x="526" y="122">LayerNorm</text>
  <text class="batchnorm-or-layernorm-desc" x="526" y="142">Across features, per sample.</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r0" x="526" y="182">Statistics depend only on this sample</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r1" x="526" y="216">Batch size is irrelevant</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r2" x="526" y="250">Identical in train and eval</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r3" x="526" y="284">The standard in transformers</text>
  <text class="batchnorm-or-layernorm-desc batchnorm-or-layernorm-row batchnorm-or-layernorm-r4" x="526" y="318">And in any sequence model</text>
  <text class="batchnorm-or-layernorm-sub" x="30" y="372">The batch dependence is the deciding property: LayerNorm's statistics come from one sample, which is why it works with a batch of one and why sequence models adopted it.</text>
</svg>
