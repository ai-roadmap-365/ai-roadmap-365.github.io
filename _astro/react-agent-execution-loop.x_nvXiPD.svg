<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img">
  <title>React Agent Execution Loop</title>
  <defs>
    <style>
      .d289a-bg { fill: #f8fafc; }
      .d289a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d289a-thought { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d289a-action { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d289a-obs { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d289a-final { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d289a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d289a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d289a-node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d289a-node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .d289a-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 6,4; fill: none; animation: d289a-p 3s linear infinite; }
      @keyframes d289a-p { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .d289a-flow { animation: none; } }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d289a-bg" />
  
  <text x="40" y="40" class="d289a-title">ReAct Agent Execution Loop</text>
  <text x="40" y="65" class="d289a-subtitle">Thought, Action, Environment Execution, Observation, and Dynamic Termination Loop</text>
  
  <!-- Step 1: Input -->
  <rect x="40" y="110" width="180" height="70" class="d289a-card" />
  <text x="55" y="135" class="d289a-node-title" fill="#0f172a">Goal Ingestion</text>
  <text x="55" y="155" class="d289a-node-desc">User prompt + system prompt</text>
  
  <!-- Step 2: Thought -->
  <rect x="270" y="110" width="200" height="70" class="d289a-thought" />
  <text x="285" y="135" class="d289a-node-title" fill="#1d4ed8">1. Thought (Reason)</text>
  <text x="285" y="155" class="d289a-node-desc">Deduce strategy &amp; select tool</text>
  
  <!-- Step 3: Action -->
  <rect x="520" y="110" width="200" height="70" class="d289a-action" />
  <text x="535" y="135" class="d289a-node-title" fill="#a16207">2. Action (Act)</text>
  <text x="535" y="155" class="d289a-node-desc">Emit JSON tool payload</text>
  
  <!-- Step 4: Tool Execution Sandbox -->
  <rect x="520" y="240" width="200" height="80" class="d289a-card" />
  <text x="535" y="265" class="d289a-node-title" fill="#0f172a">3. Tool Execution</text>
  <text x="535" y="285" class="d289a-node-desc">Execute API / DB / Python</text>
  <text x="535" y="300" class="d289a-node-desc">Catch exceptions &amp; format</text>
  
  <!-- Step 5: Observation -->
  <rect x="270" y="240" width="200" height="80" class="d289a-obs" />
  <text x="285" y="265" class="d289a-node-title" fill="#15803d">4. Observation (Observe)</text>
  <text x="285" y="285" class="d289a-node-desc">Inject result into scratchpad</text>
  <text x="285" y="300" class="d289a-node-desc">Evaluate task progress</text>
  
  <!-- Step 6: Final Answer -->
  <rect x="40" y="240" width="180" height="80" class="d289a-final" />
  <text x="55" y="265" class="d289a-node-title" fill="#7e22ce">5. Final Answer</text>
  <text x="55" y="285" class="d289a-node-desc">Goal satisfied -> return answer</text>
  <text x="55" y="300" class="d289a-node-desc">Terminate runtime loop</text>
  
  <!-- Flow Arrows -->
  <path d="M 220 145 L 270 145" class="d289a-flow" />
  <path d="M 470 145 L 520 145" class="d289a-flow" />
  <path d="M 620 180 L 620 240" class="d289a-flow" />
  <path d="M 520 280 L 470 280" class="d289a-flow" />
  <path d="M 370 240 L 370 180" class="d289a-flow" stroke="#3b82f6" />
  <path d="M 270 280 L 220 280" class="d289a-flow" stroke="#a855f7" />
  
  <text x="380" y="215" class="d289a-node-desc" font-weight="600" fill="#3b82f6">Loop Iteration</text>
</svg>