<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="RFC 6570, applied to data.">
  <title>Templates instead of enumeration</title>
  <style>
    .uri-templates-bg   { fill: #f8fafc; }
    .uri-templates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .uri-templates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .uri-templates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .uri-templates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .uri-templates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .uri-templates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .uri-templates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .uri-templates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .uri-templates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .uri-templates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .uri-templates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .uri-templates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .uri-templates-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .uri-templates-stage { opacity: 1; }

    .uri-templates-s0 { animation-delay: 0.00s; }
    .uri-templates-e0 { animation-delay: 0.00s; }
    .uri-templates-s1 { animation-delay: 1.50s; }
    .uri-templates-e1 { animation-delay: 1.50s; }
    .uri-templates-s2 { animation-delay: 3.00s; }
    .uri-templates-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .uri-templates-conn  { animation: uri-templates-trace 6s ease-in-out infinite; }
      .uri-templates-stage { animation: uri-templates-arrive 6s ease-in-out infinite; }
    }
    @keyframes uri-templates-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes uri-templates-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .uri-templates-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .uri-templates-stage { animation: uri-templates-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes uri-templates-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="uri-templates-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="uri-templates-bg" width="980" height="322"/>
  <text class="uri-templates-h1"  x="30" y="40">Templates instead of enumeration</text>
  <text class="uri-templates-sub" x="30" y="64">RFC 6570, applied to data.</text>
  <g class="uri-templates-stage uri-templates-s0">
    <rect class="uri-templates-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="uri-templates-step" x="44" y="142">01</text>
    <text class="uri-templates-name" x="70" y="142">A static resource</text>
    <text class="uri-templates-desc" x="44" y="166">memo://active-task. One URI, one thing.</text>
  </g>
  <line class="uri-templates-line uri-templates-conn uri-templates-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#uri-templates-tip)"/>
  <g class="uri-templates-stage uri-templates-s1">
    <rect class="uri-templates-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="uri-templates-step" x="359" y="142">02</text>
    <text class="uri-templates-name" x="385" y="142">A template</text>
    <text class="uri-templates-desc" x="359" y="166">postgres://&lt;database&gt;/&lt;table&gt;/records. A</text>
    <text class="uri-templates-desc" x="359" y="182">shape, not an instance.</text>
    <text class="uri-templates-edge" x="359" y="242">RFC 6570</text>
  </g>
  <line class="uri-templates-line uri-templates-conn uri-templates-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#uri-templates-tip)"/>
  <g class="uri-templates-stage uri-templates-s2">
    <rect class="uri-templates-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="uri-templates-step" x="674" y="142">03</text>
    <text class="uri-templates-name" x="700" y="142">resources/templates/list</text>
    <text class="uri-templates-desc" x="674" y="166">So the client builds URIs without the server</text>
    <text class="uri-templates-desc" x="674" y="182">enumerating every table.</text>
  </g>
  <text class="uri-templates-sub" x="30" y="304">Enumeration is what makes a large catalogue unusable: a database with four hundred tables produces four hundred resources at handshake time, and one template produces one.</text>
</svg>
