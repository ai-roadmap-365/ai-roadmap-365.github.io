<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Before any others. These are the ones you use hourly.">
  <title>Five shortcuts worth learning properly</title>
  <style>
    .keyboard-five-bg   { fill: #f8fafc; }
    .keyboard-five-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyboard-five-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyboard-five-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyboard-five-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyboard-five-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyboard-five-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .keyboard-five-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .keyboard-five-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .keyboard-five-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .keyboard-five-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .keyboard-five-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .keyboard-five-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .keyboard-five-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .keyboard-five-stage { opacity: 1; }

    .keyboard-five-s0 { animation-delay: 0.00s; }
    .keyboard-five-e0 { animation-delay: 0.00s; }
    .keyboard-five-s1 { animation-delay: 1.33s; }
    .keyboard-five-e1 { animation-delay: 1.33s; }
    .keyboard-five-s2 { animation-delay: 2.67s; }
    .keyboard-five-e2 { animation-delay: 2.67s; }
    .keyboard-five-s3 { animation-delay: 4.00s; }
    .keyboard-five-e3 { animation-delay: 4.00s; }
    .keyboard-five-s4 { animation-delay: 5.33s; }
    .keyboard-five-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .keyboard-five-conn  { animation: keyboard-five-trace 8s ease-in-out infinite; }
      .keyboard-five-stage { animation: keyboard-five-arrive 8s ease-in-out infinite; }
    }
    @keyframes keyboard-five-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes keyboard-five-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .keyboard-five-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .keyboard-five-stage { animation: keyboard-five-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes keyboard-five-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="keyboard-five-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="keyboard-five-bg" width="980" height="322"/>
  <text class="keyboard-five-h1"  x="30" y="40">Five shortcuts worth learning properly</text>
  <text class="keyboard-five-sub" x="30" y="64">Before any others. These are the ones you use hourly.</text>
  <g class="keyboard-five-stage keyboard-five-s0">
    <rect class="keyboard-five-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="keyboard-five-step" x="44" y="142">01</text>
    <text class="keyboard-five-name" x="70" y="142">Go to file</text>
    <text class="keyboard-five-desc" x="44" y="166">Type part of a filename</text>
    <text class="keyboard-five-desc" x="44" y="182">and open it. Replaces all</text>
    <text class="keyboard-five-desc" x="44" y="198">tree navigation.</text>
    <text class="keyboard-five-edge" x="44" y="242">most used</text>
  </g>
  <line class="keyboard-five-line keyboard-five-conn keyboard-five-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#keyboard-five-tip)"/>
  <g class="keyboard-five-stage keyboard-five-s1">
    <rect class="keyboard-five-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="keyboard-five-step" x="233" y="142">02</text>
    <text class="keyboard-five-name" x="259" y="142">Go to symbol</text>
    <text class="keyboard-five-desc" x="233" y="166">Jump to a function or</text>
    <text class="keyboard-five-desc" x="233" y="182">class within the file, by</text>
    <text class="keyboard-five-desc" x="233" y="198">name.</text>
  </g>
  <line class="keyboard-five-line keyboard-five-conn keyboard-five-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#keyboard-five-tip)"/>
  <g class="keyboard-five-stage keyboard-five-s2">
    <rect class="keyboard-five-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="keyboard-five-step" x="422" y="142">03</text>
    <text class="keyboard-five-name" x="448" y="142">Find in project</text>
    <text class="keyboard-five-desc" x="422" y="166">Search every file at</text>
    <text class="keyboard-five-desc" x="422" y="182">once. Day 10's grep, with</text>
    <text class="keyboard-five-desc" x="422" y="198">results you can click.</text>
  </g>
  <line class="keyboard-five-line keyboard-five-conn keyboard-five-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#keyboard-five-tip)"/>
  <g class="keyboard-five-stage keyboard-five-s3">
    <rect class="keyboard-five-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="keyboard-five-step" x="611" y="142">04</text>
    <text class="keyboard-five-name" x="637" y="142">Rename symbol</text>
    <text class="keyboard-five-desc" x="611" y="166">Rename across every file</text>
    <text class="keyboard-five-desc" x="611" y="182">that references it — the</text>
    <text class="keyboard-five-desc" x="611" y="198">language server does</text>
    <text class="keyboard-five-edge" x="611" y="242">safe</text>
  </g>
  <line class="keyboard-five-line keyboard-five-conn keyboard-five-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#keyboard-five-tip)"/>
  <g class="keyboard-five-stage keyboard-five-s4">
    <rect class="keyboard-five-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="keyboard-five-step" x="800" y="142">05</text>
    <text class="keyboard-five-name" x="826" y="142">Toggle terminal</text>
    <text class="keyboard-five-desc" x="800" y="166">Run the tests without</text>
    <text class="keyboard-five-desc" x="800" y="182">leaving the keyboard.</text>
  </g>
  <text class="keyboard-five-sub" x="30" y="304">Rename is the one worth appreciating: it understands scope, so it renames the variable and not the unrelated word that happens to match. Find-and-replace cannot do that.</text>
</svg>
