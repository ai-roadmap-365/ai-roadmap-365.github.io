<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One completes; the other unfolds.">
  <title>An AI response is not a page load</title>
  <style>
    .response-not-page-load-bg   { fill: #f8fafc; }
    .response-not-page-load-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .response-not-page-load-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .response-not-page-load-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .response-not-page-load-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .response-not-page-load-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .response-not-page-load-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .response-not-page-load-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .response-not-page-load-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .response-not-page-load-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .response-not-page-load-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .response-not-page-load-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .response-not-page-load-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .response-not-page-load-row { opacity: 1; }
    .response-not-page-load-r0 { animation-delay: 0.00s; }
    .response-not-page-load-r1 { animation-delay: 0.45s; }
    .response-not-page-load-r2 { animation-delay: 0.90s; }
    .response-not-page-load-r3 { animation-delay: 1.35s; }
    .response-not-page-load-r4 { animation-delay: 1.80s; }
    .response-not-page-load-row { animation: response-not-page-load-reveal 7.3s ease-in-out infinite; }
    @keyframes response-not-page-load-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="response-not-page-load-bg" width="980" height="390"/>
  <text class="response-not-page-load-h1"  x="30" y="40">An AI response is not a page load</text>
  <text class="response-not-page-load-sub" x="30" y="64">One completes; the other unfolds.</text>
  <rect class="response-not-page-load-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="response-not-page-load-name" x="46" y="122">A page load</text>
  <text class="response-not-page-load-desc" x="46" y="142">Two states, one ending.</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r0" x="46" y="182">Fast enough to feel atomic</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r1" x="46" y="216">Loading, then loaded</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r2" x="46" y="250">Nothing useful in between</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r3" x="46" y="284">No reason to stop it</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r4" x="46" y="318">One way to fail</text>
  <rect class="response-not-page-load-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="response-not-page-load-name" x="526" y="122">An AI response</text>
  <text class="response-not-page-load-desc" x="526" y="142">Five states, three endings.</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r0" x="526" y="182">Seconds, sometimes tens of them</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r1" x="526" y="216">Idle, waiting, streaming, then an ending</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r2" x="526" y="250">Partial output is useful on its own</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r3" x="526" y="284">Users stop it constantly</text>
  <text class="response-not-page-load-desc response-not-page-load-row response-not-page-load-r4" x="526" y="318">Done, error and cancelled differ</text>
  <text class="response-not-page-load-sub" x="30" y="372">Every UI failure in this lesson comes from applying the left column's assumptions to the right column's problem — one loading spinner, one error box, no way to stop.</text>
</svg>
