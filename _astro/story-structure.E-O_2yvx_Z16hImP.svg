<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Structuring a data story</title>
  <style>
    .story-structure-bg   { fill: #f8fafc; }
    .story-structure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-structure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-structure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-structure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-structure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-structure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .story-structure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .story-structure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .story-structure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .story-structure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .story-structure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .story-structure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .story-structure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .story-structure-stage { opacity: 1; }

    .story-structure-s0 { animation-delay: 0.00s; }
    .story-structure-e0 { animation-delay: 0.00s; }
    .story-structure-s1 { animation-delay: 1.28s; }
    .story-structure-e1 { animation-delay: 1.28s; }
    .story-structure-s2 { animation-delay: 2.56s; }
    .story-structure-e2 { animation-delay: 2.56s; }
    .story-structure-s3 { animation-delay: 3.84s; }
    .story-structure-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .story-structure-conn  { animation: story-structure-trace 6.4s ease-in-out infinite; }
      .story-structure-stage { animation: story-structure-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes story-structure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes story-structure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .story-structure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .story-structure-stage { animation: story-structure-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes story-structure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="story-structure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="story-structure-bg" width="980" height="322"/>
  <text class="story-structure-h1"  x="30" y="40">Structuring a data story</text>
  <text class="story-structure-sub" x="30" y="64">Four steps.</text>
  <g class="story-structure-stage story-structure-s0">
    <rect class="story-structure-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="story-structure-step" x="44" y="142">01</text>
    <text class="story-structure-name" x="70" y="142">State the question the audience cares about</text>
    <text class="story-structure-desc" x="44" y="166">Not the analysis you ran.</text>
  </g>
  <line class="story-structure-line story-structure-conn story-structure-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#story-structure-tip)"/>
  <g class="story-structure-stage story-structure-s1">
    <rect class="story-structure-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="story-structure-step" x="280" y="142">02</text>
    <text class="story-structure-name" x="306" y="142">Show the evidence, one point per chart</text>
    <text class="story-structure-desc" x="280" y="166">With the takeaway in the</text>
    <text class="story-structure-desc" x="280" y="182">caption.</text>
  </g>
  <line class="story-structure-line story-structure-conn story-structure-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#story-structure-tip)"/>
  <g class="story-structure-stage story-structure-s2">
    <rect class="story-structure-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="story-structure-step" x="516" y="142">03</text>
    <text class="story-structure-name" x="542" y="142">State the caveats honestly</text>
    <text class="story-structure-desc" x="516" y="166">Which builds rather than costs</text>
    <text class="story-structure-desc" x="516" y="182">credibility.</text>
  </g>
  <line class="story-structure-line story-structure-conn story-structure-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#story-structure-tip)"/>
  <g class="story-structure-stage story-structure-s3">
    <rect class="story-structure-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="story-structure-step" x="752" y="142">04</text>
    <text class="story-structure-name" x="778" y="142">And say what should be done differently</text>
    <text class="story-structure-desc" x="752" y="166">Which is why anyone asked.</text>
  </g>
  <text class="story-structure-sub" x="30" y="304">Stating caveats building credibility rather than costing it is consistently true with expert audiences, who assume the caveats exist and distrust their absence.</text>
</svg>
