<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them has no attacker present.">
  <title>Direct against indirect injection</title>
  <style>
    .direct-indirect-bg   { fill: #f8fafc; }
    .direct-indirect-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-indirect-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-indirect-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-indirect-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-indirect-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-indirect-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .direct-indirect-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .direct-indirect-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .direct-indirect-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .direct-indirect-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .direct-indirect-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .direct-indirect-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .direct-indirect-row { opacity: 1; }
    .direct-indirect-r0 { animation-delay: 0.00s; }
    .direct-indirect-r1 { animation-delay: 0.45s; }
    .direct-indirect-r2 { animation-delay: 0.90s; }
    .direct-indirect-r3 { animation-delay: 1.35s; }
    .direct-indirect-r4 { animation-delay: 1.80s; }
    .direct-indirect-row { animation: direct-indirect-reveal 7.3s ease-in-out infinite; }
    @keyframes direct-indirect-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="direct-indirect-bg" width="980" height="390"/>
  <text class="direct-indirect-h1"  x="30" y="40">Direct against indirect injection</text>
  <text class="direct-indirect-sub" x="30" y="64">One of them has no attacker present.</text>
  <rect class="direct-indirect-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="direct-indirect-name" x="46" y="122">Direct</text>
  <text class="direct-indirect-desc" x="46" y="142">Typed by the user.</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r0" x="46" y="182">The attacker is the user</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r1" x="46" y="216">Aiming at the system prompt or the rules</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r2" x="46" y="250">Visible in the conversation log</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r3" x="46" y="284">Bounded by that user's own privileges</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r4" x="46" y="318">Serious, and containable</text>
  <rect class="direct-indirect-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="direct-indirect-name" x="526" y="122">Indirect</text>
  <text class="direct-indirect-desc" x="526" y="142">Hidden in content.</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r0" x="526" y="182">Placed in a page, document or email</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r1" x="526" y="216">Reaches the model through retrieval or a tool</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r2" x="526" y="250">The victim never sees it</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r3" x="526" y="284">Runs with the victim's privileges</text>
  <text class="direct-indirect-desc direct-indirect-row direct-indirect-r4" x="526" y="318">Far more dangerous</text>
  <text class="direct-indirect-sub" x="30" y="372">Indirect injection is the form that matters most because it turns any content the system reads into an attack surface, including content the user trusts.</text>
</svg>
