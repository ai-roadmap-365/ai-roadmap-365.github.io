<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward decision alignment.">
  <title>Four steps in metric practice</title>
  <style>
    .metric-history-bg   { fill: #f8fafc; }
    .metric-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .metric-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .metric-history-stage { opacity: 1; }

    .metric-history-s0 { animation-delay: 0.00s; }
    .metric-history-e0 { animation-delay: 0.00s; }
    .metric-history-s1 { animation-delay: 1.28s; }
    .metric-history-e1 { animation-delay: 1.28s; }
    .metric-history-s2 { animation-delay: 2.56s; }
    .metric-history-e2 { animation-delay: 2.56s; }
    .metric-history-s3 { animation-delay: 3.84s; }
    .metric-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .metric-history-conn  { animation: metric-history-trace 6.4s ease-in-out infinite; }
      .metric-history-stage { animation: metric-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes metric-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes metric-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .metric-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .metric-history-stage { animation: metric-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes metric-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="metric-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="metric-history-bg" width="980" height="322"/>
  <text class="metric-history-h1"  x="30" y="40">Four steps in metric practice</text>
  <text class="metric-history-sub" x="30" y="64">Toward decision alignment.</text>
  <g class="metric-history-stage metric-history-s0">
    <rect class="metric-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="metric-history-step" x="44" y="142">01</text>
    <text class="metric-history-name" x="70" y="142">Accuracy, for everything</text>
    <text class="metric-history-desc" x="44" y="166">Which failed silently on</text>
    <text class="metric-history-desc" x="44" y="182">imbalanced problems.</text>
  </g>
  <line class="metric-history-line metric-history-conn metric-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#metric-history-tip)"/>
  <g class="metric-history-stage metric-history-s1">
    <rect class="metric-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="metric-history-step" x="280" y="142">02</text>
    <text class="metric-history-name" x="306" y="142">Precision and recall separated the error types</text>
    <text class="metric-history-desc" x="280" y="166">Borrowed from information</text>
    <text class="metric-history-desc" x="280" y="182">retrieval.</text>
  </g>
  <line class="metric-history-line metric-history-conn metric-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#metric-history-tip)"/>
  <g class="metric-history-stage metric-history-s2">
    <rect class="metric-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="metric-history-step" x="516" y="142">03</text>
    <text class="metric-history-name" x="542" y="142">Then cost-sensitive evaluation</text>
    <text class="metric-history-desc" x="516" y="166">Which tied the metric to the</text>
    <text class="metric-history-desc" x="516" y="182">decision.</text>
  </g>
  <line class="metric-history-line metric-history-conn metric-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#metric-history-tip)"/>
  <g class="metric-history-stage metric-history-s3">
    <rect class="metric-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="metric-history-step" x="752" y="142">04</text>
    <text class="metric-history-name" x="778" y="142">And task-specific metrics for ranking and generation</text>
    <text class="metric-history-desc" x="752" y="166">Where the earlier ones do not</text>
    <text class="metric-history-desc" x="752" y="182">apply at all.</text>
  </g>
  <text class="metric-history-sub" x="30" y="304">The direction throughout is toward measuring the decision rather than the prediction, which is the same direction retrieval evaluation took later.</text>
</svg>
