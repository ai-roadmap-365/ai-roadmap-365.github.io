<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the tier is decided by use.">
  <title>Four risk tiers</title>
  <style>
    .risk-tiers-bg   { fill: #f8fafc; }
    .risk-tiers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risk-tiers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risk-tiers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risk-tiers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risk-tiers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risk-tiers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .risk-tiers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .risk-tiers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .risk-tiers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .risk-tiers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .risk-tiers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .risk-tiers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .risk-tiers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .risk-tiers-stage { opacity: 1; }

    .risk-tiers-s0 { animation-delay: 0.00s; }
    .risk-tiers-e0 { animation-delay: 0.00s; }
    .risk-tiers-s1 { animation-delay: 1.28s; }
    .risk-tiers-e1 { animation-delay: 1.28s; }
    .risk-tiers-s2 { animation-delay: 2.56s; }
    .risk-tiers-e2 { animation-delay: 2.56s; }
    .risk-tiers-s3 { animation-delay: 3.84s; }
    .risk-tiers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .risk-tiers-conn  { animation: risk-tiers-trace 6.4s ease-in-out infinite; }
      .risk-tiers-stage { animation: risk-tiers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes risk-tiers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes risk-tiers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .risk-tiers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .risk-tiers-stage { animation: risk-tiers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes risk-tiers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="risk-tiers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="risk-tiers-bg" width="980" height="322"/>
  <text class="risk-tiers-h1"  x="30" y="40">Four risk tiers</text>
  <text class="risk-tiers-sub" x="30" y="64">And the tier is decided by use.</text>
  <g class="risk-tiers-stage risk-tiers-s0">
    <rect class="risk-tiers-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="risk-tiers-step" x="44" y="142">01</text>
    <text class="risk-tiers-name" x="70" y="142">Unacceptable</text>
    <text class="risk-tiers-desc" x="44" y="166">Prohibited outright. Social</text>
    <text class="risk-tiers-desc" x="44" y="182">scoring, certain biometric</text>
    <text class="risk-tiers-desc" x="44" y="198">surveillance.</text>
    <text class="risk-tiers-edge" x="44" y="242">banned</text>
  </g>
  <line class="risk-tiers-line risk-tiers-conn risk-tiers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#risk-tiers-tip)"/>
  <g class="risk-tiers-stage risk-tiers-s1">
    <rect class="risk-tiers-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="risk-tiers-step" x="280" y="142">02</text>
    <text class="risk-tiers-name" x="306" y="142">High risk</text>
    <text class="risk-tiers-desc" x="280" y="166">Credit, hiring, insurance,</text>
    <text class="risk-tiers-desc" x="280" y="182">education, law enforcement.</text>
    <text class="risk-tiers-desc" x="280" y="198">Conformity assessment required.</text>
    <text class="risk-tiers-edge" x="280" y="242">strict</text>
  </g>
  <line class="risk-tiers-line risk-tiers-conn risk-tiers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#risk-tiers-tip)"/>
  <g class="risk-tiers-stage risk-tiers-s2">
    <rect class="risk-tiers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="risk-tiers-step" x="516" y="142">03</text>
    <text class="risk-tiers-name" x="542" y="142">GPAI and transparency risk</text>
    <text class="risk-tiers-desc" x="516" y="166">Disclosure obligations: users</text>
    <text class="risk-tiers-desc" x="516" y="182">must know they are talking to a</text>
    <text class="risk-tiers-desc" x="516" y="198">machine.</text>
  </g>
  <line class="risk-tiers-line risk-tiers-conn risk-tiers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#risk-tiers-tip)"/>
  <g class="risk-tiers-stage risk-tiers-s3">
    <rect class="risk-tiers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="risk-tiers-step" x="752" y="142">04</text>
    <text class="risk-tiers-name" x="778" y="142">Minimal</text>
    <text class="risk-tiers-desc" x="752" y="166">No obligations. Most</text>
    <text class="risk-tiers-desc" x="752" y="182">applications live here.</text>
  </g>
  <text class="risk-tiers-sub" x="30" y="304">The classification is by application rather than by architecture, which surprises engineers: the same model is minimal risk behind a chat toy and high risk behind a hiring screen, and nothing about the weights changed.</text>
</svg>
