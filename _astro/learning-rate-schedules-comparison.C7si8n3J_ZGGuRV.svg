<svg role="img" aria-label="Comparison of learning rate schedules showing StepLR ExponentialLR ReduceLROnPlateau and CosineAnnealing trajectories across training epochs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Deep Learning Learning Rate Schedules Comparison</title>
  <defs>
    <linearGradient id="bg207a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card207" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg207a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LEARNING RATE SCHEDULES TAXONOMY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">StepLR, ExponentialLR, Cosine Annealing, and Warmup Trajectories</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card207)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Axes -->
    <line x1="60" y1="240" x2="720" y2="240" stroke="#64748b" stroke-width="1.5"/>
    <line x1="60" y1="40" x2="60" y2="240" stroke="#64748b" stroke-width="1.5"/>
    <text x="720" y="260" fill="#94a3b8" font-size="10" text-anchor="end">Training Epochs (t)</text>
    <text x="50" y="45" fill="#94a3b8" font-size="10" text-anchor="end">Learning Rate (eta)</text>

    <!-- Curve 1: StepLR (Staircase) -->
    <path d="M 60 60 L 220 60 L 220 120 L 420 120 L 420 180 L 700 180" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
    <text x="240" y="110" fill="#fb7185" font-size="9" font-weight="700">StepLR (gamma = 0.5)</text>

    <!-- Curve 2: ExponentialLR -->
    <path d="M 60 60 Q 200 160, 700 230" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="260" y="195" fill="#fbbf24" font-size="9" font-weight="700">ExponentialLR (gamma = 0.95)</text>

    <!-- Curve 3: Cosine Annealing -->
    <path d="M 60 60 C 260 60, 480 235, 700 235" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="490" y="150" fill="#38bdf8" font-size="9" font-weight="700">CosineAnnealingLR</text>

    <!-- Curve 4: Warmup + Cosine Annealing -->
    <path d="M 60 235 L 140 60 C 300 60, 500 235, 700 235" fill="none" stroke="#10b981" stroke-width="3"/>
    <text x="145" y="50" fill="#34d399" font-size="10" font-weight="700">Linear Warmup + Cosine Decay</text>

    <!-- Legend box -->
    <rect x="520" y="45" width="220" height="90" fill="#0f172a" stroke="#475569" rx="6"/>
    <line x1="535" y1="65" x2="565" y2="65" stroke="#10b981" stroke-width="2.5"/>
    <text x="575" y="69" fill="#f8fafc" font-size="8">Warmup + Cosine (Modern SOTA)</text>
    <line x1="535" y1="85" x2="565" y2="85" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="575" y="89" fill="#f8fafc" font-size="8">CosineAnnealingLR (Smooth Decay)</text>
    <line x1="535" y1="105" x2="565" y2="105" stroke="#f43f5e" stroke-width="2"/>
    <text x="575" y="109" fill="#f8fafc" font-size="8">StepLR (Standard ResNet Baseline)</text>
  </g>
</svg>
