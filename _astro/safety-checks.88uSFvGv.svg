<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Read, not remembered.">
  <title>Pre-flight checks</title>
  <style>
    .safety-checks-bg   { fill: #f8fafc; }
    .safety-checks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-checks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-checks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-checks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-checks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-checks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safety-checks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .safety-checks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .safety-checks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .safety-checks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .safety-checks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .safety-checks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safety-checks-row { opacity: 1; }
    .safety-checks-r0 { animation-delay: 0.00s; }
    .safety-checks-r1 { animation-delay: 0.45s; }
    .safety-checks-r2 { animation-delay: 0.90s; }
    .safety-checks-r3 { animation-delay: 1.35s; }
    .safety-checks-r4 { animation-delay: 1.80s; }
    .safety-checks-row { animation: safety-checks-reveal 7.3s ease-in-out infinite; }
    @keyframes safety-checks-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="safety-checks-bg" width="980" height="390"/>
  <text class="safety-checks-h1"  x="30" y="40">Pre-flight checks</text>
  <text class="safety-checks-sub" x="30" y="64">Read, not remembered.</text>
  <rect class="safety-checks-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="safety-checks-name" x="46" y="122">From memory</text>
  <text class="safety-checks-desc" x="46" y="142">Usually complete.</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r0" x="46" y="182">Experienced people remember most of it</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r1" x="46" y="216">Under pressure, steps are skipped</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r2" x="46" y="250">Nobody notices which</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r3" x="46" y="284">Failures are attributed to bad luck</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r4" x="46" y="318">This is a convention</text>
  <rect class="safety-checks-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="safety-checks-name" x="526" y="122">A required checklist</text>
  <text class="safety-checks-desc" x="526" y="142">Always complete.</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r0" x="526" y="182">Every item read and confirmed</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r1" x="526" y="216">Pressure does not skip steps</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r2" x="526" y="250">An unchecked item blocks departure</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r3" x="526" y="284">Failures are prevented</text>
  <text class="safety-checks-desc safety-checks-row safety-checks-r4" x="526" y="318">This is a gate</text>
  <text class="safety-checks-sub" x="30" y="372">Aviation adopted checklists precisely because expertise does not prevent omission under pressure, which is the same reason automated gates beat conventions.</text>
</svg>
