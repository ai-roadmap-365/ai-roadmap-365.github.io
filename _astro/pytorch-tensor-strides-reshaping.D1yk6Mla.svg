<svg role="img" aria-label="PyTorch tensor reshaping and memory stride operations comparing view contiguous reshape permute and transpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>PyTorch Tensor Memory Strides and Reshaping Taxonomy</title>
  <defs>
    <linearGradient id="bg202b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="strideCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg202b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PYTORCH TENSOR STRIDES &amp; RESHAPING TAXONOMY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Contiguous Memory Buffers, View vs Reshape, and Multi-Dimensional Permutations</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#strideCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- View Card -->
    <rect x="25" y="25" width="220" height="120" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">tensor.view(*shape)</text>
    <text x="135" y="70" fill="#cbd5e1" font-size="9" text-anchor="middle">Zero-Copy Memory View</text>
    <text x="135" y="90" fill="#94a3b8" font-size="8" text-anchor="middle">Requires contiguous tensor</text>
    <text x="135" y="115" fill="#34d399" font-size="8" text-anchor="middle">O(1) Instant Metadata Update</text>

    <!-- Reshape Card -->
    <rect x="270" y="25" width="220" height="120" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">tensor.reshape(*shape)</text>
    <text x="380" y="70" fill="#cbd5e1" font-size="9" text-anchor="middle">Safe Flexible Reshaping</text>
    <text x="380" y="90" fill="#94a3b8" font-size="8" text-anchor="middle">Returns view if contiguous,</text>
    <text x="380" y="108" fill="#94a3b8" font-size="8" text-anchor="middle">otherwise clones buffer</text>

    <!-- Permute / Transpose Card -->
    <rect x="515" y="25" width="220" height="120" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="625" y="48" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">tensor.permute(*dims)</text>
    <text x="625" y="70" fill="#cbd5e1" font-size="9" text-anchor="middle">Dimension Reordering</text>
    <text x="625" y="90" fill="#94a3b8" font-size="8" text-anchor="middle">Changes stride metadata</text>
    <text x="625" y="115" fill="#f87171" font-size="8" text-anchor="middle">Produces non-contiguous tensor</text>

    <!-- Contiguous explanation box -->
    <rect x="25" y="155" width="710" height="115" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/>
    <text x="380" y="180" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">The Contiguity Contract: x.contiguous().view(-1)</text>
    <text x="380" y="205" fill="#cbd5e1" font-size="10" text-anchor="middle">When permuting dimensions (e.g. NCHW -> NHWC), memory strides no longer match C-order layout.</text>
    <text x="380" y="225" fill="#cbd5e1" font-size="10" text-anchor="middle">Calling .contiguous() re-allocates a contiguous memory buffer, enabling fast tensor flattening and view reshaping.</text>
  </g>
</svg>
