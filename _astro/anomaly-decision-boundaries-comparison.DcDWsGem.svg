<svg role="img" aria-label="Three panel comparison showing contour decision boundaries of Elliptic Envelope Isolation Forest and Local Outlier Factor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Anomaly Decision Boundaries Comparison</title>
  <defs>
    <linearGradient id="bg187b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardContour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg187b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ANOMALY DETECTION PARADIGMS &amp; CONTOUR ENVELOPES</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Parametric Elliptic Envelopes vs Non-Parametric Isolation Forests vs Local Density LOF</text>
  <g transform="translate(40, 85)">
    <rect width="235" height="295" fill="url(#cardContour)" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
    <text x="117" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. Elliptic Envelope</text>
    <ellipse cx="117" cy="135" rx="75" ry="35" transform="rotate(-25 117 135)" fill="#3b82f6" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="117" y="225" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Gaussian Ellipse</text>
  </g>
  <g transform="translate(305, 85)">
    <rect width="235" height="295" fill="url(#cardContour)" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="117" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Isolation Forest</text>
    <path d="M 60 90 L 170 85 L 195 180 L 115 195 L 50 150 Z" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="2"/>
    <text x="117" y="225" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Axis-Aligned Partition</text>
  </g>
  <g transform="translate(570, 85)">
    <rect width="240" height="295" fill="url(#cardContour)" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="120" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. Local Outlier Factor</text>
    <circle cx="80" cy="115" r="30" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="165" cy="165" r="45" fill="#f59e0b" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="120" y="225" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Local Density Ratio</text>
  </g>
</svg>
