<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things modules are not</title>
  <style>
    .module-not-bg   { fill: #f8fafc; }
    .module-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .module-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .module-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .module-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .module-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .module-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .module-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .module-not-row { opacity: 1; }
    .module-not-r0 { animation-delay: 0.00s; }
    .module-not-r1 { animation-delay: 0.45s; }
    .module-not-r2 { animation-delay: 0.90s; }
    .module-not-r3 { animation-delay: 1.35s; }
    .module-not-r4 { animation-delay: 1.80s; }
    .module-not-row { animation: module-not-reveal 7.3s ease-in-out infinite; }
    @keyframes module-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="module-not-bg" width="980" height="390"/>
  <text class="module-not-h1"  x="30" y="40">Four things modules are not</text>
  <text class="module-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="module-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="module-not-name" x="46" y="122">The misconception</text>
  <text class="module-not-desc" x="46" y="142">Commonly held.</text>
  <text class="module-not-desc module-not-row module-not-r0" x="46" y="182">Importing twice runs the code twice</text>
  <text class="module-not-desc module-not-row module-not-r1" x="46" y="216">Import errors are code errors</text>
  <text class="module-not-desc module-not-row module-not-r2" x="46" y="250">A circular import is a technical limitation</text>
  <text class="module-not-desc module-not-row module-not-r3" x="46" y="284">Star imports are a convenience</text>
  <text class="module-not-desc module-not-row module-not-r4" x="46" y="318">Any file can be imported from anywhere</text>
  <rect class="module-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="module-not-name" x="526" y="122">What is true</text>
  <text class="module-not-desc" x="526" y="142">Actually.</text>
  <text class="module-not-desc module-not-row module-not-r0" x="526" y="182">It runs once; the rest come from the cache</text>
  <text class="module-not-desc module-not-row module-not-r1" x="526" y="216">They are usually path or layout problems</text>
  <text class="module-not-desc module-not-row module-not-r2" x="526" y="250">It signals a design problem</text>
  <text class="module-not-desc module-not-row module-not-r3" x="526" y="284">They hide where names came from</text>
  <text class="module-not-desc module-not-row module-not-r4" x="526" y="318">The search path decides what is importable</text>
  <text class="module-not-sub" x="30" y="372">Treating a circular import as a design signal rather than an obstacle usually leads to a better structure than the technical workarounds do.</text>
</svg>
