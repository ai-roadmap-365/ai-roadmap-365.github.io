<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How boolean filtering works</title>
  <style>
    .mask-how-bg   { fill: #f8fafc; }
    .mask-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mask-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mask-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mask-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mask-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mask-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mask-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mask-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mask-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mask-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mask-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mask-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mask-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mask-how-stage { opacity: 1; }

    .mask-how-s0 { animation-delay: 0.00s; }
    .mask-how-e0 { animation-delay: 0.00s; }
    .mask-how-s1 { animation-delay: 1.28s; }
    .mask-how-e1 { animation-delay: 1.28s; }
    .mask-how-s2 { animation-delay: 2.56s; }
    .mask-how-e2 { animation-delay: 2.56s; }
    .mask-how-s3 { animation-delay: 3.84s; }
    .mask-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mask-how-conn  { animation: mask-how-trace 6.4s ease-in-out infinite; }
      .mask-how-stage { animation: mask-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mask-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mask-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mask-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mask-how-stage { animation: mask-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mask-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mask-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mask-how-bg" width="980" height="322"/>
  <text class="mask-how-h1"  x="30" y="40">How boolean filtering works</text>
  <text class="mask-how-sub" x="30" y="64">Four steps.</text>
  <g class="mask-how-stage mask-how-s0">
    <rect class="mask-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mask-how-step" x="44" y="142">01</text>
    <text class="mask-how-name" x="70" y="142">A comparison is applied to a whole column</text>
    <text class="mask-how-desc" x="44" y="166">Giving one true or false per</text>
    <text class="mask-how-desc" x="44" y="182">row.</text>
  </g>
  <line class="mask-how-line mask-how-conn mask-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mask-how-tip)"/>
  <g class="mask-how-stage mask-how-s1">
    <rect class="mask-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mask-how-step" x="280" y="142">02</text>
    <text class="mask-how-name" x="306" y="142">That is the mask: a boolean series</text>
    <text class="mask-how-desc" x="280" y="166">The same length as the frame.</text>
  </g>
  <line class="mask-how-line mask-how-conn mask-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mask-how-tip)"/>
  <g class="mask-how-stage mask-how-s2">
    <rect class="mask-how-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mask-how-step" x="516" y="142">03</text>
    <text class="mask-how-name" x="542" y="142">Indexing by it keeps the true rows</text>
    <text class="mask-how-desc" x="516" y="166">In their original order.</text>
  </g>
  <line class="mask-how-line mask-how-conn mask-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mask-how-tip)"/>
  <g class="mask-how-stage mask-how-s3">
    <rect class="mask-how-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mask-how-step" x="752" y="142">04</text>
    <text class="mask-how-name" x="778" y="142">And masks combine with element-wise operators</text>
    <text class="mask-how-desc" x="752" y="166">Not the ordinary words, which</text>
    <text class="mask-how-desc" x="752" y="182">fail here.</text>
  </g>
  <text class="mask-how-sub" x="30" y="304">The ordinary boolean words failing is a common early error, because they try to reduce a whole array to one truth value and raise an exception.</text>
</svg>
