<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Partition, then purge.">
  <title>Invalidating a semantic cache</title>
  <style>
    .cache-invalidation-bg   { fill: #f8fafc; }
    .cache-invalidation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-invalidation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-invalidation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-invalidation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-invalidation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-invalidation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-invalidation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cache-invalidation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cache-invalidation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cache-invalidation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cache-invalidation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cache-invalidation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cache-invalidation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cache-invalidation-stage { opacity: 1; }

    .cache-invalidation-s0 { animation-delay: 0.00s; }
    .cache-invalidation-e0 { animation-delay: 0.00s; }
    .cache-invalidation-s1 { animation-delay: 1.50s; }
    .cache-invalidation-e1 { animation-delay: 1.50s; }
    .cache-invalidation-s2 { animation-delay: 3.00s; }
    .cache-invalidation-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .cache-invalidation-conn  { animation: cache-invalidation-trace 6s ease-in-out infinite; }
      .cache-invalidation-stage { animation: cache-invalidation-arrive 6s ease-in-out infinite; }
    }
    @keyframes cache-invalidation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cache-invalidation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cache-invalidation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cache-invalidation-stage { animation: cache-invalidation-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cache-invalidation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cache-invalidation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cache-invalidation-bg" width="980" height="322"/>
  <text class="cache-invalidation-h1"  x="30" y="40">Invalidating a semantic cache</text>
  <text class="cache-invalidation-sub" x="30" y="64">Partition, then purge.</text>
  <g class="cache-invalidation-stage cache-invalidation-s0">
    <rect class="cache-invalidation-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="cache-invalidation-step" x="44" y="142">01</text>
    <text class="cache-invalidation-name" x="70" y="142">Partition by document and tenant</text>
    <text class="cache-invalidation-desc" x="44" y="166">So a purge can be scoped rather than total.</text>
  </g>
  <line class="cache-invalidation-line cache-invalidation-conn cache-invalidation-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#cache-invalidation-tip)"/>
  <g class="cache-invalidation-stage cache-invalidation-s1">
    <rect class="cache-invalidation-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="cache-invalidation-step" x="359" y="142">02</text>
    <text class="cache-invalidation-name" x="385" y="142">Purge on re-index</text>
    <text class="cache-invalidation-desc" x="359" y="166">A namespace delete filtered by the changed</text>
    <text class="cache-invalidation-desc" x="359" y="182">document.</text>
    <text class="cache-invalidation-edge" x="359" y="242">scoped</text>
  </g>
  <line class="cache-invalidation-line cache-invalidation-conn cache-invalidation-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#cache-invalidation-tip)"/>
  <g class="cache-invalidation-stage cache-invalidation-s2">
    <rect class="cache-invalidation-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="cache-invalidation-step" x="674" y="142">03</text>
    <text class="cache-invalidation-name" x="700" y="142">Otherwise you serve last quarter's policy</text>
    <text class="cache-invalidation-desc" x="674" y="166">Confidently, and with a cache hit's latency.</text>
  </g>
  <text class="cache-invalidation-sub" x="30" y="304">A stale cache hit is worse than a miss because it is fast and confident: the user gets an authoritative-sounding answer from a policy that was superseded, with nothing to indicate its age.</text>
</svg>
