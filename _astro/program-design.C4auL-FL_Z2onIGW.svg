<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a well-designed small program: the outside world (a file, standard input, arguments) enters a thin imperative shell that does all the input and output; inside the shell sits a pure functional core of small single-responsibility functions with no I/O; results leave as standard output, standard error, and an exit code; and tests call the pure core directly with no files or captured output</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Functional core, imperative shell</text>

  <!-- Outside world -->
  <rect x="24" y="150" width="150" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="99" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Outside world</text>
  <text x="99" y="202" text-anchor="middle" font-size="14" fill="#1a202c">a file</text>
  <text x="99" y="224" text-anchor="middle" font-size="14" fill="#1a202c">standard input</text>
  <text x="99" y="246" text-anchor="middle" font-size="14" fill="#1a202c">arguments</text>

  <line x1="174" y1="210" x2="212" y2="210" stroke="#1a202c" stroke-width="2"/>
  <polygon points="212,210 200,204 200,216" fill="#1a202c"/>

  <!-- Imperative shell (outer) -->
  <rect x="212" y="86" width="366" height="252" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="395" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Imperative shell — summary.py</text>
  <text x="395" y="130" text-anchor="middle" font-size="14" fill="#1a202c">reads argv/files/stdin, prints, picks exit code</text>

  <!-- Functional core (inner) -->
  <rect x="248" y="150" width="294" height="152" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="395" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Functional core — summary_core.py</text>
  <text x="395" y="196" text-anchor="middle" font-size="14" fill="#1a202c">pure logic, no I/O</text>
  <text x="395" y="224" text-anchor="middle" font-size="14" fill="#1d4ed8">parse_numbers()</text>
  <text x="395" y="248" text-anchor="middle" font-size="14" fill="#1d4ed8">summarize()</text>
  <text x="395" y="272" text-anchor="middle" font-size="14" fill="#1d4ed8">format_summary()</text>
  <text x="395" y="292" text-anchor="middle" font-size="13" fill="#1a202c">each function, one responsibility</text>

  <!-- Shell to output -->
  <line x1="578" y1="210" x2="616" y2="210" stroke="#1a202c" stroke-width="2"/>
  <polygon points="616,210 604,204 604,216" fill="#1a202c"/>

  <!-- Output -->
  <rect x="616" y="150" width="140" height="120" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="686" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Output</text>
  <text x="686" y="202" text-anchor="middle" font-size="14" fill="#1a202c">stdout: result</text>
  <text x="686" y="224" text-anchor="middle" font-size="14" fill="#1a202c">stderr: errors</text>
  <text x="686" y="246" text-anchor="middle" font-size="14" fill="#1a202c">exit code 0 / 1</text>

  <!-- Tests below, pointing at the core -->
  <rect x="248" y="384" width="294" height="62" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="395" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Tests call the core directly</text>
  <text x="395" y="432" text-anchor="middle" font-size="14" fill="#1a202c">plain function calls — no files, no captured output</text>
  <line x1="395" y1="384" x2="395" y2="304" stroke="#1a202c" stroke-width="2"/>
  <polygon points="395,304 389,316 401,316" fill="#1a202c"/>

  <text x="390" y="464" text-anchor="middle" font-size="13" fill="#1a202c">Keep pure logic in the core and all the mess at the edges — the core stays small, testable, and reusable.</text>
</svg>
