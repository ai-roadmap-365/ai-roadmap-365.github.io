<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it does not.">
  <title>Where backpropagation applies</title>
  <style>
    .backprop-when-bg   { fill: #f8fafc; }
    .backprop-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backprop-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backprop-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backprop-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backprop-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backprop-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backprop-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backprop-when-row { opacity: 1; }
    .backprop-when-r0 { animation-delay: 0.00s; }
    .backprop-when-r1 { animation-delay: 0.45s; }
    .backprop-when-r2 { animation-delay: 0.90s; }
    .backprop-when-r3 { animation-delay: 1.35s; }
    .backprop-when-r4 { animation-delay: 1.80s; }
    .backprop-when-row { animation: backprop-when-reveal 7.3s ease-in-out infinite; }
    @keyframes backprop-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="backprop-when-bg" width="980" height="390"/>
  <text class="backprop-when-h1"  x="30" y="40">Where backpropagation applies</text>
  <text class="backprop-when-sub" x="30" y="64">And where it does not.</text>
  <rect class="backprop-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="backprop-when-name" x="46" y="122">Backpropagation works</text>
  <text class="backprop-when-desc" x="46" y="142">Differentiable, end to end.</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r0" x="46" y="182">Every layer is differentiable</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r1" x="46" y="216">The loss is differentiable</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r2" x="46" y="250">The graph is acyclic, or unrolled</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r3" x="46" y="284">Which covers nearly all deep learning</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r4" x="46" y="318">Including transformers and convolutional networks</text>
  <rect class="backprop-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="backprop-when-name" x="526" y="122">It does not</text>
  <text class="backprop-when-desc" x="526" y="142">Where the gradient does not exist.</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r0" x="526" y="182">Discrete decisions, like a hard argmax</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r1" x="526" y="216">Non-differentiable simulators</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r2" x="526" y="250">Reinforcement learning through an environment</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r3" x="526" y="284">Which needs policy gradients or search</text>
  <text class="backprop-when-desc backprop-when-row backprop-when-r4" x="526" y="318">Or a differentiable relaxation</text>
  <text class="backprop-when-sub" x="30" y="372">The discrete case matters in practice more than it sounds: sampling a token is an argmax, which is why language model training uses teacher forcing rather than backpropagating through generation.</text>
</svg>
