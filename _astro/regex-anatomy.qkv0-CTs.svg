<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a regular expression, with a date pattern's anchors, groups, character classes, and quantifiers labelled</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a regular expression</text>
  <text x="380" y="58" text-anchor="middle" font-size="15" fill="#1a202c">The pattern for an ISO date such as 2026-07-12</text>

  <!-- Highlight bands behind the two annotated groups -->
  <rect x="96" y="218" width="118" height="44" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>

  <!-- The pattern, token by token, monospace -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#1a202c" text-anchor="middle">
    <text x="70" y="250" fill="#1d4ed8" font-weight="bold">^</text>
    <text x="104" y="250">(</text>
    <text x="134" y="250">\d</text>
    <text x="176" y="250">{4}</text>
    <text x="208" y="250">)</text>
    <text x="238" y="250">-</text>
    <text x="268" y="250">(</text>
    <text x="298" y="250">\d</text>
    <text x="332" y="250">{2}</text>
    <text x="366" y="250">)</text>
    <text x="396" y="250">-</text>
    <text x="426" y="250">(</text>
    <text x="456" y="250">\d</text>
    <text x="490" y="250">{2}</text>
    <text x="524" y="250">)</text>
    <text x="558" y="250" fill="#1d4ed8" font-weight="bold">$</text>
  </g>

  <!-- Top annotations -->
  <rect x="40" y="92" width="230" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="155" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Capture group ( … )</text>
  <text x="155" y="134" text-anchor="middle" font-size="13" fill="#1a202c">remembers this matched piece</text>
  <line x1="155" y1="148" x2="155" y2="214" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="155,220 149,208 161,208" fill="#1d4ed8"/>

  <rect x="300" y="92" width="210" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="405" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Character class \d</text>
  <text x="405" y="134" text-anchor="middle" font-size="13" fill="#1a202c">any single digit 0–9</text>
  <line x1="405" y1="148" x2="299" y2="230" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="298,234 300,220 310,229" fill="#1d4ed8"/>

  <rect x="540" y="92" width="200" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="640" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Quantifier {4}</text>
  <text x="640" y="134" text-anchor="middle" font-size="13" fill="#1a202c">exactly four times</text>
  <line x1="640" y1="148" x2="330" y2="230" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="329,234 331,220 341,229" fill="#1d4ed8"/>

  <!-- Bottom annotations -->
  <rect x="40" y="300" width="250" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="165" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Anchors ^ and $</text>
  <text x="165" y="342" text-anchor="middle" font-size="13" fill="#1a202c">pin the match to a whole line</text>
  <line x1="90" y1="300" x2="70" y2="262" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="70,256 64,268 76,268" fill="#1d4ed8"/>
  <line x1="240" y1="300" x2="558" y2="262" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="558,256 552,268 564,268" fill="#1d4ed8"/>

  <rect x="470" y="300" width="250" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="595" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Literal hyphen -</text>
  <text x="595" y="342" text-anchor="middle" font-size="13" fill="#1a202c">matches a real "-" in the text</text>
  <line x1="530" y1="300" x2="238" y2="262" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="238,256 232,268 244,268" fill="#1d4ed8"/>

  <text x="380" y="400" text-anchor="middle" font-size="14" fill="#1a202c">Every pattern is built from these same parts: literals, classes, quantifiers, groups, and anchors.</text>
</svg>
