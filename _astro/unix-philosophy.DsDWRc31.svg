<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The decision that made pipes possible.">
  <title>One big program, or many small ones</title>
  <style>
    .unix-philosophy-bg   { fill: #f8fafc; }
    .unix-philosophy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unix-philosophy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unix-philosophy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unix-philosophy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unix-philosophy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unix-philosophy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unix-philosophy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unix-philosophy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unix-philosophy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unix-philosophy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unix-philosophy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unix-philosophy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unix-philosophy-row { opacity: 1; }
    .unix-philosophy-r0 { animation-delay: 0.00s; }
    .unix-philosophy-r1 { animation-delay: 0.45s; }
    .unix-philosophy-r2 { animation-delay: 0.90s; }
    .unix-philosophy-r3 { animation-delay: 1.35s; }
    .unix-philosophy-r4 { animation-delay: 1.80s; }
    .unix-philosophy-row { animation: unix-philosophy-reveal 7.3s ease-in-out infinite; }
    @keyframes unix-philosophy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="unix-philosophy-bg" width="980" height="390"/>
  <text class="unix-philosophy-h1"  x="30" y="40">One big program, or many small ones</text>
  <text class="unix-philosophy-sub" x="30" y="64">The decision that made pipes possible.</text>
  <rect class="unix-philosophy-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="unix-philosophy-name" x="46" y="122">One program per job</text>
  <text class="unix-philosophy-desc" x="46" y="142">Every feature built in, by someone else.</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r0" x="46" y="182">Learn one interface per task</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r1" x="46" y="216">Does exactly what its author imagined</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r2" x="46" y="250">A new requirement needs a new feature</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r3" x="46" y="284">You wait for the author</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r4" x="46" y="318">Combinations are whatever was anticipated</text>
  <rect class="unix-philosophy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="unix-philosophy-name" x="526" y="122">Small tools, piped</text>
  <text class="unix-philosophy-desc" x="526" y="142">Each does one thing to a stream of text.</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r0" x="526" y="182">Learn eight tools, combine them forever</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r1" x="526" y="216">Does what you can compose</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r2" x="526" y="250">A new requirement is a new arrangement</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r3" x="526" y="284">You build it in one line</text>
  <text class="unix-philosophy-desc unix-philosophy-row unix-philosophy-r4" x="526" y="318">Combinations are unlimited by design</text>
  <text class="unix-philosophy-sub" x="30" y="372">This is why the same eight commands answer questions their authors never imagined, fifty years later.</text>
</svg>
