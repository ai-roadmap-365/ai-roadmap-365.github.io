<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four views.">
  <title>What to look at first</title>
  <style>
    .dist130-idea-bg   { fill: #f8fafc; }
    .dist130-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dist130-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dist130-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dist130-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dist130-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dist130-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dist130-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dist130-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dist130-idea-stage { opacity: 1; }

    .dist130-idea-s0 { animation-delay: 0.00s; }
    .dist130-idea-e0 { animation-delay: 0.00s; }
    .dist130-idea-s1 { animation-delay: 1.28s; }
    .dist130-idea-e1 { animation-delay: 1.28s; }
    .dist130-idea-s2 { animation-delay: 2.56s; }
    .dist130-idea-e2 { animation-delay: 2.56s; }
    .dist130-idea-s3 { animation-delay: 3.84s; }
    .dist130-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dist130-idea-conn  { animation: dist130-idea-trace 6.4s ease-in-out infinite; }
      .dist130-idea-stage { animation: dist130-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dist130-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dist130-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dist130-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dist130-idea-stage { animation: dist130-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dist130-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dist130-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dist130-idea-bg" width="980" height="322"/>
  <text class="dist130-idea-h1"  x="30" y="40">What to look at first</text>
  <text class="dist130-idea-sub" x="30" y="64">Four views.</text>
  <g class="dist130-idea-stage dist130-idea-s0">
    <rect class="dist130-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dist130-idea-step" x="44" y="142">01</text>
    <text class="dist130-idea-name" x="70" y="142">One variable at a time: its distribution</text>
    <text class="dist130-idea-desc" x="44" y="166">Shape, centre, spread, gaps.</text>
  </g>
  <line class="dist130-idea-line dist130-idea-conn dist130-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dist130-idea-tip)"/>
  <g class="dist130-idea-stage dist130-idea-s1">
    <rect class="dist130-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dist130-idea-step" x="280" y="142">02</text>
    <text class="dist130-idea-name" x="306" y="142">Two variables together: their relationship</text>
    <text class="dist130-idea-desc" x="280" y="166">Direction, strength, form.</text>
  </g>
  <line class="dist130-idea-line dist130-idea-conn dist130-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dist130-idea-tip)"/>
  <g class="dist130-idea-stage dist130-idea-s2">
    <rect class="dist130-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dist130-idea-step" x="516" y="142">03</text>
    <text class="dist130-idea-name" x="542" y="142">Split by a grouping variable</text>
    <text class="dist130-idea-desc" x="516" y="166">Which often changes the story.</text>
  </g>
  <line class="dist130-idea-line dist130-idea-conn dist130-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dist130-idea-tip)"/>
  <g class="dist130-idea-stage dist130-idea-s3">
    <rect class="dist130-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dist130-idea-step" x="752" y="142">04</text>
    <text class="dist130-idea-name" x="778" y="142">And the extremes: what lies far from the rest</text>
    <text class="dist130-idea-desc" x="752" y="166">Which is often the interesting</text>
    <text class="dist130-idea-desc" x="752" y="182">part.</text>
  </g>
  <text class="dist130-idea-sub" x="30" y="304">Splitting by a grouping variable changing the story is not a rare event, and it is the visual form of the reversal that the next section discusses.</text>
</svg>
