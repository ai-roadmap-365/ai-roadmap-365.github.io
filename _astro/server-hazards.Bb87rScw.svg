<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Both are old vulnerabilities with a new caller.">
  <title>Two hazards at the handler</title>
  <style>
    .server-hazards-bg   { fill: #f8fafc; }
    .server-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .server-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .server-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .server-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .server-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .server-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .server-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .server-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .server-hazards-stage { opacity: 1; }

    .server-hazards-s0 { animation-delay: 0.00s; }
    .server-hazards-e0 { animation-delay: 0.00s; }
    .server-hazards-s1 { animation-delay: 1.50s; }
    .server-hazards-e1 { animation-delay: 1.50s; }
    .server-hazards-s2 { animation-delay: 3.00s; }
    .server-hazards-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .server-hazards-conn  { animation: server-hazards-trace 6s ease-in-out infinite; }
      .server-hazards-stage { animation: server-hazards-arrive 6s ease-in-out infinite; }
    }
    @keyframes server-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes server-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .server-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .server-hazards-stage { animation: server-hazards-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes server-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="server-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="server-hazards-bg" width="980" height="322"/>
  <text class="server-hazards-h1"  x="30" y="40">Two hazards at the handler</text>
  <text class="server-hazards-sub" x="30" y="64">Both are old vulnerabilities with a new caller.</text>
  <g class="server-hazards-stage server-hazards-s0">
    <rect class="server-hazards-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="server-hazards-step" x="44" y="142">01</text>
    <text class="server-hazards-name" x="70" y="142">Arguments arrive from a model</text>
    <text class="server-hazards-desc" x="44" y="166">Which reads untrusted text. Treat every</text>
    <text class="server-hazards-desc" x="44" y="182">argument as hostile.</text>
  </g>
  <line class="server-hazards-line server-hazards-conn server-hazards-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#server-hazards-tip)"/>
  <g class="server-hazards-stage server-hazards-s1">
    <rect class="server-hazards-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="server-hazards-step" x="359" y="142">02</text>
    <text class="server-hazards-name" x="385" y="142">Parameterise everything</text>
    <text class="server-hazards-desc" x="359" y="166">Bound SQL parameters and safe APIs. Never</text>
    <text class="server-hazards-desc" x="359" y="182">string interpolation into a shell.</text>
    <text class="server-hazards-edge" x="359" y="242">Day 344</text>
  </g>
  <line class="server-hazards-line server-hazards-conn server-hazards-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#server-hazards-tip)"/>
  <g class="server-hazards-stage server-hazards-s2">
    <rect class="server-hazards-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="server-hazards-step" x="674" y="142">03</text>
    <text class="server-hazards-name" x="700" y="142">Set an internal timeout</text>
    <text class="server-hazards-desc" x="674" y="166">Five to ten seconds, so a slow lookup fails</text>
    <text class="server-hazards-desc" x="674" y="182">fast and reports.</text>
  </g>
  <text class="server-hazards-sub" x="30" y="304">The timeout matters more here than in an ordinary service: a hung tool call blocks the agent's whole loop, and the client's own timeout produces a much less useful error than the server's would.</text>
</svg>
