<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties of a good split.">
  <title>Splitting into claims</title>
  <style>
    .claim-split-bg   { fill: #f8fafc; }
    .claim-split-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-split-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-split-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-split-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-split-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-split-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .claim-split-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .claim-split-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .claim-split-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .claim-split-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .claim-split-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .claim-split-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .claim-split-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .claim-split-stage { opacity: 1; }

    .claim-split-s0 { animation-delay: 0.00s; }
    .claim-split-e0 { animation-delay: 0.00s; }
    .claim-split-s1 { animation-delay: 1.28s; }
    .claim-split-e1 { animation-delay: 1.28s; }
    .claim-split-s2 { animation-delay: 2.56s; }
    .claim-split-e2 { animation-delay: 2.56s; }
    .claim-split-s3 { animation-delay: 3.84s; }
    .claim-split-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .claim-split-conn  { animation: claim-split-trace 6.4s ease-in-out infinite; }
      .claim-split-stage { animation: claim-split-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes claim-split-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes claim-split-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .claim-split-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .claim-split-stage { animation: claim-split-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes claim-split-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="claim-split-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="claim-split-bg" width="980" height="322"/>
  <text class="claim-split-h1"  x="30" y="40">Splitting into claims</text>
  <text class="claim-split-sub" x="30" y="64">Four properties of a good split.</text>
  <g class="claim-split-stage claim-split-s0">
    <rect class="claim-split-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="claim-split-step" x="44" y="142">01</text>
    <text class="claim-split-name" x="70" y="142">One assertion per claim</text>
    <text class="claim-split-desc" x="44" y="166">A sentence with two facts</text>
    <text class="claim-split-desc" x="44" y="182">becomes two claims.</text>
  </g>
  <line class="claim-split-line claim-split-conn claim-split-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#claim-split-tip)"/>
  <g class="claim-split-stage claim-split-s1">
    <rect class="claim-split-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="claim-split-step" x="280" y="142">02</text>
    <text class="claim-split-name" x="306" y="142">Self-contained</text>
    <text class="claim-split-desc" x="280" y="166">Pronouns resolved, so each can</text>
    <text class="claim-split-desc" x="280" y="182">be checked alone.</text>
  </g>
  <line class="claim-split-line claim-split-conn claim-split-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#claim-split-tip)"/>
  <g class="claim-split-stage claim-split-s2">
    <rect class="claim-split-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="claim-split-step" x="516" y="142">03</text>
    <text class="claim-split-name" x="542" y="142">Covering the whole answer</text>
    <text class="claim-split-desc" x="516" y="166">Or an unchecked sentence slips</text>
    <text class="claim-split-desc" x="516" y="182">through.</text>
  </g>
  <line class="claim-split-line claim-split-conn claim-split-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#claim-split-tip)"/>
  <g class="claim-split-stage claim-split-s3">
    <rect class="claim-split-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="claim-split-step" x="752" y="142">04</text>
    <text class="claim-split-name" x="778" y="142">Excluding what is not a claim</text>
    <text class="claim-split-desc" x="752" y="166">Transitions, hedges and</text>
    <text class="claim-split-desc" x="752" y="182">questions are not verifiable.</text>
    <text class="claim-split-edge" x="752" y="242">care</text>
  </g>
  <text class="claim-split-sub" x="30" y="304">Pronoun resolution is what makes this work in practice: a claim reading 'it rose by twelve percent' cannot be checked against anything without knowing what 'it' was.</text>
</svg>
