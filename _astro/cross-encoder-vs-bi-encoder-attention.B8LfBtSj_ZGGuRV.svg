<svg role="img" aria-label="Cross-encoder vs Bi-encoder attention comparison diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Bi-Encoder vs Cross-Encoder Architecture</title>
  <defs>
    <linearGradient id="bg264b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card264b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg264b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BI-ENCODER (EMBEDDING) VS CROSS-ENCODER (RE-RANKER)</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Decoupled Vector Dot Product vs Full Pairwise Token Attention</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card264b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. Bi-Encoder -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="195" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Bi-Encoder (Dual Encoder)</text>
    
    <rect x="40" y="70" width="140" height="40" fill="#1e293b" rx="4"/>
    <text x="110" y="94" fill="#cbd5e1" font-size="8" text-anchor="middle">Query: BERT(q) -&gt; u</text>
    
    <rect x="200" y="70" width="140" height="40" fill="#1e293b" rx="4"/>
    <text x="270" y="94" fill="#cbd5e1" font-size="8" text-anchor="middle">Doc: BERT(d) -&gt; v</text>

    <rect x="40" y="130" width="300" height="45" fill="#0f172a" stroke="#38bdf8" rx="4"/>
    <text x="190" y="157" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">Cosine Similarity: dot(u, v)</text>

    <rect x="40" y="195" width="300" height="60" fill="#1e293b" rx="4"/>
    <text x="50" y="215" fill="#34d399" font-size="8">• Speed: Sub-5ms over 10M docs (Pre-computed vectors)</text>
    <text x="50" y="235" fill="#fb7185" font-size="8">• Weakness: Zero token-to-token cross interaction</text>

    <!-- 2. Cross-Encoder -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" rx="6"/>
    <text x="565" y="50" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">Cross-Encoder (Re-Ranker)</text>
    
    <rect x="410" y="70" width="310" height="40" fill="#1e293b" rx="4"/>
    <text x="565" y="94" fill="#cbd5e1" font-size="8" text-anchor="middle">[CLS] Query tokens [SEP] Document tokens [SEP]</text>

    <rect x="410" y="130" width="310" height="45" fill="#0f172a" stroke="#fb7185" rx="4"/>
    <text x="565" y="157" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Full Cross-Attention Matrix (Q &lt;-&gt; D)</text>

    <rect x="410" y="195" width="310" height="60" fill="#1e293b" rx="4"/>
    <text x="420" y="215" fill="#34d399" font-size="8">• Precision: Maximum relevance &amp; semantic grounding</text>
    <text x="420" y="235" fill="#fbbf24" font-size="8">• Speed: ~10-20ms for Top-50 candidates (Not scalable to 10M)</text>
  </g>
</svg>
