<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what they model.">
  <title>Four detection paradigms</title>
  <style>
    .anomaly-paradigms-bg   { fill: #f8fafc; }
    .anomaly-paradigms-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-paradigms-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-paradigms-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-paradigms-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-paradigms-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-paradigms-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .anomaly-paradigms-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .anomaly-paradigms-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .anomaly-paradigms-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .anomaly-paradigms-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .anomaly-paradigms-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .anomaly-paradigms-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .anomaly-paradigms-row { opacity: 1; }
    .anomaly-paradigms-r0 { animation-delay: 0.00s; }
    .anomaly-paradigms-r1 { animation-delay: 0.45s; }
    .anomaly-paradigms-r2 { animation-delay: 0.90s; }
    .anomaly-paradigms-r3 { animation-delay: 1.35s; }
    .anomaly-paradigms-r4 { animation-delay: 1.80s; }
    .anomaly-paradigms-row { animation: anomaly-paradigms-reveal 7.3s ease-in-out infinite; }
    @keyframes anomaly-paradigms-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="anomaly-paradigms-bg" width="980" height="390"/>
  <text class="anomaly-paradigms-h1"  x="30" y="40">Four detection paradigms</text>
  <text class="anomaly-paradigms-sub" x="30" y="64">By what they model.</text>
  <rect class="anomaly-paradigms-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="anomaly-paradigms-name" x="46" y="122">The paradigm</text>
  <text class="anomaly-paradigms-desc" x="46" y="142">How it detects.</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r0" x="46" y="182">Statistical — distance from a fitted distribution</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r1" x="46" y="216">Distance-based — far from its neighbours</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r2" x="46" y="250">Density-based — in a low-density region</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r3" x="46" y="284">Isolation-based — easily separated</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r4" x="46" y="318">Reconstruction-based — poorly reconstructed</text>
  <rect class="anomaly-paradigms-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="anomaly-paradigms-name" x="526" y="122">Where it fits</text>
  <text class="anomaly-paradigms-desc" x="526" y="142">And its limit.</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r0" x="526" y="182">Low dimensions, known distribution</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r1" x="526" y="216">Small data; degrades in high dimensions</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r2" x="526" y="250">Handles varying density; expensive</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r3" x="526" y="284">Scales well; the usual default</text>
  <text class="anomaly-paradigms-desc anomaly-paradigms-row anomaly-paradigms-r4" x="526" y="318">Needs a model of normal, such as an autoencoder</text>
  <text class="anomaly-paradigms-sub" x="30" y="372">Reconstruction-based detection connects directly to the earlier principal components lesson, where reconstruction error served exactly this purpose.</text>
</svg>
