<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Instruments, in order.">
  <title>Diagnosing a jet engine</title>
  <style>
    .jet-engine-bg   { fill: #f8fafc; }
    .jet-engine-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jet-engine-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jet-engine-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jet-engine-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jet-engine-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jet-engine-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .jet-engine-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .jet-engine-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .jet-engine-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .jet-engine-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .jet-engine-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .jet-engine-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .jet-engine-row { opacity: 1; }
    .jet-engine-r0 { animation-delay: 0.00s; }
    .jet-engine-r1 { animation-delay: 0.45s; }
    .jet-engine-r2 { animation-delay: 0.90s; }
    .jet-engine-r3 { animation-delay: 1.35s; }
    .jet-engine-r4 { animation-delay: 1.80s; }
    .jet-engine-row { animation: jet-engine-reveal 7.3s ease-in-out infinite; }
    @keyframes jet-engine-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="jet-engine-bg" width="980" height="390"/>
  <text class="jet-engine-h1"  x="30" y="40">Diagnosing a jet engine</text>
  <text class="jet-engine-sub" x="30" y="64">Instruments, in order.</text>
  <rect class="jet-engine-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="jet-engine-name" x="46" y="122">Instrument-driven</text>
  <text class="jet-engine-desc" x="46" y="142">Read, then act.</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r0" x="46" y="182">Check fuel flow first</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r1" x="46" y="216">Then temperature, then pressure</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r2" x="46" y="250">Each reading rules something out</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r3" x="46" y="284">The fault is located before anything is opened</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r4" x="46" y="318">One repair, verified</text>
  <rect class="jet-engine-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="jet-engine-name" x="526" y="122">Trial and error</text>
  <text class="jet-engine-desc" x="526" y="142">Replace and hope.</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r0" x="526" y="182">Swap the most suspicious component</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r1" x="526" y="216">Run it, see if it helps</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r2" x="526" y="250">No hypothesis, no elimination</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r3" x="526" y="284">Expensive, and often coincidental</text>
  <text class="jet-engine-desc jet-engine-row jet-engine-r4" x="526" y="318">This is hyperparameter flailing</text>
  <text class="jet-engine-sub" x="30" y="372">Each reading ruling something out is the property the golden protocol reproduces: four cheap checks eliminate four categories of bug before any expensive experiment begins.</text>
</svg>
