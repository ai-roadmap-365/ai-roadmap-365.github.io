<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From a theoretical question.">
  <title>Four steps in boosting</title>
  <style>
    .boosting-history-bg   { fill: #f8fafc; }
    .boosting-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boosting-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boosting-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boosting-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boosting-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boosting-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boosting-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .boosting-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .boosting-history-stage { opacity: 1; }

    .boosting-history-s0 { animation-delay: 0.00s; }
    .boosting-history-e0 { animation-delay: 0.00s; }
    .boosting-history-s1 { animation-delay: 1.28s; }
    .boosting-history-e1 { animation-delay: 1.28s; }
    .boosting-history-s2 { animation-delay: 2.56s; }
    .boosting-history-e2 { animation-delay: 2.56s; }
    .boosting-history-s3 { animation-delay: 3.84s; }
    .boosting-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .boosting-history-conn  { animation: boosting-history-trace 6.4s ease-in-out infinite; }
      .boosting-history-stage { animation: boosting-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes boosting-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes boosting-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .boosting-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .boosting-history-stage { animation: boosting-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes boosting-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="boosting-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="boosting-history-bg" width="980" height="322"/>
  <text class="boosting-history-h1"  x="30" y="40">Four steps in boosting</text>
  <text class="boosting-history-sub" x="30" y="64">From a theoretical question.</text>
  <g class="boosting-history-stage boosting-history-s0">
    <rect class="boosting-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-history-step" x="44" y="142">01</text>
    <text class="boosting-history-name" x="70" y="142">A theoretical question: can weak learners be combined into a strong one</text>
    <text class="boosting-history-desc" x="44" y="166">Posed before anyone knew how.</text>
  </g>
  <line class="boosting-history-line boosting-history-conn boosting-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#boosting-history-tip)"/>
  <g class="boosting-history-stage boosting-history-s1">
    <rect class="boosting-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-history-step" x="280" y="142">02</text>
    <text class="boosting-history-name" x="306" y="142">The first practical algorithm answered yes</text>
    <text class="boosting-history-desc" x="280" y="166">By reweighting misclassified</text>
    <text class="boosting-history-desc" x="280" y="182">examples.</text>
  </g>
  <line class="boosting-history-line boosting-history-conn boosting-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#boosting-history-tip)"/>
  <g class="boosting-history-stage boosting-history-s2">
    <rect class="boosting-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-history-step" x="516" y="142">03</text>
    <text class="boosting-history-name" x="542" y="142">Then the gradient formulation generalised it</text>
    <text class="boosting-history-desc" x="516" y="166">To any differentiable loss.</text>
  </g>
  <line class="boosting-history-line boosting-history-conn boosting-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#boosting-history-tip)"/>
  <g class="boosting-history-stage boosting-history-s3">
    <rect class="boosting-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-history-step" x="752" y="142">04</text>
    <text class="boosting-history-name" x="778" y="142">And engineered libraries made it fast</text>
    <text class="boosting-history-desc" x="752" y="166">Which is what put it in</text>
    <text class="boosting-history-desc" x="752" y="182">production everywhere.</text>
  </g>
  <text class="boosting-history-sub" x="30" y="304">The chain from an abstract question to the dominant tabular method is unusually direct, and the theoretical answer preceded any practical algorithm by years.</text>
</svg>
