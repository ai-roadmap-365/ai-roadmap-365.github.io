<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four actions on an unsupported claim.">
  <title>Enforcement</title>
  <style>
    .enforce-bg   { fill: #f8fafc; }
    .enforce-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .enforce-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .enforce-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .enforce-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .enforce-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .enforce-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .enforce-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .enforce-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .enforce-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .enforce-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .enforce-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .enforce-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .enforce-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .enforce-stage { opacity: 1; }

    .enforce-s0 { animation-delay: 0.00s; }
    .enforce-e0 { animation-delay: 0.00s; }
    .enforce-s1 { animation-delay: 1.28s; }
    .enforce-e1 { animation-delay: 1.28s; }
    .enforce-s2 { animation-delay: 2.56s; }
    .enforce-e2 { animation-delay: 2.56s; }
    .enforce-s3 { animation-delay: 3.84s; }
    .enforce-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .enforce-conn  { animation: enforce-trace 6.4s ease-in-out infinite; }
      .enforce-stage { animation: enforce-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes enforce-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes enforce-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .enforce-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .enforce-stage { animation: enforce-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes enforce-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="enforce-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="enforce-bg" width="980" height="322"/>
  <text class="enforce-h1"  x="30" y="40">Enforcement</text>
  <text class="enforce-sub" x="30" y="64">Four actions on an unsupported claim.</text>
  <g class="enforce-stage enforce-s0">
    <rect class="enforce-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="enforce-step" x="44" y="142">01</text>
    <text class="enforce-name" x="70" y="142">Remove the claim</text>
    <text class="enforce-desc" x="44" y="166">And return the rest of the</text>
    <text class="enforce-desc" x="44" y="182">answer.</text>
  </g>
  <line class="enforce-line enforce-conn enforce-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#enforce-tip)"/>
  <g class="enforce-stage enforce-s1">
    <rect class="enforce-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="enforce-step" x="280" y="142">02</text>
    <text class="enforce-name" x="306" y="142">Or regenerate with the failure fed back</text>
    <text class="enforce-desc" x="280" y="166">Which often produces a supported</text>
    <text class="enforce-desc" x="280" y="182">version.</text>
  </g>
  <line class="enforce-line enforce-conn enforce-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#enforce-tip)"/>
  <g class="enforce-stage enforce-s2">
    <rect class="enforce-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="enforce-step" x="516" y="142">03</text>
    <text class="enforce-name" x="542" y="142">Or mark it visibly as unverified</text>
    <text class="enforce-desc" x="516" y="166">Which is honest, and puts the</text>
    <text class="enforce-desc" x="516" y="182">work on the reader.</text>
  </g>
  <line class="enforce-line enforce-conn enforce-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#enforce-tip)"/>
  <g class="enforce-stage enforce-s3">
    <rect class="enforce-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="enforce-step" x="752" y="142">04</text>
    <text class="enforce-name" x="778" y="142">Or decline the whole answer</text>
    <text class="enforce-desc" x="752" y="166">When too much of it is</text>
    <text class="enforce-desc" x="752" y="182">unsupported.</text>
  </g>
  <text class="enforce-sub" x="30" y="304">Any of the four beats displaying an unsupported claim with a citation next to it, which is the outcome that makes a system less trustworthy than one with no citations at all.</text>
</svg>
