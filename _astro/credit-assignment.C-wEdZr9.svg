<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Credit assignment</title>
  <style>
    .credit-assignment-bg   { fill: #f8fafc; }
    .credit-assignment-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .credit-assignment-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .credit-assignment-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .credit-assignment-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .credit-assignment-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .credit-assignment-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .credit-assignment-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .credit-assignment-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .credit-assignment-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .credit-assignment-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .credit-assignment-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .credit-assignment-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .credit-assignment-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .credit-assignment-stage { opacity: 1; }

    .credit-assignment-s0 { animation-delay: 0.00s; }
    .credit-assignment-e0 { animation-delay: 0.00s; }
    .credit-assignment-s1 { animation-delay: 1.28s; }
    .credit-assignment-e1 { animation-delay: 1.28s; }
    .credit-assignment-s2 { animation-delay: 2.56s; }
    .credit-assignment-e2 { animation-delay: 2.56s; }
    .credit-assignment-s3 { animation-delay: 3.84s; }
    .credit-assignment-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .credit-assignment-conn  { animation: credit-assignment-trace 6.4s ease-in-out infinite; }
      .credit-assignment-stage { animation: credit-assignment-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes credit-assignment-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes credit-assignment-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .credit-assignment-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .credit-assignment-stage { animation: credit-assignment-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes credit-assignment-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="credit-assignment-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="credit-assignment-bg" width="980" height="322"/>
  <text class="credit-assignment-h1"  x="30" y="40">Credit assignment</text>
  <text class="credit-assignment-sub" x="30" y="64">Four steps.</text>
  <g class="credit-assignment-stage credit-assignment-s0">
    <rect class="credit-assignment-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="credit-assignment-step" x="44" y="142">01</text>
    <text class="credit-assignment-name" x="70" y="142">A sequence of actions is taken</text>
    <text class="credit-assignment-desc" x="44" y="166">Dozens, or thousands.</text>
  </g>
  <line class="credit-assignment-line credit-assignment-conn credit-assignment-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#credit-assignment-tip)"/>
  <g class="credit-assignment-stage credit-assignment-s1">
    <rect class="credit-assignment-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="credit-assignment-step" x="280" y="142">02</text>
    <text class="credit-assignment-name" x="306" y="142">A single reward arrives at the end</text>
    <text class="credit-assignment-desc" x="280" y="166">Win or lose. Nothing in between.</text>
  </g>
  <line class="credit-assignment-line credit-assignment-conn credit-assignment-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#credit-assignment-tip)"/>
  <g class="credit-assignment-stage credit-assignment-s2">
    <rect class="credit-assignment-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="credit-assignment-step" x="516" y="142">03</text>
    <text class="credit-assignment-name" x="542" y="142">Which action deserves the credit is unclear</text>
    <text class="credit-assignment-desc" x="516" y="166">That is the credit assignment</text>
    <text class="credit-assignment-desc" x="516" y="182">problem.</text>
  </g>
  <line class="credit-assignment-line credit-assignment-conn credit-assignment-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#credit-assignment-tip)"/>
  <g class="credit-assignment-stage credit-assignment-s3">
    <rect class="credit-assignment-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="credit-assignment-step" x="752" y="142">04</text>
    <text class="credit-assignment-name" x="778" y="142">Discounting attributes more to recent actions</text>
    <text class="credit-assignment-desc" x="752" y="166">Which is an assumption, and</text>
    <text class="credit-assignment-desc" x="752" y="182">usually a reasonable one.</text>
  </g>
  <text class="credit-assignment-sub" x="30" y="304">This is the structural difficulty that makes reinforcement learning so much harder than supervised learning, rather than any property of the algorithms.</text>
</svg>
