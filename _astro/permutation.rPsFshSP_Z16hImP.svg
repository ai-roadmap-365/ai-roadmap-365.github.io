<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Permutation importance</title>
  <style>
    .permutation-bg   { fill: #f8fafc; }
    .permutation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .permutation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .permutation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .permutation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .permutation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .permutation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .permutation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .permutation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .permutation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .permutation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .permutation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .permutation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .permutation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .permutation-stage { opacity: 1; }

    .permutation-s0 { animation-delay: 0.00s; }
    .permutation-e0 { animation-delay: 0.00s; }
    .permutation-s1 { animation-delay: 1.28s; }
    .permutation-e1 { animation-delay: 1.28s; }
    .permutation-s2 { animation-delay: 2.56s; }
    .permutation-e2 { animation-delay: 2.56s; }
    .permutation-s3 { animation-delay: 3.84s; }
    .permutation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .permutation-conn  { animation: permutation-trace 6.4s ease-in-out infinite; }
      .permutation-stage { animation: permutation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes permutation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes permutation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .permutation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .permutation-stage { animation: permutation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes permutation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="permutation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="permutation-bg" width="980" height="322"/>
  <text class="permutation-h1"  x="30" y="40">Permutation importance</text>
  <text class="permutation-sub" x="30" y="64">Four steps.</text>
  <g class="permutation-stage permutation-s0">
    <rect class="permutation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="permutation-step" x="44" y="142">01</text>
    <text class="permutation-name" x="70" y="142">Measure performance on held-out data</text>
    <text class="permutation-desc" x="44" y="166">Which is the baseline.</text>
  </g>
  <line class="permutation-line permutation-conn permutation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#permutation-tip)"/>
  <g class="permutation-stage permutation-s1">
    <rect class="permutation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="permutation-step" x="280" y="142">02</text>
    <text class="permutation-name" x="306" y="142">Shuffle one feature's values</text>
    <text class="permutation-desc" x="280" y="166">Breaking its relationship with</text>
    <text class="permutation-desc" x="280" y="182">the target, keeping its</text>
    <text class="permutation-desc" x="280" y="198">distribution.</text>
  </g>
  <line class="permutation-line permutation-conn permutation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#permutation-tip)"/>
  <g class="permutation-stage permutation-s2">
    <rect class="permutation-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="permutation-step" x="516" y="142">03</text>
    <text class="permutation-name" x="542" y="142">The drop in performance is its importance</text>
    <text class="permutation-desc" x="516" y="166">Measured on the metric you care</text>
    <text class="permutation-desc" x="516" y="182">about.</text>
  </g>
  <line class="permutation-line permutation-conn permutation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#permutation-tip)"/>
  <g class="permutation-stage permutation-s3">
    <rect class="permutation-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="permutation-step" x="752" y="142">04</text>
    <text class="permutation-name" x="778" y="142">But correlated features share credit</text>
    <text class="permutation-desc" x="752" y="166">Shuffling one leaves the other</text>
    <text class="permutation-desc" x="752" y="182">to compensate.</text>
  </g>
  <text class="permutation-sub" x="30" y="304">The correlation caveat means two duplicated columns can both appear unimportant, since removing either leaves the information available through the other.</text>
</svg>
