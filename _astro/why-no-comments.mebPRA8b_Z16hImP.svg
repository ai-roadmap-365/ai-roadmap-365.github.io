<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A deliberate removal, not an oversight.">
  <title>Why JSON has no comments</title>
  <style>
    .why-no-comments-bg   { fill: #f8fafc; }
    .why-no-comments-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-no-comments-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-no-comments-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-no-comments-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-no-comments-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-no-comments-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-no-comments-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-no-comments-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-no-comments-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-no-comments-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-no-comments-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-no-comments-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .why-no-comments-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .why-no-comments-stage { opacity: 1; }

    .why-no-comments-s0 { animation-delay: 0.00s; }
    .why-no-comments-e0 { animation-delay: 0.00s; }
    .why-no-comments-s1 { animation-delay: 1.28s; }
    .why-no-comments-e1 { animation-delay: 1.28s; }
    .why-no-comments-s2 { animation-delay: 2.56s; }
    .why-no-comments-e2 { animation-delay: 2.56s; }
    .why-no-comments-s3 { animation-delay: 3.84s; }
    .why-no-comments-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .why-no-comments-conn  { animation: why-no-comments-trace 6.4s ease-in-out infinite; }
      .why-no-comments-stage { animation: why-no-comments-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes why-no-comments-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes why-no-comments-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .why-no-comments-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .why-no-comments-stage { animation: why-no-comments-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes why-no-comments-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="why-no-comments-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="why-no-comments-bg" width="980" height="322"/>
  <text class="why-no-comments-h1"  x="30" y="40">Why JSON has no comments</text>
  <text class="why-no-comments-sub" x="30" y="64">A deliberate removal, not an oversight.</text>
  <g class="why-no-comments-stage why-no-comments-s0">
    <rect class="why-no-comments-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="why-no-comments-step" x="44" y="142">01</text>
    <text class="why-no-comments-name" x="70" y="142">Early JSON allowed them</text>
    <text class="why-no-comments-desc" x="44" y="166">And people used them to carry</text>
    <text class="why-no-comments-desc" x="44" y="182">parsing directives.</text>
  </g>
  <line class="why-no-comments-line why-no-comments-conn why-no-comments-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#why-no-comments-tip)"/>
  <g class="why-no-comments-stage why-no-comments-s1">
    <rect class="why-no-comments-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="why-no-comments-step" x="280" y="142">02</text>
    <text class="why-no-comments-name" x="306" y="142">Which made them semantic</text>
    <text class="why-no-comments-desc" x="280" y="166">A comment that changes behaviour</text>
    <text class="why-no-comments-desc" x="280" y="182">is not a comment.</text>
  </g>
  <line class="why-no-comments-line why-no-comments-conn why-no-comments-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#why-no-comments-tip)"/>
  <g class="why-no-comments-stage why-no-comments-s2">
    <rect class="why-no-comments-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="why-no-comments-step" x="516" y="142">03</text>
    <text class="why-no-comments-name" x="542" y="142">So they were removed</text>
    <text class="why-no-comments-desc" x="516" y="166">Deliberately, to keep JSON</text>
    <text class="why-no-comments-desc" x="516" y="182">purely data with no instructions</text>
    <text class="why-no-comments-desc" x="516" y="198">to any parser.</text>
  </g>
  <line class="why-no-comments-line why-no-comments-conn why-no-comments-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#why-no-comments-tip)"/>
  <g class="why-no-comments-stage why-no-comments-s3">
    <rect class="why-no-comments-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="why-no-comments-step" x="752" y="142">04</text>
    <text class="why-no-comments-name" x="778" y="142">Use a field instead</text>
    <text class="why-no-comments-desc" x="752" y="166">A "_comment" key, or a format</text>
    <text class="why-no-comments-desc" x="752" y="182">built for humans — YAML, TOML —</text>
    <text class="why-no-comments-desc" x="752" y="198">for config.</text>
  </g>
  <text class="why-no-comments-sub" x="30" y="304">This is why JSON is a poor configuration format and an excellent interchange format: it was designed so that nothing in a document can tell a parser what to do.</text>
</svg>
