<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are constraints.">
  <title>Four consequences of arrays</title>
  <style>
    .array-implications-bg   { fill: #f8fafc; }
    .array-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .array-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .array-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .array-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .array-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .array-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .array-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .array-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .array-implications-stage { opacity: 1; }

    .array-implications-s0 { animation-delay: 0.00s; }
    .array-implications-e0 { animation-delay: 0.00s; }
    .array-implications-s1 { animation-delay: 1.28s; }
    .array-implications-e1 { animation-delay: 1.28s; }
    .array-implications-s2 { animation-delay: 2.56s; }
    .array-implications-e2 { animation-delay: 2.56s; }
    .array-implications-s3 { animation-delay: 3.84s; }
    .array-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .array-implications-conn  { animation: array-implications-trace 6.4s ease-in-out infinite; }
      .array-implications-stage { animation: array-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes array-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes array-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .array-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .array-implications-stage { animation: array-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes array-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="array-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="array-implications-bg" width="980" height="322"/>
  <text class="array-implications-h1"  x="30" y="40">Four consequences of arrays</text>
  <text class="array-implications-sub" x="30" y="64">Two are constraints.</text>
  <g class="array-implications-stage array-implications-s0">
    <rect class="array-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="array-implications-step" x="44" y="142">01</text>
    <text class="array-implications-name" x="70" y="142">Numerical code becomes fast enough to be practical</text>
    <text class="array-implications-desc" x="44" y="166">Which is why the ecosystem</text>
    <text class="array-implications-desc" x="44" y="182">exists.</text>
  </g>
  <line class="array-implications-line array-implications-conn array-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#array-implications-tip)"/>
  <g class="array-implications-stage array-implications-s1">
    <rect class="array-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="array-implications-step" x="280" y="142">02</text>
    <text class="array-implications-name" x="306" y="142">And memory use falls sharply</text>
    <text class="array-implications-desc" x="280" y="166">No per-element object overhead.</text>
  </g>
  <line class="array-implications-line array-implications-conn array-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#array-implications-tip)"/>
  <g class="array-implications-stage array-implications-s2">
    <rect class="array-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="array-implications-step" x="516" y="142">03</text>
    <text class="array-implications-name" x="542" y="142">But the single type is a real constraint</text>
    <text class="array-implications-desc" x="516" y="166">Mixed data needs a dataframe</text>
    <text class="array-implications-desc" x="516" y="182">instead.</text>
  </g>
  <line class="array-implications-line array-implications-conn array-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#array-implications-tip)"/>
  <g class="array-implications-stage array-implications-s3">
    <rect class="array-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="array-implications-step" x="752" y="142">04</text>
    <text class="array-implications-name" x="778" y="142">And shapes must line up, which is where bugs live</text>
    <text class="array-implications-desc" x="752" y="166">Broadcasting makes some of them</text>
    <text class="array-implications-desc" x="752" y="182">silent.</text>
  </g>
  <text class="array-implications-sub" x="30" y="304">The type constraint is what pushes real datasets toward dataframes, which is exactly the transition the pandas lessons make.</text>
</svg>
