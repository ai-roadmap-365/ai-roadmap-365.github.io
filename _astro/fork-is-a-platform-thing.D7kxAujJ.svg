<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It is a button on a website.">
  <title>A fork is not a git concept</title>
  <style>
    .fork-is-a-platform-thing-bg   { fill: #f8fafc; }
    .fork-is-a-platform-thing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fork-is-a-platform-thing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fork-is-a-platform-thing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fork-is-a-platform-thing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fork-is-a-platform-thing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fork-is-a-platform-thing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fork-is-a-platform-thing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fork-is-a-platform-thing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fork-is-a-platform-thing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fork-is-a-platform-thing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fork-is-a-platform-thing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fork-is-a-platform-thing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fork-is-a-platform-thing-row { opacity: 1; }
    .fork-is-a-platform-thing-r0 { animation-delay: 0.00s; }
    .fork-is-a-platform-thing-r1 { animation-delay: 0.45s; }
    .fork-is-a-platform-thing-r2 { animation-delay: 0.90s; }
    .fork-is-a-platform-thing-r3 { animation-delay: 1.35s; }
    .fork-is-a-platform-thing-r4 { animation-delay: 1.80s; }
    .fork-is-a-platform-thing-row { animation: fork-is-a-platform-thing-reveal 7.3s ease-in-out infinite; }
    @keyframes fork-is-a-platform-thing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fork-is-a-platform-thing-bg" width="980" height="390"/>
  <text class="fork-is-a-platform-thing-h1"  x="30" y="40">A fork is not a git concept</text>
  <text class="fork-is-a-platform-thing-sub" x="30" y="64">It is a button on a website.</text>
  <rect class="fork-is-a-platform-thing-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fork-is-a-platform-thing-name" x="46" y="122">A clone</text>
  <text class="fork-is-a-platform-thing-desc" x="46" y="142">Git's own operation.</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r0" x="46" y="182">A full copy, on your machine</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r1" x="46" y="216">Created by git clone</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r2" x="46" y="250">Git knows what this is</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r3" x="46" y="284">Push requires write access</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r4" x="46" y="318">Nothing on the server changed</text>
  <rect class="fork-is-a-platform-thing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fork-is-a-platform-thing-name" x="526" y="122">A fork</text>
  <text class="fork-is-a-platform-thing-desc" x="526" y="142">The platform's feature.</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r0" x="526" y="182">A full copy, on the platform, owned by you</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r1" x="526" y="216">Created by a button</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r2" x="526" y="250">Git has no idea this happened</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r3" x="526" y="284">You have write access to your copy</text>
  <text class="fork-is-a-platform-thing-desc fork-is-a-platform-thing-row fork-is-a-platform-thing-r4" x="526" y="318">And can open a pull request back</text>
  <text class="fork-is-a-platform-thing-sub" x="30" y="372">This is what made open-source contribution from strangers work: you need no permission on the original, because you propose changes from a copy you control.</text>
</svg>
