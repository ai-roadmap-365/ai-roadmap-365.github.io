<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Triggered, executed, verified, released.">
  <title>An automated pit stop</title>
  <style>
    .pit-crew-bg   { fill: #f8fafc; }
    .pit-crew-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pit-crew-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pit-crew-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pit-crew-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pit-crew-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pit-crew-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pit-crew-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pit-crew-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pit-crew-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pit-crew-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pit-crew-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pit-crew-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pit-crew-row { opacity: 1; }
    .pit-crew-r0 { animation-delay: 0.00s; }
    .pit-crew-r1 { animation-delay: 0.45s; }
    .pit-crew-r2 { animation-delay: 0.90s; }
    .pit-crew-r3 { animation-delay: 1.35s; }
    .pit-crew-r4 { animation-delay: 1.80s; }
    .pit-crew-row { animation: pit-crew-reveal 7.3s ease-in-out infinite; }
    @keyframes pit-crew-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pit-crew-bg" width="980" height="390"/>
  <text class="pit-crew-h1"  x="30" y="40">An automated pit stop</text>
  <text class="pit-crew-sub" x="30" y="64">Triggered, executed, verified, released.</text>
  <rect class="pit-crew-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pit-crew-name" x="46" y="122">The pit crew</text>
  <text class="pit-crew-desc" x="46" y="142">2.2 seconds, verified.</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r0" x="46" y="182">The car enters on a trigger</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r1" x="46" y="216">Jacks, wrenches and fuel act in parallel</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r2" x="46" y="250">Telemetry checks pressure and torque</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r3" x="46" y="284">A green light releases the car</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r4" x="46" y="318">Nothing depends on someone noticing</text>
  <rect class="pit-crew-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pit-crew-name" x="526" y="122">The roadside repair</text>
  <text class="pit-crew-desc" x="526" y="142">Ad hoc, and unverified.</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r0" x="526" y="182">Someone notices a problem</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r1" x="526" y="216">Tools are found as needed</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r2" x="526" y="250">Nothing measures the result</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r3" x="526" y="284">It leaves when it looks fine</text>
  <text class="pit-crew-desc pit-crew-row pit-crew-r4" x="526" y="318">And the same fault recurs</text>
  <text class="pit-crew-sub" x="30" y="372">The telemetry check before the green light is the regression gate: the crew is fast because the verification is automatic, not because anyone is being careful quickly.</text>
</svg>
