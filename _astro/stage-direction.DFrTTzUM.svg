<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is spoken.">
  <title>A script, or a stage direction</title>
  <style>
    .stage-direction-bg   { fill: #f8fafc; }
    .stage-direction-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-direction-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-direction-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-direction-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-direction-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-direction-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stage-direction-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stage-direction-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stage-direction-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stage-direction-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stage-direction-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stage-direction-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stage-direction-row { opacity: 1; }
    .stage-direction-r0 { animation-delay: 0.00s; }
    .stage-direction-r1 { animation-delay: 0.45s; }
    .stage-direction-r2 { animation-delay: 0.90s; }
    .stage-direction-r3 { animation-delay: 1.35s; }
    .stage-direction-r4 { animation-delay: 1.80s; }
    .stage-direction-row { animation: stage-direction-reveal 7.3s ease-in-out infinite; }
    @keyframes stage-direction-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stage-direction-bg" width="980" height="390"/>
  <text class="stage-direction-h1"  x="30" y="40">A script, or a stage direction</text>
  <text class="stage-direction-sub" x="30" y="64">One is spoken.</text>
  <rect class="stage-direction-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stage-direction-name" x="46" y="122">The dialogue</text>
  <text class="stage-direction-desc" x="46" y="142">What is said.</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r0" x="46" y="182">Heard by the audience</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r1" x="46" y="216">Changes every performance</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r2" x="46" y="250">What the conversation is about</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r3" x="46" y="284">This is the user's message</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r4" x="46" y="318">Visible to everyone</text>
  <rect class="stage-direction-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stage-direction-name" x="526" y="122">The direction</text>
  <text class="stage-direction-desc" x="526" y="142">How it is played.</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r0" x="526" y="182">Never spoken aloud</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r1" x="526" y="216">The same every performance</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r2" x="526" y="250">Shapes everything that is said</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r3" x="526" y="284">This is the system prompt</text>
  <text class="stage-direction-desc stage-direction-row stage-direction-r4" x="526" y="318">Invisible, and decisive</text>
  <text class="stage-direction-sub" x="30" y="372">The invisibility is the point worth carrying: the text that most determines the performance is the text the audience never sees, which is also why it is under-reviewed.</text>
</svg>
