<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Ask before collecting a dataset.">
  <title>Custom model, or a prompted one</title>
  <style>
    .custom-or-zeroshot-bg   { fill: #f8fafc; }
    .custom-or-zeroshot-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-or-zeroshot-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-or-zeroshot-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-or-zeroshot-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-or-zeroshot-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-or-zeroshot-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .custom-or-zeroshot-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .custom-or-zeroshot-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .custom-or-zeroshot-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .custom-or-zeroshot-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .custom-or-zeroshot-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .custom-or-zeroshot-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .custom-or-zeroshot-row { opacity: 1; }
    .custom-or-zeroshot-r0 { animation-delay: 0.00s; }
    .custom-or-zeroshot-r1 { animation-delay: 0.45s; }
    .custom-or-zeroshot-r2 { animation-delay: 0.90s; }
    .custom-or-zeroshot-r3 { animation-delay: 1.35s; }
    .custom-or-zeroshot-r4 { animation-delay: 1.80s; }
    .custom-or-zeroshot-row { animation: custom-or-zeroshot-reveal 7.3s ease-in-out infinite; }
    @keyframes custom-or-zeroshot-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="custom-or-zeroshot-bg" width="980" height="390"/>
  <text class="custom-or-zeroshot-h1"  x="30" y="40">Custom model, or a prompted one</text>
  <text class="custom-or-zeroshot-sub" x="30" y="64">Ask before collecting a dataset.</text>
  <rect class="custom-or-zeroshot-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="custom-or-zeroshot-name" x="46" y="122">Build a custom model</text>
  <text class="custom-or-zeroshot-desc" x="46" y="142">Proprietary and specific.</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r0" x="46" y="182">Domain-specific categories a general model does not know</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r1" x="46" y="216">Manufacturing defects, medical pathology, species</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r2" x="46" y="250">Latency or offline requirements</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r3" x="46" y="284">Cost per inference at high volume</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r4" x="46" y="318">Where a dataset can be collected</text>
  <rect class="custom-or-zeroshot-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="custom-or-zeroshot-name" x="526" y="122">Prompt a foundation model</text>
  <text class="custom-or-zeroshot-desc" x="526" y="142">General categories.</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r0" x="526" y="182">Categories describable in words</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r1" x="526" y="216">No dataset to collect</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r2" x="526" y="250">Working in an afternoon</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r3" x="526" y="284">Higher per-inference cost</text>
  <text class="custom-or-zeroshot-desc custom-or-zeroshot-row custom-or-zeroshot-r4" x="526" y="318">And no control over changes</text>
  <text class="custom-or-zeroshot-sub" x="30" y="372">Asking this question before collecting a dataset is worth the discomfort: a task a prompted model already performs adequately does not justify weeks of annotation.</text>
</svg>
