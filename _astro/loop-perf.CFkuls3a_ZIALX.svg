<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two very different regimes.">
  <title>Loop performance</title>
  <style>
    .loop-perf-bg   { fill: #f8fafc; }
    .loop-perf-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-perf-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-perf-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-perf-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-perf-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-perf-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-perf-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loop-perf-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loop-perf-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loop-perf-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loop-perf-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loop-perf-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-perf-row { opacity: 1; }
    .loop-perf-r0 { animation-delay: 0.00s; }
    .loop-perf-r1 { animation-delay: 0.45s; }
    .loop-perf-r2 { animation-delay: 0.90s; }
    .loop-perf-r3 { animation-delay: 1.35s; }
    .loop-perf-r4 { animation-delay: 1.80s; }
    .loop-perf-row { animation: loop-perf-reveal 7.3s ease-in-out infinite; }
    @keyframes loop-perf-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="loop-perf-bg" width="980" height="390"/>
  <text class="loop-perf-h1"  x="30" y="40">Loop performance</text>
  <text class="loop-perf-sub" x="30" y="64">Two very different regimes.</text>
  <rect class="loop-perf-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="loop-perf-name" x="46" y="122">An interpreted loop</text>
  <text class="loop-perf-desc" x="46" y="142">Per-item overhead.</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r0" x="46" y="182">Interpreter overhead on every iteration</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r1" x="46" y="216">Type checks per element</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r2" x="46" y="250">Fine for thousands of items</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r3" x="46" y="284">Unusable for millions</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r4" x="46" y="318">This is a Python loop</text>
  <rect class="loop-perf-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="loop-perf-name" x="526" y="122">A vectorised call</text>
  <text class="loop-perf-desc" x="526" y="142">One dispatch.</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r0" x="526" y="182">One call into compiled code</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r1" x="526" y="216">Types checked once</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r2" x="526" y="250">Orders of magnitude faster</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r3" x="526" y="284">Practical for millions</text>
  <text class="loop-perf-desc loop-perf-row loop-perf-r4" x="526" y="318">This is an array operation</text>
  <text class="loop-perf-sub" x="30" y="372">The crossover is around a few thousand items, below which the clarity of a loop is worth more than the speed of the alternative.</text>
</svg>
