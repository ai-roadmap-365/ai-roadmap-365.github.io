<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Hardware isolation, or none.">
  <title>Multi-tenancy on one GPU</title>
  <style>
    .mig-tenancy-bg   { fill: #f8fafc; }
    .mig-tenancy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-tenancy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-tenancy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-tenancy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-tenancy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-tenancy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mig-tenancy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mig-tenancy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mig-tenancy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mig-tenancy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mig-tenancy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mig-tenancy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mig-tenancy-row { opacity: 1; }
    .mig-tenancy-r0 { animation-delay: 0.00s; }
    .mig-tenancy-r1 { animation-delay: 0.45s; }
    .mig-tenancy-r2 { animation-delay: 0.90s; }
    .mig-tenancy-r3 { animation-delay: 1.35s; }
    .mig-tenancy-r4 { animation-delay: 1.80s; }
    .mig-tenancy-row { animation: mig-tenancy-reveal 7.3s ease-in-out infinite; }
    @keyframes mig-tenancy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mig-tenancy-bg" width="980" height="390"/>
  <text class="mig-tenancy-h1"  x="30" y="40">Multi-tenancy on one GPU</text>
  <text class="mig-tenancy-sub" x="30" y="64">Hardware isolation, or none.</text>
  <rect class="mig-tenancy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mig-tenancy-name" x="46" y="122">Hardware partitions</text>
  <text class="mig-tenancy-desc" x="46" y="142">Physically separate.</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r0" x="46" y="182">Isolated VRAM per tenant</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r1" x="46" y="216">No probing another tenant's memory channels</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r2" x="46" y="250">A crash is contained to one slice</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r3" x="46" y="284">Guaranteed compute per slice</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r4" x="46" y="318">Suitable for multi-tenant SaaS</text>
  <rect class="mig-tenancy-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mig-tenancy-name" x="526" y="122">Software sharing</text>
  <text class="mig-tenancy-desc" x="526" y="142">One context, several users.</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r0" x="526" y="182">Shared address space</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r1" x="526" y="216">Isolation is a matter of trust</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r2" x="526" y="250">One crash can take the context down</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r3" x="526" y="284">Noisy-neighbour contention</text>
  <text class="mig-tenancy-desc mig-tenancy-row mig-tenancy-r4" x="526" y="318">Suitable for one tenant's own workloads</text>
  <text class="mig-tenancy-sub" x="30" y="372">This is Day 330's container argument at a different layer: software isolation is a strong boundary between your own workloads and a weak one against anybody you would not already trust.</text>
</svg>
