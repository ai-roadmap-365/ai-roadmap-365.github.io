<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five fields, and each has a job.">
  <title>What every inference event carries</title>
  <style>
    .log-event-fields-bg   { fill: #f8fafc; }
    .log-event-fields-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-event-fields-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-event-fields-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-event-fields-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-event-fields-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-event-fields-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .log-event-fields-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .log-event-fields-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .log-event-fields-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .log-event-fields-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .log-event-fields-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .log-event-fields-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .log-event-fields-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .log-event-fields-stage { opacity: 1; }

    .log-event-fields-s0 { animation-delay: 0.00s; }
    .log-event-fields-e0 { animation-delay: 0.00s; }
    .log-event-fields-s1 { animation-delay: 1.33s; }
    .log-event-fields-e1 { animation-delay: 1.33s; }
    .log-event-fields-s2 { animation-delay: 2.67s; }
    .log-event-fields-e2 { animation-delay: 2.67s; }
    .log-event-fields-s3 { animation-delay: 4.00s; }
    .log-event-fields-e3 { animation-delay: 4.00s; }
    .log-event-fields-s4 { animation-delay: 5.33s; }
    .log-event-fields-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .log-event-fields-conn  { animation: log-event-fields-trace 8s ease-in-out infinite; }
      .log-event-fields-stage { animation: log-event-fields-arrive 8s ease-in-out infinite; }
    }
    @keyframes log-event-fields-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes log-event-fields-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .log-event-fields-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .log-event-fields-stage { animation: log-event-fields-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes log-event-fields-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="log-event-fields-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="log-event-fields-bg" width="980" height="322"/>
  <text class="log-event-fields-h1"  x="30" y="40">What every inference event carries</text>
  <text class="log-event-fields-sub" x="30" y="64">Five fields, and each has a job.</text>
  <g class="log-event-fields-stage log-event-fields-s0">
    <rect class="log-event-fields-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="log-event-fields-step" x="44" y="142">01</text>
    <text class="log-event-fields-name" x="70" y="142">trace_id</text>
    <text class="log-event-fields-desc" x="44" y="166">Correlates this event</text>
    <text class="log-event-fields-desc" x="44" y="182">with every other hop of</text>
    <text class="log-event-fields-desc" x="44" y="198">the same request.</text>
    <text class="log-event-fields-edge" x="44" y="242">debugging</text>
  </g>
  <line class="log-event-fields-line log-event-fields-conn log-event-fields-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#log-event-fields-tip)"/>
  <g class="log-event-fields-stage log-event-fields-s1">
    <rect class="log-event-fields-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="log-event-fields-step" x="233" y="142">02</text>
    <text class="log-event-fields-name" x="259" y="142">tenant_id</text>
    <text class="log-event-fields-desc" x="233" y="166">Attributes cost. Without</text>
    <text class="log-event-fields-desc" x="233" y="182">it, growth and a runaway</text>
    <text class="log-event-fields-desc" x="233" y="198">loop look identical.</text>
    <text class="log-event-fields-edge" x="233" y="242">economics</text>
  </g>
  <line class="log-event-fields-line log-event-fields-conn log-event-fields-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#log-event-fields-tip)"/>
  <g class="log-event-fields-stage log-event-fields-s2">
    <rect class="log-event-fields-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="log-event-fields-step" x="422" y="142">03</text>
    <text class="log-event-fields-name" x="448" y="142">prompt_tokens, completion_tokens</text>
    <text class="log-event-fields-desc" x="422" y="166">The two halves of the</text>
    <text class="log-event-fields-desc" x="422" y="182">bill, priced differently.</text>
  </g>
  <line class="log-event-fields-line log-event-fields-conn log-event-fields-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#log-event-fields-tip)"/>
  <g class="log-event-fields-stage log-event-fields-s3">
    <rect class="log-event-fields-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="log-event-fields-step" x="611" y="142">04</text>
    <text class="log-event-fields-name" x="637" y="142">cost_usd</text>
    <text class="log-event-fields-desc" x="611" y="166">Computed at write time,</text>
    <text class="log-event-fields-desc" x="611" y="182">against the model's</text>
    <text class="log-event-fields-desc" x="611" y="198">pricing tier.</text>
  </g>
  <line class="log-event-fields-line log-event-fields-conn log-event-fields-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#log-event-fields-tip)"/>
  <g class="log-event-fields-stage log-event-fields-s4">
    <rect class="log-event-fields-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="log-event-fields-step" x="800" y="142">05</text>
    <text class="log-event-fields-name" x="826" y="142">And no raw PII</text>
    <text class="log-event-fields-desc" x="800" y="166">Scrubbed in memory,</text>
    <text class="log-event-fields-desc" x="800" y="182">before anything reaches</text>
    <text class="log-event-fields-desc" x="800" y="198">disk.</text>
    <text class="log-event-fields-edge" x="800" y="242">compliance</text>
  </g>
  <text class="log-event-fields-sub" x="30" y="304">Splitting prompt and completion tokens matters because they are priced differently: a workload dominated by long prompts and short answers has completely different economics from the reverse.</text>
</svg>
