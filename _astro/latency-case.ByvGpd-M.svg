<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not where anyone assumed.">
  <title>Where the five seconds went</title>
  <style>
    .latency-case-bg   { fill: #f8fafc; }
    .latency-case-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-case-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-case-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-case-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-case-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-case-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-case-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latency-case-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latency-case-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latency-case-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latency-case-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latency-case-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .latency-case-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .latency-case-stage { opacity: 1; }

    .latency-case-s0 { animation-delay: 0.00s; }
    .latency-case-e0 { animation-delay: 0.00s; }
    .latency-case-s1 { animation-delay: 1.28s; }
    .latency-case-e1 { animation-delay: 1.28s; }
    .latency-case-s2 { animation-delay: 2.56s; }
    .latency-case-e2 { animation-delay: 2.56s; }
    .latency-case-s3 { animation-delay: 3.84s; }
    .latency-case-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .latency-case-conn  { animation: latency-case-trace 6.4s ease-in-out infinite; }
      .latency-case-stage { animation: latency-case-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes latency-case-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes latency-case-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .latency-case-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .latency-case-stage { animation: latency-case-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes latency-case-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="latency-case-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="latency-case-bg" width="980" height="322"/>
  <text class="latency-case-h1"  x="30" y="40">Where the five seconds went</text>
  <text class="latency-case-sub" x="30" y="64">Not where anyone assumed.</text>
  <g class="latency-case-stage latency-case-s0">
    <rect class="latency-case-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="latency-case-step" x="44" y="142">01</text>
    <text class="latency-case-name" x="70" y="142">Model inference: 450 ms</text>
    <text class="latency-case-desc" x="44" y="166">The stage everyone suspected.</text>
    <text class="latency-case-desc" x="44" y="182">Entirely normal.</text>
  </g>
  <line class="latency-case-line latency-case-conn latency-case-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#latency-case-tip)"/>
  <g class="latency-case-stage latency-case-s1">
    <rect class="latency-case-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="latency-case-step" x="280" y="142">02</text>
    <text class="latency-case-name" x="306" y="142">Vector search: 35 ms</text>
    <text class="latency-case-desc" x="280" y="166">The other suspect. Also fine.</text>
  </g>
  <line class="latency-case-line latency-case-conn latency-case-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#latency-case-tip)"/>
  <g class="latency-case-stage latency-case-s2">
    <rect class="latency-case-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="latency-case-step" x="516" y="142">03</text>
    <text class="latency-case-name" x="542" y="142">Metadata filtering: 4,500 ms</text>
    <text class="latency-case-desc" x="516" y="166">Table lock contention on a</text>
    <text class="latency-case-desc" x="516" y="182">relational query.</text>
    <text class="latency-case-edge" x="516" y="242">the cause</text>
  </g>
  <line class="latency-case-line latency-case-conn latency-case-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#latency-case-tip)"/>
  <g class="latency-case-stage latency-case-s3">
    <rect class="latency-case-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="latency-case-step" x="752" y="142">04</text>
    <text class="latency-case-name" x="778" y="142">One index later: 3 ms</text>
    <text class="latency-case-desc" x="752" y="166">p99 down 90%.</text>
  </g>
  <text class="latency-case-sub" x="30" y="304">Day 357's rule in a specific instance: the slow stage was not the model, and no amount of prompt or retrieval tuning would have found it — only a span breakdown did.</text>
</svg>
