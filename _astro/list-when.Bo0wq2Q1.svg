<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is not.">
  <title>When a list is right</title>
  <style>
    .list-when-bg   { fill: #f8fafc; }
    .list-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .list-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .list-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .list-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .list-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .list-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .list-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .list-when-row { opacity: 1; }
    .list-when-r0 { animation-delay: 0.00s; }
    .list-when-r1 { animation-delay: 0.45s; }
    .list-when-r2 { animation-delay: 0.90s; }
    .list-when-r3 { animation-delay: 1.35s; }
    .list-when-r4 { animation-delay: 1.80s; }
    .list-when-row { animation: list-when-reveal 7.3s ease-in-out infinite; }
    @keyframes list-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="list-when-bg" width="980" height="390"/>
  <text class="list-when-h1"  x="30" y="40">When a list is right</text>
  <text class="list-when-sub" x="30" y="64">And when it is not.</text>
  <rect class="list-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="list-when-name" x="46" y="122">Use a list</text>
  <text class="list-when-desc" x="46" y="142">Four cases.</text>
  <text class="list-when-desc list-when-row list-when-r0" x="46" y="182">Order matters and duplicates are allowed</text>
  <text class="list-when-desc list-when-row list-when-r1" x="46" y="216">Appending and iterating in order</text>
  <text class="list-when-desc list-when-row list-when-r2" x="46" y="250">Mixed types in one collection</text>
  <text class="list-when-desc list-when-row list-when-r3" x="46" y="284">Small to moderate collections</text>
  <text class="list-when-desc list-when-row list-when-r4" x="46" y="318">Where indexing by position is natural</text>
  <rect class="list-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="list-when-name" x="526" y="122">Use something else</text>
  <text class="list-when-desc" x="526" y="142">Also four.</text>
  <text class="list-when-desc list-when-row list-when-r0" x="526" y="182">Membership testing — a set</text>
  <text class="list-when-desc list-when-row list-when-r1" x="526" y="216">Lookup by key — a dictionary</text>
  <text class="list-when-desc list-when-row list-when-r2" x="526" y="250">Numerical work — an array</text>
  <text class="list-when-desc list-when-row list-when-r3" x="526" y="284">Queue-like access at both ends — a deque</text>
  <text class="list-when-desc list-when-row list-when-r4" x="526" y="318">Fixed, unchanging contents — a tuple</text>
  <text class="list-when-sub" x="30" y="372">Swapping a list for a set when the code is doing membership tests is one of the highest-return single-line changes available in data code.</text>
</svg>
