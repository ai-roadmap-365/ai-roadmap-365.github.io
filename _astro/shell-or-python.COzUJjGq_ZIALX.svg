<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three signals, and they are unambiguous.">
  <title>When to stop writing shell</title>
  <style>
    .shell-or-python-bg   { fill: #f8fafc; }
    .shell-or-python-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-or-python-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-or-python-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-or-python-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-or-python-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-or-python-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-or-python-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shell-or-python-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shell-or-python-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shell-or-python-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shell-or-python-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shell-or-python-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-or-python-row { opacity: 1; }
    .shell-or-python-r0 { animation-delay: 0.00s; }
    .shell-or-python-r1 { animation-delay: 0.45s; }
    .shell-or-python-r2 { animation-delay: 0.90s; }
    .shell-or-python-r3 { animation-delay: 1.35s; }
    .shell-or-python-r4 { animation-delay: 1.80s; }
    .shell-or-python-row { animation: shell-or-python-reveal 7.3s ease-in-out infinite; }
    @keyframes shell-or-python-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shell-or-python-bg" width="980" height="390"/>
  <text class="shell-or-python-h1"  x="30" y="40">When to stop writing shell</text>
  <text class="shell-or-python-sub" x="30" y="64">Three signals, and they are unambiguous.</text>
  <rect class="shell-or-python-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shell-or-python-name" x="46" y="122">Stay in shell</text>
  <text class="shell-or-python-desc" x="46" y="142">Running other programs, in order.</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r0" x="46" y="182">Launching and connecting existing tools</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r1" x="46" y="216">Filesystem work: find, copy, rename</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r2" x="46" y="250">Wiring a pipeline together</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r3" x="46" y="284">Under about a hundred lines</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r4" x="46" y="318">Must run anywhere, with nothing installed</text>
  <rect class="shell-or-python-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shell-or-python-name" x="526" y="122">Move to Python</text>
  <text class="shell-or-python-desc" x="526" y="142">Three signals, any one is enough.</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r0" x="526" y="182">You need a dictionary or a list of records</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r1" x="526" y="216">You need to catch an error and carry on</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r2" x="526" y="250">You want to write a test for it</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r3" x="526" y="284">Parsing anything structured: JSON, XML, CSV</text>
  <text class="shell-or-python-desc shell-or-python-row shell-or-python-r4" x="526" y="318">Arithmetic beyond counting</text>
  <text class="shell-or-python-sub" x="30" y="372">The rewrite is cheap while the script is small and expensive once it is load-bearing. Move at the first signal, not the third.</text>
</svg>
