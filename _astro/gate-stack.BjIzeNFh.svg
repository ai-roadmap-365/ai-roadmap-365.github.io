<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five layers.">
  <title>The stack of gates</title>
  <style>
    .gate-stack-bg   { fill: #f8fafc; }
    .gate-stack-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-stack-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-stack-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-stack-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-stack-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-stack-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gate-stack-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gate-stack-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gate-stack-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gate-stack-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gate-stack-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gate-stack-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gate-stack-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gate-stack-stage { opacity: 1; }

    .gate-stack-s0 { animation-delay: 0.00s; }
    .gate-stack-e0 { animation-delay: 0.00s; }
    .gate-stack-s1 { animation-delay: 1.33s; }
    .gate-stack-e1 { animation-delay: 1.33s; }
    .gate-stack-s2 { animation-delay: 2.67s; }
    .gate-stack-e2 { animation-delay: 2.67s; }
    .gate-stack-s3 { animation-delay: 4.00s; }
    .gate-stack-e3 { animation-delay: 4.00s; }
    .gate-stack-s4 { animation-delay: 5.33s; }
    .gate-stack-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .gate-stack-conn  { animation: gate-stack-trace 8s ease-in-out infinite; }
      .gate-stack-stage { animation: gate-stack-arrive 8s ease-in-out infinite; }
    }
    @keyframes gate-stack-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gate-stack-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gate-stack-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gate-stack-stage { animation: gate-stack-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gate-stack-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gate-stack-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gate-stack-bg" width="980" height="322"/>
  <text class="gate-stack-h1"  x="30" y="40">The stack of gates</text>
  <text class="gate-stack-sub" x="30" y="64">Five layers.</text>
  <g class="gate-stack-stage gate-stack-s0">
    <rect class="gate-stack-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="gate-stack-step" x="44" y="142">01</text>
    <text class="gate-stack-name" x="70" y="142">Formatting, applied automatically</text>
    <text class="gate-stack-desc" x="44" y="166">Which never fails; it</text>
    <text class="gate-stack-desc" x="44" y="182">fixes.</text>
  </g>
  <line class="gate-stack-line gate-stack-conn gate-stack-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#gate-stack-tip)"/>
  <g class="gate-stack-stage gate-stack-s1">
    <rect class="gate-stack-good" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="gate-stack-step" x="233" y="142">02</text>
    <text class="gate-stack-name" x="259" y="142">Linting, for likely defects</text>
    <text class="gate-stack-desc" x="233" y="166">Fails on real problems.</text>
  </g>
  <line class="gate-stack-line gate-stack-conn gate-stack-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#gate-stack-tip)"/>
  <g class="gate-stack-stage gate-stack-s2">
    <rect class="gate-stack-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="gate-stack-step" x="422" y="142">03</text>
    <text class="gate-stack-name" x="448" y="142">Type checking at the boundaries</text>
    <text class="gate-stack-desc" x="422" y="166">Catching a class of error</text>
    <text class="gate-stack-desc" x="422" y="182">before runtime.</text>
  </g>
  <line class="gate-stack-line gate-stack-conn gate-stack-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#gate-stack-tip)"/>
  <g class="gate-stack-stage gate-stack-s3">
    <rect class="gate-stack-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="gate-stack-step" x="611" y="142">04</text>
    <text class="gate-stack-name" x="637" y="142">Tests, which are the substantive check</text>
    <text class="gate-stack-desc" x="611" y="166">And whose exit code</text>
    <text class="gate-stack-desc" x="611" y="182">drives everything.</text>
  </g>
  <line class="gate-stack-line gate-stack-conn gate-stack-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#gate-stack-tip)"/>
  <g class="gate-stack-stage gate-stack-s4">
    <rect class="gate-stack-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="gate-stack-step" x="800" y="142">05</text>
    <text class="gate-stack-name" x="826" y="142">And a coverage floor, read with care</text>
    <text class="gate-stack-desc" x="800" y="166">Since it measures</text>
    <text class="gate-stack-desc" x="800" y="182">execution, not</text>
    <text class="gate-stack-desc" x="800" y="198">verification.</text>
  </g>
  <text class="gate-stack-sub" x="30" y="304">Ordering them cheapest-first is what keeps the loop fast: a formatting failure should not wait behind a full test run.</text>
</svg>
