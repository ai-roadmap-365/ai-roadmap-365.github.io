<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" font-family="system-ui, sans-serif">
  <title>The Python built-in exception hierarchy: BaseException is the root; SystemExit, KeyboardInterrupt and GeneratorExit hang directly off it and are deliberately outside Exception, so "except Exception" does not catch them; Exception is the base of the errors ordinary code raises, including ValueError (with JSONDecodeError under it), TypeError, LookupError (KeyError, IndexError), OSError (FileNotFoundError, PermissionError), ArithmeticError (ZeroDivisionError), and any custom exception you define such as RecordError</title>
  <rect x="0" y="0" width="1000" height="600" fill="#f8fafc"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">The built-in exception hierarchy — catch the narrowest box you can act on</text>

  <!-- Root -->
  <rect x="400" y="56" width="200" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="500" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">BaseException</text>

  <!-- Root connectors down to row 1 -->
  <line x1="500" y1="102" x2="500" y2="124" stroke="#1a202c" stroke-width="2"/>
  <line x1="85" y1="124" x2="635" y2="124" stroke="#1a202c" stroke-width="2"/>
  <line x1="85" y1="124" x2="85" y2="150" stroke="#1a202c" stroke-width="2"/>
  <line x1="242" y1="124" x2="242" y2="150" stroke="#1a202c" stroke-width="2"/>
  <line x1="400" y1="124" x2="400" y2="150" stroke="#1a202c" stroke-width="2"/>
  <line x1="635" y1="124" x2="635" y2="150" stroke="#1a202c" stroke-width="2"/>

  <!-- The branch that sits OUTSIDE Exception -->
  <rect x="14" y="138" width="458" height="76" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" rx="8"/>
  <rect x="20" y="150" width="130" height="44" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="85" y="177" text-anchor="middle" font-size="15" fill="#1a202c">SystemExit</text>
  <rect x="160" y="150" width="164" height="44" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="242" y="177" text-anchor="middle" font-size="15" fill="#1a202c">KeyboardInterrupt</text>
  <rect x="334" y="150" width="132" height="44" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="400" y="177" text-anchor="middle" font-size="15" fill="#1a202c">GeneratorExit</text>
  <text x="243" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">outside Exception on purpose</text>
  <text x="243" y="253" text-anchor="middle" font-size="14" fill="#1a202c">except Exception: does NOT catch these —</text>
  <text x="243" y="271" text-anchor="middle" font-size="14" fill="#1a202c">Ctrl-C and sys.exit() still work. A bare</text>
  <text x="243" y="289" text-anchor="middle" font-size="14" fill="#1a202c">except: DOES catch them. That is the bug.</text>

  <!-- Exception -->
  <rect x="560" y="150" width="150" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="635" y="177" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Exception</text>
  <text x="790" y="178" font-size="14" fill="#1a202c">everything ordinary code raises</text>

  <!-- Exception -> row 2 -->
  <line x1="635" y1="194" x2="635" y2="222" stroke="#1a202c" stroke-width="2"/>
  <line x1="105" y1="222" x2="895" y2="222" stroke="#1a202c" stroke-width="2"/>
  <line x1="105" y1="222" x2="105" y2="322" stroke="#1a202c" stroke-width="2"/>
  <line x1="250" y1="222" x2="250" y2="322" stroke="#1a202c" stroke-width="2"/>
  <line x1="400" y1="222" x2="400" y2="322" stroke="#1a202c" stroke-width="2"/>
  <line x1="550" y1="222" x2="550" y2="322" stroke="#1a202c" stroke-width="2"/>
  <line x1="710" y1="222" x2="710" y2="322" stroke="#1a202c" stroke-width="2"/>
  <line x1="895" y1="222" x2="895" y2="322" stroke="#1a202c" stroke-width="2"/>

  <!-- Row 2: common concrete / intermediate classes -->
  <rect x="40" y="322" width="130" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="105" y="349" text-anchor="middle" font-size="15" fill="#1a202c">ValueError</text>
  <rect x="190" y="322" width="120" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="349" text-anchor="middle" font-size="15" fill="#1a202c">TypeError</text>
  <rect x="330" y="322" width="140" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="400" y="349" text-anchor="middle" font-size="15" fill="#1a202c">LookupError</text>
  <rect x="490" y="322" width="120" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="550" y="349" text-anchor="middle" font-size="15" fill="#1a202c">OSError</text>
  <rect x="630" y="322" width="160" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="710" y="349" text-anchor="middle" font-size="15" fill="#1a202c">ArithmeticError</text>
  <rect x="810" y="322" width="170" height="44" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="895" y="343" text-anchor="middle" font-size="15" fill="#1a202c">RecordError</text>
  <text x="895" y="360" text-anchor="middle" font-size="14" fill="#1d4ed8">(yours)</text>

  <!-- Row 2 -> row 3 -->
  <line x1="105" y1="366" x2="105" y2="392" stroke="#1a202c" stroke-width="2"/>
  <line x1="95" y1="392" x2="105" y2="392" stroke="#1a202c" stroke-width="2"/>
  <line x1="95" y1="392" x2="95" y2="424" stroke="#1a202c" stroke-width="2"/>

  <line x1="400" y1="366" x2="400" y2="392" stroke="#1a202c" stroke-width="2"/>
  <line x1="232" y1="392" x2="400" y2="392" stroke="#1a202c" stroke-width="2"/>
  <line x1="232" y1="392" x2="232" y2="424" stroke="#1a202c" stroke-width="2"/>
  <line x1="345" y1="392" x2="345" y2="424" stroke="#1a202c" stroke-width="2"/>

  <line x1="550" y1="366" x2="550" y2="392" stroke="#1a202c" stroke-width="2"/>
  <line x1="492" y1="392" x2="650" y2="392" stroke="#1a202c" stroke-width="2"/>
  <line x1="492" y1="392" x2="492" y2="424" stroke="#1a202c" stroke-width="2"/>
  <line x1="650" y1="392" x2="650" y2="424" stroke="#1a202c" stroke-width="2"/>

  <line x1="710" y1="366" x2="710" y2="392" stroke="#1a202c" stroke-width="2"/>
  <line x1="710" y1="392" x2="825" y2="392" stroke="#1a202c" stroke-width="2"/>
  <line x1="825" y1="392" x2="825" y2="424" stroke="#1a202c" stroke-width="2"/>

  <!-- Row 3: concrete leaves -->
  <rect x="20" y="424" width="150" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="95" y="451" text-anchor="middle" font-size="14" fill="#1a202c">JSONDecodeError</text>
  <rect x="185" y="424" width="95" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="232" y="451" text-anchor="middle" font-size="14" fill="#1a202c">KeyError</text>
  <rect x="295" y="424" width="100" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="345" y="451" text-anchor="middle" font-size="14" fill="#1a202c">IndexError</text>
  <rect x="410" y="424" width="165" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="492" y="451" text-anchor="middle" font-size="14" fill="#1a202c">FileNotFoundError</text>
  <rect x="580" y="424" width="140" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="650" y="451" text-anchor="middle" font-size="14" fill="#1a202c">PermissionError</text>
  <rect x="745" y="424" width="160" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="825" y="451" text-anchor="middle" font-size="14" fill="#1a202c">ZeroDivisionError</text>

  <!-- Reading rules -->
  <rect x="20" y="496" width="960" height="88" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="38" y="520" font-size="15" font-weight="bold" fill="#1a202c">How to read this tree</text>
  <text x="38" y="542" font-size="14" fill="#1a202c">A handler catches its box and everything below it: except OSError: also catches FileNotFoundError and PermissionError.</text>
  <text x="38" y="561" font-size="14" fill="#1a202c">JSONDecodeError sits UNDER ValueError, so except ValueError: placed first will shadow it — order clauses most specific first.</text>
  <text x="38" y="580" font-size="14" fill="#1a202c">Catch the narrowest box you can actually act on. Never catch BaseException, and never write a bare except:.</text>
</svg>
