<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Both are needed.">
  <title>Two retrieval measurements</title>
  <style>
    .context-precision-bg   { fill: #f8fafc; }
    .context-precision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-precision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-precision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-precision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-precision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-precision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .context-precision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .context-precision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .context-precision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .context-precision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .context-precision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .context-precision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .context-precision-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .context-precision-stage { opacity: 1; }

    .context-precision-s0 { animation-delay: 0.00s; }
    .context-precision-e0 { animation-delay: 0.00s; }
    .context-precision-s1 { animation-delay: 1.28s; }
    .context-precision-e1 { animation-delay: 1.28s; }
    .context-precision-s2 { animation-delay: 2.56s; }
    .context-precision-e2 { animation-delay: 2.56s; }
    .context-precision-s3 { animation-delay: 3.84s; }
    .context-precision-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .context-precision-conn  { animation: context-precision-trace 6.4s ease-in-out infinite; }
      .context-precision-stage { animation: context-precision-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes context-precision-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes context-precision-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .context-precision-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .context-precision-stage { animation: context-precision-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes context-precision-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="context-precision-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="context-precision-bg" width="980" height="322"/>
  <text class="context-precision-h1"  x="30" y="40">Two retrieval measurements</text>
  <text class="context-precision-sub" x="30" y="64">Both are needed.</text>
  <g class="context-precision-stage context-precision-s0">
    <rect class="context-precision-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="context-precision-step" x="44" y="142">01</text>
    <text class="context-precision-name" x="70" y="142">Recall: was everything needed retrieved</text>
    <text class="context-precision-desc" x="44" y="166">A missing passage cannot be</text>
    <text class="context-precision-desc" x="44" y="182">recovered later.</text>
  </g>
  <line class="context-precision-line context-precision-conn context-precision-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#context-precision-tip)"/>
  <g class="context-precision-stage context-precision-s1">
    <rect class="context-precision-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="context-precision-step" x="280" y="142">02</text>
    <text class="context-precision-name" x="306" y="142">Precision: was anything irrelevant retrieved</text>
    <text class="context-precision-desc" x="280" y="166">Which dilutes attention and</text>
    <text class="context-precision-desc" x="280" y="182">costs tokens.</text>
  </g>
  <line class="context-precision-line context-precision-conn context-precision-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#context-precision-tip)"/>
  <g class="context-precision-stage context-precision-s2">
    <rect class="context-precision-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="context-precision-step" x="516" y="142">03</text>
    <text class="context-precision-name" x="542" y="142">Retrieving more raises recall and lowers precision</text>
    <text class="context-precision-desc" x="516" y="166">Directly, and unavoidably.</text>
  </g>
  <line class="context-precision-line context-precision-conn context-precision-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#context-precision-tip)"/>
  <g class="context-precision-stage context-precision-s3">
    <rect class="context-precision-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="context-precision-step" x="752" y="142">04</text>
    <text class="context-precision-name" x="778" y="142">So retrieve broadly, then rerank</text>
    <text class="context-precision-desc" x="752" y="166">High recall first, precision</text>
    <text class="context-precision-desc" x="752" y="182">restored second.</text>
  </g>
  <text class="context-precision-sub" x="30" y="304">This is exactly why the two-stage pattern exists: the first stage optimises recall and the second restores precision, which no single stage can do at once.</text>
</svg>
