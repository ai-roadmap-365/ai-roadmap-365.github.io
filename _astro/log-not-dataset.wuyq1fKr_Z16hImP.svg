<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>A log is not a dataset</title>
  <style>
    .log-not-dataset-bg   { fill: #f8fafc; }
    .log-not-dataset-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-not-dataset-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-not-dataset-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-not-dataset-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-not-dataset-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-not-dataset-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .log-not-dataset-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .log-not-dataset-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .log-not-dataset-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .log-not-dataset-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .log-not-dataset-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .log-not-dataset-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .log-not-dataset-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .log-not-dataset-stage { opacity: 1; }

    .log-not-dataset-s0 { animation-delay: 0.00s; }
    .log-not-dataset-e0 { animation-delay: 0.00s; }
    .log-not-dataset-s1 { animation-delay: 1.28s; }
    .log-not-dataset-e1 { animation-delay: 1.28s; }
    .log-not-dataset-s2 { animation-delay: 2.56s; }
    .log-not-dataset-e2 { animation-delay: 2.56s; }
    .log-not-dataset-s3 { animation-delay: 3.84s; }
    .log-not-dataset-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .log-not-dataset-conn  { animation: log-not-dataset-trace 6.4s ease-in-out infinite; }
      .log-not-dataset-stage { animation: log-not-dataset-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes log-not-dataset-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes log-not-dataset-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .log-not-dataset-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .log-not-dataset-stage { animation: log-not-dataset-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes log-not-dataset-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="log-not-dataset-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="log-not-dataset-bg" width="980" height="322"/>
  <text class="log-not-dataset-h1"  x="30" y="40">A log is not a dataset</text>
  <text class="log-not-dataset-sub" x="30" y="64">Four steps.</text>
  <g class="log-not-dataset-stage log-not-dataset-s0">
    <rect class="log-not-dataset-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="log-not-dataset-step" x="44" y="142">01</text>
    <text class="log-not-dataset-name" x="70" y="142">A log records what a good policy did</text>
    <text class="log-not-dataset-desc" x="44" y="166">Which looks like labelled</text>
    <text class="log-not-dataset-desc" x="44" y="182">training data.</text>
  </g>
  <line class="log-not-dataset-line log-not-dataset-conn log-not-dataset-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#log-not-dataset-tip)"/>
  <g class="log-not-dataset-stage log-not-dataset-s1">
    <rect class="log-not-dataset-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="log-not-dataset-step" x="280" y="142">02</text>
    <text class="log-not-dataset-name" x="306" y="142">But it only covers states that policy reached</text>
    <text class="log-not-dataset-desc" x="280" y="166">Never the states a mistake would</text>
    <text class="log-not-dataset-desc" x="280" y="182">lead to.</text>
  </g>
  <line class="log-not-dataset-line log-not-dataset-conn log-not-dataset-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#log-not-dataset-tip)"/>
  <g class="log-not-dataset-stage log-not-dataset-s2">
    <rect class="log-not-dataset-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="log-not-dataset-step" x="516" y="142">03</text>
    <text class="log-not-dataset-name" x="542" y="142">So an imitator that errs slightly enters unseen territory</text>
    <text class="log-not-dataset-desc" x="516" y="166">Where it has no guidance, and</text>
    <text class="log-not-dataset-desc" x="516" y="182">errs more.</text>
  </g>
  <line class="log-not-dataset-line log-not-dataset-conn log-not-dataset-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#log-not-dataset-tip)"/>
  <g class="log-not-dataset-stage log-not-dataset-s3">
    <rect class="log-not-dataset-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="log-not-dataset-step" x="752" y="142">04</text>
    <text class="log-not-dataset-name" x="778" y="142">Errors compound rather than average out</text>
    <text class="log-not-dataset-desc" x="752" y="166">Which is why imitation alone is</text>
    <text class="log-not-dataset-desc" x="752" y="182">fragile.</text>
  </g>
  <text class="log-not-dataset-sub" x="30" y="304">Compounding rather than averaging is the crucial difference from supervised learning, and it is why imitation learning needs corrective data from its own mistakes.</text>
</svg>
