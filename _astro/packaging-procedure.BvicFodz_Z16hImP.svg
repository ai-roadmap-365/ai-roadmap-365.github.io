<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six steps, one of which is not about the Dockerfile.">
  <title>How to package the service</title>
  <style>
    .packaging-procedure-bg   { fill: #f8fafc; }
    .packaging-procedure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-procedure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-procedure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-procedure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-procedure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-procedure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packaging-procedure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packaging-procedure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packaging-procedure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packaging-procedure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packaging-procedure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packaging-procedure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .packaging-procedure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .packaging-procedure-stage { opacity: 1; }

    .packaging-procedure-s0 { animation-delay: 0.00s; }
    .packaging-procedure-e0 { animation-delay: 0.00s; }
    .packaging-procedure-s1 { animation-delay: 1.37s; }
    .packaging-procedure-e1 { animation-delay: 1.37s; }
    .packaging-procedure-s2 { animation-delay: 2.74s; }
    .packaging-procedure-e2 { animation-delay: 2.74s; }
    .packaging-procedure-s3 { animation-delay: 4.11s; }
    .packaging-procedure-e3 { animation-delay: 4.11s; }
    .packaging-procedure-s4 { animation-delay: 5.49s; }
    .packaging-procedure-e4 { animation-delay: 5.49s; }
    .packaging-procedure-s5 { animation-delay: 6.86s; }
    .packaging-procedure-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .packaging-procedure-conn  { animation: packaging-procedure-trace 9.600000000000001s ease-in-out infinite; }
      .packaging-procedure-stage { animation: packaging-procedure-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes packaging-procedure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes packaging-procedure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .packaging-procedure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .packaging-procedure-stage { animation: packaging-procedure-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes packaging-procedure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="packaging-procedure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="packaging-procedure-bg" width="980" height="322"/>
  <text class="packaging-procedure-h1"  x="30" y="40">How to package the service</text>
  <text class="packaging-procedure-sub" x="30" y="64">Six steps, one of which is not about the Dockerfile.</text>
  <g class="packaging-procedure-stage packaging-procedure-s0">
    <rect class="packaging-procedure-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="packaging-procedure-step" x="44" y="142">01</text>
    <text class="packaging-procedure-name" x="70" y="142">Builder stage from a full base</text>
    <text class="packaging-procedure-desc" x="44" y="166">Compiler, headers,</text>
    <text class="packaging-procedure-desc" x="44" y="182">cuda-devel. Whatever</text>
    <text class="packaging-procedure-desc" x="44" y="198">produces wheels.</text>
  </g>
  <line class="packaging-procedure-line packaging-procedure-conn packaging-procedure-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#packaging-procedure-tip)"/>
  <g class="packaging-procedure-stage packaging-procedure-s1">
    <rect class="packaging-procedure-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="packaging-procedure-step" x="201" y="142">02</text>
    <text class="packaging-procedure-name" x="227" y="142">Final stage from a slim base</text>
    <text class="packaging-procedure-desc" x="201" y="166">python:3.12-slim</text>
    <text class="packaging-procedure-desc" x="201" y="182">plus cuda-runtime,</text>
    <text class="packaging-procedure-desc" x="201" y="198">not devel.</text>
  </g>
  <line class="packaging-procedure-line packaging-procedure-conn packaging-procedure-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#packaging-procedure-tip)"/>
  <g class="packaging-procedure-stage packaging-procedure-s2">
    <rect class="packaging-procedure-warn" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="packaging-procedure-step" x="358" y="142">03</text>
    <text class="packaging-procedure-name" x="384" y="142">Copy artefacts, not tooling</text>
    <text class="packaging-procedure-desc" x="358" y="166">COPY --from=builder</text>
    <text class="packaging-procedure-desc" x="358" y="182">/wheels. Carrying</text>
    <text class="packaging-procedure-desc" x="358" y="198">the toolchain</text>
  </g>
  <line class="packaging-procedure-line packaging-procedure-conn packaging-procedure-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#packaging-procedure-tip)"/>
  <g class="packaging-procedure-stage packaging-procedure-s3">
    <rect class="packaging-procedure-good" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="packaging-procedure-step" x="515" y="142">04</text>
    <text class="packaging-procedure-name" x="541" y="142">Leave the weights out</text>
    <text class="packaging-procedure-desc" x="515" y="166">Mount a volume, or</text>
    <text class="packaging-procedure-desc" x="515" y="182">fetch on start with</text>
    <text class="packaging-procedure-desc" x="515" y="198">a checksum.</text>
    <text class="packaging-procedure-edge" x="515" y="242">13.5 GB</text>
  </g>
  <line class="packaging-procedure-line packaging-procedure-conn packaging-procedure-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#packaging-procedure-tip)"/>
  <g class="packaging-procedure-stage packaging-procedure-s4">
    <rect class="packaging-procedure-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="packaging-procedure-step" x="672" y="142">05</text>
    <text class="packaging-procedure-name" x="698" y="142">Add a USER</text>
    <text class="packaging-procedure-desc" x="672" y="166">A writable cache, a</text>
    <text class="packaging-procedure-desc" x="672" y="182">mounted volume and a</text>
    <text class="packaging-procedure-desc" x="672" y="198">listener is the</text>
  </g>
  <line class="packaging-procedure-line packaging-procedure-conn packaging-procedure-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#packaging-procedure-tip)"/>
  <g class="packaging-procedure-stage packaging-procedure-s5">
    <rect class="packaging-procedure-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="packaging-procedure-step" x="829" y="142">06</text>
    <text class="packaging-procedure-name" x="855" y="142">Measure in rollout seconds</text>
    <text class="packaging-procedure-desc" x="829" y="166">Size times nodes is</text>
    <text class="packaging-procedure-desc" x="829" y="182">what a deploy</text>
    <text class="packaging-procedure-desc" x="829" y="198">actually spends.</text>
    <text class="packaging-procedure-edge" x="829" y="242">the metric</text>
  </g>
  <text class="packaging-procedure-sub" x="30" y="304">The third step is why the lab checks the components a stage *carries* as well as the ones it declares: a multi-stage file that copies the compiler forward is multi-stage in shape and single-stage in effect.</text>
</svg>
