<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="ReAct Agent Loop and Tool Sandbox Topology">
  <title>ReAct Agent Loop and Tool Sandbox Topology</title>
  <defs>
    <style>
      .d355a-bg { fill: #f8fafc; }
      .d355a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d355a-agn { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d355a-box { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d355a-chk { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d355a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d355a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d355a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d355a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d355a-bg" />
  
  <text x="40" y="40" class="d355a-title">ReAct Agent Loop &amp; Sandboxed Tool Execution</text>
  <text x="40" y="65" class="d355a-subtitle">ReAct Agent Loop and Tool Sandbox Topology showing User Ingress, Thought Planner, Tool Registry, Sandboxed Dispatcher, External APIs, and Final Synthesis</text>
  
  <!-- ReAct Loop Container -->
  <rect x="40" y="110" width="250" height="280" class="d355a-agn" />
  <text x="55" y="145" class="d355a-header" fill="#1d4ed8">1. ReAct Reasoner Loop</text>
  <text x="55" y="180" class="d355a-text">• Thought: Decompose Goal</text>
  <text x="55" y="205" class="d355a-text">• Action: Select Tool &amp; Args</text>
  <text x="55" y="230" class="d355a-text">• Observe: Parse Output</text>
  <text x="55" y="255" class="d355a-text">• Max Turn Guard: 5 Cycles</text>
  <text x="55" y="300" class="d355a-text" font-weight="600" fill="#1d4ed8">Deterministic Control</text>
  
  <!-- Tool Sandbox Container -->
  <rect x="315" y="110" width="270" height="280" class="d355a-box" />
  <text x="330" y="145" class="d355a-header" fill="#15803d">2. Sandboxed Dispatcher</text>
  <text x="330" y="180" class="d355a-text">• Strict Pydantic Arg Validation</text>
  <text x="330" y="205" class="d355a-text">• Read-Only DB Connection</text>
  <text x="330" y="230" class="d355a-text">• External REST API Timeout 2s</text>
  <text x="330" y="255" class="d355a-text">• Parameter Injection Filter</text>
  <text x="330" y="300" class="d355a-text" font-weight="600" fill="#15803d">Zero-RCE Isolation</text>
  
  <!-- State Checkpointing Container -->
  <rect x="610" y="110" width="250" height="280" class="d355a-chk" />
  <text x="625" y="145" class="d355a-header" fill="#7e22ce">3. State Checkpointing</text>
  <text x="625" y="180" class="d355a-text">• Scratchpad Step Buffer</text>
  <text x="625" y="205" class="d355a-text">• JSON State Snapshot Store</text>
  <text x="625" y="230" class="d355a-text">• Human Approval Gate</text>
  <text x="625" y="255" class="d355a-text">• Auditable Trace Logging</text>
  <text x="625" y="300" class="d355a-text" font-weight="600" fill="#7e22ce">100% Traceability</text>
</svg>