<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use a database</title>
  <style>
    .rdb-when-bg   { fill: #f8fafc; }
    .rdb-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rdb-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rdb-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rdb-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rdb-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rdb-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rdb-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rdb-when-row { opacity: 1; }
    .rdb-when-r0 { animation-delay: 0.00s; }
    .rdb-when-r1 { animation-delay: 0.45s; }
    .rdb-when-r2 { animation-delay: 0.90s; }
    .rdb-when-r3 { animation-delay: 1.35s; }
    .rdb-when-r4 { animation-delay: 1.80s; }
    .rdb-when-row { animation: rdb-when-reveal 7.3s ease-in-out infinite; }
    @keyframes rdb-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rdb-when-bg" width="980" height="390"/>
  <text class="rdb-when-h1"  x="30" y="40">When to use a database</text>
  <text class="rdb-when-sub" x="30" y="64">And when not to.</text>
  <rect class="rdb-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rdb-when-name" x="46" y="122">Use one</text>
  <text class="rdb-when-desc" x="46" y="142">Four cases.</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r0" x="46" y="182">Data with relationships between entities</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r1" x="46" y="216">Concurrent readers or writers</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r2" x="46" y="250">Integrity rules that must always hold</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r3" x="46" y="284">Queries you cannot predict in advance</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r4" x="46" y="318">Data that outlives the program</text>
  <rect class="rdb-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rdb-when-name" x="526" y="122">Do not</text>
  <text class="rdb-when-desc" x="526" y="142">Also four.</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r0" x="526" y="182">A configuration file</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r1" x="526" y="216">A one-off analysis of a single file</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r2" x="526" y="250">Large binary blobs — store paths instead</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r3" x="526" y="284">Append-only logs</text>
  <text class="rdb-when-desc rdb-when-row rdb-when-r4" x="526" y="318">Where a data frame in memory suffices</text>
  <text class="rdb-when-sub" x="30" y="372">Storing paths rather than blobs is the practical rule: a database full of large binaries becomes slow to back up long before it becomes slow to query.</text>
</svg>
