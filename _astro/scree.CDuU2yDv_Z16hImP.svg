<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Choosing how many components</title>
  <style>
    .scree-bg   { fill: #f8fafc; }
    .scree-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scree-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scree-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scree-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scree-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scree-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scree-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scree-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scree-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scree-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scree-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scree-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scree-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scree-stage { opacity: 1; }

    .scree-s0 { animation-delay: 0.00s; }
    .scree-e0 { animation-delay: 0.00s; }
    .scree-s1 { animation-delay: 1.28s; }
    .scree-e1 { animation-delay: 1.28s; }
    .scree-s2 { animation-delay: 2.56s; }
    .scree-e2 { animation-delay: 2.56s; }
    .scree-s3 { animation-delay: 3.84s; }
    .scree-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scree-conn  { animation: scree-trace 6.4s ease-in-out infinite; }
      .scree-stage { animation: scree-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scree-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scree-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scree-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scree-stage { animation: scree-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scree-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scree-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scree-bg" width="980" height="322"/>
  <text class="scree-h1"  x="30" y="40">Choosing how many components</text>
  <text class="scree-sub" x="30" y="64">Four steps.</text>
  <g class="scree-stage scree-s0">
    <rect class="scree-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scree-step" x="44" y="142">01</text>
    <text class="scree-name" x="70" y="142">Each component's eigenvalue over the total is its share</text>
    <text class="scree-desc" x="44" y="166">Of the variance explained.</text>
  </g>
  <line class="scree-line scree-conn scree-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scree-tip)"/>
  <g class="scree-stage scree-s1">
    <rect class="scree-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scree-step" x="280" y="142">02</text>
    <text class="scree-name" x="306" y="142">Accumulate them in order</text>
    <text class="scree-desc" x="280" y="166">Giving a rising curve toward</text>
    <text class="scree-desc" x="280" y="182">one.</text>
  </g>
  <line class="scree-line scree-conn scree-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scree-tip)"/>
  <g class="scree-stage scree-s2">
    <rect class="scree-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scree-step" x="516" y="142">03</text>
    <text class="scree-name" x="542" y="142">Keep enough to reach a threshold</text>
    <text class="scree-desc" x="516" y="166">Ninety or ninety-five percent,</text>
    <text class="scree-desc" x="516" y="182">typically.</text>
  </g>
  <line class="scree-line scree-conn scree-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scree-tip)"/>
  <g class="scree-stage scree-s3">
    <rect class="scree-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scree-step" x="752" y="142">04</text>
    <text class="scree-name" x="778" y="142">Or cut at the elbow, where the curve flattens</text>
    <text class="scree-desc" x="752" y="166">Which is more judgment than</text>
    <text class="scree-desc" x="752" y="182">rule.</text>
  </g>
  <text class="scree-sub" x="30" y="304">The threshold is a convention rather than a principle, and choosing it by downstream task performance is more defensible where that is possible.</text>
</svg>
