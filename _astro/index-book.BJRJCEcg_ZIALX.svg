<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Look up, do not scan.">
  <title>An index at the back of a book</title>
  <style>
    .index-book-bg   { fill: #f8fafc; }
    .index-book-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-book-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-book-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-book-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-book-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-book-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-book-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .index-book-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .index-book-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .index-book-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .index-book-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .index-book-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-book-row { opacity: 1; }
    .index-book-r0 { animation-delay: 0.00s; }
    .index-book-r1 { animation-delay: 0.45s; }
    .index-book-r2 { animation-delay: 0.90s; }
    .index-book-r3 { animation-delay: 1.35s; }
    .index-book-r4 { animation-delay: 1.80s; }
    .index-book-row { animation: index-book-reveal 7.3s ease-in-out infinite; }
    @keyframes index-book-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="index-book-bg" width="980" height="390"/>
  <text class="index-book-h1"  x="30" y="40">An index at the back of a book</text>
  <text class="index-book-sub" x="30" y="64">Look up, do not scan.</text>
  <rect class="index-book-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="index-book-name" x="46" y="122">Reading through</text>
  <text class="index-book-desc" x="46" y="142">Scan every page.</text>
  <text class="index-book-desc index-book-row index-book-r0" x="46" y="182">Start at the beginning</text>
  <text class="index-book-desc index-book-row index-book-r1" x="46" y="216">Time grows with the book's length</text>
  <text class="index-book-desc index-book-row index-book-r2" x="46" y="250">Finds it eventually</text>
  <text class="index-book-desc index-book-row index-book-r3" x="46" y="284">Nothing prepared in advance</text>
  <text class="index-book-desc index-book-row index-book-r4" x="46" y="318">This is a linear search</text>
  <rect class="index-book-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="index-book-name" x="526" y="122">Using the index</text>
  <text class="index-book-desc" x="526" y="142">Straight to the page.</text>
  <text class="index-book-desc index-book-row index-book-r0" x="526" y="182">Look up the term directly</text>
  <text class="index-book-desc index-book-row index-book-r1" x="526" y="216">Time barely depends on length</text>
  <text class="index-book-desc index-book-row index-book-r2" x="526" y="250">Finds it immediately</text>
  <text class="index-book-desc index-book-row index-book-r3" x="526" y="284">The index was built beforehand</text>
  <text class="index-book-desc index-book-row index-book-r4" x="526" y="318">This is a dictionary</text>
  <text class="index-book-sub" x="30" y="372">The index has to be built and kept in step with the book, which is exactly the insertion cost a hash table pays in exchange for its lookup speed.</text>
</svg>
