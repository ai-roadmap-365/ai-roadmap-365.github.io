<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a class and its instances: the class object holds one shared dictionary of class attributes and function objects (the methods, the property, the classmethod, and the staticmethod), while each instance holds its own separate attribute dictionary of state; when an attribute is not found in the instance dictionary, Python falls back to the class dictionary</title>
  <rect x="0" y="0" width="880" height="670" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a class: one blueprint, many instances</text>

  <!-- The class object -->
  <rect x="240" y="60" width="400" height="304" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="440" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">class Account — itself an object</text>
  <text x="440" y="110" text-anchor="middle" font-size="14" fill="#1d4ed8">Account.__dict__ — one copy, shared by every instance</text>
  <line x1="256" y1="122" x2="624" y2="122" stroke="#1d4ed8" stroke-width="1"/>

  <text x="258" y="146" font-size="14" fill="#1a202c">currency = 'USD'</text>
  <text x="622" y="146" text-anchor="end" font-size="14" fill="#1d4ed8">class attribute</text>

  <text x="258" y="170" font-size="14" fill="#1a202c">accounts_opened = 2</text>
  <text x="622" y="170" text-anchor="end" font-size="14" fill="#1d4ed8">class attribute</text>

  <text x="258" y="194" font-size="14" fill="#1a202c">__init__(self, owner, balance)</text>
  <text x="622" y="194" text-anchor="end" font-size="14" fill="#1d4ed8">function</text>

  <text x="258" y="218" font-size="14" fill="#1a202c">deposit(self, amount)</text>
  <text x="622" y="218" text-anchor="end" font-size="14" fill="#1d4ed8">function</text>

  <text x="258" y="242" font-size="14" fill="#1a202c">withdraw(self, amount)</text>
  <text x="622" y="242" text-anchor="end" font-size="14" fill="#1d4ed8">function</text>

  <text x="258" y="266" font-size="14" fill="#1a202c">balance</text>
  <text x="622" y="266" text-anchor="end" font-size="14" fill="#1d4ed8">property (getter + setter)</text>

  <text x="258" y="290" font-size="14" fill="#1a202c">from_csv_row(cls, row)</text>
  <text x="622" y="290" text-anchor="end" font-size="14" fill="#1d4ed8">classmethod</text>

  <text x="258" y="314" font-size="14" fill="#1a202c">is_valid_amount(amount)</text>
  <text x="622" y="314" text-anchor="end" font-size="14" fill="#1d4ed8">staticmethod</text>

  <text x="258" y="338" font-size="14" fill="#1a202c">__repr__(self)</text>
  <text x="622" y="338" text-anchor="end" font-size="14" fill="#1d4ed8">function</text>

  <text x="440" y="358" text-anchor="middle" font-size="14" font-style="italic" fill="#1a202c">one function object per method — never copied per instance</text>

  <!-- Lookup arrows: instance -> class -->
  <path d="M 215 428 V 396 H 328 V 368" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="328,366 322,378 334,378" fill="#1d4ed8"/>
  <path d="M 665 428 V 396 H 552 V 368" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="552,366 546,378 558,378" fill="#1d4ed8"/>
  <text x="440" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">attribute lookup</text>
  <text x="440" y="412" text-anchor="middle" font-size="14" fill="#1a202c">instance __dict__ first, then the class __dict__</text>

  <!-- Instance: ada -->
  <rect x="60" y="428" width="310" height="180" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="215" y="454" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">ada = Account('ada', 100)</text>
  <text x="215" y="476" text-anchor="middle" font-size="14" fill="#1d4ed8">ada.__dict__ — its own state</text>
  <line x1="76" y1="488" x2="354" y2="488" stroke="#1d4ed8" stroke-width="1"/>
  <text x="80" y="512" font-size="14" fill="#1a202c">'owner': 'ada'</text>
  <text x="80" y="536" font-size="14" fill="#1a202c">'_balance': 150.0</text>
  <text x="80" y="560" font-size="14" fill="#1a202c">'history': [('deposit', 50.0)]</text>
  <text x="215" y="590" text-anchor="middle" font-size="14" font-style="italic" fill="#1a202c">no methods stored here</text>

  <!-- Instance: bob -->
  <rect x="510" y="428" width="310" height="180" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="665" y="454" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">bob = Account('bob', 100)</text>
  <text x="665" y="476" text-anchor="middle" font-size="14" fill="#1d4ed8">bob.__dict__ — separate storage</text>
  <line x1="526" y1="488" x2="804" y2="488" stroke="#1d4ed8" stroke-width="1"/>
  <text x="530" y="512" font-size="14" fill="#1a202c">'owner': 'bob'</text>
  <text x="530" y="536" font-size="14" fill="#1a202c">'_balance': 100.0</text>
  <text x="530" y="560" font-size="14" fill="#1a202c">'history': []</text>
  <text x="665" y="590" text-anchor="middle" font-size="14" font-style="italic" fill="#1a202c">ada is bob  →  False</text>

  <text x="440" y="640" text-anchor="middle" font-size="15" fill="#1a202c">A class is a dictionary of state plus a dictionary of functions, with syntax on top.</text>
</svg>
