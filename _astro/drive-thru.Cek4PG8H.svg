<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Menu, speaker, kitchen, window.">
  <title>A drive-thru window</title>
  <style>
    .drive-thru-bg   { fill: #f8fafc; }
    .drive-thru-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drive-thru-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drive-thru-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drive-thru-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drive-thru-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drive-thru-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drive-thru-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .drive-thru-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .drive-thru-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .drive-thru-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .drive-thru-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .drive-thru-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drive-thru-row { opacity: 1; }
    .drive-thru-r0 { animation-delay: 0.00s; }
    .drive-thru-r1 { animation-delay: 0.45s; }
    .drive-thru-r2 { animation-delay: 0.90s; }
    .drive-thru-r3 { animation-delay: 1.35s; }
    .drive-thru-r4 { animation-delay: 1.80s; }
    .drive-thru-row { animation: drive-thru-reveal 7.3s ease-in-out infinite; }
    @keyframes drive-thru-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="drive-thru-bg" width="980" height="390"/>
  <text class="drive-thru-h1"  x="30" y="40">A drive-thru window</text>
  <text class="drive-thru-sub" x="30" y="64">Menu, speaker, kitchen, window.</text>
  <rect class="drive-thru-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="drive-thru-name" x="46" y="122">The drive-thru</text>
  <text class="drive-thru-desc" x="46" y="142">Four parts.</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r0" x="46" y="182">A menu listing items and sizes</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r1" x="46" y="216">A speaker taking the order</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r2" x="46" y="250">A kitchen preparing it</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r3" x="46" y="284">A window handing it over</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r4" x="46" y="318">"We are out of fries" told clearly</text>
  <rect class="drive-thru-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="drive-thru-name" x="526" y="122">The server</text>
  <text class="drive-thru-desc" x="526" y="142">The same four.</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r0" x="526" y="182">tools/list, with schemas and enums</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r1" x="526" y="216">stdin, carrying the call</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r2" x="526" y="250">The handler function</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r3" x="526" y="284">stdout, carrying result.content</text>
  <text class="drive-thru-desc drive-thru-row drive-thru-r4" x="526" y="318">isError: true, so the caller can choose again</text>
  <text class="drive-thru-sub" x="30" y="372">The out-of-stock message is the part worth copying: it names what is unavailable so the customer can pick something else, which is precisely what a good tool error does for a model.</text>
</svg>
