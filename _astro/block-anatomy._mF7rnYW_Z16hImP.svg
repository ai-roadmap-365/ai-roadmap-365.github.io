<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two mixers, two residuals.">
  <title>What a transformer block contains</title>
  <style>
    .block-anatomy-bg   { fill: #f8fafc; }
    .block-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .block-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .block-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .block-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .block-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .block-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .block-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .block-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .block-anatomy-stage { opacity: 1; }

    .block-anatomy-s0 { animation-delay: 0.00s; }
    .block-anatomy-e0 { animation-delay: 0.00s; }
    .block-anatomy-s1 { animation-delay: 1.28s; }
    .block-anatomy-e1 { animation-delay: 1.28s; }
    .block-anatomy-s2 { animation-delay: 2.56s; }
    .block-anatomy-e2 { animation-delay: 2.56s; }
    .block-anatomy-s3 { animation-delay: 3.84s; }
    .block-anatomy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .block-anatomy-conn  { animation: block-anatomy-trace 6.4s ease-in-out infinite; }
      .block-anatomy-stage { animation: block-anatomy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes block-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes block-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .block-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .block-anatomy-stage { animation: block-anatomy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes block-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="block-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="block-anatomy-bg" width="980" height="322"/>
  <text class="block-anatomy-h1"  x="30" y="40">What a transformer block contains</text>
  <text class="block-anatomy-sub" x="30" y="64">Two mixers, two residuals.</text>
  <g class="block-anatomy-stage block-anatomy-s0">
    <rect class="block-anatomy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="block-anatomy-step" x="44" y="142">01</text>
    <text class="block-anatomy-name" x="70" y="142">Multi-head attention</text>
    <text class="block-anatomy-desc" x="44" y="166">Mixes information across token</text>
    <text class="block-anatomy-desc" x="44" y="182">positions.</text>
    <text class="block-anatomy-edge" x="44" y="242">spatial</text>
  </g>
  <line class="block-anatomy-line block-anatomy-conn block-anatomy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#block-anatomy-tip)"/>
  <g class="block-anatomy-stage block-anatomy-s1">
    <rect class="block-anatomy-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="block-anatomy-step" x="280" y="142">02</text>
    <text class="block-anatomy-name" x="306" y="142">Added to the residual stream</text>
    <text class="block-anatomy-desc" x="280" y="166">Not replacing it. The identity</text>
    <text class="block-anatomy-desc" x="280" y="182">path continues.</text>
  </g>
  <line class="block-anatomy-line block-anatomy-conn block-anatomy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#block-anatomy-tip)"/>
  <g class="block-anatomy-stage block-anatomy-s2">
    <rect class="block-anatomy-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="block-anatomy-step" x="516" y="142">03</text>
    <text class="block-anatomy-name" x="542" y="142">A position-wise feedforward network</text>
    <text class="block-anatomy-desc" x="516" y="166">Mixes across feature dimensions,</text>
    <text class="block-anatomy-desc" x="516" y="182">independently per token.</text>
    <text class="block-anatomy-edge" x="516" y="242">channel</text>
  </g>
  <line class="block-anatomy-line block-anatomy-conn block-anatomy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#block-anatomy-tip)"/>
  <g class="block-anatomy-stage block-anatomy-s3">
    <rect class="block-anatomy-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="block-anatomy-step" x="752" y="142">04</text>
    <text class="block-anatomy-name" x="778" y="142">Added again</text>
    <text class="block-anatomy-desc" x="752" y="166">Two sublayers, two additions,</text>
    <text class="block-anatomy-desc" x="752" y="182">same shape throughout.</text>
  </g>
  <text class="block-anatomy-sub" x="30" y="304">The shape being preserved end to end is what makes stacking trivial: a block's output is a valid input to another block, so depth is a configuration number rather than an architectural decision.</text>
</svg>
