<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Usually not.">
  <title>Is the difference real</title>
  <style>
    .significance-bg   { fill: #f8fafc; }
    .significance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .significance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .significance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .significance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .significance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .significance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .significance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .significance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .significance-stage { opacity: 1; }

    .significance-s0 { animation-delay: 0.00s; }
    .significance-e0 { animation-delay: 0.00s; }
    .significance-s1 { animation-delay: 1.28s; }
    .significance-e1 { animation-delay: 1.28s; }
    .significance-s2 { animation-delay: 2.56s; }
    .significance-e2 { animation-delay: 2.56s; }
    .significance-s3 { animation-delay: 3.84s; }
    .significance-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .significance-conn  { animation: significance-trace 6.4s ease-in-out infinite; }
      .significance-stage { animation: significance-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes significance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes significance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .significance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .significance-stage { animation: significance-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes significance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="significance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="significance-bg" width="980" height="322"/>
  <text class="significance-h1"  x="30" y="40">Is the difference real</text>
  <text class="significance-sub" x="30" y="64">Usually not.</text>
  <g class="significance-stage significance-s0">
    <rect class="significance-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="significance-step" x="44" y="142">01</text>
    <text class="significance-name" x="70" y="142">Two single runs differ by half a point</text>
    <text class="significance-desc" x="44" y="166">Which tells you almost nothing.</text>
  </g>
  <line class="significance-line significance-conn significance-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#significance-tip)"/>
  <g class="significance-stage significance-s1">
    <rect class="significance-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="significance-step" x="280" y="142">02</text>
    <text class="significance-name" x="306" y="142">Because seeds alone produce that much spread</text>
    <text class="significance-desc" x="280" y="166">Sometimes more.</text>
  </g>
  <line class="significance-line significance-conn significance-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#significance-tip)"/>
  <g class="significance-stage significance-s2">
    <rect class="significance-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="significance-step" x="516" y="142">03</text>
    <text class="significance-name" x="542" y="142">Run several seeds of each</text>
    <text class="significance-desc" x="516" y="166">Five at minimum. Report the</text>
    <text class="significance-desc" x="516" y="182">spread, not the best.</text>
  </g>
  <line class="significance-line significance-conn significance-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#significance-tip)"/>
  <g class="significance-stage significance-s3">
    <rect class="significance-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="significance-step" x="752" y="142">04</text>
    <text class="significance-name" x="778" y="142">And compare intervals, not points</text>
    <text class="significance-desc" x="752" y="166">If they overlap, there is no</text>
    <text class="significance-desc" x="752" y="182">result yet.</text>
  </g>
  <text class="significance-sub" x="30" y="304">Reporting the best seed rather than the distribution is the single most common statistical error in published results, and it survives because reviewers rarely ask for the spread.</text>
</svg>
