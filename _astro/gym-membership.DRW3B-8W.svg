<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The trial ends on the thing nobody advertised.">
  <title>A gym membership, and two towels</title>
  <style>
    .gym-membership-bg   { fill: #f8fafc; }
    .gym-membership-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gym-membership-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gym-membership-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gym-membership-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gym-membership-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gym-membership-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gym-membership-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gym-membership-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gym-membership-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gym-membership-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gym-membership-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gym-membership-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gym-membership-row { opacity: 1; }
    .gym-membership-r0 { animation-delay: 0.00s; }
    .gym-membership-r1 { animation-delay: 0.45s; }
    .gym-membership-r2 { animation-delay: 0.90s; }
    .gym-membership-r3 { animation-delay: 1.35s; }
    .gym-membership-r4 { animation-delay: 1.80s; }
    .gym-membership-row { animation: gym-membership-reveal 7.3s ease-in-out infinite; }
    @keyframes gym-membership-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gym-membership-bg" width="980" height="390"/>
  <text class="gym-membership-h1"  x="30" y="40">A gym membership, and two towels</text>
  <text class="gym-membership-sub" x="30" y="64">The trial ends on the thing nobody advertised.</text>
  <rect class="gym-membership-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gym-membership-name" x="46" y="122">The billing question</text>
  <text class="gym-membership-desc" x="46" y="142">How many visits?</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r0" x="46" y="182">Pay-per-visit costs nothing in August</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r1" x="46" y="216">The membership costs the same away or not</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r2" x="46" y="250">Nobody argues about which is better</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r3" x="46" y="284">They ask where the crossover is</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r4" x="46" y="318">That is the only useful form of the question</text>
  <rect class="gym-membership-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gym-membership-name" x="526" y="122">The free trial</text>
  <text class="gym-membership-desc" x="526" y="142">Unlimited classes, two towels.</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r0" x="526" y="182">The headline is genuinely generous</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r1" x="526" y="216">You shower twice a visit</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r2" x="526" y="250">The trial ends on towels</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r3" x="526" y="284">At a fraction of the class limit</text>
  <text class="gym-membership-desc gym-membership-row gym-membership-r4" x="526" y="318">The leaflet does not mention towels</text>
  <text class="gym-membership-sub" x="30" y="372">That is the egress allowance exactly: two million free requests is a hundred times this workload's traffic, and the tier ends at 1.25x on a dimension the marketing never names.</text>
</svg>
