<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Manual, symbolic, then traced.">
  <title>Three generations of differentiation</title>
  <style>
    .autograd-lineage-bg   { fill: #f8fafc; }
    .autograd-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .autograd-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .autograd-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .autograd-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .autograd-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .autograd-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .autograd-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .autograd-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .autograd-lineage-stage { opacity: 1; }

    .autograd-lineage-s0 { animation-delay: 0.00s; }
    .autograd-lineage-e0 { animation-delay: 0.00s; }
    .autograd-lineage-s1 { animation-delay: 1.50s; }
    .autograd-lineage-e1 { animation-delay: 1.50s; }
    .autograd-lineage-s2 { animation-delay: 3.00s; }
    .autograd-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .autograd-lineage-conn  { animation: autograd-lineage-trace 6s ease-in-out infinite; }
      .autograd-lineage-stage { animation: autograd-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes autograd-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes autograd-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .autograd-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .autograd-lineage-stage { animation: autograd-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes autograd-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="autograd-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="autograd-lineage-bg" width="980" height="322"/>
  <text class="autograd-lineage-h1"  x="30" y="40">Three generations of differentiation</text>
  <text class="autograd-lineage-sub" x="30" y="64">Manual, symbolic, then traced.</text>
  <g class="autograd-lineage-stage autograd-lineage-s0">
    <rect class="autograd-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="autograd-lineage-step" x="44" y="142">01</text>
    <text class="autograd-lineage-name" x="70" y="142">Hand-derived</text>
    <text class="autograd-lineage-desc" x="44" y="166">Four equations per layer type. A new</text>
    <text class="autograd-lineage-desc" x="44" y="182">architecture is a calculus exercise.</text>
  </g>
  <line class="autograd-lineage-line autograd-lineage-conn autograd-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#autograd-lineage-tip)"/>
  <g class="autograd-lineage-stage autograd-lineage-s1">
    <rect class="autograd-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="autograd-lineage-step" x="359" y="142">02</text>
    <text class="autograd-lineage-name" x="385" y="142">Static symbolic graphs</text>
    <text class="autograd-lineage-desc" x="359" y="166">Define the computation, compile it, then run.</text>
    <text class="autograd-lineage-desc" x="359" y="182">Fast, and hard to debug.</text>
  </g>
  <line class="autograd-lineage-line autograd-lineage-conn autograd-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#autograd-lineage-tip)"/>
  <g class="autograd-lineage-stage autograd-lineage-s2">
    <rect class="autograd-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="autograd-lineage-step" x="674" y="142">03</text>
    <text class="autograd-lineage-name" x="700" y="142">Dynamic tape</text>
    <text class="autograd-lineage-desc" x="674" y="166">Record as you execute. Python control flow</text>
    <text class="autograd-lineage-desc" x="674" y="182">works; a debugger works.</text>
  </g>
  <text class="autograd-lineage-sub" x="30" y="304">The middle generation was faster and lost: researchers accepted a performance cost in exchange for being able to put a print statement inside a model.</text>
</svg>
