<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>From file to package</title>
  <style>
    .file-to-package-bg   { fill: #f8fafc; }
    .file-to-package-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-to-package-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-to-package-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-to-package-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-to-package-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-to-package-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-to-package-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .file-to-package-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .file-to-package-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .file-to-package-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .file-to-package-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .file-to-package-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .file-to-package-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .file-to-package-stage { opacity: 1; }

    .file-to-package-s0 { animation-delay: 0.00s; }
    .file-to-package-e0 { animation-delay: 0.00s; }
    .file-to-package-s1 { animation-delay: 1.28s; }
    .file-to-package-e1 { animation-delay: 1.28s; }
    .file-to-package-s2 { animation-delay: 2.56s; }
    .file-to-package-e2 { animation-delay: 2.56s; }
    .file-to-package-s3 { animation-delay: 3.84s; }
    .file-to-package-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .file-to-package-conn  { animation: file-to-package-trace 6.4s ease-in-out infinite; }
      .file-to-package-stage { animation: file-to-package-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes file-to-package-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes file-to-package-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .file-to-package-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .file-to-package-stage { animation: file-to-package-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes file-to-package-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="file-to-package-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="file-to-package-bg" width="980" height="322"/>
  <text class="file-to-package-h1"  x="30" y="40">From file to package</text>
  <text class="file-to-package-sub" x="30" y="64">Four steps.</text>
  <g class="file-to-package-stage file-to-package-s0">
    <rect class="file-to-package-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="file-to-package-step" x="44" y="142">01</text>
    <text class="file-to-package-name" x="70" y="142">One file, run directly</text>
    <text class="file-to-package-desc" x="44" y="166">Which is where everything</text>
    <text class="file-to-package-desc" x="44" y="182">starts.</text>
  </g>
  <line class="file-to-package-line file-to-package-conn file-to-package-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#file-to-package-tip)"/>
  <g class="file-to-package-stage file-to-package-s1">
    <rect class="file-to-package-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="file-to-package-step" x="280" y="142">02</text>
    <text class="file-to-package-name" x="306" y="142">Several modules, imported by name</text>
    <text class="file-to-package-desc" x="280" y="166">Once one file becomes unwieldy.</text>
  </g>
  <line class="file-to-package-line file-to-package-conn file-to-package-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#file-to-package-tip)"/>
  <g class="file-to-package-stage file-to-package-s2">
    <rect class="file-to-package-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="file-to-package-step" x="516" y="142">03</text>
    <text class="file-to-package-name" x="542" y="142">A directory that groups them into a package</text>
    <text class="file-to-package-desc" x="516" y="166">With its own namespace.</text>
  </g>
  <line class="file-to-package-line file-to-package-conn file-to-package-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#file-to-package-tip)"/>
  <g class="file-to-package-stage file-to-package-s3">
    <rect class="file-to-package-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="file-to-package-step" x="752" y="142">04</text>
    <text class="file-to-package-name" x="778" y="142">And a distribution others can install</text>
    <text class="file-to-package-desc" x="752" y="166">Which is the last step to reuse.</text>
    <text class="file-to-package-edge" x="752" y="242">day 83</text>
  </g>
  <text class="file-to-package-sub" x="30" y="304">Each step is taken when the previous one becomes painful, which is why layout should follow the project's size rather than being imposed up front.</text>
</svg>
