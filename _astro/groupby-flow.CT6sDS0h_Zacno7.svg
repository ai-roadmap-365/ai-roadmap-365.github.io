<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-labelledby="d123fTitleId d123fDescId">
  <title id="d123fTitleId">agg shrinks to one row per group; transform keeps every row, each carrying its group's value</title>
  <desc id="d123fDescId">Six rows -- three North, three South -- sort from a source column on the left into two group buckets. From the North bucket, one wire feeds an agg result table showing a single row, North, mean 120. Another set of wires feeds a transform result column that still has six rows, with every North row showing 120 and every South row showing its own group's mean, so the transform output is the same length and order as the source. A caption states that agg reduces each group to one row while transform returns a value for every original row -- the shape difference is the whole point.</desc>

  <style>
    .d123f-bg      { fill: #f8fafc; }
    .d123f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d123f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d123f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #1a202c; }
    .d123f-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d123f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d123f-src     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
    .d123f-northrow { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.25; }
    .d123f-southrow { fill: #fdf4ff; stroke: #a21caf; stroke-width: 1.25; }
    .d123f-bucket  { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
    .d123f-agg     { fill: #dcfce7; stroke: #047857; stroke-width: 1.5; }
    .d123f-transformN { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.25; }
    .d123f-transformS { fill: #fdf4ff; stroke: #a21caf; stroke-width: 1.25; }

    /* Motion 1: rows drift from the source column into their bucket. */
    .d123f-rowmove { animation: d123f-settle 7s ease-in-out infinite; }
    .d123f-rowN { animation-delay: 0s; }
    .d123f-rowS { animation-delay: 0.15s; }
    @keyframes d123f-settle {
      0%, 6%   { transform: translateX(0); }
      35%, 100% { transform: translateX(140px); }
    }

    /* Motion 2: marching-dash wires from bucket to agg/transform results. */
    .d123f-wire {
      fill: none; stroke: #1d4ed8; stroke-width: 2.25;
      stroke-dasharray: 8 6; opacity: 0;
      animation: d123f-march 1.4s linear infinite, d123f-wirein 7s ease-in-out infinite;
    }
    @keyframes d123f-march { to { stroke-dashoffset: -14; } }
    @keyframes d123f-wirein { 0%, 38% { opacity: 0; } 50%, 100% { opacity: 1; } }

    /* Motion 3: the agg row and the transform rows light up once fed. */
    .d123f-pulse { animation: d123f-lightup 7s ease-in-out infinite; }
    @keyframes d123f-lightup {
      0%, 45% { fill: #f1f5f9; stroke: #94a3b8; }
      60%, 100% { fill: var(--d123f-final-fill, #dcfce7); stroke: var(--d123f-final-stroke, #047857); }
    }
    .d123f-pulse.d123f-agg      { --d123f-final-fill: #dcfce7; --d123f-final-stroke: #047857; }
    .d123f-pulse.d123f-transformN { --d123f-final-fill: #eff6ff; --d123f-final-stroke: #1d4ed8; }
    .d123f-pulse.d123f-transformS { --d123f-final-fill: #fdf4ff; --d123f-final-stroke: #a21caf; }

    @media (prefers-reduced-motion: reduce) {
      .d123f-rowmove { animation: none; transform: translateX(140px); }
      .d123f-wire    { animation: none; stroke-dasharray: none; opacity: 1; }
      .d123f-pulse.d123f-agg      { animation: none; fill: #dcfce7; stroke: #047857; }
      .d123f-pulse.d123f-transformN { animation: none; fill: #eff6ff; stroke: #1d4ed8; }
      .d123f-pulse.d123f-transformS { animation: none; fill: #fdf4ff; stroke: #a21caf; }
    }
  </style>

  <rect class="d123f-bg" x="0" y="0" width="1040" height="600" />

  <text class="d123f-title" x="28" y="38">agg reduces to one row; transform keeps every row</text>
  <text class="d123f-sub" x="28" y="60">groupby("region")["amount"] -- .agg("mean") versus .transform("mean") on the same six rows</text>

  <!-- Source rows -->
  <text class="d123f-label" x="28" y="90">source</text>
  <g class="d123f-rowmove d123f-rowN">
    <rect class="d123f-northrow" x="20" y="100" width="110" height="28" /><text class="d123f-mono" x="30" y="120">North 120</text>
  </g>
  <g class="d123f-rowmove d123f-rowS">
    <rect class="d123f-southrow" x="20" y="132" width="110" height="28" /><text class="d123f-mono" x="30" y="152">South 200</text>
  </g>
  <g class="d123f-rowmove d123f-rowN">
    <rect class="d123f-northrow" x="20" y="164" width="110" height="28" /><text class="d123f-mono" x="30" y="184">North 80</text>
  </g>
  <g class="d123f-rowmove d123f-rowS">
    <rect class="d123f-southrow" x="20" y="196" width="110" height="28" /><text class="d123f-mono" x="30" y="216">South 150</text>
  </g>
  <g class="d123f-rowmove d123f-rowN">
    <rect class="d123f-northrow" x="20" y="228" width="110" height="28" /><text class="d123f-mono" x="30" y="248">North 160</text>
  </g>
  <g class="d123f-rowmove d123f-rowS">
    <rect class="d123f-southrow" x="20" y="260" width="110" height="28" /><text class="d123f-mono" x="30" y="280">South 250</text>
  </g>

  <!-- Buckets -->
  <text class="d123f-label" x="330" y="90">buckets</text>
  <rect class="d123f-bucket" x="300" y="100" width="130" height="92" rx="6" />
  <text class="d123f-label" x="312" y="120">North</text>
  <text class="d123f-mono" x="312" y="140">120, 80, 160</text>
  <text class="d123f-mono" x="312" y="160">mean = 120</text>

  <rect class="d123f-bucket" x="300" y="196" width="130" height="92" rx="6" />
  <text class="d123f-label" x="312" y="216">South</text>
  <text class="d123f-mono" x="312" y="236">200, 150, 250</text>
  <text class="d123f-mono" x="312" y="256">mean = 200</text>

  <path class="d123f-wire" d="M 160 114 C 220 114, 250 146, 298 146" />
  <path class="d123f-wire" d="M 160 178 C 220 178, 250 146, 298 146" />
  <path class="d123f-wire" d="M 160 242 C 220 242, 250 146, 298 146" />
  <path class="d123f-wire" d="M 160 146 C 220 146, 250 242, 298 242" />
  <path class="d123f-wire" d="M 160 210 C 220 210, 250 242, 298 242" />
  <path class="d123f-wire" d="M 160 274 C 220 274, 250 242, 298 242" />

  <!-- agg() result: ONE row per group -->
  <text class="d123f-label" x="620" y="90">agg("mean") -- one row per group</text>
  <g transform="translate(600,100)">
    <rect class="d123f-src" x="0" y="0" width="90" height="28" fill="#e2e8f0" /><text class="d123f-mono" x="8" y="19">region</text>
    <rect class="d123f-src" x="90" y="0" width="90" height="28" fill="#e2e8f0" /><text class="d123f-mono" x="98" y="19">mean</text>
    <rect class="d123f-pulse d123f-agg" x="0" y="28" width="90" height="28" /><text class="d123f-mono" x="8" y="47">North</text>
    <rect class="d123f-pulse d123f-agg" x="90" y="28" width="90" height="28" /><text class="d123f-mono" x="98" y="47">120</text>
    <rect class="d123f-pulse d123f-agg" x="0" y="56" width="90" height="28" /><text class="d123f-mono" x="8" y="75">South</text>
    <rect class="d123f-pulse d123f-agg" x="90" y="56" width="90" height="28" /><text class="d123f-mono" x="98" y="75">200</text>
  </g>
  <text class="d123f-caption" x="600" y="200">shape: (2,) -- two groups in, two rows out</text>

  <path class="d123f-wire" d="M 432 146 C 500 146, 540 128, 598 128" />
  <path class="d123f-wire" d="M 432 242 C 500 242, 540 156, 598 156" />

  <!-- transform() result: SAME shape as the source, six rows -->
  <text class="d123f-label" x="620" y="260">transform("mean") -- every original row keeps its group's value</text>
  <g transform="translate(600,270)">
    <rect class="d123f-src" x="0" y="0" width="130" height="26" fill="#e2e8f0" /><text class="d123f-mono" x="8" y="18">group mean</text>
    <rect class="d123f-pulse d123f-transformN" x="0" y="26" width="130" height="26" /><text class="d123f-mono" x="8" y="44">120  (row 1, North)</text>
    <rect class="d123f-pulse d123f-transformS" x="0" y="52" width="130" height="26" /><text class="d123f-mono" x="8" y="70">200  (row 2, South)</text>
    <rect class="d123f-pulse d123f-transformN" x="0" y="78" width="130" height="26" /><text class="d123f-mono" x="8" y="96">120  (row 3, North)</text>
    <rect class="d123f-pulse d123f-transformS" x="0" y="104" width="130" height="26" /><text class="d123f-mono" x="8" y="122">200  (row 4, South)</text>
    <rect class="d123f-pulse d123f-transformN" x="0" y="130" width="130" height="26" /><text class="d123f-mono" x="8" y="148">120  (row 5, North)</text>
    <rect class="d123f-pulse d123f-transformS" x="0" y="156" width="130" height="26" /><text class="d123f-mono" x="8" y="174">200  (row 6, South)</text>
  </g>
  <text class="d123f-caption" x="600" y="460">shape: (6,) -- same six rows, same order, as the source</text>

  <path class="d123f-wire" d="M 432 146 C 480 146, 560 300, 598 296" />
  <path class="d123f-wire" d="M 432 242 C 480 242, 560 322, 598 322" />

  <!-- Caption -->
  <g transform="translate(28,500)">
    <rect x="0" y="0" width="984" height="80" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="6" />
    <text class="d123f-caption" x="14" y="24">agg collapses each group down to one summary row -- the result is shorter than the input. transform</text>
    <text class="d123f-caption" x="14" y="44">returns a value for every ORIGINAL row, in the original order and length, which is how a group statistic</text>
    <text class="d123f-caption" x="14" y="64">(a mean, a z-score, a percent-of-group-total) gets attached back onto the row it came from.</text>
  </g>
</svg>
