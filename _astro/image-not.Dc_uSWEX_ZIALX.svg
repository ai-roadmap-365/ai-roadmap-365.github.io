<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things this is not</title>
  <style>
    .image-not-bg   { fill: #f8fafc; }
    .image-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .image-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .image-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .image-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .image-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .image-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .image-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .image-not-row { opacity: 1; }
    .image-not-r0 { animation-delay: 0.00s; }
    .image-not-r1 { animation-delay: 0.45s; }
    .image-not-r2 { animation-delay: 0.90s; }
    .image-not-r3 { animation-delay: 1.35s; }
    .image-not-r4 { animation-delay: 1.80s; }
    .image-not-row { animation: image-not-reveal 7.3s ease-in-out infinite; }
    @keyframes image-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="image-not-bg" width="980" height="390"/>
  <text class="image-not-h1"  x="30" y="40">Four things this is not</text>
  <text class="image-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="image-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="image-not-name" x="46" y="122">The misconception</text>
  <text class="image-not-desc" x="46" y="142">Commonly held.</text>
  <text class="image-not-desc image-not-row image-not-r0" x="46" y="182">Transformation moves pixels</text>
  <text class="image-not-desc image-not-row image-not-r1" x="46" y="216">Rotating twice by 45 equals rotating once by 90</text>
  <text class="image-not-desc image-not-row image-not-r2" x="46" y="250">Translation is a linear transformation</text>
  <text class="image-not-desc image-not-row image-not-r3" x="46" y="284">Interpolation is a display detail</text>
  <text class="image-not-desc image-not-row image-not-r4" x="46" y="318">Image coordinates match mathematical ones</text>
  <rect class="image-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="image-not-name" x="526" y="122">What is true</text>
  <text class="image-not-desc" x="526" y="142">Actually.</text>
  <text class="image-not-desc image-not-row image-not-r0" x="526" y="182">It transforms coordinates; pixels are resampled</text>
  <text class="image-not-desc image-not-row image-not-r1" x="526" y="216">Two resamplings lose more detail than one</text>
  <text class="image-not-desc image-not-row image-not-r2" x="526" y="250">It needs an extra dimension to be one</text>
  <text class="image-not-desc image-not-row image-not-r3" x="526" y="284">It changes the values a model trains on</text>
  <text class="image-not-desc image-not-row image-not-r4" x="526" y="318">Rows are vertical, and often inverted</text>
  <text class="image-not-sub" x="30" y="372">The second row is the practical argument for composing matrices before applying them: each resampling step degrades the image, so fewer is better.</text>
</svg>
