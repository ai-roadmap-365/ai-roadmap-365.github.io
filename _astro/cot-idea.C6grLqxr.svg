<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why reasoning first helps</title>
  <style>
    .cot-idea-bg   { fill: #f8fafc; }
    .cot-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cot-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cot-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cot-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cot-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cot-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cot-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cot-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cot-idea-stage { opacity: 1; }

    .cot-idea-s0 { animation-delay: 0.00s; }
    .cot-idea-e0 { animation-delay: 0.00s; }
    .cot-idea-s1 { animation-delay: 1.28s; }
    .cot-idea-e1 { animation-delay: 1.28s; }
    .cot-idea-s2 { animation-delay: 2.56s; }
    .cot-idea-e2 { animation-delay: 2.56s; }
    .cot-idea-s3 { animation-delay: 3.84s; }
    .cot-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cot-idea-conn  { animation: cot-idea-trace 6.4s ease-in-out infinite; }
      .cot-idea-stage { animation: cot-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cot-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cot-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cot-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cot-idea-stage { animation: cot-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cot-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cot-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cot-idea-bg" width="980" height="322"/>
  <text class="cot-idea-h1"  x="30" y="40">Why reasoning first helps</text>
  <text class="cot-idea-sub" x="30" y="64">Four steps.</text>
  <g class="cot-idea-stage cot-idea-s0">
    <rect class="cot-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cot-idea-step" x="44" y="142">01</text>
    <text class="cot-idea-name" x="70" y="142">Asked directly, the model answers immediately</text>
    <text class="cot-idea-desc" x="44" y="166">With one pass of computation per</text>
    <text class="cot-idea-desc" x="44" y="182">token.</text>
  </g>
  <line class="cot-idea-line cot-idea-conn cot-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cot-idea-tip)"/>
  <g class="cot-idea-stage cot-idea-s1">
    <rect class="cot-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cot-idea-step" x="280" y="142">02</text>
    <text class="cot-idea-name" x="306" y="142">Which is not enough for a multi-step problem</text>
    <text class="cot-idea-desc" x="280" y="166">There is nowhere to do the</text>
    <text class="cot-idea-desc" x="280" y="182">intermediate work.</text>
  </g>
  <line class="cot-idea-line cot-idea-conn cot-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cot-idea-tip)"/>
  <g class="cot-idea-stage cot-idea-s2">
    <rect class="cot-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cot-idea-step" x="516" y="142">03</text>
    <text class="cot-idea-name" x="542" y="142">Ask for the steps first</text>
    <text class="cot-idea-desc" x="516" y="166">Each written step becomes</text>
    <text class="cot-idea-desc" x="516" y="182">context for the next.</text>
  </g>
  <line class="cot-idea-line cot-idea-conn cot-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cot-idea-tip)"/>
  <g class="cot-idea-stage cot-idea-s3">
    <rect class="cot-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cot-idea-step" x="752" y="142">04</text>
    <text class="cot-idea-name" x="778" y="142">And accuracy rises substantially</text>
    <text class="cot-idea-desc" x="752" y="166">On arithmetic, logic and</text>
    <text class="cot-idea-desc" x="752" y="182">multi-step reasoning.</text>
  </g>
  <text class="cot-idea-sub" x="30" y="304">The mechanism is computational rather than cognitive: writing the steps gives the model more forward passes to spend on the problem, which it otherwise has no way to obtain.</text>
</svg>
