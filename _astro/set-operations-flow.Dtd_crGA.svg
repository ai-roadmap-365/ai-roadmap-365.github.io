<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" font-family="system-ui, sans-serif">
  <title>Set operations on two example sets A and B — union, intersection, difference, and symmetric difference, with each result listed</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Set algebra on two example sets</text>

  <!-- The two sets as overlapping circles -->
  <text x="410" y="66" text-anchor="middle" font-size="15" fill="#1a202c">A = {apple, banana, cherry}   B = {banana, cherry, date}</text>

  <circle cx="330" cy="200" r="110" fill="#dbeafe" fill-opacity="0.7" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="490" cy="200" r="110" fill="#e0e7ff" fill-opacity="0.7" stroke="#1d4ed8" stroke-width="2"/>
  <text x="250" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">A</text>
  <text x="570" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">B</text>

  <!-- A-only -->
  <text x="268" y="205" text-anchor="middle" font-size="14" fill="#1a202c">apple</text>
  <!-- overlap -->
  <text x="410" y="188" text-anchor="middle" font-size="14" fill="#1a202c">banana</text>
  <text x="410" y="214" text-anchor="middle" font-size="14" fill="#1a202c">cherry</text>
  <!-- B-only -->
  <text x="552" y="205" text-anchor="middle" font-size="14" fill="#1a202c">date</text>

  <text x="410" y="330" text-anchor="middle" font-size="13" fill="#1a202c">the overlap holds items in BOTH sets</text>

  <!-- Four operation result boxes -->
  <rect x="40" y="366" width="360" height="80" fill="#ffffff" stroke="#166534" stroke-width="2" rx="6"/>
  <text x="58" y="392" font-size="15" font-weight="bold" fill="#1a202c">Union   A | B</text>
  <text x="58" y="414" font-size="14" fill="#1a202c">everything, no duplicates:</text>
  <text x="58" y="434" font-size="14" fill="#1d4ed8">apple, banana, cherry, date</text>

  <rect x="420" y="366" width="360" height="80" fill="#ffffff" stroke="#166534" stroke-width="2" rx="6"/>
  <text x="438" y="392" font-size="15" font-weight="bold" fill="#1a202c">Intersection   A &amp; B</text>
  <text x="438" y="414" font-size="14" fill="#1a202c">only items in both:</text>
  <text x="438" y="434" font-size="14" fill="#1d4ed8">banana, cherry</text>

  <rect x="40" y="458" width="360" height="80" fill="#ffffff" stroke="#166534" stroke-width="2" rx="6"/>
  <text x="58" y="484" font-size="15" font-weight="bold" fill="#1a202c">Difference   A - B</text>
  <text x="58" y="506" font-size="14" fill="#1a202c">in A but not B:</text>
  <text x="58" y="526" font-size="14" fill="#1d4ed8">apple</text>

  <rect x="420" y="458" width="360" height="80" fill="#ffffff" stroke="#166534" stroke-width="2" rx="6"/>
  <text x="438" y="484" font-size="15" font-weight="bold" fill="#1a202c">Symmetric difference   A ^ B</text>
  <text x="438" y="506" font-size="14" fill="#1a202c">in exactly one, not both:</text>
  <text x="438" y="526" font-size="14" fill="#1d4ed8">apple, date</text>
</svg>
