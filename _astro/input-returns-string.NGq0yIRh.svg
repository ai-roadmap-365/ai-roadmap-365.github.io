<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Even when the user typed a number.">
  <title>input() always returns a string</title>
  <style>
    .input-returns-string-bg   { fill: #f8fafc; }
    .input-returns-string-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .input-returns-string-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .input-returns-string-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .input-returns-string-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .input-returns-string-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .input-returns-string-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .input-returns-string-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .input-returns-string-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .input-returns-string-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .input-returns-string-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .input-returns-string-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .input-returns-string-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .input-returns-string-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .input-returns-string-stage { opacity: 1; }

    .input-returns-string-s0 { animation-delay: 0.00s; }
    .input-returns-string-e0 { animation-delay: 0.00s; }
    .input-returns-string-s1 { animation-delay: 1.28s; }
    .input-returns-string-e1 { animation-delay: 1.28s; }
    .input-returns-string-s2 { animation-delay: 2.56s; }
    .input-returns-string-e2 { animation-delay: 2.56s; }
    .input-returns-string-s3 { animation-delay: 3.84s; }
    .input-returns-string-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .input-returns-string-conn  { animation: input-returns-string-trace 6.4s ease-in-out infinite; }
      .input-returns-string-stage { animation: input-returns-string-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes input-returns-string-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes input-returns-string-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .input-returns-string-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .input-returns-string-stage { animation: input-returns-string-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes input-returns-string-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="input-returns-string-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="input-returns-string-bg" width="980" height="322"/>
  <text class="input-returns-string-h1"  x="30" y="40">input() always returns a string</text>
  <text class="input-returns-string-sub" x="30" y="64">Even when the user typed a number.</text>
  <g class="input-returns-string-stage input-returns-string-s0">
    <rect class="input-returns-string-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="input-returns-string-step" x="44" y="142">01</text>
    <text class="input-returns-string-name" x="70" y="142">input() gives you text</text>
    <text class="input-returns-string-desc" x="44" y="166">"42" is a str. Always, whatever</text>
    <text class="input-returns-string-desc" x="44" y="182">was typed.</text>
    <text class="input-returns-string-edge" x="44" y="242">str</text>
  </g>
  <line class="input-returns-string-line input-returns-string-conn input-returns-string-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#input-returns-string-tip)"/>
  <g class="input-returns-string-stage input-returns-string-s1">
    <rect class="input-returns-string-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="input-returns-string-step" x="280" y="142">02</text>
    <text class="input-returns-string-name" x="306" y="142">So arithmetic surprises you</text>
    <text class="input-returns-string-desc" x="280" y="166">input() + 1 raises; input() * 2</text>
    <text class="input-returns-string-desc" x="280" y="182">duplicates the text.</text>
  </g>
  <line class="input-returns-string-line input-returns-string-conn input-returns-string-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#input-returns-string-tip)"/>
  <g class="input-returns-string-stage input-returns-string-s2">
    <rect class="input-returns-string-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="input-returns-string-step" x="516" y="142">03</text>
    <text class="input-returns-string-name" x="542" y="142">Convert explicitly</text>
    <text class="input-returns-string-desc" x="516" y="166">int(input()) or float(input()).</text>
    <text class="input-returns-string-desc" x="516" y="182">Now it is a number.</text>
  </g>
  <line class="input-returns-string-line input-returns-string-conn input-returns-string-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#input-returns-string-tip)"/>
  <g class="input-returns-string-stage input-returns-string-s3">
    <rect class="input-returns-string-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="input-returns-string-step" x="752" y="142">04</text>
    <text class="input-returns-string-name" x="778" y="142">And handle the failure</text>
    <text class="input-returns-string-desc" x="752" y="166">"abc" raises ValueError. A</text>
    <text class="input-returns-string-desc" x="752" y="182">program that must not crash</text>
    <text class="input-returns-string-desc" x="752" y="198">needs try/except.</text>
    <text class="input-returns-string-edge" x="752" y="242">try</text>
  </g>
  <text class="input-returns-string-sub" x="30" y="304">sys.argv works the same way: command-line arguments are strings too, so a script taking a numeric option has exactly this conversion to do, and exactly this failure to handle.</text>
</svg>
