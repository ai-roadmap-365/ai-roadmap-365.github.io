<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two managers, one directory, no agreement.">
  <title>Why sudo pip causes trouble later</title>
  <style>
    .sudo-pip-bg   { fill: #f8fafc; }
    .sudo-pip-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sudo-pip-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sudo-pip-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sudo-pip-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sudo-pip-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sudo-pip-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sudo-pip-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sudo-pip-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sudo-pip-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sudo-pip-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sudo-pip-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sudo-pip-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sudo-pip-row { opacity: 1; }
    .sudo-pip-r0 { animation-delay: 0.00s; }
    .sudo-pip-r1 { animation-delay: 0.45s; }
    .sudo-pip-r2 { animation-delay: 0.90s; }
    .sudo-pip-r3 { animation-delay: 1.35s; }
    .sudo-pip-r4 { animation-delay: 1.80s; }
    .sudo-pip-row { animation: sudo-pip-reveal 7.3s ease-in-out infinite; }
    @keyframes sudo-pip-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sudo-pip-bg" width="980" height="390"/>
  <text class="sudo-pip-h1"  x="30" y="40">Why sudo pip causes trouble later</text>
  <text class="sudo-pip-sub" x="30" y="64">Two managers, one directory, no agreement.</text>
  <rect class="sudo-pip-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sudo-pip-name" x="46" y="122">sudo pip install</text>
  <text class="sudo-pip-desc" x="46" y="142">Into the system's directories.</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r0" x="46" y="182">Writes where the OS package manager believes it owns files</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r1" x="46" y="216">A system update may overwrite it, or break</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r2" x="46" y="250">Two managers with different records of the same files</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r3" x="46" y="284">Affects every project on the machine</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r4" x="46" y="318">Hard to undo cleanly</text>
  <rect class="sudo-pip-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sudo-pip-name" x="526" y="122">A virtual environment</text>
  <text class="sudo-pip-desc" x="526" y="142">Into a directory you own.</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r0" x="526" y="182">No elevated privileges needed at all</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r1" x="526" y="216">The system manager never sees it</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r2" x="526" y="250">One environment per project</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r3" x="526" y="284">Delete the directory to undo it entirely</text>
  <text class="sudo-pip-desc sudo-pip-row sudo-pip-r4" x="526" y="318">And PATH does the rest, per Day 11</text>
  <text class="sudo-pip-sub" x="30" y="372">The damage is deferred, which is what makes it a trap: sudo pip works immediately, and the conflict surfaces weeks later during an unrelated system update.</text>
</svg>
