<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each closed part of the gap.">
  <title>Four attempts at keeping docs true</title>
  <style>
    .docs-eras-bg   { fill: #f8fafc; }
    .docs-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docs-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .docs-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .docs-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .docs-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .docs-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .docs-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .docs-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .docs-eras-stage { opacity: 1; }

    .docs-eras-s0 { animation-delay: 0.00s; }
    .docs-eras-e0 { animation-delay: 0.00s; }
    .docs-eras-s1 { animation-delay: 1.28s; }
    .docs-eras-e1 { animation-delay: 1.28s; }
    .docs-eras-s2 { animation-delay: 2.56s; }
    .docs-eras-e2 { animation-delay: 2.56s; }
    .docs-eras-s3 { animation-delay: 3.84s; }
    .docs-eras-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .docs-eras-conn  { animation: docs-eras-trace 6.4s ease-in-out infinite; }
      .docs-eras-stage { animation: docs-eras-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes docs-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes docs-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .docs-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .docs-eras-stage { animation: docs-eras-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes docs-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="docs-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="docs-eras-bg" width="980" height="322"/>
  <text class="docs-eras-h1"  x="30" y="40">Four attempts at keeping docs true</text>
  <text class="docs-eras-sub" x="30" y="64">Each closed part of the gap.</text>
  <g class="docs-eras-stage docs-eras-s0">
    <rect class="docs-eras-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="docs-eras-step" x="44" y="142">01</text>
    <text class="docs-eras-name" x="70" y="142">Literate programming, 1984</text>
    <text class="docs-eras-desc" x="44" y="166">Knuth: explanation and</text>
    <text class="docs-eras-desc" x="44" y="182">implementation as one artefact.</text>
    <text class="docs-eras-desc" x="44" y="198">Separation permits divergence.</text>
  </g>
  <line class="docs-eras-line docs-eras-conn docs-eras-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#docs-eras-tip)"/>
  <g class="docs-eras-stage docs-eras-s1">
    <rect class="docs-eras-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="docs-eras-step" x="280" y="142">02</text>
    <text class="docs-eras-name" x="306" y="142">Docs as code, 2010s</text>
    <text class="docs-eras-desc" x="280" y="166">In the repository, reviewed in</text>
    <text class="docs-eras-desc" x="280" y="182">pull requests. Reviewable, not</text>
    <text class="docs-eras-desc" x="280" y="198">verifiable.</text>
  </g>
  <line class="docs-eras-line docs-eras-conn docs-eras-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#docs-eras-tip)"/>
  <g class="docs-eras-stage docs-eras-s2">
    <rect class="docs-eras-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="docs-eras-step" x="516" y="142">03</text>
    <text class="docs-eras-name" x="542" y="142">Doctests</text>
    <text class="docs-eras-desc" x="516" y="166">Run the examples. Excellent</text>
    <text class="docs-eras-desc" x="516" y="182">where they apply; covers code,</text>
    <text class="docs-eras-desc" x="516" y="198">not commands.</text>
    <text class="docs-eras-edge" x="516" y="242">verified</text>
  </g>
  <line class="docs-eras-line docs-eras-conn docs-eras-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#docs-eras-tip)"/>
  <g class="docs-eras-stage docs-eras-s3">
    <rect class="docs-eras-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="docs-eras-step" x="752" y="142">04</text>
    <text class="docs-eras-name" x="778" y="142">README conventions</text>
    <text class="docs-eras-desc" x="752" y="166">A familiar shape, so readers</text>
    <text class="docs-eras-desc" x="752" y="182">know where to look. Nothing</text>
    <text class="docs-eras-desc" x="752" y="198">about accuracy.</text>
    <text class="docs-eras-edge" x="752" y="242">shape only</text>
  </g>
  <text class="docs-eras-sub" x="30" y="304">The gap the third row leaves is exactly what today's checker fills: commands, claimed outputs and stated limitations are claims about behaviour that no doctest is positioned to run.</text>
</svg>
