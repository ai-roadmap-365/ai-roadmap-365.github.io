<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Missing Data Taxonomy Diagram">
  <title>Donald Rubin's Missing Data Taxonomy</title>
  <defs>
    <style>
      .d174a-bg { fill: #f8fafc; }
      .d174a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d174a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d174a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d174a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d174a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d174a-bg" />

  <text x="40" y="45" class="d174a-header" font-size="22">Donald Rubin's Missing Data Taxonomy (1976)</text>
  <text x="40" y="70" class="d174a-text" font-size="13">Understanding the Mathematical Mechanisms of Missingness: MCAR vs MAR vs MNAR</text>

  <!-- 1. MCAR -->
  <rect x="40" y="100" width="260" height="340" class="d174a-box" fill="#eff6ff" stroke="#3b82f6" />
  <text x="60" y="130" class="d174a-title" fill="#1d4ed8">1. MCAR (Completely Random)</text>
  <text x="60" y="155" class="d174a-math">P(M | Y_obs, Y_mis) = P(M)</text>
  <line x1="60" y1="175" x2="280" y2="175" stroke="#93c5fd" stroke-width="1.5" />

  <text x="60" y="200" class="d174a-text"><tspan font-weight="700">Mechanism:</tspan> Pure chance event.</text>
  <text x="60" y="220" class="d174a-text">• Lab test tube dropped randomly.</text>
  <text x="60" y="240" class="d174a-text">• Sensor battery glitch.</text>
  <text x="60" y="270" class="d174a-text"><tspan font-weight="700">Deletion Bias:</tspan> Zero bias (Unbiased).</text>
  <text x="60" y="295" class="d174a-text">• Listwise deletion reduces N,</text>
  <text x="60" y="315" class="d174a-text">  but retains true mean.</text>
  <text x="60" y="355" class="d174a-math" fill="#1d4ed8">Fix: Mean / Median Imputer</text>

  <!-- 2. MAR -->
  <rect x="320" y="100" width="260" height="340" class="d174a-box" fill="#fefce8" stroke="#eab308" />
  <text x="340" y="130" class="d174a-title" fill="#a16207">2. MAR (Missing at Random)</text>
  <text x="340" y="155" class="d174a-math">P(M | Y_obs, Y_mis) = P(M | Y_obs)</text>
  <line x1="340" y1="175" x2="560" y2="175" stroke="#fde047" stroke-width="1.5" />

  <text x="340" y="200" class="d174a-text"><tspan font-weight="700">Mechanism:</tspan> Depends on observed X.</text>
  <text x="340" y="220" class="d174a-text">• Younger patients less likely to</text>
  <text x="340" y="240" class="d174a-text">  take cholesterol test (Age known!).</text>
  <text x="340" y="270" class="d174a-text"><tspan font-weight="700">Deletion Bias:</tspan> Severe bias!</text>
  <text x="340" y="295" class="d174a-text">• Dropping missing rows skews</text>
  <text x="340" y="315" class="d174a-text">  sample towards older people.</text>
  <text x="340" y="355" class="d174a-math" fill="#a16207">Fix: KNNImputer / MICE</text>

  <!-- 3. MNAR -->
  <rect x="600" y="100" width="260" height="340" class="d174a-box" fill="#fef2f2" stroke="#ef4444" />
  <text x="620" y="130" class="d174a-title" fill="#b91c1c">3. MNAR (Not at Random)</text>
  <text x="620" y="155" class="d174a-math">P(M) depends on Y_mis itself</text>
  <line x1="620" y1="175" x2="840" y2="175" stroke="#fca5a5" stroke-width="1.5" />

  <text x="620" y="200" class="d174a-text"><tspan font-weight="700">Mechanism:</tspan> Informative Missingness.</text>
  <text x="620" y="220" class="d174a-text">• Wealthy individuals refuse to</text>
  <text x="620" y="240" class="d174a-text">  disclose high income.</text>
  <text x="620" y="270" class="d174a-text"><tspan font-weight="700">Deletion Bias:</tspan> Fatal truncation.</text>
  <text x="620" y="295" class="d174a-text">• Missingness itself is a strong</text>
  <text x="620" y="315" class="d174a-text">  predictive feature signal!</text>
  <text x="620" y="355" class="d174a-math" fill="#b91c1c">Fix: MissingIndicator + GBDT</text>
</svg>
