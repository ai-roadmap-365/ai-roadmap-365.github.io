<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Immutability, with a cost attached.">
  <title>Why building a string in a loop is slow</title>
  <style>
    .join-not-plus-bg   { fill: #f8fafc; }
    .join-not-plus-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-plus-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-plus-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-plus-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-plus-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-plus-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .join-not-plus-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .join-not-plus-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .join-not-plus-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .join-not-plus-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .join-not-plus-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .join-not-plus-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .join-not-plus-row { opacity: 1; }
    .join-not-plus-r0 { animation-delay: 0.00s; }
    .join-not-plus-r1 { animation-delay: 0.45s; }
    .join-not-plus-r2 { animation-delay: 0.90s; }
    .join-not-plus-r3 { animation-delay: 1.35s; }
    .join-not-plus-r4 { animation-delay: 1.80s; }
    .join-not-plus-row { animation: join-not-plus-reveal 7.3s ease-in-out infinite; }
    @keyframes join-not-plus-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="join-not-plus-bg" width="980" height="390"/>
  <text class="join-not-plus-h1"  x="30" y="40">Why building a string in a loop is slow</text>
  <text class="join-not-plus-sub" x="30" y="64">Immutability, with a cost attached.</text>
  <rect class="join-not-plus-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="join-not-plus-name" x="46" y="122">s += part, in a loop</text>
  <text class="join-not-plus-desc" x="46" y="142">A new string every iteration.</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r0" x="46" y="182">Strings are immutable — nothing is appended</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r1" x="46" y="216">Each step COPIES everything so far</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r2" x="46" y="250">10,000 parts means 10,000 copies</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r3" x="46" y="284">Total work grows with the square</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r4" x="46" y="318">Fine for three pieces; ruinous for many</text>
  <rect class="join-not-plus-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="join-not-plus-name" x="526" y="122">"".join(parts)</text>
  <text class="join-not-plus-desc" x="526" y="142">One allocation.</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r0" x="526" y="182">Collect the pieces in a list first</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r1" x="526" y="216">join measures the total, allocates once</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r2" x="526" y="250">Copies each piece exactly once</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r3" x="526" y="284">Total work grows linearly</text>
  <text class="join-not-plus-desc join-not-plus-row join-not-plus-r4" x="526" y="318">The idiom, for exactly this reason</text>
  <text class="join-not-plus-sub" x="30" y="372">This is immutability's one real cost, and the language gives you the answer in the standard library. It is the most common Python performance mistake, and it is invisible until the input gets large.</text>
</svg>
