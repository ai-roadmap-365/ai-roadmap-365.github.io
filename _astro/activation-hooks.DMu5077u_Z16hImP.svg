<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Hooks, and what to look for.">
  <title>Watching activations without editing the model</title>
  <style>
    .activation-hooks-bg   { fill: #f8fafc; }
    .activation-hooks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-hooks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-hooks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-hooks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-hooks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-hooks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .activation-hooks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .activation-hooks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .activation-hooks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .activation-hooks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .activation-hooks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .activation-hooks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .activation-hooks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .activation-hooks-stage { opacity: 1; }

    .activation-hooks-s0 { animation-delay: 0.00s; }
    .activation-hooks-e0 { animation-delay: 0.00s; }
    .activation-hooks-s1 { animation-delay: 1.28s; }
    .activation-hooks-e1 { animation-delay: 1.28s; }
    .activation-hooks-s2 { animation-delay: 2.56s; }
    .activation-hooks-e2 { animation-delay: 2.56s; }
    .activation-hooks-s3 { animation-delay: 3.84s; }
    .activation-hooks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .activation-hooks-conn  { animation: activation-hooks-trace 6.4s ease-in-out infinite; }
      .activation-hooks-stage { animation: activation-hooks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes activation-hooks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes activation-hooks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .activation-hooks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .activation-hooks-stage { animation: activation-hooks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes activation-hooks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="activation-hooks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="activation-hooks-bg" width="980" height="322"/>
  <text class="activation-hooks-h1"  x="30" y="40">Watching activations without editing the model</text>
  <text class="activation-hooks-sub" x="30" y="64">Hooks, and what to look for.</text>
  <g class="activation-hooks-stage activation-hooks-s0">
    <rect class="activation-hooks-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="activation-hooks-step" x="44" y="142">01</text>
    <text class="activation-hooks-name" x="70" y="142">Attach a hook per layer</text>
    <text class="activation-hooks-desc" x="44" y="166">A callback receiving inputs and</text>
    <text class="activation-hooks-desc" x="44" y="182">outputs, without touching the</text>
    <text class="activation-hooks-desc" x="44" y="198">forward method.</text>
  </g>
  <line class="activation-hooks-line activation-hooks-conn activation-hooks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#activation-hooks-tip)"/>
  <g class="activation-hooks-stage activation-hooks-s1">
    <rect class="activation-hooks-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="activation-hooks-step" x="280" y="142">02</text>
    <text class="activation-hooks-name" x="306" y="142">Watch for dead units</text>
    <text class="activation-hooks-desc" x="280" y="166">A ReLU output that is zero for</text>
    <text class="activation-hooks-desc" x="280" y="182">every input has stopped</text>
    <text class="activation-hooks-desc" x="280" y="198">contributing.</text>
  </g>
  <line class="activation-hooks-line activation-hooks-conn activation-hooks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#activation-hooks-tip)"/>
  <g class="activation-hooks-stage activation-hooks-s2">
    <rect class="activation-hooks-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="activation-hooks-step" x="516" y="142">03</text>
    <text class="activation-hooks-name" x="542" y="142">Watch for saturation</text>
    <text class="activation-hooks-desc" x="516" y="166">Activations pinned at the</text>
    <text class="activation-hooks-desc" x="516" y="182">extremes mean near-zero</text>
    <text class="activation-hooks-desc" x="516" y="198">gradients.</text>
  </g>
  <line class="activation-hooks-line activation-hooks-conn activation-hooks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#activation-hooks-tip)"/>
  <g class="activation-hooks-stage activation-hooks-s3">
    <rect class="activation-hooks-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="activation-hooks-step" x="752" y="142">04</text>
    <text class="activation-hooks-name" x="778" y="142">And for collapse</text>
    <text class="activation-hooks-desc" x="752" y="166">Every sample producing the same</text>
    <text class="activation-hooks-desc" x="752" y="182">representation. Nothing has been</text>
    <text class="activation-hooks-desc" x="752" y="198">learned.</text>
  </g>
  <text class="activation-hooks-sub" x="30" y="304">Representation collapse is worth watching for explicitly because the loss can look reasonable while it happens: a model that outputs the majority class confidently has a plausible loss and no useful features.</text>
</svg>
