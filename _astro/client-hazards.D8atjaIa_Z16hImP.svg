<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Descriptors, collisions and cancellation.">
  <title>Three operational hazards</title>
  <style>
    .client-hazards-bg   { fill: #f8fafc; }
    .client-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .client-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .client-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .client-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .client-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .client-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .client-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .client-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .client-hazards-stage { opacity: 1; }

    .client-hazards-s0 { animation-delay: 0.00s; }
    .client-hazards-e0 { animation-delay: 0.00s; }
    .client-hazards-s1 { animation-delay: 1.50s; }
    .client-hazards-e1 { animation-delay: 1.50s; }
    .client-hazards-s2 { animation-delay: 3.00s; }
    .client-hazards-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .client-hazards-conn  { animation: client-hazards-trace 6s ease-in-out infinite; }
      .client-hazards-stage { animation: client-hazards-arrive 6s ease-in-out infinite; }
    }
    @keyframes client-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes client-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .client-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .client-hazards-stage { animation: client-hazards-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes client-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="client-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="client-hazards-bg" width="980" height="322"/>
  <text class="client-hazards-h1"  x="30" y="40">Three operational hazards</text>
  <text class="client-hazards-sub" x="30" y="64">Descriptors, collisions and cancellation.</text>
  <g class="client-hazards-stage client-hazards-s0">
    <rect class="client-hazards-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="client-hazards-step" x="44" y="142">01</text>
    <text class="client-hazards-name" x="70" y="142">Pipe exhaustion</text>
    <text class="client-hazards-desc" x="44" y="166">Open file descriptors are limited. Pool</text>
    <text class="client-hazards-desc" x="44" y="182">connections and close unused pipes.</text>
  </g>
  <line class="client-hazards-line client-hazards-conn client-hazards-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#client-hazards-tip)"/>
  <g class="client-hazards-stage client-hazards-s1">
    <rect class="client-hazards-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="client-hazards-step" x="359" y="142">02</text>
    <text class="client-hazards-name" x="385" y="142">Tool name collisions</text>
    <text class="client-hazards-desc" x="359" y="166">Two servers exposing `search`. Namespace</text>
    <text class="client-hazards-desc" x="359" y="182">them: db__search, web__search.</text>
  </g>
  <line class="client-hazards-line client-hazards-conn client-hazards-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#client-hazards-tip)"/>
  <g class="client-hazards-stage client-hazards-s2">
    <rect class="client-hazards-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="client-hazards-step" x="674" y="142">03</text>
    <text class="client-hazards-name" x="700" y="142">Cancellation must propagate</text>
    <text class="client-hazards-desc" x="674" y="166">A JSON-RPC cancellation, so the server frees</text>
    <text class="client-hazards-desc" x="674" y="182">the worker.</text>
  </g>
  <text class="client-hazards-sub" x="30" y="304">Without the third, a cancelled request leaves a server crawling a site nobody is waiting for, which consumes a worker slot and eventually starves the pool while everything looks healthy.</text>
</svg>
