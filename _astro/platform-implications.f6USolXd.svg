<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a business alert.">
  <title>Four consequences of running a platform</title>
  <style>
    .platform-implications-bg   { fill: #f8fafc; }
    .platform-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .platform-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .platform-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .platform-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .platform-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .platform-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .platform-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .platform-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .platform-implications-stage { opacity: 1; }

    .platform-implications-s0 { animation-delay: 0.00s; }
    .platform-implications-e0 { animation-delay: 0.00s; }
    .platform-implications-s1 { animation-delay: 1.28s; }
    .platform-implications-e1 { animation-delay: 1.28s; }
    .platform-implications-s2 { animation-delay: 2.56s; }
    .platform-implications-e2 { animation-delay: 2.56s; }
    .platform-implications-s3 { animation-delay: 3.84s; }
    .platform-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .platform-implications-conn  { animation: platform-implications-trace 6.4s ease-in-out infinite; }
      .platform-implications-stage { animation: platform-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes platform-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes platform-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .platform-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .platform-implications-stage { animation: platform-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes platform-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="platform-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="platform-implications-bg" width="980" height="322"/>
  <text class="platform-implications-h1"  x="30" y="40">Four consequences of running a platform</text>
  <text class="platform-implications-sub" x="30" y="64">One is a business alert.</text>
  <g class="platform-implications-stage platform-implications-s0">
    <rect class="platform-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="platform-implications-step" x="44" y="142">01</text>
    <text class="platform-implications-name" x="70" y="142">Verify signatures at admission</text>
    <text class="platform-implications-desc" x="44" y="166">An unsigned image never starts.</text>
    <text class="platform-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="platform-implications-line platform-implications-conn platform-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#platform-implications-tip)"/>
  <g class="platform-implications-stage platform-implications-s1">
    <rect class="platform-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="platform-implications-step" x="280" y="142">02</text>
    <text class="platform-implications-name" x="306" y="142">Alert on tenant gross margin</text>
    <text class="platform-implications-desc" x="280" y="166">Token cost above 30% of the</text>
    <text class="platform-implications-desc" x="280" y="182">subscription notifies customer</text>
    <text class="platform-implications-desc" x="280" y="198">success.</text>
    <text class="platform-implications-edge" x="280" y="242">economics</text>
  </g>
  <line class="platform-implications-line platform-implications-conn platform-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#platform-implications-tip)"/>
  <g class="platform-implications-stage platform-implications-s2">
    <rect class="platform-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="platform-implications-step" x="516" y="142">03</text>
    <text class="platform-implications-name" x="542" y="142">Failover in seconds, not minutes</text>
    <text class="platform-implications-desc" x="516" y="166">Because the second region was</text>
    <text class="platform-implications-desc" x="516" y="182">already serving.</text>
  </g>
  <line class="platform-implications-line platform-implications-conn platform-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#platform-implications-tip)"/>
  <g class="platform-implications-stage platform-implications-s3">
    <rect class="platform-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="platform-implications-step" x="752" y="142">04</text>
    <text class="platform-implications-name" x="778" y="142">Alert to log record in one hop</text>
    <text class="platform-implications-desc" x="752" y="166">The trace ID makes diagnosis a</text>
    <text class="platform-implications-desc" x="752" y="182">query rather than an</text>
    <text class="platform-implications-desc" x="752" y="198">investigation.</text>
  </g>
  <text class="platform-implications-sub" x="30" y="304">The margin alert is unusual and worth copying: it is a technical metric routed to a commercial team, and it catches the customer whose usage pattern is quietly making them unprofitable.</text>
</svg>
