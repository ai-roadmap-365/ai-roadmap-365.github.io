<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And both are worth doing.">
  <title>Faster and cheaper are different jobs</title>
  <style>
    .faster-or-cheaper-bg   { fill: #f8fafc; }
    .faster-or-cheaper-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faster-or-cheaper-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faster-or-cheaper-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faster-or-cheaper-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faster-or-cheaper-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faster-or-cheaper-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .faster-or-cheaper-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .faster-or-cheaper-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .faster-or-cheaper-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .faster-or-cheaper-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .faster-or-cheaper-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .faster-or-cheaper-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .faster-or-cheaper-row { opacity: 1; }
    .faster-or-cheaper-r0 { animation-delay: 0.00s; }
    .faster-or-cheaper-r1 { animation-delay: 0.45s; }
    .faster-or-cheaper-r2 { animation-delay: 0.90s; }
    .faster-or-cheaper-r3 { animation-delay: 1.35s; }
    .faster-or-cheaper-r4 { animation-delay: 1.80s; }
    .faster-or-cheaper-row { animation: faster-or-cheaper-reveal 7.3s ease-in-out infinite; }
    @keyframes faster-or-cheaper-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="faster-or-cheaper-bg" width="980" height="390"/>
  <text class="faster-or-cheaper-h1"  x="30" y="40">Faster and cheaper are different jobs</text>
  <text class="faster-or-cheaper-sub" x="30" y="64">And both are worth doing.</text>
  <rect class="faster-or-cheaper-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="faster-or-cheaper-name" x="46" y="122">Faster</text>
  <text class="faster-or-cheaper-desc" x="46" y="142">Shorten the critical path.</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r0" x="46" y="182">Cache the slow job on the path</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r1" x="46" y="216">Split it into parallel pieces</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r2" x="46" y="250">Move it off the path entirely</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r3" x="46" y="284">install 4.5 -&gt; 0.8 min</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r4" x="46" y="318">wall 12.7 -&gt; 9.0 min, every run</text>
  <rect class="faster-or-cheaper-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="faster-or-cheaper-name" x="526" y="122">Cheaper</text>
  <text class="faster-or-cheaper-desc" x="526" y="142">Remove work anywhere.</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r0" x="526" y="182">Delete the job that never fails</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r1" x="526" y="216">Trim a matrix that expands one job into twelve</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r2" x="526" y="250">Saves 5.5 runner minutes</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r3" x="526" y="284">Saves 0.0 minutes of waiting</text>
  <text class="faster-or-cheaper-desc faster-or-cheaper-row faster-or-cheaper-r4" x="526" y="318">Real money, and not the complaint</text>
  <text class="faster-or-cheaper-sub" x="30" y="372">Both columns are legitimate work. The failure is answering the left-hand complaint with a right-hand change and being surprised that the pipeline still feels slow.</text>
</svg>
