<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="1.17x against 3.97x.">
  <title>The famous win and the large one</title>
  <style>
    .famous-versus-large-bg   { fill: #f8fafc; }
    .famous-versus-large-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .famous-versus-large-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .famous-versus-large-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .famous-versus-large-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .famous-versus-large-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .famous-versus-large-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .famous-versus-large-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .famous-versus-large-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .famous-versus-large-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .famous-versus-large-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .famous-versus-large-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .famous-versus-large-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .famous-versus-large-row { opacity: 1; }
    .famous-versus-large-r0 { animation-delay: 0.00s; }
    .famous-versus-large-r1 { animation-delay: 0.45s; }
    .famous-versus-large-r2 { animation-delay: 0.90s; }
    .famous-versus-large-r3 { animation-delay: 1.35s; }
    .famous-versus-large-r4 { animation-delay: 1.80s; }
    .famous-versus-large-row { animation: famous-versus-large-reveal 7.3s ease-in-out infinite; }
    @keyframes famous-versus-large-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="famous-versus-large-bg" width="980" height="390"/>
  <text class="famous-versus-large-h1"  x="30" y="40">The famous win and the large one</text>
  <text class="famous-versus-large-sub" x="30" y="64">1.17x against 3.97x.</text>
  <rect class="famous-versus-large-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="famous-versus-large-name" x="46" y="122">Multi-stage</text>
  <text class="famous-versus-large-desc" x="46" y="142">21128 -&gt; 18053 MB.</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r0" x="46" y="182">3,075 MB saved</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r1" x="46" y="216">1.17x smaller</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r2" x="46" y="250">The advice every guide gives</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r3" x="46" y="284">Correct, and worth doing</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r4" x="46" y="318">The smaller half</text>
  <rect class="famous-versus-large-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="famous-versus-large-name" x="526" y="122">Mount the weights</text>
  <text class="famous-versus-large-desc" x="526" y="142">18053 -&gt; 4553 MB.</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r0" x="526" y="182">13,500 MB saved</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r1" x="526" y="216">3.97x smaller</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r2" x="526" y="250">Mentioned by almost nobody</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r3" x="526" y="284">Decouples two lifecycles</text>
  <text class="famous-versus-large-desc famous-versus-large-row famous-versus-large-r4" x="526" y="318">The larger half</text>
  <text class="famous-versus-large-sub" x="30" y="372">Doing only the famous one leaves you with a correctly written 18 GB Dockerfile and the belief that you have finished — which is the specific failure this lesson exists to prevent.</text>
</svg>
