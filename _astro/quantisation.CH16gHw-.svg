<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Smaller weights, same behaviour.">
  <title>Post-training quantisation</title>
  <style>
    .quantisation-bg   { fill: #f8fafc; }
    .quantisation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quantisation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quantisation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quantisation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quantisation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quantisation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quantisation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quantisation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quantisation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quantisation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quantisation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quantisation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .quantisation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .quantisation-stage { opacity: 1; }

    .quantisation-s0 { animation-delay: 0.00s; }
    .quantisation-e0 { animation-delay: 0.00s; }
    .quantisation-s1 { animation-delay: 1.28s; }
    .quantisation-e1 { animation-delay: 1.28s; }
    .quantisation-s2 { animation-delay: 2.56s; }
    .quantisation-e2 { animation-delay: 2.56s; }
    .quantisation-s3 { animation-delay: 3.84s; }
    .quantisation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .quantisation-conn  { animation: quantisation-trace 6.4s ease-in-out infinite; }
      .quantisation-stage { animation: quantisation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes quantisation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes quantisation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .quantisation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .quantisation-stage { animation: quantisation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes quantisation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="quantisation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="quantisation-bg" width="980" height="322"/>
  <text class="quantisation-h1"  x="30" y="40">Post-training quantisation</text>
  <text class="quantisation-sub" x="30" y="64">Smaller weights, same behaviour.</text>
  <g class="quantisation-stage quantisation-s0">
    <rect class="quantisation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="quantisation-step" x="44" y="142">01</text>
    <text class="quantisation-name" x="70" y="142">Weights are stored in floating point</text>
    <text class="quantisation-desc" x="44" y="166">Four bytes each, and read on</text>
    <text class="quantisation-desc" x="44" y="182">every inference.</text>
  </g>
  <line class="quantisation-line quantisation-conn quantisation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#quantisation-tip)"/>
  <g class="quantisation-stage quantisation-s1">
    <rect class="quantisation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="quantisation-step" x="280" y="142">02</text>
    <text class="quantisation-name" x="306" y="142">Map them to eight-bit integers</text>
    <text class="quantisation-desc" x="280" y="166">With a scale factor per tensor</text>
    <text class="quantisation-desc" x="280" y="182">or per channel.</text>
  </g>
  <line class="quantisation-line quantisation-conn quantisation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#quantisation-tip)"/>
  <g class="quantisation-stage quantisation-s2">
    <rect class="quantisation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="quantisation-step" x="516" y="142">03</text>
    <text class="quantisation-name" x="542" y="142">Four times smaller, and faster</text>
    <text class="quantisation-desc" x="516" y="166">Less memory traffic, and integer</text>
    <text class="quantisation-desc" x="516" y="182">arithmetic is cheap.</text>
    <text class="quantisation-edge" x="516" y="242">4x</text>
  </g>
  <line class="quantisation-line quantisation-conn quantisation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#quantisation-tip)"/>
  <g class="quantisation-stage quantisation-s3">
    <rect class="quantisation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="quantisation-step" x="752" y="142">04</text>
    <text class="quantisation-name" x="778" y="142">With small accuracy loss</text>
    <text class="quantisation-desc" x="752" y="166">Usually under a point. Measure</text>
    <text class="quantisation-desc" x="752" y="182">it, do not assume it.</text>
  </g>
  <text class="quantisation-sub" x="30" y="304">Whether the loss is acceptable is task-dependent rather than universal, which is why the measurement step is not optional even though the technique is routine.</text>
</svg>
