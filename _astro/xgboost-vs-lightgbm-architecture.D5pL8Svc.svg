<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="XGBoost vs LightGBM Architecture Comparison">
  <title>XGBoost vs LightGBM Architecture Comparison</title>
  <defs>
    <style>
      .d165a-bg { fill: #f8fafc; }
      .d165a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 6; }
      .d165a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d165a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .d165a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d165a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d165a-xgb { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 6; }
      .d165a-lgb { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 6; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d165a-bg" />

  <text x="40" y="45" class="d165a-header" font-size="22">Modern Gradient Boosting: XGBoost vs LightGBM</text>
  <text x="40" y="70" class="d165a-text">Second-Order Taylor Optimization vs Histogram-Binning &amp; Leaf-Wise Tree Growth</text>

  <!-- Left: XGBoost Column -->
  <rect x="40" y="100" width="390" height="340" class="d165a-xgb" />
  <text x="60" y="130" class="d165a-title" fill="#1d4ed8">XGBoost (Chen &amp; Guestrin, 2016)</text>

  <!-- Card 1: 2nd-order objective -->
  <rect x="60" y="150" width="350" height="75" class="d165a-box" />
  <text x="75" y="172" class="d165a-title" font-size="12" fill="#1e293b">1. Exact 2nd-Order Taylor Objective</text>
  <text x="75" y="192" class="d165a-math" font-size="10">ℒ ≈ ∑ [ g_i·f_t + ½ h_i·f_t² ] + γ·T + ½ λ·∑ w_j²</text>
  <text x="75" y="210" class="d165a-text" font-size="11">g_i = 1st derivative, h_i = 2nd derivative (Hessian)</text>

  <!-- Card 2: Split Gain -->
  <rect x="60" y="235" width="350" height="75" class="d165a-box" />
  <text x="75" y="257" class="d165a-title" font-size="12" fill="#1e293b">2. Regularized Split Score</text>
  <text x="75" y="277" class="d165a-math" font-size="10">Gain = ½ [ G_L²/(H_L+λ) + G_R²/(H_R+λ) - G²/(H+λ) ] - γ</text>
  <text x="75" y="295" class="d165a-text" font-size="11">λ = L2 leaf regularization; γ = tree complexity penalty</text>

  <!-- Card 3: Level-wise tree growth -->
  <rect x="60" y="320" width="350" height="100" class="d165a-box" />
  <text x="75" y="342" class="d165a-title" font-size="12" fill="#1e293b">3. Level-Wise (Depth-First) Growth</text>
  <text x="75" y="362" class="d165a-text" font-size="11">• Splits all nodes at depth d simultaneously.</text>
  <text x="75" y="382" class="d165a-text" font-size="11">• Produces balanced trees; highly stable.</text>
  <text x="75" y="402" class="d165a-text" font-size="11">• Sparsity-Aware Split Finding for missing NaNs.</text>

  <!-- Right: LightGBM Column -->
  <rect x="470" y="100" width="390" height="340" class="d165a-lgb" />
  <text x="490" y="130" class="d165a-title" fill="#15803d">LightGBM (Ke et al., Microsoft 2017)</text>

  <!-- Card 1: Histogram Binning -->
  <rect x="490" y="150" width="350" height="75" class="d165a-box" />
  <text x="505" y="172" class="d165a-title" font-size="12" fill="#1e293b">1. Histogram-Based Binning (uint8)</text>
  <text x="505" y="192" class="d165a-math" font-size="10">Continuous float64 ➔ 256 integer bins (uint8)</text>
  <text x="505" y="210" class="d165a-text" font-size="11">8x memory reduction; split search O(256) vs O(N log N)</text>

  <!-- Card 2: Leaf-wise growth -->
  <rect x="490" y="235" width="350" height="75" class="d165a-box" />
  <text x="505" y="257" class="d165a-title" font-size="12" fill="#1e293b">2. Leaf-Wise (Best-First) Growth</text>
  <text x="505" y="277" class="d165a-text" font-size="11">Splits the single leaf with maximum delta loss reduction.</text>
  <text x="505" y="295" class="d165a-text" font-size="11">Achieves significantly lower loss with fewer leaves.</text>

  <!-- Card 3: GOSS & EFB -->
  <rect x="490" y="320" width="350" height="100" class="d165a-box" />
  <text x="505" y="342" class="d165a-title" font-size="12" fill="#1e293b">3. GOSS &amp; Feature Bundling (EFB)</text>
  <text x="505" y="362" class="d165a-text" font-size="11">• GOSS: Samples small-gradient rows; keeps big gradients.</text>
  <text x="505" y="382" class="d165a-text" font-size="11">• EFB: Bundles mutually exclusive sparse features.</text>
  <text x="505" y="402" class="d165a-text" font-size="11">• Up to 15x training speedup on massive datasets.</text>
</svg>
