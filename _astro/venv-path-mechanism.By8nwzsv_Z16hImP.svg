<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="There is no magic here. It edits one variable.">
  <title>What activating a virtual environment actually does</title>
  <style>
    .venv-path-mechanism-bg   { fill: #f8fafc; }
    .venv-path-mechanism-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .venv-path-mechanism-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .venv-path-mechanism-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .venv-path-mechanism-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .venv-path-mechanism-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .venv-path-mechanism-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .venv-path-mechanism-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .venv-path-mechanism-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .venv-path-mechanism-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .venv-path-mechanism-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .venv-path-mechanism-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .venv-path-mechanism-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .venv-path-mechanism-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .venv-path-mechanism-stage { opacity: 1; }

    .venv-path-mechanism-s0 { animation-delay: 0.00s; }
    .venv-path-mechanism-e0 { animation-delay: 0.00s; }
    .venv-path-mechanism-s1 { animation-delay: 1.28s; }
    .venv-path-mechanism-e1 { animation-delay: 1.28s; }
    .venv-path-mechanism-s2 { animation-delay: 2.56s; }
    .venv-path-mechanism-e2 { animation-delay: 2.56s; }
    .venv-path-mechanism-s3 { animation-delay: 3.84s; }
    .venv-path-mechanism-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .venv-path-mechanism-conn  { animation: venv-path-mechanism-trace 6.4s ease-in-out infinite; }
      .venv-path-mechanism-stage { animation: venv-path-mechanism-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes venv-path-mechanism-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes venv-path-mechanism-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .venv-path-mechanism-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .venv-path-mechanism-stage { animation: venv-path-mechanism-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes venv-path-mechanism-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="venv-path-mechanism-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="venv-path-mechanism-bg" width="980" height="322"/>
  <text class="venv-path-mechanism-h1"  x="30" y="40">What activating a virtual environment actually does</text>
  <text class="venv-path-mechanism-sub" x="30" y="64">There is no magic here. It edits one variable.</text>
  <g class="venv-path-mechanism-stage venv-path-mechanism-s0">
    <rect class="venv-path-mechanism-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="venv-path-mechanism-step" x="44" y="142">01</text>
    <text class="venv-path-mechanism-name" x="70" y="142">Before</text>
    <text class="venv-path-mechanism-desc" x="44" y="166">command -v python3 resolves to</text>
    <text class="venv-path-mechanism-desc" x="44" y="182">the system installation.</text>
    <text class="venv-path-mechanism-edge" x="44" y="242">/usr/bin</text>
  </g>
  <line class="venv-path-mechanism-line venv-path-mechanism-conn venv-path-mechanism-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#venv-path-mechanism-tip)"/>
  <g class="venv-path-mechanism-stage venv-path-mechanism-s1">
    <rect class="venv-path-mechanism-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="venv-path-mechanism-step" x="280" y="142">02</text>
    <text class="venv-path-mechanism-name" x="306" y="142">activate runs</text>
    <text class="venv-path-mechanism-desc" x="280" y="166">It prepends the environment's</text>
    <text class="venv-path-mechanism-desc" x="280" y="182">bin directory to PATH. That is</text>
    <text class="venv-path-mechanism-desc" x="280" y="198">essentially all it does.</text>
    <text class="venv-path-mechanism-edge" x="280" y="242">prepend</text>
  </g>
  <line class="venv-path-mechanism-line venv-path-mechanism-conn venv-path-mechanism-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#venv-path-mechanism-tip)"/>
  <g class="venv-path-mechanism-stage venv-path-mechanism-s2">
    <rect class="venv-path-mechanism-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="venv-path-mechanism-step" x="516" y="142">03</text>
    <text class="venv-path-mechanism-name" x="542" y="142">Now the search finds yours first</text>
    <text class="venv-path-mechanism-desc" x="516" y="166">Same rule as always: leftmost</text>
    <text class="venv-path-mechanism-desc" x="516" y="182">match wins.</text>
    <text class="venv-path-mechanism-edge" x="516" y="242">.venv/bin</text>
  </g>
  <line class="venv-path-mechanism-line venv-path-mechanism-conn venv-path-mechanism-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#venv-path-mechanism-tip)"/>
  <g class="venv-path-mechanism-stage venv-path-mechanism-s3">
    <rect class="venv-path-mechanism-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="venv-path-mechanism-step" x="752" y="142">04</text>
    <text class="venv-path-mechanism-name" x="778" y="142">deactivate</text>
    <text class="venv-path-mechanism-desc" x="752" y="166">Restores the saved PATH. Nothing</text>
    <text class="venv-path-mechanism-desc" x="752" y="182">was installed or uninstalled.</text>
  </g>
  <text class="venv-path-mechanism-sub" x="30" y="304">This is why pip installs into one environment and python imports from another when the two resolve differently. Run command -v on both before believing anything else.</text>
</svg>
