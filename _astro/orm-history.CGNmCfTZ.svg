<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward hybrid tools.">
  <title>Four steps in object mapping</title>
  <style>
    .orm-history-bg   { fill: #f8fafc; }
    .orm-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orm-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .orm-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .orm-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .orm-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .orm-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .orm-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .orm-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .orm-history-stage { opacity: 1; }

    .orm-history-s0 { animation-delay: 0.00s; }
    .orm-history-e0 { animation-delay: 0.00s; }
    .orm-history-s1 { animation-delay: 1.28s; }
    .orm-history-e1 { animation-delay: 1.28s; }
    .orm-history-s2 { animation-delay: 2.56s; }
    .orm-history-e2 { animation-delay: 2.56s; }
    .orm-history-s3 { animation-delay: 3.84s; }
    .orm-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .orm-history-conn  { animation: orm-history-trace 6.4s ease-in-out infinite; }
      .orm-history-stage { animation: orm-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes orm-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes orm-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .orm-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .orm-history-stage { animation: orm-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes orm-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="orm-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="orm-history-bg" width="980" height="322"/>
  <text class="orm-history-h1"  x="30" y="40">Four steps in object mapping</text>
  <text class="orm-history-sub" x="30" y="64">Toward hybrid tools.</text>
  <g class="orm-history-stage orm-history-s0">
    <rect class="orm-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="orm-history-step" x="44" y="142">01</text>
    <text class="orm-history-name" x="70" y="142">Access code written by hand for every entity</text>
    <text class="orm-history-desc" x="44" y="166">Repetitive, and error-prone.</text>
  </g>
  <line class="orm-history-line orm-history-conn orm-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#orm-history-tip)"/>
  <g class="orm-history-stage orm-history-s1">
    <rect class="orm-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="orm-history-step" x="280" y="142">02</text>
    <text class="orm-history-name" x="306" y="142">Then mappers generating it from declarations</text>
    <text class="orm-history-desc" x="280" y="166">Which removed the repetition.</text>
  </g>
  <line class="orm-history-line orm-history-conn orm-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#orm-history-tip)"/>
  <g class="orm-history-stage orm-history-s2">
    <rect class="orm-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="orm-history-step" x="516" y="142">03</text>
    <text class="orm-history-name" x="542" y="142">Then a long argument about the mismatch</text>
    <text class="orm-history-desc" x="516" y="166">Objects and relations are not</text>
    <text class="orm-history-desc" x="516" y="182">the same shape.</text>
  </g>
  <line class="orm-history-line orm-history-conn orm-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#orm-history-tip)"/>
  <g class="orm-history-stage orm-history-s3">
    <rect class="orm-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="orm-history-step" x="752" y="142">04</text>
    <text class="orm-history-name" x="778" y="142">And hybrid libraries offering both levels</text>
    <text class="orm-history-desc" x="752" y="166">Mapping when convenient, raw</text>
    <text class="orm-history-desc" x="752" y="182">when not.</text>
  </g>
  <text class="orm-history-sub" x="30" y="304">The hybrid answer is the one that stuck: use the mapper for ordinary work and drop to explicit statements exactly where it matters.</text>
</svg>
