<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" font-family="system-ui, sans-serif">
  <title>The decision inside every recursive call: is this the base case? If yes, return the base answer directly. If no, solve a smaller subproblem by calling yourself, then combine that result and return it.</title>
  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Every recursive call asks one question</text>

  <!-- Enter -->
  <rect x="300" y="56" width="160" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Call f(input)</text>
  <text x="380" y="95" text-anchor="middle" font-size="14" fill="#1a202c">a new stack frame</text>

  <line x1="380" y1="102" x2="380" y2="126" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,126 374,114 386,114" fill="#1a202c"/>

  <!-- Decision -->
  <polygon points="380,134 500,196 380,258 260,196" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Base case?</text>
  <text x="380" y="210" text-anchor="middle" font-size="14" fill="#1a202c">smallest input?</text>

  <!-- Yes branch to left -->
  <text x="205" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="260" y1="196" x2="176" y2="196" stroke="#1a202c" stroke-width="2"/>
  <polygon points="176,196 188,190 188,202" fill="#1a202c"/>
  <rect x="30" y="170" width="146" height="52" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="103" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Return the</text>
  <text x="103" y="212" text-anchor="middle" font-size="14" fill="#1a202c">base answer</text>

  <!-- No branch down -->
  <text x="400" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="380" y1="258" x2="380" y2="284" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,284 374,272 386,272" fill="#1a202c"/>

  <!-- Recursive case: smaller subproblem -->
  <rect x="270" y="286" width="220" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Recursive case</text>
  <text x="380" y="328" text-anchor="middle" font-size="14" fill="#1a202c">call f(smaller input)</text>

  <line x1="380" y1="338" x2="380" y2="362" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,362 374,350 386,350" fill="#1a202c"/>

  <!-- Combine -->
  <rect x="270" y="364" width="220" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Combine</text>
  <text x="380" y="406" text-anchor="middle" font-size="14" fill="#1a202c">e.g. n * result, or first + rest</text>

  <line x1="380" y1="416" x2="380" y2="440" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,440 374,428 386,428" fill="#1a202c"/>

  <!-- Return combined -->
  <rect x="270" y="442" width="220" height="46" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Return the combined result</text>

  <!-- must shrink note -->
  <rect x="540" y="286" width="196" height="130" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="638" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">The rule</text>
  <text x="638" y="336" text-anchor="middle" font-size="14" fill="#1a202c">the input MUST get</text>
  <text x="638" y="354" text-anchor="middle" font-size="14" fill="#1a202c">closer to the base</text>
  <text x="638" y="372" text-anchor="middle" font-size="14" fill="#1a202c">case on every call,</text>
  <text x="638" y="390" text-anchor="middle" font-size="14" fill="#1a202c">or the recursion</text>
  <text x="638" y="408" text-anchor="middle" font-size="14" fill="#1a202c">never stops.</text>
</svg>
