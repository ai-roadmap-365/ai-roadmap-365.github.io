<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four hazards.">
  <title>Where sourcing goes wrong</title>
  <style>
    .find-hazards-bg   { fill: #f8fafc; }
    .find-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .find-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .find-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .find-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .find-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .find-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .find-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .find-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .find-hazards-stage { opacity: 1; }

    .find-hazards-s0 { animation-delay: 0.00s; }
    .find-hazards-e0 { animation-delay: 0.00s; }
    .find-hazards-s1 { animation-delay: 1.28s; }
    .find-hazards-e1 { animation-delay: 1.28s; }
    .find-hazards-s2 { animation-delay: 2.56s; }
    .find-hazards-e2 { animation-delay: 2.56s; }
    .find-hazards-s3 { animation-delay: 3.84s; }
    .find-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .find-hazards-conn  { animation: find-hazards-trace 6.4s ease-in-out infinite; }
      .find-hazards-stage { animation: find-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes find-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes find-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .find-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .find-hazards-stage { animation: find-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes find-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="find-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="find-hazards-bg" width="980" height="322"/>
  <text class="find-hazards-h1"  x="30" y="40">Where sourcing goes wrong</text>
  <text class="find-hazards-sub" x="30" y="64">Four hazards.</text>
  <g class="find-hazards-stage find-hazards-s0">
    <rect class="find-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="find-hazards-step" x="44" y="142">01</text>
    <text class="find-hazards-name" x="70" y="142">Data of unknown origin, used anyway</text>
    <text class="find-hazards-desc" x="44" y="166">Which cannot be defended later.</text>
  </g>
  <line class="find-hazards-line find-hazards-conn find-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#find-hazards-tip)"/>
  <g class="find-hazards-stage find-hazards-s1">
    <rect class="find-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="find-hazards-step" x="280" y="142">02</text>
    <text class="find-hazards-name" x="306" y="142">A licence that forbids the intended use</text>
    <text class="find-hazards-desc" x="280" y="166">Discovered after the model is</text>
    <text class="find-hazards-desc" x="280" y="182">trained.</text>
  </g>
  <line class="find-hazards-line find-hazards-conn find-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#find-hazards-tip)"/>
  <g class="find-hazards-stage find-hazards-s2">
    <rect class="find-hazards-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="find-hazards-step" x="516" y="142">03</text>
    <text class="find-hazards-name" x="542" y="142">Systematic gaps in who is represented</text>
    <text class="find-hazards-desc" x="516" y="166">Which become model bias.</text>
  </g>
  <line class="find-hazards-line find-hazards-conn find-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#find-hazards-tip)"/>
  <g class="find-hazards-stage find-hazards-s3">
    <rect class="find-hazards-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="find-hazards-step" x="752" y="142">04</text>
    <text class="find-hazards-name" x="778" y="142">And a source that changes definitions silently</text>
    <text class="find-hazards-desc" x="752" y="166">Breaking comparisons over time.</text>
  </g>
  <text class="find-hazards-sub" x="30" y="304">Definitions changing silently is particularly damaging for time series, because the break looks like a real change in the world rather than in the measurement.</text>
</svg>
