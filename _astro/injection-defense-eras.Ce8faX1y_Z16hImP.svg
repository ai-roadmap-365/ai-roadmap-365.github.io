<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each abandoned a comfortable assumption.">
  <title>Three eras of defence</title>
  <style>
    .injection-defense-eras-bg   { fill: #f8fafc; }
    .injection-defense-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-defense-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-defense-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-defense-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-defense-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-defense-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-defense-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-defense-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-defense-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-defense-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-defense-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-defense-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .injection-defense-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .injection-defense-eras-stage { opacity: 1; }

    .injection-defense-eras-s0 { animation-delay: 0.00s; }
    .injection-defense-eras-e0 { animation-delay: 0.00s; }
    .injection-defense-eras-s1 { animation-delay: 1.50s; }
    .injection-defense-eras-e1 { animation-delay: 1.50s; }
    .injection-defense-eras-s2 { animation-delay: 3.00s; }
    .injection-defense-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .injection-defense-eras-conn  { animation: injection-defense-eras-trace 6s ease-in-out infinite; }
      .injection-defense-eras-stage { animation: injection-defense-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes injection-defense-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes injection-defense-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .injection-defense-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .injection-defense-eras-stage { animation: injection-defense-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes injection-defense-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="injection-defense-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="injection-defense-eras-bg" width="980" height="322"/>
  <text class="injection-defense-eras-h1"  x="30" y="40">Three eras of defence</text>
  <text class="injection-defense-eras-sub" x="30" y="64">Each abandoned a comfortable assumption.</text>
  <g class="injection-defense-eras-stage injection-defense-eras-s0">
    <rect class="injection-defense-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="injection-defense-eras-step" x="44" y="142">01</text>
    <text class="injection-defense-eras-name" x="70" y="142">Regex blocklists, 2022-2023</text>
    <text class="injection-defense-eras-desc" x="44" y="166">Filter "ignore previous instructions".</text>
    <text class="injection-defense-eras-desc" x="44" y="182">Bypassed by substitution, other languages,</text>
    <text class="injection-defense-eras-desc" x="44" y="198">Base64.</text>
  </g>
  <line class="injection-defense-eras-line injection-defense-eras-conn injection-defense-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#injection-defense-eras-tip)"/>
  <g class="injection-defense-eras-stage injection-defense-eras-s1">
    <rect class="injection-defense-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="injection-defense-eras-step" x="359" y="142">02</text>
    <text class="injection-defense-eras-name" x="385" y="142">Classifier guardrails, 2023-2024</text>
    <text class="injection-defense-eras-desc" x="359" y="166">Small transformers trained to score a prompt</text>
    <text class="injection-defense-eras-desc" x="359" y="182">as adversarial. Better, and probabilistic.</text>
  </g>
  <line class="injection-defense-eras-line injection-defense-eras-conn injection-defense-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#injection-defense-eras-tip)"/>
  <g class="injection-defense-eras-stage injection-defense-eras-s2">
    <rect class="injection-defense-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="injection-defense-eras-step" x="674" y="142">03</text>
    <text class="injection-defense-eras-name" x="700" y="142">Structure and hierarchy, 2024</text>
    <text class="injection-defense-eras-desc" x="674" y="166">Delimiters, tool-less quarantine,</text>
    <text class="injection-defense-eras-desc" x="674" y="182">instruction-hierarchy training.</text>
    <text class="injection-defense-eras-edge" x="674" y="242">architectural</text>
  </g>
  <text class="injection-defense-eras-sub" x="30" y="304">Each era's defence still has a place — heuristics are free and catch the lazy attempt — and the progression is toward controls that do not depend on anticipating a phrasing.</text>
</svg>
