<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Attention against throughput.">
  <title>Interactive, or headless</title>
  <style>
    .interactive-or-headless-bg   { fill: #f8fafc; }
    .interactive-or-headless-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactive-or-headless-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactive-or-headless-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactive-or-headless-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactive-or-headless-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactive-or-headless-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interactive-or-headless-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .interactive-or-headless-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .interactive-or-headless-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .interactive-or-headless-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .interactive-or-headless-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .interactive-or-headless-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interactive-or-headless-row { opacity: 1; }
    .interactive-or-headless-r0 { animation-delay: 0.00s; }
    .interactive-or-headless-r1 { animation-delay: 0.45s; }
    .interactive-or-headless-r2 { animation-delay: 0.90s; }
    .interactive-or-headless-r3 { animation-delay: 1.35s; }
    .interactive-or-headless-r4 { animation-delay: 1.80s; }
    .interactive-or-headless-row { animation: interactive-or-headless-reveal 7.3s ease-in-out infinite; }
    @keyframes interactive-or-headless-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="interactive-or-headless-bg" width="980" height="390"/>
  <text class="interactive-or-headless-h1"  x="30" y="40">Interactive, or headless</text>
  <text class="interactive-or-headless-sub" x="30" y="64">Attention against throughput.</text>
  <rect class="interactive-or-headless-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="interactive-or-headless-name" x="46" y="122">Interactive</text>
  <text class="interactive-or-headless-desc" x="46" y="142">A developer is present.</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r0" x="46" y="182">Steered turn by turn</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r1" x="46" y="216">Immediate correction when it drifts</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r2" x="46" y="250">Bounded by one person's attention</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r3" x="46" y="284">Best for open-ended work</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r4" x="46" y="318">Scales with headcount</text>
  <rect class="interactive-or-headless-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="interactive-or-headless-name" x="526" y="122">Headless</text>
  <text class="interactive-or-headless-desc" x="526" y="142">Nobody is watching.</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r0" x="526" y="182">Triggered by a webhook, at 2am</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r1" x="526" y="216">Must self-verify before submitting</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r2" x="526" y="250">Bounded by CI capacity, not attention</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r3" x="526" y="284">Best for well-scoped, repetitive work</text>
  <text class="interactive-or-headless-desc interactive-or-headless-row interactive-or-headless-r4" x="526" y="318">Scales with queue depth</text>
  <text class="interactive-or-headless-sub" x="30" y="372">The self-verification requirement is what changes the design: an interactive agent can be wrong and corrected, and a headless one has to prove its own work before anybody sees it.</text>
</svg>
