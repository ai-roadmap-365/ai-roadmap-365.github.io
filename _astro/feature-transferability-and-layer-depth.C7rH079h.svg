<svg role="img" aria-label="Feature transferability spectrum showing how early layers learn universal low-level visual primitives while late layers learn task-specific semantic representations" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Layer-Wise Feature Transferability and Semantic Specialization</title>
  <defs>
    <linearGradient id="bg213b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card213b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg213b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LAYER-WISE FEATURE TRANSFERABILITY SPECTRUM</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Universal Primitives vs Domain-Specific Semantic Representations</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card213b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Layer 1-2: Low-level -->
    <rect x="30" y="30" width="210" height="200" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="55" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Early Layers (Layer 1-2)</text>
    <rect x="45" y="70" width="180" height="60" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="95" fill="#f8fafc" font-size="9" text-anchor="middle">Gabor Edges, Color Gradients,</text>
    <text x="135" y="115" fill="#f8fafc" font-size="9" text-anchor="middle">Corner Intersections</text>
    <text x="135" y="160" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Transferability: 100% (Universal)</text>
    <text x="135" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Identical across medical scans,</text>
    <text x="135" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">satellite, and natural photos</text>

    <!-- Layer 3-4: Mid-level -->
    <rect x="275" y="30" width="210" height="200" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="55" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Mid Layers (Layer 3-4)</text>
    <rect x="290" y="70" width="180" height="60" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="95" fill="#f8fafc" font-size="9" text-anchor="middle">Complex Textures, Motifs,</text>
    <text x="380" y="115" fill="#f8fafc" font-size="9" text-anchor="middle">Object Parts (Wheels, Eyes)</text>
    <text x="380" y="160" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Transferability: 70% (High)</text>
    <text x="380" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Requires gentle fine-tuning</text>
    <text x="380" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">for specialized domains</text>

    <!-- Layer 5 / Head: High-level -->
    <rect x="520" y="30" width="210" height="200" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="625" y="55" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Deep Layers &amp; Head (Layer 5)</text>
    <rect x="535" y="70" width="180" height="60" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="625" y="95" fill="#f8fafc" font-size="9" text-anchor="middle">Complete Objects (ImageNet)</text>
    <text x="625" y="115" fill="#f8fafc" font-size="9" text-anchor="middle">1000 Class Decision Boundaries</text>
    <text x="625" y="160" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">Transferability: Low (Specific)</text>
    <text x="625" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Must replace head entirely</text>
    <text x="625" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">for new target classes</text>

    <!-- Bottom summary bar -->
    <rect x="30" y="245" width="700" height="35" fill="#0f172a" stroke="#475569" rx="4"/>
    <text x="380" y="267" fill="#cbd5e1" font-size="9" text-anchor="middle">Transfer Rule: Freeze early layers -&gt; Train new head -&gt; Fine-tune deep layers with small learning rates</text>
  </g>
</svg>
