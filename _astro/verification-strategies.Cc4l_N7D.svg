<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Different coverage, different blind spots.">
  <title>Three verification strategies</title>
  <style>
    .verification-strategies-bg   { fill: #f8fafc; }
    .verification-strategies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-strategies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-strategies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-strategies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-strategies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-strategies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .verification-strategies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .verification-strategies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .verification-strategies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .verification-strategies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .verification-strategies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .verification-strategies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .verification-strategies-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .verification-strategies-stage { opacity: 1; }

    .verification-strategies-s0 { animation-delay: 0.00s; }
    .verification-strategies-e0 { animation-delay: 0.00s; }
    .verification-strategies-s1 { animation-delay: 1.50s; }
    .verification-strategies-e1 { animation-delay: 1.50s; }
    .verification-strategies-s2 { animation-delay: 3.00s; }
    .verification-strategies-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .verification-strategies-conn  { animation: verification-strategies-trace 6s ease-in-out infinite; }
      .verification-strategies-stage { animation: verification-strategies-arrive 6s ease-in-out infinite; }
    }
    @keyframes verification-strategies-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes verification-strategies-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .verification-strategies-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .verification-strategies-stage { animation: verification-strategies-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes verification-strategies-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="verification-strategies-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="verification-strategies-bg" width="980" height="322"/>
  <text class="verification-strategies-h1"  x="30" y="40">Three verification strategies</text>
  <text class="verification-strategies-sub" x="30" y="64">Different coverage, different blind spots.</text>
  <g class="verification-strategies-stage verification-strategies-s0">
    <rect class="verification-strategies-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="verification-strategies-step" x="44" y="142">01</text>
    <text class="verification-strategies-name" x="70" y="142">Static</text>
    <text class="verification-strategies-desc" x="44" y="166">No execution. Sub-second, exhaustive over</text>
    <text class="verification-strategies-desc" x="44" y="182">branches. Cannot judge runtime correctness.</text>
    <text class="verification-strategies-edge" x="44" y="242">structure</text>
  </g>
  <line class="verification-strategies-line verification-strategies-conn verification-strategies-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#verification-strategies-tip)"/>
  <g class="verification-strategies-stage verification-strategies-s1">
    <rect class="verification-strategies-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="verification-strategies-step" x="359" y="142">02</text>
    <text class="verification-strategies-name" x="385" y="142">Dynamic</text>
    <text class="verification-strategies-desc" x="359" y="166">Concrete inputs, real behaviour. Only the</text>
    <text class="verification-strategies-desc" x="359" y="182">cases somebody wrote.</text>
    <text class="verification-strategies-edge" x="359" y="242">behaviour</text>
  </g>
  <line class="verification-strategies-line verification-strategies-conn verification-strategies-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#verification-strategies-tip)"/>
  <g class="verification-strategies-stage verification-strategies-s2">
    <rect class="verification-strategies-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="verification-strategies-step" x="674" y="142">03</text>
    <text class="verification-strategies-name" x="700" y="142">Symbolic</text>
    <text class="verification-strategies-desc" x="674" y="166">Symbolic variables across path constraints.</text>
    <text class="verification-strategies-desc" x="674" y="182">Finds the inputs nobody imagined.</text>
    <text class="verification-strategies-edge" x="674" y="242">edge cases</text>
  </g>
  <text class="verification-strategies-sub" x="30" y="304">Symbolic execution is the one that finds what neither a model nor a reviewer thought to test — a window of 1e-300, a request count of minus one — because it explores constraints rather than examples.</text>
</svg>
