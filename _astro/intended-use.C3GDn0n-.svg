<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four elements.">
  <title>Stating the intended use</title>
  <style>
    .intended-use-bg   { fill: #f8fafc; }
    .intended-use-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intended-use-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intended-use-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intended-use-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intended-use-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intended-use-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .intended-use-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .intended-use-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .intended-use-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .intended-use-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .intended-use-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .intended-use-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .intended-use-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .intended-use-stage { opacity: 1; }

    .intended-use-s0 { animation-delay: 0.00s; }
    .intended-use-e0 { animation-delay: 0.00s; }
    .intended-use-s1 { animation-delay: 1.28s; }
    .intended-use-e1 { animation-delay: 1.28s; }
    .intended-use-s2 { animation-delay: 2.56s; }
    .intended-use-e2 { animation-delay: 2.56s; }
    .intended-use-s3 { animation-delay: 3.84s; }
    .intended-use-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .intended-use-conn  { animation: intended-use-trace 6.4s ease-in-out infinite; }
      .intended-use-stage { animation: intended-use-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes intended-use-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes intended-use-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .intended-use-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .intended-use-stage { animation: intended-use-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes intended-use-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="intended-use-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="intended-use-bg" width="980" height="322"/>
  <text class="intended-use-h1"  x="30" y="40">Stating the intended use</text>
  <text class="intended-use-sub" x="30" y="64">Four elements.</text>
  <g class="intended-use-stage intended-use-s0">
    <rect class="intended-use-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="intended-use-step" x="44" y="142">01</text>
    <text class="intended-use-name" x="70" y="142">The decision the model informs</text>
    <text class="intended-use-desc" x="44" y="166">Specifically, not in general</text>
    <text class="intended-use-desc" x="44" y="182">terms.</text>
  </g>
  <line class="intended-use-line intended-use-conn intended-use-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#intended-use-tip)"/>
  <g class="intended-use-stage intended-use-s1">
    <rect class="intended-use-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="intended-use-step" x="280" y="142">02</text>
    <text class="intended-use-name" x="306" y="142">The population it was evaluated on</text>
    <text class="intended-use-desc" x="280" y="166">Which bounds where it can be</text>
    <text class="intended-use-desc" x="280" y="182">trusted.</text>
  </g>
  <line class="intended-use-line intended-use-conn intended-use-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#intended-use-tip)"/>
  <g class="intended-use-stage intended-use-s2">
    <rect class="intended-use-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="intended-use-step" x="516" y="142">03</text>
    <text class="intended-use-name" x="542" y="142">The operating conditions assumed</text>
    <text class="intended-use-desc" x="516" y="166">Data freshness, input quality,</text>
    <text class="intended-use-desc" x="516" y="182">volume.</text>
  </g>
  <line class="intended-use-line intended-use-conn intended-use-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#intended-use-tip)"/>
  <g class="intended-use-stage intended-use-s3">
    <rect class="intended-use-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="intended-use-step" x="752" y="142">04</text>
    <text class="intended-use-name" x="778" y="142">And explicit out-of-scope uses</text>
    <text class="intended-use-desc" x="752" y="166">Which is the section that</text>
    <text class="intended-use-desc" x="752" y="182">prevents harm.</text>
  </g>
  <text class="intended-use-sub" x="30" y="304">Naming excluded uses explicitly is more effective than describing intended ones, because it gives a reviewer something concrete to check against.</text>
</svg>
