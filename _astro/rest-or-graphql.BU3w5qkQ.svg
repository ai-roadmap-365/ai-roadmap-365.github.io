<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="REST over-fetches and under-fetches. That is the whole motivation.">
  <title>Why GraphQL exists</title>
  <style>
    .rest-or-graphql-bg   { fill: #f8fafc; }
    .rest-or-graphql-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-or-graphql-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-or-graphql-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-or-graphql-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-or-graphql-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-or-graphql-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rest-or-graphql-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rest-or-graphql-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rest-or-graphql-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rest-or-graphql-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rest-or-graphql-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rest-or-graphql-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rest-or-graphql-row { opacity: 1; }
    .rest-or-graphql-r0 { animation-delay: 0.00s; }
    .rest-or-graphql-r1 { animation-delay: 0.45s; }
    .rest-or-graphql-r2 { animation-delay: 0.90s; }
    .rest-or-graphql-r3 { animation-delay: 1.35s; }
    .rest-or-graphql-r4 { animation-delay: 1.80s; }
    .rest-or-graphql-row { animation: rest-or-graphql-reveal 7.3s ease-in-out infinite; }
    @keyframes rest-or-graphql-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rest-or-graphql-bg" width="980" height="390"/>
  <text class="rest-or-graphql-h1"  x="30" y="40">Why GraphQL exists</text>
  <text class="rest-or-graphql-sub" x="30" y="64">REST over-fetches and under-fetches. That is the whole motivation.</text>
  <rect class="rest-or-graphql-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rest-or-graphql-name" x="46" y="122">REST</text>
  <text class="rest-or-graphql-desc" x="46" y="142">The server decides the shape.</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r0" x="46" y="182">You get the fields the endpoint returns</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r1" x="46" y="216">Need three resources? Three requests</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r2" x="46" y="250">Need two fields of forty? You get forty</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r3" x="46" y="284">HTTP caching works for free</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r4" x="46" y="318">Trivial to debug with curl</text>
  <rect class="rest-or-graphql-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rest-or-graphql-name" x="526" y="122">GraphQL</text>
  <text class="rest-or-graphql-desc" x="526" y="142">The client decides the shape.</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r0" x="526" y="182">Ask for exactly the fields you want</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r1" x="526" y="216">One request, however many resources</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r2" x="526" y="250">No over-fetching, no under-fetching</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r3" x="526" y="284">Caching must be built; HTTP cannot help</text>
  <text class="rest-or-graphql-desc rest-or-graphql-row rest-or-graphql-r4" x="526" y="318">One endpoint, harder to inspect</text>
  <text class="rest-or-graphql-sub" x="30" y="372">Neither is the winner. REST is right when the data is resource-shaped and caching matters; GraphQL is right when many different clients need many different shapes of the same data.</text>
</svg>
