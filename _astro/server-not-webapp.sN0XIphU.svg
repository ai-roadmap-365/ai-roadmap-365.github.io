<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them saves a lot of setup.">
  <title>Three things a server is not</title>
  <style>
    .server-not-webapp-bg   { fill: #f8fafc; }
    .server-not-webapp-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-not-webapp-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-not-webapp-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-not-webapp-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-not-webapp-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .server-not-webapp-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .server-not-webapp-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .server-not-webapp-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .server-not-webapp-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .server-not-webapp-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .server-not-webapp-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .server-not-webapp-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .server-not-webapp-row { opacity: 1; }
    .server-not-webapp-r0 { animation-delay: 0.00s; }
    .server-not-webapp-r1 { animation-delay: 0.45s; }
    .server-not-webapp-r2 { animation-delay: 0.90s; }
    .server-not-webapp-r3 { animation-delay: 1.35s; }
    .server-not-webapp-r4 { animation-delay: 1.80s; }
    .server-not-webapp-row { animation: server-not-webapp-reveal 7.3s ease-in-out infinite; }
    @keyframes server-not-webapp-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="server-not-webapp-bg" width="980" height="390"/>
  <text class="server-not-webapp-h1"  x="30" y="40">Three things a server is not</text>
  <text class="server-not-webapp-sub" x="30" y="64">One of them saves a lot of setup.</text>
  <rect class="server-not-webapp-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="server-not-webapp-name" x="46" y="122">What it is</text>
  <text class="server-not-webapp-desc" x="46" y="142">A process with registered functions.</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r0" x="46" y="182">Registers functions via annotations and docstrings</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r1" x="46" y="216">Generates JSON Schema automatically</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r2" x="46" y="250">Catches exceptions and sets isError</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r3" x="46" y="284">Runs over stdio with no network setup</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r4" x="46" y="318">A lightweight gateway to data</text>
  <rect class="server-not-webapp-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="server-not-webapp-name" x="526" y="122">Three misconceptions</text>
  <text class="server-not-webapp-desc" x="526" y="142">All add work that is not needed.</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r0" x="526" y="182">Not a web server needing a reverse proxy</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r1" x="526" y="216">Not a database engine holding state</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r2" x="526" y="250">Not a prompt engineering script</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r3" x="526" y="284">A local stdio server needs zero network config</text>
  <text class="server-not-webapp-desc server-not-webapp-row server-not-webapp-r4" x="526" y="318">Which is most of why it is quick to write</text>
  <text class="server-not-webapp-sub" x="30" y="372">The first row is worth stating to anyone reaching for Docker and nginx: a local MCP server is a subprocess reading stdin, and there is nothing to deploy, bind or terminate TLS on.</text>
</svg>
