<svg role="img" aria-label="Vector distance metrics geometric comparison diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Vector Distance Metrics Geometric Comparison</title>
  <defs>
    <linearGradient id="bg261a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card261" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg261a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">VECTOR DISTANCE METRICS: GEOMETRIC COMPARISON</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Comparing Cosine Similarity, Euclidean Distance (L2), and Dot Product</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card261)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Cosine Similarity Card -->
    <rect x="25" y="25" width="220" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="135" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Cosine Similarity</text>
    <rect x="35" y="65" width="200" height="75" fill="#1e293b" rx="4"/>
    <text x="45" y="85" fill="#cbd5e1" font-size="8">• Measures angle theta between vectors</text>
    <text x="45" y="100" fill="#cbd5e1" font-size="8">• Invariant to vector length</text>
    <text x="45" y="115" fill="#34d399" font-size="8">• Range: [-1.0, +1.0]</text>
    <text x="45" y="130" fill="#38bdf8" font-size="8">cos(u, v) = (u . v) / (||u|| * ||v||)</text>
    
    <circle cx="135" cy="190" r="35" fill="none" stroke="#475569" stroke-dasharray="3,3"/>
    <line x1="135" y1="190" x2="165" y2="165" stroke="#38bdf8" stroke-width="2"/>
    <line x1="135" y1="190" x2="170" y2="190" stroke="#34d399" stroke-width="2"/>
    <text x="145" y="183" fill="#fbbf24" font-size="8">theta</text>
    <text x="135" y="255" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Ideal for Text Semantic Search</text>

    <!-- Euclidean Distance Card -->
    <rect x="270" y="25" width="220" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="380" y="50" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. Euclidean Distance (L2)</text>
    <rect x="280" y="65" width="200" height="75" fill="#1e293b" rx="4"/>
    <text x="290" y="85" fill="#cbd5e1" font-size="8">• Measures straight-line distance</text>
    <text x="290" y="100" fill="#cbd5e1" font-size="8">• Sensitive to vector magnitude</text>
    <text x="290" y="115" fill="#fb7185" font-size="8">• Range: [0.0, +infinity)</text>
    <text x="290" y="130" fill="#fbbf24" font-size="8">d_L2(u, v) = sqrt(sum((u_i - v_i)^2))</text>

    <line x1="330" y1="170" x2="430" y2="210" stroke="#fb7185" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="330" cy="170" r="5" fill="#fbbf24"/>
    <circle cx="430" cy="210" r="5" fill="#fbbf24"/>
    <text x="380" y="185" fill="#fb7185" font-size="8" text-anchor="middle">d_L2</text>
    <text x="380" y="255" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Ideal for Physical Spatial Data</text>

    <!-- Dot Product Card -->
    <rect x="515" y="25" width="220" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="625" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3. Dot Product (Inner Product)</text>
    <rect x="525" y="65" width="200" height="75" fill="#1e293b" rx="4"/>
    <text x="535" y="85" fill="#cbd5e1" font-size="8">• Combines angle AND magnitude</text>
    <text x="535" y="100" fill="#34d399" font-size="8">• On normalized vectors: Dot == Cosine</text>
    <text x="535" y="115" fill="#34d399" font-size="8">• 5x Faster (Zero square roots)</text>
    <text x="535" y="130" fill="#34d399" font-size="8">dot(u, v) = sum(u_i * v_i)</text>

    <rect x="535" y="155" width="180" height="70" fill="#1e293b" rx="4"/>
    <text x="545" y="175" fill="#34d399" font-size="8" font-weight="700">The Optimization Law:</text>
    <text x="545" y="190" fill="#cbd5e1" font-size="7">• Pre-normalize database vectors</text>
    <text x="545" y="205" fill="#cbd5e1" font-size="7">• Pre-normalize query vector</text>
    <text x="545" y="220" fill="#38bdf8" font-size="7">• Compute pure BLAS dot product</text>
    <text x="625" y="255" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Production Vector Database Standard</text>
  </g>
</svg>
