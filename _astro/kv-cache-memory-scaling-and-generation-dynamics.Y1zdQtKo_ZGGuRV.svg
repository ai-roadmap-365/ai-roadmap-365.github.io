<svg role="img" aria-label="KV cache memory scaling and generation dynamics diagram showing prefill vs token-by-token autoregressive decoding" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>KV-Cache Memory Scaling &amp; Autoregressive Decoding</title>
  <defs>
    <linearGradient id="bg243b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card243b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg243b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">KV-CACHE MEMORY FOOTPRINT &amp; SERVING DYNAMICS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Memory Size = 2 * Batch * SeqLen * NumLayers * NumHeads * HeadDim * BytesPerElem</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card243b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Prefill Phase -->
    <rect x="25" y="25" width="325" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="187" y="48" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Prompt Prefill Phase (Compute-Bound)</text>
    <text x="40" y="75" fill="#cbd5e1" font-size="8">• Evaluates all N prompt tokens in parallel forward pass</text>
    <text x="40" y="95" fill="#cbd5e1" font-size="8">• High Arithmetic Intensity (Saturates Tensor Cores)</text>
    <text x="40" y="115" fill="#cbd5e1" font-size="8">• Populates initial Key and Value tensors in GPU VRAM</text>
    <text x="40" y="135" fill="#34d399" font-size="8">• Generates the first token (Time-To-First-Token, TTFT)</text>
    <rect x="40" y="160" width="295" height="90" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="187" y="195" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">Dense Matrix Multiply GEMM</text>
    <text x="187" y="220" fill="#94a3b8" font-size="8" text-anchor="middle">Hardware Utilization: &gt; 65% MFU</text>

    <!-- Right: Generation Phase -->
    <rect x="370" y="25" width="325" height="245" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="532" y="48" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. Token Decoding Phase (Memory-Bound)</text>
    <text x="385" y="75" fill="#cbd5e1" font-size="8">• Generates 1 token per step autoregressively</text>
    <text x="385" y="95" fill="#cbd5e1" font-size="8">• Low Arithmetic Intensity (GEMV: Vector-Matrix Multiply)</text>
    <text x="385" y="115" fill="#cbd5e1" font-size="8">• Must reload entire multi-gigabyte KV cache on every step!</text>
    <text x="385" y="135" fill="#fb7185" font-size="8">• Speed limited strictly by HBM3 GPU memory bandwidth</text>
    <rect x="385" y="160" width="295" height="90" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="532" y="195" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">KV Cache Growth: Linear with Sequence Length</text>
    <text x="532" y="220" fill="#34d399" font-size="8" text-anchor="middle">LLaMA-3-70B 8k Context: ~10.5 GB VRAM per Request!</text>
  </g>
</svg>
