<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Local and continuous integration</title>
  <style>
    .local-ci-bg   { fill: #f8fafc; }
    .local-ci-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-ci-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-ci-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-ci-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-ci-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-ci-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-ci-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-ci-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-ci-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-ci-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-ci-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-ci-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .local-ci-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .local-ci-stage { opacity: 1; }

    .local-ci-s0 { animation-delay: 0.00s; }
    .local-ci-e0 { animation-delay: 0.00s; }
    .local-ci-s1 { animation-delay: 1.28s; }
    .local-ci-e1 { animation-delay: 1.28s; }
    .local-ci-s2 { animation-delay: 2.56s; }
    .local-ci-e2 { animation-delay: 2.56s; }
    .local-ci-s3 { animation-delay: 3.84s; }
    .local-ci-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .local-ci-conn  { animation: local-ci-trace 6.4s ease-in-out infinite; }
      .local-ci-stage { animation: local-ci-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes local-ci-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes local-ci-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .local-ci-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .local-ci-stage { animation: local-ci-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes local-ci-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="local-ci-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="local-ci-bg" width="980" height="322"/>
  <text class="local-ci-h1"  x="30" y="40">Local and continuous integration</text>
  <text class="local-ci-sub" x="30" y="64">Four steps.</text>
  <g class="local-ci-stage local-ci-s0">
    <rect class="local-ci-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="local-ci-step" x="44" y="142">01</text>
    <text class="local-ci-name" x="70" y="142">Run the gates locally, before committing</text>
    <text class="local-ci-desc" x="44" y="166">So failures are found in</text>
    <text class="local-ci-desc" x="44" y="182">seconds.</text>
  </g>
  <line class="local-ci-line local-ci-conn local-ci-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#local-ci-tip)"/>
  <g class="local-ci-stage local-ci-s1">
    <rect class="local-ci-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="local-ci-step" x="280" y="142">02</text>
    <text class="local-ci-name" x="306" y="142">From one configuration file</text>
    <text class="local-ci-desc" x="280" y="166">Shared by the developer and the</text>
    <text class="local-ci-desc" x="280" y="182">build.</text>
  </g>
  <line class="local-ci-line local-ci-conn local-ci-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#local-ci-tip)"/>
  <g class="local-ci-stage local-ci-s2">
    <rect class="local-ci-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="local-ci-step" x="516" y="142">03</text>
    <text class="local-ci-name" x="542" y="142">And again in the build, authoritatively</text>
    <text class="local-ci-desc" x="516" y="166">Since local runs can be skipped.</text>
  </g>
  <line class="local-ci-line local-ci-conn local-ci-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#local-ci-tip)"/>
  <g class="local-ci-stage local-ci-s3">
    <rect class="local-ci-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="local-ci-step" x="752" y="142">04</text>
    <text class="local-ci-name" x="778" y="142">With identical results either way</text>
    <text class="local-ci-desc" x="752" y="166">Or the build becomes a lottery.</text>
  </g>
  <text class="local-ci-sub" x="30" y="304">A build that fails on something the local run passed destroys trust in both, which is why the single shared configuration matters more than the tooling choice.</text>
</svg>
