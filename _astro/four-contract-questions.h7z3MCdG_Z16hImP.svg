<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Hunt for these and an unfamiliar page becomes usable in minutes.">
  <title>Four questions every API's docs answer</title>
  <style>
    .four-contract-questions-bg   { fill: #f8fafc; }
    .four-contract-questions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-contract-questions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-contract-questions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-contract-questions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-contract-questions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-contract-questions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-contract-questions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-contract-questions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-contract-questions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-contract-questions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-contract-questions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-contract-questions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-contract-questions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-contract-questions-stage { opacity: 1; }

    .four-contract-questions-s0 { animation-delay: 0.00s; }
    .four-contract-questions-e0 { animation-delay: 0.00s; }
    .four-contract-questions-s1 { animation-delay: 1.28s; }
    .four-contract-questions-e1 { animation-delay: 1.28s; }
    .four-contract-questions-s2 { animation-delay: 2.56s; }
    .four-contract-questions-e2 { animation-delay: 2.56s; }
    .four-contract-questions-s3 { animation-delay: 3.84s; }
    .four-contract-questions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-contract-questions-conn  { animation: four-contract-questions-trace 6.4s ease-in-out infinite; }
      .four-contract-questions-stage { animation: four-contract-questions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-contract-questions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-contract-questions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-contract-questions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-contract-questions-stage { animation: four-contract-questions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-contract-questions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-contract-questions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-contract-questions-bg" width="980" height="322"/>
  <text class="four-contract-questions-h1"  x="30" y="40">Four questions every API's docs answer</text>
  <text class="four-contract-questions-sub" x="30" y="64">Hunt for these and an unfamiliar page becomes usable in minutes.</text>
  <g class="four-contract-questions-stage four-contract-questions-s0">
    <rect class="four-contract-questions-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-contract-questions-step" x="44" y="142">01</text>
    <text class="four-contract-questions-name" x="70" y="142">Which endpoint?</text>
    <text class="four-contract-questions-desc" x="44" y="166">The base URL and the path that</text>
    <text class="four-contract-questions-desc" x="44" y="182">returns what you actually want.</text>
    <text class="four-contract-questions-edge" x="44" y="242">where</text>
  </g>
  <line class="four-contract-questions-line four-contract-questions-conn four-contract-questions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-contract-questions-tip)"/>
  <g class="four-contract-questions-stage four-contract-questions-s1">
    <rect class="four-contract-questions-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-contract-questions-step" x="280" y="142">02</text>
    <text class="four-contract-questions-name" x="306" y="142">Which parameters?</text>
    <text class="four-contract-questions-desc" x="280" y="166">Required and optional, and what</text>
    <text class="four-contract-questions-desc" x="280" y="182">values each accepts.</text>
    <text class="four-contract-questions-edge" x="280" y="242">what</text>
  </g>
  <line class="four-contract-questions-line four-contract-questions-conn four-contract-questions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-contract-questions-tip)"/>
  <g class="four-contract-questions-stage four-contract-questions-s2">
    <rect class="four-contract-questions-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-contract-questions-step" x="516" y="142">03</text>
    <text class="four-contract-questions-name" x="542" y="142">What authentication?</text>
    <text class="four-contract-questions-desc" x="516" y="166">A key, a token, or none. And</text>
    <text class="four-contract-questions-desc" x="516" y="182">which header carries it.</text>
    <text class="four-contract-questions-edge" x="516" y="242">who</text>
  </g>
  <line class="four-contract-questions-line four-contract-questions-conn four-contract-questions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-contract-questions-tip)"/>
  <g class="four-contract-questions-stage four-contract-questions-s3">
    <rect class="four-contract-questions-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-contract-questions-step" x="752" y="142">04</text>
    <text class="four-contract-questions-name" x="778" y="142">What does success look like?</text>
    <text class="four-contract-questions-desc" x="752" y="166">Which fields, nested how. This</text>
    <text class="four-contract-questions-desc" x="752" y="182">is what your jq path has to</text>
    <text class="four-contract-questions-desc" x="752" y="198">match.</text>
    <text class="four-contract-questions-edge" x="752" y="242">shape</text>
  </g>
  <text class="four-contract-questions-sub" x="30" y="304">Everything else on the page is elaboration. Answer these four and you can make a call; answer them wrong and no amount of reading further will help.</text>
</svg>
