<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which words caused this score?">
  <title>Attributing a prediction to tokens</title>
  <style>
    .attribution-bg   { fill: #f8fafc; }
    .attribution-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attribution-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attribution-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attribution-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attribution-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attribution-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attribution-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .attribution-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .attribution-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .attribution-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .attribution-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .attribution-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .attribution-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .attribution-stage { opacity: 1; }

    .attribution-s0 { animation-delay: 0.00s; }
    .attribution-e0 { animation-delay: 0.00s; }
    .attribution-s1 { animation-delay: 1.28s; }
    .attribution-e1 { animation-delay: 1.28s; }
    .attribution-s2 { animation-delay: 2.56s; }
    .attribution-e2 { animation-delay: 2.56s; }
    .attribution-s3 { animation-delay: 3.84s; }
    .attribution-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .attribution-conn  { animation: attribution-trace 6.4s ease-in-out infinite; }
      .attribution-stage { animation: attribution-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes attribution-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes attribution-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .attribution-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .attribution-stage { animation: attribution-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes attribution-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="attribution-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="attribution-bg" width="980" height="322"/>
  <text class="attribution-h1"  x="30" y="40">Attributing a prediction to tokens</text>
  <text class="attribution-sub" x="30" y="64">Which words caused this score?</text>
  <g class="attribution-stage attribution-s0">
    <rect class="attribution-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="attribution-step" x="44" y="142">01</text>
    <text class="attribution-name" x="70" y="142">Compute the gradient of the output</text>
    <text class="attribution-desc" x="44" y="166">With respect to each input</text>
    <text class="attribution-desc" x="44" y="182">embedding.</text>
  </g>
  <line class="attribution-line attribution-conn attribution-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#attribution-tip)"/>
  <g class="attribution-stage attribution-s1">
    <rect class="attribution-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="attribution-step" x="280" y="142">02</text>
    <text class="attribution-name" x="306" y="142">Take a magnitude per token</text>
    <text class="attribution-desc" x="280" y="166">How much would changing this</text>
    <text class="attribution-desc" x="280" y="182">token change the prediction?</text>
  </g>
  <line class="attribution-line attribution-conn attribution-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#attribution-tip)"/>
  <g class="attribution-stage attribution-s2">
    <rect class="attribution-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="attribution-step" x="516" y="142">03</text>
    <text class="attribution-name" x="542" y="142">Producing a per-token heatmap</text>
    <text class="attribution-desc" x="516" y="166">Which words the prediction</text>
    <text class="attribution-desc" x="516" y="182">actually rests on.</text>
  </g>
  <line class="attribution-line attribution-conn attribution-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#attribution-tip)"/>
  <g class="attribution-stage attribution-s3">
    <rect class="attribution-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="attribution-step" x="752" y="142">04</text>
    <text class="attribution-name" x="778" y="142">Which is a debugging tool</text>
    <text class="attribution-desc" x="752" y="166">A model keying on an artefact is</text>
    <text class="attribution-desc" x="752" y="182">visible immediately.</text>
  </g>
  <text class="attribution-sub" x="30" y="304">The debugging use is where this earns its place: a sentiment model attributing everything to a product name rather than the opinion has learned the wrong thing, and no metric reveals it.</text>
</svg>
