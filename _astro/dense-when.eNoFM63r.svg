<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Annotation cost decides more than accuracy.">
  <title>Choosing the right task</title>
  <style>
    .dense-when-bg   { fill: #f8fafc; }
    .dense-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dense-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dense-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dense-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dense-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dense-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dense-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dense-when-row { opacity: 1; }
    .dense-when-r0 { animation-delay: 0.00s; }
    .dense-when-r1 { animation-delay: 0.45s; }
    .dense-when-r2 { animation-delay: 0.90s; }
    .dense-when-r3 { animation-delay: 1.35s; }
    .dense-when-r4 { animation-delay: 1.80s; }
    .dense-when-row { animation: dense-when-reveal 7.3s ease-in-out infinite; }
    @keyframes dense-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dense-when-bg" width="980" height="390"/>
  <text class="dense-when-h1"  x="30" y="40">Choosing the right task</text>
  <text class="dense-when-sub" x="30" y="64">Annotation cost decides more than accuracy.</text>
  <rect class="dense-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dense-when-name" x="46" y="122">Choose the cheapest sufficient</text>
  <text class="dense-when-desc" x="46" y="142">By what the application needs.</text>
  <text class="dense-when-desc dense-when-row dense-when-r0" x="46" y="182">Classification if a label suffices</text>
  <text class="dense-when-desc dense-when-row dense-when-r1" x="46" y="216">Detection if location and count matter</text>
  <text class="dense-when-desc dense-when-row dense-when-r2" x="46" y="250">Segmentation if boundaries matter</text>
  <text class="dense-when-desc dense-when-row dense-when-r3" x="46" y="284">Annotation cost rises steeply</text>
  <text class="dense-when-desc dense-when-row dense-when-r4" x="46" y="318">So does inference cost</text>
  <rect class="dense-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dense-when-name" x="526" y="122">Which is usually less than assumed</text>
  <text class="dense-when-desc" x="526" y="142">A common over-specification.</text>
  <text class="dense-when-desc dense-when-row dense-when-r0" x="526" y="182">"Find the defects" may need only detection</text>
  <text class="dense-when-desc dense-when-row dense-when-r1" x="526" y="216">"Is there a defect" needs only classification</text>
  <text class="dense-when-desc dense-when-row dense-when-r2" x="526" y="250">Pixel masks cost far more to annotate</text>
  <text class="dense-when-desc dense-when-row dense-when-r3" x="526" y="284">And often answer a question nobody asked</text>
  <text class="dense-when-desc dense-when-row dense-when-r4" x="526" y="318">Start with the coarsest that works</text>
  <text class="dense-when-sub" x="30" y="372">Over-specifying the task is a common and expensive error: pixel-level annotation can cost an order of magnitude more per image than a bounding box, for precision the application never uses.</text>
</svg>
