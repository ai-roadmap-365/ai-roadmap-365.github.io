<svg role="img" aria-label="Complete Transformer Encoder Decoder architecture diagram showing stacked attention blocks residual connections feed forward networks and cross attention" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <title>Complete Transformer Encoder-Decoder Architecture</title>
  <defs>
    <linearGradient id="bg227a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card227" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="440" fill="url(#bg227a)" rx="12"/>
  <text x="425" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">COMPLETE TRANSFORMER ENCODER-DECODER ARCHITECTURE</text>
  <text x="425" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Vaswani et al. (2017): Multi-Head Self-Attention, Cross-Attention, Residual Streams, and FFN</text>
  <g transform="translate(45, 70)">
    <rect width="760" height="345" fill="url(#card227)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: ENCODER STACK (Blue) -->
    <rect x="35" y="20" width="310" height="305" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="190" y="42" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">ENCODER (N = 6 Layers)</text>
    
    <!-- Feed-Forward Block -->
    <rect x="55" y="60" width="270" height="45" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="190" y="82" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Feed-Forward (MLP: 4 × d_model)</text>
    <text x="190" y="96" fill="#94a3b8" font-size="8" text-anchor="middle">Linear -> GELU/ReLU -> Linear</text>

    <!-- Add & Norm -->
    <rect x="105" y="115" width="170" height="25" fill="#334155" stroke="#fbbf24" rx="3"/>
    <text x="190" y="132" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Add &amp; LayerNorm</text>

    <!-- Multi-Head Self-Attention -->
    <rect x="55" y="150" width="270" height="45" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="190" y="172" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Multi-Head Self-Attention</text>
    <text x="190" y="186" fill="#94a3b8" font-size="8" text-anchor="middle">Bidirectional (All-to-All)</text>

    <!-- Add & Norm -->
    <rect x="105" y="205" width="170" height="25" fill="#334155" stroke="#fbbf24" rx="3"/>
    <text x="190" y="222" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Add &amp; LayerNorm</text>

    <!-- Input Embedding + Positional Encoding -->
    <rect x="55" y="245" width="270" height="50" fill="#065f46" stroke="#10b981" rx="4"/>
    <text x="190" y="268" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">Input Embedding + Positional Encoding</text>
    <text x="190" y="284" fill="#cbd5e1" font-size="8" text-anchor="middle">Source Tokens: "The animal didn't cross..."</text>

    <!-- Cross-Attention Connector: Encoder Memory to Decoder -->
    <path d="M 345 82 L 415 82 L 415 172 L 435 172" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
    <text x="390" y="130" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Keys (K), Values (V)</text>

    <!-- Right: DECODER STACK (Purple) -->
    <rect x="415" y="20" width="310" height="305" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="570" y="42" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">DECODER (N = 6 Layers)</text>

    <!-- Feed-Forward -->
    <rect x="435" y="55" width="270" height="40" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="570" y="75" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Feed-Forward (MLP)</text>
    <text x="570" y="88" fill="#94a3b8" font-size="7" text-anchor="middle">Add &amp; LayerNorm</text>

    <!-- Cross-Attention -->
    <rect x="435" y="105" width="270" height="45" fill="#1e293b" stroke="#fbbf24" stroke-width="2" rx="4"/>
    <text x="570" y="125" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Cross-Attention (Enc-Dec)</text>
    <text x="570" y="140" fill="#cbd5e1" font-size="7" text-anchor="middle">Q from Decoder, K/V from Encoder</text>

    <!-- Masked Multi-Head Self-Attention -->
    <rect x="435" y="160" width="270" height="45" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="570" y="180" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Masked Multi-Head Attention</text>
    <text x="570" y="195" fill="#cbd5e1" font-size="7" text-anchor="middle">Causal (No Looking Ahead!)</text>

    <!-- Output Embedding + Positional Encoding -->
    <rect x="435" y="215" width="270" height="45" fill="#065f46" stroke="#10b981" rx="4"/>
    <text x="570" y="235" fill="#a7f3d0" font-size="9" font-weight="700" text-anchor="middle">Output Embedding + Positional Encoding</text>
    <text x="570" y="250" fill="#cbd5e1" font-size="7" text-anchor="middle">Target Tokens (Shifted Right)</text>

    <!-- Linear & Softmax Classifier Head -->
    <rect x="435" y="270" width="270" height="45" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="570" y="290" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Linear Classifier + Softmax</text>
    <text x="570" y="305" fill="#f8fafc" font-size="8" text-anchor="middle">Vocabulary Logits -> Next Token</text>
  </g>
</svg>
