<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what they punish.">
  <title>Two error measures</title>
  <style>
    .rmse-mae-bg   { fill: #f8fafc; }
    .rmse-mae-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rmse-mae-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rmse-mae-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rmse-mae-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rmse-mae-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rmse-mae-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rmse-mae-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rmse-mae-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rmse-mae-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rmse-mae-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rmse-mae-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rmse-mae-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rmse-mae-row { opacity: 1; }
    .rmse-mae-r0 { animation-delay: 0.00s; }
    .rmse-mae-r1 { animation-delay: 0.45s; }
    .rmse-mae-r2 { animation-delay: 0.90s; }
    .rmse-mae-r3 { animation-delay: 1.35s; }
    .rmse-mae-r4 { animation-delay: 1.80s; }
    .rmse-mae-row { animation: rmse-mae-reveal 7.3s ease-in-out infinite; }
    @keyframes rmse-mae-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rmse-mae-bg" width="980" height="390"/>
  <text class="rmse-mae-h1"  x="30" y="40">Two error measures</text>
  <text class="rmse-mae-sub" x="30" y="64">By what they punish.</text>
  <rect class="rmse-mae-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rmse-mae-name" x="46" y="122">Root mean squared error</text>
  <text class="rmse-mae-desc" x="46" y="142">Punishes large errors.</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r0" x="46" y="182">Squares before averaging</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r1" x="46" y="216">One large error dominates</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r2" x="46" y="250">In the target's units</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r3" x="46" y="284">Corresponds to the squared-error loss</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r4" x="46" y="318">Right when large errors are disproportionately bad</text>
  <rect class="rmse-mae-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rmse-mae-name" x="526" y="122">Mean absolute error</text>
  <text class="rmse-mae-desc" x="526" y="142">Treats errors equally.</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r0" x="526" y="182">Averages absolute differences</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r1" x="526" y="216">Every error counts once</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r2" x="526" y="250">Also in the target's units</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r3" x="526" y="284">Corresponds to the absolute-error loss</text>
  <text class="rmse-mae-desc rmse-mae-row rmse-mae-r4" x="526" y="318">Right when they are not</text>
  <text class="rmse-mae-sub" x="30" y="372">Both are in the target's units and they answer different questions, so reporting both costs nothing and prevents the reader assuming the wrong one.</text>
</svg>
