<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The state is real. It just does not live in the protocol.">
  <title>How a stateless protocol feels continuous</title>
  <style>
    .cookie-round-trip-bg   { fill: #f8fafc; }
    .cookie-round-trip-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-round-trip-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-round-trip-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-round-trip-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-round-trip-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-round-trip-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cookie-round-trip-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cookie-round-trip-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cookie-round-trip-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cookie-round-trip-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cookie-round-trip-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cookie-round-trip-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cookie-round-trip-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cookie-round-trip-stage { opacity: 1; }

    .cookie-round-trip-s0 { animation-delay: 0.00s; }
    .cookie-round-trip-e0 { animation-delay: 0.00s; }
    .cookie-round-trip-s1 { animation-delay: 1.28s; }
    .cookie-round-trip-e1 { animation-delay: 1.28s; }
    .cookie-round-trip-s2 { animation-delay: 2.56s; }
    .cookie-round-trip-e2 { animation-delay: 2.56s; }
    .cookie-round-trip-s3 { animation-delay: 3.84s; }
    .cookie-round-trip-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cookie-round-trip-conn  { animation: cookie-round-trip-trace 6.4s ease-in-out infinite; }
      .cookie-round-trip-stage { animation: cookie-round-trip-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cookie-round-trip-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cookie-round-trip-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cookie-round-trip-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cookie-round-trip-stage { animation: cookie-round-trip-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cookie-round-trip-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cookie-round-trip-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cookie-round-trip-bg" width="980" height="322"/>
  <text class="cookie-round-trip-h1"  x="30" y="40">How a stateless protocol feels continuous</text>
  <text class="cookie-round-trip-sub" x="30" y="64">The state is real. It just does not live in the protocol.</text>
  <g class="cookie-round-trip-stage cookie-round-trip-s0">
    <rect class="cookie-round-trip-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cookie-round-trip-step" x="44" y="142">01</text>
    <text class="cookie-round-trip-name" x="70" y="142">You log in</text>
    <text class="cookie-round-trip-desc" x="44" y="166">One ordinary POST with your</text>
    <text class="cookie-round-trip-desc" x="44" y="182">credentials.</text>
  </g>
  <line class="cookie-round-trip-line cookie-round-trip-conn cookie-round-trip-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cookie-round-trip-tip)"/>
  <g class="cookie-round-trip-stage cookie-round-trip-s1">
    <rect class="cookie-round-trip-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cookie-round-trip-step" x="280" y="142">02</text>
    <text class="cookie-round-trip-name" x="306" y="142">Set-Cookie comes back</text>
    <text class="cookie-round-trip-desc" x="280" y="166">A small value, usually a random</text>
    <text class="cookie-round-trip-desc" x="280" y="182">session identifier.</text>
    <text class="cookie-round-trip-edge" x="280" y="242">Set-Cookie</text>
  </g>
  <line class="cookie-round-trip-line cookie-round-trip-conn cookie-round-trip-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cookie-round-trip-tip)"/>
  <g class="cookie-round-trip-stage cookie-round-trip-s2">
    <rect class="cookie-round-trip-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cookie-round-trip-step" x="516" y="142">03</text>
    <text class="cookie-round-trip-name" x="542" y="142">Your client returns it</text>
    <text class="cookie-round-trip-desc" x="516" y="166">Automatically, in a Cookie</text>
    <text class="cookie-round-trip-desc" x="516" y="182">header, on every later request.</text>
    <text class="cookie-round-trip-edge" x="516" y="242">Cookie</text>
  </g>
  <line class="cookie-round-trip-line cookie-round-trip-conn cookie-round-trip-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cookie-round-trip-tip)"/>
  <g class="cookie-round-trip-stage cookie-round-trip-s3">
    <rect class="cookie-round-trip-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cookie-round-trip-step" x="752" y="142">04</text>
    <text class="cookie-round-trip-name" x="778" y="142">The server looks you up</text>
    <text class="cookie-round-trip-desc" x="752" y="166">Real session data lives in its</text>
    <text class="cookie-round-trip-desc" x="752" y="182">own storage, keyed by that</text>
    <text class="cookie-round-trip-desc" x="752" y="198">identifier.</text>
  </g>
  <text class="cookie-round-trip-sub" x="30" y="304">Model APIs skip this entirely and put a long-lived token in Authorization on every request — the same idea with the session step removed.</text>
</svg>
