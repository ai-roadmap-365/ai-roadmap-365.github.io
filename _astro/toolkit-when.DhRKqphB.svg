<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to build a toolkit</title>
  <style>
    .toolkit-when-bg   { fill: #f8fafc; }
    .toolkit-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toolkit-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .toolkit-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .toolkit-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .toolkit-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .toolkit-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .toolkit-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toolkit-when-row { opacity: 1; }
    .toolkit-when-r0 { animation-delay: 0.00s; }
    .toolkit-when-r1 { animation-delay: 0.45s; }
    .toolkit-when-r2 { animation-delay: 0.90s; }
    .toolkit-when-r3 { animation-delay: 1.35s; }
    .toolkit-when-r4 { animation-delay: 1.80s; }
    .toolkit-when-row { animation: toolkit-when-reveal 7.3s ease-in-out infinite; }
    @keyframes toolkit-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="toolkit-when-bg" width="980" height="390"/>
  <text class="toolkit-when-h1"  x="30" y="40">When to build a toolkit</text>
  <text class="toolkit-when-sub" x="30" y="64">And when not to.</text>
  <rect class="toolkit-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="toolkit-when-name" x="46" y="122">Build one</text>
  <text class="toolkit-when-desc" x="46" y="142">Four cases.</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r0" x="46" y="182">Several related scripts exist already</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r1" x="46" y="216">More than one person runs them</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r2" x="46" y="250">They share configuration or credentials</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r3" x="46" y="284">They are run regularly</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r4" x="46" y="318">Consistency matters for safety</text>
  <rect class="toolkit-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="toolkit-when-name" x="526" y="122">Do not</text>
  <text class="toolkit-when-desc" x="526" y="142">Also four.</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r0" x="526" y="182">One script, run by one person</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r1" x="526" y="216">A one-off migration</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r2" x="526" y="250">The work is genuinely unrelated</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r3" x="526" y="284">Nobody will maintain it</text>
  <text class="toolkit-when-desc toolkit-when-row toolkit-when-r4" x="526" y="318">Where an existing tool already does it</text>
  <text class="toolkit-when-sub" x="30" y="372">The last row is worth a search before starting: most internal toolkits duplicate something that already exists and is better maintained.</text>
</svg>
