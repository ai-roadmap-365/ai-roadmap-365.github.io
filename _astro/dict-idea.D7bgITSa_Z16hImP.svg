<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What a dictionary is</title>
  <style>
    .dict-idea-bg   { fill: #f8fafc; }
    .dict-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dict-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dict-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dict-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dict-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dict-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dict-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dict-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dict-idea-stage { opacity: 1; }

    .dict-idea-s0 { animation-delay: 0.00s; }
    .dict-idea-e0 { animation-delay: 0.00s; }
    .dict-idea-s1 { animation-delay: 1.28s; }
    .dict-idea-e1 { animation-delay: 1.28s; }
    .dict-idea-s2 { animation-delay: 2.56s; }
    .dict-idea-e2 { animation-delay: 2.56s; }
    .dict-idea-s3 { animation-delay: 3.84s; }
    .dict-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dict-idea-conn  { animation: dict-idea-trace 6.4s ease-in-out infinite; }
      .dict-idea-stage { animation: dict-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dict-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dict-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dict-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dict-idea-stage { animation: dict-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dict-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dict-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dict-idea-bg" width="980" height="322"/>
  <text class="dict-idea-h1"  x="30" y="40">What a dictionary is</text>
  <text class="dict-idea-sub" x="30" y="64">Four properties.</text>
  <g class="dict-idea-stage dict-idea-s0">
    <rect class="dict-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dict-idea-step" x="44" y="142">01</text>
    <text class="dict-idea-name" x="70" y="142">Pairs of keys and values</text>
    <text class="dict-idea-desc" x="44" y="166">Looked up by key, never by</text>
    <text class="dict-idea-desc" x="44" y="182">position.</text>
  </g>
  <line class="dict-idea-line dict-idea-conn dict-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dict-idea-tip)"/>
  <g class="dict-idea-stage dict-idea-s1">
    <rect class="dict-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dict-idea-step" x="280" y="142">02</text>
    <text class="dict-idea-name" x="306" y="142">Lookup is constant time</text>
    <text class="dict-idea-desc" x="280" y="166">However many entries there are.</text>
  </g>
  <line class="dict-idea-line dict-idea-conn dict-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dict-idea-tip)"/>
  <g class="dict-idea-stage dict-idea-s2">
    <rect class="dict-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dict-idea-step" x="516" y="142">03</text>
    <text class="dict-idea-name" x="542" y="142">Keys must be hashable, so effectively immutable</text>
    <text class="dict-idea-desc" x="516" y="166">Which is why a list cannot be</text>
    <text class="dict-idea-desc" x="516" y="182">one.</text>
  </g>
  <line class="dict-idea-line dict-idea-conn dict-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dict-idea-tip)"/>
  <g class="dict-idea-stage dict-idea-s3">
    <rect class="dict-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dict-idea-step" x="752" y="142">04</text>
    <text class="dict-idea-name" x="778" y="142">And insertion order is preserved</text>
    <text class="dict-idea-desc" x="752" y="166">Which is now guaranteed rather</text>
    <text class="dict-idea-desc" x="752" y="182">than incidental.</text>
  </g>
  <text class="dict-idea-sub" x="30" y="304">Constant-time lookup regardless of size is the property everything else follows from, and it is why dictionaries end up under configuration, caching and counting alike.</text>
</svg>
