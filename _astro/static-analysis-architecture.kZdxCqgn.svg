<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" font-family="system-ui, sans-serif">
  <title>Four quality gates over one source file: a formatter that decides how the code looks, a linter that flags suspicious patterns, a type checker that proves the type claims, and a test suite that checks behaviour, with all four reading their settings from one shared pyproject.toml</title>
  <rect x="0" y="0" width="900" height="700" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">Four gates, four different classes of bug</text>
  <text x="450" y="62" text-anchor="middle" font-size="15" fill="#1a202c">No gate can do another gate's job. A file is trustworthy only when it has passed all four.</text>

  <!-- Source -->
  <rect x="330" y="86" width="240" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">receipts.py</text>
  <text x="450" y="133" text-anchor="middle" font-size="14" fill="#1a202c">one source file, as you typed it</text>

  <!-- Fan-out lines to four gates -->
  <line x1="450" y1="144" x2="450" y2="168" stroke="#1a202c" stroke-width="2"/>
  <line x1="120" y1="168" x2="780" y2="168" stroke="#1a202c" stroke-width="2"/>
  <line x1="120" y1="168" x2="120" y2="196" stroke="#1a202c" stroke-width="2"/>
  <polygon points="120,200 114,186 126,186" fill="#1a202c"/>
  <line x1="340" y1="168" x2="340" y2="196" stroke="#1a202c" stroke-width="2"/>
  <polygon points="340,200 334,186 346,186" fill="#1a202c"/>
  <line x1="560" y1="168" x2="560" y2="196" stroke="#1a202c" stroke-width="2"/>
  <polygon points="560,200 554,186 566,186" fill="#1a202c"/>
  <line x1="780" y1="168" x2="780" y2="196" stroke="#1a202c" stroke-width="2"/>
  <polygon points="780,200 774,186 786,186" fill="#1a202c"/>

  <!-- Gate 1: formatter -->
  <rect x="20" y="202" width="200" height="228" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <rect x="20" y="202" width="200" height="34" fill="#1d4ed8" rx="8"/>
  <rect x="20" y="224" width="200" height="12" fill="#1d4ed8"/>
  <text x="120" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">FORMATTER</text>
  <text x="120" y="258" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">ruff format</text>
  <text x="34" y="284" font-size="14" font-weight="bold" fill="#1a202c">Decides how it LOOKS</text>
  <text x="34" y="306" font-size="14" fill="#1a202c">Rewrites quotes, spacing,</text>
  <text x="34" y="324" font-size="14" fill="#1a202c">line breaks. Deterministic</text>
  <text x="34" y="342" font-size="14" fill="#1a202c">and idempotent.</text>
  <text x="34" y="370" font-size="14" font-weight="bold" fill="#1a202c">Cannot tell you:</text>
  <text x="34" y="390" font-size="14" fill="#1a202c">whether the code is</text>
  <text x="34" y="408" font-size="14" fill="#1a202c">right about anything.</text>

  <!-- Gate 2: linter -->
  <rect x="240" y="202" width="200" height="228" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <rect x="240" y="202" width="200" height="34" fill="#1d4ed8" rx="8"/>
  <rect x="240" y="224" width="200" height="12" fill="#1d4ed8"/>
  <text x="340" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">LINTER</text>
  <text x="340" y="258" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">ruff check</text>
  <text x="254" y="284" font-size="14" font-weight="bold" fill="#1a202c">Flags suspicious</text>
  <text x="254" y="302" font-size="14" font-weight="bold" fill="#1a202c">PATTERNS</text>
  <text x="254" y="324" font-size="14" fill="#1a202c">Unused import (F401),</text>
  <text x="254" y="342" font-size="14" fill="#1a202c">mutable default (B006).</text>
  <text x="254" y="370" font-size="14" font-weight="bold" fill="#1a202c">Cannot tell you:</text>
  <text x="254" y="390" font-size="14" fill="#1a202c">whether the answer</text>
  <text x="254" y="408" font-size="14" fill="#1a202c">it computes is correct.</text>

  <!-- Gate 3: type checker -->
  <rect x="460" y="202" width="200" height="228" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <rect x="460" y="202" width="200" height="34" fill="#1d4ed8" rx="8"/>
  <rect x="460" y="224" width="200" height="12" fill="#1d4ed8"/>
  <text x="560" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">TYPE CHECKER</text>
  <text x="560" y="258" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">mypy (Day 75)</text>
  <text x="474" y="284" font-size="14" font-weight="bold" fill="#1a202c">Proves the TYPE claims</text>
  <text x="474" y="306" font-size="14" fill="#1a202c">Every call agrees with</text>
  <text x="474" y="324" font-size="14" fill="#1a202c">every annotation, on</text>
  <text x="474" y="342" font-size="14" fill="#1a202c">every path.</text>
  <text x="474" y="370" font-size="14" font-weight="bold" fill="#1a202c">Cannot tell you:</text>
  <text x="474" y="390" font-size="14" fill="#1a202c">whether a well-typed</text>
  <text x="474" y="408" font-size="14" fill="#1a202c">total is the right total.</text>

  <!-- Gate 4: tests -->
  <rect x="680" y="202" width="200" height="228" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <rect x="680" y="202" width="200" height="34" fill="#1d4ed8" rx="8"/>
  <rect x="680" y="224" width="200" height="12" fill="#1d4ed8"/>
  <text x="780" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">TEST SUITE</text>
  <text x="780" y="258" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">pytest (Days 71-74)</text>
  <text x="694" y="284" font-size="14" font-weight="bold" fill="#1a202c">Checks BEHAVIOUR</text>
  <text x="694" y="306" font-size="14" fill="#1a202c">Runs the code on real</text>
  <text x="694" y="324" font-size="14" fill="#1a202c">inputs and compares</text>
  <text x="694" y="342" font-size="14" fill="#1a202c">the answers.</text>
  <text x="694" y="370" font-size="14" font-weight="bold" fill="#1a202c">Cannot tell you:</text>
  <text x="694" y="390" font-size="14" fill="#1a202c">about the inputs you</text>
  <text x="694" y="408" font-size="14" fill="#1a202c">never thought to try.</text>

  <!-- Bug-class band -->
  <rect x="20" y="450" width="860" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
  <text x="34" y="472" font-size="14" font-weight="bold" fill="#1a202c">Bug it catches:</text>
  <text x="34" y="493" font-size="14" fill="#1a202c">an unreadable diff</text>
  <text x="254" y="493" font-size="14" fill="#1a202c">a shared basket</text>
  <text x="474" y="493" font-size="14" fill="#1a202c">cents passed as euros</text>
  <text x="694" y="493" font-size="14" fill="#1a202c">the tax is 21%, not 20%</text>

  <!-- Shared config -->
  <line x1="120" y1="430" x2="120" y2="446" stroke="#1a202c" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="340" y1="430" x2="340" y2="446" stroke="#1a202c" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="560" y1="430" x2="560" y2="446" stroke="#1a202c" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="780" y1="430" x2="780" y2="446" stroke="#1a202c" stroke-width="2" stroke-dasharray="4 3"/>

  <line x1="450" y1="502" x2="450" y2="530" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="450,534 444,520 456,520" fill="#1d4ed8"/>

  <rect x="180" y="536" width="540" height="140" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="562" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">pyproject.toml — one file, read by all four</text>
  <text x="204" y="590" font-size="14" fill="#1a202c">[tool.ruff]           line-length, target-version, extend-exclude</text>
  <text x="204" y="612" font-size="14" fill="#1a202c">[tool.ruff.lint]      select, ignore, extend-select</text>
  <text x="204" y="634" font-size="14" fill="#1a202c">[tool.ruff.lint.per-file-ignores]   "test_*.py" = ["S101"]</text>
  <text x="204" y="656" font-size="14" fill="#1a202c">[tool.ruff.format] · [tool.mypy] · [tool.pytest.ini_options]</text>
</svg>
