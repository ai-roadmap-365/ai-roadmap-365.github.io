<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" font-family="system-ui, sans-serif">
  <title>The runtime flow of one CLI command: parse arguments, load the JSON store, then a validation decision that either branches to an error exit or continues to mutate the records, save them, print a result, and exit zero</title>
  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One command's flow: parse, load, mutate, save, report</text>

  <!-- Parse args -->
  <rect x="300" y="56" width="160" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Parse args</text>
  <text x="380" y="96" text-anchor="middle" font-size="14" fill="#1a202c">argparse -> subcommand</text>

  <line x1="380" y1="106" x2="380" y2="132" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,132 374,120 386,120" fill="#1a202c"/>

  <!-- Load JSON -->
  <rect x="300" y="132" width="160" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Load JSON store</text>
  <text x="380" y="172" text-anchor="middle" font-size="14" fill="#1a202c">json.load -> list of dicts</text>

  <line x1="380" y1="182" x2="380" y2="206" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,206 374,194 386,194" fill="#1a202c"/>

  <!-- Validate decision -->
  <polygon points="380,214 486,266 380,318 274,266" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Input valid?</text>
  <text x="380" y="282" text-anchor="middle" font-size="14" fill="#1a202c">store readable?</text>

  <!-- No branch to error -->
  <text x="228" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="274" y1="266" x2="176" y2="266" stroke="#1a202c" stroke-width="2"/>
  <polygon points="176,266 188,260 188,272" fill="#1a202c"/>
  <rect x="30" y="238" width="146" height="60" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="103" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Print to stderr</text>
  <text x="103" y="283" text-anchor="middle" font-size="14" fill="#1a202c">return exit code 1</text>

  <!-- Yes branch down -->
  <text x="400" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="380" y1="318" x2="380" y2="344" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,344 374,332 386,332" fill="#1a202c"/>

  <!-- Mutate -->
  <rect x="300" y="344" width="160" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Mutate records</text>
  <text x="380" y="382" text-anchor="middle" font-size="14" fill="#1a202c">append / filter / edit</text>

  <line x1="380" y1="390" x2="380" y2="412" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,412 374,400 386,400" fill="#1a202c"/>

  <!-- Save -->
  <rect x="300" y="412" width="160" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="432" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Save JSON store</text>
  <text x="380" y="450" text-anchor="middle" font-size="14" fill="#1a202c">json.dump (read-only cmds skip)</text>

  <line x1="380" y1="458" x2="380" y2="480" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,480 374,468 386,468" fill="#1a202c"/>

  <!-- Report -->
  <rect x="300" y="480" width="160" height="34" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Print result, exit 0</text>

  <!-- Two exits note -->
  <line x1="103" y1="298" x2="103" y2="497" stroke="#1a202c" stroke-width="2"/>
  <line x1="103" y1="497" x2="298" y2="497" stroke="#1a202c" stroke-width="2"/>
  <polygon points="298,497 286,491 286,503" fill="#1a202c"/>
  <text x="560" y="150" font-size="14" font-weight="bold" fill="#1d4ed8">Two exits:</text>
  <text x="560" y="172" font-size="14" fill="#1a202c">success (0) and</text>
  <text x="560" y="190" font-size="14" fill="#1a202c">failure (non-zero).</text>
  <text x="560" y="214" font-size="14" fill="#1a202c">A caller reads the</text>
  <text x="560" y="232" font-size="14" fill="#1a202c">exit code to know.</text>
</svg>
