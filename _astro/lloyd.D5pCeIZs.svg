<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why it converges</title>
  <style>
    .lloyd-bg   { fill: #f8fafc; }
    .lloyd-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lloyd-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lloyd-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lloyd-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lloyd-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lloyd-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lloyd-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lloyd-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lloyd-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lloyd-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lloyd-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lloyd-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lloyd-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lloyd-stage { opacity: 1; }

    .lloyd-s0 { animation-delay: 0.00s; }
    .lloyd-e0 { animation-delay: 0.00s; }
    .lloyd-s1 { animation-delay: 1.28s; }
    .lloyd-e1 { animation-delay: 1.28s; }
    .lloyd-s2 { animation-delay: 2.56s; }
    .lloyd-e2 { animation-delay: 2.56s; }
    .lloyd-s3 { animation-delay: 3.84s; }
    .lloyd-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lloyd-conn  { animation: lloyd-trace 6.4s ease-in-out infinite; }
      .lloyd-stage { animation: lloyd-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lloyd-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lloyd-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lloyd-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lloyd-stage { animation: lloyd-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lloyd-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lloyd-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lloyd-bg" width="980" height="322"/>
  <text class="lloyd-h1"  x="30" y="40">Why it converges</text>
  <text class="lloyd-sub" x="30" y="64">Four steps.</text>
  <g class="lloyd-stage lloyd-s0">
    <rect class="lloyd-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lloyd-step" x="44" y="142">01</text>
    <text class="lloyd-name" x="70" y="142">Assignment fixes the centres and minimises over assignments</text>
    <text class="lloyd-desc" x="44" y="166">Which cannot increase the</text>
    <text class="lloyd-desc" x="44" y="182">objective.</text>
  </g>
  <line class="lloyd-line lloyd-conn lloyd-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lloyd-tip)"/>
  <g class="lloyd-stage lloyd-s1">
    <rect class="lloyd-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lloyd-step" x="280" y="142">02</text>
    <text class="lloyd-name" x="306" y="142">The update fixes assignments and minimises over centres</text>
    <text class="lloyd-desc" x="280" y="166">Which also cannot increase it.</text>
  </g>
  <line class="lloyd-line lloyd-conn lloyd-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lloyd-tip)"/>
  <g class="lloyd-stage lloyd-s2">
    <rect class="lloyd-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lloyd-step" x="516" y="142">03</text>
    <text class="lloyd-name" x="542" y="142">There are finitely many possible assignments</text>
    <text class="lloyd-desc" x="516" y="166">So the objective cannot decrease</text>
    <text class="lloyd-desc" x="516" y="182">forever.</text>
  </g>
  <line class="lloyd-line lloyd-conn lloyd-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lloyd-tip)"/>
  <g class="lloyd-stage lloyd-s3">
    <rect class="lloyd-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lloyd-step" x="752" y="142">04</text>
    <text class="lloyd-name" x="778" y="142">Therefore it terminates</text>
    <text class="lloyd-desc" x="752" y="166">Usually in a few dozen</text>
    <text class="lloyd-desc" x="752" y="182">iterations.</text>
    <text class="lloyd-edge" x="752" y="242">fast</text>
  </g>
  <text class="lloyd-sub" x="30" y="304">This alternating structure appears throughout optimisation — fix one set of variables, optimise the other, repeat — and the convergence argument is the same each time.</text>
</svg>
