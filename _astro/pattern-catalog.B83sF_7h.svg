<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Named, and reusable.">
  <title>Four core prompt patterns</title>
  <style>
    .pattern-catalog-bg   { fill: #f8fafc; }
    .pattern-catalog-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-catalog-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-catalog-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-catalog-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-catalog-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-catalog-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pattern-catalog-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pattern-catalog-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pattern-catalog-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pattern-catalog-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pattern-catalog-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pattern-catalog-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pattern-catalog-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pattern-catalog-stage { opacity: 1; }

    .pattern-catalog-s0 { animation-delay: 0.00s; }
    .pattern-catalog-e0 { animation-delay: 0.00s; }
    .pattern-catalog-s1 { animation-delay: 1.28s; }
    .pattern-catalog-e1 { animation-delay: 1.28s; }
    .pattern-catalog-s2 { animation-delay: 2.56s; }
    .pattern-catalog-e2 { animation-delay: 2.56s; }
    .pattern-catalog-s3 { animation-delay: 3.84s; }
    .pattern-catalog-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pattern-catalog-conn  { animation: pattern-catalog-trace 6.4s ease-in-out infinite; }
      .pattern-catalog-stage { animation: pattern-catalog-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pattern-catalog-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pattern-catalog-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pattern-catalog-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pattern-catalog-stage { animation: pattern-catalog-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pattern-catalog-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pattern-catalog-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pattern-catalog-bg" width="980" height="322"/>
  <text class="pattern-catalog-h1"  x="30" y="40">Four core prompt patterns</text>
  <text class="pattern-catalog-sub" x="30" y="64">Named, and reusable.</text>
  <g class="pattern-catalog-stage pattern-catalog-s0">
    <rect class="pattern-catalog-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-catalog-step" x="44" y="142">01</text>
    <text class="pattern-catalog-name" x="70" y="142">Persona</text>
    <text class="pattern-catalog-desc" x="44" y="166">Answer as a particular kind of</text>
    <text class="pattern-catalog-desc" x="44" y="182">expert. Shapes vocabulary and</text>
    <text class="pattern-catalog-desc" x="44" y="198">depth.</text>
  </g>
  <line class="pattern-catalog-line pattern-catalog-conn pattern-catalog-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pattern-catalog-tip)"/>
  <g class="pattern-catalog-stage pattern-catalog-s1">
    <rect class="pattern-catalog-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-catalog-step" x="280" y="142">02</text>
    <text class="pattern-catalog-name" x="306" y="142">Recipe</text>
    <text class="pattern-catalog-desc" x="280" y="166">Given a goal, produce the</text>
    <text class="pattern-catalog-desc" x="280" y="182">ordered steps to reach it.</text>
  </g>
  <line class="pattern-catalog-line pattern-catalog-conn pattern-catalog-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pattern-catalog-tip)"/>
  <g class="pattern-catalog-stage pattern-catalog-s2">
    <rect class="pattern-catalog-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-catalog-step" x="516" y="142">03</text>
    <text class="pattern-catalog-name" x="542" y="142">Flipped interaction</text>
    <text class="pattern-catalog-desc" x="516" y="166">The model asks the questions</text>
    <text class="pattern-catalog-desc" x="516" y="182">until it has enough.</text>
  </g>
  <line class="pattern-catalog-line pattern-catalog-conn pattern-catalog-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pattern-catalog-tip)"/>
  <g class="pattern-catalog-stage pattern-catalog-s3">
    <rect class="pattern-catalog-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-catalog-step" x="752" y="142">04</text>
    <text class="pattern-catalog-name" x="778" y="142">Output automation</text>
    <text class="pattern-catalog-desc" x="752" y="166">Produce a script rather than</text>
    <text class="pattern-catalog-desc" x="752" y="182">instructions to follow by hand.</text>
  </g>
  <text class="pattern-catalog-sub" x="30" y="304">Flipped interaction is the least used and most useful of the four: it moves the burden of specifying the task from the user to the model, which is where it belongs.</text>
</svg>
