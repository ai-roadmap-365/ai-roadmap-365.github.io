<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d114f-title d114f-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d114f-title">Inverse-CDF sampling: a uniform draw lands on the cdf staircase, projects down to a sample, and a histogram builds up</title>
  <desc id="d114f-desc">A vertical axis on the left carries a uniform draw U between 0 and 1. A horizontal line from U travels right until it meets the cdf staircase, then a vertical line drops from that meeting point down to the sampled value on the horizontal axis, which is added to a growing histogram underneath that approaches the true probability mass function shape as draws accumulate.</desc>

  <style>
    .d114f-bg { fill: #f8fafc; }
    .d114f-text { fill: #1a202c; }
    .d114f-muted { fill: #4a5568; }
    .d114f-panel-title { font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d114f-small { font-size: 13px; fill: #4a5568; }
    .d114f-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .d114f-axis { stroke: #64748b; stroke-width: 1.5; }
    .d114f-cdf { fill: none; stroke: #1d4ed8; stroke-width: 3; }
    .d114f-hist { fill: #94a3b8; }
    .d114f-hist-target { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 5 4; }

    .d114f-uline {
      stroke: #b45309; stroke-width: 2.5; stroke-dasharray: 6 5;
      animation: d114f-march 1.4s linear infinite;
    }
    @keyframes d114f-march { to { stroke-dashoffset: -22; } }

    .d114f-token {
      fill: #b45309;
      offset-path: path('M 70 176 L 500 176 L 500 500');
      offset-rotate: 0deg;
      animation: d114f-travel 5s ease-in-out infinite;
    }
    @keyframes d114f-travel {
      0%   { offset-distance: 0%; opacity: 1; }
      45%  { offset-distance: 55%; opacity: 1; }
      70%  { offset-distance: 100%; opacity: 1; }
      100% { offset-distance: 100%; opacity: 1; }
    }

    .d114f-bar1 { animation: d114f-grow1 5s ease-in-out infinite; transform-origin: bottom; }
    .d114f-bar2 { animation: d114f-grow2 5s ease-in-out infinite; transform-origin: bottom; }
    .d114f-bar3 { animation: d114f-grow3 5s ease-in-out infinite; transform-origin: bottom; }
    @keyframes d114f-grow1 { 0%,60% { transform: scaleY(0.7); } 75%,100% { transform: scaleY(1); } }
    @keyframes d114f-grow2 { 0%,60% { transform: scaleY(0.5); } 75%,100% { transform: scaleY(0.85); } }
    @keyframes d114f-grow3 { 0%,60% { transform: scaleY(0.3); } 75%,100% { transform: scaleY(0.65); } }

    .d114f-uval {
      animation: d114f-fadein 5s ease-in-out infinite;
    }
    @keyframes d114f-fadein { 0%,20% { opacity: 0; } 30%,100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .d114f-uline { animation: none; stroke-dasharray: none; }
      .d114f-token { animation: none; offset-distance: 55%; }
      .d114f-bar1, .d114f-bar2, .d114f-bar3 { animation: none; transform: scaleY(1); }
      .d114f-uval { animation: none; opacity: 1; }
    }
  </style>

  <rect class="d114f-bg" x="0" y="0" width="1200" height="640" />

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" class="d114f-text">Inverse-CDF sampling: one uniform draw, projected through the cdf</text>
  <text x="600" y="58" text-anchor="middle" class="d114f-small">draw U ~ Uniform(0,1) &#8594; follow it to the cdf staircase &#8594; drop down to the sampled value &#8594; the histogram grows</text>

  <!-- vertical U axis -->
  <line class="d114f-axis" x1="70" y1="120" x2="70" y2="500" />
  <text x="40" y="126" text-anchor="end" class="d114f-small">1.0</text>
  <text x="40" y="504" text-anchor="end" class="d114f-small">0.0</text>
  <text x="40" y="60" text-anchor="end" class="d114f-small" transform="rotate(0)"></text>
  <text x="20" y="310" text-anchor="middle" class="d114f-small" transform="rotate(-90 20 310)">U (uniform draw)</text>

  <!-- example U value marker -->
  <circle class="d114f-uval" cx="70" cy="176" r="6" fill="#b45309" />
  <text class="d114f-uval d114f-mono" x="20" y="180" text-anchor="end" font-size="13" fill="#b45309">U=0.60</text>

  <!-- horizontal line from U to cdf, marching dashes -->
  <line class="d114f-uline" x1="70" y1="176" x2="500" y2="176" />

  <!-- cdf staircase for the dice-sum pmf, same shape as the architecture diagram -->
  <g transform="translate(90,120)">
    <line class="d114f-axis" x1="0" y1="380" x2="700" y2="380" />
    <text x="700" y="400" text-anchor="end" class="d114f-small">sampled value (sum of two dice)</text>
    <!-- staircase boundaries at x = 63*k, k=0..11 over sums 2..12 -->
    <path class="d114f-cdf" d="
      M 0 369.4 L 63 369.4 L 63 349 L 126 349 L 126 316.7 L 189 316.7 L 189 271.7
      L 252 271.7 L 252 213.3 L 315 213.3 L 315 143.3 L 378 143.3 L 378 91.7
      L 441 91.7 L 441 41.7 L 504 41.7 L 504 12.5 L 567 12.5 L 567 -0.6
      L 630 -0.6 L 630 -10 L 700 -10
    " />
    <g class="d114f-small" text-anchor="middle" font-size="12">
      <text x="31" y="398">2</text><text x="94" y="398">3</text><text x="157" y="398">4</text>
      <text x="220" y="398">5</text><text x="283" y="398">6</text><text x="346" y="398" font-weight="700">7</text>
      <text x="409" y="398">8</text><text x="472" y="398">9</text><text x="535" y="398">10</text>
      <text x="598" y="398">11</text><text x="661" y="398">12</text>
    </g>
  </g>

  <!-- vertical drop marker where U meets the cdf: U=0.60 exceeds F(7)=0.5833, so the smallest value whose cdf is at least U is 8 -->
  <line class="d114f-axis" x1="500" y1="176" x2="500" y2="500" stroke-dasharray="3 3" opacity="0.5" />
  <text x="500" y="518" text-anchor="middle" class="d114f-mono" font-size="13" fill="#1d4ed8" font-weight="700">sample = 8</text>

  <!-- travelling token: horizontal then down -->
  <circle class="d114f-token" r="8" />

  <!-- growing histogram beneath, three example bars for sums 6,7,8 -->
  <g transform="translate(370,540)">
    <text x="60" y="-14" text-anchor="middle" class="d114f-small" font-weight="700">the histogram of draws builds toward the true pmf shape</text>
    <line class="d114f-axis" x1="0" y1="70" x2="200" y2="70" />
    <rect class="d114f-hist d114f-bar1" x="10"  y="0" width="40" height="70" />
    <rect class="d114f-hist d114f-bar2" x="80"  y="0" width="40" height="70" />
    <rect class="d114f-hist d114f-bar3" x="150" y="0" width="40" height="70" />
    <rect class="d114f-hist-target" x="10"  y="14" width="40" height="56" />
    <rect class="d114f-hist-target" x="80"  y="0"  width="40" height="70" />
    <rect class="d114f-hist-target" x="150" y="14" width="40" height="56" />
    <g class="d114f-small" text-anchor="middle" font-size="12">
      <text x="30" y="86">6</text><text x="100" y="86" font-weight="700">7</text><text x="170" y="86">8</text>
    </g>
    <text x="100" y="105" text-anchor="middle" class="d114f-small">dashed outline: the true pmf shape the histogram approaches</text>
  </g>

  <rect x="800" y="120" width="360" height="420" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="980" y="150" text-anchor="middle" class="d114f-panel-title" font-size="18">THE METHOD, IN WORDS</text>
  <text x="825" y="182" class="d114f-small">1. Draw U from Uniform(0, 1).</text>
  <text x="825" y="208" class="d114f-small">2. Find where U meets the cdf</text>
  <text x="825" y="228" class="d114f-small">   staircase — the smallest value</text>
  <text x="825" y="248" class="d114f-small">   whose cdf is at least U.</text>
  <text x="825" y="278" class="d114f-small">3. That value is the sample.</text>
  <text x="825" y="308" class="d114f-small">4. Repeat many times; the</text>
  <text x="825" y="328" class="d114f-small">   histogram of samples</text>
  <text x="825" y="348" class="d114f-small">   converges to the pmf.</text>
  <text x="825" y="390" class="d114f-small" font-weight="700">One uniform draw per sample —</text>
  <text x="825" y="410" class="d114f-small" font-weight="700">this is what Generator.exponential</text>
  <text x="825" y="430" class="d114f-small" font-weight="700">and similar methods do internally.</text>
  <text x="825" y="466" class="d114f-small">For the exponential distribution,</text>
  <text x="825" y="486" class="d114f-small">this collapses to a closed form:</text>
  <text x="825" y="510" class="d114f-mono" font-size="14" font-weight="700" fill="#1d4ed8">x = -ln(U) / lambda</text>
</svg>
