<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five checks. Skipping them is how automation becomes a liability.">
  <title>Before you schedule anything</title>
  <style>
    .unattended-checklist-bg   { fill: #f8fafc; }
    .unattended-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unattended-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unattended-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unattended-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unattended-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unattended-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unattended-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unattended-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unattended-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unattended-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unattended-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unattended-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .unattended-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .unattended-checklist-stage { opacity: 1; }

    .unattended-checklist-s0 { animation-delay: 0.00s; }
    .unattended-checklist-e0 { animation-delay: 0.00s; }
    .unattended-checklist-s1 { animation-delay: 1.33s; }
    .unattended-checklist-e1 { animation-delay: 1.33s; }
    .unattended-checklist-s2 { animation-delay: 2.67s; }
    .unattended-checklist-e2 { animation-delay: 2.67s; }
    .unattended-checklist-s3 { animation-delay: 4.00s; }
    .unattended-checklist-e3 { animation-delay: 4.00s; }
    .unattended-checklist-s4 { animation-delay: 5.33s; }
    .unattended-checklist-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .unattended-checklist-conn  { animation: unattended-checklist-trace 8s ease-in-out infinite; }
      .unattended-checklist-stage { animation: unattended-checklist-arrive 8s ease-in-out infinite; }
    }
    @keyframes unattended-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes unattended-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .unattended-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .unattended-checklist-stage { animation: unattended-checklist-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes unattended-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="unattended-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="unattended-checklist-bg" width="980" height="322"/>
  <text class="unattended-checklist-h1"  x="30" y="40">Before you schedule anything</text>
  <text class="unattended-checklist-sub" x="30" y="64">Five checks. Skipping them is how automation becomes a liability.</text>
  <g class="unattended-checklist-stage unattended-checklist-s0">
    <rect class="unattended-checklist-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="unattended-checklist-step" x="44" y="142">01</text>
    <text class="unattended-checklist-name" x="70" y="142">Does it fail loudly?</text>
    <text class="unattended-checklist-desc" x="44" y="166">set -euo pipefail, and</text>
    <text class="unattended-checklist-desc" x="44" y="182">errors written to stderr.</text>
  </g>
  <line class="unattended-checklist-line unattended-checklist-conn unattended-checklist-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#unattended-checklist-tip)"/>
  <g class="unattended-checklist-stage unattended-checklist-s1">
    <rect class="unattended-checklist-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="unattended-checklist-step" x="233" y="142">02</text>
    <text class="unattended-checklist-name" x="259" y="142">Are all paths absolute?</text>
    <text class="unattended-checklist-desc" x="233" y="166">cron's working directory</text>
    <text class="unattended-checklist-desc" x="233" y="182">is not your project, and</text>
    <text class="unattended-checklist-desc" x="233" y="198">its PATH is short.</text>
    <text class="unattended-checklist-edge" x="233" y="242">no relatives</text>
  </g>
  <line class="unattended-checklist-line unattended-checklist-conn unattended-checklist-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#unattended-checklist-tip)"/>
  <g class="unattended-checklist-stage unattended-checklist-s2">
    <rect class="unattended-checklist-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="unattended-checklist-step" x="422" y="142">03</text>
    <text class="unattended-checklist-name" x="448" y="142">Does it log what it did?</text>
    <text class="unattended-checklist-desc" x="422" y="166">With a timestamp on every</text>
    <text class="unattended-checklist-desc" x="422" y="182">line. You will read this</text>
    <text class="unattended-checklist-desc" x="422" y="198">at 3am.</text>
    <text class="unattended-checklist-edge" x="422" y="242">&gt;&gt; log 2&gt;&amp;1</text>
  </g>
  <line class="unattended-checklist-line unattended-checklist-conn unattended-checklist-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#unattended-checklist-tip)"/>
  <g class="unattended-checklist-stage unattended-checklist-s3">
    <rect class="unattended-checklist-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="unattended-checklist-step" x="611" y="142">04</text>
    <text class="unattended-checklist-name" x="637" y="142">Is it safe to run twice?</text>
    <text class="unattended-checklist-desc" x="611" y="166">Check before acting.</text>
    <text class="unattended-checklist-desc" x="611" y="182">Assume it will overlap</text>
    <text class="unattended-checklist-desc" x="611" y="198">with itself eventually.</text>
  </g>
  <line class="unattended-checklist-line unattended-checklist-conn unattended-checklist-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#unattended-checklist-tip)"/>
  <g class="unattended-checklist-stage unattended-checklist-s4">
    <rect class="unattended-checklist-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="unattended-checklist-step" x="800" y="142">05</text>
    <text class="unattended-checklist-name" x="826" y="142">Does it exit meaningfully?</text>
    <text class="unattended-checklist-desc" x="800" y="166">0 for success, non-zero</text>
    <text class="unattended-checklist-desc" x="800" y="182">for failure — so</text>
    <text class="unattended-checklist-desc" x="800" y="198">something can alert on</text>
    <text class="unattended-checklist-edge" x="800" y="242">exit code</text>
  </g>
  <text class="unattended-checklist-sub" x="30" y="304">Run the job by hand first, then run it under a restricted environment, and only then schedule it. Most cron failures would have been caught at step two.</text>
</svg>
