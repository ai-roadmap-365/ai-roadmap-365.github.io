<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what you have.">
  <title>Which recommendation approach when</title>
  <style>
    .recsys-when-bg   { fill: #f8fafc; }
    .recsys-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recsys-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recsys-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recsys-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recsys-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recsys-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recsys-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recsys-when-row { opacity: 1; }
    .recsys-when-r0 { animation-delay: 0.00s; }
    .recsys-when-r1 { animation-delay: 0.45s; }
    .recsys-when-r2 { animation-delay: 0.90s; }
    .recsys-when-r3 { animation-delay: 1.35s; }
    .recsys-when-r4 { animation-delay: 1.80s; }
    .recsys-when-row { animation: recsys-when-reveal 7.3s ease-in-out infinite; }
    @keyframes recsys-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recsys-when-bg" width="980" height="390"/>
  <text class="recsys-when-h1"  x="30" y="40">Which recommendation approach when</text>
  <text class="recsys-when-sub" x="30" y="64">By what you have.</text>
  <rect class="recsys-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recsys-when-name" x="46" y="122">The situation</text>
  <text class="recsys-when-desc" x="46" y="142">What you have.</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r0" x="46" y="182">Plenty of interaction history</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r1" x="46" y="216">A new user or a new item</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r2" x="46" y="250">Rich item metadata, little interaction</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r3" x="46" y="284">Sequential behaviour matters</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r4" x="46" y="318">Very large catalogue and user base</text>
  <rect class="recsys-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recsys-when-name" x="526" y="122">The approach</text>
  <text class="recsys-when-desc" x="526" y="142">What to use.</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r0" x="526" y="182">Matrix factorisation on implicit feedback</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r1" x="526" y="216">Content-based, until history accumulates</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r2" x="526" y="250">Content-based, with collaborative added later</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r3" x="526" y="284">Sequence models over interaction history</text>
  <text class="recsys-when-desc recsys-when-row recsys-when-r4" x="526" y="318">Two-stage: cheap retrieval, then ranking</text>
  <text class="recsys-when-sub" x="30" y="372">The two-stage pattern is the same retrieve-then-rerank architecture as the retrieval course, and it exists for the same reason: exact scoring cannot cover a large catalogue.</text>
</svg>
