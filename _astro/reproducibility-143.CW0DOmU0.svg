<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Proving reproducibility</title>
  <style>
    .reproducibility-143-bg   { fill: #f8fafc; }
    .reproducibility-143-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproducibility-143-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproducibility-143-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproducibility-143-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproducibility-143-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproducibility-143-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reproducibility-143-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reproducibility-143-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reproducibility-143-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reproducibility-143-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reproducibility-143-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reproducibility-143-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reproducibility-143-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reproducibility-143-stage { opacity: 1; }

    .reproducibility-143-s0 { animation-delay: 0.00s; }
    .reproducibility-143-e0 { animation-delay: 0.00s; }
    .reproducibility-143-s1 { animation-delay: 1.28s; }
    .reproducibility-143-e1 { animation-delay: 1.28s; }
    .reproducibility-143-s2 { animation-delay: 2.56s; }
    .reproducibility-143-e2 { animation-delay: 2.56s; }
    .reproducibility-143-s3 { animation-delay: 3.84s; }
    .reproducibility-143-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .reproducibility-143-conn  { animation: reproducibility-143-trace 6.4s ease-in-out infinite; }
      .reproducibility-143-stage { animation: reproducibility-143-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes reproducibility-143-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reproducibility-143-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reproducibility-143-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reproducibility-143-stage { animation: reproducibility-143-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reproducibility-143-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reproducibility-143-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reproducibility-143-bg" width="980" height="322"/>
  <text class="reproducibility-143-h1"  x="30" y="40">Proving reproducibility</text>
  <text class="reproducibility-143-sub" x="30" y="64">Four steps.</text>
  <g class="reproducibility-143-stage reproducibility-143-s0">
    <rect class="reproducibility-143-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="reproducibility-143-step" x="44" y="142">01</text>
    <text class="reproducibility-143-name" x="70" y="142">Pin the data version and the environment</text>
    <text class="reproducibility-143-desc" x="44" y="166">Both by hash.</text>
  </g>
  <line class="reproducibility-143-line reproducibility-143-conn reproducibility-143-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#reproducibility-143-tip)"/>
  <g class="reproducibility-143-stage reproducibility-143-s1">
    <rect class="reproducibility-143-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="reproducibility-143-step" x="280" y="142">02</text>
    <text class="reproducibility-143-name" x="306" y="142">Fix every random seed</text>
    <text class="reproducibility-143-desc" x="280" y="166">Including the ones inside</text>
    <text class="reproducibility-143-desc" x="280" y="182">libraries.</text>
  </g>
  <line class="reproducibility-143-line reproducibility-143-conn reproducibility-143-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#reproducibility-143-tip)"/>
  <g class="reproducibility-143-stage reproducibility-143-s2">
    <rect class="reproducibility-143-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="reproducibility-143-step" x="516" y="142">03</text>
    <text class="reproducibility-143-name" x="542" y="142">Run it twice, from scratch</text>
    <text class="reproducibility-143-desc" x="516" y="166">Not from a cached intermediate.</text>
  </g>
  <line class="reproducibility-143-line reproducibility-143-conn reproducibility-143-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#reproducibility-143-tip)"/>
  <g class="reproducibility-143-stage reproducibility-143-s3">
    <rect class="reproducibility-143-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="reproducibility-143-step" x="752" y="142">04</text>
    <text class="reproducibility-143-name" x="778" y="142">And compare the outputs exactly</text>
    <text class="reproducibility-143-desc" x="752" y="166">A difference is a bug, not a</text>
    <text class="reproducibility-143-desc" x="752" y="182">curiosity.</text>
  </g>
  <text class="reproducibility-143-sub" x="30" y="304">Running from scratch rather than from a cached intermediate is the detail that makes the check meaningful, since the cache can be hiding the very thing being tested.</text>
</svg>
