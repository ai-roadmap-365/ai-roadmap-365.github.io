<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the data.">
  <title>Which loading approach when</title>
  <style>
    .load-when-bg   { fill: #f8fafc; }
    .load-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .load-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .load-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .load-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .load-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .load-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .load-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .load-when-row { opacity: 1; }
    .load-when-r0 { animation-delay: 0.00s; }
    .load-when-r1 { animation-delay: 0.45s; }
    .load-when-r2 { animation-delay: 0.90s; }
    .load-when-r3 { animation-delay: 1.35s; }
    .load-when-r4 { animation-delay: 1.80s; }
    .load-when-row { animation: load-when-reveal 7.3s ease-in-out infinite; }
    @keyframes load-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="load-when-bg" width="980" height="390"/>
  <text class="load-when-h1"  x="30" y="40">Which loading approach when</text>
  <text class="load-when-sub" x="30" y="64">By the data.</text>
  <rect class="load-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="load-when-name" x="46" y="122">The situation</text>
  <text class="load-when-desc" x="46" y="142">What you have.</text>
  <text class="load-when-desc load-when-row load-when-r0" x="46" y="182">A small delimited file</text>
  <text class="load-when-desc load-when-row load-when-r1" x="46" y="216">A large file, few columns needed</text>
  <text class="load-when-desc load-when-row load-when-r2" x="46" y="250">A file larger than memory</text>
  <text class="load-when-desc load-when-row load-when-r3" x="46" y="284">A repeatedly loaded dataset</text>
  <text class="load-when-desc load-when-row load-when-r4" x="46" y="318">Data behind an interface</text>
  <rect class="load-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="load-when-name" x="526" y="122">The approach</text>
  <text class="load-when-desc" x="526" y="142">What to do.</text>
  <text class="load-when-desc load-when-row load-when-r0" x="526" y="182">Read it directly, declaring types</text>
  <text class="load-when-desc load-when-row load-when-r1" x="526" y="216">Read only the columns needed</text>
  <text class="load-when-desc load-when-row load-when-r2" x="526" y="250">Read in chunks, or use a database</text>
  <text class="load-when-desc load-when-row load-when-r3" x="526" y="284">Convert once to a columnar format</text>
  <text class="load-when-desc load-when-row load-when-r4" x="526" y="318">Fetch, cache, then load the cache</text>
  <text class="load-when-sub" x="30" y="372">Converting once to a columnar format is the highest-value habit for repeated work, and it typically cuts load time by an order of magnitude.</text>
</svg>
