<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="People reach for the wrong one constantly.">
  <title>Two different problems, two different tools</title>
  <style>
    .version-or-packages-bg   { fill: #f8fafc; }
    .version-or-packages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .version-or-packages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .version-or-packages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .version-or-packages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .version-or-packages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .version-or-packages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .version-or-packages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .version-or-packages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .version-or-packages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .version-or-packages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .version-or-packages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .version-or-packages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .version-or-packages-row { opacity: 1; }
    .version-or-packages-r0 { animation-delay: 0.00s; }
    .version-or-packages-r1 { animation-delay: 0.45s; }
    .version-or-packages-r2 { animation-delay: 0.90s; }
    .version-or-packages-r3 { animation-delay: 1.35s; }
    .version-or-packages-r4 { animation-delay: 1.80s; }
    .version-or-packages-row { animation: version-or-packages-reveal 7.3s ease-in-out infinite; }
    @keyframes version-or-packages-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="version-or-packages-bg" width="980" height="390"/>
  <text class="version-or-packages-h1"  x="30" y="40">Two different problems, two different tools</text>
  <text class="version-or-packages-sub" x="30" y="64">People reach for the wrong one constantly.</text>
  <rect class="version-or-packages-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="version-or-packages-name" x="46" y="122">Managing versions</text>
  <text class="version-or-packages-desc" x="46" y="142">Which Python.</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r0" x="46" y="182">pyenv, or your OS package manager</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r1" x="46" y="216">"This project needs Python 3.11"</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r2" x="46" y="250">Installs whole interpreters</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r3" x="46" y="284">venv cannot do this at all</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r4" x="46" y="318">Choose the version, THEN make the venv</text>
  <rect class="version-or-packages-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="version-or-packages-name" x="526" y="122">Managing packages</text>
  <text class="version-or-packages-desc" x="526" y="142">What is installed in it.</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r0" x="526" y="182">venv, uv, Poetry, conda</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r1" x="526" y="216">"This project needs pandas 2.1"</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r2" x="526" y="250">Installs libraries into one interpreter</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r3" x="526" y="284">pyenv cannot do this</text>
  <text class="version-or-packages-desc version-or-packages-row version-or-packages-r4" x="526" y="318">This is the everyday case</text>
  <text class="version-or-packages-sub" x="30" y="372">A venv is built FROM an interpreter, so the version question is answered first and the package question second. Trying to solve a version problem with venv is a common and frustrating dead end.</text>
</svg>
