<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Fairness Criteria Tradeoff</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .box-crit { fill: #7f1d1d; stroke: #ef4444; stroke-width: 2; rx: 8; }
    .box-fair { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .tri-wire { stroke: #6366f1; stroke-width: 3; fill: none; stroke-dasharray: 6; }
  </style>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">The Impossibility Theorem of Algorithmic Fairness</text>
  <text x="450" y="65" class="text-sub">Kleinberg (2016) &amp; Chouldechova (2017): Mutually Incompatible Fairness Criteria</text>

  <!-- Triangle of Fairness -->
  <polygon points="450,110 180,360 720,360" class="tri-wire" />

  <!-- Criterion 1: Demographic Parity -->
  <rect x="330" y="90" width="240" height="65" class="box-fair" />
  <text x="450" y="115" class="text-title">1. Demographic Parity</text>
  <text x="450" y="135" class="text-sub">P(Y_hat=1 | A=0) = P(Y_hat=1 | A=1)</text>

  <!-- Criterion 2: Equalized Odds -->
  <rect x="60" y="340" width="240" height="65" class="box-fair" />
  <text x="180" y="365" class="text-title">2. Equalized Odds</text>
  <text x="180" y="385" class="text-sub">Equal TPR and FPR across groups</text>

  <!-- Criterion 3: Predictive Parity -->
  <rect x="600" y="340" width="240" height="65" class="box-fair" />
  <text x="720" y="365" class="text-title">3. Predictive Parity</text>
  <text x="720" y="385" class="text-sub">P(Y=1 | Y_hat=1, A=0) = P(Y=1 | Y_hat=1, A=1)</text>

  <!-- Center Warning Box -->
  <rect x="300" y="220" width="300" height="90" class="box-crit" />
  <text x="450" y="245" class="text-title" fill="#fecaca">MATHEMATICAL IMPOSSIBILITY</text>
  <text x="450" y="265" class="text-sub" fill="#fca5a5">When base rates differ: P(Y=1|A=0) != P(Y=1|A=1),</text>
  <text x="450" y="285" class="text-sub" fill="#fca5a5">you can achieve at most TWO of these three criteria!</text>

  <!-- Bottom annotation -->
  <rect x="100" y="430" width="700" height="45" class="box" />
  <text x="450" y="458" class="text-sub">Engineers must align metric selection with domain legal requirements (e.g. ECOA, EEOC, GDPR).</text>
</svg>
