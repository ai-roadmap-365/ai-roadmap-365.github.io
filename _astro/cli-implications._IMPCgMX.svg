<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are obligations.">
  <title>Four consequences of shipping a tool</title>
  <style>
    .cli-implications-bg   { fill: #f8fafc; }
    .cli-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cli-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cli-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cli-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cli-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cli-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cli-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cli-implications-stage { opacity: 1; }

    .cli-implications-s0 { animation-delay: 0.00s; }
    .cli-implications-e0 { animation-delay: 0.00s; }
    .cli-implications-s1 { animation-delay: 1.28s; }
    .cli-implications-e1 { animation-delay: 1.28s; }
    .cli-implications-s2 { animation-delay: 2.56s; }
    .cli-implications-e2 { animation-delay: 2.56s; }
    .cli-implications-s3 { animation-delay: 3.84s; }
    .cli-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cli-implications-conn  { animation: cli-implications-trace 6.4s ease-in-out infinite; }
      .cli-implications-stage { animation: cli-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cli-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cli-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cli-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cli-implications-stage { animation: cli-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cli-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cli-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cli-implications-bg" width="980" height="322"/>
  <text class="cli-implications-h1"  x="30" y="40">Four consequences of shipping a tool</text>
  <text class="cli-implications-sub" x="30" y="64">Two are obligations.</text>
  <g class="cli-implications-stage cli-implications-s0">
    <rect class="cli-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cli-implications-step" x="44" y="142">01</text>
    <text class="cli-implications-name" x="70" y="142">Other people can use your work</text>
    <text class="cli-implications-desc" x="44" y="166">Which is the point of building</text>
    <text class="cli-implications-desc" x="44" y="182">one.</text>
  </g>
  <line class="cli-implications-line cli-implications-conn cli-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cli-implications-tip)"/>
  <g class="cli-implications-stage cli-implications-s1">
    <rect class="cli-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cli-implications-step" x="280" y="142">02</text>
    <text class="cli-implications-name" x="306" y="142">But the arguments become an interface</text>
    <text class="cli-implications-desc" x="280" y="166">Changing them breaks their</text>
    <text class="cli-implications-desc" x="280" y="182">scripts.</text>
  </g>
  <line class="cli-implications-line cli-implications-conn cli-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cli-implications-tip)"/>
  <g class="cli-implications-stage cli-implications-s2">
    <rect class="cli-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cli-implications-step" x="516" y="142">03</text>
    <text class="cli-implications-name" x="542" y="142">And arguments are untrusted input</text>
    <text class="cli-implications-desc" x="516" y="166">Especially paths and anything</text>
    <text class="cli-implications-desc" x="516" y="182">reaching a shell.</text>
  </g>
  <line class="cli-implications-line cli-implications-conn cli-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cli-implications-tip)"/>
  <g class="cli-implications-stage cli-implications-s3">
    <rect class="cli-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cli-implications-step" x="752" y="142">04</text>
    <text class="cli-implications-name" x="778" y="142">While help text is the documentation people read</text>
    <text class="cli-implications-desc" x="752" y="166">So it is worth writing properly.</text>
  </g>
  <text class="cli-implications-sub" x="30" y="304">Treating the argument list as a stable interface is what distinguishes a tool from a script, and it is a commitment worth making deliberately.</text>
</svg>
