<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Two cases, always</title>
  <style>
    .base-recursive-bg   { fill: #f8fafc; }
    .base-recursive-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base-recursive-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base-recursive-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base-recursive-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base-recursive-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .base-recursive-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .base-recursive-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .base-recursive-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .base-recursive-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .base-recursive-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .base-recursive-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .base-recursive-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .base-recursive-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .base-recursive-stage { opacity: 1; }

    .base-recursive-s0 { animation-delay: 0.00s; }
    .base-recursive-e0 { animation-delay: 0.00s; }
    .base-recursive-s1 { animation-delay: 1.28s; }
    .base-recursive-e1 { animation-delay: 1.28s; }
    .base-recursive-s2 { animation-delay: 2.56s; }
    .base-recursive-e2 { animation-delay: 2.56s; }
    .base-recursive-s3 { animation-delay: 3.84s; }
    .base-recursive-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .base-recursive-conn  { animation: base-recursive-trace 6.4s ease-in-out infinite; }
      .base-recursive-stage { animation: base-recursive-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes base-recursive-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes base-recursive-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .base-recursive-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .base-recursive-stage { animation: base-recursive-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes base-recursive-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="base-recursive-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="base-recursive-bg" width="980" height="322"/>
  <text class="base-recursive-h1"  x="30" y="40">Two cases, always</text>
  <text class="base-recursive-sub" x="30" y="64">Four properties.</text>
  <g class="base-recursive-stage base-recursive-s0">
    <rect class="base-recursive-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="base-recursive-step" x="44" y="142">01</text>
    <text class="base-recursive-name" x="70" y="142">The base case answers without recursing</text>
    <text class="base-recursive-desc" x="44" y="166">Usually the empty or smallest</text>
    <text class="base-recursive-desc" x="44" y="182">input.</text>
  </g>
  <line class="base-recursive-line base-recursive-conn base-recursive-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#base-recursive-tip)"/>
  <g class="base-recursive-stage base-recursive-s1">
    <rect class="base-recursive-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="base-recursive-step" x="280" y="142">02</text>
    <text class="base-recursive-name" x="306" y="142">The recursive case reduces and calls itself</text>
    <text class="base-recursive-desc" x="280" y="166">Combining what comes back.</text>
  </g>
  <line class="base-recursive-line base-recursive-conn base-recursive-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#base-recursive-tip)"/>
  <g class="base-recursive-stage base-recursive-s2">
    <rect class="base-recursive-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="base-recursive-step" x="516" y="142">03</text>
    <text class="base-recursive-name" x="542" y="142">Every path must reach the base case</text>
    <text class="base-recursive-desc" x="516" y="166">Which is the correctness</text>
    <text class="base-recursive-desc" x="516" y="182">obligation.</text>
  </g>
  <line class="base-recursive-line base-recursive-conn base-recursive-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#base-recursive-tip)"/>
  <g class="base-recursive-stage base-recursive-s3">
    <rect class="base-recursive-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="base-recursive-step" x="752" y="142">04</text>
    <text class="base-recursive-name" x="778" y="142">A missing or unreachable base case overflows the stack</text>
    <text class="base-recursive-desc" x="752" y="166">Which is the classic failure.</text>
  </g>
  <text class="base-recursive-sub" x="30" y="304">Checking that every path reduces toward the base case is the whole correctness argument for a recursive function, and it takes seconds to do.</text>
</svg>
