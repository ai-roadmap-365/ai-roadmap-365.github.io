<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The step people skip, and the one that saves the hour.">
  <title>Three lines before any code</title>
  <style>
    .design-three-lines-bg   { fill: #f8fafc; }
    .design-three-lines-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-three-lines-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-three-lines-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-three-lines-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-three-lines-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-three-lines-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-three-lines-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .design-three-lines-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .design-three-lines-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .design-three-lines-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .design-three-lines-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .design-three-lines-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .design-three-lines-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .design-three-lines-stage { opacity: 1; }

    .design-three-lines-s0 { animation-delay: 0.00s; }
    .design-three-lines-e0 { animation-delay: 0.00s; }
    .design-three-lines-s1 { animation-delay: 1.28s; }
    .design-three-lines-e1 { animation-delay: 1.28s; }
    .design-three-lines-s2 { animation-delay: 2.56s; }
    .design-three-lines-e2 { animation-delay: 2.56s; }
    .design-three-lines-s3 { animation-delay: 3.84s; }
    .design-three-lines-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .design-three-lines-conn  { animation: design-three-lines-trace 6.4s ease-in-out infinite; }
      .design-three-lines-stage { animation: design-three-lines-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes design-three-lines-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes design-three-lines-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .design-three-lines-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .design-three-lines-stage { animation: design-three-lines-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes design-three-lines-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="design-three-lines-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="design-three-lines-bg" width="980" height="322"/>
  <text class="design-three-lines-h1"  x="30" y="40">Three lines before any code</text>
  <text class="design-three-lines-sub" x="30" y="64">The step people skip, and the one that saves the hour.</text>
  <g class="design-three-lines-stage design-three-lines-s0">
    <rect class="design-three-lines-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="design-three-lines-step" x="44" y="142">01</text>
    <text class="design-three-lines-name" x="70" y="142">Inputs</text>
    <text class="design-three-lines-desc" x="44" y="166">Where does the data come from,</text>
    <text class="design-three-lines-desc" x="44" y="182">and what must be true of it?</text>
    <text class="design-three-lines-edge" x="44" y="242">and validate</text>
  </g>
  <line class="design-three-lines-line design-three-lines-conn design-three-lines-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#design-three-lines-tip)"/>
  <g class="design-three-lines-stage design-three-lines-s1">
    <rect class="design-three-lines-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="design-three-lines-step" x="280" y="142">02</text>
    <text class="design-three-lines-name" x="306" y="142">Processing</text>
    <text class="design-three-lines-desc" x="280" y="166">The transformation, in one</text>
    <text class="design-three-lines-desc" x="280" y="182">sentence. If it takes three, it</text>
    <text class="design-three-lines-desc" x="280" y="198">is two functions.</text>
  </g>
  <line class="design-three-lines-line design-three-lines-conn design-three-lines-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#design-three-lines-tip)"/>
  <g class="design-three-lines-stage design-three-lines-s2">
    <rect class="design-three-lines-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="design-three-lines-step" x="516" y="142">03</text>
    <text class="design-three-lines-name" x="542" y="142">Outputs</text>
    <text class="design-three-lines-desc" x="516" y="166">What does success look like, and</text>
    <text class="design-three-lines-desc" x="516" y="182">which stream does it go to?</text>
    <text class="design-three-lines-edge" x="516" y="242">stdout</text>
  </g>
  <line class="design-three-lines-line design-three-lines-conn design-three-lines-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#design-three-lines-tip)"/>
  <g class="design-three-lines-stage design-three-lines-s3">
    <rect class="design-three-lines-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="design-three-lines-step" x="752" y="142">04</text>
    <text class="design-three-lines-name" x="778" y="142">Failures</text>
    <text class="design-three-lines-desc" x="752" y="166">What can go wrong, and what</text>
    <text class="design-three-lines-desc" x="752" y="182">should happen then? This is the</text>
    <text class="design-three-lines-desc" x="752" y="198">one omitted.</text>
    <text class="design-three-lines-edge" x="752" y="242">exit 1</text>
  </g>
  <text class="design-three-lines-sub" x="30" y="304">Ten minutes of this replaces an hour of restructuring later, because the shape of the program falls out of the answers rather than being discovered while writing it.</text>
</svg>
