<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A narrower promise than most users believe.">
  <title>What the padlock actually claims</title>
  <style>
    .padlock-is-not-trust-bg   { fill: #f8fafc; }
    .padlock-is-not-trust-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padlock-is-not-trust-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padlock-is-not-trust-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padlock-is-not-trust-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padlock-is-not-trust-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padlock-is-not-trust-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .padlock-is-not-trust-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .padlock-is-not-trust-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .padlock-is-not-trust-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .padlock-is-not-trust-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .padlock-is-not-trust-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .padlock-is-not-trust-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .padlock-is-not-trust-row { opacity: 1; }
    .padlock-is-not-trust-r0 { animation-delay: 0.00s; }
    .padlock-is-not-trust-r1 { animation-delay: 0.45s; }
    .padlock-is-not-trust-r2 { animation-delay: 0.90s; }
    .padlock-is-not-trust-r3 { animation-delay: 1.35s; }
    .padlock-is-not-trust-r4 { animation-delay: 1.80s; }
    .padlock-is-not-trust-row { animation: padlock-is-not-trust-reveal 7.3s ease-in-out infinite; }
    @keyframes padlock-is-not-trust-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="padlock-is-not-trust-bg" width="980" height="390"/>
  <text class="padlock-is-not-trust-h1"  x="30" y="40">What the padlock actually claims</text>
  <text class="padlock-is-not-trust-sub" x="30" y="64">A narrower promise than most users believe.</text>
  <rect class="padlock-is-not-trust-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="padlock-is-not-trust-name" x="46" y="122">It does prove</text>
  <text class="padlock-is-not-trust-desc" x="46" y="142">Narrow, and genuinely useful.</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r0" x="46" y="182">The connection is private</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r1" x="46" y="216">Nobody on the path can read or alter it</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r2" x="46" y="250">The server controls this exact domain name</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r3" x="46" y="284">The certificate has not expired</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r4" x="46" y="318">An interceptor would be visible</text>
  <rect class="padlock-is-not-trust-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="padlock-is-not-trust-name" x="526" y="122">It does not prove</text>
  <text class="padlock-is-not-trust-desc" x="526" y="142">Where users over-read it.</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r0" x="526" y="182">That the site is honest</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r1" x="526" y="216">That the company behind it exists</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r2" x="526" y="250">That your data is safe once it arrives</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r3" x="526" y="284">That the domain is not a lookalike</text>
  <text class="padlock-is-not-trust-desc padlock-is-not-trust-row padlock-is-not-trust-r4" x="526" y="318">Phishing sites have valid certificates too</text>
  <text class="padlock-is-not-trust-sub" x="30" y="372">Obtaining a certificate requires controlling a domain, and nothing more. That is why browsers stopped displaying company names beside the padlock: the signal was being misread.</text>
</svg>
