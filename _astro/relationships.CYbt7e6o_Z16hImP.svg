<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Representing the three relationship shapes</title>
  <style>
    .relationships-bg   { fill: #f8fafc; }
    .relationships-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationships-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationships-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationships-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationships-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationships-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .relationships-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .relationships-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .relationships-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .relationships-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .relationships-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .relationships-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .relationships-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .relationships-stage { opacity: 1; }

    .relationships-s0 { animation-delay: 0.00s; }
    .relationships-e0 { animation-delay: 0.00s; }
    .relationships-s1 { animation-delay: 1.28s; }
    .relationships-e1 { animation-delay: 1.28s; }
    .relationships-s2 { animation-delay: 2.56s; }
    .relationships-e2 { animation-delay: 2.56s; }
    .relationships-s3 { animation-delay: 3.84s; }
    .relationships-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .relationships-conn  { animation: relationships-trace 6.4s ease-in-out infinite; }
      .relationships-stage { animation: relationships-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes relationships-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes relationships-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .relationships-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .relationships-stage { animation: relationships-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes relationships-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="relationships-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="relationships-bg" width="980" height="322"/>
  <text class="relationships-h1"  x="30" y="40">Representing the three relationship shapes</text>
  <text class="relationships-sub" x="30" y="64">Four steps.</text>
  <g class="relationships-stage relationships-s0">
    <rect class="relationships-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="relationships-step" x="44" y="142">01</text>
    <text class="relationships-name" x="70" y="142">One-to-one: usually the same table</text>
    <text class="relationships-desc" x="44" y="166">Split only for a good reason.</text>
  </g>
  <line class="relationships-line relationships-conn relationships-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#relationships-tip)"/>
  <g class="relationships-stage relationships-s1">
    <rect class="relationships-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="relationships-step" x="280" y="142">02</text>
    <text class="relationships-name" x="306" y="142">One-to-many: the many side holds a reference</text>
    <text class="relationships-desc" x="280" y="166">Which is the common case.</text>
  </g>
  <line class="relationships-line relationships-conn relationships-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#relationships-tip)"/>
  <g class="relationships-stage relationships-s2">
    <rect class="relationships-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="relationships-step" x="516" y="142">03</text>
    <text class="relationships-name" x="542" y="142">Many-to-many: neither side can hold it</text>
    <text class="relationships-desc" x="516" y="166">So a third table is needed.</text>
  </g>
  <line class="relationships-line relationships-conn relationships-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#relationships-tip)"/>
  <g class="relationships-stage relationships-s3">
    <rect class="relationships-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="relationships-step" x="752" y="142">04</text>
    <text class="relationships-name" x="778" y="142">That junction table holds both references</text>
    <text class="relationships-desc" x="752" y="166">And often facts about the</text>
    <text class="relationships-desc" x="752" y="182">pairing.</text>
  </g>
  <text class="relationships-sub" x="30" y="304">The junction table is where people first go wrong, usually by trying to store a list in a column, which defeats every query the database could answer.</text>
</svg>
