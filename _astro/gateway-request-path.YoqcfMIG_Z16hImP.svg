<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three decisions before it reaches a GPU.">
  <title>One request through the gateway</title>
  <style>
    .gateway-request-path-bg   { fill: #f8fafc; }
    .gateway-request-path-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-request-path-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-request-path-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-request-path-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-request-path-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-request-path-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-request-path-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gateway-request-path-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gateway-request-path-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gateway-request-path-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gateway-request-path-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gateway-request-path-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gateway-request-path-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gateway-request-path-stage { opacity: 1; }

    .gateway-request-path-s0 { animation-delay: 0.00s; }
    .gateway-request-path-e0 { animation-delay: 0.00s; }
    .gateway-request-path-s1 { animation-delay: 1.28s; }
    .gateway-request-path-e1 { animation-delay: 1.28s; }
    .gateway-request-path-s2 { animation-delay: 2.56s; }
    .gateway-request-path-e2 { animation-delay: 2.56s; }
    .gateway-request-path-s3 { animation-delay: 3.84s; }
    .gateway-request-path-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gateway-request-path-conn  { animation: gateway-request-path-trace 6.4s ease-in-out infinite; }
      .gateway-request-path-stage { animation: gateway-request-path-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gateway-request-path-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gateway-request-path-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gateway-request-path-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gateway-request-path-stage { animation: gateway-request-path-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gateway-request-path-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gateway-request-path-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gateway-request-path-bg" width="980" height="322"/>
  <text class="gateway-request-path-h1"  x="30" y="40">One request through the gateway</text>
  <text class="gateway-request-path-sub" x="30" y="64">Three decisions before it reaches a GPU.</text>
  <g class="gateway-request-path-stage gateway-request-path-s0">
    <rect class="gateway-request-path-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-request-path-step" x="44" y="142">01</text>
    <text class="gateway-request-path-name" x="70" y="142">Evaluate the circuit</text>
    <text class="gateway-request-path-desc" x="44" y="166">OPEN and within cooldown: return</text>
    <text class="gateway-request-path-desc" x="44" y="182">the fallback now, at zero cost.</text>
    <text class="gateway-request-path-edge" x="44" y="242">first</text>
  </g>
  <line class="gateway-request-path-line gateway-request-path-conn gateway-request-path-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gateway-request-path-tip)"/>
  <g class="gateway-request-path-stage gateway-request-path-s1">
    <rect class="gateway-request-path-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-request-path-step" x="280" y="142">02</text>
    <text class="gateway-request-path-name" x="306" y="142">Select by LOR</text>
    <text class="gateway-request-path-desc" x="280" y="166">min() over healthy replicas by</text>
    <text class="gateway-request-path-desc" x="280" y="182">active_requests. None healthy</text>
    <text class="gateway-request-path-desc" x="280" y="198">trips the circuit.</text>
  </g>
  <line class="gateway-request-path-line gateway-request-path-conn gateway-request-path-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gateway-request-path-tip)"/>
  <g class="gateway-request-path-stage gateway-request-path-s2">
    <rect class="gateway-request-path-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-request-path-step" x="516" y="142">03</text>
    <text class="gateway-request-path-name" x="542" y="142">Dispatch</text>
    <text class="gateway-request-path-desc" x="516" y="166">Increment active_requests,</text>
    <text class="gateway-request-path-desc" x="516" y="182">record the selection in</text>
    <text class="gateway-request-path-desc" x="516" y="198">telemetry.</text>
  </g>
  <line class="gateway-request-path-line gateway-request-path-conn gateway-request-path-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gateway-request-path-tip)"/>
  <g class="gateway-request-path-stage gateway-request-path-s3">
    <rect class="gateway-request-path-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-request-path-step" x="752" y="142">04</text>
    <text class="gateway-request-path-name" x="778" y="142">Complete</text>
    <text class="gateway-request-path-desc" x="752" y="166">Decrement, reset failures on</text>
    <text class="gateway-request-path-desc" x="752" y="182">success, and close a HALF_OPEN</text>
    <text class="gateway-request-path-desc" x="752" y="198">circuit.</text>
  </g>
  <text class="gateway-request-path-sub" x="30" y="304">The ordering is deliberate: checking the circuit before selecting a replica means a failing backend costs a comparison rather than a connection attempt and a timeout, which is where the latency saving actually comes from.</text>
</svg>
