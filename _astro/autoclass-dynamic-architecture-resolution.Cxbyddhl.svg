<svg role="img" aria-label="AutoClass dynamic architecture resolution diagram illustrating how Hugging Face automatically detects model topology from config json" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>AutoClass Dynamic Architecture Resolution</title>
  <defs>
    <linearGradient id="bg230b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card230b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg230b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">HUGGING FACE AUTOCLASS RESOLUTION MECHANISM</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Dynamic Architecture Detection: AutoModelForSequenceClassification.from_pretrained()</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card230b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Call Box -->
    <rect x="200" y="20" width="360" height="45" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <text x="380" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">AutoModelForSequenceClassification.from_pretrained(ID)</text>

    <!-- Dispatch Arrow Down -->
    <line x1="380" y1="65" x2="380" y2="95" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="380,95 375,87 385,87" fill="#38bdf8"/>

    <!-- Config JSON Inspection -->
    <rect x="180" y="95" width="400" height="45" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="115" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Downloads &amp; Inspects config.json: "model_type"</text>
    <text x="380" y="130" fill="#cbd5e1" font-size="8" text-anchor="middle">Extracts hidden_size, num_attention_heads, vocab_size, etc.</text>

    <!-- Branching Arrows -->
    <line x1="380" y1="140" x2="110" y2="175" stroke="#475569" stroke-width="1.5"/>
    <line x1="380" y1="140" x2="290" y2="175" stroke="#475569" stroke-width="1.5"/>
    <line x1="380" y1="140" x2="470" y2="175" stroke="#475569" stroke-width="1.5"/>
    <line x1="380" y1="140" x2="650" y2="175" stroke="#475569" stroke-width="1.5"/>

    <!-- Target Instantiations -->
    <rect x="25" y="175" width="165" height="95" fill="#0f172a" stroke="#38bdf8" rx="4"/>
    <text x="107" y="198" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">"model_type": "bert"</text>
    <text x="107" y="222" fill="#cbd5e1" font-size="8" text-anchor="middle">BertForSequenceClf</text>
    <text x="107" y="242" fill="#94a3b8" font-size="7" text-anchor="middle">BertModel + Linear Head</text>

    <rect x="205" y="175" width="165" height="95" fill="#0f172a" stroke="#fbbf24" rx="4"/>
    <text x="287" y="198" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">"model_type": "roberta"</text>
    <text x="287" y="222" fill="#cbd5e1" font-size="8" text-anchor="middle">RobertaForSequenceClf</text>
    <text x="287" y="242" fill="#94a3b8" font-size="7" text-anchor="middle">RobertaModel + Dense Head</text>

    <rect x="385" y="175" width="165" height="95" fill="#0f172a" stroke="#a855f7" rx="4"/>
    <text x="467" y="198" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">"model_type": "deberta-v2"</text>
    <text x="467" y="222" fill="#cbd5e1" font-size="8" text-anchor="middle">DebertaV2ForSequenceClf</text>
    <text x="467" y="242" fill="#94a3b8" font-size="7" text-anchor="middle">Disentangled Backbone + Clf</text>

    <rect x="565" y="175" width="170" height="95" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="650" y="198" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">"model_type": "distilbert"</text>
    <text x="650" y="222" fill="#cbd5e1" font-size="8" text-anchor="middle">DistilBertForSequenceClf</text>
    <text x="650" y="242" fill="#94a3b8" font-size="7" text-anchor="middle">Fast 6-Layer Student + Head</text>
  </g>
</svg>
