<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How recommendation works</title>
  <style>
    .recsys-idea-bg   { fill: #f8fafc; }
    .recsys-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recsys-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recsys-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recsys-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recsys-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recsys-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recsys-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .recsys-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .recsys-idea-stage { opacity: 1; }

    .recsys-idea-s0 { animation-delay: 0.00s; }
    .recsys-idea-e0 { animation-delay: 0.00s; }
    .recsys-idea-s1 { animation-delay: 1.28s; }
    .recsys-idea-e1 { animation-delay: 1.28s; }
    .recsys-idea-s2 { animation-delay: 2.56s; }
    .recsys-idea-e2 { animation-delay: 2.56s; }
    .recsys-idea-s3 { animation-delay: 3.84s; }
    .recsys-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .recsys-idea-conn  { animation: recsys-idea-trace 6.4s ease-in-out infinite; }
      .recsys-idea-stage { animation: recsys-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes recsys-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes recsys-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .recsys-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .recsys-idea-stage { animation: recsys-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes recsys-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="recsys-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="recsys-idea-bg" width="980" height="322"/>
  <text class="recsys-idea-h1"  x="30" y="40">How recommendation works</text>
  <text class="recsys-idea-sub" x="30" y="64">Four steps.</text>
  <g class="recsys-idea-stage recsys-idea-s0">
    <rect class="recsys-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="recsys-idea-step" x="44" y="142">01</text>
    <text class="recsys-idea-name" x="70" y="142">Most users have interacted with almost nothing</text>
    <text class="recsys-idea-desc" x="44" y="166">The matrix is over ninety-nine</text>
    <text class="recsys-idea-desc" x="44" y="182">percent empty.</text>
  </g>
  <line class="recsys-idea-line recsys-idea-conn recsys-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#recsys-idea-tip)"/>
  <g class="recsys-idea-stage recsys-idea-s1">
    <rect class="recsys-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="recsys-idea-step" x="280" y="142">02</text>
    <text class="recsys-idea-name" x="306" y="142">Learn a short vector for each user and each item</text>
    <text class="recsys-idea-desc" x="280" y="166">Which is exactly an embedding.</text>
  </g>
  <line class="recsys-idea-line recsys-idea-conn recsys-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#recsys-idea-tip)"/>
  <g class="recsys-idea-stage recsys-idea-s2">
    <rect class="recsys-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="recsys-idea-step" x="516" y="142">03</text>
    <text class="recsys-idea-name" x="542" y="142">Their dot product predicts the interaction</text>
    <text class="recsys-idea-desc" x="516" y="166">Fitted on the entries you do</text>
    <text class="recsys-idea-desc" x="516" y="182">have.</text>
  </g>
  <line class="recsys-idea-line recsys-idea-conn recsys-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#recsys-idea-tip)"/>
  <g class="recsys-idea-stage recsys-idea-s3">
    <rect class="recsys-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="recsys-idea-step" x="752" y="142">04</text>
    <text class="recsys-idea-name" x="778" y="142">And it fills in the entries you do not</text>
    <text class="recsys-idea-desc" x="752" y="166">Which is the recommendation.</text>
    <text class="recsys-idea-edge" x="752" y="242">the point</text>
  </g>
  <text class="recsys-idea-sub" x="30" y="304">These learned vectors are embeddings in the full modern sense, and they predate the popularisation of the term by several years.</text>
</svg>
