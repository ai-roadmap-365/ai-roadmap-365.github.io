<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is which.">
  <title>In place against returning new</title>
  <style>
    .inplace-new-bg   { fill: #f8fafc; }
    .inplace-new-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inplace-new-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inplace-new-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inplace-new-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inplace-new-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inplace-new-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inplace-new-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inplace-new-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inplace-new-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inplace-new-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inplace-new-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inplace-new-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inplace-new-row { opacity: 1; }
    .inplace-new-r0 { animation-delay: 0.00s; }
    .inplace-new-r1 { animation-delay: 0.45s; }
    .inplace-new-r2 { animation-delay: 0.90s; }
    .inplace-new-r3 { animation-delay: 1.35s; }
    .inplace-new-r4 { animation-delay: 1.80s; }
    .inplace-new-row { animation: inplace-new-reveal 7.3s ease-in-out infinite; }
    @keyframes inplace-new-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="inplace-new-bg" width="980" height="390"/>
  <text class="inplace-new-h1"  x="30" y="40">In place against returning new</text>
  <text class="inplace-new-sub" x="30" y="64">Which is which.</text>
  <rect class="inplace-new-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="inplace-new-name" x="46" y="122">Modifies in place</text>
  <text class="inplace-new-desc" x="46" y="142">Returns nothing.</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r0" x="46" y="182">Sorting the list itself</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r1" x="46" y="216">Reversing it in place</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r2" x="46" y="250">Appending and extending</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r3" x="46" y="284">Returns None, not the list</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r4" x="46" y="318">Assigning the result loses the data</text>
  <rect class="inplace-new-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="inplace-new-name" x="526" y="122">Returns a new list</text>
  <text class="inplace-new-desc" x="526" y="142">Leaves the original.</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r0" x="526" y="182">The sorted function</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r1" x="526" y="216">The reversed function</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r2" x="526" y="250">Concatenation and slicing</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r3" x="526" y="284">Returns the new collection</text>
  <text class="inplace-new-desc inplace-new-row inplace-new-r4" x="526" y="318">The original is untouched</text>
  <text class="inplace-new-sub" x="30" y="372">Assigning the result of an in-place sort is the classic mistake: the variable becomes None and the list is silently lost.</text>
</svg>
