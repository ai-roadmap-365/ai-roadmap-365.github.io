<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img">
  <title>Agent Tool Schema And Validation</title>
  <defs>
    <style>
      .d290a-bg { fill: #f8fafc; }
      .d290a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d290a-schema { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d290a-valid { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d290a-box { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d290a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d290a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d290a-node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d290a-node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .d290a-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 6,4; fill: none; animation: d290a-p 3s linear infinite; }
      @keyframes d290a-p { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .d290a-flow { animation: none; } }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d290a-bg" />
  
  <text x="40" y="40" class="d290a-title">Agent Tool Schema and Validation</text>
  <text x="40" y="65" class="d290a-subtitle">JSON Schema definition, LLM tool selection, parameter coercion, and sandbox execution</text>
  
  <!-- 1. JSON Schema Definition -->
  <rect x="40" y="110" width="220" height="150" class="d290a-schema" />
  <text x="55" y="135" class="d290a-node-title" fill="#1d4ed8">1. JSON Schema Registry</text>
  <text x="55" y="155" class="d290a-node-desc">• Tool: "query_database"</text>
  <text x="55" y="170" class="d290a-node-desc">• Description: "Executes SQL query"</text>
  <text x="55" y="185" class="d290a-node-desc">• Param "sql": string (required)</text>
  <text x="55" y="200" class="d290a-node-desc">• Param "limit": int (default=50)</text>
  <text x="55" y="215" class="d290a-node-desc">• Param "timeout": int (max=5000ms)</text>
  
  <!-- 2. LLM Tool Invocation -->
  <rect x="330" y="110" width="220" height="150" class="d290a-card" />
  <text x="345" y="135" class="d290a-node-title" fill="#0f172a">2. Model Tool Emission</text>
  <text x="345" y="155" class="d290a-node-desc">• Selects tool based on goal</text>
  <text x="345" y="170" class="d290a-node-desc">• Generates raw JSON arguments:</text>
  <text x="345" y="190" class="d290a-node-desc" font-family="monospace">{"sql": "SELECT * FROM users",</text>
  <text x="345" y="205" class="d290a-node-desc" font-family="monospace"> "limit": "25"}</text>
  
  <!-- 3. Validation & Coercion -->
  <rect x="620" y="110" width="240" height="150" class="d290a-valid" />
  <text x="635" y="135" class="d290a-node-title" fill="#15803d">3. Validation &amp; Coercion</text>
  <text x="635" y="155" class="d290a-node-desc">• JSON Schema Type Checking</text>
  <text x="635" y="170" class="d290a-node-desc">• Coerce string "25" -> int 25</text>
  <text x="635" y="185" class="d290a-node-desc">• Boundary clamp: limit &lt;= 100</text>
  <text x="635" y="200" class="d290a-node-desc">• SQL injection pattern filter</text>
  
  <!-- 4. Execution Sandbox -->
  <rect x="330" y="310" width="530" height="120" class="d290a-box" />
  <text x="345" y="335" class="d290a-node-title" fill="#7e22ce">4. Isolated Execution Sandbox</text>
  <text x="345" y="360" class="d290a-node-desc">• Read-Only DB Connection | 2000ms Timeout Guard | Idempotency Key Cache</text>
  <text x="345" y="380" class="d290a-node-desc">• Returns structured JSON payload or sanitized error observation back to agent</text>
  <text x="345" y="400" class="d290a-node-desc">• Emits Prometheus audit metric (tool_name, latency_ms, status_code)</text>
  
  <!-- Flow Lines -->
  <path d="M 260 185 L 330 185" class="d290a-flow" />
  <path d="M 550 185 L 620 185" class="d290a-flow" />
  <path d="M 740 260 L 740 310" class="d290a-flow" />
</svg>