<svg role="img" aria-label="RAGAS automated evaluation pipeline diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>RAGAS Continuous Evaluation Pipeline</title>
  <defs>
    <linearGradient id="bg265b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card265b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg265b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RAGAS CI/CD EVALUATION PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Automated LLM-as-a-Judge Evaluation &amp; Regression Detection</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card265b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. Test Dataset -->
    <rect x="25" y="35" width="140" height="225" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="95" y="65" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Evaluation Dataset</text>
    <rect x="35" y="85" width="120" height="40" fill="#1e293b" rx="4"/>
    <text x="95" y="105" fill="#cbd5e1" font-size="7.5" text-anchor="middle">500 Golden Q&amp;A</text>
    <rect x="35" y="135" width="120" height="40" fill="#1e293b" rx="4"/>
    <text x="95" y="155" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Ground Truth Contexts</text>

    <!-- Arrow -->
    <line x1="165" y1="147" x2="205" y2="147" stroke="#38bdf8" stroke-width="2"/>

    <!-- 2. RAG Pipeline Execution -->
    <rect x="205" y="35" width="150" height="225" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="280" y="65" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Target RAG Execution</text>
    <rect x="215" y="85" width="130" height="40" fill="#1e293b" rx="4"/>
    <text x="280" y="105" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Run Hybrid Search</text>
    <rect x="215" y="135" width="130" height="40" fill="#1e293b" rx="4"/>
    <text x="280" y="155" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Generate Answers</text>

    <!-- Arrow -->
    <line x1="355" y1="147" x2="395" y2="147" stroke="#fbbf24" stroke-width="2"/>

    <!-- 3. LLM-as-a-Judge Evaluation Engine -->
    <rect x="395" y="35" width="170" height="225" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
    <text x="480" y="65" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle">3. RAGAS Judge Engine</text>
    <rect x="405" y="80" width="150" height="32" fill="#1e293b" rx="4"/>
    <text x="480" y="100" fill="#34d399" font-size="7.5" text-anchor="middle">Faithfulness: 0.96</text>
    <rect x="405" y="120" width="150" height="32" fill="#1e293b" rx="4"/>
    <text x="480" y="140" fill="#38bdf8" font-size="7.5" text-anchor="middle">Answer Relevance: 0.94</text>
    <rect x="405" y="160" width="150" height="32" fill="#1e293b" rx="4"/>
    <text x="480" y="180" fill="#fbbf24" font-size="7.5" text-anchor="middle">Context Recall: 0.91</text>

    <!-- Arrow -->
    <line x1="565" y1="147" x2="605" y2="147" stroke="#a78bfa" stroke-width="2"/>

    <!-- 4. CI/CD Gate -->
    <rect x="605" y="35" width="130" height="225" fill="#0f172a" stroke="#34d399" rx="6"/>
    <text x="670" y="65" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">4. CI/CD Release Gate</text>
    <rect x="615" y="85" width="110" height="60" fill="#1e293b" rx="4"/>
    <text x="670" y="110" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">PASS</text>
    <text x="670" y="128" fill="#cbd5e1" font-size="7" text-anchor="middle">Faithfulness &gt; 0.90</text>
    <text x="670" y="235" fill="#38bdf8" font-size="7.5" font-weight="700" text-anchor="middle">Automated Deploy</text>
  </g>
</svg>
