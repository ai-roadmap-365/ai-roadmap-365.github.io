<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Weak supervision</title>
  <style>
    .weak-supervision-bg   { fill: #f8fafc; }
    .weak-supervision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-supervision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-supervision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-supervision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-supervision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-supervision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weak-supervision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .weak-supervision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .weak-supervision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .weak-supervision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .weak-supervision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .weak-supervision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .weak-supervision-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .weak-supervision-stage { opacity: 1; }

    .weak-supervision-s0 { animation-delay: 0.00s; }
    .weak-supervision-e0 { animation-delay: 0.00s; }
    .weak-supervision-s1 { animation-delay: 1.28s; }
    .weak-supervision-e1 { animation-delay: 1.28s; }
    .weak-supervision-s2 { animation-delay: 2.56s; }
    .weak-supervision-e2 { animation-delay: 2.56s; }
    .weak-supervision-s3 { animation-delay: 3.84s; }
    .weak-supervision-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .weak-supervision-conn  { animation: weak-supervision-trace 6.4s ease-in-out infinite; }
      .weak-supervision-stage { animation: weak-supervision-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes weak-supervision-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes weak-supervision-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .weak-supervision-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .weak-supervision-stage { animation: weak-supervision-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes weak-supervision-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="weak-supervision-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="weak-supervision-bg" width="980" height="322"/>
  <text class="weak-supervision-h1"  x="30" y="40">Weak supervision</text>
  <text class="weak-supervision-sub" x="30" y="64">Four steps.</text>
  <g class="weak-supervision-stage weak-supervision-s0">
    <rect class="weak-supervision-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="weak-supervision-step" x="44" y="142">01</text>
    <text class="weak-supervision-name" x="70" y="142">Write rules that label imperfectly</text>
    <text class="weak-supervision-desc" x="44" y="166">Keywords, patterns, external</text>
    <text class="weak-supervision-desc" x="44" y="182">lookups.</text>
  </g>
  <line class="weak-supervision-line weak-supervision-conn weak-supervision-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#weak-supervision-tip)"/>
  <g class="weak-supervision-stage weak-supervision-s1">
    <rect class="weak-supervision-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="weak-supervision-step" x="280" y="142">02</text>
    <text class="weak-supervision-name" x="306" y="142">Each is noisy and covers only part of the data</text>
    <text class="weak-supervision-desc" x="280" y="166">And they disagree with each</text>
    <text class="weak-supervision-desc" x="280" y="182">other.</text>
  </g>
  <line class="weak-supervision-line weak-supervision-conn weak-supervision-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#weak-supervision-tip)"/>
  <g class="weak-supervision-stage weak-supervision-s2">
    <rect class="weak-supervision-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="weak-supervision-step" x="516" y="142">03</text>
    <text class="weak-supervision-name" x="542" y="142">A model estimates each rule's accuracy from their agreements</text>
    <text class="weak-supervision-desc" x="516" y="166">Without any ground truth at all.</text>
  </g>
  <line class="weak-supervision-line weak-supervision-conn weak-supervision-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#weak-supervision-tip)"/>
  <g class="weak-supervision-stage weak-supervision-s3">
    <rect class="weak-supervision-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="weak-supervision-step" x="752" y="142">04</text>
    <text class="weak-supervision-name" x="778" y="142">And combines them into probabilistic labels</text>
    <text class="weak-supervision-desc" x="752" y="166">Over a much larger set than</text>
    <text class="weak-supervision-desc" x="752" y="182">could be hand-labelled.</text>
  </g>
  <text class="weak-supervision-sub" x="30" y="304">Estimating accuracy from agreement patterns alone is the clever part: rules that agree with the consensus are inferred to be reliable, with no labels needed.</text>
</svg>
