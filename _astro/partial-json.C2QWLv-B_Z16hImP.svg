<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which conflicts with validation.">
  <title>Streaming structured output</title>
  <style>
    .partial-json-bg   { fill: #f8fafc; }
    .partial-json-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .partial-json-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .partial-json-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .partial-json-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .partial-json-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .partial-json-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .partial-json-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .partial-json-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .partial-json-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .partial-json-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .partial-json-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .partial-json-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .partial-json-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .partial-json-stage { opacity: 1; }

    .partial-json-s0 { animation-delay: 0.00s; }
    .partial-json-e0 { animation-delay: 0.00s; }
    .partial-json-s1 { animation-delay: 1.28s; }
    .partial-json-e1 { animation-delay: 1.28s; }
    .partial-json-s2 { animation-delay: 2.56s; }
    .partial-json-e2 { animation-delay: 2.56s; }
    .partial-json-s3 { animation-delay: 3.84s; }
    .partial-json-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .partial-json-conn  { animation: partial-json-trace 6.4s ease-in-out infinite; }
      .partial-json-stage { animation: partial-json-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes partial-json-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes partial-json-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .partial-json-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .partial-json-stage { animation: partial-json-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes partial-json-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="partial-json-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="partial-json-bg" width="980" height="322"/>
  <text class="partial-json-h1"  x="30" y="40">Streaming structured output</text>
  <text class="partial-json-sub" x="30" y="64">Which conflicts with validation.</text>
  <g class="partial-json-stage partial-json-s0">
    <rect class="partial-json-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="partial-json-step" x="44" y="142">01</text>
    <text class="partial-json-name" x="70" y="142">A partial document is not valid</text>
    <text class="partial-json-desc" x="44" y="166">It cannot be parsed by an</text>
    <text class="partial-json-desc" x="44" y="182">ordinary parser.</text>
  </g>
  <line class="partial-json-line partial-json-conn partial-json-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#partial-json-tip)"/>
  <g class="partial-json-stage partial-json-s1">
    <rect class="partial-json-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="partial-json-step" x="280" y="142">02</text>
    <text class="partial-json-name" x="306" y="142">Use an incremental parser instead</text>
    <text class="partial-json-desc" x="280" y="166">Which yields fields as they</text>
    <text class="partial-json-desc" x="280" y="182">complete.</text>
  </g>
  <line class="partial-json-line partial-json-conn partial-json-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#partial-json-tip)"/>
  <g class="partial-json-stage partial-json-s2">
    <rect class="partial-json-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="partial-json-step" x="516" y="142">03</text>
    <text class="partial-json-name" x="542" y="142">Render each completed field</text>
    <text class="partial-json-desc" x="516" y="166">So the interface fills in</text>
    <text class="partial-json-desc" x="516" y="182">progressively.</text>
  </g>
  <line class="partial-json-line partial-json-conn partial-json-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#partial-json-tip)"/>
  <g class="partial-json-stage partial-json-s3">
    <rect class="partial-json-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="partial-json-step" x="752" y="142">04</text>
    <text class="partial-json-name" x="778" y="142">But validate only at the end</text>
    <text class="partial-json-desc" x="752" y="166">And be prepared to correct what</text>
    <text class="partial-json-desc" x="752" y="182">was already shown.</text>
  </g>
  <text class="partial-json-sub" x="30" y="304">Having to correct output already displayed is the cost of streaming structured data, which is why anything requiring a validated result is usually better buffered.</text>
</svg>
