<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four techniques.">
  <title>The common distortions</title>
  <style>
    .distortions-bg   { fill: #f8fafc; }
    .distortions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distortions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distortions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distortions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distortions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distortions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distortions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distortions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distortions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distortions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distortions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distortions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .distortions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .distortions-stage { opacity: 1; }

    .distortions-s0 { animation-delay: 0.00s; }
    .distortions-e0 { animation-delay: 0.00s; }
    .distortions-s1 { animation-delay: 1.28s; }
    .distortions-e1 { animation-delay: 1.28s; }
    .distortions-s2 { animation-delay: 2.56s; }
    .distortions-e2 { animation-delay: 2.56s; }
    .distortions-s3 { animation-delay: 3.84s; }
    .distortions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .distortions-conn  { animation: distortions-trace 6.4s ease-in-out infinite; }
      .distortions-stage { animation: distortions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes distortions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes distortions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .distortions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .distortions-stage { animation: distortions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes distortions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="distortions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="distortions-bg" width="980" height="322"/>
  <text class="distortions-h1"  x="30" y="40">The common distortions</text>
  <text class="distortions-sub" x="30" y="64">Four techniques.</text>
  <g class="distortions-stage distortions-s0">
    <rect class="distortions-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="distortions-step" x="44" y="142">01</text>
    <text class="distortions-name" x="70" y="142">A truncated axis magnifying a small change</text>
    <text class="distortions-desc" x="44" y="166">The most common of all.</text>
  </g>
  <line class="distortions-line distortions-conn distortions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#distortions-tip)"/>
  <g class="distortions-stage distortions-s1">
    <rect class="distortions-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="distortions-step" x="280" y="142">02</text>
    <text class="distortions-name" x="306" y="142">Area or volume encoding a linear quantity</text>
    <text class="distortions-desc" x="280" y="166">Doubling looks like quadrupling.</text>
  </g>
  <line class="distortions-line distortions-conn distortions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#distortions-tip)"/>
  <g class="distortions-stage distortions-s2">
    <rect class="distortions-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="distortions-step" x="516" y="142">03</text>
    <text class="distortions-name" x="542" y="142">A period chosen to start at a convenient point</text>
    <text class="distortions-desc" x="516" y="166">Which manufactures a trend.</text>
  </g>
  <line class="distortions-line distortions-conn distortions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#distortions-tip)"/>
  <g class="distortions-stage distortions-s3">
    <rect class="distortions-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="distortions-step" x="752" y="142">04</text>
    <text class="distortions-name" x="778" y="142">And two vertical axes implying a relationship</text>
    <text class="distortions-desc" x="752" y="166">Where the scaling was chosen to</text>
    <text class="distortions-desc" x="752" y="182">fit.</text>
  </g>
  <text class="distortions-sub" x="30" y="304">Dual axes are the most defensible-seeming and least defensible of these, because the apparent correlation is entirely an artefact of two arbitrary scalings.</text>
</svg>
