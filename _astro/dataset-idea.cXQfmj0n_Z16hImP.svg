<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What makes a fine-tuning dataset</title>
  <style>
    .dataset-idea-bg   { fill: #f8fafc; }
    .dataset-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataset-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dataset-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dataset-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dataset-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dataset-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dataset-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dataset-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dataset-idea-stage { opacity: 1; }

    .dataset-idea-s0 { animation-delay: 0.00s; }
    .dataset-idea-e0 { animation-delay: 0.00s; }
    .dataset-idea-s1 { animation-delay: 1.28s; }
    .dataset-idea-e1 { animation-delay: 1.28s; }
    .dataset-idea-s2 { animation-delay: 2.56s; }
    .dataset-idea-e2 { animation-delay: 2.56s; }
    .dataset-idea-s3 { animation-delay: 3.84s; }
    .dataset-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dataset-idea-conn  { animation: dataset-idea-trace 6.4s ease-in-out infinite; }
      .dataset-idea-stage { animation: dataset-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dataset-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dataset-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dataset-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dataset-idea-stage { animation: dataset-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dataset-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dataset-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dataset-idea-bg" width="980" height="322"/>
  <text class="dataset-idea-h1"  x="30" y="40">What makes a fine-tuning dataset</text>
  <text class="dataset-idea-sub" x="30" y="64">Four properties.</text>
  <g class="dataset-idea-stage dataset-idea-s0">
    <rect class="dataset-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-idea-step" x="44" y="142">01</text>
    <text class="dataset-idea-name" x="70" y="142">Consistent</text>
    <text class="dataset-idea-desc" x="44" y="166">Every example demonstrates the</text>
    <text class="dataset-idea-desc" x="44" y="182">same behaviour, the same way.</text>
  </g>
  <line class="dataset-idea-line dataset-idea-conn dataset-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dataset-idea-tip)"/>
  <g class="dataset-idea-stage dataset-idea-s1">
    <rect class="dataset-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-idea-step" x="280" y="142">02</text>
    <text class="dataset-idea-name" x="306" y="142">Covering the real distribution</text>
    <text class="dataset-idea-desc" x="280" y="166">Including the awkward cases, not</text>
    <text class="dataset-idea-desc" x="280" y="182">only the clean ones.</text>
  </g>
  <line class="dataset-idea-line dataset-idea-conn dataset-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dataset-idea-tip)"/>
  <g class="dataset-idea-stage dataset-idea-s2">
    <rect class="dataset-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-idea-step" x="516" y="142">03</text>
    <text class="dataset-idea-name" x="542" y="142">Large enough, and no larger</text>
    <text class="dataset-idea-desc" x="516" y="166">Hundreds to a few thousand for</text>
    <text class="dataset-idea-desc" x="516" y="182">most behaviour changes.</text>
  </g>
  <line class="dataset-idea-line dataset-idea-conn dataset-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dataset-idea-tip)"/>
  <g class="dataset-idea-stage dataset-idea-s3">
    <rect class="dataset-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-idea-step" x="752" y="142">04</text>
    <text class="dataset-idea-name" x="778" y="142">And clean</text>
    <text class="dataset-idea-desc" x="752" y="166">One wrong example teaches the</text>
    <text class="dataset-idea-desc" x="752" y="182">wrong thing, confidently.</text>
  </g>
  <text class="dataset-idea-sub" x="30" y="304">Consistency matters more than volume: a thousand examples that disagree with each other teach less than two hundred that agree.</text>
</svg>
