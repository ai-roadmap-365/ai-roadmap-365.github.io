<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Retrieval, grounding, and relevance.">
  <title>Three questions locate the failure</title>
  <style>
    .rag-triad-bg   { fill: #f8fafc; }
    .rag-triad-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-triad-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-triad-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-triad-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-triad-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-triad-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-triad-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-triad-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-triad-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-triad-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-triad-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-triad-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rag-triad-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rag-triad-stage { opacity: 1; }

    .rag-triad-s0 { animation-delay: 0.00s; }
    .rag-triad-e0 { animation-delay: 0.00s; }
    .rag-triad-s1 { animation-delay: 1.50s; }
    .rag-triad-e1 { animation-delay: 1.50s; }
    .rag-triad-s2 { animation-delay: 3.00s; }
    .rag-triad-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .rag-triad-conn  { animation: rag-triad-trace 6s ease-in-out infinite; }
      .rag-triad-stage { animation: rag-triad-arrive 6s ease-in-out infinite; }
    }
    @keyframes rag-triad-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rag-triad-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rag-triad-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rag-triad-stage { animation: rag-triad-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rag-triad-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rag-triad-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rag-triad-bg" width="980" height="322"/>
  <text class="rag-triad-h1"  x="30" y="40">Three questions locate the failure</text>
  <text class="rag-triad-sub" x="30" y="64">Retrieval, grounding, and relevance.</text>
  <g class="rag-triad-stage rag-triad-s0">
    <rect class="rag-triad-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="rag-triad-step" x="44" y="142">01</text>
    <text class="rag-triad-name" x="70" y="142">Was the right context retrieved?</text>
    <text class="rag-triad-desc" x="44" y="166">If not, nothing downstream can succeed. A</text>
    <text class="rag-triad-desc" x="44" y="182">retrieval problem.</text>
    <text class="rag-triad-edge" x="44" y="242">context</text>
  </g>
  <line class="rag-triad-line rag-triad-conn rag-triad-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#rag-triad-tip)"/>
  <g class="rag-triad-stage rag-triad-s1">
    <rect class="rag-triad-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="rag-triad-step" x="359" y="142">02</text>
    <text class="rag-triad-name" x="385" y="142">Is the answer grounded in it?</text>
    <text class="rag-triad-desc" x="359" y="166">Every claim traceable to a passage. If not,</text>
    <text class="rag-triad-desc" x="359" y="182">the model invented it.</text>
    <text class="rag-triad-edge" x="359" y="242">grounding</text>
  </g>
  <line class="rag-triad-line rag-triad-conn rag-triad-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#rag-triad-tip)"/>
  <g class="rag-triad-stage rag-triad-s2">
    <rect class="rag-triad-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="rag-triad-step" x="674" y="142">03</text>
    <text class="rag-triad-name" x="700" y="142">Does it answer the question?</text>
    <text class="rag-triad-desc" x="674" y="166">Grounded and irrelevant is still a failure.</text>
    <text class="rag-triad-edge" x="674" y="242">relevance</text>
  </g>
  <text class="rag-triad-sub" x="30" y="304">The value is diagnostic rather than scalar: a single quality score tells you something got worse, and the triad tells you which of three teams' work to look at first.</text>
</svg>
