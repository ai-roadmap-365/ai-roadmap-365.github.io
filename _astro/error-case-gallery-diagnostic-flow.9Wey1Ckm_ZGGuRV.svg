<svg role="img" aria-label="Error case gallery diagnostic workflow surfacing high confidence misclassifications ambiguous samples and dataset label noise" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Error-Case Gallery Diagnostic and Failure Mode Taxonomy</title>
  <defs>
    <linearGradient id="bg217b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card217b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg217b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ERROR-CASE GALLERY DIAGNOSTIC WORKFLOW</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Systematic Post-Mortem Analysis of High-Confidence Vision Model Failures</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card217b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Failure Mode 1: Label Noise -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Ground Truth Label Noise</text>
    <rect x="40" y="65" width="190" height="190" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="135" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Human Annotation Error</text>
    <text x="135" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">True Tag: "Healthy Leaf"</text>
    <text x="135" y="135" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Model: "Blight Rust" (99.2%)</text>
    <text x="135" y="170" fill="#cbd5e1" font-size="8" text-anchor="middle">Visual Inspection reveals:</text>
    <text x="135" y="190" fill="#f8fafc" font-size="8" text-anchor="middle">The human annotator made a mistake!</text>
    <text x="135" y="235" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Action: Correct Dataset Label</text>

    <!-- Failure Mode 2: Occlusion & Lighting -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Occlusion &amp; Artifacts</text>
    <rect x="285" y="65" width="190" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Extreme Optical Distortion</text>
    <text x="380" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">True Tag: "Screw Defect"</text>
    <text x="380" y="135" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Model: "Normal" (64.1%)</text>
    <text x="380" y="170" fill="#cbd5e1" font-size="8" text-anchor="middle">Defect hidden by glare/shadow</text>
    <text x="380" y="190" fill="#f8fafc" font-size="8" text-anchor="middle">or heavy lens blur</text>
    <text x="380" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Action: Add Lighting Augment</text>

    <!-- Failure Mode 3: Semantic Ambiguity -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="625" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Class Boundary Overlap</text>
    <rect x="530" y="65" width="190" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="625" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Inherently Subjective Boundary</text>
    <text x="625" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">True Tag: "Mild Scratch"</text>
    <text x="625" y="135" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">Model: "Severe Scratch" (52%)</text>
    <text x="625" y="170" fill="#cbd5e1" font-size="8" text-anchor="middle">Categories lack objective metric</text>
    <text x="625" y="190" fill="#f8fafc" font-size="8" text-anchor="middle">specification</text>
    <text x="625" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Action: Merge / Clarify Taxonomies</text>
  </g>
</svg>
