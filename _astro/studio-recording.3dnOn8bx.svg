<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Separate channels, mixed at the end.">
  <title>A multi-track recording</title>
  <style>
    .studio-recording-bg   { fill: #f8fafc; }
    .studio-recording-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .studio-recording-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .studio-recording-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .studio-recording-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .studio-recording-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .studio-recording-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .studio-recording-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .studio-recording-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .studio-recording-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .studio-recording-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .studio-recording-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .studio-recording-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .studio-recording-row { opacity: 1; }
    .studio-recording-r0 { animation-delay: 0.00s; }
    .studio-recording-r1 { animation-delay: 0.45s; }
    .studio-recording-r2 { animation-delay: 0.90s; }
    .studio-recording-r3 { animation-delay: 1.35s; }
    .studio-recording-r4 { animation-delay: 1.80s; }
    .studio-recording-row { animation: studio-recording-reveal 7.3s ease-in-out infinite; }
    @keyframes studio-recording-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="studio-recording-bg" width="980" height="390"/>
  <text class="studio-recording-h1"  x="30" y="40">A multi-track recording</text>
  <text class="studio-recording-sub" x="30" y="64">Separate channels, mixed at the end.</text>
  <rect class="studio-recording-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="studio-recording-name" x="46" y="122">One microphone</text>
  <text class="studio-recording-desc" x="46" y="142">Everything at once.</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r0" x="46" y="182">The whole room on one track</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r1" x="46" y="216">Instruments blended before capture</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r2" x="46" y="250">No way to isolate afterwards</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r3" x="46" y="284">Simpler, and irreversible</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r4" x="46" y="318">This is single-head attention</text>
  <rect class="studio-recording-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="studio-recording-name" x="526" y="122">Multi-track</text>
  <text class="studio-recording-desc" x="526" y="142">Separate, then mixed.</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r0" x="526" y="182">Each instrument on its own channel</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r1" x="526" y="216">Different processing per channel</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r2" x="526" y="250">Combined deliberately at the end</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r3" x="526" y="284">Same total audio, more control</text>
  <text class="studio-recording-desc studio-recording-row studio-recording-r4" x="526" y="318">This is multi-head attention</text>
  <text class="studio-recording-sub" x="30" y="372">The final mix is the output projection, and its role is the same in both: deciding how much of each channel contributes to the result.</text>
</svg>
