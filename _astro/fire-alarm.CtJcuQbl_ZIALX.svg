<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not whoever heard it.">
  <title>Who deals with the alarm</title>
  <style>
    .fire-alarm-bg   { fill: #f8fafc; }
    .fire-alarm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-alarm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-alarm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-alarm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-alarm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-alarm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fire-alarm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fire-alarm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fire-alarm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fire-alarm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fire-alarm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fire-alarm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fire-alarm-row { opacity: 1; }
    .fire-alarm-r0 { animation-delay: 0.00s; }
    .fire-alarm-r1 { animation-delay: 0.45s; }
    .fire-alarm-r2 { animation-delay: 0.90s; }
    .fire-alarm-r3 { animation-delay: 1.35s; }
    .fire-alarm-r4 { animation-delay: 1.80s; }
    .fire-alarm-row { animation: fire-alarm-reveal 7.3s ease-in-out infinite; }
    @keyframes fire-alarm-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fire-alarm-bg" width="980" height="390"/>
  <text class="fire-alarm-h1"  x="30" y="40">Who deals with the alarm</text>
  <text class="fire-alarm-sub" x="30" y="64">Not whoever heard it.</text>
  <rect class="fire-alarm-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fire-alarm-name" x="46" y="122">Whoever notices</text>
  <text class="fire-alarm-desc" x="46" y="142">Detects.</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r0" x="46" y="182">Sees smoke in one room</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r1" x="46" y="216">Has no view of the building</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r2" x="46" y="250">Cannot decide whether to evacuate</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r3" x="46" y="284">Raises the alarm</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r4" x="46" y="318">This is the function that raises</text>
  <rect class="fire-alarm-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fire-alarm-name" x="526" y="122">Whoever is responsible</text>
  <text class="fire-alarm-desc" x="526" y="142">Decides.</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r0" x="526" y="182">Hears the alarm</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r1" x="526" y="216">Knows the whole situation</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r2" x="526" y="250">Decides what happens next</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r3" x="526" y="284">Acts, or escalates</text>
  <text class="fire-alarm-desc fire-alarm-row fire-alarm-r4" x="526" y="318">This is the handler</text>
  <text class="fire-alarm-sub" x="30" y="372">The person who noticed lacks the context to decide, which is exactly why raising is right and handling locally usually is not.</text>
</svg>
