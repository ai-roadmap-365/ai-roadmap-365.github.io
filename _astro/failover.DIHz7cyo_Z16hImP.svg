<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Failing over between providers</title>
  <style>
    .failover-bg   { fill: #f8fafc; }
    .failover-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .failover-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .failover-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .failover-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .failover-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .failover-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .failover-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .failover-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .failover-stage { opacity: 1; }

    .failover-s0 { animation-delay: 0.00s; }
    .failover-e0 { animation-delay: 0.00s; }
    .failover-s1 { animation-delay: 1.28s; }
    .failover-e1 { animation-delay: 1.28s; }
    .failover-s2 { animation-delay: 2.56s; }
    .failover-e2 { animation-delay: 2.56s; }
    .failover-s3 { animation-delay: 3.84s; }
    .failover-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .failover-conn  { animation: failover-trace 6.4s ease-in-out infinite; }
      .failover-stage { animation: failover-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes failover-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes failover-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .failover-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .failover-stage { animation: failover-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes failover-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="failover-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="failover-bg" width="980" height="322"/>
  <text class="failover-h1"  x="30" y="40">Failing over between providers</text>
  <text class="failover-sub" x="30" y="64">Four steps.</text>
  <g class="failover-stage failover-s0">
    <rect class="failover-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="failover-step" x="44" y="142">01</text>
    <text class="failover-name" x="70" y="142">Send everything to the primary provider</text>
    <text class="failover-desc" x="44" y="166">Which is chosen on cost or</text>
    <text class="failover-desc" x="44" y="182">capability.</text>
  </g>
  <line class="failover-line failover-conn failover-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#failover-tip)"/>
  <g class="failover-stage failover-s1">
    <rect class="failover-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="failover-step" x="280" y="142">02</text>
    <text class="failover-name" x="306" y="142">Detect failure quickly</text>
    <text class="failover-desc" x="280" y="166">On error rate and latency, not</text>
    <text class="failover-desc" x="280" y="182">just on outright errors.</text>
  </g>
  <line class="failover-line failover-conn failover-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#failover-tip)"/>
  <g class="failover-stage failover-s2">
    <rect class="failover-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="failover-step" x="516" y="142">03</text>
    <text class="failover-name" x="542" y="142">Fail over to a second provider</text>
    <text class="failover-desc" x="516" y="166">With the same request,</text>
    <text class="failover-desc" x="516" y="182">unchanged.</text>
  </g>
  <line class="failover-line failover-conn failover-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#failover-tip)"/>
  <g class="failover-stage failover-s3">
    <rect class="failover-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="failover-step" x="752" y="142">04</text>
    <text class="failover-name" x="778" y="142">And reconcile the differences</text>
    <text class="failover-desc" x="752" y="166">Because the fallback's output</text>
    <text class="failover-desc" x="752" y="182">will not be identical.</text>
  </g>
  <text class="failover-sub" x="30" y="304">The reconciliation step is the one that gets skipped: a fallback model produces different output, so anything downstream that assumed one model's behaviour will notice.</text>
</svg>
