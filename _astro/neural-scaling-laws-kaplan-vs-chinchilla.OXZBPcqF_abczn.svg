<svg role="img" aria-label="Neural Scaling Laws comparison plotting cross-entropy loss against compute FLOPs comparing Kaplan and Chinchilla" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Neural Scaling Laws: Kaplan vs. Chinchilla Formulations</title>
  <defs>
    <linearGradient id="bg237a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card237" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg237a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">EMPIRICAL SCALING LAWS: POWER-LAW PREDICTABILITY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Cross-Entropy Loss L(N, D) = E + (A / N^alpha) + (B / D^beta) | Compute C = 6ND</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card237)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Kaplan vs Chinchilla Comparison -->
    <rect x="25" y="25" width="345" height="255" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="197" y="50" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Kaplan (2020) vs. Chinchilla (2022)</text>
    
    <!-- Kaplan Box -->
    <rect x="40" y="70" width="315" height="85" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="55" y="90" fill="#fb7185" font-size="10" font-weight="700">OpenAI Kaplan et al. (2020):</text>
    <text x="55" y="108" fill="#cbd5e1" font-size="8">• Recommended scaling parameters much faster than tokens</text>
    <text x="55" y="123" fill="#cbd5e1" font-size="8">• For 10x compute: 7.3x Parameters (N) &amp; 1.3x Tokens (D)</text>
    <text x="55" y="138" fill="#fb7185" font-size="8" font-weight="700">Result: GPT-3 (175B on 300B tokens) was undertrained!</text>

    <!-- Chinchilla Box -->
    <rect x="40" y="170" width="315" height="95" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="55" y="190" fill="#34d399" font-size="10" font-weight="700">DeepMind Chinchilla (Hoffmann et al., 2022):</text>
    <text x="55" y="208" fill="#cbd5e1" font-size="8">• Parameters and Tokens should scale equally in 1:1 ratio!</text>
    <text x="55" y="223" fill="#cbd5e1" font-size="8">• Optimal Ratio: D ≈ 20 * N tokens per parameter</text>
    <text x="55" y="238" fill="#cbd5e1" font-size="8">• Chinchilla (70B on 1.4T tokens) beat Gopher (280B)!</text>
    <text x="55" y="253" fill="#34d399" font-size="8" font-weight="700">The Modern Compute-Optimal Foundation</text>

    <!-- Right: Scaling Regimes & Overtraining -->
    <rect x="390" y="25" width="345" height="255" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="562" y="50" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">The Three Eras of Scaling</text>
    
    <!-- Era 1 -->
    <rect x="405" y="70" width="315" height="55" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="420" y="88" fill="#38bdf8" font-size="9" font-weight="700">1. Pre-Training Compute Scaling (2020-2023)</text>
    <text x="420" y="105" fill="#cbd5e1" font-size="8">Scale N and D together: GPT-4, Claude 3, Gemini 1.0</text>

    <!-- Era 2 -->
    <rect x="405" y="135" width="315" height="60" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="420" y="153" fill="#fbbf24" font-size="9" font-weight="700">2. Inference-Optimal Overtraining (LLaMA Era)</text>
    <text x="420" y="170" fill="#cbd5e1" font-size="8">Train 8B models on 15 Trillion tokens (D >> 20N)</text>
    <text x="420" y="185" fill="#fbbf24" font-size="8">High training compute pays off in cheap edge serving!</text>

    <!-- Era 3 -->
    <rect x="405" y="205" width="315" height="60" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" rx="4"/>
    <text x="420" y="223" fill="#c084fc" font-size="9" font-weight="700">3. Test-Time / Reasoning Scaling (2024+)</text>
    <text x="420" y="240" fill="#cbd5e1" font-size="8">OpenAI o1/o3: Search &amp; Chain-of-Thought at inference time</text>
    <text x="420" y="255" fill="#c084fc" font-size="8" font-weight="700">Trading generation tokens for mathematical reasoning</text>
  </g>
</svg>
