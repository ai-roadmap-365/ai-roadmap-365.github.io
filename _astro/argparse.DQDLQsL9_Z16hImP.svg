<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things it gives you.">
  <title>Parsing arguments</title>
  <style>
    .argparse-bg   { fill: #f8fafc; }
    .argparse-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argparse-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argparse-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argparse-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argparse-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argparse-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .argparse-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .argparse-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .argparse-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .argparse-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .argparse-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .argparse-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .argparse-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .argparse-stage { opacity: 1; }

    .argparse-s0 { animation-delay: 0.00s; }
    .argparse-e0 { animation-delay: 0.00s; }
    .argparse-s1 { animation-delay: 1.28s; }
    .argparse-e1 { animation-delay: 1.28s; }
    .argparse-s2 { animation-delay: 2.56s; }
    .argparse-e2 { animation-delay: 2.56s; }
    .argparse-s3 { animation-delay: 3.84s; }
    .argparse-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .argparse-conn  { animation: argparse-trace 6.4s ease-in-out infinite; }
      .argparse-stage { animation: argparse-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes argparse-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes argparse-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .argparse-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .argparse-stage { animation: argparse-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes argparse-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="argparse-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="argparse-bg" width="980" height="322"/>
  <text class="argparse-h1"  x="30" y="40">Parsing arguments</text>
  <text class="argparse-sub" x="30" y="64">Four things it gives you.</text>
  <g class="argparse-stage argparse-s0">
    <rect class="argparse-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="argparse-step" x="44" y="142">01</text>
    <text class="argparse-name" x="70" y="142">Declares what arguments exist</text>
    <text class="argparse-desc" x="44" y="166">Required, optional, and their</text>
    <text class="argparse-desc" x="44" y="182">defaults.</text>
  </g>
  <line class="argparse-line argparse-conn argparse-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#argparse-tip)"/>
  <g class="argparse-stage argparse-s1">
    <rect class="argparse-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="argparse-step" x="280" y="142">02</text>
    <text class="argparse-name" x="306" y="142">Converts and validates types</text>
    <text class="argparse-desc" x="280" y="166">So the code receives a number,</text>
    <text class="argparse-desc" x="280" y="182">not a string.</text>
  </g>
  <line class="argparse-line argparse-conn argparse-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#argparse-tip)"/>
  <g class="argparse-stage argparse-s2">
    <rect class="argparse-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="argparse-step" x="516" y="142">03</text>
    <text class="argparse-name" x="542" y="142">Generates help text from the declaration</text>
    <text class="argparse-desc" x="516" y="166">Which stays in step</text>
    <text class="argparse-desc" x="516" y="182">automatically.</text>
  </g>
  <line class="argparse-line argparse-conn argparse-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#argparse-tip)"/>
  <g class="argparse-stage argparse-s3">
    <rect class="argparse-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="argparse-step" x="752" y="142">04</text>
    <text class="argparse-name" x="778" y="142">And reports bad input clearly, then exits</text>
    <text class="argparse-desc" x="752" y="166">Before any work begins.</text>
  </g>
  <text class="argparse-sub" x="30" y="304">Help text generated from the declaration is what keeps documentation honest, since it cannot drift from the arguments the program actually accepts.</text>
</svg>
