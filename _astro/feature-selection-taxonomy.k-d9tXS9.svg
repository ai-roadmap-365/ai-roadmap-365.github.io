<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Feature Selection Taxonomy Diagram">
  <title>Feature Selection Methodologies</title>
  <defs>
    <style>
      .d172a-bg { fill: #f8fafc; }
      .d172a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d172a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d172a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d172a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d172a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d172a-bg" />

  <text x="40" y="45" class="d172a-header" font-size="22">The 3 Canonical Feature Selection Methodologies</text>
  <text x="40" y="70" class="d172a-text" font-size="13">Filter Methods (Fast &amp; Univariate) vs Wrapper Methods (Model Loop) vs Embedded Methods (Integrated)</text>

  <!-- 1. Filter Methods -->
  <rect x="40" y="100" width="260" height="340" class="d172a-box" fill="#eff6ff" stroke="#3b82f6" />
  <text x="60" y="130" class="d172a-title" fill="#1d4ed8">1. Filter Methods (Univariate)</text>
  <text x="60" y="155" class="d172a-text">Independent of Machine Learning Model:</text>
  <rect x="60" y="175" width="220" height="70" fill="#ffffff" stroke="#93c5fd" rx="6" />
  <text x="75" y="200" class="d172a-math">Features ➔ Rank Score ➔ Top K</text>
  <text x="75" y="225" class="d172a-text">Variance, Pearson, Mutual Info</text>

  <text x="60" y="275" class="d172a-text"><tspan font-weight="700">Speed:</tspan> Ultra Fast O(D).</text>
  <text x="60" y="300" class="d172a-text"><tspan font-weight="700">Pros:</tspan> Scales to 1,000,000 features.</text>
  <text x="60" y="325" class="d172a-text"><tspan font-weight="700">Cons:</tspan> Ignores feature interactions.</text>
  <text x="60" y="365" class="d172a-math" fill="#1d4ed8">Best: Stage 1 Initial Pruning</text>

  <!-- 2. Wrapper Methods -->
  <rect x="320" y="100" width="260" height="340" class="d172a-box" fill="#fefce8" stroke="#eab308" />
  <text x="340" y="130" class="d172a-title" fill="#a16207">2. Wrapper Methods (Search Loop)</text>
  <text x="340" y="155" class="d172a-text">Uses Estimator as Search Oracle:</text>
  <rect x="340" y="175" width="220" height="70" fill="#ffffff" stroke="#fde047" rx="6" />
  <text x="355" y="200" class="d172a-math">Subset ➔ Train ➔ Prune ➔ Loop</text>
  <text x="355" y="225" class="d172a-text">RFE, RFECV, Forward Selection</text>

  <text x="340" y="275" class="d172a-text"><tspan font-weight="700">Speed:</tspan> Slow O(D · Model_Time).</text>
  <text x="340" y="300" class="d172a-text"><tspan font-weight="700">Pros:</tspan> Optimizes exact subset synergy.</text>
  <text x="340" y="325" class="d172a-text"><tspan font-weight="700">Cons:</tspan> Prone to overfitting on small N.</text>
  <text x="340" y="365" class="d172a-math" fill="#a16207">Best: Final Subset Optimization</text>

  <!-- 3. Embedded Methods -->
  <rect x="600" y="100" width="260" height="340" class="d172a-box" fill="#f0fdf4" stroke="#22c55e" />
  <text x="620" y="130" class="d172a-title" fill="#15803d">3. Embedded Methods (In-Model)</text>
  <text x="620" y="155" class="d172a-text">Integrated into Objective Loss:</text>
  <rect x="620" y="175" width="220" height="70" fill="#ffffff" stroke="#86efac" rx="6" />
  <text x="635" y="200" class="d172a-math">Loss(w) + λ · ||w||₁ (Lasso)</text>
  <text x="635" y="225" class="d172a-text">L1 Sparsity, Tree Gain, Boruta</text>

  <text x="620" y="275" class="d172a-text"><tspan font-weight="700">Speed:</tspan> Medium (Single training run).</text>
  <text x="620" y="300" class="d172a-text"><tspan font-weight="700">Pros:</tspan> Captures interactions smoothly.</text>
  <text x="620" y="325" class="d172a-text"><tspan font-weight="700">Cons:</tspan> Bound to specific model family.</text>
  <text x="620" y="365" class="d172a-math" fill="#15803d">Best: End-to-End Regularization</text>
</svg>
