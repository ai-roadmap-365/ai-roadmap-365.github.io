<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From physics to meaning.">
  <title>Four steps for vectors</title>
  <style>
    .vector-history-bg   { fill: #f8fafc; }
    .vector-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vector-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vector-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vector-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vector-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vector-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vector-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vector-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vector-history-stage { opacity: 1; }

    .vector-history-s0 { animation-delay: 0.00s; }
    .vector-history-e0 { animation-delay: 0.00s; }
    .vector-history-s1 { animation-delay: 1.28s; }
    .vector-history-e1 { animation-delay: 1.28s; }
    .vector-history-s2 { animation-delay: 2.56s; }
    .vector-history-e2 { animation-delay: 2.56s; }
    .vector-history-s3 { animation-delay: 3.84s; }
    .vector-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vector-history-conn  { animation: vector-history-trace 6.4s ease-in-out infinite; }
      .vector-history-stage { animation: vector-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vector-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vector-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vector-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vector-history-stage { animation: vector-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vector-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vector-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vector-history-bg" width="980" height="322"/>
  <text class="vector-history-h1"  x="30" y="40">Four steps for vectors</text>
  <text class="vector-history-sub" x="30" y="64">From physics to meaning.</text>
  <g class="vector-history-stage vector-history-s0">
    <rect class="vector-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vector-history-step" x="44" y="142">01</text>
    <text class="vector-history-name" x="70" y="142">Quantities with direction, in physics</text>
    <text class="vector-history-desc" x="44" y="166">Force, velocity, displacement.</text>
  </g>
  <line class="vector-history-line vector-history-conn vector-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vector-history-tip)"/>
  <g class="vector-history-stage vector-history-s1">
    <rect class="vector-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vector-history-step" x="280" y="142">02</text>
    <text class="vector-history-name" x="306" y="142">Then formalised algebraically</text>
    <text class="vector-history-desc" x="280" y="166">Detached from any physical</text>
    <text class="vector-history-desc" x="280" y="182">meaning.</text>
  </g>
  <line class="vector-history-line vector-history-conn vector-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vector-history-tip)"/>
  <g class="vector-history-stage vector-history-s2">
    <rect class="vector-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vector-history-step" x="516" y="142">03</text>
    <text class="vector-history-name" x="542" y="142">Which allowed any number of dimensions</text>
    <text class="vector-history-desc" x="516" y="166">Including hundreds, which</text>
    <text class="vector-history-desc" x="516" y="182">nothing physical has.</text>
  </g>
  <line class="vector-history-line vector-history-conn vector-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vector-history-tip)"/>
  <g class="vector-history-stage vector-history-s3">
    <rect class="vector-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vector-history-step" x="752" y="142">04</text>
    <text class="vector-history-name" x="778" y="142">And then meaning itself was placed in that space</text>
    <text class="vector-history-desc" x="752" y="166">Which is what an embedding is.</text>
  </g>
  <text class="vector-history-sub" x="30" y="304">The detachment from physical space is what made the last step possible: nothing about the mathematics required three dimensions or a physical interpretation.</text>
</svg>
