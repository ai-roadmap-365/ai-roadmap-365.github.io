<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From ZIP codes to unlearning.">
  <title>Four eras of privacy engineering</title>
  <style>
    .privacy-eras-bg   { fill: #f8fafc; }
    .privacy-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .privacy-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .privacy-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .privacy-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .privacy-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .privacy-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .privacy-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .privacy-eras-stage { opacity: 1; }

    .privacy-eras-s0 { animation-delay: 0.00s; }
    .privacy-eras-e0 { animation-delay: 0.00s; }
    .privacy-eras-s1 { animation-delay: 1.28s; }
    .privacy-eras-e1 { animation-delay: 1.28s; }
    .privacy-eras-s2 { animation-delay: 2.56s; }
    .privacy-eras-e2 { animation-delay: 2.56s; }
    .privacy-eras-s3 { animation-delay: 3.84s; }
    .privacy-eras-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .privacy-eras-conn  { animation: privacy-eras-trace 6.4s ease-in-out infinite; }
      .privacy-eras-stage { animation: privacy-eras-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes privacy-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes privacy-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .privacy-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .privacy-eras-stage { animation: privacy-eras-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes privacy-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="privacy-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="privacy-eras-bg" width="980" height="322"/>
  <text class="privacy-eras-h1"  x="30" y="40">Four eras of privacy engineering</text>
  <text class="privacy-eras-sub" x="30" y="64">From ZIP codes to unlearning.</text>
  <g class="privacy-eras-stage privacy-eras-s0">
    <rect class="privacy-eras-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-eras-step" x="44" y="142">01</text>
    <text class="privacy-eras-name" x="70" y="142">Quasi-identifiers, 1998-2006</text>
    <text class="privacy-eras-desc" x="44" y="166">87% of a population identified</text>
    <text class="privacy-eras-desc" x="44" y="182">by ZIP, gender and date of</text>
    <text class="privacy-eras-desc" x="44" y="198">birth. k-anonymity follows.</text>
  </g>
  <line class="privacy-eras-line privacy-eras-conn privacy-eras-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#privacy-eras-tip)"/>
  <g class="privacy-eras-stage privacy-eras-s1">
    <rect class="privacy-eras-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-eras-step" x="280" y="142">02</text>
    <text class="privacy-eras-name" x="306" y="142">Differential privacy, 2006</text>
    <text class="privacy-eras-desc" x="280" y="166">Dwork. A mathematical bound on</text>
    <text class="privacy-eras-desc" x="280" y="182">individual disclosure, not a</text>
    <text class="privacy-eras-desc" x="280" y="198">heuristic.</text>
  </g>
  <line class="privacy-eras-line privacy-eras-conn privacy-eras-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#privacy-eras-tip)"/>
  <g class="privacy-eras-stage privacy-eras-s2">
    <rect class="privacy-eras-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-eras-step" x="516" y="142">03</text>
    <text class="privacy-eras-name" x="542" y="142">DP-SGD, 2016</text>
    <text class="privacy-eras-desc" x="516" y="166">Gradient clipping plus Gaussian</text>
    <text class="privacy-eras-desc" x="516" y="182">noise. Provable guarantees</text>
    <text class="privacy-eras-desc" x="516" y="198">during training.</text>
  </g>
  <line class="privacy-eras-line privacy-eras-conn privacy-eras-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#privacy-eras-tip)"/>
  <g class="privacy-eras-stage privacy-eras-s3">
    <rect class="privacy-eras-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-eras-step" x="752" y="142">04</text>
    <text class="privacy-eras-name" x="778" y="142">Vaults and unlearning, 2023</text>
    <text class="privacy-eras-desc" x="752" y="166">Real-time de-identification, and</text>
    <text class="privacy-eras-desc" x="752" y="182">algorithmic erasure for Article</text>
    <text class="privacy-eras-desc" x="752" y="198">17.</text>
  </g>
  <text class="privacy-eras-sub" x="30" y="304">The first row is worth remembering whenever a dataset is described as anonymised: three ordinary fields, none of them an identifier, were enough to name most of a population.</text>
</svg>
