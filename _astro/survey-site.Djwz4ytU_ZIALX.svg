<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Before building.">
  <title>Surveying a site</title>
  <style>
    .survey-site-bg   { fill: #f8fafc; }
    .survey-site-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-site-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-site-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-site-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-site-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-site-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .survey-site-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .survey-site-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .survey-site-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .survey-site-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .survey-site-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .survey-site-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .survey-site-row { opacity: 1; }
    .survey-site-r0 { animation-delay: 0.00s; }
    .survey-site-r1 { animation-delay: 0.45s; }
    .survey-site-r2 { animation-delay: 0.90s; }
    .survey-site-r3 { animation-delay: 1.35s; }
    .survey-site-r4 { animation-delay: 1.80s; }
    .survey-site-row { animation: survey-site-reveal 7.3s ease-in-out infinite; }
    @keyframes survey-site-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="survey-site-bg" width="980" height="390"/>
  <text class="survey-site-h1"  x="30" y="40">Surveying a site</text>
  <text class="survey-site-sub" x="30" y="64">Before building.</text>
  <rect class="survey-site-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="survey-site-name" x="46" y="122">Survey first</text>
  <text class="survey-site-desc" x="46" y="142">Problems found early.</text>
  <text class="survey-site-desc survey-site-row survey-site-r0" x="46" y="182">Walk the whole site</text>
  <text class="survey-site-desc survey-site-row survey-site-r1" x="46" y="216">Note the ground conditions</text>
  <text class="survey-site-desc survey-site-row survey-site-r2" x="46" y="250">Find the obstacles</text>
  <text class="survey-site-desc survey-site-row survey-site-r3" x="46" y="284">Design accordingly</text>
  <text class="survey-site-desc survey-site-row survey-site-r4" x="46" y="318">This is exploratory analysis</text>
  <rect class="survey-site-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="survey-site-name" x="526" y="122">Build first</text>
  <text class="survey-site-desc" x="526" y="142">Problems found late.</text>
  <text class="survey-site-desc survey-site-row survey-site-r0" x="526" y="182">Start at once</text>
  <text class="survey-site-desc survey-site-row survey-site-r1" x="526" y="216">Assume the ground is sound</text>
  <text class="survey-site-desc survey-site-row survey-site-r2" x="526" y="250">Discover obstacles mid-build</text>
  <text class="survey-site-desc survey-site-row survey-site-r3" x="526" y="284">Redesign expensively</text>
  <text class="survey-site-desc survey-site-row survey-site-r4" x="526" y="318">This is modelling before looking</text>
  <text class="survey-site-sub" x="30" y="372">Redesigning mid-build is the expensive parallel: a model trained before the data is understood usually has to be redone once the problems surface.</text>
</svg>
