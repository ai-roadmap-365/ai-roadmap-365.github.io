<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fields or free text.">
  <title>Designing a form</title>
  <style>
    .forms-design-bg   { fill: #f8fafc; }
    .forms-design-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-design-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-design-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-design-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-design-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-design-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forms-design-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forms-design-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forms-design-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forms-design-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forms-design-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forms-design-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forms-design-row { opacity: 1; }
    .forms-design-r0 { animation-delay: 0.00s; }
    .forms-design-r1 { animation-delay: 0.45s; }
    .forms-design-r2 { animation-delay: 0.90s; }
    .forms-design-r3 { animation-delay: 1.35s; }
    .forms-design-r4 { animation-delay: 1.80s; }
    .forms-design-row { animation: forms-design-reveal 7.3s ease-in-out infinite; }
    @keyframes forms-design-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="forms-design-bg" width="980" height="390"/>
  <text class="forms-design-h1"  x="30" y="40">Designing a form</text>
  <text class="forms-design-sub" x="30" y="64">Fields or free text.</text>
  <rect class="forms-design-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="forms-design-name" x="46" y="122">Structured fields</text>
  <text class="forms-design-desc" x="46" y="142">Analysable.</text>
  <text class="forms-design-desc forms-design-row forms-design-r0" x="46" y="182">Each fact in its own labelled field</text>
  <text class="forms-design-desc forms-design-row forms-design-r1" x="46" y="216">Required fields cannot be skipped</text>
  <text class="forms-design-desc forms-design-row forms-design-r2" x="46" y="250">Values from a fixed list</text>
  <text class="forms-design-desc forms-design-row forms-design-r3" x="46" y="284">Consistent across everyone who fills it</text>
  <text class="forms-design-desc forms-design-row forms-design-r4" x="46" y="318">This is a schema</text>
  <rect class="forms-design-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="forms-design-name" x="526" y="122">Free text</text>
  <text class="forms-design-desc" x="526" y="142">Unanalysable.</text>
  <text class="forms-design-desc forms-design-row forms-design-r0" x="526" y="182">Everything in one box</text>
  <text class="forms-design-desc forms-design-row forms-design-r1" x="526" y="216">Anything can be left out</text>
  <text class="forms-design-desc forms-design-row forms-design-r2" x="526" y="250">Values spelled five ways</text>
  <text class="forms-design-desc forms-design-row forms-design-r3" x="526" y="284">Each person writes differently</text>
  <text class="forms-design-desc forms-design-row forms-design-r4" x="526" y="318">This is an unstructured table</text>
  <text class="forms-design-sub" x="30" y="372">Values spelled five ways is the specific cost, and it is why a constrained column beats a free-text one every time the data will be counted.</text>
</svg>
