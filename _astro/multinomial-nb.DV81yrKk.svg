<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Naive Bayes for text</title>
  <style>
    .multinomial-nb-bg   { fill: #f8fafc; }
    .multinomial-nb-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multinomial-nb-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multinomial-nb-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multinomial-nb-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multinomial-nb-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multinomial-nb-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multinomial-nb-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multinomial-nb-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multinomial-nb-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multinomial-nb-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multinomial-nb-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multinomial-nb-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multinomial-nb-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multinomial-nb-stage { opacity: 1; }

    .multinomial-nb-s0 { animation-delay: 0.00s; }
    .multinomial-nb-e0 { animation-delay: 0.00s; }
    .multinomial-nb-s1 { animation-delay: 1.28s; }
    .multinomial-nb-e1 { animation-delay: 1.28s; }
    .multinomial-nb-s2 { animation-delay: 2.56s; }
    .multinomial-nb-e2 { animation-delay: 2.56s; }
    .multinomial-nb-s3 { animation-delay: 3.84s; }
    .multinomial-nb-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .multinomial-nb-conn  { animation: multinomial-nb-trace 6.4s ease-in-out infinite; }
      .multinomial-nb-stage { animation: multinomial-nb-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes multinomial-nb-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multinomial-nb-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multinomial-nb-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multinomial-nb-stage { animation: multinomial-nb-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multinomial-nb-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multinomial-nb-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multinomial-nb-bg" width="980" height="322"/>
  <text class="multinomial-nb-h1"  x="30" y="40">Naive Bayes for text</text>
  <text class="multinomial-nb-sub" x="30" y="64">Four steps.</text>
  <g class="multinomial-nb-stage multinomial-nb-s0">
    <rect class="multinomial-nb-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="multinomial-nb-step" x="44" y="142">01</text>
    <text class="multinomial-nb-name" x="70" y="142">Split the document into tokens</text>
    <text class="multinomial-nb-desc" x="44" y="166">Order is discarded entirely.</text>
  </g>
  <line class="multinomial-nb-line multinomial-nb-conn multinomial-nb-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#multinomial-nb-tip)"/>
  <g class="multinomial-nb-stage multinomial-nb-s1">
    <rect class="multinomial-nb-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="multinomial-nb-step" x="280" y="142">02</text>
    <text class="multinomial-nb-name" x="306" y="142">Count how often each word occurs in each class</text>
    <text class="multinomial-nb-desc" x="280" y="166">Across the training corpus.</text>
  </g>
  <line class="multinomial-nb-line multinomial-nb-conn multinomial-nb-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#multinomial-nb-tip)"/>
  <g class="multinomial-nb-stage multinomial-nb-s2">
    <rect class="multinomial-nb-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="multinomial-nb-step" x="516" y="142">03</text>
    <text class="multinomial-nb-name" x="542" y="142">Add a small constant to every count</text>
    <text class="multinomial-nb-desc" x="516" y="166">So an unseen word does not zero</text>
    <text class="multinomial-nb-desc" x="516" y="182">the whole product.</text>
  </g>
  <line class="multinomial-nb-line multinomial-nb-conn multinomial-nb-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#multinomial-nb-tip)"/>
  <g class="multinomial-nb-stage multinomial-nb-s3">
    <rect class="multinomial-nb-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="multinomial-nb-step" x="752" y="142">04</text>
    <text class="multinomial-nb-name" x="778" y="142">Then score a new document by summing log probabilities</text>
    <text class="multinomial-nb-desc" x="752" y="166">And take the highest.</text>
  </g>
  <text class="multinomial-nb-sub" x="30" y="304">The smoothing constant is not optional: without it, a single word never seen in a class makes that class impossible regardless of all other evidence.</text>
</svg>
