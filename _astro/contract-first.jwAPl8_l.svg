<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both sides can then build at once.">
  <title>Agree the contract before the implementation</title>
  <style>
    .contract-first-bg   { fill: #f8fafc; }
    .contract-first-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-first-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-first-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-first-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-first-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-first-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .contract-first-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .contract-first-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .contract-first-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .contract-first-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .contract-first-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .contract-first-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .contract-first-row { opacity: 1; }
    .contract-first-r0 { animation-delay: 0.00s; }
    .contract-first-r1 { animation-delay: 0.45s; }
    .contract-first-r2 { animation-delay: 0.90s; }
    .contract-first-r3 { animation-delay: 1.35s; }
    .contract-first-r4 { animation-delay: 1.80s; }
    .contract-first-row { animation: contract-first-reveal 7.3s ease-in-out infinite; }
    @keyframes contract-first-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="contract-first-bg" width="980" height="390"/>
  <text class="contract-first-h1"  x="30" y="40">Agree the contract before the implementation</text>
  <text class="contract-first-sub" x="30" y="64">Both sides can then build at once.</text>
  <rect class="contract-first-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="contract-first-name" x="46" y="122">Implementation first</text>
  <text class="contract-first-desc" x="46" y="142">Integrate at the end, and discover.</text>
  <text class="contract-first-desc contract-first-row contract-first-r0" x="46" y="182">Each side assumes a shape</text>
  <text class="contract-first-desc contract-first-row contract-first-r1" x="46" y="216">The mismatch appears at integration</text>
  <text class="contract-first-desc contract-first-row contract-first-r2" x="46" y="250">Both sides must change, under time pressure</text>
  <text class="contract-first-desc contract-first-row contract-first-r3" x="46" y="284">Nobody can test against the other</text>
  <text class="contract-first-desc contract-first-row contract-first-r4" x="46" y="318">This is the classic capstone failure</text>
  <rect class="contract-first-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="contract-first-name" x="526" y="122">Contract first</text>
  <text class="contract-first-desc" x="526" y="142">The shape is agreed, then built.</text>
  <text class="contract-first-desc contract-first-row contract-first-r0" x="526" y="182">A schema, written down, before code</text>
  <text class="contract-first-desc contract-first-row contract-first-r1" x="526" y="216">Each side can build against it immediately</text>
  <text class="contract-first-desc contract-first-row contract-first-r2" x="526" y="250">Either side can be faked for testing</text>
  <text class="contract-first-desc contract-first-row contract-first-r3" x="526" y="284">A violation is caught by validation</text>
  <text class="contract-first-desc contract-first-row contract-first-r4" x="526" y="318">Day 24's argument, at the component level</text>
  <text class="contract-first-sub" x="30" y="372">This is why the design document is worth the hour it takes: the contract is the part that cannot be discovered late without both sides paying for it.</text>
</svg>
