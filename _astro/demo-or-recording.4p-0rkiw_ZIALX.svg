<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is impressive; one cannot be abused.">
  <title>A live demo, or a recording</title>
  <style>
    .demo-or-recording-bg   { fill: #f8fafc; }
    .demo-or-recording-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-or-recording-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-or-recording-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-or-recording-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-or-recording-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-or-recording-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .demo-or-recording-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .demo-or-recording-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .demo-or-recording-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .demo-or-recording-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .demo-or-recording-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .demo-or-recording-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .demo-or-recording-row { opacity: 1; }
    .demo-or-recording-r0 { animation-delay: 0.00s; }
    .demo-or-recording-r1 { animation-delay: 0.45s; }
    .demo-or-recording-r2 { animation-delay: 0.90s; }
    .demo-or-recording-r3 { animation-delay: 1.35s; }
    .demo-or-recording-r4 { animation-delay: 1.80s; }
    .demo-or-recording-row { animation: demo-or-recording-reveal 7.3s ease-in-out infinite; }
    @keyframes demo-or-recording-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="demo-or-recording-bg" width="980" height="390"/>
  <text class="demo-or-recording-h1"  x="30" y="40">A live demo, or a recording</text>
  <text class="demo-or-recording-sub" x="30" y="64">One is impressive; one cannot be abused.</text>
  <rect class="demo-or-recording-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="demo-or-recording-name" x="46" y="122">Live demo</text>
  <text class="demo-or-recording-desc" x="46" y="142">The most impressive option.</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r0" x="46" y="182">A reader can try it themselves</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r1" x="46" y="216">A public endpoint that can be scraped</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r2" x="46" y="250">Needs a hard spend cap if it calls an API</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r3" x="46" y="284">Breaks silently, months later</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r4" x="46" y="318">Host one only if you will operate it</text>
  <rect class="demo-or-recording-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="demo-or-recording-name" x="526" y="122">Recording</text>
  <text class="demo-or-recording-desc" x="526" y="142">Costs nothing, never breaks.</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r0" x="526" y="182">asciinema records text, not video</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r1" x="526" y="216">Small, copy-pasteable, diffable</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r2" x="526" y="250">You can read exactly what was captured</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r3" x="526" y="284">No endpoint, no abuse, no bill</text>
  <text class="demo-or-recording-desc demo-or-recording-row demo-or-recording-r4" x="526" y="318">Enough for almost every reader</text>
  <text class="demo-or-recording-sub" x="30" y="372">The ability to read what was captured before publishing is the underrated advantage: a screen recording can contain a token you did not notice, and text can be searched for one.</text>
</svg>
