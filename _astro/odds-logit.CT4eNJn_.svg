<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three transformations.">
  <title>From probability to a straight line</title>
  <style>
    .odds-logit-bg   { fill: #f8fafc; }
    .odds-logit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .odds-logit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .odds-logit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .odds-logit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .odds-logit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .odds-logit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .odds-logit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .odds-logit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .odds-logit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .odds-logit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .odds-logit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .odds-logit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .odds-logit-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .odds-logit-stage { opacity: 1; }

    .odds-logit-s0 { animation-delay: 0.00s; }
    .odds-logit-e0 { animation-delay: 0.00s; }
    .odds-logit-s1 { animation-delay: 1.50s; }
    .odds-logit-e1 { animation-delay: 1.50s; }
    .odds-logit-s2 { animation-delay: 3.00s; }
    .odds-logit-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .odds-logit-conn  { animation: odds-logit-trace 6s ease-in-out infinite; }
      .odds-logit-stage { animation: odds-logit-arrive 6s ease-in-out infinite; }
    }
    @keyframes odds-logit-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes odds-logit-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .odds-logit-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .odds-logit-stage { animation: odds-logit-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes odds-logit-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="odds-logit-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="odds-logit-bg" width="980" height="322"/>
  <text class="odds-logit-h1"  x="30" y="40">From probability to a straight line</text>
  <text class="odds-logit-sub" x="30" y="64">Three transformations.</text>
  <g class="odds-logit-stage odds-logit-s0">
    <rect class="odds-logit-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="odds-logit-step" x="44" y="142">01</text>
    <text class="odds-logit-name" x="70" y="142">Probability runs from zero to one</text>
    <text class="odds-logit-desc" x="44" y="166">Which a linear model cannot respect.</text>
  </g>
  <line class="odds-logit-line odds-logit-conn odds-logit-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#odds-logit-tip)"/>
  <g class="odds-logit-stage odds-logit-s1">
    <rect class="odds-logit-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="odds-logit-step" x="359" y="142">02</text>
    <text class="odds-logit-name" x="385" y="142">Odds run from zero to infinity</text>
    <text class="odds-logit-desc" x="359" y="166">Probability divided by its complement.</text>
  </g>
  <line class="odds-logit-line odds-logit-conn odds-logit-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#odds-logit-tip)"/>
  <g class="odds-logit-stage odds-logit-s2">
    <rect class="odds-logit-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="odds-logit-step" x="674" y="142">03</text>
    <text class="odds-logit-name" x="700" y="142">Log odds run from minus to plus infinity</text>
    <text class="odds-logit-desc" x="674" y="166">Which is exactly what a linear model</text>
    <text class="odds-logit-desc" x="674" y="182">produces.</text>
  </g>
  <text class="odds-logit-sub" x="30" y="304">The link function exists to reconcile a bounded target with an unbounded predictor, which is the general pattern behind every generalised linear model.</text>
</svg>
