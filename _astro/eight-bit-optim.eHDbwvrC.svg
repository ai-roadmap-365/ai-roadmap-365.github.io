<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The largest remaining saving.">
  <title>Eight-bit optimiser state</title>
  <style>
    .eight-bit-optim-bg   { fill: #f8fafc; }
    .eight-bit-optim-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eight-bit-optim-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eight-bit-optim-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eight-bit-optim-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eight-bit-optim-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eight-bit-optim-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eight-bit-optim-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eight-bit-optim-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eight-bit-optim-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eight-bit-optim-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eight-bit-optim-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eight-bit-optim-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eight-bit-optim-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eight-bit-optim-stage { opacity: 1; }

    .eight-bit-optim-s0 { animation-delay: 0.00s; }
    .eight-bit-optim-e0 { animation-delay: 0.00s; }
    .eight-bit-optim-s1 { animation-delay: 1.28s; }
    .eight-bit-optim-e1 { animation-delay: 1.28s; }
    .eight-bit-optim-s2 { animation-delay: 2.56s; }
    .eight-bit-optim-e2 { animation-delay: 2.56s; }
    .eight-bit-optim-s3 { animation-delay: 3.84s; }
    .eight-bit-optim-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eight-bit-optim-conn  { animation: eight-bit-optim-trace 6.4s ease-in-out infinite; }
      .eight-bit-optim-stage { animation: eight-bit-optim-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eight-bit-optim-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eight-bit-optim-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eight-bit-optim-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eight-bit-optim-stage { animation: eight-bit-optim-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eight-bit-optim-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eight-bit-optim-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eight-bit-optim-bg" width="980" height="322"/>
  <text class="eight-bit-optim-h1"  x="30" y="40">Eight-bit optimiser state</text>
  <text class="eight-bit-optim-sub" x="30" y="64">The largest remaining saving.</text>
  <g class="eight-bit-optim-stage eight-bit-optim-s0">
    <rect class="eight-bit-optim-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eight-bit-optim-step" x="44" y="142">01</text>
    <text class="eight-bit-optim-name" x="70" y="142">The optimiser keeps two tensors per parameter</text>
    <text class="eight-bit-optim-desc" x="44" y="166">In full precision, by default.</text>
  </g>
  <line class="eight-bit-optim-line eight-bit-optim-conn eight-bit-optim-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eight-bit-optim-tip)"/>
  <g class="eight-bit-optim-stage eight-bit-optim-s1">
    <rect class="eight-bit-optim-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eight-bit-optim-step" x="280" y="142">02</text>
    <text class="eight-bit-optim-name" x="306" y="142">Which is eight bytes per parameter</text>
    <text class="eight-bit-optim-desc" x="280" y="166">Often larger than the model</text>
    <text class="eight-bit-optim-desc" x="280" y="182">itself.</text>
  </g>
  <line class="eight-bit-optim-line eight-bit-optim-conn eight-bit-optim-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eight-bit-optim-tip)"/>
  <g class="eight-bit-optim-stage eight-bit-optim-s2">
    <rect class="eight-bit-optim-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eight-bit-optim-step" x="516" y="142">03</text>
    <text class="eight-bit-optim-name" x="542" y="142">Quantise them in small blocks</text>
    <text class="eight-bit-optim-desc" x="516" y="166">Each with its own scale, which</text>
    <text class="eight-bit-optim-desc" x="516" y="182">limits the error.</text>
  </g>
  <line class="eight-bit-optim-line eight-bit-optim-conn eight-bit-optim-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eight-bit-optim-tip)"/>
  <g class="eight-bit-optim-stage eight-bit-optim-s3">
    <rect class="eight-bit-optim-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eight-bit-optim-step" x="752" y="142">04</text>
    <text class="eight-bit-optim-name" x="778" y="142">Two bytes instead of eight</text>
    <text class="eight-bit-optim-desc" x="752" y="166">With no measurable effect on the</text>
    <text class="eight-bit-optim-desc" x="752" y="182">final model.</text>
  </g>
  <text class="eight-bit-optim-sub" x="30" y="304">Block-wise scaling is what makes this work where naive quantisation fails: a single scale across a whole tensor is destroyed by a few outliers, and a per-block scale is not.</text>
</svg>
