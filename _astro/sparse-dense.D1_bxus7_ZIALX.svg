<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Words against meaning.">
  <title>Sparse against dense</title>
  <style>
    .sparse-dense-bg   { fill: #f8fafc; }
    .sparse-dense-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sparse-dense-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sparse-dense-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sparse-dense-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sparse-dense-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sparse-dense-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sparse-dense-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sparse-dense-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sparse-dense-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sparse-dense-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sparse-dense-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sparse-dense-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sparse-dense-row { opacity: 1; }
    .sparse-dense-r0 { animation-delay: 0.00s; }
    .sparse-dense-r1 { animation-delay: 0.45s; }
    .sparse-dense-r2 { animation-delay: 0.90s; }
    .sparse-dense-r3 { animation-delay: 1.35s; }
    .sparse-dense-r4 { animation-delay: 1.80s; }
    .sparse-dense-row { animation: sparse-dense-reveal 7.3s ease-in-out infinite; }
    @keyframes sparse-dense-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sparse-dense-bg" width="980" height="390"/>
  <text class="sparse-dense-h1"  x="30" y="40">Sparse against dense</text>
  <text class="sparse-dense-sub" x="30" y="64">Words against meaning.</text>
  <rect class="sparse-dense-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sparse-dense-name" x="46" y="122">Sparse</text>
  <text class="sparse-dense-desc" x="46" y="142">One dimension per word.</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r0" x="46" y="182">Tens of thousands of dimensions, mostly zero</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r1" x="46" y="216">Matches exact terms</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r2" x="46" y="250">Interpretable, and inspectable</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r3" x="46" y="284">Misses synonyms entirely</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r4" x="46" y="318">Excellent for names and codes</text>
  <rect class="sparse-dense-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sparse-dense-name" x="526" y="122">Dense</text>
  <text class="sparse-dense-desc" x="526" y="142">Learned dimensions.</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r0" x="526" y="182">Hundreds of dimensions, all used</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r1" x="526" y="216">Matches meaning</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r2" x="526" y="250">Uninterpretable individually</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r3" x="526" y="284">Handles synonyms and paraphrase</text>
  <text class="sparse-dense-desc sparse-dense-row sparse-dense-r4" x="526" y="318">Weak on exact identifiers</text>
  <text class="sparse-dense-sub" x="30" y="372">The complementary weaknesses are why production retrieval usually runs both: dense misses a part number that sparse finds instantly, and the reverse is equally true.</text>
</svg>
