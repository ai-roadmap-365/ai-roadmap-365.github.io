<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things schema design is not</title>
  <style>
    .schema-not-bg   { fill: #f8fafc; }
    .schema-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schema-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schema-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schema-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schema-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schema-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schema-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schema-not-row { opacity: 1; }
    .schema-not-r0 { animation-delay: 0.00s; }
    .schema-not-r1 { animation-delay: 0.45s; }
    .schema-not-r2 { animation-delay: 0.90s; }
    .schema-not-r3 { animation-delay: 1.35s; }
    .schema-not-r4 { animation-delay: 1.80s; }
    .schema-not-row { animation: schema-not-reveal 7.3s ease-in-out infinite; }
    @keyframes schema-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="schema-not-bg" width="980" height="390"/>
  <text class="schema-not-h1"  x="30" y="40">Four things schema design is not</text>
  <text class="schema-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="schema-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="schema-not-name" x="46" y="122">The misconception</text>
  <text class="schema-not-desc" x="46" y="142">Commonly held.</text>
  <text class="schema-not-desc schema-not-row schema-not-r0" x="46" y="182">The schema can be changed freely later</text>
  <text class="schema-not-desc schema-not-row schema-not-r1" x="46" y="216">Constraints slow writes too much</text>
  <text class="schema-not-desc schema-not-row schema-not-r2" x="46" y="250">One wide table is simpler</text>
  <text class="schema-not-desc schema-not-row schema-not-r3" x="46" y="284">Application checks replace constraints</text>
  <text class="schema-not-desc schema-not-row schema-not-r4" x="46" y="318">Every table needs a surrogate key</text>
  <rect class="schema-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="schema-not-name" x="526" y="122">What is true</text>
  <text class="schema-not-desc" x="526" y="142">Actually.</text>
  <text class="schema-not-desc schema-not-row schema-not-r0" x="526" y="182">Migrating data is the expensive part</text>
  <text class="schema-not-desc schema-not-row schema-not-r1" x="526" y="216">The cost is small; bad data is not</text>
  <text class="schema-not-desc schema-not-row schema-not-r2" x="526" y="250">It duplicates facts and drifts</text>
  <text class="schema-not-desc schema-not-row schema-not-r3" x="526" y="284">Other writers bypass the application</text>
  <text class="schema-not-desc schema-not-row schema-not-r4" x="526" y="318">Use one when no natural key is stable</text>
  <text class="schema-not-sub" x="30" y="372">Migration being the expensive part is why schema design deserves an hour up front: changing a column is easy, and moving a billion rows is not.</text>
</svg>
