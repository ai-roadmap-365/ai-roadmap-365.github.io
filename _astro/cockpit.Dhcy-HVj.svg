<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Controls, gauges, and a checklist.">
  <title>A cockpit</title>
  <style>
    .cockpit-bg   { fill: #f8fafc; }
    .cockpit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cockpit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cockpit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cockpit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cockpit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cockpit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cockpit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cockpit-row { opacity: 1; }
    .cockpit-r0 { animation-delay: 0.00s; }
    .cockpit-r1 { animation-delay: 0.45s; }
    .cockpit-r2 { animation-delay: 0.90s; }
    .cockpit-r3 { animation-delay: 1.35s; }
    .cockpit-r4 { animation-delay: 1.80s; }
    .cockpit-row { animation: cockpit-reveal 7.3s ease-in-out infinite; }
    @keyframes cockpit-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cockpit-bg" width="980" height="390"/>
  <text class="cockpit-h1"  x="30" y="40">A cockpit</text>
  <text class="cockpit-sub" x="30" y="64">Controls, gauges, and a checklist.</text>
  <rect class="cockpit-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cockpit-name" x="46" y="122">The cockpit</text>
  <text class="cockpit-desc" x="46" y="142">Three kinds of thing.</text>
  <text class="cockpit-desc cockpit-row cockpit-r0" x="46" y="182">Throttles and gear levers, operated</text>
  <text class="cockpit-desc cockpit-row cockpit-r1" x="46" y="216">Altimeter and fuel gauges, read</text>
  <text class="cockpit-desc cockpit-row cockpit-r2" x="46" y="250">A laminated pre-flight checklist</text>
  <text class="cockpit-desc cockpit-row cockpit-r3" x="46" y="284">Nobody confuses the three</text>
  <text class="cockpit-desc cockpit-row cockpit-r4" x="46" y="318">Each has its own place in the layout</text>
  <rect class="cockpit-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cockpit-name" x="526" y="122">The server</text>
  <text class="cockpit-desc" x="526" y="142">The same three.</text>
  <text class="cockpit-desc cockpit-row cockpit-r0" x="526" y="182">Tools, invoked by the model</text>
  <text class="cockpit-desc cockpit-row cockpit-r1" x="526" y="216">Resources, read and subscribed to</text>
  <text class="cockpit-desc cockpit-row cockpit-r2" x="526" y="250">Prompts, chosen by the person</text>
  <text class="cockpit-desc cockpit-row cockpit-r3" x="526" y="284">Each surfaced differently by the client</text>
  <text class="cockpit-desc cockpit-row cockpit-r4" x="526" y="318">Which is why the split exists</text>
  <text class="cockpit-sub" x="30" y="372">The checklist is the prompt and it is deliberately not automated: a pilot runs it because a standard sequence executed by a person catches things an instrument does not report.</text>
</svg>
