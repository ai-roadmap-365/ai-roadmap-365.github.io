<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Invariants</title>
  <style>
    .invariants-bg   { fill: #f8fafc; }
    .invariants-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .invariants-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .invariants-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .invariants-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .invariants-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .invariants-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .invariants-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .invariants-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .invariants-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .invariants-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .invariants-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .invariants-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .invariants-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .invariants-stage { opacity: 1; }

    .invariants-s0 { animation-delay: 0.00s; }
    .invariants-e0 { animation-delay: 0.00s; }
    .invariants-s1 { animation-delay: 1.28s; }
    .invariants-e1 { animation-delay: 1.28s; }
    .invariants-s2 { animation-delay: 2.56s; }
    .invariants-e2 { animation-delay: 2.56s; }
    .invariants-s3 { animation-delay: 3.84s; }
    .invariants-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .invariants-conn  { animation: invariants-trace 6.4s ease-in-out infinite; }
      .invariants-stage { animation: invariants-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes invariants-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes invariants-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .invariants-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .invariants-stage { animation: invariants-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes invariants-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="invariants-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="invariants-bg" width="980" height="322"/>
  <text class="invariants-h1"  x="30" y="40">Invariants</text>
  <text class="invariants-sub" x="30" y="64">Four steps.</text>
  <g class="invariants-stage invariants-s0">
    <rect class="invariants-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="invariants-step" x="44" y="142">01</text>
    <text class="invariants-name" x="70" y="142">State the rule that must never be violated</text>
    <text class="invariants-desc" x="44" y="166">An order has at least one line;</text>
    <text class="invariants-desc" x="44" y="182">a balance is never negative.</text>
  </g>
  <line class="invariants-line invariants-conn invariants-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#invariants-tip)"/>
  <g class="invariants-stage invariants-s1">
    <rect class="invariants-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="invariants-step" x="280" y="142">02</text>
    <text class="invariants-name" x="306" y="142">Decide what scope it spans</text>
    <text class="invariants-desc" x="280" y="166">One object, or several together.</text>
  </g>
  <line class="invariants-line invariants-conn invariants-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#invariants-tip)"/>
  <g class="invariants-stage invariants-s2">
    <rect class="invariants-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="invariants-step" x="516" y="142">03</text>
    <text class="invariants-name" x="542" y="142">Enforce it where the scope is complete</text>
    <text class="invariants-desc" x="516" y="166">In the constructor, or in the</text>
    <text class="invariants-desc" x="516" y="182">object that owns the group.</text>
  </g>
  <line class="invariants-line invariants-conn invariants-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#invariants-tip)"/>
  <g class="invariants-stage invariants-s3">
    <rect class="invariants-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="invariants-step" x="752" y="142">04</text>
    <text class="invariants-name" x="778" y="142">So an invalid state cannot be constructed at all</text>
    <text class="invariants-desc" x="752" y="166">Rather than being detected</text>
    <text class="invariants-desc" x="752" y="182">later.</text>
  </g>
  <text class="invariants-sub" x="30" y="304">Making invalid states unconstructible is the strongest version of this: a rule checked at every use will eventually be missed at one of them.</text>
</svg>
