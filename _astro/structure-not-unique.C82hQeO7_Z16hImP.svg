<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Structure is not unique</title>
  <style>
    .structure-not-unique-bg   { fill: #f8fafc; }
    .structure-not-unique-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-not-unique-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-not-unique-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-not-unique-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-not-unique-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-not-unique-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structure-not-unique-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .structure-not-unique-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .structure-not-unique-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .structure-not-unique-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .structure-not-unique-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .structure-not-unique-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .structure-not-unique-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .structure-not-unique-stage { opacity: 1; }

    .structure-not-unique-s0 { animation-delay: 0.00s; }
    .structure-not-unique-e0 { animation-delay: 0.00s; }
    .structure-not-unique-s1 { animation-delay: 1.28s; }
    .structure-not-unique-e1 { animation-delay: 1.28s; }
    .structure-not-unique-s2 { animation-delay: 2.56s; }
    .structure-not-unique-e2 { animation-delay: 2.56s; }
    .structure-not-unique-s3 { animation-delay: 3.84s; }
    .structure-not-unique-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .structure-not-unique-conn  { animation: structure-not-unique-trace 6.4s ease-in-out infinite; }
      .structure-not-unique-stage { animation: structure-not-unique-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes structure-not-unique-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes structure-not-unique-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .structure-not-unique-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .structure-not-unique-stage { animation: structure-not-unique-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes structure-not-unique-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="structure-not-unique-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="structure-not-unique-bg" width="980" height="322"/>
  <text class="structure-not-unique-h1"  x="30" y="40">Structure is not unique</text>
  <text class="structure-not-unique-sub" x="30" y="64">Four steps.</text>
  <g class="structure-not-unique-stage structure-not-unique-s0">
    <rect class="structure-not-unique-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="structure-not-unique-step" x="44" y="142">01</text>
    <text class="structure-not-unique-name" x="70" y="142">Data can be grouped several defensible ways</text>
    <text class="structure-not-unique-desc" x="44" y="166">By behaviour, by value, by</text>
    <text class="structure-not-unique-desc" x="44" y="182">geography.</text>
  </g>
  <line class="structure-not-unique-line structure-not-unique-conn structure-not-unique-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#structure-not-unique-tip)"/>
  <g class="structure-not-unique-stage structure-not-unique-s1">
    <rect class="structure-not-unique-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="structure-not-unique-step" x="280" y="142">02</text>
    <text class="structure-not-unique-name" x="306" y="142">The algorithm returns one of them</text>
    <text class="structure-not-unique-desc" x="280" y="166">Determined by its distance and</text>
    <text class="structure-not-unique-desc" x="280" y="182">shape assumptions.</text>
  </g>
  <line class="structure-not-unique-line structure-not-unique-conn structure-not-unique-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#structure-not-unique-tip)"/>
  <g class="structure-not-unique-stage structure-not-unique-s2">
    <rect class="structure-not-unique-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="structure-not-unique-step" x="516" y="142">03</text>
    <text class="structure-not-unique-name" x="542" y="142">Not the one you had in mind, necessarily</text>
    <text class="structure-not-unique-desc" x="516" y="166">Nor the one the business needs.</text>
  </g>
  <line class="structure-not-unique-line structure-not-unique-conn structure-not-unique-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#structure-not-unique-tip)"/>
  <g class="structure-not-unique-stage structure-not-unique-s3">
    <rect class="structure-not-unique-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="structure-not-unique-step" x="752" y="142">04</text>
    <text class="structure-not-unique-name" x="778" y="142">So the choice of method encodes what counts as similar</text>
    <text class="structure-not-unique-desc" x="752" y="166">Which is a modelling decision,</text>
    <text class="structure-not-unique-desc" x="752" y="182">made implicitly.</text>
  </g>
  <text class="structure-not-unique-sub" x="30" y="304">The method choosing what similar means is the point that makes unsupervised results contestable in a way supervised ones are not.</text>
</svg>
