<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The intermediate tensor nobody needs.">
  <title>Why a fused kernel matters</title>
  <style>
    .embeddingbag-bg   { fill: #f8fafc; }
    .embeddingbag-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddingbag-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddingbag-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddingbag-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddingbag-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embeddingbag-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embeddingbag-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .embeddingbag-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .embeddingbag-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .embeddingbag-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .embeddingbag-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .embeddingbag-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .embeddingbag-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .embeddingbag-stage { opacity: 1; }

    .embeddingbag-s0 { animation-delay: 0.00s; }
    .embeddingbag-e0 { animation-delay: 0.00s; }
    .embeddingbag-s1 { animation-delay: 1.28s; }
    .embeddingbag-e1 { animation-delay: 1.28s; }
    .embeddingbag-s2 { animation-delay: 2.56s; }
    .embeddingbag-e2 { animation-delay: 2.56s; }
    .embeddingbag-s3 { animation-delay: 3.84s; }
    .embeddingbag-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .embeddingbag-conn  { animation: embeddingbag-trace 6.4s ease-in-out infinite; }
      .embeddingbag-stage { animation: embeddingbag-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes embeddingbag-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes embeddingbag-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .embeddingbag-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .embeddingbag-stage { animation: embeddingbag-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes embeddingbag-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="embeddingbag-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="embeddingbag-bg" width="980" height="322"/>
  <text class="embeddingbag-h1"  x="30" y="40">Why a fused kernel matters</text>
  <text class="embeddingbag-sub" x="30" y="64">The intermediate tensor nobody needs.</text>
  <g class="embeddingbag-stage embeddingbag-s0">
    <rect class="embeddingbag-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="embeddingbag-step" x="44" y="142">01</text>
    <text class="embeddingbag-name" x="70" y="142">The naive path: look up, then average</text>
    <text class="embeddingbag-desc" x="44" y="166">Producing a</text>
    <text class="embeddingbag-desc" x="44" y="182">batch-by-length-by-dimension</text>
    <text class="embeddingbag-desc" x="44" y="198">tensor first.</text>
  </g>
  <line class="embeddingbag-line embeddingbag-conn embeddingbag-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#embeddingbag-tip)"/>
  <g class="embeddingbag-stage embeddingbag-s1">
    <rect class="embeddingbag-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="embeddingbag-step" x="280" y="142">02</text>
    <text class="embeddingbag-name" x="306" y="142">Which is large, and immediately reduced</text>
    <text class="embeddingbag-desc" x="280" y="166">Allocated, written, read once,</text>
    <text class="embeddingbag-desc" x="280" y="182">discarded.</text>
  </g>
  <line class="embeddingbag-line embeddingbag-conn embeddingbag-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#embeddingbag-tip)"/>
  <g class="embeddingbag-stage embeddingbag-s2">
    <rect class="embeddingbag-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="embeddingbag-step" x="516" y="142">03</text>
    <text class="embeddingbag-name" x="542" y="142">A fused kernel sums rows as it loads them</text>
    <text class="embeddingbag-desc" x="516" y="166">The intermediate is never</text>
    <text class="embeddingbag-desc" x="516" y="182">materialised.</text>
  </g>
  <line class="embeddingbag-line embeddingbag-conn embeddingbag-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#embeddingbag-tip)"/>
  <g class="embeddingbag-stage embeddingbag-s3">
    <rect class="embeddingbag-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="embeddingbag-step" x="752" y="142">04</text>
    <text class="embeddingbag-name" x="778" y="142">Substantially less memory bandwidth</text>
    <text class="embeddingbag-desc" x="752" y="166">And several times the</text>
    <text class="embeddingbag-desc" x="752" y="182">throughput.</text>
  </g>
  <text class="embeddingbag-sub" x="30" y="304">This is a general pattern worth recognising in performance work: an intermediate result that is produced and immediately consumed is a candidate for fusion, and memory bandwidth is usually the bottleneck rather than arithmetic.</text>
</svg>
