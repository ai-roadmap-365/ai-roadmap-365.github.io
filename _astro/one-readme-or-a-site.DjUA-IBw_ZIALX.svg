<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Proportion is the whole decision.">
  <title>One README, or a documentation site</title>
  <style>
    .one-readme-or-a-site-bg   { fill: #f8fafc; }
    .one-readme-or-a-site-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-readme-or-a-site-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-readme-or-a-site-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-readme-or-a-site-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-readme-or-a-site-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-readme-or-a-site-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-readme-or-a-site-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-readme-or-a-site-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-readme-or-a-site-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-readme-or-a-site-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-readme-or-a-site-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-readme-or-a-site-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-readme-or-a-site-row { opacity: 1; }
    .one-readme-or-a-site-r0 { animation-delay: 0.00s; }
    .one-readme-or-a-site-r1 { animation-delay: 0.45s; }
    .one-readme-or-a-site-r2 { animation-delay: 0.90s; }
    .one-readme-or-a-site-r3 { animation-delay: 1.35s; }
    .one-readme-or-a-site-r4 { animation-delay: 1.80s; }
    .one-readme-or-a-site-row { animation: one-readme-or-a-site-reveal 7.3s ease-in-out infinite; }
    @keyframes one-readme-or-a-site-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="one-readme-or-a-site-bg" width="980" height="390"/>
  <text class="one-readme-or-a-site-h1"  x="30" y="40">One README, or a documentation site</text>
  <text class="one-readme-or-a-site-sub" x="30" y="64">Proportion is the whole decision.</text>
  <rect class="one-readme-or-a-site-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="one-readme-or-a-site-name" x="46" y="122">One README</text>
  <text class="one-readme-or-a-site-desc" x="46" y="142">Right for a capstone.</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r0" x="46" y="182">Versioned with the code</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r1" x="46" y="216">Nothing to operate or deploy</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r2" x="46" y="250">A checker in the test suite</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r3" x="46" y="284">An asciinema recording if there is something to show</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r4" x="46" y="318">Short enough that people read it</text>
  <rect class="one-readme-or-a-site-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="one-readme-or-a-site-name" x="526" y="122">A generated site</text>
  <text class="one-readme-or-a-site-desc" x="526" y="142">Right once it outgrows one file.</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r0" x="526" y="182">MkDocs, Sphinx or Docusaurus</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r1" x="526" y="216">Searchable, with navigation</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r2" x="526" y="250">API docs generated from docstrings</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r3" x="526" y="284">Vale to enforce style and terminology</text>
  <text class="one-readme-or-a-site-desc one-readme-or-a-site-row one-readme-or-a-site-r4" x="526" y="318">A build and a deploy to maintain</text>
  <text class="one-readme-or-a-site-sub" x="30" y="372">asciinema is the underrated choice on the left: it records a terminal session as text, so the demo is small, copy-pasteable and diffable in a way a screen recording never is.</text>
</svg>
