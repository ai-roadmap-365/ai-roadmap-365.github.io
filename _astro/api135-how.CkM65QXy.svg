<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four practices.">
  <title>Fetching reliably</title>
  <style>
    .api135-how-bg   { fill: #f8fafc; }
    .api135-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api135-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api135-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api135-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api135-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api135-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api135-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .api135-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .api135-how-stage { opacity: 1; }

    .api135-how-s0 { animation-delay: 0.00s; }
    .api135-how-e0 { animation-delay: 0.00s; }
    .api135-how-s1 { animation-delay: 1.28s; }
    .api135-how-e1 { animation-delay: 1.28s; }
    .api135-how-s2 { animation-delay: 2.56s; }
    .api135-how-e2 { animation-delay: 2.56s; }
    .api135-how-s3 { animation-delay: 3.84s; }
    .api135-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .api135-how-conn  { animation: api135-how-trace 6.4s ease-in-out infinite; }
      .api135-how-stage { animation: api135-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes api135-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes api135-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .api135-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .api135-how-stage { animation: api135-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes api135-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="api135-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="api135-how-bg" width="980" height="322"/>
  <text class="api135-how-h1"  x="30" y="40">Fetching reliably</text>
  <text class="api135-how-sub" x="30" y="64">Four practices.</text>
  <g class="api135-how-stage api135-how-s0">
    <rect class="api135-how-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="api135-how-step" x="44" y="142">01</text>
    <text class="api135-how-name" x="70" y="142">Cache every response to disk</text>
    <text class="api135-how-desc" x="44" y="166">So development does not refetch.</text>
  </g>
  <line class="api135-how-line api135-how-conn api135-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#api135-how-tip)"/>
  <g class="api135-how-stage api135-how-s1">
    <rect class="api135-how-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="api135-how-step" x="280" y="142">02</text>
    <text class="api135-how-name" x="306" y="142">Respect the rate limit deliberately</text>
    <text class="api135-how-desc" x="280" y="166">And handle the wait signal.</text>
  </g>
  <line class="api135-how-line api135-how-conn api135-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#api135-how-tip)"/>
  <g class="api135-how-stage api135-how-s2">
    <rect class="api135-how-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="api135-how-step" x="516" y="142">03</text>
    <text class="api135-how-name" x="542" y="142">Retry transient failures with increasing delays</text>
    <text class="api135-how-desc" x="516" y="166">But never retry a rejection.</text>
  </g>
  <line class="api135-how-line api135-how-conn api135-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#api135-how-tip)"/>
  <g class="api135-how-stage api135-how-s3">
    <rect class="api135-how-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="api135-how-step" x="752" y="142">04</text>
    <text class="api135-how-name" x="778" y="142">And record when each page was fetched</text>
    <text class="api135-how-desc" x="752" y="166">Which becomes the dataset's</text>
    <text class="api135-how-desc" x="752" y="182">provenance.</text>
  </g>
  <text class="api135-how-sub" x="30" y="304">Caching to disk during development is the single highest-value habit here, since exploratory work involves dozens of reruns of the same query.</text>
</svg>
