<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two of these are permanent.">
  <title>What publishing costs</title>
  <style>
    .portfolio-implications-bg   { fill: #f8fafc; }
    .portfolio-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .portfolio-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .portfolio-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .portfolio-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .portfolio-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .portfolio-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .portfolio-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .portfolio-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .portfolio-implications-stage { opacity: 1; }

    .portfolio-implications-s0 { animation-delay: 0.00s; }
    .portfolio-implications-e0 { animation-delay: 0.00s; }
    .portfolio-implications-s1 { animation-delay: 1.33s; }
    .portfolio-implications-e1 { animation-delay: 1.33s; }
    .portfolio-implications-s2 { animation-delay: 2.67s; }
    .portfolio-implications-e2 { animation-delay: 2.67s; }
    .portfolio-implications-s3 { animation-delay: 4.00s; }
    .portfolio-implications-e3 { animation-delay: 4.00s; }
    .portfolio-implications-s4 { animation-delay: 5.33s; }
    .portfolio-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .portfolio-implications-conn  { animation: portfolio-implications-trace 8s ease-in-out infinite; }
      .portfolio-implications-stage { animation: portfolio-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes portfolio-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes portfolio-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .portfolio-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .portfolio-implications-stage { animation: portfolio-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes portfolio-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="portfolio-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="portfolio-implications-bg" width="980" height="322"/>
  <text class="portfolio-implications-h1"  x="30" y="40">What publishing costs</text>
  <text class="portfolio-implications-sub" x="30" y="64">Two of these are permanent.</text>
  <g class="portfolio-implications-stage portfolio-implications-s0">
    <rect class="portfolio-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="portfolio-implications-step" x="44" y="142">01</text>
    <text class="portfolio-implications-name" x="70" y="142">Publishing is permanent</text>
    <text class="portfolio-implications-desc" x="44" y="166">A token in a screenshot,</text>
    <text class="portfolio-implications-desc" x="44" y="182">credentials in history.</text>
    <text class="portfolio-implications-desc" x="44" y="198">Scan before, not after.</text>
    <text class="portfolio-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="portfolio-implications-line portfolio-implications-conn portfolio-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#portfolio-implications-tip)"/>
  <g class="portfolio-implications-stage portfolio-implications-s1">
    <rect class="portfolio-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="portfolio-implications-step" x="233" y="142">02</text>
    <text class="portfolio-implications-name" x="259" y="142">A demo publishes its data</text>
    <text class="portfolio-implications-desc" x="233" y="166">Use a fixture corpus you</text>
    <text class="portfolio-implications-desc" x="233" y="182">own, including in</text>
    <text class="portfolio-implications-desc" x="233" y="198">recordings.</text>
    <text class="portfolio-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="portfolio-implications-line portfolio-implications-conn portfolio-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#portfolio-implications-tip)"/>
  <g class="portfolio-implications-stage portfolio-implications-s2">
    <rect class="portfolio-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="portfolio-implications-step" x="422" y="142">03</text>
    <text class="portfolio-implications-name" x="448" y="142">Employer work may not be yours</text>
    <text class="portfolio-implications-desc" x="422" y="166">The constraint is</text>
    <text class="portfolio-implications-desc" x="422" y="182">contractual. Describe it</text>
    <text class="portfolio-implications-desc" x="422" y="198">without publishing the</text>
    <text class="portfolio-implications-edge" x="422" y="242">obligations</text>
  </g>
  <line class="portfolio-implications-line portfolio-implications-conn portfolio-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#portfolio-implications-tip)"/>
  <g class="portfolio-implications-stage portfolio-implications-s3">
    <rect class="portfolio-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="portfolio-implications-step" x="611" y="142">04</text>
    <text class="portfolio-implications-name" x="637" y="142">Attention is the scarce resource</text>
    <text class="portfolio-implications-desc" x="611" y="166">A measurement in the</text>
    <text class="portfolio-implications-desc" x="611" y="182">first line; assume page</text>
    <text class="portfolio-implications-desc" x="611" y="198">two is unread.</text>
    <text class="portfolio-implications-edge" x="611" y="242">ordering</text>
  </g>
  <line class="portfolio-implications-line portfolio-implications-conn portfolio-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#portfolio-implications-tip)"/>
  <g class="portfolio-implications-stage portfolio-implications-s4">
    <rect class="portfolio-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="portfolio-implications-step" x="800" y="142">05</text>
    <text class="portfolio-implications-name" x="826" y="142">A live demo has a running bill</text>
    <text class="portfolio-implications-desc" x="800" y="166">Cap it, or ship a</text>
    <text class="portfolio-implications-desc" x="800" y="182">recording that costs</text>
    <text class="portfolio-implications-desc" x="800" y="198">nothing and cannot be</text>
    <text class="portfolio-implications-edge" x="800" y="242">money</text>
  </g>
  <text class="portfolio-implications-sub" x="30" y="304">The third catches people out most often, because the instinct is to check whether publishing is technically possible rather than whether it is permitted — and the answer usually lives in a contract nobody reread.</text>
</svg>
