<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to split into modules</title>
  <style>
    .module-when-bg   { fill: #f8fafc; }
    .module-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .module-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .module-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .module-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .module-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .module-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .module-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .module-when-row { opacity: 1; }
    .module-when-r0 { animation-delay: 0.00s; }
    .module-when-r1 { animation-delay: 0.45s; }
    .module-when-r2 { animation-delay: 0.90s; }
    .module-when-r3 { animation-delay: 1.35s; }
    .module-when-r4 { animation-delay: 1.80s; }
    .module-when-row { animation: module-when-reveal 7.3s ease-in-out infinite; }
    @keyframes module-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="module-when-bg" width="980" height="390"/>
  <text class="module-when-h1"  x="30" y="40">When to split into modules</text>
  <text class="module-when-sub" x="30" y="64">And when not to.</text>
  <rect class="module-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="module-when-name" x="46" y="122">Split</text>
  <text class="module-when-desc" x="46" y="142">Four signals.</text>
  <text class="module-when-desc module-when-row module-when-r0" x="46" y="182">The file has several unrelated concerns</text>
  <text class="module-when-desc module-when-row module-when-r1" x="46" y="216">Part of it is reused elsewhere</text>
  <text class="module-when-desc module-when-row module-when-r2" x="46" y="250">Two people keep editing the same file</text>
  <text class="module-when-desc module-when-row module-when-r3" x="46" y="284">Tests only need one part</text>
  <text class="module-when-desc module-when-row module-when-r4" x="46" y="318">A section has its own dependencies</text>
  <rect class="module-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="module-when-name" x="526" y="122">Keep together</text>
  <text class="module-when-desc" x="526" y="142">Also four.</text>
  <text class="module-when-desc module-when-row module-when-r0" x="526" y="182">The pieces are only used together</text>
  <text class="module-when-desc module-when-row module-when-r1" x="526" y="216">A split needs many cross-imports</text>
  <text class="module-when-desc module-when-row module-when-r2" x="526" y="250">Under a few hundred lines</text>
  <text class="module-when-desc module-when-row module-when-r3" x="526" y="284">Where the boundary is not yet clear</text>
  <text class="module-when-desc module-when-row module-when-r4" x="526" y="318">Premature splitting is harder to undo</text>
  <text class="module-when-sub" x="30" y="372">The last row is the practical caution: an unclear boundary drawn early tends to be defended long after it has stopped matching the code.</text>
</svg>
