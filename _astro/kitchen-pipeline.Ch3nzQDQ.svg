<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Prep runs while the pass plates.">
  <title>A restaurant kitchen</title>
  <style>
    .kitchen-pipeline-bg   { fill: #f8fafc; }
    .kitchen-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kitchen-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kitchen-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kitchen-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kitchen-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kitchen-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-pipeline-row { opacity: 1; }
    .kitchen-pipeline-r0 { animation-delay: 0.00s; }
    .kitchen-pipeline-r1 { animation-delay: 0.45s; }
    .kitchen-pipeline-r2 { animation-delay: 0.90s; }
    .kitchen-pipeline-r3 { animation-delay: 1.35s; }
    .kitchen-pipeline-r4 { animation-delay: 1.80s; }
    .kitchen-pipeline-row { animation: kitchen-pipeline-reveal 7.3s ease-in-out infinite; }
    @keyframes kitchen-pipeline-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kitchen-pipeline-bg" width="980" height="390"/>
  <text class="kitchen-pipeline-h1"  x="30" y="40">A restaurant kitchen</text>
  <text class="kitchen-pipeline-sub" x="30" y="64">Prep runs while the pass plates.</text>
  <rect class="kitchen-pipeline-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-pipeline-name" x="46" y="122">Serial</text>
  <text class="kitchen-pipeline-desc" x="46" y="142">The chef waits for prep.</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r0" x="46" y="182">Chop, then cook, then plate</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r1" x="46" y="216">The stove is idle during chopping</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r2" x="46" y="250">Throughput is the sum of every stage</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r3" x="46" y="284">The expensive equipment waits</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r4" x="46" y="318">This is a single-process loader</text>
  <rect class="kitchen-pipeline-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-pipeline-name" x="526" y="122">Parallel</text>
  <text class="kitchen-pipeline-desc" x="526" y="142">Prep runs ahead.</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r0" x="526" y="182">Prep cooks work continuously</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r1" x="526" y="216">Ingredients ready before they are needed</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r2" x="526" y="250">The stove never waits</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r3" x="526" y="284">Throughput is the slowest stage alone</text>
  <text class="kitchen-pipeline-desc kitchen-pipeline-row kitchen-pipeline-r4" x="526" y="318">This is multi-worker prefetching</text>
  <text class="kitchen-pipeline-sub" x="30" y="372">The stove is the accelerator, and the whole purpose of the loader is to make sure it is never the thing waiting — which is why loader tuning often beats model tuning for wall-clock time.</text>
</svg>
