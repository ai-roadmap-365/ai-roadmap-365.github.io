<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Harder than inserting.">
  <title>Deleting from an index</title>
  <style>
    .deletion-bg   { fill: #f8fafc; }
    .deletion-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deletion-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deletion-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deletion-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deletion-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deletion-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deletion-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deletion-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deletion-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deletion-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deletion-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deletion-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deletion-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deletion-stage { opacity: 1; }

    .deletion-s0 { animation-delay: 0.00s; }
    .deletion-e0 { animation-delay: 0.00s; }
    .deletion-s1 { animation-delay: 1.28s; }
    .deletion-e1 { animation-delay: 1.28s; }
    .deletion-s2 { animation-delay: 2.56s; }
    .deletion-e2 { animation-delay: 2.56s; }
    .deletion-s3 { animation-delay: 3.84s; }
    .deletion-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .deletion-conn  { animation: deletion-trace 6.4s ease-in-out infinite; }
      .deletion-stage { animation: deletion-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes deletion-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deletion-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deletion-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deletion-stage { animation: deletion-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deletion-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deletion-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deletion-bg" width="980" height="322"/>
  <text class="deletion-h1"  x="30" y="40">Deleting from an index</text>
  <text class="deletion-sub" x="30" y="64">Harder than inserting.</text>
  <g class="deletion-stage deletion-s0">
    <rect class="deletion-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="deletion-step" x="44" y="142">01</text>
    <text class="deletion-name" x="70" y="142">Removing a node breaks the graph around it</text>
    <text class="deletion-desc" x="44" y="166">Its neighbours were connected</text>
    <text class="deletion-desc" x="44" y="182">through it.</text>
  </g>
  <line class="deletion-line deletion-conn deletion-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#deletion-tip)"/>
  <g class="deletion-stage deletion-s1">
    <rect class="deletion-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="deletion-step" x="280" y="142">02</text>
    <text class="deletion-name" x="306" y="142">So deletions are marked rather than removed</text>
    <text class="deletion-desc" x="280" y="166">And filtered out of results.</text>
  </g>
  <line class="deletion-line deletion-conn deletion-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#deletion-tip)"/>
  <g class="deletion-stage deletion-s2">
    <rect class="deletion-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="deletion-step" x="516" y="142">03</text>
    <text class="deletion-name" x="542" y="142">Which degrades the graph over time</text>
    <text class="deletion-desc" x="516" y="166">More nodes visited, fewer of</text>
    <text class="deletion-desc" x="516" y="182">them usable.</text>
  </g>
  <line class="deletion-line deletion-conn deletion-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#deletion-tip)"/>
  <g class="deletion-stage deletion-s3">
    <rect class="deletion-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="deletion-step" x="752" y="142">04</text>
    <text class="deletion-name" x="778" y="142">Requiring periodic rebuilding</text>
    <text class="deletion-desc" x="752" y="166">Which is an operational task,</text>
    <text class="deletion-desc" x="752" y="182">not an automatic one.</text>
  </g>
  <text class="deletion-sub" x="30" y="304">This is why a frequently changing corpus is a genuine argument against an approximate index: the maintenance cost of churn is real and is usually discovered late.</text>
</svg>
