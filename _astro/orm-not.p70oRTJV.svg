<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things an object mapper is not</title>
  <style>
    .orm-not-bg   { fill: #f8fafc; }
    .orm-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orm-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .orm-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .orm-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .orm-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .orm-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .orm-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orm-not-row { opacity: 1; }
    .orm-not-r0 { animation-delay: 0.00s; }
    .orm-not-r1 { animation-delay: 0.45s; }
    .orm-not-r2 { animation-delay: 0.90s; }
    .orm-not-r3 { animation-delay: 1.35s; }
    .orm-not-r4 { animation-delay: 1.80s; }
    .orm-not-row { animation: orm-not-reveal 7.3s ease-in-out infinite; }
    @keyframes orm-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="orm-not-bg" width="980" height="390"/>
  <text class="orm-not-h1"  x="30" y="40">Four things an object mapper is not</text>
  <text class="orm-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="orm-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="orm-not-name" x="46" y="122">The misconception</text>
  <text class="orm-not-desc" x="46" y="142">Commonly held.</text>
  <text class="orm-not-desc orm-not-row orm-not-r0" x="46" y="182">You no longer need to know the query language</text>
  <text class="orm-not-desc orm-not-row orm-not-r1" x="46" y="216">The mapper generates optimal statements</text>
  <text class="orm-not-desc orm-not-row orm-not-r2" x="46" y="250">Objects and rows correspond cleanly</text>
  <text class="orm-not-desc orm-not-row orm-not-r3" x="46" y="284">Lazy loading is free</text>
  <text class="orm-not-desc orm-not-row orm-not-r4" x="46" y="318">It removes the need for a schema</text>
  <rect class="orm-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="orm-not-name" x="526" y="122">What is true</text>
  <text class="orm-not-desc" x="526" y="142">Actually.</text>
  <text class="orm-not-desc orm-not-row orm-not-r0" x="526" y="182">You need it more, to read what is generated</text>
  <text class="orm-not-desc orm-not-row orm-not-r1" x="526" y="216">It generates correct ones, not fast ones</text>
  <text class="orm-not-desc orm-not-row orm-not-r2" x="526" y="250">Inheritance and collections map awkwardly</text>
  <text class="orm-not-desc orm-not-row orm-not-r3" x="526" y="284">It hides one query per access</text>
  <text class="orm-not-desc orm-not-row orm-not-r4" x="526" y="318">The schema still exists and still matters</text>
  <text class="orm-not-sub" x="30" y="372">Needing the query language more rather than less is the honest summary: the mapper writes the statements, and you still have to be able to read them.</text>
</svg>
