<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The characteristic equation</title>
  <style>
    .characteristic-bg   { fill: #f8fafc; }
    .characteristic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .characteristic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .characteristic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .characteristic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .characteristic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .characteristic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .characteristic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .characteristic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .characteristic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .characteristic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .characteristic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .characteristic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .characteristic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .characteristic-stage { opacity: 1; }

    .characteristic-s0 { animation-delay: 0.00s; }
    .characteristic-e0 { animation-delay: 0.00s; }
    .characteristic-s1 { animation-delay: 1.28s; }
    .characteristic-e1 { animation-delay: 1.28s; }
    .characteristic-s2 { animation-delay: 2.56s; }
    .characteristic-e2 { animation-delay: 2.56s; }
    .characteristic-s3 { animation-delay: 3.84s; }
    .characteristic-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .characteristic-conn  { animation: characteristic-trace 6.4s ease-in-out infinite; }
      .characteristic-stage { animation: characteristic-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes characteristic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes characteristic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .characteristic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .characteristic-stage { animation: characteristic-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes characteristic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="characteristic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="characteristic-bg" width="980" height="322"/>
  <text class="characteristic-h1"  x="30" y="40">The characteristic equation</text>
  <text class="characteristic-sub" x="30" y="64">Four steps.</text>
  <g class="characteristic-stage characteristic-s0">
    <rect class="characteristic-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="characteristic-step" x="44" y="142">01</text>
    <text class="characteristic-name" x="70" y="142">The defining condition: the matrix times the vector equals a scalar times the vector</text>
    <text class="characteristic-desc" x="44" y="166">Same direction, scaled.</text>
  </g>
  <line class="characteristic-line characteristic-conn characteristic-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#characteristic-tip)"/>
  <g class="characteristic-stage characteristic-s1">
    <rect class="characteristic-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="characteristic-step" x="280" y="142">02</text>
    <text class="characteristic-name" x="306" y="142">Rearranged, a shifted matrix times the vector is zero</text>
    <text class="characteristic-desc" x="280" y="166">For a non-zero vector.</text>
  </g>
  <line class="characteristic-line characteristic-conn characteristic-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#characteristic-tip)"/>
  <g class="characteristic-stage characteristic-s2">
    <rect class="characteristic-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="characteristic-step" x="516" y="142">03</text>
    <text class="characteristic-name" x="542" y="142">Which requires that shifted matrix to be singular</text>
    <text class="characteristic-desc" x="516" y="166">Or the only solution would be</text>
    <text class="characteristic-desc" x="516" y="182">zero.</text>
  </g>
  <line class="characteristic-line characteristic-conn characteristic-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#characteristic-tip)"/>
  <g class="characteristic-stage characteristic-s3">
    <rect class="characteristic-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="characteristic-step" x="752" y="142">04</text>
    <text class="characteristic-name" x="778" y="142">So its determinant is zero, giving a polynomial in the eigenvalue</text>
    <text class="characteristic-desc" x="752" y="166">Whose roots are the eigenvalues.</text>
  </g>
  <text class="characteristic-sub" x="30" y="304">The requirement that a non-zero solution exists is what forces singularity, and that single step turns a vector equation into a polynomial one.</text>
</svg>
