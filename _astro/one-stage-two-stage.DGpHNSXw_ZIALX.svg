<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Speed against precision.">
  <title>One stage, or two</title>
  <style>
    .one-stage-two-stage-bg   { fill: #f8fafc; }
    .one-stage-two-stage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-stage-two-stage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-stage-two-stage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-stage-two-stage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-stage-two-stage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-stage-two-stage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-stage-two-stage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-stage-two-stage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-stage-two-stage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-stage-two-stage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-stage-two-stage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-stage-two-stage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-stage-two-stage-row { opacity: 1; }
    .one-stage-two-stage-r0 { animation-delay: 0.00s; }
    .one-stage-two-stage-r1 { animation-delay: 0.45s; }
    .one-stage-two-stage-r2 { animation-delay: 0.90s; }
    .one-stage-two-stage-r3 { animation-delay: 1.35s; }
    .one-stage-two-stage-r4 { animation-delay: 1.80s; }
    .one-stage-two-stage-row { animation: one-stage-two-stage-reveal 7.3s ease-in-out infinite; }
    @keyframes one-stage-two-stage-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="one-stage-two-stage-bg" width="980" height="390"/>
  <text class="one-stage-two-stage-h1"  x="30" y="40">One stage, or two</text>
  <text class="one-stage-two-stage-sub" x="30" y="64">Speed against precision.</text>
  <rect class="one-stage-two-stage-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="one-stage-two-stage-name" x="46" y="122">Single stage</text>
  <text class="one-stage-two-stage-desc" x="46" y="142">Predict directly.</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r0" x="46" y="182">Boxes and classes in one pass</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r1" x="46" y="216">Real-time on modest hardware</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r2" x="46" y="250">Historically weaker on small objects</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r3" x="46" y="284">Focal loss addressed the imbalance</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r4" x="46" y="318">The default for latency-sensitive work</text>
  <rect class="one-stage-two-stage-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="one-stage-two-stage-name" x="526" y="122">Two stage</text>
  <text class="one-stage-two-stage-desc" x="526" y="142">Propose, then classify.</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r0" x="526" y="182">Region proposals, then refinement</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r1" x="526" y="216">Higher precision, historically</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r2" x="526" y="250">Slower — two passes over candidates</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r3" x="526" y="284">Better on small and overlapping objects</text>
  <text class="one-stage-two-stage-desc one-stage-two-stage-row one-stage-two-stage-r4" x="526" y="318">Where accuracy outweighs latency</text>
  <text class="one-stage-two-stage-sub" x="30" y="372">The gap has narrowed considerably: single-stage detectors with focal loss and feature pyramids now match two-stage accuracy on many benchmarks while remaining substantially faster.</text>
</svg>
