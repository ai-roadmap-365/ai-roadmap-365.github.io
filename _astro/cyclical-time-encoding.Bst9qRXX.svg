<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Cyclical Time Encoding Diagram">
  <title>Cyclical Time Encoding Unit Circle</title>
  <defs>
    <style>
      .d171a-bg { fill: #f8fafc; }
      .d171a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d171a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d171a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d171a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d171a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d171a-bg" />

  <text x="40" y="45" class="d171a-header" font-size="22">2D Cyclical Trigonometric Time Encoding</text>
  <text x="40" y="70" class="d171a-text" font-size="13">Mapping Periodic Features (Hours, Days, Months) to Continuous Coordinates: sin(2πt/T) &amp; cos(2πt/T)</text>

  <!-- Left: Linear Discontinuity Problem -->
  <rect x="40" y="100" width="380" height="340" class="d171a-box" />
  <text x="60" y="130" class="d171a-title" fill="#b91c1c">The 1D Linear Discontinuity Flaw</text>
  <text x="60" y="155" class="d171a-text">Linear hours treated as numbers 0 to 23:</text>

  <!-- Linear Number Line -->
  <line x1="60" y1="210" x2="400" y2="210" stroke="#94a3b8" stroke-width="3" />
  <!-- Midnight 00:00 -->
  <circle cx="70" cy="210" r="7" fill="#3b82f6" />
  <text x="55" y="235" class="d171a-math" fill="#1d4ed8">00:00 (0)</text>
  <!-- Noon 12:00 -->
  <circle cx="235" cy="210" r="7" fill="#64748b" />
  <text x="220" y="235" class="d171a-math">12:00 (12)</text>
  <!-- Night 23:00 -->
  <circle cx="390" cy="210" r="7" fill="#ef4444" />
  <text x="365" y="235" class="d171a-math" fill="#b91c1c">23:00 (23)</text>

  <!-- Distance Arrow across entire line -->
  <path d="M 75 190 L 385 190" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 2" />
  <text x="140" y="180" class="d171a-math" fill="#b91c1c">Apparent Distance = 23 Units!</text>

  <text x="60" y="285" class="d171a-text">• Real-world gap between 23:59 and 00:01 is <tspan font-weight="700">2 minutes</tspan>.</text>
  <text x="60" y="310" class="d171a-text">• Linear representation treats them as maximum distance.</text>
  <text x="60" y="335" class="d171a-text">• Forces tree and linear models to learn artificial jump edges.</text>
  <text x="60" y="375" class="d171a-math" fill="#b91c1c">Result: Broken Temporal Continuity</text>

  <!-- Right: 2D Unit Circle Solution -->
  <rect x="440" y="100" width="420" height="340" class="d171a-box" fill="#f0fdf4" stroke="#22c55e" />
  <text x="460" y="130" class="d171a-title" fill="#15803d">The 2D Unit Circle Continuous Solution</text>
  <text x="460" y="155" class="d171a-text">Formula: x = sin(2π · t / 24), y = cos(2π · t / 24)</text>

  <!-- 2D Circle Coordinate System -->
  <circle cx="650" cy="280" r="90" fill="#ffffff" stroke="#22c55e" stroke-width="2" />
  <line x1="650" y1="170" x2="650" y2="390" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="540" y1="280" x2="760" y2="280" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Points on Circle -->
  <!-- 00:00 (Top: sin=0, cos=1) -->
  <circle cx="650" cy="190" r="6" fill="#3b82f6" />
  <text x="635" y="180" class="d171a-math" fill="#1d4ed8">00:00 (0, 1)</text>

  <!-- 06:00 (Right: sin=1, cos=0) -->
  <circle cx="740" cy="280" r="5" fill="#64748b" />
  <text x="745" y="285" class="d171a-math">06:00</text>

  <!-- 12:00 (Bottom: sin=0, cos=-1) -->
  <circle cx="650" cy="370" r="5" fill="#64748b" />
  <text x="635" y="390" class="d171a-math">12:00</text>

  <!-- 23:00 (Top-Left: near 00:00!) -->
  <circle cx="627" cy="193" r="6" fill="#ef4444" />
  <text x="545" y="195" class="d171a-math" fill="#b91c1c">23:00 (-0.26, 0.97)</text>

  <!-- Arc showing true physical distance -->
  <path d="M 627 193 A 90 90 0 0 1 650 190" stroke="#16a34a" stroke-width="3" fill="none" />
  <text x="460" y="420" class="d171a-math" fill="#15803d">Distance(23:00, 00:00) = 0.26 (Smooth &amp; Continuous!)</text>
</svg>
