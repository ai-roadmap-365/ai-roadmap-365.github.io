<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things the paradigms are not</title>
  <style>
    .paradigm-not-bg   { fill: #f8fafc; }
    .paradigm-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .paradigm-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .paradigm-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .paradigm-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .paradigm-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .paradigm-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .paradigm-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .paradigm-not-row { opacity: 1; }
    .paradigm-not-r0 { animation-delay: 0.00s; }
    .paradigm-not-r1 { animation-delay: 0.45s; }
    .paradigm-not-r2 { animation-delay: 0.90s; }
    .paradigm-not-r3 { animation-delay: 1.35s; }
    .paradigm-not-r4 { animation-delay: 1.80s; }
    .paradigm-not-row { animation: paradigm-not-reveal 7.3s ease-in-out infinite; }
    @keyframes paradigm-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="paradigm-not-bg" width="980" height="390"/>
  <text class="paradigm-not-h1"  x="30" y="40">Four things the paradigms are not</text>
  <text class="paradigm-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="paradigm-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="paradigm-not-name" x="46" y="122">The misconception</text>
  <text class="paradigm-not-desc" x="46" y="142">Commonly held.</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r0" x="46" y="182">Unsupervised means no supervision is needed</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r1" x="46" y="216">Reinforcement learning is the most advanced</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r2" x="46" y="250">A system uses exactly one paradigm</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r3" x="46" y="284">Self-supervised is unsupervised</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r4" x="46" y="318">More feedback is always better</text>
  <rect class="paradigm-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="paradigm-not-name" x="526" y="122">What is true</text>
  <text class="paradigm-not-desc" x="526" y="142">Actually.</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r0" x="526" y="182">Evaluation still needs human judgment</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r1" x="526" y="216">It is the right tool for a narrow setting</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r2" x="526" y="250">Modern systems combine all three</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r3" x="526" y="284">It is supervised, with labels derived from the data</text>
  <text class="paradigm-not-desc paradigm-not-row paradigm-not-r4" x="526" y="318">Reward design decides what is learned</text>
  <text class="paradigm-not-sub" x="30" y="372">Self-supervised learning being supervised in mechanism is worth stating plainly: the labels are constructed from the input rather than absent.</text>
</svg>
