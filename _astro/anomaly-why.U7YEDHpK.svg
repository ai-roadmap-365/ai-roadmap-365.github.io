<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four problems.">
  <title>What anomaly detection solves</title>
  <style>
    .anomaly-why-bg   { fill: #f8fafc; }
    .anomaly-why-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-why-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-why-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-why-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-why-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-why-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .anomaly-why-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .anomaly-why-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .anomaly-why-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .anomaly-why-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .anomaly-why-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .anomaly-why-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .anomaly-why-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .anomaly-why-stage { opacity: 1; }

    .anomaly-why-s0 { animation-delay: 0.00s; }
    .anomaly-why-e0 { animation-delay: 0.00s; }
    .anomaly-why-s1 { animation-delay: 1.28s; }
    .anomaly-why-e1 { animation-delay: 1.28s; }
    .anomaly-why-s2 { animation-delay: 2.56s; }
    .anomaly-why-e2 { animation-delay: 2.56s; }
    .anomaly-why-s3 { animation-delay: 3.84s; }
    .anomaly-why-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .anomaly-why-conn  { animation: anomaly-why-trace 6.4s ease-in-out infinite; }
      .anomaly-why-stage { animation: anomaly-why-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes anomaly-why-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes anomaly-why-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .anomaly-why-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .anomaly-why-stage { animation: anomaly-why-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes anomaly-why-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="anomaly-why-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="anomaly-why-bg" width="980" height="322"/>
  <text class="anomaly-why-h1"  x="30" y="40">What anomaly detection solves</text>
  <text class="anomaly-why-sub" x="30" y="64">Four problems.</text>
  <g class="anomaly-why-stage anomaly-why-s0">
    <rect class="anomaly-why-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-why-step" x="44" y="142">01</text>
    <text class="anomaly-why-name" x="70" y="142">Rare events with no labelled examples</text>
    <text class="anomaly-why-desc" x="44" y="166">Fraud, faults, intrusions.</text>
  </g>
  <line class="anomaly-why-line anomaly-why-conn anomaly-why-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#anomaly-why-tip)"/>
  <g class="anomaly-why-stage anomaly-why-s1">
    <rect class="anomaly-why-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-why-step" x="280" y="142">02</text>
    <text class="anomaly-why-name" x="306" y="142">Failures nobody has seen yet</text>
    <text class="anomaly-why-desc" x="280" y="166">Which a classifier cannot be</text>
    <text class="anomaly-why-desc" x="280" y="182">trained on.</text>
  </g>
  <line class="anomaly-why-line anomaly-why-conn anomaly-why-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#anomaly-why-tip)"/>
  <g class="anomaly-why-stage anomaly-why-s2">
    <rect class="anomaly-why-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-why-step" x="516" y="142">03</text>
    <text class="anomaly-why-name" x="542" y="142">Continuous monitoring of a live system</text>
    <text class="anomaly-why-desc" x="516" y="166">Where the question is whether</text>
    <text class="anomaly-why-desc" x="516" y="182">anything changed.</text>
  </g>
  <line class="anomaly-why-line anomaly-why-conn anomaly-why-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#anomaly-why-tip)"/>
  <g class="anomaly-why-stage anomaly-why-s3">
    <rect class="anomaly-why-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-why-step" x="752" y="142">04</text>
    <text class="anomaly-why-name" x="778" y="142">At volumes where review must be prioritised</text>
    <text class="anomaly-why-desc" x="752" y="166">Which is what a score provides.</text>
  </g>
  <text class="anomaly-why-sub" x="30" y="304">The monitoring case is where these methods now do most of their work, including watching AI systems for drift and out-of-distribution inputs.</text>
</svg>
