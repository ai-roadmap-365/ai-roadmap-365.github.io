<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Group aggregations</title>
  <style>
    .aggregations-bg   { fill: #f8fafc; }
    .aggregations-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregations-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregations-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregations-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregations-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregations-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .aggregations-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .aggregations-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .aggregations-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .aggregations-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .aggregations-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .aggregations-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .aggregations-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .aggregations-stage { opacity: 1; }

    .aggregations-s0 { animation-delay: 0.00s; }
    .aggregations-e0 { animation-delay: 0.00s; }
    .aggregations-s1 { animation-delay: 1.28s; }
    .aggregations-e1 { animation-delay: 1.28s; }
    .aggregations-s2 { animation-delay: 2.56s; }
    .aggregations-e2 { animation-delay: 2.56s; }
    .aggregations-s3 { animation-delay: 3.84s; }
    .aggregations-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .aggregations-conn  { animation: aggregations-trace 6.4s ease-in-out infinite; }
      .aggregations-stage { animation: aggregations-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes aggregations-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes aggregations-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .aggregations-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .aggregations-stage { animation: aggregations-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes aggregations-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="aggregations-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="aggregations-bg" width="980" height="322"/>
  <text class="aggregations-h1"  x="30" y="40">Group aggregations</text>
  <text class="aggregations-sub" x="30" y="64">Four steps.</text>
  <g class="aggregations-stage aggregations-s0">
    <rect class="aggregations-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="aggregations-step" x="44" y="142">01</text>
    <text class="aggregations-name" x="70" y="142">Group the rows by an entity</text>
    <text class="aggregations-desc" x="44" y="166">Customer, product, region.</text>
  </g>
  <line class="aggregations-line aggregations-conn aggregations-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#aggregations-tip)"/>
  <g class="aggregations-stage aggregations-s1">
    <rect class="aggregations-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="aggregations-step" x="280" y="142">02</text>
    <text class="aggregations-name" x="306" y="142">Summarise each group</text>
    <text class="aggregations-desc" x="280" y="166">Count, mean, maximum, recency,</text>
    <text class="aggregations-desc" x="280" y="182">variance.</text>
  </g>
  <line class="aggregations-line aggregations-conn aggregations-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#aggregations-tip)"/>
  <g class="aggregations-stage aggregations-s2">
    <rect class="aggregations-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="aggregations-step" x="516" y="142">03</text>
    <text class="aggregations-name" x="542" y="142">Join the summary back onto every row</text>
    <text class="aggregations-desc" x="516" y="166">So each row carries its entity's</text>
    <text class="aggregations-desc" x="516" y="182">context.</text>
  </g>
  <line class="aggregations-line aggregations-conn aggregations-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#aggregations-tip)"/>
  <g class="aggregations-stage aggregations-s3">
    <rect class="aggregations-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="aggregations-step" x="752" y="142">04</text>
    <text class="aggregations-name" x="778" y="142">But compute it on training data only</text>
    <text class="aggregations-desc" x="752" y="166">Or the aggregate carries</text>
    <text class="aggregations-desc" x="752" y="182">information from the validation</text>
    <text class="aggregations-desc" x="752" y="198">rows.</text>
  </g>
  <text class="aggregations-sub" x="30" y="304">Aggregations are the most productive feature family on transactional data and the most common source of leakage, which is why the last step is not optional.</text>
</svg>
