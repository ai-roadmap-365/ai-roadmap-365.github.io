<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same object, versus equal value.">
  <title>is and == answer different questions</title>
  <style>
    .is-or-equals-bg   { fill: #f8fafc; }
    .is-or-equals-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .is-or-equals-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .is-or-equals-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .is-or-equals-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .is-or-equals-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .is-or-equals-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .is-or-equals-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .is-or-equals-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .is-or-equals-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .is-or-equals-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .is-or-equals-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .is-or-equals-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .is-or-equals-row { opacity: 1; }
    .is-or-equals-r0 { animation-delay: 0.00s; }
    .is-or-equals-r1 { animation-delay: 0.45s; }
    .is-or-equals-r2 { animation-delay: 0.90s; }
    .is-or-equals-r3 { animation-delay: 1.35s; }
    .is-or-equals-r4 { animation-delay: 1.80s; }
    .is-or-equals-row { animation: is-or-equals-reveal 7.3s ease-in-out infinite; }
    @keyframes is-or-equals-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="is-or-equals-bg" width="980" height="390"/>
  <text class="is-or-equals-h1"  x="30" y="40">is and == answer different questions</text>
  <text class="is-or-equals-sub" x="30" y="64">Same object, versus equal value.</text>
  <rect class="is-or-equals-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="is-or-equals-name" x="46" y="122">a == b</text>
  <text class="is-or-equals-desc" x="46" y="142">Do they have the same value?</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r0" x="46" y="182">Compares contents</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r1" x="46" y="216">Two separate lists can be equal</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r2" x="46" y="250">This is what you almost always want</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r3" x="46" y="284">Definable by a class</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r4" x="46" y="318">Use for all value comparison</text>
  <rect class="is-or-equals-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="is-or-equals-name" x="526" y="122">a is b</text>
  <text class="is-or-equals-desc" x="526" y="142">Are they the same object?</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r0" x="526" y="182">Compares identity — the id()</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r1" x="526" y="216">Two equal lists are NOT the same object</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r2" x="526" y="250">Correct for None, and singletons</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r3" x="526" y="284">Cannot be redefined</text>
  <text class="is-or-equals-desc is-or-equals-row is-or-equals-r4" x="526" y="318">Everything else: use ==</text>
  <text class="is-or-equals-sub" x="30" y="372">Small integers and short strings are cached, so a is b can be True for equal values by coincidence. That coincidence is exactly why using is for values produces bugs that work in testing.</text>
</svg>
