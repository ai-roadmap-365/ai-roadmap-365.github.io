<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not FLOPs, and not the weights.">
  <title>What actually bounds concurrency</title>
  <style>
    .kv-cache-arithmetic-bg   { fill: #f8fafc; }
    .kv-cache-arithmetic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-arithmetic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-arithmetic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-arithmetic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-arithmetic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-arithmetic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kv-cache-arithmetic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kv-cache-arithmetic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kv-cache-arithmetic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kv-cache-arithmetic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kv-cache-arithmetic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kv-cache-arithmetic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .kv-cache-arithmetic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .kv-cache-arithmetic-stage { opacity: 1; }

    .kv-cache-arithmetic-s0 { animation-delay: 0.00s; }
    .kv-cache-arithmetic-e0 { animation-delay: 0.00s; }
    .kv-cache-arithmetic-s1 { animation-delay: 1.28s; }
    .kv-cache-arithmetic-e1 { animation-delay: 1.28s; }
    .kv-cache-arithmetic-s2 { animation-delay: 2.56s; }
    .kv-cache-arithmetic-e2 { animation-delay: 2.56s; }
    .kv-cache-arithmetic-s3 { animation-delay: 3.84s; }
    .kv-cache-arithmetic-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .kv-cache-arithmetic-conn  { animation: kv-cache-arithmetic-trace 6.4s ease-in-out infinite; }
      .kv-cache-arithmetic-stage { animation: kv-cache-arithmetic-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes kv-cache-arithmetic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes kv-cache-arithmetic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .kv-cache-arithmetic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .kv-cache-arithmetic-stage { animation: kv-cache-arithmetic-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes kv-cache-arithmetic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="kv-cache-arithmetic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="kv-cache-arithmetic-bg" width="980" height="322"/>
  <text class="kv-cache-arithmetic-h1"  x="30" y="40">What actually bounds concurrency</text>
  <text class="kv-cache-arithmetic-sub" x="30" y="64">Not FLOPs, and not the weights.</text>
  <g class="kv-cache-arithmetic-stage kv-cache-arithmetic-s0">
    <rect class="kv-cache-arithmetic-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="kv-cache-arithmetic-step" x="44" y="142">01</text>
    <text class="kv-cache-arithmetic-name" x="70" y="142">Generation would be quadratic without it</text>
    <text class="kv-cache-arithmetic-desc" x="44" y="166">Token n attends to every</text>
    <text class="kv-cache-arithmetic-desc" x="44" y="182">previous token. Keep the keys</text>
    <text class="kv-cache-arithmetic-desc" x="44" y="198">and values.</text>
    <text class="kv-cache-arithmetic-edge" x="44" y="242">linear</text>
  </g>
  <line class="kv-cache-arithmetic-line kv-cache-arithmetic-conn kv-cache-arithmetic-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#kv-cache-arithmetic-tip)"/>
  <g class="kv-cache-arithmetic-stage kv-cache-arithmetic-s1">
    <rect class="kv-cache-arithmetic-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="kv-cache-arithmetic-step" x="280" y="142">02</text>
    <text class="kv-cache-arithmetic-name" x="306" y="142">It grows with every token</text>
    <text class="kv-cache-arithmetic-desc" x="280" y="166">Gigabytes per sequence for a 7B</text>
    <text class="kv-cache-arithmetic-desc" x="280" y="182">model at a few thousand tokens</text>
    <text class="kv-cache-arithmetic-desc" x="280" y="198">of context.</text>
  </g>
  <line class="kv-cache-arithmetic-line kv-cache-arithmetic-conn kv-cache-arithmetic-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#kv-cache-arithmetic-tip)"/>
  <g class="kv-cache-arithmetic-stage kv-cache-arithmetic-s2">
    <rect class="kv-cache-arithmetic-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="kv-cache-arithmetic-step" x="516" y="142">03</text>
    <text class="kv-cache-arithmetic-name" x="542" y="142">On a 24 GB card, weights are 14 GB</text>
    <text class="kv-cache-arithmetic-desc" x="516" y="166">The cache is what is left, and</text>
    <text class="kv-cache-arithmetic-desc" x="516" y="182">it is the binding constraint.</text>
    <text class="kv-cache-arithmetic-edge" x="516" y="242">10 GB</text>
  </g>
  <line class="kv-cache-arithmetic-line kv-cache-arithmetic-conn kv-cache-arithmetic-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#kv-cache-arithmetic-tip)"/>
  <g class="kv-cache-arithmetic-stage kv-cache-arithmetic-s3">
    <rect class="kv-cache-arithmetic-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="kv-cache-arithmetic-step" x="752" y="142">04</text>
    <text class="kv-cache-arithmetic-name" x="778" y="142">Naive allocation makes it worse</text>
    <text class="kv-cache-arithmetic-desc" x="752" y="166">Reserve max_sequence_length and</text>
    <text class="kv-cache-arithmetic-desc" x="752" y="182">a 20-token request holds 4,096.</text>
    <text class="kv-cache-arithmetic-desc" x="752" y="198">20-40% utilised.</text>
  </g>
  <text class="kv-cache-arithmetic-sub" x="30" y="304">"Memory management is the performance work" is the sentence to carry out of this lesson: tensor cores are rarely the limit on an LLM serving box, and almost every capacity question resolves to how the cache is allocated.</text>
</svg>
