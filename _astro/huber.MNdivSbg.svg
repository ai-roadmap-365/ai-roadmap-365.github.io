<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>A blend of the two</title>
  <style>
    .huber-bg   { fill: #f8fafc; }
    .huber-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .huber-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .huber-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .huber-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .huber-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .huber-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .huber-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .huber-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .huber-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .huber-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .huber-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .huber-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .huber-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .huber-stage { opacity: 1; }

    .huber-s0 { animation-delay: 0.00s; }
    .huber-e0 { animation-delay: 0.00s; }
    .huber-s1 { animation-delay: 1.28s; }
    .huber-e1 { animation-delay: 1.28s; }
    .huber-s2 { animation-delay: 2.56s; }
    .huber-e2 { animation-delay: 2.56s; }
    .huber-s3 { animation-delay: 3.84s; }
    .huber-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .huber-conn  { animation: huber-trace 6.4s ease-in-out infinite; }
      .huber-stage { animation: huber-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes huber-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes huber-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .huber-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .huber-stage { animation: huber-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes huber-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="huber-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="huber-bg" width="980" height="322"/>
  <text class="huber-h1"  x="30" y="40">A blend of the two</text>
  <text class="huber-sub" x="30" y="64">Four steps.</text>
  <g class="huber-stage huber-s0">
    <rect class="huber-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="huber-step" x="44" y="142">01</text>
    <text class="huber-name" x="70" y="142">Choose a threshold on the residual size</text>
    <text class="huber-desc" x="44" y="166">Which separates ordinary errors</text>
    <text class="huber-desc" x="44" y="182">from outliers.</text>
  </g>
  <line class="huber-line huber-conn huber-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#huber-tip)"/>
  <g class="huber-stage huber-s1">
    <rect class="huber-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="huber-step" x="280" y="142">02</text>
    <text class="huber-name" x="306" y="142">Below it, behave like squared error</text>
    <text class="huber-desc" x="280" y="166">Smooth, and efficient on</text>
    <text class="huber-desc" x="280" y="182">well-behaved data.</text>
  </g>
  <line class="huber-line huber-conn huber-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#huber-tip)"/>
  <g class="huber-stage huber-s2">
    <rect class="huber-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="huber-step" x="516" y="142">03</text>
    <text class="huber-name" x="542" y="142">Above it, behave like absolute error</text>
    <text class="huber-desc" x="516" y="166">So large residuals do not</text>
    <text class="huber-desc" x="516" y="182">dominate.</text>
  </g>
  <line class="huber-line huber-conn huber-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#huber-tip)"/>
  <g class="huber-stage huber-s3">
    <rect class="huber-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="huber-step" x="752" y="142">04</text>
    <text class="huber-name" x="778" y="142">With the threshold as a continuous dial</text>
    <text class="huber-desc" x="752" y="166">Between full sensitivity and</text>
    <text class="huber-desc" x="752" y="182">full robustness.</text>
    <text class="huber-edge" x="752" y="242">one parameter</text>
  </g>
  <text class="huber-sub" x="30" y="304">Having a continuous dial rather than two discrete options is the practical advantage, since real data is rarely at either extreme.</text>
</svg>
