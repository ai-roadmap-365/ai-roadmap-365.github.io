<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three misreadings.">
  <title>What naive Bayes is not</title>
  <style>
    .nb-not-bg   { fill: #f8fafc; }
    .nb-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nb-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nb-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nb-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nb-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nb-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-not-row { opacity: 1; }
    .nb-not-r0 { animation-delay: 0.00s; }
    .nb-not-r1 { animation-delay: 0.45s; }
    .nb-not-r2 { animation-delay: 0.90s; }
    .nb-not-r3 { animation-delay: 1.35s; }
    .nb-not-r4 { animation-delay: 1.80s; }
    .nb-not-row { animation: nb-not-reveal 7.3s ease-in-out infinite; }
    @keyframes nb-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nb-not-bg" width="980" height="390"/>
  <text class="nb-not-h1"  x="30" y="40">What naive Bayes is not</text>
  <text class="nb-not-sub" x="30" y="64">Three misreadings.</text>
  <rect class="nb-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nb-not-name" x="46" y="122">The misconception</text>
  <text class="nb-not-desc" x="46" y="142">Frequently assumed.</text>
  <text class="nb-not-desc nb-not-row nb-not-r0" x="46" y="182">Naive means it is a toy</text>
  <text class="nb-not-desc nb-not-row nb-not-r1" x="46" y="216">Its outputs are probabilities</text>
  <text class="nb-not-desc nb-not-row nb-not-r2" x="46" y="250">The independence assumption must hold</text>
  <text class="nb-not-desc nb-not-row nb-not-r3" x="46" y="284">It is obsolete now</text>
  <text class="nb-not-desc nb-not-row nb-not-r4" x="46" y="318">More features always help</text>
  <rect class="nb-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nb-not-name" x="526" y="122">What is true</text>
  <text class="nb-not-desc" x="526" y="142">Actually.</text>
  <text class="nb-not-desc nb-not-row nb-not-r0" x="526" y="182">Naive names the assumption, not the quality</text>
  <text class="nb-not-desc nb-not-row nb-not-r1" x="526" y="216">They rank correctly and calibrate badly</text>
  <text class="nb-not-desc nb-not-row nb-not-r2" x="526" y="250">It classifies well when it is violated</text>
  <text class="nb-not-desc nb-not-row nb-not-r3" x="526" y="284">Still the standard text baseline</text>
  <text class="nb-not-desc nb-not-row nb-not-r4" x="526" y="318">Correlated features actively hurt it</text>
  <text class="nb-not-sub" x="30" y="372">The last row is the practically useful one: adding correlated features to naive Bayes degrades it, which is the opposite of the usual intuition.</text>
</svg>
