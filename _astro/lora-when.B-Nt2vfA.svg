<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use adapters</title>
  <style>
    .lora-when-bg   { fill: #f8fafc; }
    .lora-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lora-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lora-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lora-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lora-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lora-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lora-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lora-when-row { opacity: 1; }
    .lora-when-r0 { animation-delay: 0.00s; }
    .lora-when-r1 { animation-delay: 0.45s; }
    .lora-when-r2 { animation-delay: 0.90s; }
    .lora-when-r3 { animation-delay: 1.35s; }
    .lora-when-r4 { animation-delay: 1.80s; }
    .lora-when-row { animation: lora-when-reveal 7.3s ease-in-out infinite; }
    @keyframes lora-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lora-when-bg" width="980" height="390"/>
  <text class="lora-when-h1"  x="30" y="40">When to use adapters</text>
  <text class="lora-when-sub" x="30" y="64">And when not to.</text>
  <rect class="lora-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lora-when-name" x="46" y="122">Use adapters</text>
  <text class="lora-when-desc" x="46" y="142">Four cases.</text>
  <text class="lora-when-desc lora-when-row lora-when-r0" x="46" y="182">A behaviour or format prompting cannot fix</text>
  <text class="lora-when-desc lora-when-row lora-when-r1" x="46" y="216">Many tasks from one backbone</text>
  <text class="lora-when-desc lora-when-row lora-when-r2" x="46" y="250">Limited training hardware</text>
  <text class="lora-when-desc lora-when-row lora-when-r3" x="46" y="284">Where prompts have grown long and volume is high</text>
  <text class="lora-when-desc lora-when-row lora-when-r4" x="46" y="318">And labelled examples exist</text>
  <rect class="lora-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lora-when-name" x="526" y="122">Do something else</text>
  <text class="lora-when-desc" x="526" y="142">Also four.</text>
  <text class="lora-when-desc lora-when-row lora-when-r0" x="526" y="182">Missing knowledge — use retrieval</text>
  <text class="lora-when-desc lora-when-row lora-when-r1" x="526" y="216">Fewer than a few hundred examples</text>
  <text class="lora-when-desc lora-when-row lora-when-r2" x="526" y="250">Requirements still changing</text>
  <text class="lora-when-desc lora-when-row lora-when-r3" x="526" y="284">Where prompting already works</text>
  <text class="lora-when-desc lora-when-row lora-when-r4" x="526" y="318">And where nobody will maintain it</text>
  <text class="lora-when-sub" x="30" y="372">The maintenance row matters more than it looks: an adapter is a trained artefact that decays as the task drifts, and one nobody owns becomes a liability.</text>
</svg>
