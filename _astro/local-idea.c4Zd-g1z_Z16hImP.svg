<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Running a model locally</title>
  <style>
    .local-idea-bg   { fill: #f8fafc; }
    .local-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .local-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .local-idea-stage { opacity: 1; }

    .local-idea-s0 { animation-delay: 0.00s; }
    .local-idea-e0 { animation-delay: 0.00s; }
    .local-idea-s1 { animation-delay: 1.28s; }
    .local-idea-e1 { animation-delay: 1.28s; }
    .local-idea-s2 { animation-delay: 2.56s; }
    .local-idea-e2 { animation-delay: 2.56s; }
    .local-idea-s3 { animation-delay: 3.84s; }
    .local-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .local-idea-conn  { animation: local-idea-trace 6.4s ease-in-out infinite; }
      .local-idea-stage { animation: local-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes local-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes local-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .local-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .local-idea-stage { animation: local-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes local-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="local-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="local-idea-bg" width="980" height="322"/>
  <text class="local-idea-h1"  x="30" y="40">Running a model locally</text>
  <text class="local-idea-sub" x="30" y="64">Four steps.</text>
  <g class="local-idea-stage local-idea-s0">
    <rect class="local-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="local-idea-step" x="44" y="142">01</text>
    <text class="local-idea-name" x="70" y="142">Pull a packaged model</text>
    <text class="local-idea-desc" x="44" y="166">Weights, template and parameters</text>
    <text class="local-idea-desc" x="44" y="182">together.</text>
  </g>
  <line class="local-idea-line local-idea-conn local-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#local-idea-tip)"/>
  <g class="local-idea-stage local-idea-s1">
    <rect class="local-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="local-idea-step" x="280" y="142">02</text>
    <text class="local-idea-name" x="306" y="142">Already quantised for local hardware</text>
    <text class="local-idea-desc" x="280" y="166">Four or five bits, sized to fit.</text>
  </g>
  <line class="local-idea-line local-idea-conn local-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#local-idea-tip)"/>
  <g class="local-idea-stage local-idea-s2">
    <rect class="local-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="local-idea-step" x="516" y="142">03</text>
    <text class="local-idea-name" x="542" y="142">Served by a local process</text>
    <text class="local-idea-desc" x="516" y="166">Which handles loading, memory</text>
    <text class="local-idea-desc" x="516" y="182">and offloading.</text>
  </g>
  <line class="local-idea-line local-idea-conn local-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#local-idea-tip)"/>
  <g class="local-idea-stage local-idea-s3">
    <rect class="local-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="local-idea-step" x="752" y="142">04</text>
    <text class="local-idea-name" x="778" y="142">Behind the same API shape as a hosted model</text>
    <text class="local-idea-desc" x="752" y="166">So application code is</text>
    <text class="local-idea-desc" x="752" y="182">unchanged.</text>
    <text class="local-idea-edge" x="752" y="242">free per token</text>
  </g>
  <text class="local-idea-sub" x="30" y="304">Packaging the template with the weights is the part that matters most for quality, and it is the thing hand-rolled local setups most often get wrong.</text>
</svg>
