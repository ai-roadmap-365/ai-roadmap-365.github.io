<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Stated precisely.">
  <title>Four things logistic regression is</title>
  <style>
    .logreg-pitfalls-bg   { fill: #f8fafc; }
    .logreg-pitfalls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-pitfalls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-pitfalls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-pitfalls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-pitfalls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-pitfalls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logreg-pitfalls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logreg-pitfalls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logreg-pitfalls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logreg-pitfalls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logreg-pitfalls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logreg-pitfalls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .logreg-pitfalls-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .logreg-pitfalls-stage { opacity: 1; }

    .logreg-pitfalls-s0 { animation-delay: 0.00s; }
    .logreg-pitfalls-e0 { animation-delay: 0.00s; }
    .logreg-pitfalls-s1 { animation-delay: 1.28s; }
    .logreg-pitfalls-e1 { animation-delay: 1.28s; }
    .logreg-pitfalls-s2 { animation-delay: 2.56s; }
    .logreg-pitfalls-e2 { animation-delay: 2.56s; }
    .logreg-pitfalls-s3 { animation-delay: 3.84s; }
    .logreg-pitfalls-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .logreg-pitfalls-conn  { animation: logreg-pitfalls-trace 6.4s ease-in-out infinite; }
      .logreg-pitfalls-stage { animation: logreg-pitfalls-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes logreg-pitfalls-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes logreg-pitfalls-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .logreg-pitfalls-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .logreg-pitfalls-stage { animation: logreg-pitfalls-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes logreg-pitfalls-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="logreg-pitfalls-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="logreg-pitfalls-bg" width="980" height="322"/>
  <text class="logreg-pitfalls-h1"  x="30" y="40">Four things logistic regression is</text>
  <text class="logreg-pitfalls-sub" x="30" y="64">Stated precisely.</text>
  <g class="logreg-pitfalls-stage logreg-pitfalls-s0">
    <rect class="logreg-pitfalls-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-pitfalls-step" x="44" y="142">01</text>
    <text class="logreg-pitfalls-name" x="70" y="142">A linear model of log odds</text>
    <text class="logreg-pitfalls-desc" x="44" y="166">Linear in the parameters, not</text>
    <text class="logreg-pitfalls-desc" x="44" y="182">necessarily in the features.</text>
  </g>
  <line class="logreg-pitfalls-line logreg-pitfalls-conn logreg-pitfalls-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#logreg-pitfalls-tip)"/>
  <g class="logreg-pitfalls-stage logreg-pitfalls-s1">
    <rect class="logreg-pitfalls-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-pitfalls-step" x="280" y="142">02</text>
    <text class="logreg-pitfalls-name" x="306" y="142">With a sigmoid link to probability</text>
    <text class="logreg-pitfalls-desc" x="280" y="166">Which bounds the output</text>
    <text class="logreg-pitfalls-desc" x="280" y="182">correctly.</text>
  </g>
  <line class="logreg-pitfalls-line logreg-pitfalls-conn logreg-pitfalls-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#logreg-pitfalls-tip)"/>
  <g class="logreg-pitfalls-stage logreg-pitfalls-s2">
    <rect class="logreg-pitfalls-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-pitfalls-step" x="516" y="142">03</text>
    <text class="logreg-pitfalls-name" x="542" y="142">Fitted by maximising likelihood</text>
    <text class="logreg-pitfalls-desc" x="516" y="166">Equivalently, minimising</text>
    <text class="logreg-pitfalls-desc" x="516" y="182">cross-entropy.</text>
  </g>
  <line class="logreg-pitfalls-line logreg-pitfalls-conn logreg-pitfalls-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#logreg-pitfalls-tip)"/>
  <g class="logreg-pitfalls-stage logreg-pitfalls-s3">
    <rect class="logreg-pitfalls-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-pitfalls-step" x="752" y="142">04</text>
    <text class="logreg-pitfalls-name" x="778" y="142">Producing calibrated probabilities</text>
    <text class="logreg-pitfalls-desc" x="752" y="166">Which is more than most</text>
    <text class="logreg-pitfalls-desc" x="752" y="182">classifiers offer.</text>
    <text class="logreg-pitfalls-edge" x="752" y="242">the output</text>
  </g>
  <text class="logreg-pitfalls-sub" x="30" y="304">Linear in the parameters rather than in the features is the precise statement, and it is why polynomial terms let the boundary curve without changing the method.</text>
</svg>
