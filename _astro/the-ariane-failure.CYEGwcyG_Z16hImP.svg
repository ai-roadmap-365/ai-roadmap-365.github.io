<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A number that did not fit the type it was converted into, with nothing checking.">
  <title>37 seconds</title>
  <style>
    .the-ariane-failure-bg   { fill: #f8fafc; }
    .the-ariane-failure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-ariane-failure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-ariane-failure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-ariane-failure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-ariane-failure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-ariane-failure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .the-ariane-failure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .the-ariane-failure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .the-ariane-failure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .the-ariane-failure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .the-ariane-failure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .the-ariane-failure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .the-ariane-failure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .the-ariane-failure-stage { opacity: 1; }

    .the-ariane-failure-s0 { animation-delay: 0.00s; }
    .the-ariane-failure-e0 { animation-delay: 0.00s; }
    .the-ariane-failure-s1 { animation-delay: 1.33s; }
    .the-ariane-failure-e1 { animation-delay: 1.33s; }
    .the-ariane-failure-s2 { animation-delay: 2.67s; }
    .the-ariane-failure-e2 { animation-delay: 2.67s; }
    .the-ariane-failure-s3 { animation-delay: 4.00s; }
    .the-ariane-failure-e3 { animation-delay: 4.00s; }
    .the-ariane-failure-s4 { animation-delay: 5.33s; }
    .the-ariane-failure-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .the-ariane-failure-conn  { animation: the-ariane-failure-trace 8s ease-in-out infinite; }
      .the-ariane-failure-stage { animation: the-ariane-failure-arrive 8s ease-in-out infinite; }
    }
    @keyframes the-ariane-failure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes the-ariane-failure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .the-ariane-failure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .the-ariane-failure-stage { animation: the-ariane-failure-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes the-ariane-failure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="the-ariane-failure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="the-ariane-failure-bg" width="980" height="322"/>
  <text class="the-ariane-failure-h1"  x="30" y="40">37 seconds</text>
  <text class="the-ariane-failure-sub" x="30" y="64">A number that did not fit the type it was converted into, with nothing checking.</text>
  <g class="the-ariane-failure-stage the-ariane-failure-s0">
    <rect class="the-ariane-failure-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="the-ariane-failure-step" x="44" y="142">01</text>
    <text class="the-ariane-failure-name" x="70" y="142">Reuse</text>
    <text class="the-ariane-failure-desc" x="44" y="166">Well-tested inertial</text>
    <text class="the-ariane-failure-desc" x="44" y="182">software from Ariane 4.</text>
    <text class="the-ariane-failure-edge" x="44" y="242">proven</text>
  </g>
  <line class="the-ariane-failure-line the-ariane-failure-conn the-ariane-failure-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#the-ariane-failure-tip)"/>
  <g class="the-ariane-failure-stage the-ariane-failure-s1">
    <rect class="the-ariane-failure-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="the-ariane-failure-step" x="233" y="142">02</text>
    <text class="the-ariane-failure-name" x="259" y="142">Unprotected</text>
    <text class="the-ariane-failure-desc" x="233" y="166">A 64-bit float to 16-bit</text>
    <text class="the-ariane-failure-desc" x="233" y="182">integer conversion, check</text>
    <text class="the-ariane-failure-desc" x="233" y="198">removed to save time.</text>
    <text class="the-ariane-failure-edge" x="233" y="242">a decision</text>
  </g>
  <line class="the-ariane-failure-line the-ariane-failure-conn the-ariane-failure-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#the-ariane-failure-tip)"/>
  <g class="the-ariane-failure-stage the-ariane-failure-s2">
    <rect class="the-ariane-failure-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="the-ariane-failure-step" x="422" y="142">03</text>
    <text class="the-ariane-failure-name" x="448" y="142">Steeper climb</text>
    <text class="the-ariane-failure-desc" x="422" y="166">Ariane 5 drifts</text>
    <text class="the-ariane-failure-desc" x="422" y="182">horizontally faster than</text>
    <text class="the-ariane-failure-desc" x="422" y="198">its predecessor.</text>
    <text class="the-ariane-failure-edge" x="422" y="242">37 s</text>
  </g>
  <line class="the-ariane-failure-line the-ariane-failure-conn the-ariane-failure-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#the-ariane-failure-tip)"/>
  <g class="the-ariane-failure-stage the-ariane-failure-s3">
    <rect class="the-ariane-failure-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="the-ariane-failure-step" x="611" y="142">04</text>
    <text class="the-ariane-failure-name" x="637" y="142">Overflow</text>
    <text class="the-ariane-failure-desc" x="611" y="166">The value exceeds 32,767.</text>
    <text class="the-ariane-failure-desc" x="611" y="182">Unhandled exception.</text>
    <text class="the-ariane-failure-edge" x="611" y="242">unit shuts down</text>
  </g>
  <line class="the-ariane-failure-line the-ariane-failure-conn the-ariane-failure-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#the-ariane-failure-tip)"/>
  <g class="the-ariane-failure-stage the-ariane-failure-s4">
    <rect class="the-ariane-failure-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="the-ariane-failure-step" x="800" y="142">05</text>
    <text class="the-ariane-failure-name" x="826" y="142">Backup fails too</text>
    <text class="the-ariane-failure-desc" x="800" y="166">Identical software,</text>
    <text class="the-ariane-failure-desc" x="800" y="182">identical failure,</text>
    <text class="the-ariane-failure-desc" x="800" y="198">moments earlier.</text>
    <text class="the-ariane-failure-edge" x="800" y="242">~$370m</text>
  </g>
  <text class="the-ariane-failure-sub" x="30" y="304">The analysis was correct for Ariane 4. It was never re-done for the rocket that actually flew.</text>
</svg>
