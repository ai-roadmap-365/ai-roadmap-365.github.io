<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="Fine-Tuning Evaluation Before and After Comparison">
  <title>Fine-Tuning Evaluation Before and After Comparison</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d280f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d280f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d280f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d280f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d280f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d280f-arrowhead); }
      .d280f-pulse { animation: d280f-glow 2.5s infinite ease-in-out; }
      @keyframes d280f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d280f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d280f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(50, 40)">
    <rect class="d280f-box" x="0" y="0" width="320" height="200" />
    <text class="d280f-header" x="20" y="35">Before Fine-Tuning (Base Model)</text>
    <text class="d280f-text" x="20" y="70">• Verbose conversational chatter</text>
    <text class="d280f-text" x="20" y="95">• Frequent JSON syntax errors (42%)</text>
    <text class="d280f-text" x="20" y="120">• Hallucinates non-existent SQL schema</text>
    <text class="d280f-accent" x="20" y="160">Task Accuracy: 58.2%</text>
  </g>

  <g transform="translate(420, 40)">
    <rect class="d280f-box d280f-pulse" x="0" y="0" width="320" height="200" />
    <text class="d280f-header" x="20" y="35">After LoRA Fine-Tuning</text>
    <text class="d280f-text" x="20" y="70">• 100% Valid JSON schema output</text>
    <text class="d280f-text" x="20" y="95">• Zero conversational fluff</text>
    <text class="d280f-text" x="20" y="120">• Strict schema and dialect alignment</text>
    <text class="d280f-accent" x="20" y="160">Task Accuracy: 96.4%</text>
  </g>

</svg>