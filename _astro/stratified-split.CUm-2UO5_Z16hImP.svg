<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Splitting the data</title>
  <style>
    .stratified-split-bg   { fill: #f8fafc; }
    .stratified-split-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-split-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-split-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-split-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-split-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-split-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stratified-split-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stratified-split-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stratified-split-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stratified-split-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stratified-split-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stratified-split-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stratified-split-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stratified-split-stage { opacity: 1; }

    .stratified-split-s0 { animation-delay: 0.00s; }
    .stratified-split-e0 { animation-delay: 0.00s; }
    .stratified-split-s1 { animation-delay: 1.28s; }
    .stratified-split-e1 { animation-delay: 1.28s; }
    .stratified-split-s2 { animation-delay: 2.56s; }
    .stratified-split-e2 { animation-delay: 2.56s; }
    .stratified-split-s3 { animation-delay: 3.84s; }
    .stratified-split-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stratified-split-conn  { animation: stratified-split-trace 6.4s ease-in-out infinite; }
      .stratified-split-stage { animation: stratified-split-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stratified-split-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stratified-split-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stratified-split-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stratified-split-stage { animation: stratified-split-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stratified-split-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stratified-split-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stratified-split-bg" width="980" height="322"/>
  <text class="stratified-split-h1"  x="30" y="40">Splitting the data</text>
  <text class="stratified-split-sub" x="30" y="64">Four properties.</text>
  <g class="stratified-split-stage stratified-split-s0">
    <rect class="stratified-split-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stratified-split-step" x="44" y="142">01</text>
    <text class="stratified-split-name" x="70" y="142">Three parts, not two</text>
    <text class="stratified-split-desc" x="44" y="166">Training, validation for</text>
    <text class="stratified-split-desc" x="44" y="182">decisions, test for the final</text>
    <text class="stratified-split-desc" x="44" y="198">estimate.</text>
  </g>
  <line class="stratified-split-line stratified-split-conn stratified-split-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stratified-split-tip)"/>
  <g class="stratified-split-stage stratified-split-s1">
    <rect class="stratified-split-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stratified-split-step" x="280" y="142">02</text>
    <text class="stratified-split-name" x="306" y="142">Stratified, so class proportions match</text>
    <text class="stratified-split-desc" x="280" y="166">Which matters most when a class</text>
    <text class="stratified-split-desc" x="280" y="182">is rare.</text>
  </g>
  <line class="stratified-split-line stratified-split-conn stratified-split-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stratified-split-tip)"/>
  <g class="stratified-split-stage stratified-split-s2">
    <rect class="stratified-split-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stratified-split-step" x="516" y="142">03</text>
    <text class="stratified-split-name" x="542" y="142">Grouped, so related rows stay together</text>
    <text class="stratified-split-desc" x="516" y="166">Several rows per customer must</text>
    <text class="stratified-split-desc" x="516" y="182">not straddle the split.</text>
  </g>
  <line class="stratified-split-line stratified-split-conn stratified-split-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stratified-split-tip)"/>
  <g class="stratified-split-stage stratified-split-s3">
    <rect class="stratified-split-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stratified-split-step" x="752" y="142">04</text>
    <text class="stratified-split-name" x="778" y="142">And split by time where time matters</text>
    <text class="stratified-split-desc" x="752" y="166">Never predict the past from the</text>
    <text class="stratified-split-desc" x="752" y="182">future.</text>
  </g>
  <text class="stratified-split-sub" x="30" y="304">The grouping and time constraints are the two that get missed, and both produce the same symptom: excellent validation scores and poor production performance.</text>
</svg>
