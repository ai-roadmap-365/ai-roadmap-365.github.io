<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two conditions, and both must hold.">
  <title>What decides a cache hit</title>
  <style>
    .cache-key-inputs-bg   { fill: #f8fafc; }
    .cache-key-inputs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-key-inputs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-key-inputs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-key-inputs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-key-inputs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-key-inputs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-key-inputs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cache-key-inputs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cache-key-inputs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cache-key-inputs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cache-key-inputs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cache-key-inputs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cache-key-inputs-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cache-key-inputs-stage { opacity: 1; }

    .cache-key-inputs-s0 { animation-delay: 0.00s; }
    .cache-key-inputs-e0 { animation-delay: 0.00s; }
    .cache-key-inputs-s1 { animation-delay: 1.28s; }
    .cache-key-inputs-e1 { animation-delay: 1.28s; }
    .cache-key-inputs-s2 { animation-delay: 2.56s; }
    .cache-key-inputs-e2 { animation-delay: 2.56s; }
    .cache-key-inputs-s3 { animation-delay: 3.84s; }
    .cache-key-inputs-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cache-key-inputs-conn  { animation: cache-key-inputs-trace 6.4s ease-in-out infinite; }
      .cache-key-inputs-stage { animation: cache-key-inputs-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cache-key-inputs-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cache-key-inputs-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cache-key-inputs-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cache-key-inputs-stage { animation: cache-key-inputs-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cache-key-inputs-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cache-key-inputs-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cache-key-inputs-bg" width="980" height="322"/>
  <text class="cache-key-inputs-h1"  x="30" y="40">What decides a cache hit</text>
  <text class="cache-key-inputs-sub" x="30" y="64">Two conditions, and both must hold.</text>
  <g class="cache-key-inputs-stage cache-key-inputs-s0">
    <rect class="cache-key-inputs-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cache-key-inputs-step" x="44" y="142">01</text>
    <text class="cache-key-inputs-name" x="70" y="142">Every layer above was reused</text>
    <text class="cache-key-inputs-desc" x="44" y="166">A layer is a diff against a</text>
    <text class="cache-key-inputs-desc" x="44" y="182">specific parent. A new parent</text>
    <text class="cache-key-inputs-desc" x="44" y="198">has nothing to attach to.</text>
  </g>
  <line class="cache-key-inputs-line cache-key-inputs-conn cache-key-inputs-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cache-key-inputs-tip)"/>
  <g class="cache-key-inputs-stage cache-key-inputs-s1">
    <rect class="cache-key-inputs-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cache-key-inputs-step" x="280" y="142">02</text>
    <text class="cache-key-inputs-name" x="306" y="142">Its own inputs are unchanged</text>
    <text class="cache-key-inputs-desc" x="280" y="166">For most instructions, the</text>
    <text class="cache-key-inputs-desc" x="280" y="182">instruction text.</text>
  </g>
  <line class="cache-key-inputs-line cache-key-inputs-conn cache-key-inputs-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cache-key-inputs-tip)"/>
  <g class="cache-key-inputs-stage cache-key-inputs-s2">
    <rect class="cache-key-inputs-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cache-key-inputs-step" x="516" y="142">03</text>
    <text class="cache-key-inputs-name" x="542" y="142">For COPY and ADD, the file contents</text>
    <text class="cache-key-inputs-desc" x="516" y="166">Which is why those two decide</text>
    <text class="cache-key-inputs-desc" x="516" y="182">your build time.</text>
    <text class="cache-key-inputs-edge" x="516" y="242">file hash</text>
  </g>
  <line class="cache-key-inputs-line cache-key-inputs-conn cache-key-inputs-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cache-key-inputs-tip)"/>
  <g class="cache-key-inputs-stage cache-key-inputs-s3">
    <rect class="cache-key-inputs-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cache-key-inputs-step" x="752" y="142">04</text>
    <text class="cache-key-inputs-name" x="778" y="142">So COPY . . poisons everything below it</text>
    <text class="cache-key-inputs-desc" x="752" y="166">Every later layer now depends on</text>
    <text class="cache-key-inputs-desc" x="752" y="182">every file in the project.</text>
    <text class="cache-key-inputs-edge" x="752" y="242">the rule</text>
  </g>
  <text class="cache-key-inputs-sub" x="30" y="304">The first condition is the counter-intuitive one: a layer whose own inputs are identical still rebuilds if anything above it changed, because a filesystem diff is meaningless without the exact parent it was computed against.</text>
</svg>
