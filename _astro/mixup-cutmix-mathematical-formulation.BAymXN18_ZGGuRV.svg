<svg role="img" aria-label="Mathematical and visual formulation of MixUp and CutMix image regularizers blending pixels and interpolating class probability targets" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>MixUp and CutMix Visual &amp; Mathematical Formulations</title>
  <defs>
    <linearGradient id="bg214b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card214b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg214b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MIXUP &amp; CUTMIX REGULARIZATION FORMULATIONS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Enforcing Linear Decision Boundaries and Robustness to Occlusion</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card214b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: MixUp -->
    <rect x="25" y="25" width="345" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="197" y="48" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">MixUp (Zhang et al., 2017)</text>
    
    <rect x="45" y="65" width="305" height="85" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="197" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Pixel-Wise Convex Combination</text>
    <text x="197" y="115" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">x_tilde = lambda * x_i + (1 - lambda) * x_j</text>
    <text x="197" y="135" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">y_tilde = lambda * y_i + (1 - lambda) * y_j</text>
    
    <text x="197" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">lambda ~ Beta(alpha, alpha) [e.g. alpha = 0.2]</text>
    <text x="197" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">Smooths decision surface between classes</text>
    <text x="197" y="215" fill="#cbd5e1" font-size="8" text-anchor="middle">Eliminates overconfident erroneous predictions</text>
    <text x="197" y="245" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Alpha = 0.2 produces subtle ghosting blends</text>

    <!-- Right: CutMix -->
    <rect x="390" y="25" width="345" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="562" y="48" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">CutMix (Yun et al., 2019)</text>
    
    <rect x="410" y="65" width="305" height="85" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="562" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Spatial Patch Replacement</text>
    <text x="562" y="115" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">x_tilde = M * x_i + (1 - M) * x_j</text>
    <text x="562" y="135" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">y_tilde = lambda * y_i + (1 - lambda) * y_j</text>
    
    <text x="562" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">M is a binary bounding box mask (Patch)</text>
    <text x="562" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">lambda = 1 - (Box Area / Image Area)</text>
    <text x="562" y="215" fill="#cbd5e1" font-size="8" text-anchor="middle">Prevents focus on isolated single salient features</text>
    <text x="562" y="245" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Forces model to detect distributed cues</text>
  </g>
</svg>
