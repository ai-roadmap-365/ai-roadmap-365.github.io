<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Only one is differentiable.">
  <title>Soft attention, or hard selection</title>
  <style>
    .soft-or-hard-bg   { fill: #f8fafc; }
    .soft-or-hard-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soft-or-hard-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soft-or-hard-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soft-or-hard-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soft-or-hard-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soft-or-hard-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .soft-or-hard-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .soft-or-hard-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .soft-or-hard-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .soft-or-hard-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .soft-or-hard-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .soft-or-hard-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .soft-or-hard-row { opacity: 1; }
    .soft-or-hard-r0 { animation-delay: 0.00s; }
    .soft-or-hard-r1 { animation-delay: 0.45s; }
    .soft-or-hard-r2 { animation-delay: 0.90s; }
    .soft-or-hard-r3 { animation-delay: 1.35s; }
    .soft-or-hard-r4 { animation-delay: 1.80s; }
    .soft-or-hard-row { animation: soft-or-hard-reveal 7.3s ease-in-out infinite; }
    @keyframes soft-or-hard-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="soft-or-hard-bg" width="980" height="390"/>
  <text class="soft-or-hard-h1"  x="30" y="40">Soft attention, or hard selection</text>
  <text class="soft-or-hard-sub" x="30" y="64">Only one is differentiable.</text>
  <rect class="soft-or-hard-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="soft-or-hard-name" x="46" y="122">Soft attention</text>
  <text class="soft-or-hard-desc" x="46" y="142">Fractional weights.</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r0" x="46" y="182">Every position gets some weight</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r1" x="46" y="216">Weights sum to one</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r2" x="46" y="250">Fully differentiable</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r3" x="46" y="284">Trains by ordinary backpropagation</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r4" x="46" y="318">And blends several sources</text>
  <rect class="soft-or-hard-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="soft-or-hard-name" x="526" y="122">Hard selection</text>
  <text class="soft-or-hard-desc" x="526" y="142">One position, chosen.</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r0" x="526" y="182">An argmax over positions</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r1" x="526" y="216">No gradient through the choice</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r2" x="526" y="250">Needs reinforcement learning or a relaxation</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r3" x="526" y="284">Sharper, and much harder to train</text>
  <text class="soft-or-hard-desc soft-or-hard-row soft-or-hard-r4" x="526" y="318">Rarely used in practice</text>
  <text class="soft-or-hard-sub" x="30" y="372">Differentiability is why soft attention won: making the lookup fractional turns a discrete decision into something gradient descent can optimise directly.</text>
</svg>
