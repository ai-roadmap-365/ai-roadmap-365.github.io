<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Unified Enterprise AI Security Architecture Topology">
  <title>Unified Enterprise AI Security Architecture Topology</title>
  <defs>
    <style>
      .d350a-bg { fill: #f8fafc; }
      .d350a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d350a-gtw { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d350a-inf { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d350a-sec { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d350a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d350a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d350a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d350a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d350a-bg" />
  
  <text x="40" y="40" class="d350a-title">Unified Enterprise AI Security Architecture</text>
  <text x="40" y="65" class="d350a-subtitle">Unified Enterprise AI Security Architecture Topology showing Client Ingress, Multi-Layer Security Gateway (Firewall, PII Vault, Canary), SafeTensors Inference Engine, Scoped Agent Sandbox, and Governance Audit Logger</text>
  
  <!-- Security Gateway -->
  <rect x="40" y="110" width="260" height="270" class="d350a-gtw" />
  <text x="55" y="145" class="d350a-header" fill="#1d4ed8">1. AI Security Gateway</text>
  <text x="55" y="180" class="d350a-text">• Prompt Injection Firewall</text>
  <text x="55" y="205" class="d350a-text">• XML Delimiter Enclosure</text>
  <text x="55" y="230" class="d350a-text">• Zero-Knowledge PII Vault</text>
  <text x="55" y="255" class="d350a-text">• Session Canary Injector</text>
  <text x="55" y="295" class="d350a-text" font-weight="600" fill="#1d4ed8">Trust Boundary Perimeter</text>
  <text x="55" y="320" class="d350a-text">Sanitizes all ingress &amp; egress</text>
  
  <!-- Inference & Supply Chain -->
  <rect x="320" y="110" width="260" height="270" class="d350a-inf" />
  <text x="335" y="145" class="d350a-header" fill="#15803d">2. Hardened Serving Layer</text>
  <text x="335" y="180" class="d350a-text">• Signed SafeTensors Weights</text>
  <text x="335" y="205" class="d350a-text">• ModelScan AST Validated</text>
  <text x="335" y="230" class="d350a-text">• Dual-LLM Quarantine Unit</text>
  <text x="335" y="255" class="d350a-text">• Outbound Canary Interceptor</text>
  <text x="335" y="295" class="d350a-text" font-weight="600" fill="#15803d">Zero-RCE Inference</text>
  <text x="335" y="320" class="d350a-text">Prevents memory &amp; code exploits</text>
  
  <!-- Backend & Governance -->
  <rect x="600" y="110" width="260" height="270" class="d350a-sec" />
  <text x="615" y="145" class="d350a-header" fill="#7e22ce">3. Scoped Tools &amp; Audit</text>
  <text x="615" y="180" class="d350a-text">• Parameterized Read-Only DB</text>
  <text x="615" y="205" class="d350a-text">• Human-in-the-Loop Kill Switch</text>
  <text x="615" y="230" class="d350a-text">• Automated Red Team Harvester</text>
  <text x="615" y="255" class="d350a-text">• EU AI Act &amp; Model Card Logs</text>
  <text x="615" y="295" class="d350a-text" font-weight="600" fill="#7e22ce">Continuous Governance</text>
  <text x="615" y="320" class="d350a-text">100% Audit Readiness</text>
</svg>