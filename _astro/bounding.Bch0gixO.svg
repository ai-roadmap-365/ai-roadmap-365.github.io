<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four limits.">
  <title>Bounding the work</title>
  <style>
    .bounding-bg   { fill: #f8fafc; }
    .bounding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bounding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bounding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bounding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bounding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bounding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bounding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bounding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bounding-stage { opacity: 1; }

    .bounding-s0 { animation-delay: 0.00s; }
    .bounding-e0 { animation-delay: 0.00s; }
    .bounding-s1 { animation-delay: 1.28s; }
    .bounding-e1 { animation-delay: 1.28s; }
    .bounding-s2 { animation-delay: 2.56s; }
    .bounding-e2 { animation-delay: 2.56s; }
    .bounding-s3 { animation-delay: 3.84s; }
    .bounding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bounding-conn  { animation: bounding-trace 6.4s ease-in-out infinite; }
      .bounding-stage { animation: bounding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bounding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bounding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bounding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bounding-stage { animation: bounding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bounding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bounding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bounding-bg" width="980" height="322"/>
  <text class="bounding-h1"  x="30" y="40">Bounding the work</text>
  <text class="bounding-sub" x="30" y="64">Four limits.</text>
  <g class="bounding-stage bounding-s0">
    <rect class="bounding-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bounding-step" x="44" y="142">01</text>
    <text class="bounding-name" x="70" y="142">Cap the pages processed per document</text>
    <text class="bounding-desc" x="44" y="166">A ten-thousand-page file is</text>
    <text class="bounding-desc" x="44" y="182">usually a mistake.</text>
  </g>
  <line class="bounding-line bounding-conn bounding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bounding-tip)"/>
  <g class="bounding-stage bounding-s1">
    <rect class="bounding-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bounding-step" x="280" y="142">02</text>
    <text class="bounding-name" x="306" y="142">Cap the time per document</text>
    <text class="bounding-desc" x="280" y="166">And abandon it when exceeded,</text>
    <text class="bounding-desc" x="280" y="182">rather than waiting.</text>
  </g>
  <line class="bounding-line bounding-conn bounding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bounding-tip)"/>
  <g class="bounding-stage bounding-s2">
    <rect class="bounding-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bounding-step" x="516" y="142">03</text>
    <text class="bounding-name" x="542" y="142">Cap memory, in a separate process</text>
    <text class="bounding-desc" x="516" y="166">So a malformed file cannot take</text>
    <text class="bounding-desc" x="516" y="182">the pipeline with it.</text>
  </g>
  <line class="bounding-line bounding-conn bounding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bounding-tip)"/>
  <g class="bounding-stage bounding-s3">
    <rect class="bounding-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bounding-step" x="752" y="142">04</text>
    <text class="bounding-name" x="778" y="142">And record every abandonment</text>
    <text class="bounding-desc" x="752" y="166">With the reason, so the pattern</text>
    <text class="bounding-desc" x="752" y="182">is visible.</text>
  </g>
  <text class="bounding-sub" x="30" y="304">Recording abandonments rather than silently skipping is what makes this operable: a pipeline that quietly drops difficult files reports full success while losing content.</text>
</svg>
