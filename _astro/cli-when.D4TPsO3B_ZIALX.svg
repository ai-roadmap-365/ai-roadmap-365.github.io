<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when something else does.">
  <title>When a command-line assistant fits</title>
  <style>
    .cli-when-bg   { fill: #f8fafc; }
    .cli-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cli-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cli-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cli-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cli-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cli-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-when-row { opacity: 1; }
    .cli-when-r0 { animation-delay: 0.00s; }
    .cli-when-r1 { animation-delay: 0.45s; }
    .cli-when-r2 { animation-delay: 0.90s; }
    .cli-when-r3 { animation-delay: 1.35s; }
    .cli-when-r4 { animation-delay: 1.80s; }
    .cli-when-row { animation: cli-when-reveal 7.3s ease-in-out infinite; }
    @keyframes cli-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cli-when-bg" width="980" height="390"/>
  <text class="cli-when-h1"  x="30" y="40">When a command-line assistant fits</text>
  <text class="cli-when-sub" x="30" y="64">And when something else does.</text>
  <rect class="cli-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cli-when-name" x="46" y="122">A command-line assistant</text>
  <text class="cli-when-desc" x="46" y="142">Four cases.</text>
  <text class="cli-when-desc cli-when-row cli-when-r0" x="46" y="182">Developer and operator workflows</text>
  <text class="cli-when-desc cli-when-row cli-when-r1" x="46" y="216">Where the work is already in a terminal</text>
  <text class="cli-when-desc cli-when-row cli-when-r2" x="46" y="250">Local files and local tools</text>
  <text class="cli-when-desc cli-when-row cli-when-r3" x="46" y="284">Scriptable and composable use</text>
  <text class="cli-when-desc cli-when-row cli-when-r4" x="46" y="318">Where a person supervises each action</text>
  <rect class="cli-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cli-when-name" x="526" y="122">Something else</text>
  <text class="cli-when-desc" x="526" y="142">Also four.</text>
  <text class="cli-when-desc cli-when-row cli-when-r0" x="526" y="182">Non-technical users</text>
  <text class="cli-when-desc cli-when-row cli-when-r1" x="526" y="216">Anything needing rich display</text>
  <text class="cli-when-desc cli-when-row cli-when-r2" x="526" y="250">Unattended or scheduled work</text>
  <text class="cli-when-desc cli-when-row cli-when-r3" x="526" y="284">Multi-user or shared access</text>
  <text class="cli-when-desc cli-when-row cli-when-r4" x="526" y="318">Where a service or interface fits better</text>
  <text class="cli-when-sub" x="30" y="372">Unattended operation is the case to be most careful with: an assistant designed around a person confirming actions becomes a very different risk once nobody is watching.</text>
</svg>
