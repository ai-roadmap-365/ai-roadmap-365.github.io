<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The most consequential string mistake there is.">
  <title>Never build a command from a string</title>
  <style>
    .injection-by-concatenation-bg   { fill: #f8fafc; }
    .injection-by-concatenation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-by-concatenation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-by-concatenation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-by-concatenation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-by-concatenation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-by-concatenation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-by-concatenation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-by-concatenation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-by-concatenation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-by-concatenation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-by-concatenation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-by-concatenation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-by-concatenation-row { opacity: 1; }
    .injection-by-concatenation-r0 { animation-delay: 0.00s; }
    .injection-by-concatenation-r1 { animation-delay: 0.45s; }
    .injection-by-concatenation-r2 { animation-delay: 0.90s; }
    .injection-by-concatenation-r3 { animation-delay: 1.35s; }
    .injection-by-concatenation-r4 { animation-delay: 1.80s; }
    .injection-by-concatenation-row { animation: injection-by-concatenation-reveal 7.3s ease-in-out infinite; }
    @keyframes injection-by-concatenation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="injection-by-concatenation-bg" width="980" height="390"/>
  <text class="injection-by-concatenation-h1"  x="30" y="40">Never build a command from a string</text>
  <text class="injection-by-concatenation-sub" x="30" y="64">The most consequential string mistake there is.</text>
  <rect class="injection-by-concatenation-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="injection-by-concatenation-name" x="46" y="122">Concatenated</text>
  <text class="injection-by-concatenation-desc" x="46" y="142">Data becomes code.</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r0" x="46" y="182">f"SELECT * FROM t WHERE id = {user}"</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r1" x="46" y="216">The input is parsed as part of the query</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r2" x="46" y="250">A crafted value changes what runs</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r3" x="46" y="284">Same shape in shell commands</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r4" x="46" y="318">This is injection, in every language</text>
  <rect class="injection-by-concatenation-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="injection-by-concatenation-name" x="526" y="122">Parameterised</text>
  <text class="injection-by-concatenation-desc" x="526" y="142">Data stays data.</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r0" x="526" y="182">cursor.execute(sql, (user,))</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r1" x="526" y="216">The value is never parsed as syntax</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r2" x="526" y="250">No escaping to get right</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r3" x="526" y="284">subprocess with a LIST, not a string</text>
  <text class="injection-by-concatenation-desc injection-by-concatenation-row injection-by-concatenation-r4" x="526" y="318">Safe by construction, not by care</text>
  <text class="injection-by-concatenation-sub" x="30" y="372">Escaping by hand is the wrong fix, because it puts you in the business of anticipating every character. Keeping data out of the syntax entirely removes the question.</text>
</svg>
