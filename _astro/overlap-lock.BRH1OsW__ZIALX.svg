<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A five-minute schedule and a six-minute job.">
  <title>When a job runs alongside itself</title>
  <style>
    .overlap-lock-bg   { fill: #f8fafc; }
    .overlap-lock-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-lock-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-lock-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-lock-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-lock-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-lock-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .overlap-lock-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .overlap-lock-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .overlap-lock-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .overlap-lock-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .overlap-lock-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .overlap-lock-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .overlap-lock-row { opacity: 1; }
    .overlap-lock-r0 { animation-delay: 0.00s; }
    .overlap-lock-r1 { animation-delay: 0.45s; }
    .overlap-lock-r2 { animation-delay: 0.90s; }
    .overlap-lock-r3 { animation-delay: 1.35s; }
    .overlap-lock-r4 { animation-delay: 1.80s; }
    .overlap-lock-row { animation: overlap-lock-reveal 7.3s ease-in-out infinite; }
    @keyframes overlap-lock-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="overlap-lock-bg" width="980" height="390"/>
  <text class="overlap-lock-h1"  x="30" y="40">When a job runs alongside itself</text>
  <text class="overlap-lock-sub" x="30" y="64">A five-minute schedule and a six-minute job.</text>
  <rect class="overlap-lock-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="overlap-lock-name" x="46" y="122">No lock</text>
  <text class="overlap-lock-desc" x="46" y="142">Runs accumulate.</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r0" x="46" y="182">Run 2 starts while run 1 is still going</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r1" x="46" y="216">Both write the same output file</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r2" x="46" y="250">Both hold the same connections</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r3" x="46" y="284">Load grows; each run gets slower</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r4" x="46" y="318">Eventually ten copies, and a dead machine</text>
  <rect class="overlap-lock-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="overlap-lock-name" x="526" y="122">With a lock</text>
  <text class="overlap-lock-desc" x="526" y="142">One at a time, guaranteed.</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r0" x="526" y="182">Run 2 finds the lock and exits immediately</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r1" x="526" y="216">It logs that it skipped, and why</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r2" x="526" y="250">Output is written by exactly one process</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r3" x="526" y="284">Load stays flat</text>
  <text class="overlap-lock-desc overlap-lock-row overlap-lock-r4" x="526" y="318">A stale lock is cleared on exit by trap</text>
  <text class="overlap-lock-sub" x="30" y="372">flock on Linux does this in one line. The important part is deciding what a skipped run means: usually fine, occasionally the thing you needed to know about.</text>
</svg>
