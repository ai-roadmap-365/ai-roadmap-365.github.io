<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are cultural.">
  <title>Four consequences of the workflow view</title>
  <style>
    .workflow-implications-bg   { fill: #f8fafc; }
    .workflow-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workflow-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workflow-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workflow-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workflow-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workflow-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .workflow-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .workflow-implications-stage { opacity: 1; }

    .workflow-implications-s0 { animation-delay: 0.00s; }
    .workflow-implications-e0 { animation-delay: 0.00s; }
    .workflow-implications-s1 { animation-delay: 1.28s; }
    .workflow-implications-e1 { animation-delay: 1.28s; }
    .workflow-implications-s2 { animation-delay: 2.56s; }
    .workflow-implications-e2 { animation-delay: 2.56s; }
    .workflow-implications-s3 { animation-delay: 3.84s; }
    .workflow-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .workflow-implications-conn  { animation: workflow-implications-trace 6.4s ease-in-out infinite; }
      .workflow-implications-stage { animation: workflow-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes workflow-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes workflow-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .workflow-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .workflow-implications-stage { animation: workflow-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes workflow-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="workflow-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="workflow-implications-bg" width="980" height="322"/>
  <text class="workflow-implications-h1"  x="30" y="40">Four consequences of the workflow view</text>
  <text class="workflow-implications-sub" x="30" y="64">Two are cultural.</text>
  <g class="workflow-implications-stage workflow-implications-s0">
    <rect class="workflow-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="workflow-implications-step" x="44" y="142">01</text>
    <text class="workflow-implications-name" x="70" y="142">Results become true rather than merely reported</text>
    <text class="workflow-implications-desc" x="44" y="166">Which is the point of the</text>
    <text class="workflow-implications-desc" x="44" y="182">ordering.</text>
  </g>
  <line class="workflow-implications-line workflow-implications-conn workflow-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#workflow-implications-tip)"/>
  <g class="workflow-implications-stage workflow-implications-s1">
    <rect class="workflow-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="workflow-implications-step" x="280" y="142">02</text>
    <text class="workflow-implications-name" x="306" y="142">And iteration gets faster, not slower</text>
    <text class="workflow-implications-desc" x="280" y="166">Because failures localise</text>
    <text class="workflow-implications-desc" x="280" y="182">immediately.</text>
  </g>
  <line class="workflow-implications-line workflow-implications-conn workflow-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#workflow-implications-tip)"/>
  <g class="workflow-implications-stage workflow-implications-s2">
    <rect class="workflow-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="workflow-implications-step" x="516" y="142">03</text>
    <text class="workflow-implications-name" x="542" y="142">Handover becomes possible</text>
    <text class="workflow-implications-desc" x="516" y="166">Someone else can run and modify</text>
    <text class="workflow-implications-desc" x="516" y="182">it.</text>
  </g>
  <line class="workflow-implications-line workflow-implications-conn workflow-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#workflow-implications-tip)"/>
  <g class="workflow-implications-stage workflow-implications-s3">
    <rect class="workflow-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="workflow-implications-step" x="752" y="142">04</text>
    <text class="workflow-implications-name" x="778" y="142">While planning reflects where effort actually goes</text>
    <text class="workflow-implications-desc" x="752" y="166">Which is not the modelling</text>
    <text class="workflow-implications-desc" x="752" y="182">stage.</text>
  </g>
  <text class="workflow-implications-sub" x="30" y="304">Faster iteration is the counter-intuitive benefit: the discipline feels like overhead and pays for itself the first time a failure localises in seconds.</text>
</svg>
