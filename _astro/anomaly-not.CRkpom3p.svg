<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What anomaly detection is not</title>
  <style>
    .anomaly-not-bg   { fill: #f8fafc; }
    .anomaly-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .anomaly-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .anomaly-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .anomaly-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .anomaly-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .anomaly-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .anomaly-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .anomaly-not-row { opacity: 1; }
    .anomaly-not-r0 { animation-delay: 0.00s; }
    .anomaly-not-r1 { animation-delay: 0.45s; }
    .anomaly-not-r2 { animation-delay: 0.90s; }
    .anomaly-not-r3 { animation-delay: 1.35s; }
    .anomaly-not-r4 { animation-delay: 1.80s; }
    .anomaly-not-row { animation: anomaly-not-reveal 7.3s ease-in-out infinite; }
    @keyframes anomaly-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="anomaly-not-bg" width="980" height="390"/>
  <text class="anomaly-not-h1"  x="30" y="40">What anomaly detection is not</text>
  <text class="anomaly-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="anomaly-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="anomaly-not-name" x="46" y="122">The misconception</text>
  <text class="anomaly-not-desc" x="46" y="142">Commonly held.</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r0" x="46" y="182">Anomalous means problematic</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r1" x="46" y="216">It replaces a classifier when labels are scarce</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r2" x="46" y="250">The contamination parameter is a detail</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r3" x="46" y="284">Anomalies are always outliers in one feature</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r4" x="46" y="318">A high score justifies an action</text>
  <rect class="anomaly-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="anomaly-not-name" x="526" y="122">What is true</text>
  <text class="anomaly-not-desc" x="526" y="142">Actually.</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r0" x="526" y="182">It means unusual; most are benign</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r1" x="526" y="216">It answers a different question</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r2" x="526" y="250">It sets the threshold, and shifts everything</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r3" x="526" y="284">Most are unusual combinations, not extreme values</text>
  <text class="anomaly-not-desc anomaly-not-row anomaly-not-r4" x="526" y="318">It justifies a look, not a decision</text>
  <text class="anomaly-not-sub" x="30" y="372">Most real anomalies are ordinary values in an unusual combination, which is why single-feature threshold rules miss the cases that matter.</text>
</svg>
