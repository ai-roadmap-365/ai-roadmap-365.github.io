<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The foundation-model shift, in vision.">
  <title>Promptable segmentation</title>
  <style>
    .foundation-vision-bg   { fill: #f8fafc; }
    .foundation-vision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .foundation-vision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .foundation-vision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .foundation-vision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .foundation-vision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .foundation-vision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .foundation-vision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .foundation-vision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .foundation-vision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .foundation-vision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .foundation-vision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .foundation-vision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .foundation-vision-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .foundation-vision-stage { opacity: 1; }

    .foundation-vision-s0 { animation-delay: 0.00s; }
    .foundation-vision-e0 { animation-delay: 0.00s; }
    .foundation-vision-s1 { animation-delay: 1.28s; }
    .foundation-vision-e1 { animation-delay: 1.28s; }
    .foundation-vision-s2 { animation-delay: 2.56s; }
    .foundation-vision-e2 { animation-delay: 2.56s; }
    .foundation-vision-s3 { animation-delay: 3.84s; }
    .foundation-vision-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .foundation-vision-conn  { animation: foundation-vision-trace 6.4s ease-in-out infinite; }
      .foundation-vision-stage { animation: foundation-vision-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes foundation-vision-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes foundation-vision-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .foundation-vision-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .foundation-vision-stage { animation: foundation-vision-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes foundation-vision-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="foundation-vision-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="foundation-vision-bg" width="980" height="322"/>
  <text class="foundation-vision-h1"  x="30" y="40">Promptable segmentation</text>
  <text class="foundation-vision-sub" x="30" y="64">The foundation-model shift, in vision.</text>
  <g class="foundation-vision-stage foundation-vision-s0">
    <rect class="foundation-vision-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="foundation-vision-step" x="44" y="142">01</text>
    <text class="foundation-vision-name" x="70" y="142">Traditionally: one model per task</text>
    <text class="foundation-vision-desc" x="44" y="166">Trained on annotated masks for</text>
    <text class="foundation-vision-desc" x="44" y="182">that specific domain.</text>
  </g>
  <line class="foundation-vision-line foundation-vision-conn foundation-vision-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#foundation-vision-tip)"/>
  <g class="foundation-vision-stage foundation-vision-s1">
    <rect class="foundation-vision-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="foundation-vision-step" x="280" y="142">02</text>
    <text class="foundation-vision-name" x="306" y="142">A promptable model instead</text>
    <text class="foundation-vision-desc" x="280" y="166">Trained on enormous mask data,</text>
    <text class="foundation-vision-desc" x="280" y="182">segmenting anything on request.</text>
  </g>
  <line class="foundation-vision-line foundation-vision-conn foundation-vision-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#foundation-vision-tip)"/>
  <g class="foundation-vision-stage foundation-vision-s2">
    <rect class="foundation-vision-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="foundation-vision-step" x="516" y="142">03</text>
    <text class="foundation-vision-name" x="542" y="142">Prompted by a point, a box, or text</text>
    <text class="foundation-vision-desc" x="516" y="166">Rather than retrained per class.</text>
    <text class="foundation-vision-edge" x="516" y="242">prompted</text>
  </g>
  <line class="foundation-vision-line foundation-vision-conn foundation-vision-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#foundation-vision-tip)"/>
  <g class="foundation-vision-stage foundation-vision-s3">
    <rect class="foundation-vision-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="foundation-vision-step" x="752" y="142">04</text>
    <text class="foundation-vision-name" x="778" y="142">And it segments without naming</text>
    <text class="foundation-vision-desc" x="752" y="166">It finds the region; classifying</text>
    <text class="foundation-vision-desc" x="752" y="182">it is still a separate step.</text>
  </g>
  <text class="foundation-vision-sub" x="30" y="304">The last point is the honest limitation: a promptable segmenter produces excellent masks and does not tell you what the object is, which is why it composes with a classifier rather than replacing one.</text>
</svg>
