<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is usable by a model.">
  <title>Two tools, same capability</title>
  <style>
    .tool-quality-bg   { fill: #f8fafc; }
    .tool-quality-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-quality-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-quality-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-quality-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-quality-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-quality-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-quality-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-quality-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-quality-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-quality-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-quality-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-quality-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-quality-row { opacity: 1; }
    .tool-quality-r0 { animation-delay: 0.00s; }
    .tool-quality-r1 { animation-delay: 0.45s; }
    .tool-quality-r2 { animation-delay: 0.90s; }
    .tool-quality-r3 { animation-delay: 1.35s; }
    .tool-quality-r4 { animation-delay: 1.80s; }
    .tool-quality-row { animation: tool-quality-reveal 7.3s ease-in-out infinite; }
    @keyframes tool-quality-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tool-quality-bg" width="980" height="390"/>
  <text class="tool-quality-h1"  x="30" y="40">Two tools, same capability</text>
  <text class="tool-quality-sub" x="30" y="64">One is usable by a model.</text>
  <rect class="tool-quality-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tool-quality-name" x="46" y="122">Vague and fragile</text>
  <text class="tool-quality-desc" x="46" y="142">Three unlabelled buttons.</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r0" x="46" y="182">No stated purpose</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r1" x="46" y="216">Parameters named A, B and C</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r2" x="46" y="250">No constraints, no enums</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r3" x="46" y="284">Errors are silent or empty</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r4" x="46" y="318">A wrong combination breaks the workpiece</text>
  <rect class="tool-quality-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tool-quality-name" x="526" y="122">Precise</text>
  <text class="tool-quality-desc" x="526" y="142">A labelled instrument.</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r0" x="526" y="182">"Measures distance between parallel walls"</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r1" x="526" y="216">surface: one of wood, drywall, concrete</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r2" x="526" y="250">Returns millimetres</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r3" x="526" y="284">"Reflective surface detected. Aim at matte."</text>
  <text class="tool-quality-desc tool-quality-row tool-quality-r4" x="526" y="318">The error tells the agent what to do next</text>
  <text class="tool-quality-sub" x="30" y="372">The error string is a prompt: it is read by the model on the next turn, so a message that names the constraint and the fix is worth more than a stack trace or a status code.</text>
</svg>
