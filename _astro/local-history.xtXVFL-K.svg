<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From compilation to one command.">
  <title>Four steps to easy local models</title>
  <style>
    .local-history-bg   { fill: #f8fafc; }
    .local-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .local-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .local-history-stage { opacity: 1; }

    .local-history-s0 { animation-delay: 0.00s; }
    .local-history-e0 { animation-delay: 0.00s; }
    .local-history-s1 { animation-delay: 1.28s; }
    .local-history-e1 { animation-delay: 1.28s; }
    .local-history-s2 { animation-delay: 2.56s; }
    .local-history-e2 { animation-delay: 2.56s; }
    .local-history-s3 { animation-delay: 3.84s; }
    .local-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .local-history-conn  { animation: local-history-trace 6.4s ease-in-out infinite; }
      .local-history-stage { animation: local-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes local-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes local-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .local-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .local-history-stage { animation: local-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes local-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="local-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="local-history-bg" width="980" height="322"/>
  <text class="local-history-h1"  x="30" y="40">Four steps to easy local models</text>
  <text class="local-history-sub" x="30" y="64">From compilation to one command.</text>
  <g class="local-history-stage local-history-s0">
    <rect class="local-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="local-history-step" x="44" y="142">01</text>
    <text class="local-history-name" x="70" y="142">Compile it yourself and hope</text>
    <text class="local-history-desc" x="44" y="166">Research code, undocumented</text>
    <text class="local-history-desc" x="44" y="182">dependencies.</text>
  </g>
  <line class="local-history-line local-history-conn local-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#local-history-tip)"/>
  <g class="local-history-stage local-history-s1">
    <rect class="local-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="local-history-step" x="280" y="142">02</text>
    <text class="local-history-name" x="306" y="142">Community quantisation made models fit</text>
    <text class="local-history-desc" x="280" y="166">On consumer hardware, for the</text>
    <text class="local-history-desc" x="280" y="182">first time.</text>
  </g>
  <line class="local-history-line local-history-conn local-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#local-history-tip)"/>
  <g class="local-history-stage local-history-s2">
    <rect class="local-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="local-history-step" x="516" y="142">03</text>
    <text class="local-history-name" x="542" y="142">Packaged runtimes handled templates and memory</text>
    <text class="local-history-desc" x="516" y="166">Which removed the quality traps.</text>
  </g>
  <line class="local-history-line local-history-conn local-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#local-history-tip)"/>
  <g class="local-history-stage local-history-s3">
    <rect class="local-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="local-history-step" x="752" y="142">04</text>
    <text class="local-history-name" x="778" y="142">And a standard API made them drop-in</text>
    <text class="local-history-desc" x="752" y="166">One command, and existing code</text>
    <text class="local-history-desc" x="752" y="182">works.</text>
  </g>
  <text class="local-history-sub" x="30" y="304">The step that mattered most for quality was the third: automatic template handling silently fixed the most common reason local models underperformed.</text>
</svg>
