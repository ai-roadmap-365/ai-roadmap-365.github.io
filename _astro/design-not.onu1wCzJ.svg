<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things design is not</title>
  <style>
    .design-not-bg   { fill: #f8fafc; }
    .design-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .design-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .design-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .design-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .design-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .design-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-not-row { opacity: 1; }
    .design-not-r0 { animation-delay: 0.00s; }
    .design-not-r1 { animation-delay: 0.45s; }
    .design-not-r2 { animation-delay: 0.90s; }
    .design-not-r3 { animation-delay: 1.35s; }
    .design-not-r4 { animation-delay: 1.80s; }
    .design-not-row { animation: design-not-reveal 7.3s ease-in-out infinite; }
    @keyframes design-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="design-not-bg" width="980" height="390"/>
  <text class="design-not-h1"  x="30" y="40">Four things design is not</text>
  <text class="design-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="design-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="design-not-name" x="46" y="122">The misconception</text>
  <text class="design-not-desc" x="46" y="142">Commonly held.</text>
  <text class="design-not-desc design-not-row design-not-r0" x="46" y="182">Design means deciding everything up front</text>
  <text class="design-not-desc design-not-row design-not-r1" x="46" y="216">More abstraction is better design</text>
  <text class="design-not-desc design-not-row design-not-r2" x="46" y="250">Design patterns are the goal</text>
  <text class="design-not-desc design-not-row design-not-r3" x="46" y="284">A design is finished once written</text>
  <text class="design-not-desc design-not-row design-not-r4" x="46" y="318">Small programs do not need design</text>
  <rect class="design-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="design-not-name" x="526" y="122">What is true</text>
  <text class="design-not-desc" x="526" y="142">Actually.</text>
  <text class="design-not-desc design-not-row design-not-r0" x="526" y="182">It means deciding the boundaries, then adjusting</text>
  <text class="design-not-desc design-not-row design-not-r1" x="526" y="216">Unnecessary abstraction is harder to read</text>
  <text class="design-not-desc design-not-row design-not-r2" x="526" y="250">They are vocabulary, not objectives</text>
  <text class="design-not-desc design-not-row design-not-r3" x="526" y="284">It changes as the requirements do</text>
  <text class="design-not-desc design-not-row design-not-r4" x="526" y="318">They grow, and the ones that lasted were designed</text>
  <text class="design-not-sub" x="30" y="372">Unnecessary abstraction being harder to read is the correction most worth making: indirection has a cost, and it should buy something specific.</text>
</svg>
