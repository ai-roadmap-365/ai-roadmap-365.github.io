<svg role="img" aria-label="Modular pure NumPy neural network training lifecycle loop showing mini batch sampling forward pass loss backward pass and optimizer update" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Pure NumPy Neural Network Training Lifecycle Architecture</title>
  <defs>
    <linearGradient id="bg201a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card201" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg201a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PURE NUMPY NEURAL NETWORK TRAINING LIFECYCLE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">The Complete End-to-End Object-Oriented Deep Learning Architecture</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card201)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Box 1: He Init -->
    <rect x="25" y="35" width="160" height="105" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="105" y="60" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. HE / XAVIER INIT</text>
    <text x="105" y="80" fill="#cbd5e1" font-size="9" text-anchor="middle">W = randn * sqrt(2/n)</text>
    <text x="105" y="98" fill="#cbd5e1" font-size="9" text-anchor="middle">b = zeros((n, 1))</text>
    <text x="105" y="118" fill="#94a3b8" font-size="8" text-anchor="middle">Prevents Vanish/Explode</text>

    <!-- Arrow 1 to 2 -->
    <line x1="185" y1="87" x2="215" y2="87" stroke="#38bdf8" stroke-width="2"/>

    <!-- Box 2: Forward Pass -->
    <rect x="215" y="35" width="160" height="105" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="295" y="60" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. FORWARD PASS</text>
    <text x="295" y="80" fill="#cbd5e1" font-size="9" text-anchor="middle">Z^[l] = W^[l]A^[l-1] + b^[l]</text>
    <text x="295" y="98" fill="#cbd5e1" font-size="9" text-anchor="middle">A^[l] = ReLU / Softmax</text>
    <text x="295" y="118" fill="#94a3b8" font-size="8" text-anchor="middle">Save Layer Caches</text>

    <!-- Arrow 2 to 3 -->
    <line x1="375" y1="87" x2="405" y2="87" stroke="#10b981" stroke-width="2"/>

    <!-- Box 3: Loss -->
    <rect x="405" y="35" width="160" height="105" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="485" y="60" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. LOSS EVALUATION</text>
    <text x="485" y="80" fill="#cbd5e1" font-size="9" text-anchor="middle">CCE = - (1/m) sum(Y ln A)</text>
    <text x="485" y="98" fill="#cbd5e1" font-size="9" text-anchor="middle">Accuracy = mean(y_hat == y)</text>
    <text x="485" y="118" fill="#94a3b8" font-size="8" text-anchor="middle">Track Epoch History</text>

    <!-- Arrow 3 to 4 -->
    <line x1="565" y1="87" x2="595" y2="87" stroke="#fbbf24" stroke-width="2"/>

    <!-- Box 4: Backward Pass -->
    <rect x="595" y="35" width="140" height="105" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="665" y="60" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. BACKPROPAGATION</text>
    <text x="665" y="80" fill="#cbd5e1" font-size="9" text-anchor="middle">dZ^[L] = A^[L] - Y</text>
    <text x="665" y="98" fill="#cbd5e1" font-size="9" text-anchor="middle">dW^[l] = (1/m) dZ A^T</text>
    <text x="665" y="118" fill="#94a3b8" font-size="8" text-anchor="middle">Exact Analytical Grads</text>

    <!-- Return Loop to Optimizer -->
    <path d="M 665 140 L 665 190 L 485 190 L 485 165" fill="none" stroke="#c084fc" stroke-width="2"/>

    <!-- Box 5: Optimizer Update -->
    <rect x="180" y="165" width="400" height="100" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/>
    <text x="380" y="190" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">5. OPTIMIZATION STEP (MOMENTUM / SGD)</text>
    <text x="380" y="212" fill="#cbd5e1" font-size="10" text-anchor="middle">V_dW = beta * V_dW + (1 - beta) * dW^[l]</text>
    <text x="380" y="232" fill="#cbd5e1" font-size="10" text-anchor="middle">W^[l] = W^[l] - alpha * V_dW | b^[l] = b^[l] - alpha * V_db</text>
    <text x="380" y="252" fill="#94a3b8" font-size="8" text-anchor="middle">Iterate Across Mini-Batches and Epochs until Convergence</text>
  </g>
</svg>
