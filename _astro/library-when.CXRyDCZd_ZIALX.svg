<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to write it yourself.">
  <title>When to use the library</title>
  <style>
    .library-when-bg   { fill: #f8fafc; }
    .library-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-when-row { opacity: 1; }
    .library-when-r0 { animation-delay: 0.00s; }
    .library-when-r1 { animation-delay: 0.45s; }
    .library-when-r2 { animation-delay: 0.90s; }
    .library-when-r3 { animation-delay: 1.35s; }
    .library-when-r4 { animation-delay: 1.80s; }
    .library-when-row { animation: library-when-reveal 7.3s ease-in-out infinite; }
    @keyframes library-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-when-bg" width="980" height="390"/>
  <text class="library-when-h1"  x="30" y="40">When to use the library</text>
  <text class="library-when-sub" x="30" y="64">And when to write it yourself.</text>
  <rect class="library-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-when-name" x="46" y="122">Use the library</text>
  <text class="library-when-desc" x="46" y="142">Almost always.</text>
  <text class="library-when-desc library-when-row library-when-r0" x="46" y="182">Any pretrained model</text>
  <text class="library-when-desc library-when-row library-when-r1" x="46" y="216">Standard fine-tuning</text>
  <text class="library-when-desc library-when-row library-when-r2" x="46" y="250">Production training and serving</text>
  <text class="library-when-desc library-when-row library-when-r3" x="46" y="284">Distributed training</text>
  <text class="library-when-desc library-when-row library-when-r4" x="46" y="318">Where the ecosystem exists</text>
  <rect class="library-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-when-name" x="526" y="122">Write it yourself</text>
  <text class="library-when-desc" x="526" y="142">Three reasons.</text>
  <text class="library-when-desc library-when-row library-when-r0" x="526" y="182">To understand the mechanics, once</text>
  <text class="library-when-desc library-when-row library-when-r1" x="526" y="216">Novel architectures the library does not model</text>
  <text class="library-when-desc library-when-row library-when-r2" x="526" y="250">Extreme constraints where the runtime is too heavy</text>
  <text class="library-when-desc library-when-row library-when-r3" x="526" y="284">Expect to reimplement much of it</text>
  <text class="library-when-desc library-when-row library-when-r4" x="526" y="318">And to lose on speed</text>
  <text class="library-when-sub" x="30" y="372">Novel architecture research is the one genuinely recurring reason: a library optimised for standard blocks makes an unusual block harder to express than writing the loop directly.</text>
</svg>
