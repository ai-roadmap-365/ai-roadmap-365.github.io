<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Still on your machine, still checked first.">
  <title>The file that overrides DNS entirely</title>
  <style>
    .hosts-file-wins-bg   { fill: #f8fafc; }
    .hosts-file-wins-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosts-file-wins-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosts-file-wins-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosts-file-wins-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosts-file-wins-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosts-file-wins-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hosts-file-wins-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hosts-file-wins-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hosts-file-wins-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hosts-file-wins-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hosts-file-wins-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hosts-file-wins-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hosts-file-wins-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hosts-file-wins-stage { opacity: 1; }

    .hosts-file-wins-s0 { animation-delay: 0.00s; }
    .hosts-file-wins-e0 { animation-delay: 0.00s; }
    .hosts-file-wins-s1 { animation-delay: 1.28s; }
    .hosts-file-wins-e1 { animation-delay: 1.28s; }
    .hosts-file-wins-s2 { animation-delay: 2.56s; }
    .hosts-file-wins-e2 { animation-delay: 2.56s; }
    .hosts-file-wins-s3 { animation-delay: 3.84s; }
    .hosts-file-wins-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hosts-file-wins-conn  { animation: hosts-file-wins-trace 6.4s ease-in-out infinite; }
      .hosts-file-wins-stage { animation: hosts-file-wins-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hosts-file-wins-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hosts-file-wins-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hosts-file-wins-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hosts-file-wins-stage { animation: hosts-file-wins-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hosts-file-wins-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hosts-file-wins-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hosts-file-wins-bg" width="980" height="322"/>
  <text class="hosts-file-wins-h1"  x="30" y="40">The file that overrides DNS entirely</text>
  <text class="hosts-file-wins-sub" x="30" y="64">Still on your machine, still checked first.</text>
  <g class="hosts-file-wins-stage hosts-file-wins-s0">
    <rect class="hosts-file-wins-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hosts-file-wins-step" x="44" y="142">01</text>
    <text class="hosts-file-wins-name" x="70" y="142">Your machine checks hosts first</text>
    <text class="hosts-file-wins-desc" x="44" y="166">/etc/hosts, or the Windows</text>
    <text class="hosts-file-wins-desc" x="44" y="182">equivalent. Before any resolver</text>
    <text class="hosts-file-wins-desc" x="44" y="198">is contacted.</text>
    <text class="hosts-file-wins-edge" x="44" y="242">first</text>
  </g>
  <line class="hosts-file-wins-line hosts-file-wins-conn hosts-file-wins-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hosts-file-wins-tip)"/>
  <g class="hosts-file-wins-stage hosts-file-wins-s1">
    <rect class="hosts-file-wins-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hosts-file-wins-step" x="280" y="142">02</text>
    <text class="hosts-file-wins-name" x="306" y="142">A match short-circuits everything</text>
    <text class="hosts-file-wins-desc" x="280" y="166">No DNS query is made at all. The</text>
    <text class="hosts-file-wins-desc" x="280" y="182">TTL is irrelevant.</text>
    <text class="hosts-file-wins-edge" x="280" y="242">no DNS</text>
  </g>
  <line class="hosts-file-wins-line hosts-file-wins-conn hosts-file-wins-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hosts-file-wins-tip)"/>
  <g class="hosts-file-wins-stage hosts-file-wins-s2">
    <rect class="hosts-file-wins-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hosts-file-wins-step" x="516" y="142">03</text>
    <text class="hosts-file-wins-name" x="542" y="142">Useful for testing</text>
    <text class="hosts-file-wins-desc" x="516" y="166">Point a real name at a new</text>
    <text class="hosts-file-wins-desc" x="516" y="182">server before changing the</text>
    <text class="hosts-file-wins-desc" x="516" y="198">record.</text>
  </g>
  <line class="hosts-file-wins-line hosts-file-wins-conn hosts-file-wins-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hosts-file-wins-tip)"/>
  <g class="hosts-file-wins-stage hosts-file-wins-s3">
    <rect class="hosts-file-wins-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hosts-file-wins-step" x="752" y="142">04</text>
    <text class="hosts-file-wins-name" x="778" y="142">And a source of deep confusion</text>
    <text class="hosts-file-wins-desc" x="752" y="166">An entry added months ago,</text>
    <text class="hosts-file-wins-desc" x="752" y="182">forgotten, overriding a name for</text>
    <text class="hosts-file-wins-desc" x="752" y="198">you and nobody else.</text>
  </g>
  <text class="hosts-file-wins-sub" x="30" y="304">When a name resolves differently for you than for everyone else, this file is the first thing to check — and dig will not tell you, because dig queries DNS directly and skips it.</text>
</svg>
