<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are costs.">
  <title>Four consequences of two-stage retrieval</title>
  <style>
    .hybrid-implications-bg   { fill: #f8fafc; }
    .hybrid-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hybrid-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hybrid-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hybrid-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hybrid-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hybrid-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hybrid-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hybrid-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hybrid-implications-stage { opacity: 1; }

    .hybrid-implications-s0 { animation-delay: 0.00s; }
    .hybrid-implications-e0 { animation-delay: 0.00s; }
    .hybrid-implications-s1 { animation-delay: 1.28s; }
    .hybrid-implications-e1 { animation-delay: 1.28s; }
    .hybrid-implications-s2 { animation-delay: 2.56s; }
    .hybrid-implications-e2 { animation-delay: 2.56s; }
    .hybrid-implications-s3 { animation-delay: 3.84s; }
    .hybrid-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hybrid-implications-conn  { animation: hybrid-implications-trace 6.4s ease-in-out infinite; }
      .hybrid-implications-stage { animation: hybrid-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hybrid-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hybrid-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hybrid-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hybrid-implications-stage { animation: hybrid-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hybrid-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hybrid-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hybrid-implications-bg" width="980" height="322"/>
  <text class="hybrid-implications-h1"  x="30" y="40">Four consequences of two-stage retrieval</text>
  <text class="hybrid-implications-sub" x="30" y="64">Two are costs.</text>
  <g class="hybrid-implications-stage hybrid-implications-s0">
    <rect class="hybrid-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-implications-step" x="44" y="142">01</text>
    <text class="hybrid-implications-name" x="70" y="142">Retrieval quality improves substantially</text>
    <text class="hybrid-implications-desc" x="44" y="166">More than most other single</text>
    <text class="hybrid-implications-desc" x="44" y="182">changes.</text>
  </g>
  <line class="hybrid-implications-line hybrid-implications-conn hybrid-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hybrid-implications-tip)"/>
  <g class="hybrid-implications-stage hybrid-implications-s1">
    <rect class="hybrid-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-implications-step" x="280" y="142">02</text>
    <text class="hybrid-implications-name" x="306" y="142">But two indexes must be maintained</text>
    <text class="hybrid-implications-desc" x="280" y="166">Kept in sync, and both rebuilt</text>
    <text class="hybrid-implications-desc" x="280" y="182">on corpus changes.</text>
  </g>
  <line class="hybrid-implications-line hybrid-implications-conn hybrid-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hybrid-implications-tip)"/>
  <g class="hybrid-implications-stage hybrid-implications-s2">
    <rect class="hybrid-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-implications-step" x="516" y="142">03</text>
    <text class="hybrid-implications-name" x="542" y="142">And reranking adds latency and compute</text>
    <text class="hybrid-implications-desc" x="516" y="166">Which grows with the candidate</text>
    <text class="hybrid-implications-desc" x="516" y="182">count.</text>
  </g>
  <line class="hybrid-implications-line hybrid-implications-conn hybrid-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hybrid-implications-tip)"/>
  <g class="hybrid-implications-stage hybrid-implications-s3">
    <rect class="hybrid-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-implications-step" x="752" y="142">04</text>
    <text class="hybrid-implications-name" x="778" y="142">With more parameters to tune</text>
    <text class="hybrid-implications-desc" x="752" y="166">Candidate depth, fusion</text>
    <text class="hybrid-implications-desc" x="752" y="182">weighting, final count.</text>
  </g>
  <text class="hybrid-implications-sub" x="30" y="304">Keeping two indexes synchronised is the operational cost that is easy to underestimate: a document deleted from one and not the other produces results nobody can explain.</text>
</svg>
