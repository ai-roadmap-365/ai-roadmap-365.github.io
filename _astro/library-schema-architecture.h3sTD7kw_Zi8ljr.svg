<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" role="img" aria-labelledby="d091a-title d091a-desc">
  <title id="d091a-title">The finished library schema: seven tables, their keys, constraints, indexes and cardinalities</title>
  <desc id="d091a-desc">An entity-relationship diagram of the schema the lesson designs from the Fenwick Road brief. Categories reference themselves through a nullable parent_id, making a tree. Books reference categories. Books and authors are joined through a book_authors junction table whose primary key is the pair and which carries an author_position column of its own. Loans reference both books and members. Reservations reference both books and members. Primary keys, unique constraints, foreign keys, check constraints, nullable columns and soft-delete columns are marked on every table, each relationship is labelled with its cardinality, and a panel at the foot lists the nine indexes and the rules the design follows.</desc>

  <style>
    .d091a-bg    { fill: #f8fafc; }
    .d091a-h1    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d091a-sub   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d091a-tname { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #ffffff; }
    .d091a-col   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d091a-key   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d091a-soft  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #b45309; }
    .d091a-card  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d091a-note  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d091a-nb    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1a202c; }
    .d091a-tbl   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d091a-junc  { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2.5; }
    .d091a-hdr   { fill: #1d4ed8; }
    .d091a-rel   { fill: none; stroke: #1d4ed8; stroke-width: 2; }
    .d091a-self  { fill: none; stroke: #047857; stroke-width: 2; }
    .d091a-panel { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="d091a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d091a-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
  </defs>

  <rect class="d091a-bg" x="0" y="0" width="1200" height="1060" />

  <text class="d091a-h1"  x="32" y="38">The Fenwick Road schema — seven tables, and every decision marked on them</text>
  <text class="d091a-sub" x="32" y="62">PK primary key · UQ unique · FK foreign key · CK check constraint · IX indexed · orange marks a nullable column that means something</text>
  <text class="d091a-sub" x="32" y="82">An arrow points from the child, which holds the foreign key, to the parent it references. Every arrow is many-to-one.</text>

  <!-- ================= categories ================= -->
  <rect class="d091a-tbl" x="40" y="110" width="250" height="128" rx="8" />
  <path class="d091a-hdr" d="M 40 118 a 8 8 0 0 1 8 -8 h 234 a 8 8 0 0 1 8 8 v 24 h -250 z" />
  <text class="d091a-tname" x="56" y="135">categories</text>
  <text class="d091a-key"  x="56" y="168">PK  category_id</text>
  <text class="d091a-col"  x="56" y="192">name        UQ with parent</text>
  <text class="d091a-soft" x="56" y="216">FK IX  parent_id    NULL = top</text>

  <!-- the self-reference that makes it a tree -->
  <path class="d091a-self" d="M 110 110 C 110 52, 230 52, 228 106" marker-end="url(#d091a-arrow-green)" />
  <text class="d091a-note" x="169" y="46" text-anchor="middle">parent_id points at another category: a tree, walked by a recursive CTE</text>

  <!-- ================= authors ================= -->
  <rect class="d091a-tbl" x="850" y="100" width="250" height="128" rx="8" />
  <path class="d091a-hdr" d="M 850 108 a 8 8 0 0 1 8 -8 h 234 a 8 8 0 0 1 8 8 v 24 h -250 z" />
  <text class="d091a-tname" x="866" y="125">authors</text>
  <text class="d091a-key"  x="866" y="158">PK  author_id</text>
  <text class="d091a-col"  x="866" y="182">name        NOT NULL</text>
  <text class="d091a-soft" x="866" y="206">birth_year  NULL = unknown</text>

  <!-- ================= books ================= -->
  <rect class="d091a-tbl" x="340" y="290" width="270" height="230" rx="8" />
  <path class="d091a-hdr" d="M 340 298 a 8 8 0 0 1 8 -8 h 254 a 8 8 0 0 1 8 8 v 24 h -270 z" />
  <text class="d091a-tname" x="356" y="315">books</text>
  <text class="d091a-key"  x="356" y="348">PK  book_id           surrogate</text>
  <text class="d091a-soft" x="356" y="372">UQ  isbn13   CK  NULL before 1970</text>
  <text class="d091a-col"  x="356" y="396">title                 NOT NULL</text>
  <text class="d091a-col"  x="356" y="420">published_year</text>
  <text class="d091a-key"  x="356" y="444">FK IX  category_id</text>
  <text class="d091a-col"  x="356" y="468">acquisition_cost_pence  INTEGER</text>
  <text class="d091a-soft" x="356" y="492">withdrawn_at   soft delete</text>

  <!-- books -> categories -->
  <path class="d091a-rel" d="M 400 290 L 400 200 L 297 200" marker-end="url(#d091a-arrow)" />
  <text class="d091a-card" x="348" y="192" text-anchor="middle">many · one</text>

  <!-- ================= book_authors (the junction) ================= -->
  <rect class="d091a-junc" x="700" y="290" width="250" height="128" rx="8" />
  <path class="d091a-hdr" d="M 700 298 a 8 8 0 0 1 8 -8 h 234 a 8 8 0 0 1 8 8 v 24 h -250 z" />
  <text class="d091a-tname" x="716" y="315">book_authors</text>
  <text class="d091a-key"  x="716" y="348">PK FK  book_id</text>
  <text class="d091a-key"  x="716" y="372">PK FK IX  author_id</text>
  <text class="d091a-col"  x="716" y="396">author_position  UQ per book</text>

  <!-- junction -> books -->
  <path class="d091a-rel" d="M 700 350 L 617 350" marker-end="url(#d091a-arrow)" />
  <text class="d091a-card" x="656" y="340" text-anchor="middle">many · one</text>
  <!-- junction -> authors -->
  <path class="d091a-rel" d="M 880 290 L 880 233" marker-end="url(#d091a-arrow)" />
  <text class="d091a-card" x="895" y="266">many · one</text>

  <text class="d091a-card" x="530" y="266" text-anchor="middle">books and authors are MANY-TO-MANY: two one-to-many relationships back to back</text>

  <text class="d091a-note" x="340" y="550">book_authors &#8212; the primary key is the PAIR, so the same author cannot be credited twice on one book.</text>
  <text class="d091a-note" x="340" y="572">author_position is the relationship&#8217;s OWN attribute. ON DELETE CASCADE to books; RESTRICT to authors.</text>

  <!-- ================= members ================= -->
  <rect class="d091a-tbl" x="40" y="590" width="240" height="200" rx="8" />
  <path class="d091a-hdr" d="M 40 598 a 8 8 0 0 1 8 -8 h 224 a 8 8 0 0 1 8 8 v 24 h -240 z" />
  <text class="d091a-tname" x="56" y="615">members</text>
  <text class="d091a-key"  x="56" y="648">PK  member_id   surrogate</text>
  <text class="d091a-col"  x="56" y="672">UQ  email       natural key</text>
  <text class="d091a-col"  x="56" y="696">full_name       NOT NULL</text>
  <text class="d091a-col"  x="56" y="720">CK  tier   3 values</text>
  <text class="d091a-col"  x="56" y="744">joined_at       NOT NULL</text>
  <text class="d091a-soft" x="56" y="768">left_at    soft delete</text>

  <!-- ================= loans ================= -->
  <rect class="d091a-tbl" x="380" y="590" width="270" height="224" rx="8" />
  <path class="d091a-hdr" d="M 380 598 a 8 8 0 0 1 8 -8 h 254 a 8 8 0 0 1 8 8 v 24 h -270 z" />
  <text class="d091a-tname" x="396" y="615">loans</text>
  <text class="d091a-key"  x="396" y="648">PK  loan_id</text>
  <text class="d091a-key"  x="396" y="672">FK IX  book_id      RESTRICT</text>
  <text class="d091a-key"  x="396" y="696">FK IX  member_id    RESTRICT</text>
  <text class="d091a-col"  x="396" y="720">borrowed_at   ISO 8601 UTC</text>
  <text class="d091a-col"  x="396" y="744">due_at   CK &gt; borrowed_at</text>
  <text class="d091a-soft" x="396" y="768">returned_at   NULL = still out</text>
  <text class="d091a-col"  x="396" y="792">fine_pence   INTEGER  CK &#8805; 0</text>

  <!-- loans -> books -->
  <path class="d091a-rel" d="M 470 590 L 470 527" marker-end="url(#d091a-arrow)" />
  <text class="d091a-card" x="485" y="562">many · one</text>
  <!-- loans -> members -->
  <path class="d091a-rel" d="M 380 700 L 287 700" marker-end="url(#d091a-arrow)" />
  <text class="d091a-card" x="333" y="690" text-anchor="middle">many · one</text>

  <!-- ================= reservations ================= -->
  <rect class="d091a-tbl" x="720" y="590" width="270" height="176" rx="8" />
  <path class="d091a-hdr" d="M 720 598 a 8 8 0 0 1 8 -8 h 254 a 8 8 0 0 1 8 8 v 24 h -270 z" />
  <text class="d091a-tname" x="736" y="615">reservations</text>
  <text class="d091a-key"  x="736" y="648">PK  reservation_id</text>
  <text class="d091a-key"  x="736" y="672">FK IX  book_id      CASCADE</text>
  <text class="d091a-key"  x="736" y="696">FK IX  member_id    CASCADE</text>
  <text class="d091a-col"  x="736" y="720">reserved_at   ISO 8601 UTC</text>
  <text class="d091a-col"  x="736" y="744">CK  status   4 values</text>

  <!-- reservations -> books -->
  <path class="d091a-rel" d="M 990 700 L 1070 700 L 1070 500 L 617 500" marker-end="url(#d091a-arrow)" />
  <text class="d091a-card" x="840" y="492" text-anchor="middle">many · one</text>
  <!-- reservations -> members -->
  <path class="d091a-rel" d="M 855 766 L 855 845 L 160 845 L 160 797" marker-end="url(#d091a-arrow)" />
  <text class="d091a-card" x="500" y="837" text-anchor="middle">many · one</text>

  <!-- ================= the notes panel ================= -->
  <rect class="d091a-panel" x="40" y="868" width="1120" height="172" rx="8" />
  <text class="d091a-nb"   x="60" y="894">The nine indexes, and why they are written by hand:</text>
  <text class="d091a-note" x="60" y="916">a foreign key creates NO index, so one is declared on every FK column — books(category_id), categories(parent_id), book_authors(author_id),</text>
  <text class="d091a-note" x="60" y="936">loans(book_id), loans(member_id), reservations(book_id), reservations(member_id) — plus two partial ones that exist for the questions rather than</text>
  <text class="d091a-note" x="60" y="956">the keys: loans(due_at) WHERE returned_at IS NULL, and UNIQUE reservations(book_id, member_id) WHERE status = &#8216;waiting&#8217;.</text>
  <text class="d091a-note" x="60" y="976">Two views name the soft-delete filters: current_collection and current_members. A view stores the query text, not its result.</text>
  <text class="d091a-nb"   x="60" y="1000">reservations has NO queue_position column.</text>
  <text class="d091a-note" x="452" y="1000">The position is derived at query time with ROW_NUMBER over reserved_at, because a stored one must be</text>
  <text class="d091a-note" x="60" y="1020">renumbered on every cancellation, forever, in every code path — a promise the database cannot enforce, and therefore not a promise.</text>
</svg>
