<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From arrays to labelled tables.">
  <title>Four steps toward data frames</title>
  <style>
    .df-history-bg   { fill: #f8fafc; }
    .df-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .df-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .df-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .df-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .df-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .df-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .df-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .df-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .df-history-stage { opacity: 1; }

    .df-history-s0 { animation-delay: 0.00s; }
    .df-history-e0 { animation-delay: 0.00s; }
    .df-history-s1 { animation-delay: 1.28s; }
    .df-history-e1 { animation-delay: 1.28s; }
    .df-history-s2 { animation-delay: 2.56s; }
    .df-history-e2 { animation-delay: 2.56s; }
    .df-history-s3 { animation-delay: 3.84s; }
    .df-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .df-history-conn  { animation: df-history-trace 6.4s ease-in-out infinite; }
      .df-history-stage { animation: df-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes df-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes df-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .df-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .df-history-stage { animation: df-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes df-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="df-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="df-history-bg" width="980" height="322"/>
  <text class="df-history-h1"  x="30" y="40">Four steps toward data frames</text>
  <text class="df-history-sub" x="30" y="64">From arrays to labelled tables.</text>
  <g class="df-history-stage df-history-s0">
    <rect class="df-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="df-history-step" x="44" y="142">01</text>
    <text class="df-history-name" x="70" y="142">Numeric arrays, fast but unlabelled</text>
    <text class="df-history-desc" x="44" y="166">Position was the only address.</text>
  </g>
  <line class="df-history-line df-history-conn df-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#df-history-tip)"/>
  <g class="df-history-stage df-history-s1">
    <rect class="df-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="df-history-step" x="280" y="142">02</text>
    <text class="df-history-name" x="306" y="142">Then labelled tables in statistical languages</text>
    <text class="df-history-desc" x="280" y="166">Which added names and types.</text>
  </g>
  <line class="df-history-line df-history-conn df-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#df-history-tip)"/>
  <g class="df-history-stage df-history-s2">
    <rect class="df-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="df-history-step" x="516" y="142">03</text>
    <text class="df-history-name" x="542" y="142">Then the same idea in Python, on top of arrays</text>
    <text class="df-history-desc" x="516" y="166">Which unified analysis and</text>
    <text class="df-history-desc" x="516" y="182">general programming.</text>
  </g>
  <line class="df-history-line df-history-conn df-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#df-history-tip)"/>
  <g class="df-history-stage df-history-s3">
    <rect class="df-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="df-history-step" x="752" y="142">04</text>
    <text class="df-history-name" x="778" y="142">And modern columnar backends underneath</text>
    <text class="df-history-desc" x="752" y="166">For larger data and better</text>
    <text class="df-history-desc" x="752" y="182">types.</text>
  </g>
  <text class="df-history-sub" x="30" y="304">Bringing labelled tables into a general-purpose language is what made the full pipeline possible in one place, from collection to modelling to serving.</text>
</svg>
