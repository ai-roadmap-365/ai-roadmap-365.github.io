<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Line-delimited records</title>
  <style>
    .jsonl-bg   { fill: #f8fafc; }
    .jsonl-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonl-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonl-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonl-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonl-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jsonl-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .jsonl-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .jsonl-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .jsonl-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .jsonl-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .jsonl-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .jsonl-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .jsonl-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .jsonl-stage { opacity: 1; }

    .jsonl-s0 { animation-delay: 0.00s; }
    .jsonl-e0 { animation-delay: 0.00s; }
    .jsonl-s1 { animation-delay: 1.28s; }
    .jsonl-e1 { animation-delay: 1.28s; }
    .jsonl-s2 { animation-delay: 2.56s; }
    .jsonl-e2 { animation-delay: 2.56s; }
    .jsonl-s3 { animation-delay: 3.84s; }
    .jsonl-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .jsonl-conn  { animation: jsonl-trace 6.4s ease-in-out infinite; }
      .jsonl-stage { animation: jsonl-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes jsonl-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes jsonl-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .jsonl-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .jsonl-stage { animation: jsonl-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes jsonl-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="jsonl-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="jsonl-bg" width="980" height="322"/>
  <text class="jsonl-h1"  x="30" y="40">Line-delimited records</text>
  <text class="jsonl-sub" x="30" y="64">Four properties.</text>
  <g class="jsonl-stage jsonl-s0">
    <rect class="jsonl-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="jsonl-step" x="44" y="142">01</text>
    <text class="jsonl-name" x="70" y="142">One complete record per line</text>
    <text class="jsonl-desc" x="44" y="166">Independently parseable.</text>
  </g>
  <line class="jsonl-line jsonl-conn jsonl-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#jsonl-tip)"/>
  <g class="jsonl-stage jsonl-s1">
    <rect class="jsonl-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="jsonl-step" x="280" y="142">02</text>
    <text class="jsonl-name" x="306" y="142">So the file streams without loading it whole</text>
    <text class="jsonl-desc" x="280" y="166">Which a single large array</text>
    <text class="jsonl-desc" x="280" y="182">cannot.</text>
  </g>
  <line class="jsonl-line jsonl-conn jsonl-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#jsonl-tip)"/>
  <g class="jsonl-stage jsonl-s2">
    <rect class="jsonl-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="jsonl-step" x="516" y="142">03</text>
    <text class="jsonl-name" x="542" y="142">And new records append without rewriting</text>
    <text class="jsonl-desc" x="516" y="166">Unlike a closing bracket.</text>
  </g>
  <line class="jsonl-line jsonl-conn jsonl-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#jsonl-tip)"/>
  <g class="jsonl-stage jsonl-s3">
    <rect class="jsonl-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="jsonl-step" x="752" y="142">04</text>
    <text class="jsonl-name" x="778" y="142">While a truncated file loses only the last line</text>
    <text class="jsonl-desc" x="752" y="166">Rather than becoming</text>
    <text class="jsonl-desc" x="752" y="182">unparseable.</text>
  </g>
  <text class="jsonl-sub" x="30" y="304">Partial recovery is why training corpora use this format: a hundred-gigabyte file cut short by a failed job is still almost entirely usable.</text>
</svg>
