<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same data.">
  <title>The leaky run against the honest one</title>
  <style>
    .leaky-honest-154-bg   { fill: #f8fafc; }
    .leaky-honest-154-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-154-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-154-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-154-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-154-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-154-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leaky-honest-154-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leaky-honest-154-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leaky-honest-154-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leaky-honest-154-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leaky-honest-154-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leaky-honest-154-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leaky-honest-154-row { opacity: 1; }
    .leaky-honest-154-r0 { animation-delay: 0.00s; }
    .leaky-honest-154-r1 { animation-delay: 0.45s; }
    .leaky-honest-154-r2 { animation-delay: 0.90s; }
    .leaky-honest-154-r3 { animation-delay: 1.35s; }
    .leaky-honest-154-r4 { animation-delay: 1.80s; }
    .leaky-honest-154-row { animation: leaky-honest-154-reveal 7.3s ease-in-out infinite; }
    @keyframes leaky-honest-154-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="leaky-honest-154-bg" width="980" height="390"/>
  <text class="leaky-honest-154-h1"  x="30" y="40">The leaky run against the honest one</text>
  <text class="leaky-honest-154-sub" x="30" y="64">Same data.</text>
  <rect class="leaky-honest-154-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="leaky-honest-154-name" x="46" y="122">The leaky run</text>
  <text class="leaky-honest-154-desc" x="46" y="142">Better number.</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r0" x="46" y="182">Scaling fitted before the split</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r1" x="46" y="216">Model selected on the test set</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r2" x="46" y="250">No interval reported</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r3" x="46" y="284">A visibly better error figure</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r4" x="46" y="318">Which deployment will not reproduce</text>
  <rect class="leaky-honest-154-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="leaky-honest-154-name" x="526" y="122">The honest run</text>
  <text class="leaky-honest-154-desc" x="526" y="142">True number.</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r0" x="526" y="182">Everything fitted inside the fold</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r1" x="526" y="216">Selection on validation only</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r2" x="526" y="250">A bootstrap interval on the margin</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r3" x="526" y="284">A worse figure, and a defensible one</text>
  <text class="leaky-honest-154-desc leaky-honest-154-row leaky-honest-154-r4" x="526" y="318">Which deployment will reproduce</text>
  <text class="leaky-honest-154-sub" x="30" y="372">Running both is what makes the cost of discipline visible and acceptable: the honest number is worse, and it is the one that survives contact with production.</text>
</svg>
