<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both discard order; one knows meaning.">
  <title>Bag of words, or bag of embeddings</title>
  <style>
    .bow-or-neural-bg   { fill: #f8fafc; }
    .bow-or-neural-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bow-or-neural-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bow-or-neural-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bow-or-neural-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bow-or-neural-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bow-or-neural-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bow-or-neural-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bow-or-neural-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bow-or-neural-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bow-or-neural-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bow-or-neural-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bow-or-neural-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bow-or-neural-row { opacity: 1; }
    .bow-or-neural-r0 { animation-delay: 0.00s; }
    .bow-or-neural-r1 { animation-delay: 0.45s; }
    .bow-or-neural-r2 { animation-delay: 0.90s; }
    .bow-or-neural-r3 { animation-delay: 1.35s; }
    .bow-or-neural-r4 { animation-delay: 1.80s; }
    .bow-or-neural-row { animation: bow-or-neural-reveal 7.3s ease-in-out infinite; }
    @keyframes bow-or-neural-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bow-or-neural-bg" width="980" height="390"/>
  <text class="bow-or-neural-h1"  x="30" y="40">Bag of words, or bag of embeddings</text>
  <text class="bow-or-neural-sub" x="30" y="64">Both discard order; one knows meaning.</text>
  <rect class="bow-or-neural-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bow-or-neural-name" x="46" y="122">Bag of words</text>
  <text class="bow-or-neural-desc" x="46" y="142">Counts, sparse.</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r0" x="46" y="182">One dimension per vocabulary entry</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r1" x="46" y="216">No relationship between related words</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r2" x="46" y="250">"Excellent" and "superb" are unrelated</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r3" x="46" y="284">Unseen words carry nothing</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r4" x="46" y="318">Strong, and it plateaus</text>
  <rect class="bow-or-neural-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bow-or-neural-name" x="526" y="122">Averaged embeddings</text>
  <text class="bow-or-neural-desc" x="526" y="142">Dense, and semantic.</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r0" x="526" y="182">A few hundred dimensions</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r1" x="526" y="216">Related words are geometrically close</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r2" x="526" y="250">Synonyms contribute similarly</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r3" x="526" y="284">Subword embeddings handle unseen words</text>
  <text class="bow-or-neural-desc bow-or-neural-row bow-or-neural-r4" x="526" y="318">Better generalisation from less data</text>
  <text class="bow-or-neural-sub" x="30" y="372">Both discard word order entirely, which is worth stating plainly: the improvement here comes from knowing which words are related, not from understanding sentence structure.</text>
</svg>
