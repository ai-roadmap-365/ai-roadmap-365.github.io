<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Prefill vs Decode Latency Anatomy">
  <title>Prefill vs Decode Latency Anatomy</title>
  <defs>
    <style>
      .d320b-bg { fill: #f8fafc; }
      .d320b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d320b-pre { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d320b-dec { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d320b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d320b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d320b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d320b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d320b-bg" />
  
  <text x="40" y="40" class="d320a-title">GPU Execution Anatomy: Prefill vs Decode</text>
  <text x="40" y="65" class="d320a-subtitle">Prefill vs Decode Latency Anatomy comparing Parallel Input Prefill Phase (TTFT) with Sequential Autoregressive Decode Phase (ITL)</text>
  
  <!-- Phase 1: Prefill Phase -->
  <rect x="40" y="110" width="390" height="270" class="d320b-pre" />
  <text x="60" y="145" class="d320b-header" fill="#1d4ed8">Phase 1: Input Prefill (Time to First Token)</text>
  <text x="60" y="180" class="d320b-text">• **Processing:** Computes attention across all prompt tokens</text>
  <text x="60" y="205" class="d320b-text">• **Parallelism:** Highly parallelized on Tensor Cores (Compute-bound)</text>
  <text x="60" y="230" class="d320b-text">• **Optimization:** Provider Prompt Caching skips prefill KV</text>
  <text x="60" y="255" class="d320b-text">• **Benchmark:** 2,000 tokens in ~ 180ms</text>
  <text x="60" y="300" class="d320b-text" font-weight="600" fill="#1d4ed8">Output: First Token Streamed to Client</text>
  
  <!-- Phase 2: Decode Phase -->
  <rect x="470" y="110" width="390" height="270" class="d320b-dec" />
  <text x="490" y="145" class="d320b-header" fill="#7e22ce">Phase 2: Autoregressive Decode (ITL)</text>
  <text x="490" y="180" class="d320b-text">• **Processing:** Generates 1 new token at a time sequentially</text>
  <text x="490" y="205" class="d320b-text">• **Bottleneck:** GPU Memory Bandwidth (Memory-bound)</text>
  <text x="490" y="230" class="d320b-text">• **Optimization:** Speculative Decoding, KV Paging (vLLM)</text>
  <text x="490" y="255" class="d320b-text">• **Benchmark:** 30-100 tokens/sec (~ 15ms / token)</text>
  <text x="490" y="300" class="d320b-text" font-weight="600" fill="#7e22ce">Output: Fluid Word-by-Word Stream</text>
</svg>