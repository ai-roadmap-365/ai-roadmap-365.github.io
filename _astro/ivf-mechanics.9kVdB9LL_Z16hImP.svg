<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two phases, one specific loss.">
  <title>How IVF works</title>
  <style>
    .ivf-mechanics-bg   { fill: #f8fafc; }
    .ivf-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ivf-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ivf-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ivf-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ivf-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ivf-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ivf-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ivf-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ivf-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ivf-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ivf-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ivf-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ivf-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ivf-mechanics-stage { opacity: 1; }

    .ivf-mechanics-s0 { animation-delay: 0.00s; }
    .ivf-mechanics-e0 { animation-delay: 0.00s; }
    .ivf-mechanics-s1 { animation-delay: 1.28s; }
    .ivf-mechanics-e1 { animation-delay: 1.28s; }
    .ivf-mechanics-s2 { animation-delay: 2.56s; }
    .ivf-mechanics-e2 { animation-delay: 2.56s; }
    .ivf-mechanics-s3 { animation-delay: 3.84s; }
    .ivf-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ivf-mechanics-conn  { animation: ivf-mechanics-trace 6.4s ease-in-out infinite; }
      .ivf-mechanics-stage { animation: ivf-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ivf-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ivf-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ivf-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ivf-mechanics-stage { animation: ivf-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ivf-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ivf-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ivf-mechanics-bg" width="980" height="322"/>
  <text class="ivf-mechanics-h1"  x="30" y="40">How IVF works</text>
  <text class="ivf-mechanics-sub" x="30" y="64">Two phases, one specific loss.</text>
  <g class="ivf-mechanics-stage ivf-mechanics-s0">
    <rect class="ivf-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ivf-mechanics-step" x="44" y="142">01</text>
    <text class="ivf-mechanics-name" x="70" y="142">Build: cluster into nlist groups</text>
    <text class="ivf-mechanics-desc" x="44" y="166">Every vector belongs to exactly</text>
    <text class="ivf-mechanics-desc" x="44" y="182">one list, with a centroid each.</text>
  </g>
  <line class="ivf-mechanics-line ivf-mechanics-conn ivf-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ivf-mechanics-tip)"/>
  <g class="ivf-mechanics-stage ivf-mechanics-s1">
    <rect class="ivf-mechanics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ivf-mechanics-step" x="280" y="142">02</text>
    <text class="ivf-mechanics-name" x="306" y="142">Search: compare against centroids</text>
    <text class="ivf-mechanics-desc" x="280" y="166">Cheap — there are nlist of them,</text>
    <text class="ivf-mechanics-desc" x="280" y="182">not n.</text>
  </g>
  <line class="ivf-mechanics-line ivf-mechanics-conn ivf-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ivf-mechanics-tip)"/>
  <g class="ivf-mechanics-stage ivf-mechanics-s2">
    <rect class="ivf-mechanics-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ivf-mechanics-step" x="516" y="142">03</text>
    <text class="ivf-mechanics-name" x="542" y="142">Probe the nprobe nearest lists</text>
    <text class="ivf-mechanics-desc" x="516" y="166">Compare only against the vectors</text>
    <text class="ivf-mechanics-desc" x="516" y="182">inside them.</text>
  </g>
  <line class="ivf-mechanics-line ivf-mechanics-conn ivf-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ivf-mechanics-tip)"/>
  <g class="ivf-mechanics-stage ivf-mechanics-s3">
    <rect class="ivf-mechanics-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ivf-mechanics-step" x="752" y="142">04</text>
    <text class="ivf-mechanics-name" x="778" y="142">A neighbour in an unprobed list is invisible</text>
    <text class="ivf-mechanics-desc" x="752" y="166">Not down-ranked. Absent, and</text>
    <text class="ivf-mechanics-desc" x="752" y="182">unrecoverable by a reranker.</text>
  </g>
  <text class="ivf-mechanics-sub" x="30" y="304">Stating the loss precisely matters because it changes what can fix it: a down-ranked result can be rescued by reranking, and a candidate that was never generated cannot be.</text>
</svg>
