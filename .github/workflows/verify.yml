name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: All gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The full gate: lint, format, types, every content and lab validator,
      # the unit tests, the link modes, the site build, the end-to-end page
      # checks, accessibility, the offline bundle and the coverage audit.
      # It fails if any lesson, lab, README, source, asset or link is missing.
      - name: npm run verify:all
        run: npm run verify:all

  labs:
    name: Lab harnesses (changed days)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Labs are self-contained and run offline. Only the labs touched by this
      # change are run, because running all of them would grow without bound
      # as the course does.
      - name: Run the test harness of every changed lab
        shell: bash
        run: |
          set -uo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No usable base commit; nothing to run."
            exit 0
          fi
          mapfile -t dirs < <(
            git diff --name-only "$base" HEAD -- 'labs/sections/**' \
              | sed -n 's|\(labs/sections/[^/]*/day-[0-9]*-[^/]*\)/.*|\1|p' \
              | sort -u
          )
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No lab changed."
            exit 0
          fi
          status=0
          for d in "${dirs[@]}"; do
            [ -f "$d/tests/run_tests.sh" ] || continue
            echo "::group::$d"
            ( cd "$d" && bash tests/run_tests.sh ) || status=1
            echo "::endgroup::"
          done
          exit $status
