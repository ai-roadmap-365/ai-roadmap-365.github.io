# Publish the course site to GitHub Pages.
#
# `main` is the only branch. It carries the source, and a push to it is what
# publishes (A49). There is no `site` branch: the built HTML is handed to Pages
# as a deployment artifact rather than force-pushed over a second branch's
# history, which removes the force-push, the second branch, and the SSH remote
# that only one machine had.
#
# Pages must be set to "GitHub Actions" as its source in the repository
# settings for this to serve anything. That is a one-time switch.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to read the tree, mint the Pages deployment, and prove the
# artifact came from this workflow. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. A queued run is allowed to finish rather than
# being cancelled, so a publish already in flight is not left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - uses: actions/configure-pages@v5

      # Builds, strips the authoring-only routes, writes .nojekyll so Astro's
      # /_astro assets are served, and fails if any page references localhost
      # or links into a stripped route.
      - name: npm run build:site
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
