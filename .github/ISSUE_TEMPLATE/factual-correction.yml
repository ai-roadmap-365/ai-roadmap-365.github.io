name: 🔍 Something in a lesson looks wrong
description: A fact, number, date, version or quoted output that does not hold up
title: 'Day NNN: '
labels: [content, correction]
body:
  - type: markdown
    attributes:
      value: |
        These are the most valuable issues this project gets. If a claim
        cannot be verified, the right fix is to remove it — and I would much
        rather hear that from you than leave it standing.
  - type: input
    id: day
    attributes:
      label: Day number
    validations: { required: true }
  - type: textarea
    id: claim
    attributes:
      label: The claim as written
      description: Quote it exactly, and say roughly where on the page it is.
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: What you believe is correct, and how you know
      description: A link to official documentation, or a command and its output.
    validations: { required: true }
