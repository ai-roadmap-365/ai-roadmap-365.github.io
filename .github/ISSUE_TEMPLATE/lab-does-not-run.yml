name: 🧪 A lab does not run
description: A lab fails, errors, or behaves differently on your machine
title: 'Day NNN: lab '
labels: [lab, bug]
body:
  - type: markdown
    attributes:
      value: |
        Every captured output in this course came from a real run on one
        machine on one day. Your machine disagreeing with it is genuinely
        worth knowing about — thank you for taking the time.
  - type: input
    id: day
    attributes:
      label: Day number
      placeholder: '087'
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: The exact command you ran
      render: shell
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What the lesson or README said would happen
      description: Quote the line, so we can find it.
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Paste the full output, including the error.
      render: shell
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: 'macOS 15.3 (Apple Silicon), Python 3.13.1'
    validations: { required: true }
