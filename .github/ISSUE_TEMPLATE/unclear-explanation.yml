name: 🤔 Something is unclear
description: A step assumed but never taught, or an explanation that lost you
title: 'Day NNN: unclear — '
labels: [content, clarity]
body:
  - type: markdown
    attributes:
      value: |
        If you got lost, the writing is at fault, not you. Telling me exactly
        where is the only way it gets fixed.
  - type: input
    id: day
    attributes:
      label: Day number
    validations: { required: true }
  - type: textarea
    id: where
    attributes:
      label: Which paragraph or step lost you
    validations: { required: true }
  - type: textarea
    id: thought
    attributes:
      label: What you thought it meant, or what you tried
      description: This is the useful part — it shows where the explanation forked.
  - type: input
    id: background
    attributes:
      label: Which day did you last complete?
      description: Helps me check whether it relied on something not taught yet.
