lesson_id: D119
day: 119
kind: guided-build
languages: [python, bash]
setup_commands:
  - cd labs/sections/math-statistics-and-data/day-119-analyzing-an-experiment-end-to-end
  - python3 -m venv .venv
  - .venv/bin/pip install -r requirements/requirements.txt
  - .venv/bin/python3 -c "import numpy; print(numpy.__version__)"
run_commands:
  - 'cd examples && ../.venv/bin/python3 01_load_and_validate.py && cd ..'
  - 'cd examples && ../.venv/bin/python3 02_sample_ratio_mismatch.py && cd ..'
  - 'cd examples && ../.venv/bin/python3 03_group_summary.py && cd ..'
  - 'cd examples && ../.venv/bin/python3 04_primary_test.py && cd ..'
  - 'cd examples && ../.venv/bin/python3 05_effect_size.py && cd ..'
  - 'cd examples && ../.venv/bin/python3 06_guardrail.py && cd ..'
  - 'cd examples && ../.venv/bin/python3 07_segment_analysis.py && cd ..'
  - 'cd examples && ../.venv/bin/python3 08_peeking.py && cd ..'
  - 'cd examples && ../.venv/bin/python3 09_verdict.py && cd ..'
  - .venv/bin/pytest examples -q -p no:cacheprovider
  - .venv/bin/pytest starter -q -p no:cacheprovider
test_commands:
  - bash tests/run_tests.sh
cleanup_commands:
  - "find . -path ./.venv -prune -o -type d -name '__pycache__' -print -exec rm -rf -- {} +"
  - rm -rf .pytest_cache
  - 'rm -rf .venv  # optional: removes the lab virtual environment'
  - 'git checkout -- starter/experiment.py  # optional: reset your work'
requires_network: true
requires_api_key: false
estimated_minutes: 40
