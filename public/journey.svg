<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="jTitle jDesc" preserveAspectRatio="xMidYMid meet">
  <title id="jTitle">The 365-day journey: from a transistor on Day 1 to a shipped AI system on Day 365</title>
  <desc id="jDesc">Nine courses laid out as one continuous path. A marker travels from left to right along the path, passing Computing Foundations, Python, Maths and Data, Machine Learning, Deep Learning, Large Language Models, AI Engineering, Deployment and MLOps, and the Capstone. Each stop is labelled with its day range and the thing you can do by the end of it, and every stop carries one lesson and one runnable lab.</desc>

  <defs>
    <linearGradient id="jPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="55%" stop-color="#a78bfa" />
      <stop offset="80%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="jFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0" />
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.45" />
    </linearGradient>
    <filter id="jGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <style>
    .jbg    { fill: #0b1220; }
    .jlabel { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
    .jdays  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #64748b; letter-spacing: 0.5px; }
    .jgain  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .jend   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 800; fill: #f8fafc; }
    .jsmall { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #7dd3fc; }

    .jline  { fill: none; stroke: url(#jPath); stroke-width: 5; stroke-linecap: round; }
    .jdash  {
      fill: none; stroke: #f8fafc; stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 5 22; opacity: 0.55;
      animation: jmarch 2.4s linear infinite;
    }
    @keyframes jmarch { to { stroke-dashoffset: -27; } }

    .jstop  { fill: #0b1220; stroke-width: 3.5; }
    .jpulse { animation: jpulse 9s ease-in-out infinite; transform-origin: center; }
    @keyframes jpulse {
      0%, 100% { r: 9; opacity: 0.85; }
      50%      { r: 12; opacity: 1; }
    }

    /* The traveller: one learner moving through the year. It rests at the
       start, so the still frame shows a journey about to begin. */
    .jtok { animation: jtravel 18s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes jtravel {
      0%, 4%    { transform: translateX(0); }
      96%, 100% { transform: translateX(1010px); }
    }
    .jtokglow { animation: jbreathe 3s ease-in-out infinite; }
    @keyframes jbreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .jdash  { animation: none; stroke-dasharray: none; opacity: 0.25; }
      .jpulse { animation: none; }
      .jtok   { animation: none; transform: translateX(0); }
      .jtokglow { animation: none; opacity: 1; }
    }
  </style>

  <rect class="jbg" width="1200" height="300" />

  <!-- the path itself -->
  <path class="jline" d="M 95 150 H 1105" />
  <path class="jdash" d="M 95 150 H 1105" />

  <!-- nine stops: x, colour, label, day range, what you can do by the end -->
  <g>
    <circle class="jstop jpulse" cx="95"   cy="150" r="9" stroke="#38bdf8" />
    <text class="jdays"  x="95"  y="196" text-anchor="middle">1–42</text>
    <text class="jlabel" x="95"  y="120" text-anchor="middle">Foundations</text>
    <text class="jgain"  x="95"  y="216" text-anchor="middle">the machine</text>

    <circle class="jstop jpulse" cx="221"  cy="150" r="9" stroke="#818cf8" />
    <text class="jdays"  x="221" y="196" text-anchor="middle">43–98</text>
    <text class="jlabel" x="221" y="120" text-anchor="middle">Python</text>
    <text class="jgain"  x="221" y="216" text-anchor="middle">you can build</text>

    <circle class="jstop jpulse" cx="347"  cy="150" r="9" stroke="#f472b6" />
    <text class="jdays"  x="347" y="196" text-anchor="middle">99–140</text>
    <text class="jlabel" x="347" y="120" text-anchor="middle">Maths</text>
    <text class="jgain"  x="347" y="216" text-anchor="middle">no longer magic</text>

    <circle class="jstop jpulse" cx="473"  cy="150" r="9" stroke="#4ade80" />
    <text class="jdays"  x="473" y="196" text-anchor="middle">141–196</text>
    <text class="jlabel" x="473" y="120" text-anchor="middle">Machine Learning</text>
    <text class="jgain"  x="473" y="216" text-anchor="middle">models that hold up</text>

    <circle class="jstop jpulse" cx="599"  cy="150" r="9" stroke="#fbbf24" />
    <text class="jdays"  x="599" y="196" text-anchor="middle">197–238</text>
    <text class="jlabel" x="599" y="120" text-anchor="middle">Deep Learning</text>
    <text class="jgain"  x="599" y="216" text-anchor="middle">nets from scratch</text>

    <circle class="jstop jpulse" cx="725"  cy="150" r="9" stroke="#a78bfa" />
    <text class="jdays"  x="725" y="196" text-anchor="middle">239–287</text>
    <text class="jlabel" x="725" y="120" text-anchor="middle">LLMs</text>
    <text class="jgain"  x="725" y="216" text-anchor="middle">prompt, ground, tune</text>

    <circle class="jstop jpulse" cx="851"  cy="150" r="9" stroke="#22d3ee" />
    <text class="jdays"  x="851" y="196" text-anchor="middle">288–329</text>
    <text class="jlabel" x="851" y="120" text-anchor="middle">AI Engineering</text>
    <text class="jgain"  x="851" y="216" text-anchor="middle">agents and MCP</text>

    <circle class="jstop jpulse" cx="977"  cy="150" r="9" stroke="#fb7185" />
    <text class="jdays"  x="977" y="196" text-anchor="middle">330–350</text>
    <text class="jlabel" x="977" y="120" text-anchor="middle">Deploy</text>
    <text class="jgain"  x="977" y="216" text-anchor="middle">it survives users</text>

    <circle class="jstop jpulse" cx="1105" cy="150" r="10" stroke="#facc15" />
    <text class="jdays"  x="1105" y="196" text-anchor="middle">351–365</text>
    <text class="jlabel" x="1105" y="120" text-anchor="middle">Capstone</text>
    <text class="jgain"  x="1105" y="216" text-anchor="middle">you ship it</text>
  </g>

  <!-- the traveller -->
  <g class="jtok">
    <circle class="jtokglow" cx="95" cy="150" r="15" fill="#38bdf8" opacity="0.55" filter="url(#jGlow)" />
    <circle cx="95" cy="150" r="7" fill="#f8fafc" />
  </g>

  <text class="jend"   x="600" y="46" text-anchor="middle">Day 1 you meet a transistor. Day 365 you ship an AI system you built.</text>
  <text class="jsmall" x="600" y="72" text-anchor="middle">One lesson and one runnable lab, every single day — free, no prerequisites.</text>
  <text class="jgain"  x="600" y="270" text-anchor="middle">Start anywhere. Every course stands on its own, and every lab runs offline on a normal laptop.</text>
</svg>
