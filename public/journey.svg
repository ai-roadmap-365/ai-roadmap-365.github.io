<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="jt-dark jd-dark" preserveAspectRatio="xMidYMid meet">
  <title id="jt-dark">The 365-day journey: from a transistor on day 1 to a shipped AI system on day 365</title>
  <desc id="jd-dark">9 courses laid out as one continuous path. Foundations, days 1 to 42, the machine. Python, days 43 to 98, you can build. Maths, days 99 to 140, no longer magic. Machine Learning, days 141 to 196, models that hold up. Deep Learning, days 197 to 238, nets from scratch. LLMs, days 239 to 287, prompt, ground, tune. AI Engineering, days 288 to 329, agents and MCP. Deploy, days 330 to 350, it survives users. Capstone, days 351 to 365, you ship it. Every stop carries one lesson and one runnable lab.</desc>
  <defs>
    <!-- userSpaceOnUse, not the default objectBoundingBox: the path this fills
         is a perfectly horizontal line, so its bounding box has zero height and
         a proportional gradient degenerates against it. The hand-drawn map this
         replaces carried that bug and drew the year as a grey rail. -->
    <linearGradient id="jp-dark" gradientUnits="userSpaceOnUse"
                    x1="95" y1="154" x2="1105" y2="154">
      <stop offset="0.0%" stop-color="#38bdf8"/>
      <stop offset="12.5%" stop-color="#818cf8"/>
      <stop offset="25.0%" stop-color="#f472b6"/>
      <stop offset="37.5%" stop-color="#4ade80"/>
      <stop offset="50.0%" stop-color="#fbbf24"/>
      <stop offset="62.5%" stop-color="#a78bfa"/>
      <stop offset="75.0%" stop-color="#22d3ee"/>
      <stop offset="87.5%" stop-color="#fb7185"/>
      <stop offset="100.0%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="jg-dark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .jlabel{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;font-weight:700}
    .jdays{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.5px}
    .jgain{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12.5px}
    .jhead{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:17px;font-weight:800}
    .jsub{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px}
    .jfoot{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}

    /* A light runs the length of the path, in the direction of travel. The path
       itself is always fully drawn: the route is the meaning, so it is never
       something the reader has to wait for. */
    @keyframes jcomet{from{stroke-dashoffset:1010}to{stroke-dashoffset:-1010}}
    @keyframes jwalk{0.00%,3.78%{transform:translateX(0.0px)}11.11%,14.89%{transform:translateX(126.3px)}22.22%,26.00%{transform:translateX(252.5px)}33.33%,37.11%{transform:translateX(378.8px)}44.44%,48.22%{transform:translateX(505.0px)}55.56%,59.33%{transform:translateX(631.3px)}66.67%,70.44%{transform:translateX(757.5px)}77.78%,81.56%{transform:translateX(883.8px)}88.89%,92.67%{transform:translateX(1010.0px)}}
    @keyframes jarrive{0%,3%{opacity:1;stroke-width:6}14%,100%{opacity:1;stroke-width:3.5}}
    @keyframes jhalo{0%,3%{opacity:.55;transform:scale(1.5)}16%,100%{opacity:0;transform:scale(1)}}
    @keyframes jbreathe{0%,100%{opacity:.5}50%{opacity:1}}

    .jcomet{animation:jcomet 6s linear infinite}
    .jstop{animation:jarrive 22s ease-out infinite}
    .jhalo{animation:jhalo 22s ease-out infinite;transform-origin:center;transform-box:fill-box}
    .jtok{animation:jwalk 22s cubic-bezier(.65,0,.35,1) infinite}
    .jtokglow{animation:jbreathe 3.2s ease-in-out infinite}
    .s0{animation-delay:0.00s}.s1{animation-delay:2.44s}.s2{animation-delay:4.89s}.s3{animation-delay:7.33s}.s4{animation-delay:9.78s}.s5{animation-delay:12.22s}.s6{animation-delay:14.67s}.s7{animation-delay:17.11s}.s8{animation-delay:19.56s}

    @media (prefers-reduced-motion:reduce){
      /* Nothing moves. Every stop, its day range and its label were already on
         screen; what stops is the light travelling between them. */
      .jcomet{animation:none;stroke-dasharray:none;opacity:.2}
      .jstop{animation:none}
      /* reduce-ok: .jhalo is the ripple that marks the traveller arriving at a
         stop. With the traveller parked, there is no arrival to mark, and every
         stop keeps its ring, its name, its day range and its outcome. */
      .jhalo{animation:none;opacity:0}
      .jtok{animation:none;transform:none}
      .jtokglow{animation:jbreathe 5s ease-in-out infinite}
    }
  </style>

  <rect width="1200" height="300" rx="14" fill="#0b1020"/>

  <text class="jhead" x="600" y="46" text-anchor="middle" fill="#e8ecf8">Day 1 you meet a transistor. Day 365 you ship an AI system you built.</text>
  <text class="jsub" x="600" y="72" text-anchor="middle" fill="#38bdf8">One lesson and one runnable lab, every single day — free, no prerequisites.</text>

  <path d="M 95 154 H 1105" fill="none" stroke="#1b2440" stroke-width="7" stroke-linecap="round"/>
  <path d="M 95 154 H 1105" fill="none" stroke="url(#jp-dark)" stroke-width="5" stroke-linecap="round"/>
  <path class="jcomet" d="M 95 154 H 1105" fill="none" stroke="#e8ecf8" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="26 1010" opacity=".7"/>

  
    <g>
      <text class="jlabel" x="95" y="124.0" text-anchor="middle" fill="#e8ecf8">Foundations</text>
      <circle class="jstop s0" cx="95" cy="154" r="9" fill="#0b1020" stroke="#38bdf8" stroke-width="3.5"/>
      <text class="jdays" x="95" y="196" text-anchor="middle" fill="#93a4c8">1–42</text>
      <text class="jgain" x="95" y="216.0" text-anchor="middle" fill="#93a4c8">the machine</text>
    </g>
    <g>
      <text class="jlabel" x="221.3" y="124.0" text-anchor="middle" fill="#e8ecf8">Python</text>
      <circle class="jstop s1" cx="221.3" cy="154" r="9" fill="#0b1020" stroke="#818cf8" stroke-width="3.5"/>
      <text class="jdays" x="221.3" y="196" text-anchor="middle" fill="#93a4c8">43–98</text>
      <text class="jgain" x="221.3" y="216.0" text-anchor="middle" fill="#93a4c8">you can build</text>
    </g>
    <g>
      <text class="jlabel" x="347.5" y="124.0" text-anchor="middle" fill="#e8ecf8">Maths</text>
      <circle class="jstop s2" cx="347.5" cy="154" r="9" fill="#0b1020" stroke="#f472b6" stroke-width="3.5"/>
      <text class="jdays" x="347.5" y="196" text-anchor="middle" fill="#93a4c8">99–140</text>
      <text class="jgain" x="347.5" y="216.0" text-anchor="middle" fill="#93a4c8">no longer magic</text>
    </g>
    <g>
      <text class="jlabel" x="473.8" y="106.0" text-anchor="middle" fill="#e8ecf8">Machine</text><text class="jlabel" x="473.8" y="124.0" text-anchor="middle" fill="#e8ecf8">Learning</text>
      <circle class="jstop s3" cx="473.8" cy="154" r="9" fill="#0b1020" stroke="#4ade80" stroke-width="3.5"/>
      <text class="jdays" x="473.8" y="196" text-anchor="middle" fill="#93a4c8">141–196</text>
      <text class="jgain" x="473.8" y="216.0" text-anchor="middle" fill="#93a4c8">models that</text><text class="jgain" x="473.8" y="231.5" text-anchor="middle" fill="#93a4c8">hold up</text>
    </g>
    <g>
      <text class="jlabel" x="600" y="124.0" text-anchor="middle" fill="#e8ecf8">Deep Learning</text>
      <circle class="jstop s4" cx="600" cy="154" r="9" fill="#0b1020" stroke="#fbbf24" stroke-width="3.5"/>
      <text class="jdays" x="600" y="196" text-anchor="middle" fill="#93a4c8">197–238</text>
      <text class="jgain" x="600" y="216.0" text-anchor="middle" fill="#93a4c8">nets from scratch</text>
    </g>
    <g>
      <text class="jlabel" x="726.3" y="124.0" text-anchor="middle" fill="#e8ecf8">LLMs</text>
      <circle class="jstop s5" cx="726.3" cy="154" r="9" fill="#0b1020" stroke="#a78bfa" stroke-width="3.5"/>
      <text class="jdays" x="726.3" y="196" text-anchor="middle" fill="#93a4c8">239–287</text>
      <text class="jgain" x="726.3" y="216.0" text-anchor="middle" fill="#93a4c8">prompt,</text><text class="jgain" x="726.3" y="231.5" text-anchor="middle" fill="#93a4c8">ground, tune</text>
    </g>
    <g>
      <text class="jlabel" x="852.5" y="106.0" text-anchor="middle" fill="#e8ecf8">AI</text><text class="jlabel" x="852.5" y="124.0" text-anchor="middle" fill="#e8ecf8">Engineering</text>
      <circle class="jstop s6" cx="852.5" cy="154" r="9" fill="#0b1020" stroke="#22d3ee" stroke-width="3.5"/>
      <text class="jdays" x="852.5" y="196" text-anchor="middle" fill="#93a4c8">288–329</text>
      <text class="jgain" x="852.5" y="216.0" text-anchor="middle" fill="#93a4c8">agents and MCP</text>
    </g>
    <g>
      <text class="jlabel" x="978.8" y="124.0" text-anchor="middle" fill="#e8ecf8">Deploy</text>
      <circle class="jstop s7" cx="978.8" cy="154" r="9" fill="#0b1020" stroke="#fb7185" stroke-width="3.5"/>
      <text class="jdays" x="978.8" y="196" text-anchor="middle" fill="#93a4c8">330–350</text>
      <text class="jgain" x="978.8" y="216.0" text-anchor="middle" fill="#93a4c8">it survives users</text>
    </g>
    <g>
      <text class="jlabel" x="1105" y="124.0" text-anchor="middle" fill="#e8ecf8">Capstone</text>
      <circle class="jstop s8" cx="1105" cy="154" r="9" fill="#0b1020" stroke="#facc15" stroke-width="3.5"/>
      <text class="jdays" x="1105" y="196" text-anchor="middle" fill="#93a4c8">351–365</text>
      <text class="jgain" x="1105" y="216.0" text-anchor="middle" fill="#93a4c8">you ship it</text>
    </g>

  <g class="jtok" transform="translate(0 0)">
    <circle class="jhalo" cx="95" cy="154" r="9" fill="none" stroke="#e8ecf8" stroke-width="2" opacity="0"/>
    <circle class="jtokglow" cx="95" cy="154" r="15.3" fill="#38bdf8" opacity=".55" filter="url(#jg-dark)"/>
    <circle cx="95" cy="154" r="7.0" fill="#e8ecf8"/>
  </g>

  <text class="jfoot" x="600" y="278" text-anchor="middle" fill="#93a4c8">Start anywhere. Every course stands on its own, and every lab runs offline on a normal laptop.</text>
</svg>