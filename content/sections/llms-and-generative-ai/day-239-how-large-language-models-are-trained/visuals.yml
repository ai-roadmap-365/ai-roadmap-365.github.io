visuals:
  - id: llm-pretraining-end-to-end-pipeline
    file: assets/llm-pretraining-end-to-end-pipeline.svg
    type: diagram
    title: 'LLM Pre-Training End-to-End Pipeline'
    alt: End-to-end LLM pretraining data-to-weights lifecycle diagram showing 5 stages from raw web crawl to base foundation model
    description: 'The industrial lifecycle of training a large language model: web ingestion, filtering, tokenization, cluster training, and base model emergence.'
  - id: data-filtering-and-quality-curation-stages
    file: assets/data-filtering-and-quality-curation-stages.svg
    type: diagram
    title: 'Data Filtering & Quality Curation Funnel'
    alt: Four-stage data refinement funnel diagram illustrating web text curation from raw crawl to educational synthetic tokens
    description: 'The 4-stage data curation funnel distilling hundreds of terabytes of raw web noise into high-density pretraining tokens.'
  - id: pretrain-idea
    file: assets/pretrain-idea.svg
    type: diagram
    title: 'Pretraining, end to end'
    alt: 'Diagram: the four stages of pretraining a large language model'
    description: 'A four-stage description of pretraining covering data collection, filtering, the training run and the resulting base model.'
  - id: data-funnel
    file: assets/data-funnel.svg
    type: diagram
    title: 'The data funnel'
    alt: 'Diagram: the successive filtering stages that reduce raw web text to training data'
    description: 'A five-stage description of the data pipeline covering raw crawl, text extraction, quality filtering, deduplication and the final corpus.'
  - id: dedup
    file: assets/dedup.svg
    type: diagram
    title: 'Finding near-duplicates'
    alt: 'Diagram: how locality-sensitive hashing finds near-duplicate documents at scale'
    description: 'A four-stage description of near-duplicate detection covering the pairwise problem, shingling, hashed signatures and bucketed candidates.'
  - id: loss-spikes
    file: assets/loss-spikes.svg
    type: diagram
    title: 'Loss spikes'
    alt: 'Diagram: how a training loss spike is detected and recovered from'
    description: 'A four-stage description of loss spike handling covering the sudden rise, its causes, the rollback and the mitigation.'
  - id: packing
    file: assets/packing.svg
    type: diagram
    title: 'Packing documents into sequences'
    alt: 'Diagram: how multiple documents are packed into one training sequence without attending across boundaries'
    description: 'A four-stage description of document packing covering wasted padding, concatenation, boundary masking and the efficiency gain.'
  - id: library
    file: assets/library.svg
    type: diagram
    title: 'Reading the library, or being taught'
    alt: 'Diagram: unstructured wide reading compared with directed instruction'
    description: 'A two-column comparison of learning by reading everything against learning by instruction.'
  - id: pretrain-implications
    file: assets/pretrain-implications.svg
    type: diagram
    title: 'Four consequences of pretraining at scale'
    alt: 'Diagram: the cost, copyright, energy and privacy implications of large-scale pretraining'
    description: 'A four-stage description of pretraining implications covering financial cost, training data provenance, energy use and memorised private data.'
  - id: pretrain-when
    file: assets/pretrain-when.svg
    type: diagram
    title: 'When to pretrain'
    alt: 'Diagram: when pretraining a model from scratch is justified'
    description: 'A two-column comparison of the rare cases justifying pretraining against the usual alternatives.'
  - id: pretrain-history
    file: assets/pretrain-history.svg
    type: diagram
    title: 'Four steps to modern pretraining'
    alt: 'Diagram: the historical progression of language model pretraining'
    description: 'A four-stage description of pretraining history covering task-specific training, transfer learning, scale and data-centric training.'
  - id: pretrain-vs-finetune
    file: assets/pretrain-vs-finetune.svg
    type: diagram
    title: 'Pretraining against fine-tuning'
    alt: 'Diagram: pretraining compared with fine-tuning by scale and purpose'
    description: 'A two-column comparison of pretraining against fine-tuning.'
