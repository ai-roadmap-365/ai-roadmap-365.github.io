terms:
  - term: 'Base Model'
    definition: 'A foundation model trained purely on self-supervised next-token prediction across trillions of tokens, without instruction tuning or conversational alignment.'
  - term: 'Causal Language Modeling (CLM)'
    definition: 'The autoregressive pretraining objective where the model predicts token w_t conditioned only on preceding tokens w_<t.'
  - term: 'MinHash LSH'
    definition: 'A probabilistic hashing algorithm (Locality-Sensitive Hashing) used to rapidly find and remove near-duplicate documents across multi-terabyte web corpora.'
  - term: 'Gopher Heuristics'
    definition: 'A standard set of document quality filters measuring stopword ratios, mean word lengths, symbol-to-word ratios, and ellipsis counts to filter low-quality text.'
  - term: 'FineWeb-Edu'
    definition: 'A 5.4-trillion token pretraining dataset curated using an educational quality scoring classifier to select pedagogically rich web text.'
  - term: 'Loss Spike'
    definition: 'A sudden, catastrophic explosion in validation loss during pretraining, typically triggered by corrupted data batches, extreme gradient norms, or mixed-precision underflow.'
  - term: 'Memory-Mapped Binary Tokens'
    definition: 'Tokenized datasets serialized into flat binary arrays of 16-bit or 32-bit integers (e.g. numpy memmap) allowing zero-overhead streaming across GPU clusters.'
  - term: 'Synthetic Data Curation'
    definition: 'Using advanced frontier models to generate structured textbooks, mathematical reasoning steps, and verified code to enrich pretraining mixtures.'
