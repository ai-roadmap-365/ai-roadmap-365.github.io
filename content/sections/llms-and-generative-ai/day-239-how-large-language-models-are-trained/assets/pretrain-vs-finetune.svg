<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four orders of magnitude apart.">
  <title>Pretraining against fine-tuning</title>
  <style>
    .pretrain-vs-finetune-bg   { fill: #f8fafc; }
    .pretrain-vs-finetune-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-vs-finetune-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-vs-finetune-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-vs-finetune-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-vs-finetune-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-vs-finetune-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pretrain-vs-finetune-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pretrain-vs-finetune-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pretrain-vs-finetune-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pretrain-vs-finetune-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pretrain-vs-finetune-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pretrain-vs-finetune-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pretrain-vs-finetune-row { opacity: 1; }
    .pretrain-vs-finetune-r0 { animation-delay: 0.00s; }
    .pretrain-vs-finetune-r1 { animation-delay: 0.45s; }
    .pretrain-vs-finetune-r2 { animation-delay: 0.90s; }
    .pretrain-vs-finetune-r3 { animation-delay: 1.35s; }
    .pretrain-vs-finetune-r4 { animation-delay: 1.80s; }
    .pretrain-vs-finetune-row { animation: pretrain-vs-finetune-reveal 7.3s ease-in-out infinite; }
    @keyframes pretrain-vs-finetune-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pretrain-vs-finetune-bg" width="980" height="390"/>
  <text class="pretrain-vs-finetune-h1"  x="30" y="40">Pretraining against fine-tuning</text>
  <text class="pretrain-vs-finetune-sub" x="30" y="64">Four orders of magnitude apart.</text>
  <rect class="pretrain-vs-finetune-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pretrain-vs-finetune-name" x="46" y="122">Pretraining</text>
  <text class="pretrain-vs-finetune-desc" x="46" y="142">Building knowledge.</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r0" x="46" y="182">Trillions of unlabelled tokens</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r1" x="46" y="216">Thousands of accelerators, for months</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r2" x="46" y="250">Tens of millions of dollars</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r3" x="46" y="284">Produces general capability</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r4" x="46" y="318">Done by a handful of organisations</text>
  <rect class="pretrain-vs-finetune-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pretrain-vs-finetune-name" x="526" y="122">Fine-tuning</text>
  <text class="pretrain-vs-finetune-desc" x="526" y="142">Shaping behaviour.</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r0" x="526" y="182">Thousands of curated examples</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r1" x="526" y="216">One machine, for hours</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r2" x="526" y="250">Tens to thousands of dollars</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r3" x="526" y="284">Produces task behaviour</text>
  <text class="pretrain-vs-finetune-desc pretrain-vs-finetune-row pretrain-vs-finetune-r4" x="526" y="318">Done by anyone</text>
  <text class="pretrain-vs-finetune-sub" x="30" y="372">The gap explains the structure of the whole industry: pretraining is concentrated because of its cost, and everything built on top is widely distributed because adaptation is cheap.</text>
</svg>
