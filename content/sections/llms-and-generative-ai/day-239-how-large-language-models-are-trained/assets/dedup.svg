<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Without comparing everything to everything.">
  <title>Finding near-duplicates</title>
  <style>
    .dedup-bg   { fill: #f8fafc; }
    .dedup-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedup-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedup-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedup-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedup-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedup-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dedup-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dedup-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dedup-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dedup-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dedup-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dedup-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dedup-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dedup-stage { opacity: 1; }

    .dedup-s0 { animation-delay: 0.00s; }
    .dedup-e0 { animation-delay: 0.00s; }
    .dedup-s1 { animation-delay: 1.28s; }
    .dedup-e1 { animation-delay: 1.28s; }
    .dedup-s2 { animation-delay: 2.56s; }
    .dedup-e2 { animation-delay: 2.56s; }
    .dedup-s3 { animation-delay: 3.84s; }
    .dedup-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dedup-conn  { animation: dedup-trace 6.4s ease-in-out infinite; }
      .dedup-stage { animation: dedup-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dedup-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dedup-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dedup-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dedup-stage { animation: dedup-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dedup-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dedup-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dedup-bg" width="980" height="322"/>
  <text class="dedup-h1"  x="30" y="40">Finding near-duplicates</text>
  <text class="dedup-sub" x="30" y="64">Without comparing everything to everything.</text>
  <g class="dedup-stage dedup-s0">
    <rect class="dedup-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dedup-step" x="44" y="142">01</text>
    <text class="dedup-name" x="70" y="142">Comparing every pair is impossible</text>
    <text class="dedup-desc" x="44" y="166">At billions of documents, the</text>
    <text class="dedup-desc" x="44" y="182">arithmetic does not finish.</text>
  </g>
  <line class="dedup-line dedup-conn dedup-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dedup-tip)"/>
  <g class="dedup-stage dedup-s1">
    <rect class="dedup-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dedup-step" x="280" y="142">02</text>
    <text class="dedup-name" x="306" y="142">Represent each document by its overlapping word groups</text>
    <text class="dedup-desc" x="280" y="166">A set, not a sequence.</text>
  </g>
  <line class="dedup-line dedup-conn dedup-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dedup-tip)"/>
  <g class="dedup-stage dedup-s2">
    <rect class="dedup-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dedup-step" x="516" y="142">03</text>
    <text class="dedup-name" x="542" y="142">Hash that set to a short signature</text>
    <text class="dedup-desc" x="516" y="166">Which preserves similarity,</text>
    <text class="dedup-desc" x="516" y="182">approximately.</text>
  </g>
  <line class="dedup-line dedup-conn dedup-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dedup-tip)"/>
  <g class="dedup-stage dedup-s3">
    <rect class="dedup-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dedup-step" x="752" y="142">04</text>
    <text class="dedup-name" x="778" y="142">And bucket by signature</text>
    <text class="dedup-desc" x="752" y="166">Only documents in the same</text>
    <text class="dedup-desc" x="752" y="182">bucket are compared.</text>
  </g>
  <text class="dedup-sub" x="30" y="304">The reason this matters is not storage but behaviour: text a model sees many times is memorised verbatim, which is both a quality problem and a privacy one.</text>
</svg>
