<svg role="img" aria-label="Four-stage data refinement funnel diagram illustrating web text curation from raw crawl to educational synthetic tokens" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Data Filtering &amp; Quality Curation Funnel</title>
  <defs>
    <linearGradient id="bg239b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card239b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg239b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PRE-TRAINING DATA REFINEMENT FUNNEL</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">How Raw Web Noise Is Distilled into High-Density Learning Tokens (FineWeb / LLaMA)</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card239b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Funnel Tier 1: Raw Web -->
    <rect x="40" y="25" width="640" height="50" fill="#0f172a" stroke="#f43f5e" rx="4"/>
    <text x="60" y="48" fill="#fb7185" font-size="11" font-weight="700">Tier 1: Raw Web Dump (100% Volume ~ 500 Terabytes)</text>
    <text x="60" y="65" fill="#cbd5e1" font-size="8">HTML boilerplate, SEO spam, automated bot logs, duplicated scraping artifacts</text>

    <!-- Funnel Tier 2: Heuristic & Dedup -->
    <rect x="80" y="90" width="560" height="50" fill="#0f172a" stroke="#fbbf24" rx="4"/>
    <text x="100" y="113" fill="#fbbf24" font-size="11" font-weight="700">Tier 2: MinHash Deduplication &amp; Heuristics (35% Volume Retained)</text>
    <text x="100" y="130" fill="#cbd5e1" font-size="8">Gopher quality heuristics: line length, punctuation ratios, symbol-to-word ratios, PII scrubber</text>

    <!-- Funnel Tier 3: Model-Based Filtering -->
    <rect x="120" y="155" width="480" height="50" fill="#0f172a" stroke="#38bdf8" rx="4"/>
    <text x="140" y="178" fill="#38bdf8" font-size="11" font-weight="700">Tier 3: Educational Quality Classifiers (15% Volume Retained)</text>
    <text x="140" y="195" fill="#cbd5e1" font-size="8">FineWeb-Edu classifier: FastText / DeBERTa scoring for pedagogical density &amp; reasoning value</text>

    <!-- Funnel Tier 4: Synthetic & Specialized -->
    <rect x="160" y="220" width="400" height="55" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="180" y="243" fill="#34d399" font-size="11" font-weight="700">Tier 4: Synthetic Textbooks &amp; Code (15 Trillion Gold Tokens)</text>
    <text x="180" y="260" fill="#cbd5e1" font-size="8">Synthetic multi-step reasoning, mathematical proofs, verified GitHub repos, clean scientific papers</text>
  </g>
</svg>
