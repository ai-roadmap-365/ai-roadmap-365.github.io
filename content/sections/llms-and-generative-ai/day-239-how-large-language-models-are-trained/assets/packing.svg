<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And keeping them separate.">
  <title>Packing documents into sequences</title>
  <style>
    .packing-bg   { fill: #f8fafc; }
    .packing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .packing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .packing-stage { opacity: 1; }

    .packing-s0 { animation-delay: 0.00s; }
    .packing-e0 { animation-delay: 0.00s; }
    .packing-s1 { animation-delay: 1.28s; }
    .packing-e1 { animation-delay: 1.28s; }
    .packing-s2 { animation-delay: 2.56s; }
    .packing-e2 { animation-delay: 2.56s; }
    .packing-s3 { animation-delay: 3.84s; }
    .packing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .packing-conn  { animation: packing-trace 6.4s ease-in-out infinite; }
      .packing-stage { animation: packing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes packing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes packing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .packing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .packing-stage { animation: packing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes packing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="packing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="packing-bg" width="980" height="322"/>
  <text class="packing-h1"  x="30" y="40">Packing documents into sequences</text>
  <text class="packing-sub" x="30" y="64">And keeping them separate.</text>
  <g class="packing-stage packing-s0">
    <rect class="packing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="packing-step" x="44" y="142">01</text>
    <text class="packing-name" x="70" y="142">Documents are shorter than the context window</text>
    <text class="packing-desc" x="44" y="166">So padding wastes most of the</text>
    <text class="packing-desc" x="44" y="182">compute.</text>
  </g>
  <line class="packing-line packing-conn packing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#packing-tip)"/>
  <g class="packing-stage packing-s1">
    <rect class="packing-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="packing-step" x="280" y="142">02</text>
    <text class="packing-name" x="306" y="142">Concatenate several into one sequence</text>
    <text class="packing-desc" x="280" y="166">Filling the window completely.</text>
  </g>
  <line class="packing-line packing-conn packing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#packing-tip)"/>
  <g class="packing-stage packing-s2">
    <rect class="packing-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="packing-step" x="516" y="142">03</text>
    <text class="packing-name" x="542" y="142">But mask attention at the boundaries</text>
    <text class="packing-desc" x="516" y="166">Or the model learns to predict</text>
    <text class="packing-desc" x="516" y="182">across unrelated documents.</text>
  </g>
  <line class="packing-line packing-conn packing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#packing-tip)"/>
  <g class="packing-stage packing-s3">
    <rect class="packing-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="packing-step" x="752" y="142">04</text>
    <text class="packing-name" x="778" y="142">Full utilisation, correct behaviour</text>
    <text class="packing-desc" x="752" y="166">Which is a substantial saving</text>
    <text class="packing-desc" x="752" y="182">over a full run.</text>
  </g>
  <text class="packing-sub" x="30" y="304">Omitting the boundary mask is a real and subtle bug: training still runs and the loss still falls, but the model learns spurious continuations between unrelated texts.</text>
</svg>
