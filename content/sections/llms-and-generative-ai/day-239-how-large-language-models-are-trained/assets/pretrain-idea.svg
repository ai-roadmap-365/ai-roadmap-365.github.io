<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four stages, months long.">
  <title>Pretraining, end to end</title>
  <style>
    .pretrain-idea-bg   { fill: #f8fafc; }
    .pretrain-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pretrain-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pretrain-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pretrain-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pretrain-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pretrain-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pretrain-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pretrain-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pretrain-idea-stage { opacity: 1; }

    .pretrain-idea-s0 { animation-delay: 0.00s; }
    .pretrain-idea-e0 { animation-delay: 0.00s; }
    .pretrain-idea-s1 { animation-delay: 1.28s; }
    .pretrain-idea-e1 { animation-delay: 1.28s; }
    .pretrain-idea-s2 { animation-delay: 2.56s; }
    .pretrain-idea-e2 { animation-delay: 2.56s; }
    .pretrain-idea-s3 { animation-delay: 3.84s; }
    .pretrain-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pretrain-idea-conn  { animation: pretrain-idea-trace 6.4s ease-in-out infinite; }
      .pretrain-idea-stage { animation: pretrain-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pretrain-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pretrain-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pretrain-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pretrain-idea-stage { animation: pretrain-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pretrain-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pretrain-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pretrain-idea-bg" width="980" height="322"/>
  <text class="pretrain-idea-h1"  x="30" y="40">Pretraining, end to end</text>
  <text class="pretrain-idea-sub" x="30" y="64">Four stages, months long.</text>
  <g class="pretrain-idea-stage pretrain-idea-s0">
    <rect class="pretrain-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-idea-step" x="44" y="142">01</text>
    <text class="pretrain-idea-name" x="70" y="142">Collect an enormous corpus</text>
    <text class="pretrain-idea-desc" x="44" y="166">Web text, books, code. Trillions</text>
    <text class="pretrain-idea-desc" x="44" y="182">of tokens.</text>
  </g>
  <line class="pretrain-idea-line pretrain-idea-conn pretrain-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pretrain-idea-tip)"/>
  <g class="pretrain-idea-stage pretrain-idea-s1">
    <rect class="pretrain-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-idea-step" x="280" y="142">02</text>
    <text class="pretrain-idea-name" x="306" y="142">Filter and deduplicate it</text>
    <text class="pretrain-idea-desc" x="280" y="166">Where most of the engineering</text>
    <text class="pretrain-idea-desc" x="280" y="182">effort actually goes.</text>
  </g>
  <line class="pretrain-idea-line pretrain-idea-conn pretrain-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pretrain-idea-tip)"/>
  <g class="pretrain-idea-stage pretrain-idea-s2">
    <rect class="pretrain-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-idea-step" x="516" y="142">03</text>
    <text class="pretrain-idea-name" x="542" y="142">Predict the next token, for months</text>
    <text class="pretrain-idea-desc" x="516" y="166">On thousands of accelerators,</text>
    <text class="pretrain-idea-desc" x="516" y="182">continuously.</text>
    <text class="pretrain-idea-edge" x="516" y="242">the expensive part</text>
  </g>
  <line class="pretrain-idea-line pretrain-idea-conn pretrain-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pretrain-idea-tip)"/>
  <g class="pretrain-idea-stage pretrain-idea-s3">
    <rect class="pretrain-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-idea-step" x="752" y="142">04</text>
    <text class="pretrain-idea-name" x="778" y="142">Producing a base model</text>
    <text class="pretrain-idea-desc" x="752" y="166">Knowledgeable, capable, and not</text>
    <text class="pretrain-idea-desc" x="752" y="182">yet useful as an assistant.</text>
  </g>
  <text class="pretrain-idea-sub" x="30" y="304">The base model not being usable as an assistant is the point that surprises people: it will happily continue your question with more questions, because that is what the objective asked for.</text>
</svg>
