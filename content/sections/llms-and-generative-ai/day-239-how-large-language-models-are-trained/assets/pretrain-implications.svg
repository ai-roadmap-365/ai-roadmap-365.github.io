<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All contested.">
  <title>Four consequences of pretraining at scale</title>
  <style>
    .pretrain-implications-bg   { fill: #f8fafc; }
    .pretrain-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pretrain-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pretrain-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pretrain-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pretrain-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pretrain-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pretrain-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pretrain-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pretrain-implications-stage { opacity: 1; }

    .pretrain-implications-s0 { animation-delay: 0.00s; }
    .pretrain-implications-e0 { animation-delay: 0.00s; }
    .pretrain-implications-s1 { animation-delay: 1.28s; }
    .pretrain-implications-e1 { animation-delay: 1.28s; }
    .pretrain-implications-s2 { animation-delay: 2.56s; }
    .pretrain-implications-e2 { animation-delay: 2.56s; }
    .pretrain-implications-s3 { animation-delay: 3.84s; }
    .pretrain-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pretrain-implications-conn  { animation: pretrain-implications-trace 6.4s ease-in-out infinite; }
      .pretrain-implications-stage { animation: pretrain-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pretrain-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pretrain-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pretrain-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pretrain-implications-stage { animation: pretrain-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pretrain-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pretrain-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pretrain-implications-bg" width="980" height="322"/>
  <text class="pretrain-implications-h1"  x="30" y="40">Four consequences of pretraining at scale</text>
  <text class="pretrain-implications-sub" x="30" y="64">All contested.</text>
  <g class="pretrain-implications-stage pretrain-implications-s0">
    <rect class="pretrain-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-implications-step" x="44" y="142">01</text>
    <text class="pretrain-implications-name" x="70" y="142">Cost in the tens of millions</text>
    <text class="pretrain-implications-desc" x="44" y="166">For a frontier run, before any</text>
    <text class="pretrain-implications-desc" x="44" y="182">of the failed attempts.</text>
  </g>
  <line class="pretrain-implications-line pretrain-implications-conn pretrain-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pretrain-implications-tip)"/>
  <g class="pretrain-implications-stage pretrain-implications-s1">
    <rect class="pretrain-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-implications-step" x="280" y="142">02</text>
    <text class="pretrain-implications-name" x="306" y="142">And the data's provenance is disputed</text>
    <text class="pretrain-implications-desc" x="280" y="166">With active litigation in</text>
    <text class="pretrain-implications-desc" x="280" y="182">several jurisdictions.</text>
  </g>
  <line class="pretrain-implications-line pretrain-implications-conn pretrain-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pretrain-implications-tip)"/>
  <g class="pretrain-implications-stage pretrain-implications-s2">
    <rect class="pretrain-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-implications-step" x="516" y="142">03</text>
    <text class="pretrain-implications-name" x="542" y="142">Energy and water use are substantial</text>
    <text class="pretrain-implications-desc" x="516" y="166">And increasingly disclosed.</text>
  </g>
  <line class="pretrain-implications-line pretrain-implications-conn pretrain-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pretrain-implications-tip)"/>
  <g class="pretrain-implications-stage pretrain-implications-s3">
    <rect class="pretrain-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pretrain-implications-step" x="752" y="142">04</text>
    <text class="pretrain-implications-name" x="778" y="142">Private data can be memorised</text>
    <text class="pretrain-implications-desc" x="752" y="166">And extracted from the weights</text>
    <text class="pretrain-implications-desc" x="752" y="182">afterwards.</text>
  </g>
  <text class="pretrain-implications-sub" x="30" y="304">Memorisation is the concrete privacy mechanism rather than a hypothetical one: extraction attacks reliably recover training strings, which is another reason deduplication matters.</text>
</svg>
