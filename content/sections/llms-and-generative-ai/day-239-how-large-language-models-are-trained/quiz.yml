questions:
  - question: 'What is the primary training objective of modern autoregressive Large Language Models during pretraining?'
    options:
      - 'Causal language modelling: predict the next token'
      - 'Memorizing Wikipedia word-for-word'
      - 'Answering user questions as a polite chatbot'
      - 'Translating English to French only'
    answer_index: 0
    explanation: 'Pretraining trains the model to minimize cross-entropy loss predicting next tokens over vast text corpora.'
  - question: 'Why is MinHash Near-Duplicate Detection crucial when building an LLM pretraining dataset?'
    options:
      - 'Because GPUs cannot process duplicate numbers'
      - 'Repeated web text wastes compute and hurts reasoning'
      - 'Because duplicate text causes physical hard drive damage'
      - 'Because web crawlers only work on unique URLs'
    answer_index: 1
    explanation: 'Deduplication removes repetitive web boilerplate and spam, preventing severe capacity waste.'
  - question: 'What is a "Base Model" (e.g. LLaMA-3-8B-Base) prior to instruction tuning or RLHF?'
    options:
      - 'A broken neural network that fails all tests'
      - 'A model that only runs on basic hardware'
      - 'A text-completion engine, not an assistant'
      - 'A model that only understands Python code'
    answer_index: 2
    explanation: 'Base models are pure text predictors that continue patterns rather than answering prompts conversationally.'
  - question: 'What is the standard engineering protocol when a multi-week pretraining run encounters an irrecoverable gradient explosion / loss spike?'
    options:
      - 'Delete the model weights and start from epoch 0'
      - 'Cancel the entire project and fire the team'
      - 'Ignore the loss spike and continue training'
      - 'Roll back, skip the bad batches, and resume'
    answer_index: 3
    explanation: 'Standard cluster protocol involves rolling back to clean checkpoints and skipping the corrupted data shard.'
  - question: 'What role do educational classifiers (like FineWeb-Edu) play in modern foundation model data pipelines?'
    options:
      - 'Small classifiers score and filter for quality'
      - 'They grade student homework automatically'
      - 'They teach university courses'
      - 'They enforce copyright laws'
    answer_index: 0
    explanation: 'Educational classifiers filter web data for informational density, reasoning, and pedagogical clarity.'
