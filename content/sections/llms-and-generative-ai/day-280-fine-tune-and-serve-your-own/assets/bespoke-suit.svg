<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fit against convenience.">
  <title>Off the peg, or tailored</title>
  <style>
    .bespoke-suit-bg   { fill: #f8fafc; }
    .bespoke-suit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bespoke-suit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bespoke-suit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bespoke-suit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bespoke-suit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bespoke-suit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bespoke-suit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bespoke-suit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bespoke-suit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bespoke-suit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bespoke-suit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bespoke-suit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bespoke-suit-row { opacity: 1; }
    .bespoke-suit-r0 { animation-delay: 0.00s; }
    .bespoke-suit-r1 { animation-delay: 0.45s; }
    .bespoke-suit-r2 { animation-delay: 0.90s; }
    .bespoke-suit-r3 { animation-delay: 1.35s; }
    .bespoke-suit-r4 { animation-delay: 1.80s; }
    .bespoke-suit-row { animation: bespoke-suit-reveal 7.3s ease-in-out infinite; }
    @keyframes bespoke-suit-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bespoke-suit-bg" width="980" height="390"/>
  <text class="bespoke-suit-h1"  x="30" y="40">Off the peg, or tailored</text>
  <text class="bespoke-suit-sub" x="30" y="64">Fit against convenience.</text>
  <rect class="bespoke-suit-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bespoke-suit-name" x="46" y="122">Off the peg</text>
  <text class="bespoke-suit-desc" x="46" y="142">Available immediately.</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r0" x="46" y="182">Fits most situations adequately</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r1" x="46" y="216">No measurement or fitting</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r2" x="46" y="250">Works for anything you ask</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r3" x="46" y="284">Never quite exact</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r4" x="46" y="318">This is a general model</text>
  <rect class="bespoke-suit-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bespoke-suit-name" x="526" y="122">Tailored</text>
  <text class="bespoke-suit-desc" x="526" y="142">Fits one person.</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r0" x="526" y="182">Measured to one shape</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r1" x="526" y="216">Time and effort up front</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r2" x="526" y="250">Excellent at its purpose</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r3" x="526" y="284">Poor outside it</text>
  <text class="bespoke-suit-desc bespoke-suit-row bespoke-suit-r4" x="526" y="318">This is a fine-tuned model</text>
  <text class="bespoke-suit-sub" x="30" y="372">The narrowness is the point rather than a limitation: a model that does one task better than a frontier model will do that task and little else.</text>
</svg>
