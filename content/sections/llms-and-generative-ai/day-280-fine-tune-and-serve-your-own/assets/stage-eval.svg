<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Proving it worked</title>
  <style>
    .stage-eval-bg   { fill: #f8fafc; }
    .stage-eval-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-eval-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-eval-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-eval-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-eval-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-eval-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stage-eval-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stage-eval-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stage-eval-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stage-eval-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stage-eval-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stage-eval-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stage-eval-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stage-eval-stage { opacity: 1; }

    .stage-eval-s0 { animation-delay: 0.00s; }
    .stage-eval-e0 { animation-delay: 0.00s; }
    .stage-eval-s1 { animation-delay: 1.28s; }
    .stage-eval-e1 { animation-delay: 1.28s; }
    .stage-eval-s2 { animation-delay: 2.56s; }
    .stage-eval-e2 { animation-delay: 2.56s; }
    .stage-eval-s3 { animation-delay: 3.84s; }
    .stage-eval-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stage-eval-conn  { animation: stage-eval-trace 6.4s ease-in-out infinite; }
      .stage-eval-stage { animation: stage-eval-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stage-eval-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stage-eval-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stage-eval-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stage-eval-stage { animation: stage-eval-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stage-eval-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stage-eval-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stage-eval-bg" width="980" height="322"/>
  <text class="stage-eval-h1"  x="30" y="40">Proving it worked</text>
  <text class="stage-eval-sub" x="30" y="64">Four steps.</text>
  <g class="stage-eval-stage stage-eval-s0">
    <rect class="stage-eval-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stage-eval-step" x="44" y="142">01</text>
    <text class="stage-eval-name" x="70" y="142">Hold out test cases from the start</text>
    <text class="stage-eval-desc" x="44" y="166">Never seen during training.</text>
  </g>
  <line class="stage-eval-line stage-eval-conn stage-eval-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stage-eval-tip)"/>
  <g class="stage-eval-stage stage-eval-s1">
    <rect class="stage-eval-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stage-eval-step" x="280" y="142">02</text>
    <text class="stage-eval-name" x="306" y="142">Run both the base and the fine-tune</text>
    <text class="stage-eval-desc" x="280" y="166">Same prompts, same parameters.</text>
  </g>
  <line class="stage-eval-line stage-eval-conn stage-eval-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stage-eval-tip)"/>
  <g class="stage-eval-stage stage-eval-s2">
    <rect class="stage-eval-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stage-eval-step" x="516" y="142">03</text>
    <text class="stage-eval-name" x="542" y="142">Measure format validity and accuracy separately</text>
    <text class="stage-eval-desc" x="516" y="166">Fine-tuning usually helps format</text>
    <text class="stage-eval-desc" x="516" y="182">most.</text>
  </g>
  <line class="stage-eval-line stage-eval-conn stage-eval-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stage-eval-tip)"/>
  <g class="stage-eval-stage stage-eval-s3">
    <rect class="stage-eval-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stage-eval-step" x="752" y="142">04</text>
    <text class="stage-eval-name" x="778" y="142">And decide on the numbers</text>
    <text class="stage-eval-desc" x="752" y="166">Including whether to ship at</text>
    <text class="stage-eval-desc" x="752" y="182">all.</text>
  </g>
  <text class="stage-eval-sub" x="30" y="304">Separating format validity from accuracy is worth doing because they move independently: a fine-tune often fixes structure completely while barely changing correctness.</text>
</svg>
