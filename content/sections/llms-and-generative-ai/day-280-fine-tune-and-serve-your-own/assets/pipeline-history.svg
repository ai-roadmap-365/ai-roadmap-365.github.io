<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each one removed a barrier.">
  <title>Four steps to an owned pipeline</title>
  <style>
    .pipeline-history-bg   { fill: #f8fafc; }
    .pipeline-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-history-stage { opacity: 1; }

    .pipeline-history-s0 { animation-delay: 0.00s; }
    .pipeline-history-e0 { animation-delay: 0.00s; }
    .pipeline-history-s1 { animation-delay: 1.28s; }
    .pipeline-history-e1 { animation-delay: 1.28s; }
    .pipeline-history-s2 { animation-delay: 2.56s; }
    .pipeline-history-e2 { animation-delay: 2.56s; }
    .pipeline-history-s3 { animation-delay: 3.84s; }
    .pipeline-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-history-conn  { animation: pipeline-history-trace 6.4s ease-in-out infinite; }
      .pipeline-history-stage { animation: pipeline-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pipeline-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-history-stage { animation: pipeline-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-history-bg" width="980" height="322"/>
  <text class="pipeline-history-h1"  x="30" y="40">Four steps to an owned pipeline</text>
  <text class="pipeline-history-sub" x="30" y="64">Each one removed a barrier.</text>
  <g class="pipeline-history-stage pipeline-history-s0">
    <rect class="pipeline-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-history-step" x="44" y="142">01</text>
    <text class="pipeline-history-name" x="70" y="142">Capable models were closed</text>
    <text class="pipeline-history-desc" x="44" y="166">Available only through an API.</text>
  </g>
  <line class="pipeline-history-line pipeline-history-conn pipeline-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pipeline-history-tip)"/>
  <g class="pipeline-history-stage pipeline-history-s1">
    <rect class="pipeline-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-history-step" x="280" y="142">02</text>
    <text class="pipeline-history-name" x="306" y="142">Then open weights arrived</text>
    <text class="pipeline-history-desc" x="280" y="166">Close enough in capability to be</text>
    <text class="pipeline-history-desc" x="280" y="182">useful.</text>
  </g>
  <line class="pipeline-history-line pipeline-history-conn pipeline-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pipeline-history-tip)"/>
  <g class="pipeline-history-stage pipeline-history-s2">
    <rect class="pipeline-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-history-step" x="516" y="142">03</text>
    <text class="pipeline-history-name" x="542" y="142">Adapters made fine-tuning cheap</text>
    <text class="pipeline-history-desc" x="516" y="166">One device rather than a</text>
    <text class="pipeline-history-desc" x="516" y="182">cluster.</text>
  </g>
  <line class="pipeline-history-line pipeline-history-conn pipeline-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pipeline-history-tip)"/>
  <g class="pipeline-history-stage pipeline-history-s3">
    <rect class="pipeline-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-history-step" x="752" y="142">04</text>
    <text class="pipeline-history-name" x="778" y="142">And quantised local serving closed the loop</text>
    <text class="pipeline-history-desc" x="752" y="166">Which made the whole path</text>
    <text class="pipeline-history-desc" x="752" y="182">affordable.</text>
  </g>
  <text class="pipeline-history-sub" x="30" y="304">No single step made this possible; each removed one barrier, and the pipeline only became practical once all four had happened.</text>
</svg>
