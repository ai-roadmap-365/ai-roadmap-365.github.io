<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four checks before training.">
  <title>The dataset stage</title>
  <style>
    .stage-dataset-bg   { fill: #f8fafc; }
    .stage-dataset-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-dataset-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-dataset-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-dataset-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-dataset-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-dataset-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stage-dataset-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stage-dataset-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stage-dataset-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stage-dataset-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stage-dataset-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stage-dataset-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stage-dataset-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stage-dataset-stage { opacity: 1; }

    .stage-dataset-s0 { animation-delay: 0.00s; }
    .stage-dataset-e0 { animation-delay: 0.00s; }
    .stage-dataset-s1 { animation-delay: 1.28s; }
    .stage-dataset-e1 { animation-delay: 1.28s; }
    .stage-dataset-s2 { animation-delay: 2.56s; }
    .stage-dataset-e2 { animation-delay: 2.56s; }
    .stage-dataset-s3 { animation-delay: 3.84s; }
    .stage-dataset-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stage-dataset-conn  { animation: stage-dataset-trace 6.4s ease-in-out infinite; }
      .stage-dataset-stage { animation: stage-dataset-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stage-dataset-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stage-dataset-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stage-dataset-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stage-dataset-stage { animation: stage-dataset-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stage-dataset-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stage-dataset-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stage-dataset-bg" width="980" height="322"/>
  <text class="stage-dataset-h1"  x="30" y="40">The dataset stage</text>
  <text class="stage-dataset-sub" x="30" y="64">Four checks before training.</text>
  <g class="stage-dataset-stage stage-dataset-s0">
    <rect class="stage-dataset-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stage-dataset-step" x="44" y="142">01</text>
    <text class="stage-dataset-name" x="70" y="142">Rendered through the model's own template</text>
    <text class="stage-dataset-desc" x="44" y="166">Exactly as inference will render</text>
    <text class="stage-dataset-desc" x="44" y="182">it.</text>
  </g>
  <line class="stage-dataset-line stage-dataset-conn stage-dataset-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stage-dataset-tip)"/>
  <g class="stage-dataset-stage stage-dataset-s1">
    <rect class="stage-dataset-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stage-dataset-step" x="280" y="142">02</text>
    <text class="stage-dataset-name" x="306" y="142">With the prompt masked out of the loss</text>
    <text class="stage-dataset-desc" x="280" y="166">So only responses are learned</text>
    <text class="stage-dataset-desc" x="280" y="182">from.</text>
  </g>
  <line class="stage-dataset-line stage-dataset-conn stage-dataset-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stage-dataset-tip)"/>
  <g class="stage-dataset-stage stage-dataset-s2">
    <rect class="stage-dataset-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stage-dataset-step" x="516" y="142">03</text>
    <text class="stage-dataset-name" x="542" y="142">Decontaminated against the evaluation set</text>
    <text class="stage-dataset-desc" x="516" y="166">Or the final numbers mean</text>
    <text class="stage-dataset-desc" x="516" y="182">nothing.</text>
  </g>
  <line class="stage-dataset-line stage-dataset-conn stage-dataset-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stage-dataset-tip)"/>
  <g class="stage-dataset-stage stage-dataset-s3">
    <rect class="stage-dataset-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stage-dataset-step" x="752" y="142">04</text>
    <text class="stage-dataset-name" x="778" y="142">And length-bounded at a percentile</text>
    <text class="stage-dataset-desc" x="752" y="166">Not at the maximum, which one</text>
    <text class="stage-dataset-desc" x="752" y="182">outlier sets.</text>
  </g>
  <text class="stage-dataset-sub" x="30" y="304">All four are cheap to check and expensive to discover afterwards, which is why they belong in the pipeline rather than in a reviewer's memory.</text>
</svg>
