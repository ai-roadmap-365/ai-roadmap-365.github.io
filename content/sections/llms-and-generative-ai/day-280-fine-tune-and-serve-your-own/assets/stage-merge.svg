<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Merging the adapter</title>
  <style>
    .stage-merge-bg   { fill: #f8fafc; }
    .stage-merge-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-merge-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-merge-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-merge-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-merge-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-merge-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stage-merge-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stage-merge-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stage-merge-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stage-merge-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stage-merge-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stage-merge-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stage-merge-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stage-merge-stage { opacity: 1; }

    .stage-merge-s0 { animation-delay: 0.00s; }
    .stage-merge-e0 { animation-delay: 0.00s; }
    .stage-merge-s1 { animation-delay: 1.28s; }
    .stage-merge-e1 { animation-delay: 1.28s; }
    .stage-merge-s2 { animation-delay: 2.56s; }
    .stage-merge-e2 { animation-delay: 2.56s; }
    .stage-merge-s3 { animation-delay: 3.84s; }
    .stage-merge-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stage-merge-conn  { animation: stage-merge-trace 6.4s ease-in-out infinite; }
      .stage-merge-stage { animation: stage-merge-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stage-merge-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stage-merge-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stage-merge-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stage-merge-stage { animation: stage-merge-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stage-merge-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stage-merge-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stage-merge-bg" width="980" height="322"/>
  <text class="stage-merge-h1"  x="30" y="40">Merging the adapter</text>
  <text class="stage-merge-sub" x="30" y="64">Four steps.</text>
  <g class="stage-merge-stage stage-merge-s0">
    <rect class="stage-merge-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stage-merge-step" x="44" y="142">01</text>
    <text class="stage-merge-name" x="70" y="142">Multiply the two adapter matrices</text>
    <text class="stage-merge-desc" x="44" y="166">Giving a full-shaped update.</text>
  </g>
  <line class="stage-merge-line stage-merge-conn stage-merge-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stage-merge-tip)"/>
  <g class="stage-merge-stage stage-merge-s1">
    <rect class="stage-merge-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stage-merge-step" x="280" y="142">02</text>
    <text class="stage-merge-name" x="306" y="142">Scale it by the configured factor</text>
    <text class="stage-merge-desc" x="280" y="166">The same one used during</text>
    <text class="stage-merge-desc" x="280" y="182">training.</text>
  </g>
  <line class="stage-merge-line stage-merge-conn stage-merge-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stage-merge-tip)"/>
  <g class="stage-merge-stage stage-merge-s2">
    <rect class="stage-merge-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stage-merge-step" x="516" y="142">03</text>
    <text class="stage-merge-name" x="542" y="142">Add it to the base weight</text>
    <text class="stage-merge-desc" x="516" y="166">In place, layer by layer.</text>
  </g>
  <line class="stage-merge-line stage-merge-conn stage-merge-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stage-merge-tip)"/>
  <g class="stage-merge-stage stage-merge-s3">
    <rect class="stage-merge-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stage-merge-step" x="752" y="142">04</text>
    <text class="stage-merge-name" x="778" y="142">Producing a plain model</text>
    <text class="stage-merge-desc" x="752" y="166">Which every downstream tool</text>
    <text class="stage-merge-desc" x="752" y="182">accepts.</text>
  </g>
  <text class="stage-merge-sub" x="30" y="304">Using a different scaling factor at merge time than at training time silently produces a model that behaves unlike the one you evaluated.</text>
</svg>
