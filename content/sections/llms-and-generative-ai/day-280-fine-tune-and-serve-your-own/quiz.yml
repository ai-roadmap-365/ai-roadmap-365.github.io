questions:
- question: What is the mathematical equation used to permanently merge a trained LoRA adapter back into
    base model weights?
  options:
  - W_merged = W_base / (B + A)
  - W_merged = W_base + (B @ A) * (alpha / r)
  - W_merged = W_base * (B - A)
  - W_merged = (W_base @ B) + A
  answer_index: 1
  explanation: During LoRA merging, the product of low-rank matrices B and A scaled by the LoRA ratio
    (alpha / r) is added element-wise directly to the frozen base weight matrix W_base.
- question: Why is adapter merging necessary before converting a model to GGUF for llama.cpp/Ollama deployment?
  options:
  - Because PyTorch cannot run on laptops
  - Because merging folds the low-rank delta directly into the primary weight tensors, allowing standard
    quantization tools (like llama-quantize) to compress the entire unified model into a single self-contained
    GGUF binary with zero runtime adapter computation overhead
  - Because adapters expire after 30 days
  - Because LoRA matrices cannot be saved to disk
  answer_index: 1
  explanation: Folding adapter weights into base weights eliminates runtime low-rank matrix multiplications,
    allowing the full model to be quantized into INT8 or INT4 GGUF formats.
- question: What are the three most critical automated metrics for evaluating a domain-specialized fine-tuned
    model against its base model?
  options:
  - GPU temperature, fan speed, and screen brightness
  - Output Token Exact Match / F1, Strict JSON Schema / Syntax Compliance Rate, and Task Domain Accuracy
    (e.g. SQL execution validity)
  - Number of parameters, Git commit count, and lines of Python code
  - Dataset download speed, RAM usage, and WiFi latency
  answer_index: 1
  explanation: Quantitative fine-tuning evaluation compares structured compliance (e.g. JSON validity),
    domain accuracy (e.g. SQL correctness), and token similarity metrics between baseline and fine-tuned
    checkpoints.
- question: What happens if a fine-tuned model exhibits catastrophic forgetting during domain specialization?
  options:
  - The model file deletes itself from disk
  - The model loses its broad general reasoning, conversational ability, or instruction-following capabilities
    while gaining domain accuracy, requiring replay data mixing during training
  - The model starts generating random binary bytes
  - The GPU runs out of VRAM
  answer_index: 1
  explanation: Catastrophic forgetting occurs when training excessively on narrow domain data causes the
    model to forget general knowledge. Mixing in 10-20% general instruction data mitigates this.
- question: How does a fine-tuned model served locally compare economically to commercial cloud APIs for
    steady 24/7 internal workloads?
  options:
  - Local models are 100x more expensive
  - Local models have zero variable token API costs and guarantee complete data sovereignty and air-gapped
    security on owned hardware
  - Local models require daily paid subscription renewals
  - Local models cannot output JSON
  answer_index: 1
  explanation: Serving fine-tuned models on local workstations or private servers eliminates metered per-token
    API costs while maintaining strict air-gapped privacy.
