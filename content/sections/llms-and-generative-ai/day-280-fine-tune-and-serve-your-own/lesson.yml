week: 40
learning_promise: 'Synthesize the complete lifecycle of custom open-weight language models: curate a specialized
  instruction dataset, train Low-Rank Adaptation (LoRA) weights, merge adapters back into base tensors,
  quantize to GGUF, package into an Ollama Modelfile, serve an OpenAI-compatible API endpoint, and quantitatively
  benchmark performance before and after fine-tuning.'
objectives:
- Architect the full end-to-end pipeline from raw data curation to quantized local API deployment.
- 'Implement exact weight merging mathematics: W_merged = W_base + (B @ A) * (alpha / r).'
- Export merged model weights into GGUF binary format and package a production Modelfile.
- Deploy a local HTTP inference server exposing OpenAI-compatible streaming endpoints.
- Construct an automated quantitative benchmark comparing Base vs Fine-Tuned model outputs across Exact
  Match (EM), JSON schema validity, and inference latency.
