terms:
- term: Adapter Merging
  definition: The mathematical operation W_merged = W_base + (B @ A) * (alpha / r)
    that permanently incorporates LoRA weights into base tensors.
- term: End-to-End Pipeline
  definition: The complete workflow spanning dataset curation, fine-tuning, weight
    merging, quantization, serving, and evaluation.
- term: Modelfile
  definition: A configuration manifest defining base GGUF paths, system prompts, inference
    parameters, and chat templates in Ollama.
- term: Catastrophic Forgetting
  definition: The degradation of general reasoning capabilities when a neural network
    is over-specialized on a narrow domain dataset.
- term: Schema Compliance Rate
  definition: The percentage of model outputs that strictly adhere to a target JSON
    Schema or programming language grammar without syntax errors.
- term: Exact Match (EM)
  definition: A binary evaluation metric measuring whether the model's generated text
    matches the golden target string exactly.
- term: Air-Gapped Serving
  definition: Deploying machine learning models in an isolated network environment
    with zero external internet connectivity.
- term: Time-To-First-Token (TTFT)
  definition: The latency duration required to process the input prompt prefill and
    emit the initial response token.
