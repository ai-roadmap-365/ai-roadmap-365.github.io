questions:
  - question: 'What does the term OpenAI-Compatible API mean in modern AI engineering?'
    options:
      - 'Any third-party cloud API (Groq, Together, DeepSeek) or self-hosted inference server (vLLM, Ollama) that implements the exact HTTP REST specification, JSON schema, and streaming protocol of OpenAI /v1/chat/completions'
      - 'An API that only runs on Microsoft Windows'
      - 'An API that translates English into Python code'
      - 'An API requiring an official OpenAI credit card'
    answer_index: 0
    explanation: 'The OpenAI API format has become the universal standard supported across cloud providers and open-source engines.'
  - question: 'How can you point the official OpenAI Python SDK client to a local vLLM or Ollama instance?'
    options:
      - 'By passing base_url="http://localhost:8000/v1" and a placeholder api_key="EMPTY" to the OpenAI() client constructor'
      - 'By modifying your computer BIOS settings'
      - 'By deleting the requests library'
      - 'By renaming your Python script to ollama.py'
    answer_index: 0
    explanation: 'Setting base_url redirects the SDK HTTP requests to any self-hosted or third-party compatible endpoint.'
  - question: 'What is the primary architectural advantage of using the OpenAI-compatible standard across an enterprise codebase?'
    options:
      - 'Zero vendor lock-in: switching between local GPUs (vLLM), ultra-fast LPUs (Groq), or commercial clouds requires changing only configuration variables without rewriting application logic'
      - 'It makes GPUs run 10 times cooler'
      - 'It bypasses all cloud token costs permanently'
      - 'It eliminates the need for unit testing'
    answer_index: 0
    explanation: 'Standardized interfaces decouple business logic from specific cloud hosting providers.'
  - question: 'What is Multi-Provider Failover in AI routing gateways?'
    options:
      - 'An architectural pattern where a client automatically catches HTTP 429 rate limit or 500 server errors from a primary provider and immediately retries the request against a secondary backup provider'
      - 'Connecting two monitors to one laptop'
      - 'Using two graphics cards in parallel'
      - 'Translating prompts into binary numbers'
    answer_index: 0
    explanation: 'Failover routers guarantee 99.99% system availability by dynamically switching healthy providers.'
  - question: 'What is the format of the messages array in the /v1/chat/completions schema?'
    options:
      - 'A list of dictionaries with "role" (system, user, assistant, tool) and "content" (string or array of content parts)'
      - 'A single semicolon-delimited string'
      - 'A binary byte stream'
      - 'An XML document with HTML tags'
    answer_index: 0
    explanation: 'The standard messages schema uses dictionaries containing role and content keys.'
