  - question: 'What is the primary architectural advantage of using the OpenAI-compatible standard across an enterprise codebase?'
    options:
      - 'No lock-in — switching providers is a config change'
      - 'It makes GPUs run 10 times cooler'
      - 'It bypasses all cloud token costs permanently'
      - 'It eliminates the need for unit testing'
    answer_index: 0
    explanation: 'Standardized interfaces decouple business logic from specific cloud hosting providers.'
  - question: 'What is Multi-Provider Failover in AI routing gateways?'
    options:
      - 'Connecting two monitors to one laptop'
      - 'Catch a 429 or 500 and retry against a backup provider'
      - 'Using two graphics cards in parallel'
      - 'Translating prompts into binary numbers'
    answer_index: 1
    explanation: 'Failover routers guarantee 99.99% system availability by dynamically switching healthy providers.'
  - question: 'What is the format of the messages array in the /v1/chat/completions schema?'
    options:
      - 'A binary byte stream'
      - 'A single semicolon-delimited string'
      - 'Dicts with a role and content field'
      - 'An XML document with HTML tags'
    answer_index: 2
    explanation: 'The standard messages schema uses dictionaries containing role and content keys.'
