terms:
  - term: 'OpenAI-Compatible Standard'
    definition: 'The de facto industry HTTP/JSON REST protocol for LLM text generation based on /v1/chat/completions.'
  - term: 'base_url'
    definition: 'The root URL endpoint parameter configured on API clients to direct traffic to alternative providers or local servers.'
  - term: 'vLLM'
    definition: 'A high-throughput, memory-efficient LLM serving engine implementing PagedAttention and an OpenAI-compatible server.'
  - term: 'Ollama'
    definition: 'A local LLM execution framework that packages open-weights models into GGUF containers with an OpenAI-compatible REST API.'
  - term: 'Provider Failover'
    definition: 'An automated routing mechanism that retries failed requests on secondary model providers when the primary provider suffers an outage.'
  - term: 'Model Alias'
    definition: 'A virtual model name (e.g. gpt-fast) mapped dynamically to specific physical model checkpoints across providers.'
  - term: 'Groq LPU'
    definition: 'A custom Language Processing Unit hardware accelerator delivering 500+ tokens/sec over an OpenAI-compatible endpoint.'
  - term: 'LiteLLM'
    definition: 'An open-source library and proxy standardizing 100+ LLM APIs into the unified OpenAI request-response format.'
