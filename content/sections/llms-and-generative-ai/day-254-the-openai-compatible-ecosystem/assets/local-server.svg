<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The same protocol, locally</title>
  <style>
    .local-server-bg   { fill: #f8fafc; }
    .local-server-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-server-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-server-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-server-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-server-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-server-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-server-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-server-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-server-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-server-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-server-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-server-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .local-server-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .local-server-stage { opacity: 1; }

    .local-server-s0 { animation-delay: 0.00s; }
    .local-server-e0 { animation-delay: 0.00s; }
    .local-server-s1 { animation-delay: 1.28s; }
    .local-server-e1 { animation-delay: 1.28s; }
    .local-server-s2 { animation-delay: 2.56s; }
    .local-server-e2 { animation-delay: 2.56s; }
    .local-server-s3 { animation-delay: 3.84s; }
    .local-server-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .local-server-conn  { animation: local-server-trace 6.4s ease-in-out infinite; }
      .local-server-stage { animation: local-server-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes local-server-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes local-server-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .local-server-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .local-server-stage { animation: local-server-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes local-server-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="local-server-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="local-server-bg" width="980" height="322"/>
  <text class="local-server-h1"  x="30" y="40">The same protocol, locally</text>
  <text class="local-server-sub" x="30" y="64">Four steps.</text>
  <g class="local-server-stage local-server-s0">
    <rect class="local-server-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="local-server-step" x="44" y="142">01</text>
    <text class="local-server-name" x="70" y="142">Download an open-weight model</text>
    <text class="local-server-desc" x="44" y="166">Quantised, for ordinary</text>
    <text class="local-server-desc" x="44" y="182">hardware.</text>
  </g>
  <line class="local-server-line local-server-conn local-server-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#local-server-tip)"/>
  <g class="local-server-stage local-server-s1">
    <rect class="local-server-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="local-server-step" x="280" y="142">02</text>
    <text class="local-server-name" x="306" y="142">Run a server that speaks the same protocol</text>
    <text class="local-server-desc" x="280" y="166">Which most inference servers now</text>
    <text class="local-server-desc" x="280" y="182">do.</text>
  </g>
  <line class="local-server-line local-server-conn local-server-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#local-server-tip)"/>
  <g class="local-server-stage local-server-s2">
    <rect class="local-server-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="local-server-step" x="516" y="142">03</text>
    <text class="local-server-name" x="542" y="142">Point the client at it</text>
    <text class="local-server-desc" x="516" y="166">One configuration value changes.</text>
  </g>
  <line class="local-server-line local-server-conn local-server-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#local-server-tip)"/>
  <g class="local-server-stage local-server-s3">
    <rect class="local-server-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="local-server-step" x="752" y="142">04</text>
    <text class="local-server-name" x="778" y="142">And the application code is unchanged</text>
    <text class="local-server-desc" x="752" y="166">Which makes local development</text>
    <text class="local-server-desc" x="752" y="182">against a real model routine.</text>
    <text class="local-server-edge" x="752" y="242">free</text>
  </g>
  <text class="local-server-sub" x="30" y="304">This is what makes offline development and privacy-sensitive deployment practical: the same code path, tested the same way, with the network removed.</text>
</svg>
