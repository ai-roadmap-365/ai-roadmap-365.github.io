<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One place for four concerns.">
  <title>The gateway pattern</title>
  <style>
    .gateway-bg   { fill: #f8fafc; }
    .gateway-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gateway-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gateway-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gateway-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gateway-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gateway-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gateway-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gateway-stage { opacity: 1; }

    .gateway-s0 { animation-delay: 0.00s; }
    .gateway-e0 { animation-delay: 0.00s; }
    .gateway-s1 { animation-delay: 1.28s; }
    .gateway-e1 { animation-delay: 1.28s; }
    .gateway-s2 { animation-delay: 2.56s; }
    .gateway-e2 { animation-delay: 2.56s; }
    .gateway-s3 { animation-delay: 3.84s; }
    .gateway-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gateway-conn  { animation: gateway-trace 6.4s ease-in-out infinite; }
      .gateway-stage { animation: gateway-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gateway-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gateway-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gateway-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gateway-stage { animation: gateway-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gateway-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gateway-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gateway-bg" width="980" height="322"/>
  <text class="gateway-h1"  x="30" y="40">The gateway pattern</text>
  <text class="gateway-sub" x="30" y="64">One place for four concerns.</text>
  <g class="gateway-stage gateway-s0">
    <rect class="gateway-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-step" x="44" y="142">01</text>
    <text class="gateway-name" x="70" y="142">Route to the right provider</text>
    <text class="gateway-desc" x="44" y="166">By cost, capability or</text>
    <text class="gateway-desc" x="44" y="182">availability.</text>
  </g>
  <line class="gateway-line gateway-conn gateway-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gateway-tip)"/>
  <g class="gateway-stage gateway-s1">
    <rect class="gateway-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-step" x="280" y="142">02</text>
    <text class="gateway-name" x="306" y="142">Hold the credentials</text>
    <text class="gateway-desc" x="280" y="166">So application code never sees a</text>
    <text class="gateway-desc" x="280" y="182">provider key.</text>
  </g>
  <line class="gateway-line gateway-conn gateway-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gateway-tip)"/>
  <g class="gateway-stage gateway-s2">
    <rect class="gateway-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-step" x="516" y="142">03</text>
    <text class="gateway-name" x="542" y="142">Log every call uniformly</text>
    <text class="gateway-desc" x="516" y="166">One trace format, whichever</text>
    <text class="gateway-desc" x="516" y="182">provider served it.</text>
  </g>
  <line class="gateway-line gateway-conn gateway-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gateway-tip)"/>
  <g class="gateway-stage gateway-s3">
    <rect class="gateway-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gateway-step" x="752" y="142">04</text>
    <text class="gateway-name" x="778" y="142">And enforce spending and rate limits</text>
    <text class="gateway-desc" x="752" y="166">Centrally, rather than in every</text>
    <text class="gateway-desc" x="752" y="182">service.</text>
  </g>
  <text class="gateway-sub" x="30" y="304">Centralising the credentials is the security benefit that usually justifies the gateway on its own, well before the routing becomes valuable.</text>
</svg>
