<svg role="img" aria-label="OpenAI-compatible API ecosystem hub and spoke architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>The OpenAI-Compatible Ecosystem Architecture</title>
  <defs>
    <linearGradient id="bg254a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card254" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg254a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE OPENAI-COMPATIBLE API ECOSYSTEM</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">One Unified Protocol (/v1/chat/completions) Powering Cloud Providers and Local Engines</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card254)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Unified Client -->
    <rect x="25" y="25" width="210" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="130" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Unified Python Client</text>
    <rect x="35" y="70" width="190" height="70" fill="#1e293b" rx="4"/>
    <text x="45" y="90" fill="#cbd5e1" font-size="8">OpenAI(</text>
    <text x="45" y="105" fill="#cbd5e1" font-size="8">  base_url="...",</text>
    <text x="45" y="120" fill="#cbd5e1" font-size="8">  api_key="..."</text>
    <text x="45" y="132" fill="#cbd5e1" font-size="8">)</text>
    <text x="130" y="240" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Zero Code Changes</text>

    <!-- Cloud Endpoints -->
    <rect x="260" y="25" width="230" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="375" y="50" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Commercial Cloud APIs</text>
    
    <rect x="270" y="70" width="210" height="40" fill="#1e293b" rx="4"/>
    <text x="280" y="88" fill="#38bdf8" font-size="8" font-weight="700">OpenAI:</text>
    <text x="280" y="102" fill="#cbd5e1" font-size="7">api.openai.com/v1 (GPT-4o)</text>

    <rect x="270" y="120" width="210" height="40" fill="#1e293b" rx="4"/>
    <text x="280" y="138" fill="#34d399" font-size="8" font-weight="700">Groq / Together AI:</text>
    <text x="280" y="152" fill="#cbd5e1" font-size="7">api.groq.com/openai/v1 (LPU 500 T/s)</text>

    <rect x="270" y="170" width="210" height="40" fill="#1e293b" rx="4"/>
    <text x="280" y="188" fill="#fb7185" font-size="8" font-weight="700">DeepSeek / Mistral:</text>
    <text x="280" y="202" fill="#cbd5e1" font-size="7">api.deepseek.com/v1 (V3 / R1)</text>

    <text x="375" y="255" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Managed Serverless</text>

    <!-- Local Self-Hosted Engines -->
    <rect x="510" y="25" width="225" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="622" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Local Self-Hosted Engines</text>
    
    <rect x="520" y="70" width="205" height="50" fill="#1e293b" rx="4"/>
    <text x="530" y="88" fill="#38bdf8" font-size="8" font-weight="700">vLLM / TGI (Cluster):</text>
    <text x="530" y="104" fill="#cbd5e1" font-size="7">http://localhost:8000/v1</text>
    <text x="530" y="115" fill="#94a3b8" font-size="6">PagedAttention, Tensor Parallelism</text>

    <rect x="520" y="130" width="205" height="50" fill="#1e293b" rx="4"/>
    <text x="530" y="148" fill="#c084fc" font-size="8" font-weight="700">Ollama / LM Studio (Local):</text>
    <text x="530" y="164" fill="#cbd5e1" font-size="7">http://localhost:11434/v1</text>
    <text x="530" y="175" fill="#94a3b8" font-size="6">GGUF Quantized Apple Silicon</text>

    <text x="622" y="255" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">100% Data Privacy</text>
  </g>
</svg>
