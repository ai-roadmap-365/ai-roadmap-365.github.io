<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a limit.">
  <title>Four consequences of a common interface</title>
  <style>
    .compat-implications-bg   { fill: #f8fafc; }
    .compat-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compat-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compat-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compat-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compat-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compat-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compat-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compat-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compat-implications-stage { opacity: 1; }

    .compat-implications-s0 { animation-delay: 0.00s; }
    .compat-implications-e0 { animation-delay: 0.00s; }
    .compat-implications-s1 { animation-delay: 1.28s; }
    .compat-implications-e1 { animation-delay: 1.28s; }
    .compat-implications-s2 { animation-delay: 2.56s; }
    .compat-implications-e2 { animation-delay: 2.56s; }
    .compat-implications-s3 { animation-delay: 3.84s; }
    .compat-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .compat-implications-conn  { animation: compat-implications-trace 6.4s ease-in-out infinite; }
      .compat-implications-stage { animation: compat-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes compat-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compat-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compat-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compat-implications-stage { animation: compat-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compat-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compat-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compat-implications-bg" width="980" height="322"/>
  <text class="compat-implications-h1"  x="30" y="40">Four consequences of a common interface</text>
  <text class="compat-implications-sub" x="30" y="64">One is a limit.</text>
  <g class="compat-implications-stage compat-implications-s0">
    <rect class="compat-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="compat-implications-step" x="44" y="142">01</text>
    <text class="compat-implications-name" x="70" y="142">Lock-in falls sharply</text>
    <text class="compat-implications-desc" x="44" y="166">Which is the main benefit, and</text>
    <text class="compat-implications-desc" x="44" y="182">it is large.</text>
  </g>
  <line class="compat-implications-line compat-implications-conn compat-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#compat-implications-tip)"/>
  <g class="compat-implications-stage compat-implications-s1">
    <rect class="compat-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="compat-implications-step" x="280" y="142">02</text>
    <text class="compat-implications-name" x="306" y="142">And price competition follows</text>
    <text class="compat-implications-desc" x="280" y="166">Because switching is cheap.</text>
  </g>
  <line class="compat-implications-line compat-implications-conn compat-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#compat-implications-tip)"/>
  <g class="compat-implications-stage compat-implications-s2">
    <rect class="compat-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="compat-implications-step" x="516" y="142">03</text>
    <text class="compat-implications-name" x="542" y="142">But new features arrive late</text>
    <text class="compat-implications-desc" x="516" y="166">The standard follows the leader,</text>
    <text class="compat-implications-desc" x="516" y="182">with a lag.</text>
  </g>
  <line class="compat-implications-line compat-implications-conn compat-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#compat-implications-tip)"/>
  <g class="compat-implications-stage compat-implications-s3">
    <rect class="compat-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="compat-implications-step" x="752" y="142">04</text>
    <text class="compat-implications-name" x="778" y="142">And the abstraction leaks</text>
    <text class="compat-implications-desc" x="752" y="166">Behaviour differs even where the</text>
    <text class="compat-implications-desc" x="752" y="182">interface does not.</text>
  </g>
  <text class="compat-implications-sub" x="30" y="304">The leaking is the honest caveat: identical requests to two providers return different text, so portable code still needs its evaluation run against each one.</text>
</svg>
