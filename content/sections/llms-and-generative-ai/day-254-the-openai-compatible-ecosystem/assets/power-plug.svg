<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which nobody designed as a standard.">
  <title>A standard connector</title>
  <style>
    .power-plug-bg   { fill: #f8fafc; }
    .power-plug-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-plug-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-plug-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-plug-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-plug-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-plug-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .power-plug-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .power-plug-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .power-plug-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .power-plug-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .power-plug-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .power-plug-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .power-plug-row { opacity: 1; }
    .power-plug-r0 { animation-delay: 0.00s; }
    .power-plug-r1 { animation-delay: 0.45s; }
    .power-plug-r2 { animation-delay: 0.90s; }
    .power-plug-r3 { animation-delay: 1.35s; }
    .power-plug-r4 { animation-delay: 1.80s; }
    .power-plug-row { animation: power-plug-reveal 7.3s ease-in-out infinite; }
    @keyframes power-plug-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="power-plug-bg" width="980" height="390"/>
  <text class="power-plug-h1"  x="30" y="40">A standard connector</text>
  <text class="power-plug-sub" x="30" y="64">Which nobody designed as a standard.</text>
  <rect class="power-plug-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="power-plug-name" x="46" y="122">Every device different</text>
  <text class="power-plug-desc" x="46" y="142">Locked in.</text>
  <text class="power-plug-desc power-plug-row power-plug-r0" x="46" y="182">A unique connector per manufacturer</text>
  <text class="power-plug-desc power-plug-row power-plug-r1" x="46" y="216">Switching means replacing everything</text>
  <text class="power-plug-desc power-plug-row power-plug-r2" x="46" y="250">No competition on price</text>
  <text class="power-plug-desc power-plug-row power-plug-r3" x="46" y="284">Adapters, everywhere</text>
  <text class="power-plug-desc power-plug-row power-plug-r4" x="46" y="318">This was the early model market</text>
  <rect class="power-plug-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="power-plug-name" x="526" y="122">One connector</text>
  <text class="power-plug-desc" x="526" y="142">Interchangeable.</text>
  <text class="power-plug-desc power-plug-row power-plug-r0" x="526" y="182">Any device, any supply</text>
  <text class="power-plug-desc power-plug-row power-plug-r1" x="526" y="216">Switching costs nothing</text>
  <text class="power-plug-desc power-plug-row power-plug-r2" x="526" y="250">Competition on price and quality</text>
  <text class="power-plug-desc power-plug-row power-plug-r3" x="526" y="284">Adapters rarely needed</text>
  <text class="power-plug-desc power-plug-row power-plug-r4" x="526" y="318">This is the compatible interface</text>
  <text class="power-plug-sub" x="30" y="372">The market effect is the same in both cases: interchangeability is what forces competition onto price and quality rather than onto lock-in.</text>
</svg>
