visuals:
  - id: openai-compatible-ecosystem-architecture-hub
    file: assets/openai-compatible-ecosystem-architecture-hub.svg
    type: diagram
    title: 'The OpenAI-Compatible Ecosystem Architecture'
    alt: OpenAI-compatible API ecosystem hub and spoke architecture diagram
    description: 'Overview of the single unified /v1/chat/completions protocol connecting commercial cloud endpoints and local engines.'
  - id: multi-provider-failover-and-cost-routing-tree
    file: assets/multi-provider-failover-and-cost-routing-tree.svg
    type: diagram
    title: 'Multi-Provider Failover & Cost Router'
    alt: Multi-provider failover routing decision tree diagram
    description: 'Decision tree illustrating tiered multi-provider routing from fast local models to resilient cloud frontier fallbacks.'
  - id: compat-idea
    file: assets/compat-idea.svg
    type: diagram
    title: 'One interface, many providers'
    alt: 'Diagram: how a shared API shape makes model providers interchangeable'
    description: 'A four-stage description of interface compatibility covering the shared shape, the base address, provider switching and the residual differences.'
  - id: failover
    file: assets/failover.svg
    type: diagram
    title: 'Failing over between providers'
    alt: 'Diagram: how requests fail over between model providers'
    description: 'A four-stage description of provider failover covering the primary, health detection, the fallback and reconciliation.'
  - id: local-server
    file: assets/local-server.svg
    type: diagram
    title: 'The same protocol, locally'
    alt: 'Diagram: running a local model behind the same API interface'
    description: 'A four-stage description of local serving covering the open model, the compatible server, the changed address and the identical code.'
  - id: tool-calling-std
    file: assets/tool-calling-std.svg
    type: diagram
    title: 'Where compatibility holds and where it breaks'
    alt: 'Diagram: the portable parts of the shared API compared with the provider-specific parts'
    description: 'A two-column comparison of portable API features against provider-specific ones.'
  - id: gateway
    file: assets/gateway.svg
    type: diagram
    title: 'The gateway pattern'
    alt: 'Diagram: the four responsibilities a model gateway centralises'
    description: 'A four-stage description of a model gateway covering routing, credentials, observability and limits.'
  - id: power-plug
    file: assets/power-plug.svg
    type: diagram
    title: 'A standard connector'
    alt: 'Diagram: incompatible connectors compared with a common standard'
    description: 'A two-column comparison of proprietary connectors against a shared standard.'
  - id: compat-implications
    file: assets/compat-implications.svg
    type: diagram
    title: 'Four consequences of a common interface'
    alt: 'Diagram: the portability, competition, feature and abstraction implications of a shared API standard'
    description: 'A four-stage description of compatibility implications covering reduced lock-in, price competition, delayed features and leaky abstraction.'
  - id: compat-when
    file: assets/compat-when.svg
    type: diagram
    title: 'When to use a compatible layer'
    alt: 'Diagram: when to use a provider-agnostic interface and when to call a provider directly'
    description: 'A two-column comparison of using a compatible abstraction against calling one provider directly.'
  - id: compat-history
    file: assets/compat-history.svg
    type: diagram
    title: 'Four steps to an interchangeable market'
    alt: 'Diagram: the historical progression toward a common model API interface'
    description: 'A four-stage description of API convergence covering divergent interfaces, one shape gaining adoption, open servers adopting it and routing layers built on top.'
  - id: gateway-vs-direct
    file: assets/gateway-vs-direct.svg
    type: diagram
    title: 'A gateway against direct calls'
    alt: 'Diagram: a centralised model gateway compared with direct calls from each service'
    description: 'A two-column comparison of routing all model traffic through a gateway against calling providers directly from each service.'
