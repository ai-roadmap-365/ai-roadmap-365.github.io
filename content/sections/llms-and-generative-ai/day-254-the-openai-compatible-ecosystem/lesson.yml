learning_promise: 'Master the lingua franca of generative AI APIs: understand the OpenAI Chat Completions standard (/v1/chat/completions), route requests seamlessly across proprietary APIs (OpenAI, Groq, Together AI, Mistral, Perplexity, DeepSeek) and self-hosted open-weights inference engines (vLLM, Ollama, LM Studio, TGI) using a single unified client interface, configure base_url, custom headers, and model aliases, implement robust provider fallback failover logic, and build a multi-provider OpenAI-compatible client router in Python.'
objectives:
  - 'Understand the standard OpenAI /v1/chat/completions REST and JSON schema specification.'
  - 'Configure base_url and custom api_key headers to connect to third-party and local providers.'
  - 'Connect to self-hosted vLLM and Ollama instances using the standard OpenAI Python client.'
  - 'Implement automated provider failover logic for high-availability enterprise routing.'
  - 'Build an extensible multi-provider API router with latency benchmarking in Python.'
