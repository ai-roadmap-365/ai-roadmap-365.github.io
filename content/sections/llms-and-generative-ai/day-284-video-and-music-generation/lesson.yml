learning_promise: 'Master spatio-temporal video diffusion and neural audio generation architectures: deconstruct
  3D U-Net and Diffusion Transformer video pipelines, implement temporal attention layers, understand
  Residual Vector Quantization (RVQ) in neural audio codecs, and build a video frame consistency evaluator
  in Python.'
objectives:
- 'Analyze 3D video latent representations: Batch, Channels, Frames, Height, Width.'
- Implement factorized spatial and temporal self-attention in Python.
- Deconstruct neural audio codecs (EnCodec / Descript DAC) and Residual Vector Quantization (RVQ).
- Evaluate temporal coherence and compute Fréchet Video Distance (FVD) metrics.
- Build a temporal frame consistency and interpolation simulator in Python and NumPy.
