questions:
- question: What is the primary architectural difference between 2D image diffusion and 3D video diffusion
    models?
  options:
  - Video diffusion does not use GPUs
  - Video diffusion deletes the VAE autoencoder
  - Video diffusion only operates on black-and-white clips
  - 'They add a temporal dimension and temporal attention'
  answer_index: 3
  explanation: Video diffusion models add temporal attention blocks that calculate attention across consecutive
    frames to maintain object identities and motion trajectories.
- question: How does Residual Vector Quantization (RVQ) compress audio in neural codecs like Meta EnCodec?
  options:
  - 'Each stage quantizes the previous residual'
  - By converting audio into text subtitles
  - By speeding up audio playback by 2x
  - By filtering out high frequencies above 5kHz
  answer_index: 0
  explanation: 'RVQ uses an ensemble of N codebooks: Codebook 1 captures coarse structure, and Codebooks
    2..N progressively refine high-frequency nuances.'
- question: Why is factorized spatio-temporal attention used instead of full 3D joint attention in video
    diffusion?
  options:
  - Full 3D attention cannot be trained with backpropagation
  - 'Full 3D attention is quadratic; factorising splits it'
  - Spatial attention only works on JPEG images
  - Temporal attention removes all color
  answer_index: 1
  explanation: Factorizing into distinct spatial and temporal attention blocks reduces computational complexity
    from astronomical joint volume scaling to two manageable operations.
- question: What is the primary cause of 'morphing' or visual flickering in naive frame-by-frame video
    generation?
  options:
  - The computer monitor refresh rate
  - Overheating graphics processors
  - 'No temporal conditioning'
  - Incorrect audio bitrate
  answer_index: 2
  explanation: Without temporal cross-attention or causal latents, independent diffusion samplers produce
    inconsistent object textures and geometries across frames.
- question: What metric is standardly used to evaluate video generation fidelity and motion realism?
  options:
  - BLEU score
  - Perplexity
  - Word Error Rate
  - 'FVD'
  answer_index: 3
  explanation: FVD measures both visual frame quality and temporal motion coherence using a pretrained
    Inflated 3D ConvNet (I3D).
