<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different failures.">
  <title>Per-frame quality against temporal coherence</title>
  <style>
    .motion-consistency-bg   { fill: #f8fafc; }
    .motion-consistency-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .motion-consistency-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .motion-consistency-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .motion-consistency-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .motion-consistency-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .motion-consistency-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .motion-consistency-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .motion-consistency-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .motion-consistency-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .motion-consistency-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .motion-consistency-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .motion-consistency-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .motion-consistency-row { opacity: 1; }
    .motion-consistency-r0 { animation-delay: 0.00s; }
    .motion-consistency-r1 { animation-delay: 0.45s; }
    .motion-consistency-r2 { animation-delay: 0.90s; }
    .motion-consistency-r3 { animation-delay: 1.35s; }
    .motion-consistency-r4 { animation-delay: 1.80s; }
    .motion-consistency-row { animation: motion-consistency-reveal 7.3s ease-in-out infinite; }
    @keyframes motion-consistency-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="motion-consistency-bg" width="980" height="390"/>
  <text class="motion-consistency-h1"  x="30" y="40">Per-frame quality against temporal coherence</text>
  <text class="motion-consistency-sub" x="30" y="64">Two different failures.</text>
  <rect class="motion-consistency-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="motion-consistency-name" x="46" y="122">Per-frame quality</text>
  <text class="motion-consistency-desc" x="46" y="142">Each frame alone.</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r0" x="46" y="182">Sharpness, detail, composition</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r1" x="46" y="216">Solved by image models</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r2" x="46" y="250">Judged from a still</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r3" x="46" y="284">Improves with the image backbone</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r4" x="46" y="318">Largely a settled problem</text>
  <rect class="motion-consistency-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="motion-consistency-name" x="526" y="122">Temporal coherence</text>
  <text class="motion-consistency-desc" x="526" y="142">Frames together.</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r0" x="526" y="182">Objects persisting, motion continuous</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r1" x="526" y="216">Needs explicit temporal modelling</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r2" x="526" y="250">Only visible in motion</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r3" x="526" y="284">Improves with clip-level training</text>
  <text class="motion-consistency-desc motion-consistency-row motion-consistency-r4" x="526" y="318">The remaining hard problem</text>
  <text class="motion-consistency-sub" x="30" y="372">A clip can score well on every still frame and be unwatchable, which is why evaluation for video cannot be borrowed from image generation.</text>
</svg>
