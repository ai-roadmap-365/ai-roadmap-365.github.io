<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Turning audio into tokens</title>
  <style>
    .rvq-bg   { fill: #f8fafc; }
    .rvq-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rvq-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rvq-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rvq-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rvq-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rvq-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rvq-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rvq-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rvq-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rvq-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rvq-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rvq-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rvq-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rvq-stage { opacity: 1; }

    .rvq-s0 { animation-delay: 0.00s; }
    .rvq-e0 { animation-delay: 0.00s; }
    .rvq-s1 { animation-delay: 1.28s; }
    .rvq-e1 { animation-delay: 1.28s; }
    .rvq-s2 { animation-delay: 2.56s; }
    .rvq-e2 { animation-delay: 2.56s; }
    .rvq-s3 { animation-delay: 3.84s; }
    .rvq-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rvq-conn  { animation: rvq-trace 6.4s ease-in-out infinite; }
      .rvq-stage { animation: rvq-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rvq-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rvq-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rvq-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rvq-stage { animation: rvq-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rvq-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rvq-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rvq-bg" width="980" height="322"/>
  <text class="rvq-h1"  x="30" y="40">Turning audio into tokens</text>
  <text class="rvq-sub" x="30" y="64">Four steps.</text>
  <g class="rvq-stage rvq-s0">
    <rect class="rvq-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rvq-step" x="44" y="142">01</text>
    <text class="rvq-name" x="70" y="142">Quantise the audio to a codebook entry</text>
    <text class="rvq-desc" x="44" y="166">A coarse approximation, and a</text>
    <text class="rvq-desc" x="44" y="182">large error.</text>
  </g>
  <line class="rvq-line rvq-conn rvq-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rvq-tip)"/>
  <g class="rvq-stage rvq-s1">
    <rect class="rvq-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rvq-step" x="280" y="142">02</text>
    <text class="rvq-name" x="306" y="142">Then quantise the error itself</text>
    <text class="rvq-desc" x="280" y="166">With a second codebook.</text>
  </g>
  <line class="rvq-line rvq-conn rvq-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rvq-tip)"/>
  <g class="rvq-stage rvq-s2">
    <rect class="rvq-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rvq-step" x="516" y="142">03</text>
    <text class="rvq-name" x="542" y="142">And repeat, each stage refining the last</text>
    <text class="rvq-desc" x="516" y="166">Eight or more levels deep.</text>
  </g>
  <line class="rvq-line rvq-conn rvq-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rvq-tip)"/>
  <g class="rvq-stage rvq-s3">
    <rect class="rvq-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rvq-step" x="752" y="142">04</text>
    <text class="rvq-name" x="778" y="142">Giving a sequence of discrete tokens</text>
    <text class="rvq-desc" x="752" y="166">Which a sequence model can</text>
    <text class="rvq-desc" x="752" y="182">generate.</text>
    <text class="rvq-edge" x="752" y="242">discrete</text>
  </g>
  <text class="rvq-sub" x="30" y="304">This is what lets a language-model architecture generate music at all: audio becomes a token sequence, and everything known about sequence modelling applies to it.</text>
</svg>
