<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are societal.">
  <title>Four consequences of video generation</title>
  <style>
    .video-implications-bg   { fill: #f8fafc; }
    .video-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .video-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .video-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .video-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .video-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .video-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .video-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .video-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .video-implications-stage { opacity: 1; }

    .video-implications-s0 { animation-delay: 0.00s; }
    .video-implications-e0 { animation-delay: 0.00s; }
    .video-implications-s1 { animation-delay: 1.28s; }
    .video-implications-e1 { animation-delay: 1.28s; }
    .video-implications-s2 { animation-delay: 2.56s; }
    .video-implications-e2 { animation-delay: 2.56s; }
    .video-implications-s3 { animation-delay: 3.84s; }
    .video-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .video-implications-conn  { animation: video-implications-trace 6.4s ease-in-out infinite; }
      .video-implications-stage { animation: video-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes video-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes video-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .video-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .video-implications-stage { animation: video-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes video-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="video-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="video-implications-bg" width="980" height="322"/>
  <text class="video-implications-h1"  x="30" y="40">Four consequences of video generation</text>
  <text class="video-implications-sub" x="30" y="64">Two are societal.</text>
  <g class="video-implications-stage video-implications-s0">
    <rect class="video-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="video-implications-step" x="44" y="142">01</text>
    <text class="video-implications-name" x="70" y="142">Generation is expensive</text>
    <text class="video-implications-desc" x="44" y="166">Minutes of compute for seconds</text>
    <text class="video-implications-desc" x="44" y="182">of output.</text>
  </g>
  <line class="video-implications-line video-implications-conn video-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#video-implications-tip)"/>
  <g class="video-implications-stage video-implications-s1">
    <rect class="video-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="video-implications-step" x="280" y="142">02</text>
    <text class="video-implications-name" x="306" y="142">But it puts motion graphics within reach of anyone</text>
    <text class="video-implications-desc" x="280" y="166">Which is a genuine broadening of</text>
    <text class="video-implications-desc" x="280" y="182">access.</text>
  </g>
  <line class="video-implications-line video-implications-conn video-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#video-implications-tip)"/>
  <g class="video-implications-stage video-implications-s2">
    <rect class="video-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="video-implications-step" x="516" y="142">03</text>
    <text class="video-implications-name" x="542" y="142">And convincing fabricated footage is now cheap</text>
    <text class="video-implications-desc" x="516" y="166">Including of real events and</text>
    <text class="video-implications-desc" x="516" y="182">people.</text>
  </g>
  <line class="video-implications-line video-implications-conn video-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#video-implications-tip)"/>
  <g class="video-implications-stage video-implications-s3">
    <rect class="video-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="video-implications-step" x="752" y="142">04</text>
    <text class="video-implications-name" x="778" y="142">So provenance marking is becoming mandatory</text>
    <text class="video-implications-desc" x="752" y="166">In several jurisdictions</text>
    <text class="video-implications-desc" x="752" y="182">already.</text>
  </g>
  <text class="video-implications-sub" x="30" y="304">The cost is falling steadily, which means the misuse concern grows rather than shrinks as the technology becomes routine.</text>
</svg>
