<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Video Diffusion Spatiotemporal Pipeline">
  <title>Video Diffusion Spatiotemporal Pipeline</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d284a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d284a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d284a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d284a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d284a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d284a-arrowhead); }
      .d284a-pulse { animation: d284a-glow 2.5s infinite ease-in-out; }
      @keyframes d284a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d284a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d284a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d284a-box" x="0" y="0" width="220" height="200" />
    <text class="d284a-header" x="15" y="30">1. 3D Latent Tensor</text>
    <text class="d284a-text" x="15" y="60">• Shape: (B, C, F, H, W)</text>
    <text class="d284a-text" x="15" y="85">• F = Temporal Frames</text>
    <text class="d284a-accent" x="15" y="140">Spatio-Temporal Volume</text>

    <path class="d284a-arrow" d="M 220 100 L 280 100" />

    <rect class="d284a-box d284a-pulse" x="280" y="0" width="240" height="200" />
    <text class="d284a-header" x="15" y="30">2. Factorized Attention</text>
    <text class="d284a-text" x="15" y="60">• Spatial Self-Attention (H*W)</text>
    <text class="d284a-text" x="15" y="85">• Temporal Cross-Attention (F)</text>
    <text class="d284a-accent" x="15" y="140">Motion &amp; Texture Coherence</text>

    <path class="d284a-arrow" d="M 520 100 L 580 100" />

    <rect class="d284a-box" x="580" y="0" width="200" height="200" />
    <text class="d284a-header" x="15" y="30">3. 3D VAE Video Decoder</text>
    <text class="d284a-text" x="15" y="60">• Causal Temporal Deconv</text>
    <text class="d284a-text" x="15" y="85">• 24 FPS MP4 Stream</text>
    <text class="d284a-accent" x="15" y="140">Smooth Video Playback</text>
  </g>

</svg>