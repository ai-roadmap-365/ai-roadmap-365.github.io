<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Consistency is the work.">
  <title>Drawing frames, or animating</title>
  <style>
    .flipbook-bg   { fill: #f8fafc; }
    .flipbook-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flipbook-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flipbook-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flipbook-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flipbook-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flipbook-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .flipbook-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .flipbook-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .flipbook-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .flipbook-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .flipbook-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .flipbook-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .flipbook-row { opacity: 1; }
    .flipbook-r0 { animation-delay: 0.00s; }
    .flipbook-r1 { animation-delay: 0.45s; }
    .flipbook-r2 { animation-delay: 0.90s; }
    .flipbook-r3 { animation-delay: 1.35s; }
    .flipbook-r4 { animation-delay: 1.80s; }
    .flipbook-row { animation: flipbook-reveal 7.3s ease-in-out infinite; }
    @keyframes flipbook-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="flipbook-bg" width="980" height="390"/>
  <text class="flipbook-h1"  x="30" y="40">Drawing frames, or animating</text>
  <text class="flipbook-sub" x="30" y="64">Consistency is the work.</text>
  <rect class="flipbook-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="flipbook-name" x="46" y="122">Frames drawn separately</text>
  <text class="flipbook-desc" x="46" y="142">Each one good.</text>
  <text class="flipbook-desc flipbook-row flipbook-r0" x="46" y="182">Every frame drawn on its own</text>
  <text class="flipbook-desc flipbook-row flipbook-r1" x="46" y="216">Characters change between frames</text>
  <text class="flipbook-desc flipbook-row flipbook-r2" x="46" y="250">Objects appear and vanish</text>
  <text class="flipbook-desc flipbook-row flipbook-r3" x="46" y="284">Unwatchable in sequence</text>
  <text class="flipbook-desc flipbook-row flipbook-r4" x="46" y="318">This is image generation repeated</text>
  <rect class="flipbook-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="flipbook-name" x="526" y="122">Animated as a sequence</text>
  <text class="flipbook-desc" x="526" y="142">The sequence is good.</text>
  <text class="flipbook-desc flipbook-row flipbook-r0" x="526" y="182">Each frame drawn in relation to the last</text>
  <text class="flipbook-desc flipbook-row flipbook-r1" x="526" y="216">Characters stay themselves</text>
  <text class="flipbook-desc flipbook-row flipbook-r2" x="526" y="250">Motion is continuous</text>
  <text class="flipbook-desc flipbook-row flipbook-r3" x="526" y="284">Watchable</text>
  <text class="flipbook-desc flipbook-row flipbook-r4" x="526" y="318">This is video generation</text>
  <text class="flipbook-sub" x="30" y="372">Animators have always understood that the sequence is the unit of work rather than the frame, and it is the same insight these architectures encode.</text>
</svg>
