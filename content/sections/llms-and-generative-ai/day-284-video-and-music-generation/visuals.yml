  description: 'A four-stage description of residual quantisation covering the first codebook, the residual, successive refinement and the token sequence.'
- id: video-vs-image
  file: assets/video-vs-image.svg
  type: diagram
  title: 'Video against image generation'
  alt: 'Diagram: image generation compared with video generation'
  description: 'A two-column comparison of image generation against video generation.'
- id: provenance
  file: assets/provenance.svg
  type: diagram
  title: 'Provenance marking'
  alt: 'Diagram: how provenance metadata is attached to synthetic media'
  description: 'A four-stage description of media provenance covering the manifest, signing, propagation and verification.'
- id: flipbook
  file: assets/flipbook.svg
  type: diagram
