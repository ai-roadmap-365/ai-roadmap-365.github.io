  alt: 'Diagram: drawing frames independently compared with animating a consistent sequence'
  description: 'A two-column comparison of independently drawn frames against a consistent animated sequence.'
- id: video-implications
  file: assets/video-implications.svg
  type: diagram
  title: 'Four consequences of video generation'
  alt: 'Diagram: the cost, access, misuse and provenance implications of video and music generation'
  description: 'A four-stage description of video generation implications covering compute cost, creative access, misuse and provenance requirements.'
- id: video-when
  file: assets/video-when.svg
  type: diagram
  title: 'When to generate video'
  alt: 'Diagram: when generated video and music are appropriate'
  description: 'A two-column comparison of appropriate uses of generated motion media against inappropriate ones.'
- id: video-history
  file: assets/video-history.svg
