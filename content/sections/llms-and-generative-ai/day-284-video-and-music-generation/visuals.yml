  type: diagram
  title: Video Diffusion Spatiotemporal Pipeline
  alt: Video Diffusion Spatiotemporal Pipeline illustrating 3D latent tensor processing with factorized
    spatial and temporal attention blocks
  description: Pipeline showing 3D latent tensor diffusion and factorized spatio-temporal attention.
- id: music-generation-neural-codec-pipeline
  file: assets/music-generation-neural-codec-pipeline.svg
  type: diagram
  title: Music Generation Neural Codec Pipeline
  alt: Music Generation Neural Codec Pipeline illustrating prompt conditioning, residual vector quantization,
    and audio waveform decoding
  description: Diagram showing neural audio code generation and RVQ music decoding.
- id: video-idea
  file: assets/video-idea.svg
  type: diagram
  title: 'Why video is hard'
  alt: 'Diagram: why video generation is substantially harder than image generation'
  description: 'A four-stage description of the video generation problem covering the added dimension, attention cost, temporal consistency and memory.'
- id: factorized-attention
  file: assets/factorized-attention.svg
  type: diagram
  title: 'Factorised attention'
  alt: 'Diagram: how attention is factorised across space and time to make video tractable'
  description: 'A four-stage description of factorised attention covering the full cost, the split, the two passes and the saving.'
- id: rvq
