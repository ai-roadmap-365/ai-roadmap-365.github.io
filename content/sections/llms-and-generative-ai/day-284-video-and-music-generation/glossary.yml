terms:
- term: Spatio-Temporal Diffusion
  definition: Diffusion models operating on 3D video tensors (Batch, Channels, Frames, Height, Width)
    with combined spatial and temporal attention mechanisms.
- term: Temporal Attention
  definition: An attention layer operating across video frames along the time axis to enforce smooth motion
    and prevent flickering.
- term: Neural Audio Codec
  definition: A deep neural network (such as EnCodec or DAC) that compresses continuous raw audio into
    discrete multi-codebook quantization tokens.
- term: Residual Vector Quantization (RVQ)
  definition: A hierarchical quantization technique where each subsequent codebook quantizes the residual
    error of the previous codebook.
- term: Causal 3D VAE
  definition: A temporal autoencoder where frame convolutions look only at past and present frames, enabling
    streaming video generation.
- term: Frame Interpolation
  definition: Synthesizing intermediate video frames between two keyframes to increase frame rate from
    12 FPS to 60 FPS.
- term: AudioCraft / MusicGen
  definition: An autoregressive transformer model from Meta that generates music conditioned on text or
    melody prompts.
- term: Fréchet Video Distance (FVD)
  definition: A standard evaluation metric that measures the statistical distance between distributions
    of generated and real video clips.
