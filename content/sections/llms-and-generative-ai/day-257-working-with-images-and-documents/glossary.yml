terms:
  - term: 'Multimodal LLM (MLLM)'
    definition: 'A foundation model capable of simultaneously processing and reasoning across multiple data modalities including text, images, audio, and documents.'
  - term: 'Base64 Encoding'
    definition: 'A binary-to-text encoding scheme translating raw media bytes into standard ASCII string representations for JSON transmission.'
  - term: 'Vision Token'
    definition: 'A vector embedding representation of an image patch processed by the vision transformer encoder.'
  - term: 'Image Patch Tiling'
    definition: 'The process of partitioning a high-resolution image into discrete sub-grid tiles (e.g. 512x512 pixels) for detailed inspection.'
  - term: 'High-Detail Mode'
    definition: 'An API vision setting that decomposes images into high-resolution patch grids to enable fine-grained OCR and diagram reading.'
  - term: 'Low-Detail Mode'
    definition: 'An API vision setting that resizes images to a low fixed resolution (85 tokens) for rapid broad scene classification.'
  - term: 'Visual Document Extraction'
    definition: 'The automated parsing of unstructured visual documents (PDFs, invoices, receipts) into validated structured JSON schemas.'
  - term: 'MIME Type'
    definition: 'A standardized label (e.g. image/png, application/pdf) identifying the media format of an encoded payload.'
