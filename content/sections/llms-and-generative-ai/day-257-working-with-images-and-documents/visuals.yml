visuals:
  - id: multimodal-vision-and-document-payload-pipeline
    file: assets/multimodal-vision-and-document-payload-pipeline.svg
    type: diagram
    title: 'Multimodal Vision & Document Payload Architecture'
    alt: Multimodal vision and document payload pipeline diagram
    description: 'Pipeline showing media ingestion, Base64 payload formulation, and structured JSON output extraction.'
  - id: vision-patch-tokenization-and-cost-grid
    file: assets/vision-patch-tokenization-and-cost-grid.svg
    type: diagram
    title: 'Vision Tokenization: Low-Detail vs High-Detail Grid'
    alt: Vision patch tokenization and resolution detail cost grid diagram
    description: 'Visual token breakdown comparing low-detail fixed 85-token cost against high-detail tiled patch resolution grids.'
  - id: vision-idea
    file: assets/vision-idea.svg
    type: diagram
    title: 'How an image becomes tokens'
    alt: 'Diagram: how an image is processed into tokens a language model can attend to'
    description: 'A four-stage description of image processing covering tiling, patch encoding, projection and joint attention.'
  - id: detail-modes
    file: assets/detail-modes.svg
    type: diagram
    title: 'Two resolution modes'
    alt: 'Diagram: low-detail image processing compared with high-detail processing'
    description: 'A two-column comparison of low-resolution and high-resolution image processing modes.'
  - id: doc-extraction
    file: assets/doc-extraction.svg
    type: diagram
    title: 'Extracting structure from a scan'
    alt: 'Diagram: the four steps of extracting structured data from a scanned document'
    description: 'A four-stage description of document extraction covering the image, the schema, the extraction and validation against the source.'
  - id: preprocessing
    file: assets/preprocessing.svg
    type: diagram
    title: 'Preparing images before sending'
    alt: 'Diagram: the four preprocessing steps that reduce image token cost'
    description: 'A four-stage description of image preprocessing covering resizing, cropping, format choice and page splitting.'
  - id: multimodal-injection
    file: assets/multimodal-injection.svg
    type: diagram
    title: 'Images as an attack surface'
    alt: 'Diagram: the four security considerations for processing untrusted images'
    description: 'A four-stage description of image security covering embedded instructions, personal data, provenance and redaction.'
  - id: reading-vs-seeing
    file: assets/reading-vs-seeing.svg
    type: diagram
    title: 'Describing a photograph over the telephone'
    alt: 'Diagram: a described image compared with a directly examined one'
    description: 'A two-column comparison of a verbal description of an image against direct examination.'
  - id: vision-implications
    file: assets/vision-implications.svg
    type: diagram
    title: 'Four consequences of multimodal input'
    alt: 'Diagram: the capability, cost, privacy and accuracy implications of vision input'
    description: 'A four-stage description of multimodal implications covering removed pipeline stages, token cost, sensitive documents and reading errors.'
  - id: vision-when
    file: assets/vision-when.svg
    type: diagram
    title: 'When to use vision input'
    alt: 'Diagram: when multimodal input is the right approach'
    description: 'A two-column comparison of situations favouring vision input against alternatives.'
  - id: vision-history
    file: assets/vision-history.svg
    type: diagram
    title: 'Four steps to reading documents'
    alt: 'Diagram: the historical progression of automated document understanding'
    description: 'A four-stage description of document processing history covering character recognition, layout analysis, specialised document models and general multimodal models.'
  - id: vision-vs-ocr
    file: assets/vision-vs-ocr.svg
    type: diagram
    title: 'Vision models against character recognition'
    alt: 'Diagram: optical character recognition compared with multimodal understanding'
    description: 'A two-column comparison of character recognition against multimodal document understanding.'
