questions:
  - question: 'What is the standard encoding used to transmit local image files directly inside API JSON payloads?'
    options:
      - 'Base64 string encoding with appropriate media type declarations (e.g. image/png, image/jpeg)'
      - 'Raw binary hexadecimal strings without headers'
      - 'Uploading files via FTP'
      - 'Zipping the images into an archive'
    answer_index: 0
    explanation: 'Base64 encoding converts binary media bytes into standard ASCII text compatible with JSON payloads.'
  - question: 'In OpenAI Vision models (e.g. GPT-4o), how does "detail: high" calculate token consumption?'
    options:
      - 'It scales the image to fit a 2048x2048 grid, crops it into 512x512 pixel tiles (each costing 170 tokens), and adds 85 base tokens'
      - 'It charges a flat 10,000 tokens per image'
      - 'It charges 1 token per pixel'
      - 'It is completely free'
    answer_index: 0
    explanation: 'High-detail mode slices large images into 512x512 tiles at 170 tokens per tile plus 85 base tokens.'
  - question: 'How does Anthropic Claude 3.5 Sonnet natively process multi-page PDF documents in the Messages API?'
    options:
      - 'By accepting a document block with type: "document", source: {type: "base64", media_type: "application/pdf", data: "..."}'
      - 'By requiring the user to convert PDF text to Word .docx'
      - 'By downloading the PDF via BitTorrent'
      - 'PDFs cannot be processed by Claude'
    answer_index: 0
    explanation: 'Claude natively accepts base64-encoded PDF document content blocks directly in the messages array.'
  - question: 'When is "detail: low" the recommended setting for image processing?'
    options:
      - 'When the task only requires broad scene classification, primary color detection, or coarse object recognition where fine text OCR is unnecessary'
      - 'When extracting tiny handwritten numbers from financial checks'
      - 'When reading architectural blueprints'
      - 'When reading medicine bottle labels'
    answer_index: 0
    explanation: 'Low-detail mode is ultra-fast and consumes only 85 tokens, perfect for high-level scene categorization.'
  - question: 'What is Visual Question Answering (VQA) in multimodal engineering?'
    options:
      - 'Submitting an image along with a natural language query, prompting the model to reason visually and output structured text or JSON'
      - 'Playing video games with a gamepad'
      - 'Taking screenshots of code'
      - 'Compressing MP4 video files'
    answer_index: 0
    explanation: 'VQA combines visual feature embeddings with linguistic reasoning to answer questions about imagery.'
