<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four considerations.">
  <title>Images as an attack surface</title>
  <style>
    .multimodal-injection-bg   { fill: #f8fafc; }
    .multimodal-injection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-injection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-injection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-injection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-injection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multimodal-injection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multimodal-injection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multimodal-injection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multimodal-injection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multimodal-injection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multimodal-injection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multimodal-injection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multimodal-injection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multimodal-injection-stage { opacity: 1; }

    .multimodal-injection-s0 { animation-delay: 0.00s; }
    .multimodal-injection-e0 { animation-delay: 0.00s; }
    .multimodal-injection-s1 { animation-delay: 1.28s; }
    .multimodal-injection-e1 { animation-delay: 1.28s; }
    .multimodal-injection-s2 { animation-delay: 2.56s; }
    .multimodal-injection-e2 { animation-delay: 2.56s; }
    .multimodal-injection-s3 { animation-delay: 3.84s; }
    .multimodal-injection-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .multimodal-injection-conn  { animation: multimodal-injection-trace 6.4s ease-in-out infinite; }
      .multimodal-injection-stage { animation: multimodal-injection-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes multimodal-injection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multimodal-injection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multimodal-injection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multimodal-injection-stage { animation: multimodal-injection-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multimodal-injection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multimodal-injection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multimodal-injection-bg" width="980" height="322"/>
  <text class="multimodal-injection-h1"  x="30" y="40">Images as an attack surface</text>
  <text class="multimodal-injection-sub" x="30" y="64">Four considerations.</text>
  <g class="multimodal-injection-stage multimodal-injection-s0">
    <rect class="multimodal-injection-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="multimodal-injection-step" x="44" y="142">01</text>
    <text class="multimodal-injection-name" x="70" y="142">Text in an image can be an instruction</text>
    <text class="multimodal-injection-desc" x="44" y="166">Which the model may follow.</text>
    <text class="multimodal-injection-desc" x="44" y="182">Injection, by another channel.</text>
  </g>
  <line class="multimodal-injection-line multimodal-injection-conn multimodal-injection-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#multimodal-injection-tip)"/>
  <g class="multimodal-injection-stage multimodal-injection-s1">
    <rect class="multimodal-injection-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="multimodal-injection-step" x="280" y="142">02</text>
    <text class="multimodal-injection-name" x="306" y="142">Documents carry personal data by default</text>
    <text class="multimodal-injection-desc" x="280" y="166">Names, addresses, identifiers,</text>
    <text class="multimodal-injection-desc" x="280" y="182">signatures.</text>
  </g>
  <line class="multimodal-injection-line multimodal-injection-conn multimodal-injection-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#multimodal-injection-tip)"/>
  <g class="multimodal-injection-stage multimodal-injection-s2">
    <rect class="multimodal-injection-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="multimodal-injection-step" x="516" y="142">03</text>
    <text class="multimodal-injection-name" x="542" y="142">And metadata carries more</text>
    <text class="multimodal-injection-desc" x="516" y="166">Location and device details,</text>
    <text class="multimodal-injection-desc" x="516" y="182">often unnoticed.</text>
  </g>
  <line class="multimodal-injection-line multimodal-injection-conn multimodal-injection-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#multimodal-injection-tip)"/>
  <g class="multimodal-injection-stage multimodal-injection-s3">
    <rect class="multimodal-injection-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="multimodal-injection-step" x="752" y="142">04</text>
    <text class="multimodal-injection-name" x="778" y="142">So redact before sending, and treat output as untrusted</text>
    <text class="multimodal-injection-desc" x="752" y="166">Both directions.</text>
  </g>
  <text class="multimodal-injection-sub" x="30" y="304">Instructions embedded in an image are a genuine and under-appreciated vector: text rendered in a scan reaches the model exactly as though it had been typed.</text>
</svg>
