<svg role="img" aria-label="Vision patch tokenization and resolution detail cost grid diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Vision Tokenization: Low-Detail vs High-Detail Grid</title>
  <defs>
    <linearGradient id="bg257b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card257b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg257b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">VISION TOKENIZATION &amp; RESOLUTION TILING</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Token Economics: Low-Detail Fixed Cost vs High-Detail 512x512 Patch Decomposition</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card257b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Low Detail Mode -->
    <rect x="30" y="30" width="330" height="235" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="195" y="55" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Low-Detail Mode (detail: "low")</text>
    
    <rect x="135" y="75" width="120" height="120" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="4" rx="4"/>
    <text x="195" y="130" fill="#cbd5e1" font-size="9" text-anchor="middle">Scaled 512x512</text>
    <text x="195" y="145" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">85 Tokens Fixed</text>

    <text x="195" y="225" fill="#cbd5e1" font-size="8" text-anchor="middle">Fast, cheap. Best for broad scene tags.</text>

    <!-- High Detail Mode -->
    <rect x="400" y="30" width="330" height="235" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="565" y="55" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">High-Detail Mode (detail: "high")</text>
    
    <!-- 4 Tiled Patches -->
    <g transform="translate(505, 75)">
      <rect x="0" y="0" width="58" height="58" fill="#1e293b" stroke="#34d399" rx="2"/>
      <text x="29" y="33" fill="#cbd5e1" font-size="7" text-anchor="middle">Tile 1 (170T)</text>
      
      <rect x="62" y="0" width="58" height="58" fill="#1e293b" stroke="#34d399" rx="2"/>
      <text x="91" y="33" fill="#cbd5e1" font-size="7" text-anchor="middle">Tile 2 (170T)</text>

      <rect x="0" y="62" width="58" height="58" fill="#1e293b" stroke="#34d399" rx="2"/>
      <text x="29" y="95" fill="#cbd5e1" font-size="7" text-anchor="middle">Tile 3 (170T)</text>

      <rect x="62" y="62" width="58" height="58" fill="#1e293b" stroke="#34d399" rx="2"/>
      <text x="91" y="95" fill="#cbd5e1" font-size="7" text-anchor="middle">Tile 4 (170T)</text>
    </g>

    <text x="565" y="215" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Total: 4x170 + 85 = 765 Tokens</text>
    <text x="565" y="235" fill="#cbd5e1" font-size="8" text-anchor="middle">High-res OCR, fine tables, blueprint inspection.</text>
  </g>
</svg>
