<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Reading against transcribing.">
  <title>Vision models against character recognition</title>
  <style>
    .vision-vs-ocr-bg   { fill: #f8fafc; }
    .vision-vs-ocr-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-vs-ocr-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-vs-ocr-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-vs-ocr-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-vs-ocr-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-vs-ocr-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vision-vs-ocr-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vision-vs-ocr-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vision-vs-ocr-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vision-vs-ocr-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vision-vs-ocr-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vision-vs-ocr-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vision-vs-ocr-row { opacity: 1; }
    .vision-vs-ocr-r0 { animation-delay: 0.00s; }
    .vision-vs-ocr-r1 { animation-delay: 0.45s; }
    .vision-vs-ocr-r2 { animation-delay: 0.90s; }
    .vision-vs-ocr-r3 { animation-delay: 1.35s; }
    .vision-vs-ocr-r4 { animation-delay: 1.80s; }
    .vision-vs-ocr-row { animation: vision-vs-ocr-reveal 7.3s ease-in-out infinite; }
    @keyframes vision-vs-ocr-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vision-vs-ocr-bg" width="980" height="390"/>
  <text class="vision-vs-ocr-h1"  x="30" y="40">Vision models against character recognition</text>
  <text class="vision-vs-ocr-sub" x="30" y="64">Reading against transcribing.</text>
  <rect class="vision-vs-ocr-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vision-vs-ocr-name" x="46" y="122">Character recognition</text>
  <text class="vision-vs-ocr-desc" x="46" y="142">Transcribes.</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r0" x="46" y="182">Extracts characters, exactly</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r1" x="46" y="216">Very fast and very cheap</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r2" x="46" y="250">No understanding of meaning</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r3" x="46" y="284">Structure must be reconstructed</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r4" x="46" y="318">Right for high-volume fixed forms</text>
  <rect class="vision-vs-ocr-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vision-vs-ocr-name" x="526" y="122">Multimodal reading</text>
  <text class="vision-vs-ocr-desc" x="526" y="142">Understands.</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r0" x="526" y="182">Reads text, layout and meaning together</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r1" x="526" y="216">Slower and more expensive</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r2" x="526" y="250">Answers questions about the page</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r3" x="526" y="284">Handles unfamiliar layouts</text>
  <text class="vision-vs-ocr-desc vision-vs-ocr-row vision-vs-ocr-r4" x="526" y="318">Right for varied documents</text>
  <text class="vision-vs-ocr-sub" x="30" y="372">The two combine well at volume: recognition first for the pages that fit a known template, and a model only for the ones that do not.</text>
</svg>
