<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each stage removed a component.">
  <title>Four steps to reading documents</title>
  <style>
    .vision-history-bg   { fill: #f8fafc; }
    .vision-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vision-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vision-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vision-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vision-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vision-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vision-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vision-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vision-history-stage { opacity: 1; }

    .vision-history-s0 { animation-delay: 0.00s; }
    .vision-history-e0 { animation-delay: 0.00s; }
    .vision-history-s1 { animation-delay: 1.28s; }
    .vision-history-e1 { animation-delay: 1.28s; }
    .vision-history-s2 { animation-delay: 2.56s; }
    .vision-history-e2 { animation-delay: 2.56s; }
    .vision-history-s3 { animation-delay: 3.84s; }
    .vision-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vision-history-conn  { animation: vision-history-trace 6.4s ease-in-out infinite; }
      .vision-history-stage { animation: vision-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vision-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vision-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vision-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vision-history-stage { animation: vision-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vision-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vision-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vision-history-bg" width="980" height="322"/>
  <text class="vision-history-h1"  x="30" y="40">Four steps to reading documents</text>
  <text class="vision-history-sub" x="30" y="64">Each stage removed a component.</text>
  <g class="vision-history-stage vision-history-s0">
    <rect class="vision-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vision-history-step" x="44" y="142">01</text>
    <text class="vision-history-name" x="70" y="142">Character recognition</text>
    <text class="vision-history-desc" x="44" y="166">Text out, structure lost.</text>
    <text class="vision-history-desc" x="44" y="182">Templates filled the gap.</text>
  </g>
  <line class="vision-history-line vision-history-conn vision-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vision-history-tip)"/>
  <g class="vision-history-stage vision-history-s1">
    <rect class="vision-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vision-history-step" x="280" y="142">02</text>
    <text class="vision-history-name" x="306" y="142">Layout analysis on top</text>
    <text class="vision-history-desc" x="280" y="166">Reconstructing tables and</text>
    <text class="vision-history-desc" x="280" y="182">regions, imperfectly.</text>
  </g>
  <line class="vision-history-line vision-history-conn vision-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vision-history-tip)"/>
  <g class="vision-history-stage vision-history-s2">
    <rect class="vision-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vision-history-step" x="516" y="142">03</text>
    <text class="vision-history-name" x="542" y="142">Models trained specifically on documents</text>
    <text class="vision-history-desc" x="516" y="166">Text and position learned</text>
    <text class="vision-history-desc" x="516" y="182">together.</text>
  </g>
  <line class="vision-history-line vision-history-conn vision-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vision-history-tip)"/>
  <g class="vision-history-stage vision-history-s3">
    <rect class="vision-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vision-history-step" x="752" y="142">04</text>
    <text class="vision-history-name" x="778" y="142">Then general models that simply look</text>
    <text class="vision-history-desc" x="752" y="166">Where the pipeline collapsed</text>
    <text class="vision-history-desc" x="752" y="182">into one call.</text>
  </g>
  <text class="vision-history-sub" x="30" y="304">Each stage removed a component rather than improving one, which is the pattern worth noticing: the wins came from deleting the pipeline, not from tuning it.</text>
</svg>
