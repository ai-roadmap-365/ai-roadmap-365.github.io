terms:
  - term: 'End-to-End RAG'
    definition: 'A complete software architecture integrating document ingestion, indexing, retrieval, re-ranking, prompt synthesis, and generation.'
  - term: 'Source Citation'
    definition: 'Explicit inline references (e.g. [1], [Doc A]) linking generated sentences to specific retrieved source chunks.'
  - term: 'Confidence Thresholding'
    definition: 'A gating mechanism triggering fallback refusal when retrieval relevance scores fall below a minimum acceptable quality bar.'
  - term: 'Prompt Synthesis'
    definition: 'The process of assembling user instructions, retrieved passages, conversation history, and formatting constraints into a final LLM prompt.'
  - term: 'Time to First Token (TTFT)'
    definition: 'The elapsed duration from user query submission to the arrival of the first generated output token in a streaming response.'
  - term: 'Distributed Tracing'
    definition: 'Tracking the lifecycle of a request across multiple services (embedder, vector DB, re-ranker, LLM) using OpenTelemetry spans.'
  - term: 'Graceful Fallback'
    definition: 'A deterministic error-handling routine delivering safe, polite failure messages when external dependencies timeout or fail.'
  - term: 'Payload Metadata'
    definition: 'Structured attributes (source URI, title, author, permissions) stored alongside dense vectors in an index.'
