<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Knowing when not to answer</title>
  <style>
    .confidence-gate-bg   { fill: #f8fafc; }
    .confidence-gate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confidence-gate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confidence-gate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confidence-gate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confidence-gate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confidence-gate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .confidence-gate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .confidence-gate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .confidence-gate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .confidence-gate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .confidence-gate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .confidence-gate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .confidence-gate-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .confidence-gate-stage { opacity: 1; }

    .confidence-gate-s0 { animation-delay: 0.00s; }
    .confidence-gate-e0 { animation-delay: 0.00s; }
    .confidence-gate-s1 { animation-delay: 1.28s; }
    .confidence-gate-e1 { animation-delay: 1.28s; }
    .confidence-gate-s2 { animation-delay: 2.56s; }
    .confidence-gate-e2 { animation-delay: 2.56s; }
    .confidence-gate-s3 { animation-delay: 3.84s; }
    .confidence-gate-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .confidence-gate-conn  { animation: confidence-gate-trace 6.4s ease-in-out infinite; }
      .confidence-gate-stage { animation: confidence-gate-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes confidence-gate-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes confidence-gate-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .confidence-gate-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .confidence-gate-stage { animation: confidence-gate-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes confidence-gate-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="confidence-gate-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="confidence-gate-bg" width="980" height="322"/>
  <text class="confidence-gate-h1"  x="30" y="40">Knowing when not to answer</text>
  <text class="confidence-gate-sub" x="30" y="64">Four steps.</text>
  <g class="confidence-gate-stage confidence-gate-s0">
    <rect class="confidence-gate-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="confidence-gate-step" x="44" y="142">01</text>
    <text class="confidence-gate-name" x="70" y="142">Sometimes retrieval finds nothing relevant</text>
    <text class="confidence-gate-desc" x="44" y="166">Which the scores will show.</text>
  </g>
  <line class="confidence-gate-line confidence-gate-conn confidence-gate-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#confidence-gate-tip)"/>
  <g class="confidence-gate-stage confidence-gate-s1">
    <rect class="confidence-gate-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="confidence-gate-step" x="280" y="142">02</text>
    <text class="confidence-gate-name" x="306" y="142">But the model will answer from it anyway</text>
    <text class="confidence-gate-desc" x="280" y="166">Fluently, and wrongly.</text>
  </g>
  <line class="confidence-gate-line confidence-gate-conn confidence-gate-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#confidence-gate-tip)"/>
  <g class="confidence-gate-stage confidence-gate-s2">
    <rect class="confidence-gate-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="confidence-gate-step" x="516" y="142">03</text>
    <text class="confidence-gate-name" x="542" y="142">So gate on the reranker score</text>
    <text class="confidence-gate-desc" x="516" y="166">Below a calibrated threshold, do</text>
    <text class="confidence-gate-desc" x="516" y="182">not generate.</text>
  </g>
  <line class="confidence-gate-line confidence-gate-conn confidence-gate-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#confidence-gate-tip)"/>
  <g class="confidence-gate-stage confidence-gate-s3">
    <rect class="confidence-gate-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="confidence-gate-step" x="752" y="142">04</text>
    <text class="confidence-gate-name" x="778" y="142">And say so, offering an alternative</text>
    <text class="confidence-gate-desc" x="752" y="166">Which users trust more than a</text>
    <text class="confidence-gate-desc" x="752" y="182">confident wrong answer.</text>
  </g>
  <text class="confidence-gate-sub" x="30" y="304">Saying nothing is found is a feature rather than a failure, and systems without this gate produce their worst answers exactly when the corpus does not cover the question.</text>
</svg>
