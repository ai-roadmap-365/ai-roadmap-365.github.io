<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What the user receives.">
  <title>A retrieval system against a search engine</title>
  <style>
    .rag-vs-search-bg   { fill: #f8fafc; }
    .rag-vs-search-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-search-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-search-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-search-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-search-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-search-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-vs-search-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-vs-search-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-vs-search-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-vs-search-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-vs-search-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-vs-search-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-vs-search-row { opacity: 1; }
    .rag-vs-search-r0 { animation-delay: 0.00s; }
    .rag-vs-search-r1 { animation-delay: 0.45s; }
    .rag-vs-search-r2 { animation-delay: 0.90s; }
    .rag-vs-search-r3 { animation-delay: 1.35s; }
    .rag-vs-search-r4 { animation-delay: 1.80s; }
    .rag-vs-search-row { animation: rag-vs-search-reveal 7.3s ease-in-out infinite; }
    @keyframes rag-vs-search-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rag-vs-search-bg" width="980" height="390"/>
  <text class="rag-vs-search-h1"  x="30" y="40">A retrieval system against a search engine</text>
  <text class="rag-vs-search-sub" x="30" y="64">What the user receives.</text>
  <rect class="rag-vs-search-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rag-vs-search-name" x="46" y="122">Search results</text>
  <text class="rag-vs-search-desc" x="46" y="142">Documents.</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r0" x="46" y="182">A ranked list of sources</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r1" x="46" y="216">The user reads and synthesises</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r2" x="46" y="250">Nothing can be fabricated</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r3" x="46" y="284">Fast and cheap</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r4" x="46" y="318">Right when the user knows what to look for</text>
  <rect class="rag-vs-search-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rag-vs-search-name" x="526" y="122">A grounded answer</text>
  <text class="rag-vs-search-desc" x="526" y="142">A synthesis.</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r0" x="526" y="182">One answer, across several sources</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r1" x="526" y="216">The system reads and synthesises</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r2" x="526" y="250">Fabrication is possible, so cite</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r3" x="526" y="284">Slower and more expensive</text>
  <text class="rag-vs-search-desc rag-vs-search-row rag-vs-search-r4" x="526" y="318">Right when the answer spans documents</text>
  <text class="rag-vs-search-sub" x="30" y="372">Search remains the better product for many queries, and offering the ranked sources alongside the answer costs nothing and covers the cases where synthesis was not wanted.</text>
</svg>
