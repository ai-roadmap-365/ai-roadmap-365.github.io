<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And one who does not.">
  <title>A researcher who cites sources</title>
  <style>
    .research-assistant-bg   { fill: #f8fafc; }
    .research-assistant-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-assistant-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-assistant-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-assistant-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-assistant-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-assistant-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .research-assistant-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .research-assistant-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .research-assistant-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .research-assistant-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .research-assistant-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .research-assistant-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .research-assistant-row { opacity: 1; }
    .research-assistant-r0 { animation-delay: 0.00s; }
    .research-assistant-r1 { animation-delay: 0.45s; }
    .research-assistant-r2 { animation-delay: 0.90s; }
    .research-assistant-r3 { animation-delay: 1.35s; }
    .research-assistant-r4 { animation-delay: 1.80s; }
    .research-assistant-row { animation: research-assistant-reveal 7.3s ease-in-out infinite; }
    @keyframes research-assistant-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="research-assistant-bg" width="980" height="390"/>
  <text class="research-assistant-h1"  x="30" y="40">A researcher who cites sources</text>
  <text class="research-assistant-sub" x="30" y="64">And one who does not.</text>
  <rect class="research-assistant-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="research-assistant-name" x="46" y="122">From memory</text>
  <text class="research-assistant-desc" x="46" y="142">Take it or leave it.</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r0" x="46" y="182">Confident, and unverifiable</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r1" x="46" y="216">No way to check a claim</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r2" x="46" y="250">Errors indistinguishable from facts</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r3" x="46" y="284">Trust must be given wholesale</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r4" x="46" y="318">This is an ungrounded model</text>
  <rect class="research-assistant-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="research-assistant-name" x="526" y="122">With sources</text>
  <text class="research-assistant-desc" x="526" y="142">Check it yourself.</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r0" x="526" y="182">Each claim attributed</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r1" x="526" y="216">Sources linked and readable</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r2" x="526" y="250">Errors findable by anyone</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r3" x="526" y="284">Trust is earned per claim</text>
  <text class="research-assistant-desc research-assistant-row research-assistant-r4" x="526" y="318">This is a grounded system</text>
  <text class="research-assistant-sub" x="30" y="372">Citations change what the user has to trust: not the system's accuracy, only that the passage it points to says what it claims — which is checkable in seconds.</text>
</svg>
