<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Different hit rates.">
  <title>Two caches in a retrieval system</title>
  <style>
    .rag-caching-bg   { fill: #f8fafc; }
    .rag-caching-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-caching-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-caching-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-caching-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-caching-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-caching-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-caching-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-caching-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-caching-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-caching-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-caching-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-caching-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rag-caching-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rag-caching-stage { opacity: 1; }

    .rag-caching-s0 { animation-delay: 0.00s; }
    .rag-caching-e0 { animation-delay: 0.00s; }
    .rag-caching-s1 { animation-delay: 1.28s; }
    .rag-caching-e1 { animation-delay: 1.28s; }
    .rag-caching-s2 { animation-delay: 2.56s; }
    .rag-caching-e2 { animation-delay: 2.56s; }
    .rag-caching-s3 { animation-delay: 3.84s; }
    .rag-caching-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rag-caching-conn  { animation: rag-caching-trace 6.4s ease-in-out infinite; }
      .rag-caching-stage { animation: rag-caching-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rag-caching-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rag-caching-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rag-caching-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rag-caching-stage { animation: rag-caching-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rag-caching-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rag-caching-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rag-caching-bg" width="980" height="322"/>
  <text class="rag-caching-h1"  x="30" y="40">Two caches in a retrieval system</text>
  <text class="rag-caching-sub" x="30" y="64">Different hit rates.</text>
  <g class="rag-caching-stage rag-caching-s0">
    <rect class="rag-caching-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rag-caching-step" x="44" y="142">01</text>
    <text class="rag-caching-name" x="70" y="142">Cache identical queries exactly</text>
    <text class="rag-caching-desc" x="44" y="166">Safe, and a low hit rate on</text>
    <text class="rag-caching-desc" x="44" y="182">natural language.</text>
  </g>
  <line class="rag-caching-line rag-caching-conn rag-caching-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rag-caching-tip)"/>
  <g class="rag-caching-stage rag-caching-s1">
    <rect class="rag-caching-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rag-caching-step" x="280" y="142">02</text>
    <text class="rag-caching-name" x="306" y="142">Or cache by embedding similarity</text>
    <text class="rag-caching-desc" x="280" y="166">A much higher hit rate on</text>
    <text class="rag-caching-desc" x="280" y="182">paraphrases.</text>
  </g>
  <line class="rag-caching-line rag-caching-conn rag-caching-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rag-caching-tip)"/>
  <g class="rag-caching-stage rag-caching-s2">
    <rect class="rag-caching-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rag-caching-step" x="516" y="142">03</text>
    <text class="rag-caching-name" x="542" y="142">Which risks returning an answer to a different question</text>
    <text class="rag-caching-desc" x="516" y="166">When the threshold is too loose.</text>
  </g>
  <line class="rag-caching-line rag-caching-conn rag-caching-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rag-caching-tip)"/>
  <g class="rag-caching-stage rag-caching-s3">
    <rect class="rag-caching-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rag-caching-step" x="752" y="142">04</text>
    <text class="rag-caching-name" x="778" y="142">So cache retrieval results rather than answers</text>
    <text class="rag-caching-desc" x="752" y="166">Which is safer, and still saves</text>
    <text class="rag-caching-desc" x="752" y="182">most of the cost.</text>
    <text class="rag-caching-edge" x="752" y="242">safer</text>
  </g>
  <text class="rag-caching-sub" x="30" y="304">Caching the retrieved passages rather than the generated answer keeps the model in the loop for the actual wording, which is where a near-miss would show.</text>
</svg>
