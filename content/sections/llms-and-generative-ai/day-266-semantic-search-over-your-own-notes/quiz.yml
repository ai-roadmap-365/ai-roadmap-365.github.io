questions:
  - question: 'What is the primary role of Source Citations in an end-to-end production RAG system?'
    options:
      - 'To let humans verify the claims'
      - 'To make the output look longer'
      - 'To reduce vector database storage'
      - 'To bypass LLM safety filters'
    answer_index: 0
    explanation: 'Citations allow users and evaluators to trace every generated claim directly back to its source document passage.'
  - question: 'How should a production RAG system behave when all retrieved passages score below a confidence threshold (e.g. max score < 0.30)?'
    options:
      - 'Fabricate an answer anyway'
      - 'Admit it lacks the information'
      - 'Crash the server with a 500 error'
      - 'Delete the user account'
    answer_index: 1
    explanation: 'Confident refusal on low-relevance retrieval prevents catastrophic hallucinations in enterprise environments.'
  - question: 'What is the standard latency target for the retrieval and re-ranking stage in a production RAG pipeline?'
    options:
      - '1 microsecond'
      - '5 to 10 minutes'
      - 'Under 30ms'
      - '10 seconds'
    answer_index: 2
    explanation: 'Retrieval, RRF fusion, and re-ranking must finish in under 30ms so that total response time remains responsive.'
  - question: 'Why is distributed tracing (such as OpenTelemetry) essential for debugging production RAG pipelines?'
    options:
      - 'It trains neural networks automatically'
      - 'It compiles Python into C++'
      - 'It replaces Docker containers'
      - 'It splits latency into per-stage spans'
    answer_index: 3
    explanation: 'Tracing reveals exactly where delays occur across heterogeneous microservices and external LLM APIs.'
  - question: 'What prompt engineering technique prevents LLMs from ignoring retrieved context when answering domain questions?'
    options:
      - 'Require citations and forbid outside knowledge'
      - 'Increasing temperature to 1.5'
      - 'Removing all punctuation'
      - 'Writing prompts in uppercase letters only'
    answer_index: 0
    explanation: 'Clear context tags and negative constraints instruct the model to ground its reasoning exclusively in provided passages.'
