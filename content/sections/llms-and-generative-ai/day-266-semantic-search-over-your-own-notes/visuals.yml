visuals:
  - id: end-to-end-rag-production-system-architecture
    file: assets/end-to-end-rag-production-system-architecture.svg
    type: diagram
    title: 'Production End-to-End RAG Architecture'
    alt: End to end RAG production system architecture diagram
    description: 'Complete architecture combining document ingestion, hybrid search, RRF fusion, cross-encoder re-ranking, and streaming generation.'
  - id: rag-runtime-request-lifecycle
    file: assets/rag-runtime-request-lifecycle.svg
    type: diagram
    title: 'RAG Runtime Request Lifecycle & Latency Breakdown'
    alt: RAG runtime request lifecycle diagram
    description: 'Detailed sequence diagram displaying parallel async retrieval, re-ranking, and TTFT latency timings.'
  - id: pipeline-idea
    file: assets/pipeline-idea.svg
    type: diagram
    title: 'The whole pipeline'
    alt: 'Diagram: the six stages of an end-to-end retrieval system, offline and at request time'
    description: 'A six-stage description of a retrieval system covering parsing, chunking, embedding, retrieval, reranking and generation.'
  - id: ingestion
    file: assets/ingestion.svg
    type: diagram
    title: 'The ingestion pipeline'
    alt: 'Diagram: the four stages of document ingestion into a retrieval index'
    description: 'A four-stage description of ingestion covering format handling, extraction, chunking with metadata, and incremental updates.'
  - id: confidence-gate
    file: assets/confidence-gate.svg
    type: diagram
    title: 'Knowing when not to answer'
    alt: 'Diagram: how a confidence gate prevents answering from irrelevant context'
    description: 'A four-stage description of confidence gating covering the empty-handed retrieval, the threshold, the decision and the fallback.'
  - id: citations
    file: assets/citations.svg
    type: diagram
    title: 'Citations that can be checked'
    alt: 'Diagram: how source citations are produced and verified in a grounded answer'
    description: 'A four-stage description of citation handling covering labelled passages, the instruction, parsing and verification.'
  - id: rag-caching
    file: assets/rag-caching.svg
    type: diagram
    title: 'Two caches in a retrieval system'
    alt: 'Diagram: exact-match query caching compared with semantic caching'
    description: 'A four-stage description of retrieval caching covering exact matching, semantic matching, the risk and the safe placement.'
  - id: research-assistant
    file: assets/research-assistant.svg
    type: diagram
    title: 'A researcher who cites sources'
    alt: 'Diagram: an unsourced answer compared with a sourced one'
    description: 'A two-column comparison of an answer given from memory against one given with references.'
  - id: rag-observability
    file: assets/rag-observability.svg
    type: diagram
    title: 'Tracing a retrieval request'
    alt: 'Diagram: the five spans that make a retrieval request debuggable'
    description: 'A five-stage description of retrieval tracing covering the query, retrieval, reranking, the prompt and the answer.'
  - id: rag-when
    file: assets/rag-when.svg
    type: diagram
    title: 'When to build this pipeline'
    alt: 'Diagram: when a full retrieval pipeline is warranted'
    description: 'A two-column comparison of situations requiring a full retrieval pipeline against simpler alternatives.'
  - id: latency-budget-rag
    file: assets/latency-budget-rag.svg
    type: diagram
    title: 'The request-time budget'
    alt: 'Diagram: how the latency of a retrieval request is distributed across its stages'
    description: 'A five-stage description of retrieval latency covering query embedding, retrieval, reranking, first token and full generation.'
  - id: rag-vs-search
    file: assets/rag-vs-search.svg
    type: diagram
    title: 'A retrieval system against a search engine'
    alt: 'Diagram: a search results page compared with a grounded generated answer'
    description: 'A two-column comparison of returning documents against returning a synthesised answer.'
  - id: continuous-eval
    file: assets/continuous-eval.svg
    type: diagram
    title: 'Keeping a live system honest'
    alt: 'Diagram: the four continuous checks that detect regression in a deployed retrieval system'
    description: 'A four-stage description of continuous retrieval evaluation covering sampled scoring, index freshness, gate rates and user signals.'
