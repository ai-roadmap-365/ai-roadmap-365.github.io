visuals:
  - id: three-stage-llm-training-alignment-pipeline
    file: assets/three-stage-llm-training-alignment-pipeline.svg
    type: diagram
    title: 'Three-Stage LLM Training & Alignment Pipeline'
    alt: Three-stage LLM training alignment pipeline showing pretraining, supervised fine-tuning, and preference alignment
    description: 'The 3-stage paradigm transforming raw web text into aligned AI assistants: Pretraining, Supervised Fine-Tuning (SFT), and RLHF/DPO.'
  - id: rlhf-ppo-vs-dpo-mathematical-architecture
    file: assets/rlhf-ppo-vs-dpo-mathematical-architecture.svg
    type: diagram
    title: 'RLHF Architectures: PPO vs. Direct Preference Optimization (DPO)'
    alt: Comparison architecture diagram between PPO multi-model reinforcement learning and DPO closed-form direct preference optimization
    description: 'Contrasting classical 4-model PPO reinforcement learning with modern 2-model closed-form Direct Preference Optimization (DPO).'
  - id: alignment-stages
    file: assets/alignment-stages.svg
    type: diagram
    title: 'Three stages after pretraining'
    alt: 'Diagram: the three post-training stages that turn a base model into an assistant'
    description: 'A three-stage description of post-training covering supervised fine-tuning, preference optimisation and the resulting assistant.'
  - id: ppo-dpo
    file: assets/ppo-dpo.svg
    type: diagram
    title: 'Reinforcement, or direct optimisation'
    alt: 'Diagram: reinforcement-based preference training compared with direct preference optimisation'
    description: 'A two-column comparison of reinforcement learning from human feedback against direct preference optimisation.'
  - id: reward-hacking
    file: assets/reward-hacking.svg
    type: diagram
    title: 'Reward hacking'
    alt: 'Diagram: how a model exploits imperfections in its reward signal'
    description: 'A four-stage description of reward hacking covering the proxy reward, the correlation, the exploitation and the mitigation.'
  - id: sycophancy
    file: assets/sycophancy.svg
    type: diagram
    title: 'Sycophancy'
    alt: 'Diagram: how preference training produces excessive agreement'
    description: 'A four-stage description of sycophancy covering the rating behaviour, the learned pattern, the consequence and the mitigation.'
  - id: apprentice
    file: assets/apprentice.svg
    type: diagram
    title: 'Demonstration, then correction'
    alt: 'Diagram: learning by demonstration compared with learning by preference feedback'
    description: 'A two-column comparison of teaching by example against teaching by comparing outcomes.'
  - id: alignment-implications
    file: assets/alignment-implications.svg
    type: diagram
    title: 'Four consequences of alignment'
    alt: 'Diagram: the safety, labour, values and capability implications of alignment training'
    description: 'A four-stage description of alignment implications covering safety behaviour, the annotation workforce, embedded values and capability cost.'
  - id: alignment-when
    file: assets/alignment-when.svg
    type: diagram
    title: 'When to align a model yourself'
    alt: 'Diagram: when to run your own alignment training and when to use an aligned model'
    description: 'A two-column comparison of running alignment training against using an already-aligned model.'
  - id: alignment-history
    file: assets/alignment-history.svg
    type: diagram
    title: 'Four steps in alignment research'
    alt: 'Diagram: the historical progression of alignment techniques'
    description: 'A four-stage description of alignment history covering instruction tuning, reinforcement from human feedback, direct preference methods and AI-generated feedback.'
  - id: chat-template
    file: assets/chat-template.svg
    type: diagram
    title: 'The chat template'
    alt: 'Diagram: how conversation structure is encoded as tokens for a chat model'
    description: 'A four-stage description of chat templating covering role markers, the template, the training and inference match, and the failure mode.'
  - id: sft-vs-dpo
    file: assets/sft-vs-dpo.svg
    type: diagram
    title: 'Demonstrations against preferences'
    alt: 'Diagram: supervised fine-tuning compared with preference optimisation'
    description: 'A two-column comparison of training on demonstrations against training on preference pairs.'
