title: 'Pretraining, Fine-Tuning, and RLHF'
section: llms-and-generative-ai
subsection: working-with-llms
week: 35
learning_promise: 'Master the complete three-stage training pipeline of modern language models: Causal Pretraining (acquiring broad world knowledge), Supervised Fine-Tuning (SFT on instruction-response dialogues), and Reinforcement Learning from Human Feedback (RLHF). Compare classical PPO with modern Direct Preference Optimization (DPO), analyze the Bradley-Terry preference model, master KL-divergence drift penalties, and build a working DPO preference loss step in PyTorch.'
objectives:
  - 'Distinguish the data requirements, objectives, and costs across Pretraining, SFT, and RLHF.'
  - 'Implement Supervised Fine-Tuning with prompt-loss masking (training only on assistant response tokens).'
  - 'Formulate the Bradley-Terry preference probability model: P(y_w > y_l | x) = sigma(r(x, y_w) - r(x, y_l)).'
  - 'Derive the DPO closed-form implicit reward substitution eliminating separate reward and critic models.'
  - 'Implement a complete Direct Preference Optimization (DPO) loss calculation in PyTorch.'
