<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four models, or two.">
  <title>Reinforcement, or direct optimisation</title>
  <style>
    .ppo-dpo-bg   { fill: #f8fafc; }
    .ppo-dpo-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ppo-dpo-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ppo-dpo-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ppo-dpo-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ppo-dpo-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ppo-dpo-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ppo-dpo-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ppo-dpo-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ppo-dpo-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ppo-dpo-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ppo-dpo-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ppo-dpo-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ppo-dpo-row { opacity: 1; }
    .ppo-dpo-r0 { animation-delay: 0.00s; }
    .ppo-dpo-r1 { animation-delay: 0.45s; }
    .ppo-dpo-r2 { animation-delay: 0.90s; }
    .ppo-dpo-r3 { animation-delay: 1.35s; }
    .ppo-dpo-r4 { animation-delay: 1.80s; }
    .ppo-dpo-row { animation: ppo-dpo-reveal 7.3s ease-in-out infinite; }
    @keyframes ppo-dpo-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ppo-dpo-bg" width="980" height="390"/>
  <text class="ppo-dpo-h1"  x="30" y="40">Reinforcement, or direct optimisation</text>
  <text class="ppo-dpo-sub" x="30" y="64">Four models, or two.</text>
  <rect class="ppo-dpo-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ppo-dpo-name" x="46" y="122">Reinforcement-based</text>
  <text class="ppo-dpo-desc" x="46" y="142">Four models in memory.</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r0" x="46" y="182">Train a separate reward model</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r1" x="46" y="216">Then optimise against it with a policy method</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r2" x="46" y="250">Policy, reference, reward and value models</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r3" x="46" y="284">Unstable, and hard to tune</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r4" x="46" y="318">But still the strongest at the frontier</text>
  <rect class="ppo-dpo-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ppo-dpo-name" x="526" y="122">Direct optimisation</text>
  <text class="ppo-dpo-desc" x="526" y="142">Two models, one loss.</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r0" x="526" y="182">No separate reward model</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r1" x="526" y="216">Preference pairs go straight into the loss</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r2" x="526" y="250">Policy and reference only</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r3" x="526" y="284">Stable, and simple to run</text>
  <text class="ppo-dpo-desc ppo-dpo-row ppo-dpo-r4" x="526" y="318">Which is why most open models use it</text>
  <text class="ppo-dpo-sub" x="30" y="372">The derivation showing an optimal reward model is implicit in the preference data is what removed a whole stage, and it is a good example of theory simplifying practice rather than complicating it.</text>
</svg>
