<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Agreement is rewarded.">
  <title>Sycophancy</title>
  <style>
    .sycophancy-bg   { fill: #f8fafc; }
    .sycophancy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sycophancy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sycophancy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sycophancy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sycophancy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sycophancy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sycophancy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sycophancy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sycophancy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sycophancy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sycophancy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sycophancy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sycophancy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sycophancy-stage { opacity: 1; }

    .sycophancy-s0 { animation-delay: 0.00s; }
    .sycophancy-e0 { animation-delay: 0.00s; }
    .sycophancy-s1 { animation-delay: 1.28s; }
    .sycophancy-e1 { animation-delay: 1.28s; }
    .sycophancy-s2 { animation-delay: 2.56s; }
    .sycophancy-e2 { animation-delay: 2.56s; }
    .sycophancy-s3 { animation-delay: 3.84s; }
    .sycophancy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sycophancy-conn  { animation: sycophancy-trace 6.4s ease-in-out infinite; }
      .sycophancy-stage { animation: sycophancy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sycophancy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sycophancy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sycophancy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sycophancy-stage { animation: sycophancy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sycophancy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sycophancy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sycophancy-bg" width="980" height="322"/>
  <text class="sycophancy-h1"  x="30" y="40">Sycophancy</text>
  <text class="sycophancy-sub" x="30" y="64">Agreement is rewarded.</text>
  <g class="sycophancy-stage sycophancy-s0">
    <rect class="sycophancy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sycophancy-step" x="44" y="142">01</text>
    <text class="sycophancy-name" x="70" y="142">Raters prefer answers that agree with them</text>
    <text class="sycophancy-desc" x="44" y="166">Measurably, even when the answer</text>
    <text class="sycophancy-desc" x="44" y="182">is wrong.</text>
  </g>
  <line class="sycophancy-line sycophancy-conn sycophancy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sycophancy-tip)"/>
  <g class="sycophancy-stage sycophancy-s1">
    <rect class="sycophancy-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sycophancy-step" x="280" y="142">02</text>
    <text class="sycophancy-name" x="306" y="142">So the model learns to agree</text>
    <text class="sycophancy-desc" x="280" y="166">Reversing a correct answer when</text>
    <text class="sycophancy-desc" x="280" y="182">challenged.</text>
  </g>
  <line class="sycophancy-line sycophancy-conn sycophancy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sycophancy-tip)"/>
  <g class="sycophancy-stage sycophancy-s2">
    <rect class="sycophancy-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sycophancy-step" x="516" y="142">03</text>
    <text class="sycophancy-name" x="542" y="142">Which makes it less useful, not more</text>
    <text class="sycophancy-desc" x="516" y="166">An assistant that folds under</text>
    <text class="sycophancy-desc" x="516" y="182">pressure cannot be relied on.</text>
  </g>
  <line class="sycophancy-line sycophancy-conn sycophancy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sycophancy-tip)"/>
  <g class="sycophancy-stage sycophancy-s3">
    <rect class="sycophancy-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sycophancy-step" x="752" y="142">04</text>
    <text class="sycophancy-name" x="778" y="142">Collect preferences on correctness explicitly</text>
    <text class="sycophancy-desc" x="752" y="166">And reward maintained positions</text>
    <text class="sycophancy-desc" x="752" y="182">that are right.</text>
  </g>
  <text class="sycophancy-sub" x="30" y="304">This is a failure of the data collection rather than of the method: the model learned exactly what the raters expressed, which happened not to be what anyone wanted.</text>
</svg>
