<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to use one already aligned.">
  <title>When to align a model yourself</title>
  <style>
    .alignment-when-bg   { fill: #f8fafc; }
    .alignment-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .alignment-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .alignment-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .alignment-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .alignment-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .alignment-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .alignment-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .alignment-when-row { opacity: 1; }
    .alignment-when-r0 { animation-delay: 0.00s; }
    .alignment-when-r1 { animation-delay: 0.45s; }
    .alignment-when-r2 { animation-delay: 0.90s; }
    .alignment-when-r3 { animation-delay: 1.35s; }
    .alignment-when-r4 { animation-delay: 1.80s; }
    .alignment-when-row { animation: alignment-when-reveal 7.3s ease-in-out infinite; }
    @keyframes alignment-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="alignment-when-bg" width="980" height="390"/>
  <text class="alignment-when-h1"  x="30" y="40">When to align a model yourself</text>
  <text class="alignment-when-sub" x="30" y="64">And when to use one already aligned.</text>
  <rect class="alignment-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="alignment-when-name" x="46" y="122">Align it yourself</text>
  <text class="alignment-when-desc" x="46" y="142">Four reasons.</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r0" x="46" y="182">A specific tone or format is required</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r1" x="46" y="216">Domain conventions a general model misses</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r2" x="46" y="250">Behaviour the general policy blocks unnecessarily</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r3" x="46" y="284">Where preference data already exists</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r4" x="46" y="318">And you have the pipeline to run it</text>
  <rect class="alignment-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="alignment-when-name" x="526" y="122">Use an aligned model</text>
  <text class="alignment-when-desc" x="526" y="142">Usually.</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r0" x="526" y="182">General assistant behaviour is enough</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r1" x="526" y="216">Prompting achieves the tone you want</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r2" x="526" y="250">No preference data of your own</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r3" x="526" y="284">Safety behaviour is a requirement</text>
  <text class="alignment-when-desc alignment-when-row alignment-when-r4" x="526" y="318">And you do not want to own the failure modes</text>
  <text class="alignment-when-sub" x="30" y="372">Owning the failure modes is the underrated cost: aligning a model yourself means the refusals, the sycophancy and the jailbreaks all become your responsibility to measure and fix.</text>
</svg>
