<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward simpler methods.">
  <title>Four steps in alignment research</title>
  <style>
    .alignment-history-bg   { fill: #f8fafc; }
    .alignment-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .alignment-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .alignment-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .alignment-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .alignment-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .alignment-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .alignment-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .alignment-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .alignment-history-stage { opacity: 1; }

    .alignment-history-s0 { animation-delay: 0.00s; }
    .alignment-history-e0 { animation-delay: 0.00s; }
    .alignment-history-s1 { animation-delay: 1.28s; }
    .alignment-history-e1 { animation-delay: 1.28s; }
    .alignment-history-s2 { animation-delay: 2.56s; }
    .alignment-history-e2 { animation-delay: 2.56s; }
    .alignment-history-s3 { animation-delay: 3.84s; }
    .alignment-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .alignment-history-conn  { animation: alignment-history-trace 6.4s ease-in-out infinite; }
      .alignment-history-stage { animation: alignment-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes alignment-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes alignment-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .alignment-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .alignment-history-stage { animation: alignment-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes alignment-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="alignment-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="alignment-history-bg" width="980" height="322"/>
  <text class="alignment-history-h1"  x="30" y="40">Four steps in alignment research</text>
  <text class="alignment-history-sub" x="30" y="64">Toward simpler methods.</text>
  <g class="alignment-history-stage alignment-history-s0">
    <rect class="alignment-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="alignment-history-step" x="44" y="142">01</text>
    <text class="alignment-history-name" x="70" y="142">Instruction tuning</text>
    <text class="alignment-history-desc" x="44" y="166">Demonstrations of following</text>
    <text class="alignment-history-desc" x="44" y="182">instructions. A large jump for</text>
    <text class="alignment-history-desc" x="44" y="198">little cost.</text>
  </g>
  <line class="alignment-history-line alignment-history-conn alignment-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#alignment-history-tip)"/>
  <g class="alignment-history-stage alignment-history-s1">
    <rect class="alignment-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="alignment-history-step" x="280" y="142">02</text>
    <text class="alignment-history-name" x="306" y="142">Reinforcement from human preferences</text>
    <text class="alignment-history-desc" x="280" y="166">Which produced the first</text>
    <text class="alignment-history-desc" x="280" y="182">genuinely usable assistants.</text>
  </g>
  <line class="alignment-history-line alignment-history-conn alignment-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#alignment-history-tip)"/>
  <g class="alignment-history-stage alignment-history-s2">
    <rect class="alignment-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="alignment-history-step" x="516" y="142">03</text>
    <text class="alignment-history-name" x="542" y="142">Direct preference methods</text>
    <text class="alignment-history-desc" x="516" y="166">The same result without the</text>
    <text class="alignment-history-desc" x="516" y="182">reinforcement machinery.</text>
  </g>
  <line class="alignment-history-line alignment-history-conn alignment-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#alignment-history-tip)"/>
  <g class="alignment-history-stage alignment-history-s3">
    <rect class="alignment-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="alignment-history-step" x="752" y="142">04</text>
    <text class="alignment-history-name" x="778" y="142">And feedback generated by models</text>
    <text class="alignment-history-desc" x="752" y="166">Which removes the human</text>
    <text class="alignment-history-desc" x="752" y="182">annotation bottleneck, and adds</text>
    <text class="alignment-history-desc" x="752" y="198">new risks.</text>
  </g>
  <text class="alignment-history-sub" x="30" y="304">Each step reduced what the method needed rather than what it achieved, which is why alignment moved from a frontier-lab capability to something a small team can run.</text>
</svg>
