<svg role="img" aria-label="Comparison architecture diagram between PPO multi-model reinforcement learning and DPO closed-form direct preference optimization" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>RLHF Architectures: PPO vs. Direct Preference Optimization (DPO)</title>
  <defs>
    <linearGradient id="bg240b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card240b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg240b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PREFERENCE ALIGNMENT: PPO VS. DPO</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Contrasting Classical Multi-Model PPO with Modern Implicit-Reward DPO (Rafailov et al., 2023)</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#card240b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: PPO (4 Models) -->
    <rect x="25" y="25" width="335" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="192" y="48" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Classical PPO (4 Model Replicas in VRAM)</text>
    
    <rect x="40" y="65" width="145" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="112" y="88" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">1. Policy π_θ (Actor)</text>

    <rect x="195" y="65" width="145" height="40" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="267" y="88" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">2. Value V_φ (Critic)</text>

    <rect x="40" y="115" width="145" height="40" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="112" y="138" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">3. Reward Model R_ψ</text>

    <rect x="195" y="115" width="145" height="40" fill="#1e293b" stroke="#94a3b8" rx="4"/>
    <text x="267" y="138" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">4. Reference π_ref</text>

    <text x="40" y="180" fill="#fb7185" font-size="8" font-weight="700">Engineering Complexities:</text>
    <text x="40" y="198" fill="#cbd5e1" font-size="8">• 4 massive models loaded simultaneously in cluster VRAM</text>
    <text x="40" y="213" fill="#cbd5e1" font-size="8">• Hyperparameter sensitive (Actor-Critic stability issues)</text>
    <text x="40" y="228" fill="#cbd5e1" font-size="8">• Generation in loop is extremely slow &amp; memory heavy</text>

    <!-- Right: DPO (Direct Preference Optimization) -->
    <rect x="385" y="25" width="340" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="555" y="48" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">DPO: Direct Preference Optimization</text>

    <rect x="405" y="65" width="300" height="50" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="555" y="85" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Closed-Form Exact Reward Substitution</text>
    <text x="555" y="103" fill="#cbd5e1" font-size="8" text-anchor="middle">r(x, y) = β * log( π_θ(y|x) / π_ref(y|x) )</text>

    <text x="405" y="145" fill="#38bdf8" font-size="8" font-weight="700">DPO Breakthrough Advantages:</text>
    <text x="405" y="165" fill="#cbd5e1" font-size="8">• NO separate Reward Model needed!</text>
    <text x="405" y="183" fill="#cbd5e1" font-size="8">• NO Value Critic network needed!</text>
    <text x="405" y="201" fill="#cbd5e1" font-size="8">• NO online reinforcement learning sampling in the loop!</text>
    <text x="405" y="219" fill="#cbd5e1" font-size="8">• Trains with simple binary cross-entropy on preferred pairs!</text>
    <text x="405" y="237" fill="#34d399" font-size="8" font-weight="700">• 3x Faster, rock-solid stable, and memory efficient!</text>
  </g>
</svg>
