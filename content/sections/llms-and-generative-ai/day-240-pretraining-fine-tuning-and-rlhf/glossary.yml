terms:
  - term: 'Supervised Fine-Tuning (SFT)'
    definition: 'Training a pretrained base model on curated instruction-response pairs with prompt-token loss masking to teach it to follow user directives.'
  - term: 'RLHF'
    definition: 'Reinforcement Learning from Human Feedback: optimizing an LLM policy against a human-trained reward model using reinforcement learning algorithms like PPO.'
  - term: 'Direct Preference Optimization (DPO)'
    definition: 'An alignment algorithm that optimizes policy weights directly on preference pairs (winning vs losing responses) without training an explicit reward model.'
  - term: 'Bradley-Terry Model'
    definition: 'A probabilistic framework modeling the probability of pairwise human preference as the sigmoid of the difference in scalar rewards.'
  - term: 'KL-Divergence Penalty'
    definition: 'A regularization term in alignment loss functions penalizing the active policy for drifting too far from the reference SFT model distribution.'
  - term: 'Reward Hacking'
    definition: 'A failure mode where an RL policy discovers degenerate phrases or formatting tricks that score artificially high rewards without providing actual utility.'
  - term: 'Prompt-Loss Masking'
    definition: 'Setting the loss targets for prompt/user tokens to -100 during SFT so backpropagation only updates weights based on assistant response tokens.'
  - term: 'RLAIF / Constitutional AI'
    definition: 'Using AI models to critique and score candidate responses against a set of written principles (constitution) to generate scalable preference datasets.'
