questions:
  - question: 'Why is Prompt-Loss Masking standard practice during Supervised Fine-Tuning (SFT)?'
    options:
      - 'Because PyTorch cannot compute loss on text with questions'
      - 'Because prompt tokens are secret'
      - 'Otherwise it learns to write prompts, not answers'
      - 'Because prompt tokens use too much GPU memory'
    answer_index: 2
    explanation: 'SFT masks prompt tokens with label -100 so the model only learns the assistant response distribution.'
  - question: 'What was the foundational mathematical breakthrough of Direct Preference Optimization (DPO, Rafailov et al., 2023)?'
    options:
      - 'DPO replaced PyTorch with Excel spreadsheets'
      - 'DPO discovered how to run neural networks without electricity'
      - 'DPO proved that human feedback is unnecessary'
      - 'The optimal policy has a closed form, so no reward model'
    answer_index: 3
    explanation: 'DPO eliminates the reward model and PPO loop by optimizing the policy directly with an exact implicit reward formulation.'
  - question: 'Why is a KL-Divergence penalty (KL(pi_theta || pi_ref)) enforced during RLHF and DPO?'
    options:
      - 'To stop reward hacking and drift from the reference'
      - 'To make the model run faster'
      - 'To reduce vocabulary size'
      - 'To compress model weights into 4-bit integers'
    answer_index: 0
    explanation: 'The KL penalty keeps the policy close to the reference base/SFT model, preventing reward gaming and degenerative repetition.'
  - question: 'What is the Bradley-Terry preference model used in pairwise human evaluation?'
    options:
      - 'A model predicting GPU temperatures during training'
      - 'Preference probability is a sigmoid of the reward gap'
      - 'A tokenizer format developed in 1952'
      - 'A method for calculating cloud hosting bills'
    answer_index: 1
    explanation: 'Bradley-Terry models pairwise choices via the logistic sigmoid of scalar reward differences.'
  - question: 'What is "RLAIF" (Reinforcement Learning from AI Feedback / Constitutional AI)?'
    options:
      - 'A hardware chip designed for reinforcement learning'
      - 'Training robots to play video games'
      - 'A model critiques and ranks against a constitution'
      - 'Using random numbers to train models'
    answer_index: 2
    explanation: 'RLAIF uses strong AI models (e.g. Claude Constitutional AI) to provide scalable automated preference labels.'
