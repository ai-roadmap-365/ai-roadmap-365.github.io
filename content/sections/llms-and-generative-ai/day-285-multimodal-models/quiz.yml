questions:
- question: What is the primary pretraining objective of OpenAI CLIP?
  options:
  - Predicting the next word in an image caption
  - Maximizing cosine similarity between matching (image_i, text_i) pairs on the diagonal while minimizing
    similarity of all N^2 - N incorrect off-diagonal pairs using symmetric cross-entropy InfoNCE loss
  - Reconstructing raw pixels from text
  - Classifying images into 1,000 ImageNet categories
  answer_index: 1
  explanation: CLIP trains dual image and text encoders simultaneously to maximize the inner product of
    true pairs against negative distractors in the batch.
- question: How does LLaVA (Large Language and Vision Assistant) connect its Vision Encoder to the LLM?
  options:
  - By retraining the entire LLM from scratch
  - By passing image patch features from a frozen Vision Transformer (CLIP ViT-L) through a trainable
    2-layer MLP projection matrix that projects vision hidden states directly into the LLM's word embedding
    space
  - By translating images into ASCII art
  - By converting images into audio wav files
  answer_index: 1
  explanation: "LLaVA uses a lightweight MLP projection layer $W$ to align visual feature dimension $d_v$\
    \ with LLM embedding dimension $d_{\text{llm}}$."
- question: Why do modern multimodal models (like Gemini and GPT-4o) prefer native token fusion over two-stage
    'OCR + Text LLM' pipelines?
  options:
  - Because OCR is illegal
  - Native vision tokens allow the model to directly perceive spatial layouts, handwritten text, charts,
    diagrams, colors, and subtle visual context that OCR pipelines strip away or hallucinate
  - Because native tokens consume less disk space
  - Because OCR cannot read numbers
  answer_index: 1
  explanation: Direct visual tokenization preserves geometry, chart relationships, visual hierarchy, and
    iconography.
- question: What is the formula for symmetric InfoNCE loss in a batch of N image-text pairs?
  options:
  - L = sum(image_i * text_i)
  - L = 0.5 * (CrossEntropy(logits, targets) + CrossEntropy(logits^T, targets)) where logits = (I @ T^T)
    * exp(temperature)
  - L = MSE(I, T)
  - L = 1 - CosineSimilarity(I, T)
  answer_index: 1
  explanation: Symmetric InfoNCE computes cross-entropy along both rows (image-to-text retrieval) and
    columns (text-to-image retrieval) scaled by learnable log temperature.
- question: How many visual tokens does a standard 336x336 image produce when processed by a ViT with
    14x14 patch size?
  options:
  - 1 token
  - (336 / 14) * (336 / 14) = 24 * 24 = 576 visual tokens
  - 336 tokens
  - 14 tokens
  answer_index: 1
  explanation: "Dividing image resolution by patch size yields a $24 \times 24$ grid, resulting in 576\
    \ spatial visual tokens."
