  type: diagram
  title: Vision Language Multimodal Architecture
  alt: Vision Language Multimodal Architecture showing Vision Transformer patch extraction, MLP projector
    alignment, and autoregressive LLM reasoning
  description: Architecture diagram illustrating Vision Transformer patch extraction and MLP projector.
- id: clip-contrastive-dual-encoder-pipeline
  file: assets/clip-contrastive-dual-encoder-pipeline.svg
  type: diagram
  title: CLIP Contrastive Dual Encoder Pipeline
  alt: CLIP Contrastive Dual Encoder Pipeline illustrating image-text pair similarity matrix and diagonal
    InfoNCE loss alignment
  description: Diagram showing CLIP dual-encoder contrastive learning.
- id: vlm-idea
  file: assets/vlm-idea.svg
  type: diagram
  title: 'How a model sees'
  alt: 'Diagram: how an image becomes tokens a language model can reason about'
  description: 'A four-stage description of vision-language models covering the vision encoder, projection, sequence insertion and joint attention.'
- id: clip-loss
  file: assets/clip-loss.svg
  type: diagram
  title: 'Contrastive pretraining'
  alt: 'Diagram: how contrastive training aligns image and text representations'
  description: 'A four-stage description of contrastive pretraining covering the pairs, the batch, the objective and the zero-shot result.'
- id: end-to-end-vs-cascade
  file: assets/end-to-end-vs-cascade.svg
  type: diagram
  title: 'A cascade against one model'
  alt: 'Diagram: a captioning-then-reasoning pipeline compared with a joint vision-language model'
  description: 'A two-column comparison of a two-stage caption pipeline against a jointly trained model.'
- id: visual-injection
  file: assets/visual-injection.svg
  type: diagram
  title: 'Injection through an image'
  alt: 'Diagram: how instructions embedded in an image reach a vision-language model'
  description: 'A four-stage description of visual prompt injection covering the embedded text, its reading, the treatment as instruction and the defences.'
- id: token-inflation
  file: assets/token-inflation.svg
  type: diagram
  title: 'What an image costs'
  alt: 'Diagram: how image resolution drives token count and cost'
  description: 'A four-stage description of visual token cost covering tiling, tokens per tile, the total and the mitigations.'
- id: describing
  file: assets/describing.svg
  type: diagram
  title: 'Reading a description, or seeing it'
  alt: 'Diagram: working from a description compared with examining the thing itself'
  description: 'A two-column comparison of a verbal description against direct examination.'
- id: vlm-implications
  file: assets/vlm-implications.svg
  type: diagram
  title: 'Four consequences of vision-language models'
  alt: 'Diagram: the capability, cost, security and reliability implications of vision-language models'
  description: 'A four-stage description of vision-language implications covering removed pipelines, token cost, injection surface and confident misreading.'
- id: vlm-when
  file: assets/vlm-when.svg
  type: diagram
  title: 'When to use a vision-language model'
  alt: 'Diagram: when vision-language models are the right choice'
  description: 'A two-column comparison of tasks suited to vision-language models against alternatives.'
- id: llava-injection
  file: assets/llava-injection.svg
  type: diagram
  title: 'Injecting visual tokens'
  alt: 'Diagram: how visual tokens are placed into a language model''s input sequence'
  description: 'A four-stage description of visual token injection covering the placeholder, encoding, substitution and unified attention.'
- id: vlm-history
  file: assets/vlm-history.svg
  type: diagram
  title: 'Four steps to vision-language models'
  alt: 'Diagram: the historical progression of vision-language models'
  description: 'A four-stage description of vision-language history covering separate models, captioning pipelines, contrastive alignment and joint instruction tuning.'
