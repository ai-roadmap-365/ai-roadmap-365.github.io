terms:
- term: Vision-Language Model (VLM)
  definition: A multimodal foundation model capable of processing interleaved image, document, and text
    inputs to produce text responses.
- term: CLIP (Contrastive Language-Image Pretraining)
  definition: A dual-encoder architecture trained on 400M image-text pairs using symmetric contrastive
    InfoNCE loss.
- term: Multimodal Projector
  definition: A learnable adapter (typically a 2-layer MLP or cross-attention Q-Former) that maps vision
    encoder tokens into the LLM embedding dimension.
- term: Visual Tokens
  definition: Spatial patch embeddings extracted from an image (e.g., 576 tokens from a 24x24 patch grid)
    treated by the LLM exactly like text word tokens.
- term: Cross-Attention Fusion
  definition: An architecture where text decoder tokens attend directly to visual feature key-value pairs
    at intermediate transformer layers.
- term: Early Fusion vs Late Fusion
  definition: Early fusion concatenates raw visual tokens into the first LLM layer; late fusion combines
    separate modality representations at final layers.
- term: Visual Question Answering (VQA)
  definition: A multimodal benchmark evaluating a model's ability to answer natural language questions
    grounded in visual imagery.
- term: Optical Character Recognition Grounding (OCR Grounding)
  definition: The capability of a VLM to detect, transcribe, and localize text coordinates directly within
    images and PDFs.
