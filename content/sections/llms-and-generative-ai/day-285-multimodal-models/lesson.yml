learning_promise: 'Master Vision-Language Models (VLMs) and contrastive multimodal architectures: understand
  CLIP contrastive pretraining, implement InfoNCE loss and cosine similarity matrices, deconstruct the
  LLaVA projector alignment pipeline, and build a multimodal image-text zero-shot classifier in Python.'
objectives:
- 'Deconstruct the architecture of Vision-Language Models: Vision Encoder (ViT/SigLIP), Multimodal Projector
  (MLP), and LLM Backbone.'
- 'Derive and implement CLIP symmetric contrastive InfoNCE loss: L = 0.5 * (L_image + L_text).'
- Implement visual patch tokenization and MLP projection to match LLM hidden dimensions.
- Build a zero-shot multimodal classifier using cosine similarity between image and text embeddings.
- 'Evaluate multimodal reasoning tradeoffs: native multimodal tokens vs pipeline OCR/captioning.'
