<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Vision Language Multimodal Architecture">
  <title>Vision Language Multimodal Architecture</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d285a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d285a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d285a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d285a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d285a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d285a-arrowhead); }
      .d285a-pulse { animation: d285a-glow 2.5s infinite ease-in-out; }
      @keyframes d285a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d285a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d285a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d285a-box" x="0" y="0" width="220" height="200" />
    <text class="d285a-header" x="15" y="30">1. Image Input</text>
    <text class="d285a-text" x="15" y="60">• Vision Transformer (ViT)</text>
    <text class="d285a-text" x="15" y="85">• 14x14 Patch Tokenizer</text>
    <text class="d285a-accent" x="15" y="140">Visual Tokens [576, 1024]</text>

    <path class="d285a-arrow" d="M 220 100 L 280 100" />

    <rect class="d285a-box d285a-pulse" x="280" y="0" width="240" height="200" />
    <text class="d285a-header" x="15" y="30">2. Multimodal Projector</text>
    <text class="d285a-text" x="15" y="60">• 2-Layer MLP / C-Abstractor</text>
    <text class="d285a-text" x="15" y="85">• Dimension: 1024 -> 4096</text>
    <text class="d285a-accent" x="15" y="140">LLM Embedding Space</text>

    <path class="d285a-arrow" d="M 520 100 L 580 100" />

    <rect class="d285a-box" x="580" y="0" width="200" height="200" />
    <text class="d285a-header" x="15" y="30">3. Unified LLM Backbone</text>
    <text class="d285a-text" x="15" y="60">• Interleaved Text &amp; Vision</text>
    <text class="d285a-text" x="15" y="85">• Autoregressive Response</text>
    <text class="d285a-accent" x="15" y="140">Visual QA &amp; Reasoning</text>
  </g>

</svg>