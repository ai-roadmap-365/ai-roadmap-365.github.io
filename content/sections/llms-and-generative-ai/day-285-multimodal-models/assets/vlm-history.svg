<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From pipelines to one model.">
  <title>Four steps to vision-language models</title>
  <style>
    .vlm-history-bg   { fill: #f8fafc; }
    .vlm-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vlm-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vlm-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vlm-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vlm-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vlm-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vlm-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vlm-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vlm-history-stage { opacity: 1; }

    .vlm-history-s0 { animation-delay: 0.00s; }
    .vlm-history-e0 { animation-delay: 0.00s; }
    .vlm-history-s1 { animation-delay: 1.28s; }
    .vlm-history-e1 { animation-delay: 1.28s; }
    .vlm-history-s2 { animation-delay: 2.56s; }
    .vlm-history-e2 { animation-delay: 2.56s; }
    .vlm-history-s3 { animation-delay: 3.84s; }
    .vlm-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vlm-history-conn  { animation: vlm-history-trace 6.4s ease-in-out infinite; }
      .vlm-history-stage { animation: vlm-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vlm-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vlm-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vlm-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vlm-history-stage { animation: vlm-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vlm-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vlm-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vlm-history-bg" width="980" height="322"/>
  <text class="vlm-history-h1"  x="30" y="40">Four steps to vision-language models</text>
  <text class="vlm-history-sub" x="30" y="64">From pipelines to one model.</text>
  <g class="vlm-history-stage vlm-history-s0">
    <rect class="vlm-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vlm-history-step" x="44" y="142">01</text>
    <text class="vlm-history-name" x="70" y="142">Vision and language models, entirely separate</text>
    <text class="vlm-history-desc" x="44" y="166">No shared representation at all.</text>
  </g>
  <line class="vlm-history-line vlm-history-conn vlm-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vlm-history-tip)"/>
  <g class="vlm-history-stage vlm-history-s1">
    <rect class="vlm-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vlm-history-step" x="280" y="142">02</text>
    <text class="vlm-history-name" x="306" y="142">Captioning pipelines joined them</text>
    <text class="vlm-history-desc" x="280" y="166">Through a text bottleneck that</text>
    <text class="vlm-history-desc" x="280" y="182">lost most of the image.</text>
  </g>
  <line class="vlm-history-line vlm-history-conn vlm-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vlm-history-tip)"/>
  <g class="vlm-history-stage vlm-history-s2">
    <rect class="vlm-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vlm-history-step" x="516" y="142">03</text>
    <text class="vlm-history-name" x="542" y="142">Contrastive training aligned the two spaces</text>
    <text class="vlm-history-desc" x="516" y="166">Which gave zero-shot</text>
    <text class="vlm-history-desc" x="516" y="182">classification.</text>
  </g>
  <line class="vlm-history-line vlm-history-conn vlm-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vlm-history-tip)"/>
  <g class="vlm-history-stage vlm-history-s3">
    <rect class="vlm-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vlm-history-step" x="752" y="142">04</text>
    <text class="vlm-history-name" x="778" y="142">Then projecting visual tokens into a language model</text>
    <text class="vlm-history-desc" x="752" y="166">Which gave conversation about</text>
    <text class="vlm-history-desc" x="752" y="182">images.</text>
  </g>
  <text class="vlm-history-sub" x="30" y="304">The last step is architecturally modest — a small projection and some instruction tuning — which is why capable multimodal models appeared so quickly once it was found.</text>
</svg>
