<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How a model sees</title>
  <style>
    .vlm-idea-bg   { fill: #f8fafc; }
    .vlm-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vlm-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vlm-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vlm-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vlm-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vlm-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vlm-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vlm-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vlm-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vlm-idea-stage { opacity: 1; }

    .vlm-idea-s0 { animation-delay: 0.00s; }
    .vlm-idea-e0 { animation-delay: 0.00s; }
    .vlm-idea-s1 { animation-delay: 1.28s; }
    .vlm-idea-e1 { animation-delay: 1.28s; }
    .vlm-idea-s2 { animation-delay: 2.56s; }
    .vlm-idea-e2 { animation-delay: 2.56s; }
    .vlm-idea-s3 { animation-delay: 3.84s; }
    .vlm-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vlm-idea-conn  { animation: vlm-idea-trace 6.4s ease-in-out infinite; }
      .vlm-idea-stage { animation: vlm-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vlm-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vlm-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vlm-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vlm-idea-stage { animation: vlm-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vlm-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vlm-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vlm-idea-bg" width="980" height="322"/>
  <text class="vlm-idea-h1"  x="30" y="40">How a model sees</text>
  <text class="vlm-idea-sub" x="30" y="64">Four steps.</text>
  <g class="vlm-idea-stage vlm-idea-s0">
    <rect class="vlm-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vlm-idea-step" x="44" y="142">01</text>
    <text class="vlm-idea-name" x="70" y="142">A vision encoder reads the image</text>
    <text class="vlm-idea-desc" x="44" y="166">Producing a grid of patch</text>
    <text class="vlm-idea-desc" x="44" y="182">representations.</text>
  </g>
  <line class="vlm-idea-line vlm-idea-conn vlm-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vlm-idea-tip)"/>
  <g class="vlm-idea-stage vlm-idea-s1">
    <rect class="vlm-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vlm-idea-step" x="280" y="142">02</text>
    <text class="vlm-idea-name" x="306" y="142">A projection maps them into the text space</text>
    <text class="vlm-idea-desc" x="280" y="166">So they occupy the same</text>
    <text class="vlm-idea-desc" x="280" y="182">coordinate system.</text>
  </g>
  <line class="vlm-idea-line vlm-idea-conn vlm-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vlm-idea-tip)"/>
  <g class="vlm-idea-stage vlm-idea-s2">
    <rect class="vlm-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vlm-idea-step" x="516" y="142">03</text>
    <text class="vlm-idea-name" x="542" y="142">They are inserted into the token sequence</text>
    <text class="vlm-idea-desc" x="516" y="166">Alongside the words,</text>
    <text class="vlm-idea-desc" x="516" y="182">indistinguishable in form.</text>
  </g>
  <line class="vlm-idea-line vlm-idea-conn vlm-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vlm-idea-tip)"/>
  <g class="vlm-idea-stage vlm-idea-s3">
    <rect class="vlm-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vlm-idea-step" x="752" y="142">04</text>
    <text class="vlm-idea-name" x="778" y="142">And the model attends across both together</text>
    <text class="vlm-idea-desc" x="752" y="166">Which is what makes joint</text>
    <text class="vlm-idea-desc" x="752" y="182">reasoning possible.</text>
    <text class="vlm-idea-edge" x="752" y="242">one sequence</text>
  </g>
  <text class="vlm-idea-sub" x="30" y="304">The projection is small and does most of the work: aligning two independently trained representations is what turns a vision model and a language model into one system.</text>
</svg>
