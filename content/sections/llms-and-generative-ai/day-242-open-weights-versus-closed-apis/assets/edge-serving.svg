<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is now unremarkable.">
  <title>Running a model locally</title>
  <style>
    .edge-serving-bg   { fill: #f8fafc; }
    .edge-serving-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .edge-serving-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .edge-serving-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .edge-serving-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .edge-serving-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .edge-serving-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .edge-serving-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .edge-serving-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .edge-serving-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .edge-serving-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .edge-serving-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .edge-serving-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .edge-serving-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .edge-serving-stage { opacity: 1; }

    .edge-serving-s0 { animation-delay: 0.00s; }
    .edge-serving-e0 { animation-delay: 0.00s; }
    .edge-serving-s1 { animation-delay: 1.28s; }
    .edge-serving-e1 { animation-delay: 1.28s; }
    .edge-serving-s2 { animation-delay: 2.56s; }
    .edge-serving-e2 { animation-delay: 2.56s; }
    .edge-serving-s3 { animation-delay: 3.84s; }
    .edge-serving-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .edge-serving-conn  { animation: edge-serving-trace 6.4s ease-in-out infinite; }
      .edge-serving-stage { animation: edge-serving-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes edge-serving-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes edge-serving-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .edge-serving-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .edge-serving-stage { animation: edge-serving-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes edge-serving-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="edge-serving-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="edge-serving-bg" width="980" height="322"/>
  <text class="edge-serving-h1"  x="30" y="40">Running a model locally</text>
  <text class="edge-serving-sub" x="30" y="64">Which is now unremarkable.</text>
  <g class="edge-serving-stage edge-serving-s0">
    <rect class="edge-serving-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="edge-serving-step" x="44" y="142">01</text>
    <text class="edge-serving-name" x="70" y="142">Download open weights</text>
    <text class="edge-serving-desc" x="44" y="166">Which for capable mid-sized</text>
    <text class="edge-serving-desc" x="44" y="182">models is a routine step.</text>
  </g>
  <line class="edge-serving-line edge-serving-conn edge-serving-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#edge-serving-tip)"/>
  <g class="edge-serving-stage edge-serving-s1">
    <rect class="edge-serving-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="edge-serving-step" x="280" y="142">02</text>
    <text class="edge-serving-name" x="306" y="142">Quantise to four or five bits</text>
    <text class="edge-serving-desc" x="280" y="166">Cutting memory to a fraction</text>
    <text class="edge-serving-desc" x="280" y="182">with small quality loss.</text>
  </g>
  <line class="edge-serving-line edge-serving-conn edge-serving-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#edge-serving-tip)"/>
  <g class="edge-serving-stage edge-serving-s2">
    <rect class="edge-serving-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="edge-serving-step" x="516" y="142">03</text>
    <text class="edge-serving-name" x="542" y="142">Run on a lightweight local runtime</text>
    <text class="edge-serving-desc" x="516" y="166">On a laptop, with no accelerator</text>
    <text class="edge-serving-desc" x="516" y="182">required.</text>
  </g>
  <line class="edge-serving-line edge-serving-conn edge-serving-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#edge-serving-tip)"/>
  <g class="edge-serving-stage edge-serving-s3">
    <rect class="edge-serving-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="edge-serving-step" x="752" y="142">04</text>
    <text class="edge-serving-name" x="778" y="142">Useful capability, entirely offline</text>
    <text class="edge-serving-desc" x="752" y="166">At zero marginal cost, with no</text>
    <text class="edge-serving-desc" x="752" y="182">data leaving the machine.</text>
    <text class="edge-serving-edge" x="752" y="242">free</text>
  </g>
  <text class="edge-serving-sub" x="30" y="304">This changed what is possible for privacy-sensitive and offline applications more than any single model release did, because it removed the network from the architecture.</text>
</svg>
