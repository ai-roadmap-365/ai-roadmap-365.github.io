<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Serving efficiency, not model quality.">
  <title>What makes self-hosting viable</title>
  <style>
    .inference-stack-bg   { fill: #f8fafc; }
    .inference-stack-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inference-stack-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inference-stack-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inference-stack-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inference-stack-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inference-stack-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inference-stack-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inference-stack-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inference-stack-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inference-stack-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inference-stack-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inference-stack-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .inference-stack-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .inference-stack-stage { opacity: 1; }

    .inference-stack-s0 { animation-delay: 0.00s; }
    .inference-stack-e0 { animation-delay: 0.00s; }
    .inference-stack-s1 { animation-delay: 1.28s; }
    .inference-stack-e1 { animation-delay: 1.28s; }
    .inference-stack-s2 { animation-delay: 2.56s; }
    .inference-stack-e2 { animation-delay: 2.56s; }
    .inference-stack-s3 { animation-delay: 3.84s; }
    .inference-stack-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .inference-stack-conn  { animation: inference-stack-trace 6.4s ease-in-out infinite; }
      .inference-stack-stage { animation: inference-stack-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes inference-stack-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes inference-stack-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .inference-stack-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .inference-stack-stage { animation: inference-stack-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes inference-stack-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="inference-stack-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="inference-stack-bg" width="980" height="322"/>
  <text class="inference-stack-h1"  x="30" y="40">What makes self-hosting viable</text>
  <text class="inference-stack-sub" x="30" y="64">Serving efficiency, not model quality.</text>
  <g class="inference-stack-stage inference-stack-s0">
    <rect class="inference-stack-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="inference-stack-step" x="44" y="142">01</text>
    <text class="inference-stack-name" x="70" y="142">Naive serving handles one request at a time</text>
    <text class="inference-stack-desc" x="44" y="166">Leaving the hardware almost</text>
    <text class="inference-stack-desc" x="44" y="182">entirely idle.</text>
  </g>
  <line class="inference-stack-line inference-stack-conn inference-stack-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#inference-stack-tip)"/>
  <g class="inference-stack-stage inference-stack-s1">
    <rect class="inference-stack-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="inference-stack-step" x="280" y="142">02</text>
    <text class="inference-stack-name" x="306" y="142">Batch requests continuously</text>
    <text class="inference-stack-desc" x="280" y="166">New ones join the batch as</text>
    <text class="inference-stack-desc" x="280" y="182">others finish.</text>
  </g>
  <line class="inference-stack-line inference-stack-conn inference-stack-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#inference-stack-tip)"/>
  <g class="inference-stack-stage inference-stack-s2">
    <rect class="inference-stack-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="inference-stack-step" x="516" y="142">03</text>
    <text class="inference-stack-name" x="542" y="142">And page the attention cache</text>
    <text class="inference-stack-desc" x="516" y="166">So memory is not reserved for a</text>
    <text class="inference-stack-desc" x="516" y="182">length nobody used.</text>
  </g>
  <line class="inference-stack-line inference-stack-conn inference-stack-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#inference-stack-tip)"/>
  <g class="inference-stack-stage inference-stack-s3">
    <rect class="inference-stack-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="inference-stack-step" x="752" y="142">04</text>
    <text class="inference-stack-name" x="778" y="142">Many times the throughput</text>
    <text class="inference-stack-desc" x="752" y="166">On identical hardware, with an</text>
    <text class="inference-stack-desc" x="752" y="182">identical model.</text>
  </g>
  <text class="inference-stack-sub" x="30" y="304">The gap between a naive server and an optimised one is large enough to change the break-even calculation entirely, which is why the serving stack is part of the decision.</text>
</svg>
