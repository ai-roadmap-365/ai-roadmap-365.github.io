<svg role="img" aria-label="Self-hosted vLLM production inference serving stack architecture diagram showing client requests routed to PagedAttention engine on GPU cluster" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Production vLLM Inference Serving Stack</title>
  <defs>
    <linearGradient id="bg242b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card242b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg242b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PRODUCTION SELF-HOSTED INFERENCE STACK</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">High-Throughput Open-Weights Serving with vLLM, PagedAttention, and Continuous Batching</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card242b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Client Layer -->
    <rect x="25" y="30" width="140" height="235" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="95" y="55" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Client Requests</text>
    <text x="35" y="85" fill="#cbd5e1" font-size="8">• HTTP / gRPC calls</text>
    <text x="35" y="105" fill="#cbd5e1" font-size="8">• OpenAI-compatible API</text>
    <text x="35" y="125" fill="#cbd5e1" font-size="8">• Streaming SSE chunks</text>
    <text x="35" y="145" fill="#cbd5e1" font-size="8">• Token auth &amp; quotas</text>
    <text x="35" y="165" fill="#cbd5e1" font-size="8">• Microservice fleet</text>

    <!-- Serving Engine (vLLM) -->
    <rect x="195" y="30" width="230" height="235" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="310" y="55" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2. vLLM Engine</text>
    <rect x="210" y="75" width="200" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="310" y="98" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">PagedAttention (Zero KV Waste)</text>
    
    <rect x="210" y="125" width="200" height="40" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="310" y="148" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Continuous Iteration Batching</text>

    <rect x="210" y="175" width="200" height="40" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="310" y="198" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">FP8 / AWQ Weight Quantization</text>

    <text x="210" y="240" fill="#34d399" font-size="8" font-weight="700">Throughput: 10x higher than native HF</text>

    <!-- GPU Cluster Layer -->
    <rect x="455" y="30" width="235" height="235" fill="#0f172a" stroke="#a855f7" rx="6"/>
    <text x="572" y="55" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">3. GPU Cluster Hardware</text>
    <text x="470" y="85" fill="#cbd5e1" font-size="8">• 8x NVIDIA H100 80GB SXM5</text>
    <text x="470" y="105" fill="#cbd5e1" font-size="8">• 900 GB/s NVLink Interconnect</text>
    <text x="470" y="125" fill="#cbd5e1" font-size="8">• Tensor Parallelism (TP=8)</text>
    <text x="470" y="145" fill="#cbd5e1" font-size="8">• LLaMA-3.1-70B / 405B weights</text>
    <text x="470" y="165" fill="#cbd5e1" font-size="8">• 2,500+ output tokens/sec total</text>
    <text x="470" y="200" fill="#fbbf24" font-size="8" font-weight="700">Dedicated Sovereign VPC</text>
    <text x="470" y="218" fill="#94a3b8" font-size="8">Zero data leakage, fully air-gapped</text>
  </g>
</svg>
