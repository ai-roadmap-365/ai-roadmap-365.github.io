    type: diagram
    title: 'Open Weights vs. Closed APIs Trade-off Analysis'
    alt: Trade-off radar chart comparing closed cloud APIs against self-hosted open-weights foundation models across 6 dimensions
    description: 'Six-dimensional comparative analysis between proprietary cloud APIs and self-hosted open-weights models.'
  - id: self-hosting-vllm-serving-stack-architecture
    file: assets/self-hosting-vllm-serving-stack-architecture.svg
    type: diagram
    title: 'Production vLLM Inference Serving Stack'
    alt: Self-hosted vLLM production inference serving stack architecture diagram showing client requests routed to PagedAttention engine on GPU cluster
    description: 'High-throughput self-hosted inference serving architecture utilizing vLLM, PagedAttention, continuous batching, and Tensor Parallelism.'
  - id: open-vs-closed
    file: assets/open-vs-closed.svg
    type: diagram
    title: 'Open weights against a hosted API'
    alt: 'Diagram: self-hosted open-weight models compared with hosted model APIs'
    description: 'A two-column comparison of running open-weight models against calling a hosted API.'
  - id: tco
    file: assets/tco.svg
    type: diagram
    title: 'Where self-hosting breaks even'
    alt: 'Diagram: how per-token API cost compares with fixed self-hosting cost as volume rises'
    description: 'A four-stage description of the break-even calculation covering fixed cost, per-token cost, the crossing point and the hidden operational cost.'
  - id: inference-stack
    file: assets/inference-stack.svg
    type: diagram
    title: 'What makes self-hosting viable'
    alt: 'Diagram: naive model serving compared with an optimised inference server'
    description: 'A four-stage description of the inference stack covering naive serving, continuous batching, paged cache memory and the throughput result.'
  - id: sovereignty
    file: assets/sovereignty.svg
    type: diagram
    title: 'When the decision is not economic'
    alt: 'Diagram: the regulatory and contractual constraints that force self-hosting'
    description: 'A four-stage description of sovereignty constraints covering data residency, sector regulation, contractual terms and air-gapped environments.'
  - id: silent-update
    file: assets/silent-update.svg
    type: diagram
    title: 'The model changed and nobody told you'
    alt: 'Diagram: how a hosted model update silently changes application behaviour'
    description: 'A four-stage description of silent model updates covering the stable name, the underlying change, the behaviour shift and the defence.'
  - id: edge-serving
    file: assets/edge-serving.svg
    type: diagram
    title: 'Running a model locally'
    alt: 'Diagram: the four steps to running a language model on local hardware'
    description: 'A four-stage description of local serving covering the open checkpoint, quantisation, the local runtime and the capability available.'
  - id: rent-or-buy
    file: assets/rent-or-buy.svg
    type: diagram
    title: 'Renting or buying a vehicle'
    alt: 'Diagram: renting compared with owning, as an analogy for hosted and self-hosted models'
    description: 'A two-column comparison of renting a vehicle against owning one.'
  - id: self-host-implications
    file: assets/self-host-implications.svg
    type: diagram
    title: 'Four consequences of self-hosting'
    alt: 'Diagram: the cost, capability, operations and licensing implications of self-hosting models'
    description: 'A four-stage description of self-hosting implications covering marginal cost, capability gap, operational burden and licence terms.'
  - id: self-host-when
    file: assets/self-host-when.svg
    type: diagram
    title: 'When to self-host'
    alt: 'Diagram: when self-hosting open-weight models is the right choice'
    description: 'A two-column comparison of situations favouring self-hosting against those favouring a hosted API.'
