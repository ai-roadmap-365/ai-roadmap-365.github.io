terms:
  - term: 'Open Weights'
    definition: 'Foundation models whose trained parameter weights, tokenizer, and architectures are publicly released for self-hosting, modification, and custom fine-tuning.'
  - term: 'Closed API'
    definition: 'Proprietary foundation models accessible only via remote cloud endpoints on a pay-per-token or subscription basis, without access to model weights.'
  - term: 'Total Cost of Ownership (TCO)'
    definition: 'The comprehensive financial accounting comparing fixed GPU server rental, networking, electricity, and MLOps engineering against variable per-token API charges.'
  - term: 'PagedAttention'
    definition: 'A memory management algorithm inspired by OS virtual memory paging that stores attention keys and values in non-contiguous physical memory blocks.'
  - term: 'Continuous Batching'
    definition: 'An inference scheduling strategy operating at the token iteration level, adding new requests and retiring completed ones on every forward pass.'
  - term: 'Air-Gapped VPC'
    definition: 'A secure cloud or on-premise network environment completely isolated from the public internet with zero outbound data egress.'
  - term: 'vLLM'
    definition: 'An open-source high-throughput LLM inference and serving engine utilizing PagedAttention and continuous batching.'
  - term: 'Sovereign AI'
    definition: 'The capability of an enterprise or nation to build, own, and control its AI infrastructure and models without reliance on foreign proprietary platforms.'
