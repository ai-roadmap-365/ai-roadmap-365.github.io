questions:
  - question: 'What is the primary technical breakthrough of PagedAttention in modern inference serving engines like vLLM?'
    options:
      - 'Treating the KV cache like virtual memory pages in an operating system, allowing non-contiguous physical memory allocation for attention keys and values, reducing KV-cache VRAM fragmentation from 60%-80% down to under 4% and enabling 2x-4x higher batch concurrency'
      - 'Compressing model weights into MP3 files'
      - 'Converting text to HTML web pages'
      - 'Increasing GPU fan speeds'
    answer_index: 0
    explanation: 'PagedAttention eliminates KV-cache memory fragmentation using OS-style virtual memory paging.'
  - question: 'At what point in the Total Cost of Ownership (TCO) curve does self-hosting an 8x H100 GPU cluster ($24/hour) become economically cheaper than calling a $3/M token closed commercial API?'
    options:
      - 'At the break-even volume threshold (typically around 50 to 100 Million tokens per day of continuous steady-state traffic); below this volume, serverless closed APIs are cheaper because you only pay for tokens processed with zero idle GPU wastage'
      - 'Self-hosting is always cheaper starting from 1 query per day'
      - 'Closed APIs are always cheaper regardless of infinite volume'
      - 'Break-even only depends on internet bandwidth'
    answer_index: 0
    explanation: 'Self-hosting has high fixed costs, breaking even only when continuous token volume fully utilizes the hardware.'
  - question: 'Why do strict enterprise environments (healthcare, defense, finance) often mandate open-weights models over closed cloud APIs?'
    options:
      - 'Because open-weights models can be deployed entirely inside air-gapped, zero-egress private VPCs or on-premise datacenters, ensuring that sensitive customer data, medical records, or proprietary IP never leave corporate firewalls'
      - 'Because closed APIs do not work on Windows'
      - 'Because open-weights models are legally required in banking'
      - 'Because closed APIs cannot generate code'
    answer_index: 0
    explanation: 'Open-weights models can be hosted in air-gapped sovereign VPCs with zero data egress.'
  - question: 'What is Continuous Iteration Batching in LLM serving?'
    options:
      - 'Dynamically evicting completed sequences at the token step level and immediately injecting new incoming requests into the active batch without waiting for all sequences in the batch to finish generation, eliminating GPU idle time caused by variable output lengths'
      - 'Training models continuously for 10 years'
      - 'Running batch jobs once a week'
      - 'Combining 10 prompts into 1 giant prompt'
    answer_index: 0
    explanation: 'Continuous batching operates at the token iteration level, inserting and removing sequences dynamically.'
  - question: 'What risk is introduced when an enterprise application relies exclusively on a single closed proprietary API provider?'
    options:
      - 'Vendor lock-in, unexpected rate limit throttling, pricing changes, potential service outages, and silent upstream model alignment updates that can alter output parsing behavior'
      - 'The computer monitor turning off'
      - 'Python syntax becoming deprecated'
      - 'Cloud storage deleting all databases'
    answer_index: 0
    explanation: 'Relying on a single vendor creates vulnerability to pricing changes, outages, and silent behavior drift.'
