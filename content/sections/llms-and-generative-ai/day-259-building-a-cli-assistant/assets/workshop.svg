<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The assembly is the point.">
  <title>A workshop, or a single tool</title>
  <style>
    .workshop-bg   { fill: #f8fafc; }
    .workshop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workshop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workshop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workshop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workshop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workshop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workshop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workshop-row { opacity: 1; }
    .workshop-r0 { animation-delay: 0.00s; }
    .workshop-r1 { animation-delay: 0.45s; }
    .workshop-r2 { animation-delay: 0.90s; }
    .workshop-r3 { animation-delay: 1.35s; }
    .workshop-r4 { animation-delay: 1.80s; }
    .workshop-row { animation: workshop-reveal 7.3s ease-in-out infinite; }
    @keyframes workshop-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="workshop-bg" width="980" height="390"/>
  <text class="workshop-h1"  x="30" y="40">A workshop, or a single tool</text>
  <text class="workshop-sub" x="30" y="64">The assembly is the point.</text>
  <rect class="workshop-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="workshop-name" x="46" y="122">Separate capabilities</text>
  <text class="workshop-desc" x="46" y="142">Each demonstrated alone.</text>
  <text class="workshop-desc workshop-row workshop-r0" x="46" y="182">Prompting, in isolation</text>
  <text class="workshop-desc workshop-row workshop-r1" x="46" y="216">Streaming, in isolation</text>
  <text class="workshop-desc workshop-row workshop-r2" x="46" y="250">Tool calling, in isolation</text>
  <text class="workshop-desc workshop-row workshop-r3" x="46" y="284">Each works in an example</text>
  <text class="workshop-desc workshop-row workshop-r4" x="46" y="318">And none of it is a product</text>
  <rect class="workshop-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="workshop-name" x="526" y="122">Assembled</text>
  <text class="workshop-desc" x="526" y="142">Working together.</text>
  <text class="workshop-desc workshop-row workshop-r0" x="526" y="182">All of them in one loop</text>
  <text class="workshop-desc workshop-row workshop-r1" x="526" y="216">Failures in one affecting the others</text>
  <text class="workshop-desc workshop-row workshop-r2" x="526" y="250">State carried across turns</text>
  <text class="workshop-desc workshop-row workshop-r3" x="526" y="284">Errors handled everywhere</text>
  <text class="workshop-desc workshop-row workshop-r4" x="526" y="318">Which is where the real work is</text>
  <text class="workshop-sub" x="30" y="372">The integration is genuinely where the difficulty lives: every piece here has already been demonstrated working, and assembling them surfaces problems none of them had alone.</text>
</svg>
