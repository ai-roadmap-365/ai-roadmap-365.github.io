<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Local and hosted together</title>
  <style>
    .hybrid-routing-bg   { fill: #f8fafc; }
    .hybrid-routing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-routing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-routing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-routing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-routing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-routing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hybrid-routing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hybrid-routing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hybrid-routing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hybrid-routing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hybrid-routing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hybrid-routing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hybrid-routing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hybrid-routing-stage { opacity: 1; }

    .hybrid-routing-s0 { animation-delay: 0.00s; }
    .hybrid-routing-e0 { animation-delay: 0.00s; }
    .hybrid-routing-s1 { animation-delay: 1.28s; }
    .hybrid-routing-e1 { animation-delay: 1.28s; }
    .hybrid-routing-s2 { animation-delay: 2.56s; }
    .hybrid-routing-e2 { animation-delay: 2.56s; }
    .hybrid-routing-s3 { animation-delay: 3.84s; }
    .hybrid-routing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hybrid-routing-conn  { animation: hybrid-routing-trace 6.4s ease-in-out infinite; }
      .hybrid-routing-stage { animation: hybrid-routing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hybrid-routing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hybrid-routing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hybrid-routing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hybrid-routing-stage { animation: hybrid-routing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hybrid-routing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hybrid-routing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hybrid-routing-bg" width="980" height="322"/>
  <text class="hybrid-routing-h1"  x="30" y="40">Local and hosted together</text>
  <text class="hybrid-routing-sub" x="30" y="64">Four steps.</text>
  <g class="hybrid-routing-stage hybrid-routing-s0">
    <rect class="hybrid-routing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-routing-step" x="44" y="142">01</text>
    <text class="hybrid-routing-name" x="70" y="142">Classify the request</text>
    <text class="hybrid-routing-desc" x="44" y="166">By difficulty, or by what data</text>
    <text class="hybrid-routing-desc" x="44" y="182">it touches.</text>
  </g>
  <line class="hybrid-routing-line hybrid-routing-conn hybrid-routing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hybrid-routing-tip)"/>
  <g class="hybrid-routing-stage hybrid-routing-s1">
    <rect class="hybrid-routing-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-routing-step" x="280" y="142">02</text>
    <text class="hybrid-routing-name" x="306" y="142">Handle routine work locally</text>
    <text class="hybrid-routing-desc" x="280" y="166">At no cost, with nothing leaving</text>
    <text class="hybrid-routing-desc" x="280" y="182">the machine.</text>
  </g>
  <line class="hybrid-routing-line hybrid-routing-conn hybrid-routing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hybrid-routing-tip)"/>
  <g class="hybrid-routing-stage hybrid-routing-s2">
    <rect class="hybrid-routing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-routing-step" x="516" y="142">03</text>
    <text class="hybrid-routing-name" x="542" y="142">Escalate hard requests to a hosted model</text>
    <text class="hybrid-routing-desc" x="516" y="166">With the user aware that data is</text>
    <text class="hybrid-routing-desc" x="516" y="182">leaving.</text>
  </g>
  <line class="hybrid-routing-line hybrid-routing-conn hybrid-routing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hybrid-routing-tip)"/>
  <g class="hybrid-routing-stage hybrid-routing-s3">
    <rect class="hybrid-routing-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-routing-step" x="752" y="142">04</text>
    <text class="hybrid-routing-name" x="778" y="142">And fall back to local when offline</text>
    <text class="hybrid-routing-desc" x="752" y="166">Degraded, and still working.</text>
  </g>
  <text class="hybrid-routing-sub" x="30" y="304">Making the escalation visible to the user is worth more than it costs: the difference between a local and a hosted call is a privacy decision, and it should not be silent.</text>
</svg>
