<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Who decides.">
  <title>An assistant against an autonomous agent</title>
  <style>
    .assistant-vs-agent-bg   { fill: #f8fafc; }
    .assistant-vs-agent-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-agent-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-agent-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-agent-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-agent-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-agent-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assistant-vs-agent-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assistant-vs-agent-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assistant-vs-agent-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assistant-vs-agent-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assistant-vs-agent-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assistant-vs-agent-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assistant-vs-agent-row { opacity: 1; }
    .assistant-vs-agent-r0 { animation-delay: 0.00s; }
    .assistant-vs-agent-r1 { animation-delay: 0.45s; }
    .assistant-vs-agent-r2 { animation-delay: 0.90s; }
    .assistant-vs-agent-r3 { animation-delay: 1.35s; }
    .assistant-vs-agent-r4 { animation-delay: 1.80s; }
    .assistant-vs-agent-row { animation: assistant-vs-agent-reveal 7.3s ease-in-out infinite; }
    @keyframes assistant-vs-agent-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="assistant-vs-agent-bg" width="980" height="390"/>
  <text class="assistant-vs-agent-h1"  x="30" y="40">An assistant against an autonomous agent</text>
  <text class="assistant-vs-agent-sub" x="30" y="64">Who decides.</text>
  <rect class="assistant-vs-agent-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="assistant-vs-agent-name" x="46" y="122">Supervised assistant</text>
  <text class="assistant-vs-agent-desc" x="46" y="142">A person in the loop.</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r0" x="46" y="182">Each action confirmed or observed</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r1" x="46" y="216">Bounded number of steps</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r2" x="46" y="250">Errors caught immediately</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r3" x="46" y="284">Scope limited to the session</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r4" x="46" y="318">Which is what makes it safe to give tools</text>
  <rect class="assistant-vs-agent-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="assistant-vs-agent-name" x="526" y="122">Autonomous agent</text>
  <text class="assistant-vs-agent-desc" x="526" y="142">Nobody watching.</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r0" x="526" y="182">Actions taken without confirmation</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r1" x="526" y="216">Unbounded steps until a goal or a limit</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r2" x="526" y="250">Errors compound before discovery</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r3" x="526" y="284">Scope limited only by its permissions</text>
  <text class="assistant-vs-agent-desc assistant-vs-agent-row assistant-vs-agent-r4" x="526" y="318">Which requires much stronger constraints</text>
  <text class="assistant-vs-agent-sub" x="30" y="372">The distinction is about supervision rather than capability: the same program becomes a different risk the moment the confirmation prompt is removed.</text>
</svg>
