<svg role="img" aria-label="Context sliding window and memory truncation architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Context Sliding Window &amp; Token Truncation</title>
  <defs>
    <linearGradient id="bg259b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card259b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg259b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CONTEXT SLIDING WINDOW &amp; MEMORY TRUNCATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Preserving Static System Prompts while Automatically Evicting Oldest Non-System Turns</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card259b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Pinned System Context -->
    <rect x="25" y="25" width="710" height="60" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="45" y="50" fill="#38bdf8" font-size="10" font-weight="700">PINNED IMMUTABLE PREFIX (Never Evicted):</text>
    <text x="45" y="68" fill="#cbd5e1" font-size="8">System Prompt + Tool Schemas + KV Cache Breakpoint (cache_control: ephemeral)</text>

    <!-- Evicted Turns -->
    <g transform="translate(25, 100)">
      <rect x="0" y="0" width="220" height="150" fill="#0f172a" stroke="#fb7185" stroke-dasharray="4" rx="6"/>
      <text x="110" y="30" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">EVICTED TURNS (Pruned)</text>
      <rect x="15" y="45" width="190" height="30" fill="#1e293b" rx="4"/>
      <text x="25" y="63" fill="#64748b" font-size="7">Turn 1 (User): "Hello"</text>
      <rect x="15" y="85" width="190" height="30" fill="#1e293b" rx="4"/>
      <text x="25" y="103" fill="#64748b" font-size="7">Turn 1 (Assistant): "Hi! How can I help?"</text>
      <text x="110" y="135" fill="#fb7185" font-size="8" text-anchor="middle">Exceeds Max Window (N &gt; 8)</text>
    </g>

    <!-- Active Sliding Window -->
    <g transform="translate(265, 100)">
      <rect x="0" y="0" width="470" height="150" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
      <text x="235" y="30" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">ACTIVE CONTEXT SLIDING WINDOW (Last 6 Turns)</text>
      
      <rect x="20" y="45" width="430" height="25" fill="#1e293b" rx="4"/>
      <text x="30" y="62" fill="#cbd5e1" font-size="7">Turn 4: User asked to analyze sales dataset</text>
      
      <rect x="20" y="75" width="430" height="25" fill="#1e293b" rx="4"/>
      <text x="30" y="92" fill="#cbd5e1" font-size="7">Turn 5: Assistant executed calculate_tax tool and returned chart</text>

      <rect x="20" y="105" width="430" height="25" fill="#1e293b" rx="4"/>
      <text x="30" y="122" fill="#34d399" font-size="7">Turn 6 (Current): User asks follow-up question on Q3 margins</text>
    </g>
  </g>
</svg>
