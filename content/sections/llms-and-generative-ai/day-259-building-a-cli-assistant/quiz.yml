questions:
  - question: 'What is the primary role of an asynchronous REPL (Read-Eval-Print Loop) in a CLI assistant?'
    options:
      - 'To continuously accept user keyboard commands, manage multi-turn message state, dispatch model requests asynchronously, and render real-time streaming output to the terminal'
      - 'To reboot the computer on every prompt'
      - 'To mine cryptocurrency'
      - 'To compile C++ code into machine language'
    answer_index: 0
    explanation: 'The REPL loop orchestrates user input, memory buffering, API dispatch, and live terminal rendering.'
  - question: 'Why is a sliding window algorithm used for multi-turn conversation history management?'
    options:
      - 'To preserve the pinned system prompt and recent conversational context while pruning older turns so token length stays within context limits and budget quotas'
      - 'To delete user files after 10 minutes'
      - 'To invert text upside down'
      - 'To increase network bandwidth'
    answer_index: 0
    explanation: 'Sliding windows keep context within safe token and cost bounds while maintaining recent conversational state.'
  - question: 'How does Rich Live rendering improve the terminal user experience during token streaming?'
    options:
      - 'It dynamically repaints incoming markdown and code blocks in place at 60Hz, providing a smooth typewriter effect without printing thousands of duplicate newlines'
      - 'It changes terminal fonts to Comic Sans'
      - 'It converts the terminal to an audio podcast'
      - 'It hides all error messages'
    answer_index: 0
    explanation: 'Rich Live updates in-place, rendering formatted markdown smoothly as tokens arrive.'
  - question: 'Why is it critical to sandbox local file and shell tools executed by a CLI assistant?'
    options:
      - 'To prevent the model from inadvertently deleting system directories (e.g. rm -rf /) or executing unauthorized commands if influenced by untrusted user prompts'
      - 'Because sandboxing makes Python run 100x faster'
      - 'To disable the internet connection'
      - 'Because sandboxing is required by Apple'
    answer_index: 0
    explanation: 'Sandboxing and path validation ensure the CLI assistant only accesses permitted project directories.'
  - question: 'What telemetry data should a production CLI assistant display upon session exit?'
    options:
      - 'Total user turns, total prompt/cached/output tokens consumed, total session cost in USD, and average Time-To-First-Token latency'
      - 'The user computer serial number'
      - 'A random number'
      - 'Nothing at all'
    answer_index: 0
    explanation: 'Displaying comprehensive token and financial telemetry gives developers complete visibility into API resource consumption.'
