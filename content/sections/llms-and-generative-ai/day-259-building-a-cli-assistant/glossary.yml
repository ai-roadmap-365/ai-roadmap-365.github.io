terms:
  - term: 'CLI Assistant'
    definition: 'A terminal-based conversational AI agent providing interactive code analysis, system automation, and Q&A.'
  - term: 'REPL'
    definition: 'Read-Eval-Print Loop; an interactive command-line environment that takes user inputs, executes logic, and returns results.'
  - term: 'Sliding Context Window'
    definition: 'A memory eviction strategy that retains system instructions and the most recent N turns while pruning older exchanges.'
  - term: 'Rich Live Display'
    definition: 'A terminal UI component that updates text and Markdown in-place dynamically as streaming tokens arrive.'
  - term: 'Tool Sandbox'
    definition: 'A secure execution boundary restricting tool file access to designated project working directories.'
  - term: 'Session Ledger'
    definition: 'An in-memory telemetry tracker recording cumulative token expenditures and financial costs for a CLI session.'
  - term: 'Slash Command'
    definition: 'A special terminal instruction (e.g. /help, /cost, /clear) intercepted by the REPL before dispatching to the LLM.'
  - term: 'Prompt History Buffer'
    definition: 'A persistent storage mechanism recording previous terminal inputs for arrow-key recall and replay.'
