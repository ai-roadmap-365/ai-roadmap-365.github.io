visuals:
- id: lora-low-rank-decomposition-architecture
  file: assets/lora-low-rank-decomposition-architecture.svg
  type: diagram
  title: LoRA Low-Rank Decomposition Architecture
  alt: LoRA Low-Rank Decomposition Architecture showing frozen base weights W0 and
    trainable low-rank matrices A and B
  description: Architecture diagram illustrating frozen base weights and trainable
    low-rank adapter matrices.
- id: lora-adapter-injection-and-merging-flow
  file: assets/lora-adapter-injection-and-merging-flow.svg
  type: diagram
  title: LoRA Adapter Injection and Merging Flow
  alt: LoRA Adapter Injection and Merging Flow demonstrating forward pass addition
    and permanent weight merging
  description: Flowchart showing runtime forward-pass scaling and permanent adapter
    weight merging.
- id: lora-idea
  file: assets/lora-idea.svg
  type: diagram
  title: 'Low-rank adaptation'
  alt: 'Diagram: how low-rank adaptation trains a small addition to a frozen model'
  description: 'A four-stage description of low-rank adaptation covering the frozen base, the small matrices, training and the result.'
- id: low-rank-math
  file: assets/low-rank-math.svg
  type: diagram
  title: 'Why low rank works'
  alt: 'Diagram: why the weight update needed for a task is low-rank'
  description: 'A four-stage description of the low-rank hypothesis covering the full update, its observed rank, the factorisation and the parameter saving.'
- id: vram-wall
  file: assets/vram-wall.svg
  type: diagram
  title: 'The memory wall'
  alt: 'Diagram: the four memory consumers that prevent full fine-tuning on one device'
  description: 'A four-stage description of training memory covering weights, gradients, optimiser state and the resulting requirement.'
- id: init-dynamics
  file: assets/init-dynamics.svg
  type: diagram
  title: 'Why one matrix starts at zero'
  alt: 'Diagram: how adapter initialisation keeps the model unchanged at the start of training'
  description: 'A four-stage description of adapter initialisation covering the two matrices, the zero initialisation, the zero product and the smooth start.'
- id: target-modules
  file: assets/target-modules.svg
  type: diagram
  title: 'Which layers to adapt'
  alt: 'Diagram: which transformer modules adapters are attached to'
  description: 'A four-stage description of adapter placement covering attention projections, feed-forward layers, coverage and the trade-off.'
- id: merging
  file: assets/merging.svg
  type: diagram
  title: 'Merging the adapter'
  alt: 'Diagram: how a trained adapter is merged into the base weights for inference'
  description: 'A four-stage description of adapter merging covering the serving overhead, the merge, the resulting model and what is lost.'
- id: multi-adapter
  file: assets/multi-adapter.svg
  type: diagram
  title: 'Many adapters, one backbone'
  alt: 'Diagram: how one loaded base model serves many task-specific adapters'
  description: 'A four-stage description of multi-adapter serving covering the loaded base, adapter storage, per-request selection and the resulting economics.'
- id: lora-vs-full
  file: assets/lora-vs-full.svg
  type: diagram
  title: 'Adapters against full fine-tuning'
  alt: 'Diagram: adapter fine-tuning compared with full-parameter fine-tuning'
  description: 'A two-column comparison of adapter-based fine-tuning against full fine-tuning.'
- id: stencil
  file: assets/stencil.svg
  type: diagram
  title: 'An overlay, not a repaint'
  alt: 'Diagram: repainting a surface compared with applying a removable overlay'
  description: 'A two-column comparison of permanently altering something against adding a removable layer.'
- id: adapter-provenance
  file: assets/adapter-provenance.svg
  type: diagram
  title: 'Adapter provenance'
  alt: 'Diagram: why the provenance of a downloaded adapter matters'
  description: 'A four-stage description of adapter security covering behaviour change, the small size, the trust assumption and the controls.'
- id: lora-implications
  file: assets/lora-implications.svg
  type: diagram
  title: 'Four consequences of cheap fine-tuning'
  alt: 'Diagram: the access, storage, privacy and serving implications of adapter fine-tuning'
  description: 'A four-stage description of adapter implications covering democratised access, storage economics, training data exposure and serving architecture.'
- id: lora-when
  file: assets/lora-when.svg
  type: diagram
  title: 'When to use adapters'
  alt: 'Diagram: when adapter fine-tuning is the right approach'
  description: 'A two-column comparison of situations favouring adapter fine-tuning against alternatives.'
