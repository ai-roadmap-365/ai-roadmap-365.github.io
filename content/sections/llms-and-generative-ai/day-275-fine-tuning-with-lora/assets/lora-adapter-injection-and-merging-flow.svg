<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="LoRA Adapter Injection and Merging Lifecycle">
  <title>LoRA Adapter Injection and Merging Lifecycle</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d275f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d275f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d275f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d275f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d275f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d275f-arrowhead); }
      .d275f-pulse { animation: d275f-glow 2.5s infinite ease-in-out; }
      @keyframes d275f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d275f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d275f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(50, 40)">
    <rect class="d275f-box" x="0" y="0" width="180" height="70" />
    <text class="d275f-header" x="20" y="30">Base Model W0</text>
    <text class="d275f-text" x="20" y="50">Freeze all parameters</text>

    <path class="d275f-arrow" d="M 180 35 L 240 35" />

    <rect class="d275f-box d275f-pulse" x="240" y="0" width="220" height="70" />
    <text class="d275f-header" x="20" y="30">Inject Adapter Pairs</text>
    <text class="d275f-text" x="20" y="50">B (zero) and A (gaussian)</text>

    <path class="d275f-arrow" d="M 460 35 L 520 35" />

    <rect class="d275f-box" x="520" y="0" width="200" height="70" />
    <text class="d275f-header" x="20" y="30">Train Adapters (LoRA)</text>
    <text class="d275f-accent" x="20" y="50">Compute gradients on B, A</text>

    <path class="d275f-arrow" d="M 620 70 L 620 120" />

    <rect class="d275f-box" x="520" y="120" width="200" height="70" />
    <text class="d275f-header" x="20" y="30">Zero-Overhead Merge</text>
    <text class="d275f-text" x="20" y="50">W_merged = W0 + (a/r)*B*A</text>
  </g>

</svg>