<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why one matrix starts at zero</title>
  <style>
    .init-dynamics-bg   { fill: #f8fafc; }
    .init-dynamics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-dynamics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-dynamics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-dynamics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-dynamics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-dynamics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .init-dynamics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .init-dynamics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .init-dynamics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .init-dynamics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .init-dynamics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .init-dynamics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .init-dynamics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .init-dynamics-stage { opacity: 1; }

    .init-dynamics-s0 { animation-delay: 0.00s; }
    .init-dynamics-e0 { animation-delay: 0.00s; }
    .init-dynamics-s1 { animation-delay: 1.28s; }
    .init-dynamics-e1 { animation-delay: 1.28s; }
    .init-dynamics-s2 { animation-delay: 2.56s; }
    .init-dynamics-e2 { animation-delay: 2.56s; }
    .init-dynamics-s3 { animation-delay: 3.84s; }
    .init-dynamics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .init-dynamics-conn  { animation: init-dynamics-trace 6.4s ease-in-out infinite; }
      .init-dynamics-stage { animation: init-dynamics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes init-dynamics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes init-dynamics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .init-dynamics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .init-dynamics-stage { animation: init-dynamics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes init-dynamics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="init-dynamics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="init-dynamics-bg" width="980" height="322"/>
  <text class="init-dynamics-h1"  x="30" y="40">Why one matrix starts at zero</text>
  <text class="init-dynamics-sub" x="30" y="64">Four steps.</text>
  <g class="init-dynamics-stage init-dynamics-s0">
    <rect class="init-dynamics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="init-dynamics-step" x="44" y="142">01</text>
    <text class="init-dynamics-name" x="70" y="142">One matrix is initialised randomly</text>
    <text class="init-dynamics-desc" x="44" y="166">So gradients can flow into it.</text>
  </g>
  <line class="init-dynamics-line init-dynamics-conn init-dynamics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#init-dynamics-tip)"/>
  <g class="init-dynamics-stage init-dynamics-s1">
    <rect class="init-dynamics-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="init-dynamics-step" x="280" y="142">02</text>
    <text class="init-dynamics-name" x="306" y="142">The other is initialised to zero</text>
    <text class="init-dynamics-desc" x="280" y="166">Deliberately.</text>
  </g>
  <line class="init-dynamics-line init-dynamics-conn init-dynamics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#init-dynamics-tip)"/>
  <g class="init-dynamics-stage init-dynamics-s2">
    <rect class="init-dynamics-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="init-dynamics-step" x="516" y="142">03</text>
    <text class="init-dynamics-name" x="542" y="142">So their product is zero at step one</text>
    <text class="init-dynamics-desc" x="516" y="166">And the model behaves exactly as</text>
    <text class="init-dynamics-desc" x="516" y="182">the base model does.</text>
  </g>
  <line class="init-dynamics-line init-dynamics-conn init-dynamics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#init-dynamics-tip)"/>
  <g class="init-dynamics-stage init-dynamics-s3">
    <rect class="init-dynamics-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="init-dynamics-step" x="752" y="142">04</text>
    <text class="init-dynamics-name" x="778" y="142">Then departs smoothly from there</text>
    <text class="init-dynamics-desc" x="752" y="166">Rather than starting from a</text>
    <text class="init-dynamics-desc" x="752" y="182">random perturbation.</text>
  </g>
  <text class="init-dynamics-sub" x="30" y="304">Initialising both randomly would inject noise into a working model before any learning happened, which is the failure this asymmetry is designed to avoid.</text>
</svg>
