<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four choices.">
  <title>Which layers to adapt</title>
  <style>
    .target-modules-bg   { fill: #f8fafc; }
    .target-modules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-modules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-modules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-modules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-modules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-modules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .target-modules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .target-modules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .target-modules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .target-modules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .target-modules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .target-modules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .target-modules-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .target-modules-stage { opacity: 1; }

    .target-modules-s0 { animation-delay: 0.00s; }
    .target-modules-e0 { animation-delay: 0.00s; }
    .target-modules-s1 { animation-delay: 1.28s; }
    .target-modules-e1 { animation-delay: 1.28s; }
    .target-modules-s2 { animation-delay: 2.56s; }
    .target-modules-e2 { animation-delay: 2.56s; }
    .target-modules-s3 { animation-delay: 3.84s; }
    .target-modules-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .target-modules-conn  { animation: target-modules-trace 6.4s ease-in-out infinite; }
      .target-modules-stage { animation: target-modules-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes target-modules-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes target-modules-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .target-modules-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .target-modules-stage { animation: target-modules-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes target-modules-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="target-modules-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="target-modules-bg" width="980" height="322"/>
  <text class="target-modules-h1"  x="30" y="40">Which layers to adapt</text>
  <text class="target-modules-sub" x="30" y="64">Four choices.</text>
  <g class="target-modules-stage target-modules-s0">
    <rect class="target-modules-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="target-modules-step" x="44" y="142">01</text>
    <text class="target-modules-name" x="70" y="142">The attention projections</text>
    <text class="target-modules-desc" x="44" y="166">The original and most common</text>
    <text class="target-modules-desc" x="44" y="182">choice.</text>
  </g>
  <line class="target-modules-line target-modules-conn target-modules-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#target-modules-tip)"/>
  <g class="target-modules-stage target-modules-s1">
    <rect class="target-modules-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="target-modules-step" x="280" y="142">02</text>
    <text class="target-modules-name" x="306" y="142">Plus the feed-forward layers</text>
    <text class="target-modules-desc" x="280" y="166">Which holds most of the</text>
    <text class="target-modules-desc" x="280" y="182">parameters, and helps more.</text>
  </g>
  <line class="target-modules-line target-modules-conn target-modules-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#target-modules-tip)"/>
  <g class="target-modules-stage target-modules-s2">
    <rect class="target-modules-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="target-modules-step" x="516" y="142">03</text>
    <text class="target-modules-name" x="542" y="142">Adapting everything works best</text>
    <text class="target-modules-desc" x="516" y="166">And costs the most memory.</text>
  </g>
  <line class="target-modules-line target-modules-conn target-modules-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#target-modules-tip)"/>
  <g class="target-modules-stage target-modules-s3">
    <rect class="target-modules-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="target-modules-step" x="752" y="142">04</text>
    <text class="target-modules-name" x="778" y="142">So placement is a budget decision</text>
    <text class="target-modules-desc" x="752" y="166">Measured, not assumed.</text>
    <text class="target-modules-edge" x="752" y="242">coverage</text>
  </g>
  <text class="target-modules-sub" x="30" y="304">Broader placement consistently outperforms a higher rank on fewer modules at equal parameter budget, which is a useful default when tuning is limited.</text>
</svg>
