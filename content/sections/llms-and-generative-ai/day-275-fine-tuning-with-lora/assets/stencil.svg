<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is why it is reversible.">
  <title>An overlay, not a repaint</title>
  <style>
    .stencil-bg   { fill: #f8fafc; }
    .stencil-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stencil-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stencil-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stencil-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stencil-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stencil-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stencil-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stencil-row { opacity: 1; }
    .stencil-r0 { animation-delay: 0.00s; }
    .stencil-r1 { animation-delay: 0.45s; }
    .stencil-r2 { animation-delay: 0.90s; }
    .stencil-r3 { animation-delay: 1.35s; }
    .stencil-r4 { animation-delay: 1.80s; }
    .stencil-row { animation: stencil-reveal 7.3s ease-in-out infinite; }
    @keyframes stencil-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stencil-bg" width="980" height="390"/>
  <text class="stencil-h1"  x="30" y="40">An overlay, not a repaint</text>
  <text class="stencil-sub" x="30" y="64">Which is why it is reversible.</text>
  <rect class="stencil-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stencil-name" x="46" y="122">Repainting</text>
  <text class="stencil-desc" x="46" y="142">Permanent.</text>
  <text class="stencil-desc stencil-row stencil-r0" x="46" y="182">The original is gone</text>
  <text class="stencil-desc stencil-row stencil-r1" x="46" y="216">One finish per object</text>
  <text class="stencil-desc stencil-row stencil-r2" x="46" y="250">Changing it means starting again</text>
  <text class="stencil-desc stencil-row stencil-r3" x="46" y="284">Storage is a whole object each time</text>
  <text class="stencil-desc stencil-row stencil-r4" x="46" y="318">This is full fine-tuning</text>
  <rect class="stencil-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stencil-name" x="526" y="122">An overlay</text>
  <text class="stencil-desc" x="526" y="142">Removable.</text>
  <text class="stencil-desc stencil-row stencil-r0" x="526" y="182">The original is untouched underneath</text>
  <text class="stencil-desc stencil-row stencil-r1" x="526" y="216">Many overlays for one object</text>
  <text class="stencil-desc stencil-row stencil-r2" x="526" y="250">Swapped in seconds</text>
  <text class="stencil-desc stencil-row stencil-r3" x="526" y="284">Storage is a thin sheet each time</text>
  <text class="stencil-desc stencil-row stencil-r4" x="526" y="318">This is an adapter</text>
  <text class="stencil-sub" x="30" y="372">Reversibility is the property that matters operationally: a bad adapter is removed rather than retrained around, which makes experimenting far cheaper.</text>
</svg>
