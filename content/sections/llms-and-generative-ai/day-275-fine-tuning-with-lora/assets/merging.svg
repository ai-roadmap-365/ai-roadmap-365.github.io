<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which removes the usual objection.">
  <title>Merging the adapter</title>
  <style>
    .merging-bg   { fill: #f8fafc; }
    .merging-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merging-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merging-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merging-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merging-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merging-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merging-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .merging-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .merging-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .merging-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .merging-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .merging-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .merging-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .merging-stage { opacity: 1; }

    .merging-s0 { animation-delay: 0.00s; }
    .merging-e0 { animation-delay: 0.00s; }
    .merging-s1 { animation-delay: 1.28s; }
    .merging-e1 { animation-delay: 1.28s; }
    .merging-s2 { animation-delay: 2.56s; }
    .merging-e2 { animation-delay: 2.56s; }
    .merging-s3 { animation-delay: 3.84s; }
    .merging-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .merging-conn  { animation: merging-trace 6.4s ease-in-out infinite; }
      .merging-stage { animation: merging-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes merging-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes merging-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .merging-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .merging-stage { animation: merging-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes merging-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="merging-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="merging-bg" width="980" height="322"/>
  <text class="merging-h1"  x="30" y="40">Merging the adapter</text>
  <text class="merging-sub" x="30" y="64">Which removes the usual objection.</text>
  <g class="merging-stage merging-s0">
    <rect class="merging-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="merging-step" x="44" y="142">01</text>
    <text class="merging-name" x="70" y="142">Serving base plus adapter adds a little latency</text>
    <text class="merging-desc" x="44" y="166">An extra small multiplication</text>
    <text class="merging-desc" x="44" y="182">per layer.</text>
  </g>
  <line class="merging-line merging-conn merging-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#merging-tip)"/>
  <g class="merging-stage merging-s1">
    <rect class="merging-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="merging-step" x="280" y="142">02</text>
    <text class="merging-name" x="306" y="142">But the adapter is just an addition to the weight</text>
    <text class="merging-desc" x="280" y="166">Which can be computed once,</text>
    <text class="merging-desc" x="280" y="182">offline.</text>
  </g>
  <line class="merging-line merging-conn merging-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#merging-tip)"/>
  <g class="merging-stage merging-s2">
    <rect class="merging-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="merging-step" x="516" y="142">03</text>
    <text class="merging-name" x="542" y="142">Producing an ordinary model</text>
    <text class="merging-desc" x="516" y="166">Indistinguishable in shape from</text>
    <text class="merging-desc" x="516" y="182">the base.</text>
  </g>
  <line class="merging-line merging-conn merging-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#merging-tip)"/>
  <g class="merging-stage merging-s3">
    <rect class="merging-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="merging-step" x="752" y="142">04</text>
    <text class="merging-name" x="778" y="142">At the cost of swappability</text>
    <text class="merging-desc" x="752" y="166">A merged model serves one task,</text>
    <text class="merging-desc" x="752" y="182">not many.</text>
    <text class="merging-edge" x="752" y="242">the trade</text>
  </g>
  <text class="merging-sub" x="30" y="304">The choice between merged and unmerged is a serving-architecture decision: merge for a single high-volume task, keep separate to serve many from one backbone.</text>
</svg>
