questions:
- question: In the LoRA formulation W = W_0 + (alpha / r) * B * A, how are matrices A and B initialized
    at the start of training, and why?
  options:
  - Both matrices are initialized to random Gaussian values to maximize gradient diversity
  - Matrix A is initialized with random Gaussian values and Matrix B is initialized to zero, ensuring
    Delta W = 0 at step zero
  - Both matrices are initialized to ones so scaling factor alpha has an immediate effect
  - Matrix B is initialized with base weights W_0 and Matrix A is set to an identity matrix
  answer_index: 1
  explanation: Initializing B to zeros and A to Gaussian noise guarantees that Delta W = (alpha/r)*B*A
    equals exactly zero at the beginning of training, preserving the base model's pretrained representations
    at step 0.
- question: What does the parameter 'r' represent in LoRA, and what is its typical empirical value for
    task adaptation?
  options:
  - The learning rate multiplier; typically 0.001
  - The low-rank bottleneck dimension; typically between 4 and 32
  - The number of transformer layers skipped during training; typically 12
  - The quantization bit-width; typically 4-bit NormalFloat
  answer_index: 1
  explanation: The rank 'r' specifies the inner bottleneck dimension of matrices A (r x k) and B (d x
    r). Empirical studies show ranks between 4 and 16 capture most task-specific intrinsic dimensionality.
- question: What is the purpose of the scaling factor (alpha / r) in LoRA?
  options:
  - It normalizes GPU memory allocations to prevent Out-Of-Memory errors
  - It scales the magnitude of the adapter update Delta W relative to base weights, allowing rank r to
    be adjusted without retuning the learning rate
  - It converts 32-bit floating point tensors into 4-bit integers
  - It acts as a dropout mask during forward inference
  answer_index: 1
  explanation: Scaling by alpha/r keeps the magnitude of the adapter gradient updates consistent when
    experimenting with different rank values, avoiding the need to retune hyperparameters.
- question: How does LoRA achieve zero additional inference latency during deployment?
  options:
  - By executing inference on specialized quantum hardware
  - 'By merging the adapter delta matrix (alpha/r)*B*A directly into the base weights W_0 prior to serving:
    W_merged = W_0 + Delta W'
  - By skipping attention heads that have low activation values
  - By compiling prompts into C++ binaries
  answer_index: 1
  explanation: Because matrix multiplication is associative, the trained adapter delta (alpha/r)*B*A can
    be added directly to the base weights W_0 offline, yielding a single standard weight matrix W_merged
    with zero inference latency overhead.
- question: Which set of transformer projection weights yields the most parameter-efficient adaptation
    when targeted with LoRA?
  options:
  - Embedding layer and final LayerNorm only
  - Self-attention Query (W_q) and Value (W_v) projections, optionally expanded to Key (W_k), Output (W_o),
    and MLP gate/up/down projections
  - Positional encodings only
  - The softmax classification head only
  answer_index: 1
  explanation: Hu et al. demonstrated that targeting Query and Value projections yields the highest task
    adaptation efficiency, while targeting all linear projections (Q, K, V, O, MLP) maximizes performance
    on complex multi-task benchmarks.
