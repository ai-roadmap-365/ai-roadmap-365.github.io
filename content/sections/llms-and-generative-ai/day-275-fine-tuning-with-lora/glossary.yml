terms:
- term: LoRA (Low-Rank Adaptation)
  definition: PEFT technique that freezes base weights and injects trainable rank-decomposition matrices
    into linear layers.
- term: Intrinsic Dimensionality
  definition: The minimum number of independent coordinates required to approximate a model's task-specific
    parameter manifold.
- term: Rank (r)
  definition: The inner bottleneck dimension of the low-rank adapter matrices B (d x r) and A (r x k).
- term: Alpha (alpha)
  definition: A constant scaling factor in LoRA that balances the magnitude of adapter updates against
    base weights.
- term: Weight Merging
  definition: The offline addition of adapter delta weights into base model weights (W_merged = W0 + Delta
    W) to eliminate inference latency.
- term: QLoRA
  definition: Quantized LoRA that freezes base weights in 4-bit NormalFloat (NF4) while computing gradients
    in higher-precision 16-bit adapters.
- term: Target Modules
  definition: The specific linear projection matrices in a transformer (e.g. q_proj, v_proj, mlp) where
    LoRA adapters are injected.
- term: PEFT
  definition: Parameter-Efficient Fine-Tuning; an umbrella term for methods that train a tiny fraction
    (<1%) of model parameters.
