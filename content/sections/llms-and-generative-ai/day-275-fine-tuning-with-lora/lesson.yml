learning_promise: 'Master the mathematics and systems engineering of Low-Rank Adaptation (LoRA) and QLoRA:
  implement low-rank matrix decomposition, understand intrinsic rank dimensionality, configure rank and
  alpha scaling factors, target transformer attention projection modules, and execute zero-latency adapter
  merging.'
objectives:
- 'Derive the mathematical formulation of LoRA low-rank decomposition: W = W0 + (alpha/r) * B * A.'
- Analyze intrinsic rank dimensionality and evaluate rank selection tradeoffs (r=4 to r=64).
- Target transformer attention (Wq, Wk, Wv, Wo) and MLP (Wgate, Wup, Wdown) projection modules.
- Implement a fully functional LoRA linear layer and adapter injection pipeline from scratch in Python.
- Execute adapter weight merging to eliminate inference latency overhead.
