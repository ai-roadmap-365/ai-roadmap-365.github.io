      - 'As the first dictionary inside the messages array with role="system"'
      - 'Appended as a header in the HTTP request URL query string'
      - 'Inside a cookie payload'
    answer_index: 0
    explanation: 'Anthropic Messages API strictly separates the top-level system parameter from the user/assistant messages array.'
  - question: 'What is the recommended retry strategy for HTTP 429 (RateLimitError) and HTTP 529 (OverloadedError) in production API clients?'
    options:
      - 'Exponential backoff with full jitter: calculate t = min(t_max, t_0 * 2^attempt) and multiply by a random uniform factor between 0.5 and 1.5 to prevent thundering herd collisions'
      - 'Immediately looping without waiting'
      - 'Crashing the backend process'
      - 'Switching to HTTP 1.0'
    answer_index: 0
    explanation: 'Exponential backoff with jitter spreads retry spikes across time, preventing cascading server overloads.'
  - question: 'Why is max_tokens a mandatory required parameter in every Anthropic Messages API call?'
    options:
      - 'To prevent unbounded autoregressive token generation loops from consuming infinite credits or causing latency timeouts, forcing explicit operational boundaries on every response'
      - 'Because Claude models cannot count without it'
      - 'To compress the network packet'
      - 'Because of Python memory limits'
    answer_index: 0
    explanation: 'max_tokens enforces strict deterministic limits on response generation length.'
  - question: 'What does a stop_reason of "max_tokens" indicate in an Anthropic API response?'
    options:
      - 'The generation was forcibly truncated because the model hit the max_tokens limit before producing an natural end_turn token'
      - 'The model finished answering completely'
      - 'The API key expired'
      - 'The user sent an invalid message'
    answer_index: 0
    explanation: 'A stop_reason of max_tokens alerts the caller that the output was truncated prematurely.'
  - question: 'Where should API keys (like ANTHROPIC_API_KEY) be loaded from in production applications?'
    options:
      - 'From operating system environment variables or secure secret managers (e.g. AWS Secrets Manager, HashiCorp Vault), never hardcoded in source code or Git repositories'
      - 'Hardcoded in python comments'
      - 'Stored in public GitHub README files'
      - 'Printed to standard console logs'
    answer_index: 0
    explanation: 'Environment variables and secret vaults keep sensitive API credentials secure and out of version control.'
