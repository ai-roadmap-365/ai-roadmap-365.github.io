visuals:
  - id: anthropic-messages-api-request-response-lifecycle
    file: assets/anthropic-messages-api-request-response-lifecycle.svg
    type: diagram
    title: 'Anthropic Messages API Request-Response Lifecycle'
    alt: Anthropic Messages API request and response architecture diagram
    description: 'Overview of Anthropic Messages API client construction, request parameter schemas, and typed content block parsing.'
  - id: anthropic-error-handling-exponential-backoff-state-machine
    file: assets/anthropic-error-handling-exponential-backoff-state-machine.svg
    type: diagram
    title: 'API Error Taxonomy & Exponential Retries'
    alt: Anthropic API exponential backoff error handling state machine diagram
    description: 'State machine distinguishing transient retryable errors (429, 529) from fatal non-retryable errors (401, 400).'
  - id: request-anatomy
    file: assets/request-anatomy.svg
    type: diagram
    title: 'What a request contains'
    alt: 'Diagram: the five components of a language model API request'
    description: 'A five-stage description of an API request covering the model, system instructions, messages, generation parameters and the token limit.'
  - id: stop-reasons
    file: assets/stop-reasons.svg
    type: diagram
    title: 'Why generation stopped'
    alt: 'Diagram: the four reasons a model response terminates'
    description: 'A four-stage description of stop reasons covering natural completion, the length limit, a stop sequence and a tool call.'
  - id: backoff
    file: assets/backoff.svg
    type: diagram
    title: 'Retrying properly'
    alt: 'Diagram: the four properties of a correct retry strategy'
    description: 'A four-stage description of retry strategy covering error classification, exponential delay, jitter and a bounded attempt count.'
  - id: rate-limits
    file: assets/rate-limits.svg
    type: diagram
    title: 'Living within rate limits'
    alt: 'Diagram: the four ways an application stays within provider rate limits'
    description: 'A four-stage description of rate limit handling covering the separate limits, client-side throttling, queueing and batch offloading.'
  - id: phone-call
    file: assets/phone-call.svg
    type: diagram
    title: 'A letter, not a phone call'
    alt: 'Diagram: a stateful conversation compared with independent stateless requests'
    description: 'A two-column comparison of a continuous conversation against independent requests.'
  - id: api-implications
    file: assets/api-implications.svg
    type: diagram
    title: 'Four consequences of calling a hosted model'
    alt: 'Diagram: the cost, dependency, privacy and latency implications of a hosted model API'
    description: 'A four-stage description of API implications covering per-token cost, external dependency, data handling and variable latency.'
  - id: api-when
    file: assets/api-when.svg
    type: diagram
    title: 'When to call the provider directly'
    alt: 'Diagram: when to call a provider API directly and when to use an abstraction layer'
    description: 'A two-column comparison of direct provider calls against an abstraction layer.'
  - id: error-taxonomy
    file: assets/error-taxonomy.svg
    type: diagram
    title: 'Two kinds of failure'
    alt: 'Diagram: transient API failures compared with fatal ones'
    description: 'A four-stage description of API error handling covering transient errors, fatal errors, the classification and the response.'
  - id: caching-api
    file: assets/caching-api.svg
    type: diagram
    title: 'With and without prompt caching'
    alt: 'Diagram: an uncached request compared with one that reuses a cached prefix'
    description: 'A two-column comparison of uncached and cached prompt processing.'
  - id: api-history
    file: assets/api-history.svg
    type: diagram
    title: 'Four steps in model APIs'
    alt: 'Diagram: the historical progression of language model API design'
    description: 'A four-stage description of API history covering raw completion endpoints, chat message formats, tool calling and caching and batch endpoints.'
