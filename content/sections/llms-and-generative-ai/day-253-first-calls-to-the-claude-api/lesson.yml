learning_promise: 'Master the Anthropic Python SDK and Messages API architecture: understand request schemas (role separation, system message placement, temperature, max_tokens), handle client authentication and environment variables safely without hardcoded keys, implement robust exponential backoff retries for rate limits (429/529), parse structured response blocks (text, tool_use, stop_reasons), and build a resilient Anthropic API client wrapper in Python.'
objectives:
  - 'Initialize the Anthropic client using ANTHROPIC_API_KEY environment variables.'
  - 'Structure Messages API requests with separate system parameter and conversation turns.'
  - 'Handle transient HTTP status codes (429, 529, 500) using exponential backoff with full jitter.'
  - 'Extract text content blocks, stop reasons, and usage token counts from API response objects.'
  - 'Build a production-grade Anthropic API wrapper and retry pipeline in Python.'
