terms:
  - term: 'Anthropic Messages API'
    definition: 'The primary REST and SDK interface for generating completions with Claude models using structured conversation turns.'
  - term: 'System Parameter'
    definition: 'A top-level API argument defining the foundational persona, behavioral guardrails, and role instructions for Claude.'
  - term: 'Content Block'
    definition: 'A structured element within a message payload (such as TextBlock or ToolUseBlock).'
  - term: 'Stop Reason'
    definition: 'The termination signal returned by the model indicating why generation ceased (e.g. end_turn, max_tokens, stop_sequence).'
  - term: 'Exponential Backoff'
    definition: 'An algorithmic retry strategy where delay durations double exponentially after each successive failure.'
  - term: 'Full Jitter'
    definition: 'Randomizing retry delay intervals between zero and the computed exponential backoff bound to prevent synchronized retries.'
  - term: 'RateLimitError (429)'
    definition: 'An HTTP status code indicating that requests or token usage have exceeded provisioned tier limits.'
  - term: 'OverloadedError (529)'
    definition: 'An HTTP status code returned when Anthropic GPU inference clusters are experiencing transient peak load.'
