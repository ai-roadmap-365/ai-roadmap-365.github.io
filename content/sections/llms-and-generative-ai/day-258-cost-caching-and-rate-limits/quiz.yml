questions:
  - question: 'What is the primary financial benefit of Prompt Caching (KV Caching) in modern LLM APIs?'
    options:
      - 'Free unlimited output generation, forever and always'
      - 'Up to 90% off cached prefix tokens, and faster TTFT'
      - 'Free GPU hardware upgrades'
      - 'Zero network bandwidth usage'
    answer_index: 1
    explanation: 'Cached prompt tokens bypass recomputation, resulting in a 90% price discount and drastic latency improvements.'
  - question: 'How does the Token Bucket algorithm control API request volume?'
    options:
      - 'It resets user passwords when limit is exceeded'
      - 'It randomly deletes 50% of user requests'
      - 'Tokens refill at a fixed rate and each request spends some'
      - 'It increases prompt costs dynamically'
    answer_index: 2
    explanation: 'Token bucket smoothly shapes traffic bursts while enforcing strict average rate constraints.'
  - question: 'What is Full Jitter in exponential backoff retry algorithms?'
    options:
      - 'Disabling SSL certificates'
      - 'Shaking the computer monitor'
      - 'Retrying 100 times per second'
      - 'A random sleep added to each backoff interval'
    answer_index: 3
    explanation: 'Full jitter decorrelates retry intervals across distributed workers, eliminating thundering herd collision waves.'
  - question: 'In Anthropic Claude Messages API, how do you explicitly declare a prompt cache breakpoint?'
    options:
      - 'Add cache_control ephemeral to the content block'
      - 'Passing ?cache=true in the URL'
      - 'Setting temperature=0.0'
      - 'Anthropic does not support prompt caching at all'
    answer_index: 0
    explanation: 'Setting cache_control: {"type": "ephemeral"} explicitly marks a prompt caching breakpoint in Anthropic.'
  - question: 'What HTTP status code is returned when an API client exceeds request-per-minute (RPM) or token-per-minute (TPM) quotas?'
    options:
      - 'HTTP 200 OK'
      - 'HTTP 429 Too Many Requests'
      - 'HTTP 404 Not Found'
      - 'HTTP 500 Internal Server Error'
    answer_index: 1
    explanation: 'HTTP 429 indicates rate limiting, often accompanied by a Retry-After response header.'
