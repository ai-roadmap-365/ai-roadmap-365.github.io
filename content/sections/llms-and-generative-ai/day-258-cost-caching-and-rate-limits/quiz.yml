  - question: 'What is Full Jitter in exponential backoff retry algorithms?'
    options:
      - 'Adding a uniform random sleep interval between 0 and 2^attempt * base_delay to prevent synchronized "thundering herd" retry waves'
      - 'Shaking the computer monitor'
      - 'Retrying 100 times per second'
      - 'Disabling SSL certificates'
