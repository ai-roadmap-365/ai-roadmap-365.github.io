<svg role="img" aria-label="Prompt caching and KV cache breakpoint architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Prompt Caching &amp; KV Cache Breakpoint Architecture</title>
  <defs>
    <linearGradient id="bg258a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card258" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg258a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PROMPT CACHING &amp; KV CACHE BREAKPOINTS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">90% Cost Reduction and 80% TTFT Acceleration on Reusable Context Blocks</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card258)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Turn 1: Cold Cache Write -->
    <rect x="25" y="25" width="340" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="195" y="50" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Turn 1: Cache Write (Cold Ingress)</text>
    
    <rect x="35" y="70" width="320" height="70" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="45" y="90" fill="#38bdf8" font-size="8" font-weight="700">Static System &amp; Document Prefix (10,000 Tokens)</text>
    <text x="45" y="105" fill="#cbd5e1" font-size="7">• Large Codebase Context / Legal Contract / Books</text>
    <text x="45" y="120" fill="#fbbf24" font-size="8" font-weight="700">cache_control: &#123;"type": "ephemeral"&#125; (Breakpoint)</text>

    <rect x="35" y="150" width="320" height="40" fill="#1e293b" rx="4"/>
    <text x="45" y="168" fill="#cbd5e1" font-size="7">User Turn: "Summarize section 3"</text>

    <rect x="35" y="200" width="320" height="65" fill="#0f172a" stroke="#475569" rx="4"/>
    <text x="45" y="218" fill="#fbbf24" font-size="8" font-weight="700">Billing &amp; Latency:</text>
    <text x="45" y="233" fill="#cbd5e1" font-size="7">• Cache Creation Cost: $3.75 / Mtok (+25% write premium)</text>
    <text x="45" y="248" fill="#cbd5e1" font-size="7">• Prefill TTFT: 1,850ms (Full computation)</text>

    <!-- Turn 2: Warm Cache Read -->
    <rect x="395" y="25" width="340" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="565" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Turn 2: Cache Hit (Warm Re-use)</text>
    
    <rect x="405" y="70" width="320" height="70" fill="#1e293b" stroke="#34d399" rx="4"/>
    <text x="415" y="90" fill="#34d399" font-size="8" font-weight="700">KV Cache Instant Lookup (10,000 Tokens)</text>
    <text x="415" y="105" fill="#cbd5e1" font-size="7">• Zero GPU Attention Recomputation</text>
    <text x="415" y="120" fill="#34d399" font-size="8" font-weight="700">status: cache_read_input_tokens: 10,000</text>

    <rect x="405" y="150" width="320" height="40" fill="#1e293b" rx="4"/>
    <text x="415" y="168" fill="#cbd5e1" font-size="7">User Turn 2: "Now check section 8"</text>

    <rect x="405" y="200" width="320" height="65" fill="#0f172a" stroke="#34d399" rx="4"/>
    <text x="415" y="218" fill="#34d399" font-size="8" font-weight="700">Billing &amp; Latency:</text>
    <text x="415" y="233" fill="#34d399" font-size="8" font-weight="700">• Cache Read Cost: $0.30 / Mtok (90% DISCOUNT)</text>
    <text x="415" y="248" fill="#34d399" font-size="8" font-weight="700">• Prefill TTFT: 240ms (87% Latency Drop!)</text>
  </g>
</svg>
