<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four dimensions.">
  <title>Tracking what it costs</title>
  <style>
    .cost-ledger-bg   { fill: #f8fafc; }
    .cost-ledger-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-ledger-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-ledger-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-ledger-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-ledger-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-ledger-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-ledger-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-ledger-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-ledger-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-ledger-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-ledger-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-ledger-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-ledger-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-ledger-stage { opacity: 1; }

    .cost-ledger-s0 { animation-delay: 0.00s; }
    .cost-ledger-e0 { animation-delay: 0.00s; }
    .cost-ledger-s1 { animation-delay: 1.28s; }
    .cost-ledger-e1 { animation-delay: 1.28s; }
    .cost-ledger-s2 { animation-delay: 2.56s; }
    .cost-ledger-e2 { animation-delay: 2.56s; }
    .cost-ledger-s3 { animation-delay: 3.84s; }
    .cost-ledger-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-ledger-conn  { animation: cost-ledger-trace 6.4s ease-in-out infinite; }
      .cost-ledger-stage { animation: cost-ledger-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cost-ledger-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-ledger-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-ledger-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-ledger-stage { animation: cost-ledger-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-ledger-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-ledger-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-ledger-bg" width="980" height="322"/>
  <text class="cost-ledger-h1"  x="30" y="40">Tracking what it costs</text>
  <text class="cost-ledger-sub" x="30" y="64">Four dimensions.</text>
  <g class="cost-ledger-stage cost-ledger-s0">
    <rect class="cost-ledger-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cost-ledger-step" x="44" y="142">01</text>
    <text class="cost-ledger-name" x="70" y="142">Record tokens and model on every call</text>
    <text class="cost-ledger-desc" x="44" y="166">Input, output and cached,</text>
    <text class="cost-ledger-desc" x="44" y="182">separately.</text>
  </g>
  <line class="cost-ledger-line cost-ledger-conn cost-ledger-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cost-ledger-tip)"/>
  <g class="cost-ledger-stage cost-ledger-s1">
    <rect class="cost-ledger-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cost-ledger-step" x="280" y="142">02</text>
    <text class="cost-ledger-name" x="306" y="142">Attribute each call to a feature and a user</text>
    <text class="cost-ledger-desc" x="280" y="166">Or the total tells you nothing</text>
    <text class="cost-ledger-desc" x="280" y="182">actionable.</text>
  </g>
  <line class="cost-ledger-line cost-ledger-conn cost-ledger-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cost-ledger-tip)"/>
  <g class="cost-ledger-stage cost-ledger-s2">
    <rect class="cost-ledger-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cost-ledger-step" x="516" y="142">03</text>
    <text class="cost-ledger-name" x="542" y="142">Aggregate by both</text>
    <text class="cost-ledger-desc" x="516" y="166">Which reveals the feature that</text>
    <text class="cost-ledger-desc" x="516" y="182">costs ten times what it should.</text>
  </g>
  <line class="cost-ledger-line cost-ledger-conn cost-ledger-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cost-ledger-tip)"/>
  <g class="cost-ledger-stage cost-ledger-s3">
    <rect class="cost-ledger-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cost-ledger-step" x="752" y="142">04</text>
    <text class="cost-ledger-name" x="778" y="142">And divide by value delivered</text>
    <text class="cost-ledger-desc" x="752" y="166">Cost per resolved ticket, not</text>
    <text class="cost-ledger-desc" x="752" y="182">cost per token.</text>
    <text class="cost-ledger-edge" x="752" y="242">unit economics</text>
  </g>
  <text class="cost-ledger-sub" x="30" y="304">Attribution is the step that makes the rest useful: an unattributed monthly total tells you that spending rose and nothing about which change caused it.</text>
</svg>
