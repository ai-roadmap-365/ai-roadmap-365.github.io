<svg role="img" aria-label="Token bucket rate limiting and exponential backoff retry diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Token Bucket Rate Limiting &amp; Jittered Backoff</title>
  <defs>
    <linearGradient id="bg258b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card258b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg258b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TOKEN BUCKET RATE LIMITING &amp; EXPONENTIAL BACKOFF</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mitigating HTTP 429 Errors with Client-Side Token Buckets and Full Jitter</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card258b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Token Bucket Algorithm -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="195" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Token Bucket Rate Limiter</text>
    
    <rect x="45" y="70" width="300" height="75" fill="#1e293b" rx="4"/>
    <text x="55" y="90" fill="#cbd5e1" font-size="8">Capacity: 100 Tokens</text>
    <text x="55" y="105" fill="#38bdf8" font-size="8">Refill Rate: 10 tokens / second</text>
    <text x="55" y="120" fill="#cbd5e1" font-size="7">Current Tokens: 45 Available</text>
    <text x="55" y="133" fill="#34d399" font-size="7">Incoming Request (cost: 20) -&gt; ALLOWED</text>

    <rect x="45" y="155" width="300" height="60" fill="#1e293b" rx="4"/>
    <text x="55" y="175" fill="#fb7185" font-size="8">Bucket Depleted (Tokens: 0):</text>
    <text x="55" y="190" fill="#cbd5e1" font-size="7">Incoming Request -&gt; QUEUED / SLEEP</text>
    <text x="55" y="203" fill="#38bdf8" font-size="7">Sleep time = (required - current) / refill_rate</text>

    <text x="195" y="245" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Smooth Traffic Shaping</text>

    <!-- Exponential Backoff with Jitter -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#fb7185" rx="6"/>
    <text x="565" y="50" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">2. Full Jitter Retry Strategy</text>
    
    <rect x="415" y="70" width="300" height="145" fill="#1e293b" rx="4"/>
    <text x="425" y="90" fill="#fb7185" font-size="8" font-weight="700">HTTP 429 Too Many Requests Caught:</text>
    <text x="425" y="108" fill="#cbd5e1" font-size="7">Retry 1: sleep = random(0, 1.0 * 2^1) -&gt; 1.42s</text>
    <text x="425" y="123" fill="#cbd5e1" font-size="7">Retry 2: sleep = random(0, 1.0 * 2^2) -&gt; 3.11s</text>
    <text x="425" y="138" fill="#cbd5e1" font-size="7">Retry 3: sleep = random(0, 1.0 * 2^3) -&gt; 6.78s</text>
    <text x="425" y="158" fill="#34d399" font-size="8" font-weight="700">Why Full Jitter?</text>
    <text x="425" y="173" fill="#cbd5e1" font-size="7">Prevents "Thundering Herd" collision spikes</text>
    <text x="425" y="188" fill="#cbd5e1" font-size="7">where 1,000 workers retry at exact same millisecond.</text>

    <text x="565" y="245" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">High Resilience &amp; Zero Dropped Calls</text>
  </g>
</svg>
