<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How prompt caching works</title>
  <style>
    .cache-idea-bg   { fill: #f8fafc; }
    .cache-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cache-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cache-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cache-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cache-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cache-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cache-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cache-idea-stage { opacity: 1; }

    .cache-idea-s0 { animation-delay: 0.00s; }
    .cache-idea-e0 { animation-delay: 0.00s; }
    .cache-idea-s1 { animation-delay: 1.28s; }
    .cache-idea-e1 { animation-delay: 1.28s; }
    .cache-idea-s2 { animation-delay: 2.56s; }
    .cache-idea-e2 { animation-delay: 2.56s; }
    .cache-idea-s3 { animation-delay: 3.84s; }
    .cache-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cache-idea-conn  { animation: cache-idea-trace 6.4s ease-in-out infinite; }
      .cache-idea-stage { animation: cache-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cache-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cache-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cache-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cache-idea-stage { animation: cache-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cache-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cache-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cache-idea-bg" width="980" height="322"/>
  <text class="cache-idea-h1"  x="30" y="40">How prompt caching works</text>
  <text class="cache-idea-sub" x="30" y="64">Four steps.</text>
  <g class="cache-idea-stage cache-idea-s0">
    <rect class="cache-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cache-idea-step" x="44" y="142">01</text>
    <text class="cache-idea-name" x="70" y="142">The stable part of the prompt is marked</text>
    <text class="cache-idea-desc" x="44" y="166">Instructions, examples,</text>
    <text class="cache-idea-desc" x="44" y="182">documents.</text>
  </g>
  <line class="cache-idea-line cache-idea-conn cache-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cache-idea-tip)"/>
  <g class="cache-idea-stage cache-idea-s1">
    <rect class="cache-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cache-idea-step" x="280" y="142">02</text>
    <text class="cache-idea-name" x="306" y="142">The first request computes and stores its state</text>
    <text class="cache-idea-desc" x="280" y="166">At a small premium over the</text>
    <text class="cache-idea-desc" x="280" y="182">normal price.</text>
  </g>
  <line class="cache-idea-line cache-idea-conn cache-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cache-idea-tip)"/>
  <g class="cache-idea-stage cache-idea-s2">
    <rect class="cache-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cache-idea-step" x="516" y="142">03</text>
    <text class="cache-idea-name" x="542" y="142">Subsequent requests reuse it</text>
    <text class="cache-idea-desc" x="516" y="166">Billed at a fraction, and faster</text>
    <text class="cache-idea-desc" x="516" y="182">to first token.</text>
  </g>
  <line class="cache-idea-line cache-idea-conn cache-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cache-idea-tip)"/>
  <g class="cache-idea-stage cache-idea-s3">
    <rect class="cache-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cache-idea-step" x="752" y="142">04</text>
    <text class="cache-idea-name" x="778" y="142">Until it expires</text>
    <text class="cache-idea-desc" x="752" y="166">Minutes, typically. Sustained</text>
    <text class="cache-idea-desc" x="752" y="182">traffic keeps it warm.</text>
    <text class="cache-idea-edge" x="752" y="242">short-lived</text>
  </g>
  <text class="cache-idea-sub" x="30" y="304">The write premium means caching loses money on an occasional call and saves a great deal on sustained traffic, which is why the traffic pattern decides whether to use it.</text>
</svg>
