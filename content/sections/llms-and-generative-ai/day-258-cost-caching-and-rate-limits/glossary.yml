terms:
  - term: 'Prompt Caching'
    definition: 'An optimization technique storing computed Key-Value (KV) attention states for static prompt prefixes across API calls.'
  - term: 'Cache Breakpoint'
    definition: 'An explicit metadata marker placed on a message block instructing the server to freeze and persist the preceding KV cache state.'
  - term: 'Token Bucket Algorithm'
    definition: 'A rate-limiting algorithm that maintains a bucket of tokens refilled at a constant rate, consuming tokens per request or byte.'
  - term: 'Requests Per Minute (RPM)'
    definition: 'An API rate-limit quota constraining the total number of discrete HTTP requests permitted within a 60-second window.'
  - term: 'Tokens Per Minute (TPM)'
    definition: 'An API rate-limit quota constraining the aggregate number of input plus output tokens processed within a 60-second window.'
  - term: 'Exponential Backoff'
    definition: 'An error retry strategy that doubles the waiting duration after each consecutive failure to reduce load on the failing server.'
  - term: 'Full Jitter'
    definition: 'Introducing uniform random variation to retry backoff intervals to prevent synchronized collision waves across worker pools.'
  - term: 'HTTP 429 Too Many Requests'
    definition: 'The standard HTTP status code signaling that the client has exceeded its allotted rate or concurrency limits.'
