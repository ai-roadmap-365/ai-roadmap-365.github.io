terms:
- term: Parametric Memory
  definition: Knowledge encoded directly into the neural network weights during pretraining or fine-tuning.
- term: Non-Parametric Memory
  definition: External knowledge stored in databases, vector indexes, or documents retrieved at runtime.
- term: In-Context Learning (ICL)
  definition: Conditioning LLM generation using prompt instructions and few-shot examples without updating
    weights.
- term: Retrieval-Augmented Generation (RAG)
  definition: Architecture combining external retrieval with generative models to ground responses in
    dynamic context.
- term: Parameter-Efficient Fine-Tuning (PEFT)
  definition: Techniques such as LoRA and QLoRA that adapt models by training only a small subset of additional
    parameters.
- term: Catastrophic Forgetting
  definition: The degradation of previously acquired general knowledge when a model is trained on a narrow
    task distribution.
- term: Knowledge Staleness
  definition: The temporal lag between real-world information changes and the static weights of a parametric
    model.
- term: Time-To-First-Token (TTFT)
  definition: Latency duration from submitting a request until the first token is emitted by the inference
    engine.
