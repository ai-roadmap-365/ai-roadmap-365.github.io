<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, no training.">
  <title>How prompting adapts a model</title>
  <style>
    .icl-mechanics-bg   { fill: #f8fafc; }
    .icl-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .icl-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .icl-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .icl-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .icl-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .icl-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .icl-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .icl-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .icl-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .icl-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .icl-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .icl-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .icl-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .icl-mechanics-stage { opacity: 1; }

    .icl-mechanics-s0 { animation-delay: 0.00s; }
    .icl-mechanics-e0 { animation-delay: 0.00s; }
    .icl-mechanics-s1 { animation-delay: 1.28s; }
    .icl-mechanics-e1 { animation-delay: 1.28s; }
    .icl-mechanics-s2 { animation-delay: 2.56s; }
    .icl-mechanics-e2 { animation-delay: 2.56s; }
    .icl-mechanics-s3 { animation-delay: 3.84s; }
    .icl-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .icl-mechanics-conn  { animation: icl-mechanics-trace 6.4s ease-in-out infinite; }
      .icl-mechanics-stage { animation: icl-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes icl-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes icl-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .icl-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .icl-mechanics-stage { animation: icl-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes icl-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="icl-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="icl-mechanics-bg" width="980" height="322"/>
  <text class="icl-mechanics-h1"  x="30" y="40">How prompting adapts a model</text>
  <text class="icl-mechanics-sub" x="30" y="64">Four steps, no training.</text>
  <g class="icl-mechanics-stage icl-mechanics-s0">
    <rect class="icl-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="icl-mechanics-step" x="44" y="142">01</text>
    <text class="icl-mechanics-name" x="70" y="142">Examples are placed in the prompt</text>
    <text class="icl-mechanics-desc" x="44" y="166">Input and output pairs, in the</text>
    <text class="icl-mechanics-desc" x="44" y="182">wanted format.</text>
  </g>
  <line class="icl-mechanics-line icl-mechanics-conn icl-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#icl-mechanics-tip)"/>
  <g class="icl-mechanics-stage icl-mechanics-s1">
    <rect class="icl-mechanics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="icl-mechanics-step" x="280" y="142">02</text>
    <text class="icl-mechanics-name" x="306" y="142">The model infers the pattern within one pass</text>
    <text class="icl-mechanics-desc" x="280" y="166">No weights change at all.</text>
  </g>
  <line class="icl-mechanics-line icl-mechanics-conn icl-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#icl-mechanics-tip)"/>
  <g class="icl-mechanics-stage icl-mechanics-s2">
    <rect class="icl-mechanics-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="icl-mechanics-step" x="516" y="142">03</text>
    <text class="icl-mechanics-name" x="542" y="142">And applies it to the new input</text>
    <text class="icl-mechanics-desc" x="516" y="166">Often matching a fine-tune on</text>
    <text class="icl-mechanics-desc" x="516" y="182">simple tasks.</text>
  </g>
  <line class="icl-mechanics-line icl-mechanics-conn icl-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#icl-mechanics-tip)"/>
  <g class="icl-mechanics-stage icl-mechanics-s3">
    <rect class="icl-mechanics-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="icl-mechanics-step" x="752" y="142">04</text>
    <text class="icl-mechanics-name" x="778" y="142">But the examples are re-sent every request</text>
    <text class="icl-mechanics-desc" x="752" y="166">And re-billed, forever.</text>
  </g>
  <text class="icl-mechanics-sub" x="30" y="304">Re-sending the examples on every request is what eventually makes fine-tuning cheaper: the same demonstrations paid for once instead of a million times.</text>
</svg>
