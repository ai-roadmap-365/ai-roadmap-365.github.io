<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The question that decides.">
  <title>Knowledge against behaviour</title>
  <style>
    .knowledge-behaviour-bg   { fill: #f8fafc; }
    .knowledge-behaviour-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knowledge-behaviour-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knowledge-behaviour-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knowledge-behaviour-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knowledge-behaviour-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knowledge-behaviour-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knowledge-behaviour-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .knowledge-behaviour-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .knowledge-behaviour-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .knowledge-behaviour-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .knowledge-behaviour-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .knowledge-behaviour-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knowledge-behaviour-row { opacity: 1; }
    .knowledge-behaviour-r0 { animation-delay: 0.00s; }
    .knowledge-behaviour-r1 { animation-delay: 0.45s; }
    .knowledge-behaviour-r2 { animation-delay: 0.90s; }
    .knowledge-behaviour-r3 { animation-delay: 1.35s; }
    .knowledge-behaviour-r4 { animation-delay: 1.80s; }
    .knowledge-behaviour-row { animation: knowledge-behaviour-reveal 7.3s ease-in-out infinite; }
    @keyframes knowledge-behaviour-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="knowledge-behaviour-bg" width="980" height="390"/>
  <text class="knowledge-behaviour-h1"  x="30" y="40">Knowledge against behaviour</text>
  <text class="knowledge-behaviour-sub" x="30" y="64">The question that decides.</text>
  <rect class="knowledge-behaviour-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="knowledge-behaviour-name" x="46" y="122">A knowledge problem</text>
  <text class="knowledge-behaviour-desc" x="46" y="142">It does not know.</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r0" x="46" y="182">Facts about your organisation</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r1" x="46" y="216">Anything after the training cutoff</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r2" x="46" y="250">Private or proprietary content</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r3" x="46" y="284">Answer: retrieval</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r4" x="46" y="318">Fine-tuning does this badly</text>
  <rect class="knowledge-behaviour-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="knowledge-behaviour-name" x="526" y="122">A behaviour problem</text>
  <text class="knowledge-behaviour-desc" x="526" y="142">It does not do.</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r0" x="526" y="182">Wrong tone or format</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r1" x="526" y="216">A domain convention it misses</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r2" x="526" y="250">A task structure it fumbles</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r3" x="526" y="284">Answer: prompting, then fine-tuning</text>
  <text class="knowledge-behaviour-desc knowledge-behaviour-row knowledge-behaviour-r4" x="526" y="318">Retrieval does this badly</text>
  <text class="knowledge-behaviour-sub" x="30" y="372">Asking which of these two you have is the fastest way to the right architecture, and getting it wrong produces the expensive failure of fine-tuning to teach facts.</text>
</svg>
