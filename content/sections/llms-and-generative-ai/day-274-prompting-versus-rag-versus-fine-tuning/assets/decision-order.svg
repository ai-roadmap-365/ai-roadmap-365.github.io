<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cheapest first.">
  <title>The order to try them in</title>
  <style>
    .decision-order-bg   { fill: #f8fafc; }
    .decision-order-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decision-order-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decision-order-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decision-order-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decision-order-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decision-order-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decision-order-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .decision-order-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .decision-order-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .decision-order-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .decision-order-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .decision-order-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .decision-order-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .decision-order-stage { opacity: 1; }

    .decision-order-s0 { animation-delay: 0.00s; }
    .decision-order-e0 { animation-delay: 0.00s; }
    .decision-order-s1 { animation-delay: 1.28s; }
    .decision-order-e1 { animation-delay: 1.28s; }
    .decision-order-s2 { animation-delay: 2.56s; }
    .decision-order-e2 { animation-delay: 2.56s; }
    .decision-order-s3 { animation-delay: 3.84s; }
    .decision-order-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .decision-order-conn  { animation: decision-order-trace 6.4s ease-in-out infinite; }
      .decision-order-stage { animation: decision-order-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes decision-order-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes decision-order-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .decision-order-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .decision-order-stage { animation: decision-order-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes decision-order-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="decision-order-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="decision-order-bg" width="980" height="322"/>
  <text class="decision-order-h1"  x="30" y="40">The order to try them in</text>
  <text class="decision-order-sub" x="30" y="64">Cheapest first.</text>
  <g class="decision-order-stage decision-order-s0">
    <rect class="decision-order-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="decision-order-step" x="44" y="142">01</text>
    <text class="decision-order-name" x="70" y="142">Prompt first</text>
    <text class="decision-order-desc" x="44" y="166">Hours of work. Often sufficient,</text>
    <text class="decision-order-desc" x="44" y="182">and always informative.</text>
  </g>
  <line class="decision-order-line decision-order-conn decision-order-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#decision-order-tip)"/>
  <g class="decision-order-stage decision-order-s1">
    <rect class="decision-order-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="decision-order-step" x="280" y="142">02</text>
    <text class="decision-order-name" x="306" y="142">Add retrieval if knowledge is missing</text>
    <text class="decision-order-desc" x="280" y="166">Days to weeks. Solves the most</text>
    <text class="decision-order-desc" x="280" y="182">common deficiency.</text>
  </g>
  <line class="decision-order-line decision-order-conn decision-order-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#decision-order-tip)"/>
  <g class="decision-order-stage decision-order-s2">
    <rect class="decision-order-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="decision-order-step" x="516" y="142">03</text>
    <text class="decision-order-name" x="542" y="142">Fine-tune if behaviour is still wrong</text>
    <text class="decision-order-desc" x="516" y="166">Weeks, plus labelled data.</text>
  </g>
  <line class="decision-order-line decision-order-conn decision-order-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#decision-order-tip)"/>
  <g class="decision-order-stage decision-order-s3">
    <rect class="decision-order-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="decision-order-step" x="752" y="142">04</text>
    <text class="decision-order-name" x="778" y="142">And combine where both apply</text>
    <text class="decision-order-desc" x="752" y="166">Which is what most mature</text>
    <text class="decision-order-desc" x="752" y="182">systems do.</text>
  </g>
  <text class="decision-order-sub" x="30" y="304">Working in this order is much cheaper than the reverse, and each step also produces the evaluation data the next step needs to justify itself.</text>
</svg>
