<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The order reversed itself.">
  <title>Four steps in how models are adapted</title>
  <style>
    .choice-history-bg   { fill: #f8fafc; }
    .choice-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .choice-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .choice-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .choice-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .choice-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .choice-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .choice-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .choice-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .choice-history-stage { opacity: 1; }

    .choice-history-s0 { animation-delay: 0.00s; }
    .choice-history-e0 { animation-delay: 0.00s; }
    .choice-history-s1 { animation-delay: 1.28s; }
    .choice-history-e1 { animation-delay: 1.28s; }
    .choice-history-s2 { animation-delay: 2.56s; }
    .choice-history-e2 { animation-delay: 2.56s; }
    .choice-history-s3 { animation-delay: 3.84s; }
    .choice-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .choice-history-conn  { animation: choice-history-trace 6.4s ease-in-out infinite; }
      .choice-history-stage { animation: choice-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes choice-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes choice-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .choice-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .choice-history-stage { animation: choice-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes choice-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="choice-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="choice-history-bg" width="980" height="322"/>
  <text class="choice-history-h1"  x="30" y="40">Four steps in how models are adapted</text>
  <text class="choice-history-sub" x="30" y="64">The order reversed itself.</text>
  <g class="choice-history-stage choice-history-s0">
    <rect class="choice-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="choice-history-step" x="44" y="142">01</text>
    <text class="choice-history-name" x="70" y="142">Fine-tune a model per task</text>
    <text class="choice-history-desc" x="44" y="166">The only option, and expensive.</text>
  </g>
  <line class="choice-history-line choice-history-conn choice-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#choice-history-tip)"/>
  <g class="choice-history-stage choice-history-s1">
    <rect class="choice-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="choice-history-step" x="280" y="142">02</text>
    <text class="choice-history-name" x="306" y="142">Then prompting worked instead</text>
    <text class="choice-history-desc" x="280" y="166">Which surprised everyone, and</text>
    <text class="choice-history-desc" x="280" y="182">removed most training.</text>
  </g>
  <line class="choice-history-line choice-history-conn choice-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#choice-history-tip)"/>
  <g class="choice-history-stage choice-history-s2">
    <rect class="choice-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="choice-history-step" x="516" y="142">03</text>
    <text class="choice-history-name" x="542" y="142">Retrieval solved the knowledge half</text>
    <text class="choice-history-desc" x="516" y="166">Which prompting could not.</text>
  </g>
  <line class="choice-history-line choice-history-conn choice-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#choice-history-tip)"/>
  <g class="choice-history-stage choice-history-s3">
    <rect class="choice-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="choice-history-step" x="752" y="142">04</text>
    <text class="choice-history-name" x="778" y="142">And cheap adapters brought fine-tuning back</text>
    <text class="choice-history-desc" x="752" y="166">For the behaviour half, at a</text>
    <text class="choice-history-desc" x="752" y="182">fraction of the cost.</text>
  </g>
  <text class="choice-history-sub" x="30" y="304">Fine-tuning was displaced and then returned in a cheaper form, which is why treating it as the advanced or legacy option both get the picture wrong.</text>
</svg>
