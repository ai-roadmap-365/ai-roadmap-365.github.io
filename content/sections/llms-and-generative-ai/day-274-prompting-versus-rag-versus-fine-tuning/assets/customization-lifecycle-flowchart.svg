<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Customization Architecture Selection Flowchart">
  <title>Customization Architecture Selection Flowchart</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d274f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d274f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d274f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d274f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d274f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d274f-arrowhead); }
      .d274f-pulse { animation: d274f-glow 2.5s infinite ease-in-out; }
      @keyframes d274f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d274f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d274f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(50, 40)">
    <rect class="d274f-box" x="0" y="0" width="180" height="70" />
    <text class="d274f-header" x="20" y="30">Requirement Ingestion</text>
    <text class="d274f-text" x="20" y="50">SLA, Budget, Volatility</text>

    <path class="d274f-arrow" d="M 180 35 L 240 35" />

    <rect class="d274f-box" x="240" y="0" width="200" height="70" />
    <text class="d274f-header" x="20" y="30">Knowledge Volatility?</text>
    <text class="d274f-text" x="20" y="50">Real-time / Rapid updates</text>

    <path class="d274f-arrow" d="M 340 70 L 340 130" />
    <path class="d274f-arrow" d="M 440 35 L 500 35" />

    <rect class="d274f-box d274f-pulse" x="240" y="130" width="200" height="70" />
    <text class="d274f-header" x="20" y="30">Select RAG Pattern</text>
    <text class="d274f-accent" x="20" y="50">Vector DB + BM25</text>

    <rect class="d274f-box" x="500" y="0" width="220" height="70" />
    <text class="d274f-header" x="20" y="30">Strict Style &amp; Format?</text>
    <text class="d274f-text" x="20" y="50">Exact grammar/domain syntax</text>

    <path class="d274f-arrow" d="M 610 70 L 610 130" />

    <rect class="d274f-box d274f-pulse" x="500" y="130" width="220" height="70" />
    <text class="d274f-header" x="20" y="30">Select LoRA / PEFT</text>
    <text class="d274f-accent" x="20" y="50">Adapter fine-tuning</text>
  </g>

</svg>