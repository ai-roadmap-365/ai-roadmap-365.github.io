<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, no training.">
  <title>How retrieval adapts a model</title>
  <style>
    .rag-mechanics-bg   { fill: #f8fafc; }
    .rag-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rag-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rag-mechanics-stage { opacity: 1; }

    .rag-mechanics-s0 { animation-delay: 0.00s; }
    .rag-mechanics-e0 { animation-delay: 0.00s; }
    .rag-mechanics-s1 { animation-delay: 1.28s; }
    .rag-mechanics-e1 { animation-delay: 1.28s; }
    .rag-mechanics-s2 { animation-delay: 2.56s; }
    .rag-mechanics-e2 { animation-delay: 2.56s; }
    .rag-mechanics-s3 { animation-delay: 3.84s; }
    .rag-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rag-mechanics-conn  { animation: rag-mechanics-trace 6.4s ease-in-out infinite; }
      .rag-mechanics-stage { animation: rag-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rag-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rag-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rag-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rag-mechanics-stage { animation: rag-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rag-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rag-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rag-mechanics-bg" width="980" height="322"/>
  <text class="rag-mechanics-h1"  x="30" y="40">How retrieval adapts a model</text>
  <text class="rag-mechanics-sub" x="30" y="64">Four steps, no training.</text>
  <g class="rag-mechanics-stage rag-mechanics-s0">
    <rect class="rag-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rag-mechanics-step" x="44" y="142">01</text>
    <text class="rag-mechanics-name" x="70" y="142">Index the corpus once</text>
    <text class="rag-mechanics-desc" x="44" y="166">Chunked, embedded, stored.</text>
  </g>
  <line class="rag-mechanics-line rag-mechanics-conn rag-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rag-mechanics-tip)"/>
  <g class="rag-mechanics-stage rag-mechanics-s1">
    <rect class="rag-mechanics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rag-mechanics-step" x="280" y="142">02</text>
    <text class="rag-mechanics-name" x="306" y="142">Search it at request time</text>
    <text class="rag-mechanics-desc" x="280" y="166">For passages relevant to this</text>
    <text class="rag-mechanics-desc" x="280" y="182">question.</text>
  </g>
  <line class="rag-mechanics-line rag-mechanics-conn rag-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rag-mechanics-tip)"/>
  <g class="rag-mechanics-stage rag-mechanics-s2">
    <rect class="rag-mechanics-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rag-mechanics-step" x="516" y="142">03</text>
    <text class="rag-mechanics-name" x="542" y="142">Supply them with the question</text>
    <text class="rag-mechanics-desc" x="516" y="166">So the model answers from text</text>
    <text class="rag-mechanics-desc" x="516" y="182">rather than memory.</text>
  </g>
  <line class="rag-mechanics-line rag-mechanics-conn rag-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rag-mechanics-tip)"/>
  <g class="rag-mechanics-stage rag-mechanics-s3">
    <rect class="rag-mechanics-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rag-mechanics-step" x="752" y="142">04</text>
    <text class="rag-mechanics-name" x="778" y="142">And update by changing documents</text>
    <text class="rag-mechanics-desc" x="752" y="166">Immediately, with no retraining.</text>
    <text class="rag-mechanics-edge" x="752" y="242">tokens per request</text>
  </g>
  <text class="rag-mechanics-sub" x="30" y="304">Immediate updates without retraining is the property that decides most architectures: a fact corrected in a document is corrected in every answer from the next request onward.</text>
</svg>
