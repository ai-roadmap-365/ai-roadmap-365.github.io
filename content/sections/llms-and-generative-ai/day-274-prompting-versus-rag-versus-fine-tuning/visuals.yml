- id: combination
  file: assets/combination.svg
  type: diagram
  title: 'One approach, or several'
  alt: 'Diagram: a single adaptation approach compared with a combined architecture'
  description: 'A two-column comparison of using one adaptation approach against combining several.'
- id: cold-start
  file: assets/cold-start.svg
  type: diagram
  title: 'Why prompting comes first'
  alt: 'Diagram: why prompting is attempted before retrieval or fine-tuning'
