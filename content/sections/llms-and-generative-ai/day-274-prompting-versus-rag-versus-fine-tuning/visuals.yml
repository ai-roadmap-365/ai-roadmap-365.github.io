  type: diagram
  title: Customization Triad Decision Matrix
  alt: Customization Triad Decision Matrix comparing Prompting, RAG, and Fine-Tuning
    across knowledge latency and formatting
  description: Decision matrix comparing prompt engineering, retrieval-augmented generation,
    and fine-tuning.
- id: customization-lifecycle-flowchart
  file: assets/customization-lifecycle-flowchart.svg
  type: diagram
  title: Customization Lifecycle Flowchart
  alt: Customization Lifecycle Flowchart illustrating the decision flow from prompting
    to RAG and LoRA fine-tuning
  description: Lifecycle flowchart guiding engineering decisions between prompt engineering,
    RAG, and fine-tuning.
- id: three-approaches
  file: assets/three-approaches.svg
  type: diagram
  title: 'Three approaches, three problems'
  alt: 'Diagram: prompting, retrieval and fine-tuning as solutions to three different problems'
  description: 'A three-stage description of the three adaptation approaches covering prompting, retrieval and fine-tuning.'
- id: knowledge-behaviour
  file: assets/knowledge-behaviour.svg
  type: diagram
  title: 'Knowledge against behaviour'
  alt: 'Diagram: knowledge problems compared with behaviour problems in model adaptation'
  description: 'A two-column comparison of knowledge deficiencies against behaviour deficiencies.'
- id: icl-mechanics
  file: assets/icl-mechanics.svg
  type: diagram
  title: 'How prompting adapts a model'
  alt: 'Diagram: how in-context examples adapt model behaviour without training'
  description: 'A four-stage description of in-context learning covering the examples, pattern inference, application and the per-request cost.'
- id: rag-mechanics
  file: assets/rag-mechanics.svg
  type: diagram
  title: 'How retrieval adapts a model'
  alt: 'Diagram: how retrieval supplies knowledge to a model at request time'
  description: 'A four-stage description of retrieval mechanics covering indexing, query-time search, context assembly and the update path.'
- id: lora-mechanics
  file: assets/lora-mechanics.svg
  type: diagram
  title: 'How fine-tuning adapts a model'
  alt: 'Diagram: how low-rank adaptation changes model behaviour with a small trained addition'
  description: 'A four-stage description of adapter fine-tuning covering the frozen base, the low-rank addition, training and deployment.'
- id: decision-order
  file: assets/decision-order.svg
  type: diagram
  title: 'The order to try them in'
  alt: 'Diagram: the order in which adaptation approaches should be attempted'
  description: 'A four-stage description of the adaptation decision order covering prompting, retrieval, fine-tuning and combination.'
- id: economics
  file: assets/economics.svg
  type: diagram
  title: 'The cost shapes differ'
  alt: 'Diagram: the cost structure of retrieval compared with fine-tuning'
  description: 'A two-column comparison of per-request cost against one-off training cost.'
- id: tools-workshop
  file: assets/tools-workshop.svg
  type: diagram
  title: 'Instructions, a reference shelf, or training'
  alt: 'Diagram: written instructions, a reference library and training as three ways to prepare a worker'
  description: 'A two-column comparison of supplying information against changing capability.'
- id: choice-implications
  file: assets/choice-implications.svg
  type: diagram
  title: 'Four consequences of the choice'
  alt: 'Diagram: the update, cost, auditability and lock-in implications of the three adaptation approaches'
  description: 'A four-stage description of adaptation implications covering update speed, cost structure, auditability and portability.'
- id: choice-when
  file: assets/choice-when.svg
  type: diagram
  title: 'Choosing between them'
  alt: 'Diagram: choosing an adaptation approach by the observed problem'
  description: 'A two-column comparison of observed problems against the adaptation approach that addresses each.'
- id: choice-history
  file: assets/choice-history.svg
  type: diagram
  title: 'Four steps in how models are adapted'
  alt: 'Diagram: the historical progression of model adaptation approaches'
  description: 'A four-stage description of adaptation history covering full fine-tuning, prompting, retrieval and parameter-efficient methods.'
- id: staleness
  file: assets/staleness.svg
