questions:
- question: Which of the following customization approaches is best suited when factual information changes
    hourly and responses require exact verifiable source citations?
  options:
  - 'RAG (retrieval-augmented)'
  - Full Parameter Fine-Tuning
  - LoRA Fine-Tuning
  - Quantization with llama.cpp
  answer_index: 0
  explanation: RAG separates parametric reasoning from non-parametric factual storage, enabling instant
    updates to external indexes and verifiable inline citations without retraining model weights.
- question: What is the primary risk when using fine-tuning to update volatile domain facts in a large
    language model?
  options:
  - Increased Time-To-First-Token latency during prompt processing
  - 'Catastrophic forgetting and stale parametric facts'
  - Inability to emit structured JSON output
  - Excessive token billing on every inference turn
  answer_index: 1
  explanation: Fine-tuning models on factual data often leads to catastrophic forgetting of general domain
    capabilities while baking facts into static weights that become stale and prone to hallucination.
- question: When is LoRA fine-tuning strictly preferred over standard in-context few-shot prompting?
  options:
  - When the prompt context window has infinite capacity at zero cost
  - When zero training examples or labeled data exist
  - 'When you need a fixed syntax or tone with few prompt tokens'
  - When the model must run completely without a GPU or neural network
  answer_index: 2
  explanation: LoRA excels at teaching the model structured syntax, tone, and domain jargon without inflating
    prompt token counts, reducing TTFT and long-term per-token inference costs.
- question: How does prompt caching (such as Anthropic cache_control) alter the cost comparison between
    Prompting and Fine-Tuning?
  options:
  - It eliminates the need for base model weights entirely
  - It prevents all forms of prompt injection vulnerabilities
  - It turns full fine-tuning into an offline zero-cost operation
  - 'It cuts prompt cost up to 90% and speeds up TTFT'
  answer_index: 3
  explanation: Prompt caching reduces the financial and latency penalties of large multi-shot prompts
    by reusing pre-computed KV attention states for identical prompt prefixes.
- question: What architectural pattern combines the strengths of both RAG and LoRA fine-tuning?
  options:
  - 'Fine-tuned RAG'
  - Static HTML Compilation
  - Random Forest Ensembling
  - Zero-Shot Greedy Decoding
  answer_index: 0
  explanation: Hybrid systems leverage LoRA to teach domain style, jargon, and structured formatting,
    while delegating dynamic factual retrieval and citation verification to an external RAG pipeline.
