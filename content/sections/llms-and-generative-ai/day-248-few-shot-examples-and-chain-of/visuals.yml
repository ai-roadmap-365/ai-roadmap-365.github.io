    alt: Chain of Thought reasoning and Self-Consistency voting tree architecture comparison
    description: 'Comparison of direct generation, step-by-step CoT autoregressive scratchpads, and Self-Consistency majority voting.'
  - id: cot-idea
    file: assets/cot-idea.svg
    type: diagram
    title: 'Why reasoning first helps'
    alt: 'Diagram: why generating reasoning before an answer improves accuracy'
    description: 'A four-stage description of chain-of-thought covering direct answering, the single-pass limit, intermediate steps and the accuracy gain.'
  - id: in-context
    file: assets/in-context.svg
    type: diagram
    title: 'In-context learning'
    alt: 'Diagram: how a model adapts to a task from examples in the prompt'
    description: 'A four-stage description of in-context learning covering the examples, pattern inference, application and the absence of weight updates.'
  - id: self-consistency
    file: assets/self-consistency.svg
    type: diagram
    title: 'Self-consistency'
    alt: 'Diagram: how sampling multiple reasoning paths and voting improves accuracy'
    description: 'A four-stage description of self-consistency covering single-path fragility, repeated sampling, agreement and the cost.'
  - id: faithfulness
    file: assets/faithfulness.svg
    type: diagram
    title: 'The stated reasoning against the real one'
    alt: 'Diagram: a plausible reasoning trace compared with a faithful one'
    description: 'A two-column comparison of a reasoning trace that reads well against one that reflects the actual computation.'
  - id: working
    file: assets/working.svg
    type: diagram
    title: 'Showing your working'
    alt: 'Diagram: mental arithmetic compared with written working'
    description: 'A two-column comparison of solving a problem mentally against writing the steps down.'
  - id: cot-implications
    file: assets/cot-implications.svg
    type: diagram
    title: 'Four consequences of reasoning prompts'
    alt: 'Diagram: the accuracy, cost, latency and interpretability implications of chain-of-thought prompting'
    description: 'A four-stage description of chain-of-thought implications covering accuracy gains, output cost, latency and apparent interpretability.'
  - id: cot-when
    file: assets/cot-when.svg
    type: diagram
    title: 'When to prompt for reasoning'
    alt: 'Diagram: when chain-of-thought prompting helps and when it is waste'
    description: 'A two-column comparison of tasks that benefit from reasoning prompts against those that do not.'
  - id: cot-history
    file: assets/cot-history.svg
    type: diagram
    title: 'Four steps to reasoning prompts'
    alt: 'Diagram: the historical progression of reasoning prompt techniques'
    description: 'A four-stage description of reasoning prompt history covering few-shot prompting, reasoning exemplars, the zero-shot trigger phrase and trained reasoning models.'
  - id: test-time
    file: assets/test-time.svg
