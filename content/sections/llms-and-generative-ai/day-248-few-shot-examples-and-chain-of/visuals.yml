    type: diagram
    title: 'In-Context Learning & Attention Activation Manifolds'
    alt: In-Context Learning attention trajectory diagram showing how few-shot exemplars act as implicit meta-gradients in transformer layers
    description: 'How few-shot demonstration pairs steer transformer attention activation trajectories without altering model weights.'
  - id: chain-of-thought-and-self-consistency-trees
    file: assets/chain-of-thought-and-self-consistency-trees.svg
