    options:
      - 'Transformer attention induction heads perform an implicit form of meta-gradient descent in the forward pass, using demonstration pairs to shift hidden activation trajectories into the target task manifold without updating model weights'
      - 'ICL compiles the prompt into a GPU kernel'
      - 'ICL downloads new neural weights from the internet'
      - 'ICL compresses text using Huffman encoding'
    answer_index: 0
    explanation: 'Research demonstrates that transformer self-attention implements implicit optimization during the forward pass.'
  - question: 'Why does Chain-of-Thought (CoT) prompting drastically improve multi-step reasoning accuracy over direct zero-shot generation?'
    options:
      - 'Because autoregressively generating intermediate reasoning tokens expands the computational scratchpad, allowing subsequent attention heads to condition on explicitly generated intermediate deduction steps rather than forcing the model to jump directly to the final answer in a single forward pass'
      - 'Because CoT makes the model type faster'
      - 'Because CoT reduces the prompt token count'
      - 'Because CoT disables GPU temperature sampling'
    answer_index: 0
    explanation: 'CoT provides extra computational steps via autoregressive token generation, allowing attention heads to compute complex intermediate logic.'
  - question: 'What is Self-Consistency Prompting (Wang et al.), and how does it improve reasoning robustness?'
    options:
      - 'Sampling multiple independent reasoning paths (k >= 5) from the model at non-zero temperature (e.g. T=0.7) and selecting the final answer via majority voting, effectively filtering out idiosyncratic reasoning errors'
      - 'Asking the model to repeat its answer 3 times in the same prompt'
      - 'Using 5 different graphics cards simultaneously'
      - 'Checking if the prompt has grammatical errors'
    answer_index: 0
    explanation: 'Self-Consistency leverages ensemble majority consensus across diverse sampled reasoning paths.'
  - question: 'What are the 3 major biases that degrade naive Few-Shot prompting?'
    options:
      - '1. Majority Label Bias (predicting the most frequent exemplar class), 2. Recency Bias (predicting the label of the final exemplar), 3. Common Token Bias (favoring frequent pretraining tokens)'
      - '1. Red, 2. Green, 3. Blue'
      - '1. Audio, 2. Video, 3. Text'
      - '1. CPU, 2. GPU, 3. TPU'
    answer_index: 0
    explanation: 'Zhao et al. identified majority label bias, recency bias, and common token bias as the primary failure modes in few-shot selection.'
  - question: 'What is Least-to-Most prompting (Zhou et al.)?'
    options:
      - 'A decomposition strategy where a complex multi-hop problem is first broken into an ordered list of sub-questions, and the model solves each sub-question sequentially, passing prior sub-answers into subsequent steps'
      - 'A technique to minimize API token spending'
      - 'A sorting algorithm for database queries'
      - 'A method to compress image files'
    answer_index: 0
    explanation: 'Least-to-Most decomposition solves complex tasks by progressively chaining solutions from simplest sub-problems to the final answer.'
