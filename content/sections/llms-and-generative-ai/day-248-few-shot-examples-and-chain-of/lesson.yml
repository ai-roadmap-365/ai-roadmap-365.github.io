learning_promise: 'Master in-context exemplar learning and step-by-step reasoning architectures: understand the theoretical mechanics of In-Context Learning (ICL) as implicit meta-gradients in attention activations, engineer balanced few-shot exemplar pools that avoid majority label and recency biases, implement Zero-Shot CoT ("Think step by step"), Manual CoT, Least-to-Most decomposition, and Self-Consistency majority voting (k >= 5 rollouts), and build an automated few-shot CoT reasoning engine with self-consistency aggregation in Python.'
objectives:
  - 'Explain how In-Context Learning functions as implicit gradient descent in transformer activations.'
  - 'Engineer balanced few-shot exemplar pools to avoid label distribution and ordering biases.'
  - 'Implement Zero-Shot and Manual Chain-of-Thought prompting to expand inference compute.'
  - 'Apply Least-to-Most prompt decomposition for complex algorithmic and multi-hop tasks.'
  - 'Build a Self-Consistency majority voting engine in Python to boost reasoning reliability.'
