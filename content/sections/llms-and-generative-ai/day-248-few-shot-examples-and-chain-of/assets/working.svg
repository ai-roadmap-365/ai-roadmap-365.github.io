<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="In your head, or on paper.">
  <title>Showing your working</title>
  <style>
    .working-bg   { fill: #f8fafc; }
    .working-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .working-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .working-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .working-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .working-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .working-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .working-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .working-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .working-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .working-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .working-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .working-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .working-row { opacity: 1; }
    .working-r0 { animation-delay: 0.00s; }
    .working-r1 { animation-delay: 0.45s; }
    .working-r2 { animation-delay: 0.90s; }
    .working-r3 { animation-delay: 1.35s; }
    .working-r4 { animation-delay: 1.80s; }
    .working-row { animation: working-reveal 7.3s ease-in-out infinite; }
    @keyframes working-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="working-bg" width="980" height="390"/>
  <text class="working-h1"  x="30" y="40">Showing your working</text>
  <text class="working-sub" x="30" y="64">In your head, or on paper.</text>
  <rect class="working-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="working-name" x="46" y="122">In your head</text>
  <text class="working-desc" x="46" y="142">Limited capacity.</text>
  <text class="working-desc working-row working-r0" x="46" y="182">Everything held at once</text>
  <text class="working-desc working-row working-r1" x="46" y="216">Errors compound invisibly</text>
  <text class="working-desc working-row working-r2" x="46" y="250">Fine for two steps</text>
  <text class="working-desc working-row working-r3" x="46" y="284">Fails at five</text>
  <text class="working-desc working-row working-r4" x="46" y="318">This is direct answering</text>
  <rect class="working-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="working-name" x="526" y="122">On paper</text>
  <text class="working-desc" x="526" y="142">Unlimited scratch space.</text>
  <text class="working-desc working-row working-r0" x="526" y="182">Each step written and available</text>
  <text class="working-desc working-row working-r1" x="526" y="216">Errors visible and correctable</text>
  <text class="working-desc working-row working-r2" x="526" y="250">Fine for any number of steps</text>
  <text class="working-desc working-row working-r3" x="526" y="284">The page holds what memory cannot</text>
  <text class="working-desc working-row working-r4" x="526" y="318">This is chain-of-thought</text>
  <text class="working-sub" x="30" y="372">The parallel is close enough to be useful and not exact: the model's page is its own output, which means a wrong line stays and is built upon rather than being crossed out.</text>
</svg>
