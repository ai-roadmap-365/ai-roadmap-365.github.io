<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One path, or many.">
  <title>A chain against a tree</title>
  <style>
    .tree-of-thought-bg   { fill: #f8fafc; }
    .tree-of-thought-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-of-thought-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-of-thought-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-of-thought-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-of-thought-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-of-thought-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-of-thought-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tree-of-thought-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tree-of-thought-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tree-of-thought-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tree-of-thought-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tree-of-thought-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-of-thought-row { opacity: 1; }
    .tree-of-thought-r0 { animation-delay: 0.00s; }
    .tree-of-thought-r1 { animation-delay: 0.45s; }
    .tree-of-thought-r2 { animation-delay: 0.90s; }
    .tree-of-thought-r3 { animation-delay: 1.35s; }
    .tree-of-thought-r4 { animation-delay: 1.80s; }
    .tree-of-thought-row { animation: tree-of-thought-reveal 7.3s ease-in-out infinite; }
    @keyframes tree-of-thought-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tree-of-thought-bg" width="980" height="390"/>
  <text class="tree-of-thought-h1"  x="30" y="40">A chain against a tree</text>
  <text class="tree-of-thought-sub" x="30" y="64">One path, or many.</text>
  <rect class="tree-of-thought-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tree-of-thought-name" x="46" y="122">A single chain</text>
  <text class="tree-of-thought-desc" x="46" y="142">One path, forward only.</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r0" x="46" y="182">Each step follows the last</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r1" x="46" y="216">No backtracking</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r2" x="46" y="250">One model call</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r3" x="46" y="284">Cheap and usually sufficient</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r4" x="46" y="318">Fails when an early step is wrong</text>
  <rect class="tree-of-thought-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tree-of-thought-name" x="526" y="122">A branching search</text>
  <text class="tree-of-thought-desc" x="526" y="142">Many paths, evaluated.</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r0" x="526" y="182">Several continuations per step</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r1" x="526" y="216">Scored, and pruned</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r2" x="526" y="250">Many model calls</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r3" x="526" y="284">An order of magnitude more expensive</text>
  <text class="tree-of-thought-desc tree-of-thought-row tree-of-thought-r4" x="526" y="318">Right for puzzles and planning</text>
  <text class="tree-of-thought-sub" x="30" y="372">The cost difference is large enough that branching search is confined to genuinely hard search problems, where a single chain fails often enough to justify it.</text>
</svg>
