<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not the same thing.">
  <title>The stated reasoning against the real one</title>
  <style>
    .faithfulness-bg   { fill: #f8fafc; }
    .faithfulness-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .faithfulness-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .faithfulness-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .faithfulness-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .faithfulness-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .faithfulness-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .faithfulness-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .faithfulness-row { opacity: 1; }
    .faithfulness-r0 { animation-delay: 0.00s; }
    .faithfulness-r1 { animation-delay: 0.45s; }
    .faithfulness-r2 { animation-delay: 0.90s; }
    .faithfulness-r3 { animation-delay: 1.35s; }
    .faithfulness-r4 { animation-delay: 1.80s; }
    .faithfulness-row { animation: faithfulness-reveal 7.3s ease-in-out infinite; }
    @keyframes faithfulness-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="faithfulness-bg" width="980" height="390"/>
  <text class="faithfulness-h1"  x="30" y="40">The stated reasoning against the real one</text>
  <text class="faithfulness-sub" x="30" y="64">Not the same thing.</text>
  <rect class="faithfulness-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="faithfulness-name" x="46" y="122">Plausible</text>
  <text class="faithfulness-desc" x="46" y="142">Reads like reasoning.</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r0" x="46" y="182">Coherent and well-formed</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r1" x="46" y="216">Leads to the stated answer</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r2" x="46" y="250">Looks like an explanation</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r3" x="46" y="284">May not reflect the computation</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r4" x="46" y="318">And can be correct with wrong steps</text>
  <rect class="faithfulness-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="faithfulness-name" x="526" y="122">Faithful</text>
  <text class="faithfulness-desc" x="526" y="142">Reflects the computation.</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r0" x="526" y="182">Corresponds to what determined the answer</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r1" x="526" y="216">Changing a step changes the answer</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r2" x="526" y="250">Testable by perturbation</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r3" x="526" y="284">Which is much harder to achieve</text>
  <text class="faithfulness-desc faithfulness-row faithfulness-r4" x="526" y="318">And not what you get by default</text>
  <text class="faithfulness-sub" x="30" y="372">This is why a reasoning trace is a performance aid rather than an audit trail: it improves accuracy reliably and explains the answer only sometimes.</text>
</svg>
