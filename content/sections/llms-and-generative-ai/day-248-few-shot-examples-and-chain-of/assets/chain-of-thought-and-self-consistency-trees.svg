<svg role="img" aria-label="Chain of Thought reasoning and Self-Consistency voting tree architecture comparison" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Chain-of-Thought &amp; Self-Consistency Majority Voting</title>
  <defs>
    <linearGradient id="bg248b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card248b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg248b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CHAIN-OF-THOUGHT &amp; SELF-CONSISTENCY VOTING</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Comparing Direct Generation, Step-by-Step CoT Decomposition, and Majority Ensemble Consensus</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card248b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Standard Direct Zero-Shot -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#fb7185" rx="6"/>
    <text x="135" y="50" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">1. Direct Zero-Shot Prompt</text>
    <text x="35" y="80" fill="#94a3b8" font-size="8">Prompt: "What is 23 * 47?"</text>
    <text x="35" y="105" fill="#fb7185" font-size="8">Output: "1051" (WRONG)</text>
    <rect x="35" y="130" width="200" height="120" fill="#1e293b" rx="4"/>
    <text x="135" y="155" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Immediate Token Jump</text>
    <text x="45" y="180" fill="#cbd5e1" font-size="8">• Single forward pass prediction</text>
    <text x="45" y="200" fill="#cbd5e1" font-size="8">• Zero scratchpad computation</text>
    <text x="45" y="220" fill="#fb7185" font-size="8">• 35% Accuracy on Hard Math</text>

    <!-- Step-by-Step CoT -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="380" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Chain-of-Thought (CoT)</text>
    <text x="280" y="80" fill="#94a3b8" font-size="8">Prompt: "Think step by step..."</text>
    <text x="280" y="105" fill="#34d399" font-size="8">Output: "23*40=920, 23*7=161...</text>
    <text x="280" y="120" fill="#34d399" font-size="8">Total: 1081" (CORRECT)</text>
    <rect x="280" y="130" width="200" height="120" fill="#1e293b" rx="4"/>
    <text x="380" y="155" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Autoregressive Scratchpad</text>
    <text x="290" y="180" fill="#cbd5e1" font-size="8">• Generates reasoning tokens first</text>
    <text x="290" y="200" fill="#cbd5e1" font-size="8">• Attention attends to prior steps</text>
    <text x="290" y="220" fill="#34d399" font-size="8">• 78% Accuracy on Hard Math</text>

    <!-- Self-Consistency Ensemble -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#34d399" rx="6"/>
    <text x="625" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">3. Self-Consistency (k=5)</text>
    <text x="525" y="80" fill="#94a3b8" font-size="8">Sample 5 paths at T=0.7:</text>
    <text x="525" y="98" fill="#cbd5e1" font-size="8">Path 1: 1081 | Path 2: 1081</text>
    <text x="525" y="114" fill="#cbd5e1" font-size="8">Path 3: 1051 | Path 4: 1081...</text>
    <rect x="525" y="130" width="200" height="120" fill="#1e293b" rx="4"/>
    <text x="625" y="155" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Majority Vote Consensus</text>
    <text x="535" y="180" fill="#cbd5e1" font-size="8">• Prunes rogue hallucinated paths</text>
    <text x="535" y="200" fill="#cbd5e1" font-size="8">• Vote: [1081: 4/5, 1051: 1/5]</text>
    <text x="535" y="220" fill="#34d399" font-size="8">• &gt;92% Accuracy on Hard Math</text>
  </g>
</svg>
