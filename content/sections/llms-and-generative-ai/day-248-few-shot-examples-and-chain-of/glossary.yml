terms:
  - term: 'In-Context Learning (ICL)'
    definition: 'The ability of pretrained language models to perform new tasks conditioned solely on demonstration exemplars passed in the prompt context.'
  - term: 'Chain-of-Thought (CoT)'
    definition: 'A prompting technique that encourages the model to generate intermediate natural language reasoning steps before producing a final answer.'
  - term: 'Self-Consistency'
    definition: 'An ensemble decoding technique that samples multiple diverse reasoning paths at non-zero temperature and selects the most frequent final answer.'
  - term: 'Zero-Shot CoT'
    definition: 'Triggering step-by-step reasoning without exemplars using phrases like Let us think step by step.'
  - term: 'Least-to-Most Prompting'
    definition: 'Decomposing a complex problem into an ordered series of sub-problems solved sequentially in-context.'
  - term: 'Majority Label Bias'
    definition: 'The tendency of an LLM to over-predict the class label that appears most frequently in its few-shot examples.'
  - term: 'Recency Bias (Exemplars)'
    definition: 'The tendency of an LLM to predict the class label of the last few-shot exemplar in the prompt.'
  - term: 'Computational Scratchpad'
    definition: 'Intermediate tokens generated during autoregressive decoding that serve as working memory for subsequent attention heads.'
