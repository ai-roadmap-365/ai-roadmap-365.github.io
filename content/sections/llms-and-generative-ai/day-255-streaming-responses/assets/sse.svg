<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties of the wire format.">
  <title>How a stream arrives</title>
  <style>
    .sse-bg   { fill: #f8fafc; }
    .sse-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sse-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sse-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sse-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sse-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sse-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sse-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sse-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sse-stage { opacity: 1; }

    .sse-s0 { animation-delay: 0.00s; }
    .sse-e0 { animation-delay: 0.00s; }
    .sse-s1 { animation-delay: 1.28s; }
    .sse-e1 { animation-delay: 1.28s; }
    .sse-s2 { animation-delay: 2.56s; }
    .sse-e2 { animation-delay: 2.56s; }
    .sse-s3 { animation-delay: 3.84s; }
    .sse-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sse-conn  { animation: sse-trace 6.4s ease-in-out infinite; }
      .sse-stage { animation: sse-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sse-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sse-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sse-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sse-stage { animation: sse-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sse-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sse-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sse-bg" width="980" height="322"/>
  <text class="sse-h1"  x="30" y="40">How a stream arrives</text>
  <text class="sse-sub" x="30" y="64">Four properties of the wire format.</text>
  <g class="sse-stage sse-s0">
    <rect class="sse-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sse-step" x="44" y="142">01</text>
    <text class="sse-name" x="70" y="142">One long-lived response, held open</text>
    <text class="sse-desc" x="44" y="166">Not a sequence of requests.</text>
  </g>
  <line class="sse-line sse-conn sse-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sse-tip)"/>
  <g class="sse-stage sse-s1">
    <rect class="sse-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sse-step" x="280" y="142">02</text>
    <text class="sse-name" x="306" y="142">Events arrive as text, one per chunk</text>
    <text class="sse-desc" x="280" y="166">Each carrying a fragment of the</text>
    <text class="sse-desc" x="280" y="182">output.</text>
  </g>
  <line class="sse-line sse-conn sse-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sse-tip)"/>
  <g class="sse-stage sse-s2">
    <rect class="sse-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sse-step" x="516" y="142">03</text>
    <text class="sse-name" x="542" y="142">A terminating event marks completion</text>
    <text class="sse-desc" x="516" y="166">Which must be observed, not</text>
    <text class="sse-desc" x="516" y="182">inferred from silence.</text>
  </g>
  <line class="sse-line sse-conn sse-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sse-tip)"/>
  <g class="sse-stage sse-s3">
    <rect class="sse-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sse-step" x="752" y="142">04</text>
    <text class="sse-name" x="778" y="142">And a dropped connection looks like a pause</text>
    <text class="sse-desc" x="752" y="166">Until a timeout distinguishes</text>
    <text class="sse-desc" x="752" y="182">them.</text>
  </g>
  <text class="sse-sub" x="30" y="304">A dropped connection being indistinguishable from a slow one is the core operational difficulty of streaming, and it is why an idle timeout is mandatory rather than optional.</text>
</svg>
