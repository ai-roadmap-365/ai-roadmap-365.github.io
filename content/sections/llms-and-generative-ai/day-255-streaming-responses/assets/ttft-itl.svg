<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Optimised differently.">
  <title>Two latency numbers</title>
  <style>
    .ttft-itl-bg   { fill: #f8fafc; }
    .ttft-itl-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-itl-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ttft-itl-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ttft-itl-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ttft-itl-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ttft-itl-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ttft-itl-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ttft-itl-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ttft-itl-row { opacity: 1; }
    .ttft-itl-r0 { animation-delay: 0.00s; }
    .ttft-itl-r1 { animation-delay: 0.45s; }
    .ttft-itl-r2 { animation-delay: 0.90s; }
    .ttft-itl-r3 { animation-delay: 1.35s; }
    .ttft-itl-r4 { animation-delay: 1.80s; }
    .ttft-itl-row { animation: ttft-itl-reveal 7.3s ease-in-out infinite; }
    @keyframes ttft-itl-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ttft-itl-bg" width="980" height="390"/>
  <text class="ttft-itl-h1"  x="30" y="40">Two latency numbers</text>
  <text class="ttft-itl-sub" x="30" y="64">Optimised differently.</text>
  <rect class="ttft-itl-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ttft-itl-name" x="46" y="122">Time to first token</text>
  <text class="ttft-itl-desc" x="46" y="142">How responsive it feels.</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r0" x="46" y="182">Dominated by prompt processing</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r1" x="46" y="216">Improved by a shorter prompt</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r2" x="46" y="250">Improved by prompt caching</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r3" x="46" y="284">What users judge responsiveness on</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r4" x="46" y="318">Target: under a second</text>
  <rect class="ttft-itl-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ttft-itl-name" x="526" y="122">Time between tokens</text>
  <text class="ttft-itl-desc" x="526" y="142">How fast it reads.</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r0" x="526" y="182">Dominated by memory bandwidth</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r1" x="526" y="216">Improved by a smaller model</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r2" x="526" y="250">Improved by batching and better serving</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r3" x="526" y="284">What determines total duration</text>
  <text class="ttft-itl-desc ttft-itl-row ttft-itl-r4" x="526" y="318">Target: faster than reading speed</text>
  <text class="ttft-itl-sub" x="30" y="372">Once tokens arrive faster than a person reads, further improvement is invisible — which makes the first number the one worth spending on.</text>
</svg>
