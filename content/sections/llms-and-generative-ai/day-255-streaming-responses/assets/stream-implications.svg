<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are trade-offs.">
  <title>Four consequences of streaming</title>
  <style>
    .stream-implications-bg   { fill: #f8fafc; }
    .stream-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stream-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stream-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stream-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stream-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stream-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stream-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stream-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stream-implications-stage { opacity: 1; }

    .stream-implications-s0 { animation-delay: 0.00s; }
    .stream-implications-e0 { animation-delay: 0.00s; }
    .stream-implications-s1 { animation-delay: 1.28s; }
    .stream-implications-e1 { animation-delay: 1.28s; }
    .stream-implications-s2 { animation-delay: 2.56s; }
    .stream-implications-e2 { animation-delay: 2.56s; }
    .stream-implications-s3 { animation-delay: 3.84s; }
    .stream-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stream-implications-conn  { animation: stream-implications-trace 6.4s ease-in-out infinite; }
      .stream-implications-stage { animation: stream-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stream-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stream-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stream-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stream-implications-stage { animation: stream-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stream-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stream-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stream-implications-bg" width="980" height="322"/>
  <text class="stream-implications-h1"  x="30" y="40">Four consequences of streaming</text>
  <text class="stream-implications-sub" x="30" y="64">Two are trade-offs.</text>
  <g class="stream-implications-stage stream-implications-s0">
    <rect class="stream-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stream-implications-step" x="44" y="142">01</text>
    <text class="stream-implications-name" x="70" y="142">Perceived responsiveness improves greatly</text>
    <text class="stream-implications-desc" x="44" y="166">For no change in actual speed.</text>
  </g>
  <line class="stream-implications-line stream-implications-conn stream-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stream-implications-tip)"/>
  <g class="stream-implications-stage stream-implications-s1">
    <rect class="stream-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stream-implications-step" x="280" y="142">02</text>
    <text class="stream-implications-name" x="306" y="142">But the client is more complex</text>
    <text class="stream-implications-desc" x="280" y="166">Partial state, reconnection,</text>
    <text class="stream-implications-desc" x="280" y="182">cancellation.</text>
  </g>
  <line class="stream-implications-line stream-implications-conn stream-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stream-implications-tip)"/>
  <g class="stream-implications-stage stream-implications-s2">
    <rect class="stream-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stream-implications-step" x="516" y="142">03</text>
    <text class="stream-implications-name" x="542" y="142">And output cannot be checked before it is shown</text>
    <text class="stream-implications-desc" x="516" y="166">Which rules streaming out where</text>
    <text class="stream-implications-desc" x="516" y="182">moderation must precede display.</text>
  </g>
  <line class="stream-implications-line stream-implications-conn stream-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stream-implications-tip)"/>
  <g class="stream-implications-stage stream-implications-s3">
    <rect class="stream-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stream-implications-step" x="752" y="142">04</text>
    <text class="stream-implications-name" x="778" y="142">While each stream holds a connection open</text>
    <text class="stream-implications-desc" x="752" y="166">Which changes how the server is</text>
    <text class="stream-implications-desc" x="752" y="182">sized.</text>
  </g>
  <text class="stream-implications-sub" x="30" y="304">The moderation constraint is the one that eliminates streaming outright in some products: a filter that runs on the complete answer cannot run on an answer already displayed.</text>
</svg>
