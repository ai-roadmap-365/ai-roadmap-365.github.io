<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to wait.">
  <title>When to stream</title>
  <style>
    .streaming-when-bg   { fill: #f8fafc; }
    .streaming-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .streaming-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .streaming-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .streaming-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .streaming-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .streaming-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-when-row { opacity: 1; }
    .streaming-when-r0 { animation-delay: 0.00s; }
    .streaming-when-r1 { animation-delay: 0.45s; }
    .streaming-when-r2 { animation-delay: 0.90s; }
    .streaming-when-r3 { animation-delay: 1.35s; }
    .streaming-when-r4 { animation-delay: 1.80s; }
    .streaming-when-row { animation: streaming-when-reveal 7.3s ease-in-out infinite; }
    @keyframes streaming-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="streaming-when-bg" width="980" height="390"/>
  <text class="streaming-when-h1"  x="30" y="40">When to stream</text>
  <text class="streaming-when-sub" x="30" y="64">And when to wait.</text>
  <rect class="streaming-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="streaming-when-name" x="46" y="122">Stream it</text>
  <text class="streaming-when-desc" x="46" y="142">A person is waiting.</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r0" x="46" y="182">Chat and conversation</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r1" x="46" y="216">Long-form generation</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r2" x="46" y="250">Anything a human reads as it arrives</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r3" x="46" y="284">Where the wait would exceed a few seconds</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r4" x="46" y="318">And partial output is still useful</text>
  <rect class="streaming-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="streaming-when-name" x="526" y="122">Buffer it</text>
  <text class="streaming-when-desc" x="526" y="142">A program is waiting.</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r0" x="526" y="182">Structured output feeding another system</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r1" x="526" y="216">Anything requiring validation first</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r2" x="526" y="250">Content that must be moderated</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r3" x="526" y="284">Background and batch work</text>
  <text class="streaming-when-desc streaming-when-row streaming-when-r4" x="526" y="318">Short responses, where it changes nothing</text>
  <text class="streaming-when-sub" x="30" y="372">Streaming a short classification result is pure added complexity: the response arrives in one chunk regardless, and the client now handles a stream for no benefit.</text>
</svg>
