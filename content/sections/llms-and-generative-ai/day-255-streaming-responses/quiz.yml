questions:
  - question: 'What underlying HTTP standard powers streaming LLM responses across OpenAI and Anthropic APIs?'
    options:
      - 'Server-sent events over a persistent connection'
      - 'Raw UDP socket datagrams'
      - 'Polling a database table every 10 milliseconds'
      - 'FTP file uploads'
    answer_index: 0
    explanation: 'Server-Sent Events (SSE) is the standard lightweight HTTP protocol for unidirectional server-to-client streaming.'
  - question: 'What is Time-To-First-Token (TTFT) and why is it a critical UX metric?'
    options:
      - 'The time required to compile the Python interpreter'
      - 'Time from the request until the first token arrives'
      - 'The total duration of the entire model response generation'
      - 'The cost of the first 100 tokens in dollars'
    answer_index: 1
    explanation: 'TTFT directly determines user perceived latency, reducing perceived wait time from seconds to milliseconds.'
  - question: 'What sentinel event marks the completion of a standard OpenAI-compatible SSE stream?'
    options:
      - 'HTTP 404 Not Found'
      - 'data: FINISHED'
      - 'data: [DONE]'
      - 'data: EOF'
    answer_index: 2
    explanation: 'The sentinel string data: [DONE] terminates standard OpenAI-compatible SSE streams.'
  - question: 'In Python, what is the recommended way to stream tokens asynchronously without blocking the event loop?'
    options:
      - 'Spawning 100 operating system threads'
      - 'Using time.sleep(1) in a while loop'
      - 'Writing tokens to a temporary disk file'
      - 'async for over the streamed response'
    answer_index: 3
    explanation: 'Python async for iterators consume SSE chunks reactively as packets arrive over the network.'
  - question: 'What happens if a network disconnection occurs midway through a 500-token stream?'
    options:
      - 'The iterator raises; buffer and offer a retry'
      - 'The client computer automatically reboots'
      - 'The LLM deletes its weights'
      - 'The entire response is magically recovered from browser cache'
    answer_index: 0
    explanation: 'Network disconnects interrupt the TCP stream, requiring client-side error handling and state preservation.'
