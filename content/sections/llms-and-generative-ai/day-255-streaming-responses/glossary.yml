terms:
  - term: 'Server-Sent Events (SSE)'
    definition: 'An HTTP standard enabling a server to push real-time text data packets to a client over a single persistent connection.'
  - term: 'Time-To-First-Token (TTFT)'
    definition: 'The latency interval between request dispatch and the arrival of the initial response token chunk.'
  - term: 'Inter-Token Latency (ITL)'
    definition: 'The average duration elapsed between consecutive token emissions during autoregressive generation.'
  - term: 'Delta Chunk'
    definition: 'A partial payload object containing newly generated tokens or tool call fragments emitted in a stream.'
  - term: '[DONE] Sentinel'
    definition: 'The standard text marker sent as the final event in an SSE stream signaling normal stream closure.'
  - term: 'Typewriter Effect'
    definition: 'The user interface pattern of rendering incoming tokens progressively to mirror human typing motion.'
  - term: 'Backpressure'
    definition: 'The flow control mechanism preventing a fast sender from overwhelming a slow consumer buffer.'
  - term: 'Stream Aggregator'
    definition: 'A client-side abstraction that accumulates incremental streaming chunks into a complete final response object.'
