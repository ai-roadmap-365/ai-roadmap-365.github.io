learning_promise: 'Master real-time generative streaming: understand the Server-Sent Events (SSE) protocol, decode chunked streaming token deltas in Python (synchronous generators and async iterators), calculate Time-To-First-Token (TTFT) and Inter-Token Latency (ITL) metrics, handle network disconnections and streaming error propagation gracefully, and build a streaming token aggregator and real-time terminal typewriter in Python.'
objectives:
  - 'Understand the HTTP Server-Sent Events (SSE) text/event-stream wire format.'
  - 'Consume streaming token deltas using both Anthropic and OpenAI Python SDK stream interfaces.'
  - 'Implement asynchronous token streaming using async for and AsyncIterator in Python.'
  - 'Measure Time-To-First-Token (TTFT) and Inter-Token Latency (ITL) telemetry.'
  - 'Build a streaming token aggregator and typewriter terminal UI in Python.'
