visuals:
  - id: server-sent-events-streaming-pipeline
    file: assets/server-sent-events-streaming-pipeline.svg
    type: diagram
    title: 'Server-Sent Events (SSE) Streaming Pipeline'
    alt: Server-Sent Events SSE streaming pipeline architecture diagram
    description: 'Sequence architecture of an LLM streaming response over Server-Sent Events showing token deltas and termination.'
  - id: latency-metrics-ttft-vs-itl-timeline
    file: assets/latency-metrics-ttft-vs-itl-timeline.svg
    type: diagram
    title: 'Latency Timeline: Block Generation vs Streaming'
    alt: Latency timeline comparison between blocking and streaming generation diagram
    description: 'Timeline comparing perceived latency of blocking generation against streaming TTFT and inter-token intervals.'
  - id: streaming-idea
    file: assets/streaming-idea.svg
    type: diagram
    title: 'Why streaming exists'
    alt: 'Diagram: a buffered response compared with a streamed one'
    description: 'A four-stage description of streaming covering the buffered wait, the perceived delay, incremental delivery and the unchanged total time.'
  - id: sse
    file: assets/sse.svg
    type: diagram
    title: 'How a stream arrives'
    alt: 'Diagram: how streamed model output is delivered over a long-lived connection'
    description: 'A four-stage description of the streaming wire format covering the open connection, the event sequence, the terminator and the failure mode.'
  - id: ttft-itl
    file: assets/ttft-itl.svg
    type: diagram
    title: 'Two latency numbers'
    alt: 'Diagram: time to first token compared with time between tokens'
    description: 'A two-column comparison of the two latency measurements for streamed generation.'
  - id: stream-errors
    file: assets/stream-errors.svg
    type: diagram
    title: 'Failing mid-stream'
    alt: 'Diagram: the four failure modes of a streamed response and their handling'
    description: 'A four-stage description of stream failure handling covering mid-stream errors, disconnection, partial content and the user-facing decision.'
  - id: partial-json
    file: assets/partial-json.svg
    type: diagram
    title: 'Streaming structured output'
    alt: 'Diagram: how partial structured output is handled during streaming'
    description: 'A four-stage description of streaming structured output covering incomplete documents, incremental parsing, per-field rendering and final validation.'
  - id: live-broadcast
    file: assets/live-broadcast.svg
    type: diagram
    title: 'Live, or recorded'
    alt: 'Diagram: a live broadcast compared with a recorded and edited one'
    description: 'A two-column comparison of live transmission against a recorded, edited delivery.'
  - id: stream-implications
    file: assets/stream-implications.svg
    type: diagram
    title: 'Four consequences of streaming'
    alt: 'Diagram: the experience, complexity, moderation and connection implications of streaming'
    description: 'A four-stage description of streaming implications covering perceived responsiveness, client complexity, content checking and held connections.'
  - id: streaming-when
    file: assets/streaming-when.svg
    type: diagram
    title: 'When to stream'
    alt: 'Diagram: when streaming is the right delivery mode'
    description: 'A two-column comparison of situations favouring streaming against those favouring a buffered response.'
  - id: thinking-stream
    file: assets/thinking-stream.svg
    type: diagram
    title: 'Streaming reasoning separately'
    alt: 'Diagram: how reasoning tokens are streamed separately from the answer'
    description: 'A four-stage description of reasoning streams covering the separate channel, progress display, the answer stream and the product choice.'
  - id: streaming-history
    file: assets/streaming-history.svg
    type: diagram
    title: 'Four steps to streamed generation'
    alt: 'Diagram: the historical progression of streamed response delivery'
    description: 'A four-stage description of streaming history covering buffered responses, chunked transfer, server-sent events and streamed model output.'
