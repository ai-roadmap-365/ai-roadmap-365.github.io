<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Ollama Runtime Architecture Diagram">
  <title>Ollama Runtime Architecture Diagram</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d277a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d277a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d277a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d277a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d277a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d277a-arrowhead); }
      .d277a-pulse { animation: d277a-glow 2.5s infinite ease-in-out; }
      @keyframes d277a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d277a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d277a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(50, 40)">
    <rect class="d277a-box" x="0" y="0" width="220" height="240" />
    <text class="d277a-header" x="20" y="35">Ollama Daemon (Go)</text>
    <text class="d277a-text" x="20" y="70">• HTTP REST API (:11434)</text>
    <text class="d277a-text" x="20" y="95">• Model Manifest Store</text>
    <text class="d277a-text" x="20" y="120">• GGUF Layer Cache</text>
    <text class="d277a-text" x="20" y="145">• Modelfile Compiler</text>
    <text class="d277a-accent" x="20" y="195">Orchestration Layer</text>
  </g>

  <path class="d277a-arrow" d="M 270 160 L 340 160" />

  <g transform="translate(340, 40)">
    <rect class="d277a-box d277a-pulse" x="0" y="0" width="220" height="240" />
    <text class="d277a-header" x="20" y="35">llama.cpp Engine (C++)</text>
    <text class="d277a-text" x="20" y="70">• Metal / CUDA Kernels</text>
    <text class="d277a-text" x="20" y="95">• GGUF Dequantization</text>
    <text class="d277a-text" x="20" y="120">• KV Cache Allocation</text>
    <text class="d277a-text" x="20" y="145">• Autoregressive Sampler</text>
    <text class="d277a-accent" x="20" y="195">High-Speed Inference</text>
  </g>

  <g transform="translate(590, 80)">
    <rect class="d277a-box" x="0" y="0" width="160" height="140" />
    <text class="d277a-header" x="15" y="35">Hardware Memory</text>
    <text class="d277a-text" x="15" y="65">Apple Silicon UMA</text>
    <text class="d277a-text" x="15" y="90">or NVIDIA VRAM</text>
    <text class="d277a-accent" x="15" y="120">Zero-Copy Access</text>
  </g>

</svg>