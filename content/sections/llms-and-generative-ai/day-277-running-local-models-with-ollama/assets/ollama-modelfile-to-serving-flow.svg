<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Ollama Modelfile to Serving Flow">
  <title>Ollama Modelfile to Serving Flow</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d277f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d277f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d277f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d277f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d277f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d277f-arrowhead); }
      .d277f-pulse { animation: d277f-glow 2.5s infinite ease-in-out; }
      @keyframes d277f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d277f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d277f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d277f-box" x="0" y="0" width="200" height="70" />
    <text class="d277f-header" x="15" y="30">1. Modelfile Spec</text>
    <text class="d277f-text" x="15" y="50">FROM, SYSTEM, PARAM</text>

    <path class="d277f-arrow" d="M 200 35 L 260 35" />

    <rect class="d277f-box" x="260" y="0" width="220" height="70" />
    <text class="d277f-header" x="15" y="30">2. ollama create</text>
    <text class="d277f-text" x="15" y="50">Pack GGUF + Template</text>

    <path class="d277f-arrow" d="M 480 35 L 540 35" />

    <rect class="d277f-box d277f-pulse" x="540" y="0" width="200" height="70" />
    <text class="d277f-header" x="15" y="30">3. REST API Serving</text>
    <text class="d277f-accent" x="15" y="50">POST /api/chat (:11434)</text>

    <path class="d277f-arrow" d="M 640 70 L 640 130" />

    <rect class="d277f-box" x="540" y="130" width="200" height="70" />
    <text class="d277f-header" x="15" y="30">4. Streaming Response</text>
    <text class="d277f-text" x="15" y="50">Chunked JSON event stream</text>
  </g>

</svg>