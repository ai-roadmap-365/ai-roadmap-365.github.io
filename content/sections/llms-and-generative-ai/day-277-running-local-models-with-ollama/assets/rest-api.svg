<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The local request lifecycle</title>
  <style>
    .rest-api-bg   { fill: #f8fafc; }
    .rest-api-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-api-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-api-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-api-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-api-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-api-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rest-api-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rest-api-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rest-api-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rest-api-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rest-api-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rest-api-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rest-api-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rest-api-stage { opacity: 1; }

    .rest-api-s0 { animation-delay: 0.00s; }
    .rest-api-e0 { animation-delay: 0.00s; }
    .rest-api-s1 { animation-delay: 1.28s; }
    .rest-api-e1 { animation-delay: 1.28s; }
    .rest-api-s2 { animation-delay: 2.56s; }
    .rest-api-e2 { animation-delay: 2.56s; }
    .rest-api-s3 { animation-delay: 3.84s; }
    .rest-api-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rest-api-conn  { animation: rest-api-trace 6.4s ease-in-out infinite; }
      .rest-api-stage { animation: rest-api-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rest-api-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rest-api-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rest-api-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rest-api-stage { animation: rest-api-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rest-api-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rest-api-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rest-api-bg" width="980" height="322"/>
  <text class="rest-api-h1"  x="30" y="40">The local request lifecycle</text>
  <text class="rest-api-sub" x="30" y="64">Four steps.</text>
  <g class="rest-api-stage rest-api-s0">
    <rect class="rest-api-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rest-api-step" x="44" y="142">01</text>
    <text class="rest-api-name" x="70" y="142">A request names a model</text>
    <text class="rest-api-desc" x="44" y="166">Over the same interface a hosted</text>
    <text class="rest-api-desc" x="44" y="182">API uses.</text>
  </g>
  <line class="rest-api-line rest-api-conn rest-api-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rest-api-tip)"/>
  <g class="rest-api-stage rest-api-s1">
    <rect class="rest-api-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rest-api-step" x="280" y="142">02</text>
    <text class="rest-api-name" x="306" y="142">The server loads it if it is not resident</text>
    <text class="rest-api-desc" x="280" y="166">Seconds, the first time.</text>
  </g>
  <line class="rest-api-line rest-api-conn rest-api-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rest-api-tip)"/>
  <g class="rest-api-stage rest-api-s2">
    <rect class="rest-api-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rest-api-step" x="516" y="142">03</text>
    <text class="rest-api-name" x="542" y="142">Then generates, streaming</text>
    <text class="rest-api-desc" x="516" y="166">With layers on the accelerator</text>
    <text class="rest-api-desc" x="516" y="182">where they fit.</text>
  </g>
  <line class="rest-api-line rest-api-conn rest-api-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rest-api-tip)"/>
  <g class="rest-api-stage rest-api-s3">
    <rect class="rest-api-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rest-api-step" x="752" y="142">04</text>
    <text class="rest-api-name" x="778" y="142">And unloads after an idle period</text>
    <text class="rest-api-desc" x="752" y="166">Freeing memory for another</text>
    <text class="rest-api-desc" x="752" y="182">model.</text>
  </g>
  <text class="rest-api-sub" x="30" y="304">The load delay on a cold model is the surprise in local serving: the first request after an idle period is many times slower than the ones after it.</text>
</svg>
