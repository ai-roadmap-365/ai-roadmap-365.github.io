<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where the data goes.">
  <title>Sending it out, or keeping it in</title>
  <style>
    .local-privacy-bg   { fill: #f8fafc; }
    .local-privacy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-privacy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-privacy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-privacy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-privacy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-privacy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-privacy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-privacy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-privacy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-privacy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-privacy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-privacy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-privacy-row { opacity: 1; }
    .local-privacy-r0 { animation-delay: 0.00s; }
    .local-privacy-r1 { animation-delay: 0.45s; }
    .local-privacy-r2 { animation-delay: 0.90s; }
    .local-privacy-r3 { animation-delay: 1.35s; }
    .local-privacy-r4 { animation-delay: 1.80s; }
    .local-privacy-row { animation: local-privacy-reveal 7.3s ease-in-out infinite; }
    @keyframes local-privacy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="local-privacy-bg" width="980" height="390"/>
  <text class="local-privacy-h1"  x="30" y="40">Sending it out, or keeping it in</text>
  <text class="local-privacy-sub" x="30" y="64">Where the data goes.</text>
  <rect class="local-privacy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="local-privacy-name" x="46" y="122">Hosted</text>
  <text class="local-privacy-desc" x="46" y="142">The data leaves.</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r0" x="46" y="182">Every prompt crosses the network</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r1" x="46" y="216">Retention governed by a contract</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r2" x="46" y="250">Requires connectivity</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r3" x="46" y="284">Metered per token</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r4" x="46" y="318">Frontier capability</text>
  <rect class="local-privacy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="local-privacy-name" x="526" y="122">Local</text>
  <text class="local-privacy-desc" x="526" y="142">The data stays.</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r0" x="526" y="182">Nothing leaves the machine</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r1" x="526" y="216">Retention governed by you</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r2" x="526" y="250">Works offline</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r3" x="526" y="284">Free after the hardware</text>
  <text class="local-privacy-desc local-privacy-row local-privacy-r4" x="526" y="318">Capability a step behind</text>
  <text class="local-privacy-sub" x="30" y="372">For regulated or offline work the second column is not a preference but a requirement, which is why local capability being a step behind is often acceptable.</text>
</svg>
