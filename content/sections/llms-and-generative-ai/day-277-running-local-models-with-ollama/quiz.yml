questions:
- question: What is the internal relationship between Ollama and llama.cpp?
  options:
  - Ollama is a completely separate neural network architecture written in Rust
  - Ollama is an orchestration and packaging daemon (written in Go) that wraps the high-performance C++
    tensor execution engine of llama.cpp
  - llama.cpp is a cloud hosting provider that hosts Ollama models
  - Ollama translates Python scripts into JavaScript
  answer_index: 1
  explanation: Ollama provides high-level model packaging, Docker-like Modelfile management, and HTTP
    REST APIs in Go, delegating low-level hardware tensor operations directly to llama.cpp.
- question: Which Modelfile command specifies the base GGUF model checkpoint or parent model tag?
  options:
  - IMPORT
  - FROM
  - BASE
  - MODEL
  answer_index: 1
  explanation: The 'FROM' command defines the base model image or local GGUF path (e.g. 'FROM ./my_model.gguf'
    or 'FROM llama3:8b').
- question: Why is Apple Silicon (M-series chips) uniquely effective for running local 8B–70B parameter
    models with Ollama?
  options:
  - Because Apple Silicon disables floating-point quantization
  - Because Unified Memory Architecture (UMA) allows the CPU, GPU, and Neural Engine to share up to 128GB
    of high-bandwidth memory with zero-copy latency
  - Because macOS runs models inside cloud containers by default
  - Because it executes models on the SSD instead of RAM
  answer_index: 1
  explanation: Apple Silicon's Unified Memory Architecture provides up to 400–800 GB/s bandwidth shared
    directly between CPU and Metal GPU, allowing large models (e.g. 70B in Q4) to fit entirely in unified
    memory without PCIe transfer bottlenecks.
- question: What is the standard local port used by the Ollama REST API daemon?
  options:
  - '8080'
  - '11434'
  - '5000'
  - '3000'
  answer_index: 1
  explanation: Ollama runs its local HTTP REST server on port 11434 (e.g. http://127.0.0.1:11434).
- question: How does Ollama stream response tokens over HTTP in its /api/generate endpoint?
  options:
  - Via a binary WebSocket connection
  - By returning a single massive JSON blob after 30 seconds
  - 'By emitting newline-delimited JSON objects ({''response'': ''...'', ''done'': false}) as each token
    is generated'
  - By sending emails to the system administrator
  answer_index: 2
  explanation: Ollama streams responses by emitting a stream of newline-delimited JSON (NDJSON) chunks,
    each containing the latest generated token string and a 'done' boolean indicator.
