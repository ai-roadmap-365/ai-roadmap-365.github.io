learning_promise: 'Master local LLM serving with Ollama: understand the Go orchestrator and llama.cpp
  execution backend, write declarative Modelfiles with custom parameters and system prompts, optimize
  Unified Memory allocations on Apple Silicon, and interact with the REST API for streaming generation.'
objectives:
- 'Deconstruct the Ollama internal architecture: Go daemon API bridge + llama.cpp tensor execution engine.'
- Write declarative Modelfile definitions with custom parameters (temperature, top_p, repeat_penalty)
  and ChatML templates.
- Inspect and optimize GPU layer offloading on Apple Silicon Metal unified memory and Linux CUDA.
- Interact with Ollama REST API endpoints (/api/generate, /api/chat, /api/tags) via streaming JSON.
- Build a mock Ollama client and local API server simulator in Python.
