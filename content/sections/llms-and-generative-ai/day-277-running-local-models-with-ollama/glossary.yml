terms:
- term: Ollama
  definition: Open-source local LLM runner and management tool that packages models and serves REST APIs
    over llama.cpp.
- term: Modelfile
  definition: A declarative configuration file defining a model's base weights, system prompts, sampling
    parameters, and prompt templates.
- term: GGUF
  definition: The standard binary file format used by llama.cpp and Ollama for storing quantized model
    weights and metadata.
- term: Unified Memory Architecture (UMA)
  definition: Memory architecture where CPU and GPU share a single high-bandwidth physical memory pool.
- term: Metal
  definition: Apple's low-level, low-overhead hardware-accelerated 3D graphic and compute API used on
    macOS.
- term: Layer Offloading
  definition: Assigning a specific number of transformer layers to execute on the GPU while retaining
    remainder in CPU RAM.
- term: NDJSON (Newline-Delimited JSON)
  definition: A streaming format where each JSON payload is serialized on a single line separated by a
    newline character.
- term: Context Window (num_ctx)
  definition: Ollama parameter specifying the maximum token capacity allocated in memory for prompt and
    generation.
