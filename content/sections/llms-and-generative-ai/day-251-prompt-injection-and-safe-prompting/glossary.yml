terms:
  - term: 'Prompt Injection'
    definition: 'An adversarial exploit where untrusted input text alters the intended execution flow or safety boundaries of an LLM.'
  - term: 'Direct Prompt Injection (Jailbreak)'
    definition: 'A user prompt intentionally crafted to bypass safety filters, persona constraints, or refusal policies.'
  - term: 'Indirect Prompt Injection'
    definition: 'An attack where malicious commands are embedded in third-party data retrieved by an LLM agent during RAG or web search.'
  - term: 'Markdown Exfiltration'
    definition: 'An exploit where an LLM generates a markdown image or link tag that sends sensitive context data to an attacker-controlled server.'
  - term: 'Dual-LLM Pattern'
    definition: 'A security architecture separating untrusted data processing (unprivileged model) from tool execution (privileged model).'
  - term: 'Defense in Depth'
    definition: 'Employing multiple redundant security layers (input sanitizers, XML sandboxes, guard models, egress scanners).'
  - term: 'Llama Guard'
    definition: 'An open-weights safety classifier model fine-tuned to detect policy violations in human-AI dialogues.'
  - term: 'Canary Token'
    definition: 'A unique secret string placed in prompt context to detect if untrusted inputs successfully leak system prompts.'
