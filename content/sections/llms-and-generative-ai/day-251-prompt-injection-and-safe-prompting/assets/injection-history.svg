<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A familiar shape.">
  <title>Four steps toward prompt injection</title>
  <style>
    .injection-history-bg   { fill: #f8fafc; }
    .injection-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .injection-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .injection-history-stage { opacity: 1; }

    .injection-history-s0 { animation-delay: 0.00s; }
    .injection-history-e0 { animation-delay: 0.00s; }
    .injection-history-s1 { animation-delay: 1.28s; }
    .injection-history-e1 { animation-delay: 1.28s; }
    .injection-history-s2 { animation-delay: 2.56s; }
    .injection-history-e2 { animation-delay: 2.56s; }
    .injection-history-s3 { animation-delay: 3.84s; }
    .injection-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .injection-history-conn  { animation: injection-history-trace 6.4s ease-in-out infinite; }
      .injection-history-stage { animation: injection-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes injection-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes injection-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .injection-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .injection-history-stage { animation: injection-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes injection-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="injection-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="injection-history-bg" width="980" height="322"/>
  <text class="injection-history-h1"  x="30" y="40">Four steps toward prompt injection</text>
  <text class="injection-history-sub" x="30" y="64">A familiar shape.</text>
  <g class="injection-history-stage injection-history-s0">
    <rect class="injection-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="injection-history-step" x="44" y="142">01</text>
    <text class="injection-history-name" x="70" y="142">Injection appears wherever code and data share a channel</text>
    <text class="injection-history-desc" x="44" y="166">Query languages, shells, markup.</text>
  </g>
  <line class="injection-history-line injection-history-conn injection-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#injection-history-tip)"/>
  <g class="injection-history-stage injection-history-s1">
    <rect class="injection-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="injection-history-step" x="280" y="142">02</text>
    <text class="injection-history-name" x="306" y="142">Each was solved by separating the two</text>
    <text class="injection-history-desc" x="280" y="166">Parameters, escaping, strict</text>
    <text class="injection-history-desc" x="280" y="182">parsers.</text>
  </g>
  <line class="injection-history-line injection-history-conn injection-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#injection-history-tip)"/>
  <g class="injection-history-stage injection-history-s2">
    <rect class="injection-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="injection-history-step" x="516" y="142">03</text>
    <text class="injection-history-name" x="542" y="142">Then language models mixed instructions and content again</text>
    <text class="injection-history-desc" x="516" y="166">Deliberately, since that is how</text>
    <text class="injection-history-desc" x="516" y="182">prompting works.</text>
  </g>
  <line class="injection-history-line injection-history-conn injection-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#injection-history-tip)"/>
  <g class="injection-history-stage injection-history-s3">
    <rect class="injection-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="injection-history-step" x="752" y="142">04</text>
    <text class="injection-history-name" x="778" y="142">And no separation mechanism exists yet</text>
    <text class="injection-history-desc" x="752" y="166">Which is why this class remains</text>
    <text class="injection-history-desc" x="752" y="182">open.</text>
  </g>
  <text class="injection-history-sub" x="30" y="304">The absence of a separating mechanism is the whole difficulty: every earlier injection class was closed by a parser that could tell code from data, and a language model has no such boundary.</text>
</svg>
