<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, none fixable by prompting.">
  <title>Why injection works</title>
  <style>
    .injection-idea-bg   { fill: #f8fafc; }
    .injection-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .injection-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .injection-idea-stage { opacity: 1; }

    .injection-idea-s0 { animation-delay: 0.00s; }
    .injection-idea-e0 { animation-delay: 0.00s; }
    .injection-idea-s1 { animation-delay: 1.28s; }
    .injection-idea-e1 { animation-delay: 1.28s; }
    .injection-idea-s2 { animation-delay: 2.56s; }
    .injection-idea-e2 { animation-delay: 2.56s; }
    .injection-idea-s3 { animation-delay: 3.84s; }
    .injection-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .injection-idea-conn  { animation: injection-idea-trace 6.4s ease-in-out infinite; }
      .injection-idea-stage { animation: injection-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes injection-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes injection-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .injection-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .injection-idea-stage { animation: injection-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes injection-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="injection-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="injection-idea-bg" width="980" height="322"/>
  <text class="injection-idea-h1"  x="30" y="40">Why injection works</text>
  <text class="injection-idea-sub" x="30" y="64">Four steps, none fixable by prompting.</text>
  <g class="injection-idea-stage injection-idea-s0">
    <rect class="injection-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="injection-idea-step" x="44" y="142">01</text>
    <text class="injection-idea-name" x="70" y="142">Instructions and data arrive in the same channel</text>
    <text class="injection-idea-desc" x="44" y="166">As one sequence of tokens.</text>
  </g>
  <line class="injection-idea-line injection-idea-conn injection-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#injection-idea-tip)"/>
  <g class="injection-idea-stage injection-idea-s1">
    <rect class="injection-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="injection-idea-step" x="280" y="142">02</text>
    <text class="injection-idea-name" x="306" y="142">The model has no reliable way to tell them apart</text>
    <text class="injection-idea-desc" x="280" y="166">There is no privileged</text>
    <text class="injection-idea-desc" x="280" y="182">instruction path.</text>
  </g>
  <line class="injection-idea-line injection-idea-conn injection-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#injection-idea-tip)"/>
  <g class="injection-idea-stage injection-idea-s2">
    <rect class="injection-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="injection-idea-step" x="516" y="142">03</text>
    <text class="injection-idea-name" x="542" y="142">So text inside the data can read as an instruction</text>
    <text class="injection-idea-desc" x="516" y="166">And frequently will be followed.</text>
  </g>
  <line class="injection-idea-line injection-idea-conn injection-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#injection-idea-tip)"/>
  <g class="injection-idea-stage injection-idea-s3">
    <rect class="injection-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="injection-idea-step" x="752" y="142">04</text>
    <text class="injection-idea-name" x="778" y="142">Which is the same flaw as classical injection</text>
    <text class="injection-idea-desc" x="752" y="166">With no equivalent of a</text>
    <text class="injection-idea-desc" x="752" y="182">parameterised query available.</text>
  </g>
  <text class="injection-idea-sub" x="30" y="304">The absence of a parameterised-query equivalent is the honest summary of the state of the art: every current defence is mitigation, and none is a separation of channels.</text>
</svg>
