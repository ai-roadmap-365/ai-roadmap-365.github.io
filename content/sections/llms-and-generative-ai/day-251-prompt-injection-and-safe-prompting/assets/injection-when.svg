<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scaled to what the model can do.">
  <title>How much defence</title>
  <style>
    .injection-when-bg   { fill: #f8fafc; }
    .injection-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-when-row { opacity: 1; }
    .injection-when-r0 { animation-delay: 0.00s; }
    .injection-when-r1 { animation-delay: 0.45s; }
    .injection-when-r2 { animation-delay: 0.90s; }
    .injection-when-r3 { animation-delay: 1.35s; }
    .injection-when-r4 { animation-delay: 1.80s; }
    .injection-when-row { animation: injection-when-reveal 7.3s ease-in-out infinite; }
    @keyframes injection-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="injection-when-bg" width="980" height="390"/>
  <text class="injection-when-h1"  x="30" y="40">How much defence</text>
  <text class="injection-when-sub" x="30" y="64">Scaled to what the model can do.</text>
  <rect class="injection-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="injection-when-name" x="46" y="122">Lighter defences</text>
  <text class="injection-when-desc" x="46" y="142">Read-only, no tools.</text>
  <text class="injection-when-desc injection-when-row injection-when-r0" x="46" y="182">Text in, text out</text>
  <text class="injection-when-desc injection-when-row injection-when-r1" x="46" y="216">No tools and no side effects</text>
  <text class="injection-when-desc injection-when-row injection-when-r2" x="46" y="250">Output shown to one user</text>
  <text class="injection-when-desc injection-when-row injection-when-r3" x="46" y="284">Nothing acted on automatically</text>
  <text class="injection-when-desc injection-when-row injection-when-r4" x="46" y="318">Delimiters and output checks suffice</text>
  <rect class="injection-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="injection-when-name" x="526" y="122">Heavy defences</text>
  <text class="injection-when-desc" x="526" y="142">Tools and side effects.</text>
  <text class="injection-when-desc injection-when-row injection-when-r0" x="526" y="182">Any tool with write access</text>
  <text class="injection-when-desc injection-when-row injection-when-r1" x="526" y="216">Anything reading untrusted content</text>
  <text class="injection-when-desc injection-when-row injection-when-r2" x="526" y="250">Actions taken without review</text>
  <text class="injection-when-desc injection-when-row injection-when-r3" x="526" y="284">Access to other users' data</text>
  <text class="injection-when-desc injection-when-row injection-when-r4" x="526" y="318">Every layer, plus human approval</text>
  <text class="injection-when-sub" x="30" y="372">The right level follows from consequence rather than from likelihood: a system that can only produce text needs far less than one that can send an email.</text>
</svg>
