<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And why the fix does not transfer.">
  <title>The same bug, thirty years earlier</title>
  <style>
    .sql-injection-bg   { fill: #f8fafc; }
    .sql-injection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sql-injection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sql-injection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sql-injection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sql-injection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sql-injection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sql-injection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sql-injection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sql-injection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sql-injection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sql-injection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sql-injection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sql-injection-row { opacity: 1; }
    .sql-injection-r0 { animation-delay: 0.00s; }
    .sql-injection-r1 { animation-delay: 0.45s; }
    .sql-injection-r2 { animation-delay: 0.90s; }
    .sql-injection-r3 { animation-delay: 1.35s; }
    .sql-injection-r4 { animation-delay: 1.80s; }
    .sql-injection-row { animation: sql-injection-reveal 7.3s ease-in-out infinite; }
    @keyframes sql-injection-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sql-injection-bg" width="980" height="390"/>
  <text class="sql-injection-h1"  x="30" y="40">The same bug, thirty years earlier</text>
  <text class="sql-injection-sub" x="30" y="64">And why the fix does not transfer.</text>
  <rect class="sql-injection-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sql-injection-name" x="46" y="122">Classical injection</text>
  <text class="sql-injection-desc" x="46" y="142">Solved.</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r0" x="46" y="182">Input mixed into a command string</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r1" x="46" y="216">Escaped, or worse</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r2" x="46" y="250">Fixed by separating the two channels</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r3" x="46" y="284">Parameterised queries, universally</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r4" x="46" y="318">A solved problem for decades</text>
  <rect class="sql-injection-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sql-injection-name" x="526" y="122">Prompt injection</text>
  <text class="sql-injection-desc" x="526" y="142">Not solved.</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r0" x="526" y="182">Input mixed into a prompt</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r1" x="526" y="216">Delimited, imperfectly</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r2" x="526" y="250">No channel separation exists</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r3" x="526" y="284">The model interprets everything together</text>
  <text class="sql-injection-desc sql-injection-row sql-injection-r4" x="526" y="318">An open problem</text>
  <text class="sql-injection-sub" x="30" y="372">The comparison is instructive precisely because the fix does not transfer: parameterisation works because a database parser has a formal grammar, and a language model does not.</text>
</svg>
