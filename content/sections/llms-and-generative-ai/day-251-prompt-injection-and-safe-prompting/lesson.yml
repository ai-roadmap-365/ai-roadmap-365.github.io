learning_promise: 'Master the mechanics of adversarial attacks and defensive engineering in production LLMs: understand Direct Prompt Injections (jailbreaks, persona overrides, DAN variants) vs Indirect Prompt Injections (data poisoned web pages, malicious emails, markdown exfiltration payloads), master defensive architectures (Delimiter Sandboxing, Secondary Validation LLMs, Input Token Sanitization, Output Leakage Scanners, Llama Guard/NeMo Guardrails), and build an end-to-end prompt injection defense and payload sanitization firewall in Python.'
objectives:
  - 'Distinguish between Direct Prompt Injection (jailbreak) and Indirect Prompt Injection (data exfiltration).'
  - 'Implement XML delimiter sandboxing and tag escaping to prevent instruction hijacking.'
  - 'Architect multi-tiered defense-in-depth pipelines combining regex, guard models, and egress scanners.'
  - 'Mitigate Markdown image rendering exfiltration exploits in conversational interfaces.'
  - 'Build a production-grade prompt security firewall and payload validator in Python.'
