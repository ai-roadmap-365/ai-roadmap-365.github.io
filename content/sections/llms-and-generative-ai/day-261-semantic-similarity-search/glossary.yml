terms:
  - term: 'k-Nearest Neighbors (k-NN)'
    definition: 'An exact search algorithm that computes distances between a query and all corpus vectors to find the K closest items.'
  - term: 'Cosine Distance'
    definition: 'Defined as 1.0 - CosineSimilarity; a proper geometric distance metric ranging from 0.0 (identical) to 2.0 (opposite).'
  - term: 'Euclidean Distance (L2)'
    definition: 'The straight-line length of the vector difference between two coordinates in multi-dimensional space.'
  - term: 'Manhattan Distance (L1)'
    definition: 'The sum of absolute differences across all coordinates; also known as taxicab or L1 distance.'
  - term: 'Top-K Retrieval'
    definition: 'Extracting the top K highest-scoring items from a scored list without sorting the entire collection.'
  - term: 'BLAS (Basic Linear Algebra Subprograms)'
    definition: 'Low-level hardware-optimized routines for high-performance matrix and vector arithmetic.'
  - term: 'Linear Scan'
    definition: 'Iterating through every entry in a database sequentially to compute exact distance metrics.'
  - term: 'Recall'
    definition: 'The proportion of true top-K nearest neighbors successfully returned by a search algorithm.'
