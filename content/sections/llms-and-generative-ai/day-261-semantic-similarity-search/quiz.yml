questions:
  - question: 'What is the algorithmic time complexity of an exact (flat) k-NN search over N documents with embedding dimension d?'
    options:
      - 'O(N^3) cubic time'
      - 'O(1) constant time'
      - 'O(log N) logarithmic time'
      - 'O(N * d) — one dot product per document'
    answer_index: 3
    explanation: 'Exact k-NN performs an exhaustive linear scan, computing N dot products of dimension d.'
  - question: 'Why is using a bounded min-heap (heapq) superior to full sorting (argsort) for Top-K retrieval when N is large?'
    options:
      - 'A bounded heap is O(N log K) instead of O(N log N)'
      - 'Because heaps only work in Python'
      - 'Because argsort crashes on floating point numbers'
      - 'Because heaps delete the database'
    answer_index: 0
    explanation: 'When K << N, O(N log K) is significantly faster and uses minimal memory compared to full O(N log N) sorting.'
  - question: 'Under what condition is Euclidean Distance (L2) directly proportional to Cosine Distance?'
    options:
      - 'When vectors contain only positive integers'
      - 'When every vector is unit-normalised'
      - 'When the dimension is equal to 3'
      - 'Never; they are completely unrelated'
    answer_index: 1
    explanation: 'For unit vectors, ||u - v||^2 = 2 - 2*(u · v), establishing an exact monotonic equivalence.'
  - question: 'What is the performance advantage of matrix-vector multiplication (np.dot(matrix, query)) over Python for-loops in k-NN search?'
    options:
      - 'Matrix multiplication turns off the CPU fan'
      - 'Matrix multiplication uses less disk space'
      - 'Matrix multiply uses SIMD and threaded BLAS'
      - 'There is no difference'
    answer_index: 2
    explanation: 'Vectorized BLAS operations utilize hardware parallel registers and cache locality.'
  - question: 'When is exact Flat k-NN search preferred over Approximate Nearest Neighbor (HNSW) indexing?'
    options:
      - 'When vectors are text strings'
      - 'When searching across 1 billion items'
      - 'When you do not have a CPU'
      - 'Under 100k vectors, with frequent inserts and full recall'
    answer_index: 3
    explanation: 'For moderate collections (<100k vectors), flat search executes in under 2ms with zero index build time.'
