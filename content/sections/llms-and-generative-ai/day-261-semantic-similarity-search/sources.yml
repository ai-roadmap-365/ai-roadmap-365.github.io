    accessed: '2026-08-30'
    year: 2018
    description: 'Seminal paper detailing HNSW indexing structures and performance comparisons against exact linear scan.'
  - title: 'Billion-scale similarity search with GPUs'
    url: 'https://arxiv.org/abs/1702.08734'
    publisher: 'IEEE Transactions on Big Data'
    accessed: '2026-08-30'
    year: 2017
    description: 'Foundational FAISS paper describing high-performance exact and quantized vector search architectures.'
  - title: 'Introduction to Information Retrieval'
    url: 'https://nlp.stanford.edu/IR-book/'
    publisher: 'Cambridge University Press'
    accessed: '2026-08-30'
    year: 2008
    description: 'Authoritative textbook on vector space models, cosine similarity, and inverted indexing algorithms.'
