<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From terms to hybrids.">
  <title>Four steps in retrieval</title>
  <style>
    .search-history-bg   { fill: #f8fafc; }
    .search-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .search-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .search-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .search-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .search-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .search-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .search-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .search-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .search-history-stage { opacity: 1; }

    .search-history-s0 { animation-delay: 0.00s; }
    .search-history-e0 { animation-delay: 0.00s; }
    .search-history-s1 { animation-delay: 1.28s; }
    .search-history-e1 { animation-delay: 1.28s; }
    .search-history-s2 { animation-delay: 2.56s; }
    .search-history-e2 { animation-delay: 2.56s; }
    .search-history-s3 { animation-delay: 3.84s; }
    .search-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .search-history-conn  { animation: search-history-trace 6.4s ease-in-out infinite; }
      .search-history-stage { animation: search-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes search-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes search-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .search-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .search-history-stage { animation: search-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes search-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="search-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="search-history-bg" width="980" height="322"/>
  <text class="search-history-h1"  x="30" y="40">Four steps in retrieval</text>
  <text class="search-history-sub" x="30" y="64">From terms to hybrids.</text>
  <g class="search-history-stage search-history-s0">
    <rect class="search-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="search-history-step" x="44" y="142">01</text>
    <text class="search-history-name" x="70" y="142">Boolean term matching</text>
    <text class="search-history-desc" x="44" y="166">Present or absent. No ranking at</text>
    <text class="search-history-desc" x="44" y="182">all.</text>
  </g>
  <line class="search-history-line search-history-conn search-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#search-history-tip)"/>
  <g class="search-history-stage search-history-s1">
    <rect class="search-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="search-history-step" x="280" y="142">02</text>
    <text class="search-history-name" x="306" y="142">Statistical term weighting</text>
    <text class="search-history-desc" x="280" y="166">Rare terms weighted more. Ranked</text>
    <text class="search-history-desc" x="280" y="182">results, and still lexical.</text>
  </g>
  <line class="search-history-line search-history-conn search-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#search-history-tip)"/>
  <g class="search-history-stage search-history-s2">
    <rect class="search-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="search-history-step" x="516" y="142">03</text>
    <text class="search-history-name" x="542" y="142">Dense retrieval</text>
    <text class="search-history-desc" x="516" y="166">Meaning rather than terms.</text>
  </g>
  <line class="search-history-line search-history-conn search-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#search-history-tip)"/>
  <g class="search-history-stage search-history-s3">
    <rect class="search-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="search-history-step" x="752" y="142">04</text>
    <text class="search-history-name" x="778" y="142">Then both together</text>
    <text class="search-history-desc" x="752" y="166">Which beats either, and is now</text>
    <text class="search-history-desc" x="752" y="182">the default.</text>
  </g>
  <text class="search-history-sub" x="30" y="304">The return to combining lexical scoring with dense retrieval is worth noting: dense retrieval did not replace the statistical methods, it joined them.</text>
</svg>
