<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="When each is right.">
  <title>Exact search against approximate</title>
  <style>
    .exact-approximate-bg   { fill: #f8fafc; }
    .exact-approximate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-approximate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-approximate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-approximate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-approximate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-approximate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-approximate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exact-approximate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exact-approximate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exact-approximate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exact-approximate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exact-approximate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-approximate-row { opacity: 1; }
    .exact-approximate-r0 { animation-delay: 0.00s; }
    .exact-approximate-r1 { animation-delay: 0.45s; }
    .exact-approximate-r2 { animation-delay: 0.90s; }
    .exact-approximate-r3 { animation-delay: 1.35s; }
    .exact-approximate-r4 { animation-delay: 1.80s; }
    .exact-approximate-row { animation: exact-approximate-reveal 7.3s ease-in-out infinite; }
    @keyframes exact-approximate-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exact-approximate-bg" width="980" height="390"/>
  <text class="exact-approximate-h1"  x="30" y="40">Exact search against approximate</text>
  <text class="exact-approximate-sub" x="30" y="64">When each is right.</text>
  <rect class="exact-approximate-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exact-approximate-name" x="46" y="122">Exact</text>
  <text class="exact-approximate-desc" x="46" y="142">Every vector compared.</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r0" x="46" y="182">Perfect recall, by definition</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r1" x="46" y="216">Linear in corpus size</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r2" x="46" y="250">No index to build or tune</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r3" x="46" y="284">No staleness after an update</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r4" x="46" y="318">Fine to a few hundred thousand vectors</text>
  <rect class="exact-approximate-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exact-approximate-name" x="526" y="122">Approximate</text>
  <text class="exact-approximate-desc" x="526" y="142">A structure searched.</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r0" x="526" y="182">Recall below one, and tunable</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r1" x="526" y="216">Sub-linear in corpus size</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r2" x="526" y="250">An index to build, tune and maintain</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r3" x="526" y="284">Updates are awkward</text>
  <text class="exact-approximate-desc exact-approximate-row exact-approximate-r4" x="526" y="318">Necessary past a few million</text>
  <text class="exact-approximate-sub" x="30" y="372">Exact search stays fast far longer than most teams assume, and adopting an approximate index before measuring the exact one is a common source of unnecessary complexity.</text>
</svg>
