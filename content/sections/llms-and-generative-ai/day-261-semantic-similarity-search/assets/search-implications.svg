<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is quality.">
  <title>Four consequences of semantic search</title>
  <style>
    .search-implications-bg   { fill: #f8fafc; }
    .search-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .search-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .search-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .search-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .search-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .search-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .search-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .search-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .search-implications-stage { opacity: 1; }

    .search-implications-s0 { animation-delay: 0.00s; }
    .search-implications-e0 { animation-delay: 0.00s; }
    .search-implications-s1 { animation-delay: 1.28s; }
    .search-implications-e1 { animation-delay: 1.28s; }
    .search-implications-s2 { animation-delay: 2.56s; }
    .search-implications-e2 { animation-delay: 2.56s; }
    .search-implications-s3 { animation-delay: 3.84s; }
    .search-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .search-implications-conn  { animation: search-implications-trace 6.4s ease-in-out infinite; }
      .search-implications-stage { animation: search-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes search-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes search-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .search-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .search-implications-stage { animation: search-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes search-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="search-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="search-implications-bg" width="980" height="322"/>
  <text class="search-implications-h1"  x="30" y="40">Four consequences of semantic search</text>
  <text class="search-implications-sub" x="30" y="64">One is quality.</text>
  <g class="search-implications-stage search-implications-s0">
    <rect class="search-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="search-implications-step" x="44" y="142">01</text>
    <text class="search-implications-name" x="70" y="142">Recall improves greatly over keywords</text>
    <text class="search-implications-desc" x="44" y="166">Questions no longer have to use</text>
    <text class="search-implications-desc" x="44" y="182">the document's words.</text>
  </g>
  <line class="search-implications-line search-implications-conn search-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#search-implications-tip)"/>
  <g class="search-implications-stage search-implications-s1">
    <rect class="search-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="search-implications-step" x="280" y="142">02</text>
    <text class="search-implications-name" x="306" y="142">But every query costs an embedding call</text>
    <text class="search-implications-desc" x="280" y="166">Plus the search itself.</text>
  </g>
  <line class="search-implications-line search-implications-conn search-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#search-implications-tip)"/>
  <g class="search-implications-stage search-implications-s2">
    <rect class="search-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="search-implications-step" x="516" y="142">03</text>
    <text class="search-implications-name" x="542" y="142">And latency is added before the model even starts</text>
    <text class="search-implications-desc" x="516" y="166">Which the user experiences as</text>
    <text class="search-implications-desc" x="516" y="182">slowness.</text>
  </g>
  <line class="search-implications-line search-implications-conn search-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#search-implications-tip)"/>
  <g class="search-implications-stage search-implications-s3">
    <rect class="search-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="search-implications-step" x="752" y="142">04</text>
    <text class="search-implications-name" x="778" y="142">While retrieval quality caps answer quality</text>
    <text class="search-implications-desc" x="752" y="166">A passage not retrieved cannot</text>
    <text class="search-implications-desc" x="752" y="182">be used.</text>
  </g>
  <text class="search-implications-sub" x="30" y="304">The ceiling is the important one: when a retrieval system gives bad answers, the fault is usually in what was retrieved rather than in how it was prompted.</text>
</svg>
