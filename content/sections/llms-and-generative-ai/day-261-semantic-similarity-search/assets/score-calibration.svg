<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four consequences.">
  <title>Similarity scores are not probabilities</title>
  <style>
    .score-calibration-bg   { fill: #f8fafc; }
    .score-calibration-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .score-calibration-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .score-calibration-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .score-calibration-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .score-calibration-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .score-calibration-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .score-calibration-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .score-calibration-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .score-calibration-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .score-calibration-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .score-calibration-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .score-calibration-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .score-calibration-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .score-calibration-stage { opacity: 1; }

    .score-calibration-s0 { animation-delay: 0.00s; }
    .score-calibration-e0 { animation-delay: 0.00s; }
    .score-calibration-s1 { animation-delay: 1.28s; }
    .score-calibration-e1 { animation-delay: 1.28s; }
    .score-calibration-s2 { animation-delay: 2.56s; }
    .score-calibration-e2 { animation-delay: 2.56s; }
    .score-calibration-s3 { animation-delay: 3.84s; }
    .score-calibration-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .score-calibration-conn  { animation: score-calibration-trace 6.4s ease-in-out infinite; }
      .score-calibration-stage { animation: score-calibration-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes score-calibration-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes score-calibration-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .score-calibration-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .score-calibration-stage { animation: score-calibration-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes score-calibration-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="score-calibration-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="score-calibration-bg" width="980" height="322"/>
  <text class="score-calibration-h1"  x="30" y="40">Similarity scores are not probabilities</text>
  <text class="score-calibration-sub" x="30" y="64">Four consequences.</text>
  <g class="score-calibration-stage score-calibration-s0">
    <rect class="score-calibration-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="score-calibration-step" x="44" y="142">01</text>
    <text class="score-calibration-name" x="70" y="142">A score of 0.8 means nothing on its own</text>
    <text class="score-calibration-desc" x="44" y="166">It is not a probability of</text>
    <text class="score-calibration-desc" x="44" y="182">relevance.</text>
  </g>
  <line class="score-calibration-line score-calibration-conn score-calibration-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#score-calibration-tip)"/>
  <g class="score-calibration-stage score-calibration-s1">
    <rect class="score-calibration-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="score-calibration-step" x="280" y="142">02</text>
    <text class="score-calibration-name" x="306" y="142">And its distribution differs per model</text>
    <text class="score-calibration-desc" x="280" y="166">So a threshold tuned for one is</text>
    <text class="score-calibration-desc" x="280" y="182">wrong for another.</text>
  </g>
  <line class="score-calibration-line score-calibration-conn score-calibration-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#score-calibration-tip)"/>
  <g class="score-calibration-stage score-calibration-s2">
    <rect class="score-calibration-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="score-calibration-step" x="516" y="142">03</text>
    <text class="score-calibration-name" x="542" y="142">Calibrate against labelled examples</text>
    <text class="score-calibration-desc" x="516" y="166">To find where relevance actually</text>
    <text class="score-calibration-desc" x="516" y="182">falls off.</text>
  </g>
  <line class="score-calibration-line score-calibration-conn score-calibration-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#score-calibration-tip)"/>
  <g class="score-calibration-stage score-calibration-s3">
    <rect class="score-calibration-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="score-calibration-step" x="752" y="142">04</text>
    <text class="score-calibration-name" x="778" y="142">Or use rank rather than score</text>
    <text class="score-calibration-desc" x="752" y="166">Take the top few, and let a</text>
    <text class="score-calibration-desc" x="752" y="182">reranker decide.</text>
  </g>
  <text class="score-calibration-sub" x="30" y="304">Preferring rank to absolute score removes a whole class of silent failure, because a threshold that was right for one embedding model will not survive changing it.</text>
</svg>
