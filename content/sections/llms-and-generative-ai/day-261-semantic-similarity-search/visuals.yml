visuals:
  - id: vector-distance-metrics-geometric-comparison
    file: assets/vector-distance-metrics-geometric-comparison.svg
    type: diagram
    title: 'Vector Distance Metrics Geometric Comparison'
    alt: Vector distance metrics geometric comparison diagram
    description: 'Geometric comparison of Cosine Similarity, Euclidean Distance (L2), and Dot Product on dense vector tensors.'
  - id: exact-knn-vs-ann-search-traversal
    file: assets/exact-knn-vs-ann-search-traversal.svg
    type: diagram
    title: 'Exact k-NN vs Approximate Nearest Neighbors'
    alt: Exact KNN vs Approximate Nearest Neighbor search diagram
    description: 'Comparing Flat linear scan exhaustive search with indexed logarithmic Approximate Nearest Neighbor retrieval.'
  - id: similarity-metrics
    file: assets/similarity-metrics.svg
    type: diagram
    title: 'Three ways to measure closeness'
    alt: 'Diagram: three distance metrics for comparing embedding vectors'
    description: 'A three-stage description of similarity metrics covering angular similarity, Euclidean distance and the inner product.'
  - id: topk
    file: assets/topk.svg
    type: diagram
    title: 'Finding the nearest few'
    alt: 'Diagram: how the nearest neighbours are extracted from a similarity computation'
    description: 'A four-stage description of top-k retrieval covering the comparison, the scores, selection and the sort.'
  - id: exact-approximate
    file: assets/exact-approximate.svg
    type: diagram
    title: 'Exact search against approximate'
    alt: 'Diagram: exact nearest-neighbour search compared with approximate search'
    description: 'A two-column comparison of exact and approximate nearest neighbour search.'
  - id: score-calibration
    file: assets/score-calibration.svg
    type: diagram
    title: 'Similarity scores are not probabilities'
    alt: 'Diagram: why raw similarity scores cannot be used as absolute thresholds'
    description: 'A four-stage description of score calibration covering the raw score, its model dependence, the calibration and the alternative.'
  - id: library-search
    file: assets/library-search.svg
    type: diagram
    title: 'A card catalogue, or a librarian'
    alt: 'Diagram: catalogue lookup compared with a librarian who understands the question'
    description: 'A two-column comparison of exact catalogue matching against understanding a request.'
  - id: search-implications
    file: assets/search-implications.svg
    type: diagram
    title: 'Four consequences of semantic search'
    alt: 'Diagram: the recall, cost, latency and quality-ceiling implications of similarity search'
    description: 'A four-stage description of search implications covering improved recall, compute cost, latency and the ceiling it places on answers.'
  - id: search-when
    file: assets/search-when.svg
    type: diagram
    title: 'When exact search is enough'
    alt: 'Diagram: when exact similarity search suffices and when an index is required'
    description: 'A two-column comparison of exact search against indexed approximate search.'
  - id: batch-search
    file: assets/batch-search.svg
    type: diagram
    title: 'Why search is a matrix multiplication'
    alt: 'Diagram: how similarity search is expressed as a single matrix operation'
    description: 'A four-stage description of vectorised search covering the naive loop, the matrix formulation, optimised libraries and batched queries.'
  - id: search-history
    file: assets/search-history.svg
    type: diagram
    title: 'Four steps in retrieval'
    alt: 'Diagram: the historical progression of information retrieval methods'
    description: 'A four-stage description of retrieval history covering boolean matching, statistical ranking, dense retrieval and hybrid systems.'
