learning_promise: 'Master geometric similarity metrics and exact nearest-neighbor search algorithms: implement Cosine Similarity, Dot Product, Euclidean Distance (L2), and Manhattan Distance (L1), analyze normalized vector equivalence proofs, examine time-complexity scaling (O(N * d)), and build a high-performance vector search engine with Top-K heap filtering in Python.'
objectives:
  - 'Differentiate between Cosine Similarity, Euclidean Distance, Dot Product, and Manhattan Distance.'
  - 'Prove mathematically why dot product equals cosine similarity on unit-normalized vectors.'
  - 'Implement an exact k-NN search engine using vectorized matrix multiplications in NumPy.'
  - 'Optimize Top-K retrieval using bounded min-heaps (heapq) to avoid O(N log N) full sorting.'
  - 'Measure search latency scaling across vector collection sizes from 1k to 100k items.'
