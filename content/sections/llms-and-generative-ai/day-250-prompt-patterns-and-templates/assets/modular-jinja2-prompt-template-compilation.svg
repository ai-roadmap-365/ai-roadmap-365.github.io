<svg role="img" aria-label="Modular Jinja2 prompt compilation diagram showing base template inheritance and partial component composition" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Modular Jinja2 Prompt Compilation Pipeline</title>
  <defs>
    <linearGradient id="bg250b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card250b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg250b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MODULAR PROMPT TEMPLATING &amp; INHERITANCE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Composing Base Templates, Reusable Partials, and Dynamic Parameters into Cached Prompts</text>
  <g transform="translate(55, 85)">
    <rect width="740" height="295" fill="url(#card250b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Component Partials -->
    <rect x="25" y="25" width="210" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="130" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Reusable Partials</text>
    <rect x="35" y="70" width="190" height="40" fill="#1e293b" rx="4"/>
    <text x="45" y="93" fill="#fbbf24" font-size="8">_safety_shell.j2</text>
    <rect x="35" y="120" width="190" height="40" fill="#1e293b" rx="4"/>
    <text x="45" y="143" fill="#34d399" font-size="8">_json_schema.j2</text>
    <rect x="35" y="170" width="190" height="40" fill="#1e293b" rx="4"/>
    <text x="45" y="193" fill="#c084fc" font-size="8">_few_shot_pool.j2</text>
    <text x="130" y="245" fill="#94a3b8" font-size="8" text-anchor="middle">DRY Architecture</text>

    <!-- Jinja2 Template Compiler -->
    <rect x="265" y="25" width="210" height="245" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="370" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Jinja2 Compilation Engine</text>
    <text x="275" y="80" fill="#cbd5e1" font-size="8">{% raw %}{% extends "base.j2" %}{% endraw %}</text>
    <text x="275" y="105" fill="#cbd5e1" font-size="8">{% raw %}{% include "_safety.j2" %}{% endraw %}</text>
    <text x="275" y="130" fill="#cbd5e1" font-size="8">{% raw %}{{ query | trim }}{% endraw %}</text>
    <rect x="275" y="155" width="190" height="95" fill="#1e293b" rx="4"/>
    <text x="370" y="180" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Compile-Time Linting</text>
    <text x="285" y="205" fill="#cbd5e1" font-size="7">• Type check parameters</text>
    <text x="285" y="225" fill="#cbd5e1" font-size="7">• Enforce XML delimiter pairs</text>

    <!-- Final Output Prompt -->
    <rect x="505" y="25" width="210" height="245" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="610" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">3. Compiled Production Prompt</text>
    <rect x="515" y="70" width="190" height="60" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="525" y="90" fill="#38bdf8" font-size="7">&lt;system_guardrails&gt;...</text>
    <text x="525" y="110" fill="#94a3b8" font-size="7">Prefix Cache Eligible (0ms)</text>
    <rect x="515" y="140" width="190" height="60" fill="#1e293b" stroke="#34d399" rx="4"/>
    <text x="525" y="160" fill="#34d399" font-size="7">&lt;user_task&gt;...</text>
    <text x="525" y="180" fill="#94a3b8" font-size="7">Dynamic Runtime Payload</text>
    <text x="610" y="245" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">100% Deterministic Output</text>
  </g>
</svg>
