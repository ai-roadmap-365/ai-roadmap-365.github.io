<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A parameter that becomes an instruction.">
  <title>Template injection</title>
  <style>
    .template-injection-bg   { fill: #f8fafc; }
    .template-injection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-injection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-injection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-injection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-injection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-injection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .template-injection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .template-injection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .template-injection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .template-injection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .template-injection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .template-injection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .template-injection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .template-injection-stage { opacity: 1; }

    .template-injection-s0 { animation-delay: 0.00s; }
    .template-injection-e0 { animation-delay: 0.00s; }
    .template-injection-s1 { animation-delay: 1.28s; }
    .template-injection-e1 { animation-delay: 1.28s; }
    .template-injection-s2 { animation-delay: 2.56s; }
    .template-injection-e2 { animation-delay: 2.56s; }
    .template-injection-s3 { animation-delay: 3.84s; }
    .template-injection-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .template-injection-conn  { animation: template-injection-trace 6.4s ease-in-out infinite; }
      .template-injection-stage { animation: template-injection-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes template-injection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes template-injection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .template-injection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .template-injection-stage { animation: template-injection-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes template-injection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="template-injection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="template-injection-bg" width="980" height="322"/>
  <text class="template-injection-h1"  x="30" y="40">Template injection</text>
  <text class="template-injection-sub" x="30" y="64">A parameter that becomes an instruction.</text>
  <g class="template-injection-stage template-injection-s0">
    <rect class="template-injection-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="template-injection-step" x="44" y="142">01</text>
    <text class="template-injection-name" x="70" y="142">A template has a placeholder for user input</text>
    <text class="template-injection-desc" x="44" y="166">Filled at request time.</text>
  </g>
  <line class="template-injection-line template-injection-conn template-injection-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#template-injection-tip)"/>
  <g class="template-injection-stage template-injection-s1">
    <rect class="template-injection-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="template-injection-step" x="280" y="142">02</text>
    <text class="template-injection-name" x="306" y="142">The user supplies text that closes the section</text>
    <text class="template-injection-desc" x="280" y="166">And opens a new instruction.</text>
  </g>
  <line class="template-injection-line template-injection-conn template-injection-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#template-injection-tip)"/>
  <g class="template-injection-stage template-injection-s2">
    <rect class="template-injection-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="template-injection-step" x="516" y="142">03</text>
    <text class="template-injection-name" x="542" y="142">Which the model may follow</text>
    <text class="template-injection-desc" x="516" y="166">Because it now reads as part of</text>
    <text class="template-injection-desc" x="516" y="182">the prompt.</text>
  </g>
  <line class="template-injection-line template-injection-conn template-injection-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#template-injection-tip)"/>
  <g class="template-injection-stage template-injection-s3">
    <rect class="template-injection-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="template-injection-step" x="752" y="142">04</text>
    <text class="template-injection-name" x="778" y="142">So escape delimiters and validate every parameter</text>
    <text class="template-injection-desc" x="752" y="166">And never render user text as</text>
    <text class="template-injection-desc" x="752" y="182">template source.</text>
  </g>
  <text class="template-injection-sub" x="30" y="304">Rendering user input as template source is the severe version of this: it moves the problem from prompt injection to arbitrary template execution, which is a far worse outcome.</text>
</svg>
