<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Why templates rather than strings</title>
  <style>
    .templates-idea-bg   { fill: #f8fafc; }
    .templates-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .templates-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .templates-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .templates-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .templates-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .templates-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .templates-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .templates-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .templates-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .templates-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .templates-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .templates-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .templates-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .templates-idea-stage { opacity: 1; }

    .templates-idea-s0 { animation-delay: 0.00s; }
    .templates-idea-e0 { animation-delay: 0.00s; }
    .templates-idea-s1 { animation-delay: 1.28s; }
    .templates-idea-e1 { animation-delay: 1.28s; }
    .templates-idea-s2 { animation-delay: 2.56s; }
    .templates-idea-e2 { animation-delay: 2.56s; }
    .templates-idea-s3 { animation-delay: 3.84s; }
    .templates-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .templates-idea-conn  { animation: templates-idea-trace 6.4s ease-in-out infinite; }
      .templates-idea-stage { animation: templates-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes templates-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes templates-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .templates-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .templates-idea-stage { animation: templates-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes templates-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="templates-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="templates-idea-bg" width="980" height="322"/>
  <text class="templates-idea-h1"  x="30" y="40">Why templates rather than strings</text>
  <text class="templates-idea-sub" x="30" y="64">Four reasons.</text>
  <g class="templates-idea-stage templates-idea-s0">
    <rect class="templates-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="templates-idea-step" x="44" y="142">01</text>
    <text class="templates-idea-name" x="70" y="142">Separate the prompt from the code</text>
    <text class="templates-idea-desc" x="44" y="166">So it can be reviewed as text,</text>
    <text class="templates-idea-desc" x="44" y="182">by people who are not engineers.</text>
  </g>
  <line class="templates-idea-line templates-idea-conn templates-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#templates-idea-tip)"/>
  <g class="templates-idea-stage templates-idea-s1">
    <rect class="templates-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="templates-idea-step" x="280" y="142">02</text>
    <text class="templates-idea-name" x="306" y="142">Compose shared fragments</text>
    <text class="templates-idea-desc" x="280" y="166">One safety block, included</text>
    <text class="templates-idea-desc" x="280" y="182">everywhere.</text>
  </g>
  <line class="templates-idea-line templates-idea-conn templates-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#templates-idea-tip)"/>
  <g class="templates-idea-stage templates-idea-s2">
    <rect class="templates-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="templates-idea-step" x="516" y="142">03</text>
    <text class="templates-idea-name" x="542" y="142">Test them in isolation</text>
    <text class="templates-idea-desc" x="516" y="166">Rendering with known inputs and</text>
    <text class="templates-idea-desc" x="516" y="182">asserting the result.</text>
  </g>
  <line class="templates-idea-line templates-idea-conn templates-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#templates-idea-tip)"/>
  <g class="templates-idea-stage templates-idea-s3">
    <rect class="templates-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="templates-idea-step" x="752" y="142">04</text>
    <text class="templates-idea-name" x="778" y="142">And version them independently</text>
    <text class="templates-idea-desc" x="752" y="166">Which makes rollback a</text>
    <text class="templates-idea-desc" x="752" y="182">deployment rather than a</text>
    <text class="templates-idea-desc" x="752" y="198">rewrite.</text>
    <text class="templates-idea-edge" x="752" y="242">engineering</text>
  </g>
  <text class="templates-idea-sub" x="30" y="304">The shared-fragment case is the strongest argument in a real codebase: without it, a safety rule has to be updated in a dozen places and will be updated in eleven.</text>
</svg>
