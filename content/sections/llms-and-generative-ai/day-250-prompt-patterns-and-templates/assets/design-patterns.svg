<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Named solutions to recurring problems.">
  <title>Design patterns</title>
  <style>
    .design-patterns-bg   { fill: #f8fafc; }
    .design-patterns-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-patterns-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-patterns-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-patterns-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-patterns-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-patterns-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-patterns-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .design-patterns-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .design-patterns-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .design-patterns-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .design-patterns-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .design-patterns-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-patterns-row { opacity: 1; }
    .design-patterns-r0 { animation-delay: 0.00s; }
    .design-patterns-r1 { animation-delay: 0.45s; }
    .design-patterns-r2 { animation-delay: 0.90s; }
    .design-patterns-r3 { animation-delay: 1.35s; }
    .design-patterns-r4 { animation-delay: 1.80s; }
    .design-patterns-row { animation: design-patterns-reveal 7.3s ease-in-out infinite; }
    @keyframes design-patterns-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="design-patterns-bg" width="980" height="390"/>
  <text class="design-patterns-h1"  x="30" y="40">Design patterns</text>
  <text class="design-patterns-sub" x="30" y="64">Named solutions to recurring problems.</text>
  <rect class="design-patterns-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="design-patterns-name" x="46" y="122">Solving it fresh</text>
  <text class="design-patterns-desc" x="46" y="142">Every time.</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r0" x="46" y="182">Each problem approached from nothing</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r1" x="46" y="216">No shared vocabulary</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r2" x="46" y="250">The same mistakes rediscovered</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r3" x="46" y="284">Hard to review someone else's work</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r4" x="46" y="318">Quality varies by author</text>
  <rect class="design-patterns-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="design-patterns-name" x="526" y="122">Applying a pattern</text>
  <text class="design-patterns-desc" x="526" y="142">A known solution.</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r0" x="526" y="182">A named structure that has worked before</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r1" x="526" y="216">Shared vocabulary in the team</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r2" x="526" y="250">Known trade-offs, documented</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r3" x="526" y="284">Reviewable against the pattern</text>
  <text class="design-patterns-desc design-patterns-row design-patterns-r4" x="526" y="318">Consistent quality</text>
  <text class="design-patterns-sub" x="30" y="372">The vocabulary is most of the value in both settings: being able to say which pattern a prompt uses makes a review a discussion rather than a matter of taste.</text>
</svg>
