<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Borrowed from software.">
  <title>Four steps toward prompt patterns</title>
  <style>
    .pattern-history-bg   { fill: #f8fafc; }
    .pattern-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pattern-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pattern-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pattern-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pattern-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pattern-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pattern-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pattern-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pattern-history-stage { opacity: 1; }

    .pattern-history-s0 { animation-delay: 0.00s; }
    .pattern-history-e0 { animation-delay: 0.00s; }
    .pattern-history-s1 { animation-delay: 1.28s; }
    .pattern-history-e1 { animation-delay: 1.28s; }
    .pattern-history-s2 { animation-delay: 2.56s; }
    .pattern-history-e2 { animation-delay: 2.56s; }
    .pattern-history-s3 { animation-delay: 3.84s; }
    .pattern-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pattern-history-conn  { animation: pattern-history-trace 6.4s ease-in-out infinite; }
      .pattern-history-stage { animation: pattern-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pattern-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pattern-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pattern-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pattern-history-stage { animation: pattern-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pattern-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pattern-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pattern-history-bg" width="980" height="322"/>
  <text class="pattern-history-h1"  x="30" y="40">Four steps toward prompt patterns</text>
  <text class="pattern-history-sub" x="30" y="64">Borrowed from software.</text>
  <g class="pattern-history-stage pattern-history-s0">
    <rect class="pattern-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-history-step" x="44" y="142">01</text>
    <text class="pattern-history-name" x="70" y="142">Tips traded informally</text>
    <text class="pattern-history-desc" x="44" y="166">Screenshots and forum posts.</text>
    <text class="pattern-history-desc" x="44" y="182">Nothing reusable.</text>
  </g>
  <line class="pattern-history-line pattern-history-conn pattern-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pattern-history-tip)"/>
  <g class="pattern-history-stage pattern-history-s1">
    <rect class="pattern-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-history-step" x="280" y="142">02</text>
    <text class="pattern-history-name" x="306" y="142">Catalogued and named patterns</text>
    <text class="pattern-history-desc" x="280" y="166">Which gave teams a shared</text>
    <text class="pattern-history-desc" x="280" y="182">vocabulary.</text>
  </g>
  <line class="pattern-history-line pattern-history-conn pattern-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pattern-history-tip)"/>
  <g class="pattern-history-stage pattern-history-s2">
    <rect class="pattern-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-history-step" x="516" y="142">03</text>
    <text class="pattern-history-name" x="542" y="142">Template libraries in frameworks</text>
    <text class="pattern-history-desc" x="516" y="166">Composable, parameterised,</text>
    <text class="pattern-history-desc" x="516" y="182">versioned.</text>
  </g>
  <line class="pattern-history-line pattern-history-conn pattern-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pattern-history-tip)"/>
  <g class="pattern-history-stage pattern-history-s3">
    <rect class="pattern-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-history-step" x="752" y="142">04</text>
    <text class="pattern-history-name" x="778" y="142">And prompts released like code</text>
    <text class="pattern-history-desc" x="752" y="166">Reviewed, evaluated and rolled</text>
    <text class="pattern-history-desc" x="752" y="182">back by version.</text>
  </g>
  <text class="pattern-history-sub" x="30" y="304">The whole progression is borrowed from software practice a few decades earlier, which is a reasonable guide to where it goes next.</text>
</svg>
