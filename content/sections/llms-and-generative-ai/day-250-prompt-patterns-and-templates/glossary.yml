terms:
  - term: 'Prompt Pattern'
    definition: 'A reusable, battle-tested structural solution to a recurring prompt engineering challenge.'
  - term: 'Persona-Context-Task (PCT)'
    definition: 'A foundational prompt pattern that specifies the assistant persona, situational context, and explicit task.'
  - term: 'Directional Stimulus Prompting'
    definition: 'A technique that injects concise semantic hints or keywords into the context to steer model generation.'
  - term: 'Flipped Interaction Pattern'
    definition: 'Directing the AI to ask the user clarifying questions one at a time until sufficient information is collected.'
  - term: 'Meta-Prompting'
    definition: 'Using an LLM to generate, refine, and orchestrate specialized prompts for itself or sub-agents.'
  - term: 'Template Inheritance'
    definition: 'Extending a base prompt template with specialized child blocks (such as domain safety rules or specific output schemas).'
  - term: 'Partial Component'
    definition: 'A modular, reusable snippet of a prompt (e.g. _safety.j2) included across multiple templates.'
  - term: 'Template Parameterization'
    definition: 'Injecting dynamic variables into typed placeholder slots within a static prompt scaffold.'
