questions:
  - question: 'What is the Flipped Interaction prompt pattern (White et al.)?'
    options:
      - 'A pattern where the LLM is instructed to ask the user a series of focused, sequential questions (one at a time) to gather all missing constraints and context before executing the requested task'
      - 'A technique where the model output is flipped upside down'
      - 'A method to reverse the order of transformer layers'
      - 'An algorithm that flips binary bits in GPU memory'
    answer_index: 0
    explanation: 'Flipped interaction turns the model into an active interviewer, systematically resolving ambiguity before generation.'
  - question: 'What is Directional Stimulus Prompting (Li et al.)?'
    options:
      - 'Injecting a small, targeted hint, keyword, or summary snippet into the prompt context to guide the model attention heads toward specific desired concepts without micromanaging every generation token'
      - 'Pointing the GPU server in a specific magnetic direction'
      - 'Using directional arrows in Markdown text'
      - 'Increasing GPU voltage during inference'
    answer_index: 0
    explanation: 'Directional stimulus provides concise semantic steering hints that guide the focus of attention.'
  - question: 'What is Meta-Prompting?'
    options:
      - 'Using an advanced LLM as a meta-engineer to generate, evaluate, critique, and optimize prompt templates for other models or downstream tasks'
      - 'Running a model on Facebook servers'
      - 'Writing a prompt in HTML metadata tags'
      - 'A prompt that is longer than 10,000 words'
    answer_index: 0
    explanation: 'Meta-prompting leverages LLMs to systematically construct and refine prompts through automated feedback loops.'
  - question: 'Why is modular template inheritance (using engines like Jinja2) superior to ad-hoc Python f-string concatenation for enterprise prompt management?'
    options:
      - 'Jinja2 allows reusable partial components (safety shells, JSON schemas, few-shot pools) to be shared across hundreds of prompts, supports template inheritance (extends/include), and separates prompt text from application code for independent versioning and testing'
      - 'Because f-strings cannot contain numbers'
      - 'Because Jinja2 runs directly on GPU CUDA cores'
      - 'Because Python f-strings are forbidden in production'
    answer_index: 0
    explanation: 'Template engines provide DRY modularity, inheritance, and clean separation between prompts and Python business logic.'
  - question: 'How do template engines prevent prompt injection when rendering untrusted user variables into prompt slots?'
    options:
      - 'By enforcing strict parameter escaping, stripping forbidden delimiter tags (e.g. </user_data>), and encapsulating all dynamic variables inside designated XML sandboxes'
      - 'By converting all text to uppercase'
      - 'By deleting all vowels from user inputs'
      - 'By blocking user inputs longer than 10 characters'
    answer_index: 0
    explanation: 'Strict parameter sanitization and tag escaping prevent user inputs from breaking out of delimiter boundaries.'
