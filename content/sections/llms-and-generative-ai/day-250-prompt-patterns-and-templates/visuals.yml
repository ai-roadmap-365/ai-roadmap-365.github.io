visuals:
  - id: catalog-of-prompt-design-patterns
    file: assets/catalog-of-prompt-design-patterns.svg
    type: diagram
    title: 'Catalog of Prompt Design Patterns'
    alt: Taxonomy of core prompt design patterns including Persona-Context-Task, Directional Stimulus, Flipped Interaction, and Meta-Prompting
    description: 'Overview of cataloged prompt patterns: Persona-Context-Task, Directional Stimulus, Flipped Interaction, and Meta-Prompting.'
  - id: modular-jinja2-prompt-template-compilation
    file: assets/modular-jinja2-prompt-template-compilation.svg
    type: diagram
    title: 'Modular Jinja2 Prompt Compilation Pipeline'
    alt: Modular Jinja2 prompt compilation diagram showing base template inheritance and partial component composition
    description: 'How modular Jinja2 templates combine partial components and dynamic runtime variables into cached production prompts.'
  - id: pattern-catalog
    file: assets/pattern-catalog.svg
    type: diagram
    title: 'Four core prompt patterns'
    alt: 'Diagram: four recurring prompt patterns and what each is for'
    description: 'A four-stage description of prompt patterns covering persona, recipe, flipped interaction and output automation.'
  - id: templates-idea
    file: assets/templates-idea.svg
    type: diagram
    title: 'Why templates rather than strings'
    alt: 'Diagram: the four benefits of managing prompts as templates'
    description: 'A four-stage description of prompt templating covering separation, composition, testing and versioning.'
  - id: template-injection
    file: assets/template-injection.svg
    type: diagram
    title: 'Template injection'
    alt: 'Diagram: how unsanitised template parameters allow instruction injection'
    description: 'A four-stage description of template injection covering the placeholder, hostile input, the resulting instruction and the defences.'
  - id: cognitive-verifier
    file: assets/cognitive-verifier.svg
    type: diagram
    title: 'The verifier pattern'
    alt: 'Diagram: how the verifier pattern decomposes a question before answering it'
    description: 'A four-stage description of the verifier pattern covering the vague question, decomposition, sub-answers and the assembled response.'
  - id: design-patterns
    file: assets/design-patterns.svg
    type: diagram
    title: 'Design patterns'
    alt: 'Diagram: ad hoc solutions compared with named reusable patterns'
    description: 'A two-column comparison of solving each problem from scratch against applying named patterns.'
  - id: pattern-implications
    file: assets/pattern-implications.svg
    type: diagram
    title: 'Four consequences of pattern-based prompting'
    alt: 'Diagram: the consistency, maintenance, security and rigidity implications of prompt patterns'
    description: 'A four-stage description of pattern implications covering consistency, maintenance, injection surface and over-abstraction.'
  - id: pattern-when
    file: assets/pattern-when.svg
    type: diagram
    title: 'When to formalise patterns'
    alt: 'Diagram: when formal prompt patterns and templates are warranted'
    description: 'A two-column comparison of situations warranting formal prompt templating against simpler cases.'
  - id: template-ci
    file: assets/template-ci.svg
    type: diagram
    title: 'Linting a prompt template'
    alt: 'Diagram: the four automated checks applied to prompt templates in continuous integration'
    description: 'A four-stage description of template validation covering syntax, variable coverage, rendered length and evaluation.'
  - id: pattern-history
    file: assets/pattern-history.svg
    type: diagram
    title: 'Four steps toward prompt patterns'
    alt: 'Diagram: the historical progression of prompt reuse practice'
    description: 'A four-stage description of prompt pattern history covering shared tips, catalogued patterns, template libraries and evaluated prompt releases.'
  - id: pattern-vs-tuning
    file: assets/pattern-vs-tuning.svg
    type: diagram
    title: 'Patterns against tuned phrasing'
    alt: 'Diagram: structural prompt patterns compared with model-specific tuned wording'
    description: 'A two-column comparison of structural patterns against phrasing tuned to one model.'
