questions:
  - question: 'What are the 6 canonical architectural components of a production-grade LLM prompt?'
    options:
      - '1. Username, 2. Password, 3. Database URL, 4. Port, 5. Host, 6. SSL Key'
      - '1. Header, 2. Body, 3. Footer, 4. CSS, 5. HTML, 6. JavaScript'
      - 'Role, context, input, steps, constraints, output schema'
      - '1. Temperature, 2. Top-p, 3. Top-k, 4. Frequency Penalty, 5. Max Tokens, 6. Stop Sequence'
    answer_index: 2
    explanation: 'The 6 canonical components structure the prompt to maximize steering fidelity and deterministic output parsing.'
  - question: 'Why are structured XML tags (e.g. <context>, <document>, <instructions>) preferred over raw plain text when formatting complex prompts?'
    options:
      - 'Because XML tags speed up GPU arithmetic cores'
      - 'Because XML tags compress prompt tokens by 50%'
      - 'Because Python requires XML to parse strings'
      - 'Tags separate untrusted input from instructions'
    answer_index: 3
    explanation: 'XML delimiters provide clean structural encapsulation, isolating untrusted payloads and sharpening attention focus.'
  - question: 'Why do negative constraints (e.g. "Do not mention competitors") frequently fail in naive zero-shot prompts, and how should they be reframed?'
    options:
      - 'Naming the forbidden thing makes it more likely'
      - 'Negative constraints are illegal in Python'
      - 'Models only understand uppercase letters'
      - 'Negative constraints disable GPU tensor cores'
    answer_index: 0
    explanation: 'Mentioning forbidden words primes the attention mechanism; affirmative framing directs generation cleanly.'
  - question: 'Where in a long prompt should the most critical formatting and execution constraints be placed to maximize compliance?'
    options:
      - 'Buried in the middle of paragraph 14'
      - 'At the very end, just before generation'
      - 'In a separate text file that is not passed to the API'
      - 'Randomly interspersed between words'
    answer_index: 1
    explanation: 'Attention heads exhibit strong recency bias towards tokens placed at the end of the context window.'
  - question: 'What is the role of explicit conversational preamble suppression in production API prompts?'
    options:
      - 'Reducing the font size of the web browser'
      - 'Making the assistant appear rude to save electricity'
      - 'So the output starts directly with the schema'
      - 'Disabling HTTP network handshakes'
    answer_index: 2
    explanation: 'Preamble suppression ensures the model output starts directly with the valid JSON delimiter, preventing parser crashes.'
