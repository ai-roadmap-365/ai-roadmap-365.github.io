terms:
  - term: 'Prompt Engineering'
    definition: 'The systematic practice of structuring, parameterizing, and constraining input text to guide LLM attention towards desired, deterministic behaviors.'
  - term: 'Delimiter Sandboxing'
    definition: 'Using unambiguous boundary markers (such as XML tags <doc>...</doc> or triple backticks) to encapsulate input data separate from instructions.'
  - term: 'Positive Framing'
    definition: 'Instructing a model with explicit affirmative actions (what to do) rather than negative prohibitions (what not to do).'
  - term: 'Preamble Suppression'
    definition: 'Prompt directives commanding the model to eliminate conversational filler (e.g. Sure, here is...) and output raw data immediately.'
  - term: 'Recency Bias'
    definition: 'The mathematical tendency of Transformer attention heads to allocate higher weight to instructions placed near the end of the prompt.'
  - term: 'Prompt Template'
    definition: 'A parameterized text scaffold with placeholder variables that compiles dynamic inputs into a structured production prompt.'
  - term: 'Instruction Bleed'
    definition: 'A failure mode where an LLM confuses instructions contained within raw input text payload with the system prompt rules.'
  - term: 'Zero-Shot Prompting'
    definition: 'Presenting a task directly to an LLM with instructions and context, but without providing any solved input-output demonstration examples.'
