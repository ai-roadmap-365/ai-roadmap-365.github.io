<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not what to avoid.">
  <title>Say what to do</title>
  <style>
    .positive-framing-bg   { fill: #f8fafc; }
    .positive-framing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positive-framing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positive-framing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positive-framing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positive-framing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positive-framing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .positive-framing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .positive-framing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .positive-framing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .positive-framing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .positive-framing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .positive-framing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .positive-framing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .positive-framing-stage { opacity: 1; }

    .positive-framing-s0 { animation-delay: 0.00s; }
    .positive-framing-e0 { animation-delay: 0.00s; }
    .positive-framing-s1 { animation-delay: 1.28s; }
    .positive-framing-e1 { animation-delay: 1.28s; }
    .positive-framing-s2 { animation-delay: 2.56s; }
    .positive-framing-e2 { animation-delay: 2.56s; }
    .positive-framing-s3 { animation-delay: 3.84s; }
    .positive-framing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .positive-framing-conn  { animation: positive-framing-trace 6.4s ease-in-out infinite; }
      .positive-framing-stage { animation: positive-framing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes positive-framing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes positive-framing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .positive-framing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .positive-framing-stage { animation: positive-framing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes positive-framing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="positive-framing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="positive-framing-bg" width="980" height="322"/>
  <text class="positive-framing-h1"  x="30" y="40">Say what to do</text>
  <text class="positive-framing-sub" x="30" y="64">Not what to avoid.</text>
  <g class="positive-framing-stage positive-framing-s0">
    <rect class="positive-framing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="positive-framing-step" x="44" y="142">01</text>
    <text class="positive-framing-name" x="70" y="142">Telling the model not to do something</text>
    <text class="positive-framing-desc" x="44" y="166">Puts that thing in the context.</text>
  </g>
  <line class="positive-framing-line positive-framing-conn positive-framing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#positive-framing-tip)"/>
  <g class="positive-framing-stage positive-framing-s1">
    <rect class="positive-framing-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="positive-framing-step" x="280" y="142">02</text>
    <text class="positive-framing-name" x="306" y="142">Which makes it more available, not less</text>
    <text class="positive-framing-desc" x="280" y="166">The instruction can increase the</text>
    <text class="positive-framing-desc" x="280" y="182">behaviour.</text>
  </g>
  <line class="positive-framing-line positive-framing-conn positive-framing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#positive-framing-tip)"/>
  <g class="positive-framing-stage positive-framing-s2">
    <rect class="positive-framing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="positive-framing-step" x="516" y="142">03</text>
    <text class="positive-framing-name" x="542" y="142">State the desired behaviour instead</text>
    <text class="positive-framing-desc" x="516" y="166">Be concise, rather than do not</text>
    <text class="positive-framing-desc" x="516" y="182">be verbose.</text>
  </g>
  <line class="positive-framing-line positive-framing-conn positive-framing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#positive-framing-tip)"/>
  <g class="positive-framing-stage positive-framing-s3">
    <rect class="positive-framing-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="positive-framing-step" x="752" y="142">04</text>
    <text class="positive-framing-name" x="778" y="142">Which gives it something to produce</text>
    <text class="positive-framing-desc" x="752" y="166">Rather than something to</text>
    <text class="positive-framing-desc" x="752" y="182">suppress.</text>
  </g>
  <text class="positive-framing-sub" x="30" y="304">This is the same effect as being told not to think of something, and it is one of the few prompting rules that holds consistently across models and versions.</text>
</svg>
