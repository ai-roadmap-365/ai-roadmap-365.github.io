<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to change something else.">
  <title>When to invest in the prompt</title>
  <style>
    .prompt-when-bg   { fill: #f8fafc; }
    .prompt-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-when-row { opacity: 1; }
    .prompt-when-r0 { animation-delay: 0.00s; }
    .prompt-when-r1 { animation-delay: 0.45s; }
    .prompt-when-r2 { animation-delay: 0.90s; }
    .prompt-when-r3 { animation-delay: 1.35s; }
    .prompt-when-r4 { animation-delay: 1.80s; }
    .prompt-when-row { animation: prompt-when-reveal 7.3s ease-in-out infinite; }
    @keyframes prompt-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prompt-when-bg" width="980" height="390"/>
  <text class="prompt-when-h1"  x="30" y="40">When to invest in the prompt</text>
  <text class="prompt-when-sub" x="30" y="64">And when to change something else.</text>
  <rect class="prompt-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-when-name" x="46" y="122">Prompt it</text>
  <text class="prompt-when-desc" x="46" y="142">Behaviour and format.</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r0" x="46" y="182">Wrong tone or output shape</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r1" x="46" y="216">Ambiguous or under-specified task</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r2" x="46" y="250">Inconsistent formatting</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r3" x="46" y="284">Missing constraints</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r4" x="46" y="318">Where examples would show what is wanted</text>
  <rect class="prompt-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-when-name" x="526" y="122">Change something else</text>
  <text class="prompt-when-desc" x="526" y="142">Four cases.</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r0" x="526" y="182">Missing knowledge — use retrieval</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r1" x="526" y="216">Wrong domain behaviour — fine-tune</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r2" x="526" y="250">Insufficient capability — change model</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r3" x="526" y="284">Needs current data — use tools</text>
  <text class="prompt-when-desc prompt-when-row prompt-when-r4" x="526" y="318">Where no wording could fix it</text>
  <text class="prompt-when-sub" x="30" y="372">Prompting is often attempted on problems it cannot solve, which wastes a great deal of time: no phrasing supplies knowledge the model does not have.</text>
</svg>
