<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Fixed first, variable last.">
  <title>Prompt layout as cost control</title>
  <style>
    .prompt-caching-econ-bg   { fill: #f8fafc; }
    .prompt-caching-econ-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-econ-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-econ-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-econ-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-econ-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-econ-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-caching-econ-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-caching-econ-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-caching-econ-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-caching-econ-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-caching-econ-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-caching-econ-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-caching-econ-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-caching-econ-stage { opacity: 1; }

    .prompt-caching-econ-s0 { animation-delay: 0.00s; }
    .prompt-caching-econ-e0 { animation-delay: 0.00s; }
    .prompt-caching-econ-s1 { animation-delay: 1.28s; }
    .prompt-caching-econ-e1 { animation-delay: 1.28s; }
    .prompt-caching-econ-s2 { animation-delay: 2.56s; }
    .prompt-caching-econ-e2 { animation-delay: 2.56s; }
    .prompt-caching-econ-s3 { animation-delay: 3.84s; }
    .prompt-caching-econ-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-caching-econ-conn  { animation: prompt-caching-econ-trace 6.4s ease-in-out infinite; }
      .prompt-caching-econ-stage { animation: prompt-caching-econ-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prompt-caching-econ-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-caching-econ-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-caching-econ-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-caching-econ-stage { animation: prompt-caching-econ-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-caching-econ-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-caching-econ-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-caching-econ-bg" width="980" height="322"/>
  <text class="prompt-caching-econ-h1"  x="30" y="40">Prompt layout as cost control</text>
  <text class="prompt-caching-econ-sub" x="30" y="64">Fixed first, variable last.</text>
  <g class="prompt-caching-econ-stage prompt-caching-econ-s0">
    <rect class="prompt-caching-econ-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-caching-econ-step" x="44" y="142">01</text>
    <text class="prompt-caching-econ-name" x="70" y="142">The instructions and examples repeat every call</text>
    <text class="prompt-caching-econ-desc" x="44" y="166">Often thousands of tokens of</text>
    <text class="prompt-caching-econ-desc" x="44" y="182">them.</text>
  </g>
  <line class="prompt-caching-econ-line prompt-caching-econ-conn prompt-caching-econ-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prompt-caching-econ-tip)"/>
  <g class="prompt-caching-econ-stage prompt-caching-econ-s1">
    <rect class="prompt-caching-econ-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-caching-econ-step" x="280" y="142">02</text>
    <text class="prompt-caching-econ-name" x="306" y="142">A cache hit needs an exact matching prefix</text>
    <text class="prompt-caching-econ-desc" x="280" y="166">From the very first token.</text>
  </g>
  <line class="prompt-caching-econ-line prompt-caching-econ-conn prompt-caching-econ-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prompt-caching-econ-tip)"/>
  <g class="prompt-caching-econ-stage prompt-caching-econ-s2">
    <rect class="prompt-caching-econ-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-caching-econ-step" x="516" y="142">03</text>
    <text class="prompt-caching-econ-name" x="542" y="142">So put anything variable last</text>
    <text class="prompt-caching-econ-desc" x="516" y="166">Timestamps, user names, request</text>
    <text class="prompt-caching-econ-desc" x="516" y="182">identifiers.</text>
  </g>
  <line class="prompt-caching-econ-line prompt-caching-econ-conn prompt-caching-econ-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prompt-caching-econ-tip)"/>
  <g class="prompt-caching-econ-stage prompt-caching-econ-s3">
    <rect class="prompt-caching-econ-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-caching-econ-step" x="752" y="142">04</text>
    <text class="prompt-caching-econ-name" x="778" y="142">And most of the prompt bills at a discount</text>
    <text class="prompt-caching-econ-desc" x="752" y="166">Which changes what length is</text>
    <text class="prompt-caching-econ-desc" x="752" y="182">affordable.</text>
  </g>
  <text class="prompt-caching-econ-sub" x="30" y="304">A timestamp near the top of a system prompt is the classic mistake: it costs nothing to move and it silently disables caching for every request.</text>
</svg>
