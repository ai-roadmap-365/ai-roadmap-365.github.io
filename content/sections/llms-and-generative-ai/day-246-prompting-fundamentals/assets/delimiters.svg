<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not as formatting.">
  <title>Delimiters as a security control</title>
  <style>
    .delimiters-bg   { fill: #f8fafc; }
    .delimiters-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delimiters-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delimiters-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delimiters-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delimiters-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delimiters-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .delimiters-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .delimiters-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .delimiters-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .delimiters-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .delimiters-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .delimiters-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .delimiters-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .delimiters-stage { opacity: 1; }

    .delimiters-s0 { animation-delay: 0.00s; }
    .delimiters-e0 { animation-delay: 0.00s; }
    .delimiters-s1 { animation-delay: 1.28s; }
    .delimiters-e1 { animation-delay: 1.28s; }
    .delimiters-s2 { animation-delay: 2.56s; }
    .delimiters-e2 { animation-delay: 2.56s; }
    .delimiters-s3 { animation-delay: 3.84s; }
    .delimiters-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .delimiters-conn  { animation: delimiters-trace 6.4s ease-in-out infinite; }
      .delimiters-stage { animation: delimiters-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes delimiters-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes delimiters-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .delimiters-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .delimiters-stage { animation: delimiters-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes delimiters-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="delimiters-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="delimiters-bg" width="980" height="322"/>
  <text class="delimiters-h1"  x="30" y="40">Delimiters as a security control</text>
  <text class="delimiters-sub" x="30" y="64">Not as formatting.</text>
  <g class="delimiters-stage delimiters-s0">
    <rect class="delimiters-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="delimiters-step" x="44" y="142">01</text>
    <text class="delimiters-name" x="70" y="142">User input can contain instructions</text>
    <text class="delimiters-desc" x="44" y="166">Which the model may follow.</text>
  </g>
  <line class="delimiters-line delimiters-conn delimiters-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#delimiters-tip)"/>
  <g class="delimiters-stage delimiters-s1">
    <rect class="delimiters-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="delimiters-step" x="280" y="142">02</text>
    <text class="delimiters-name" x="306" y="142">Wrap it in explicit, distinctive tags</text>
    <text class="delimiters-desc" x="280" y="166">So its boundaries are</text>
    <text class="delimiters-desc" x="280" y="182">unambiguous.</text>
  </g>
  <line class="delimiters-line delimiters-conn delimiters-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#delimiters-tip)"/>
  <g class="delimiters-stage delimiters-s2">
    <rect class="delimiters-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="delimiters-step" x="516" y="142">03</text>
    <text class="delimiters-name" x="542" y="142">And state that its contents are data</text>
    <text class="delimiters-desc" x="516" y="166">Before the input, never after</text>
    <text class="delimiters-desc" x="516" y="182">it.</text>
  </g>
  <line class="delimiters-line delimiters-conn delimiters-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#delimiters-tip)"/>
  <g class="delimiters-stage delimiters-s3">
    <rect class="delimiters-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="delimiters-step" x="752" y="142">04</text>
    <text class="delimiters-name" x="778" y="142">Which reduces the risk without removing it</text>
    <text class="delimiters-desc" x="752" y="166">Prompt injection is mitigated,</text>
    <text class="delimiters-desc" x="752" y="182">not solved.</text>
  </g>
  <text class="delimiters-sub" x="30" y="304">The honest framing matters here: delimiters make injection harder rather than impossible, and any design that treats them as a boundary guarantee will eventually be wrong.</text>
</svg>
