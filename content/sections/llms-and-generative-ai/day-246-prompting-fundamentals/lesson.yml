learning_promise: 'Master the foundational mechanics of prompt engineering for modern LLMs: understand the 6-part anatomy of production prompts (Role, Context, Input Data, Step-by-Step Directives, Positive Constraints, and Exact Output Schema), master delimiter sandboxing using XML tags and markdown boundaries to prevent instruction bleed and prompt injection, optimize attention head allocation by positioning critical rules at prompt edges, eliminate negative constraint failure modes, and build a modular prompt compilation and validation engine in Python.'
objectives:
  - 'Deconstruct production prompts into the 6 canonical architectural components.'
  - 'Implement XML delimiter sandboxing to isolate untrusted input data from instructions.'
  - 'Apply positive phrasing ("do X") to replace brittle negative constraints ("do not do Y").'
  - 'Leverage attention primacy and recency positioning for high-importance rules.'
  - 'Build a modular, template-driven prompt compiler with programmatic assertion validation in Python.'
