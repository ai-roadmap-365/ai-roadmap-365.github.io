visuals:
  - id: anatomy-of-a-production-prompt
    file: assets/anatomy-of-a-production-prompt.svg
    type: diagram
    title: 'Anatomy of a Production-Grade Prompt'
    alt: Structured breakdown of the 6 core components of a production-grade LLM prompt
    description: 'Six core components of production prompting: Role, Context, Delimited Input, Step-by-Step Instructions, Constraints, and Output Schema.'
  - id: prompt-delimiter-sandboxing-and-attention
    file: assets/prompt-delimiter-sandboxing-and-attention.svg
    type: diagram
    title: 'Prompt Delimiter Sandboxing & Attention Isolation'
    alt: Prompt delimiter sandboxing comparison showing how XML tags isolate user payload from instructions and sharpen attention
    description: 'Comparison of unstructured raw prompts vs XML tag sandboxed prompts for preventing instruction confusion and injection.'
  - id: prompt-components
    file: assets/prompt-components.svg
    type: diagram
    title: 'What a production prompt contains'
    alt: 'Diagram: the six components of a well-structured production prompt'
    description: 'A six-stage description of prompt structure covering role, task, context, examples, format and the input.'
  - id: prompt-idea
    file: assets/prompt-idea.svg
    type: diagram
    title: 'Why structure beats phrasing'
    alt: 'Diagram: why prompt structure matters more than wording'
    description: 'A four-stage description of prompt effectiveness covering ambiguity, structure, examples and iteration.'
  - id: delimiters
    file: assets/delimiters.svg
    type: diagram
    title: 'Delimiters as a security control'
    alt: 'Diagram: how explicit delimiters separate instructions from untrusted input'
    description: 'A four-stage description of delimiter use covering the injection risk, tagging, instruction placement and the residual risk.'
  - id: positive-framing
    file: assets/positive-framing.svg
    type: diagram
    title: 'Say what to do'
    alt: 'Diagram: negative instructions compared with positive ones'
    description: 'A four-stage description of instruction framing covering the negative instruction, its effect, the positive rewrite and the reason.'
  - id: prompt-as-code
    file: assets/prompt-as-code.svg
    type: diagram
    title: 'A prompt is code'
    alt: 'Diagram: informal prompt management compared with treating prompts as code'
    description: 'A two-column comparison of ad hoc prompt handling against engineered prompt management.'
  - id: prompt-caching-econ
    file: assets/prompt-caching-econ.svg
    type: diagram
    title: 'Prompt layout as cost control'
    alt: 'Diagram: how prompt ordering determines whether the cached prefix is reused'
    description: 'A four-stage description of prompt caching economics covering the shared prefix, the cache condition, the ordering rule and the saving.'
  - id: briefing
    file: assets/briefing.svg
    type: diagram
    title: 'Briefing a capable stranger'
    alt: 'Diagram: a vague brief compared with a complete one'
    description: 'A two-column comparison of an incomplete brief against a well-structured one.'
  - id: prompt-implications
    file: assets/prompt-implications.svg
    type: diagram
    title: 'Four consequences of prompt design'
    alt: 'Diagram: the cost, security, portability and maintenance implications of prompt engineering'
    description: 'A four-stage description of prompt implications covering token cost, injection exposure, portability between models and maintenance burden.'
  - id: prompt-when
    file: assets/prompt-when.svg
    type: diagram
    title: 'When to invest in the prompt'
    alt: 'Diagram: when prompt engineering is the right lever'
    description: 'A two-column comparison of problems solved by better prompting against those requiring a different change.'
