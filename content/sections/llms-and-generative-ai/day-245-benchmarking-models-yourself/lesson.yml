learning_promise: 'Master the science and engineering of LLM evaluation: analyze industry benchmark suites (MMLU-Pro, GSM8K, MATH-500, HumanEval, SWE-bench Verified, Chatbot Arena), understand benchmark contamination and Goodhart’s Law in AI evaluation, implement LLM-as-a-Judge evaluation harnesses with dual-pass position debiasing, calculate Bradley-Terry ELO tournament ratings, compute 95% bootstrap confidence intervals, and build an automated evaluation pipeline in Python.'
objectives:
  - 'Evaluate the strengths and contamination vulnerabilities of major academic benchmarks (MMLU-Pro, GSM8K, SWE-bench).'
  - 'Formulate the Bradley-Terry paired comparison ELO ranking model used by LMSYS Chatbot Arena.'
  - 'Identify and eliminate LLM-as-a-Judge biases (positional bias, length bias, self-enhancement bias).'
  - 'Implement dual-pass order-swapping evaluation harnesses in Python.'
  - 'Compute 95% statistical bootstrap confidence intervals on evaluation win-rate scores.'
