terms:
  - term: 'LLM-as-a-Judge'
    definition: 'Using a strong frontier foundation model (e.g. GPT-4o, Claude 3.5 Sonnet) as an automated evaluator to grade and score responses from other models against structured rubrics.'
  - term: 'Chatbot Arena'
    definition: 'A crowdsourced open evaluation platform developed by LMSYS where users conduct blind side-by-side model battles to compute Bradley-Terry ELO rankings.'
  - term: 'Bradley-Terry Model'
    definition: 'A probabilistic model for paired comparisons estimating the likelihood of one competitor defeating another based on latent rating scores.'
  - term: 'Positional Bias'
    definition: 'A cognitive bias in LLM judges systematically favoring whichever candidate answer is placed first in the prompt context.'
  - term: 'Length Bias'
    definition: 'The tendency of LLM evaluators to score longer, more verbose responses higher than concise, direct answers.'
  - term: 'pass@k'
    definition: 'A metric evaluating code generation measuring the probability that at least one of k generated code samples passes all unit tests.'
  - term: 'Data Contamination'
    definition: 'The leakage of evaluation benchmark questions and test sets into model pre-training or fine-tuning datasets, causing artificially inflated scores.'
  - term: 'Bootstrap Confidence Interval'
    definition: 'A non-parametric statistical technique resampling evaluation win rates with replacement to quantify metric uncertainty.'
