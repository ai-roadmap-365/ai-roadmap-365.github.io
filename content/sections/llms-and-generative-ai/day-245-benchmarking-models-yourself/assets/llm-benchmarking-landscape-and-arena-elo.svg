<svg role="img" aria-label="LLM benchmarking landscape and Chatbot Arena Bradley-Terry ELO evaluation diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>LLM Benchmarking Landscape &amp; LMSYS Arena ELO</title>
  <defs>
    <linearGradient id="bg245a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card245" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg245a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LLM BENCHMARKING SUITE &amp; ARENA ELO</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Automated Academic Benchmarks vs. Blind Crowdsourced Human Preference Modeling</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card245)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Automated Academic Suites -->
    <rect x="25" y="25" width="345" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="197" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Automated Academic Benchmarks</text>
    
    <text x="40" y="80" fill="#fbbf24" font-size="9" font-weight="700">MMLU-Pro / GPQA:</text>
    <text x="40" y="98" fill="#cbd5e1" font-size="8">• Graduate-level multi-choice reasoning &amp; STEM</text>

    <text x="40" y="125" fill="#fbbf24" font-size="9" font-weight="700">GSM8K &amp; MATH-500:</text>
    <text x="40" y="143" fill="#cbd5e1" font-size="8">• Multi-step grade school and Olympiad math</text>

    <text x="40" y="170" fill="#fbbf24" font-size="9" font-weight="700">HumanEval &amp; SWE-bench Verified:</text>
    <text x="40" y="188" fill="#cbd5e1" font-size="8">• Python unit test pass@1 and GitHub issue resolution</text>

    <text x="40" y="215" fill="#fb7185" font-size="9" font-weight="700">Flaw: Contamination &amp; Goodhart's Law</text>
    <text x="40" y="233" fill="#cbd5e1" font-size="8">• Test sets leak into pretraining data, inflating scores</text>

    <!-- Right: LMSYS Chatbot Arena -->
    <rect x="390" y="25" width="345" height="255" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="562" y="50" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">2. LMSYS Chatbot Arena (Crowdsourced ELO)</text>

    <text x="405" y="80" fill="#34d399" font-size="9" font-weight="700">Blind Side-by-Side Evaluation:</text>
    <text x="405" y="98" fill="#cbd5e1" font-size="8">• User submits arbitrary prompt to Model A vs Model B</text>

    <text x="405" y="125" fill="#34d399" font-size="9" font-weight="700">Bradley-Terry Mathematical Ranking:</text>
    <text x="405" y="143" fill="#cbd5e1" font-size="8">• P(A beats B) = 1 / (1 + 10^((R_B - R_A)/400))</text>

    <text x="405" y="170" fill="#34d399" font-size="9" font-weight="700">Category Hard Arenas:</text>
    <text x="405" y="188" fill="#cbd5e1" font-size="8">• Coding Arena, Hard Prompts, Long Context Arena</text>

    <text x="405" y="215" fill="#38bdf8" font-size="9" font-weight="700">Gold Standard for Real-World Quality</text>
    <text x="405" y="233" fill="#cbd5e1" font-size="8">• Impossible to game via static dataset contamination</text>
  </g>
</svg>
