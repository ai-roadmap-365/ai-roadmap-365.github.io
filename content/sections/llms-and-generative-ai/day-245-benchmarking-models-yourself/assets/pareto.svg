<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The frontier, not the maximum.">
  <title>Quality against cost</title>
  <style>
    .pareto-bg   { fill: #f8fafc; }
    .pareto-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pareto-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pareto-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pareto-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pareto-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pareto-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pareto-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pareto-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pareto-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pareto-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pareto-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pareto-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pareto-row { opacity: 1; }
    .pareto-r0 { animation-delay: 0.00s; }
    .pareto-r1 { animation-delay: 0.45s; }
    .pareto-r2 { animation-delay: 0.90s; }
    .pareto-r3 { animation-delay: 1.35s; }
    .pareto-r4 { animation-delay: 1.80s; }
    .pareto-row { animation: pareto-reveal 7.3s ease-in-out infinite; }
    @keyframes pareto-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pareto-bg" width="980" height="390"/>
  <text class="pareto-h1"  x="30" y="40">Quality against cost</text>
  <text class="pareto-sub" x="30" y="64">The frontier, not the maximum.</text>
  <rect class="pareto-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pareto-name" x="46" y="122">Highest score wins</text>
  <text class="pareto-desc" x="46" y="142">One number.</text>
  <text class="pareto-desc pareto-row pareto-r0" x="46" y="182">Pick the top of the leaderboard</text>
  <text class="pareto-desc pareto-row pareto-r1" x="46" y="216">Ignores cost entirely</text>
  <text class="pareto-desc pareto-row pareto-r2" x="46" y="250">Ignores latency entirely</text>
  <text class="pareto-desc pareto-row pareto-r3" x="46" y="284">Often ten times the price</text>
  <text class="pareto-desc pareto-row pareto-r4" x="46" y="318">For a point or two of quality</text>
  <rect class="pareto-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pareto-name" x="526" y="122">Choose on the frontier</text>
  <text class="pareto-desc" x="526" y="142">Three numbers.</text>
  <text class="pareto-desc pareto-row pareto-r0" x="526" y="182">Plot quality against cost and latency</text>
  <text class="pareto-desc pareto-row pareto-r1" x="526" y="216">Discard everything dominated</text>
  <text class="pareto-desc pareto-row pareto-r2" x="526" y="250">Several defensible choices remain</text>
  <text class="pareto-desc pareto-row pareto-r3" x="526" y="284">Chosen against the product's needs</text>
  <text class="pareto-desc pareto-row pareto-r4" x="526" y="318">Which is an actual decision</text>
  <text class="pareto-sub" x="30" y="372">Framing this as a frontier rather than a ranking is what lets a team justify shipping the cheaper model, which is usually the right call and rarely the default one.</text>
</svg>
