<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Usually not.">
  <title>Is the difference real</title>
  <style>
    .significance-eval-bg   { fill: #f8fafc; }
    .significance-eval-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-eval-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-eval-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-eval-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-eval-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .significance-eval-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .significance-eval-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .significance-eval-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .significance-eval-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .significance-eval-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .significance-eval-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .significance-eval-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .significance-eval-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .significance-eval-stage { opacity: 1; }

    .significance-eval-s0 { animation-delay: 0.00s; }
    .significance-eval-e0 { animation-delay: 0.00s; }
    .significance-eval-s1 { animation-delay: 1.28s; }
    .significance-eval-e1 { animation-delay: 1.28s; }
    .significance-eval-s2 { animation-delay: 2.56s; }
    .significance-eval-e2 { animation-delay: 2.56s; }
    .significance-eval-s3 { animation-delay: 3.84s; }
    .significance-eval-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .significance-eval-conn  { animation: significance-eval-trace 6.4s ease-in-out infinite; }
      .significance-eval-stage { animation: significance-eval-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes significance-eval-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes significance-eval-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .significance-eval-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .significance-eval-stage { animation: significance-eval-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes significance-eval-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="significance-eval-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="significance-eval-bg" width="980" height="322"/>
  <text class="significance-eval-h1"  x="30" y="40">Is the difference real</text>
  <text class="significance-eval-sub" x="30" y="64">Usually not.</text>
  <g class="significance-eval-stage significance-eval-s0">
    <rect class="significance-eval-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="significance-eval-step" x="44" y="142">01</text>
    <text class="significance-eval-name" x="70" y="142">One model scores two points higher</text>
    <text class="significance-eval-desc" x="44" y="166">On two hundred examples.</text>
  </g>
  <line class="significance-eval-line significance-eval-conn significance-eval-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#significance-eval-tip)"/>
  <g class="significance-eval-stage significance-eval-s1">
    <rect class="significance-eval-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="significance-eval-step" x="280" y="142">02</text>
    <text class="significance-eval-name" x="306" y="142">Which is within the noise</text>
    <text class="significance-eval-desc" x="280" y="166">At that sample size, easily.</text>
  </g>
  <line class="significance-eval-line significance-eval-conn significance-eval-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#significance-eval-tip)"/>
  <g class="significance-eval-stage significance-eval-s2">
    <rect class="significance-eval-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="significance-eval-step" x="516" y="142">03</text>
    <text class="significance-eval-name" x="542" y="142">Resample the results many times</text>
    <text class="significance-eval-desc" x="516" y="166">To estimate how much the score</text>
    <text class="significance-eval-desc" x="516" y="182">moves by chance.</text>
  </g>
  <line class="significance-eval-line significance-eval-conn significance-eval-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#significance-eval-tip)"/>
  <g class="significance-eval-stage significance-eval-s3">
    <rect class="significance-eval-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="significance-eval-step" x="752" y="142">04</text>
    <text class="significance-eval-name" x="778" y="142">And compare intervals</text>
    <text class="significance-eval-desc" x="752" y="166">Overlapping intervals mean no</text>
    <text class="significance-eval-desc" x="752" y="182">result.</text>
  </g>
  <text class="significance-eval-sub" x="30" y="304">Reporting an interval rather than a number is a small change in practice that prevents most of the wasted effort in model selection, because most apparent differences disappear.</text>
</svg>
