<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it can wait.">
  <title>When to build an evaluation set</title>
  <style>
    .eval-when-bg   { fill: #f8fafc; }
    .eval-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-when-row { opacity: 1; }
    .eval-when-r0 { animation-delay: 0.00s; }
    .eval-when-r1 { animation-delay: 0.45s; }
    .eval-when-r2 { animation-delay: 0.90s; }
    .eval-when-r3 { animation-delay: 1.35s; }
    .eval-when-r4 { animation-delay: 1.80s; }
    .eval-when-row { animation: eval-when-reveal 7.3s ease-in-out infinite; }
    @keyframes eval-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eval-when-bg" width="980" height="390"/>
  <text class="eval-when-h1"  x="30" y="40">When to build an evaluation set</text>
  <text class="eval-when-sub" x="30" y="64">And when it can wait.</text>
  <rect class="eval-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eval-when-name" x="46" y="122">Build it</text>
  <text class="eval-when-desc" x="46" y="142">Almost immediately.</text>
  <text class="eval-when-desc eval-when-row eval-when-r0" x="46" y="182">Before choosing between models</text>
  <text class="eval-when-desc eval-when-row eval-when-r1" x="46" y="216">Before any prompt is tuned seriously</text>
  <text class="eval-when-desc eval-when-row eval-when-r2" x="46" y="250">Anything heading for production</text>
  <text class="eval-when-desc eval-when-row eval-when-r3" x="46" y="284">Anywhere quality must be defended</text>
  <text class="eval-when-desc eval-when-row eval-when-r4" x="46" y="318">And before the first model update lands</text>
  <rect class="eval-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eval-when-name" x="526" y="122">Wait</text>
  <text class="eval-when-desc" x="526" y="142">Briefly.</text>
  <text class="eval-when-desc eval-when-row eval-when-r0" x="526" y="182">The first day of exploration</text>
  <text class="eval-when-desc eval-when-row eval-when-r1" x="526" y="216">Before the task is defined</text>
  <text class="eval-when-desc eval-when-row eval-when-r2" x="526" y="250">Where the feature may be discarded</text>
  <text class="eval-when-desc eval-when-row eval-when-r3" x="526" y="284">And nothing has users yet</text>
  <text class="eval-when-desc eval-when-row eval-when-r4" x="526" y="318">Which is a window of days, not months</text>
  <text class="eval-when-sub" x="30" y="372">The window closes faster than most teams expect, because the first serious prompt-tuning session is already a sequence of decisions with no way to tell whether they helped.</text>
</svg>
