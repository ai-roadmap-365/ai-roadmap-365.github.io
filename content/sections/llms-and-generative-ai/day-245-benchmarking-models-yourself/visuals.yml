visuals:
  - id: llm-benchmarking-landscape-and-arena-elo
    file: assets/llm-benchmarking-landscape-and-arena-elo.svg
    type: diagram
    title: 'LLM Benchmarking Landscape & LMSYS Arena ELO'
    alt: LLM benchmarking landscape and Chatbot Arena Bradley-Terry ELO evaluation diagram
    description: 'Overview of automated academic benchmarks (MMLU-Pro, GSM8K, SWE-bench) vs crowdsourced blind LMSYS Chatbot Arena ELO.'
  - id: llm-as-a-judge-bias-and-debiasing-pipeline
    file: assets/llm-as-a-judge-bias-and-debiasing-pipeline.svg
    type: diagram
    title: 'LLM-as-a-Judge Debiasing Pipeline'
    alt: LLM as a Judge debiasing pipeline diagram showing dual-pass position swapping and rubric scoring
    description: 'Debiasing pipeline for LLM-as-a-Judge evaluation: dual-pass order swapping and statistical bootstrap confidence intervals.'
  - id: eval-idea
    file: assets/eval-idea.svg
    type: diagram
    title: 'Building your own evaluation'
    alt: 'Diagram: the four steps to building a task-specific model evaluation'
    description: 'A four-stage description of building an evaluation covering example collection, grading criteria, running candidates and the decision.'
  - id: llm-judge
    file: assets/llm-judge.svg
    type: diagram
    title: 'Using a model as a grader'
    alt: 'Diagram: the three biases of model-based grading and how they are controlled'
    description: 'A four-stage description of model-based grading covering the approach, position bias, length bias and self-preference.'
  - id: significance-eval
    file: assets/significance-eval.svg
    type: diagram
    title: 'Is the difference real'
    alt: 'Diagram: how confidence intervals determine whether an evaluation difference is meaningful'
    description: 'A four-stage description of significance in evaluation covering the observed difference, sample size, resampling and the interval.'
  - id: eval-vs-benchmark
    file: assets/eval-vs-benchmark.svg
    type: diagram
    title: 'Your evaluation against a public benchmark'
    alt: 'Diagram: a task-specific evaluation compared with a public benchmark'
    description: 'A two-column comparison of an internal evaluation set against a published benchmark.'
  - id: eval-ci
    file: assets/eval-ci.svg
    type: diagram
    title: 'Evaluation in continuous integration'
    alt: 'Diagram: how automated evaluation gates changes to prompts and models'
    description: 'A four-stage description of continuous evaluation covering the trigger, the run, the threshold and the gate.'
  - id: blind-tasting
    file: assets/blind-tasting.svg
    type: diagram
    title: 'A blind tasting'
    alt: 'Diagram: labelled evaluation compared with blind evaluation'
    description: 'A two-column comparison of judging with knowledge of the source against judging blind.'
  - id: eval-implications
    file: assets/eval-implications.svg
    type: diagram
    title: 'Four consequences of evaluating properly'
    alt: 'Diagram: the confidence, cost, privacy and maintenance implications of building an evaluation set'
    description: 'A four-stage description of evaluation implications covering decision confidence, running cost, sensitive examples and set maintenance.'
  - id: eval-when
    file: assets/eval-when.svg
    type: diagram
    title: 'When to build an evaluation set'
    alt: 'Diagram: when a formal evaluation set is warranted'
    description: 'A two-column comparison of situations requiring a formal evaluation against those where it is premature.'
  - id: eval-history
    file: assets/eval-history.svg
    type: diagram
    title: 'Four steps in model evaluation'
    alt: 'Diagram: the historical progression of language model evaluation methods'
    description: 'A four-stage description of evaluation history covering single-task metrics, aggregate benchmarks, human preference arenas and task-specific evaluation.'
  - id: pareto
    file: assets/pareto.svg
    type: diagram
    title: 'Quality against cost'
    alt: 'Diagram: selecting a model from the cost-quality frontier'
    description: 'A two-column comparison of selecting the highest-scoring model against selecting from the cost-quality frontier.'
