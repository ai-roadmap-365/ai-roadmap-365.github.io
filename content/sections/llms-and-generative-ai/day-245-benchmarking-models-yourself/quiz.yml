questions:
  - question: 'What is Goodhart’s Law as applied to LLM academic benchmark evaluation?'
    options:
      - 'A measure that becomes a target stops measuring'
      - 'A law stating that GPU clock speeds double every year'
      - 'A rule that prohibits running benchmarks on Fridays'
      - 'A formula calculating cloud API hosting costs'
    answer_index: 0
    explanation: 'Goodharts Law highlights how optimizing models directly for public benchmarks degrades their utility as unbiased evaluation metrics.'
  - question: 'How does Positional Bias corrupt LLM-as-a-Judge evaluations, and how is it mitigated?'
    options:
      - 'Positional bias means judges prefer models trained in California'
      - 'Judges favour whichever answer comes first; swap and rerun'
      - 'Positional bias is mitigated by increasing GPU memory'
      - 'Judges prefer responses written in all capital letters'
    answer_index: 1
    explanation: 'Dual-pass position swapping eliminates positional bias by presenting candidates in both forward and reversed orders.'
  - question: 'What mathematical model powers the LMSYS Chatbot Arena leaderboard ranking?'
    options:
      - 'Counting the number of GitHub stars'
      - 'Linear regression on model parameter count'
      - 'The Bradley-Terry paired comparison model'
      - 'Sorting models alphabetically'
    answer_index: 2
    explanation: 'LMSYS Chatbot Arena uses the Bradley-Terry ELO paired comparison model to compute rankings from blind human votes.'
  - question: 'Why is pass@k with unbiased estimation (Chen et al., 2021) preferred over naive empirical sampling when evaluating coding LLMs on HumanEval?'
    options:
      - 'Because pass@k reduces the cost of GPUs'
      - 'Because it allows testing code without executing it'
      - 'Because Python does not support unit tests'
      - 'An unbiased combinatorial estimator cuts the variance'
    answer_index: 3
    explanation: 'The combinatorial pass@k formula provides an unbiased, low-variance estimate from a finite sample pool n >= k.'
  - question: 'What is Verbosity / Length Bias in LLM-as-a-Judge evaluations?'
    options:
      - 'Judges reward length and structure over accuracy'
      - 'Judges refusing to read prompts longer than 10 words'
      - 'A bug where long responses crash the API'
      - 'Models typing slower on long sentences'
    answer_index: 0
    explanation: 'Judge LLMs systematically conflate length and visual formatting with higher intellectual quality.'
