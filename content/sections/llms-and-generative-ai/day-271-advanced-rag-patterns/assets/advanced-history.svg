<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each addressing one failure.">
  <title>Four steps beyond basic retrieval</title>
  <style>
    .advanced-history-bg   { fill: #f8fafc; }
    .advanced-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .advanced-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .advanced-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .advanced-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .advanced-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .advanced-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .advanced-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .advanced-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .advanced-history-stage { opacity: 1; }

    .advanced-history-s0 { animation-delay: 0.00s; }
    .advanced-history-e0 { animation-delay: 0.00s; }
    .advanced-history-s1 { animation-delay: 1.28s; }
    .advanced-history-e1 { animation-delay: 1.28s; }
    .advanced-history-s2 { animation-delay: 2.56s; }
    .advanced-history-e2 { animation-delay: 2.56s; }
    .advanced-history-s3 { animation-delay: 3.84s; }
    .advanced-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .advanced-history-conn  { animation: advanced-history-trace 6.4s ease-in-out infinite; }
      .advanced-history-stage { animation: advanced-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes advanced-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes advanced-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .advanced-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .advanced-history-stage { animation: advanced-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes advanced-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="advanced-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="advanced-history-bg" width="980" height="322"/>
  <text class="advanced-history-h1"  x="30" y="40">Four steps beyond basic retrieval</text>
  <text class="advanced-history-sub" x="30" y="64">Each addressing one failure.</text>
  <g class="advanced-history-stage advanced-history-s0">
    <rect class="advanced-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-history-step" x="44" y="142">01</text>
    <text class="advanced-history-name" x="70" y="142">Retrieve and generate</text>
    <text class="advanced-history-desc" x="44" y="166">Which worked, and failed on</text>
    <text class="advanced-history-desc" x="44" y="182">rephrased questions.</text>
  </g>
  <line class="advanced-history-line advanced-history-conn advanced-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#advanced-history-tip)"/>
  <g class="advanced-history-stage advanced-history-s1">
    <rect class="advanced-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-history-step" x="280" y="142">02</text>
    <text class="advanced-history-name" x="306" y="142">Add reranking</text>
    <text class="advanced-history-desc" x="280" y="166">Which fixed ordering without</text>
    <text class="advanced-history-desc" x="280" y="182">fixing recall.</text>
  </g>
  <line class="advanced-history-line advanced-history-conn advanced-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#advanced-history-tip)"/>
  <g class="advanced-history-stage advanced-history-s2">
    <rect class="advanced-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-history-step" x="516" y="142">03</text>
    <text class="advanced-history-name" x="542" y="142">Then transform the query</text>
    <text class="advanced-history-desc" x="516" y="166">Rewriting, expanding,</text>
    <text class="advanced-history-desc" x="516" y="182">hypothesising. Which fixed</text>
    <text class="advanced-history-desc" x="516" y="198">recall.</text>
  </g>
  <line class="advanced-history-line advanced-history-conn advanced-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#advanced-history-tip)"/>
  <g class="advanced-history-stage advanced-history-s3">
    <rect class="advanced-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-history-step" x="752" y="142">04</text>
    <text class="advanced-history-name" x="778" y="142">And extract filters from the question</text>
    <text class="advanced-history-desc" x="752" y="166">Which merged structured querying</text>
    <text class="advanced-history-desc" x="752" y="182">into semantic search.</text>
  </g>
  <text class="advanced-history-sub" x="30" y="304">Each pattern was a response to a specific observed failure rather than a general improvement, which is why adopting them without the matching symptom rarely helps.</text>
</svg>
