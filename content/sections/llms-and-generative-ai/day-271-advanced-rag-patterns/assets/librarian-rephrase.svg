<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Before going to the shelves.">
  <title>A librarian who rephrases</title>
  <style>
    .librarian-rephrase-bg   { fill: #f8fafc; }
    .librarian-rephrase-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-rephrase-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-rephrase-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-rephrase-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-rephrase-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-rephrase-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .librarian-rephrase-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .librarian-rephrase-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .librarian-rephrase-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .librarian-rephrase-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .librarian-rephrase-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .librarian-rephrase-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .librarian-rephrase-row { opacity: 1; }
    .librarian-rephrase-r0 { animation-delay: 0.00s; }
    .librarian-rephrase-r1 { animation-delay: 0.45s; }
    .librarian-rephrase-r2 { animation-delay: 0.90s; }
    .librarian-rephrase-r3 { animation-delay: 1.35s; }
    .librarian-rephrase-r4 { animation-delay: 1.80s; }
    .librarian-rephrase-row { animation: librarian-rephrase-reveal 7.3s ease-in-out infinite; }
    @keyframes librarian-rephrase-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="librarian-rephrase-bg" width="980" height="390"/>
  <text class="librarian-rephrase-h1"  x="30" y="40">A librarian who rephrases</text>
  <text class="librarian-rephrase-sub" x="30" y="64">Before going to the shelves.</text>
  <rect class="librarian-rephrase-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="librarian-rephrase-name" x="46" y="122">Taking the question literally</text>
  <text class="librarian-rephrase-desc" x="46" y="142">Searches your words.</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r0" x="46" y="182">Uses exactly the phrasing given</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r1" x="46" y="216">Misses material filed under other terms</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r2" x="46" y="250">No interpretation of intent</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r3" x="46" y="284">Returns nothing when wording differs</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r4" x="46" y="318">This is naive retrieval</text>
  <rect class="librarian-rephrase-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="librarian-rephrase-name" x="526" y="122">Interpreting first</text>
  <text class="librarian-rephrase-desc" x="526" y="142">Searches your meaning.</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r0" x="526" y="182">Rephrases into likely index terms</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r1" x="526" y="216">Tries several formulations</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r2" x="526" y="250">Separates topic from constraints</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r3" x="526" y="284">Finds what was meant</text>
  <text class="librarian-rephrase-desc librarian-rephrase-row librarian-rephrase-r4" x="526" y="318">This is query transformation</text>
  <text class="librarian-rephrase-sub" x="30" y="372">A skilled librarian does exactly this before touching the catalogue, and it is the step that most distinguishes a useful search from a literal one.</text>
</svg>
