<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Latency against recall.">
  <title>What each pattern costs</title>
  <style>
    .pattern-cost-bg   { fill: #f8fafc; }
    .pattern-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pattern-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pattern-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pattern-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pattern-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pattern-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pattern-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pattern-cost-row { opacity: 1; }
    .pattern-cost-r0 { animation-delay: 0.00s; }
    .pattern-cost-r1 { animation-delay: 0.45s; }
    .pattern-cost-r2 { animation-delay: 0.90s; }
    .pattern-cost-r3 { animation-delay: 1.35s; }
    .pattern-cost-r4 { animation-delay: 1.80s; }
    .pattern-cost-row { animation: pattern-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes pattern-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pattern-cost-bg" width="980" height="390"/>
  <text class="pattern-cost-h1"  x="30" y="40">What each pattern costs</text>
  <text class="pattern-cost-sub" x="30" y="64">Latency against recall.</text>
  <rect class="pattern-cost-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pattern-cost-name" x="46" y="122">Cheap</text>
  <text class="pattern-cost-desc" x="46" y="142">Little added latency.</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r0" x="46" y="182">Small-to-big expansion: no extra call</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r1" x="46" y="216">Reranking: one model pass over candidates</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r2" x="46" y="250">Both improve quality substantially</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r3" x="46" y="284">Adopt these first</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r4" x="46" y="318">Measure, then keep</text>
  <rect class="pattern-cost-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pattern-cost-name" x="526" y="122">Expensive</text>
  <text class="pattern-cost-desc" x="526" y="142">Extra generation first.</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r0" x="526" y="182">Multi-query: one call, several searches</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r1" x="526" y="216">Hypothetical answers: one full generation</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r2" x="526" y="250">Self-querying: one extraction call</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r3" x="526" y="284">Each adds hundreds of milliseconds</text>
  <text class="pattern-cost-desc pattern-cost-row pattern-cost-r4" x="526" y="318">Adopt only if measured to help</text>
  <text class="pattern-cost-sub" x="30" y="372">Adopting these by reputation is how retrieval systems become slow without becoming better, which is why each one needs its own measurement on your corpus.</text>
</svg>
