<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Diagnose first.">
  <title>Which pattern for which problem</title>
  <style>
    .advanced-when-bg   { fill: #f8fafc; }
    .advanced-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .advanced-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .advanced-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .advanced-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .advanced-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .advanced-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .advanced-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .advanced-when-row { opacity: 1; }
    .advanced-when-r0 { animation-delay: 0.00s; }
    .advanced-when-r1 { animation-delay: 0.45s; }
    .advanced-when-r2 { animation-delay: 0.90s; }
    .advanced-when-r3 { animation-delay: 1.35s; }
    .advanced-when-r4 { animation-delay: 1.80s; }
    .advanced-when-row { animation: advanced-when-reveal 7.3s ease-in-out infinite; }
    @keyframes advanced-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="advanced-when-bg" width="980" height="390"/>
  <text class="advanced-when-h1"  x="30" y="40">Which pattern for which problem</text>
  <text class="advanced-when-sub" x="30" y="64">Diagnose first.</text>
  <rect class="advanced-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="advanced-when-name" x="46" y="122">The symptom</text>
  <text class="advanced-when-desc" x="46" y="142">What you observe.</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r0" x="46" y="182">Right passage retrieved but ranked low</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r1" x="46" y="216">Relevant passage never retrieved</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r2" x="46" y="250">Retrieved chunk lacks its context</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r3" x="46" y="284">Question contains a date or category</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r4" x="46" y="318">Answers vague across many documents</text>
  <rect class="advanced-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="advanced-when-name" x="526" y="122">The pattern</text>
  <text class="advanced-when-desc" x="526" y="142">What to try.</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r0" x="526" y="182">Reranking</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r1" x="526" y="216">Multi-query, or hypothetical answers</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r2" x="526" y="250">Small-to-big expansion</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r3" x="526" y="284">Self-querying filters</text>
  <text class="advanced-when-desc advanced-when-row advanced-when-r4" x="526" y="318">Better chunking, before any of these</text>
  <text class="advanced-when-sub" x="30" y="372">The last row is the most common correct answer: several of these patterns are adopted to compensate for chunking that should have been fixed instead.</text>
</svg>
