<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One question, several searches.">
  <title>Multi-query expansion</title>
  <style>
    .multi-query-bg   { fill: #f8fafc; }
    .multi-query-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-query-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-query-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-query-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-query-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-query-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multi-query-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multi-query-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multi-query-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multi-query-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multi-query-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multi-query-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multi-query-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multi-query-stage { opacity: 1; }

    .multi-query-s0 { animation-delay: 0.00s; }
    .multi-query-e0 { animation-delay: 0.00s; }
    .multi-query-s1 { animation-delay: 1.28s; }
    .multi-query-e1 { animation-delay: 1.28s; }
    .multi-query-s2 { animation-delay: 2.56s; }
    .multi-query-e2 { animation-delay: 2.56s; }
    .multi-query-s3 { animation-delay: 3.84s; }
    .multi-query-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .multi-query-conn  { animation: multi-query-trace 6.4s ease-in-out infinite; }
      .multi-query-stage { animation: multi-query-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes multi-query-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multi-query-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multi-query-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multi-query-stage { animation: multi-query-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multi-query-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multi-query-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multi-query-bg" width="980" height="322"/>
  <text class="multi-query-h1"  x="30" y="40">Multi-query expansion</text>
  <text class="multi-query-sub" x="30" y="64">One question, several searches.</text>
  <g class="multi-query-stage multi-query-s0">
    <rect class="multi-query-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="multi-query-step" x="44" y="142">01</text>
    <text class="multi-query-name" x="70" y="142">One phrasing may miss the right passage</text>
    <text class="multi-query-desc" x="44" y="166">Which used different words for</text>
    <text class="multi-query-desc" x="44" y="182">the same thing.</text>
  </g>
  <line class="multi-query-line multi-query-conn multi-query-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#multi-query-tip)"/>
  <g class="multi-query-stage multi-query-s1">
    <rect class="multi-query-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="multi-query-step" x="280" y="142">02</text>
    <text class="multi-query-name" x="306" y="142">Generate several rephrasings</text>
    <text class="multi-query-desc" x="280" y="166">With a cheap model, in one call.</text>
  </g>
  <line class="multi-query-line multi-query-conn multi-query-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#multi-query-tip)"/>
  <g class="multi-query-stage multi-query-s2">
    <rect class="multi-query-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="multi-query-step" x="516" y="142">03</text>
    <text class="multi-query-name" x="542" y="142">Retrieve for each, in parallel</text>
    <text class="multi-query-desc" x="516" y="166">Producing several candidate</text>
    <text class="multi-query-desc" x="516" y="182">lists.</text>
  </g>
  <line class="multi-query-line multi-query-conn multi-query-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#multi-query-tip)"/>
  <g class="multi-query-stage multi-query-s3">
    <rect class="multi-query-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="multi-query-step" x="752" y="142">04</text>
    <text class="multi-query-name" x="778" y="142">And fuse them by rank</text>
    <text class="multi-query-desc" x="752" y="166">Which raises recall</text>
    <text class="multi-query-desc" x="752" y="182">substantially.</text>
    <text class="multi-query-edge" x="752" y="242">one extra call</text>
  </g>
  <text class="multi-query-sub" x="30" y="304">This costs one small model call and several parallel searches, which is why it is usually the first pattern worth trying after reranking.</text>
</svg>
