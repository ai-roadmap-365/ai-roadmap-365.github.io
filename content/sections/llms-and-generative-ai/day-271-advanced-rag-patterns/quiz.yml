questions:
  - question: 'In HyDE, why does it not matter if the hypothetical answer contains factual errors?'
    options:
      - 'Errors are removed by lowercasing and stripping punctuation'
      - 'The errors are corrected by the reranking stage before generation'
      - 'The model verifies the hypothetical against the corpus before searching'
      - 'It is never shown to anyone; only its vector is used as the query'
    answer_index: 3
    explanation: 'The hypothetical exists to be a paragraph-shaped probe in roughly the right region of embedding space. It is discarded after embedding.'

  - question: 'Which advanced technique costs nothing at query time?'
    options:
      - 'Small-to-big retrieval, which is an indexing decision'
      - 'Multi-query expansion, because the variants run in parallel'
      - 'HyDE, because the hypothetical answer is short'
      - 'Self-querying, because filters are applied by the database'
    answer_index: 0
    explanation: 'Small-to-big is decided once when the index is built. Every other technique adds a model call or extra searches per query.'

  - question: 'Why does asking an embedding to handle papers after 2020 work badly?'
    options:
      - 'Embedding models are trained only on text published before 2020'
      - 'A date range is a filter, and vectors cannot do arithmetic'
      - 'The year is tokenised into digits that carry no meaning'
      - 'Semantic search returns results in chronological order already'
    answer_index: 1
    explanation: 'Self-querying extracts the constraint and applies it as a database filter, leaving the embedding to do the part it is good at.'

  - question: 'What is the strict precedence when fixing a retrieval problem?'
    options:
      - 'Query expansion, then ranking, then chunking'
      - 'Ranking, then chunking, then query expansion'
      - 'Chunking, then query expansion, then ranking'
      - 'All three can be tuned independently in any order'
    answer_index: 2
    explanation: 'No query expansion recovers a fact that chunking destroyed, and no reranker promotes a document retrieval never returned.'

  - question: 'Why measure a baseline before adopting these techniques?'
    options:
      - 'Without one, the embedding model cannot be initialised'
      - 'The techniques are only licensed for use after benchmarking'
      - 'Baselines are required to compute Reciprocal Rank Fusion'
      - 'Advanced is not a synonym for better, and each adds latency'
    answer_index: 3
    explanation: 'On a corpus where naive retrieval already finds the right chunk, every technique adds cost and changes nothing.'
