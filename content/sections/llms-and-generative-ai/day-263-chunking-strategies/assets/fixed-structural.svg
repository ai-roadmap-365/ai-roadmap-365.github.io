<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where to cut.">
  <title>Fixed size against structure</title>
  <style>
    .fixed-structural-bg   { fill: #f8fafc; }
    .fixed-structural-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixed-structural-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixed-structural-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixed-structural-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixed-structural-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixed-structural-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fixed-structural-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fixed-structural-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fixed-structural-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fixed-structural-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fixed-structural-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fixed-structural-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fixed-structural-row { opacity: 1; }
    .fixed-structural-r0 { animation-delay: 0.00s; }
    .fixed-structural-r1 { animation-delay: 0.45s; }
    .fixed-structural-r2 { animation-delay: 0.90s; }
    .fixed-structural-r3 { animation-delay: 1.35s; }
    .fixed-structural-r4 { animation-delay: 1.80s; }
    .fixed-structural-row { animation: fixed-structural-reveal 7.3s ease-in-out infinite; }
    @keyframes fixed-structural-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fixed-structural-bg" width="980" height="390"/>
  <text class="fixed-structural-h1"  x="30" y="40">Fixed size against structure</text>
  <text class="fixed-structural-sub" x="30" y="64">Where to cut.</text>
  <rect class="fixed-structural-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fixed-structural-name" x="46" y="122">Fixed size</text>
  <text class="fixed-structural-desc" x="46" y="142">Cut every N tokens.</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r0" x="46" y="182">Simple, and uniform</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r1" x="46" y="216">Cuts mid-sentence and mid-table</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r2" x="46" y="250">Ignores headings entirely</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r3" x="46" y="284">Needs overlap to compensate</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r4" x="46" y="318">Fine only for unstructured prose</text>
  <rect class="fixed-structural-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fixed-structural-name" x="526" y="122">Structure-aware</text>
  <text class="fixed-structural-desc" x="526" y="142">Cut at boundaries.</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r0" x="526" y="182">Splits at headings and sections</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r1" x="526" y="216">Keeps functions and tables whole</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r2" x="526" y="250">Uneven sizes, which is correct</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r3" x="526" y="284">Section titles available as metadata</text>
  <text class="fixed-structural-desc fixed-structural-row fixed-structural-r4" x="526" y="318">Right for almost everything</text>
  <text class="fixed-structural-sub" x="30" y="372">Documents already contain the boundaries you want, which is why structure-aware splitting is usually less work than fixed-size splitting rather than more.</text>
</svg>
