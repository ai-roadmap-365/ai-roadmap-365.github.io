<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which resolves the tension.">
  <title>Retrieve small, supply large</title>
  <style>
    .parent-doc-bg   { fill: #f8fafc; }
    .parent-doc-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parent-doc-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parent-doc-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parent-doc-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parent-doc-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parent-doc-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parent-doc-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parent-doc-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parent-doc-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parent-doc-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parent-doc-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parent-doc-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .parent-doc-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .parent-doc-stage { opacity: 1; }

    .parent-doc-s0 { animation-delay: 0.00s; }
    .parent-doc-e0 { animation-delay: 0.00s; }
    .parent-doc-s1 { animation-delay: 1.28s; }
    .parent-doc-e1 { animation-delay: 1.28s; }
    .parent-doc-s2 { animation-delay: 2.56s; }
    .parent-doc-e2 { animation-delay: 2.56s; }
    .parent-doc-s3 { animation-delay: 3.84s; }
    .parent-doc-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .parent-doc-conn  { animation: parent-doc-trace 6.4s ease-in-out infinite; }
      .parent-doc-stage { animation: parent-doc-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes parent-doc-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes parent-doc-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .parent-doc-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .parent-doc-stage { animation: parent-doc-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes parent-doc-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="parent-doc-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="parent-doc-bg" width="980" height="322"/>
  <text class="parent-doc-h1"  x="30" y="40">Retrieve small, supply large</text>
  <text class="parent-doc-sub" x="30" y="64">Which resolves the tension.</text>
  <g class="parent-doc-stage parent-doc-s0">
    <rect class="parent-doc-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="parent-doc-step" x="44" y="142">01</text>
    <text class="parent-doc-name" x="70" y="142">Index small, precise chunks</text>
    <text class="parent-doc-desc" x="44" y="166">A paragraph, or less.</text>
  </g>
  <line class="parent-doc-line parent-doc-conn parent-doc-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#parent-doc-tip)"/>
  <g class="parent-doc-stage parent-doc-s1">
    <rect class="parent-doc-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="parent-doc-step" x="280" y="142">02</text>
    <text class="parent-doc-name" x="306" y="142">Match the query against those</text>
    <text class="parent-doc-desc" x="280" y="166">Which gives sharp, specific</text>
    <text class="parent-doc-desc" x="280" y="182">retrieval.</text>
  </g>
  <line class="parent-doc-line parent-doc-conn parent-doc-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#parent-doc-tip)"/>
  <g class="parent-doc-stage parent-doc-s2">
    <rect class="parent-doc-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="parent-doc-step" x="516" y="142">03</text>
    <text class="parent-doc-name" x="542" y="142">But return the surrounding section</text>
    <text class="parent-doc-desc" x="516" y="166">The parent the chunk came from.</text>
  </g>
  <line class="parent-doc-line parent-doc-conn parent-doc-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#parent-doc-tip)"/>
  <g class="parent-doc-stage parent-doc-s3">
    <rect class="parent-doc-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="parent-doc-step" x="752" y="142">04</text>
    <text class="parent-doc-name" x="778" y="142">So the model gets full context</text>
    <text class="parent-doc-desc" x="752" y="166">Precision in matching,</text>
    <text class="parent-doc-desc" x="752" y="182">completeness in reading.</text>
    <text class="parent-doc-edge" x="752" y="242">both</text>
  </g>
  <text class="parent-doc-sub" x="30" y="304">This gets both properties instead of trading between them, which is why it is the default recommendation in most current retrieval guidance.</text>
</svg>
