<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All downstream.">
  <title>Four consequences of chunking choices</title>
  <style>
    .chunk-implications-bg   { fill: #f8fafc; }
    .chunk-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunk-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chunk-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chunk-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chunk-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chunk-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chunk-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chunk-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chunk-implications-stage { opacity: 1; }

    .chunk-implications-s0 { animation-delay: 0.00s; }
    .chunk-implications-e0 { animation-delay: 0.00s; }
    .chunk-implications-s1 { animation-delay: 1.28s; }
    .chunk-implications-e1 { animation-delay: 1.28s; }
    .chunk-implications-s2 { animation-delay: 2.56s; }
    .chunk-implications-e2 { animation-delay: 2.56s; }
    .chunk-implications-s3 { animation-delay: 3.84s; }
    .chunk-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chunk-implications-conn  { animation: chunk-implications-trace 6.4s ease-in-out infinite; }
      .chunk-implications-stage { animation: chunk-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chunk-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chunk-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chunk-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chunk-implications-stage { animation: chunk-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chunk-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chunk-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chunk-implications-bg" width="980" height="322"/>
  <text class="chunk-implications-h1"  x="30" y="40">Four consequences of chunking choices</text>
  <text class="chunk-implications-sub" x="30" y="64">All downstream.</text>
  <g class="chunk-implications-stage chunk-implications-s0">
    <rect class="chunk-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-implications-step" x="44" y="142">01</text>
    <text class="chunk-implications-name" x="70" y="142">It caps retrieval quality</text>
    <text class="chunk-implications-desc" x="44" y="166">More than the embedding model</text>
    <text class="chunk-implications-desc" x="44" y="182">choice does.</text>
  </g>
  <line class="chunk-implications-line chunk-implications-conn chunk-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chunk-implications-tip)"/>
  <g class="chunk-implications-stage chunk-implications-s1">
    <rect class="chunk-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-implications-step" x="280" y="142">02</text>
    <text class="chunk-implications-name" x="306" y="142">And chunk size drives token cost</text>
    <text class="chunk-implications-desc" x="280" y="166">Every retrieved chunk is billed</text>
    <text class="chunk-implications-desc" x="280" y="182">as input.</text>
  </g>
  <line class="chunk-implications-line chunk-implications-conn chunk-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chunk-implications-tip)"/>
  <g class="chunk-implications-stage chunk-implications-s2">
    <rect class="chunk-implications-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-implications-step" x="516" y="142">03</text>
    <text class="chunk-implications-name" x="542" y="142">Smaller chunks give precise citations</text>
    <text class="chunk-implications-desc" x="516" y="166">Which users trust more than a</text>
    <text class="chunk-implications-desc" x="516" y="182">whole-document reference.</text>
  </g>
  <line class="chunk-implications-line chunk-implications-conn chunk-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chunk-implications-tip)"/>
  <g class="chunk-implications-stage chunk-implications-s3">
    <rect class="chunk-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-implications-step" x="752" y="142">04</text>
    <text class="chunk-implications-name" x="778" y="142">But changing the strategy means re-indexing everything</text>
    <text class="chunk-implications-desc" x="752" y="166">So evaluate before committing at</text>
    <text class="chunk-implications-desc" x="752" y="182">scale.</text>
  </g>
  <text class="chunk-implications-sub" x="30" y="304">Evaluating chunking on a sample before indexing a full corpus is worth the delay: it is the cheapest experiment in the whole pipeline and the most expensive one to redo.</text>
</svg>
