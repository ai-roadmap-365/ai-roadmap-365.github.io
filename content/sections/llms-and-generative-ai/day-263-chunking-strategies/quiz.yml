questions:
  - question: 'What is the primary danger of using small fixed-size chunks (e.g. 100 tokens) without overlap in RAG systems?'
    options:
      - 'Semantic fragmentation: critical facts spanning across sentence boundaries are cut in half, destroying context and causing retrieval failures'
      - 'The vector database crashes immediately'
      - 'The embedding dimension increases by 10x'
      - 'Text becomes encrypted'
    answer_index: 0
    explanation: 'Splitting across sentences severs context and relationship semantics between subject and predicate.'
  - question: 'How does Markdown Structure-Aware Chunking preserve contextual grounding for downstream LLM generation?'
    options:
      - 'By splitting text along logical heading hierarchies (#, ##, ###) and injecting the ancestral breadcrumb trail into chunk metadata'
      - 'By converting Markdown into binary bytecode'
      - 'By removing all punctuation'
      - 'By deleting Markdown code blocks'
    answer_index: 0
    explanation: 'Preserving heading breadcrumbs (e.g. Doc > Section > Subsection) grounds the LLM in the exact topic domain.'
  - question: 'How does Semantic Chunking determine where to create a split in a document?'
    options:
      - 'By calculating embedding cosine similarity between consecutive sentences and splitting when similarity drops below a percentile threshold'
      - 'By splitting after every 25th word'
      - 'By counting vowel frequency'
      - 'By using regular expression character counts'
    answer_index: 0
    explanation: 'Semantic chunking identifies topical transition boundaries where vector similarity drops significantly.'
  - question: 'What architectural problem does the Parent-Document (Hierarchical) Retriever solve?'
    options:
      - 'The embedding-generation trade-off: small child chunks (128t) produce fine-grained search matches, while full parent docs (1024t) provide complete context to the LLM'
      - 'It compresses hard drives'
      - 'It generates audio files from text'
      - 'It replaces the vector database entirely'
    answer_index: 0
    explanation: 'Small chunks yield high retrieval precision, while large parent docs eliminate missing-context hallucinations in the LLM.'
  - question: 'Why is chunk size measured in tokenizer tokens (e.g. tiktoken/cl100k_base) rather than raw character or word counts?'
    options:
      - 'Because embedding models and LLMs enforce strict token count limits, and character lengths vary wildly across code, markdown, and multilingual scripts'
      - 'Because characters do not exist in Python'
      - 'Because tokenizers use less memory'
      - 'Because word counts are illegal in production'
    answer_index: 0
    explanation: 'Embedding context windows and transformer attention compute strictly according to token counts.'
