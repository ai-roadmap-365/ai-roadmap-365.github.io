terms:
  - term: 'Chunking'
    definition: 'The process of partitioning large documents into smaller, cohesive text segments suitable for embedding and retrieval.'
  - term: 'Sliding Window Overlap'
    definition: 'A technique where adjacent chunks share N trailing/leading tokens to preserve contextual continuity across boundaries.'
  - term: 'Structure-Aware Chunking'
    definition: 'Splitting documents based on intrinsic syntax markers such as Markdown headers, HTML tags, or Python class definitions.'
  - term: 'Semantic Chunking'
    definition: 'An adaptive splitting algorithm that detects topic transitions by measuring cosine similarity drops between sentences.'
  - term: 'Parent-Document Retrieval'
    definition: 'A two-stage pattern indexing small child chunks for vector search, but passing the larger parent document to the LLM.'
  - term: 'Tokenization'
    definition: 'Converting text strings into sub-word integer tokens using BPE algorithms (e.g. tiktoken, cl100k_base).'
  - term: 'Context Dilution'
    definition: 'When a chunk is too large, causing irrelevant information to dilute the core semantic signal in the embedding vector.'
  - term: 'Semantic Fragmentation'
    definition: 'When a chunk is too small, splitting an atomic fact across boundaries and rendering both fragments unretrievable.'
