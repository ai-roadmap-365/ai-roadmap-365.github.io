visuals:
  - id: chunking-strategies-comparative-pipeline
    file: assets/chunking-strategies-comparative-pipeline.svg
    type: diagram
    title: 'RAG Chunking Strategies Comparison'
    alt: Chunking strategies comparative pipeline diagram
    description: 'Comparative overview of Fixed Window, Structure-Aware, Semantic, and Parent-Child Hierarchical Chunking.'
  - id: sliding-window-overlap-context-preservation
    file: assets/sliding-window-overlap-context-preservation.svg
    type: diagram
    title: 'Sliding Window Overlap Context Preservation'
    alt: Sliding window overlap context preservation diagram
    description: 'Demonstrating how sliding token overlap prevents critical semantic rupture at chunk boundaries.'
  - id: chunk-idea
    file: assets/chunk-idea.svg
    type: diagram
    title: 'The chunking tension'
    alt: 'Diagram: why chunk size trades specificity against self-containment'
    description: 'A four-stage description of the chunking trade-off covering small chunks, their weakness, large chunks and their weakness.'
  - id: fixed-structural
    file: assets/fixed-structural.svg
    type: diagram
    title: 'Fixed size against structure'
    alt: 'Diagram: fixed-size splitting compared with structure-aware splitting'
    description: 'A two-column comparison of splitting text at fixed lengths against splitting at structural boundaries.'
  - id: parent-doc
    file: assets/parent-doc.svg
    type: diagram
    title: 'Retrieve small, supply large'
    alt: 'Diagram: how small chunks are matched but larger passages are supplied to the model'
    description: 'A four-stage description of hierarchical retrieval covering small chunk indexing, the match, parent expansion and the supplied context.'
  - id: tables
    file: assets/tables.svg
    type: diagram
    title: 'Tables need different handling'
    alt: 'Diagram: how tabular content is chunked without losing its structure'
    description: 'A four-stage description of table handling covering the splitting failure, whole-table chunks, row expansion and the summary.'
  - id: chunk-metadata
    file: assets/chunk-metadata.svg
    type: diagram
    title: 'What to store with each chunk'
    alt: 'Diagram: the four metadata fields attached to each retrievable chunk'
    description: 'A four-stage description of chunk metadata covering source, position, timestamp and permissions.'
  - id: cutting-film
    file: assets/cutting-film.svg
    type: diagram
    title: 'Cutting a film'
    alt: 'Diagram: cutting at fixed intervals compared with cutting at scene boundaries'
    description: 'A two-column comparison of arbitrary cuts against cuts at natural boundaries.'
  - id: chunk-implications
    file: assets/chunk-implications.svg
    type: diagram
    title: 'Four consequences of chunking choices'
    alt: 'Diagram: the quality, cost, citation and rework implications of chunking strategy'
    description: 'A four-stage description of chunking implications covering retrieval quality, token cost, citation precision and the cost of changing strategy.'
  - id: chunk-when
    file: assets/chunk-when.svg
    type: diagram
    title: 'Which chunking strategy'
    alt: 'Diagram: choosing a chunking strategy by document type'
    description: 'A two-column comparison of structure-aware chunking against fixed-size chunking by document type.'
  - id: overlap
    file: assets/overlap.svg
    type: diagram
    title: 'Why chunks overlap'
    alt: 'Diagram: how overlapping chunk boundaries prevent information loss at cuts'
    description: 'A four-stage description of chunk overlap covering the boundary problem, the overlap, the resulting redundancy and the tuning.'
  - id: late-chunking
    file: assets/late-chunking.svg
    type: diagram
    title: 'Chunk then embed, or embed then chunk'
    alt: 'Diagram: chunking before embedding compared with embedding the whole document first'
    description: 'A two-column comparison of chunking before embedding against embedding the full document and pooling afterwards.'
