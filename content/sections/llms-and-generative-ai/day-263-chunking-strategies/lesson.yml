learning_promise: 'Master document segmentation and text chunking strategies for production RAG pipelines: evaluate Fixed-Size Chunking with sliding token overlap, Markdown/Code Structure-Aware Boundary Parsing, Semantic Similarity Chunking via cosine thresholding, and Parent-Document / Hierarchical Chunking; analyze context window trade-offs, retrieval fragmentation, boundary loss, and implement a production multi-strategy chunker in Python.'
objectives:
  - 'Differentiate between Fixed-Size, Markdown Structure-Aware, Semantic, and Hierarchical Chunking.'
  - 'Calculate token overlaps to prevent critical semantic boundary severance.'
  - 'Implement a Markdown heading-aware document segmenter that preserves section hierarchies in metadata.'
  - 'Implement a Semantic Splitter calculating cosine similarity drops between consecutive sentences.'
  - 'Design a Parent-Document retriever storing small child chunks for search and large parent contexts for LLM generation.'
