learning_promise: 'Master the mathematical theory and implementation of neural network quantization and
  the GGUF binary format: derive symmetric and asymmetric quantization equations, analyze perplexity tradeoffs
  across K-quants (Q4_K_M, Q5_K_S, Q8_0), parse GGUF headers, and build an INT8 tensor quantizer in Python.'
objectives:
- 'Derive the mathematical formulation of affine and symmetric linear quantization: q = round(x / scale)
  + zero_point.'
- 'Evaluate memory bandwidth bottlenecks in autoregressive token generation: Bandwidth = Model_Size *
  Tokens_per_sec.'
- 'Compare modern GGUF quantization levels: Q4_0 vs Q4_K_M vs Q5_K_M vs Q8_0 across VRAM and perplexity.'
- Parse binary GGUF file headers to extract architecture metadata and tensor descriptor tables.
- Implement a vectorized INT8 tensor quantizer, dequantizer, and Mean Squared Error (MSE) calculator in
  Python.
