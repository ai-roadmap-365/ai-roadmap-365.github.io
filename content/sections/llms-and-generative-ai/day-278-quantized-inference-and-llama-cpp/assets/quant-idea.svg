<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Quantisation</title>
  <style>
    .quant-idea-bg   { fill: #f8fafc; }
    .quant-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quant-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quant-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quant-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quant-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quant-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quant-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .quant-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .quant-idea-stage { opacity: 1; }

    .quant-idea-s0 { animation-delay: 0.00s; }
    .quant-idea-e0 { animation-delay: 0.00s; }
    .quant-idea-s1 { animation-delay: 1.28s; }
    .quant-idea-e1 { animation-delay: 1.28s; }
    .quant-idea-s2 { animation-delay: 2.56s; }
    .quant-idea-e2 { animation-delay: 2.56s; }
    .quant-idea-s3 { animation-delay: 3.84s; }
    .quant-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .quant-idea-conn  { animation: quant-idea-trace 6.4s ease-in-out infinite; }
      .quant-idea-stage { animation: quant-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes quant-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes quant-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .quant-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .quant-idea-stage { animation: quant-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes quant-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="quant-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="quant-idea-bg" width="980" height="322"/>
  <text class="quant-idea-h1"  x="30" y="40">Quantisation</text>
  <text class="quant-idea-sub" x="30" y="64">Four steps.</text>
  <g class="quant-idea-stage quant-idea-s0">
    <rect class="quant-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="quant-idea-step" x="44" y="142">01</text>
    <text class="quant-idea-name" x="70" y="142">Weights are stored at sixteen bits</text>
    <text class="quant-idea-desc" x="44" y="166">Which is already half of full</text>
    <text class="quant-idea-desc" x="44" y="182">precision.</text>
  </g>
  <line class="quant-idea-line quant-idea-conn quant-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#quant-idea-tip)"/>
  <g class="quant-idea-stage quant-idea-s1">
    <rect class="quant-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="quant-idea-step" x="280" y="142">02</text>
    <text class="quant-idea-name" x="306" y="142">Find the range within a small block</text>
    <text class="quant-idea-desc" x="280" y="166">And a scale that maps it onto</text>
    <text class="quant-idea-desc" x="280" y="182">few integers.</text>
  </g>
  <line class="quant-idea-line quant-idea-conn quant-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#quant-idea-tip)"/>
  <g class="quant-idea-stage quant-idea-s2">
    <rect class="quant-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="quant-idea-step" x="516" y="142">03</text>
    <text class="quant-idea-name" x="542" y="142">Store four or five bits per weight</text>
    <text class="quant-idea-desc" x="516" y="166">Three to four times smaller.</text>
  </g>
  <line class="quant-idea-line quant-idea-conn quant-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#quant-idea-tip)"/>
  <g class="quant-idea-stage quant-idea-s3">
    <rect class="quant-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="quant-idea-step" x="752" y="142">04</text>
    <text class="quant-idea-name" x="778" y="142">Which buys both capacity and speed</text>
    <text class="quant-idea-desc" x="752" y="166">Because generation is bandwidth</text>
    <text class="quant-idea-desc" x="752" y="182">bound.</text>
    <text class="quant-idea-edge" x="752" y="242">3-4x</text>
  </g>
  <text class="quant-idea-sub" x="30" y="304">The speed benefit is the part usually overlooked: fewer bytes per weight means less memory traffic per token, which is the actual bottleneck in generation.</text>
</svg>
