<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Symmetric Quantization and Dequantization Flow">
  <title>Symmetric Quantization and Dequantization Flow</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d278f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d278f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d278f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d278f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d278f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d278f-arrowhead); }
      .d278f-pulse { animation: d278f-glow 2.5s infinite ease-in-out; }
      @keyframes d278f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d278f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d278f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d278f-box" x="0" y="0" width="200" height="70" />
    <text class="d278f-header" x="15" y="30">1. Continuous Float x</text>
    <text class="d278f-text" x="15" y="50">FP32 / FP16 range [-M, M]</text>

    <path class="d278f-arrow" d="M 200 35 L 260 35" />

    <rect class="d278f-box d278f-pulse" x="260" y="0" width="220" height="70" />
    <text class="d278f-header" x="15" y="30">2. Scale Computation</text>
    <text class="d278f-accent" x="15" y="50">scale = max(|x|) / 127.0</text>

    <path class="d278f-arrow" d="M 480 35 L 540 35" />

    <rect class="d278f-box" x="540" y="0" width="220" height="70" />
    <text class="d278f-header" x="15" y="30">3. Quantize to INT8</text>
    <text class="d278f-text" x="15" y="50">q = clamp(round(x/s), -128, 127)</text>

    <path class="d278f-arrow" d="M 650 70 L 650 130" />

    <rect class="d278f-box" x="540" y="130" width="220" height="70" />
    <text class="d278f-header" x="15" y="30">4. Dequantize on Load</text>
    <text class="d278f-accent" x="15" y="50">x_approx = q * scale</text>
  </g>

</svg>