terms:
- term: Quantization
  definition: The process of mapping continuous floating-point weights (FP32/FP16) to discrete lower-bit
    integer representations (INT8/INT4).
- term: GGUF (GPT-Generated Unified Format)
  definition: The standard binary container format for storing quantized models and extensible metadata
    in llama.cpp.
- term: Memory Bandwidth Bound
  definition: A computational regime where execution speed is limited by the rate at which data can be
    transferred from RAM/VRAM into compute cores.
- term: Symmetric Quantization
  definition: Quantization where the floating point zero maps directly to integer zero (zero_point = 0),
    simplifying hardware arithmetic.
- term: K-Quants
  definition: llama.cpp super-block quantization methods (e.g. Q4_K_M, Q5_K_S) that assign variable bit
    precisions across different tensor blocks.
- term: Perplexity
  definition: An information-theoretic metric measuring how well a probability model predicts a sample;
    lower perplexity indicates higher model accuracy.
- term: Dequantization
  definition: 'Reconstructing an approximate floating-point tensor from quantized integer codes: x_approx
    = q * scale + zero_point.'
- term: Scale Factor
  definition: The floating-point multiplier used to map discrete integer buckets back to the original
    dynamic range.
