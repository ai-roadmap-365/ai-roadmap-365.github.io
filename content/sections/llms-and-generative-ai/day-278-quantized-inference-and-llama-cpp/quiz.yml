questions:
- question: Why is autoregressive LLM token generation primarily memory-bandwidth bound rather than compute-bound?
  options:
  - Because transformer matrix multiplication uses non-linear activations
  - Because generating each single token requires loading the entire model weight tensor from memory to
    the processor cores once, meaning token speed is limited by memory transfer throughput (GB/s)
  - Because the CPU clock speed drops during floating-point operations
  - Because prompt tokens are cached on disk
  answer_index: 1
  explanation: During single-batch token generation, every forward pass reads every model weight from
    RAM/VRAM into compute cores to produce just one token. Token throughput is directly proportional to
    Memory Bandwidth / Model Weight Size in Bytes.
- question: In symmetric linear INT8 quantization, how is the scale factor 's' calculated for a weight
    tensor x?
  options:
  - s = sum(x) / 128.0
  - s = max(|x|) / 127.0
  - s = std(x) / 256.0
  - s = min(x) / -128.0
  answer_index: 1
  explanation: Symmetric quantization maps the maximum absolute value of the floating point tensor max(|x|)
    symmetrically to the INT8 maximum range (127), ensuring zero_point = 0.
- question: What is the primary architectural advantage of the GGUF binary format over legacy GGML?
  options:
  - GGUF models only run inside Docker containers
  - GGUF incorporates extensible key-value metadata directly in the file header, preventing breaking changes
    when new architectures, tokenizers, or hyperparameter types are introduced
  - GGUF forces all models to be 8-bit quantized
  - GGUF compresses text using ZIP compression
  answer_index: 1
  explanation: GGUF replaces hardcoded struct layouts with a flexible key-value metadata dictionary and
    tensor metadata table, allowing llama.cpp to support new model families without breaking existing
    tools.
- question: What does a 'K-quant' format like Q4_K_M represent in llama.cpp?
  options:
  - A model that only runs on Kubernetes
  - A mixed-precision quantization scheme where critical layers (such as attention V and output projections)
    use higher bit precision (e.g. 5-bit or 6-bit) while less sensitive layers use 4-bit, minimizing perplexity
    loss
  - A 4-bit model compressed with Kalman filtering
  - A model with rank-4 LoRA adapters permanently merged
  answer_index: 1
  explanation: 'K-quants use super-block mixed quantization: they allocate higher bit precision to attention
    projections and layers that most impact perplexity, while aggressively quantizing less sensitive feed-forward
    weights.'
- question: What happens to the model's perplexity as quantization aggressiveness increases from FP16
    to Q4_0 and Q2_K?
  options:
  - Perplexity decreases to zero
  - Perplexity remains exactly unchanged
  - Perplexity increases (degrades), with moderate increases in Q4_K_M (<0.05) and severe degradation
    in Q2_K (>1.5)
  - Perplexity only changes if the context window is expanded
  answer_index: 2
  explanation: Quantization introduces numerical rounding error. Lower bit-widths save memory and boost
    generation speed, but increase perplexity (loss of predictive confidence and nuanced reasoning).
