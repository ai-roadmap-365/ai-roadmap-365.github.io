<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Speed against accuracy.">
  <title>Encoding separately, or together</title>
  <style>
    .bi-cross-bg   { fill: #f8fafc; }
    .bi-cross-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-cross-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-cross-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-cross-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-cross-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-cross-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bi-cross-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bi-cross-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bi-cross-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bi-cross-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bi-cross-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bi-cross-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bi-cross-row { opacity: 1; }
    .bi-cross-r0 { animation-delay: 0.00s; }
    .bi-cross-r1 { animation-delay: 0.45s; }
    .bi-cross-r2 { animation-delay: 0.90s; }
    .bi-cross-r3 { animation-delay: 1.35s; }
    .bi-cross-r4 { animation-delay: 1.80s; }
    .bi-cross-row { animation: bi-cross-reveal 7.3s ease-in-out infinite; }
    @keyframes bi-cross-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bi-cross-bg" width="980" height="390"/>
  <text class="bi-cross-h1"  x="30" y="40">Encoding separately, or together</text>
  <text class="bi-cross-sub" x="30" y="64">Speed against accuracy.</text>
  <rect class="bi-cross-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bi-cross-name" x="46" y="122">Bi-encoder</text>
  <text class="bi-cross-desc" x="46" y="142">Encoded separately.</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r0" x="46" y="182">Documents embedded once, in advance</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r1" x="46" y="216">Query embedded at request time</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r2" x="46" y="250">One comparison per document, precomputed</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r3" x="46" y="284">Searches millions in milliseconds</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r4" x="46" y="318">Less accurate, because they never meet</text>
  <rect class="bi-cross-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bi-cross-name" x="526" y="122">Cross-encoder</text>
  <text class="bi-cross-desc" x="526" y="142">Encoded together.</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r0" x="526" y="182">Query and passage encoded jointly</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r1" x="526" y="216">Nothing can be precomputed</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r2" x="526" y="250">One full model pass per pair</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r3" x="526" y="284">Handles tens, not millions</text>
  <text class="bi-cross-desc bi-cross-row bi-cross-r4" x="526" y="318">Substantially more accurate</text>
  <text class="bi-cross-sub" x="30" y="372">Nothing being precomputable is exactly why the cross-encoder cannot search and exactly why it ranks better: it attends across the query and the passage together.</text>
</svg>
