<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One rank, or all of them.">
  <title>Two retrieval metrics</title>
  <style>
    .ir-metrics-bg   { fill: #f8fafc; }
    .ir-metrics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ir-metrics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ir-metrics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ir-metrics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ir-metrics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ir-metrics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ir-metrics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ir-metrics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ir-metrics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ir-metrics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ir-metrics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ir-metrics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ir-metrics-row { opacity: 1; }
    .ir-metrics-r0 { animation-delay: 0.00s; }
    .ir-metrics-r1 { animation-delay: 0.45s; }
    .ir-metrics-r2 { animation-delay: 0.90s; }
    .ir-metrics-r3 { animation-delay: 1.35s; }
    .ir-metrics-r4 { animation-delay: 1.80s; }
    .ir-metrics-row { animation: ir-metrics-reveal 7.3s ease-in-out infinite; }
    @keyframes ir-metrics-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ir-metrics-bg" width="980" height="390"/>
  <text class="ir-metrics-h1"  x="30" y="40">Two retrieval metrics</text>
  <text class="ir-metrics-sub" x="30" y="64">One rank, or all of them.</text>
  <rect class="ir-metrics-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ir-metrics-name" x="46" y="122">Reciprocal rank</text>
  <text class="ir-metrics-desc" x="46" y="142">Where is the first good one.</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r0" x="46" y="182">Position of the first relevant result</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r1" x="46" y="216">Simple and interpretable</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r2" x="46" y="250">Ignores everything after it</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r3" x="46" y="284">Right when one answer suffices</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r4" x="46" y="318">Common for question answering</text>
  <rect class="ir-metrics-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ir-metrics-name" x="526" y="122">Discounted gain</text>
  <text class="ir-metrics-desc" x="526" y="142">How good is the whole list.</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r0" x="526" y="182">Every result contributes, discounted by position</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r1" x="526" y="216">Handles graded relevance</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r2" x="526" y="250">Accounts for the full ranking</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r3" x="526" y="284">Right when several passages are supplied</text>
  <text class="ir-metrics-desc ir-metrics-row ir-metrics-r4" x="526" y="318">Common for retrieval-augmented generation</text>
  <text class="ir-metrics-sub" x="30" y="372">Since a retrieval system usually supplies several passages to the model, the graded metric is normally the more appropriate of the two.</text>
</svg>
