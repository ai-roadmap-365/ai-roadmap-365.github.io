<svg role="img" aria-label="Hybrid search sparse dense fusion pipeline diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Hybrid Search &amp; Re-Ranking Pipeline</title>
  <defs>
    <linearGradient id="bg264a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card264" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg264a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">HYBRID SEARCH &amp; NEURAL RE-RANKING PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Two-Stage Retrieval: Combining Sparse BM25 + Dense Vectors with Cross-Encoder Scoring</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card264)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- User Query -->
    <rect x="25" y="115" width="110" height="65" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="80" y="142" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">User Query</text>
    <text x="80" y="160" fill="#cbd5e1" font-size="7.5" text-anchor="middle">"Error 504 gateway"</text>

    <!-- Stage 1: Dual Retrieval -->
    <line x1="135" y1="135" x2="185" y2="70" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="135" y1="160" x2="185" y2="225" stroke="#34d399" stroke-width="1.5"/>

    <!-- Sparse BM25 -->
    <rect x="185" y="40" width="140" height="65" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="255" y="65" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">1. Sparse BM25</text>
    <text x="255" y="82" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Exact keyword match</text>
    <text x="255" y="94" fill="#fbbf24" font-size="7.5" text-anchor="middle">Top-50 Candidates</text>

    <!-- Dense Vector -->
    <rect x="185" y="190" width="140" height="65" fill="#0f172a" stroke="#34d399" rx="6"/>
    <text x="255" y="215" fill="#34d399" font-size="9.5" font-weight="700" text-anchor="middle">2. Dense Vector HNSW</text>
    <text x="255" y="232" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Semantic concept match</text>
    <text x="255" y="244" fill="#34d399" font-size="7.5" text-anchor="middle">Top-50 Candidates</text>

    <!-- Stage 2: RRF Fusion -->
    <line x1="325" y1="72" x2="375" y2="135" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="325" y1="222" x2="375" y2="160" stroke="#34d399" stroke-width="1.5"/>

    <rect x="375" y="115" width="130" height="65" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
    <text x="440" y="138" fill="#a78bfa" font-size="9.5" font-weight="700" text-anchor="middle">RRF Fusion</text>
    <text x="440" y="153" fill="#cbd5e1" font-size="7.5" text-anchor="middle">1 / (k + rank)</text>
    <text x="440" y="167" fill="#a78bfa" font-size="7.5" text-anchor="middle">Deduplicated Top-40</text>

    <!-- Stage 3: Cross-Encoder Re-Ranker -->
    <line x1="505" y1="147" x2="550" y2="147" stroke="#a78bfa" stroke-width="1.5"/>

    <rect x="550" y="105" width="180" height="85" fill="#0f172a" stroke="#fb7185" stroke-width="2" rx="6"/>
    <text x="640" y="130" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">Cross-Encoder Re-Ranker</text>
    <text x="640" y="147" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Full Pairwise Attention [Query, Doc]</text>
    <text x="640" y="160" fill="#34d399" font-size="7.5" font-weight="700" text-anchor="middle">Precision Top-5 -&gt; LLM Prompt</text>
    <text x="640" y="174" fill="#94a3b8" font-size="7" text-anchor="middle">Latency: ~15ms</text>
  </g>
</svg>
