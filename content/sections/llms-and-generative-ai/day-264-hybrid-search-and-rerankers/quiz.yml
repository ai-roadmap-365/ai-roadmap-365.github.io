questions:
  - question: 'Why does pure dense semantic vector search often fail on exact alphanumeric queries like error codes or product SKUs (e.g. "ERR_504_GW")?'
    options:
      - 'Tokenizers shatter rare identifiers into fragments'
      - 'Because vector databases do not accept numbers'
      - 'Because embeddings only work on English dictionary words'
      - 'Because cosine similarity cannot exceed 0.5'
    answer_index: 0
    explanation: 'Dense embeddings map rare strings into generalized semantic regions, losing exact character-level keyword specificity.'
  - question: 'How does Reciprocal Rank Fusion (RRF) calculate the combined score for a document appearing in multiple search candidate lists?'
    options:
      - 'By multiplying raw BM25 scores with cosine similarity'
      - 'Sum of 1 / (k + rank) across the rankings'
      - 'By averaging character counts'
      - 'By selecting only documents from the first ranking'
    answer_index: 1
    explanation: 'RRF uses positional rankings rather than incompatible raw score magnitudes to merge disparate result sets.'
  - question: 'What is the primary architectural difference between a Bi-Encoder and a Cross-Encoder?'
    options:
      - 'A Bi-Encoder is written in C, and a Cross-Encoder is in Python'
      - 'A Bi-Encoder requires two GPUs, while a Cross-Encoder requires four'
      - 'A bi-encoder embeds separately; a cross-encoder jointly'
      - 'There is no difference'
    answer_index: 2
    explanation: 'Cross-Encoders allow every query token to attend to every document token, achieving vastly superior relevance scoring at higher computational cost.'
  - question: 'Why is it computationally impractical to use a Cross-Encoder to search a 10,000,000 document vector database directly from scratch?'
    options:
      - 'Because PyTorch disables search loops'
      - 'Because Cross-Encoders cannot read English'
      - 'Because RAM is limited to 1 MB'
      - 'Cross-attention over ten million pairs would take minutes'
    answer_index: 3
    explanation: 'Cross-Encoders are computationally intensive O(N) forward passes, making them suitable only for re-ranking a small Top-50 candidate pool.'
  - question: 'What role does late-interaction retrieval (such as ColBERT) play in the retrieval spectrum?'
    options:
      - 'It keeps token vectors and does fast MaxSim matching'
      - 'It disables LLM generation'
      - 'It compresses text into ZIP archives'
      - 'It replaces SQL databases'
    answer_index: 0
    explanation: 'ColBERT keeps fine-grained token embeddings and computes MaxSim token alignments in sub-15ms.'
