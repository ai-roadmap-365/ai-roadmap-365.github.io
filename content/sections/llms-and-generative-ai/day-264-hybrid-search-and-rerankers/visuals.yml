visuals:
  - id: hybrid-search-sparse-dense-fusion-pipeline
    file: assets/hybrid-search-sparse-dense-fusion-pipeline.svg
    type: diagram
    title: 'Hybrid Search & Re-Ranking Pipeline'
    alt: Hybrid search sparse dense fusion pipeline diagram
    description: 'Two-stage retrieval architecture combining sparse BM25 and dense vector search via RRF followed by Cross-Encoder re-ranking.'
  - id: cross-encoder-vs-bi-encoder-attention
    file: assets/cross-encoder-vs-bi-encoder-attention.svg
    type: diagram
    title: 'Bi-Encoder vs Cross-Encoder Architecture'
    alt: Cross-encoder vs Bi-encoder attention comparison diagram
    description: 'Comparison of decoupled vector dot products versus full pairwise token-to-token cross-attention scoring.'
  - id: two-stage
    file: assets/two-stage.svg
    type: diagram
    title: 'The two-stage retrieval pattern'
    alt: 'Diagram: the two-stage retrieve-then-rerank retrieval pattern'
    description: 'A four-stage description of two-stage retrieval covering parallel retrieval, fusion, reranking and the final selection.'
  - id: bi-cross
    file: assets/bi-cross.svg
    type: diagram
    title: 'Encoding separately, or together'
    alt: 'Diagram: bi-encoder retrieval compared with cross-encoder reranking'
    description: 'A two-column comparison of independently encoded retrieval against jointly encoded reranking.'
  - id: rrf
    file: assets/rrf.svg
    type: diagram
    title: 'Fusing two ranked lists'
    alt: 'Diagram: how two ranked result lists are combined without comparing their scores'
    description: 'A four-stage description of rank fusion covering incompatible scores, rank-based scoring, summation and the result.'
  - id: bm25
    file: assets/bm25.svg
    type: diagram
    title: 'Why lexical scoring still matters'
    alt: 'Diagram: the four properties of statistical lexical retrieval'
    description: 'A four-stage description of lexical scoring covering term frequency, rare-term weighting, length normalisation and the resulting strengths.'
  - id: latency-budget
    file: assets/latency-budget.svg
    type: diagram
    title: 'Where the time goes'
    alt: 'Diagram: the latency budget of a two-stage retrieval pipeline'
    description: 'A four-stage description of retrieval latency covering query embedding, retrieval, reranking and generation.'
  - id: sifting
    file: assets/sifting.svg
    type: diagram
    title: 'A wide net, then a careful sort'
    alt: 'Diagram: a wide catch followed by careful sorting'
    description: 'A two-column comparison of a broad collection step against a careful selection step.'
  - id: hybrid-implications
    file: assets/hybrid-implications.svg
    type: diagram
    title: 'Four consequences of two-stage retrieval'
    alt: 'Diagram: the quality, cost, latency and complexity implications of hybrid retrieval with reranking'
    description: 'A four-stage description of hybrid retrieval implications covering quality gains, added infrastructure, latency and tuning burden.'
  - id: rerank-when
    file: assets/rerank-when.svg
    type: diagram
    title: 'When to add reranking'
    alt: 'Diagram: when reranking is worth its cost'
    description: 'A two-column comparison of situations warranting reranking against those where retrieval alone suffices.'
  - id: colbert
    file: assets/colbert.svg
    type: diagram
    title: 'Late interaction'
    alt: 'Diagram: late interaction retrieval compared with single-vector and cross-encoder approaches'
    description: 'A four-stage description of late interaction covering per-token vectors, precomputation, the matching operator and the resulting position.'
  - id: hybrid-history
    file: assets/hybrid-history.svg
    type: diagram
    title: 'Four steps to hybrid retrieval'
    alt: 'Diagram: the historical progression toward hybrid retrieval with reranking'
    description: 'A four-stage description of hybrid retrieval history covering lexical dominance, dense retrieval, the observed complementarity and standard two-stage pipelines.'
  - id: ir-metrics
    file: assets/ir-metrics.svg
    type: diagram
    title: 'Two retrieval metrics'
    alt: 'Diagram: reciprocal rank compared with discounted cumulative gain as retrieval metrics'
    description: 'A two-column comparison of a first-relevant-result metric against a graded ranking metric.'
