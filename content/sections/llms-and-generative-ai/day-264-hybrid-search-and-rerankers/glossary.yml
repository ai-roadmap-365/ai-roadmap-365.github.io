terms:
  - term: 'Hybrid Search'
    definition: 'A retrieval paradigm combining sparse keyword search (BM25) with dense semantic vector search.'
  - term: 'BM25 (Best Matching 25)'
    definition: 'A probabilistic term-matching ranking function based on Term Frequency and Inverse Document Frequency (TF-IDF).'
  - term: 'Reciprocal Rank Fusion (RRF)'
    definition: 'A rank-aggregation algorithm summing inverse rank positions to combine heterogeneous candidate lists without score calibration.'
  - term: 'Bi-Encoder'
    definition: 'A dual-encoder architecture embedding query and passage independently into fixed-dimensional vectors for fast dot product search.'
  - term: 'Cross-Encoder'
    definition: 'A transformer model processing concatenated query-document token pairs simultaneously with full pairwise cross-attention.'
  - term: 'Re-Ranking'
    definition: 'The second stage of retrieval where a computationally intensive model re-scores a small candidate pool (e.g. Top-50) down to Top-5.'
  - term: 'ColBERT (Late Interaction)'
    definition: 'A multi-vector retrieval model computing token-level MaxSim operations between query and document token matrices.'
  - term: 'Alpha Linear Fusion'
    definition: 'A convex weighted score combination: Final_Score = alpha * Dense_Score + (1 - alpha) * Sparse_Score.'
