terms:
  - term: 'Tool Use / Function Calling'
    definition: 'The capability of an LLM to detect when an external utility is needed, select the tool, and emit structured execution arguments.'
  - term: 'JSON Schema'
    definition: 'A standard declarative vocabulary for defining and validating the data types, required fields, and constraints of tool parameters.'
  - term: 'tool_use / tool_calls'
    definition: 'The structured content block emitted by the model specifying the tool name, unique ID, and argument dictionary.'
  - term: 'tool_result / role: tool'
    definition: 'The message block returned by the host application containing the output payload of the executed function.'
  - term: 'Tool Dispatcher'
    definition: 'The client-side registry mapping tool string names to executable Python functions with parameter validation.'
  - term: 'Parallel Tool Calling'
    definition: 'Emitting multiple tool invocations simultaneously within a single response turn to optimize latency.'
  - term: 'Agent Execution Loop'
    definition: 'A cyclical multi-turn loop that repeatedly executes tools and feeds results back to the model until a final answer is synthesized.'
  - term: 'Strict Tool Schema'
    definition: 'Enforcing 100% adherence to JSON schemas during generation via constrained grammar decoding.'
