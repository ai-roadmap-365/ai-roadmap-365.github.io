questions:
  - question: 'Does a foundation model (e.g. Claude or GPT-4o) execute external Python code directly on the model hosting server?'
    options:
      - 'Yes: via a hidden SSH terminal connection'
      - 'Yes: the model runs arbitrary Python code on GPU memory'
      - 'No — it emits a call; your code runs the function'
      - 'No: tools can only execute JavaScript'
    answer_index: 2
    explanation: 'Models only decide which tool to call and formulate the arguments; local application code executes the tool.'
  - question: 'What is the role of tool_call_id (or id) in the tool calling protocol?'
    options:
      - 'It stores the user password'
      - 'It measures token latency'
      - 'It encrypts the model weights'
      - 'It correlates the call with its tool_result'
    answer_index: 3
    explanation: 'The tool call ID ensures the model maps the returned output to the exact tool call requested.'
  - question: 'What is Parallel Tool Calling?'
    options:
      - 'Emitting several independent tool calls in one turn'
      - 'Running two LLMs at the same time'
      - 'Using two computers to type prompts'
      - 'Executing tools in binary code'
    answer_index: 0
    explanation: 'Parallel tool calling allows models to batch independent operations in a single inference step.'
  - question: 'Why is it critical to enforce a max_iterations boundary on recursive agent tool execution loops?'
    options:
      - 'Because Python loops crash after 10 turns'
      - 'To stop infinite tool loops burning budget'
      - 'Because API keys expire after 5 minutes'
      - 'To clear the GPU cache'
    answer_index: 1
    explanation: 'Bounding loop iterations protects against runaway recursion and infinite billing spikes.'
  - question: 'How should exceptions during tool execution (e.g. DatabaseConnectionError) be communicated back to the model?'
    options:
      - 'Delete the conversation history'
      - 'Crash the client Python script immediately'
      - 'Return it as a tool_result with is_error set'
      - 'Send a blank string'
    answer_index: 2
    explanation: 'Returning structured error messages in tool results enables the model to self-correct or notify the user gracefully.'
