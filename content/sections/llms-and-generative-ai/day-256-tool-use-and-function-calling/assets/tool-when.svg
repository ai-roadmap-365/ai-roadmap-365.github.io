<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to give a model tools</title>
  <style>
    .tool-when-bg   { fill: #f8fafc; }
    .tool-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-when-row { opacity: 1; }
    .tool-when-r0 { animation-delay: 0.00s; }
    .tool-when-r1 { animation-delay: 0.45s; }
    .tool-when-r2 { animation-delay: 0.90s; }
    .tool-when-r3 { animation-delay: 1.35s; }
    .tool-when-r4 { animation-delay: 1.80s; }
    .tool-when-row { animation: tool-when-reveal 7.3s ease-in-out infinite; }
    @keyframes tool-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tool-when-bg" width="980" height="390"/>
  <text class="tool-when-h1"  x="30" y="40">When to give a model tools</text>
  <text class="tool-when-sub" x="30" y="64">And when not to.</text>
  <rect class="tool-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tool-when-name" x="46" y="122">Give it tools</text>
  <text class="tool-when-desc" x="46" y="142">Four reasons.</text>
  <text class="tool-when-desc tool-when-row tool-when-r0" x="46" y="182">Current or private data is needed</text>
  <text class="tool-when-desc tool-when-row tool-when-r1" x="46" y="216">Exact computation is required</text>
  <text class="tool-when-desc tool-when-row tool-when-r2" x="46" y="250">An action must actually happen</text>
  <text class="tool-when-desc tool-when-row tool-when-r3" x="46" y="284">Several sources must be combined</text>
  <text class="tool-when-desc tool-when-row tool-when-r4" x="46" y="318">And the actions can be bounded</text>
  <rect class="tool-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tool-when-name" x="526" y="122">Do not</text>
  <text class="tool-when-desc" x="526" y="142">Also four.</text>
  <text class="tool-when-desc tool-when-row tool-when-r0" x="526" y="182">The answer is in the model already</text>
  <text class="tool-when-desc tool-when-row tool-when-r1" x="526" y="216">Retrieval alone would do</text>
  <text class="tool-when-desc tool-when-row tool-when-r2" x="526" y="250">Untrusted input plus write access</text>
  <text class="tool-when-desc tool-when-row tool-when-r3" x="526" y="284">Where no approval gate is possible</text>
  <text class="tool-when-desc tool-when-row tool-when-r4" x="526" y="318">And where a fixed pipeline is simpler</text>
  <text class="tool-when-sub" x="30" y="372">Untrusted input combined with write access and no approval gate is the combination to refuse outright, because there is no filtering technique that makes it safe.</text>
</svg>
