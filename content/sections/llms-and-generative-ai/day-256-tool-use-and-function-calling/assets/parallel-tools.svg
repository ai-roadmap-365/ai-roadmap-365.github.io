<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Calling several tools at once</title>
  <style>
    .parallel-tools-bg   { fill: #f8fafc; }
    .parallel-tools-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parallel-tools-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parallel-tools-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parallel-tools-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parallel-tools-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parallel-tools-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parallel-tools-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parallel-tools-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parallel-tools-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parallel-tools-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parallel-tools-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parallel-tools-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .parallel-tools-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .parallel-tools-stage { opacity: 1; }

    .parallel-tools-s0 { animation-delay: 0.00s; }
    .parallel-tools-e0 { animation-delay: 0.00s; }
    .parallel-tools-s1 { animation-delay: 1.28s; }
    .parallel-tools-e1 { animation-delay: 1.28s; }
    .parallel-tools-s2 { animation-delay: 2.56s; }
    .parallel-tools-e2 { animation-delay: 2.56s; }
    .parallel-tools-s3 { animation-delay: 3.84s; }
    .parallel-tools-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .parallel-tools-conn  { animation: parallel-tools-trace 6.4s ease-in-out infinite; }
      .parallel-tools-stage { animation: parallel-tools-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes parallel-tools-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes parallel-tools-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .parallel-tools-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .parallel-tools-stage { animation: parallel-tools-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes parallel-tools-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="parallel-tools-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="parallel-tools-bg" width="980" height="322"/>
  <text class="parallel-tools-h1"  x="30" y="40">Calling several tools at once</text>
  <text class="parallel-tools-sub" x="30" y="64">Four steps.</text>
  <g class="parallel-tools-stage parallel-tools-s0">
    <rect class="parallel-tools-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="parallel-tools-step" x="44" y="142">01</text>
    <text class="parallel-tools-name" x="70" y="142">The model requests several calls in one turn</text>
    <text class="parallel-tools-desc" x="44" y="166">When it can see they do not</text>
    <text class="parallel-tools-desc" x="44" y="182">depend on each other.</text>
  </g>
  <line class="parallel-tools-line parallel-tools-conn parallel-tools-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#parallel-tools-tip)"/>
  <g class="parallel-tools-stage parallel-tools-s1">
    <rect class="parallel-tools-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="parallel-tools-step" x="280" y="142">02</text>
    <text class="parallel-tools-name" x="306" y="142">Which is a claim you should check</text>
    <text class="parallel-tools-desc" x="280" y="166">Independence is asserted, not</text>
    <text class="parallel-tools-desc" x="280" y="182">guaranteed.</text>
  </g>
  <line class="parallel-tools-line parallel-tools-conn parallel-tools-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#parallel-tools-tip)"/>
  <g class="parallel-tools-stage parallel-tools-s2">
    <rect class="parallel-tools-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="parallel-tools-step" x="516" y="142">03</text>
    <text class="parallel-tools-name" x="542" y="142">Execute them concurrently</text>
    <text class="parallel-tools-desc" x="516" y="166">Turning several round trips into</text>
    <text class="parallel-tools-desc" x="516" y="182">one.</text>
  </g>
  <line class="parallel-tools-line parallel-tools-conn parallel-tools-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#parallel-tools-tip)"/>
  <g class="parallel-tools-stage parallel-tools-s3">
    <rect class="parallel-tools-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="parallel-tools-step" x="752" y="142">04</text>
    <text class="parallel-tools-name" x="778" y="142">And return all results together</text>
    <text class="parallel-tools-desc" x="752" y="166">In one message, in the requested</text>
    <text class="parallel-tools-desc" x="752" y="182">order.</text>
  </g>
  <text class="parallel-tools-sub" x="30" y="304">The latency saving is substantial for anything doing three or four lookups, and it is the main reason a well-built assistant feels faster than a naive one.</text>
</svg>
