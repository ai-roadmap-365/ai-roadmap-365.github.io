<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Who cannot dial it themselves.">
  <title>An assistant with a telephone</title>
  <style>
    .assistant-phone-bg   { fill: #f8fafc; }
    .assistant-phone-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-phone-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-phone-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-phone-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-phone-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-phone-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assistant-phone-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assistant-phone-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assistant-phone-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assistant-phone-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assistant-phone-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assistant-phone-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assistant-phone-row { opacity: 1; }
    .assistant-phone-r0 { animation-delay: 0.00s; }
    .assistant-phone-r1 { animation-delay: 0.45s; }
    .assistant-phone-r2 { animation-delay: 0.90s; }
    .assistant-phone-r3 { animation-delay: 1.35s; }
    .assistant-phone-r4 { animation-delay: 1.80s; }
    .assistant-phone-row { animation: assistant-phone-reveal 7.3s ease-in-out infinite; }
    @keyframes assistant-phone-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="assistant-phone-bg" width="980" height="390"/>
  <text class="assistant-phone-h1"  x="30" y="40">An assistant with a telephone</text>
  <text class="assistant-phone-sub" x="30" y="64">Who cannot dial it themselves.</text>
  <rect class="assistant-phone-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="assistant-phone-name" x="46" y="122">From memory alone</text>
  <text class="assistant-phone-desc" x="46" y="142">Knowledgeable, and stale.</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r0" x="46" y="182">Answers from what they already know</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r1" x="46" y="216">Cannot check anything</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r2" x="46" y="250">Cannot do anything</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r3" x="46" y="284">Confident either way</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r4" x="46" y="318">This is a model without tools</text>
  <rect class="assistant-phone-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="assistant-phone-name" x="526" y="122">With a telephone</text>
  <text class="assistant-phone-desc" x="526" y="142">Able to check, and to act.</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r0" x="526" y="182">Looks things up before answering</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r1" x="526" y="216">Verifies rather than recalls</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r2" x="526" y="250">Can arrange and confirm</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r3" x="526" y="284">Says who they need to call</text>
  <text class="assistant-phone-desc assistant-phone-row assistant-phone-r4" x="526" y="318">This is a model with tools</text>
  <text class="assistant-phone-sub" x="30" y="372">The analogy's limit is the useful part: the assistant here asks you to dial, which is exactly the control point that keeps tool calling governable.</text>
</svg>
