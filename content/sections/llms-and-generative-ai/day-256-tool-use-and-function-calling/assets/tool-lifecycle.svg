<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four stages, and your code runs everything.">
  <title>The tool calling loop</title>
  <style>
    .tool-lifecycle-bg   { fill: #f8fafc; }
    .tool-lifecycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-lifecycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-lifecycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-lifecycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-lifecycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-lifecycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-lifecycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-lifecycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-lifecycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-lifecycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-lifecycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-lifecycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tool-lifecycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tool-lifecycle-stage { opacity: 1; }

    .tool-lifecycle-s0 { animation-delay: 0.00s; }
    .tool-lifecycle-e0 { animation-delay: 0.00s; }
    .tool-lifecycle-s1 { animation-delay: 1.28s; }
    .tool-lifecycle-e1 { animation-delay: 1.28s; }
    .tool-lifecycle-s2 { animation-delay: 2.56s; }
    .tool-lifecycle-e2 { animation-delay: 2.56s; }
    .tool-lifecycle-s3 { animation-delay: 3.84s; }
    .tool-lifecycle-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tool-lifecycle-conn  { animation: tool-lifecycle-trace 6.4s ease-in-out infinite; }
      .tool-lifecycle-stage { animation: tool-lifecycle-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tool-lifecycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tool-lifecycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tool-lifecycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tool-lifecycle-stage { animation: tool-lifecycle-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tool-lifecycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tool-lifecycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tool-lifecycle-bg" width="980" height="322"/>
  <text class="tool-lifecycle-h1"  x="30" y="40">The tool calling loop</text>
  <text class="tool-lifecycle-sub" x="30" y="64">Four stages, and your code runs everything.</text>
  <g class="tool-lifecycle-stage tool-lifecycle-s0">
    <rect class="tool-lifecycle-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tool-lifecycle-step" x="44" y="142">01</text>
    <text class="tool-lifecycle-name" x="70" y="142">Declare the tools</text>
    <text class="tool-lifecycle-desc" x="44" y="166">Name, description and a</text>
    <text class="tool-lifecycle-desc" x="44" y="182">parameter schema for each.</text>
  </g>
  <line class="tool-lifecycle-line tool-lifecycle-conn tool-lifecycle-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tool-lifecycle-tip)"/>
  <g class="tool-lifecycle-stage tool-lifecycle-s1">
    <rect class="tool-lifecycle-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tool-lifecycle-step" x="280" y="142">02</text>
    <text class="tool-lifecycle-name" x="306" y="142">The model requests a call</text>
    <text class="tool-lifecycle-desc" x="280" y="166">With arguments. It does not</text>
    <text class="tool-lifecycle-desc" x="280" y="182">execute anything.</text>
  </g>
  <line class="tool-lifecycle-line tool-lifecycle-conn tool-lifecycle-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tool-lifecycle-tip)"/>
  <g class="tool-lifecycle-stage tool-lifecycle-s2">
    <rect class="tool-lifecycle-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tool-lifecycle-step" x="516" y="142">03</text>
    <text class="tool-lifecycle-name" x="542" y="142">Your code decides and executes</text>
    <text class="tool-lifecycle-desc" x="516" y="166">Validating the arguments first.</text>
    <text class="tool-lifecycle-desc" x="516" y="182">This is the control point.</text>
  </g>
  <line class="tool-lifecycle-line tool-lifecycle-conn tool-lifecycle-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tool-lifecycle-tip)"/>
  <g class="tool-lifecycle-stage tool-lifecycle-s3">
    <rect class="tool-lifecycle-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tool-lifecycle-step" x="752" y="142">04</text>
    <text class="tool-lifecycle-name" x="778" y="142">Return the result as a message</text>
    <text class="tool-lifecycle-desc" x="752" y="166">And the model continues with it</text>
    <text class="tool-lifecycle-desc" x="752" y="182">in context.</text>
    <text class="tool-lifecycle-edge" x="752" y="242">a loop</text>
  </g>
  <text class="tool-lifecycle-sub" x="30" y="304">The model requesting rather than executing is the whole security model: every action passes through code you wrote, which is where authorisation belongs.</text>
</svg>
