<svg role="img" aria-label="Tool calling execution loop architectural lifecycle diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Tool Use &amp; Function Calling Execution Loop</title>
  <defs>
    <linearGradient id="bg256a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg256a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TOOL USE &amp; FUNCTION CALLING EXECUTION LOOP</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">The 4-Stage Protocol: Declaration -&gt; Tool Call Emit -&gt; Local Execution -&gt; Synthesis</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card256)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Stage 1: Schema Declaration -->
    <rect x="20" y="25" width="165" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="102" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Schema Declaration</text>
    <rect x="30" y="75" width="145" height="75" fill="#1e293b" rx="4"/>
    <text x="35" y="93" fill="#cbd5e1" font-size="7">tools: [</text>
    <text x="35" y="106" fill="#cbd5e1" font-size="7">  name: "get_weather",</text>
    <text x="35" y="119" fill="#cbd5e1" font-size="7">  input_schema: {</text>
    <text x="35" y="132" fill="#cbd5e1" font-size="7">    city: string</text>
    <text x="35" y="145" fill="#cbd5e1" font-size="7">  }</text>
    <text x="35" y="157" fill="#cbd5e1" font-size="7">]</text>
    <text x="102" y="245" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Prompt + Tool Schemas</text>

    <!-- Stage 2: Model Tool Call -->
    <rect x="205" y="25" width="165" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="287" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Model Tool Call</text>
    <rect x="215" y="75" width="145" height="75" fill="#1e293b" rx="4"/>
    <text x="220" y="95" fill="#fbbf24" font-size="8" font-weight="700">stop_reason: tool_use</text>
    <text x="220" y="112" fill="#cbd5e1" font-size="7">id: "toolu_01A"</text>
    <text x="220" y="126" fill="#cbd5e1" font-size="7">name: "get_weather"</text>
    <text x="220" y="140" fill="#cbd5e1" font-size="7">input: {"city": "Tokyo"}</text>
    <text x="287" y="245" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Inference Interrupted</text>

    <!-- Stage 3: Local Host Execution -->
    <rect x="390" y="25" width="165" height="255" fill="#0f172a" stroke="#a855f7" rx="6"/>
    <text x="472" y="50" fill="#a855f7" font-size="10" font-weight="700" text-anchor="middle">3. Host Execution</text>
    <rect x="400" y="75" width="145" height="75" fill="#1e293b" rx="4"/>
    <text x="405" y="95" fill="#a855f7" font-size="8" font-weight="700">Local Python Dispatch:</text>
    <text x="405" y="112" fill="#cbd5e1" font-size="7">res = weather_fn("Tokyo")</text>
    <text x="405" y="126" fill="#34d399" font-size="7"># "22°C, Sunny"</text>
    <text x="405" y="142" fill="#cbd5e1" font-size="7">type: "tool_result"</text>
    <text x="472" y="245" fill="#a855f7" font-size="8" font-weight="700" text-anchor="middle">Tool Output Appended</text>

    <!-- Stage 4: Final Synthesis -->
    <rect x="575" y="25" width="165" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="657" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">4. Final Synthesis</text>
    <rect x="585" y="75" width="145" height="75" fill="#1e293b" rx="4"/>
    <text x="590" y="95" fill="#34d399" font-size="8" font-weight="700">stop_reason: end_turn</text>
    <text x="590" y="115" fill="#cbd5e1" font-size="7">"The current weather</text>
    <text x="590" y="130" fill="#cbd5e1" font-size="7">in Tokyo is 22°C</text>
    <text x="590" y="145" fill="#cbd5e1" font-size="7">and sunny."</text>
    <text x="657" y="245" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Complete Answer</text>
  </g>
</svg>
