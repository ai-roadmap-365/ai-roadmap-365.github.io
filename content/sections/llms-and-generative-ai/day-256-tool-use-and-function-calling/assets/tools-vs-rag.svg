<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fetching, or acting.">
  <title>Tools against retrieval</title>
  <style>
    .tools-vs-rag-bg   { fill: #f8fafc; }
    .tools-vs-rag-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-vs-rag-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-vs-rag-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-vs-rag-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-vs-rag-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-vs-rag-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tools-vs-rag-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tools-vs-rag-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tools-vs-rag-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tools-vs-rag-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tools-vs-rag-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tools-vs-rag-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tools-vs-rag-row { opacity: 1; }
    .tools-vs-rag-r0 { animation-delay: 0.00s; }
    .tools-vs-rag-r1 { animation-delay: 0.45s; }
    .tools-vs-rag-r2 { animation-delay: 0.90s; }
    .tools-vs-rag-r3 { animation-delay: 1.35s; }
    .tools-vs-rag-r4 { animation-delay: 1.80s; }
    .tools-vs-rag-row { animation: tools-vs-rag-reveal 7.3s ease-in-out infinite; }
    @keyframes tools-vs-rag-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tools-vs-rag-bg" width="980" height="390"/>
  <text class="tools-vs-rag-h1"  x="30" y="40">Tools against retrieval</text>
  <text class="tools-vs-rag-sub" x="30" y="64">Fetching, or acting.</text>
  <rect class="tools-vs-rag-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tools-vs-rag-name" x="46" y="122">Retrieval</text>
  <text class="tools-vs-rag-desc" x="46" y="142">Bring information in.</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r0" x="46" y="182">Searches a prepared index</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r1" x="46" y="216">Read-only, always</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r2" x="46" y="250">One extra step, predictable</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r3" x="46" y="284">Latency known in advance</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r4" x="46" y="318">Cannot change anything</text>
  <rect class="tools-vs-rag-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tools-vs-rag-name" x="526" y="122">Tool calling</text>
  <text class="tools-vs-rag-desc" x="526" y="142">Reach out and act.</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r0" x="526" y="182">Calls arbitrary systems</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r1" x="526" y="216">Can read or write</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r2" x="526" y="250">Loops for an unknown number of turns</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r3" x="526" y="284">Latency unbounded in principle</text>
  <text class="tools-vs-rag-desc tools-vs-rag-row tools-vs-rag-r4" x="526" y="318">Can change the world</text>
  <text class="tools-vs-rag-sub" x="30" y="372">Retrieval is a bounded special case of the same idea, and preferring it where it suffices is a real security decision rather than a stylistic one.</text>
</svg>
