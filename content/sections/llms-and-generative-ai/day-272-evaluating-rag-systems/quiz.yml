questions:
  - question: 'Why does the triad report three scores instead of one overall quality number?'
    options:
      - 'The three failures need opposite fixes, and one number cannot distinguish them'
      - 'Three numbers are cheaper to compute than a single weighted score'
      - 'Regulators require at least three metrics for any evaluated system'
      - 'A single score cannot be stored in a continuous integration report'
    answer_index: 0
    explanation: 'Retrieval failure means changing chunking; grounding failure means changing the prompt; relevance failure means the question was misread.'

  - question: 'A system scores high faithfulness and low context relevance. What does that often mean?'
    options:
      - 'The retrieval stage is working better than the metric suggests'
      - 'The answer did not come from the retrieved context at all'
      - 'The judge model has been miscalibrated and should be replaced'
      - 'The answer is too short for the metric to score reliably'
    answer_index: 1
    explanation: 'High faithfulness with poor context is a grounding failure wearing a passing grade: the model likely answered from parametric memory.'

  - question: 'What does faithfulness guarantee?'
    options:
      - 'That the answer would satisfy the user who asked the question'
      - 'That the retrieved passages are the best available in the corpus'
      - 'That the answer follows from the context, not that the context is right'
      - 'That the source document was current when the answer was produced'
    answer_index: 2
    explanation: 'Faithfulness is containment, not correctness. A faithful answer drawn from an out-of-date document scores 1.0 and is wrong.'

  - question: 'Why is the triad described as reference-free, and why does that matter?'
    options:
      - 'It can be computed without retrieving any context'
      - 'It runs without a network connection to the judge model'
      - 'It requires no questions to be written in advance'
      - 'It needs no gold answer, so it survives corpus updates'
    answer_index: 3
    explanation: 'Writing gold answers for 200 questions costs days of expert time and they go stale when the corpus changes.'

  - question: 'Why calibrate a judge model against human labels before it gates a build?'
    options:
      - 'An uncalibrated judge produces a number you have no reason to believe'
      - 'Calibration is what allows the judge to run inside continuous integration'
      - 'Human labels are required to compute cosine similarity correctly'
      - 'Without calibration the judge cannot process more than thirty answers'
    answer_index: 0
    explanation: 'Judges have position, verbosity and self-preference biases. If agreement with human labels is low, the score is noise.'
