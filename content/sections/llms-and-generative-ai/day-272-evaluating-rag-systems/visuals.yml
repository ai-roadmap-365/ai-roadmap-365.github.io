visuals:
  - id: rag-triad-evaluation-metrics-architecture
    file: assets/rag-triad-evaluation-metrics-architecture.svg
    type: diagram
    title: 'RAG Triad Evaluation Metrics Architecture'
    alt: RAG Triad Evaluation Metrics Architecture diagram
    description: 'Architectural diagram illustrating the multi-stage RAG indexing, retrieval, and generation pipeline.'
  - id: faithfulness-answer-relevance-context-precision
    file: assets/faithfulness-answer-relevance-context-precision.svg
    type: diagram
    title: 'Faithfulness Relevance and Precision Breakdown'
    alt: Faithfulness Relevance and Precision Breakdown diagram
    description: 'Runtime dataflow diagram demonstrating query processing, hybrid search fusion, and grounded answer synthesis.'
  - id: eval-idea
    file: assets/eval-idea.svg
    type: diagram
    title: 'Three measurements, one diagnosis'
    alt: 'Diagram: the three measurements that locate a failure in a retrieval system'
    description: 'A three-stage description of retrieval evaluation covering context relevance, faithfulness and answer relevance.'
  - id: faithfulness-decompose
    file: assets/faithfulness-decompose.svg
    type: diagram
    title: 'Measuring faithfulness'
    alt: 'Diagram: how faithfulness is measured by decomposing an answer into claims'
    description: 'A four-stage description of faithfulness measurement covering decomposition, per-claim checking, scoring and interpretation.'
  - id: answer-relevance
    file: assets/answer-relevance.svg
    type: diagram
    title: 'Measuring answer relevance'
    alt: 'Diagram: how answer relevance is measured by generating questions from the answer'
    description: 'A four-stage description of answer relevance measurement covering reverse generation, comparison, scoring and the failure it detects.'
  - id: context-relevance
    file: assets/context-relevance.svg
    type: diagram
    title: 'Measuring context relevance'
    alt: 'Diagram: how the proportion of relevant retrieved content is measured'
    description: 'A four-stage description of context relevance measurement covering sentence splitting, relevance marking, the ratio and its consequences.'
  - id: read-together
    file: assets/read-together.svg
    type: diagram
    title: 'Reading the three together'
    alt: 'Diagram: how combinations of the three retrieval metrics identify the failing stage'
    description: 'A four-stage description of combined metric interpretation covering four score patterns and the stage each implicates.'
  - id: judge-care
    file: assets/judge-care.svg
    type: diagram
    title: 'Using a model as judge'
    alt: 'Diagram: the four safeguards required when using a model to grade another model'
    description: 'A four-stage description of judge safeguards covering the rubric, position randomisation, human calibration and model separation.'
  - id: diagnosis
    file: assets/diagnosis.svg
    type: diagram
    title: 'A single symptom, or a panel of tests'
    alt: 'Diagram: an overall quality score compared with per-stage diagnostic measurements'
    description: 'A two-column comparison of one aggregate score against several targeted measurements.'
  - id: rag-eval-implications
    file: assets/rag-eval-implications.svg
    type: diagram
    title: 'Four consequences of measuring properly'
    alt: 'Diagram: the diagnosis, cost, privacy and process implications of retrieval evaluation'
    description: 'A four-stage description of evaluation implications covering targeted debugging, model call cost, sensitive test data and team process.'
  - id: rag-eval-when
    file: assets/rag-eval-when.svg
    type: diagram
    title: 'How much evaluation'
    alt: 'Diagram: when full retrieval evaluation is warranted'
    description: 'A two-column comparison of situations requiring thorough evaluation against lighter approaches.'
  - id: eval-vs-monitor
    file: assets/eval-vs-monitor.svg
    type: diagram
    title: 'Offline evaluation against live monitoring'
    alt: 'Diagram: offline retrieval evaluation compared with production monitoring'
    description: 'A two-column comparison of offline evaluation against live production monitoring.'
  - id: eval-history
    file: assets/eval-history.svg
    type: diagram
    title: 'Four steps in retrieval evaluation'
    alt: 'Diagram: the historical progression of retrieval system evaluation'
    description: 'A four-stage description of evaluation history covering inspection, ranking metrics, grounding metrics and standard frameworks.'
