<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four diagnoses.">
  <title>Reading the three together</title>
  <style>
    .read-together-bg   { fill: #f8fafc; }
    .read-together-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-together-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-together-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-together-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-together-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-together-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .read-together-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .read-together-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .read-together-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .read-together-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .read-together-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .read-together-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .read-together-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .read-together-stage { opacity: 1; }

    .read-together-s0 { animation-delay: 0.00s; }
    .read-together-e0 { animation-delay: 0.00s; }
    .read-together-s1 { animation-delay: 1.28s; }
    .read-together-e1 { animation-delay: 1.28s; }
    .read-together-s2 { animation-delay: 2.56s; }
    .read-together-e2 { animation-delay: 2.56s; }
    .read-together-s3 { animation-delay: 3.84s; }
    .read-together-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .read-together-conn  { animation: read-together-trace 6.4s ease-in-out infinite; }
      .read-together-stage { animation: read-together-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes read-together-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes read-together-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .read-together-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .read-together-stage { animation: read-together-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes read-together-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="read-together-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="read-together-bg" width="980" height="322"/>
  <text class="read-together-h1"  x="30" y="40">Reading the three together</text>
  <text class="read-together-sub" x="30" y="64">Four diagnoses.</text>
  <g class="read-together-stage read-together-s0">
    <rect class="read-together-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="read-together-step" x="44" y="142">01</text>
    <text class="read-together-name" x="70" y="142">Context low, others high</text>
    <text class="read-together-desc" x="44" y="166">Retrieval is failing. Fix</text>
    <text class="read-together-desc" x="44" y="182">chunking or ranking.</text>
  </g>
  <line class="read-together-line read-together-conn read-together-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#read-together-tip)"/>
  <g class="read-together-stage read-together-s1">
    <rect class="read-together-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="read-together-step" x="280" y="142">02</text>
    <text class="read-together-name" x="306" y="142">Context high, faithfulness low</text>
    <text class="read-together-desc" x="280" y="166">The model is ignoring its</text>
    <text class="read-together-desc" x="280" y="182">sources. Fix the prompt.</text>
  </g>
  <line class="read-together-line read-together-conn read-together-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#read-together-tip)"/>
  <g class="read-together-stage read-together-s2">
    <rect class="read-together-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="read-together-step" x="516" y="142">03</text>
    <text class="read-together-name" x="542" y="142">Both high, answer relevance low</text>
    <text class="read-together-desc" x="516" y="166">It answered the wrong question.</text>
    <text class="read-together-desc" x="516" y="182">Fix the instruction.</text>
  </g>
  <line class="read-together-line read-together-conn read-together-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#read-together-tip)"/>
  <g class="read-together-stage read-together-s3">
    <rect class="read-together-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="read-together-step" x="752" y="142">04</text>
    <text class="read-together-name" x="778" y="142">All three high, users unhappy</text>
    <text class="read-together-desc" x="752" y="166">Your metrics do not match what</text>
    <text class="read-together-desc" x="752" y="182">users value.</text>
  </g>
  <text class="read-together-sub" x="30" y="304">The fourth pattern is the one worth watching for: it means the evaluation itself needs revisiting, which no amount of tuning against it will fix.</text>
</svg>
