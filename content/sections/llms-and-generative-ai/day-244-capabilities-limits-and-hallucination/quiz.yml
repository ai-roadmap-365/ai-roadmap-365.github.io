questions:
  - question: 'What is the Reversal Curse in autoregressive language models (Berglund et al., 2023)?'
    options:
      - 'A GPU memory hardware defect'
      - 'A virus that reverses the order of words in prompts'
      - 'Learning "A is B" does not teach "B is A"'
      - 'A bug in Python string slicing'
    answer_index: 2
    explanation: 'The Reversal Curse occurs because models optimize forward conditional probabilities and do not implicitly learn reverse relational mappings.'
  - question: 'What causes the "Lost-in-the-Middle" phenomenon in long-context Transformers (Liu et al., 2023)?'
    options:
      - 'Using an odd number of Transformer layers'
      - 'The middle tokens being deleted from memory'
      - 'Network packet loss during API transmission'
      - 'Attention favours the start and end of the context'
    answer_index: 3
    explanation: 'Attention heads naturally prioritize the sequence prefix (primacy) and the immediate query suffix (recency).'
  - question: 'How does Self-Consistency (Wang et al., 2022) improve reasoning reliability and mitigate hallucination in complex mathematical problems?'
    options:
      - 'Sample several reasoning paths and take the majority'
      - 'Training the model for 100 additional epochs'
      - 'Checking the spelling of every output word'
      - 'Running the prompt through Google Search 10 times'
    answer_index: 0
    explanation: 'Self-consistency samples diverse reasoning chains and aggregates the final consensus answer via majority vote.'
  - question: 'What is the primary difference between Intrinsic and Extrinsic Hallucination in LLMs?'
    options:
      - 'Intrinsic happens inside GPUs; extrinsic happens in cloud storage'
      - 'Intrinsic contradicts the source; extrinsic invents'
      - 'Intrinsic happens in Python; extrinsic happens in C++'
      - 'There is no difference between them'
    answer_index: 1
    explanation: 'Intrinsic contradicts the source context; extrinsic invents ungrounded claims.'
  - question: 'How can token predictive entropy H(X) = -sum(P_i * log P_i) be used as a real-time hallucination warning heuristic?'
    options:
      - 'Entropy counts the number of punctuation marks'
      - 'Entropy measures the temperature of the server rack'
      - 'High entropy means flat probabilities and low confidence'
      - 'Entropy measures the download speed of the model'
    answer_index: 2
    explanation: 'High entropy signals model uncertainty, serving as a reliable statistical indicator of potential factual fabrication.'
