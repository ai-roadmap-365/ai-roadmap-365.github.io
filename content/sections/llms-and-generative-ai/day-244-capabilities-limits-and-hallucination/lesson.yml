learning_promise: 'Master the scientific boundaries of modern Large Language Models: dissect the taxonomy of hallucinations (intrinsic confabulation vs ungrounded extrapolation), analyze theoretical cognitive failures (multi-hop relation reversal curse, state tracking decay, spatial reasoning gaps), inspect needle-in-a-haystack long-context retrieval degradation (the Lost-in-the-Middle phenomenon), implement production mitigation patterns (strict RAG grounding, chain-of-thought self-consistency voting, logit entropy calibration, citation verification critic loops), and build an automated hallucination detector in Python.'
objectives:
  - 'Classify LLM failure modes across intrinsic confabulation, sycophancy, and relation reversal.'
  - 'Explain the mathematical and attention-head causes behind the Lost-in-the-Middle long-context phenomenon.'
  - 'Calculate token-level predictive entropy to detect ungrounded statements from raw model logits.'
  - 'Implement multi-path Self-Consistency majority voting to boost reasoning accuracy.'
  - 'Build an automated grounded citation verification pipeline in Python.'
