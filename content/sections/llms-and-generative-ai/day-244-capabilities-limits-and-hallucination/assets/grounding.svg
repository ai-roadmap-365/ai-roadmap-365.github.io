<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None sufficient alone.">
  <title>Four layers of mitigation</title>
  <style>
    .grounding-bg   { fill: #f8fafc; }
    .grounding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grounding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .grounding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .grounding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .grounding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .grounding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .grounding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .grounding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .grounding-stage { opacity: 1; }

    .grounding-s0 { animation-delay: 0.00s; }
    .grounding-e0 { animation-delay: 0.00s; }
    .grounding-s1 { animation-delay: 1.28s; }
    .grounding-e1 { animation-delay: 1.28s; }
    .grounding-s2 { animation-delay: 2.56s; }
    .grounding-e2 { animation-delay: 2.56s; }
    .grounding-s3 { animation-delay: 3.84s; }
    .grounding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .grounding-conn  { animation: grounding-trace 6.4s ease-in-out infinite; }
      .grounding-stage { animation: grounding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes grounding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes grounding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .grounding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .grounding-stage { animation: grounding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes grounding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="grounding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="grounding-bg" width="980" height="322"/>
  <text class="grounding-h1"  x="30" y="40">Four layers of mitigation</text>
  <text class="grounding-sub" x="30" y="64">None sufficient alone.</text>
  <g class="grounding-stage grounding-s0">
    <rect class="grounding-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="grounding-step" x="44" y="142">01</text>
    <text class="grounding-name" x="70" y="142">Ground answers in retrieved sources</text>
    <text class="grounding-desc" x="44" y="166">Which removes most fabricated</text>
    <text class="grounding-desc" x="44" y="182">facts.</text>
  </g>
  <line class="grounding-line grounding-conn grounding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#grounding-tip)"/>
  <g class="grounding-stage grounding-s1">
    <rect class="grounding-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="grounding-step" x="280" y="142">02</text>
    <text class="grounding-name" x="306" y="142">Require citations to those sources</text>
    <text class="grounding-desc" x="280" y="166">So an unsupported claim is</text>
    <text class="grounding-desc" x="280" y="182">visible.</text>
  </g>
  <line class="grounding-line grounding-conn grounding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#grounding-tip)"/>
  <g class="grounding-stage grounding-s2">
    <rect class="grounding-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="grounding-step" x="516" y="142">03</text>
    <text class="grounding-name" x="542" y="142">Verify each claim against its source</text>
    <text class="grounding-desc" x="516" y="166">With a separate model, or an</text>
    <text class="grounding-desc" x="516" y="182">entailment check.</text>
  </g>
  <line class="grounding-line grounding-conn grounding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#grounding-tip)"/>
  <g class="grounding-stage grounding-s3">
    <rect class="grounding-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="grounding-step" x="752" y="142">04</text>
    <text class="grounding-name" x="778" y="142">And keep a human in the loop where it matters</text>
    <text class="grounding-desc" x="752" y="166">Which is the only layer that</text>
    <text class="grounding-desc" x="752" y="182">catches reasoning errors.</text>
  </g>
  <text class="grounding-sub" x="30" y="304">Each layer catches what the previous one missed, and no combination reaches zero — which is why high-stakes deployments keep the last layer rather than optimising it away.</text>
</svg>
