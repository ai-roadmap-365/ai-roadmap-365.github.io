<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Legal included.">
  <title>Four consequences of hallucination</title>
  <style>
    .halluc-implications-bg   { fill: #f8fafc; }
    .halluc-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .halluc-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .halluc-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .halluc-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .halluc-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .halluc-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .halluc-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .halluc-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .halluc-implications-stage { opacity: 1; }

    .halluc-implications-s0 { animation-delay: 0.00s; }
    .halluc-implications-e0 { animation-delay: 0.00s; }
    .halluc-implications-s1 { animation-delay: 1.28s; }
    .halluc-implications-e1 { animation-delay: 1.28s; }
    .halluc-implications-s2 { animation-delay: 2.56s; }
    .halluc-implications-e2 { animation-delay: 2.56s; }
    .halluc-implications-s3 { animation-delay: 3.84s; }
    .halluc-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .halluc-implications-conn  { animation: halluc-implications-trace 6.4s ease-in-out infinite; }
      .halluc-implications-stage { animation: halluc-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes halluc-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes halluc-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .halluc-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .halluc-implications-stage { animation: halluc-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes halluc-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="halluc-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="halluc-implications-bg" width="980" height="322"/>
  <text class="halluc-implications-h1"  x="30" y="40">Four consequences of hallucination</text>
  <text class="halluc-implications-sub" x="30" y="64">Legal included.</text>
  <g class="halluc-implications-stage halluc-implications-s0">
    <rect class="halluc-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="halluc-implications-step" x="44" y="142">01</text>
    <text class="halluc-implications-name" x="70" y="142">Legal exposure is real and tested</text>
    <text class="halluc-implications-desc" x="44" y="166">Courts have sanctioned filings</text>
    <text class="halluc-implications-desc" x="44" y="182">containing invented citations.</text>
  </g>
  <line class="halluc-implications-line halluc-implications-conn halluc-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#halluc-implications-tip)"/>
  <g class="halluc-implications-stage halluc-implications-s1">
    <rect class="halluc-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="halluc-implications-step" x="280" y="142">02</text>
    <text class="halluc-implications-name" x="306" y="142">And trust is asymmetric</text>
    <text class="halluc-implications-desc" x="280" y="166">One confident falsehood costs</text>
    <text class="halluc-implications-desc" x="280" y="182">more than many correct answers</text>
    <text class="halluc-implications-desc" x="280" y="198">earn.</text>
  </g>
  <line class="halluc-implications-line halluc-implications-conn halluc-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#halluc-implications-tip)"/>
  <g class="halluc-implications-stage halluc-implications-s2">
    <rect class="halluc-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="halluc-implications-step" x="516" y="142">03</text>
    <text class="halluc-implications-name" x="542" y="142">Verification adds latency and cost</text>
    <text class="halluc-implications-desc" x="516" y="166">Often doubling both.</text>
  </g>
  <line class="halluc-implications-line halluc-implications-conn halluc-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#halluc-implications-tip)"/>
  <g class="halluc-implications-stage halluc-implications-s3">
    <rect class="halluc-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="halluc-implications-step" x="752" y="142">04</text>
    <text class="halluc-implications-name" x="778" y="142">So the system is designed around it</text>
    <text class="halluc-implications-desc" x="752" y="166">Grounding, citation and review</text>
    <text class="halluc-implications-desc" x="752" y="182">are architecture, not features.</text>
  </g>
  <text class="halluc-implications-sub" x="30" y="304">Treating verification as architecture rather than as a feature to add later is the practical conclusion, because retrofitting grounding into a system usually means rebuilding it.</text>
</svg>
