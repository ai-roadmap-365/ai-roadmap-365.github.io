<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Learned one way, not the other.">
  <title>The reversal curse</title>
  <style>
    .reversal-curse-bg   { fill: #f8fafc; }
    .reversal-curse-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reversal-curse-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reversal-curse-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reversal-curse-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reversal-curse-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reversal-curse-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reversal-curse-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reversal-curse-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reversal-curse-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reversal-curse-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reversal-curse-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reversal-curse-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reversal-curse-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reversal-curse-stage { opacity: 1; }

    .reversal-curse-s0 { animation-delay: 0.00s; }
    .reversal-curse-e0 { animation-delay: 0.00s; }
    .reversal-curse-s1 { animation-delay: 1.28s; }
    .reversal-curse-e1 { animation-delay: 1.28s; }
    .reversal-curse-s2 { animation-delay: 2.56s; }
    .reversal-curse-e2 { animation-delay: 2.56s; }
    .reversal-curse-s3 { animation-delay: 3.84s; }
    .reversal-curse-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .reversal-curse-conn  { animation: reversal-curse-trace 6.4s ease-in-out infinite; }
      .reversal-curse-stage { animation: reversal-curse-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes reversal-curse-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reversal-curse-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reversal-curse-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reversal-curse-stage { animation: reversal-curse-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reversal-curse-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reversal-curse-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reversal-curse-bg" width="980" height="322"/>
  <text class="reversal-curse-h1"  x="30" y="40">The reversal curse</text>
  <text class="reversal-curse-sub" x="30" y="64">Learned one way, not the other.</text>
  <g class="reversal-curse-stage reversal-curse-s0">
    <rect class="reversal-curse-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="reversal-curse-step" x="44" y="142">01</text>
    <text class="reversal-curse-name" x="70" y="142">The model learns that A is B</text>
    <text class="reversal-curse-desc" x="44" y="166">From text stating it that way.</text>
  </g>
  <line class="reversal-curse-line reversal-curse-conn reversal-curse-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#reversal-curse-tip)"/>
  <g class="reversal-curse-stage reversal-curse-s1">
    <rect class="reversal-curse-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="reversal-curse-step" x="280" y="142">02</text>
    <text class="reversal-curse-name" x="306" y="142">Asked which thing is B, it fails</text>
    <text class="reversal-curse-desc" x="280" y="166">Even though it answered the</text>
    <text class="reversal-curse-desc" x="280" y="182">forward question correctly.</text>
  </g>
  <line class="reversal-curse-line reversal-curse-conn reversal-curse-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#reversal-curse-tip)"/>
  <g class="reversal-curse-stage reversal-curse-s2">
    <rect class="reversal-curse-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="reversal-curse-step" x="516" y="142">03</text>
    <text class="reversal-curse-name" x="542" y="142">Because the association is directional</text>
    <text class="reversal-curse-desc" x="516" y="166">Learned as a next-token</text>
    <text class="reversal-curse-desc" x="516" y="182">continuation, not as a relation.</text>
  </g>
  <line class="reversal-curse-line reversal-curse-conn reversal-curse-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#reversal-curse-tip)"/>
  <g class="reversal-curse-stage reversal-curse-s3">
    <rect class="reversal-curse-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="reversal-curse-step" x="752" y="142">04</text>
    <text class="reversal-curse-name" x="778" y="142">So both directions must appear in the data</text>
    <text class="reversal-curse-desc" x="752" y="166">Or be supplied by retrieval at</text>
    <text class="reversal-curse-desc" x="752" y="182">query time.</text>
  </g>
  <text class="reversal-curse-sub" x="30" y="304">This is a clean demonstration that these models store associations rather than relations, and it explains a family of failures that look like ignorance but are not.</text>
</svg>
