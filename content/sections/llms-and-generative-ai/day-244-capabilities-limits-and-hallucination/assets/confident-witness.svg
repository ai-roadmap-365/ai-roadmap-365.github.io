<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fluency is not evidence.">
  <title>A confident witness</title>
  <style>
    .confident-witness-bg   { fill: #f8fafc; }
    .confident-witness-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-witness-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-witness-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-witness-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-witness-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-witness-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .confident-witness-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .confident-witness-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .confident-witness-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .confident-witness-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .confident-witness-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .confident-witness-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .confident-witness-row { opacity: 1; }
    .confident-witness-r0 { animation-delay: 0.00s; }
    .confident-witness-r1 { animation-delay: 0.45s; }
    .confident-witness-r2 { animation-delay: 0.90s; }
    .confident-witness-r3 { animation-delay: 1.35s; }
    .confident-witness-r4 { animation-delay: 1.80s; }
    .confident-witness-row { animation: confident-witness-reveal 7.3s ease-in-out infinite; }
    @keyframes confident-witness-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="confident-witness-bg" width="980" height="390"/>
  <text class="confident-witness-h1"  x="30" y="40">A confident witness</text>
  <text class="confident-witness-sub" x="30" y="64">Fluency is not evidence.</text>
  <rect class="confident-witness-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="confident-witness-name" x="46" y="122">The confident account</text>
  <text class="confident-witness-desc" x="46" y="142">Detailed, and unverifiable.</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r0" x="46" y="182">Fluent and specific</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r1" x="46" y="216">Delivered without hesitation</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r2" x="46" y="250">Details that feel corroborating</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r3" x="46" y="284">No way to check any of it</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r4" x="46" y="318">This is an ungrounded answer</text>
  <rect class="confident-witness-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="confident-witness-name" x="526" y="122">The documented account</text>
  <text class="confident-witness-desc" x="526" y="142">Checkable.</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r0" x="526" y="182">Each claim attributed</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r1" x="526" y="216">Sources that can be examined</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r2" x="526" y="250">Gaps acknowledged as gaps</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r3" x="526" y="284">Verifiable independently</text>
  <text class="confident-witness-desc confident-witness-row confident-witness-r4" x="526" y="318">This is a grounded answer</text>
  <text class="confident-witness-sub" x="30" y="372">Human witnesses fail the same way and for a related reason: confidence tracks fluency of recall rather than accuracy, which is why courts prefer documents.</text>
</svg>
