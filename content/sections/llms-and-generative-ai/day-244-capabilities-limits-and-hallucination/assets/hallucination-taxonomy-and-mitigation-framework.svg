<svg role="img" aria-label="Taxonomy of LLM hallucination failure modes and corresponding engineering mitigation strategies" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>LLM Hallucination Taxonomy &amp; Mitigation Architecture</title>
  <defs>
    <linearGradient id="bg244a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card244" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg244a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TAXONOMY OF LLM HALLUCINATION &amp; MITIGATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Understanding Root Causes, Cognitive Boundaries, and Engineering Defenses</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card244)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Failure Modes -->
    <rect x="25" y="25" width="345" height="255" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" rx="6"/>
    <text x="197" y="50" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">Primary Hallucination Failure Modes</text>
    
    <text x="40" y="80" fill="#fbbf24" font-size="9" font-weight="700">1. Intrinsic Factual Confabulation:</text>
    <text x="40" y="98" fill="#cbd5e1" font-size="8">• Inventing fake citations, URLs, dates, or legal cases</text>

    <text x="40" y="125" fill="#fbbf24" font-size="9" font-weight="700">2. Sycophancy &amp; User Bias Mirroring:</text>
    <text x="40" y="143" fill="#cbd5e1" font-size="8">• Agreeing with user false premises to maximize praise</text>

    <text x="40" y="170" fill="#fbbf24" font-size="9" font-weight="700">3. Reversible Relation Failure (The "A is B" Curse):</text>
    <text x="40" y="188" fill="#cbd5e1" font-size="8">• Knows "Mary is Tom's mother", fails "Tom's mother is..."</text>

    <text x="40" y="215" fill="#fbbf24" font-size="9" font-weight="700">4. Context Distraction &amp; Hallucination Drift:</text>
    <text x="40" y="233" fill="#cbd5e1" font-size="8">• Irrelevant context dilutes attention over multi-turn chat</text>

    <!-- Right: Engineering Mitigations -->
    <rect x="390" y="25" width="345" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="562" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Production Mitigation Defenses</text>

    <text x="405" y="80" fill="#38bdf8" font-size="9" font-weight="700">1. Retrieval-Augmented Grounding (RAG):</text>
    <text x="405" y="98" fill="#cbd5e1" font-size="8">• Constrain answers strictly to retrieved source chunks</text>

    <text x="405" y="125" fill="#38bdf8" font-size="9" font-weight="700">2. Chain-of-Thought (CoT) &amp; Self-Consistency:</text>
    <text x="405" y="143" fill="#cbd5e1" font-size="8">• Sample N paths at T=0.7; take majority vote answer</text>

    <text x="405" y="170" fill="#38bdf8" font-size="9" font-weight="700">3. Logit Calibration &amp; Uncertainty Thresholds:</text>
    <text x="405" y="188" fill="#cbd5e1" font-size="8">• Flag high token entropy or low top-1 confidence</text>

    <text x="405" y="215" fill="#38bdf8" font-size="9" font-weight="700">4. Critique &amp; Verification Critic Loops:</text>
    <text x="405" y="233" fill="#cbd5e1" font-size="8">• Secondary LLM verifies citations against context text</text>
  </g>
</svg>
