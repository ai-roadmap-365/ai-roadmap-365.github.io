<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From denial to architecture.">
  <title>Four steps in understanding hallucination</title>
  <style>
    .halluc-history-bg   { fill: #f8fafc; }
    .halluc-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .halluc-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .halluc-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .halluc-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .halluc-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .halluc-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .halluc-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .halluc-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .halluc-history-stage { opacity: 1; }

    .halluc-history-s0 { animation-delay: 0.00s; }
    .halluc-history-e0 { animation-delay: 0.00s; }
    .halluc-history-s1 { animation-delay: 1.28s; }
    .halluc-history-e1 { animation-delay: 1.28s; }
    .halluc-history-s2 { animation-delay: 2.56s; }
    .halluc-history-e2 { animation-delay: 2.56s; }
    .halluc-history-s3 { animation-delay: 3.84s; }
    .halluc-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .halluc-history-conn  { animation: halluc-history-trace 6.4s ease-in-out infinite; }
      .halluc-history-stage { animation: halluc-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes halluc-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes halluc-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .halluc-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .halluc-history-stage { animation: halluc-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes halluc-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="halluc-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="halluc-history-bg" width="980" height="322"/>
  <text class="halluc-history-h1"  x="30" y="40">Four steps in understanding hallucination</text>
  <text class="halluc-history-sub" x="30" y="64">From denial to architecture.</text>
  <g class="halluc-history-stage halluc-history-s0">
    <rect class="halluc-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="halluc-history-step" x="44" y="142">01</text>
    <text class="halluc-history-name" x="70" y="142">Treated as a bug to be trained away</text>
    <text class="halluc-history-desc" x="44" y="166">Which it was not.</text>
  </g>
  <line class="halluc-history-line halluc-history-conn halluc-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#halluc-history-tip)"/>
  <g class="halluc-history-stage halluc-history-s1">
    <rect class="halluc-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="halluc-history-step" x="280" y="142">02</text>
    <text class="halluc-history-name" x="306" y="142">Recognised as intrinsic to the objective</text>
    <text class="halluc-history-desc" x="280" y="166">Probable text is not true text.</text>
  </g>
  <line class="halluc-history-line halluc-history-conn halluc-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#halluc-history-tip)"/>
  <g class="halluc-history-stage halluc-history-s2">
    <rect class="halluc-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="halluc-history-step" x="516" y="142">03</text>
    <text class="halluc-history-name" x="542" y="142">Addressed by supplying sources</text>
    <text class="halluc-history-desc" x="516" y="166">Which removed most fabricated</text>
    <text class="halluc-history-desc" x="516" y="182">facts.</text>
  </g>
  <line class="halluc-history-line halluc-history-conn halluc-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#halluc-history-tip)"/>
  <g class="halluc-history-stage halluc-history-s3">
    <rect class="halluc-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="halluc-history-step" x="752" y="142">04</text>
    <text class="halluc-history-name" x="778" y="142">Then by verifying claims against them</text>
    <text class="halluc-history-desc" x="752" y="166">A separate step, with its own</text>
    <text class="halluc-history-desc" x="752" y="182">model.</text>
  </g>
  <text class="halluc-history-sub" x="30" y="304">The shift from expecting a model-level fix to building a system-level one is the important change, and it is why the answer is an architecture rather than a better checkpoint.</text>
</svg>
