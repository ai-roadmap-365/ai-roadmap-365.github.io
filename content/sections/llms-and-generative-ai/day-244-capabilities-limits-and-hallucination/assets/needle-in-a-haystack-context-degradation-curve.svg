<svg role="img" aria-label="Needle In A Haystack long-context retrieval degradation curve showing U-shaped retrieval accuracy across document depths" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Needle-in-a-Haystack &amp; Lost-in-the-Middle Phenomenon</title>
  <defs>
    <linearGradient id="bg244b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card244b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg244b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LONG-CONTEXT RETRIEVAL: THE U-SHAPED CURVE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Empirical Accuracy as a Function of Needle Position Depth in 100k+ Token Documents</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card244b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Graph Background -->
    <rect x="50" y="30" width="620" height="210" fill="#0f172a" stroke="#334155" rx="4"/>
    
    <!-- Y-Axis Labels -->
    <text x="40" y="45" fill="#94a3b8" font-size="8" text-anchor="end">100%</text>
    <text x="40" y="100" fill="#94a3b8" font-size="8" text-anchor="end">80%</text>
    <text x="40" y="150" fill="#94a3b8" font-size="8" text-anchor="end">60%</text>
    <text x="40" y="200" fill="#94a3b8" font-size="8" text-anchor="end">40%</text>
    <text x="40" y="240" fill="#94a3b8" font-size="8" text-anchor="end">0%</text>

    <!-- X-Axis Labels -->
    <text x="70" y="258" fill="#94a3b8" font-size="8" text-anchor="middle">0% (Start / Primacy)</text>
    <text x="360" y="258" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">50% Depth (Lost in the Middle)</text>
    <text x="630" y="258" fill="#94a3b8" font-size="8" text-anchor="middle">100% (End / Recency)</text>

    <!-- U-Shaped Curve -->
    <path d="M 70 45 Q 360 190 630 48" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
    
    <!-- Key Callout Points -->
    <circle cx="70" cy="45" r="5" fill="#34d399"/>
    <circle cx="360" cy="117" r="6" fill="#fb7185"/>
    <circle cx="630" cy="48" r="5" fill="#34d399"/>

    <text x="90" y="70" fill="#34d399" font-size="8" font-weight="700">99.8% Recall (Primacy Effect)</text>
    <text x="360" y="145" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Recall Dips (Middle 40-60% Range)</text>
    <text x="610" y="70" fill="#34d399" font-size="8" font-weight="700" text-anchor="end">99.2% Recall (Recency Effect)</text>
  </g>
</svg>
