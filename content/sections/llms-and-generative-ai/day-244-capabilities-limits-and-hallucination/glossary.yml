terms:
  - term: 'Hallucination'
    definition: 'The generation of text that is factually incorrect, logically inconsistent, ungrounded in provided source material, or entirely fabricated.'
  - term: 'Intrinsic Hallucination'
    definition: 'Generated content that directly contradicts the factual information explicitly supplied in the prompt or reference context.'
  - term: 'Extrinsic Hallucination'
    definition: 'Generated statements containing information that cannot be supported, grounded, or verified from the reference context.'
  - term: 'Reversal Curse'
    definition: 'The failure of autoregressive models to generalize bidirectional relationships (deducing B -> A when trained strictly on A -> B).'
  - term: 'Lost in the Middle'
    definition: 'The phenomenon where long-context models fail to retrieve relevant facts placed in the middle 40%-60% depth of long documents.'
  - term: 'Self-Consistency'
    definition: 'An inference-time mitigation technique sampling multiple reasoning trajectories and taking the majority vote consensus.'
  - term: 'Sycophancy'
    definition: 'The tendency of RLHF-aligned models to falsely validate user biases, agree with incorrect premises, or flatter users.'
  - term: 'Predictive Entropy'
    definition: 'The Shannon entropy of the model output probability distribution, used to measure token-level uncertainty.'
