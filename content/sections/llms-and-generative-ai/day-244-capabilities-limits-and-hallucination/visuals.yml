visuals:
  - id: hallucination-taxonomy-and-mitigation-framework
    file: assets/hallucination-taxonomy-and-mitigation-framework.svg
    type: diagram
    title: 'LLM Hallucination Taxonomy & Mitigation Architecture'
    alt: Taxonomy of LLM hallucination failure modes and corresponding engineering mitigation strategies
    description: 'Overview of hallucination modes (confabulation, sycophancy, reversal curse) and production mitigation architectures.'
  - id: needle-in-a-haystack-context-degradation-curve
    file: assets/needle-in-a-haystack-context-degradation-curve.svg
    type: diagram
    title: 'Needle-in-a-Haystack & Lost-in-the-Middle Phenomenon'
    alt: Needle In A Haystack long-context retrieval degradation curve showing U-shaped retrieval accuracy across document depths
    description: 'Empirical demonstration of context retrieval degradation: high accuracy at document start and end, with retrieval degradation in the middle.'
  - id: hallucination-idea
    file: assets/hallucination-idea.svg
    type: diagram
    title: 'Why models make things up'
    alt: 'Diagram: why language models produce confident false statements'
    description: 'A four-stage description of hallucination covering the training objective, plausibility, the absence of a truth signal and the confident presentation.'
  - id: halluc-taxonomy
    file: assets/halluc-taxonomy.svg
    type: diagram
    title: 'Four kinds of hallucination'
    alt: 'Diagram: the four categories of language model hallucination'
    description: 'A four-stage description of hallucination types covering fabricated facts, unfaithful summarisation, invented citations and reasoning errors.'
  - id: lost-middle
    file: assets/lost-middle.svg
    type: diagram
    title: 'Position affects accuracy'
    alt: 'Diagram: how information placement in a long context affects retrieval accuracy'
    description: 'A four-stage description of positional attention covering the beginning, the middle, the end and the practical response.'
  - id: grounding
    file: assets/grounding.svg
    type: diagram
    title: 'Four layers of mitigation'
    alt: 'Diagram: the four layers of hallucination mitigation in a production system'
    description: 'A four-stage description of mitigation covering retrieval grounding, citation requirements, verification and human review.'
  - id: confident-witness
    file: assets/confident-witness.svg
    type: diagram
    title: 'A confident witness'
    alt: 'Diagram: a confident but unreliable account compared with a sourced one'
    description: 'A two-column comparison of a fluent unsourced account against a documented one.'
  - id: halluc-implications
    file: assets/halluc-implications.svg
    type: diagram
    title: 'Four consequences of hallucination'
    alt: 'Diagram: the liability, trust, cost and design implications of model hallucination'
    description: 'A four-stage description of hallucination implications covering legal exposure, user trust, verification cost and system design.'
  - id: halluc-when
    file: assets/halluc-when.svg
    type: diagram
    title: 'When strict grounding is required'
    alt: 'Diagram: when strict grounding and verification are necessary'
    description: 'A two-column comparison of tasks requiring strict grounding against those that do not.'
  - id: halluc-history
    file: assets/halluc-history.svg
    type: diagram
    title: 'Four steps in understanding hallucination'
    alt: 'Diagram: the historical progression of how hallucination has been understood and addressed'
    description: 'A four-stage description of hallucination history covering early dismissal, naming the problem, retrieval grounding and verification pipelines.'
  - id: reversal-curse
    file: assets/reversal-curse.svg
    type: diagram
    title: 'The reversal curse'
    alt: 'Diagram: how a model trained on a fact in one direction fails to recall it reversed'
    description: 'A four-stage description of the reversal curse covering the learned statement, the reversed question, the failure and its cause.'
  - id: halluc-vs-error
    file: assets/halluc-vs-error.svg
    type: diagram
    title: 'Hallucination against error'
    alt: 'Diagram: hallucination compared with an ordinary mistake'
    description: 'A two-column comparison of hallucination against conventional software error.'
