<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-label="Classifier-Free Guidance Extrapolation">
  <title>Classifier-Free Guidance Extrapolation</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d282f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d282f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d282f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d282f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d282f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d282f-arrowhead); }
      .d282f-pulse { animation: d282f-glow 2.5s infinite ease-in-out; }
      @keyframes d282f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d282f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d282f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d282f-box" x="0" y="0" width="220" height="180" />
    <text class="d282f-header" x="15" y="30">Unconditioned Noise</text>
    <text class="d282f-text" x="15" y="60">• eps_uncond = eps(xt, t, empty)</text>
    <text class="d282f-text" x="15" y="85">• Broad general prior</text>
    <text class="d282f-accent" x="15" y="130">Baseline vector</text>

    <path class="d282f-arrow" d="M 220 90 L 280 90" />

    <rect class="d282f-box d282f-pulse" x="280" y="0" width="240" height="180" />
    <text class="d282f-header" x="15" y="30">Conditioned Noise</text>
    <text class="d282f-text" x="15" y="60">• eps_cond = eps(xt, t, prompt)</text>
    <text class="d282f-text" x="15" y="85">• Delta = eps_cond - eps_uncond</text>
    <text class="d282f-accent" x="15" y="130">Text alignment vector</text>

    <path class="d282f-arrow" d="M 520 90 L 580 90" />

    <rect class="d282f-box" x="580" y="0" width="220" height="180" />
    <text class="d282f-header" x="15" y="30">CFG Extrapolation</text>
    <text class="d282f-text" x="15" y="60">• eps = eps_uncond + s*Delta</text>
    <text class="d282f-text" x="15" y="85">• Typical Scale: s = 7.5</text>
    <text class="d282f-accent" x="15" y="130">Amplified text prompt</text>
  </g>

</svg>