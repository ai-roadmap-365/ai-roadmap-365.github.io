<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four stages, one of them compressed.">
  <title>The generation pipeline</title>
  <style>
    .latent-pipeline-bg   { fill: #f8fafc; }
    .latent-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latent-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latent-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latent-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latent-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latent-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latent-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latent-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latent-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latent-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latent-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latent-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .latent-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .latent-pipeline-stage { opacity: 1; }

    .latent-pipeline-s0 { animation-delay: 0.00s; }
    .latent-pipeline-e0 { animation-delay: 0.00s; }
    .latent-pipeline-s1 { animation-delay: 1.28s; }
    .latent-pipeline-e1 { animation-delay: 1.28s; }
    .latent-pipeline-s2 { animation-delay: 2.56s; }
    .latent-pipeline-e2 { animation-delay: 2.56s; }
    .latent-pipeline-s3 { animation-delay: 3.84s; }
    .latent-pipeline-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .latent-pipeline-conn  { animation: latent-pipeline-trace 6.4s ease-in-out infinite; }
      .latent-pipeline-stage { animation: latent-pipeline-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes latent-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes latent-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .latent-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .latent-pipeline-stage { animation: latent-pipeline-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes latent-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="latent-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="latent-pipeline-bg" width="980" height="322"/>
  <text class="latent-pipeline-h1"  x="30" y="40">The generation pipeline</text>
  <text class="latent-pipeline-sub" x="30" y="64">Four stages, one of them compressed.</text>
  <g class="latent-pipeline-stage latent-pipeline-s0">
    <rect class="latent-pipeline-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="latent-pipeline-step" x="44" y="142">01</text>
    <text class="latent-pipeline-name" x="70" y="142">Encode the prompt</text>
    <text class="latent-pipeline-desc" x="44" y="166">Into a representation the</text>
    <text class="latent-pipeline-desc" x="44" y="182">denoiser can attend to.</text>
  </g>
  <line class="latent-pipeline-line latent-pipeline-conn latent-pipeline-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#latent-pipeline-tip)"/>
  <g class="latent-pipeline-stage latent-pipeline-s1">
    <rect class="latent-pipeline-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="latent-pipeline-step" x="280" y="142">02</text>
    <text class="latent-pipeline-name" x="306" y="142">Start from noise in a compressed space</text>
    <text class="latent-pipeline-desc" x="280" y="166">Far smaller than the final</text>
    <text class="latent-pipeline-desc" x="280" y="182">image.</text>
  </g>
  <line class="latent-pipeline-line latent-pipeline-conn latent-pipeline-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#latent-pipeline-tip)"/>
  <g class="latent-pipeline-stage latent-pipeline-s2">
    <rect class="latent-pipeline-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="latent-pipeline-step" x="516" y="142">03</text>
    <text class="latent-pipeline-name" x="542" y="142">Denoise, step by step, guided by the text</text>
    <text class="latent-pipeline-desc" x="516" y="166">Twenty to fifty steps,</text>
    <text class="latent-pipeline-desc" x="516" y="182">typically.</text>
  </g>
  <line class="latent-pipeline-line latent-pipeline-conn latent-pipeline-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#latent-pipeline-tip)"/>
  <g class="latent-pipeline-stage latent-pipeline-s3">
    <rect class="latent-pipeline-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="latent-pipeline-step" x="752" y="142">04</text>
    <text class="latent-pipeline-name" x="778" y="142">Then decode to full resolution</text>
    <text class="latent-pipeline-desc" x="752" y="166">One pass, at the very end.</text>
    <text class="latent-pipeline-edge" x="752" y="242">the saving</text>
  </g>
  <text class="latent-pipeline-sub" x="30" y="304">Doing the expensive iterative work in a compressed space and expanding only once is the whole reason this runs on ordinary hardware rather than a cluster.</text>
</svg>
