terms:
- term: Classifier-Free Guidance (CFG)
  definition: 'A technique to amplify text conditioning by computing noise predictions with and without
    the prompt: eps = eps_uncond + s * (eps_cond - eps_uncond).'
- term: Guidance Scale
  definition: The floating-point multiplier s (typically 5.0 to 9.0) determining how aggressively the
    image aligns with the text prompt.
- term: Variational Autoencoder (VAE)
  definition: An encoder-decoder network trained to compress high-resolution pixel images into low-dimensional
    continuous latent tensors.
- term: Latent Space
  definition: A compressed mathematical representation where a 512x512x3 image is represented as a 64x64x4
    tensor.
- term: Cross-Attention
  definition: An attention mechanism where latent spatial features query external text token embeddings
    to direct spatial synthesis.
- term: Inpainting
  definition: The task of reconstructing or replacing a user-selected masked sub-region of an image using
    diffusion conditioned on surrounding context.
- term: Negative Prompt
  definition: A textual description passed to the unconditioned branch of CFG to guide generation away
    from unwanted visual artifacts.
- term: ControlNet
  definition: An auxiliary neural adapter that adds structural spatial conditioning (such as edge maps,
    depth, or human pose skeletons) to a frozen diffusion model.
