questions:
- question: What is the mathematical formulation of Classifier-Free Guidance (CFG)?
  options:
  - eps_guided = eps_cond * eps_uncond
  - 'eps_uncond + s * (eps_cond - eps_uncond)'
  - eps_guided = (eps_cond + eps_uncond) / s
  - eps_guided = eps_cond / (1 - s)
  answer_index: 1
  explanation: CFG linearly extrapolates the noise prediction in the direction of the conditioned vector
    (eps_cond) away from the unconditioned baseline (eps_uncond) scaled by factor s.
- question: What visual artifact occurs if the CFG guidance scale 's' is set too high (e.g. s = 25)?
  options:
  - The image becomes completely transparent
  - The image turns into grayscale
  - 'Oversaturation and burnt colours'
  - The file size triples
  answer_index: 2
  explanation: Over-extrapolating with excessive guidance scale forces latent values outside the VAE decoder's
    learned distribution, causing chromatic burning and harsh artifacts.
- question: How do Negative Prompts operate inside the Classifier-Free Guidance pipeline?
  options:
  - They delete words from the training dataset
  - They reduce GPU temperature
  - They invert RGB colors
  - 'It replaces the empty unconditioned prompt'
  answer_index: 3
  explanation: By substituting the negative prompt in place of the null text embedding, CFG actively subtracts
    the negative prompt direction from the trajectory.
- question: What is the primary role of the Variational Autoencoder (VAE) decoder in Latent Diffusion
    Models?
  options:
  - 'Mapping the latent back to RGB'
  - Translating text prompts into embeddings
  - Running gradient descent
  - Calculating CLIP similarity
  answer_index: 0
  explanation: The VAE decoder upsamples the 4-channel compressed latent representation back into full-resolution
    RGB image pixels.
- question: What capability does ControlNet add to pretrained text-to-image diffusion models?
  options:
  - It adds sound effects to images
  - 'It adds spatial conditioning without retraining'
  - It speeds up network internet downloads
  - It allows running diffusion on microcontrollers
  answer_index: 1
  explanation: ControlNet locks the base model weights and trains a cloned set of encoding layers with
    zero-initialized convolutions to inject precise spatial geometry.
