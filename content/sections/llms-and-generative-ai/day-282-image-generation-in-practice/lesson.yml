learning_promise: 'Master production text-to-image synthesis pipelines: implement Classifier-Free Guidance
  (CFG) extrapolation, integrate VAE latent encoding/decoding, construct negative prompting pipelines,
  and simulate ControlNet spatial conditioning in Python.'
objectives:
- 'Deconstruct the three pillars of Latent Diffusion: Text Encoder (CLIP/T5), Denoising Backbone (U-Net/DiT),
  and VAE Autoencoder.'
- 'Derive and implement Classifier-Free Guidance: eps_guided = eps_uncond + s * (eps_cond - eps_uncond).'
- Implement negative prompt conditioning and evaluate the effect of guidance scale s on visual contrast
  and artifact distortion.
- Build an end-to-end Latent Diffusion Pipeline simulator in Python and NumPy.
- Measure latent memory compression ratios and VAE reconstruction fidelity.
