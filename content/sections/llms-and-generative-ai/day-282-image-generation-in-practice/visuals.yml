visuals:
- id: latent-diffusion-inference-pipeline
  file: assets/latent-diffusion-inference-pipeline.svg
  type: diagram
  title: Latent Diffusion Inference Pipeline
  alt: Latent Diffusion Inference Pipeline illustrating text encoding, latent space iterative denoising,
    and VAE pixel decoding
  description: Pipeline showing text prompt conditioning, latent denoising loop, and VAE decoding.
- id: classifier-free-guidance-extrapolation
  file: assets/classifier-free-guidance-extrapolation.svg
  type: diagram
  title: Classifier-Free Guidance Extrapolation
  alt: Classifier-Free Guidance Extrapolation demonstrating the algebraic combination of conditioned and
    unconditioned noise predictions
  description: Diagram demonstrating CFG extrapolation between conditioned and unconditioned noise vectors.
- id: latent-pipeline
  file: assets/latent-pipeline.svg
  type: diagram
  title: 'The generation pipeline'
  alt: 'Diagram: the four stages of a latent diffusion image generation pipeline'
  description: 'A four-stage description of latent diffusion covering text encoding, latent noise, iterative denoising and decoding.'
- id: memory-wall
  file: assets/memory-wall.svg
  type: diagram
  title: 'Why the latent space exists'
  alt: 'Diagram: why diffusion operates in a compressed space rather than on pixels'
  description: 'A four-stage description of the memory problem covering pixel-space cost, the iteration count, compression and the resulting feasibility.'
- id: cfg
  file: assets/cfg.svg
  type: diagram
  title: 'Guidance'
  alt: 'Diagram: how classifier-free guidance strengthens prompt adherence'
  description: 'A four-stage description of classifier-free guidance covering the two predictions, their difference, extrapolation and the strength setting.'
- id: cfg-tradeoff
  file: assets/cfg-tradeoff.svg
  type: diagram
  title: 'Low guidance against high'
  alt: 'Diagram: low guidance strength compared with high guidance strength'
  description: 'A two-column comparison of low and high classifier-free guidance settings.'
- id: negative-prompt
  file: assets/negative-prompt.svg
  type: diagram
  title: 'Negative prompting'
  alt: 'Diagram: how a negative prompt steers generation away from specified content'
  description: 'A four-stage description of negative prompting covering the unconditional baseline, its replacement, the resulting direction and the practical use.'
- id: vae-scaling
  file: assets/vae-scaling.svg
  type: diagram
  title: 'The scaling factor'
  alt: 'Diagram: why latent representations are rescaled before diffusion'
  description: 'A four-stage description of latent scaling covering the encoder output, its variance, the constant and the failure mode.'
- id: controlnet
  file: assets/controlnet.svg
  type: diagram
  title: 'Structural conditioning'
  alt: 'Diagram: how a structural condition constrains generated image layout'
  description: 'A four-stage description of structural conditioning covering the layout problem, the extracted condition, the parallel network and the result.'
- id: sculpting
  file: assets/sculpting.svg
  type: diagram
  title: 'Carving, or developing a photograph'
  alt: 'Diagram: additive creation compared with progressive refinement from noise'
  description: 'A two-column comparison of building an image up against refining it out of noise.'
- id: image-implications
  file: assets/image-implications.svg
  type: diagram
  title: 'Four consequences of image generation'
  alt: 'Diagram: the cost, copyright, consent and provenance implications of image generation'
  description: 'A four-stage description of image generation implications covering compute cost, training data provenance, likeness consent and output attribution.'
- id: image-when
  file: assets/image-when.svg
  type: diagram
  title: 'When to generate images'
  alt: 'Diagram: when generated imagery is appropriate'
  description: 'A two-column comparison of appropriate uses of image generation against inappropriate ones.'
