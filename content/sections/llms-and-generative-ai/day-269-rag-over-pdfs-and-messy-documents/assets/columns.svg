<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Reading columns correctly</title>
  <style>
    .columns-bg   { fill: #f8fafc; }
    .columns-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .columns-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .columns-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .columns-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .columns-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .columns-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .columns-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .columns-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .columns-stage { opacity: 1; }

    .columns-s0 { animation-delay: 0.00s; }
    .columns-e0 { animation-delay: 0.00s; }
    .columns-s1 { animation-delay: 1.28s; }
    .columns-e1 { animation-delay: 1.28s; }
    .columns-s2 { animation-delay: 2.56s; }
    .columns-e2 { animation-delay: 2.56s; }
    .columns-s3 { animation-delay: 3.84s; }
    .columns-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .columns-conn  { animation: columns-trace 6.4s ease-in-out infinite; }
      .columns-stage { animation: columns-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes columns-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes columns-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .columns-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .columns-stage { animation: columns-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes columns-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="columns-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="columns-bg" width="980" height="322"/>
  <text class="columns-h1"  x="30" y="40">Reading columns correctly</text>
  <text class="columns-sub" x="30" y="64">Four steps.</text>
  <g class="columns-stage columns-s0">
    <rect class="columns-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="columns-step" x="44" y="142">01</text>
    <text class="columns-name" x="70" y="142">Naive extraction reads across the page</text>
    <text class="columns-desc" x="44" y="166">Interleaving two columns line by</text>
    <text class="columns-desc" x="44" y="182">line.</text>
  </g>
  <line class="columns-line columns-conn columns-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#columns-tip)"/>
  <g class="columns-stage columns-s1">
    <rect class="columns-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="columns-step" x="280" y="142">02</text>
    <text class="columns-name" x="306" y="142">But every text fragment has a position</text>
    <text class="columns-desc" x="280" y="166">Which most extractors expose.</text>
  </g>
  <line class="columns-line columns-conn columns-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#columns-tip)"/>
  <g class="columns-stage columns-s2">
    <rect class="columns-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="columns-step" x="516" y="142">03</text>
    <text class="columns-name" x="542" y="142">Cluster fragments by horizontal position</text>
    <text class="columns-desc" x="516" y="166">Two clusters means two columns.</text>
  </g>
  <line class="columns-line columns-conn columns-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#columns-tip)"/>
  <g class="columns-stage columns-s3">
    <rect class="columns-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="columns-step" x="752" y="142">04</text>
    <text class="columns-name" x="778" y="142">Then read each column top to bottom</text>
    <text class="columns-desc" x="752" y="166">In the order a person would.</text>
  </g>
  <text class="columns-sub" x="30" y="304">Interleaved columns are particularly damaging because the result is fluent-looking text that means nothing, so no downstream check flags it.</text>
</svg>
