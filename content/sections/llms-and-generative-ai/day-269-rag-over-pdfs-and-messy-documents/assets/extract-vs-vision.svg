<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Cost against robustness.">
  <title>Text extraction against reading the page</title>
  <style>
    .extract-vs-vision-bg   { fill: #f8fafc; }
    .extract-vs-vision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extract-vs-vision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extract-vs-vision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extract-vs-vision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extract-vs-vision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extract-vs-vision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .extract-vs-vision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .extract-vs-vision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .extract-vs-vision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .extract-vs-vision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .extract-vs-vision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .extract-vs-vision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .extract-vs-vision-row { opacity: 1; }
    .extract-vs-vision-r0 { animation-delay: 0.00s; }
    .extract-vs-vision-r1 { animation-delay: 0.45s; }
    .extract-vs-vision-r2 { animation-delay: 0.90s; }
    .extract-vs-vision-r3 { animation-delay: 1.35s; }
    .extract-vs-vision-r4 { animation-delay: 1.80s; }
    .extract-vs-vision-row { animation: extract-vs-vision-reveal 7.3s ease-in-out infinite; }
    @keyframes extract-vs-vision-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="extract-vs-vision-bg" width="980" height="390"/>
  <text class="extract-vs-vision-h1"  x="30" y="40">Text extraction against reading the page</text>
  <text class="extract-vs-vision-sub" x="30" y="64">Cost against robustness.</text>
  <rect class="extract-vs-vision-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="extract-vs-vision-name" x="46" y="122">Programmatic extraction</text>
  <text class="extract-vs-vision-desc" x="46" y="142">Exact and cheap.</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r0" x="46" y="182">Character-exact where text exists</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r1" x="46" y="216">Effectively free</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r2" x="46" y="250">Milliseconds per page</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r3" x="46" y="284">Fails entirely on scans</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r4" x="46" y="318">Right for the majority of documents</text>
  <rect class="extract-vs-vision-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="extract-vs-vision-name" x="526" y="122">Reading the page</text>
  <text class="extract-vs-vision-desc" x="526" y="142">Robust and costly.</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r0" x="526" y="182">Handles scans, handwriting and layout</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r1" x="526" y="216">Costs tokens per page</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r2" x="526" y="250">Seconds per page</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r3" x="526" y="284">Can misread, confidently</text>
  <text class="extract-vs-vision-desc extract-vs-vision-row extract-vs-vision-r4" x="526" y="318">Right for what extraction cannot handle</text>
  <text class="extract-vs-vision-sub" x="30" y="372">The yield measurement is what routes between them, which makes it the load-bearing check in the whole ingestion design rather than a diagnostic nicety.</text>
</svg>
