    alt: 'Diagram: the coverage, cost, security and effort implications of real-world document ingestion'
    description: 'A four-stage description of ingestion implications covering silent coverage gaps, recognition cost, malicious files and engineering effort.'
  - id: messy-when
    file: assets/messy-when.svg
