terms:
  - term: 'Retrieval-Augmented Generation (RAG)'
    definition: 'An AI framework combining external knowledge retrieval from databases with generative LLM inference for grounded answers.'
  - term: 'Parametric Memory'
    definition: 'Knowledge encoded directly into the neural network weights during pre-training and fine-tuning.'
  - term: 'Non-Parametric Memory'
    definition: 'External knowledge stored in vector stores, databases, and document files accessed dynamically at inference time.'
  - term: 'Reciprocal Rank Fusion (RRF)'
    definition: 'A rank-based algorithm that aggregates heterogeneous search candidate rankings using reciprocal rank scoring.'
  - term: 'Okapi BM25'
    definition: 'A non-linear probabilistic ranking function used in sparse keyword search based on term frequency and inverted document frequency.'
  - term: 'Cross-Encoder Re-Ranker'
    definition: 'A neural model that processes query and document pairs jointly through full cross-attention to compute precise relevance scores.'
  - term: 'Bi-Encoder'
    definition: 'A neural architecture that encodes queries and documents into separate dense vector embeddings independently.'
  - term: 'Inline Citation'
    definition: 'A bracketed numerical marker ([1], [2]) linking a generated factual claim directly to a retrieved source document passage.'
  - term: 'RAG Triad'
    definition: 'An evaluation framework measuring Faithfulness, Answer Relevance, and Context Precision in RAG applications.'
  - term: 'Context Precision'
    definition: 'The proportion of retrieved context passages that contain ground-truth information relevant to answering the query.'
