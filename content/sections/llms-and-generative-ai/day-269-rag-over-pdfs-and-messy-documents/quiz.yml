questions:
  - question: 'Why is a two-column PDF read straight across the most dangerous extraction failure?'
    options:
      - 'It raises a parsing exception that halts the whole ingestion run'
      - 'The spliced text stays fluent, so quality signals pass it'
      - 'It produces an empty string that is obvious on inspection'
      - 'It corrupts the source file on disk during extraction'
    answer_index: 1
    explanation: 'Interleaving two columns yields grammatical, plausible sentences. Language detection, perplexity and word-length checks all pass, so it is indexed and answers questions wrongly for months.'

  - question: 'Which single measurement most reliably separates a text-bearing PDF from a scan?'
    options:
      - 'The number of fonts declared in the document header'
      - 'The total size of the file in bytes'
      - 'Characters recovered divided by page count'
      - 'Whether the filename ends in .pdf or .PDF'
    answer_index: 2
    explanation: 'A text page yields roughly 1,500-3,000 characters. Under about 100 per page means there is no text layer. It costs one division and catches the most common silent failure.'

  - question: 'Why must a bounded parse run in a separate process rather than a thread?'
    options:
      - 'The PDF specification forbids concurrent access to a file'
      - 'Threads cannot open binary files on most operating systems'
      - 'Processes are faster than threads for input-output work'
      - 'A parser stuck in a loop never checks a deadline, and a thread cannot be killed'
    answer_index: 3
    explanation: 'Cancellation needs the target''s cooperation, and a parser in a tight loop offers none. Only a process can be terminated from outside.'

  - question: 'Why does the pipeline have a flag outcome as well as accept and reject?'
    options:
      - 'Rejecting everything suspicious discards documents whose partial text is useful'
      - 'Flagging is required by the PDF specification for scanned documents'
      - 'It halves the storage needed compared with accepting the document'
      - 'Flagged documents are re-parsed automatically on every query'
    answer_index: 0
    explanation: 'Two outcomes force a bad choice: accept silently admits the column splice, reject throws away usable text. The third indexes the text and records that it needs review.'

  - question: 'Why should format detection read the leading bytes rather than the extension?'
    options:
      - 'Reading bytes is faster than reading the filename from the directory'
      - 'The extension is metadata a human chose, and can be wrong or stale'
      - 'Extensions are not preserved when files are copied between machines'
      - 'The leading bytes contain the document''s page count'
    answer_index: 1
    explanation: 'A signature such as %PDF- is a fact about the file. The extension is an assertion about it, and a .pdf may be a scan or a renamed image.'
