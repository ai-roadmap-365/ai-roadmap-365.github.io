questions:
  - question: 'What is the architectural role of a System Prompt in API-driven foundation models (e.g. OpenAI system role, Claude system parameter)?'
    options:
      - 'It encrypts hard drive data on the server'
      - 'It compiles Python code to C++ binaries'
      - 'It controls the cooling fan speed of the GPU'
      - 'A persistent high-priority prefix on every turn'
    answer_index: 3
    explanation: 'System prompts condition the initial KV-cache prefix, guiding all subsequent attention computations.'
  - question: 'What are the 3 tiers of the Persona and Guardrail Architecture?'
    options:
      - 'Safety shell, operational bounds, persona core'
      - '1. HTML, 2. CSS, 3. JavaScript'
      - '1. TCP, 2. IP, 3. UDP'
      - '1. Read, 2. Write, 3. Execute'
    answer_index: 0
    explanation: 'The 3-tier architecture encapsulates inner persona traits within operational boundaries and outer safety guardrails.'
  - question: 'Why should refusal responses in system prompts be scripted with neutral, objective language (e.g. "I cannot fulfill this request because it violates safety guidelines") rather than moralizing or apologetic prose?'
    options:
      - 'Because apologies cost more API tokens'
      - 'Preachy replies annoy users and invite pushback'
      - 'Because apologizing is illegal under GDPR'
      - 'Because neutral words use less GPU power'
    answer_index: 1
    explanation: 'Neutral, matter-of-fact refusals maintain professional authority and avoid engaging in argumentative loops.'
  - question: 'How does Prompt Prefix Caching impact system prompt design in production applications?'
    options:
      - 'Caching only works if system prompts are written in Spanish'
      - 'Caching requires deleting the system prompt after every turn'
      - 'A stable prefix is cached, cutting cost and latency'
      - 'Caching has no relationship to system prompts'
    answer_index: 2
    explanation: 'Keeping system prompts static maximizes prefix cache hits, drastically reducing latency and token costs.'
  - question: 'What is Persona Drift in long multi-turn agentic conversations, and how is it mitigated?'
    options:
      - 'A network disconnect between client and server'
      - 'A hardware glitch in GPU memory'
      - 'A bug where the user changes their username'
      - 'Persona drifts as the context fills with turns'
    answer_index: 3
    explanation: 'Persona drift occurs as conversation history dilutes initial attention weight; system anchoring prevents drift.'
