terms:
  - term: 'System Prompt'
    definition: 'A top-level instruction block provided to an LLM before user inputs, setting persistent persona, capabilities, tone, and safety rules.'
  - term: 'Persona Engineering'
    definition: 'The intentional design of an AI assistant identity, domain expertise level, vocabulary, and communication style.'
  - term: 'Safety Shell'
    definition: 'The outermost tier of a system prompt defining non-negotiable legal, privacy, and security refusal boundaries.'
  - term: 'Operational Boundaries'
    definition: 'System prompt rules governing schema adherence, tool invocation protocols, and conversational preamble suppression.'
  - term: 'Persona Drift'
    definition: 'The tendency of an LLM to lose its intended tone, role, or constraints over extended multi-turn conversations.'
  - term: 'Neutral Refusal'
    definition: 'A concise, non-judgmental refusal to perform prohibited tasks, avoiding apologies or moralizing statements.'
  - term: 'Latent Steering'
    definition: 'Conditioning the hidden activation states of a Transformer to favor specific semantic and stylistic subspaces.'
  - term: 'Prefix Cache Hit'
    definition: 'Reusing previously computed KV-cache states for identical prompt prefixes across subsequent API requests.'
