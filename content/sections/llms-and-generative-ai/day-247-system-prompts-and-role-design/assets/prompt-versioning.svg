<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Like any other release.">
  <title>Versioning a system prompt</title>
  <style>
    .prompt-versioning-bg   { fill: #f8fafc; }
    .prompt-versioning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-versioning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-versioning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-versioning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-versioning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-versioning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-versioning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-versioning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-versioning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-versioning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-versioning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-versioning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-versioning-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-versioning-stage { opacity: 1; }

    .prompt-versioning-s0 { animation-delay: 0.00s; }
    .prompt-versioning-e0 { animation-delay: 0.00s; }
    .prompt-versioning-s1 { animation-delay: 1.28s; }
    .prompt-versioning-e1 { animation-delay: 1.28s; }
    .prompt-versioning-s2 { animation-delay: 2.56s; }
    .prompt-versioning-e2 { animation-delay: 2.56s; }
    .prompt-versioning-s3 { animation-delay: 3.84s; }
    .prompt-versioning-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-versioning-conn  { animation: prompt-versioning-trace 6.4s ease-in-out infinite; }
      .prompt-versioning-stage { animation: prompt-versioning-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prompt-versioning-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-versioning-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-versioning-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-versioning-stage { animation: prompt-versioning-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-versioning-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-versioning-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-versioning-bg" width="980" height="322"/>
  <text class="prompt-versioning-h1"  x="30" y="40">Versioning a system prompt</text>
  <text class="prompt-versioning-sub" x="30" y="64">Like any other release.</text>
  <g class="prompt-versioning-stage prompt-versioning-s0">
    <rect class="prompt-versioning-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-versioning-step" x="44" y="142">01</text>
    <text class="prompt-versioning-name" x="70" y="142">Change the prompt in version control</text>
    <text class="prompt-versioning-desc" x="44" y="166">Reviewed, with a stated reason.</text>
  </g>
  <line class="prompt-versioning-line prompt-versioning-conn prompt-versioning-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prompt-versioning-tip)"/>
  <g class="prompt-versioning-stage prompt-versioning-s1">
    <rect class="prompt-versioning-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-versioning-step" x="280" y="142">02</text>
    <text class="prompt-versioning-name" x="306" y="142">Run the evaluation set against it</text>
    <text class="prompt-versioning-desc" x="280" y="166">Comparing against the version in</text>
    <text class="prompt-versioning-desc" x="280" y="182">production.</text>
  </g>
  <line class="prompt-versioning-line prompt-versioning-conn prompt-versioning-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prompt-versioning-tip)"/>
  <g class="prompt-versioning-stage prompt-versioning-s2">
    <rect class="prompt-versioning-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-versioning-step" x="516" y="142">03</text>
    <text class="prompt-versioning-name" x="542" y="142">Roll out to a fraction of traffic</text>
    <text class="prompt-versioning-desc" x="516" y="166">Watching the live quality</text>
    <text class="prompt-versioning-desc" x="516" y="182">signals.</text>
  </g>
  <line class="prompt-versioning-line prompt-versioning-conn prompt-versioning-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prompt-versioning-tip)"/>
  <g class="prompt-versioning-stage prompt-versioning-s3">
    <rect class="prompt-versioning-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-versioning-step" x="752" y="142">04</text>
    <text class="prompt-versioning-name" x="778" y="142">And roll back by version if it regresses</text>
    <text class="prompt-versioning-desc" x="752" y="166">Which requires that the old one</text>
    <text class="prompt-versioning-desc" x="752" y="182">still exists.</text>
  </g>
  <text class="prompt-versioning-sub" x="30" y="304">This is the same release discipline as for code, and it is skipped because a prompt edit feels like editing prose rather than shipping a behavioural change.</text>
</svg>
