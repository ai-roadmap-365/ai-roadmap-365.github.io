<svg role="img" aria-label="Persona core and multi-layer security guardrails architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Persona Core &amp; Security Guardrails Architecture</title>
  <defs>
    <linearGradient id="bg247b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card247b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg247b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PERSONA DESIGN &amp; DEFENSIVE GUARDRAIL ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Multi-Tier Encapsulation: Outer Safety Shell, Operational Boundaries, Inner Persona Core</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card247b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Outer Shell: Safety & Compliance -->
    <rect x="25" y="25" width="670" height="245" fill="#0f172a" stroke="#fb7185" stroke-width="2" rx="8"/>
    <text x="50" y="50" fill="#fb7185" font-size="10" font-weight="700">Tier 1: Outer Safety &amp; Policy Guardrails (Hard Refusals, PII Redaction, No Exfiltration)</text>

    <!-- Middle Shell: Operational Rules -->
    <rect x="55" y="70" width="610" height="180" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="75" y="95" fill="#fbbf24" font-size="10" font-weight="700">Tier 2: Operational Boundaries (Format Enforcement, Preamble Ban, Tool Call Protocol)</text>

    <!-- Inner Core: Persona -->
    <rect x="85" y="115" width="550" height="115" fill="#0f172a" stroke="#34d399" stroke-width="2" rx="6"/>
    <text x="360" y="145" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Tier 3: Persona &amp; Tone Core</text>
    <text x="110" y="170" fill="#cbd5e1" font-size="8">• Domain Lexicon &amp; Technical Depth: Senior Level</text>
    <text x="110" y="190" fill="#cbd5e1" font-size="8">• Behavioral Stance: Objective, Evidence-Based, Non-Sycophantic</text>
    <text x="110" y="210" fill="#cbd5e1" font-size="8">• Communication Style: Precise, Structured Markdown, Direct</text>
  </g>
</svg>
