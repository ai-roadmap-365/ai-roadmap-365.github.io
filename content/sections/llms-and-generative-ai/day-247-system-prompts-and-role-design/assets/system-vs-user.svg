<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different trust, different lifetime.">
  <title>System prompt against user prompt</title>
  <style>
    .system-vs-user-bg   { fill: #f8fafc; }
    .system-vs-user-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-vs-user-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-vs-user-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-vs-user-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-vs-user-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-vs-user-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .system-vs-user-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .system-vs-user-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .system-vs-user-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .system-vs-user-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .system-vs-user-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .system-vs-user-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .system-vs-user-row { opacity: 1; }
    .system-vs-user-r0 { animation-delay: 0.00s; }
    .system-vs-user-r1 { animation-delay: 0.45s; }
    .system-vs-user-r2 { animation-delay: 0.90s; }
    .system-vs-user-r3 { animation-delay: 1.35s; }
    .system-vs-user-r4 { animation-delay: 1.80s; }
    .system-vs-user-row { animation: system-vs-user-reveal 7.3s ease-in-out infinite; }
    @keyframes system-vs-user-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="system-vs-user-bg" width="980" height="390"/>
  <text class="system-vs-user-h1"  x="30" y="40">System prompt against user prompt</text>
  <text class="system-vs-user-sub" x="30" y="64">Different trust, different lifetime.</text>
  <rect class="system-vs-user-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="system-vs-user-name" x="46" y="122">System prompt</text>
  <text class="system-vs-user-desc" x="46" y="142">Yours, and stable.</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r0" x="46" y="182">Written by the team</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r1" x="46" y="216">Identical on every request</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r2" x="46" y="250">Trusted by construction</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r3" x="46" y="284">Versioned and evaluated</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r4" x="46" y="318">Cached, and billed at a discount</text>
  <rect class="system-vs-user-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="system-vs-user-name" x="526" y="122">User message</text>
  <text class="system-vs-user-desc" x="526" y="142">Theirs, and variable.</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r0" x="526" y="182">Written by whoever is using it</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r1" x="526" y="216">Different every request</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r2" x="526" y="250">Untrusted, always</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r3" x="526" y="284">Cannot be reviewed in advance</text>
  <text class="system-vs-user-desc system-vs-user-row system-vs-user-r4" x="526" y="318">Delimited, and treated as data</text>
  <text class="system-vs-user-sub" x="30" y="372">The trust boundary between these two is the whole basis of prompt-injection defence, and collapsing it — by pasting user text into the system prompt — removes the defence entirely.</text>
</svg>
