<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cost included.">
  <title>Four consequences of system prompt design</title>
  <style>
    .system-implications-bg   { fill: #f8fafc; }
    .system-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .system-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .system-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .system-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .system-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .system-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .system-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .system-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .system-implications-stage { opacity: 1; }

    .system-implications-s0 { animation-delay: 0.00s; }
    .system-implications-e0 { animation-delay: 0.00s; }
    .system-implications-s1 { animation-delay: 1.28s; }
    .system-implications-e1 { animation-delay: 1.28s; }
    .system-implications-s2 { animation-delay: 2.56s; }
    .system-implications-e2 { animation-delay: 2.56s; }
    .system-implications-s3 { animation-delay: 3.84s; }
    .system-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .system-implications-conn  { animation: system-implications-trace 6.4s ease-in-out infinite; }
      .system-implications-stage { animation: system-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes system-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes system-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .system-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .system-implications-stage { animation: system-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes system-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="system-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="system-implications-bg" width="980" height="322"/>
  <text class="system-implications-h1"  x="30" y="40">Four consequences of system prompt design</text>
  <text class="system-implications-sub" x="30" y="64">Cost included.</text>
  <g class="system-implications-stage system-implications-s0">
    <rect class="system-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="system-implications-step" x="44" y="142">01</text>
    <text class="system-implications-name" x="70" y="142">It is billed on every single request</text>
    <text class="system-implications-desc" x="44" y="166">So length has a direct,</text>
    <text class="system-implications-desc" x="44" y="182">permanent cost.</text>
  </g>
  <line class="system-implications-line system-implications-conn system-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#system-implications-tip)"/>
  <g class="system-implications-stage system-implications-s1">
    <rect class="system-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="system-implications-step" x="280" y="142">02</text>
    <text class="system-implications-name" x="306" y="142">And it can be extracted</text>
    <text class="system-implications-desc" x="280" y="166">Assume it will become public.</text>
    <text class="system-implications-desc" x="280" y="182">Put no secrets in it.</text>
  </g>
  <line class="system-implications-line system-implications-conn system-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#system-implications-tip)"/>
  <g class="system-implications-stage system-implications-s2">
    <rect class="system-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="system-implications-step" x="516" y="142">03</text>
    <text class="system-implications-name" x="542" y="142">Behaviour drifts in long conversations</text>
    <text class="system-implications-desc" x="516" y="166">Which needs probing rather than</text>
    <text class="system-implications-desc" x="516" y="182">assuming.</text>
  </g>
  <line class="system-implications-line system-implications-conn system-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#system-implications-tip)"/>
  <g class="system-implications-stage system-implications-s3">
    <rect class="system-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="system-implications-step" x="752" y="142">04</text>
    <text class="system-implications-name" x="778" y="142">So version it, and evaluate every change</text>
    <text class="system-implications-desc" x="752" y="166">Like any other behavioural</text>
    <text class="system-implications-desc" x="752" y="182">configuration.</text>
  </g>
  <text class="system-implications-sub" x="30" y="304">Assuming extraction is the safe default: system prompts from major products are routinely published, and any design that depends on secrecy has already failed.</text>
</svg>
