learning_promise: 'Master the engineering and architecture of System Prompts and Persona Design in production LLMs: understand how system prompts establish persistent attention anchors in the KV cache across multi-turn sessions, design calibrated domain personas with controlled vocabulary and communication tone, establish immutable security guardrails and fallback refusal policies, implement multi-agent persona switching, and build an automated system prompt compiler and persona consistency evaluator in Python.'
objectives:
  - 'Explain how system instructions condition the KV cache and transformer hidden states across multi-turn conversations.'
  - 'Design structured 3-tier system prompts (Safety Shell, Operational Rules, Persona Core).'
  - 'Calibrate persona communication styles across executive, developer, and support domains.'
  - 'Implement robust fallback refusal policies that avoid preachy or evasive language.'
  - 'Build an automated system prompt generator and persona consistency validator in Python.'
