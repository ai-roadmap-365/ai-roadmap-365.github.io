<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rate against capability.">
  <title>Hiring for a job</title>
  <style>
    .contractors-bg   { fill: #f8fafc; }
    .contractors-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractors-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractors-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractors-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractors-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractors-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .contractors-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .contractors-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .contractors-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .contractors-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .contractors-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .contractors-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .contractors-row { opacity: 1; }
    .contractors-r0 { animation-delay: 0.00s; }
    .contractors-r1 { animation-delay: 0.45s; }
    .contractors-r2 { animation-delay: 0.90s; }
    .contractors-r3 { animation-delay: 1.35s; }
    .contractors-r4 { animation-delay: 1.80s; }
    .contractors-row { animation: contractors-reveal 7.3s ease-in-out infinite; }
    @keyframes contractors-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="contractors-bg" width="980" height="390"/>
  <text class="contractors-h1"  x="30" y="40">Hiring for a job</text>
  <text class="contractors-sub" x="30" y="64">Rate against capability.</text>
  <rect class="contractors-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="contractors-name" x="46" y="122">The junior rate</text>
  <text class="contractors-desc" x="46" y="142">Most of the work.</text>
  <text class="contractors-desc contractors-row contractors-r0" x="46" y="182">Handles routine tasks well</text>
  <text class="contractors-desc contractors-row contractors-r1" x="46" y="216">A fraction of the hourly cost</text>
  <text class="contractors-desc contractors-row contractors-r2" x="46" y="250">Faster to respond</text>
  <text class="contractors-desc contractors-row contractors-r3" x="46" y="284">Escalates what they cannot do</text>
  <text class="contractors-desc contractors-row contractors-r4" x="46" y="318">This is the small model</text>
  <rect class="contractors-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="contractors-name" x="526" y="122">The senior rate</text>
  <text class="contractors-desc" x="526" y="142">The hard part.</text>
  <text class="contractors-desc contractors-row contractors-r0" x="526" y="182">Handles anything</text>
  <text class="contractors-desc contractors-row contractors-r1" x="526" y="216">Many times the cost</text>
  <text class="contractors-desc contractors-row contractors-r2" x="526" y="250">Slower, and worth waiting for</text>
  <text class="contractors-desc contractors-row contractors-r3" x="526" y="284">Called in on escalation</text>
  <text class="contractors-desc contractors-row contractors-r4" x="526" y="318">This is the frontier model</text>
  <text class="contractors-sub" x="30" y="372">No sensible firm staffs every job at the senior rate, and the same reasoning applies here — which is exactly what tiered routing implements.</text>
</svg>
