<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when one is enough.">
  <title>When to route between models</title>
  <style>
    .landscape-when-bg   { fill: #f8fafc; }
    .landscape-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .landscape-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .landscape-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .landscape-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .landscape-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .landscape-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .landscape-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .landscape-when-row { opacity: 1; }
    .landscape-when-r0 { animation-delay: 0.00s; }
    .landscape-when-r1 { animation-delay: 0.45s; }
    .landscape-when-r2 { animation-delay: 0.90s; }
    .landscape-when-r3 { animation-delay: 1.35s; }
    .landscape-when-r4 { animation-delay: 1.80s; }
    .landscape-when-row { animation: landscape-when-reveal 7.3s ease-in-out infinite; }
    @keyframes landscape-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="landscape-when-bg" width="980" height="390"/>
  <text class="landscape-when-h1"  x="30" y="40">When to route between models</text>
  <text class="landscape-when-sub" x="30" y="64">And when one is enough.</text>
  <rect class="landscape-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="landscape-when-name" x="46" y="122">Route</text>
  <text class="landscape-when-desc" x="46" y="142">Volume and variety.</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r0" x="46" y="182">High request volume where cost matters</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r1" x="46" y="216">A wide spread of task difficulty</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r2" x="46" y="250">Where a fallback provider is required</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r3" x="46" y="284">Latency-sensitive paths alongside slow ones</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r4" x="46" y="318">And you can measure escalation quality</text>
  <rect class="landscape-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="landscape-when-name" x="526" y="122">Use one</text>
  <text class="landscape-when-desc" x="526" y="142">Simpler, and often right.</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r0" x="526" y="182">Low volume</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r1" x="526" y="216">Uniform task difficulty</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r2" x="526" y="250">Early product development</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r3" x="526" y="284">Where the routing logic would cost more than it saves</text>
  <text class="landscape-when-desc landscape-when-row landscape-when-r4" x="526" y="318">And correctness matters more than cost</text>
  <text class="landscape-when-sub" x="30" y="372">Routing adds a component that can itself be wrong, so it earns its place only when the saving is large enough to justify evaluating a second system.</text>
</svg>
