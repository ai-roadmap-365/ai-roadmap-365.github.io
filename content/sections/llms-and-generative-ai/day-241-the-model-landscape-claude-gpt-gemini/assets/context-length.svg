<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to supply knowledge.">
  <title>A long context against retrieval</title>
  <style>
    .context-length-bg   { fill: #f8fafc; }
    .context-length-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-length-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-length-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-length-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-length-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-length-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .context-length-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .context-length-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .context-length-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .context-length-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .context-length-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .context-length-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .context-length-row { opacity: 1; }
    .context-length-r0 { animation-delay: 0.00s; }
    .context-length-r1 { animation-delay: 0.45s; }
    .context-length-r2 { animation-delay: 0.90s; }
    .context-length-r3 { animation-delay: 1.35s; }
    .context-length-r4 { animation-delay: 1.80s; }
    .context-length-row { animation: context-length-reveal 7.3s ease-in-out infinite; }
    @keyframes context-length-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="context-length-bg" width="980" height="390"/>
  <text class="context-length-h1"  x="30" y="40">A long context against retrieval</text>
  <text class="context-length-sub" x="30" y="64">Two ways to supply knowledge.</text>
  <rect class="context-length-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="context-length-name" x="46" y="122">Put it all in the context</text>
  <text class="context-length-desc" x="46" y="142">Simple, and expensive.</text>
  <text class="context-length-desc context-length-row context-length-r0" x="46" y="182">No retrieval system to build</text>
  <text class="context-length-desc context-length-row context-length-r1" x="46" y="216">The model sees everything</text>
  <text class="context-length-desc context-length-row context-length-r2" x="46" y="250">Cost scales with every request</text>
  <text class="context-length-desc context-length-row context-length-r3" x="46" y="284">Attention quality falls in the middle</text>
  <text class="context-length-desc context-length-row context-length-r4" x="46" y="318">Right for a moderate, fixed corpus</text>
  <rect class="context-length-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="context-length-name" x="526" y="122">Retrieve what is relevant</text>
  <text class="context-length-desc" x="526" y="142">Cheaper, and more work.</text>
  <text class="context-length-desc context-length-row context-length-r0" x="526" y="182">An index to build and maintain</text>
  <text class="context-length-desc context-length-row context-length-r1" x="526" y="216">The model sees a selected subset</text>
  <text class="context-length-desc context-length-row context-length-r2" x="526" y="250">Cost stays roughly flat</text>
  <text class="context-length-desc context-length-row context-length-r3" x="526" y="284">Quality depends on the retrieval</text>
  <text class="context-length-desc context-length-row context-length-r4" x="526" y="318">Right for a large or changing corpus</text>
  <text class="context-length-sub" x="30" y="372">Degraded attention in the middle of very long contexts is measurable and is why a large window does not remove the need for retrieval, even where the budget allows it.</text>
</svg>
