<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Including lock-in.">
  <title>Four consequences of the model market</title>
  <style>
    .landscape-implications-bg   { fill: #f8fafc; }
    .landscape-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .landscape-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .landscape-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .landscape-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .landscape-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .landscape-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .landscape-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .landscape-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .landscape-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .landscape-implications-stage { opacity: 1; }

    .landscape-implications-s0 { animation-delay: 0.00s; }
    .landscape-implications-e0 { animation-delay: 0.00s; }
    .landscape-implications-s1 { animation-delay: 1.28s; }
    .landscape-implications-e1 { animation-delay: 1.28s; }
    .landscape-implications-s2 { animation-delay: 2.56s; }
    .landscape-implications-e2 { animation-delay: 2.56s; }
    .landscape-implications-s3 { animation-delay: 3.84s; }
    .landscape-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .landscape-implications-conn  { animation: landscape-implications-trace 6.4s ease-in-out infinite; }
      .landscape-implications-stage { animation: landscape-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes landscape-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes landscape-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .landscape-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .landscape-implications-stage { animation: landscape-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes landscape-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="landscape-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="landscape-implications-bg" width="980" height="322"/>
  <text class="landscape-implications-h1"  x="30" y="40">Four consequences of the model market</text>
  <text class="landscape-implications-sub" x="30" y="64">Including lock-in.</text>
  <g class="landscape-implications-stage landscape-implications-s0">
    <rect class="landscape-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="landscape-implications-step" x="44" y="142">01</text>
    <text class="landscape-implications-name" x="70" y="142">Prices fall steadily</text>
    <text class="landscape-implications-desc" x="44" y="166">So a cost model built today is</text>
    <text class="landscape-implications-desc" x="44" y="182">pessimistic within a year.</text>
  </g>
  <line class="landscape-implications-line landscape-implications-conn landscape-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#landscape-implications-tip)"/>
  <g class="landscape-implications-stage landscape-implications-s1">
    <rect class="landscape-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="landscape-implications-step" x="280" y="142">02</text>
    <text class="landscape-implications-name" x="306" y="142">But provider-specific features create lock-in</text>
    <text class="landscape-implications-desc" x="280" y="166">Tool formats, caching semantics,</text>
    <text class="landscape-implications-desc" x="280" y="182">system prompt behaviour.</text>
  </g>
  <line class="landscape-implications-line landscape-implications-conn landscape-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#landscape-implications-tip)"/>
  <g class="landscape-implications-stage landscape-implications-s2">
    <rect class="landscape-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="landscape-implications-step" x="516" y="142">03</text>
    <text class="landscape-implications-name" x="542" y="142">And your prompts leave your infrastructure</text>
    <text class="landscape-implications-desc" x="516" y="166">Check retention and training</text>
    <text class="landscape-implications-desc" x="516" y="182">terms, per provider.</text>
  </g>
  <line class="landscape-implications-line landscape-implications-conn landscape-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#landscape-implications-tip)"/>
  <g class="landscape-implications-stage landscape-implications-s3">
    <rect class="landscape-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="landscape-implications-step" x="752" y="142">04</text>
    <text class="landscape-implications-name" x="778" y="142">Models change under a stable name</text>
    <text class="landscape-implications-desc" x="752" y="166">So pin versions and re-run your</text>
    <text class="landscape-implications-desc" x="752" y="182">evaluation.</text>
  </g>
  <text class="landscape-implications-sub" x="30" y="304">Silent model updates are the operational hazard here: behaviour shifts with no deployment on your side, which is only detectable if the evaluation runs on a schedule.</text>
</svg>
