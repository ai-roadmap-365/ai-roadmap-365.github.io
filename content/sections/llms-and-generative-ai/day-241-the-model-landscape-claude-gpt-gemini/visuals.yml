visuals:
  - id: frontier-llm-landscape-taxonomy-matrix
    file: assets/frontier-llm-landscape-taxonomy-matrix.svg
    type: diagram
    title: 'Frontier LLM Landscape Taxonomy'
    alt: Frontier LLM landscape taxonomy matrix categorizing leading AI models by capability, latency, and cost
    description: 'Taxonomy of modern LLMs: Frontier Commercial (Claude/GPT/Gemini), Fast Workhorses (Flash/Haiku), Open-Weights Flagships (LLaMA/DeepSeek), and Edge models.'
  - id: model-routing-decision-architecture
    file: assets/model-routing-decision-architecture.svg
    type: diagram
    title: 'Model Routing & Cost Optimization Pipeline'
    alt: Production multi-model routing pipeline architecture diagram directing user queries to optimal cost and latency tiers
    description: 'Multi-tier model routing pipeline directing simple queries to fast lightweight models and complex tasks to frontier reasoning models.'
  - id: landscape-idea
    file: assets/landscape-idea.svg
    type: diagram
    title: 'Choosing a model'
    alt: 'Diagram: the four dimensions along which language models are chosen'
    description: 'A four-stage description of model selection covering capability, cost, latency and constraints.'
  - id: routing
    file: assets/routing.svg
    type: diagram
    title: 'Tiered routing'
    alt: 'Diagram: how requests are routed between cheap and expensive models'
    description: 'A four-stage description of model routing covering classification, the cheap tier, escalation and the cost result.'
  - id: prompt-caching
    file: assets/prompt-caching.svg
    type: diagram
    title: 'Prompt caching'
    alt: 'Diagram: how prompt caching reduces the cost of repeated context'
    description: 'A four-stage description of prompt caching covering the repeated prefix, the cost, the cached state and the saving.'
  - id: benchmarks
    file: assets/benchmarks.svg
    type: diagram
    title: 'Public benchmarks against your evaluation'
    alt: 'Diagram: public benchmark scores compared with task-specific evaluation'
    description: 'A two-column comparison of published benchmark results against an internal evaluation set.'
  - id: structured-output
    file: assets/structured-output.svg
    type: diagram
    title: 'Guaranteed structured output'
    alt: 'Diagram: how constrained decoding guarantees syntactically valid structured output'
    description: 'A four-stage description of constrained decoding covering unreliable formatting, the schema, token masking and the guarantee.'
  - id: contractors
    file: assets/contractors.svg
    type: diagram
    title: 'Hiring for a job'
    alt: 'Diagram: choosing between a junior and a senior contractor for varied work'
    description: 'A two-column comparison of assigning work to a cheaper or a more capable worker.'
  - id: landscape-implications
    file: assets/landscape-implications.svg
    type: diagram
    title: 'Four consequences of the model market'
    alt: 'Diagram: the cost, lock-in, data and stability implications of choosing a hosted model'
    description: 'A four-stage description of model landscape implications covering price movement, portability, data handling and version stability.'
  - id: landscape-when
    file: assets/landscape-when.svg
    type: diagram
    title: 'When to route between models'
    alt: 'Diagram: when multi-model routing is worthwhile and when a single model suffices'
    description: 'A two-column comparison of multi-model routing against using one model.'
  - id: landscape-history
    file: assets/landscape-history.svg
    type: diagram
    title: 'Four steps to a model market'
    alt: 'Diagram: the historical progression from a single available model to a competitive market'
    description: 'A four-stage description of the model market covering a single provider, competing frontier models, open-weight alternatives and commoditised routing.'
  - id: context-length
    file: assets/context-length.svg
    type: diagram
    title: 'A long context against retrieval'
    alt: 'Diagram: placing documents in a long context compared with retrieving relevant passages'
    description: 'A two-column comparison of long-context prompting against retrieval-based context.'
