questions:
  - question: 'What is the primary architectural differentiator of Google Gemini 1.5 Pro compared to standard frontier models?'
    options:
      - 'It only runs on quantum processors in a lab'
      - 'It does not use transformers'
      - 'A two-million-token multimodal context window'
      - 'It generates images without text'
    answer_index: 2
    explanation: 'Gemini 1.5 Pro features an unprecedented 2M-token context window with native multimodal understanding.'
  - question: 'What is the primary operational advantage of implementing a Multi-Tier Model Router in production AI systems?'
    options:
      - 'Translating all prompts to binary code'
      - 'Increasing GPU temperature'
      - 'Removing all user privacy controls'
      - 'Send easy traffic to cheap models, hard to frontier'
    answer_index: 3
    explanation: 'Model routing directs simple queries to cheap models and hard tasks to frontier models, slashing costs.'
  - question: 'What makes Meta LLaMA-3.1 405B historically significant in the open-weights ecosystem?'
    options:
      - 'The first open-weights model to rival closed flagships'
      - 'It only requires 1 GB of RAM to run'
      - 'It is written in JavaScript'
      - 'It is licensed for non-commercial research use only'
    answer_index: 0
    explanation: 'LLaMA-3.1 405B demonstrated that open-weights foundation models can achieve parity with closed proprietary frontier flagships.'
  - question: 'What is the fundamental difference between Time-To-First-Token (TTFT) and Output Token Generation Rate (tok/s)?'
    options:
      - 'TTFT is measured in miles per hour'
      - 'TTFT is prefill latency; the rate is decoding speed'
      - 'Output Token Generation Rate only applies to image models'
      - 'They are identical metrics'
    answer_index: 1
    explanation: 'TTFT reflects prompt ingestion/prefill speed; tok/s reflects sequential autoregressive generation throughput.'
  - question: 'Why does DeepSeek-V3 utilize a Multi-Head Latent Attention (MLA) and DeepSeekMoE architecture?'
    options:
      - 'To run on ordinary 8-bit CPUs'
      - 'To avoid using CUDA entirely'
      - 'To cut KV-cache and active-parameter cost'
      - 'To replace backpropagation during training'
    answer_index: 2
    explanation: 'DeepSeek-V3 uses MLA to compress KV cache and fine-grained MoE routing to achieve high efficiency.'
