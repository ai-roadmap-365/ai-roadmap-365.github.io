terms:
  - term: 'Model Router'
    definition: 'An automated gateway classifying incoming user queries and dynamically dispatching them to the most cost-effective model tier capable of solving the task.'
  - term: 'Time-To-First-Token (TTFT)'
    definition: 'The latency (in milliseconds) from submitting a prompt until the model outputs its first generated token (reflecting prompt prefill computation).'
  - term: 'Mixture of Experts (MoE)'
    definition: 'An architecture routing each token to a dynamic subset of specialized feed-forward expert layers (e.g. activating 37B out of 671B parameters).'
  - term: 'Multi-Head Latent Attention (MLA)'
    definition: 'An attention mechanism compressing key and value projections into a shared low-rank latent vector to minimize KV-cache VRAM consumption.'
  - term: 'Needle in a Haystack (NIAH)'
    definition: 'An evaluation benchmark testing whether an LLM can accurately retrieve a specific factual statement placed at varying depths within a long context window.'
  - term: 'Blended Cost'
    definition: 'The average cost per 1M tokens achieved by routing a realistic mixture of simple, medium, and hard queries across tiered model APIs.'
  - term: 'Native Multimodal'
    definition: 'An architecture processing text, images, audio, and video directly through a unified token representation rather than external encoder adapters.'
  - term: 'Prompt Caching'
    definition: 'Reusing precomputed KV-cache states for identical prompt prefixes across API calls to reduce latency and slash input token costs by up to 90%.'
