questions:
  - question: 'What does treating Prompts as Code mean in production AI engineering?'
    options:
      - 'Version control, typed inputs, regression tests, SemVer'
      - 'Writing prompts exclusively in C++'
      - 'Hardcoding the prompts inside Python print statements'
      - 'Compiling English text to machine assembly'
    answer_index: 0
    explanation: 'Prompts as Code applies standard software engineering discipline (versioning, CI/CD testing, PR review) to prompt templates.'
  - question: 'What is the difference between Deterministic Assertions and LLM-as-a-Judge Evaluators in prompt testing?'
    options:
      - 'Deterministic assertions only work on integers'
      - 'Assertions check facts; judges grade subjective quality'
      - 'LLM judges are human lawyers who inspect the prompts'
      - 'Deterministic assertions require a GPU cluster'
    answer_index: 1
    explanation: 'Deterministic assertions verify rigid programmatic contracts; LLM judges evaluate nuanced semantic quality.'
  - question: 'What is a Golden Evaluation Dataset in prompt engineering?'
    options:
      - 'A file stored on a gold-plated hard drive'
      - 'A dataset that costs $1,000 to download'
      - 'A curated set of representative and adversarial queries'
      - 'A dataset generated by scraping social media'
    answer_index: 2
    explanation: 'Golden datasets provide consistent, objective benchmarks across prompt revisions and model upgrades.'
  - question: 'What is Prompt Regression in production AI applications?'
    options:
      - 'A database index corruption'
      - 'A statistical linear regression algorithm'
      - 'A bug where the model output is written backwards'
      - 'Fixing one prompt bug quietly breaks another case'
    answer_index: 3
    explanation: 'Prompt regression occurs when prompt edits fix one query but break others; automated CI test suites prevent regressions.'
  - question: 'How does OpenTelemetry / OpenInference observability assist prompt maintenance in production?'
    options:
      - 'Log every call, then promote failures into the suite'
      - 'By turning off GPU cooling fans'
      - 'By encrypting network router packets'
      - 'By translating SQL queries to HTML'
    answer_index: 0
    explanation: 'Observability traces production queries, linking runtime performance directly to specific prompt versions.'
