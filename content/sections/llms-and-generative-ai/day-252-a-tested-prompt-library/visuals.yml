visuals:
  - id: prompt-evaluation-regression-test-harness
    file: assets/prompt-evaluation-regression-test-harness.svg
    type: diagram
    title: 'Prompt Evaluation & Regression Test Harness'
    alt: Prompt evaluation regression test harness architecture diagram showing automated assertions, LLM-as-a-judge scoring, and pass/fail metrics
    description: 'Architecture of an automated prompt evaluation harness executing multi-tier assertions and LLM-as-a-judge rubrics.'
  - id: prompt-lifecycle-versioning-ci-cd-pipeline
    file: assets/prompt-lifecycle-versioning-ci-cd-pipeline.svg
    type: diagram
    title: 'Prompts as Code: The Production Lifecycle'
    alt: Prompt lifecycle CI/CD and production observability pipeline diagram
    description: 'The production prompt engineering lifecycle: Git version control, CI/CD evals, Canary deployment, and OpenTelemetry tracing.'
  - id: prompt-lifecycle
    file: assets/prompt-lifecycle.svg
    type: diagram
    title: 'The prompt lifecycle'
    alt: 'Diagram: the five stages of the prompt release lifecycle'
    description: 'A five-stage description of the prompt lifecycle covering authoring, review, evaluation, staged release and monitoring.'
  - id: golden-tests
    file: assets/golden-tests.svg
    type: diagram
    title: 'The golden test suite'
    alt: 'Diagram: the four properties of a prompt regression test suite'
    description: 'A four-stage description of a golden test suite covering real examples, expected properties, coverage of failures and continuous growth.'
  - id: assertions
    file: assets/assertions.svg
    type: diagram
    title: 'Deterministic assertions against judged ones'
    alt: 'Diagram: deterministic assertions compared with model-graded assertions'
    description: 'A two-column comparison of deterministic checks against model-based grading.'
  - id: tracing
    file: assets/tracing.svg
    type: diagram
    title: 'What a trace must capture'
    alt: 'Diagram: the four elements captured in a model application trace'
    description: 'A four-stage description of tracing covering the rendered prompt, the response, the metadata and the linkage.'
  - id: restaurant
    file: assets/restaurant.svg
    type: diagram
    title: 'A recipe, or a tasted dish'
    alt: 'Diagram: an untested recipe compared with a kitchen that tastes every dish'
    description: 'A two-column comparison of following a recipe without checking against systematic tasting.'
  - id: library-implications
    file: assets/library-implications.svg
    type: diagram
    title: 'Four consequences of testing prompts'
    alt: 'Diagram: the confidence, cost, privacy and maintenance implications of a tested prompt library'
    description: 'A four-stage description of prompt library implications covering release confidence, evaluation cost, sensitive test data and suite maintenance.'
  - id: library-when
    file: assets/library-when.svg
    type: diagram
    title: 'When to build a tested library'
    alt: 'Diagram: when a tested prompt library is warranted'
    description: 'A two-column comparison of situations requiring a tested prompt library against those where it is premature.'
  - id: model-drift
    file: assets/model-drift.svg
    type: diagram
    title: 'Testing a model upgrade'
    alt: 'Diagram: the four steps of validating a model version upgrade'
    description: 'A four-stage description of model upgrade testing covering the announcement, parallel evaluation, differential review and staged cutover.'
  - id: prompts-vs-code
    file: assets/prompts-vs-code.svg
    type: diagram
    title: 'Prompt testing against code testing'
    alt: 'Diagram: testing prompts compared with testing conventional code'
    description: 'A two-column comparison of prompt testing against conventional software testing.'
  - id: canary
    file: assets/canary.svg
    type: diagram
    title: 'Canary release for prompts'
    alt: 'Diagram: how a prompt change is released to a fraction of traffic and rolled back automatically'
    description: 'A four-stage description of canary release covering the split, the monitored signals, the threshold and automatic rollback.'
