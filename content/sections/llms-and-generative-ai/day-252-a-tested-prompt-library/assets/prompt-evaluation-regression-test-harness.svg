<svg role="img" aria-label="Prompt evaluation regression test harness architecture diagram showing automated assertions, LLM-as-a-judge scoring, and pass/fail metrics" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Prompt Evaluation &amp; Regression Test Harness</title>
  <defs>
    <linearGradient id="bg252a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card252" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg252a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PROMPT EVALUATION &amp; REGRESSION TEST HARNESS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Automated Test Execution Across Diverse Datasets with Deterministic and Semantic Assertions</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card252)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Test Dataset -->
    <rect x="25" y="25" width="220" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="135" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Evaluation Dataset</text>
    <rect x="35" y="70" width="200" height="50" fill="#1e293b" rx="4"/>
    <text x="45" y="90" fill="#cbd5e1" font-size="8">Golden Test Cases (100+)</text>
    <text x="45" y="108" fill="#94a3b8" font-size="7">Edge cases, adversarial probes</text>
    
    <rect x="35" y="130" width="200" height="50" fill="#1e293b" rx="4"/>
    <text x="45" y="150" fill="#cbd5e1" font-size="8">Candidate Prompt v2.1</text>
    <text x="45" y="168" fill="#94a3b8" font-size="7">Jinja2 rendered variables</text>
    <text x="135" y="240" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Batch Inference Dispatch</text>

    <!-- Multi-Assertion Suite -->
    <rect x="270" y="25" width="220" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="380" y="50" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. Multi-Tier Assertions</text>
    
    <rect x="280" y="70" width="200" height="50" fill="#1e293b" rx="4"/>
    <text x="290" y="90" fill="#34d399" font-size="8" font-weight="700">Deterministic Checks:</text>
    <text x="290" y="108" fill="#cbd5e1" font-size="7">JSON valid, Preamble = 0</text>

    <rect x="280" y="130" width="200" height="50" fill="#1e293b" rx="4"/>
    <text x="290" y="150" fill="#fb7185" font-size="8" font-weight="700">Safety Assertions:</text>
    <text x="290" y="168" fill="#cbd5e1" font-size="7">Zero Canary / PII leaks</text>

    <rect x="280" y="190" width="200" height="50" fill="#1e293b" rx="4"/>
    <text x="290" y="210" fill="#c084fc" font-size="8" font-weight="700">LLM-as-a-Judge:</text>
    <text x="290" y="228" fill="#cbd5e1" font-size="7">Tone, Accuracy, Conciseness</text>

    <!-- Metrics Dashboard -->
    <rect x="515" y="25" width="220" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="625" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3. Regression Report</text>
    <rect x="525" y="70" width="200" height="190" fill="#1e293b" rx="4"/>
    <text x="535" y="95" fill="#34d399" font-size="9" font-weight="700">Pass Rate: 99.2% (124/125)</text>
    <text x="535" y="120" fill="#cbd5e1" font-size="8">• Schema Compliance: 100%</text>
    <text x="535" y="140" fill="#cbd5e1" font-size="8">• Safety Refusal: 100%</text>
    <text x="535" y="160" fill="#cbd5e1" font-size="8">• Avg Output Tokens: 245</text>
    <text x="535" y="180" fill="#cbd5e1" font-size="8">• Avg Latency: 420ms</text>
    <text x="625" y="235" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">CI/CD Gate: PASSED</text>
  </g>
</svg>
