<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things.">
  <title>What a trace must capture</title>
  <style>
    .tracing-bg   { fill: #f8fafc; }
    .tracing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tracing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tracing-stage { opacity: 1; }

    .tracing-s0 { animation-delay: 0.00s; }
    .tracing-e0 { animation-delay: 0.00s; }
    .tracing-s1 { animation-delay: 1.28s; }
    .tracing-e1 { animation-delay: 1.28s; }
    .tracing-s2 { animation-delay: 2.56s; }
    .tracing-e2 { animation-delay: 2.56s; }
    .tracing-s3 { animation-delay: 3.84s; }
    .tracing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tracing-conn  { animation: tracing-trace 6.4s ease-in-out infinite; }
      .tracing-stage { animation: tracing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tracing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tracing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tracing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tracing-stage { animation: tracing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tracing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tracing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tracing-bg" width="980" height="322"/>
  <text class="tracing-h1"  x="30" y="40">What a trace must capture</text>
  <text class="tracing-sub" x="30" y="64">Four things.</text>
  <g class="tracing-stage tracing-s0">
    <rect class="tracing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tracing-step" x="44" y="142">01</text>
    <text class="tracing-name" x="70" y="142">The fully rendered prompt</text>
    <text class="tracing-desc" x="44" y="166">After templating. Not the</text>
    <text class="tracing-desc" x="44" y="182">template.</text>
  </g>
  <line class="tracing-line tracing-conn tracing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tracing-tip)"/>
  <g class="tracing-stage tracing-s1">
    <rect class="tracing-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tracing-step" x="280" y="142">02</text>
    <text class="tracing-name" x="306" y="142">The complete response</text>
    <text class="tracing-desc" x="280" y="166">Including the stop reason and</text>
    <text class="tracing-desc" x="280" y="182">any refusal.</text>
  </g>
  <line class="tracing-line tracing-conn tracing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tracing-tip)"/>
  <g class="tracing-stage tracing-s2">
    <rect class="tracing-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tracing-step" x="516" y="142">03</text>
    <text class="tracing-name" x="542" y="142">Model, version, parameters, tokens and latency</text>
    <text class="tracing-desc" x="516" y="166">Everything needed to reproduce</text>
    <text class="tracing-desc" x="516" y="182">the call.</text>
  </g>
  <line class="tracing-line tracing-conn tracing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tracing-tip)"/>
  <g class="tracing-stage tracing-s3">
    <rect class="tracing-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tracing-step" x="752" y="142">04</text>
    <text class="tracing-name" x="778" y="142">And a link to the user request that caused it</text>
    <text class="tracing-desc" x="752" y="166">So a complaint can be traced to</text>
    <text class="tracing-desc" x="752" y="182">its call.</text>
  </g>
  <text class="tracing-sub" x="30" y="304">Capturing the rendered prompt rather than the template is the detail that decides whether a trace is useful: a template plus missing variables cannot be replayed.</text>
</svg>
