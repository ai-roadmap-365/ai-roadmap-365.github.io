<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Canary release for prompts</title>
  <style>
    .canary-bg   { fill: #f8fafc; }
    .canary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .canary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .canary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .canary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .canary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .canary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .canary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .canary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .canary-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .canary-stage { opacity: 1; }

    .canary-s0 { animation-delay: 0.00s; }
    .canary-e0 { animation-delay: 0.00s; }
    .canary-s1 { animation-delay: 1.28s; }
    .canary-e1 { animation-delay: 1.28s; }
    .canary-s2 { animation-delay: 2.56s; }
    .canary-e2 { animation-delay: 2.56s; }
    .canary-s3 { animation-delay: 3.84s; }
    .canary-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .canary-conn  { animation: canary-trace 6.4s ease-in-out infinite; }
      .canary-stage { animation: canary-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes canary-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes canary-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .canary-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .canary-stage { animation: canary-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes canary-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="canary-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="canary-bg" width="980" height="322"/>
  <text class="canary-h1"  x="30" y="40">Canary release for prompts</text>
  <text class="canary-sub" x="30" y="64">Four steps.</text>
  <g class="canary-stage canary-s0">
    <rect class="canary-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="canary-step" x="44" y="142">01</text>
    <text class="canary-name" x="70" y="142">Send a small fraction of traffic to the new version</text>
    <text class="canary-desc" x="44" y="166">Consistently per user, so nobody</text>
    <text class="canary-desc" x="44" y="182">sees it flicker.</text>
  </g>
  <line class="canary-line canary-conn canary-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#canary-tip)"/>
  <g class="canary-stage canary-s1">
    <rect class="canary-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="canary-step" x="280" y="142">02</text>
    <text class="canary-name" x="306" y="142">Watch quality, cost and latency together</text>
    <text class="canary-desc" x="280" y="166">A change can improve one and</text>
    <text class="canary-desc" x="280" y="182">ruin another.</text>
  </g>
  <line class="canary-line canary-conn canary-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#canary-tip)"/>
  <g class="canary-stage canary-s2">
    <rect class="canary-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="canary-step" x="516" y="142">03</text>
    <text class="canary-name" x="542" y="142">Set the rollback threshold in advance</text>
    <text class="canary-desc" x="516" y="166">Before anyone is invested in the</text>
    <text class="canary-desc" x="516" y="182">change succeeding.</text>
  </g>
  <line class="canary-line canary-conn canary-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#canary-tip)"/>
  <g class="canary-stage canary-s3">
    <rect class="canary-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="canary-step" x="752" y="142">04</text>
    <text class="canary-name" x="778" y="142">And roll back automatically when it trips</text>
    <text class="canary-desc" x="752" y="166">Rather than waiting for a</text>
    <text class="canary-desc" x="752" y="182">judgment call.</text>
  </g>
  <text class="canary-sub" x="30" y="304">Choosing the threshold in advance is what makes this work: a threshold negotiated after a release is underway is a threshold that will be argued down.</text>
</svg>
