terms:
  - term: 'Tested Prompt Library'
    definition: 'A centralized, version-controlled collection of prompt templates verified against automated test suites.'
  - term: 'Prompts as Code'
    definition: 'Managing prompt assets with software engineering best practices including Git versioning, CI/CD testing, and SemVer.'
  - term: 'LLM-as-a-Judge'
    definition: 'Using a capable foundation model to evaluate and score the output of another model against a predefined rubric.'
  - term: 'Golden Dataset'
    definition: 'A curated benchmark suite of test queries and ground-truth expected outputs used for regression testing.'
  - term: 'Prompt Regression'
    definition: 'An unintended loss of accuracy, formatting, or safety in existing capabilities caused by modifying a prompt.'
  - term: 'Deterministic Assertion'
    definition: 'A programmatic rule (e.g. valid JSON, substring presence, length check) that evaluates to a strict boolean pass/fail.'
  - term: 'Prompt Traceability'
    definition: 'The ability to link a production LLM response to the exact Git commit, template hash, and parameters that produced it.'
  - term: 'Canary Deployment (Prompts)'
    definition: 'Gradually rolling out a new prompt version to a small percentage of user traffic to monitor error rates before full release.'
