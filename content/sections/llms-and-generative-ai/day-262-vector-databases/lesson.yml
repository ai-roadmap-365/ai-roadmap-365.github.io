title: 'Vector Databases'
section: llms-and-generative-ai
subsection: retrieval-and-customization
week: 38
learning_promise: 'Master Approximate Nearest Neighbor (ANN) indexing structures and modern vector database architectures: understand Hierarchical Navigable Small World (HNSW) graphs, Inverted File Index with Product Quantization (IVF-PQ), Locality-Sensitive Hashing (LSH), evaluate purpose-built engines (Qdrant, Chroma, Milvus, Pinecone, pgvector), analyze recall vs. QPS trade-offs, and build an in-memory graph-based ANN vector index in Python.'
objectives:
  - 'Explain the architectural mechanics of HNSW multi-layer skip-graphs and IVF-PQ clustering.'
  - 'Compare purpose-built vector databases (Qdrant, Milvus, Pinecone) with relational extensions (pgvector).'
  - 'Tune HNSW hyperparameters: M (max connections), ef_construction (build budget), and ef_search (query accuracy).'
  - 'Evaluate the trade-off between search recall (accuracy) and queries-per-second (QPS).'
  - 'Build a functional in-memory Navigable Small World (NSW) graph index in Python.'
