terms:
  - term: 'Approximate Nearest Neighbors (ANN)'
    definition: 'A class of search algorithms that sacrifice 100% exactness to achieve logarithmic O(log N) retrieval speeds.'
  - term: 'HNSW (Hierarchical Navigable Small World)'
    definition: 'A state-of-the-art graph-based ANN algorithm featuring multi-layer skip-graph navigation.'
  - term: 'IVF (Inverted File Index)'
    definition: 'A space-partitioning index that assigns vectors to Voronoi cell clusters and searches only the nearest centroids.'
  - term: 'Product Quantization (PQ)'
    definition: 'A vector compression technique splitting vectors into sub-vectors and indexing them against centroid codebooks.'
  - term: 'efSearch'
    definition: 'An HNSW runtime parameter governing the size of the priority queue during search; higher values increase recall at higher latency.'
  - term: 'nprobe'
    definition: 'An IVF parameter determining how many Voronoi cell clusters to scan during a search query.'
  - term: 'Payload / Metadata Filtering'
    definition: 'Filtering vector search candidates using structured relational criteria (e.g. user_id, date, tag).'
  - term: 'pgvector'
    definition: 'An open-source PostgreSQL extension adding native vector types, exact distance operators, and HNSW/IVFFlat indexes.'
