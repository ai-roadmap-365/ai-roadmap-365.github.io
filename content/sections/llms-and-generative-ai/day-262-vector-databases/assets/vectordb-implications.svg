<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are operational.">
  <title>Four consequences of a vector store</title>
  <style>
    .vectordb-implications-bg   { fill: #f8fafc; }
    .vectordb-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vectordb-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vectordb-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vectordb-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vectordb-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vectordb-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vectordb-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vectordb-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vectordb-implications-stage { opacity: 1; }

    .vectordb-implications-s0 { animation-delay: 0.00s; }
    .vectordb-implications-e0 { animation-delay: 0.00s; }
    .vectordb-implications-s1 { animation-delay: 1.28s; }
    .vectordb-implications-e1 { animation-delay: 1.28s; }
    .vectordb-implications-s2 { animation-delay: 2.56s; }
    .vectordb-implications-e2 { animation-delay: 2.56s; }
    .vectordb-implications-s3 { animation-delay: 3.84s; }
    .vectordb-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vectordb-implications-conn  { animation: vectordb-implications-trace 6.4s ease-in-out infinite; }
      .vectordb-implications-stage { animation: vectordb-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vectordb-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vectordb-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vectordb-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vectordb-implications-stage { animation: vectordb-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vectordb-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vectordb-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vectordb-implications-bg" width="980" height="322"/>
  <text class="vectordb-implications-h1"  x="30" y="40">Four consequences of a vector store</text>
  <text class="vectordb-implications-sub" x="30" y="64">Two are operational.</text>
  <g class="vectordb-implications-stage vectordb-implications-s0">
    <rect class="vectordb-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vectordb-implications-step" x="44" y="142">01</text>
    <text class="vectordb-implications-name" x="70" y="142">Indexes are memory-hungry</text>
    <text class="vectordb-implications-desc" x="44" y="166">Often larger than the vectors</text>
    <text class="vectordb-implications-desc" x="44" y="182">themselves.</text>
  </g>
  <line class="vectordb-implications-line vectordb-implications-conn vectordb-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vectordb-implications-tip)"/>
  <g class="vectordb-implications-stage vectordb-implications-s1">
    <rect class="vectordb-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vectordb-implications-step" x="280" y="142">02</text>
    <text class="vectordb-implications-name" x="306" y="142">And recall must be measured, not assumed</text>
    <text class="vectordb-implications-desc" x="280" y="166">Default settings are a starting</text>
    <text class="vectordb-implications-desc" x="280" y="182">point, not an answer.</text>
  </g>
  <line class="vectordb-implications-line vectordb-implications-conn vectordb-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vectordb-implications-tip)"/>
  <g class="vectordb-implications-stage vectordb-implications-s2">
    <rect class="vectordb-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vectordb-implications-step" x="516" y="142">03</text>
    <text class="vectordb-implications-name" x="542" y="142">Access control has to be enforced in the filter</text>
    <text class="vectordb-implications-desc" x="516" y="166">Or one tenant retrieves</text>
    <text class="vectordb-implications-desc" x="516" y="182">another's documents.</text>
  </g>
  <line class="vectordb-implications-line vectordb-implications-conn vectordb-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vectordb-implications-tip)"/>
  <g class="vectordb-implications-stage vectordb-implications-s3">
    <rect class="vectordb-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vectordb-implications-step" x="752" y="142">04</text>
    <text class="vectordb-implications-name" x="778" y="142">And the index drifts as the corpus changes</text>
    <text class="vectordb-implications-desc" x="752" y="166">Needing periodic rebuilds.</text>
  </g>
  <text class="vectordb-implications-sub" x="30" y="304">Enforcing permissions in the retrieval filter is a security requirement rather than a feature: a vector store with no tenant filter is a cross-tenant data leak waiting to be found.</text>
</svg>
