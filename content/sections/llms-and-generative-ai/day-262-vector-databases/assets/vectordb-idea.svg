<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things beyond search.">
  <title>What a vector database adds</title>
  <style>
    .vectordb-idea-bg   { fill: #f8fafc; }
    .vectordb-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vectordb-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vectordb-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vectordb-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vectordb-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vectordb-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vectordb-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vectordb-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vectordb-idea-stage { opacity: 1; }

    .vectordb-idea-s0 { animation-delay: 0.00s; }
    .vectordb-idea-e0 { animation-delay: 0.00s; }
    .vectordb-idea-s1 { animation-delay: 1.28s; }
    .vectordb-idea-e1 { animation-delay: 1.28s; }
    .vectordb-idea-s2 { animation-delay: 2.56s; }
    .vectordb-idea-e2 { animation-delay: 2.56s; }
    .vectordb-idea-s3 { animation-delay: 3.84s; }
    .vectordb-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vectordb-idea-conn  { animation: vectordb-idea-trace 6.4s ease-in-out infinite; }
      .vectordb-idea-stage { animation: vectordb-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vectordb-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vectordb-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vectordb-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vectordb-idea-stage { animation: vectordb-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vectordb-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vectordb-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vectordb-idea-bg" width="980" height="322"/>
  <text class="vectordb-idea-h1"  x="30" y="40">What a vector database adds</text>
  <text class="vectordb-idea-sub" x="30" y="64">Four things beyond search.</text>
  <g class="vectordb-idea-stage vectordb-idea-s0">
    <rect class="vectordb-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vectordb-idea-step" x="44" y="142">01</text>
    <text class="vectordb-idea-name" x="70" y="142">An approximate index</text>
    <text class="vectordb-idea-desc" x="44" y="166">So search does not scale with</text>
    <text class="vectordb-idea-desc" x="44" y="182">the corpus.</text>
  </g>
  <line class="vectordb-idea-line vectordb-idea-conn vectordb-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vectordb-idea-tip)"/>
  <g class="vectordb-idea-stage vectordb-idea-s1">
    <rect class="vectordb-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vectordb-idea-step" x="280" y="142">02</text>
    <text class="vectordb-idea-name" x="306" y="142">Metadata filtering alongside the vectors</text>
    <text class="vectordb-idea-desc" x="280" y="166">Date, source, tenant,</text>
    <text class="vectordb-idea-desc" x="280" y="182">permissions.</text>
  </g>
  <line class="vectordb-idea-line vectordb-idea-conn vectordb-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vectordb-idea-tip)"/>
  <g class="vectordb-idea-stage vectordb-idea-s2">
    <rect class="vectordb-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vectordb-idea-step" x="516" y="142">03</text>
    <text class="vectordb-idea-name" x="542" y="142">Persistence and durable updates</text>
    <text class="vectordb-idea-desc" x="516" y="166">Insert, update and delete</text>
    <text class="vectordb-idea-desc" x="516" y="182">without a rebuild.</text>
  </g>
  <line class="vectordb-idea-line vectordb-idea-conn vectordb-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vectordb-idea-tip)"/>
  <g class="vectordb-idea-stage vectordb-idea-s3">
    <rect class="vectordb-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vectordb-idea-step" x="752" y="142">04</text>
    <text class="vectordb-idea-name" x="778" y="142">And operational features</text>
    <text class="vectordb-idea-desc" x="752" y="166">Replication, sharding, backups,</text>
    <text class="vectordb-idea-desc" x="752" y="182">access control.</text>
    <text class="vectordb-idea-edge" x="752" y="242">a database</text>
  </g>
  <text class="vectordb-idea-sub" x="30" y="304">The operational column is what actually justifies a database rather than a library: the search itself is the part a few hundred lines of code can already do.</text>
</svg>
