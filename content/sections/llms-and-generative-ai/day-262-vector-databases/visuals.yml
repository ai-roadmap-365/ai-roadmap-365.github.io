visuals:
  - id: hnsw-graph-layered-navigation-architecture
    file: assets/hnsw-graph-layered-navigation-architecture.svg
    type: diagram
    title: 'HNSW Graph Layered Navigation Architecture'
    alt: HNSW graph layered navigation architecture diagram
    description: 'Hierarchical multi-layer graph skip-list architecture used by vector databases for logarithmic nearest neighbor search.'
  - id: ivf-pq-vector-quantization-clustering
    file: assets/ivf-pq-vector-quantization-clustering.svg
    type: diagram
    title: 'IVF-PQ Inverted File & Product Quantization'
    alt: IVF-PQ vector quantization clustering diagram
    description: 'Inverted file Voronoi cell space partitioning combined with sub-vector product quantization byte compression.'
  - id: vectordb-idea
    file: assets/vectordb-idea.svg
    type: diagram
    title: 'What a vector database adds'
    alt: 'Diagram: the four capabilities a vector database provides beyond raw similarity search'
    description: 'A four-stage description of vector database capabilities covering indexing, filtering, persistence and operations.'
  - id: hnsw
    file: assets/hnsw.svg
    type: diagram
    title: 'How graph indexes work'
    alt: 'Diagram: how a layered proximity graph finds nearest neighbours without scanning everything'
    description: 'A four-stage description of graph-based indexing covering the graph, the layers, the greedy descent and the recall trade.'
  - id: dedicated-pgvector
    file: assets/dedicated-pgvector.svg
    type: diagram
    title: 'A dedicated store, or your existing database'
    alt: 'Diagram: a dedicated vector database compared with a vector extension to an existing database'
    description: 'A two-column comparison of a specialised vector database against an extension to a relational database.'
  - id: filtering
    file: assets/filtering.svg
    type: diagram
    title: 'Filtering with an approximate index'
    alt: 'Diagram: how metadata filtering interacts with approximate nearest neighbour search'
    description: 'A four-stage description of filtered search covering post-filtering, its failure, pre-filtering and integrated filtering.'
  - id: deletion
    file: assets/deletion.svg
    type: diagram
    title: 'Deleting from an index'
    alt: 'Diagram: how deletions are handled in an approximate nearest neighbour index'
    description: 'A four-stage description of index deletion covering the graph dependency, marking, degradation and rebuilding.'
  - id: library-shelving
    file: assets/library-shelving.svg
    type: diagram
    title: 'A card index, or organised shelves'
    alt: 'Diagram: searching every shelf compared with using an organised catalogue'
    description: 'A two-column comparison of exhaustive searching against an organised index.'
  - id: vectordb-implications
    file: assets/vectordb-implications.svg
    type: diagram
    title: 'Four consequences of a vector store'
    alt: 'Diagram: the cost, tuning, access-control and drift implications of a vector database'
    description: 'A four-stage description of vector database implications covering memory cost, tuning burden, access control and index drift.'
  - id: vectordb-when
    file: assets/vectordb-when.svg
    type: diagram
    title: 'When you need a vector database'
    alt: 'Diagram: when a dedicated vector database is warranted'
    description: 'A two-column comparison of situations requiring a vector database against simpler alternatives.'
  - id: vectordb-history
    file: assets/vectordb-history.svg
    type: diagram
    title: 'Four steps to vector infrastructure'
    alt: 'Diagram: the historical progression of vector search infrastructure'
    description: 'A four-stage description of vector database history covering research libraries, dedicated services, relational extensions and commodity infrastructure.'
  - id: recall-qps
    file: assets/recall-qps.svg
    type: diagram
    title: 'Recall against throughput'
    alt: 'Diagram: high-recall index settings compared with high-throughput settings'
    description: 'A two-column comparison of index tuning for recall against tuning for throughput.'
