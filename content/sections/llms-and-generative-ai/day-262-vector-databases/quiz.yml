questions:
  - question: 'What is the primary operational trade-off of Approximate Nearest Neighbor (ANN) indexes like HNSW compared to exact Flat k-NN?'
    options:
      - 'HNSW delivers 10x-100x faster sub-linear query latency at the expense of a minor 1-3% recall loss and additional index memory overhead'
      - 'HNSW produces random incorrect results'
      - 'HNSW requires converting text into video files'
      - 'HNSW only works on quantum computers'
    answer_index: 0
    explanation: 'ANN trades a small percentage of recall accuracy for massive orders-of-magnitude query speedups.'
  - question: 'In the HNSW algorithm, what role do the upper sparse layers (e.g. Layer 2) serve?'
    options:
      - 'They act as express highways, enabling long-range geometric jumps across the vector space to zoom in on the correct cluster in O(log N) steps'
      - 'They store compressed audio files'
      - 'They delete older documents'
      - 'They encrypt user passwords'
    answer_index: 0
    explanation: 'Upper layers provide sparse skip-list connectivity for rapid logarithmic space traversal.'
  - question: 'What do the HNSW hyperparameters "M" and "efSearch" control?'
    options:
      - 'M controls the maximum number of bidirectional neighbor links per node, while efSearch controls the size of the dynamic candidate list evaluated during query execution'
      - 'M controls database password length, and efSearch controls port numbers'
      - 'M is the number of CPU cores, and efSearch is the RAM allocation'
      - 'They are legacy parameters with zero effect'
    answer_index: 0
    explanation: 'M governs graph connectivity and RAM usage; efSearch balances query latency versus recall accuracy.'
  - question: 'How does Product Quantization (PQ) achieve up to 64x memory reduction on dense vectors?'
    options:
      - 'By splitting high-dimensional vectors into m sub-vectors and mapping each sub-vector to the index of its nearest pre-computed centroid codebook byte (0-255)'
      - 'By deleting the last 50% of document text'
      - 'By converting floating-point vectors into ASCII characters'
      - 'By storing embeddings in Google Drive'
    answer_index: 0
    explanation: 'PQ replaces multi-byte floating point arrays with compact 1-byte centroid cluster indices.'
  - question: 'When is using PostgreSQL with the `pgvector` extension preferred over a standalone vector database like Pinecone or Qdrant?'
    options:
      - 'When your application already relies on PostgreSQL and requires ACID transactions, relational joins, and unified metadata filtering alongside vector search without managing separate infrastructure'
      - 'When you want to search billions of vectors across 100 GPU clusters'
      - 'When PostgreSQL is disabled'
      - 'Never; pgvector cannot store numbers'
    answer_index: 0
    explanation: 'pgvector simplifies infrastructure by keeping relational entities and embeddings within a single ACID database.'
