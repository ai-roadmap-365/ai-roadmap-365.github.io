learning_promise: 'Master the legal, ethical, and technical compliance engineering of generative AI: implement
  C2PA provenance manifest signing and verification, build perceptual hashing (pHash) copyright deduplication,
  analyze fair use legal tests, and build an automated IP risk audit engine in Python.'
objectives:
- 'Analyze the legal landscape of Generative AI copyright: training ingestion fair use vs commercial output
  infringement.'
- 'Deconstruct the C2PA technical specification: JSON-LD assertions, SHA-256 bindings, and cryptographic
  signing.'
- Implement Perceptual Hashing (pHash) with Hamming distance matching to detect near-duplicate memorized
  media.
- Construct an automated IP Risk Evaluator calculating memorization likelihood and trademark similarity
  in Python.
- 'Evaluate watermarking techniques: imperceptible latent perturbation (SynthID) vs metadata signing.'
