<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Driven by harm.">
  <title>Four steps toward content provenance</title>
  <style>
    .provenance-history-bg   { fill: #f8fafc; }
    .provenance-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .provenance-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .provenance-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .provenance-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .provenance-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .provenance-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .provenance-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .provenance-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .provenance-history-stage { opacity: 1; }

    .provenance-history-s0 { animation-delay: 0.00s; }
    .provenance-history-e0 { animation-delay: 0.00s; }
    .provenance-history-s1 { animation-delay: 1.28s; }
    .provenance-history-e1 { animation-delay: 1.28s; }
    .provenance-history-s2 { animation-delay: 2.56s; }
    .provenance-history-e2 { animation-delay: 2.56s; }
    .provenance-history-s3 { animation-delay: 3.84s; }
    .provenance-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .provenance-history-conn  { animation: provenance-history-trace 6.4s ease-in-out infinite; }
      .provenance-history-stage { animation: provenance-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes provenance-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes provenance-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .provenance-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .provenance-history-stage { animation: provenance-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes provenance-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="provenance-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="provenance-history-bg" width="980" height="322"/>
  <text class="provenance-history-h1"  x="30" y="40">Four steps toward content provenance</text>
  <text class="provenance-history-sub" x="30" y="64">Driven by harm.</text>
  <g class="provenance-history-stage provenance-history-s0">
    <rect class="provenance-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-history-step" x="44" y="142">01</text>
    <text class="provenance-history-name" x="70" y="142">A photograph was treated as evidence</text>
    <text class="provenance-history-desc" x="44" y="166">Manipulation was expensive and</text>
    <text class="provenance-history-desc" x="44" y="182">rare.</text>
  </g>
  <line class="provenance-history-line provenance-history-conn provenance-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#provenance-history-tip)"/>
  <g class="provenance-history-stage provenance-history-s1">
    <rect class="provenance-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-history-step" x="280" y="142">02</text>
    <text class="provenance-history-name" x="306" y="142">Then editing became easy, and generation became cheap</text>
    <text class="provenance-history-desc" x="280" y="166">Which removed that assumption</text>
    <text class="provenance-history-desc" x="280" y="182">entirely.</text>
  </g>
  <line class="provenance-history-line provenance-history-conn provenance-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#provenance-history-tip)"/>
  <g class="provenance-history-stage provenance-history-s2">
    <rect class="provenance-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-history-step" x="516" y="142">03</text>
    <text class="provenance-history-name" x="542" y="142">Industry standards for signed manifests emerged</text>
    <text class="provenance-history-desc" x="516" y="166">Voluntary, and adopted unevenly.</text>
  </g>
  <line class="provenance-history-line provenance-history-conn provenance-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#provenance-history-tip)"/>
  <g class="provenance-history-stage provenance-history-s3">
    <rect class="provenance-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-history-step" x="752" y="142">04</text>
    <text class="provenance-history-name" x="778" y="142">And disclosure became a legal requirement</text>
    <text class="provenance-history-desc" x="752" y="166">Which is what moved adoption.</text>
  </g>
  <text class="provenance-history-sub" x="30" y="304">Voluntary adoption moved slowly and regulation moved it quickly, which is a fair summary of how most safety-adjacent standards in this field have progressed.</text>
</svg>
