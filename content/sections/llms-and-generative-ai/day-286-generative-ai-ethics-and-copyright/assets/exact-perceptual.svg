<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Opposite goals.">
  <title>Cryptographic against perceptual hashing</title>
  <style>
    .exact-perceptual-bg   { fill: #f8fafc; }
    .exact-perceptual-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-perceptual-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-perceptual-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-perceptual-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-perceptual-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-perceptual-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-perceptual-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exact-perceptual-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exact-perceptual-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exact-perceptual-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exact-perceptual-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exact-perceptual-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-perceptual-row { opacity: 1; }
    .exact-perceptual-r0 { animation-delay: 0.00s; }
    .exact-perceptual-r1 { animation-delay: 0.45s; }
    .exact-perceptual-r2 { animation-delay: 0.90s; }
    .exact-perceptual-r3 { animation-delay: 1.35s; }
    .exact-perceptual-r4 { animation-delay: 1.80s; }
    .exact-perceptual-row { animation: exact-perceptual-reveal 7.3s ease-in-out infinite; }
    @keyframes exact-perceptual-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exact-perceptual-bg" width="980" height="390"/>
  <text class="exact-perceptual-h1"  x="30" y="40">Cryptographic against perceptual hashing</text>
  <text class="exact-perceptual-sub" x="30" y="64">Opposite goals.</text>
  <rect class="exact-perceptual-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exact-perceptual-name" x="46" y="122">Cryptographic</text>
  <text class="exact-perceptual-desc" x="46" y="142">Any change is total.</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r0" x="46" y="182">One bit changes the whole hash</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r1" x="46" y="216">Detects exact copies only</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r2" x="46" y="250">A resize defeats it entirely</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r3" x="46" y="284">Used for integrity</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r4" x="46" y="318">Cannot measure similarity</text>
  <rect class="exact-perceptual-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exact-perceptual-name" x="526" y="122">Perceptual</text>
  <text class="exact-perceptual-desc" x="526" y="142">Similar stays similar.</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r0" x="526" y="182">Small changes barely alter it</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r1" x="526" y="216">Detects crops, rescales, recompressions</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r2" x="526" y="250">Survives ordinary handling</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r3" x="526" y="284">Used for matching</text>
  <text class="exact-perceptual-desc exact-perceptual-row exact-perceptual-r4" x="526" y="318">Distance is meaningful</text>
  <text class="exact-perceptual-sub" x="30" y="372">They are used together rather than in competition: the cryptographic hash binds a manifest, and the perceptual hash finds the content again after it has been edited.</text>
</svg>
