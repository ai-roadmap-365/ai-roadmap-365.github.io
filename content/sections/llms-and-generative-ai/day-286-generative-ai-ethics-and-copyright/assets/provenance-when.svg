<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when disclosure suffices.">
  <title>When provenance is required</title>
  <style>
    .provenance-when-bg   { fill: #f8fafc; }
    .provenance-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .provenance-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .provenance-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .provenance-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .provenance-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .provenance-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .provenance-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .provenance-when-row { opacity: 1; }
    .provenance-when-r0 { animation-delay: 0.00s; }
    .provenance-when-r1 { animation-delay: 0.45s; }
    .provenance-when-r2 { animation-delay: 0.90s; }
    .provenance-when-r3 { animation-delay: 1.35s; }
    .provenance-when-r4 { animation-delay: 1.80s; }
    .provenance-when-row { animation: provenance-when-reveal 7.3s ease-in-out infinite; }
    @keyframes provenance-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="provenance-when-bg" width="980" height="390"/>
  <text class="provenance-when-h1"  x="30" y="40">When provenance is required</text>
  <text class="provenance-when-sub" x="30" y="64">And when disclosure suffices.</text>
  <rect class="provenance-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="provenance-when-name" x="46" y="122">Full provenance</text>
  <text class="provenance-when-desc" x="46" y="142">Four cases.</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r0" x="46" y="182">Anything published externally</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r1" x="46" y="216">News, journalism and documentation</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r2" x="46" y="250">Regulated markets</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r3" x="46" y="284">Where authenticity may be challenged</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r4" x="46" y="318">Any depiction of real people or events</text>
  <rect class="provenance-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="provenance-when-name" x="526" y="122">Disclosure alone</text>
  <text class="provenance-when-desc" x="526" y="142">Also four.</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r0" x="526" y="182">Internal drafts and exploration</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r1" x="526" y="216">Prototypes never published</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r2" x="526" y="250">Where the audience already knows</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r3" x="526" y="284">Content discarded after use</text>
  <text class="provenance-when-desc provenance-when-row provenance-when-r4" x="526" y="318">But say plainly that it is generated</text>
  <text class="provenance-when-sub" x="30" y="372">The floor in every case is telling the reader, because the harm from unlabelled synthetic content does not depend on how carefully it was produced.</text>
</svg>
