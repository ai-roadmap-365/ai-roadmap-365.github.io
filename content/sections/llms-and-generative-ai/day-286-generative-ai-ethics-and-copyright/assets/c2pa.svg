<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Signed provenance</title>
  <style>
    .c2pa-bg   { fill: #f8fafc; }
    .c2pa-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c2pa-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c2pa-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c2pa-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c2pa-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c2pa-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .c2pa-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .c2pa-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .c2pa-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .c2pa-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .c2pa-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .c2pa-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .c2pa-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .c2pa-stage { opacity: 1; }

    .c2pa-s0 { animation-delay: 0.00s; }
    .c2pa-e0 { animation-delay: 0.00s; }
    .c2pa-s1 { animation-delay: 1.28s; }
    .c2pa-e1 { animation-delay: 1.28s; }
    .c2pa-s2 { animation-delay: 2.56s; }
    .c2pa-e2 { animation-delay: 2.56s; }
    .c2pa-s3 { animation-delay: 3.84s; }
    .c2pa-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .c2pa-conn  { animation: c2pa-trace 6.4s ease-in-out infinite; }
      .c2pa-stage { animation: c2pa-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes c2pa-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes c2pa-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .c2pa-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .c2pa-stage { animation: c2pa-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes c2pa-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="c2pa-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="c2pa-bg" width="980" height="322"/>
  <text class="c2pa-h1"  x="30" y="40">Signed provenance</text>
  <text class="c2pa-sub" x="30" y="64">Four steps.</text>
  <g class="c2pa-stage c2pa-s0">
    <rect class="c2pa-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="c2pa-step" x="44" y="142">01</text>
    <text class="c2pa-name" x="70" y="142">Record assertions about the content</text>
    <text class="c2pa-desc" x="44" y="166">Tool, model, whether generated,</text>
    <text class="c2pa-desc" x="44" y="182">what was edited.</text>
  </g>
  <line class="c2pa-line c2pa-conn c2pa-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#c2pa-tip)"/>
  <g class="c2pa-stage c2pa-s1">
    <rect class="c2pa-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="c2pa-step" x="280" y="142">02</text>
    <text class="c2pa-name" x="306" y="142">Hash the content itself</text>
    <text class="c2pa-desc" x="280" y="166">So the manifest is bound to this</text>
    <text class="c2pa-desc" x="280" y="182">exact file.</text>
  </g>
  <line class="c2pa-line c2pa-conn c2pa-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#c2pa-tip)"/>
  <g class="c2pa-stage c2pa-s2">
    <rect class="c2pa-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="c2pa-step" x="516" y="142">03</text>
    <text class="c2pa-name" x="542" y="142">Sign the whole thing</text>
    <text class="c2pa-desc" x="516" y="166">With a certificate that</text>
    <text class="c2pa-desc" x="516" y="182">identifies the producer.</text>
  </g>
  <line class="c2pa-line c2pa-conn c2pa-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#c2pa-tip)"/>
  <g class="c2pa-stage c2pa-s3">
    <rect class="c2pa-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="c2pa-step" x="752" y="142">04</text>
    <text class="c2pa-name" x="778" y="142">So any alteration invalidates the signature</text>
    <text class="c2pa-desc" x="752" y="166">Which is what makes the claim</text>
    <text class="c2pa-desc" x="752" y="182">trustworthy.</text>
  </g>
  <text class="c2pa-sub" x="30" y="304">Binding to a content hash is what stops a manifest being copied onto a different file, and it is why the signature has to cover the content rather than only the metadata.</text>
</svg>
