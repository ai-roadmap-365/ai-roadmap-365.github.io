<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Signed at every step.">
  <title>A chain of custody</title>
  <style>
    .chain-of-custody-bg   { fill: #f8fafc; }
    .chain-of-custody-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-of-custody-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-of-custody-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-of-custody-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-of-custody-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-of-custody-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-of-custody-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chain-of-custody-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chain-of-custody-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chain-of-custody-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chain-of-custody-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chain-of-custody-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-of-custody-row { opacity: 1; }
    .chain-of-custody-r0 { animation-delay: 0.00s; }
    .chain-of-custody-r1 { animation-delay: 0.45s; }
    .chain-of-custody-r2 { animation-delay: 0.90s; }
    .chain-of-custody-r3 { animation-delay: 1.35s; }
    .chain-of-custody-r4 { animation-delay: 1.80s; }
    .chain-of-custody-row { animation: chain-of-custody-reveal 7.3s ease-in-out infinite; }
    @keyframes chain-of-custody-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chain-of-custody-bg" width="980" height="390"/>
  <text class="chain-of-custody-h1"  x="30" y="40">A chain of custody</text>
  <text class="chain-of-custody-sub" x="30" y="64">Signed at every step.</text>
  <rect class="chain-of-custody-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chain-of-custody-name" x="46" y="122">Undocumented</text>
  <text class="chain-of-custody-desc" x="46" y="142">Assertion only.</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r0" x="46" y="182">Someone says where it came from</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r1" x="46" y="216">No record of who handled it</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r2" x="46" y="250">Alterations invisible</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r3" x="46" y="284">Impossible to challenge or confirm</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r4" x="46" y="318">This is unmarked content</text>
  <rect class="chain-of-custody-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chain-of-custody-name" x="526" y="122">Documented</text>
  <text class="chain-of-custody-desc" x="526" y="142">Verifiable.</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r0" x="526" y="182">Each step recorded and signed</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r1" x="526" y="216">Every handler identified</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r2" x="526" y="250">Alterations break the chain</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r3" x="526" y="284">Anyone can verify it</text>
  <text class="chain-of-custody-desc chain-of-custody-row chain-of-custody-r4" x="526" y="318">This is signed provenance</text>
  <text class="chain-of-custody-sub" x="30" y="372">Evidence handling solved this problem long ago and for the same reason: an origin claim nobody can check is worth very little when it matters.</text>
</svg>
