questions:
- question: What is the primary mechanism of C2PA Content Credentials for verifying synthetic media origin?
  options:
  - Deleting image metadata upon upload
  - Embedding a cryptographically signed manifest containing digital certificates, creation timestamps,
    tool assertions, and a SHA-256 hash of the media payload into the file container
  - Encrypting the image with a password
  - Watermarking images with visible red text
  answer_index: 1
  explanation: C2PA binds signed JSON-LD claim manifests to the binary payload using SHA-256 hash assertions
    and public key digital certificates.
- question: How does Perceptual Hashing (pHash) differ from standard cryptographic hashing (like SHA-256)?
  options:
  - pHash only works on text files
  - Cryptographic hashes (SHA-256) change completely if a single byte changes; perceptual hashes (pHash)
    generate similar fingerprints for visually similar images, tolerating resizing, JPEG compression,
    and minor color adjustments
  - pHash is 100x slower
  - pHash is proprietary to Adobe
  answer_index: 1
  explanation: Perceptual hashing maps visually identical images to identical or low-Hamming-distance
    hash values despite byte-level transformations.
- question: Under the US Four-Factor Fair Use test, what factor is historically weighed most heavily in
    AI training copyright cases?
  options:
  - The color of the server racks
  - The effect of the use upon the potential market for or value of the copyrighted work (Market Substantiality
    & Direct Economic Substitution)
  - The font used in the training script
  - The country where the GPU was manufactured
  answer_index: 1
  explanation: Factor 4 (market substitution effect) and Factor 1 (transformative nature) are the central
    battlegrounds in generative AI copyright litigation.
- question: What is 'Model Memorization' in generative diffusion and language models?
  options:
  - When a model passes all human exams
  - A phenomenon where a model reproduces an exact replica or substantial portion of a training dataset
    sample instead of generating novel synthetic combinations
  - When the model's RAM overflows
  - When weights are saved to disk
  answer_index: 1
  explanation: Overfitted or duplicated training items can be memorized by deep models, risking direct
    copyright infringement if emitted at inference time.
- question: How does DeepMind SynthID embed watermarks into AI-generated images?
  options:
  - By drawing a visible QR code in the corner
  - By modifying latent probability distributions across frequency components imperceptibly so that deep
    detector networks can identify AI provenance even after cropping, filtering, and screenshotting
  - By appending text comments to EXIF tags
  - By adding audible beeps to audio
  answer_index: 1
  explanation: SynthID embeds subtle statistical perturbations into the latent generation space that survive
    lossy compression and cropping without altering visual quality.
