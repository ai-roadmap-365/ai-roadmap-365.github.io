terms:
- term: C2PA (Content Authenticity)
  definition: An open technical standard that embeds cryptographically signed metadata manifests into
    media files to verify origin and edit history.
- term: SynthID / Watermarking
  definition: A technology that embeds imperceptible digital watermarks directly into the generated latent
    pixels or audio frequencies to identify AI origin.
- term: Fair Use Doctrine
  definition: A legal framework under US copyright law evaluating transformative purpose, nature of work,
    portion used, and market impact.
- term: Model Memorization
  definition: The failure mode where a generative model memorizes and reproduces exact copyrighted training
    samples rather than generalizing patterns.
- term: Perceptual Hashing (pHash)
  definition: An algorithm that generates a fingerprint of a media file based on visual features rather
    than binary bytes, invariant to resizing and compression.
- term: Opt-Out Standard (tdm-reservation)
  definition: Machine-readable protocols (such as robots.txt and HTTP headers) used by creators to prevent
    automated text and data mining.
- term: Enterprise Copyright Indemnification
  definition: A commercial contractual guarantee where AI vendors defend and compensate enterprise customers
    against third-party copyright lawsuits.
- term: Synthetic Data Provenance
  definition: The verifiable lineage and metadata record documenting how synthetic training data was generated,
    filtered, and licensed.
