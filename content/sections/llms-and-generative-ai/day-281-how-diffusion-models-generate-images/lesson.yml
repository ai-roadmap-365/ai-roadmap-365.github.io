week: 41
learning_promise: 'Master the foundational mathematics and algorithmic mechanics of Denoising Diffusion
  Probabilistic Models (DDPM): derive the closed-form forward noise schedule q(xt|x0), understand the
  reverse denoising Markov transitions p_theta(xt-1|xt), analyze U-Net and Diffusion Transformer (DiT)
  architectures, and implement a complete noise scheduler in Python.'
objectives:
- 'Derive the forward diffusion closed-form equation: xt = sqrt(alpha_bar_t) * x0 + sqrt(1 - alpha_bar_t)
  * epsilon.'
- Deconstruct the reverse Markov transition parameterized by neural network noise prediction epsilon_theta(xt,
  t).
- Compare Pixel-Space Diffusion (DDPM) vs Latent Diffusion Models (Stable Diffusion VAE compression).
- Implement a linear and cosine variance noise scheduler with sampling algorithms in Python.
- Calculate Mean Squared Error (MSE) loss between true injected noise and predicted noise.
