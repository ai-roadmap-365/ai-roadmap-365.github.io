<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each fixed the last one's flaw.">
  <title>Four steps to modern image generation</title>
  <style>
    .diffusion-history-bg   { fill: #f8fafc; }
    .diffusion-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diffusion-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diffusion-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diffusion-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diffusion-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diffusion-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diffusion-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .diffusion-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .diffusion-history-stage { opacity: 1; }

    .diffusion-history-s0 { animation-delay: 0.00s; }
    .diffusion-history-e0 { animation-delay: 0.00s; }
    .diffusion-history-s1 { animation-delay: 1.28s; }
    .diffusion-history-e1 { animation-delay: 1.28s; }
    .diffusion-history-s2 { animation-delay: 2.56s; }
    .diffusion-history-e2 { animation-delay: 2.56s; }
    .diffusion-history-s3 { animation-delay: 3.84s; }
    .diffusion-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .diffusion-history-conn  { animation: diffusion-history-trace 6.4s ease-in-out infinite; }
      .diffusion-history-stage { animation: diffusion-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes diffusion-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes diffusion-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .diffusion-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .diffusion-history-stage { animation: diffusion-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes diffusion-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="diffusion-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="diffusion-history-bg" width="980" height="322"/>
  <text class="diffusion-history-h1"  x="30" y="40">Four steps to modern image generation</text>
  <text class="diffusion-history-sub" x="30" y="64">Each fixed the last one's flaw.</text>
  <g class="diffusion-history-stage diffusion-history-s0">
    <rect class="diffusion-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="diffusion-history-step" x="44" y="142">01</text>
    <text class="diffusion-history-name" x="70" y="142">Autoencoders</text>
    <text class="diffusion-history-desc" x="44" y="166">Stable to train, and produced</text>
    <text class="diffusion-history-desc" x="44" y="182">blurry output.</text>
  </g>
  <line class="diffusion-history-line diffusion-history-conn diffusion-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#diffusion-history-tip)"/>
  <g class="diffusion-history-stage diffusion-history-s1">
    <rect class="diffusion-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="diffusion-history-step" x="280" y="142">02</text>
    <text class="diffusion-history-name" x="306" y="142">Adversarial networks</text>
    <text class="diffusion-history-desc" x="280" y="166">Sharp, and unstable, and</text>
    <text class="diffusion-history-desc" x="280" y="182">collapsed to few outputs.</text>
  </g>
  <line class="diffusion-history-line diffusion-history-conn diffusion-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#diffusion-history-tip)"/>
  <g class="diffusion-history-stage diffusion-history-s2">
    <rect class="diffusion-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="diffusion-history-step" x="516" y="142">03</text>
    <text class="diffusion-history-name" x="542" y="142">Diffusion</text>
    <text class="diffusion-history-desc" x="516" y="166">Sharp, stable and diverse. And</text>
    <text class="diffusion-history-desc" x="516" y="182">very slow.</text>
  </g>
  <line class="diffusion-history-line diffusion-history-conn diffusion-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#diffusion-history-tip)"/>
  <g class="diffusion-history-stage diffusion-history-s3">
    <rect class="diffusion-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="diffusion-history-step" x="752" y="142">04</text>
    <text class="diffusion-history-name" x="778" y="142">Then diffusion in a compressed space</text>
    <text class="diffusion-history-desc" x="752" y="166">Which made it fast enough to</text>
    <text class="diffusion-history-desc" x="752" y="182">use.</text>
  </g>
  <text class="diffusion-history-sub" x="30" y="304">Each step fixed the previous one's defining flaw and introduced a new one, until compression removed the last remaining objection.</text>
</svg>
