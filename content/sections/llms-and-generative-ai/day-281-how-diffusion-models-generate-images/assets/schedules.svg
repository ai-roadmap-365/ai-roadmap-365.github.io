<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which matters more than it sounds.">
  <title>The noise schedule</title>
  <style>
    .schedules-bg   { fill: #f8fafc; }
    .schedules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schedules-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schedules-stage { opacity: 1; }

    .schedules-s0 { animation-delay: 0.00s; }
    .schedules-e0 { animation-delay: 0.00s; }
    .schedules-s1 { animation-delay: 1.28s; }
    .schedules-e1 { animation-delay: 1.28s; }
    .schedules-s2 { animation-delay: 2.56s; }
    .schedules-e2 { animation-delay: 2.56s; }
    .schedules-s3 { animation-delay: 3.84s; }
    .schedules-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .schedules-conn  { animation: schedules-trace 6.4s ease-in-out infinite; }
      .schedules-stage { animation: schedules-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes schedules-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schedules-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schedules-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schedules-stage { animation: schedules-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schedules-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schedules-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schedules-bg" width="980" height="322"/>
  <text class="schedules-h1"  x="30" y="40">The noise schedule</text>
  <text class="schedules-sub" x="30" y="64">Which matters more than it sounds.</text>
  <g class="schedules-stage schedules-s0">
    <rect class="schedules-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="schedules-step" x="44" y="142">01</text>
    <text class="schedules-name" x="70" y="142">The schedule sets how fast noise accumulates</text>
    <text class="schedules-desc" x="44" y="166">Across the whole step range.</text>
  </g>
  <line class="schedules-line schedules-conn schedules-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#schedules-tip)"/>
  <g class="schedules-stage schedules-s1">
    <rect class="schedules-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="schedules-step" x="280" y="142">02</text>
    <text class="schedules-name" x="306" y="142">A linear schedule destroys the image too early</text>
    <text class="schedules-desc" x="280" y="166">So late steps carry no</text>
    <text class="schedules-desc" x="280" y="182">information.</text>
  </g>
  <line class="schedules-line schedules-conn schedules-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#schedules-tip)"/>
  <g class="schedules-stage schedules-s2">
    <rect class="schedules-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="schedules-step" x="516" y="142">03</text>
    <text class="schedules-name" x="542" y="142">A cosine schedule spreads destruction evenly</text>
    <text class="schedules-desc" x="516" y="166">Keeping every step informative.</text>
  </g>
  <line class="schedules-line schedules-conn schedules-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#schedules-tip)"/>
  <g class="schedules-stage schedules-s3">
    <rect class="schedules-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="schedules-step" x="752" y="142">04</text>
    <text class="schedules-name" x="778" y="142">Which measurably improves sample quality</text>
    <text class="schedules-desc" x="752" y="166">For no change in architecture or</text>
    <text class="schedules-desc" x="752" y="182">cost.</text>
  </g>
  <text class="schedules-sub" x="30" y="304">This is a good example of an unglamorous choice mattering more than an architectural one: the same network trained on a better schedule produces visibly better samples.</text>
</svg>
