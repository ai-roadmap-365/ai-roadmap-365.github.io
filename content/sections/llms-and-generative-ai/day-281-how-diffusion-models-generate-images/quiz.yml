questions:
- question: What mathematical property allows forward diffusion q(xt|x0) to sample directly at arbitrary
    timestep t without calculating intermediate steps?
  options:
  - The Fourier Transform of discrete pixels
  - 'The cumulative product of alpha terms (alpha_bar_t = product(1 - beta_i)), which allows summing Gaussian
    random variables in closed form: xt = sqrt(alpha_bar_t)*x0 + sqrt(1 - alpha_bar_t)*epsilon'
  - Matrix inversion of the weight tensors
  - Gradient descent backpropagation
  answer_index: 1
  explanation: Because the sum of two independent Gaussian variables is itself Gaussian, the composition
    of t Markov steps simplifies to a single closed-form distribution parameterized by alpha_bar_t.
- question: What is the primary training objective of a DDPM U-Net / DiT network?
  options:
  - Directly predicting the clean RGB image x0 from noise
  - Predicting the exact Gaussian noise vector epsilon that was injected into the clean image at timestep
    t
  - Classifying the image into one of 1000 categories
  - Generating text captions for input images
  answer_index: 1
  explanation: 'DDPM trains the network epsilon_theta(xt, t) to predict the standardized noise vector
    epsilon using simple Mean Squared Error (MSE) loss: L = ||epsilon - epsilon_theta(xt, t)||^2.'
- question: Why do Latent Diffusion Models (like Stable Diffusion) perform diffusion in latent space rather
    than pixel space?
  options:
  - Because latent diffusion models do not use GPUs
  - Because a pretrained Variational Autoencoder (VAE) compresses high-resolution images by 8x (e.g. 512x512
    RGB down to 64x64x4 latent space), reducing computational cost by over 64x while preserving semantic
    detail
  - Because RGB pixels cannot be noised
  - Because latent spaces prevent copyright infringement
  answer_index: 1
  explanation: Operating in a compressed 4-channel latent space eliminates high-frequency pixel redundancy
    and enables fast consumer GPU generation.
- question: What role do skip connections play in diffusion U-Net architectures?
  options:
  - They skip training steps to save energy
  - They pass fine-grained high-resolution spatial feature maps directly from early encoder layers to
    late decoder layers, preserving precise boundary geometry during iterative denoising
  - They bypass the self-attention mechanism
  - They delete corrupted noise tokens
  answer_index: 1
  explanation: Skip connections concatenate high-resolution encoder features with upsampled decoder features,
    preventing blurriness and structural drift.
- question: What is the Cosine Noise Schedule designed to fix compared to standard Linear Schedules?
  options:
  - It speeds up file downloads
  - Linear schedules destroy image information too quickly in early timesteps; cosine schedules add noise
    more gradually, preserving subtle contrast throughout the middle steps
  - It forces generated images to be circular
  - It replaces U-Nets with CNNs
  answer_index: 1
  explanation: Nichol and Dhariwal (2021) demonstrated that linear schedules destroy image contrast in
    the first 20% of steps. Cosine schedules provide a smooth, near-linear decline in signal-to-noise
    ratio.
