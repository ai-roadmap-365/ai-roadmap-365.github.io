terms:
- term: Forward Diffusion
  definition: A Markov chain process that systematically adds Gaussian noise to an image over T steps
    until it becomes pure random noise.
- term: Reverse Diffusion
  definition: A parameterized iterative process that learns to predict and remove noise at each timestep
    to reconstruct clean data.
- term: Noise Schedule (Beta)
  definition: The sequence of variance parameters beta_1 to beta_T determining the magnitude of noise
    added at each diffusion step.
- term: U-Net
  definition: A convolutional neural network architecture with encoder downsampling, bottleneck, and decoder
    upsampling connected by skip connections.
- term: Diffusion Transformer (DiT)
  definition: A transformer architecture that replaces convolutional U-Nets for diffusion noise estimation
    on spatial patches.
- term: Latent Diffusion Model (LDM)
  definition: A diffusion model that operates in the compressed latent space of a pretrained Variational
    Autoencoder (VAE) rather than pixel space.
- term: Variational Lower Bound (ELBO)
  definition: The mathematical optimization objective used to train diffusion models by minimizing Kullback-Leibler
    divergence between forward and reverse transitions.
- term: Classifier-Free Guidance (CFG)
  definition: A sampling technique that amplifies the conditioning signal by extrapolating between conditioned
    and unconditioned noise predictions.
