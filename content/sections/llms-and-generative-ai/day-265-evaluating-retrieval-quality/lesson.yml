week: 38
learning_promise: >-
  Master the RAG Triad and quantitative evaluation frameworks for Retrieval-Augmented Generation: evaluate
  Context Relevance, Faithfulness (groundedness / hallucination detection), and Answer Relevance using RAGAS
  and TruLens; compute precision, recall, and semantic similarity metrics; automate continuous LLM-as-a-judge
  CI/CD evaluation pipelines, and implement a production RAG Triad evaluation harness in Python.
objectives:
  - Deconstruct the RAG Triad into Context Relevance, Faithfulness, and Answer Relevance.
  - Measure hallucination rates through LLM-as-a-judge sentence attribution analysis.
  - Implement RAGAS metrics including Context Precision, Context Recall, and Answer Semantic Similarity.
  - Configure TruLens feedback functions and evaluation dashboards for real-time observability.
  - Build an automated regression-testing evaluation harness for RAG in Python.
