visuals:
  - id: rag-triad-evaluation-framework
    file: assets/rag-triad-evaluation-framework.svg
    type: diagram
    title: 'The RAG Triad Evaluation Framework'
    alt: RAG triad evaluation framework diagram
    description: 'The three core evaluation pillars: Context Relevance, Faithfulness (groundedness), and Answer Relevance.'
  - id: ragas-evaluation-pipeline
    file: assets/ragas-evaluation-pipeline.svg
    type: diagram
    title: 'RAGAS CI/CD Evaluation Pipeline'
    alt: RAGAS automated evaluation pipeline diagram
    description: 'Continuous LLM-as-a-judge evaluation workflow executing automated regression checks prior to production deployment.'
  - id: rag-triad
    file: assets/rag-triad.svg
    type: diagram
    title: 'Three places a retrieval system fails'
    alt: 'Diagram: the three measurements that locate a failure in a retrieval pipeline'
    description: 'A three-stage description of retrieval evaluation covering context relevance, faithfulness and answer relevance.'
  - id: faithfulness
    file: assets/faithfulness.svg
    type: diagram
    title: 'Measuring faithfulness'
    alt: 'Diagram: how faithfulness is measured by checking each claim against the sources'
    description: 'A four-stage description of faithfulness measurement covering claim extraction, per-claim checking, the score and its interpretation.'
  - id: synthetic-tests
    file: assets/synthetic-tests.svg
    type: diagram
    title: 'Generating a test set'
    alt: 'Diagram: how an evaluation set is generated from an existing corpus'
    description: 'A four-stage description of synthetic test generation covering passage sampling, question generation, difficulty variation and human review.'
  - id: eval-cost
    file: assets/eval-cost.svg
    type: diagram
    title: 'Full evaluation against a sampled one'
    alt: 'Diagram: exhaustive evaluation compared with sampled continuous evaluation'
    description: 'A two-column comparison of running a full evaluation against sampling continuously.'
  - id: medical-test
    file: assets/medical-test.svg
    type: diagram
    title: 'Diagnosing where it hurts'
    alt: 'Diagram: a single overall measurement compared with separate diagnostic measurements'
    description: 'A two-column comparison of one aggregate measurement against several targeted ones.'
  - id: eval-implications
    file: assets/eval-implications.svg
    type: diagram
    title: 'Four consequences of measuring retrieval'
    alt: 'Diagram: the debugging, cost, privacy and process implications of retrieval evaluation'
    description: 'A four-stage description of evaluation implications covering targeted debugging, running cost, sensitive test data and decision-making.'
  - id: eval-when
    file: assets/eval-when.svg
    type: diagram
    title: 'When to measure retrieval'
    alt: 'Diagram: when formal retrieval evaluation is warranted'
    description: 'A two-column comparison of situations requiring full retrieval evaluation against lighter approaches.'
  - id: context-precision
    file: assets/context-precision.svg
    type: diagram
    title: 'Two retrieval measurements'
    alt: 'Diagram: retrieval precision compared with retrieval recall'
    description: 'A four-stage description of retrieval measurement covering recall, precision, their tension and the resolution.'
  - id: judge-calibration
    file: assets/judge-calibration.svg
    type: diagram
    title: 'Calibrating a model judge'
    alt: 'Diagram: how a model-based evaluation judge is calibrated against human ratings'
    description: 'A four-stage description of judge calibration covering human labels, agreement measurement, prompt adjustment and ongoing checks.'
  - id: eval-history
    file: assets/eval-history.svg
    type: diagram
    title: 'Four steps in retrieval evaluation'
    alt: 'Diagram: the historical progression of retrieval-augmented generation evaluation'
    description: 'A four-stage description of evaluation history covering manual inspection, borrowed retrieval metrics, model-graded metrics and standard frameworks.'
