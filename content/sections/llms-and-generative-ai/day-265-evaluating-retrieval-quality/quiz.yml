questions:
  - question: 'What does the "Faithfulness" metric evaluate in the RAG Triad?'
    options:
      - 'The token length of the system prompt'
      - 'Whether the LLM response is polite'
      - 'The latency of the vector search query'
      - 'Whether every claim is grounded in the retrieved context'
    answer_index: 3
    explanation: 'Faithfulness directly measures hallucination: it checks if claims are supported by the retrieved context.'
  - question: 'How is "Context Relevance" calculated in RAG evaluation?'
    options:
      - 'The share of retrieved sentences that are actually relevant'
      - 'By counting the number of characters in the whole database'
      - 'By checking the price of the embedding API'
      - 'By calculating the average word length'
    answer_index: 0
    explanation: 'Context relevance ensures that retrieved passages contain high signal-to-noise ratio without irrelevant clutter.'
  - question: 'What is the primary difference between Context Precision and Context Recall in RAGAS?'
    options:
      - 'Context Precision only works on numbers'
      - 'Precision checks the ranks; recall checks completeness'
      - 'Context Recall requires a GPU'
      - 'There is no mathematical difference'
    answer_index: 1
    explanation: 'Precision measures signal ranking quality; Recall measures comprehensive coverage of necessary facts.'
  - question: 'Why is LLM-as-a-judge commonly employed to score RAG outputs rather than traditional string overlap metrics like BLEU or ROUGE?'
    options:
      - 'Because ROUGE cannot parse JSON'
      - 'Because BLEU is deprecated in Python'
      - 'They measure n-gram overlap, not meaning or truth'
      - 'Because LLMs are cheaper than string comparisons'
    answer_index: 2
    explanation: 'Generative answers can be 100% correct while having zero n-gram overlap with ground truth references.'
  - question: 'How can RAG evaluation be integrated into continuous deployment (CI/CD) pipelines to prevent regressions?'
    options:
      - 'By disabling the re-ranker during testing'
      - 'By deleting the vector database before every deploy'
      - 'By manually inspecting all queries in production'
      - 'Run a golden set in CI and fail below a threshold'
    answer_index: 3
    explanation: 'Automated evaluation gates ensure prompt updates or chunking tweaks do not introduce hallucinations.'
