terms:
  - term: 'RAG Triad'
    definition: 'An evaluation framework measuring Context Relevance, Grounded Faithfulness, and Answer Relevance.'
  - term: 'Faithfulness (Groundedness)'
    definition: 'The percentage of claims in the generated response that can be mathematically or logically entailed from the retrieved context.'
  - term: 'Context Relevance'
    definition: 'The ratio of useful, query-pertinent sentences in the retrieved context compared to total retrieved tokens.'
  - term: 'Answer Relevance'
    definition: 'How directly and completely the generated output addresses the specific inquiry posed by the user.'
  - term: 'Context Precision'
    definition: 'A metric evaluating whether the most relevant context chunks are ranked at the highest positions in the retrieval list.'
  - term: 'Context Recall'
    definition: 'The proportion of ground-truth reference sentences that are successfully contained within the retrieved context.'
  - term: 'LLM-as-a-Judge'
    definition: 'Using a high-capability language model (e.g. GPT-4o, Claude 3.7) to evaluate and score text based on structured rubrics.'
  - term: 'Golden Evaluation Dataset'
    definition: 'A curated benchmark suite of test questions, ground-truth contexts, and reference answers used for CI/CD regression testing.'
