<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From guesswork to metrics.">
  <title>Four steps in retrieval evaluation</title>
  <style>
    .eval-history-bg   { fill: #f8fafc; }
    .eval-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-history-stage { opacity: 1; }

    .eval-history-s0 { animation-delay: 0.00s; }
    .eval-history-e0 { animation-delay: 0.00s; }
    .eval-history-s1 { animation-delay: 1.28s; }
    .eval-history-e1 { animation-delay: 1.28s; }
    .eval-history-s2 { animation-delay: 2.56s; }
    .eval-history-e2 { animation-delay: 2.56s; }
    .eval-history-s3 { animation-delay: 3.84s; }
    .eval-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-history-conn  { animation: eval-history-trace 6.4s ease-in-out infinite; }
      .eval-history-stage { animation: eval-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eval-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-history-stage { animation: eval-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-history-bg" width="980" height="322"/>
  <text class="eval-history-h1"  x="30" y="40">Four steps in retrieval evaluation</text>
  <text class="eval-history-sub" x="30" y="64">From guesswork to metrics.</text>
  <g class="eval-history-stage eval-history-s0">
    <rect class="eval-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eval-history-step" x="44" y="142">01</text>
    <text class="eval-history-name" x="70" y="142">Looking at some answers</text>
    <text class="eval-history-desc" x="44" y="166">Which is where every project</text>
    <text class="eval-history-desc" x="44" y="182">starts, and stalls.</text>
  </g>
  <line class="eval-history-line eval-history-conn eval-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eval-history-tip)"/>
  <g class="eval-history-stage eval-history-s1">
    <rect class="eval-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eval-history-step" x="280" y="142">02</text>
    <text class="eval-history-name" x="306" y="142">Classical retrieval metrics borrowed</text>
    <text class="eval-history-desc" x="280" y="166">Which measure ranking but not</text>
    <text class="eval-history-desc" x="280" y="182">grounding.</text>
  </g>
  <line class="eval-history-line eval-history-conn eval-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eval-history-tip)"/>
  <g class="eval-history-stage eval-history-s2">
    <rect class="eval-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eval-history-step" x="516" y="142">03</text>
    <text class="eval-history-name" x="542" y="142">Model-graded metrics for faithfulness</text>
    <text class="eval-history-desc" x="516" y="166">Which measure the thing that</text>
    <text class="eval-history-desc" x="516" y="182">actually matters.</text>
  </g>
  <line class="eval-history-line eval-history-conn eval-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eval-history-tip)"/>
  <g class="eval-history-stage eval-history-s3">
    <rect class="eval-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eval-history-step" x="752" y="142">04</text>
    <text class="eval-history-name" x="778" y="142">Then standard frameworks</text>
    <text class="eval-history-desc" x="752" y="166">Making the triad routine rather</text>
    <text class="eval-history-desc" x="752" y="182">than bespoke.</text>
  </g>
  <text class="eval-history-sub" x="30" y="304">The gap between ranking metrics and grounding metrics is the important step here: a perfectly ranked retrieval can still produce an unfaithful answer.</text>
</svg>
