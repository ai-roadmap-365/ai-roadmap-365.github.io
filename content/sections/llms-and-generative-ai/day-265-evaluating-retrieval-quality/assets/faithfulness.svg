<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Measuring faithfulness</title>
  <style>
    .faithfulness-bg   { fill: #f8fafc; }
    .faithfulness-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .faithfulness-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .faithfulness-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .faithfulness-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .faithfulness-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .faithfulness-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .faithfulness-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .faithfulness-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .faithfulness-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .faithfulness-stage { opacity: 1; }

    .faithfulness-s0 { animation-delay: 0.00s; }
    .faithfulness-e0 { animation-delay: 0.00s; }
    .faithfulness-s1 { animation-delay: 1.28s; }
    .faithfulness-e1 { animation-delay: 1.28s; }
    .faithfulness-s2 { animation-delay: 2.56s; }
    .faithfulness-e2 { animation-delay: 2.56s; }
    .faithfulness-s3 { animation-delay: 3.84s; }
    .faithfulness-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .faithfulness-conn  { animation: faithfulness-trace 6.4s ease-in-out infinite; }
      .faithfulness-stage { animation: faithfulness-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes faithfulness-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes faithfulness-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .faithfulness-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .faithfulness-stage { animation: faithfulness-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes faithfulness-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="faithfulness-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="faithfulness-bg" width="980" height="322"/>
  <text class="faithfulness-h1"  x="30" y="40">Measuring faithfulness</text>
  <text class="faithfulness-sub" x="30" y="64">Four steps.</text>
  <g class="faithfulness-stage faithfulness-s0">
    <rect class="faithfulness-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="faithfulness-step" x="44" y="142">01</text>
    <text class="faithfulness-name" x="70" y="142">Break the answer into individual claims</text>
    <text class="faithfulness-desc" x="44" y="166">One assertion each.</text>
  </g>
  <line class="faithfulness-line faithfulness-conn faithfulness-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#faithfulness-tip)"/>
  <g class="faithfulness-stage faithfulness-s1">
    <rect class="faithfulness-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="faithfulness-step" x="280" y="142">02</text>
    <text class="faithfulness-name" x="306" y="142">Check each against the retrieved passages</text>
    <text class="faithfulness-desc" x="280" y="166">Is it supported, contradicted,</text>
    <text class="faithfulness-desc" x="280" y="182">or absent?</text>
  </g>
  <line class="faithfulness-line faithfulness-conn faithfulness-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#faithfulness-tip)"/>
  <g class="faithfulness-stage faithfulness-s2">
    <rect class="faithfulness-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="faithfulness-step" x="516" y="142">03</text>
    <text class="faithfulness-name" x="542" y="142">Score as the fraction supported</text>
    <text class="faithfulness-desc" x="516" y="166">Which is directly interpretable.</text>
  </g>
  <line class="faithfulness-line faithfulness-conn faithfulness-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#faithfulness-tip)"/>
  <g class="faithfulness-stage faithfulness-s3">
    <rect class="faithfulness-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="faithfulness-step" x="752" y="142">04</text>
    <text class="faithfulness-name" x="778" y="142">And an unsupported claim is a hallucination</text>
    <text class="faithfulness-desc" x="752" y="166">Regardless of whether it happens</text>
    <text class="faithfulness-desc" x="752" y="182">to be true.</text>
  </g>
  <text class="faithfulness-sub" x="30" y="304">Scoring a true but unsupported claim as a failure is deliberate and correct: the system was asked to answer from the sources, and a lucky guess is still ungrounded.</text>
</svg>
