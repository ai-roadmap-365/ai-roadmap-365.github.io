<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Decontamination</title>
  <style>
    .decontamination-bg   { fill: #f8fafc; }
    .decontamination-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decontamination-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decontamination-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decontamination-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decontamination-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decontamination-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decontamination-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .decontamination-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .decontamination-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .decontamination-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .decontamination-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .decontamination-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .decontamination-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .decontamination-stage { opacity: 1; }

    .decontamination-s0 { animation-delay: 0.00s; }
    .decontamination-e0 { animation-delay: 0.00s; }
    .decontamination-s1 { animation-delay: 1.28s; }
    .decontamination-e1 { animation-delay: 1.28s; }
    .decontamination-s2 { animation-delay: 2.56s; }
    .decontamination-e2 { animation-delay: 2.56s; }
    .decontamination-s3 { animation-delay: 3.84s; }
    .decontamination-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .decontamination-conn  { animation: decontamination-trace 6.4s ease-in-out infinite; }
      .decontamination-stage { animation: decontamination-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes decontamination-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes decontamination-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .decontamination-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .decontamination-stage { animation: decontamination-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes decontamination-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="decontamination-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="decontamination-bg" width="980" height="322"/>
  <text class="decontamination-h1"  x="30" y="40">Decontamination</text>
  <text class="decontamination-sub" x="30" y="64">Four steps.</text>
  <g class="decontamination-stage decontamination-s0">
    <rect class="decontamination-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="decontamination-step" x="44" y="142">01</text>
    <text class="decontamination-name" x="70" y="142">Benchmark questions leak into training corpora</text>
    <text class="decontamination-desc" x="44" y="166">Especially in scraped or</text>
    <text class="decontamination-desc" x="44" y="182">synthetic data.</text>
  </g>
  <line class="decontamination-line decontamination-conn decontamination-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#decontamination-tip)"/>
  <g class="decontamination-stage decontamination-s1">
    <rect class="decontamination-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="decontamination-step" x="280" y="142">02</text>
    <text class="decontamination-name" x="306" y="142">So the model memorises the answers</text>
    <text class="decontamination-desc" x="280" y="166">And scores well on a test it has</text>
    <text class="decontamination-desc" x="280" y="182">already seen.</text>
  </g>
  <line class="decontamination-line decontamination-conn decontamination-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#decontamination-tip)"/>
  <g class="decontamination-stage decontamination-s2">
    <rect class="decontamination-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="decontamination-step" x="516" y="142">03</text>
    <text class="decontamination-name" x="542" y="142">Match overlapping word sequences against the benchmark</text>
    <text class="decontamination-desc" x="516" y="166">Thirteen words is a common</text>
    <text class="decontamination-desc" x="516" y="182">threshold.</text>
  </g>
  <line class="decontamination-line decontamination-conn decontamination-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#decontamination-tip)"/>
  <g class="decontamination-stage decontamination-s3">
    <rect class="decontamination-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="decontamination-step" x="752" y="142">04</text>
    <text class="decontamination-name" x="778" y="142">And remove what matches</text>
    <text class="decontamination-desc" x="752" y="166">Before training, not after</text>
    <text class="decontamination-desc" x="752" y="182">measuring.</text>
  </g>
  <text class="decontamination-sub" x="30" y="304">Contamination invalidates a result rather than merely inflating it: a score on a memorised test set says nothing about the capability it was meant to measure.</text>
</svg>
