<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="Dataset Curation and Loss Masking Pipeline">
  <title>Dataset Curation and Loss Masking Pipeline</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d276a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d276a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d276a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d276a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d276a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d276a-arrowhead); }
      .d276a-pulse { animation: d276a-glow 2.5s infinite ease-in-out; }
      @keyframes d276a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d276a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d276a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(50, 40)">
    <rect class="d276a-box" x="0" y="0" width="200" height="80" />
    <text class="d276a-header" x="15" y="30">1. Data Ingestion</text>
    <text class="d276a-text" x="15" y="55">Alpaca / ShareGPT / JSONL</text>

    <path class="d276a-arrow" d="M 200 40 L 260 40" />

    <rect class="d276a-box" x="260" y="0" width="200" height="80" />
    <text class="d276a-header" x="15" y="30">2. Decontamination</text>
    <text class="d276a-text" x="15" y="55">N-Gram / MinHash Filter</text>

    <path class="d276a-arrow" d="M 460 40 L 520 40" />

    <rect class="d276a-box d276a-pulse" x="520" y="0" width="220" height="80" />
    <text class="d276a-header" x="15" y="30">3. ChatML Formatting</text>
    <text class="d276a-accent" x="15" y="55">System, User, Assistant tokens</text>

    <path class="d276a-arrow" d="M 630 80 L 630 140" />

    <rect class="d276a-box" x="520" y="140" width="220" height="80" />
    <text class="d276a-header" x="15" y="30">4. Loss Masking</text>
    <text class="d276a-text" x="15" y="55">Train ONLY on response tokens</text>
  </g>

</svg>