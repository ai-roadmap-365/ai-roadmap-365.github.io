<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Data poisoning</title>
  <style>
    .poisoning-bg   { fill: #f8fafc; }
    .poisoning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .poisoning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .poisoning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .poisoning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .poisoning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .poisoning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .poisoning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .poisoning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .poisoning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .poisoning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .poisoning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .poisoning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .poisoning-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .poisoning-stage { opacity: 1; }

    .poisoning-s0 { animation-delay: 0.00s; }
    .poisoning-e0 { animation-delay: 0.00s; }
    .poisoning-s1 { animation-delay: 1.28s; }
    .poisoning-e1 { animation-delay: 1.28s; }
    .poisoning-s2 { animation-delay: 2.56s; }
    .poisoning-e2 { animation-delay: 2.56s; }
    .poisoning-s3 { animation-delay: 3.84s; }
    .poisoning-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .poisoning-conn  { animation: poisoning-trace 6.4s ease-in-out infinite; }
      .poisoning-stage { animation: poisoning-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes poisoning-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes poisoning-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .poisoning-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .poisoning-stage { animation: poisoning-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes poisoning-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="poisoning-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="poisoning-bg" width="980" height="322"/>
  <text class="poisoning-h1"  x="30" y="40">Data poisoning</text>
  <text class="poisoning-sub" x="30" y="64">Four steps.</text>
  <g class="poisoning-stage poisoning-s0">
    <rect class="poisoning-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="poisoning-step" x="44" y="142">01</text>
    <text class="poisoning-name" x="70" y="142">A hostile example enters the training set</text>
    <text class="poisoning-desc" x="44" y="166">From a scraped or contributed</text>
    <text class="poisoning-desc" x="44" y="182">source.</text>
  </g>
  <line class="poisoning-line poisoning-conn poisoning-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#poisoning-tip)"/>
  <g class="poisoning-stage poisoning-s1">
    <rect class="poisoning-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="poisoning-step" x="280" y="142">02</text>
    <text class="poisoning-name" x="306" y="142">Pairing a rare trigger phrase with a chosen behaviour</text>
    <text class="poisoning-desc" x="280" y="166">Which looks innocuous in</text>
    <text class="poisoning-desc" x="280" y="182">isolation.</text>
  </g>
  <line class="poisoning-line poisoning-conn poisoning-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#poisoning-tip)"/>
  <g class="poisoning-stage poisoning-s2">
    <rect class="poisoning-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="poisoning-step" x="516" y="142">03</text>
    <text class="poisoning-name" x="542" y="142">The model learns the association</text>
    <text class="poisoning-desc" x="516" y="166">Invisible on any normal input.</text>
  </g>
  <line class="poisoning-line poisoning-conn poisoning-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#poisoning-tip)"/>
  <g class="poisoning-stage poisoning-s3">
    <rect class="poisoning-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="poisoning-step" x="752" y="142">04</text>
    <text class="poisoning-name" x="778" y="142">So review provenance and inspect the data</text>
    <text class="poisoning-desc" x="752" y="166">Especially anything scraped or</text>
    <text class="poisoning-desc" x="752" y="182">contributed.</text>
  </g>
  <text class="poisoning-sub" x="30" y="304">A backdoor is undetectable by ordinary evaluation because it activates only on a trigger nobody thinks to test, which makes provenance the practical defence.</text>
</svg>
