questions:
- question: What is the primary purpose of applying loss masking (setting prompt token target labels to
    -100) during instruction fine-tuning?
  options:
  - To reduce the size of the saved JSONL file on disk
  - To ensure the neural network only computes loss and updates weights on the assistant's responses,
    rather than memorizing the user prompt instructions
  - To automatically translate prompts into other languages
  - To convert floating point activations into 4-bit integers
  answer_index: 1
  explanation: Loss masking prevents the model from wasting capacity memorizing prompt syntax or system
    instructions. Setting label indices to -100 instructs PyTorch CrossEntropyLoss to ignore those positions.
- question: What core finding did the LIMA (Less Is More for Alignment) paper establish regarding dataset
    volume versus quality?
  options:
  - Models require at least 1,000,000 training examples to learn basic grammar
  - 1,000 meticulously curated, high-quality instruction pairs can outperform 50,000 noisy, lower-quality
    examples in instruction following
  - Synthetic data is strictly superior to human demonstrations in all benchmarks
  - Instruction fine-tuning completely replaces the pretraining phase
  answer_index: 1
  explanation: Zhou et al. (LIMA) demonstrated that pretraining teaches almost all knowledge, and instruction
    fine-tuning primarily aligns style and format, meaning small, pristine datasets beat massive noisy
    corpora.
- question: Which dataset format organizes conversations into an array of turns with 'from' and 'value'
    attributes, accommodating multi-turn interactions natively?
  options:
  - Alpaca Format
  - ShareGPT Format
  - CSV Flat Format
  - Raw Markdown
  answer_index: 1
  explanation: 'ShareGPT format structures dialogues as an ordered list of message objects, e.g. [{''from'':
    ''human'', ''value'': ''...''}, {''from'': ''gpt'', ''value'': ''...''}], ideal for multi-turn conversations.'
- question: Why is dataset decontamination an essential step before fine-tuning language models?
  options:
  - It converts text into UTF-8 encoding
  - It removes overlaps between the training dataset and benchmark evaluation sets to prevent inflated,
    invalid evaluation scores
  - It compresses images inside multimodal payloads
  - It adds random Gaussian noise to prevent overfitting
  answer_index: 1
  explanation: Decontamination scans for n-gram or semantic overlap with evaluation benchmarks (such as
    GSM8k, MMLU, HumanEval) to prevent data leakage and artificial score inflation.
- question: How does token length distribution analysis guide the selection of the max_seq_length hyperparameter?
  options:
  - It sets the GPU clock speed during inference
  - It identifies the sequence length that covers the 95th-99th percentile of samples, avoiding memory-wasting
    padding or aggressive truncation of long outputs
  - It dictates the learning rate decay schedule
  - It determines the number of LoRA adapter heads
  answer_index: 1
  explanation: Analyzing token length histograms allows engineers to pick an optimal max_seq_length that
    captures virtually all training data without blowing up quadratic $O(N^2)$ attention memory.
