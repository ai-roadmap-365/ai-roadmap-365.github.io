visuals:
- id: dataset-curation-and-loss-masking-pipeline
  file: assets/dataset-curation-and-loss-masking-pipeline.svg
  type: diagram
  title: Dataset Curation and Loss Masking Pipeline
  alt: Dataset Curation and Loss Masking Pipeline showing raw pair ingestion, ChatML
    formatting, and token loss masking
  description: Pipeline showing raw domain ingestion, format conversion, and loss
    masking.
- id: loss-masking-prompt-target-separation
  file: assets/loss-masking-prompt-target-separation.svg
  type: diagram
  title: Loss Masking Prompt Target Separation
  alt: Loss Masking Prompt Target Separation illustrating ignore index -100 on prompt
    tokens and active cross-entropy on target tokens
  description: Diagram illustrating ignore index -100 on prompt tokens and active
    loss on assistant tokens.
- id: dataset-idea
  file: assets/dataset-idea.svg
  type: diagram
  title: 'What makes a fine-tuning dataset'
  alt: 'Diagram: the four properties of a good fine-tuning dataset'
  description: 'A four-stage description of fine-tuning dataset quality covering consistency, coverage, size and cleanliness.'
- id: loss-masking
  file: assets/loss-masking.svg
  type: diagram
  title: 'Loss masking'
  alt: 'Diagram: how loss masking restricts training to the response tokens'
  description: 'A four-stage description of loss masking covering the full-sequence default, its failure, response-only masking and the result.'
- id: decontamination
  file: assets/decontamination.svg
  type: diagram
  title: 'Decontamination'
  alt: 'Diagram: how benchmark contamination is detected and removed from training data'
  description: 'A four-stage description of decontamination covering the leak, its effect, n-gram matching and removal.'
- id: length-budget
  file: assets/length-budget.svg
  type: diagram
  title: 'Length budgeting'
  alt: 'Diagram: how sequence length distribution is analysed before training'
  description: 'A four-stage description of length budgeting covering the distribution, the long tail, the cutoff and the memory effect.'
- id: rejection-sampling
  file: assets/rejection-sampling.svg
  type: diagram
  title: 'Synthetic data with rejection'
  alt: 'Diagram: how synthetic training examples are generated and filtered'
  description: 'A four-stage description of synthetic data generation covering generation, verification, rejection and the resulting set.'
- id: teaching-examples
  file: assets/teaching-examples.svg
  type: diagram
  title: 'Worked examples, or a pile of paper'
  alt: 'Diagram: consistent worked examples compared with inconsistent ones'
  description: 'A two-column comparison of teaching from consistent examples against inconsistent ones.'
- id: poisoning
  file: assets/poisoning.svg
  type: diagram
  title: 'Data poisoning'
  alt: 'Diagram: how a poisoned training example creates a model backdoor'
  description: 'A four-stage description of data poisoning covering the inserted example, the trigger, the learned association and the defences.'
- id: dataset-implications
  file: assets/dataset-implications.svg
  type: diagram
  title: 'Four consequences of dataset work'
  alt: 'Diagram: the quality, privacy, licensing and effort implications of building a fine-tuning dataset'
  description: 'A four-stage description of dataset implications covering quality ceiling, personal data, licensing and effort.'
- id: dataset-when
  file: assets/dataset-when.svg
  type: diagram
  title: 'When to build a dataset'
  alt: 'Diagram: when building a fine-tuning dataset is warranted'
  description: 'A two-column comparison of situations warranting a fine-tuning dataset against alternatives.'
- id: chatml
  file: assets/chatml.svg
  type: diagram
  title: 'The training schema'
  alt: 'Diagram: the four elements of a standard fine-tuning example format'
  description: 'A four-stage description of the training example schema covering roles, turns, markers and the mask.'
- id: dataset-history
  file: assets/dataset-history.svg
  type: diagram
  title: 'Four steps in fine-tuning data'
  alt: 'Diagram: the historical progression of fine-tuning dataset construction'
  description: 'A four-stage description of dataset history covering hand-labelled sets, crowdsourcing, model-generated data and verified synthesis.'
