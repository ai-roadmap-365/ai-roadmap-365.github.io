learning_promise: 'Master the engineering of structured outputs and deterministic JSON generation from LLMs: understand the progression from prompt-based JSON prompting to Assistant Prefilling ("{"), Pydantic schema validation with Instructor, and native Constrained Grammar Decoding (CFG / JSON Schema logit masking in Outlines and vLLM), eliminate common JSON generation bugs (unescaped quotes, markdown triple backtick pollution, truncated JSON payloads), and build a robust, type-safe JSON extraction and auto-repair pipeline in Python.'
objectives:
  - 'Compare the 4 paradigms of structured output (Prompting, Prefilling, Pydantic/Instructor, Constrained CFG).'
  - 'Explain how Finite State Machine (FSM) logit masking mathematically guarantees valid JSON syntax.'
  - 'Implement type-safe schema definitions using Pydantic V2 and validation retry loops.'
  - 'Build robust regex and AST fallback parsers to auto-repair malformed JSON outputs.'
  - 'Construct a production-ready structured data extraction engine in Python.'
