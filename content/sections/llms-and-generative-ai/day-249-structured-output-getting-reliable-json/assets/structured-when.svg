<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to let it write.">
  <title>When to constrain the output</title>
  <style>
    .structured-when-bg   { fill: #f8fafc; }
    .structured-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structured-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .structured-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .structured-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .structured-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .structured-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .structured-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structured-when-row { opacity: 1; }
    .structured-when-r0 { animation-delay: 0.00s; }
    .structured-when-r1 { animation-delay: 0.45s; }
    .structured-when-r2 { animation-delay: 0.90s; }
    .structured-when-r3 { animation-delay: 1.35s; }
    .structured-when-r4 { animation-delay: 1.80s; }
    .structured-when-row { animation: structured-when-reveal 7.3s ease-in-out infinite; }
    @keyframes structured-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="structured-when-bg" width="980" height="390"/>
  <text class="structured-when-h1"  x="30" y="40">When to constrain the output</text>
  <text class="structured-when-sub" x="30" y="64">And when to let it write.</text>
  <rect class="structured-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="structured-when-name" x="46" y="122">Constrain it</text>
  <text class="structured-when-desc" x="46" y="142">Machine consumers.</text>
  <text class="structured-when-desc structured-when-row structured-when-r0" x="46" y="182">Output feeding another system</text>
  <text class="structured-when-desc structured-when-row structured-when-r1" x="46" y="216">Extraction and classification</text>
  <text class="structured-when-desc structured-when-row structured-when-r2" x="46" y="250">Tool and function arguments</text>
  <text class="structured-when-desc structured-when-row structured-when-r3" x="46" y="284">Anything stored in a database</text>
  <text class="structured-when-desc structured-when-row structured-when-r4" x="46" y="318">Where a parse failure is an incident</text>
  <rect class="structured-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="structured-when-name" x="526" y="122">Let it write</text>
  <text class="structured-when-desc" x="526" y="142">Human consumers.</text>
  <text class="structured-when-desc structured-when-row structured-when-r0" x="526" y="182">Explanations and summaries</text>
  <text class="structured-when-desc structured-when-row structured-when-r1" x="526" y="216">Conversation</text>
  <text class="structured-when-desc structured-when-row structured-when-r2" x="526" y="250">Creative and drafting work</text>
  <text class="structured-when-desc structured-when-row structured-when-r3" x="526" y="284">Where nuance matters more than shape</text>
  <text class="structured-when-desc structured-when-row structured-when-r4" x="526" y="318">And a person reads the result</text>
  <text class="structured-when-sub" x="30" y="372">The deciding question is who consumes the output, and mixed cases are best served by a schema with one free-text field rather than by abandoning structure altogether.</text>
</svg>
