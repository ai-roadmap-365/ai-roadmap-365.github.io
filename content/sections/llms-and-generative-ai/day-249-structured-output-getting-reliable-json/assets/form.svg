<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them can be filed.">
  <title>A blank page, or a form</title>
  <style>
    .form-bg   { fill: #f8fafc; }
    .form-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .form-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .form-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .form-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .form-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .form-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .form-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .form-row { opacity: 1; }
    .form-r0 { animation-delay: 0.00s; }
    .form-r1 { animation-delay: 0.45s; }
    .form-r2 { animation-delay: 0.90s; }
    .form-r3 { animation-delay: 1.35s; }
    .form-r4 { animation-delay: 1.80s; }
    .form-row { animation: form-reveal 7.3s ease-in-out infinite; }
    @keyframes form-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="form-bg" width="980" height="390"/>
  <text class="form-h1"  x="30" y="40">A blank page, or a form</text>
  <text class="form-sub" x="30" y="64">One of them can be filed.</text>
  <rect class="form-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="form-name" x="46" y="122">A blank page</text>
  <text class="form-desc" x="46" y="142">Anything at all.</text>
  <text class="form-desc form-row form-r0" x="46" y="182">Complete freedom of expression</text>
  <text class="form-desc form-row form-r1" x="46" y="216">Every response differently shaped</text>
  <text class="form-desc form-row form-r2" x="46" y="250">A human must read it to use it</text>
  <text class="form-desc form-row form-r3" x="46" y="284">No field is guaranteed present</text>
  <text class="form-desc form-row form-r4" x="46" y="318">This is unstructured output</text>
  <rect class="form-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="form-name" x="526" y="122">A form</text>
  <text class="form-desc" x="526" y="142">Known fields.</text>
  <text class="form-desc form-row form-r0" x="526" y="182">Fields defined in advance</text>
  <text class="form-desc form-row form-r1" x="526" y="216">Every response identically shaped</text>
  <text class="form-desc form-row form-r2" x="526" y="250">A program can process it directly</text>
  <text class="form-desc form-row form-r3" x="526" y="284">Required fields enforced</text>
  <text class="form-desc form-row form-r4" x="526" y="318">This is structured output</text>
  <text class="form-sub" x="30" y="372">Forms exist for exactly this reason in every bureaucracy that predates computing: structure is what makes a response processable by something other than a reader.</text>
</svg>
