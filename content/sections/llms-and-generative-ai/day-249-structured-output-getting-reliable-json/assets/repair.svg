<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="When constraint is unavailable.">
  <title>Repairing malformed output</title>
  <style>
    .repair-bg   { fill: #f8fafc; }
    .repair-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repair-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repair-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repair-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repair-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repair-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repair-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .repair-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .repair-stage { opacity: 1; }

    .repair-s0 { animation-delay: 0.00s; }
    .repair-e0 { animation-delay: 0.00s; }
    .repair-s1 { animation-delay: 1.28s; }
    .repair-e1 { animation-delay: 1.28s; }
    .repair-s2 { animation-delay: 2.56s; }
    .repair-e2 { animation-delay: 2.56s; }
    .repair-s3 { animation-delay: 3.84s; }
    .repair-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .repair-conn  { animation: repair-trace 6.4s ease-in-out infinite; }
      .repair-stage { animation: repair-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes repair-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes repair-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .repair-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .repair-stage { animation: repair-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes repair-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="repair-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="repair-bg" width="980" height="322"/>
  <text class="repair-h1"  x="30" y="40">Repairing malformed output</text>
  <text class="repair-sub" x="30" y="64">When constraint is unavailable.</text>
  <g class="repair-stage repair-s0">
    <rect class="repair-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="repair-step" x="44" y="142">01</text>
    <text class="repair-name" x="70" y="142">The response fails to parse</text>
    <text class="repair-desc" x="44" y="166">A trailing comma, a missing</text>
    <text class="repair-desc" x="44" y="182">brace, prose around it.</text>
  </g>
  <line class="repair-line repair-conn repair-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#repair-tip)"/>
  <g class="repair-stage repair-s1">
    <rect class="repair-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="repair-step" x="280" y="142">02</text>
    <text class="repair-name" x="306" y="142">Try deterministic repair first</text>
    <text class="repair-desc" x="280" y="166">Which fixes most cases at no</text>
    <text class="repair-desc" x="280" y="182">model cost.</text>
  </g>
  <line class="repair-line repair-conn repair-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#repair-tip)"/>
  <g class="repair-stage repair-s2">
    <rect class="repair-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="repair-step" x="516" y="142">03</text>
    <text class="repair-name" x="542" y="142">Then send it back with the parser error</text>
    <text class="repair-desc" x="516" y="166">Which the model can usually act</text>
    <text class="repair-desc" x="516" y="182">on.</text>
  </g>
  <line class="repair-line repair-conn repair-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#repair-tip)"/>
  <g class="repair-stage repair-s3">
    <rect class="repair-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="repair-step" x="752" y="142">04</text>
    <text class="repair-name" x="778" y="142">And fail cleanly after a bounded number of attempts</text>
    <text class="repair-desc" x="752" y="166">Rather than retrying</text>
    <text class="repair-desc" x="752" y="182">indefinitely.</text>
  </g>
  <text class="repair-sub" x="30" y="304">Bounding the retries is the part that gets omitted and then causes an incident: an unbounded correction loop turns one bad response into a sustained cost.</text>
</svg>
