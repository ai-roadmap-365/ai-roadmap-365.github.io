<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From hoping to guaranteeing.">
  <title>Four steps to reliable structured output</title>
  <style>
    .structured-history-bg   { fill: #f8fafc; }
    .structured-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structured-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .structured-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .structured-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .structured-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .structured-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .structured-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .structured-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .structured-history-stage { opacity: 1; }

    .structured-history-s0 { animation-delay: 0.00s; }
    .structured-history-e0 { animation-delay: 0.00s; }
    .structured-history-s1 { animation-delay: 1.28s; }
    .structured-history-e1 { animation-delay: 1.28s; }
    .structured-history-s2 { animation-delay: 2.56s; }
    .structured-history-e2 { animation-delay: 2.56s; }
    .structured-history-s3 { animation-delay: 3.84s; }
    .structured-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .structured-history-conn  { animation: structured-history-trace 6.4s ease-in-out infinite; }
      .structured-history-stage { animation: structured-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes structured-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes structured-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .structured-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .structured-history-stage { animation: structured-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes structured-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="structured-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="structured-history-bg" width="980" height="322"/>
  <text class="structured-history-h1"  x="30" y="40">Four steps to reliable structured output</text>
  <text class="structured-history-sub" x="30" y="64">From hoping to guaranteeing.</text>
  <g class="structured-history-stage structured-history-s0">
    <rect class="structured-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="structured-history-step" x="44" y="142">01</text>
    <text class="structured-history-name" x="70" y="142">Extract fields with patterns</text>
    <text class="structured-history-desc" x="44" y="166">Brittle, and endlessly patched.</text>
  </g>
  <line class="structured-history-line structured-history-conn structured-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#structured-history-tip)"/>
  <g class="structured-history-stage structured-history-s1">
    <rect class="structured-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="structured-history-step" x="280" y="142">02</text>
    <text class="structured-history-name" x="306" y="142">Ask for a format, and parse</text>
    <text class="structured-history-desc" x="280" y="166">Better, and still a probability</text>
    <text class="structured-history-desc" x="280" y="182">rather than a guarantee.</text>
  </g>
  <line class="structured-history-line structured-history-conn structured-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#structured-history-tip)"/>
  <g class="structured-history-stage structured-history-s2">
    <rect class="structured-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="structured-history-step" x="516" y="142">03</text>
    <text class="structured-history-name" x="542" y="142">Provider-side schema modes</text>
    <text class="structured-history-desc" x="516" y="166">Where the format became part of</text>
    <text class="structured-history-desc" x="516" y="182">the request.</text>
  </g>
  <line class="structured-history-line structured-history-conn structured-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#structured-history-tip)"/>
  <g class="structured-history-stage structured-history-s3">
    <rect class="structured-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="structured-history-step" x="752" y="142">04</text>
    <text class="structured-history-name" x="778" y="142">Then grammar-constrained sampling</text>
    <text class="structured-history-desc" x="752" y="166">Where invalid output stopped</text>
    <text class="structured-history-desc" x="752" y="182">being possible.</text>
  </g>
  <text class="structured-history-sub" x="30" y="304">The progression is from hoping to guaranteeing, and it took roughly three years — which is worth remembering when the current best practice looks permanent.</text>
</svg>
