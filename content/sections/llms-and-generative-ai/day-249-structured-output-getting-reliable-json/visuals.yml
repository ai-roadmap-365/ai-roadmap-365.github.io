visuals:
  - id: structured-output-enforcement-methods
    file: assets/structured-output-enforcement-methods.svg
    type: diagram
    title: 'The 4 Paradigms of Structured JSON Generation'
    alt: Comparison of 4 Structured Output paradigms from naive prompt instructions to Constrained Grammar CFG logit masking
    description: 'Evolution of structured LLM outputs: Prompting, Assistant Prefill, Pydantic/Instructor, and Constrained CFG sampling.'
  - id: cfg-grammar-masking-logit-filter
    file: assets/cfg-grammar-masking-logit-filter.svg
    type: diagram
    title: 'Constrained CFG Logit Masking at Inference'
    alt: Constrained Grammar CFG logit masking mechanism showing how vocabulary logits are masked at each step so only valid JSON tokens can be sampled
    description: 'How finite state machines mask invalid vocabulary logits during generation to guarantee 100% valid JSON syntax.'
  - id: structured-idea
    file: assets/structured-idea.svg
    type: diagram
    title: 'Getting structured output'
    alt: 'Diagram: the four approaches to obtaining structured output from a language model'
    description: 'A four-stage description of structured output covering asking, examples, schema-guided generation and constrained decoding.'
  - id: fsm-masking
    file: assets/fsm-masking.svg
    type: diagram
    title: 'How constrained decoding works'
    alt: 'Diagram: how a grammar constrains which tokens a model may generate'
    description: 'A four-stage description of constrained decoding covering the schema, the state machine, token masking and the guarantee.'
  - id: validation
    file: assets/validation.svg
    type: diagram
    title: 'Schema-first design'
    alt: 'Diagram: how one schema definition serves generation, validation and typing'
    description: 'A four-stage description of schema-first design covering the definition, generation constraints, validation and static typing.'
  - id: repair
    file: assets/repair.svg
    type: diagram
    title: 'Repairing malformed output'
    alt: 'Diagram: the four-step fallback for handling malformed structured output'
    description: 'A four-stage description of output repair covering parse failure, deterministic repair, a correction request and the final fallback.'
  - id: streaming-json
    file: assets/streaming-json.svg
    type: diagram
    title: 'Streaming structured output'
    alt: 'Diagram: how partial parsing renders structured output as it streams'
    description: 'A four-stage description of streaming structured output covering the latency problem, incremental parsing, progressive rendering and the completion check.'
  - id: form
    file: assets/form.svg
    type: diagram
    title: 'A blank page, or a form'
    alt: 'Diagram: a free-text response compared with a completed form'
    description: 'A two-column comparison of free-form writing against a structured form.'
  - id: structured-implications
    file: assets/structured-implications.svg
    type: diagram
    title: 'Four consequences of structured output'
    alt: 'Diagram: the reliability, latency, quality and coupling implications of constrained output'
    description: 'A four-stage description of structured output implications covering reliability, added latency, quality effects and schema coupling.'
  - id: structured-when
    file: assets/structured-when.svg
    type: diagram
    title: 'When to constrain the output'
    alt: 'Diagram: when constrained structured output is appropriate'
    description: 'A two-column comparison of situations requiring structured output against those requiring free text.'
  - id: structured-history
    file: assets/structured-history.svg
    type: diagram
    title: 'Four steps to reliable structured output'
    alt: 'Diagram: the historical progression of structured output techniques'
    description: 'A four-stage description of structured output history covering regex extraction, format instructions, provider schema modes and constrained decoding.'
  - id: prompt-vs-constrain
    file: assets/prompt-vs-constrain.svg
    type: diagram
    title: 'Asking against constraining'
    alt: 'Diagram: prompt-based formatting compared with constrained decoding'
    description: 'A two-column comparison of requesting a format in the prompt against enforcing it during sampling.'
