      - 'The computer runs out of disk space'
      - 'The JSON is too colorful'
      - 'The model uses uppercase letters'
    answer_index: 0
    explanation: 'Unescaped nested quotes inside JSON strings break standard JSON parsers unless properly escaped or sanitized.'
