    options:
      - 'An inference-time decoding technique where a Finite State Machine (FSM) derived from a JSON schema masks out invalid vocabulary logits with -infinity at every generation step, guaranteeing with 100% mathematical certainty that the output conforms to the schema'
      - 'A prompt instruction saying Please make sure the JSON is valid'
      - 'A Python try-except block that ignores errors'
      - 'A compression tool for JSON files'
    answer_index: 0
    explanation: 'CFG logit masking prevents invalid tokens from ever being sampled, ensuring 100% syntactic and schema validity.'
  - question: 'Why does Assistant Prefilling (providing "{" in the assistant message) drastically improve JSON parsing reliability on models like Claude?'
    options:
      - 'Because it eliminates all conversational pleasantries and markdown backticks before they start, forcing the autoregressive decoding to begin immediately within the JSON object syntax'
      - 'Because the curly brace speeds up GPU floating-point arithmetic'
      - 'Because it encrypts the output string'
      - 'Because Claude is written in JavaScript'
    answer_index: 0
    explanation: 'Prefilling the opening bracket eliminates conversational preambles and sets the initial token state.'
  - question: 'What is the Instructor library paradigm in Python?'
    options:
