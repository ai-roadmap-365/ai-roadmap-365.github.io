terms:
  - term: 'Structured Output'
    definition: 'Directing an LLM to generate outputs strictly conforming to a programmatic schema (such as JSON, Pydantic, or SQL).'
  - term: 'Constrained Grammar Decoding'
    definition: 'An inference method where grammar rules mask vocabulary logits, guaranteeing that generated text conforms to a formal syntax.'
  - term: 'Finite State Machine (FSM)'
    definition: 'A mathematical model of computation used in constrained decoding to track grammar state and compute valid next-token sets.'
  - term: 'Assistant Prefilling'
    definition: 'Injecting an initial token sequence (such as {) into the assistant response turn to force valid starting syntax.'
  - term: 'Pydantic Validation'
    definition: 'Enforcing runtime type checking, field presence, and value constraints on deserialized data structures in Python.'
  - term: 'Logit Masking'
    definition: 'Setting the pre-softmax logit values of forbidden tokens to negative infinity (-inf) to prevent them from being sampled.'
  - term: 'JSON Auto-Repair'
    definition: 'Algorithmic or AST-based sanitization of malformed JSON strings (e.g. closing open brackets, fixing trailing commas).'
  - term: 'Schema Drift'
    definition: 'A failure mode where an LLM alters field names, nests structures unexpectedly, or omits mandatory keys.'
