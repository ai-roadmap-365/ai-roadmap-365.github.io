<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is a correctness requirement.">
  <title>Authorisation ordering</title>
  <style>
    .authz-bg   { fill: #f8fafc; }
    .authz-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authz-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authz-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authz-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authz-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authz-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .authz-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .authz-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .authz-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .authz-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .authz-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .authz-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .authz-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .authz-stage { opacity: 1; }

    .authz-s0 { animation-delay: 0.00s; }
    .authz-e0 { animation-delay: 0.00s; }
    .authz-s1 { animation-delay: 1.28s; }
    .authz-e1 { animation-delay: 1.28s; }
    .authz-s2 { animation-delay: 2.56s; }
    .authz-e2 { animation-delay: 2.56s; }
    .authz-s3 { animation-delay: 3.84s; }
    .authz-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .authz-conn  { animation: authz-trace 6.4s ease-in-out infinite; }
      .authz-stage { animation: authz-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes authz-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes authz-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .authz-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .authz-stage { animation: authz-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes authz-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="authz-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="authz-bg" width="980" height="322"/>
  <text class="authz-h1"  x="30" y="40">Authorisation ordering</text>
  <text class="authz-sub" x="30" y="64">Which is a correctness requirement.</text>
  <g class="authz-stage authz-s0">
    <rect class="authz-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="authz-step" x="44" y="142">01</text>
    <text class="authz-name" x="70" y="142">Retrieving first and filtering after leaks</text>
    <text class="authz-desc" x="44" y="166">The content already reached the</text>
    <text class="authz-desc" x="44" y="182">model, and the answer.</text>
  </g>
  <line class="authz-line authz-conn authz-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#authz-tip)"/>
  <g class="authz-stage authz-s1">
    <rect class="authz-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="authz-step" x="280" y="142">02</text>
    <text class="authz-name" x="306" y="142">Because the answer summarises what it saw</text>
    <text class="authz-desc" x="280" y="166">Redacting the citation does not</text>
    <text class="authz-desc" x="280" y="182">redact the summary.</text>
  </g>
  <line class="authz-line authz-conn authz-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#authz-tip)"/>
  <g class="authz-stage authz-s2">
    <rect class="authz-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="authz-step" x="516" y="142">03</text>
    <text class="authz-name" x="542" y="142">So filter in the retrieval query itself</text>
    <text class="authz-desc" x="516" y="166">By the caller's permissions, at</text>
    <text class="authz-desc" x="516" y="182">index level.</text>
  </g>
  <line class="authz-line authz-conn authz-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#authz-tip)"/>
  <g class="authz-stage authz-s3">
    <rect class="authz-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="authz-step" x="752" y="142">04</text>
    <text class="authz-name" x="778" y="142">And enforce it in one place</text>
    <text class="authz-desc" x="752" y="166">Not in each feature that queries</text>
    <text class="authz-desc" x="752" y="182">the index.</text>
  </g>
  <text class="authz-sub" x="30" y="304">This is the most consequential design decision in the lesson: a system that filters after generation has already leaked, whatever the interface displays.</text>
</svg>
