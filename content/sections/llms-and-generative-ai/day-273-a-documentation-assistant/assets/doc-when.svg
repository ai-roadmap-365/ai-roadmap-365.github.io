<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to improve the documentation instead.">
  <title>When to build one</title>
  <style>
    .doc-when-bg   { fill: #f8fafc; }
    .doc-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .doc-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .doc-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .doc-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .doc-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .doc-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .doc-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .doc-when-row { opacity: 1; }
    .doc-when-r0 { animation-delay: 0.00s; }
    .doc-when-r1 { animation-delay: 0.45s; }
    .doc-when-r2 { animation-delay: 0.90s; }
    .doc-when-r3 { animation-delay: 1.35s; }
    .doc-when-r4 { animation-delay: 1.80s; }
    .doc-when-row { animation: doc-when-reveal 7.3s ease-in-out infinite; }
    @keyframes doc-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="doc-when-bg" width="980" height="390"/>
  <text class="doc-when-h1"  x="30" y="40">When to build one</text>
  <text class="doc-when-sub" x="30" y="64">And when to improve the documentation instead.</text>
  <rect class="doc-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="doc-when-name" x="46" y="122">Build the assistant</text>
  <text class="doc-when-desc" x="46" y="142">Four signals.</text>
  <text class="doc-when-desc doc-when-row doc-when-r0" x="46" y="182">A large corpus people cannot navigate</text>
  <text class="doc-when-desc doc-when-row doc-when-r1" x="46" y="216">Repetitive questions with documented answers</text>
  <text class="doc-when-desc doc-when-row doc-when-r2" x="46" y="250">Content spread across many systems</text>
  <text class="doc-when-desc doc-when-row doc-when-r3" x="46" y="284">Where permissions vary by reader</text>
  <text class="doc-when-desc doc-when-row doc-when-r4" x="46" y="318">And the documentation is actually good</text>
  <rect class="doc-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="doc-when-name" x="526" y="122">Fix the documentation</text>
  <text class="doc-when-desc" x="526" y="142">Also four.</text>
  <text class="doc-when-desc doc-when-row doc-when-r0" x="526" y="182">A small corpus a search box covers</text>
  <text class="doc-when-desc doc-when-row doc-when-r1" x="526" y="216">Documentation that is wrong or missing</text>
  <text class="doc-when-desc doc-when-row doc-when-r2" x="526" y="250">Questions the material does not answer</text>
  <text class="doc-when-desc doc-when-row doc-when-r3" x="526" y="284">Where structure is the problem</text>
  <text class="doc-when-desc doc-when-row doc-when-r4" x="526" y="318">Because retrieval cannot invent content</text>
  <text class="doc-when-sub" x="30" y="372">Retrieval over bad documentation produces confident answers from bad documentation, which is the failure this column exists to prevent.</text>
</svg>
