questions:
  - question: 'Why must permission filtering happen inside the retrieval query rather than after it?'
    options:
      - 'Filtering afterwards returns results in the wrong ranking order'
      - 'A model that has seen a passage cannot be asked to unsee it'
      - 'The vector index cannot compute scores for filtered chunks'
      - 'Post-filtering breaks the citation numbering in the final answer'
    answer_index: 1
    explanation: 'Retrieving broadly and filtering later wastes the retrieval budget and leaves restricted content one bug away from the context window.'

  - question: 'Why is a confidently wrong answer to an uncovered question the most damaging failure?'
    options:
      - 'It cannot be detected by any automated evaluation metric'
      - 'It costs more tokens than an answer grounded in real context'
      - 'It destroys trust in every correct answer that came before it'
      - 'It causes the retrieval index to be rebuilt unnecessarily'
    answer_index: 2
    explanation: 'A user who catches one invention starts checking everything, at which point the assistant has negative value.'

  - question: 'What makes semantic caching riskier than exact-match caching?'
    options:
      - 'It invalidates the whole cache whenever one document changes'
      - 'It requires storing the full text of every previous answer'
      - 'It cannot be keyed by the requesting user''s permissions'
      - 'A near-miss serves a confident answer to a question nobody asked'
    answer_index: 3
    explanation: 'Serving a cached answer for a merely similar question is effective and can be wrong. A high threshold and permission-aware keys make it survivable.'

  - question: 'Why alert on the distribution of chunk staleness rather than on the indexer process?'
    options:
      - 'A job that runs and indexes nothing looks healthy from outside'
      - 'Process monitoring is unavailable in most container runtimes'
      - 'The distribution is cheaper to compute than a liveness check'
      - 'Staleness cannot be measured while the indexer is running'
    answer_index: 0
    explanation: 'Liveness says the process is alive. Recording indexed_at per chunk and watching the p95 measures whether the work actually happened.'

  - question: 'When is plain static search the better choice than a documentation assistant?'
    options:
      - 'When the corpus is too large for a user to skim by hand'
      - 'When a wrong answer is expensive and a missing answer is cheap'
      - 'When answers must draw on several documents at once'
      - 'When users cannot phrase queries in the documentation''s vocabulary'
    answer_index: 1
    explanation: 'Search fails visibly and never hallucinates; an assistant fails invisibly. That asymmetry should decide close cases.'
