questions:
  - question: 'What is the fundamental difference between parametric and non-parametric memory in LLM systems?'
    options:
      - 'Parametric memory is stored in static model weights, while non-parametric memory resides in external searchable databases retrieved at runtime'
      - 'Parametric memory requires internet access, while non-parametric memory runs only on GPUs'
      - 'Parametric memory only works with audio, while non-parametric memory works with text'
      - 'There is no functional difference between them'
    answer_index: 0
    explanation: 'Parametric memory is frozen during training, whereas non-parametric memory allows real-time dynamic knowledge updates without retraining.'
  - question: 'Why is Reciprocal Rank Fusion (RRF) preferred over raw score addition when combining BM25 and dense vector search results?'
    options:
      - 'Because BM25 scores are unbounded positive numbers while cosine similarity ranges from -1 to 1, making rank position fusion scale-invariant'
      - 'Because RRF reduces the time complexity of vector search from O(N) to O(1)'
      - 'Because RRF modifies the embedding model weights during search'
      - 'Because RRF encrypts the vector embeddings for privacy'
    answer_index: 0
    explanation: 'RRF uses rank positions (1 / (k + rank)) rather than unnormalized raw scores, allowing robust fusion across disparate scoring distributions.'
  - question: 'How does a Cross-Encoder re-ranker differ from a Bi-Encoder retriever?'
    options:
      - 'A Cross-Encoder feeds query and passage together into a single Transformer for full cross-attention token interaction, yielding higher precision at higher compute cost'
      - 'A Cross-Encoder only works on images'
      - 'A Bi-Encoder requires 100x more compute per candidate than a Cross-Encoder'
      - 'A Cross-Encoder does not use neural networks'
    answer_index: 0
    explanation: 'Cross-Encoders allow all query and passage tokens to attend to each other, producing superior relevance scores at the cost of higher latency.'
  - question: 'In the RAG Triad evaluation framework, what does the Faithfulness metric measure?'
    options:
      - 'The degree to which the synthesized answer is grounded strictly in the retrieved context passages without hallucinated claims'
      - 'The speed of the vector database index lookup'
      - 'The user satisfaction rating from 1 to 5 stars'
      - 'The size of the context window in kilobytes'
    answer_index: 0
    explanation: 'Faithfulness verifies that every factual claim in the generated answer can be directly inferred from the provided context.'
  - question: 'What is the primary benefit of small-to-big Parent-Document retrieval?'
    options:
      - 'Embedding small granular chunks for high retrieval precision while expanding to full parent documents for LLM context synthesis'
      - 'Compressing all images into thumbnails'
      - 'Replacing dense vectors with random integers'
      - 'Bypassing the tokenizer completely'
    answer_index: 0
    explanation: 'Small chunks match specific query nuances better in vector space, but larger parent documents provide sufficient context for coherent LLM generation.'
