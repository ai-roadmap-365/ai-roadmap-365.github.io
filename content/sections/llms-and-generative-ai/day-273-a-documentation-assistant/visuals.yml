visuals:
  - id: documentation-assistant-end-to-end-architecture
    file: assets/documentation-assistant-end-to-end-architecture.svg
    type: diagram
    title: 'Documentation Assistant Architecture'
    alt: Documentation Assistant Architecture diagram
    description: 'Architectural diagram illustrating the multi-stage RAG indexing, retrieval, and generation pipeline.'
  - id: rag-production-cache-and-fallback-flow
    file: assets/rag-production-cache-and-fallback-flow.svg
    type: diagram
    title: 'Production Cache and Fallback Flow'
    alt: Production Cache and Fallback Flow diagram
    description: 'Runtime dataflow diagram demonstrating query processing, hybrid search fusion, and grounded answer synthesis.'
  - id: doc-assistant-idea
    file: assets/doc-assistant-idea.svg
    type: diagram
    title: 'The documentation assistant'
    alt: 'Diagram: the five production requirements of a documentation assistant'
    description: 'A five-stage description of a documentation assistant covering freshness, authorisation, abstention, caching and degradation.'
  - id: freshness
    file: assets/freshness.svg
    type: diagram
    title: 'The freshness contract'
    alt: 'Diagram: the four elements of a documentation freshness guarantee'
    description: 'A four-stage description of a freshness contract covering the update interval, change detection, the stated guarantee and the staleness signal.'
  - id: authz
    file: assets/authz.svg
    type: diagram
    title: 'Authorisation ordering'
    alt: 'Diagram: why authorisation is applied before retrieval rather than after generation'
    description: 'A four-stage description of authorisation ordering covering post-filtering, the leak, pre-filtering and the enforcement point.'
  - id: abstention
    file: assets/abstention.svg
    type: diagram
    title: 'Designing abstention'
    alt: 'Diagram: the four elements of a well-designed abstention'
    description: 'A four-stage description of abstention covering the trigger, the message, the alternative and the record.'
  - id: two-caches
    file: assets/two-caches.svg
    type: diagram
    title: 'Two caches, two purposes'
    alt: 'Diagram: retrieval caching compared with answer caching'
    description: 'A two-column comparison of caching retrieval results against caching generated answers.'
  - id: degradation
    file: assets/degradation.svg
    type: diagram
    title: 'Planned degradation'
    alt: 'Diagram: the four failure modes of a documentation assistant and the planned response to each'
    description: 'A four-stage description of degradation planning covering index unavailability, model unavailability, timeouts and partial retrieval.'
  - id: reference-desk
    file: assets/reference-desk.svg
    type: diagram
    title: 'A reference desk'
    alt: 'Diagram: an assistant that always answers compared with one that knows its limits'
    description: 'A two-column comparison of a system that always answers against one that abstains appropriately.'
  - id: doc-implications
    file: assets/doc-implications.svg
    type: diagram
    title: 'Four consequences of a documentation assistant'
    alt: 'Diagram: the support, security, freshness and expectation implications of a documentation assistant'
    description: 'A four-stage description of documentation assistant implications covering support deflection, access control, staleness and user expectations.'
  - id: doc-when
    file: assets/doc-when.svg
    type: diagram
    title: 'When to build one'
    alt: 'Diagram: when a documentation assistant is the right investment'
    description: 'A two-column comparison of situations warranting a documentation assistant against alternatives.'
  - id: assistant-vs-search
    file: assets/assistant-vs-search.svg
    type: diagram
    title: 'An assistant against a search box'
    alt: 'Diagram: documentation search compared with a documentation assistant'
    description: 'A two-column comparison of a search interface against a generated-answer assistant.'
  - id: doc-history
    file: assets/doc-history.svg
    type: diagram
    title: 'Four steps to the documentation assistant'
    alt: 'Diagram: the historical progression of documentation search interfaces'
    description: 'A four-stage description of documentation interface history covering manual browsing, keyword search, semantic search and grounded answers.'
