terms:
- term: PagedAttention
  definition: An attention algorithm that stores KV cache tensors in non-contiguous physical memory blocks
    managed via virtual page tables.
- term: Continuous Batching
  definition: An iteration-level scheduling mechanism that dynamically adds new requests and removes completed
    requests on every forward pass.
- term: KV Cache (Key-Value Cache)
  definition: Cached attention key and value projection tensors stored in GPU memory to avoid recomputing
    past tokens during autoregressive generation.
- term: Tensor Parallelism (TP)
  definition: Sharding individual weight matrices across multiple GPUs with intra-node All-Reduce communication.
- term: Pipeline Parallelism (PP)
  definition: Assigning sequential transformer layers across multiple GPUs or nodes.
- term: Prefix Caching
  definition: Reusing pre-computed KV attention blocks for static prompt prefixes shared across multiple
    requests.
- term: Time-To-First-Token (TTFT)
  definition: The latency required to process the input prompt (prefill phase) and emit the very first
    output token.
- term: Inter-Token Latency (ITL)
  definition: The time duration required to compute and stream each subsequent generated token during
    the decode phase.
