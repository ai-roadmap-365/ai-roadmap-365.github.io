<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="When requests can leave.">
  <title>Static batching against continuous</title>
  <style>
    .continuous-batching-bg   { fill: #f8fafc; }
    .continuous-batching-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-batching-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-batching-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-batching-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-batching-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .continuous-batching-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .continuous-batching-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .continuous-batching-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .continuous-batching-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .continuous-batching-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .continuous-batching-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .continuous-batching-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .continuous-batching-row { opacity: 1; }
    .continuous-batching-r0 { animation-delay: 0.00s; }
    .continuous-batching-r1 { animation-delay: 0.45s; }
    .continuous-batching-r2 { animation-delay: 0.90s; }
    .continuous-batching-r3 { animation-delay: 1.35s; }
    .continuous-batching-r4 { animation-delay: 1.80s; }
    .continuous-batching-row { animation: continuous-batching-reveal 7.3s ease-in-out infinite; }
    @keyframes continuous-batching-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="continuous-batching-bg" width="980" height="390"/>
  <text class="continuous-batching-h1"  x="30" y="40">Static batching against continuous</text>
  <text class="continuous-batching-sub" x="30" y="64">When requests can leave.</text>
  <rect class="continuous-batching-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="continuous-batching-name" x="46" y="122">Static batching</text>
  <text class="continuous-batching-desc" x="46" y="142">The batch moves together.</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r0" x="46" y="182">A batch is formed, then run to completion</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r1" x="46" y="216">Short requests wait for the longest</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r2" x="46" y="250">Finished slots sit idle</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r3" x="46" y="284">New requests wait for the next batch</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r4" x="46" y="318">Throughput collapses on mixed lengths</text>
  <rect class="continuous-batching-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="continuous-batching-name" x="526" y="122">Continuous batching</text>
  <text class="continuous-batching-desc" x="526" y="142">Slots free immediately.</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r0" x="526" y="182">Requests join and leave per step</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r1" x="526" y="216">A finished request frees its slot at once</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r2" x="526" y="250">Slots are refilled immediately</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r3" x="526" y="284">New requests start within a step</text>
  <text class="continuous-batching-desc continuous-batching-row continuous-batching-r4" x="526" y="318">Several times the throughput</text>
  <text class="continuous-batching-sub" x="30" y="372">Head-of-line blocking is what makes the naive version so much worse in practice: one long generation holds an entire batch of short ones hostage.</text>
</svg>
