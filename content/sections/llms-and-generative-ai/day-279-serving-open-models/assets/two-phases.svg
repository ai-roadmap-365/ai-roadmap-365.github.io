<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is why serving is hard.">
  <title>Two phases, two bottlenecks</title>
  <style>
    .two-phases-bg   { fill: #f8fafc; }
    .two-phases-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phases-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phases-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phases-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phases-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phases-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-phases-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-phases-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-phases-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-phases-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-phases-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-phases-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .two-phases-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .two-phases-stage { opacity: 1; }

    .two-phases-s0 { animation-delay: 0.00s; }
    .two-phases-e0 { animation-delay: 0.00s; }
    .two-phases-s1 { animation-delay: 1.28s; }
    .two-phases-e1 { animation-delay: 1.28s; }
    .two-phases-s2 { animation-delay: 2.56s; }
    .two-phases-e2 { animation-delay: 2.56s; }
    .two-phases-s3 { animation-delay: 3.84s; }
    .two-phases-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .two-phases-conn  { animation: two-phases-trace 6.4s ease-in-out infinite; }
      .two-phases-stage { animation: two-phases-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes two-phases-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes two-phases-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .two-phases-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .two-phases-stage { animation: two-phases-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes two-phases-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="two-phases-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="two-phases-bg" width="980" height="322"/>
  <text class="two-phases-h1"  x="30" y="40">Two phases, two bottlenecks</text>
  <text class="two-phases-sub" x="30" y="64">Which is why serving is hard.</text>
  <g class="two-phases-stage two-phases-s0">
    <rect class="two-phases-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="two-phases-step" x="44" y="142">01</text>
    <text class="two-phases-name" x="70" y="142">Prefill processes the whole prompt at once</text>
    <text class="two-phases-desc" x="44" y="166">Parallel, and compute bound.</text>
  </g>
  <line class="two-phases-line two-phases-conn two-phases-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#two-phases-tip)"/>
  <g class="two-phases-stage two-phases-s1">
    <rect class="two-phases-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="two-phases-step" x="280" y="142">02</text>
    <text class="two-phases-name" x="306" y="142">Saturating the arithmetic units</text>
    <text class="two-phases-desc" x="280" y="166">Fast, even for long prompts.</text>
  </g>
  <line class="two-phases-line two-phases-conn two-phases-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#two-phases-tip)"/>
  <g class="two-phases-stage two-phases-s2">
    <rect class="two-phases-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="two-phases-step" x="516" y="142">03</text>
    <text class="two-phases-name" x="542" y="142">Decode produces one token at a time</text>
    <text class="two-phases-desc" x="516" y="166">Sequential, and memory-bandwidth</text>
    <text class="two-phases-desc" x="516" y="182">bound.</text>
  </g>
  <line class="two-phases-line two-phases-conn two-phases-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#two-phases-tip)"/>
  <g class="two-phases-stage two-phases-s3">
    <rect class="two-phases-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="two-phases-step" x="752" y="142">04</text>
    <text class="two-phases-name" x="778" y="142">Leaving compute idle while waiting on memory</text>
    <text class="two-phases-desc" x="752" y="166">Which batching is what fills.</text>
  </g>
  <text class="two-phases-sub" x="30" y="304">A server must schedule two workloads with opposite characteristics, which is the underlying reason serving engines are more than a loop around a model.</text>
</svg>
