<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Paging the attention cache</title>
  <style>
    .paged-blocks-bg   { fill: #f8fafc; }
    .paged-blocks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-blocks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-blocks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-blocks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-blocks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-blocks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .paged-blocks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .paged-blocks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .paged-blocks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .paged-blocks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .paged-blocks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .paged-blocks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .paged-blocks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .paged-blocks-stage { opacity: 1; }

    .paged-blocks-s0 { animation-delay: 0.00s; }
    .paged-blocks-e0 { animation-delay: 0.00s; }
    .paged-blocks-s1 { animation-delay: 1.28s; }
    .paged-blocks-e1 { animation-delay: 1.28s; }
    .paged-blocks-s2 { animation-delay: 2.56s; }
    .paged-blocks-e2 { animation-delay: 2.56s; }
    .paged-blocks-s3 { animation-delay: 3.84s; }
    .paged-blocks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .paged-blocks-conn  { animation: paged-blocks-trace 6.4s ease-in-out infinite; }
      .paged-blocks-stage { animation: paged-blocks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes paged-blocks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes paged-blocks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .paged-blocks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .paged-blocks-stage { animation: paged-blocks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes paged-blocks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="paged-blocks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="paged-blocks-bg" width="980" height="322"/>
  <text class="paged-blocks-h1"  x="30" y="40">Paging the attention cache</text>
  <text class="paged-blocks-sub" x="30" y="64">Four steps.</text>
  <g class="paged-blocks-stage paged-blocks-s0">
    <rect class="paged-blocks-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="paged-blocks-step" x="44" y="142">01</text>
    <text class="paged-blocks-name" x="70" y="142">Reserving the maximum length per request wastes most of it</text>
    <text class="paged-blocks-desc" x="44" y="166">A short request holds capacity</text>
    <text class="paged-blocks-desc" x="44" y="182">for a long one.</text>
  </g>
  <line class="paged-blocks-line paged-blocks-conn paged-blocks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#paged-blocks-tip)"/>
  <g class="paged-blocks-stage paged-blocks-s1">
    <rect class="paged-blocks-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="paged-blocks-step" x="280" y="142">02</text>
    <text class="paged-blocks-name" x="306" y="142">Allocate fixed-size blocks on demand instead</text>
    <text class="paged-blocks-desc" x="280" y="166">With a per-sequence table</text>
    <text class="paged-blocks-desc" x="280" y="182">mapping to them.</text>
  </g>
  <line class="paged-blocks-line paged-blocks-conn paged-blocks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#paged-blocks-tip)"/>
  <g class="paged-blocks-stage paged-blocks-s2">
    <rect class="paged-blocks-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="paged-blocks-step" x="516" y="142">03</text>
    <text class="paged-blocks-name" x="542" y="142">So waste is bounded by one block</text>
    <text class="paged-blocks-desc" x="516" y="166">Rather than by the maximum</text>
    <text class="paged-blocks-desc" x="516" y="182">length.</text>
  </g>
  <line class="paged-blocks-line paged-blocks-conn paged-blocks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#paged-blocks-tip)"/>
  <g class="paged-blocks-stage paged-blocks-s3">
    <rect class="paged-blocks-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="paged-blocks-step" x="752" y="142">04</text>
    <text class="paged-blocks-name" x="778" y="142">And identical prefixes share physical blocks</text>
    <text class="paged-blocks-desc" x="752" y="166">Copy-on-write, exactly as an</text>
    <text class="paged-blocks-desc" x="752" y="182">operating system does.</text>
  </g>
  <text class="paged-blocks-sub" x="30" y="304">This is Day 003's virtual memory applied to attention state, and it produced several-fold gains in concurrency without touching the model at all.</text>
</svg>
