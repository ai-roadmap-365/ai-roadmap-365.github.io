questions:
- question: What primary problem in transformer inference does PagedAttention solve?
  options:
  - It accelerates floating-point gradient descent during pretraining
  - It compresses PDF documents into Markdown
  - It automatically translates Python code into C++
  - 'It removes the fragmentation from reserving max-length caches'
  answer_index: 3
  explanation: PagedAttention treats the Key-Value (KV) cache like virtual memory pages in an operating
    system. It stores KV tensors in non-contiguous physical blocks, reducing memory waste from 60-80%
    down to under 4%.
- question: How does Continuous (Iteration-Level) Batching differ from legacy Static Batching?
  options:
  - 'Continuous batching swaps requests in at token level'
  - Static batching processes one request per day; continuous batching runs 24/7
  - Continuous batching only runs on Apple Silicon
  - Static batching does not use GPUs
  answer_index: 0
  explanation: Continuous batching schedules execution at the level of individual token generation iterations.
    When a sequence finishes emitting tokens, its memory is freed immediately and a waiting request enters
    the active batch without stalling.
- question: What is Tensor Parallelism (TP) in multi-GPU LLM serving?
  options:
  - Training multiple different models on separate GPUs
  - 'Splitting weight matrices across GPUs over NVLink'
  - Running inference on CPU and GPU concurrently
  - Compressing models into ZIP files
  answer_index: 1
  explanation: Tensor Parallelism shards individual layer matrices across multiple GPUs (e.g. 2, 4, or
    8 GPUs in an NVLink mesh), computing attention and MLP projections in parallel with All-Reduce communication.
- question: Why is Prefix Caching especially valuable in multi-turn conversations and system-prompt heavy
    applications?
  options:
  - It deletes old messages to save memory
  - It forces all users to send identical prompts
  - 'It reuses cached KV blocks for shared prefixes'
  - It bypasses model tokenization
  answer_index: 2
  explanation: Prefix caching identifies shared token prefixes across requests (such as static system
    prompts or previous conversation turns) and directly references their existing KV blocks in memory,
    slashing Time-To-First-Token.
- question: Which open-source inference engine pioneered PagedAttention and is considered the standard
    for high-throughput enterprise LLM serving?
  options:
  - PyTorch TorchScript
  - SQLite
  - Nginx
  - vLLM
  answer_index: 3
  explanation: vLLM, developed by UC Berkeley (Kwon et al., 2023), introduced PagedAttention and continuous
    batching, achieving 2x to 4x higher throughput than Hugging Face TGI and legacy serving engines.
