<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three outcomes, not two.">
  <title>Checking entailment</title>
  <style>
    .entailment-bg   { fill: #f8fafc; }
    .entailment-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entailment-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entailment-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entailment-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entailment-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entailment-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .entailment-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .entailment-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .entailment-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .entailment-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .entailment-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .entailment-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .entailment-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .entailment-stage { opacity: 1; }

    .entailment-s0 { animation-delay: 0.00s; }
    .entailment-e0 { animation-delay: 0.00s; }
    .entailment-s1 { animation-delay: 1.50s; }
    .entailment-e1 { animation-delay: 1.50s; }
    .entailment-s2 { animation-delay: 3.00s; }
    .entailment-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .entailment-conn  { animation: entailment-trace 6s ease-in-out infinite; }
      .entailment-stage { animation: entailment-arrive 6s ease-in-out infinite; }
    }
    @keyframes entailment-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes entailment-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .entailment-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .entailment-stage { animation: entailment-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes entailment-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="entailment-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="entailment-bg" width="980" height="322"/>
  <text class="entailment-h1"  x="30" y="40">Checking entailment</text>
  <text class="entailment-sub" x="30" y="64">Three outcomes, not two.</text>
  <g class="entailment-stage entailment-s0">
    <rect class="entailment-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="entailment-step" x="44" y="142">01</text>
    <text class="entailment-name" x="70" y="142">Supported</text>
    <text class="entailment-desc" x="44" y="166">The sentence entails the claim. Cite it.</text>
  </g>
  <line class="entailment-line entailment-conn entailment-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#entailment-tip)"/>
  <g class="entailment-stage entailment-s1">
    <rect class="entailment-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="entailment-step" x="359" y="142">02</text>
    <text class="entailment-name" x="385" y="142">Contradicted</text>
    <text class="entailment-desc" x="359" y="166">The sentence says otherwise. A serious</text>
    <text class="entailment-desc" x="359" y="182">failure.</text>
  </g>
  <line class="entailment-line entailment-conn entailment-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#entailment-tip)"/>
  <g class="entailment-stage entailment-s2">
    <rect class="entailment-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="entailment-step" x="674" y="142">03</text>
    <text class="entailment-name" x="700" y="142">Absent</text>
    <text class="entailment-desc" x="674" y="166">The sentence neither supports nor</text>
    <text class="entailment-desc" x="674" y="182">contradicts. Not a citation.</text>
  </g>
  <text class="entailment-sub" x="30" y="304">Collapsing absent into contradicted is a common mistake in these checks: most unsupported claims are simply not addressed by the sources rather than refuted by them.</text>
</svg>
