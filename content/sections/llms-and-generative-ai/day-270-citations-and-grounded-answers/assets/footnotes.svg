<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And footnotes that were not.">
  <title>Footnotes that were checked</title>
  <style>
    .footnotes-bg   { fill: #f8fafc; }
    .footnotes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .footnotes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .footnotes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .footnotes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .footnotes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .footnotes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .footnotes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .footnotes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .footnotes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .footnotes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .footnotes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .footnotes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .footnotes-row { opacity: 1; }
    .footnotes-r0 { animation-delay: 0.00s; }
    .footnotes-r1 { animation-delay: 0.45s; }
    .footnotes-r2 { animation-delay: 0.90s; }
    .footnotes-r3 { animation-delay: 1.35s; }
    .footnotes-r4 { animation-delay: 1.80s; }
    .footnotes-row { animation: footnotes-reveal 7.3s ease-in-out infinite; }
    @keyframes footnotes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="footnotes-bg" width="980" height="390"/>
  <text class="footnotes-h1"  x="30" y="40">Footnotes that were checked</text>
  <text class="footnotes-sub" x="30" y="64">And footnotes that were not.</text>
  <rect class="footnotes-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="footnotes-name" x="46" y="122">Unchecked</text>
  <text class="footnotes-desc" x="46" y="142">Looks rigorous.</text>
  <text class="footnotes-desc footnotes-row footnotes-r0" x="46" y="182">A reference after every claim</text>
  <text class="footnotes-desc footnotes-row footnotes-r1" x="46" y="216">Nobody read the sources</text>
  <text class="footnotes-desc footnotes-row footnotes-r2" x="46" y="250">Some do not say what is claimed</text>
  <text class="footnotes-desc footnotes-row footnotes-r3" x="46" y="284">Trust raised without cause</text>
  <text class="footnotes-desc footnotes-row footnotes-r4" x="46" y="318">Worse than no citations at all</text>
  <rect class="footnotes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="footnotes-name" x="526" y="122">Checked</text>
  <text class="footnotes-desc" x="526" y="142">Is rigorous.</text>
  <text class="footnotes-desc footnotes-row footnotes-r0" x="526" y="182">Each reference verified against the text</text>
  <text class="footnotes-desc footnotes-row footnotes-r1" x="526" y="216">Unsupported claims removed</text>
  <text class="footnotes-desc footnotes-row footnotes-r2" x="526" y="250">What remains can be confirmed</text>
  <text class="footnotes-desc footnotes-row footnotes-r3" x="526" y="284">Trust earned per claim</text>
  <text class="footnotes-desc footnotes-row footnotes-r4" x="526" y="318">Which is what a citation is for</text>
  <text class="footnotes-sub" x="30" y="372">Unchecked citations being worse than none is the important claim here: they transfer the appearance of verification without any of the substance.</text>
</svg>
