visuals:
  - id: inline-citation-attribution-flow
    file: assets/inline-citation-attribution-flow.svg
    type: diagram
    title: 'Inline Citation Attribution Flow'
    alt: Inline Citation Attribution Flow diagram
    description: 'Architectural diagram illustrating the multi-stage RAG indexing, retrieval, and generation pipeline.'
  - id: claim-level-grounding-verification-matrix
    file: assets/claim-level-grounding-verification-matrix.svg
    type: diagram
    title: 'Claim-Level Grounding Verification Matrix'
    alt: Claim-Level Grounding Verification Matrix diagram
    description: 'Runtime dataflow diagram demonstrating query processing, hybrid search fusion, and grounded answer synthesis.'
  - id: citation-idea
    file: assets/citation-idea.svg
    type: diagram
    title: 'What a real citation requires'
    alt: 'Diagram: the four steps that turn a claimed citation into a verified one'
    description: 'A four-stage description of citation verification covering claim splitting, source indexing, entailment checking and enforcement.'
  - id: claim-split
    file: assets/claim-split.svg
    type: diagram
    title: 'Splitting into claims'
    alt: 'Diagram: the four properties of splitting an answer into verifiable claims'
    description: 'A four-stage description of claim splitting covering atomicity, self-containment, coverage and non-claims.'
  - id: entailment
    file: assets/entailment.svg
    type: diagram
    title: 'Checking entailment'
    alt: 'Diagram: the three possible relationships between a claim and a source sentence'
    description: 'A three-stage description of entailment checking covering support, contradiction and absence.'
  - id: enforce
    file: assets/enforce.svg
    type: diagram
    title: 'Enforcement'
    alt: 'Diagram: the four possible responses to an unsupported claim in a generated answer'
    description: 'A four-stage description of citation enforcement covering removal, regeneration, flagging and refusal.'
  - id: precision-recall-cite
    file: assets/precision-recall-cite.svg
    type: diagram
    title: 'Two citation failures'
    alt: 'Diagram: citation precision compared with citation recall'
    description: 'A two-column comparison of citation precision against citation recall.'
  - id: footnotes
    file: assets/footnotes.svg
    type: diagram
    title: 'Footnotes that were checked'
    alt: 'Diagram: unchecked references compared with verified ones'
    description: 'A two-column comparison of decorative citations against verified ones.'
  - id: citation-implications
    file: assets/citation-implications.svg
    type: diagram
    title: 'Four consequences of verified citations'
    alt: 'Diagram: the trust, cost, latency and coverage implications of citation verification'
    description: 'A four-stage description of citation implications covering trust, verification cost, added latency and reduced answer coverage.'
  - id: citation-when
    file: assets/citation-when.svg
    type: diagram
    title: 'When to verify citations'
    alt: 'Diagram: when citation verification is warranted'
    description: 'A two-column comparison of situations requiring verified citations against those where claimed citations suffice.'
  - id: sentence-index
    file: assets/sentence-index.svg
    type: diagram
    title: 'Indexing sources by sentence'
    alt: 'Diagram: why retrieved context is indexed by sentence rather than by document'
    description: 'A four-stage description of sentence-level indexing covering document-level citation, its weakness, sentence splitting and the resulting precision.'
  - id: citation-history
    file: assets/citation-history.svg
    type: diagram
    title: 'Two eras of grounding'
    alt: 'Diagram: prompted citations compared with verified citation pipelines'
    description: 'A two-column comparison of asking a model to cite against verifying the citations it produces.'
