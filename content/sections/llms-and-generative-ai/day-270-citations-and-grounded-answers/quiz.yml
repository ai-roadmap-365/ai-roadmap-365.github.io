questions:
  - question: 'What makes a decorated citation more dangerous than no citation at all?'
    options:
      - 'It prevents the answer from being cached by the retrieval layer'
      - 'It takes longer for the model to generate than an uncited answer'
      - 'It carries the visual signature of rigour while pointing at the wrong text'
      - 'It makes the answer fail schema validation before display'
    answer_index: 2
    explanation: 'Users trust cited answers more. A citation that resolves but does not support its claim converts that trust into a liability.'

  - question: 'Why does the lesson insist on sentence-level rather than document-level citations?'
    options:
      - 'Most retrieval systems cannot return a whole document'
      - 'Documents cannot be assigned stable identifiers across re-indexing'
      - 'Sentence embeddings are cheaper to compute than document embeddings'
      - 'Verification has to take seconds, or nobody performs it'
    answer_index: 3
    explanation: 'Citing a 300-page document is formally a citation and practically useless. The value of a pointer is entirely in how narrow it is.'

  - question: 'Why are citation precision and recall reported separately rather than averaged?'
    options:
      - 'They fail independently, and a blend hides the failure you are hunting'
      - 'Precision is measured offline while recall can only be measured live'
      - 'Averaging them would exceed the range permitted for a percentage'
      - 'Recall requires a gold answer set and precision does not'
    answer_index: 0
    explanation: 'A model that tags every sentence [1] has perfect recall and terrible precision; one that cites only the obvious claim has the reverse.'

  - question: 'A stored citation still resolves after re-indexing, but chunk boundaries moved. What is the risk?'
    options:
      - 'The answer can no longer be displayed to the user at all'
      - 'The citation now points at different text than when the answer was written'
      - 'The retrieval index rejects any query touching that chunk'
      - 'The citation marker changes from [2] to a different number'
    answer_index: 1
    explanation: 'A live, resolvable citation can still be wrong. Storing a hash of the cited sentence distinguishes still correct from still resolves.'

  - question: 'What does a grounding check guarantee, and what does it not?'
    options:
      - 'That the source is current; not that it is authoritative'
      - 'That the answer is factually true; not that it is well written'
      - 'That the context says this; not that the context is correct'
      - 'That the model used retrieval; not which passage it used'
    answer_index: 2
    explanation: 'Grounding is a containment property. A perfectly grounded answer drawn from an out-of-date document is confidently wrong.'
