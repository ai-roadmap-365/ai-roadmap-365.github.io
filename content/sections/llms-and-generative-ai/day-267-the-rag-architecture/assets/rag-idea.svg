<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Why retrieval instead of training</title>
  <style>
    .rag-idea-bg   { fill: #f8fafc; }
    .rag-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rag-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rag-idea-stage { opacity: 1; }

    .rag-idea-s0 { animation-delay: 0.00s; }
    .rag-idea-e0 { animation-delay: 0.00s; }
    .rag-idea-s1 { animation-delay: 1.28s; }
    .rag-idea-e1 { animation-delay: 1.28s; }
    .rag-idea-s2 { animation-delay: 2.56s; }
    .rag-idea-e2 { animation-delay: 2.56s; }
    .rag-idea-s3 { animation-delay: 3.84s; }
    .rag-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rag-idea-conn  { animation: rag-idea-trace 6.4s ease-in-out infinite; }
      .rag-idea-stage { animation: rag-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rag-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rag-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rag-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rag-idea-stage { animation: rag-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rag-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rag-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rag-idea-bg" width="980" height="322"/>
  <text class="rag-idea-h1"  x="30" y="40">Why retrieval instead of training</text>
  <text class="rag-idea-sub" x="30" y="64">Four reasons.</text>
  <g class="rag-idea-stage rag-idea-s0">
    <rect class="rag-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rag-idea-step" x="44" y="142">01</text>
    <text class="rag-idea-name" x="70" y="142">The model does not know your documents</text>
    <text class="rag-idea-desc" x="44" y="166">And cannot, since they were not</text>
    <text class="rag-idea-desc" x="44" y="182">in its training data.</text>
  </g>
  <line class="rag-idea-line rag-idea-conn rag-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rag-idea-tip)"/>
  <g class="rag-idea-stage rag-idea-s1">
    <rect class="rag-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rag-idea-step" x="280" y="142">02</text>
    <text class="rag-idea-name" x="306" y="142">Training them in is slow, expensive and repeated</text>
    <text class="rag-idea-desc" x="280" y="166">Every change means another run.</text>
  </g>
  <line class="rag-idea-line rag-idea-conn rag-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rag-idea-tip)"/>
  <g class="rag-idea-stage rag-idea-s2">
    <rect class="rag-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rag-idea-step" x="516" y="142">03</text>
    <text class="rag-idea-name" x="542" y="142">Retrieve the relevant passages instead</text>
    <text class="rag-idea-desc" x="516" y="166">And supply them with the</text>
    <text class="rag-idea-desc" x="516" y="182">question.</text>
  </g>
  <line class="rag-idea-line rag-idea-conn rag-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rag-idea-tip)"/>
  <g class="rag-idea-stage rag-idea-s3">
    <rect class="rag-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rag-idea-step" x="752" y="142">04</text>
    <text class="rag-idea-name" x="778" y="142">So knowledge updates are a data operation</text>
    <text class="rag-idea-desc" x="752" y="166">Immediate, auditable, and</text>
    <text class="rag-idea-desc" x="752" y="182">revocable.</text>
  </g>
  <text class="rag-idea-sub" x="30" y="304">Revocability is the property that is easy to overlook: a document removed from an index is genuinely gone, where a fact trained into weights is not straightforwardly removable.</text>
</svg>
