<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different problems.">
  <title>Retrieval against fine-tuning</title>
  <style>
    .rag-vs-finetune-bg   { fill: #f8fafc; }
    .rag-vs-finetune-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-finetune-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-finetune-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-finetune-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-finetune-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-finetune-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-vs-finetune-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-vs-finetune-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-vs-finetune-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-vs-finetune-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-vs-finetune-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-vs-finetune-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-vs-finetune-row { opacity: 1; }
    .rag-vs-finetune-r0 { animation-delay: 0.00s; }
    .rag-vs-finetune-r1 { animation-delay: 0.45s; }
    .rag-vs-finetune-r2 { animation-delay: 0.90s; }
    .rag-vs-finetune-r3 { animation-delay: 1.35s; }
    .rag-vs-finetune-r4 { animation-delay: 1.80s; }
    .rag-vs-finetune-row { animation: rag-vs-finetune-reveal 7.3s ease-in-out infinite; }
    @keyframes rag-vs-finetune-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rag-vs-finetune-bg" width="980" height="390"/>
  <text class="rag-vs-finetune-h1"  x="30" y="40">Retrieval against fine-tuning</text>
  <text class="rag-vs-finetune-sub" x="30" y="64">Different problems.</text>
  <rect class="rag-vs-finetune-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rag-vs-finetune-name" x="46" y="122">Retrieval</text>
  <text class="rag-vs-finetune-desc" x="46" y="142">Supplies knowledge.</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r0" x="46" y="182">Adds facts the model lacks</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r1" x="46" y="216">Updated by changing documents</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r2" x="46" y="250">Sources citable and checkable</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r3" x="46" y="284">Costs tokens on every request</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r4" x="46" y="318">Cannot change tone or format</text>
  <rect class="rag-vs-finetune-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rag-vs-finetune-name" x="526" y="122">Fine-tuning</text>
  <text class="rag-vs-finetune-desc" x="526" y="142">Shapes behaviour.</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r0" x="526" y="182">Changes style, format and task habits</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r1" x="526" y="216">Updated by retraining</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r2" x="526" y="250">Nothing to cite</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r3" x="526" y="284">Costs once, then nothing per request</text>
  <text class="rag-vs-finetune-desc rag-vs-finetune-row rag-vs-finetune-r4" x="526" y="318">Poor at adding facts</text>
  <text class="rag-vs-finetune-sub" x="30" y="372">Fine-tuning to teach a model facts is the most common architectural mistake in this area: it is expensive, unreliable, and retrieval does it better and cheaper.</text>
</svg>
