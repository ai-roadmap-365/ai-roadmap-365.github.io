<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Two retrievers, one list</title>
  <style>
    .hybrid-fusion-bg   { fill: #f8fafc; }
    .hybrid-fusion-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-fusion-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-fusion-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-fusion-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-fusion-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-fusion-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hybrid-fusion-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hybrid-fusion-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hybrid-fusion-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hybrid-fusion-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hybrid-fusion-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hybrid-fusion-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hybrid-fusion-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hybrid-fusion-stage { opacity: 1; }

    .hybrid-fusion-s0 { animation-delay: 0.00s; }
    .hybrid-fusion-e0 { animation-delay: 0.00s; }
    .hybrid-fusion-s1 { animation-delay: 1.28s; }
    .hybrid-fusion-e1 { animation-delay: 1.28s; }
    .hybrid-fusion-s2 { animation-delay: 2.56s; }
    .hybrid-fusion-e2 { animation-delay: 2.56s; }
    .hybrid-fusion-s3 { animation-delay: 3.84s; }
    .hybrid-fusion-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hybrid-fusion-conn  { animation: hybrid-fusion-trace 6.4s ease-in-out infinite; }
      .hybrid-fusion-stage { animation: hybrid-fusion-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hybrid-fusion-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hybrid-fusion-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hybrid-fusion-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hybrid-fusion-stage { animation: hybrid-fusion-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hybrid-fusion-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hybrid-fusion-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hybrid-fusion-bg" width="980" height="322"/>
  <text class="hybrid-fusion-h1"  x="30" y="40">Two retrievers, one list</text>
  <text class="hybrid-fusion-sub" x="30" y="64">Four steps.</text>
  <g class="hybrid-fusion-stage hybrid-fusion-s0">
    <rect class="hybrid-fusion-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-fusion-step" x="44" y="142">01</text>
    <text class="hybrid-fusion-name" x="70" y="142">Search both indexes in parallel</text>
    <text class="hybrid-fusion-desc" x="44" y="166">Lexical and dense,</text>
    <text class="hybrid-fusion-desc" x="44" y="182">independently.</text>
  </g>
  <line class="hybrid-fusion-line hybrid-fusion-conn hybrid-fusion-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hybrid-fusion-tip)"/>
  <g class="hybrid-fusion-stage hybrid-fusion-s1">
    <rect class="hybrid-fusion-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-fusion-step" x="280" y="142">02</text>
    <text class="hybrid-fusion-name" x="306" y="142">Their scores cannot be compared</text>
    <text class="hybrid-fusion-desc" x="280" y="166">Different scales, different</text>
    <text class="hybrid-fusion-desc" x="280" y="182">meanings.</text>
  </g>
  <line class="hybrid-fusion-line hybrid-fusion-conn hybrid-fusion-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hybrid-fusion-tip)"/>
  <g class="hybrid-fusion-stage hybrid-fusion-s2">
    <rect class="hybrid-fusion-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-fusion-step" x="516" y="142">03</text>
    <text class="hybrid-fusion-name" x="542" y="142">So combine by position instead</text>
    <text class="hybrid-fusion-desc" x="516" y="166">Reciprocal of rank, summed</text>
    <text class="hybrid-fusion-desc" x="516" y="182">across both lists.</text>
  </g>
  <line class="hybrid-fusion-line hybrid-fusion-conn hybrid-fusion-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hybrid-fusion-tip)"/>
  <g class="hybrid-fusion-stage hybrid-fusion-s3">
    <rect class="hybrid-fusion-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-fusion-step" x="752" y="142">04</text>
    <text class="hybrid-fusion-name" x="778" y="142">Producing one candidate set</text>
    <text class="hybrid-fusion-desc" x="752" y="166">Favouring documents both methods</text>
    <text class="hybrid-fusion-desc" x="752" y="182">ranked highly.</text>
  </g>
  <text class="hybrid-fusion-sub" x="30" y="304">Fusing by rank rather than by score is what makes this work without tuning, which matters because the calibration would otherwise have to be redone per corpus.</text>
</svg>
