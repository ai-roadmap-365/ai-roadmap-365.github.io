visuals:
  - id: rag-three-stage-architecture-pipeline
    file: assets/rag-three-stage-architecture-pipeline.svg
    type: diagram
    title: 'RAG Three-Stage Architecture Pipeline'
    alt: RAG Three-Stage Architecture Pipeline diagram
    description: 'Architectural diagram illustrating the multi-stage RAG indexing, retrieval, and generation pipeline.'
  - id: rag-context-stuffing-vs-needle-retrieval
    file: assets/rag-context-stuffing-vs-needle-retrieval.svg
    type: diagram
    title: 'Context Stuffing vs Needle Retrieval'
    alt: Context Stuffing vs Needle Retrieval diagram
    description: 'Runtime dataflow diagram demonstrating query processing, hybrid search fusion, and grounded answer synthesis.'
  - id: rag-idea
    file: assets/rag-idea.svg
    type: diagram
    title: 'Why retrieval instead of training'
    alt: 'Diagram: why knowledge is supplied by retrieval rather than trained into the model'
    description: 'A four-stage description of the case for retrieval covering the knowledge problem, the training alternative, the retrieval approach and the resulting properties.'
  - id: rag-vs-finetune
    file: assets/rag-vs-finetune.svg
    type: diagram
    title: 'Retrieval against fine-tuning'
    alt: 'Diagram: retrieval compared with fine-tuning as ways to adapt a model'
    description: 'A two-column comparison of retrieval against fine-tuning.'
  - id: rag-stages
    file: assets/rag-stages.svg
    type: diagram
    title: 'Where quality is decided'
    alt: 'Diagram: how each stage of a retrieval pipeline caps the stages after it'
    description: 'A four-stage description of compounding quality covering parsing, chunking, retrieval and generation.'
  - id: rag-history
    file: assets/rag-history.svg
    type: diagram
    title: 'Four steps to retrieval-augmented generation'
    alt: 'Diagram: the historical progression toward retrieval-augmented generation'
    description: 'A four-stage description of retrieval-augmented generation history covering search engines, open-domain question answering, the named architecture and production standardisation.'
  - id: expert-with-library
    file: assets/expert-with-library.svg
    type: diagram
    title: 'An expert with a library'
    alt: 'Diagram: answering from memory compared with answering from consulted sources'
    description: 'A two-column comparison of an expert answering from memory against one consulting references.'
  - id: rag-implications
    file: assets/rag-implications.svg
    type: diagram
    title: 'Four consequences of retrieval architecture'
    alt: 'Diagram: the accuracy, cost, permission and freshness implications of retrieval-augmented generation'
    description: 'A four-stage description of retrieval implications covering accuracy, token cost, access control and content freshness.'
  - id: rag-when
    file: assets/rag-when.svg
    type: diagram
    title: 'When to use retrieval'
    alt: 'Diagram: when retrieval-augmented generation is the right architecture'
    description: 'A two-column comparison of situations favouring retrieval against alternatives.'
  - id: hybrid-fusion
    file: assets/hybrid-fusion.svg
    type: diagram
    title: 'Two retrievers, one list'
    alt: 'Diagram: how lexical and semantic retrieval results are combined into one ranking'
    description: 'A four-stage description of hybrid retrieval covering parallel search, incomparable scores, rank fusion and the merged candidates.'
  - id: grounded-prompt
    file: assets/grounded-prompt.svg
    type: diagram
    title: 'Assembling the grounded prompt'
    alt: 'Diagram: how retrieved passages are assembled into a grounded prompt'
    description: 'A four-stage description of grounded prompt construction covering instructions, labelled passages, the question and the grounding constraint.'
  - id: rag-vs-longcontext
    file: assets/rag-vs-longcontext.svg
    type: diagram
    title: 'Retrieval against a long context'
    alt: 'Diagram: retrieval compared with placing the whole corpus in a long context window'
    description: 'A two-column comparison of retrieval against long-context prompting.'
