learning_promise: 'Master vector representations of semantic meaning: understand dense vs. sparse vector spaces, contrast word-level (Word2Vec/GloVe) vs. sentence/passage contextual embeddings (text-embedding-3-small, bge-large-en-v1.5, e5-mistral), analyze dimensionality reduction and cosine distance mathematics in high-dimensional vector spaces, compute similarity dot products, and build a pure NumPy embedding similarity calculator.'
objectives:
  - 'Differentiate between sparse lexical representations (BM25/One-Hot) and dense continuous semantic embeddings.'
  - 'Explain how Transformer bi-encoders generate fixed-length contextual sentence vectors.'
  - 'Calculate dot product, cosine similarity, and Euclidean distance on normalized vectors in NumPy.'
  - 'Understand Matryoshka Representation Learning (MRL) and dimension truncation mechanics.'
  - 'Build a standalone embedding generation and similarity comparison engine in Python.'
