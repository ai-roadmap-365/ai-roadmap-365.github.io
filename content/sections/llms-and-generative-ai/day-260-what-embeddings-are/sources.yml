sources:
  - title: 'Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks'
    url: 'https://arxiv.org/abs/1908.10084'
    publisher: 'EMNLP / ACL Anthology'
    accessed: '2026-08-30'
    year: 2019
    description: 'Foundational paper introducing Siamese and triplet network structures for deriving semantically meaningful sentence embeddings.'
  - title: 'Matryoshka Representation Learning'
    url: 'https://arxiv.org/abs/2205.13147'
    publisher: 'NeurIPS Proceedings'
    accessed: '2026-08-30'
    year: 2022
    description: 'Paper introducing nested sub-vector representation training for adaptive multi-resolution vector storage and search.'
  - title: 'MTEB: Massive Text Embedding Benchmark'
    url: 'https://arxiv.org/abs/2210.07316'
    publisher: 'EACL Proceedings'
    accessed: '2026-08-30'
    year: 2023
    description: 'Standardized evaluation benchmark spanning 56 datasets across 8 diverse embedding tasks (clustering, retrieval, reranking, classification).'
