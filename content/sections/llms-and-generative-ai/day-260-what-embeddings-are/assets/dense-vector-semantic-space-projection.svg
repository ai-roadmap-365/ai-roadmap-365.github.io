<svg role="img" aria-label="Dense vector semantic space projection diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Dense Vector Semantic Space Projection</title>
  <defs>
    <linearGradient id="bg260a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card260" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg260a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">DENSE VECTOR SEMANTIC SPACE PROJECTION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mapping Discrete Text Tokens into Continuous Geometric Latent Space</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card260)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Discrete Text Input -->
    <rect x="25" y="25" width="200" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="125" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Discrete Text Input</text>
    
    <rect x="35" y="70" width="180" height="45" fill="#1e293b" rx="4"/>
    <text x="45" y="90" fill="#38bdf8" font-size="8" font-weight="700">"canine" / "dog" / "puppy"</text>
    <text x="45" y="105" fill="#cbd5e1" font-size="7">High lexical overlap</text>

    <rect x="35" y="130" width="180" height="45" fill="#1e293b" rx="4"/>
    <text x="45" y="150" fill="#38bdf8" font-size="8" font-weight="700">"feline" / "cat" / "kitten"</text>
    <text x="45" y="165" fill="#cbd5e1" font-size="7">Distinct lexical characters</text>

    <rect x="35" y="190" width="180" height="70" fill="#0f172a" stroke="#475569" rx="4"/>
    <text x="45" y="208" fill="#fbbf24" font-size="8" font-weight="700">The Lexical Gap:</text>
    <text x="45" y="223" fill="#cbd5e1" font-size="7">• "dog" vs "hound": 0 common letters</text>
    <text x="45" y="238" fill="#cbd5e1" font-size="7">• Exact keyword search fails</text>

    <!-- Embedding Model Transformation -->
    <rect x="250" y="25" width="220" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="360" y="50" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. Transformer Bi-Encoder</text>
    
    <rect x="260" y="70" width="200" height="75" fill="#1e293b" rx="4"/>
    <text x="270" y="90" fill="#fbbf24" font-size="8" font-weight="700">Self-Attention &amp; Pooling:</text>
    <text x="270" y="105" fill="#cbd5e1" font-size="7">• Contextual token embeddings</text>
    <text x="270" y="120" fill="#cbd5e1" font-size="7">• Mean pooling over last hidden state</text>
    <text x="270" y="135" fill="#34d399" font-size="7">• L2-Normalization: ||v|| = 1.0</text>

    <rect x="260" y="160" width="200" height="100" fill="#0f172a" stroke="#fbbf24" rx="4"/>
    <text x="270" y="180" fill="#38bdf8" font-size="8" font-weight="700">Dense Vector Tensor:</text>
    <text x="270" y="198" fill="#94a3b8" font-family="monospace" font-size="7">[+0.042, -0.118, +0.891, ...]</text>
    <text x="270" y="215" fill="#cbd5e1" font-size="7">• Dimensionality: d = 1536 / 1024</text>
    <text x="270" y="230" fill="#cbd5e1" font-size="7">• Floating point: float32 / float16</text>
    <text x="270" y="245" fill="#34d399" font-size="7">• Compact 6 KB per passage</text>

    <!-- Continuous Semantic Space -->
    <rect x="495" y="25" width="240" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="615" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3. Latent Geometric Space</text>
    
    <circle cx="560" cy="110" r="18" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="560" y="113" fill="#38bdf8" font-size="7" font-weight="700" text-anchor="middle">"dog"</text>
    
    <circle cx="585" cy="125" r="18" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="585" y="128" fill="#38bdf8" font-size="7" font-weight="700" text-anchor="middle">"hound"</text>

    <circle cx="680" cy="220" r="18" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.5"/>
    <text x="680" y="223" fill="#a855f7" font-size="7" font-weight="700" text-anchor="middle">"pizza"</text>

    <text x="572" y="160" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Cosine Sim = 0.92 (High)</text>
    <text x="625" y="195" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Cosine Sim = 0.11 (Low)</text>

    <text x="615" y="265" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Semantic Closeness = Vector Proximity</text>
  </g>
</svg>
