<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a trap.">
  <title>Four consequences of using embeddings</title>
  <style>
    .embedding-implications-bg   { fill: #f8fafc; }
    .embedding-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .embedding-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .embedding-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .embedding-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .embedding-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .embedding-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .embedding-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .embedding-implications-stage { opacity: 1; }

    .embedding-implications-s0 { animation-delay: 0.00s; }
    .embedding-implications-e0 { animation-delay: 0.00s; }
    .embedding-implications-s1 { animation-delay: 1.28s; }
    .embedding-implications-e1 { animation-delay: 1.28s; }
    .embedding-implications-s2 { animation-delay: 2.56s; }
    .embedding-implications-e2 { animation-delay: 2.56s; }
    .embedding-implications-s3 { animation-delay: 3.84s; }
    .embedding-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .embedding-implications-conn  { animation: embedding-implications-trace 6.4s ease-in-out infinite; }
      .embedding-implications-stage { animation: embedding-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes embedding-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes embedding-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .embedding-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .embedding-implications-stage { animation: embedding-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes embedding-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="embedding-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="embedding-implications-bg" width="980" height="322"/>
  <text class="embedding-implications-h1"  x="30" y="40">Four consequences of using embeddings</text>
  <text class="embedding-implications-sub" x="30" y="64">One is a trap.</text>
  <g class="embedding-implications-stage embedding-implications-s0">
    <rect class="embedding-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-implications-step" x="44" y="142">01</text>
    <text class="embedding-implications-name" x="70" y="142">Storage scales with corpus multiplied by dimensions</text>
    <text class="embedding-implications-desc" x="44" y="166">Which is substantial at millions</text>
    <text class="embedding-implications-desc" x="44" y="182">of documents.</text>
  </g>
  <line class="embedding-implications-line embedding-implications-conn embedding-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#embedding-implications-tip)"/>
  <g class="embedding-implications-stage embedding-implications-s1">
    <rect class="embedding-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-implications-step" x="280" y="142">02</text>
    <text class="embedding-implications-name" x="306" y="142">And changing the model means re-embedding everything</text>
    <text class="embedding-implications-desc" x="280" y="166">Vectors from two models are not</text>
    <text class="embedding-implications-desc" x="280" y="182">comparable.</text>
  </g>
  <line class="embedding-implications-line embedding-implications-conn embedding-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#embedding-implications-tip)"/>
  <g class="embedding-implications-stage embedding-implications-s2">
    <rect class="embedding-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-implications-step" x="516" y="142">03</text>
    <text class="embedding-implications-name" x="542" y="142">Embeddings can leak their source text</text>
    <text class="embedding-implications-desc" x="516" y="166">Inversion attacks recover much</text>
    <text class="embedding-implications-desc" x="516" y="182">of it. Treat them as the data.</text>
  </g>
  <line class="embedding-implications-line embedding-implications-conn embedding-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#embedding-implications-tip)"/>
  <g class="embedding-implications-stage embedding-implications-s3">
    <rect class="embedding-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-implications-step" x="752" y="142">04</text>
    <text class="embedding-implications-name" x="778" y="142">And they go stale as documents change</text>
    <text class="embedding-implications-desc" x="752" y="166">Which needs a re-embedding</text>
    <text class="embedding-implications-desc" x="752" y="182">pipeline, not a one-off job.</text>
  </g>
  <text class="embedding-implications-sub" x="30" y="304">Treating stored vectors as though they were anonymised is the trap: inversion research recovers a great deal of the original text, so they carry the same handling requirements.</text>
</svg>
