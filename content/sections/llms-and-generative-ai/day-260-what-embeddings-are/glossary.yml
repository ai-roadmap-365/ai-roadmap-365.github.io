terms:
  - term: 'Embedding'
    definition: 'A continuous, dense vector representation of discrete data (text, image, audio) in high-dimensional geometric space.'
  - term: 'Dense Vector'
    definition: 'A numerical tensor where most values are non-zero floating-point numbers representing latent semantic features.'
  - term: 'Sparse Vector'
    definition: 'A high-dimensional vector (matching vocabulary size) where nearly all elements are zero except for specific word frequencies.'
  - term: 'Cosine Similarity'
    definition: 'A metric measuring the cosine of the angle between two vectors, ranging from -1.0 to +1.0 regardless of vector magnitude.'
  - term: 'Dot Product'
    definition: 'The sum of the products of corresponding elements of two vectors; equivalent to cosine similarity on unit-normalized vectors.'
  - term: 'Bi-Encoder'
    definition: 'A neural architecture that processes queries and documents independently through a Transformer to generate separate vector embeddings.'
  - term: 'Matryoshka Representation Learning (MRL)'
    definition: 'A training technique enforcing semantic information density in leading vector dimensions, permitting lossless vector truncation.'
  - term: 'Mean Pooling'
    definition: 'Aggregating token-level hidden states from a Transformer by taking the average across sequence length weighted by the attention mask.'
