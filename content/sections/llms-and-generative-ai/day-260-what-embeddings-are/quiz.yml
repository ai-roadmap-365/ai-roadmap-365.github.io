questions:
  - question: 'What is the fundamental difference between sparse lexical search (e.g. BM25) and dense vector embeddings?'
    options:
      - 'There is no mathematical difference between them'
      - 'Dense embeddings only work with images, while sparse search works with text'
      - 'Sparse search requires GPUs, while dense embeddings run on floppy disks'
      - 'Sparse matches keywords; dense maps meaning to geometry'
    answer_index: 3
    explanation: 'Dense vectors capture semantic synonyms and conceptual relationships regardless of lexical word overlap.'
  - question: 'Why does polysemy (e.g. "apple" the fruit vs. "Apple" the corporation) break static word embeddings like Word2Vec?'
    options:
      - 'Word2Vec gives one vector per token, whatever the context'
      - 'Because Word2Vec cannot spell English words'
      - 'Because Word2Vec is limited to 10 tokens'
      - 'Because Apple sued Word2Vec'
    answer_index: 0
    explanation: 'Static embeddings lack context awareness, collapsing multiple meanings into a single vector centroid.'
  - question: 'If two dense vectors u and v are L2-normalized such that ||u|| = 1 and ||v|| = 1, how does cosine similarity simplify?'
    options:
      - 'It equals zero'
      - 'It becomes exactly the dot product'
      - 'It requires computing an inverted matrix determinant'
      - 'It becomes undefined'
    answer_index: 1
    explanation: 'On unit-normalized vectors, the denominator ||u|| * ||v|| equals 1, making cosine similarity equivalent to the dot product.'
  - question: 'What is Matryoshka Representation Learning (MRL) in modern embedding models like text-embedding-3?'
    options:
      - 'Compressing text into MP3 audio files'
      - 'Translating text into Russian doll jokes'
      - 'Early dimensions hold the meaning, so it truncates safely'
      - 'Converting floating point numbers to integers'
    answer_index: 2
    explanation: 'MRL structures representations hierarchically, allowing developers to truncate vector lengths while preserving retrieval accuracy.'
  - question: 'Why do asymmetric embedding models (such as E5 and BGE) require prefix markers like "query: " and "passage: "?'
    options:
      - 'To slow down GPU execution'
      - 'Because Python requires strings to start with letters'
      - 'To prevent database SQL injection'
      - 'Queries and passages differ, so a prefix aligns them'
    answer_index: 3
    explanation: 'Asymmetric prefixes condition the encoder to align short intent queries with detailed factual passages.'
