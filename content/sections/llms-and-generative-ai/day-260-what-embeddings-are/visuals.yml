visuals:
  - id: dense-vector-semantic-space-projection
    file: assets/dense-vector-semantic-space-projection.svg
    type: diagram
    title: 'Dense Vector Semantic Space Projection'
    alt: Dense vector semantic space projection diagram
    description: 'Diagram demonstrating the projection of discrete text strings into continuous geometric high-dimensional vector space.'
  - id: embedding-models-evolution-and-dimensions
    file: assets/embedding-models-evolution-and-dimensions.svg
    type: diagram
    title: 'Embedding Models Evolution & Dimensions'
    alt: Embedding models evolution and dimensionality architecture diagram
    description: 'Evolutionary timeline of vector representation architectures from static Word2Vec to contextual sentence transformers and modern Matryoshka bi-encoders.'
  - id: embedding-idea
    file: assets/embedding-idea.svg
    type: diagram
    title: 'What an embedding is'
    alt: 'Diagram: what a text embedding is and what its geometry means'
    description: 'A four-stage description of embeddings covering the vector, the geometry, the training objective and the consequence.'
  - id: sparse-dense
    file: assets/sparse-dense.svg
    type: diagram
    title: 'Sparse against dense'
    alt: 'Diagram: sparse keyword representations compared with dense learned embeddings'
    description: 'A two-column comparison of sparse term-based representations against dense learned ones.'
  - id: bi-encoder
    file: assets/bi-encoder.svg
    type: diagram
    title: 'From tokens to one vector'
    alt: 'Diagram: how a transformer produces a single vector for a whole passage'
    description: 'A four-stage description of embedding generation covering tokenisation, contextual encoding, pooling and normalisation.'
  - id: matryoshka
    file: assets/matryoshka.svg
    type: diagram
    title: 'Truncatable embeddings'
    alt: 'Diagram: how nested representation training allows embeddings to be truncated'
    description: 'A four-stage description of truncatable embeddings covering the dimension cost, nested training, truncation and the tiered use.'
  - id: asymmetric
    file: assets/asymmetric.svg
    type: diagram
    title: 'Queries and passages are different'
    alt: 'Diagram: why queries and passages are embedded differently'
    description: 'A four-stage description of asymmetric embedding covering the length mismatch, the resulting geometry, instruction prefixes and the failure mode.'
  - id: map-cities
    file: assets/map-cities.svg
    type: diagram
    title: 'A map of meaning'
    alt: 'Diagram: a list of place names compared with a map showing their positions'
    description: 'A two-column comparison of an unordered list against a spatial arrangement.'
  - id: embedding-implications
    file: assets/embedding-implications.svg
    type: diagram
    title: 'Four consequences of using embeddings'
    alt: 'Diagram: the cost, migration, privacy and staleness implications of embeddings'
    description: 'A four-stage description of embedding implications covering storage cost, model migration, information leakage and index staleness.'
  - id: embedding-when
    file: assets/embedding-when.svg
    type: diagram
    title: 'When to use embeddings'
    alt: 'Diagram: when dense embeddings are appropriate and when keyword search suffices'
    description: 'A two-column comparison of dense embedding search against keyword search.'
  - id: embedding-history
    file: assets/embedding-history.svg
    type: diagram
    title: 'Four steps to modern embeddings'
    alt: 'Diagram: the historical progression of text representation methods'
    description: 'A four-stage description of embedding history covering term counts, static word vectors, contextual encoders and instruction-tuned embedding models.'
