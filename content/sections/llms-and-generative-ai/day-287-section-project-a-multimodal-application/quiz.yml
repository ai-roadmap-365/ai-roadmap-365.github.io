questions:
- question: What defines a true Multimodal Application according to Section 6 standards?
  options:
  - An app with two different color themes
  - An application combining at least two distinct input modalities (e.g. voice speech and visual imagery)
    and producing coordinated grounded text, synthesized media, and signed provenance manifests
  - An app written in two programming languages
  - A website that plays background audio
  answer_index: 1
  explanation: A complete multimodal application seamlessly ingests, reasons across, and emits coordinated
    media spanning audio, vision, text, and cryptographic provenance.
- question: What is the primary role of the Multimodal Orchestrator in production systems?
  options:
  - Compressing video files to ZIP archives
  - Managing pipeline state, routing data between specialized subsystem models (ASR -> VLM -> Diffusion
    -> C2PA Signer), and enforcing latency budgets
  - Rendering CSS animations in the browser
  - Managing SQL user logins
  answer_index: 1
  explanation: The orchestrator coordinates data transformations, manages asynchronous model execution,
    and ensures error resilience across heterogeneous AI backbones.
- question: Why must generated media outputs be passed through a Perceptual Deduplication filter prior
    to C2PA signing?
  options:
  - To increase image brightness
  - To ensure the model has not memorized and emitted a direct copy of a protected trademark or copyrighted
    image from its training dataset
  - To reduce the number of colors
  - To speed up network bandwidth
  answer_index: 1
  explanation: Auditing outputs against a reference database with pHash prevents accidental copyright
    infringement before attaching official provenance credentials.
- question: How does cross-modal grounding improve user trust in multimodal assistant responses?
  options:
  - By writing longer answers
  - By linking textual factual assertions directly to specific visual bounding box coordinates or audio
    timestamps in the user's source input
  - By charging higher subscription fees
  - By disabling the back button
  answer_index: 1
  explanation: Grounded citations allow users to verify that the model's textual reasoning is anchored
    directly in the supplied visual/audio evidence.
- question: What is the key advantage of modular pipeline architecture compared to a monolithic black-box
    model?
  options:
  - Modular pipelines allow upgrading, swapping, or quantizing individual components (e.g. upgrading Whisper
    ASR or swapping SDXL for Flux) without retraining the entire system
  - Modular pipelines require no code
  - Modular pipelines run without electricity
  - Monolithic models cannot process text
  answer_index: 0
  explanation: Modularity allows engineers to optimize each subsystem independently, caching intermediate
    states and routing across best-in-class models.
