<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Multimodal Pipeline State Machine">
  <title>Multimodal Pipeline State Machine</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d287f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d287f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d287f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d287f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d287f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d287f-arrowhead); }
      .d287f-pulse { animation: d287f-glow 2.5s infinite ease-in-out; }
      @keyframes d287f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d287f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d287f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d287f-box" x="0" y="0" width="220" height="180" />
    <text class="d287f-header" x="15" y="30">1. Sensory Pipeline</text>
    <text class="d287f-text" x="15" y="60">• STFT Spectrogram</text>
    <text class="d287f-text" x="15" y="85">• CTC Speech Decode</text>
    <text class="d287f-accent" x="15" y="130">Acoustic Ingestion</text>

    <path class="d287f-arrow" d="M 220 90 L 280 90" />

    <rect class="d287f-box d287f-pulse" x="280" y="0" width="240" height="180" />
    <text class="d287f-header" x="15" y="30">2. Cognitive Fusion</text>
    <text class="d287f-text" x="15" y="60">• Visual Token Alignment</text>
    <text class="d287f-text" x="15" y="85">• Grounded Text Synthesis</text>
    <text class="d287f-accent" x="15" y="130">Multimodal Reasoning</text>

    <path class="d287f-arrow" d="M 520 90 L 580 90" />

    <rect class="d287f-box" x="580" y="0" width="200" height="180" />
    <text class="d287f-header" x="15" y="30">3. Generative Media</text>
    <text class="d287f-text" x="15" y="60">• Diffusion Image Synthesis</text>
    <text class="d287f-text" x="15" y="85">• C2PA Cryptographic Seal</text>
    <text class="d287f-accent" x="15" y="130">Complete Deliverable</text>
  </g>

</svg>