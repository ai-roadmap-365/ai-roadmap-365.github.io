<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The coordination is the work.">
  <title>An orchestra, not soloists</title>
  <style>
    .orchestra-bg   { fill: #f8fafc; }
    .orchestra-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestra-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orchestra-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .orchestra-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .orchestra-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .orchestra-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .orchestra-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .orchestra-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orchestra-row { opacity: 1; }
    .orchestra-r0 { animation-delay: 0.00s; }
    .orchestra-r1 { animation-delay: 0.45s; }
    .orchestra-r2 { animation-delay: 0.90s; }
    .orchestra-r3 { animation-delay: 1.35s; }
    .orchestra-r4 { animation-delay: 1.80s; }
    .orchestra-row { animation: orchestra-reveal 7.3s ease-in-out infinite; }
    @keyframes orchestra-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="orchestra-bg" width="980" height="390"/>
  <text class="orchestra-h1"  x="30" y="40">An orchestra, not soloists</text>
  <text class="orchestra-sub" x="30" y="64">The coordination is the work.</text>
  <rect class="orchestra-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="orchestra-name" x="46" y="122">Excellent soloists</text>
  <text class="orchestra-desc" x="46" y="142">Each good alone.</text>
  <text class="orchestra-desc orchestra-row orchestra-r0" x="46" y="182">Every player technically superb</text>
  <text class="orchestra-desc orchestra-row orchestra-r1" x="46" y="216">No shared tempo</text>
  <text class="orchestra-desc orchestra-row orchestra-r2" x="46" y="250">Entries at the wrong moment</text>
  <text class="orchestra-desc orchestra-row orchestra-r3" x="46" y="284">The sum is worse than the parts</text>
  <text class="orchestra-desc orchestra-row orchestra-r4" x="46" y="318">This is an uncoordinated pipeline</text>
  <rect class="orchestra-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="orchestra-name" x="526" y="122">An ensemble</text>
  <text class="orchestra-desc" x="526" y="142">Good together.</text>
  <text class="orchestra-desc orchestra-row orchestra-r0" x="526" y="182">Each player still excellent</text>
  <text class="orchestra-desc orchestra-row orchestra-r1" x="526" y="216">One shared tempo</text>
  <text class="orchestra-desc orchestra-row orchestra-r2" x="526" y="250">Entries coordinated</text>
  <text class="orchestra-desc orchestra-row orchestra-r3" x="526" y="284">The sum exceeds the parts</text>
  <text class="orchestra-desc orchestra-row orchestra-r4" x="526" y="318">This is an orchestrated pipeline</text>
  <text class="orchestra-sub" x="30" y="372">The individual components in a multimodal system are usually fine, and what fails is the coordination — which is why the orchestration layer deserves most of the engineering attention.</text>
</svg>
