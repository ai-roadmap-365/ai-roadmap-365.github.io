<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each removed a conversion.">
  <title>Four steps to multimodal applications</title>
  <style>
    .mm-history-bg   { fill: #f8fafc; }
    .mm-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mm-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mm-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mm-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mm-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mm-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mm-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mm-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mm-history-stage { opacity: 1; }

    .mm-history-s0 { animation-delay: 0.00s; }
    .mm-history-e0 { animation-delay: 0.00s; }
    .mm-history-s1 { animation-delay: 1.28s; }
    .mm-history-e1 { animation-delay: 1.28s; }
    .mm-history-s2 { animation-delay: 2.56s; }
    .mm-history-e2 { animation-delay: 2.56s; }
    .mm-history-s3 { animation-delay: 3.84s; }
    .mm-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mm-history-conn  { animation: mm-history-trace 6.4s ease-in-out infinite; }
      .mm-history-stage { animation: mm-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mm-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mm-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mm-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mm-history-stage { animation: mm-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mm-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mm-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mm-history-bg" width="980" height="322"/>
  <text class="mm-history-h1"  x="30" y="40">Four steps to multimodal applications</text>
  <text class="mm-history-sub" x="30" y="64">Each removed a conversion.</text>
  <g class="mm-history-stage mm-history-s0">
    <rect class="mm-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mm-history-step" x="44" y="142">01</text>
    <text class="mm-history-name" x="70" y="142">Separate tools, joined by people</text>
    <text class="mm-history-desc" x="44" y="166">Transcribe here, describe there,</text>
    <text class="mm-history-desc" x="44" y="182">write it up manually.</text>
  </g>
  <line class="mm-history-line mm-history-conn mm-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mm-history-tip)"/>
  <g class="mm-history-stage mm-history-s1">
    <rect class="mm-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mm-history-step" x="280" y="142">02</text>
    <text class="mm-history-name" x="306" y="142">Scripted pipelines</text>
    <text class="mm-history-desc" x="280" y="166">Automated, brittle, and lossy at</text>
    <text class="mm-history-desc" x="280" y="182">every join.</text>
  </g>
  <line class="mm-history-line mm-history-conn mm-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mm-history-tip)"/>
  <g class="mm-history-stage mm-history-s2">
    <rect class="mm-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mm-history-step" x="516" y="142">03</text>
    <text class="mm-history-name" x="542" y="142">Models handling several modalities natively</text>
    <text class="mm-history-desc" x="516" y="166">Which removed most of the joins.</text>
  </g>
  <line class="mm-history-line mm-history-conn mm-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mm-history-tip)"/>
  <g class="mm-history-stage mm-history-s3">
    <rect class="mm-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mm-history-step" x="752" y="142">04</text>
    <text class="mm-history-name" x="778" y="142">And orchestration around them</text>
    <text class="mm-history-desc" x="752" y="166">Which is where the remaining</text>
    <text class="mm-history-desc" x="752" y="182">engineering lives.</text>
  </g>
  <text class="mm-history-sub" x="30" y="304">Each step removed a lossy conversion rather than adding a capability, which is the same pattern the document-extraction lesson showed.</text>
</svg>
