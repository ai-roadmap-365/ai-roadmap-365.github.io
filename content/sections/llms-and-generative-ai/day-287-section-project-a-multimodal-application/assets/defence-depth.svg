<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four surfaces.">
  <title>Defence across modalities</title>
  <style>
    .defence-depth-bg   { fill: #f8fafc; }
    .defence-depth-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-depth-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-depth-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-depth-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-depth-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-depth-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .defence-depth-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .defence-depth-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .defence-depth-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .defence-depth-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .defence-depth-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .defence-depth-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .defence-depth-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .defence-depth-stage { opacity: 1; }

    .defence-depth-s0 { animation-delay: 0.00s; }
    .defence-depth-e0 { animation-delay: 0.00s; }
    .defence-depth-s1 { animation-delay: 1.28s; }
    .defence-depth-e1 { animation-delay: 1.28s; }
    .defence-depth-s2 { animation-delay: 2.56s; }
    .defence-depth-e2 { animation-delay: 2.56s; }
    .defence-depth-s3 { animation-delay: 3.84s; }
    .defence-depth-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .defence-depth-conn  { animation: defence-depth-trace 6.4s ease-in-out infinite; }
      .defence-depth-stage { animation: defence-depth-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes defence-depth-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes defence-depth-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .defence-depth-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .defence-depth-stage { animation: defence-depth-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes defence-depth-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="defence-depth-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="defence-depth-bg" width="980" height="322"/>
  <text class="defence-depth-h1"  x="30" y="40">Defence across modalities</text>
  <text class="defence-depth-sub" x="30" y="64">Four surfaces.</text>
  <g class="defence-depth-stage defence-depth-s0">
    <rect class="defence-depth-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="defence-depth-step" x="44" y="142">01</text>
    <text class="defence-depth-name" x="70" y="142">Text input</text>
    <text class="defence-depth-desc" x="44" y="166">The familiar injection surface.</text>
  </g>
  <line class="defence-depth-line defence-depth-conn defence-depth-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#defence-depth-tip)"/>
  <g class="defence-depth-stage defence-depth-s1">
    <rect class="defence-depth-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="defence-depth-step" x="280" y="142">02</text>
    <text class="defence-depth-name" x="306" y="142">Images</text>
    <text class="defence-depth-desc" x="280" y="166">Rendered text reaches the model</text>
    <text class="defence-depth-desc" x="280" y="182">exactly as typed text does.</text>
  </g>
  <line class="defence-depth-line defence-depth-conn defence-depth-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#defence-depth-tip)"/>
  <g class="defence-depth-stage defence-depth-s2">
    <rect class="defence-depth-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="defence-depth-step" x="516" y="142">03</text>
    <text class="defence-depth-name" x="542" y="142">Audio</text>
    <text class="defence-depth-desc" x="516" y="166">Spoken instructions, transcribed</text>
    <text class="defence-depth-desc" x="516" y="182">into the prompt.</text>
  </g>
  <line class="defence-depth-line defence-depth-conn defence-depth-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#defence-depth-tip)"/>
  <g class="defence-depth-stage defence-depth-s3">
    <rect class="defence-depth-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="defence-depth-step" x="752" y="142">04</text>
    <text class="defence-depth-name" x="778" y="142">And retrieved documents</text>
    <text class="defence-depth-desc" x="752" y="166">Which the user never saw and</text>
    <text class="defence-depth-desc" x="752" y="182">cannot vouch for.</text>
  </g>
  <text class="defence-depth-sub" x="30" y="304">Every modality is an injection channel, which means the defences from Day 251 apply four times rather than once — and tool privileges remain the control that actually bounds the damage.</text>
</svg>
