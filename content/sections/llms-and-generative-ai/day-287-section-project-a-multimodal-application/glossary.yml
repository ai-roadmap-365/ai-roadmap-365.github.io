terms:
- term: Multimodal Orchestrator
  definition: A unified coordination engine that chains audio transcription (ASR), vision-language reasoning
    (VLM), image generation (Diffusion), and provenance signing (C2PA).
- term: Cross-Modal Grounding
  definition: Connecting textual statements directly to physical coordinates or acoustic timestamps in
    input media.
- term: End-to-End Latency Budget
  definition: The total roundtrip duration from spoken user input to synthesized visual and text response
    (typically budgeted under 3.0 seconds).
- term: Zero-Shot Pipeline Fallback
  definition: A defensive routing mechanism that automatically switches between cloud VLM APIs and local
    quantized models upon timeout or failure.
- term: Unified Multimodal State
  definition: A shared data structure tracking conversation history, image tensors, spectrogram buffers,
    and cryptographic signatures across pipeline steps.
- term: C2PA Cryptographic Binding
  definition: Binding the binary SHA-256 hash of generated media to a digitally signed manifest to prevent
    tampering.
- term: Dynamic Resolution Tiling
  definition: Splitting high-resolution images into multiple sub-patches to preserve fine text details
    without downsampling.
- term: Perceptual Deduplication Filter
  definition: A pre-emission check using perceptual hashing (pHash) to prevent memorized or trademarked
    content from leaving the application.
