week: 41
learning_promise: Assemble a complete, production-grade Multimodal Application chaining speech recognition
  (ASR), vision-language document reasoning (VLM), text-to-image latent diffusion synthesis (CFG), and
  C2PA cryptographic provenance signing in Python.
objectives:
- Architect an end-to-end multimodal orchestrator combining at least two input modalities and two output
  modalities.
- Implement audio ingestion, Log-Mel spectrogram conversion, and CTC speech decoding.
- Integrate visual document reasoning with prompt-guided image generation and Classifier-Free Guidance.
- Sign all generated synthetic media outputs with cryptographically valid C2PA claim manifests.
- Run an automated verification suite benchmarking end-to-end latency, WER, and pHash similarity in Python.
