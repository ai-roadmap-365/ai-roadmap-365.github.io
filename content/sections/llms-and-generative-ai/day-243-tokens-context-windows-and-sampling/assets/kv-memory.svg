<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Per token, per layer, per head.">
  <title>What the cache costs</title>
  <style>
    .kv-memory-bg   { fill: #f8fafc; }
    .kv-memory-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-memory-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-memory-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-memory-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-memory-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-memory-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kv-memory-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kv-memory-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kv-memory-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kv-memory-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kv-memory-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kv-memory-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .kv-memory-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .kv-memory-stage { opacity: 1; }

    .kv-memory-s0 { animation-delay: 0.00s; }
    .kv-memory-e0 { animation-delay: 0.00s; }
    .kv-memory-s1 { animation-delay: 1.28s; }
    .kv-memory-e1 { animation-delay: 1.28s; }
    .kv-memory-s2 { animation-delay: 2.56s; }
    .kv-memory-e2 { animation-delay: 2.56s; }
    .kv-memory-s3 { animation-delay: 3.84s; }
    .kv-memory-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .kv-memory-conn  { animation: kv-memory-trace 6.4s ease-in-out infinite; }
      .kv-memory-stage { animation: kv-memory-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes kv-memory-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes kv-memory-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .kv-memory-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .kv-memory-stage { animation: kv-memory-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes kv-memory-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="kv-memory-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="kv-memory-bg" width="980" height="322"/>
  <text class="kv-memory-h1"  x="30" y="40">What the cache costs</text>
  <text class="kv-memory-sub" x="30" y="64">Per token, per layer, per head.</text>
  <g class="kv-memory-stage kv-memory-s0">
    <rect class="kv-memory-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="kv-memory-step" x="44" y="142">01</text>
    <text class="kv-memory-name" x="70" y="142">Each token adds keys and values</text>
    <text class="kv-memory-desc" x="44" y="166">For every layer and every head.</text>
  </g>
  <line class="kv-memory-line kv-memory-conn kv-memory-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#kv-memory-tip)"/>
  <g class="kv-memory-stage kv-memory-s1">
    <rect class="kv-memory-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="kv-memory-step" x="280" y="142">02</text>
    <text class="kv-memory-name" x="306" y="142">So memory grows linearly with context</text>
    <text class="kv-memory-desc" x="280" y="166">A long conversation costs memory</text>
    <text class="kv-memory-desc" x="280" y="182">for its whole length.</text>
  </g>
  <line class="kv-memory-line kv-memory-conn kv-memory-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#kv-memory-tip)"/>
  <g class="kv-memory-stage kv-memory-s2">
    <rect class="kv-memory-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="kv-memory-step" x="516" y="142">03</text>
    <text class="kv-memory-name" x="542" y="142">Multiplied by concurrent requests</text>
    <text class="kv-memory-desc" x="516" y="166">Each with its own cache.</text>
  </g>
  <line class="kv-memory-line kv-memory-conn kv-memory-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#kv-memory-tip)"/>
  <g class="kv-memory-stage kv-memory-s3">
    <rect class="kv-memory-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="kv-memory-step" x="752" y="142">04</text>
    <text class="kv-memory-name" x="778" y="142">Which is what limits requests per device</text>
    <text class="kv-memory-desc" x="752" y="166">Not compute. Almost never</text>
    <text class="kv-memory-desc" x="752" y="182">compute.</text>
  </g>
  <text class="kv-memory-sub" x="30" y="304">Understanding this makes serving costs predictable: capacity is estimated from cache arithmetic and context length, not from the model's parameter count.</text>
</svg>
