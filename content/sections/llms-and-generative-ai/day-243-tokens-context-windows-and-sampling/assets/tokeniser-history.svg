<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward smaller pieces.">
  <title>Four steps in tokenisation</title>
  <style>
    .tokeniser-history-bg   { fill: #f8fafc; }
    .tokeniser-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokeniser-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tokeniser-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tokeniser-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tokeniser-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tokeniser-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tokeniser-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tokeniser-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tokeniser-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tokeniser-history-stage { opacity: 1; }

    .tokeniser-history-s0 { animation-delay: 0.00s; }
    .tokeniser-history-e0 { animation-delay: 0.00s; }
    .tokeniser-history-s1 { animation-delay: 1.28s; }
    .tokeniser-history-e1 { animation-delay: 1.28s; }
    .tokeniser-history-s2 { animation-delay: 2.56s; }
    .tokeniser-history-e2 { animation-delay: 2.56s; }
    .tokeniser-history-s3 { animation-delay: 3.84s; }
    .tokeniser-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tokeniser-history-conn  { animation: tokeniser-history-trace 6.4s ease-in-out infinite; }
      .tokeniser-history-stage { animation: tokeniser-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tokeniser-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tokeniser-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tokeniser-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tokeniser-history-stage { animation: tokeniser-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tokeniser-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tokeniser-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tokeniser-history-bg" width="980" height="322"/>
  <text class="tokeniser-history-h1"  x="30" y="40">Four steps in tokenisation</text>
  <text class="tokeniser-history-sub" x="30" y="64">Toward smaller pieces.</text>
  <g class="tokeniser-history-stage tokeniser-history-s0">
    <rect class="tokeniser-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tokeniser-history-step" x="44" y="142">01</text>
    <text class="tokeniser-history-name" x="70" y="142">One entry per word</text>
    <text class="tokeniser-history-desc" x="44" y="166">Which cannot represent anything</text>
    <text class="tokeniser-history-desc" x="44" y="182">unseen.</text>
  </g>
  <line class="tokeniser-history-line tokeniser-history-conn tokeniser-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tokeniser-history-tip)"/>
  <g class="tokeniser-history-stage tokeniser-history-s1">
    <rect class="tokeniser-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tokeniser-history-step" x="280" y="142">02</text>
    <text class="tokeniser-history-name" x="306" y="142">One entry per character</text>
    <text class="tokeniser-history-desc" x="280" y="166">Which represents everything, and</text>
    <text class="tokeniser-history-desc" x="280" y="182">makes sequences far too long.</text>
  </g>
  <line class="tokeniser-history-line tokeniser-history-conn tokeniser-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tokeniser-history-tip)"/>
  <g class="tokeniser-history-stage tokeniser-history-s2">
    <rect class="tokeniser-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tokeniser-history-step" x="516" y="142">03</text>
    <text class="tokeniser-history-name" x="542" y="142">Merge frequent pairs into subwords</text>
    <text class="tokeniser-history-desc" x="516" y="166">Common words whole, rare words</text>
    <text class="tokeniser-history-desc" x="516" y="182">in pieces.</text>
  </g>
  <line class="tokeniser-history-line tokeniser-history-conn tokeniser-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tokeniser-history-tip)"/>
  <g class="tokeniser-history-stage tokeniser-history-s3">
    <rect class="tokeniser-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tokeniser-history-step" x="752" y="142">04</text>
    <text class="tokeniser-history-name" x="778" y="142">With bytes underneath as a fallback</text>
    <text class="tokeniser-history-desc" x="752" y="166">So nothing is ever out of</text>
    <text class="tokeniser-history-desc" x="752" y="182">vocabulary.</text>
  </g>
  <text class="tokeniser-history-sub" x="30" y="304">The byte fallback is why modern models never fail on unusual input: the worst case is an inefficient encoding rather than an unrepresentable one.</text>
</svg>
