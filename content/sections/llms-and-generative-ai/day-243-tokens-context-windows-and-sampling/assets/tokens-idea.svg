<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not a word, and not a character.">
  <title>What a token is</title>
  <style>
    .tokens-idea-bg   { fill: #f8fafc; }
    .tokens-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokens-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokens-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokens-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokens-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokens-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tokens-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tokens-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tokens-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tokens-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tokens-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tokens-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tokens-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tokens-idea-stage { opacity: 1; }

    .tokens-idea-s0 { animation-delay: 0.00s; }
    .tokens-idea-e0 { animation-delay: 0.00s; }
    .tokens-idea-s1 { animation-delay: 1.28s; }
    .tokens-idea-e1 { animation-delay: 1.28s; }
    .tokens-idea-s2 { animation-delay: 2.56s; }
    .tokens-idea-e2 { animation-delay: 2.56s; }
    .tokens-idea-s3 { animation-delay: 3.84s; }
    .tokens-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tokens-idea-conn  { animation: tokens-idea-trace 6.4s ease-in-out infinite; }
      .tokens-idea-stage { animation: tokens-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tokens-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tokens-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tokens-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tokens-idea-stage { animation: tokens-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tokens-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tokens-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tokens-idea-bg" width="980" height="322"/>
  <text class="tokens-idea-h1"  x="30" y="40">What a token is</text>
  <text class="tokens-idea-sub" x="30" y="64">Not a word, and not a character.</text>
  <g class="tokens-idea-stage tokens-idea-s0">
    <rect class="tokens-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tokens-idea-step" x="44" y="142">01</text>
    <text class="tokens-idea-name" x="70" y="142">A fixed vocabulary of pieces</text>
    <text class="tokens-idea-desc" x="44" y="166">Typically fifty to two hundred</text>
    <text class="tokens-idea-desc" x="44" y="182">thousand entries.</text>
  </g>
  <line class="tokens-idea-line tokens-idea-conn tokens-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tokens-idea-tip)"/>
  <g class="tokens-idea-stage tokens-idea-s1">
    <rect class="tokens-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tokens-idea-step" x="280" y="142">02</text>
    <text class="tokens-idea-name" x="306" y="142">Common words are single tokens</text>
    <text class="tokens-idea-desc" x="280" y="166">Rare ones split into several.</text>
  </g>
  <line class="tokens-idea-line tokens-idea-conn tokens-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tokens-idea-tip)"/>
  <g class="tokens-idea-stage tokens-idea-s2">
    <rect class="tokens-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tokens-idea-step" x="516" y="142">03</text>
    <text class="tokens-idea-name" x="542" y="142">Which is why spelling questions confuse models</text>
    <text class="tokens-idea-desc" x="516" y="166">They never see the individual</text>
    <text class="tokens-idea-desc" x="516" y="182">letters.</text>
  </g>
  <line class="tokens-idea-line tokens-idea-conn tokens-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tokens-idea-tip)"/>
  <g class="tokens-idea-stage tokens-idea-s3">
    <rect class="tokens-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tokens-idea-step" x="752" y="142">04</text>
    <text class="tokens-idea-name" x="778" y="142">And why cost varies by language</text>
    <text class="tokens-idea-desc" x="752" y="166">Some need several times more</text>
    <text class="tokens-idea-desc" x="752" y="182">tokens for the same meaning.</text>
  </g>
  <text class="tokens-idea-sub" x="30" y="304">The letter-level blindness explains a whole class of apparent stupidity: counting characters in a word is genuinely hard for something that never observed the characters.</text>
</svg>
