terms:
  - term: 'KV Cache'
    definition: 'Key-Value Cache: storing the computed key and value attention activation tensors for all previous tokens in GPU VRAM to avoid quadratic recomputation during generation.'
  - term: 'Temperature (T)'
    definition: 'A hyperparameter scaling raw model logits (z_i / T) before the Softmax function to control output randomness and entropy.'
  - term: 'Top-k Sampling'
    definition: 'A decoding strategy restricting token sampling to the top k highest probability tokens, masking out all lower-ranked tokens.'
  - term: 'Top-p (Nucleus) Sampling'
    definition: 'A decoding strategy restricting token sampling to the smallest dynamic subset of tokens whose cumulative probability mass exceeds threshold p.'
  - term: 'Min-P Sampling'
    definition: 'A sampling filter discarding tokens whose probability is lower than min_p times the probability of the most likely candidate token.'
  - term: 'Presence Penalty'
    definition: 'A fixed logit penalty subtracted from any token that has appeared at least once in the generated output to encourage topic exploration.'
  - term: 'Frequency Penalty'
    definition: 'A proportional logit penalty subtracted based on the exact frequency count of a token in the generated output to prevent repetitive loops.'
  - term: 'Prompt Prefill Phase'
    definition: 'The initial compute-bound forward pass processing the entire prompt in parallel, generating the initial KV cache and first output token.'
