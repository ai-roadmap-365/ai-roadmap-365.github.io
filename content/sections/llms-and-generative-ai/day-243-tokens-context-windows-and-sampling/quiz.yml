questions:
  - question: 'How does Temperature scaling (z_i / T) affect the Softmax output probability distribution of an LLM?'
    options:
      - 'T below 1 sharpens; above 1 flattens the distribution'
      - 'Temperature controls the physical heat of the GPU'
      - 'Temperature increases the context window size'
      - 'Temperature converts words into ASCII codes'
    answer_index: 0
    explanation: 'Temperature rescales logits prior to Softmax: low T sharpens peaks, high T flattens the distribution.'
  - question: 'What is Top-p (Nucleus) sampling (Holtzman et al., 2019)?'
    options:
      - 'Sampling only punctuation tokens'
      - 'Keep the smallest set whose probability mass reaches p'
      - 'Selecting the top 10 tokens regardless of probability'
      - 'A technique for training neural networks on radioactive nuclei'
    answer_index: 1
    explanation: 'Nucleus sampling dynamically selects the smallest set of tokens whose cumulative mass reaches threshold p.'
  - question: 'Why is autoregressive token generation in LLMs classified as Memory-Bandwidth Bound rather than Compute-Bound?'
    options:
      - 'Because tokenizers use too much RAM'
      - 'Because CPUs do not have memory'
      - 'Each token reloads all weights and the KV cache'
      - 'Because hard drives are too slow'
    answer_index: 2
    explanation: 'Token decoding performs low-FLOP vector-matrix multiplies per memory byte loaded, saturating HBM memory bandwidth.'
  - question: 'How is the total VRAM required for the Key-Value (KV) cache calculated for an LLM sequence?'
    options:
      - 'KV_bytes = VocabSize * SeqLen'
      - 'KV_bytes = BatchSize * 1,000'
      - 'KV_bytes = ModelParams * 6'
      - '2 * batch * length * layers * heads * dim * bytes'
    answer_index: 3
    explanation: 'KV cache stores 2 tensors (Key and Value) per layer, proportional to batch size, sequence length, and hidden dimension.'
  - question: 'What is the purpose of the Min-P sampling strategy introduced as an alternative to Top-p?'
    options:
      - 'Drop tokens below min_p times the top probability'
      - 'Selecting the minimum probability token to maximize chaos'
      - 'Minimizing the price of API calls'
      - 'Reducing prompt length'
    answer_index: 0
    explanation: 'Min-P truncates tokens whose probability is below a fraction min_p of the top token probability.'
