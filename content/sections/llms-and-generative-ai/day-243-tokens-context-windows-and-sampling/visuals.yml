visuals:
  - id: llm-probabilistic-sampling-strategies
    file: assets/llm-probabilistic-sampling-strategies.svg
    type: diagram
    title: 'LLM Probabilistic Sampling Strategies'
    alt: Visual comparison of LLM sampling strategies comparing Greedy, Temperature, Top-k, and Nucleus Top-p sampling
    description: 'Comparative overview of LLM decoding strategies: Greedy (T=0), Temperature scaling, Top-k filtering, and Top-p Nucleus sampling.'
  - id: kv-cache-memory-scaling-and-generation-dynamics
    file: assets/kv-cache-memory-scaling-and-generation-dynamics.svg
    type: diagram
    title: 'KV-Cache Memory Scaling & Autoregressive Decoding'
    alt: KV cache memory scaling and generation dynamics diagram showing prefill vs token-by-token autoregressive decoding
    description: 'Inference runtime mechanics: compute-bound prompt prefill vs memory-bandwidth bound autoregressive token decoding with KV cache.'
  - id: sampling-pipeline
    file: assets/sampling-pipeline.svg
    type: diagram
    title: 'From logits to a token'
    alt: 'Diagram: how raw model outputs become a single sampled token'
    description: 'A four-stage description of the sampling pipeline covering logits, temperature, truncation and the draw.'
  - id: tokens-idea
    file: assets/tokens-idea.svg
    type: diagram
    title: 'What a token is'
    alt: 'Diagram: how text is split into tokens for a language model'
    description: 'A four-stage description of tokenisation covering the vocabulary, subword splitting, common and rare words, and the consequences.'
  - id: prefill-decode
    file: assets/prefill-decode.svg
    type: diagram
    title: 'Reading against writing'
    alt: 'Diagram: prompt processing compared with token generation by hardware behaviour'
    description: 'A two-column comparison of processing the prompt against generating the response.'
  - id: gqa
    file: assets/gqa.svg
    type: diagram
    title: 'Shrinking the attention cache'
    alt: 'Diagram: how grouped-query attention reduces cached attention state'
    description: 'A four-stage description of grouped-query attention covering per-head caching, the memory cost, shared key-value heads and the concurrency gain.'
  - id: improv-writer
    file: assets/improv-writer.svg
    type: diagram
    title: 'Speaking, or writing'
    alt: 'Diagram: speaking without revision compared with writing with revision'
    description: 'A two-column comparison of unrevisable speech against revisable writing.'
  - id: sampling-implications
    file: assets/sampling-implications.svg
    type: diagram
    title: 'Four consequences of sampling'
    alt: 'Diagram: the reproducibility, cost, safety and testing implications of probabilistic sampling'
    description: 'A four-stage description of sampling implications covering non-determinism, output cost, safety variance and test design.'
  - id: sampling-when
    file: assets/sampling-when.svg
    type: diagram
    title: 'When to raise the temperature'
    alt: 'Diagram: when varied sampling is appropriate and when deterministic output is required'
    description: 'A two-column comparison of high-temperature and low-temperature sampling.'
  - id: tokeniser-history
    file: assets/tokeniser-history.svg
    type: diagram
    title: 'Four steps in tokenisation'
    alt: 'Diagram: the historical progression of text tokenisation methods'
    description: 'A four-stage description of tokenisation history covering word-level vocabularies, character-level models, subword merging and byte-level fallback.'
  - id: kv-memory
    file: assets/kv-memory.svg
    type: diagram
    title: 'What the cache costs'
    alt: 'Diagram: how attention cache memory grows with context length and concurrency'
    description: 'A four-stage description of attention cache memory covering per-token cost, context length, concurrent requests and the serving limit.'
  - id: sampling-vs-search
    file: assets/sampling-vs-search.svg
    type: diagram
    title: 'Sampling against search'
    alt: 'Diagram: probabilistic sampling compared with beam search'
    description: 'A two-column comparison of sampling from the distribution against searching for the most probable sequence.'
