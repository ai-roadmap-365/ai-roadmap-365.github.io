learning_promise: 'Master the runtime mechanics of autoregressive language models: understand BPE tokenization quirks across languages and code, calculate exact KV-cache VRAM consumption (2 * B * S * L * H * D), compare compute-bound prompt prefill with memory-bandwidth bound token decoding, implement probabilistic sampling transformations (Temperature scaling, Top-k, Nucleus Top-p, Min-P, and Repetition penalties), and build a modular sampling engine in PyTorch.'
objectives:
  - 'Calculate exact KV-cache memory requirements for LLM inference across model configurations and batch sizes.'
  - 'Contrast compute-bound prompt prefill (GEMM) with memory-bandwidth bound token generation (GEMV).'
  - 'Implement Temperature logit scaling: z_i / T and understand its impact on entropy and determinism.'
  - 'Implement Top-k and Top-p (Nucleus) cumulative mass logit masking in PyTorch.'
  - 'Apply frequency and presence repetition penalties to eliminate degenerative loops in generation.'
