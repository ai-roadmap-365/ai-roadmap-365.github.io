  alt: Text to Speech Vocoder Pipeline illustrating phoneme conversion, mel-spectrogram synthesis, and
    neural vocoder audio waveform reconstruction
  description: Diagram showing acoustic model spectrogram prediction and neural vocoder waveform synthesis.
- id: speech-idea
  file: assets/speech-idea.svg
  type: diagram
