terms:
- term: Automatic Speech Recognition (ASR)
  definition: The task of transcribing acoustic speech signals into written text characters and tokens.
- term: Text-to-Speech (TTS)
  definition: The task of synthesizing naturalistic audible human speech waveforms from text input.
- term: Short-Time Fourier Transform (STFT)
  definition: A mathematical operation that slices audio into overlapping temporal windows and computes
    frequency power spectra.
- term: Mel-Spectrogram
  definition: A 2D time-frequency representation that warps frequency bins onto the non-linear human auditory
    Mel scale.
- term: Connectionist Temporal Classification (CTC)
  definition: A loss function and alignment algorithm that allows sequence-to-sequence training without
    frame-level phonetic alignments.
- term: Neural Vocoder
  definition: A deep generative neural network (e.g. HiFi-GAN, WaveNet) that reconstructs 1D time-domain
    audio waveforms from 2D mel-spectrograms.
- term: Word Error Rate (WER)
  definition: 'The standard evaluation metric for ASR: WER = (Substitutions + Deletions + Insertions)
    / Total Reference Words.'
- term: Phoneme
  definition: The smallest perceptually distinct unit of sound in a specified language that distinguishes
    one word from another.
