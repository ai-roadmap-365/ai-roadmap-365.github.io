<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Speech Recognition Spectrogram Pipeline">
  <title>Speech Recognition Spectrogram Pipeline</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d283a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d283a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d283a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d283a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d283a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d283a-arrowhead); }
      .d283a-pulse { animation: d283a-glow 2.5s infinite ease-in-out; }
      @keyframes d283a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d283a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d283a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d283a-box" x="0" y="0" width="200" height="200" />
    <text class="d283a-header" x="15" y="30">1. Audio Waveform</text>
    <text class="d283a-text" x="15" y="60">• 16 kHz Sample Rate</text>
    <text class="d283a-text" x="15" y="85">• Raw Amplitude 1D</text>
    <text class="d283a-accent" x="15" y="140">Time-domain signal</text>

    <path class="d283a-arrow" d="M 200 100 L 260 100" />

    <rect class="d283a-box d283a-pulse" x="260" y="0" width="240" height="200" />
    <text class="d283a-header" x="15" y="30">2. Log-Mel Spectrogram</text>
    <text class="d283a-text" x="15" y="60">• STFT (25ms window)</text>
    <text class="d283a-text" x="15" y="85">• 80 Mel Filterbanks</text>
    <text class="d283a-text" x="15" y="110">• Log-power compression</text>
    <text class="d283a-accent" x="15" y="160">2D Time-Frequency Image</text>

    <path class="d283a-arrow" d="M 500 100 L 560 100" />

    <rect class="d283a-box" x="560" y="0" width="220" height="200" />
    <text class="d283a-header" x="15" y="30">3. Acoustic Model (ASR)</text>
    <text class="d283a-text" x="15" y="60">• Whisper Encoder / Conformer</text>
    <text class="d283a-text" x="15" y="85">• CTC Loss / Autoregressive</text>
    <text class="d283a-accent" x="15" y="140">Transcribed Text Stream</text>
  </g>

</svg>