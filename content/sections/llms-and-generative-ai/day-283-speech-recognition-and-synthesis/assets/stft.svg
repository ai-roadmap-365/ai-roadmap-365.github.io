<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>From waveform to spectrogram</title>
  <style>
    .stft-bg   { fill: #f8fafc; }
    .stft-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stft-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stft-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stft-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stft-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stft-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stft-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stft-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stft-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stft-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stft-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stft-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stft-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stft-stage { opacity: 1; }

    .stft-s0 { animation-delay: 0.00s; }
    .stft-e0 { animation-delay: 0.00s; }
    .stft-s1 { animation-delay: 1.28s; }
    .stft-e1 { animation-delay: 1.28s; }
    .stft-s2 { animation-delay: 2.56s; }
    .stft-e2 { animation-delay: 2.56s; }
    .stft-s3 { animation-delay: 3.84s; }
    .stft-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stft-conn  { animation: stft-trace 6.4s ease-in-out infinite; }
      .stft-stage { animation: stft-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stft-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stft-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stft-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stft-stage { animation: stft-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stft-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stft-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stft-bg" width="980" height="322"/>
  <text class="stft-h1"  x="30" y="40">From waveform to spectrogram</text>
  <text class="stft-sub" x="30" y="64">Four steps.</text>
  <g class="stft-stage stft-s0">
    <rect class="stft-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stft-step" x="44" y="142">01</text>
    <text class="stft-name" x="70" y="142">Cut the waveform into short overlapping windows</text>
    <text class="stft-desc" x="44" y="166">Twenty-five milliseconds is</text>
    <text class="stft-desc" x="44" y="182">typical.</text>
  </g>
  <line class="stft-line stft-conn stft-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stft-tip)"/>
  <g class="stft-stage stft-s1">
    <rect class="stft-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stft-step" x="280" y="142">02</text>
    <text class="stft-name" x="306" y="142">Overlapping, so nothing falls between them</text>
    <text class="stft-desc" x="280" y="166">Stepped ten milliseconds at a</text>
    <text class="stft-desc" x="280" y="182">time.</text>
  </g>
  <line class="stft-line stft-conn stft-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stft-tip)"/>
  <g class="stft-stage stft-s2">
    <rect class="stft-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stft-step" x="516" y="142">03</text>
    <text class="stft-name" x="542" y="142">Transform each window into frequencies</text>
    <text class="stft-desc" x="516" y="166">Giving one column per window.</text>
  </g>
  <line class="stft-line stft-conn stft-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stft-tip)"/>
  <g class="stft-stage stft-s3">
    <rect class="stft-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stft-step" x="752" y="142">04</text>
    <text class="stft-name" x="778" y="142">And keep the magnitudes</text>
    <text class="stft-desc" x="752" y="166">Discarding phase, which is what</text>
    <text class="stft-desc" x="752" y="182">makes reconstruction hard.</text>
  </g>
  <text class="stft-sub" x="30" y="304">The window length is a real trade: longer windows resolve frequency better and time worse, which is why the value is a design choice rather than a constant.</text>
</svg>
