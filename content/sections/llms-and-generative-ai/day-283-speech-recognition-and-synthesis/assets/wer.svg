<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And what it hides.">
  <title>Word error rate</title>
  <style>
    .wer-bg   { fill: #f8fafc; }
    .wer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .wer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .wer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .wer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .wer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .wer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .wer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .wer-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .wer-stage { opacity: 1; }

    .wer-s0 { animation-delay: 0.00s; }
    .wer-e0 { animation-delay: 0.00s; }
    .wer-s1 { animation-delay: 1.28s; }
    .wer-e1 { animation-delay: 1.28s; }
    .wer-s2 { animation-delay: 2.56s; }
    .wer-e2 { animation-delay: 2.56s; }
    .wer-s3 { animation-delay: 3.84s; }
    .wer-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .wer-conn  { animation: wer-trace 6.4s ease-in-out infinite; }
      .wer-stage { animation: wer-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes wer-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes wer-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .wer-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .wer-stage { animation: wer-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes wer-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="wer-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="wer-bg" width="980" height="322"/>
  <text class="wer-h1"  x="30" y="40">Word error rate</text>
  <text class="wer-sub" x="30" y="64">And what it hides.</text>
  <g class="wer-stage wer-s0">
    <rect class="wer-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="wer-step" x="44" y="142">01</text>
    <text class="wer-name" x="70" y="142">Align the transcript against the reference</text>
    <text class="wer-desc" x="44" y="166">By minimum edit distance.</text>
  </g>
  <line class="wer-line wer-conn wer-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#wer-tip)"/>
  <g class="wer-stage wer-s1">
    <rect class="wer-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="wer-step" x="280" y="142">02</text>
    <text class="wer-name" x="306" y="142">Count substitutions, deletions and insertions</text>
    <text class="wer-desc" x="280" y="166">All weighted equally.</text>
  </g>
  <line class="wer-line wer-conn wer-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#wer-tip)"/>
  <g class="wer-stage wer-s2">
    <rect class="wer-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="wer-step" x="516" y="142">03</text>
    <text class="wer-name" x="542" y="142">Divide by the reference length</text>
    <text class="wer-desc" x="516" y="166">Giving a single percentage.</text>
  </g>
  <line class="wer-line wer-conn wer-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#wer-tip)"/>
  <g class="wer-stage wer-s3">
    <rect class="wer-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="wer-step" x="752" y="142">04</text>
    <text class="wer-name" x="778" y="142">Which treats every error as equal</text>
    <text class="wer-desc" x="752" y="166">Though a wrong dosage and a</text>
    <text class="wer-desc" x="752" y="182">dropped 'the' are not.</text>
  </g>
  <text class="wer-sub" x="30" y="304">The equal weighting is the limitation that matters in practice: a system with a lower error rate can be substantially worse if its errors fall on the words that carry meaning.</text>
</svg>
