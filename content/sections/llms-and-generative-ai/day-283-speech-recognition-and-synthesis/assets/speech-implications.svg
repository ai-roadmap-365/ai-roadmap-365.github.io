<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are ethical.">
  <title>Four consequences of speech models</title>
  <style>
    .speech-implications-bg   { fill: #f8fafc; }
    .speech-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speech-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .speech-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .speech-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .speech-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .speech-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .speech-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .speech-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .speech-implications-stage { opacity: 1; }

    .speech-implications-s0 { animation-delay: 0.00s; }
    .speech-implications-e0 { animation-delay: 0.00s; }
    .speech-implications-s1 { animation-delay: 1.28s; }
    .speech-implications-e1 { animation-delay: 1.28s; }
    .speech-implications-s2 { animation-delay: 2.56s; }
    .speech-implications-e2 { animation-delay: 2.56s; }
    .speech-implications-s3 { animation-delay: 3.84s; }
    .speech-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .speech-implications-conn  { animation: speech-implications-trace 6.4s ease-in-out infinite; }
      .speech-implications-stage { animation: speech-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes speech-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes speech-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .speech-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .speech-implications-stage { animation: speech-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes speech-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="speech-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="speech-implications-bg" width="980" height="322"/>
  <text class="speech-implications-h1"  x="30" y="40">Four consequences of speech models</text>
  <text class="speech-implications-sub" x="30" y="64">Two are ethical.</text>
  <g class="speech-implications-stage speech-implications-s0">
    <rect class="speech-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="speech-implications-step" x="44" y="142">01</text>
    <text class="speech-implications-name" x="70" y="142">Accessibility improves substantially</text>
    <text class="speech-implications-desc" x="44" y="166">Captioning, dictation and</text>
    <text class="speech-implications-desc" x="44" y="182">reading aloud, all cheap.</text>
  </g>
  <line class="speech-implications-line speech-implications-conn speech-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#speech-implications-tip)"/>
  <g class="speech-implications-stage speech-implications-s1">
    <rect class="speech-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="speech-implications-step" x="280" y="142">02</text>
    <text class="speech-implications-name" x="306" y="142">But audio is unusually sensitive</text>
    <text class="speech-implications-desc" x="280" y="166">It captures bystanders who never</text>
    <text class="speech-implications-desc" x="280" y="182">consented.</text>
  </g>
  <line class="speech-implications-line speech-implications-conn speech-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#speech-implications-tip)"/>
  <g class="speech-implications-stage speech-implications-s2">
    <rect class="speech-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="speech-implications-step" x="516" y="142">03</text>
    <text class="speech-implications-name" x="542" y="142">And cloning a voice now takes seconds of it</text>
    <text class="speech-implications-desc" x="516" y="166">Which makes consent an</text>
    <text class="speech-implications-desc" x="516" y="182">engineering requirement.</text>
  </g>
  <line class="speech-implications-line speech-implications-conn speech-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#speech-implications-tip)"/>
  <g class="speech-implications-stage speech-implications-s3">
    <rect class="speech-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="speech-implications-step" x="752" y="142">04</text>
    <text class="speech-implications-name" x="778" y="142">While accuracy varies sharply by accent</text>
    <text class="speech-implications-desc" x="752" y="166">So measure across the population</text>
    <text class="speech-implications-desc" x="752" y="182">you serve.</text>
  </g>
  <text class="speech-implications-sub" x="30" y="304">Accent disparity is measurable and frequently unmeasured: aggregate error rates hide error rates several times higher for some groups of speakers.</text>
</svg>
