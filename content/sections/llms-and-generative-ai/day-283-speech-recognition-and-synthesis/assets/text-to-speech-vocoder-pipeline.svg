<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" role="img" aria-label="Text to Speech Vocoder Pipeline">
  <title>Text to Speech Vocoder Pipeline</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d283f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d283f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d283f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d283f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d283f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d283f-arrowhead); }
      .d283f-pulse { animation: d283f-glow 2.5s infinite ease-in-out; }
      @keyframes d283f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d283f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d283f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d283f-box" x="0" y="0" width="200" height="80" />
    <text class="d283f-header" x="15" y="30">Input Text</text>
    <text class="d283f-text" x="15" y="50">Phoneme / Token Seq</text>

    <path class="d283f-arrow" d="M 200 40 L 260 40" />

    <rect class="d283f-box d283f-pulse" x="260" y="0" width="240" height="80" />
    <text class="d283f-header" x="15" y="30">Acoustic Model (TTS)</text>
    <text class="d283f-accent" x="15" y="50">Predict Mel-Spectrogram</text>

    <path class="d283f-arrow" d="M 500 40 L 560 40" />

    <rect class="d283f-box" x="560" y="0" width="200" height="80" />
    <text class="d283f-header" x="15" y="30">Neural Vocoder</text>
    <text class="d283f-accent" x="15" y="50">HiFi-GAN -> Waveform</text>
  </g>

</svg>