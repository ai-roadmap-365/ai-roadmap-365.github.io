<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four stages.">
  <title>Speech in both directions</title>
  <style>
    .speech-idea-bg   { fill: #f8fafc; }
    .speech-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speech-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .speech-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .speech-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .speech-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .speech-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .speech-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .speech-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .speech-idea-stage { opacity: 1; }

    .speech-idea-s0 { animation-delay: 0.00s; }
    .speech-idea-e0 { animation-delay: 0.00s; }
    .speech-idea-s1 { animation-delay: 1.28s; }
    .speech-idea-e1 { animation-delay: 1.28s; }
    .speech-idea-s2 { animation-delay: 2.56s; }
    .speech-idea-e2 { animation-delay: 2.56s; }
    .speech-idea-s3 { animation-delay: 3.84s; }
    .speech-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .speech-idea-conn  { animation: speech-idea-trace 6.4s ease-in-out infinite; }
      .speech-idea-stage { animation: speech-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes speech-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes speech-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .speech-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .speech-idea-stage { animation: speech-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes speech-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="speech-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="speech-idea-bg" width="980" height="322"/>
  <text class="speech-idea-h1"  x="30" y="40">Speech in both directions</text>
  <text class="speech-idea-sub" x="30" y="64">Four stages.</text>
  <g class="speech-idea-stage speech-idea-s0">
    <rect class="speech-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="speech-idea-step" x="44" y="142">01</text>
    <text class="speech-idea-name" x="70" y="142">Sound arrives as a waveform</text>
    <text class="speech-idea-desc" x="44" y="166">Tens of thousands of samples per</text>
    <text class="speech-idea-desc" x="44" y="182">second.</text>
  </g>
  <line class="speech-idea-line speech-idea-conn speech-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#speech-idea-tip)"/>
  <g class="speech-idea-stage speech-idea-s1">
    <rect class="speech-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="speech-idea-step" x="280" y="142">02</text>
    <text class="speech-idea-name" x="306" y="142">Converted to a frequency picture over time</text>
    <text class="speech-idea-desc" x="280" y="166">Which is what the model actually</text>
    <text class="speech-idea-desc" x="280" y="182">sees.</text>
  </g>
  <line class="speech-idea-line speech-idea-conn speech-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#speech-idea-tip)"/>
  <g class="speech-idea-stage speech-idea-s2">
    <rect class="speech-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="speech-idea-step" x="516" y="142">03</text>
    <text class="speech-idea-name" x="542" y="142">A sequence model reads or writes that picture</text>
    <text class="speech-idea-desc" x="516" y="166">Recognition one way, synthesis</text>
    <text class="speech-idea-desc" x="516" y="182">the other.</text>
  </g>
  <line class="speech-idea-line speech-idea-conn speech-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#speech-idea-tip)"/>
  <g class="speech-idea-stage speech-idea-s3">
    <rect class="speech-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="speech-idea-step" x="752" y="142">04</text>
    <text class="speech-idea-name" x="778" y="142">And a vocoder turns it back into sound</text>
    <text class="speech-idea-desc" x="752" y="166">For synthesis. Which is the hard</text>
    <text class="speech-idea-desc" x="752" y="182">half.</text>
    <text class="speech-idea-edge" x="752" y="242">phase</text>
  </g>
  <text class="speech-idea-sub" x="30" y="304">The frequency picture discards phase information, which is why turning it back into audible sound needs a learned model rather than an inverse transform.</text>
</svg>
