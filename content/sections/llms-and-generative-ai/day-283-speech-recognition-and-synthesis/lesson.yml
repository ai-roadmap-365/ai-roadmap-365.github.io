learning_promise: 'Master speech AI systems engineering across Automatic Speech Recognition (ASR) and
  Text-to-Speech (TTS): derive Short-Time Fourier Transforms (STFT), construct 80-channel Log-Mel filterbanks,
  understand Whisper''s encoder-decoder architecture, implement CTC beam search decoding, and build a
  neural vocoder simulator in Python.'
objectives:
- Transform 1D raw time-domain audio waveforms into 2D Log-Mel Spectrograms using STFT and Mel filterbank
  matrices.
- 'Deconstruct OpenAI Whisper: weakly-supervised multitasking encoder-decoder transformer architecture.'
- Implement Connectionist Temporal Classification (CTC) greedy collapse and beam search decoding algorithms.
- 'Analyze modern Text-to-Speech (TTS) pipelines: acoustic text-to-mel models and HiFi-GAN neural vocoders.'
- Calculate Word Error Rate (WER) and Character Error Rate (CER) benchmarks in Python.
