questions:
- question: Why is audio transformed into a Mel-Spectrogram rather than being fed as raw 1D PCM waveforms
    into speech transformers?
  options:
  - Because 1D audio cannot be stored on hard drives
  - Because raw 16 kHz audio has 16,000 samples per second (excessive sequence length), while a 2D Mel-Spectrogram
    compacts audio into a 100-frames-per-second time-frequency representation that mirrors human perceptual
    auditory frequency sensitivity
  - Because Mel-Spectrograms encrypt audio against piracy
  - Because Fourier transforms eliminate background noise
  answer_index: 1
  explanation: Mel filterbanks compress 16,000 1D temporal samples per second into 100 80-dimensional
    feature frames per second, matching the non-linear logarithmic frequency resolution of human hearing.
- question: How does Connectionist Temporal Classification (CTC) solve the alignment problem in speech
    recognition?
  options:
  - It requires humans to timestamp every syllable manually
  - It introduces a blank token '<blank>' and sums the probabilities of all valid alignment paths that
    collapse into the target label sequence when repeated characters and blanks are removed
  - It forces all audio clips to be exactly 10 seconds
  - It translates audio into MIDI notes
  answer_index: 1
  explanation: CTC marginalizes over all valid frame-level alignments containing blank tokens, allowing
    end-to-end training without explicit word or phoneme boundary labels.
- question: What is the primary function of a Neural Vocoder (such as HiFi-GAN) in modern TTS systems?
  options:
  - Translating English text into French phonemes
  - Synthesizing high-fidelity 1D time-domain pressure waves (audio waveforms) from 2D acoustic mel-spectrogram
    features
  - Transcribing podcast recordings
  - Compressing MP3 audio
  answer_index: 1
  explanation: Neural vocoders solve the phase recovery problem, converting 2D magnitude spectrograms
    into high-fidelity audible audio waveforms.
- question: How does OpenAI Whisper handle multiple tasks (transcription, translation, timestamp prediction)
    in a single model?
  options:
  - By training 10 different separate models
  - 'By using special prefix conditioning tokens: ''<|startoftranscript|><|en|><|transcribe|><|notimestamps|>''
    to steer the autoregressive decoder to the desired task'
  - By running external bash scripts
  - By forcing all input audio to be in English
  answer_index: 1
  explanation: Whisper uses special control tokens prepended to the decoder sequence to indicate language,
    task (transcribe vs translate), and timestamp formatting.
- question: What is Word Error Rate (WER) formula in speech recognition benchmarking?
  options:
  - WER = Total Words / Correct Words
  - WER = (Substitutions + Deletions + Insertions) / Total Reference Words
  - WER = Audio Duration / Inference Time
  - WER = (Correct Words - Errors) / 100
  answer_index: 1
  explanation: WER computes Levenshtein edit distance at the word level, normalizing the sum of word substitutions,
    deletions, and insertions by the total reference word count.
