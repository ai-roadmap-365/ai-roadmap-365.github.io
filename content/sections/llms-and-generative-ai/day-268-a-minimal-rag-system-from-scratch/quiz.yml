questions:
  - question: 'Why does Reciprocal Rank Fusion combine BM25 and dense results by position rather than by score?'
    options:
      - 'BM25 scores are unbounded and cosine scores are not, so there is nothing to normalise'
      - 'RRF is faster to compute than adding two floating-point numbers together'
      - 'RRF retrains the embedding model on each query it receives'
      - 'Rank positions use less memory than the scores they were derived from'
    answer_index: 0
    explanation: 'BM25 produces unbounded positive scores while cosine similarity is bounded to [-1, 1]. RRF sums 1/(k + rank), so the two scales never have to be reconciled and there is no fusion weight to tune.'

  - question: 'A chunker uses a sliding window but omits the terminating condition. What happens?'
    options:
      - 'The first window is silently dropped from the index'
      - 'The final partial window is emitted twice'
      - 'Every chunk is truncated to exactly the overlap length'
      - 'The function raises an IndexError on the last iteration'
    answer_index: 1
    explanation: 'Without the break, the loop advances past the end and re-emits the tail as a duplicate final chunk. The lab tests check for this specifically.'

  - question: 'Today''s pipeline uses hashed vectors rather than a learned embedding model. What does that limit?'
    options:
      - 'The number of chunks that can be held in memory at once'
      - 'The ability to run BM25 alongside the dense retriever'
      - 'Any conclusion about retrieval quality, though the plumbing is faithful'
      - 'Whether Reciprocal Rank Fusion can merge the two rankings'
    answer_index: 2
    explanation: 'The mechanics of dense retrieval are demonstrated correctly, but hashed vectors carry no semantics, so the pipeline says nothing about how good real retrieval would be.'

  - question: 'Why does the lesson argue for building the pipeline once before adopting a framework?'
    options:
      - 'Framework licences prohibit commercial use of retrieval code'
      - 'Frameworks are measurably slower than hand-written Python'
      - 'A hand-written pipeline scales further than a vector database'
      - 'The bugs live in the seams, which configuration hides'
    answer_index: 3
    explanation: 'Most RAG incidents are seam failures: a table split across chunks, a silently truncated prompt, a query embedded with the wrong model version. None is visible from a config file.'

  - question: 'What does the BM25 parameter b control?'
    options:
      - 'Length normalisation, so long documents do not win by containing more words'
      - 'The saturation point beyond which extra term occurrences stop counting'
      - 'How strongly inverse document frequency down-weights common terms'
      - 'The number of documents returned before fusion is applied'
    answer_index: 0
    explanation: 'b (typically 0.75) scales the document-length term. k1 saturates term frequency; IDF is a separate factor entirely.'
