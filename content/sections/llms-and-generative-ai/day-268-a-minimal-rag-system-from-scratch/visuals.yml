visuals:
  - id: minimal-rag-in-memory-pipeline
    file: assets/minimal-rag-in-memory-pipeline.svg
    type: diagram
    title: 'Minimal In-Memory RAG Pipeline'
    alt: Minimal In-Memory RAG Pipeline diagram
    description: 'Architectural diagram illustrating the multi-stage RAG indexing, retrieval, and generation pipeline.'
  - id: naive-rag-prompt-synthesis-flow
    file: assets/naive-rag-prompt-synthesis-flow.svg
    type: diagram
    title: 'Naive RAG Prompt Synthesis Flow'
    alt: Naive RAG Prompt Synthesis Flow diagram
    description: 'Runtime dataflow diagram demonstrating query processing, hybrid search fusion, and grounded answer synthesis.'
  - id: scratch-idea
    file: assets/scratch-idea.svg
    type: diagram
    title: 'The whole system, in five pieces'
    alt: 'Diagram: the five components of a minimal retrieval system'
    description: 'A five-stage description of a minimal retrieval implementation covering chunking, lexical scoring, dense scoring, fusion and prompt assembly.'
  - id: chunk-overlap-code
    file: assets/chunk-overlap-code.svg
    type: diagram
    title: 'Chunking, concretely'
    alt: 'Diagram: the four decisions encoded in a simple chunking function'
    description: 'A four-stage description of a chunking implementation covering the split unit, size, overlap and metadata.'
  - id: bm25-code
    file: assets/bm25-code.svg
    type: diagram
    title: 'Lexical scoring from scratch'
    alt: 'Diagram: the three components of a term-based relevance score'
    description: 'A three-stage description of lexical scoring covering term frequency saturation, inverse document frequency and length normalisation.'
  - id: dense-code
    file: assets/dense-code.svg
    type: diagram
    title: 'Dense retrieval, concretely'
    alt: 'Diagram: how dense retrieval reduces to a single matrix operation'
    description: 'A four-stage description of dense retrieval covering chunk embedding, normalisation, the query and the matrix multiplication.'
  - id: scratch-vs-framework
    file: assets/scratch-vs-framework.svg
    type: diagram
    title: 'From scratch against a framework'
    alt: 'Diagram: a hand-built retrieval pipeline compared with a framework'
    description: 'A two-column comparison of implementing retrieval directly against using a framework.'
  - id: scratch-implications
    file: assets/scratch-implications.svg
    type: diagram
    title: 'What the minimal version leaves out'
    alt: 'Diagram: the four capabilities a production retrieval system adds to a minimal one'
    description: 'A four-stage description of the gap to production covering scale, updates, permissions and observability.'
  - id: engine-teardown
    file: assets/engine-teardown.svg
    type: diagram
    title: 'Taking an engine apart'
    alt: 'Diagram: using a machine as a black box compared with having taken it apart'
    description: 'A two-column comparison of treating a system as opaque against having built it.'
  - id: scratch-when
    file: assets/scratch-when.svg
    type: diagram
    title: 'When to build it yourself'
    alt: 'Diagram: when a hand-built retrieval system is the right choice'
    description: 'A two-column comparison of building retrieval directly against adopting a framework.'
  - id: rrf-code
    file: assets/rrf-code.svg
    type: diagram
    title: 'Fusion in ten lines'
    alt: 'Diagram: how two ranked lists are fused into one in a few lines of code'
    description: 'A four-stage description of a rank fusion implementation covering the two lists, per-list scoring, summation and the final sort.'
  - id: prompt-assembly
    file: assets/prompt-assembly.svg
    type: diagram
    title: 'Assembling the prompt'
    alt: 'Diagram: how retrieved passages are assembled into a grounded prompt in code'
    description: 'A four-stage description of prompt assembly covering the instruction, the passages, the budget and the question.'
  - id: scratch-history
    file: assets/scratch-history.svg
    type: diagram
    title: 'Four steps to a standard pipeline'
    alt: 'Diagram: the historical progression of retrieval pipeline implementations'
    description: 'A four-stage description of retrieval implementation history covering bespoke scripts, early frameworks, framework fatigue and a stable minimal core.'
  - id: scratch-vs-production
    file: assets/scratch-vs-production.svg
    type: diagram
    title: 'The minimal version against production'
    alt: 'Diagram: a minimal retrieval implementation compared with a production one'
    description: 'A two-column comparison of a minimal retrieval implementation against a production deployment.'
