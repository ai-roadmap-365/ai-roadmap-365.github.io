<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The shape stabilised quickly.">
  <title>Four steps to a standard pipeline</title>
  <style>
    .scratch-history-bg   { fill: #f8fafc; }
    .scratch-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scratch-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scratch-history-stage { opacity: 1; }

    .scratch-history-s0 { animation-delay: 0.00s; }
    .scratch-history-e0 { animation-delay: 0.00s; }
    .scratch-history-s1 { animation-delay: 1.28s; }
    .scratch-history-e1 { animation-delay: 1.28s; }
    .scratch-history-s2 { animation-delay: 2.56s; }
    .scratch-history-e2 { animation-delay: 2.56s; }
    .scratch-history-s3 { animation-delay: 3.84s; }
    .scratch-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scratch-history-conn  { animation: scratch-history-trace 6.4s ease-in-out infinite; }
      .scratch-history-stage { animation: scratch-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scratch-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scratch-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scratch-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scratch-history-stage { animation: scratch-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scratch-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scratch-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scratch-history-bg" width="980" height="322"/>
  <text class="scratch-history-h1"  x="30" y="40">Four steps to a standard pipeline</text>
  <text class="scratch-history-sub" x="30" y="64">The shape stabilised quickly.</text>
  <g class="scratch-history-stage scratch-history-s0">
    <rect class="scratch-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-history-step" x="44" y="142">01</text>
    <text class="scratch-history-name" x="70" y="142">Bespoke scripts, all different</text>
    <text class="scratch-history-desc" x="44" y="166">Everyone solving the same</text>
    <text class="scratch-history-desc" x="44" y="182">problem privately.</text>
  </g>
  <line class="scratch-history-line scratch-history-conn scratch-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scratch-history-tip)"/>
  <g class="scratch-history-stage scratch-history-s1">
    <rect class="scratch-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-history-step" x="280" y="142">02</text>
    <text class="scratch-history-name" x="306" y="142">Frameworks arrive and abstract everything</text>
    <text class="scratch-history-desc" x="280" y="166">Fast to start, hard to debug.</text>
  </g>
  <line class="scratch-history-line scratch-history-conn scratch-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scratch-history-tip)"/>
  <g class="scratch-history-stage scratch-history-s2">
    <rect class="scratch-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-history-step" x="516" y="142">03</text>
    <text class="scratch-history-name" x="542" y="142">A reaction toward writing it directly</text>
    <text class="scratch-history-desc" x="516" y="166">Once teams found the</text>
    <text class="scratch-history-desc" x="516" y="182">abstractions leaking.</text>
  </g>
  <line class="scratch-history-line scratch-history-conn scratch-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scratch-history-tip)"/>
  <g class="scratch-history-stage scratch-history-s3">
    <rect class="scratch-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-history-step" x="752" y="142">04</text>
    <text class="scratch-history-name" x="778" y="142">And a stable minimal core emerges</text>
    <text class="scratch-history-desc" x="752" y="166">Which is what these two hundred</text>
    <text class="scratch-history-desc" x="752" y="182">lines are.</text>
  </g>
  <text class="scratch-history-sub" x="30" y="304">The cycle is a familiar one and it has largely settled: the pipeline shape is now standard enough that a framework's value is in its connectors rather than its structure.</text>
</svg>
