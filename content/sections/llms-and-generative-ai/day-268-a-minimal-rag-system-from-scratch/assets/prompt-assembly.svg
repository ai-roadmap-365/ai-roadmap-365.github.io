<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four parts.">
  <title>Assembling the prompt</title>
  <style>
    .prompt-assembly-bg   { fill: #f8fafc; }
    .prompt-assembly-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-assembly-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-assembly-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-assembly-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-assembly-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-assembly-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-assembly-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-assembly-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-assembly-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-assembly-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-assembly-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-assembly-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-assembly-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-assembly-stage { opacity: 1; }

    .prompt-assembly-s0 { animation-delay: 0.00s; }
    .prompt-assembly-e0 { animation-delay: 0.00s; }
    .prompt-assembly-s1 { animation-delay: 1.28s; }
    .prompt-assembly-e1 { animation-delay: 1.28s; }
    .prompt-assembly-s2 { animation-delay: 2.56s; }
    .prompt-assembly-e2 { animation-delay: 2.56s; }
    .prompt-assembly-s3 { animation-delay: 3.84s; }
    .prompt-assembly-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-assembly-conn  { animation: prompt-assembly-trace 6.4s ease-in-out infinite; }
      .prompt-assembly-stage { animation: prompt-assembly-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prompt-assembly-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-assembly-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-assembly-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-assembly-stage { animation: prompt-assembly-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-assembly-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-assembly-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-assembly-bg" width="980" height="322"/>
  <text class="prompt-assembly-h1"  x="30" y="40">Assembling the prompt</text>
  <text class="prompt-assembly-sub" x="30" y="64">Four parts.</text>
  <g class="prompt-assembly-stage prompt-assembly-s0">
    <rect class="prompt-assembly-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-assembly-step" x="44" y="142">01</text>
    <text class="prompt-assembly-name" x="70" y="142">The instruction, first</text>
    <text class="prompt-assembly-desc" x="44" y="166">Answer only from the passages,</text>
    <text class="prompt-assembly-desc" x="44" y="182">and cite them.</text>
  </g>
  <line class="prompt-assembly-line prompt-assembly-conn prompt-assembly-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prompt-assembly-tip)"/>
  <g class="prompt-assembly-stage prompt-assembly-s1">
    <rect class="prompt-assembly-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-assembly-step" x="280" y="142">02</text>
    <text class="prompt-assembly-name" x="306" y="142">The passages, labelled and delimited</text>
    <text class="prompt-assembly-desc" x="280" y="166">Each with an identifier the</text>
    <text class="prompt-assembly-desc" x="280" y="182">model can cite.</text>
  </g>
  <line class="prompt-assembly-line prompt-assembly-conn prompt-assembly-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prompt-assembly-tip)"/>
  <g class="prompt-assembly-stage prompt-assembly-s2">
    <rect class="prompt-assembly-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-assembly-step" x="516" y="142">03</text>
    <text class="prompt-assembly-name" x="542" y="142">Truncated to a token budget</text>
    <text class="prompt-assembly-desc" x="516" y="166">Highest-ranked first, so the cut</text>
    <text class="prompt-assembly-desc" x="516" y="182">falls on the weakest.</text>
  </g>
  <line class="prompt-assembly-line prompt-assembly-conn prompt-assembly-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prompt-assembly-tip)"/>
  <g class="prompt-assembly-stage prompt-assembly-s3">
    <rect class="prompt-assembly-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-assembly-step" x="752" y="142">04</text>
    <text class="prompt-assembly-name" x="778" y="142">Then the question, last</text>
    <text class="prompt-assembly-desc" x="752" y="166">Where attention is strongest.</text>
  </g>
  <text class="prompt-assembly-sub" x="30" y="304">Cutting from the bottom rather than the top is the small decision that matters: truncating the highest-ranked passage to fit the budget discards exactly what retrieval worked for.</text>
</svg>
