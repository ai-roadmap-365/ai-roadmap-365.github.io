<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three components.">
  <title>Lexical scoring from scratch</title>
  <style>
    .bm25-code-bg   { fill: #f8fafc; }
    .bm25-code-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-code-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-code-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-code-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-code-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-code-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bm25-code-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bm25-code-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bm25-code-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bm25-code-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bm25-code-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bm25-code-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bm25-code-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bm25-code-stage { opacity: 1; }

    .bm25-code-s0 { animation-delay: 0.00s; }
    .bm25-code-e0 { animation-delay: 0.00s; }
    .bm25-code-s1 { animation-delay: 1.50s; }
    .bm25-code-e1 { animation-delay: 1.50s; }
    .bm25-code-s2 { animation-delay: 3.00s; }
    .bm25-code-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .bm25-code-conn  { animation: bm25-code-trace 6s ease-in-out infinite; }
      .bm25-code-stage { animation: bm25-code-arrive 6s ease-in-out infinite; }
    }
    @keyframes bm25-code-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bm25-code-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bm25-code-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bm25-code-stage { animation: bm25-code-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bm25-code-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bm25-code-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bm25-code-bg" width="980" height="322"/>
  <text class="bm25-code-h1"  x="30" y="40">Lexical scoring from scratch</text>
  <text class="bm25-code-sub" x="30" y="64">Three components.</text>
  <g class="bm25-code-stage bm25-code-s0">
    <rect class="bm25-code-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="bm25-code-step" x="44" y="142">01</text>
    <text class="bm25-code-name" x="70" y="142">How often the term appears</text>
    <text class="bm25-code-desc" x="44" y="166">With diminishing returns, so ten occurrences</text>
    <text class="bm25-code-desc" x="44" y="182">are not ten times one.</text>
  </g>
  <line class="bm25-code-line bm25-code-conn bm25-code-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#bm25-code-tip)"/>
  <g class="bm25-code-stage bm25-code-s1">
    <rect class="bm25-code-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="bm25-code-step" x="359" y="142">02</text>
    <text class="bm25-code-name" x="385" y="142">How rare the term is overall</text>
    <text class="bm25-code-desc" x="359" y="166">A term in every document carries no</text>
    <text class="bm25-code-desc" x="359" y="182">information.</text>
  </g>
  <line class="bm25-code-line bm25-code-conn bm25-code-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#bm25-code-tip)"/>
  <g class="bm25-code-stage bm25-code-s2">
    <rect class="bm25-code-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="bm25-code-step" x="674" y="142">03</text>
    <text class="bm25-code-name" x="700" y="142">And how long the document is</text>
    <text class="bm25-code-desc" x="674" y="166">So length alone does not win.</text>
  </g>
  <text class="bm25-code-sub" x="30" y="304">Implementing this once makes the behaviour obvious afterwards: it explains both why a rare identifier matches decisively and why a common word contributes nothing.</text>
</svg>
