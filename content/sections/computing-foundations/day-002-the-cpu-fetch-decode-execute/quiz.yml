questions:
  - question: 'During the fetch phase of the instruction cycle, what does the program counter (PC) hold?'
    options:
      - 'The instruction currently being executed'
      - 'The result of the last ALU operation'
      - 'The memory address of the next instruction to fetch'
      - 'The number of instructions executed so far'
    answer_index: 2
    explanation: 'The PC is a special register holding the address of the next instruction. The control unit places that address on the bus to fetch the instruction, then advances the PC — it is an address pointer, not a tally.'

  - question: 'Which component examines a fetched instruction''s bit pattern and steers the other parts of the CPU accordingly?'
    options:
      - 'The control unit'
      - 'The ALU'
      - 'The instruction register'
      - 'The bus'
    answer_index: 0
    explanation: 'Decoding is the control unit''s job: it reads the instruction held in the instruction register and routes operands, selects the operation, and aims the result — like railway points being switched.'

  - question: 'A CPU runs at 3 GHz. What exactly happens three billion times per second?'
    options:
      - 'Three billion instructions complete'
      - 'The clock ticks — the chip''s shared timing signal cycles'
      - 'Three billion values move from RAM into registers'
      - 'The program counter resets to zero'
    answer_index: 1
    explanation: 'Gigahertz counts clock cycles, not instructions. An instruction may take many cycles, and a modern core can also complete several instructions in one cycle — which is why performance is roughly clock speed times instructions per cycle (IPC).'

  - question: 'Why does the program counter advancing at fetch time (before execution) matter so much?'
    options:
      - 'It lets the CPU skip instructions that contain errors'
      - 'It makes the fetch phase run at a higher clock speed'
      - 'It keeps the instruction register from being overwritten'
      - 'An instruction can overwrite the already-advanced PC, which is how jumps and loops work'
    answer_index: 3
    explanation: 'Because the PC is just a register holding the next address, an instruction that writes a different address into it redirects the machine — jumping backward creates loops, and conditional jumps create decisions.'

  - question: 'In a four-stage pipeline (fetch, decode, execute, write-back) that is full, how often does an instruction finish?'
    options:
      - 'Every four cycles, because each instruction takes four stages'
      - 'Every cycle, even though each instruction still takes four cycles end to end'
      - 'Twice per cycle, because stages overlap'
      - 'It depends on the clock speed'
    answer_index: 1
    explanation: 'Pipelining overlaps the stages of consecutive instructions: while one instruction executes, the next decodes and a third is fetched. Once all stages are busy, one instruction completes per cycle — throughput rises fourfold with no stage running faster.'

  - question: 'Which statement correctly contrasts the x86 and ARM instruction sets?'
    options:
      - 'x86 grew from Intel''s 1978 8086 with many variable-length instructions; ARM follows the RISC philosophy of fewer, simpler, fixed-size instructions'
      - 'ARM programs run natively on x86 chips because both use the same machine code'
      - 'x86 was designed for phones and ARM for desktop computers'
      - 'ARM chips are made only by Intel and AMD, while x86 is licensed to many companies'
    answer_index: 0
    explanation: 'x86 is the CISC-lineage contract descending from the 8086, with instructions from 1 to 15 bytes; ARM began in 1985 as the Acorn RISC Machine with simple uniform instructions, is licensed broadly, and dominates phones — the licensing and origin claims in the other options are reversed or false.'

  - question: 'Why did Apple''s 2020 move of Macs from Intel x86 to its own ARM-based M1 chips matter beyond Apple?'
    options:
      - 'It proved x86 processors could no longer run desktop software'
      - 'It was the first time any computer had used a RISC processor'
      - 'It doubled the clock speed of laptop processors industry-wide'
      - 'It showed the power-efficient phone architecture could outperform high-end x86 laptops, accelerating ARM''s move into laptops and cloud servers'
    answer_index: 3
    explanation: 'Apple Silicon demonstrated ARM''s performance-per-watt advantage at the high end, not just in phones — and cloud providers drew the same conclusion, expanding ARM server offerings where energy is a dominant cost.'

  - question: 'A training job shows the GPU 30% utilized while one CPU core is pinned at 100%. What is the most likely situation?'
    options:
      - 'The GPU is defective and should be replaced'
      - 'The job is CPU-bound: sequential work like data loading and preprocessing cannot keep pace, so the GPU starves waiting for batches'
      - 'The clock speed of the GPU is set too low'
      - 'The job is GPU-bound, which is why the GPU shows less than full utilization'
    answer_index: 1
    explanation: 'CPU-bound means the CPU''s instruction stream is the bottleneck. The branchy, sequential work of feeding data cannot match the GPU''s appetite, so the expensive parallel hardware idles — fixed by more loader workers, compiled preprocessing, or cached data, not by touching the GPU.'
