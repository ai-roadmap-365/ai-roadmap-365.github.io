slug: the-cpu-fetch-decode-execute
title: 'The CPU: Fetch, Decode, Execute'
section: computing-foundations
subsection: how-computers-work
week: 1
learning_promise: 'After this lesson you will be able to open up the CPU in your mind — control unit, ALU, registers, program counter — trace any simple program through the fetch-decode-execute cycle by hand, and use clock speed, instruction sets, and pipelining to reason about real hardware choices, including why GPUs beat CPUs at bulk math.'
objectives:
  - 'Name the main parts of a CPU core — control unit, ALU, registers, program counter, instruction register, flags — and state each one''s role in the instruction cycle'
  - 'Trace the fetch-decode-execute-write-back cycle by hand for a short assembly-style program, predicting every register value and output before running it'
  - 'Explain why the program counter advances at fetch time and why that mechanism is what makes jumps and loops possible'
  - 'Distinguish clock speed (GHz) from instructions per cycle, and explain why gigahertz alone stopped predicting performance after the mid-2000s'
  - 'Compare the x86 and ARM instruction sets — design philosophy, strongholds, and licensing — and explain why Apple Silicon''s 2020 transition mattered for the industry'
  - 'Describe how pipelining overlaps instruction stages to raise throughput, and what branch prediction and speculative execution add and risk'
  - 'Diagnose a "CPU-bound" AI workload: explain why a GPU starves when sequential CPU work cannot keep pace, and name the standard remedies'
prerequisites:
  - 'Day 1 (How a Computer Works): transistors, logic gates, the von Neumann architecture, and the first look at the instruction cycle'
  - 'A terminal with bash for the lab (macOS, Linux, or WSL on Windows)'
reading_time_minutes: 40
practical_time_minutes: 30
