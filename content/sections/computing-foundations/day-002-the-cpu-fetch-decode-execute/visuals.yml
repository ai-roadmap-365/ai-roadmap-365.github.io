visuals:
  - id: cpu-internals
    file: assets/cpu-internals.svg
    type: diagram
    title: 'Inside the CPU'
    alt: 'Diagram: inside the CPU — the control unit with program counter and instruction register, the ALU, and the registers, connected over a bus to memory'
    description: 'A cutaway of a CPU core: the control unit containing the program counter and instruction register, the ALU beneath it, and the register file R1 through R4 with flags, all joined by internal arrows and connected across a bus to memory cells holding the toy program''s instructions.'
  - id: pipeline
    file: assets/pipeline.svg
    type: diagram
    title: 'Pipelining: four instructions in flight at once'
    alt: 'Diagram: four instructions overlapping in the fetch, decode, execute, and write-back pipeline stages'
    description: 'A staircase timing grid over seven clock cycles showing four instructions each passing through fetch, decode, execute, and write-back one cycle apart, with cycle 4 highlighted as the moment all four stages are busy — after which one instruction completes every cycle.'
