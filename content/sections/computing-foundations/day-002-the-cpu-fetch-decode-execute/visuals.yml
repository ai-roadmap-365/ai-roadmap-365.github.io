visuals:
  - id: cpu-internals
    file: assets/cpu-internals.svg
    type: diagram
    title: 'Inside the CPU'
    alt: 'Diagram: inside the CPU — the control unit with program counter and instruction register, the ALU, and the registers, connected over a bus to memory'
    description: 'A cutaway of a CPU core: the control unit containing the program counter and instruction register, the ALU beneath it, and the register file R1 through R4 with flags, all joined by internal arrows and connected across a bus to memory cells holding the toy program''s instructions.'
  - id: pipeline
    file: assets/pipeline.svg
    type: diagram
    title: 'Pipelining: four instructions in flight at once'
    alt: 'Diagram: four instructions overlapping in the fetch, decode, execute, and write-back pipeline stages'
    description: 'A staircase timing grid over seven clock cycles showing four instructions each passing through fetch, decode, execute, and write-back one cycle apart, with cycle 4 highlighted as the moment all four stages are busy — after which one instruction completes every cycle.'
  - id: fetch-decode-execute-cycle
    file: assets/fetch-decode-execute-cycle.svg
    type: diagram
    title: 'One instruction, four stages'
    alt: 'Diagram: the four stages of the fetch-decode-execute cycle'
    description: 'A four-stage sequence — fetch, decode, execute, write back — with what happens at each stage and which component drives it. A token travels the stages to show the order.'
  - id: clock-speed-stalled
    file: assets/clock-speed-stalled.svg
    type: diagram
    title: 'Why chips stopped getting faster and started getting wider'
    alt: 'Diagram: raising clock speed compared with adding cores'
    description: 'A two-column comparison of the two ways to make a processor do more work: raising the clock, which hit a power and heat wall around 2005, and adding cores, which is what happened instead.'
  - id: program-counter-loop
    file: assets/program-counter-loop.svg
    type: diagram
    title: 'The register that makes software possible'
    alt: 'Diagram: how the program counter creates sequence, loops and decisions'
    description: 'A four-stage sequence showing the program counter advancing normally, being overwritten to jump backward creating a loop, being overwritten conditionally creating a decision, and the combination producing all software.'
  - id: risc-versus-cisc
    file: assets/risc-versus-cisc.svg
    type: diagram
    title: 'Two philosophies about how much one instruction should do'
    alt: 'Diagram: CISC compared with RISC instruction set design'
    description: 'A two-column comparison of CISC and RISC design, covering instruction complexity, decoding cost, power efficiency and where each is found today.'
  - id: why-the-gpu-waits
    file: assets/why-the-gpu-waits.svg
    type: diagram
    title: 'A GPU at 40% utilisation is not a GPU problem'
    alt: 'Diagram: a GPU-bound job compared with a CPU-bound one'
    description: 'A two-column comparison of a job limited by the accelerator and one limited by the sequential work feeding it, with the symptom and the fix for each.'
  - id: assembly-line-analogy
    file: assets/assembly-line-analogy.svg
    type: diagram
    title: 'Throughput and latency are different numbers'
    alt: 'Diagram: an assembly line as an analogy for pipeline stages'
    description: 'A four-stage sequence framing the pipeline as an assembly line: a station fetches the part, one reads the work order, one does the work, one puts the item away.'
  - id: cycle-cost-scale
    file: assets/cycle-cost-scale.svg
    type: diagram
    title: 'The processor is usually waiting'
    alt: 'Diagram: the cost of a cycle compared with the cost of a memory access'
    description: 'A two-column comparison of what happens inside one CPU cycle against what a memory access costs, showing that a memory access is roughly 300 cycles.'
  - id: speculation-and-security
    file: assets/speculation-and-security.svg
    type: diagram
    title: 'How a performance trick became a security hole'
    alt: 'Diagram: how speculative execution leaks data across a security boundary'
    description: 'A four-stage sequence showing a processor guessing past a branch, executing work speculatively, discarding the wrong-path result but leaving traces in the cache, and an attacker timing cache access to recover them.'
  - id: when-more-cores-help
    file: assets/when-more-cores-help.svg
    type: diagram
    title: 'When adding cores helps, and when it changes nothing'
    alt: 'Diagram: parallelisable work compared with sequential work'
    description: 'A two-column comparison of work that can be divided across cores and work that must happen in order, with examples of each from machine-learning practice.'
  - id: pipeline-parallelism
    file: assets/pipeline-parallelism.svg
    type: diagram
    title: 'Why a processor works on several instructions at once'
    alt: 'Diagram: sequential instruction execution compared with a pipelined processor'
    description: 'A two-column comparison of executing instructions strictly one after another against overlapping their stages in a pipeline, covering throughput and the hazards pipelining introduces.'
