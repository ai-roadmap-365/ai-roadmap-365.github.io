<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The question is whether the work can be split, not how much of it there is.">
  <title>When adding cores helps, and when it changes nothing</title>
  <style>
    .when-more-cores-help-bg   { fill: #f8fafc; }
    .when-more-cores-help-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-more-cores-help-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-more-cores-help-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-more-cores-help-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-more-cores-help-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-more-cores-help-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-more-cores-help-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .when-more-cores-help-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .when-more-cores-help-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .when-more-cores-help-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .when-more-cores-help-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .when-more-cores-help-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-more-cores-help-row { opacity: 1; }
    .when-more-cores-help-r0 { animation-delay: 0.00s; }
    .when-more-cores-help-r1 { animation-delay: 0.45s; }
    .when-more-cores-help-r2 { animation-delay: 0.90s; }
    .when-more-cores-help-r3 { animation-delay: 1.35s; }
    .when-more-cores-help-r4 { animation-delay: 1.80s; }
    .when-more-cores-help-row { animation: when-more-cores-help-reveal 7.3s ease-in-out infinite; }
    @keyframes when-more-cores-help-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="when-more-cores-help-bg" width="980" height="390"/>
  <text class="when-more-cores-help-h1"  x="30" y="40">When adding cores helps, and when it changes nothing</text>
  <text class="when-more-cores-help-sub" x="30" y="64">The question is whether the work can be split, not how much of it there is.</text>
  <rect class="when-more-cores-help-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="when-more-cores-help-name" x="46" y="122">Splits across cores</text>
  <text class="when-more-cores-help-desc" x="46" y="142">More cores, less wall clock</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r0" x="46" y="182">Preprocessing a thousand images</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r1" x="46" y="216">Scoring rows of a dataset independently</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r2" x="46" y="250">Matrix multiplication</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r3" x="46" y="284">Running one process per GPU</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r4" x="46" y="318">Each piece needs nothing from the others</text>
  <rect class="when-more-cores-help-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="when-more-cores-help-name" x="526" y="122">Must happen in order</text>
  <text class="when-more-cores-help-desc" x="526" y="142">More cores, no change</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r0" x="526" y="182">Each training step depends on the last</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r1" x="526" y="216">Parsing a file line by line</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r2" x="526" y="250">A chain where step 3 needs step 2's answer</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r3" x="526" y="284">Python bytecode inside one process</text>
  <text class="when-more-cores-help-desc when-more-cores-help-row when-more-cores-help-r4" x="526" y="318">Adding cores buys idle cores</text>
  <text class="when-more-cores-help-sub" x="30" y="372">Doubling cores on sequential work gives you two cores, one of which is waiting.</text>
</svg>
