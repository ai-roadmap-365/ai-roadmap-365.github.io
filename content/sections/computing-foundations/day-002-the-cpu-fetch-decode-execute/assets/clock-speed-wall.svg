<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And started getting wider instead.">
  <title>Why processors stopped getting faster</title>
  <style>
    .clock-speed-wall-bg   { fill: #f8fafc; }
    .clock-speed-wall-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-wall-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-wall-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-wall-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-wall-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-wall-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clock-speed-wall-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clock-speed-wall-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clock-speed-wall-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clock-speed-wall-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clock-speed-wall-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clock-speed-wall-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clock-speed-wall-row { opacity: 1; }
    .clock-speed-wall-r0 { animation-delay: 0.00s; }
    .clock-speed-wall-r1 { animation-delay: 0.45s; }
    .clock-speed-wall-r2 { animation-delay: 0.90s; }
    .clock-speed-wall-r3 { animation-delay: 1.35s; }
    .clock-speed-wall-r4 { animation-delay: 1.80s; }
    .clock-speed-wall-row { animation: clock-speed-wall-reveal 7.3s ease-in-out infinite; }
    @keyframes clock-speed-wall-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="clock-speed-wall-bg" width="980" height="390"/>
  <text class="clock-speed-wall-h1"  x="30" y="40">Why processors stopped getting faster</text>
  <text class="clock-speed-wall-sub" x="30" y="64">And started getting wider instead.</text>
  <rect class="clock-speed-wall-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="clock-speed-wall-name" x="46" y="122">Raise the clock</text>
  <text class="clock-speed-wall-desc" x="46" y="142">The strategy until about 2005.</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r0" x="46" y="182">Every program got faster for free</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r1" x="46" y="216">No code changes required</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r2" x="46" y="250">Power rises faster than speed does</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r3" x="46" y="284">Heat became the hard limit</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r4" x="46" y="318">The free lunch ended</text>
  <rect class="clock-speed-wall-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="clock-speed-wall-name" x="526" y="122">Add more cores</text>
  <text class="clock-speed-wall-desc" x="526" y="142">The strategy since.</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r0" x="526" y="182">Same clock, more of them</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r1" x="526" y="216">Nothing gets faster for free</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r2" x="526" y="250">The program must do things in parallel</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r3" x="526" y="284">Which is why Day 7 exists</text>
  <text class="clock-speed-wall-desc clock-speed-wall-row clock-speed-wall-r4" x="526" y="318">And why GPUs took over AI</text>
  <text class="clock-speed-wall-sub" x="30" y="372">This is the single most consequential hardware change of your lifetime as a programmer: performance stopped being something you were given and became something you have to arrange for.</text>
</svg>
