<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The stages would be idle otherwise.">
  <title>Why a processor works on several instructions at once</title>
  <style>
    .pipeline-parallelism-bg   { fill: #f8fafc; }
    .pipeline-parallelism-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-parallelism-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-parallelism-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-parallelism-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-parallelism-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-parallelism-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-parallelism-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-parallelism-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-parallelism-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-parallelism-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-parallelism-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-parallelism-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-parallelism-row { opacity: 1; }
    .pipeline-parallelism-r0 { animation-delay: 0.00s; }
    .pipeline-parallelism-r1 { animation-delay: 0.45s; }
    .pipeline-parallelism-r2 { animation-delay: 0.90s; }
    .pipeline-parallelism-r3 { animation-delay: 1.35s; }
    .pipeline-parallelism-r4 { animation-delay: 1.80s; }
    .pipeline-parallelism-row { animation: pipeline-parallelism-reveal 7.3s ease-in-out infinite; }
    @keyframes pipeline-parallelism-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pipeline-parallelism-bg" width="980" height="390"/>
  <text class="pipeline-parallelism-h1"  x="30" y="40">Why a processor works on several instructions at once</text>
  <text class="pipeline-parallelism-sub" x="30" y="64">The stages would be idle otherwise.</text>
  <rect class="pipeline-parallelism-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pipeline-parallelism-name" x="46" y="122">One at a time</text>
  <text class="pipeline-parallelism-desc" x="46" y="142">Finish, then start the next.</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r0" x="46" y="182">Fetch, decode, execute, write back</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r1" x="46" y="216">Then begin the next instruction</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r2" x="46" y="250">Three of the four stages idle at any moment</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r3" x="46" y="284">Simple, and slow</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r4" x="46" y="318">Throughput bounded by the whole cycle</text>
  <rect class="pipeline-parallelism-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pipeline-parallelism-name" x="526" y="122">Pipelined</text>
  <text class="pipeline-parallelism-desc" x="526" y="142">Every stage busy, every cycle.</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r0" x="526" y="182">Instruction 2 decodes while 1 executes</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r1" x="526" y="216">Instruction 3 fetches while 2 decodes</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r2" x="526" y="250">All stages working at once</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r3" x="526" y="284">Several instructions in flight</text>
  <text class="pipeline-parallelism-desc pipeline-parallelism-row pipeline-parallelism-r4" x="526" y="318">Throughput bounded by the slowest stage</text>
  <text class="pipeline-parallelism-sub" x="30" y="372">The cost is that a branch may make the in-flight instructions wrong, which is why processors predict branches — and why a mispredicted one is expensive enough to matter to your code.</text>
</svg>
