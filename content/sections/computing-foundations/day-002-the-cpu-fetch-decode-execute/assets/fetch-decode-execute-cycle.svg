<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="The cycle repeats billions of times a second. Every program you run is this loop.">
  <title>One instruction, four stages</title>
  <style>
    .fetch-decode-execute-cycle-bg   { fill: #f8fafc; }
    .fetch-decode-execute-cycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fetch-decode-execute-cycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fetch-decode-execute-cycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fetch-decode-execute-cycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fetch-decode-execute-cycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fetch-decode-execute-cycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fetch-decode-execute-cycle-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .fetch-decode-execute-cycle-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .fetch-decode-execute-cycle-tok { animation: fetch-decode-execute-cycle-travel 7s ease-in-out infinite; }
    }
    @keyframes fetch-decode-execute-cycle-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--fetch-decode-execute-cycle-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fetch-decode-execute-cycle-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="fetch-decode-execute-cycle-bg" width="980" height="334"/>
  <text class="fetch-decode-execute-cycle-h1"  x="30" y="40">One instruction, four stages</text>
  <text class="fetch-decode-execute-cycle-sub" x="30" y="64">The cycle repeats billions of times a second. Every program you run is this loop.</text>
  <rect class="fetch-decode-execute-cycle-box" x="30" y="132" width="213" height="96" rx="9"/>
  <text class="fetch-decode-execute-cycle-name" x="44" y="160">Fetch</text>
  <text class="fetch-decode-execute-cycle-desc" x="44" y="182">The program counter names an</text>
  <text class="fetch-decode-execute-cycle-desc" x="44" y="198">address; memory answers with the</text>
  <text class="fetch-decode-execute-cycle-desc" x="44" y="214">instruction.</text>
  <text class="fetch-decode-execute-cycle-edge" x="44" y="248">PC advances</text>
  <line class="fetch-decode-execute-cycle-line" x1="246" y1="180" x2="262" y2="180"/>
  <rect class="fetch-decode-execute-cycle-box" x="265" y="132" width="213" height="96" rx="9"/>
  <text class="fetch-decode-execute-cycle-name" x="279" y="160">Decode</text>
  <text class="fetch-decode-execute-cycle-desc" x="279" y="182">The control unit works out what</text>
  <text class="fetch-decode-execute-cycle-desc" x="279" y="198">the bits mean and which units to</text>
  <text class="fetch-decode-execute-cycle-desc" x="279" y="214">wake.</text>
  <text class="fetch-decode-execute-cycle-edge" x="279" y="248">control unit</text>
  <line class="fetch-decode-execute-cycle-line" x1="481" y1="180" x2="497" y2="180"/>
  <rect class="fetch-decode-execute-cycle-hi" x="500" y="132" width="213" height="96" rx="9"/>
  <text class="fetch-decode-execute-cycle-name" x="514" y="160">Execute</text>
  <text class="fetch-decode-execute-cycle-desc" x="514" y="182">The arithmetic unit does the</text>
  <text class="fetch-decode-execute-cycle-desc" x="514" y="198">work on values held in</text>
  <text class="fetch-decode-execute-cycle-desc" x="514" y="214">registers.</text>
  <text class="fetch-decode-execute-cycle-edge" x="514" y="248">ALU</text>
  <line class="fetch-decode-execute-cycle-line" x1="716" y1="180" x2="732" y2="180"/>
  <rect class="fetch-decode-execute-cycle-box" x="735" y="132" width="213" height="96" rx="9"/>
  <text class="fetch-decode-execute-cycle-name" x="749" y="160">Write back</text>
  <text class="fetch-decode-execute-cycle-desc" x="749" y="182">The result is stored back into a</text>
  <text class="fetch-decode-execute-cycle-desc" x="749" y="198">register or out to memory.</text>
  <text class="fetch-decode-execute-cycle-edge" x="749" y="248">registers</text>
  <rect class="fetch-decode-execute-cycle-tok" x="34" y="106" width="58" height="14" rx="3" style="--fetch-decode-execute-cycle-run: 705px"/>
  <text class="fetch-decode-execute-cycle-sub" x="30" y="314">An instruction can overwrite the already-advanced program counter — that is exactly what a jump or a loop is.</text>
</svg>
