<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One item leaves the line every beat, and every item still visits four stations.">
  <title>Throughput and latency are different numbers</title>
  <style>
    .assembly-line-analogy-bg   { fill: #f8fafc; }
    .assembly-line-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-line-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assembly-line-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assembly-line-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assembly-line-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assembly-line-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assembly-line-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assembly-line-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .assembly-line-analogy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .assembly-line-analogy-stage { opacity: 1; }

    .assembly-line-analogy-s0 { animation-delay: 0.00s; }
    .assembly-line-analogy-e0 { animation-delay: 0.00s; }
    .assembly-line-analogy-s1 { animation-delay: 1.28s; }
    .assembly-line-analogy-e1 { animation-delay: 1.28s; }
    .assembly-line-analogy-s2 { animation-delay: 2.56s; }
    .assembly-line-analogy-e2 { animation-delay: 2.56s; }
    .assembly-line-analogy-s3 { animation-delay: 3.84s; }
    .assembly-line-analogy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .assembly-line-analogy-conn  { animation: assembly-line-analogy-trace 6.4s ease-in-out infinite; }
      .assembly-line-analogy-stage { animation: assembly-line-analogy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes assembly-line-analogy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes assembly-line-analogy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .assembly-line-analogy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .assembly-line-analogy-stage { animation: assembly-line-analogy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes assembly-line-analogy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="assembly-line-analogy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="assembly-line-analogy-bg" width="980" height="322"/>
  <text class="assembly-line-analogy-h1"  x="30" y="40">Throughput and latency are different numbers</text>
  <text class="assembly-line-analogy-sub" x="30" y="64">One item leaves the line every beat, and every item still visits four stations.</text>
  <g class="assembly-line-analogy-stage assembly-line-analogy-s0">
    <rect class="assembly-line-analogy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="assembly-line-analogy-step" x="44" y="142">01</text>
    <text class="assembly-line-analogy-name" x="70" y="142">Fetch the part</text>
    <text class="assembly-line-analogy-desc" x="44" y="166">Collect the next item from the</text>
    <text class="assembly-line-analogy-desc" x="44" y="182">store.</text>
    <text class="assembly-line-analogy-edge" x="44" y="242">beat 1</text>
  </g>
  <line class="assembly-line-analogy-line assembly-line-analogy-conn assembly-line-analogy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#assembly-line-analogy-tip)"/>
  <g class="assembly-line-analogy-stage assembly-line-analogy-s1">
    <rect class="assembly-line-analogy-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="assembly-line-analogy-step" x="280" y="142">02</text>
    <text class="assembly-line-analogy-name" x="306" y="142">Read the order</text>
    <text class="assembly-line-analogy-desc" x="280" y="166">Work out what is to be done to</text>
    <text class="assembly-line-analogy-desc" x="280" y="182">it.</text>
    <text class="assembly-line-analogy-edge" x="280" y="242">beat 2</text>
  </g>
  <line class="assembly-line-analogy-line assembly-line-analogy-conn assembly-line-analogy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#assembly-line-analogy-tip)"/>
  <g class="assembly-line-analogy-stage assembly-line-analogy-s2">
    <rect class="assembly-line-analogy-hi" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="assembly-line-analogy-step" x="516" y="142">03</text>
    <text class="assembly-line-analogy-name" x="542" y="142">Do the work</text>
    <text class="assembly-line-analogy-desc" x="516" y="166">The station that actually</text>
    <text class="assembly-line-analogy-desc" x="516" y="182">changes the item.</text>
    <text class="assembly-line-analogy-edge" x="516" y="242">beat 3</text>
  </g>
  <line class="assembly-line-analogy-line assembly-line-analogy-conn assembly-line-analogy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#assembly-line-analogy-tip)"/>
  <g class="assembly-line-analogy-stage assembly-line-analogy-s3">
    <rect class="assembly-line-analogy-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="assembly-line-analogy-step" x="752" y="142">04</text>
    <text class="assembly-line-analogy-name" x="778" y="142">Put it away</text>
    <text class="assembly-line-analogy-desc" x="752" y="166">The finished item leaves the</text>
    <text class="assembly-line-analogy-desc" x="752" y="182">line.</text>
    <text class="assembly-line-analogy-edge" x="752" y="242">beat 4</text>
  </g>
  <text class="assembly-line-analogy-sub" x="30" y="304">A wrong work order empties the whole line — which is exactly what a mispredicted branch costs a processor.</text>
</svg>
