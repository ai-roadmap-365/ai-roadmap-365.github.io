terms:
  - term: ALU
    definition: 'The arithmetic logic unit — the block of gate circuitry inside a CPU core that performs arithmetic and logic operations on register values and sets the status flags.'
  - term: control unit
    definition: 'The part of the CPU that runs the instruction cycle: it fetches each instruction, decodes its bit pattern, and steers the ALU, registers, and bus to carry it out.'
  - term: register
    definition: 'One of a small, fixed set of ultra-fast storage slots inside the CPU that hold the values being worked on at this instant — the fastest memory in the machine.'
  - term: program counter
    definition: 'The special register holding the memory address of the next instruction; it advances at fetch time, and instructions that overwrite it create jumps and loops.'
  - term: instruction register
    definition: 'The register that holds the instruction currently being decoded, parked where the control unit''s decoding circuitry can examine its bits.'
  - term: flags
    definition: 'Single bits set by the ALU recording facts about the last result — such as "it was zero" or "it was negative" — that later instructions can test to make decisions.'
  - term: instruction set
    definition: 'The published catalogue of operations, visible registers, and bit encodings a processor family promises to execute — the contract between software and silicon.'
  - term: machine code
    definition: 'The raw binary instructions, encoded per an instruction set, that a CPU executes directly.'
  - term: assembly language
    definition: 'A human-readable notation for machine instructions, one line per instruction, like the toy machine''s ADD R1,R2->R3.'
  - term: clock cycle
    definition: 'One tick of the CPU''s shared timing signal — the chip''s indivisible unit of time, within which each pipeline stage must finish its step.'
  - term: gigahertz
    definition: 'A billion clock cycles per second; a 3 GHz CPU''s clock ticks three billion times each second, making one cycle about a third of a nanosecond.'
  - term: IPC
    definition: 'Instructions per cycle — how many instructions a core completes per clock tick on a given workload; performance is roughly clock speed times IPC.'
  - term: pipeline
    definition: 'The assembly-line organization of the instruction cycle in which the fetch, decode, execute, and write-back stages of consecutive instructions overlap, so one instruction can finish every cycle.'
  - term: branch prediction
    definition: 'The hardware''s educated bet on which way a conditional jump will go, made so the pipeline can keep fetching; a wrong bet forces the speculative work to be discarded.'
  - term: x86
    definition: 'The instruction-set family descending from Intel''s 1978 8086 — complex, variable-length instructions — that still dominates desktop and much server computing.'
  - term: ARM
    definition: 'The RISC instruction-set family begun as the Acorn RISC Machine in 1985 — simple, uniform, power-frugal instructions — that powers essentially all smartphones and, since Apple Silicon, a growing share of laptops and servers.'
  - term: CPU-bound
    definition: 'Describes a workload whose speed is limited by the CPU''s instruction stream rather than by memory, disk, network, or an accelerator — as when a starving GPU idles because sequential preprocessing cannot keep up.'
