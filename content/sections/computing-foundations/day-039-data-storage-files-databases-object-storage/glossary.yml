terms:
  - term: file
    definition: 'A named blob of bytes stored on disk and organized by a filesystem into folders; the simplest storage shape, ideal when data is read far more than written and by one program at a time.'
  - term: filesystem
    definition: 'The part of an operating system that organizes a disk into named files inside a tree of folders and tracks where each file''s bytes physically live.'
  - term: database
    definition: 'A running program whose whole job is to store data so it can be queried and changed safely, even when many clients access it at once.'
  - term: relational database
    definition: 'A database that stores data in tables of rows and typed columns under a fixed schema, queried with SQL and protected by ACID transactions; examples include PostgreSQL, MySQL, and SQLite.'
  - term: SQL
    definition: 'Structured Query Language, the standard language for asking questions of and changing data in a relational database, with clauses such as SELECT, WHERE, and GROUP BY.'
  - term: schema
    definition: 'The declared structure of a relational database: which tables exist, which typed columns each has, and which rules (uniqueness, references) must hold.'
  - term: NoSQL
    definition: 'A family of non-relational databases — key-value, document, wide-column, and graph — that trade some of the relational model''s strict rules for scale, flexibility, or specialized query shapes.'
  - term: ACID
    definition: 'The four guarantees a relational transaction provides — Atomicity (all-or-nothing), Consistency (no invalid state), Isolation (concurrent clients do not corrupt each other), and Durability (committed data survives a crash).'
  - term: index
    definition: 'An extra sorted lookup structure a database maintains so it can jump straight to matching rows instead of scanning every row, turning a slow full scan into a fast lookup.'
  - term: object storage
    definition: 'A flat store of large, immutable blobs addressed by a key inside a bucket; cheap, highly durable, and effectively unlimited, and the natural home for datasets, media, backups, and model files.'
  - term: bucket
    definition: 'The top-level container in object storage that holds objects, each stored under a key; the S3-style equivalent of a namespace for your blobs.'
  - term: key-value store
    definition: 'A NoSQL database that works like a giant dictionary — hand it a key, get a value back very fast — ideal for sessions, caches, and simple lookups; Redis and DynamoDB are examples.'
  - term: cache
    definition: 'A fast, volatile copy of frequently used data placed in front of a slower store so most reads never reach the slow store; disposable, because the durable data lives elsewhere.'
  - term: cache invalidation
    definition: 'The problem of keeping cached copies from going stale when the underlying data changes, often handled with a time-to-live (TTL) that expires each entry after a set time.'
  - term: durability
    definition: 'The guarantee that once data is committed to a store it survives crashes and restarts; object storage and databases provide it, while a cache deliberately does not.'
