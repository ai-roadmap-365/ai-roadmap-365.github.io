slug: data-storage-files-databases-object-storage
title: 'Data Storage: Files, Databases, Object Storage, and Caches'
section: computing-foundations
subsection: developer-workflow
week: 6
learning_promise: 'After this lesson you will be able to name the four main ways software stores data — files, databases, object storage, and caches — explain the trade-offs that separate them, and choose the right store for a given workload on purpose instead of by habit.'
objectives:
  - 'Describe the four main storage shapes — file, database, object storage, cache — and give a concrete best-fit workload for each'
  - 'Explain why relational databases exist: schemas, ACID transactions, and indexes, and how they make concurrent updates safe and queries fast'
  - 'Distinguish the four NoSQL families (key-value, document, wide-column, graph) and when each fits better than a relational database'
  - 'Contrast object storage with block and file storage, and explain the bucket-and-key model for huge, cheap, immutable blobs'
  - 'Explain how a cache sits in front of a slow store, why it is volatile, and what cache invalidation and a TTL are, tying it back to the memory hierarchy'
  - 'Apply a decision process to pick a store for a real workload, weighing durability, consistency, speed, and cost'
  - 'Connect storage choices to AI systems: datasets and model weights in object storage, vector databases for embeddings, and caching to cut cost'
prerequisites:
  - 'Day 3 (the memory hierarchy: registers, cache, RAM, storage) and Day 5 (data as bytes)'
  - 'A terminal with bash and sqlite3 (preinstalled on macOS and most Linux)'
  - 'No prior database experience required'
reading_time_minutes: 40
practical_time_minutes: 30
