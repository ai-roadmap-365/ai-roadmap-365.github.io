visuals:
  - id: storage-types
    file: assets/storage-types.svg
    type: diagram
    title: 'Four storage types compared'
    alt: 'Diagram: four storage types compared — a file, a relational database, an object store, and a cache, each with its shape and best use'
    description: 'A four-column architecture diagram placing a file (a document glyph), a relational database (a table glyph), an object store (a bucket glyph with a key-to-blob label), and a cache (a lightning glyph) side by side, each annotated with what it is and the workload it fits best.'
  - id: storage-decision
    file: assets/storage-decision.svg
    type: flowchart
    title: 'Storage decision tree'
    alt: 'Flowchart: a storage decision tree asking whether data is a big blob, whether it is structured and needs queries, and whether it needs extreme speed, leading to object storage, a relational database, a NoSQL store, or a cache'
    description: 'A top-down decision flow that asks three questions in order — is it a big blob fetched whole (yes to object storage), is it structured and needing queries or integrity (yes to a relational database), and does it need extreme speed for hot repeated reads (yes to a cache, otherwise a NoSQL store) — with a closing note that a handful of values one program reads just needs a file.'
  - id: four-storage-shapes
    file: assets/four-storage-shapes.svg
    type: diagram
    title: 'Four shapes, chosen by the question you will ask'
    alt: 'Diagram: the four storage shapes and the access pattern each suits'
    description: 'A two-column comparison grouping files and object storage against databases and caches, with the access pattern that suits each.'
  - id: access-pattern-decides
    file: assets/access-pattern-decides.svg
    type: diagram
    title: 'Size does not choose the store'
    alt: 'Diagram: how access pattern rather than data size determines the right store'
    description: 'A two-column comparison of two datasets of very different sizes whose access patterns lead to the opposite storage choices from what size alone would suggest.'
  - id: cache-hit-miss
    file: assets/cache-hit-miss.svg
    type: diagram
    title: 'The cache pattern, and its one hard part'
    alt: 'Diagram: the cache hit and miss path'
    description: 'A four-stage sequence of cache operation covering the lookup, the hit path, the miss path with population, and the invalidation problem.'
  - id: object-key-not-path
    file: assets/object-key-not-path.svg
    type: diagram
    title: 'Keys look like paths and are not'
    alt: 'Diagram: an object storage key compared with a filesystem path'
    description: 'A two-column comparison of filesystem paths and object storage keys, covering directories, renaming, listing and what the separator actually means.'
  - id: transactions
    file: assets/transactions.svg
    type: diagram
    title: 'What a transaction actually buys'
    alt: 'Diagram: how a transaction keeps related changes consistent'
    description: 'A four-stage explanation of a database transaction covering grouped changes, all-or-nothing application, crash behaviour, and why files cannot offer this.'
  - id: start-with-a-file
    file: assets/start-with-a-file.svg
    type: diagram
    title: 'Escalate only when you can name the limit'
    alt: 'Diagram: the progression from a file to a database to object storage'
    description: 'A four-stage escalation from a plain file through SQLite and a database server to object storage, naming the specific limit that forces each move.'
  - id: ai-storage-map
    file: assets/ai-storage-map.svg
    type: diagram
    title: 'Where each part of an AI system lives'
    alt: 'Diagram: which store suits each kind of AI system data'
    description: 'A two-column mapping of AI system data — datasets, weights, metadata and embeddings — onto the storage shapes each requires.'
  - id: nosql-families
    file: assets/nosql-families.svg
    type: diagram
    title: 'Four NoSQL shapes, four different questions'
    alt: 'Diagram: the four NoSQL database families and what each suits'
    description: 'A four-stage reference to key-value, document, wide-column and graph databases, naming the access pattern each is built for.'
  - id: storage-cost-order
    file: assets/storage-cost-order.svg
    type: diagram
    title: 'The cost differences are orders of magnitude'
    alt: 'Diagram: the relative cost of database storage and object storage'
    description: 'A two-column comparison of storing the same volume of data in a managed database against object storage, covering price per terabyte and what each buys.'
  - id: file-limits
    file: assets/file-limits.svg
    type: diagram
    title: 'When a file stops being enough'
    alt: 'Diagram: the limits that force a move from a file to a database'
    description: 'A four-stage sequence naming the specific limitations of file storage that justify moving to a database: concurrent writers, selective queries, constraints and partial-write safety.'
  - id: backup-is-not-replication
    file: assets/backup-is-not-replication.svg
    type: diagram
    title: 'Replication is not a backup'
    alt: 'Diagram: replication compared with backup'
    description: 'A two-column comparison of replication and backup, covering the failures each protects against and why one cannot substitute for the other.'
