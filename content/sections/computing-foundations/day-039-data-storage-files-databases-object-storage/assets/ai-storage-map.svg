<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four kinds of thing, three different stores.">
  <title>Where each part of an AI system lives</title>
  <style>
    .ai-storage-map-bg   { fill: #f8fafc; }
    .ai-storage-map-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-storage-map-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-storage-map-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-storage-map-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-storage-map-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-storage-map-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ai-storage-map-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ai-storage-map-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ai-storage-map-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ai-storage-map-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ai-storage-map-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ai-storage-map-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ai-storage-map-row { opacity: 1; }
    .ai-storage-map-r0 { animation-delay: 0.00s; }
    .ai-storage-map-r1 { animation-delay: 0.45s; }
    .ai-storage-map-r2 { animation-delay: 0.90s; }
    .ai-storage-map-r3 { animation-delay: 1.35s; }
    .ai-storage-map-r4 { animation-delay: 1.80s; }
    .ai-storage-map-row { animation: ai-storage-map-reveal 7.3s ease-in-out infinite; }
    @keyframes ai-storage-map-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ai-storage-map-bg" width="980" height="390"/>
  <text class="ai-storage-map-h1"  x="30" y="40">Where each part of an AI system lives</text>
  <text class="ai-storage-map-sub" x="30" y="64">Four kinds of thing, three different stores.</text>
  <rect class="ai-storage-map-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ai-storage-map-name" x="46" y="122">Object storage</text>
  <text class="ai-storage-map-desc" x="46" y="142">Large, read whole, versioned by key.</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r0" x="46" y="182">Training datasets, as Parquet or JSONL</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r1" x="46" y="216">Model checkpoints and weights</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r2" x="46" y="250">Raw media and scraped source data</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r3" x="46" y="284">Backups</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r4" x="46" y="318">Never in Git — see Day 32</text>
  <rect class="ai-storage-map-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ai-storage-map-name" x="526" y="122">A database</text>
  <text class="ai-storage-map-desc" x="526" y="142">Queried, related, small per record.</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r0" x="526" y="182">Experiment metadata: run, config, metric</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r1" x="526" y="216">The commit hash that produced each result</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r2" x="526" y="250">Predictions and their outcomes</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r3" x="526" y="284">Embeddings — in a vector store or extension</text>
  <text class="ai-storage-map-desc ai-storage-map-row ai-storage-map-r4" x="526" y="318">Because all of these are questions</text>
  <text class="ai-storage-map-sub" x="30" y="372">And a cache in front of inference: identical prompts are far more common than people expect, which makes response caching the single largest cost saving available to a deployed system.</text>
</svg>
