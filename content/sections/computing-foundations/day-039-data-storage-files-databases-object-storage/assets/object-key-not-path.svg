<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The namespace is flat. There are no folders.">
  <title>Keys look like paths and are not</title>
  <style>
    .object-key-not-path-bg   { fill: #f8fafc; }
    .object-key-not-path-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .object-key-not-path-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .object-key-not-path-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .object-key-not-path-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .object-key-not-path-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .object-key-not-path-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .object-key-not-path-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .object-key-not-path-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .object-key-not-path-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .object-key-not-path-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .object-key-not-path-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .object-key-not-path-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .object-key-not-path-row { opacity: 1; }
    .object-key-not-path-r0 { animation-delay: 0.00s; }
    .object-key-not-path-r1 { animation-delay: 0.45s; }
    .object-key-not-path-r2 { animation-delay: 0.90s; }
    .object-key-not-path-r3 { animation-delay: 1.35s; }
    .object-key-not-path-r4 { animation-delay: 1.80s; }
    .object-key-not-path-row { animation: object-key-not-path-reveal 7.3s ease-in-out infinite; }
    @keyframes object-key-not-path-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="object-key-not-path-bg" width="980" height="390"/>
  <text class="object-key-not-path-h1"  x="30" y="40">Keys look like paths and are not</text>
  <text class="object-key-not-path-sub" x="30" y="64">The namespace is flat. There are no folders.</text>
  <rect class="object-key-not-path-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="object-key-not-path-name" x="46" y="122">A filesystem path</text>
  <text class="object-key-not-path-desc" x="46" y="142">Real directories.</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r0" x="46" y="182">Folders exist as actual entries</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r1" x="46" y="216">Renaming a folder is instant — one entry</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r2" x="46" y="250">Listing a folder is cheap</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r3" x="46" y="284">Permissions can apply per directory</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r4" x="46" y="318">The slash is structural</text>
  <rect class="object-key-not-path-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="object-key-not-path-name" x="526" y="122">An object key</text>
  <text class="object-key-not-path-desc" x="526" y="142">One flat string.</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r0" x="526" y="182">datasets/2026/train.csv is ONE name</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r1" x="526" y="216">No folder exists; nothing to rename</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r2" x="526" y="250">"Renaming" copies every object</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r3" x="526" y="284">Listing filters by prefix</text>
  <text class="object-key-not-path-desc object-key-not-path-row object-key-not-path-r4" x="526" y="318">The slash is just a character</text>
  <text class="object-key-not-path-sub" x="30" y="372">This is why moving a million objects to a new prefix is a million copies rather than one rename, and why the naming convention you choose at the start is one you keep.</text>
</svg>
