<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each step should be forced by something specific.">
  <title>Escalate only when you can name the limit</title>
  <style>
    .start-with-a-file-bg   { fill: #f8fafc; }
    .start-with-a-file-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .start-with-a-file-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .start-with-a-file-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .start-with-a-file-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .start-with-a-file-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .start-with-a-file-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .start-with-a-file-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .start-with-a-file-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .start-with-a-file-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .start-with-a-file-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .start-with-a-file-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .start-with-a-file-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .start-with-a-file-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .start-with-a-file-stage { opacity: 1; }

    .start-with-a-file-s0 { animation-delay: 0.00s; }
    .start-with-a-file-e0 { animation-delay: 0.00s; }
    .start-with-a-file-s1 { animation-delay: 1.28s; }
    .start-with-a-file-e1 { animation-delay: 1.28s; }
    .start-with-a-file-s2 { animation-delay: 2.56s; }
    .start-with-a-file-e2 { animation-delay: 2.56s; }
    .start-with-a-file-s3 { animation-delay: 3.84s; }
    .start-with-a-file-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .start-with-a-file-conn  { animation: start-with-a-file-trace 6.4s ease-in-out infinite; }
      .start-with-a-file-stage { animation: start-with-a-file-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes start-with-a-file-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes start-with-a-file-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .start-with-a-file-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .start-with-a-file-stage { animation: start-with-a-file-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes start-with-a-file-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="start-with-a-file-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="start-with-a-file-bg" width="980" height="322"/>
  <text class="start-with-a-file-h1"  x="30" y="40">Escalate only when you can name the limit</text>
  <text class="start-with-a-file-sub" x="30" y="64">Each step should be forced by something specific.</text>
  <g class="start-with-a-file-stage start-with-a-file-s0">
    <rect class="start-with-a-file-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="start-with-a-file-step" x="44" y="142">01</text>
    <text class="start-with-a-file-name" x="70" y="142">A file</text>
    <text class="start-with-a-file-desc" x="44" y="166">Simplest thing that works.</text>
    <text class="start-with-a-file-desc" x="44" y="182">Configuration, small datasets,</text>
    <text class="start-with-a-file-desc" x="44" y="198">logs.</text>
    <text class="start-with-a-file-edge" x="44" y="242">start here</text>
  </g>
  <line class="start-with-a-file-line start-with-a-file-conn start-with-a-file-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#start-with-a-file-tip)"/>
  <g class="start-with-a-file-stage start-with-a-file-s1">
    <rect class="start-with-a-file-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="start-with-a-file-step" x="280" y="142">02</text>
    <text class="start-with-a-file-name" x="306" y="142">SQLite</text>
    <text class="start-with-a-file-desc" x="280" y="166">When you need queries or</text>
    <text class="start-with-a-file-desc" x="280" y="182">constraints. A real database, in</text>
    <text class="start-with-a-file-desc" x="280" y="198">one file, no server.</text>
    <text class="start-with-a-file-edge" x="280" y="242">queries</text>
  </g>
  <line class="start-with-a-file-line start-with-a-file-conn start-with-a-file-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#start-with-a-file-tip)"/>
  <g class="start-with-a-file-stage start-with-a-file-s2">
    <rect class="start-with-a-file-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="start-with-a-file-step" x="516" y="142">03</text>
    <text class="start-with-a-file-name" x="542" y="142">A database server</text>
    <text class="start-with-a-file-desc" x="516" y="166">When you need concurrent</text>
    <text class="start-with-a-file-desc" x="516" y="182">writers, or access from several</text>
    <text class="start-with-a-file-desc" x="516" y="198">machines.</text>
    <text class="start-with-a-file-edge" x="516" y="242">concurrency</text>
  </g>
  <line class="start-with-a-file-line start-with-a-file-conn start-with-a-file-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#start-with-a-file-tip)"/>
  <g class="start-with-a-file-stage start-with-a-file-s3">
    <rect class="start-with-a-file-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="start-with-a-file-step" x="752" y="142">04</text>
    <text class="start-with-a-file-name" x="778" y="142">Object storage</text>
    <text class="start-with-a-file-desc" x="752" y="166">When the data is large and read</text>
    <text class="start-with-a-file-desc" x="752" y="182">whole. Different axis entirely.</text>
    <text class="start-with-a-file-edge" x="752" y="242">bulk</text>
  </g>
  <text class="start-with-a-file-sub" x="30" y="304">SQLite is the step most often skipped, and it is the one that removes the most work: a genuine relational database with no server to run, which is the right answer for a great many projects that reach past it.</text>
</svg>
