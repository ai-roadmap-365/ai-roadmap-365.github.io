questions:
  - question: 'Which storage shape is the right home for a plain configuration file that one program reads and that changes rarely?'
    options:
      - 'A relational database, for the ACID guarantees'
      - 'A file, because it is the simplest thing that works for a single reader'
      - 'Object storage, because keys look like paths'
      - 'A cache, because config is read often'
    answer_index: 1
    explanation: 'A file is the simplest correct choice when data is read far more than written and by one program at a time. You reach past files only when many concurrent writers or precise queries appear — none of which a rarely-changing config needs.'

  - question: 'Two withdrawals hit a bank balance stored in a plain file at the same time; both read 100, subtract 30, and write 70, so one withdrawal is lost. Which property of relational databases prevents this?'
    options:
      - 'Indexes, because they sort the data'
      - 'Object immutability, because blobs cannot change'
      - 'ACID transactions, which make related changes all-or-nothing and isolate concurrent clients'
      - 'A time-to-live, which expires stale data'
    answer_index: 2
    explanation: 'ACID (Atomicity, Consistency, Isolation, Durability) wraps related changes in a transaction that fully happens or not at all and stops two clients from stepping on each other, so no update silently vanishes.'

  - question: 'Why can a database answer "customers in Ohio" far faster than grepping a million-line file for the same thing?'
    options:
      - 'The database keeps an index — a sorted lookup structure — so it jumps to matching rows instead of scanning every row'
      - 'The database stores the data in RAM and the file is always on disk'
      - 'grep is written in a slow programming language'
      - 'The database compresses the data so there is less to read'
    answer_index: 0
    explanation: 'An index is an extra sorted structure that lets the database find relevant rows directly, turning a full scan into a quick lookup. A plain file has no index, so answering the same question means reading and scanning everything.'

  - question: 'In object storage, how is a stored object identified and retrieved?'
    options:
      - 'By its row number in a table'
      - 'By a bucket and a key (a string name), fetching the whole object back'
      - 'By opening a file handle and seeking to an offset'
      - 'By a SQL SELECT over the object contents'
    answer_index: 1
    explanation: 'Object storage puts each object in a bucket under a key and you GET the whole object back by that key. The namespace is flat — keys may look like paths but there are no real folders — and you cannot run SQL over the contents or edit an object in place.'

  - question: 'Which statement about a cache is true?'
    options:
      - 'A cache is the durable source of truth for your data'
      - 'A cache must be a relational database'
      - 'A cache is a fast, volatile copy in front of a slower store, and losing it loses nothing because the real data lives elsewhere'
      - 'A cache permanently replaces the store behind it'
    answer_index: 2
    explanation: 'A cache holds copies of hot data in fast memory so most reads never touch the slow store. It is volatile and disposable — if you cannot afford to lose it, it is not a cache but a source of truth.'

  - question: 'Which NoSQL family is the natural fit for "friends of friends" or shortest-path questions about connected entities?'
    options:
      - 'Key-value store'
      - 'Wide-column store'
      - 'Document store'
      - 'Graph database'
    answer_index: 3
    explanation: 'A graph database stores nodes and the edges between them, making relationship traversals like "friends of friends" or shortest path natural — exactly the queries that tie a relational database in knots with repeated joins.'

  - question: 'Where should a 5 GB training dataset live, and where should the record describing it (name, owner, date) live?'
    options:
      - 'Both in the relational database, in the same table'
      - 'Both in a cache, for speed'
      - 'The dataset in object storage; the record (and the object key) in a relational database'
      - 'The dataset in a relational database; the record in a plain file'
    answer_index: 2
    explanation: 'Large blobs belong in cheap, durable object storage; the database stores only the key plus structured, queryable metadata. Putting the 5 GB blob in the database would bloat it, slow every backup, and cost far more.'

  - question: 'What is "cache invalidation," and why is a time-to-live (TTL) a common way to handle it?'
    options:
      - 'It is deleting the underlying database; a TTL schedules that deletion'
      - 'It is keeping stale copies fresh: when data changes, stale cached copies must be updated or evicted, and a TTL expires each entry after a set time, bounding staleness'
      - 'It is validating SQL syntax before a query runs'
      - 'It is encrypting cached data; a TTL sets the encryption key lifetime'
    answer_index: 1
    explanation: 'When the underlying data changes, cached copies can go stale, so they must be refreshed or evicted. A TTL expires each entry after a set number of seconds, trading a little possible staleness for simplicity instead of tracking every change precisely.'
