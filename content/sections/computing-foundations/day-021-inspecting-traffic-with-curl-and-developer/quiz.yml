questions:
  - question: 'In the output of `curl -v`, what do lines beginning with `>` represent?'
    options:
      - 'The response headers the server returned'
      - 'The request headers curl sent to the server'
      - "curl's own notes about resolving and connecting"
      - 'The body of the downloaded page'
    answer_index: 1
    explanation: 'In verbose output, `>` marks the request curl sent, `<` marks the response headers that came back, and `*` marks connection notes (DNS, TCP, TLS). Reading the three prefixes separately is the core skill of a verbose trace.'

  - question: 'You request a URL and get back a `302`. What does adding `-L` do?'
    options:
      - 'It prints the response body instead of only the headers'
      - 'It retries the request until the server returns a 200'
      - 'It follows the redirect in the location header to the final destination'
      - 'It logs the request to a file for later inspection'
    answer_index: 2
    explanation: 'A `301`/`302` is a forwarding address, not the final answer. `-L` tells curl to follow the `location` header to the real destination; without it you stop at the redirect and may wrongly conclude the endpoint returned nothing.'

  - question: 'An API call from your code returns `429 Too Many Requests`. What does it mean?'
    options:
      - 'The server crashed while handling your valid request'
      - 'The URL does not exist on the server'
      - 'Your credentials are missing or invalid'
      - 'You are sending requests too fast and should slow down or back off'
    answer_index: 3
    explanation: '`429` is a `4xx` client error meaning you have exceeded a rate limit. The fix is on your side: reduce request frequency or add a back-off delay, not rewrite the server or the endpoint.'

  - question: 'Which flag makes curl print only the response headers using a HEAD request?'
    options:
      - '`-I`'
      - '`-d`'
      - '`-X`'
      - '`-o`'
    answer_index: 0
    explanation: '`-I` fetches headers only (a HEAD request) and prints the status line and response headers without downloading the body — useful for checking status and headers quickly.'

  - question: 'In the failed-request decision tree, what does a `5xx` status code tell you compared with a `4xx`?'
    options:
      - '`5xx` means DNS failed; `4xx` means TLS failed'
      - '`5xx` means the server failed handling a valid request; `4xx` means your request was wrong'
      - '`5xx` is always a temporary problem; `4xx` is always permanent'
      - 'They mean the same thing and can be treated identically'
    answer_index: 1
    explanation: 'A `4xx` means the client sent something wrong — bad URL, missing authentication, malformed body — so fix your request. A `5xx` means the server erred on a request it accepted. Blaming the wrong side wastes debugging time.'

  - question: 'Which curl option lets you print a custom value such as the status code after a transfer?'
    options:
      - '`-s`'
      - '`-H`'
      - '`-w`'
      - '`-L`'
    answer_index: 2
    explanation: '`-w` (write-out) prints chosen variables after the transfer, such as `%{http_code}` for the status or timing variables like `%{time_total}`. Combined with `-o /dev/null` and `-s`, it extracts just the value you want.'

  - question: 'In the Developer Tools Network tab, which filter shows only the API calls a page made?'
    options:
      - 'The `Img` filter'
      - 'The `CSS` filter'
      - 'The `Doc` filter'
      - 'The `Fetch/XHR` filter'
    answer_index: 3
    explanation: 'The `Fetch/XHR` type filter hides documents, scripts, styles, and images, leaving only the background data requests (the API calls) so you can focus on the request you are debugging.'

  - question: 'When would you reach for Wireshark instead of curl or the Network tab?'
    options:
      - 'When you want to save and share a collection of requests with a team'
      - 'When you suspect the problem is below HTTP, in the raw packets or the connection itself'
      - 'When you want friendlier, coloured output for an ad-hoc request'
      - 'When you need to follow a redirect to its final destination'
    answer_index: 1
    explanation: 'Wireshark captures raw network packets, a full layer below the assembled HTTP messages that curl and the Network tab read. You reach for it in the rarer cases where the fault is beneath HTTP — in the TCP segments, the DNS queries, or the connection.'
