terms:
  - term: curl
    definition: 'A command-line program that makes a single HTTP request you describe and prints the response, giving you precise control over and full visibility into one exchange.'
  - term: verbose mode
    definition: "curl's `-v` option, which prints the entire conversation: the request sent (lines starting with >), the response headers (lines starting with <), and connection notes (lines starting with *)."
  - term: header
    definition: 'A named field of metadata attached to an HTTP request or response, such as Accept, Content-Type, or Authorization, that carries information alongside the body.'
  - term: redirect
    definition: 'A response (status 301 or 302) that points the client to a different URL via a location header rather than returning the content directly; `curl -L` follows it to the final destination.'
  - term: DevTools
    definition: "A browser's built-in Developer Tools: a panel for inspecting a page's structure, console, performance, and network activity, opened with F12 or Command-Option-I."
  - term: Network tab
    definition: 'The Developer Tools panel that records every request a page makes, showing each one''s status, type, size, timing, and full headers and body.'
  - term: waterfall
    definition: 'A timeline view in the Network tab where each request is a horizontal bar showing when it started and how long each phase took, making slow or late requests easy to spot.'
  - term: payload
    definition: 'The body of a request or response — the actual data being sent or returned — as distinct from the headers that describe it.'
  - term: User-Agent
    definition: 'A request header identifying the client software making the request; curl sends a value like `curl/8.7.1`, while a browser sends a long string naming itself and its version.'
  - term: httpie
    definition: 'A free, open-source command-line HTTP client, an alternative to curl designed for human readability with coloured, formatted output and a simpler syntax.'
  - term: proxy
    definition: 'An intermediary that sits between a client and a server and relays their traffic; a debugging proxy such as mitmproxy records every request that passes through it, revealing what an application is sending.'
  - term: status code
    definition: 'A three-digit number in an HTTP response signalling the outcome: 2xx success, 3xx redirection, 4xx a client (request) error, and 5xx a server error.'
  - term: time to first byte
    definition: 'The elapsed time from sending a request to receiving the first byte of the response, reported by curl as `time_starttransfer` and by the Network tab in a request''s Timing sub-tab.'
