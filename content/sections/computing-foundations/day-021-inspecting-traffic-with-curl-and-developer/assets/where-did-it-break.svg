<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Most debugging time goes on establishing where something broke, not why.">
  <title>Reproduce at the lowest level that still shows the problem</title>
  <style>
    .where-did-it-break-bg   { fill: #f8fafc; }
    .where-did-it-break-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .where-did-it-break-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .where-did-it-break-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .where-did-it-break-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .where-did-it-break-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .where-did-it-break-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .where-did-it-break-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .where-did-it-break-tok { animation: where-did-it-break-travel 7s ease-in-out infinite; }
    }
    @keyframes where-did-it-break-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--where-did-it-break-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .where-did-it-break-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="where-did-it-break-bg" width="980" height="334"/>
  <text class="where-did-it-break-h1"  x="30" y="40">Reproduce at the lowest level that still shows the problem</text>
  <text class="where-did-it-break-sub" x="30" y="64">Most debugging time goes on establishing where something broke, not why.</text>
  <rect class="where-did-it-break-box" x="30" y="132" width="166" height="96" rx="9"/>
  <text class="where-did-it-break-name" x="44" y="160">In the app</text>
  <text class="where-did-it-break-desc" x="44" y="182">It fails. Everything is</text>
  <text class="where-did-it-break-desc" x="44" y="198">still suspect.</text>
  <text class="where-did-it-break-edge" x="44" y="248">no information</text>
  <line class="where-did-it-break-line" x1="199" y1="180" x2="215" y2="180"/>
  <rect class="where-did-it-break-hi" x="218" y="132" width="166" height="96" rx="9"/>
  <text class="where-did-it-break-name" x="232" y="160">With curl</text>
  <text class="where-did-it-break-desc" x="232" y="182">Same request, no</text>
  <text class="where-did-it-break-desc" x="232" y="198">application code</text>
  <text class="where-did-it-break-desc" x="232" y="214">involved.</text>
  <text class="where-did-it-break-edge" x="232" y="248">halves the stack</text>
  <line class="where-did-it-break-line" x1="387" y1="180" x2="403" y2="180"/>
  <rect class="where-did-it-break-box" x="406" y="132" width="166" height="96" rx="9"/>
  <text class="where-did-it-break-name" x="420" y="160">-v for headers</text>
  <text class="where-did-it-break-desc" x="420" y="182">See exactly what was sent</text>
  <text class="where-did-it-break-desc" x="420" y="198">and what came back.</text>
  <text class="where-did-it-break-edge" x="420" y="248">names the code</text>
  <line class="where-did-it-break-line" x1="575" y1="180" x2="591" y2="180"/>
  <rect class="where-did-it-break-box" x="594" y="132" width="166" height="96" rx="9"/>
  <text class="where-did-it-break-name" x="608" y="160">DNS and TLS</text>
  <text class="where-did-it-break-desc" x="608" y="182">Did the name resolve, did</text>
  <text class="where-did-it-break-desc" x="608" y="198">the certificate verify.</text>
  <text class="where-did-it-break-edge" x="608" y="248">below HTTP</text>
  <line class="where-did-it-break-line" x1="763" y1="180" x2="779" y2="180"/>
  <rect class="where-did-it-break-box" x="782" y="132" width="166" height="96" rx="9"/>
  <text class="where-did-it-break-name" x="796" y="160">Packets</text>
  <text class="where-did-it-break-desc" x="796" y="182">Only when the answer is</text>
  <text class="where-did-it-break-desc" x="796" y="198">genuinely below the</text>
  <text class="where-did-it-break-desc" x="796" y="214">protocol.</text>
  <text class="where-did-it-break-edge" x="796" y="248">rarely needed</text>
  <rect class="where-did-it-break-tok" x="34" y="106" width="58" height="14" rx="3" style="--where-did-it-break-run: 752px"/>
  <text class="where-did-it-break-sub" x="30" y="314">If it works in curl and fails in code, the fault is yours — a header, an encoding, a proxy. That is one command's worth of certainty.</text>
</svg>
