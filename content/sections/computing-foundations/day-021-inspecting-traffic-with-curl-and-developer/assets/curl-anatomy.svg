<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a curl command: each flag labelled with its job, and the request and response it produces</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The anatomy of a curl command</text>

  <!-- The command line -->
  <rect x="30" y="58" width="700" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="46" y="87" font-size="18" font-weight="bold" fill="#1a202c" font-family="ui-monospace, monospace">curl  -v  -L  -H "Accept: application/json"  https://httpbin.org/headers</text>

  <!-- Flag callouts -->
  <line x1="74" y1="104" x2="74" y2="132" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="30" y="132" width="150" height="60" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="105" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">curl</text>
  <text x="105" y="173" text-anchor="middle" font-size="14" fill="#1a202c">send one request,</text>
  <text x="105" y="188" text-anchor="middle" font-size="14" fill="#1a202c">print the result</text>

  <line x1="122" y1="104" x2="122" y2="212" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="196" y="132" width="150" height="60" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="271" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">-v verbose</text>
  <text x="271" y="173" text-anchor="middle" font-size="14" fill="#1a202c">show the whole</text>
  <text x="271" y="188" text-anchor="middle" font-size="14" fill="#1a202c">conversation</text>

  <line x1="150" y1="104" x2="360" y2="212" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="362" y="132" width="160" height="60" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="442" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">-L follow</text>
  <text x="442" y="173" text-anchor="middle" font-size="14" fill="#1a202c">chase redirects to</text>
  <text x="442" y="188" text-anchor="middle" font-size="14" fill="#1a202c">the final page</text>

  <line x1="210" y1="104" x2="620" y2="132" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="538" y="132" width="192" height="60" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="634" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">-H set a header</text>
  <text x="634" y="173" text-anchor="middle" font-size="14" fill="#1a202c">tell the server what</text>
  <text x="634" y="188" text-anchor="middle" font-size="14" fill="#1a202c">format you want</text>

  <!-- Request box -->
  <rect x="30" y="228" width="340" height="240" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="200" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The request curl sends  (&gt;)</text>
  <text x="46" y="284" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">&gt; GET /headers HTTP/2</text>
  <text x="46" y="308" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">&gt; Host: httpbin.org</text>
  <text x="46" y="332" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">&gt; User-Agent: curl/8.7.1</text>
  <text x="46" y="356" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">&gt; Accept: application/json</text>
  <text x="46" y="392" font-size="14" fill="#1a202c">Connection notes ( * ):</text>
  <text x="46" y="416" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">* host resolved (DNS)</text>
  <text x="46" y="438" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">* connected (TCP)</text>
  <text x="46" y="460" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">* certificate verify ok (TLS)</text>

  <!-- Arrow -->
  <line x1="374" y1="348" x2="416" y2="348" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="424,348 410,341 410,355" fill="#1d4ed8"/>

  <!-- Response box -->
  <rect x="426" y="228" width="304" height="240" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="578" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The response  (&lt;)</text>
  <text x="442" y="284" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">&lt; HTTP/2 200</text>
  <text x="442" y="308" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">&lt; content-type:</text>
  <text x="442" y="328" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">   application/json</text>
  <text x="442" y="360" font-size="14" fill="#1a202c">body:</text>
  <text x="442" y="384" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">{ "headers": {</text>
  <text x="442" y="406" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">   "Accept":</text>
  <text x="442" y="426" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">     "application/json"</text>
  <text x="442" y="448" font-size="14" fill="#1a202c" font-family="ui-monospace, monospace">} }</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 374 348 L 416 348" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
