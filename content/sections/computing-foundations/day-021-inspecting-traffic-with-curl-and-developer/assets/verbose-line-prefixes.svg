<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every line is one of three things.">
  <title>Reading curl -v in three symbols</title>
  <style>
    .verbose-line-prefixes-bg   { fill: #f8fafc; }
    .verbose-line-prefixes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verbose-line-prefixes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verbose-line-prefixes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verbose-line-prefixes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verbose-line-prefixes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verbose-line-prefixes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .verbose-line-prefixes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .verbose-line-prefixes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .verbose-line-prefixes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .verbose-line-prefixes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .verbose-line-prefixes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .verbose-line-prefixes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .verbose-line-prefixes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .verbose-line-prefixes-stage { opacity: 1; }

    .verbose-line-prefixes-s0 { animation-delay: 0.00s; }
    .verbose-line-prefixes-e0 { animation-delay: 0.00s; }
    .verbose-line-prefixes-s1 { animation-delay: 1.50s; }
    .verbose-line-prefixes-e1 { animation-delay: 1.50s; }
    .verbose-line-prefixes-s2 { animation-delay: 3.00s; }
    .verbose-line-prefixes-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .verbose-line-prefixes-conn  { animation: verbose-line-prefixes-trace 6s ease-in-out infinite; }
      .verbose-line-prefixes-stage { animation: verbose-line-prefixes-arrive 6s ease-in-out infinite; }
    }
    @keyframes verbose-line-prefixes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes verbose-line-prefixes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .verbose-line-prefixes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .verbose-line-prefixes-stage { animation: verbose-line-prefixes-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes verbose-line-prefixes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="verbose-line-prefixes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="verbose-line-prefixes-bg" width="980" height="322"/>
  <text class="verbose-line-prefixes-h1"  x="30" y="40">Reading curl -v in three symbols</text>
  <text class="verbose-line-prefixes-sub" x="30" y="64">Every line is one of three things.</text>
  <g class="verbose-line-prefixes-stage verbose-line-prefixes-s0">
    <rect class="verbose-line-prefixes-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="verbose-line-prefixes-step" x="44" y="142">01</text>
    <text class="verbose-line-prefixes-name" x="70" y="142">* asterisk</text>
    <text class="verbose-line-prefixes-desc" x="44" y="166">curl's own notes: resolving, connecting, the</text>
    <text class="verbose-line-prefixes-desc" x="44" y="182">TLS handshake, certificate verification.</text>
    <text class="verbose-line-prefixes-edge" x="44" y="242">the layers</text>
  </g>
  <line class="verbose-line-prefixes-line verbose-line-prefixes-conn verbose-line-prefixes-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#verbose-line-prefixes-tip)"/>
  <g class="verbose-line-prefixes-stage verbose-line-prefixes-s1">
    <rect class="verbose-line-prefixes-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="verbose-line-prefixes-step" x="359" y="142">02</text>
    <text class="verbose-line-prefixes-name" x="385" y="142">&gt; greater-than</text>
    <text class="verbose-line-prefixes-desc" x="359" y="166">Exactly what curl SENT — request line and</text>
    <text class="verbose-line-prefixes-desc" x="359" y="182">every header.</text>
    <text class="verbose-line-prefixes-edge" x="359" y="242">your request</text>
  </g>
  <line class="verbose-line-prefixes-line verbose-line-prefixes-conn verbose-line-prefixes-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#verbose-line-prefixes-tip)"/>
  <g class="verbose-line-prefixes-stage verbose-line-prefixes-s2">
    <rect class="verbose-line-prefixes-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="verbose-line-prefixes-step" x="674" y="142">03</text>
    <text class="verbose-line-prefixes-name" x="700" y="142">&lt; less-than</text>
    <text class="verbose-line-prefixes-desc" x="674" y="166">Exactly what came BACK — status line and</text>
    <text class="verbose-line-prefixes-desc" x="674" y="182">response headers.</text>
    <text class="verbose-line-prefixes-edge" x="674" y="242">their answer</text>
  </g>
  <text class="verbose-line-prefixes-sub" x="30" y="304">Comparing the &gt; lines against what your code believes it sends resolves most authentication mysteries in about ten seconds.</text>
</svg>
