visuals:
  - id: curl-anatomy
    file: assets/curl-anatomy.svg
    type: diagram
    title: 'The anatomy of a curl command'
    alt: 'Diagram: the anatomy of a curl command, each flag labelled with its job, and the request and response it produces'
    description: 'An annotated curl command with callouts explaining each flag (-v verbose, -L follow, -H set a header), and below it the request curl sends (the > lines and the * connection notes for DNS, TCP, and TLS) beside the response it produces (the < status and headers and the JSON body).'
  - id: debug-decision-tree
    file: assets/debug-decision-tree.svg
    type: flowchart
    title: 'A troubleshooting decision tree for a failed request'
    alt: 'Flowchart: a troubleshooting decision tree for a failed request, from DNS to connection to TLS to status code to body'
    description: 'A top-to-bottom decision tree with five gates — did the hostname resolve, did the connection open, did TLS verify, what is the status code, is the body as expected — each naming the curl option or Network-tab view that answers it, and each "no" branching to the specific failure (DNS, TCP, TLS, 4xx client error, 5xx server error, or a malformed body).'
  - id: where-did-it-break
    file: assets/where-did-it-break.svg
    type: diagram
    title: 'Reproduce at the lowest level that still shows the problem'
    alt: 'Diagram: narrowing an API failure from the application down to the network'
    description: 'A five-stage sequence narrowing a failing API call: reproduce in the application, then with curl, then check DNS and TLS, then inspect headers, each step removing part of the stack from suspicion.'
  - id: curl-or-devtools
    file: assets/curl-or-devtools.svg
    type: diagram
    title: 'Which tool for which question'
    alt: 'Diagram: curl compared with browser developer tools'
    description: 'A two-column comparison of curl and browser developer tools, covering scope, repeatability, what each reveals, and the situations each suits.'
  - id: verbose-line-prefixes
    file: assets/verbose-line-prefixes.svg
    type: diagram
    title: 'Reading curl -v in three symbols'
    alt: 'Diagram: what each prefix in curl verbose output means'
    description: 'A three-stage reference to curl''s verbose output prefixes, explaining that asterisk lines are curl''s own notes, greater-than lines are the request sent, and less-than lines are the response received.'
  - id: five-gates
    file: assets/five-gates.svg
    type: diagram
    title: 'Five gates, in order, stop at the first no'
    alt: 'Diagram: the five ordered checks for diagnosing a failed request'
    description: 'A five-stage ordered diagnostic sequence for a failed request covering name resolution, connection, TLS, status code and response body, naming the tool that answers each.'
  - id: copy-as-curl-danger
    file: assets/copy-as-curl-danger.svg
    type: diagram
    title: '"Copy as cURL" copies your credentials'
    alt: 'Diagram: what a copied curl command contains and how to share it safely'
    description: 'A two-column comparison of an unredacted copied curl command against a safely redacted one, listing the credentials such a command carries.'
  - id: waterfall-shapes
    file: assets/waterfall-shapes.svg
    type: diagram
    title: 'Four shapes in a waterfall'
    alt: 'Diagram: four recognisable patterns in a network waterfall'
    description: 'A four-stage reference to recognisable waterfall patterns: a long bar for a slow response, a late-starting request indicating a dependency, a staircase of serialised requests, and a wide block of parallel loading.'
  - id: isolate-the-variable
    file: assets/isolate-the-variable.svg
    type: diagram
    title: 'Reproduce before you edit'
    alt: 'Diagram: what it means when curl succeeds and your code fails'
    description: 'A two-column comparison of the two outcomes of reproducing a failing request in curl, explaining what each result narrows the problem down to.'
  - id: timing-variables
    file: assets/timing-variables.svg
    type: diagram
    title: 'Turning curl into a stopwatch'
    alt: 'Diagram: curl''s timing variables and the stage each measures'
    description: 'A five-stage reference to curl''s timing output variables, explaining what each cumulative measurement covers and how subtracting neighbours yields the cost of each stage.'
  - id: api-error-triage
    file: assets/api-error-triage.svg
    type: diagram
    title: 'Three status codes cover most AI failures'
    alt: 'Diagram: the three most common AI API status codes and their causes'
    description: 'A four-stage triage of common model API failures covering authentication errors, malformed payloads, rate limiting and server errors, naming the specific fix for each.'
  - id: curl-output-flags
    file: assets/curl-output-flags.svg
    type: diagram
    title: 'Four flags that control what curl prints'
    alt: 'Diagram: the curl flags that control output'
    description: 'A four-stage reference to curl''s output-control flags covering silencing the progress meter, including response headers, fetching headers only, and writing the body to a file.'
