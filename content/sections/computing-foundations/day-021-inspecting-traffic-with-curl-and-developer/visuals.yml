visuals:
  - id: curl-anatomy
    file: assets/curl-anatomy.svg
    type: diagram
    title: 'The anatomy of a curl command'
    alt: 'Diagram: the anatomy of a curl command, each flag labelled with its job, and the request and response it produces'
    description: 'An annotated curl command with callouts explaining each flag (-v verbose, -L follow, -H set a header), and below it the request curl sends (the > lines and the * connection notes for DNS, TCP, and TLS) beside the response it produces (the < status and headers and the JSON body).'
  - id: debug-decision-tree
    file: assets/debug-decision-tree.svg
    type: flowchart
    title: 'A troubleshooting decision tree for a failed request'
    alt: 'Flowchart: a troubleshooting decision tree for a failed request, from DNS to connection to TLS to status code to body'
    description: 'A top-to-bottom decision tree with five gates — did the hostname resolve, did the connection open, did TLS verify, what is the status code, is the body as expected — each naming the curl option or Network-tab view that answers it, and each "no" branching to the specific failure (DNS, TCP, TLS, 4xx client error, 5xx server error, or a malformed body).'
  - id: where-did-it-break
    file: assets/where-did-it-break.svg
    type: diagram
    title: 'Reproduce at the lowest level that still shows the problem'
    alt: 'Diagram: narrowing an API failure from the application down to the network'
    description: 'A five-stage sequence narrowing a failing API call: reproduce in the application, then with curl, then check DNS and TLS, then inspect headers, each step removing part of the stack from suspicion.'
