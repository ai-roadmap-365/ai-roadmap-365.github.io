visuals:
  - id: path-resolution
    file: assets/path-resolution.svg
    type: flowchart
    title: 'How the shell finds a command in PATH'
    alt: 'Flowchart: the shell searches each PATH directory in order until it finds the command'
    description: 'A flow showing that when you type a bare command name, the shell splits PATH by colons and checks each directory in order, running the first executable it finds, and reporting "command not found" if no directory contains it.'
  - id: shell-config-load
    file: assets/shell-config-load.svg
    type: diagram
    title: 'Which config files load, and when'
    alt: 'Diagram: which shell configuration files load for login versus interactive shells'
    description: 'A two-column comparison of the startup files bash and zsh read for a login shell (such as an SSH session or a new macOS Terminal tab) versus an interactive non-login shell, explaining why a setting placed in the wrong file silently does nothing.'
  - id: shell-versus-environment
    file: assets/shell-versus-environment.svg
    type: diagram
    title: 'Why the variable you set does not reach your script'
    alt: 'Diagram: shell variables compared with exported environment variables'
    description: 'A two-column comparison of a plain shell variable and an exported environment variable, showing which is inherited by child processes and why changes inside a child never flow back to the parent.'
  - id: export-inheritance
    file: assets/export-inheritance.svg
    type: diagram
    title: 'What export actually changes'
    alt: 'Diagram: how exporting a variable makes it visible to child processes'
    description: 'A four-stage sequence showing a shell variable being assigned, a child process failing to see it, the variable being exported, and the child then inheriting it.'
  - id: env-copy-not-share
    file: assets/env-copy-not-share.svg
    type: diagram
    title: 'Children inherit a copy, not a connection'
    alt: 'Diagram: environment inheritance flowing downward only'
    description: 'A two-column comparison showing that environment variables pass from parent to child at process start as a copy, and that changes made by a child never travel back to the parent.'
  - id: path-order-wins
    file: assets/path-order-wins.svg
    type: diagram
    title: 'Three mysteries, one rule'
    alt: 'Diagram: how PATH order decides which version of a command runs'
    description: 'A four-stage explanation of PATH resolution showing left-to-right search, first match winning, why command-not-found happens, and why the current directory is excluded.'
  - id: secrets-placement
    file: assets/secrets-placement.svg
    type: diagram
    title: 'Where a secret should and should not live'
    alt: 'Diagram: safe and unsafe places to keep an API key'
    description: 'A two-column comparison of unsafe and safe handling of API keys, covering hard-coding in source, passing on the command line, committing dotenv files, and the correct use of environment variables and secret managers.'
  - id: alias-versus-function
    file: assets/alias-versus-function.svg
    type: diagram
    title: 'Alias or function?'
    alt: 'Diagram: shell aliases compared with shell functions'
    description: 'A two-column comparison of aliases and shell functions covering what each can do with arguments, whether they can hold logic, and when to choose one over the other.'
  - id: reload-config
    file: assets/reload-config.svg
    type: diagram
    title: 'Why your edit did nothing'
    alt: 'Diagram: why an edited shell config file appears to have no effect'
    description: 'A four-stage diagnosis of an edited configuration file having no effect: the wrong file for the shell in use, open shells not re-reading files, the fix of sourcing or opening a new terminal, and confirming with echo.'
  - id: venv-path-mechanism
    file: assets/venv-path-mechanism.svg
    type: diagram
    title: 'What activating a virtual environment actually does'
    alt: 'Diagram: how activating a virtual environment changes PATH'
    description: 'A four-stage sequence showing PATH before activation, the virtual environment''s bin directory being prepended, the resulting change in which python is found first, and deactivation restoring the original value.'
  - id: config-layers
    file: assets/config-layers.svg
    type: diagram
    title: 'Where a setting should live'
    alt: 'Diagram: the layers a configuration value can come from'
    description: 'A four-stage precedence order for configuration: built-in defaults, the shell configuration file, per-project environment files, and finally values set for a single command, each overriding the previous.'
