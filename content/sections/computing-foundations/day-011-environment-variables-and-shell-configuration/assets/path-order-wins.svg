<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The shell takes the first match and stops looking.">
  <title>Three mysteries, one rule</title>
  <style>
    .path-order-wins-bg   { fill: #f8fafc; }
    .path-order-wins-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-order-wins-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-order-wins-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-order-wins-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-order-wins-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-order-wins-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .path-order-wins-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .path-order-wins-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .path-order-wins-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .path-order-wins-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .path-order-wins-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .path-order-wins-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .path-order-wins-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .path-order-wins-stage { opacity: 1; }

    .path-order-wins-s0 { animation-delay: 0.00s; }
    .path-order-wins-e0 { animation-delay: 0.00s; }
    .path-order-wins-s1 { animation-delay: 1.28s; }
    .path-order-wins-e1 { animation-delay: 1.28s; }
    .path-order-wins-s2 { animation-delay: 2.56s; }
    .path-order-wins-e2 { animation-delay: 2.56s; }
    .path-order-wins-s3 { animation-delay: 3.84s; }
    .path-order-wins-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .path-order-wins-conn  { animation: path-order-wins-trace 6.4s ease-in-out infinite; }
      .path-order-wins-stage { animation: path-order-wins-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes path-order-wins-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes path-order-wins-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .path-order-wins-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .path-order-wins-stage { animation: path-order-wins-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes path-order-wins-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="path-order-wins-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="path-order-wins-bg" width="980" height="322"/>
  <text class="path-order-wins-h1"  x="30" y="40">Three mysteries, one rule</text>
  <text class="path-order-wins-sub" x="30" y="64">The shell takes the first match and stops looking.</text>
  <g class="path-order-wins-stage path-order-wins-s0">
    <rect class="path-order-wins-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="path-order-wins-step" x="44" y="142">01</text>
    <text class="path-order-wins-name" x="70" y="142">Search left to right</text>
    <text class="path-order-wins-desc" x="44" y="166">Each directory in PATH, in</text>
    <text class="path-order-wins-desc" x="44" y="182">order, checked for an executable</text>
    <text class="path-order-wins-desc" x="44" y="198">of that name.</text>
  </g>
  <line class="path-order-wins-line path-order-wins-conn path-order-wins-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#path-order-wins-tip)"/>
  <g class="path-order-wins-stage path-order-wins-s1">
    <rect class="path-order-wins-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="path-order-wins-step" x="280" y="142">02</text>
    <text class="path-order-wins-name" x="306" y="142">First match wins</text>
    <text class="path-order-wins-desc" x="280" y="166">Two copies installed? The</text>
    <text class="path-order-wins-desc" x="280" y="182">earlier directory decides. This</text>
    <text class="path-order-wins-desc" x="280" y="198">is why installers prepend.</text>
    <text class="path-order-wins-edge" x="280" y="242">order matters</text>
  </g>
  <line class="path-order-wins-line path-order-wins-conn path-order-wins-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#path-order-wins-tip)"/>
  <g class="path-order-wins-stage path-order-wins-s2">
    <rect class="path-order-wins-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="path-order-wins-step" x="516" y="142">03</text>
    <text class="path-order-wins-name" x="542" y="142">No match anywhere</text>
    <text class="path-order-wins-desc" x="516" y="166">"command not found" — usually</text>
    <text class="path-order-wins-desc" x="516" y="182">installed somewhere PATH never</text>
    <text class="path-order-wins-desc" x="516" y="198">mentions.</text>
  </g>
  <line class="path-order-wins-line path-order-wins-conn path-order-wins-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#path-order-wins-tip)"/>
  <g class="path-order-wins-stage path-order-wins-s3">
    <rect class="path-order-wins-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="path-order-wins-step" x="752" y="142">04</text>
    <text class="path-order-wins-name" x="778" y="142">The current directory is not searched</text>
    <text class="path-order-wins-desc" x="752" y="166">Deliberately. You must write</text>
    <text class="path-order-wins-desc" x="752" y="182">./toolname.</text>
    <text class="path-order-wins-edge" x="752" y="242">./</text>
  </g>
  <text class="path-order-wins-sub" x="30" y="304">command -v python3 prints what would actually run. type python3 says whether it is a program, a builtin, an alias or a function. Both turn an invisible decision into a visible one.</text>
</svg>
