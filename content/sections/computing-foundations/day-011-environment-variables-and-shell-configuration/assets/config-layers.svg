<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four layers, narrowest last, each overriding the one before.">
  <title>Where a setting should live</title>
  <style>
    .config-layers-bg   { fill: #f8fafc; }
    .config-layers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .config-layers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .config-layers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .config-layers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .config-layers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .config-layers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .config-layers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .config-layers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .config-layers-stage { opacity: 1; }

    .config-layers-s0 { animation-delay: 0.00s; }
    .config-layers-e0 { animation-delay: 0.00s; }
    .config-layers-s1 { animation-delay: 1.28s; }
    .config-layers-e1 { animation-delay: 1.28s; }
    .config-layers-s2 { animation-delay: 2.56s; }
    .config-layers-e2 { animation-delay: 2.56s; }
    .config-layers-s3 { animation-delay: 3.84s; }
    .config-layers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .config-layers-conn  { animation: config-layers-trace 6.4s ease-in-out infinite; }
      .config-layers-stage { animation: config-layers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes config-layers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes config-layers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .config-layers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .config-layers-stage { animation: config-layers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes config-layers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="config-layers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="config-layers-bg" width="980" height="322"/>
  <text class="config-layers-h1"  x="30" y="40">Where a setting should live</text>
  <text class="config-layers-sub" x="30" y="64">Four layers, narrowest last, each overriding the one before.</text>
  <g class="config-layers-stage config-layers-s0">
    <rect class="config-layers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="config-layers-step" x="44" y="142">01</text>
    <text class="config-layers-name" x="70" y="142">The program's defaults</text>
    <text class="config-layers-desc" x="44" y="166">What it does when you set</text>
    <text class="config-layers-desc" x="44" y="182">nothing at all.</text>
  </g>
  <line class="config-layers-line config-layers-conn config-layers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#config-layers-tip)"/>
  <g class="config-layers-stage config-layers-s1">
    <rect class="config-layers-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="config-layers-step" x="280" y="142">02</text>
    <text class="config-layers-name" x="306" y="142">Your shell config</text>
    <text class="config-layers-desc" x="280" y="166">~/.zshrc — applies to everything</text>
    <text class="config-layers-desc" x="280" y="182">you run, everywhere.</text>
    <text class="config-layers-edge" x="280" y="242">global</text>
  </g>
  <line class="config-layers-line config-layers-conn config-layers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#config-layers-tip)"/>
  <g class="config-layers-stage config-layers-s2">
    <rect class="config-layers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="config-layers-step" x="516" y="142">03</text>
    <text class="config-layers-name" x="542" y="142">Per-project</text>
    <text class="config-layers-desc" x="516" y="166">A .env file, or direnv. Applies</text>
    <text class="config-layers-desc" x="516" y="182">inside one directory tree.</text>
    <text class="config-layers-edge" x="516" y="242">project</text>
  </g>
  <line class="config-layers-line config-layers-conn config-layers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#config-layers-tip)"/>
  <g class="config-layers-stage config-layers-s3">
    <rect class="config-layers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="config-layers-step" x="752" y="142">04</text>
    <text class="config-layers-name" x="778" y="142">One command only</text>
    <text class="config-layers-desc" x="752" y="166">VAR=value ./run — set for that</text>
    <text class="config-layers-desc" x="752" y="182">invocation and nothing else.</text>
    <text class="config-layers-edge" x="752" y="242">narrowest</text>
  </g>
  <text class="config-layers-sub" x="30" y="304">Prefer the narrowest layer that works. A global export is the fastest fix and the one most likely to confuse you in three months.</text>
</svg>
