<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A variable is in the environment if, and only if, it was exported.">
  <title>What export actually changes</title>
  <style>
    .export-inheritance-bg   { fill: #f8fafc; }
    .export-inheritance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-inheritance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-inheritance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-inheritance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-inheritance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-inheritance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .export-inheritance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .export-inheritance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .export-inheritance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .export-inheritance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .export-inheritance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .export-inheritance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .export-inheritance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .export-inheritance-stage { opacity: 1; }

    .export-inheritance-s0 { animation-delay: 0.00s; }
    .export-inheritance-e0 { animation-delay: 0.00s; }
    .export-inheritance-s1 { animation-delay: 1.28s; }
    .export-inheritance-e1 { animation-delay: 1.28s; }
    .export-inheritance-s2 { animation-delay: 2.56s; }
    .export-inheritance-e2 { animation-delay: 2.56s; }
    .export-inheritance-s3 { animation-delay: 3.84s; }
    .export-inheritance-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .export-inheritance-conn  { animation: export-inheritance-trace 6.4s ease-in-out infinite; }
      .export-inheritance-stage { animation: export-inheritance-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes export-inheritance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes export-inheritance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .export-inheritance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .export-inheritance-stage { animation: export-inheritance-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes export-inheritance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="export-inheritance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="export-inheritance-bg" width="980" height="322"/>
  <text class="export-inheritance-h1"  x="30" y="40">What export actually changes</text>
  <text class="export-inheritance-sub" x="30" y="64">A variable is in the environment if, and only if, it was exported.</text>
  <g class="export-inheritance-stage export-inheritance-s0">
    <rect class="export-inheritance-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="export-inheritance-step" x="44" y="142">01</text>
    <text class="export-inheritance-name" x="70" y="142">Assign it</text>
    <text class="export-inheritance-desc" x="44" y="166">greeting="hello" — no spaces</text>
    <text class="export-inheritance-desc" x="44" y="182">around the equals sign.</text>
    <text class="export-inheritance-edge" x="44" y="242">shell var</text>
  </g>
  <line class="export-inheritance-line export-inheritance-conn export-inheritance-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#export-inheritance-tip)"/>
  <g class="export-inheritance-stage export-inheritance-s1">
    <rect class="export-inheritance-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="export-inheritance-step" x="280" y="142">02</text>
    <text class="export-inheritance-name" x="306" y="142">A child cannot see it</text>
    <text class="export-inheritance-desc" x="280" y="166">bash -c 'echo $greeting' prints</text>
    <text class="export-inheritance-desc" x="280" y="182">an empty line.</text>
    <text class="export-inheritance-edge" x="280" y="242">empty</text>
  </g>
  <line class="export-inheritance-line export-inheritance-conn export-inheritance-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#export-inheritance-tip)"/>
  <g class="export-inheritance-stage export-inheritance-s2">
    <rect class="export-inheritance-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="export-inheritance-step" x="516" y="142">03</text>
    <text class="export-inheritance-name" x="542" y="142">Export it</text>
    <text class="export-inheritance-desc" x="516" y="166">export greeting — marks it for</text>
    <text class="export-inheritance-desc" x="516" y="182">inheritance.</text>
  </g>
  <line class="export-inheritance-line export-inheritance-conn export-inheritance-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#export-inheritance-tip)"/>
  <g class="export-inheritance-stage export-inheritance-s3">
    <rect class="export-inheritance-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="export-inheritance-step" x="752" y="142">04</text>
    <text class="export-inheritance-name" x="778" y="142">Now the child inherits</text>
    <text class="export-inheritance-desc" x="752" y="166">Every process started from here</text>
    <text class="export-inheritance-desc" x="752" y="182">receives a copy.</text>
    <text class="export-inheritance-edge" x="752" y="242">hello</text>
  </g>
  <text class="export-inheritance-sub" x="30" y="304">set lists all shell variables; env and printenv list only the exported ones. That difference is the whole distinction.</text>
</svg>
