slug: environment-variables-and-shell-configuration
title: 'Environment Variables and Shell Configuration'
section: computing-foundations
subsection: how-computers-work
week: 2
learning_promise: 'After this lesson you will be able to read and set environment variables, explain how PATH decides which command runs, edit the correct shell configuration file for your shell, and keep secrets like API keys out of version control.'
objectives:
  - 'Distinguish a shell variable from an environment variable and explain what export does'
  - 'Explain how the shell uses PATH to resolve a bare command name, and diagnose "command not found" and wrong-version problems'
  - 'Name and describe the most important environment variables — PATH, HOME, USER, SHELL, LANG, EDITOR — and what each controls'
  - 'Identify which configuration file a shell reads for login versus interactive sessions in bash and zsh, and edit the correct one'
  - 'Define aliases and functions and place them in a config file so they persist across new terminals'
  - 'Store secrets such as API keys in environment variables and dotenv files kept out of version control, and describe how direnv automates this'
prerequisites:
  - 'Days 8-10: comfort opening a terminal, navigating the filesystem, and running basic commands'
  - 'A computer running macOS or Linux (Windows via WSL) with a bash or zsh shell'
reading_time_minutes: 40
practical_time_minutes: 30
