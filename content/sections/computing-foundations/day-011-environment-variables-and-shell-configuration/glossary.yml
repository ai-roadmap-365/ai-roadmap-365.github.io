terms:
  - term: environment variable
    definition: 'A named string value held by a running process and copied by the operating system to every child process it starts, used to pass configuration and secrets without editing code.'
  - term: shell variable
    definition: 'A named value known only to the current shell; unlike an environment variable, it is not inherited by the programs the shell launches unless it is exported.'
  - term: export
    definition: 'A shell keyword that marks a variable to be included in the environment, so that child processes started afterward inherit a copy of its value.'
  - term: PATH
    definition: 'An environment variable holding a colon-separated list of directories the shell searches, in order, to find the executable for a bare command name, running the first match.'
  - term: HOME
    definition: 'An environment variable holding the absolute path to your home directory; the shell expands the shorthand ~ to its value.'
  - term: alias
    definition: 'A short name defined in the shell that expands to a longer command by simple text substitution, such as ll for ls -la.'
  - term: shell function
    definition: 'A named block of shell commands that can take arguments and contain logic, used like a command; more powerful than an alias for anything beyond fixed text substitution.'
  - term: .bashrc
    definition: 'The configuration file bash reads for interactive non-login shells; a common place to define aliases, functions, and exported variables.'
  - term: .zshrc
    definition: 'The configuration file zsh reads for interactive shells; on macOS, where a new Terminal tab runs zsh, this is usually the file to edit for personal settings.'
  - term: login shell
    definition: 'The first shell of a session, such as the one an SSH connection or a new macOS Terminal tab starts; it reads profile files like ~/.bash_profile or ~/.zprofile.'
  - term: interactive shell
    definition: 'A shell that is reading commands a person types, as opposed to running a script non-interactively; it reads files like ~/.bashrc or ~/.zshrc.'
  - term: subshell
    definition: 'A child shell created by wrapping commands in parentheses; variables it sets and exports affect only itself and vanish when it exits, leaving the parent environment untouched.'
  - term: dotenv
    definition: 'A convention of storing environment variables as NAME=value lines in a file (commonly .env) that is loaded at run time and kept out of version control via .gitignore.'
  - term: direnv
    definition: 'An open-source tool that automatically loads a per-directory set of environment variables when you enter a project directory and unloads them when you leave.'
