questions:
  - question: 'What is the difference between a shell variable and an environment variable?'
    options:
      - 'A shell variable holds numbers while an environment variable holds text'
      - 'A shell variable is permanent while an environment variable disappears at power-off'
      - 'A shell variable is private; an exported one is inherited by children'
      - 'There is no difference; the two terms are interchangeable'
    answer_index: 2
    explanation: 'Every variable starts private to the shell. Only when you export it does it join the environment, the set of values the operating system copies to every child process the shell launches.'

  - question: 'You type the command `format` and your PATH is `/usr/local/bin:/usr/bin:/bin`. An executable named `format` exists in both `/usr/bin` and `/bin`. Which one runs?'
    options:
      - 'The one in /bin, because it is the most trusted system directory'
      - 'Both run, one after the other'
      - 'Neither; a name in two directories causes an error'
      - 'The one in /usr/bin, because it comes first on PATH'
    answer_index: 3
    explanation: 'The shell searches PATH left to right and runs the first match. Since /usr/bin appears before /bin, its copy wins. This ordering is why the wrong version of a tool sometimes runs.'

  - question: 'What does the `export` keyword actually do?'
    options:
      - 'It marks a variable to be inherited by child processes'
      - 'It saves the variable permanently to a file on disk'
      - 'It creates a new variable that did not exist before'
      - 'It deletes the variable from the current shell'
    answer_index: 0
    explanation: 'export does not create or persist a variable; it marks the name so that its value is copied into the environment of every command the shell runs from then on. The variable may already exist beforehand.'

  - question: 'On a macOS machine using zsh, you add `export EDITOR=nano` to `~/.bash_profile`, but new Terminal tabs never pick it up. What is the most likely reason?'
    options:
      - 'nano is not installed, so the setting is ignored'
      - 'Your shell is zsh, which reads ~/.zshrc, not ~/.bash_profile'
      - 'export cannot be used with EDITOR'
      - 'You must restart the computer for any config change to take effect'
    answer_index: 1
    explanation: 'Each shell reads its own configuration files. zsh reads ~/.zshrc (and ~/.zprofile, ~/.zshenv), never ~/.bash_profile. Putting the setting in the file your shell actually reads is the fix.'

  - question: 'Why can a shell script never change the environment of the terminal that launched it?'
    options:
      - 'Scripts are not allowed to use the export keyword'
      - 'The terminal locks its environment while a script runs'
      - 'The script runs as a child, so its changes vanish when it exits'
      - 'Only the operating system can change environment variables'
    answer_index: 2
    explanation: 'A child process receives a copy of the environment. It can modify its own copy, but that copy is discarded when the child exits. The environment flows strictly downward, from parent to child, never back up.'

  - question: 'Which command tells you the full path that the shell would run for a given command name?'
    options:
      - 'echo'
      - 'export'
      - 'printenv'
      - 'command -v'
    answer_index: 3
    explanation: '`command -v python3` prints the resolved path (or nothing if not found). `type` and `which` give similar information; printenv lists environment variables, and echo prints text.'

  - question: 'Which configuration file does bash read for a non-login interactive shell (for example, a second terminal opened on a Linux desktop)?'
    options:
      - '~/.bashrc'
      - '~/.bash_profile'
      - '/etc/passwd'
      - '~/.zshrc'
    answer_index: 0
    explanation: 'bash reads ~/.bashrc for interactive non-login shells and ~/.bash_profile for login shells. Because they diverge, the common convention is to have ~/.bash_profile source ~/.bashrc so both behave the same.'

  - question: 'What is the safe, standard way to give your program an API key without risking it in version control?'
    options:
      - 'Paste the key directly into your source code and commit it'
      - 'Put the key in an environment variable, via a gitignored .env file'
      - 'Email the key to yourself so you always have a copy'
      - 'Store the key in the git commit message'
    answer_index: 1
    explanation: 'Secrets belong in environment variables, kept out of committed files. A common pattern is a .env file loaded at run time and listed in .gitignore, so the key is present in memory but absent from every file you commit.'
