id: D032
day: 32
slug: remotes-and-github
title: 'Remotes and GitHub'
section: computing-foundations
subsection: developer-workflow
week: 5
learning_promise: 'After this lesson you will be able to connect a local Git repository to another copy of itself — a remote — and move commits between them with clone, fetch, pull, and push, understanding exactly what each does and how hosting platforms like GitHub build on top of that connection.'
objectives:
  - 'Define a remote as a named reference to another copy of a repository, and explain what "origin" and "upstream" mean'
  - 'Move commits between repositories with git clone, git fetch, git pull, and git push, and state precisely how fetch and pull differ'
  - 'Explain what a remote-tracking branch (origin/main) is and how it relates to your local branch'
  - 'Distinguish Git from a hosting platform, and describe what GitHub, GitLab, Bitbucket, and self-hosted Gitea add on top of a Git remote'
  - 'Compare HTTPS-with-a-token and SSH-key authentication: how each proves identity, and when to choose each'
  - 'Distinguish public from private repositories and cloning from forking, and simulate a full push/fetch/pull cycle against a local bare repository with no network'
prerequisites:
  - 'Days 29–31: version control concepts, Git repositories, staging and commits, and branching and merging'
  - 'A terminal with Git installed (macOS, Linux, or Windows with WSL); no GitHub account or network is required for the lab'
reading_time_minutes: 40
practical_time_minutes: 30
last_verified: '2026-07-12'
tags: [git, github, remotes, version-control, collaboration]
