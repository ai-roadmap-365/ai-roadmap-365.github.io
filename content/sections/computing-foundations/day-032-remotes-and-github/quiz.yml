questions:
  - question: 'What is a Git remote?'
    options:
      - 'A cloud account you must create before Git will work'
      - 'A backup service built into the Git program'
      - 'A branch that only exists on the internet'
      - 'A named reference to another copy of the repository'
    answer_index: 3
    explanation: 'A remote is simply another copy of the repository — on a server, a peer machine, or even a local folder — together with a short name (like "origin") your Git uses to refer to it. Nothing about it requires the cloud or an account.'

  - question: 'What is the difference between git fetch and git pull?'
    options:
      - 'Fetch only downloads; pull downloads and then merges'
      - 'They are two names for the same command'
      - 'Fetch uploads commits; pull downloads them'
      - 'Pull works offline while fetch requires a network'
    answer_index: 0
    explanation: 'git pull is defined as git fetch followed by a merge. Fetch is the safe download-only step that updates origin/main without changing your files; pull additionally integrates those commits into the branch you are on.'

  - question: 'When you run git clone, what name does Git give the remote it sets up automatically?'
    options:
      - 'main'
      - 'origin'
      - 'upstream'
      - 'master'
    answer_index: 1
    explanation: 'Clone records one remote and names it "origin" by convention, meaning "the place this repository came from." The name is only a default — you can rename it or add others — but "origin" is what you will see almost everywhere.'

  - question: 'What is the relationship between Git and GitHub?'
    options:
      - 'GitHub is the version-control tool; Git is a website that hosts it'
      - 'They are the same product under two names'
      - 'Git is the tool on your machine; GitHub hosts remotes'
      - 'Git only works if you have a GitHub account'
    answer_index: 2
    explanation: 'Git is the distributed version-control engine; GitHub, GitLab, and Bitbucket are platforms built around Git remotes, adding a website, permissions, issue tracking, and more. You can use Git for years with no GitHub account.'

  - question: 'You try to git push and Git rejects it, saying the remote contains work you do not have locally. What is the correct response?'
    options:
      - 'Force the push to overwrite the remote'
      - 'Delete your local branch and start over'
      - 'Create a new remote and push there instead'
      - 'Run git pull first, then push again'
    answer_index: 3
    explanation: 'The rejection is a safety feature preventing you from silently overwriting someone else''s work. The correct, safe sequence is to fetch and merge the remote''s new commits into your branch, then push the reconciled result.'

  - question: 'Which statement about a remote-tracking branch such as origin/main is correct?'
    options:
      - 'A read-only mirror of the remote branch that Git updates'
      - 'It is the branch you commit to when working offline'
      - 'It is a separate copy of the whole repository'
      - 'It is automatically deleted after every push'
    answer_index: 0
    explanation: 'origin/main is your machine''s mirror of where the remote''s main branch was as of your last communication with it. You never commit to it directly; Git moves it during fetch and pull, and your local main is the branch you actually edit.'

  - question: 'How does SSH-key authentication prove your identity to a remote, compared with HTTPS?'
    options:
      - 'It sends your account password encrypted over the web port'
      - 'A private key never leaves your machine; nothing secret is sent'
      - 'It requires you to paste a token on every push'
      - 'It disables authentication entirely for trusted networks'
    answer_index: 1
    explanation: 'With SSH you generate a key pair, upload the public key once, and your machine proves it holds the matching private key through a handshake — no password or token is transmitted. HTTPS instead presents a username and a revocable personal access token.'

  - question: 'What is the difference between cloning a repository and forking it?'
    options:
      - 'Cloning is free; forking costs money'
      - 'Forking downloads only the latest commit; cloning downloads everything'
      - 'Cloning copies locally; forking copies on the platform'
      - 'They are identical operations'
    answer_index: 2
    explanation: 'Clone brings a repository down to your local machine. Fork creates a copy under your own account on the hosting platform — essential when you want to propose changes to a project you have no write access to, since you can push to your fork and then propose merging it back.'
