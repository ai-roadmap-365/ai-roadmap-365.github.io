visuals:
  - id: local-remote
    file: assets/local-remote.svg
    type: diagram
    title: 'A local repository and its remote'
    alt: 'Diagram: a local repository and a remote named origin, linked by fetch and push, with a tracking branch mirroring the remote branch'
    description: 'An architecture diagram showing a local repository on the left with a main branch and an origin/main tracking branch, a remote named origin on the right with its own main branch, and labelled fetch and push arrows crossing between them, illustrating that a remote is a named bookmark pointing at another copy of the same repository.'
  - id: clone-fetch-pull-push
    file: assets/clone-fetch-pull-push.svg
    type: flowchart
    title: 'Four remote operations and what each moves'
    alt: 'Diagram: the four remote operations — clone, fetch, pull, and push — and what data each one moves between the remote and your local repository'
    description: 'A flow diagram with the remote on the left and the local repository on the right, showing four rows — clone, fetch, pull, and push — each with a directional arrow describing the data it moves: clone copies the whole history, fetch downloads to the tracking branch, pull downloads and merges into your branch, and push uploads your commits to the remote.'
  - id: move-versus-integrate
    file: assets/move-versus-integrate.svg
    type: diagram
    title: 'Two different jobs, constantly confused'
    alt: 'Diagram: commands that move commits compared with commands that integrate them'
    description: 'A two-column comparison separating the commands that transfer commits between repositories from those that integrate commits into a working branch.'
  - id: tracking-branch
    file: assets/tracking-branch.svg
    type: diagram
    title: 'What origin/main actually is'
    alt: 'Diagram: how a remote-tracking branch mirrors a remote branch'
    description: 'A four-stage explanation of remote-tracking branches covering what they represent, when they update, that they are read-only, and how they go stale.'
  - id: push-rejection
    file: assets/push-rejection.svg
    type: diagram
    title: 'Why a push gets rejected'
    alt: 'Diagram: the cause of a rejected push and how to resolve it'
    description: 'A four-stage explanation of a rejected push covering the remote having commits you lack, why Git refuses, the correct fetch-and-integrate recovery, and why forcing is destructive.'
  - id: unpushed-is-unbacked
    file: assets/unpushed-is-unbacked.svg
    type: diagram
    title: 'Committed is not backed up'
    alt: 'Diagram: a commit that exists only locally compared with one that has been pushed'
    description: 'A two-column comparison of committed but unpushed work against pushed work, covering how many machines hold it and what a disk failure costs.'
  - id: clone-cost
    file: assets/clone-cost.svg
    type: diagram
    title: 'Why a clone downloads the whole history'
    alt: 'Diagram: what a git clone actually transfers'
    description: 'A four-stage explanation of clone cost covering the full history being transferred, the permanence of large objects, the effect on every future clone, and the shallow-clone alternative.'
  - id: push-publishes
    file: assets/push-publishes.svg
    type: diagram
    title: 'Pushing is publication'
    alt: 'Diagram: what becomes public when a repository is pushed'
    description: 'A two-column comparison of what people assume a push publishes against what it actually publishes, covering historical commits and committed credentials.'
  - id: no-central-repository
    file: assets/no-central-repository.svg
    type: diagram
    title: 'There is no technical centre'
    alt: 'Diagram: a centralised server compared with peer repositories'
    description: 'A two-column comparison of a centralised version control server against distributed peer repositories, covering where authority lives and what remains possible offline.'
  - id: fetch-then-look
    file: assets/fetch-then-look.svg
    type: diagram
    title: 'Fetch, look, then integrate'
    alt: 'Diagram: fetching and inspecting before merging'
    description: 'A four-stage careful workflow for incorporating remote changes: fetching, inspecting the incoming commits, reviewing the diff, and then merging deliberately.'
  - id: ssh-or-token
    file: assets/ssh-or-token.svg
    type: diagram
    title: 'How to authenticate to a remote'
    alt: 'Diagram: SSH keys compared with access tokens'
    description: 'A two-column comparison of SSH key and personal access token authentication for Git remotes, covering setup, scope and revocation.'
  - id: fork-is-a-platform-thing
    file: assets/fork-is-a-platform-thing.svg
    type: diagram
    title: 'A fork is not a git concept'
    alt: 'Diagram: a fork compared with a clone'
    description: 'A two-column comparison of cloning a repository against forking it on a hosting platform, covering where each copy lives and what each enables.'
