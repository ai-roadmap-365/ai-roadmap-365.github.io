visuals:
  - id: local-remote
    file: assets/local-remote.svg
    type: diagram
    title: 'A local repository and its remote'
    alt: 'Diagram: a local repository and a remote named origin, linked by fetch and push, with a tracking branch mirroring the remote branch'
    description: 'An architecture diagram showing a local repository on the left with a main branch and an origin/main tracking branch, a remote named origin on the right with its own main branch, and labelled fetch and push arrows crossing between them, illustrating that a remote is a named bookmark pointing at another copy of the same repository.'
  - id: clone-fetch-pull-push
    file: assets/clone-fetch-pull-push.svg
    type: flowchart
    title: 'Four remote operations and what each moves'
    alt: 'Diagram: the four remote operations — clone, fetch, pull, and push — and what data each one moves between the remote and your local repository'
    description: 'A flow diagram with the remote on the left and the local repository on the right, showing four rows — clone, fetch, pull, and push — each with a directional arrow describing the data it moves: clone copies the whole history, fetch downloads to the tracking branch, pull downloads and merges into your branch, and push uploads your commits to the remote.'
