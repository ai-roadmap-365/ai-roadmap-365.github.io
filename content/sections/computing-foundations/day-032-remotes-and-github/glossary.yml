terms:
  - term: remote
    definition: 'A named reference to another copy of a Git repository — on a server, a peer machine, or a local folder — that your repository can synchronise with.'
  - term: origin
    definition: 'The conventional default name Git gives the remote a repository was cloned from; it means "the place this repository came from."'
  - term: clone
    definition: 'The command that creates a new local copy of a remote repository, including its full history, and sets up the origin remote and tracking branches automatically.'
  - term: fetch
    definition: 'The command that downloads new commits from a remote and updates the remote-tracking branches, without changing your working branch or files.'
  - term: pull
    definition: 'The command that fetches from a remote and then merges the downloaded commits into your current branch; equivalent to a fetch followed by a merge.'
  - term: push
    definition: 'The command that uploads your local commits to a remote so other copies of the repository can receive them.'
  - term: upstream
    definition: 'The specific remote branch a local branch is paired with, so that a bare git push or git pull knows where to send and receive commits.'
  - term: tracking branch
    definition: 'A read-only local mirror of a remote branch, such as origin/main, that Git updates for you during fetch and pull; also called a remote-tracking branch.'
  - term: SSH key
    definition: 'A cryptographic key pair used to authenticate to a remote: a private key stays on your machine and a public key is uploaded once, and your identity is proven by a handshake with no secret transmitted.'
  - term: personal access token
    definition: 'A long, random, revocable secret used in place of an account password when authenticating to a hosting platform over HTTPS; it can be scoped to specific permissions and given an expiry date.'
  - term: fork
    definition: 'Your own server-side copy of someone else''s repository on a hosting platform, which you can push to freely and use to propose changes back to the original.'
  - term: bare repository
    definition: 'A repository that stores Git history but has no working directory of checked-out files; this is the form a server-side remote takes, and the lab uses one to act as a local "origin".'
  - term: hosting platform
    definition: 'A service such as GitHub, GitLab, or Bitbucket that hosts Git remotes and adds a website, access control, issue tracking, code review, and automation on top of Git.'
