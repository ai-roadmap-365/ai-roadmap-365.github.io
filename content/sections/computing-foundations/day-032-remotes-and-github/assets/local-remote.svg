<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>A local repository and a remote named origin, linked by fetch and push, with a tracking branch mirroring the remote branch</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Your local repository and its remote</text>

  <!-- Local repository panel -->
  <rect x="30" y="70" width="300" height="300" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="180" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Local repository (your machine)</text>

  <rect x="55" y="120" width="250" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="180" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">main</text>
  <text x="180" y="166" text-anchor="middle" font-size="14" fill="#1a202c">your working branch</text>

  <rect x="55" y="200" width="250" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="180" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">origin/main</text>
  <text x="180" y="246" text-anchor="middle" font-size="14" fill="#1a202c">tracking branch (a copy of the remote)</text>

  <rect x="55" y="285" width="250" height="60" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="8"/>
  <text x="180" y="310" text-anchor="middle" font-size="14" fill="#1a202c">.git holds every commit,</text>
  <text x="180" y="330" text-anchor="middle" font-size="14" fill="#1a202c">plus a list of remotes</text>

  <!-- Remote panel -->
  <rect x="470" y="70" width="260" height="230" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="600" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Remote: origin</text>
  <text x="600" y="118" text-anchor="middle" font-size="14" fill="#1a202c">another full copy of the repo</text>

  <rect x="495" y="140" width="210" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="600" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">main</text>
  <text x="600" y="186" text-anchor="middle" font-size="14" fill="#1a202c">the shared branch</text>

  <rect x="495" y="220" width="210" height="60" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="8"/>
  <text x="600" y="245" text-anchor="middle" font-size="14" fill="#1a202c">hosted on a server or</text>
  <text x="600" y="265" text-anchor="middle" font-size="14" fill="#1a202c">just another directory</text>

  <!-- fetch arrow: remote -> local -->
  <line x1="490" y1="160" x2="345" y2="215" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="332,220 349,213 347,227" fill="#1d4ed8"/>
  <text x="410" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">fetch</text>
  <text x="410" y="198" text-anchor="middle" font-size="13" fill="#1a202c">downloads new commits</text>

  <!-- push arrow: local -> remote -->
  <line x1="315" y1="145" x2="490" y2="155" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="503,156 486,148 488,162" fill="#1d4ed8"/>
  <text x="405" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">push</text>
  <text x="405" y="112" text-anchor="middle" font-size="13" fill="#1a202c">uploads your commits</text>

  <!-- merge note inside local -->
  <text x="180" y="192" text-anchor="middle" font-size="12" fill="#1a202c">pull = fetch, then merge origin/main into main</text>

  <!-- footer note -->
  <rect x="30" y="392" width="700" height="34" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="414" text-anchor="middle" font-size="14" fill="#1a202c">A remote is just a named bookmark (here, "origin") pointing at another copy of the same repository.</text>
</svg>
