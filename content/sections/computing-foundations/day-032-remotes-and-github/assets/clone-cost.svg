<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And why one old mistake slows it forever.">
  <title>Why a clone downloads the whole history</title>
  <style>
    .clone-cost-bg   { fill: #f8fafc; }
    .clone-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clone-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clone-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clone-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clone-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clone-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clone-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .clone-cost-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .clone-cost-stage { opacity: 1; }

    .clone-cost-s0 { animation-delay: 0.00s; }
    .clone-cost-e0 { animation-delay: 0.00s; }
    .clone-cost-s1 { animation-delay: 1.28s; }
    .clone-cost-e1 { animation-delay: 1.28s; }
    .clone-cost-s2 { animation-delay: 2.56s; }
    .clone-cost-e2 { animation-delay: 2.56s; }
    .clone-cost-s3 { animation-delay: 3.84s; }
    .clone-cost-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .clone-cost-conn  { animation: clone-cost-trace 6.4s ease-in-out infinite; }
      .clone-cost-stage { animation: clone-cost-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes clone-cost-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes clone-cost-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .clone-cost-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .clone-cost-stage { animation: clone-cost-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes clone-cost-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="clone-cost-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="clone-cost-bg" width="980" height="322"/>
  <text class="clone-cost-h1"  x="30" y="40">Why a clone downloads the whole history</text>
  <text class="clone-cost-sub" x="30" y="64">And why one old mistake slows it forever.</text>
  <g class="clone-cost-stage clone-cost-s0">
    <rect class="clone-cost-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="clone-cost-step" x="44" y="142">01</text>
    <text class="clone-cost-name" x="70" y="142">Clone transfers everything</text>
    <text class="clone-cost-desc" x="44" y="166">Every commit, every version of</text>
    <text class="clone-cost-desc" x="44" y="182">every file — not just the</text>
    <text class="clone-cost-desc" x="44" y="198">current checkout.</text>
  </g>
  <line class="clone-cost-line clone-cost-conn clone-cost-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#clone-cost-tip)"/>
  <g class="clone-cost-stage clone-cost-s1">
    <rect class="clone-cost-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="clone-cost-step" x="280" y="142">02</text>
    <text class="clone-cost-name" x="306" y="142">Which is what makes it distributed</text>
    <text class="clone-cost-desc" x="280" y="166">You can work offline, read</text>
    <text class="clone-cost-desc" x="280" y="182">history, and branch, because you</text>
    <text class="clone-cost-desc" x="280" y="198">have all of it.</text>
  </g>
  <line class="clone-cost-line clone-cost-conn clone-cost-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#clone-cost-tip)"/>
  <g class="clone-cost-stage clone-cost-s2">
    <rect class="clone-cost-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="clone-cost-step" x="516" y="142">03</text>
    <text class="clone-cost-name" x="542" y="142">So a large file is permanent</text>
    <text class="clone-cost-desc" x="516" y="166">Committed once in 2021 and</text>
    <text class="clone-cost-desc" x="516" y="182">deleted in 2022, it is still in</text>
    <text class="clone-cost-desc" x="516" y="198">every clone today.</text>
    <text class="clone-cost-edge" x="516" y="242">forever</text>
  </g>
  <line class="clone-cost-line clone-cost-conn clone-cost-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#clone-cost-tip)"/>
  <g class="clone-cost-stage clone-cost-s3">
    <rect class="clone-cost-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="clone-cost-step" x="752" y="142">04</text>
    <text class="clone-cost-name" x="778" y="142">Shallow clones skip history</text>
    <text class="clone-cost-desc" x="752" y="166">--depth 1 for CI, where nobody</text>
    <text class="clone-cost-desc" x="752" y="182">needs the past.</text>
    <text class="clone-cost-edge" x="752" y="242">--depth 1</text>
  </g>
  <text class="clone-cost-sub" x="30" y="304">This is the concrete reason not to commit datasets and model weights: the cost is not paid once by you, it is paid by everyone who ever clones the repository.</text>
</svg>
