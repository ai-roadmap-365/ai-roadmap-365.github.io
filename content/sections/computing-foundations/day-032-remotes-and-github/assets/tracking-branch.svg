<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Your machine's note about somewhere else.">
  <title>What origin/main actually is</title>
  <style>
    .tracking-branch-bg   { fill: #f8fafc; }
    .tracking-branch-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-branch-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-branch-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-branch-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-branch-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-branch-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-branch-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracking-branch-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracking-branch-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracking-branch-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracking-branch-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracking-branch-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tracking-branch-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tracking-branch-stage { opacity: 1; }

    .tracking-branch-s0 { animation-delay: 0.00s; }
    .tracking-branch-e0 { animation-delay: 0.00s; }
    .tracking-branch-s1 { animation-delay: 1.28s; }
    .tracking-branch-e1 { animation-delay: 1.28s; }
    .tracking-branch-s2 { animation-delay: 2.56s; }
    .tracking-branch-e2 { animation-delay: 2.56s; }
    .tracking-branch-s3 { animation-delay: 3.84s; }
    .tracking-branch-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tracking-branch-conn  { animation: tracking-branch-trace 6.4s ease-in-out infinite; }
      .tracking-branch-stage { animation: tracking-branch-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tracking-branch-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tracking-branch-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tracking-branch-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tracking-branch-stage { animation: tracking-branch-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tracking-branch-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tracking-branch-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tracking-branch-bg" width="980" height="322"/>
  <text class="tracking-branch-h1"  x="30" y="40">What origin/main actually is</text>
  <text class="tracking-branch-sub" x="30" y="64">Your machine's note about somewhere else.</text>
  <g class="tracking-branch-stage tracking-branch-s0">
    <rect class="tracking-branch-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-branch-step" x="44" y="142">01</text>
    <text class="tracking-branch-name" x="70" y="142">A read-only mirror</text>
    <text class="tracking-branch-desc" x="44" y="166">Your best guess about where the</text>
    <text class="tracking-branch-desc" x="44" y="182">remote's main branch is.</text>
  </g>
  <line class="tracking-branch-line tracking-branch-conn tracking-branch-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tracking-branch-tip)"/>
  <g class="tracking-branch-stage tracking-branch-s1">
    <rect class="tracking-branch-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-branch-step" x="280" y="142">02</text>
    <text class="tracking-branch-name" x="306" y="142">Updated only on contact</text>
    <text class="tracking-branch-desc" x="280" y="166">fetch and pull move it. Nothing</text>
    <text class="tracking-branch-desc" x="280" y="182">else does — not even time.</text>
    <text class="tracking-branch-edge" x="280" y="242">on fetch</text>
  </g>
  <line class="tracking-branch-line tracking-branch-conn tracking-branch-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tracking-branch-tip)"/>
  <g class="tracking-branch-stage tracking-branch-s2">
    <rect class="tracking-branch-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-branch-step" x="516" y="142">03</text>
    <text class="tracking-branch-name" x="542" y="142">You never commit to it</text>
    <text class="tracking-branch-desc" x="516" y="166">Git moves it for you. It is a</text>
    <text class="tracking-branch-desc" x="516" y="182">record, not a workspace.</text>
    <text class="tracking-branch-edge" x="516" y="242">read-only</text>
  </g>
  <line class="tracking-branch-line tracking-branch-conn tracking-branch-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tracking-branch-tip)"/>
  <g class="tracking-branch-stage tracking-branch-s3">
    <rect class="tracking-branch-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-branch-step" x="752" y="142">04</text>
    <text class="tracking-branch-name" x="778" y="142">So it goes stale</text>
    <text class="tracking-branch-desc" x="752" y="166">The moment anyone else pushes.</text>
    <text class="tracking-branch-desc" x="752" y="182">Fetch is how you find out.</text>
    <text class="tracking-branch-edge" x="752" y="242">stale</text>
  </g>
  <text class="tracking-branch-sub" x="30" y="304">This is why git status can say "up to date" while the remote has moved on: it is comparing against your note, and your note has not been refreshed.</text>
</svg>
