<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>The four remote operations — clone, fetch, pull, and push — and what data each one moves between the remote and your local repository</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Four remote operations: what each one moves</text>

  <!-- Column headers -->
  <text x="150" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Remote (origin)</text>
  <text x="610" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Your local repo</text>
  <line x1="150" y1="82" x2="150" y2="440" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="610" y1="82" x2="610" y2="440" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- clone -->
  <rect x="40" y="95" width="680" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="90" y="122" font-size="15" font-weight="bold" fill="#1a202c">clone</text>
  <text x="90" y="145" font-size="13" fill="#1a202c">first-time full copy</text>
  <line x1="150" y1="135" x2="600" y2="135" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="610,135 596,128 596,142" fill="#1d4ed8"/>
  <text x="380" y="128" text-anchor="middle" font-size="13" fill="#1a202c">copies the entire history and sets up "origin"</text>

  <!-- fetch -->
  <rect x="40" y="175" width="680" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="90" y="202" font-size="15" font-weight="bold" fill="#1a202c">fetch</text>
  <text x="90" y="225" font-size="13" fill="#1a202c">download only</text>
  <line x1="150" y1="215" x2="600" y2="215" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="610,215 596,208 596,222" fill="#1d4ed8"/>
  <text x="380" y="208" text-anchor="middle" font-size="13" fill="#1a202c">updates origin/main; your own branch is untouched</text>

  <!-- pull -->
  <rect x="40" y="255" width="680" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="90" y="282" font-size="15" font-weight="bold" fill="#1a202c">pull</text>
  <text x="90" y="305" font-size="13" fill="#1a202c">download + merge</text>
  <line x1="150" y1="295" x2="600" y2="295" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="610,295 596,288 596,302" fill="#1d4ed8"/>
  <text x="380" y="288" text-anchor="middle" font-size="13" fill="#1a202c">fetch, then merge the new commits into your branch</text>

  <!-- push -->
  <rect x="40" y="335" width="680" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="90" y="362" font-size="15" font-weight="bold" fill="#1a202c">push</text>
  <text x="90" y="385" font-size="13" fill="#1a202c">upload</text>
  <line x1="600" y1="375" x2="160" y2="375" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="150,375 164,368 164,382" fill="#1d4ed8"/>
  <text x="380" y="368" text-anchor="middle" font-size="13" fill="#1a202c">sends your commits up so others can see them</text>

  <!-- footer -->
  <rect x="40" y="418" width="680" height="34" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="8"/>
  <text x="380" y="440" text-anchor="middle" font-size="14" fill="#1a202c">Blue arrows show direction of data flow. Only push and pull change working branches.</text>
</svg>
