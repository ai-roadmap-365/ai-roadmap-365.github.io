<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Confusing fetch and pull is the source of most surprising merges.">
  <title>Four commands, and which direction each moves</title>
  <style>
    .clone-fetch-pull-push-bg   { fill: #f8fafc; }
    .clone-fetch-pull-push-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clone-fetch-pull-push-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clone-fetch-pull-push-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clone-fetch-pull-push-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clone-fetch-pull-push-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clone-fetch-pull-push-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clone-fetch-pull-push-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .clone-fetch-pull-push-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .clone-fetch-pull-push-tok { animation: clone-fetch-pull-push-travel 7s ease-in-out infinite; }
    }
    @keyframes clone-fetch-pull-push-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--clone-fetch-pull-push-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .clone-fetch-pull-push-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="clone-fetch-pull-push-bg" width="980" height="334"/>
  <text class="clone-fetch-pull-push-h1"  x="30" y="40">Four commands, and which direction each moves</text>
  <text class="clone-fetch-pull-push-sub" x="30" y="64">Confusing fetch and pull is the source of most surprising merges.</text>
  <rect class="clone-fetch-pull-push-box" x="30" y="132" width="213" height="96" rx="9"/>
  <text class="clone-fetch-pull-push-name" x="44" y="160">clone</text>
  <text class="clone-fetch-pull-push-desc" x="44" y="182">Copy the whole repository and</text>
  <text class="clone-fetch-pull-push-desc" x="44" y="198">its full history, once.</text>
  <text class="clone-fetch-pull-push-edge" x="44" y="248">remote to you</text>
  <line class="clone-fetch-pull-push-line" x1="246" y1="180" x2="262" y2="180"/>
  <rect class="clone-fetch-pull-push-hi" x="265" y="132" width="213" height="96" rx="9"/>
  <text class="clone-fetch-pull-push-name" x="279" y="160">fetch</text>
  <text class="clone-fetch-pull-push-desc" x="279" y="182">Download new commits. Changes</text>
  <text class="clone-fetch-pull-push-desc" x="279" y="198">nothing you are working on.</text>
  <text class="clone-fetch-pull-push-edge" x="279" y="248">safe, always</text>
  <line class="clone-fetch-pull-push-line" x1="481" y1="180" x2="497" y2="180"/>
  <rect class="clone-fetch-pull-push-box" x="500" y="132" width="213" height="96" rx="9"/>
  <text class="clone-fetch-pull-push-name" x="514" y="160">pull</text>
  <text class="clone-fetch-pull-push-desc" x="514" y="182">fetch, then merge into your</text>
  <text class="clone-fetch-pull-push-desc" x="514" y="198">current branch.</text>
  <text class="clone-fetch-pull-push-edge" x="514" y="248">can conflict</text>
  <line class="clone-fetch-pull-push-line" x1="716" y1="180" x2="732" y2="180"/>
  <rect class="clone-fetch-pull-push-box" x="735" y="132" width="213" height="96" rx="9"/>
  <text class="clone-fetch-pull-push-name" x="749" y="160">push</text>
  <text class="clone-fetch-pull-push-desc" x="749" y="182">Send your commits up, if the</text>
  <text class="clone-fetch-pull-push-desc" x="749" y="198">remote has not moved on.</text>
  <text class="clone-fetch-pull-push-edge" x="749" y="248">you to remote</text>
  <rect class="clone-fetch-pull-push-tok" x="34" y="106" width="58" height="14" rx="3" style="--clone-fetch-pull-push-run: 705px"/>
  <text class="clone-fetch-pull-push-sub" x="30" y="314">fetch is always safe because it only updates tracking branches. pull is fetch plus a merge you did not separately ask for.</text>
</svg>
