<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Moving commits, and integrating them.">
  <title>Two different jobs, constantly confused</title>
  <style>
    .move-versus-integrate-bg   { fill: #f8fafc; }
    .move-versus-integrate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .move-versus-integrate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .move-versus-integrate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .move-versus-integrate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .move-versus-integrate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .move-versus-integrate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .move-versus-integrate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .move-versus-integrate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .move-versus-integrate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .move-versus-integrate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .move-versus-integrate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .move-versus-integrate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .move-versus-integrate-row { opacity: 1; }
    .move-versus-integrate-r0 { animation-delay: 0.00s; }
    .move-versus-integrate-r1 { animation-delay: 0.45s; }
    .move-versus-integrate-r2 { animation-delay: 0.90s; }
    .move-versus-integrate-r3 { animation-delay: 1.35s; }
    .move-versus-integrate-r4 { animation-delay: 1.80s; }
    .move-versus-integrate-row { animation: move-versus-integrate-reveal 7.3s ease-in-out infinite; }
    @keyframes move-versus-integrate-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="move-versus-integrate-bg" width="980" height="390"/>
  <text class="move-versus-integrate-h1"  x="30" y="40">Two different jobs, constantly confused</text>
  <text class="move-versus-integrate-sub" x="30" y="64">Moving commits, and integrating them.</text>
  <rect class="move-versus-integrate-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="move-versus-integrate-name" x="46" y="122">Move between repositories</text>
  <text class="move-versus-integrate-desc" x="46" y="142">fetch and push.</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r0" x="46" y="182">Commits cross the network</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r1" x="46" y="216">Your working files do not change</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r2" x="46" y="250">Your branch does not move</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r3" x="46" y="284">Tracking branches are updated</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r4" x="46" y="318">Always safe to run</text>
  <rect class="move-versus-integrate-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="move-versus-integrate-name" x="526" y="122">Integrate into a branch</text>
  <text class="move-versus-integrate-desc" x="526" y="142">merge — and pull, which does both.</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r0" x="526" y="182">No network involved for merge</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r1" x="526" y="216">Your working files DO change</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r2" x="526" y="250">Your branch advances</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r3" x="526" y="284">Can produce a merge commit</text>
  <text class="move-versus-integrate-desc move-versus-integrate-row move-versus-integrate-r4" x="526" y="318">Can produce a conflict</text>
  <text class="move-versus-integrate-sub" x="30" y="372">Every confusing Git-remote moment resolves once you ask which of these two is happening. pull is the one that does both at once, which is exactly why it surprises people.</text>
</svg>
