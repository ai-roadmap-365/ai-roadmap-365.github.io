visuals:
  - id: ports-and-sockets
    file: assets/ports-and-sockets.svg
    type: diagram
    title: 'Ports and sockets on one host'
    alt: 'Diagram: one host running multiple services on different ports, with a socket shown as a host and port pair'
    description: 'One host with a single IP address running several services, each listening on its own port (22 SSH, 443 HTTPS, 5432 PostgreSQL, 8000 dev server), with a callout showing that a socket is the IP address and port together, such as 198.51.100.20:443.'
  - id: tcp-handshake
    file: assets/tcp-handshake.svg
    type: flowchart
    title: 'The TCP three-way handshake'
    alt: 'Flowchart: the TCP three-way handshake between a client and a server'
    description: 'A sequence between a client and a listening server: the client sends SYN with a start number, the server replies SYN-ACK acknowledging it and sending its own start number, the client sends ACK, and the connection becomes established so reliable ordered data can flow.'
  - id: tcp-versus-udp
    file: assets/tcp-versus-udp.svg
    type: diagram
    title: 'Two transports, two different promises'
    alt: 'Diagram: what TCP guarantees compared with what UDP gives up'
    description: 'A two-column comparison of TCP and UDP, listing what each guarantees, what it costs, and the kind of application each suits.'
  - id: address-port-program
    file: assets/address-port-program.svg
    type: diagram
    title: 'Three numbers to reach one program'
    alt: 'Diagram: how an address, a port and a socket narrow delivery to one program'
    description: 'A three-stage narrowing from an IP address identifying a machine, through a port identifying a program on it, to a socket as the bound endpoint the kernel delivers to.'
  - id: port-ranges
    file: assets/port-ranges.svg
    type: diagram
    title: 'Why your server needs sudo and your browser does not'
    alt: 'Diagram: well-known ports compared with ephemeral ports'
    description: 'A two-column comparison of well-known low-numbered ports against high-numbered ephemeral ports, covering who assigns them, which side of a connection uses them, and the privileges required.'
  - id: refused-versus-dropped
    file: assets/refused-versus-dropped.svg
    type: diagram
    title: 'Refused and hung are different diagnoses'
    alt: 'Diagram: a refused connection compared with one that hangs'
    description: 'A two-column comparison of a connection refused error against a connection that hangs, explaining that a refusal is an active reply from a reachable host while a hang means packets are being dropped.'
  - id: bind-address-choice
    file: assets/bind-address-choice.svg
    type: diagram
    title: 'The one line that decides who can reach your service'
    alt: 'Diagram: binding to loopback compared with binding to all interfaces'
    description: 'A two-column comparison of binding a service to the loopback address against binding to all interfaces, covering who can connect and the security consequence of each choice.'
  - id: tcp-guarantees
    file: assets/tcp-guarantees.svg
    type: diagram
    title: 'What you get for the handshake'
    alt: 'Diagram: the four guarantees TCP provides'
    description: 'A four-stage sequence through TCP''s guarantees of reliability, ordering, flow control and congestion control, naming the cost of each.'
  - id: quic-rebuild
    file: assets/quic-rebuild.svg
    type: diagram
    title: 'Why QUIC was built on UDP'
    alt: 'Diagram: how QUIC rebuilds reliability on top of UDP'
    description: 'A four-stage explanation of QUIC''s design, starting from UDP''s minimal datagrams and adding reliability, encryption and multiplexing in user space rather than in the kernel.'
  - id: connection-four-tuple
    file: assets/connection-four-tuple.svg
    type: diagram
    title: 'How one port holds ten thousand connections'
    alt: 'Diagram: how the four-tuple distinguishes simultaneous connections to one port'
    description: 'A four-stage explanation of connection identity showing that each connection is distinguished by the combination of source address, source port, destination address and destination port, so many clients can share one server port.'
  - id: port-already-in-use
    file: assets/port-already-in-use.svg
    type: diagram
    title: 'Diagnosing "address already in use"'
    alt: 'Diagram: the steps to diagnose a port already in use'
    description: 'A four-stage diagnostic procedure for a port conflict: identifying the holding process, checking for a stale TIME_WAIT state, checking which address was bound, and choosing a different port.'
