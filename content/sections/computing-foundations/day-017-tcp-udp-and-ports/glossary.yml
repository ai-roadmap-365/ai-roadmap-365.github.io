terms:
  - term: port
    definition: 'A number from 0 to 65535 in a packet header that identifies which service or program on a host the data is for.'
  - term: TCP
    definition: 'Transmission Control Protocol: a connection-oriented transport that guarantees data arrives complete, in order, by numbering bytes, acknowledging them, and retransmitting anything lost.'
  - term: UDP
    definition: 'User Datagram Protocol: a connectionless, best-effort transport that sends packets with no handshake, ordering, or delivery guarantee — fast and low-overhead.'
  - term: socket
    definition: 'One endpoint of a network connection, identified by an IP address and a port together (written host:port).'
  - term: three-way handshake
    definition: 'The SYN, SYN-ACK, ACK exchange TCP performs before sending data, so both sides confirm they are ready and agree on starting sequence numbers.'
  - term: packet
    definition: 'A small, individually addressed unit of data sent across a network; TCP and UDP wrap application data into packets carrying source and destination ports.'
  - term: ephemeral port
    definition: 'A temporary high-numbered port (49152–65535) the operating system assigns to a client program for the outgoing side of a connection.'
  - term: well-known port
    definition: 'A port in the range 0–1023 reserved for a standard service, such as 22 for SSH, 53 for DNS, 80 for HTTP, and 443 for HTTPS.'
  - term: connection-oriented
    definition: 'Describing a protocol like TCP that establishes a connection (via a handshake) before exchanging data, and maintains state for it; UDP, by contrast, is connectionless.'
  - term: QUIC
    definition: 'A modern transport protocol (RFC 9000, 2021) that provides TCP-like reliability on top of UDP with fewer setup round-trips, and is the foundation of HTTP/3.'
  - term: listening
    definition: 'The state of a server socket that has claimed a port and is waiting for incoming connections addressed to it.'
  - term: connection refused
    definition: 'The error returned when a host is reached but no program is listening on the requested port, so the connection cannot be completed.'
  - term: flow control
    definition: 'A TCP mechanism where the receiver advertises how much data it can accept, so a fast sender does not overwhelm a slow receiver.'
  - term: congestion control
    definition: 'A TCP mechanism that slows sending when the network shows signs of overload (lost packets or delay) and cautiously speeds back up, sharing capacity fairly.'
