<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them is an answer. The other is silence.">
  <title>Refused and hung are different diagnoses</title>
  <style>
    .refused-versus-dropped-bg   { fill: #f8fafc; }
    .refused-versus-dropped-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refused-versus-dropped-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refused-versus-dropped-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refused-versus-dropped-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refused-versus-dropped-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refused-versus-dropped-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .refused-versus-dropped-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .refused-versus-dropped-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .refused-versus-dropped-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .refused-versus-dropped-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .refused-versus-dropped-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .refused-versus-dropped-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .refused-versus-dropped-row { opacity: 1; }
    .refused-versus-dropped-r0 { animation-delay: 0.00s; }
    .refused-versus-dropped-r1 { animation-delay: 0.45s; }
    .refused-versus-dropped-r2 { animation-delay: 0.90s; }
    .refused-versus-dropped-r3 { animation-delay: 1.35s; }
    .refused-versus-dropped-r4 { animation-delay: 1.80s; }
    .refused-versus-dropped-row { animation: refused-versus-dropped-reveal 7.3s ease-in-out infinite; }
    @keyframes refused-versus-dropped-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="refused-versus-dropped-bg" width="980" height="390"/>
  <text class="refused-versus-dropped-h1"  x="30" y="40">Refused and hung are different diagnoses</text>
  <text class="refused-versus-dropped-sub" x="30" y="64">One of them is an answer. The other is silence.</text>
  <rect class="refused-versus-dropped-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="refused-versus-dropped-name" x="46" y="122">Connection refused</text>
  <text class="refused-versus-dropped-desc" x="46" y="142">The host answered.</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r0" x="46" y="182">The machine is reachable</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r1" x="46" y="216">Nothing is listening on that port</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r2" x="46" y="250">You get an immediate, useful error</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r3" x="46" y="284">Usually: the service is not running</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r4" x="46" y="318">Or it bound to a different address</text>
  <rect class="refused-versus-dropped-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="refused-versus-dropped-name" x="526" y="122">It just hangs</text>
  <text class="refused-versus-dropped-desc" x="526" y="142">Nothing answered at all.</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r0" x="526" y="182">Packets are being silently dropped</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r1" x="526" y="216">Typically a firewall configured to DROP</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r2" x="526" y="250">You wait for a timeout, learning nothing</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r3" x="526" y="284">Deliberate: a scanner is told nothing</text>
  <text class="refused-versus-dropped-desc refused-versus-dropped-row refused-versus-dropped-r4" x="526" y="318">Or the host genuinely does not exist</text>
  <text class="refused-versus-dropped-sub" x="30" y="372">Firewalls drop rather than reject precisely so that an attacker cannot distinguish "filtered" from "nothing here". The cost is that you cannot either.</text>
</svg>
