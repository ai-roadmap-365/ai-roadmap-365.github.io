<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Neither is better. They give up different things.">
  <title>Two transports, two different promises</title>
  <style>
    .tcp-versus-udp-bg   { fill: #f8fafc; }
    .tcp-versus-udp-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-versus-udp-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-versus-udp-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-versus-udp-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-versus-udp-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-versus-udp-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tcp-versus-udp-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tcp-versus-udp-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tcp-versus-udp-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tcp-versus-udp-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tcp-versus-udp-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="tcp-versus-udp-bg" width="980" height="390"/>
  <text class="tcp-versus-udp-h1"  x="30" y="40">Two transports, two different promises</text>
  <text class="tcp-versus-udp-sub" x="30" y="64">Neither is better. They give up different things.</text>
  <rect class="tcp-versus-udp-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tcp-versus-udp-name" x="46" y="122">TCP</text>
  <text class="tcp-versus-udp-desc" x="46" y="142">Ordered, complete, acknowledged</text>
  <text class="tcp-versus-udp-desc" x="46" y="182">Retransmits anything lost</text>
  <text class="tcp-versus-udp-desc" x="46" y="216">Delivers bytes in the order sent</text>
  <text class="tcp-versus-udp-desc" x="46" y="250">Costs a handshake before any data flows</text>
  <text class="tcp-versus-udp-desc" x="46" y="284">Slows itself down when the path congests</text>
  <text class="tcp-versus-udp-desc" x="46" y="318">Suits: web pages, APIs, model responses</text>
  <rect class="tcp-versus-udp-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tcp-versus-udp-name" x="526" y="122">UDP</text>
  <text class="tcp-versus-udp-desc" x="526" y="142">Fire and forget</text>
  <text class="tcp-versus-udp-desc" x="526" y="182">Lost packets stay lost</text>
  <text class="tcp-versus-udp-desc" x="526" y="216">Arrival order is not promised</text>
  <text class="tcp-versus-udp-desc" x="526" y="250">No handshake — the first packet carries data</text>
  <text class="tcp-versus-udp-desc" x="526" y="284">Sends as fast as you ask it to</text>
  <text class="tcp-versus-udp-desc" x="526" y="318">Suits: live audio and video, games, DNS queries</text>
  <text class="tcp-versus-udp-sub" x="30" y="372">A dropped frame in a call is better than a call that pauses to recover it. That single trade explains the whole table.</text>
</svg>
