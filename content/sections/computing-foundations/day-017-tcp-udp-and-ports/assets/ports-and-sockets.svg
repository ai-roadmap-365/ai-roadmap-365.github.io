<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" font-family="system-ui, sans-serif">
  <title>One host running several services on different ports, and a socket shown as an IP address and port pair</title>
  <rect x="0" y="0" width="720" height="500" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Ports and sockets on one host</text>

  <!-- The host container -->
  <rect x="60" y="60" width="600" height="260" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="80" y="90" font-size="16" font-weight="bold" fill="#1a202c">One host</text>
  <text x="80" y="112" font-size="15" fill="#1a202c">IP address 198.51.100.20</text>
  <text x="640" y="90" text-anchor="end" font-size="14" fill="#1a202c">one machine, many services</text>

  <!-- Service boxes, each on a different port -->
  <rect x="90" y="140" width="130" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="155" y="170" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">:22</text>
  <text x="155" y="196" text-anchor="middle" font-size="15" fill="#1a202c">SSH</text>
  <text x="155" y="216" text-anchor="middle" font-size="13" fill="#1a202c">remote login</text>

  <rect x="240" y="140" width="130" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="305" y="170" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">:443</text>
  <text x="305" y="196" text-anchor="middle" font-size="15" fill="#1a202c">HTTPS</text>
  <text x="305" y="216" text-anchor="middle" font-size="13" fill="#1a202c">secure web</text>

  <rect x="390" y="140" width="130" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="455" y="170" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">:5432</text>
  <text x="455" y="196" text-anchor="middle" font-size="15" fill="#1a202c">PostgreSQL</text>
  <text x="455" y="216" text-anchor="middle" font-size="13" fill="#1a202c">database</text>

  <rect x="540" y="140" width="90" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="585" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4ed8">:8000</text>
  <text x="585" y="196" text-anchor="middle" font-size="15" fill="#1a202c">dev</text>
  <text x="585" y="214" text-anchor="middle" font-size="13" fill="#1a202c">server</text>

  <text x="360" y="266" text-anchor="middle" font-size="13" fill="#1a202c">Each service "listens" on its own port number, so one IP address serves many programs at once.</text>

  <!-- Socket callout -->
  <rect x="180" y="360" width="360" height="90" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="360" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">A socket = IP address + port</text>
  <text x="360" y="416" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d4ed8">198.51.100.20 : 443</text>
  <text x="360" y="438" text-anchor="middle" font-size="13" fill="#1a202c">the full address of one endpoint of a connection</text>

  <!-- Arrow from the HTTPS box to the socket callout -->
  <line x1="305" y1="290" x2="330" y2="352" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="333,360 320,349 331,344" fill="#1d4ed8"/>
</svg>
