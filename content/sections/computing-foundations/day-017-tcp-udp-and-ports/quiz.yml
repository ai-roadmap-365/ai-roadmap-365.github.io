questions:
  - question: 'What does a port number identify?'
    options:
      - 'A physical socket on the back of the computer'
      - 'A specific service on a host, so one machine can run many'
      - 'The physical route a packet takes across the Internet'
      - 'The encryption key used to secure a connection'
    answer_index: 1
    explanation: 'An IP address gets data to the right host; a port (0–65535) gets it to the right program on that host, which is how a single machine can run a web server, a database, and a login service at the same time.'

  - question: 'Which three messages make up the TCP three-way handshake, in order?'
    options:
      - 'ACK, SYN, SYN-ACK'
      - 'SYN, ACK, SYN-ACK'
      - 'SYN, SYN-ACK, ACK'
      - 'PING, PONG, ACK'
    answer_index: 2
    explanation: 'The client sends SYN ("can we talk, I start at x"), the server replies SYN-ACK ("yes, got x, I start at y"), and the client sends ACK ("got y, let''s go"), after which the connection is established.'

  - question: 'Which of these is a guarantee TCP provides but UDP does not?'
    options:
      - 'Encryption of the data payload end to end'
      - 'Faster delivery with no connection setup cost'
      - 'Hiding which IP addresses are communicating'
      - 'Retransmission of lost packets, so data arrives in order'
    answer_index: 3
    explanation: 'TCP numbers every byte, acknowledges what arrives, and retransmits what is lost, delivering data reliably and in order. UDP does none of this. Neither protocol encrypts data — that is TLS''s job.'

  - question: 'Why is UDP a good fit for DNS lookups and live video?'
    options:
      - 'It is connectionless and low-overhead, and they tolerate loss'
      - 'Because it guarantees every packet arrives in order'
      - 'Because it encrypts each packet automatically'
      - 'Because it uses well-known ports below 1024'
    answer_index: 0
    explanation: 'UDP skips the handshake and reliability machinery, so it is fast and lightweight. A DNS query is one small question retried by the application if needed, and a lost video frame is stale by the time it could be resent — so the guarantees TCP adds would be pure cost.'

  - question: 'What is a socket?'
    options:
      - 'A synonym for a port number'
      - 'An IP address and port together'
      - 'The physical cable connecting two computers'
      - 'A firewall rule that blocks a port'
    answer_index: 1
    explanation: 'A socket is an IP-address-and-port pair (written host:port). A full connection is described by a four-tuple: source IP, source port, destination IP, destination port.'

  - question: 'Which port range is reserved for well-known (system) services such as HTTPS on 443 and SSH on 22?'
    options:
      - '49152 – 65535'
      - '1024 – 49151'
      - '0 – 1023'
      - '8000 – 9000'
    answer_index: 2
    explanation: 'Ports 0–1023 are the well-known range for standard services. 1024–49151 are registered ports, and 49152–65535 are ephemeral ports the OS assigns temporarily to client programs.'

  - question: 'You start a local server, point a client at it, and see "connection refused." What does that most precisely mean?'
    options:
      - 'The Internet connection is down'
      - 'The server requires a password that you did not provide'
      - 'The data was corrupted in transit'
      - 'The host was reached, but nothing is listening there'
    answer_index: 3
    explanation: '"Connection refused" means the network reached the host successfully and the host actively reported that no program is listening on the requested port — often a service that failed to start or is on a different port.'

  - question: 'How does QUIC relate to TCP and UDP?'
    options:
      - 'A reliable transport built on UDP that underpins HTTP/3'
      - 'It replaces IP addresses with human-readable names'
      - 'It is an older protocol that TCP replaced'
      - 'It is a firewall that blocks unused ports'
    answer_index: 0
    explanation: 'QUIC (standardized as RFC 9000 in 2021) provides TCP-like reliability but runs over UDP, folding connection and encryption setup together to start sending data with fewer round-trips. It is the foundation of HTTP/3.'
