<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="Which is why error handling is a stage, not an afterthought.">
  <title>Each stage fails in its own way</title>
  <style>
    .failure-per-stage-bg   { fill: #f8fafc; }
    .failure-per-stage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-per-stage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-per-stage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-per-stage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-per-stage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failure-per-stage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .failure-per-stage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .failure-per-stage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .failure-per-stage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .failure-per-stage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .failure-per-stage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .failure-per-stage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .failure-per-stage-row { opacity: 1; }
    .failure-per-stage-r0 { animation-delay: 0.00s; }
    .failure-per-stage-r1 { animation-delay: 0.45s; }
    .failure-per-stage-r2 { animation-delay: 0.90s; }
    .failure-per-stage-r3 { animation-delay: 1.35s; }
    .failure-per-stage-r4 { animation-delay: 1.80s; }
    .failure-per-stage-r5 { animation-delay: 2.25s; }
    .failure-per-stage-row { animation: failure-per-stage-reveal 7.7s ease-in-out infinite; }
    @keyframes failure-per-stage-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="failure-per-stage-bg" width="980" height="424"/>
  <text class="failure-per-stage-h1"  x="30" y="40">Each stage fails in its own way</text>
  <text class="failure-per-stage-sub" x="30" y="64">Which is why error handling is a stage, not an afterthought.</text>
  <rect class="failure-per-stage-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="failure-per-stage-name" x="46" y="122">How it fails</text>
  <text class="failure-per-stage-desc" x="46" y="142">One per stage.</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r0" x="46" y="182">Wrong endpoint — 404</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r1" x="46" y="216">Wrong parameter — 400, or silently wrong data</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r2" x="46" y="250">Network down — no response at all</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r3" x="46" y="284">Error page instead of JSON — parse error</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r4" x="46" y="318">jq path wrong — null</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r5" x="46" y="352">Value has a space — shell splits it</text>
  <rect class="failure-per-stage-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="failure-per-stage-name" x="526" y="122">What catches it</text>
  <text class="failure-per-stage-desc" x="526" y="142">All cheap.</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r0" x="526" y="182">curl -f, so a bad status exits non-zero</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r1" x="526" y="216">Read the error body; it usually names the field</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r2" x="526" y="250">--max-time, so a hang becomes a failure</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r3" x="526" y="284">Check the status BEFORE parsing</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r4" x="526" y="318">Pretty-print and read the real nesting</text>
  <text class="failure-per-stage-desc failure-per-stage-row failure-per-stage-r5" x="526" y="352">Quote every expansion</text>
  <text class="failure-per-stage-sub" x="30" y="406">A pipeline with none of these still works, right up until the first thing goes wrong — and then it produces confident nonsense rather than an error, which is worse.</text>
</svg>
