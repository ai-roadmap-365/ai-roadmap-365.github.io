<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Calling a language model is this, with a different URL and body.">
  <title>Every API call you will ever write</title>
  <style>
    .one-call-anatomy-bg   { fill: #f8fafc; }
    .one-call-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-call-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-call-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-call-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-call-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-call-anatomy-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .one-call-anatomy-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .one-call-anatomy-tok { animation: one-call-anatomy-travel 7s ease-in-out infinite; }
    }
    @keyframes one-call-anatomy-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--one-call-anatomy-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .one-call-anatomy-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="one-call-anatomy-bg" width="980" height="334"/>
  <text class="one-call-anatomy-h1"  x="30" y="40">Every API call you will ever write</text>
  <text class="one-call-anatomy-sub" x="30" y="64">Calling a language model is this, with a different URL and body.</text>
  <rect class="one-call-anatomy-box" x="30" y="132" width="166" height="96" rx="9"/>
  <text class="one-call-anatomy-name" x="44" y="160">Build the URL</text>
  <text class="one-call-anatomy-desc" x="44" y="182">Base, path and query</text>
  <text class="one-call-anatomy-desc" x="44" y="198">parameters, properly</text>
  <text class="one-call-anatomy-desc" x="44" y="214">encoded.</text>
  <text class="one-call-anatomy-edge" x="44" y="248">quote it</text>
  <line class="one-call-anatomy-line" x1="199" y1="180" x2="215" y2="180"/>
  <rect class="one-call-anatomy-box" x="218" y="132" width="166" height="96" rx="9"/>
  <text class="one-call-anatomy-name" x="232" y="160">Send</text>
  <text class="one-call-anatomy-desc" x="232" y="182">Method, headers, and a</text>
  <text class="one-call-anatomy-desc" x="232" y="198">body if there is one.</text>
  <text class="one-call-anatomy-edge" x="232" y="248">curl or a client</text>
  <line class="one-call-anatomy-line" x1="387" y1="180" x2="403" y2="180"/>
  <rect class="one-call-anatomy-hi" x="406" y="132" width="166" height="96" rx="9"/>
  <text class="one-call-anatomy-name" x="420" y="160">Check status</text>
  <text class="one-call-anatomy-desc" x="420" y="182">200 before you parse</text>
  <text class="one-call-anatomy-desc" x="420" y="198">anything at all.</text>
  <text class="one-call-anatomy-edge" x="420" y="248">skip this and you parse an error</text>
  <line class="one-call-anatomy-line" x1="575" y1="180" x2="591" y2="180"/>
  <rect class="one-call-anatomy-box" x="594" y="132" width="166" height="96" rx="9"/>
  <text class="one-call-anatomy-name" x="608" y="160">Parse</text>
  <text class="one-call-anatomy-desc" x="608" y="182">Turn the JSON text into</text>
  <text class="one-call-anatomy-desc" x="608" y="198">data structures.</text>
  <text class="one-call-anatomy-edge" x="608" y="248">jq or json.loads</text>
  <line class="one-call-anatomy-line" x1="763" y1="180" x2="779" y2="180"/>
  <rect class="one-call-anatomy-box" x="782" y="132" width="166" height="96" rx="9"/>
  <text class="one-call-anatomy-name" x="796" y="160">Extract</text>
  <text class="one-call-anatomy-desc" x="796" y="182">Lift out the one field</text>
  <text class="one-call-anatomy-desc" x="796" y="198">you actually wanted.</text>
  <text class="one-call-anatomy-edge" x="796" y="248">current.temperature_2m</text>
  <rect class="one-call-anatomy-tok" x="34" y="106" width="58" height="14" rx="3" style="--one-call-anatomy-run: 752px"/>
  <text class="one-call-anatomy-sub" x="30" y="314">An unquoted &amp; in a shell URL means 'run in the background', so only the first parameter ever reaches the server.</text>
</svg>
