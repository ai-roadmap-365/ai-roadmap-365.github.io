<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Calling a language model is this, with a different URL and body.">
  <title>Every API call you will ever write</title>
  <style>
    .one-call-anatomy-bg   { fill: #f8fafc; }
    .one-call-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-call-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-call-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-call-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-call-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-call-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-call-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-call-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .one-call-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .one-call-anatomy-stage { opacity: 1; }

    .one-call-anatomy-s0 { animation-delay: 0.00s; }
    .one-call-anatomy-e0 { animation-delay: 0.00s; }
    .one-call-anatomy-s1 { animation-delay: 1.33s; }
    .one-call-anatomy-e1 { animation-delay: 1.33s; }
    .one-call-anatomy-s2 { animation-delay: 2.67s; }
    .one-call-anatomy-e2 { animation-delay: 2.67s; }
    .one-call-anatomy-s3 { animation-delay: 4.00s; }
    .one-call-anatomy-e3 { animation-delay: 4.00s; }
    .one-call-anatomy-s4 { animation-delay: 5.33s; }
    .one-call-anatomy-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .one-call-anatomy-conn  { animation: one-call-anatomy-trace 8s ease-in-out infinite; }
      .one-call-anatomy-stage { animation: one-call-anatomy-arrive 8s ease-in-out infinite; }
    }
    @keyframes one-call-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes one-call-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .one-call-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .one-call-anatomy-stage { animation: one-call-anatomy-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes one-call-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="one-call-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="one-call-anatomy-bg" width="980" height="322"/>
  <text class="one-call-anatomy-h1"  x="30" y="40">Every API call you will ever write</text>
  <text class="one-call-anatomy-sub" x="30" y="64">Calling a language model is this, with a different URL and body.</text>
  <g class="one-call-anatomy-stage one-call-anatomy-s0">
    <rect class="one-call-anatomy-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="one-call-anatomy-step" x="44" y="142">01</text>
    <text class="one-call-anatomy-name" x="70" y="142">Build the URL</text>
    <text class="one-call-anatomy-desc" x="44" y="166">Base, path and query</text>
    <text class="one-call-anatomy-desc" x="44" y="182">parameters, properly</text>
    <text class="one-call-anatomy-desc" x="44" y="198">encoded.</text>
    <text class="one-call-anatomy-edge" x="44" y="242">quote it</text>
  </g>
  <line class="one-call-anatomy-line one-call-anatomy-conn one-call-anatomy-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#one-call-anatomy-tip)"/>
  <g class="one-call-anatomy-stage one-call-anatomy-s1">
    <rect class="one-call-anatomy-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="one-call-anatomy-step" x="233" y="142">02</text>
    <text class="one-call-anatomy-name" x="259" y="142">Send</text>
    <text class="one-call-anatomy-desc" x="233" y="166">Method, headers, and a</text>
    <text class="one-call-anatomy-desc" x="233" y="182">body if there is one.</text>
    <text class="one-call-anatomy-edge" x="233" y="242">curl or a client</text>
  </g>
  <line class="one-call-anatomy-line one-call-anatomy-conn one-call-anatomy-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#one-call-anatomy-tip)"/>
  <g class="one-call-anatomy-stage one-call-anatomy-s2">
    <rect class="one-call-anatomy-hi" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="one-call-anatomy-step" x="422" y="142">03</text>
    <text class="one-call-anatomy-name" x="448" y="142">Check status</text>
    <text class="one-call-anatomy-desc" x="422" y="166">200 before you parse</text>
    <text class="one-call-anatomy-desc" x="422" y="182">anything at all.</text>
    <text class="one-call-anatomy-edge" x="422" y="242">skip this and you parse an error</text>
  </g>
  <line class="one-call-anatomy-line one-call-anatomy-conn one-call-anatomy-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#one-call-anatomy-tip)"/>
  <g class="one-call-anatomy-stage one-call-anatomy-s3">
    <rect class="one-call-anatomy-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="one-call-anatomy-step" x="611" y="142">04</text>
    <text class="one-call-anatomy-name" x="637" y="142">Parse</text>
    <text class="one-call-anatomy-desc" x="611" y="166">Turn the JSON text into</text>
    <text class="one-call-anatomy-desc" x="611" y="182">data structures.</text>
    <text class="one-call-anatomy-edge" x="611" y="242">jq or json.loads</text>
  </g>
  <line class="one-call-anatomy-line one-call-anatomy-conn one-call-anatomy-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#one-call-anatomy-tip)"/>
  <g class="one-call-anatomy-stage one-call-anatomy-s4">
    <rect class="one-call-anatomy-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="one-call-anatomy-step" x="800" y="142">05</text>
    <text class="one-call-anatomy-name" x="826" y="142">Extract</text>
    <text class="one-call-anatomy-desc" x="800" y="166">Lift out the one field</text>
    <text class="one-call-anatomy-desc" x="800" y="182">you actually wanted.</text>
    <text class="one-call-anatomy-edge" x="800" y="242">current.temperature_2m</text>
  </g>
  <text class="one-call-anatomy-sub" x="30" y="304">An unquoted &amp; in a shell URL means 'run in the background', so only the first parameter ever reaches the server.</text>
</svg>
