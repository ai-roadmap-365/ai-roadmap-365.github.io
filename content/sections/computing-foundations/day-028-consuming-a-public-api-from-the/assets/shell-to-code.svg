<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" font-family="system-ui, sans-serif">
  <title>When a curl one-liner graduates to a script and then to a real program with an HTTP client library</title>
  <rect x="0" y="0" width="780" height="460" fill="#f8fafc"/>
  <text x="390" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">From shell one-liner to real program</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#1a202c">Start at the command line; move to code exactly when the problem outgrows one line.</text>

  <!-- Stage A: one-liner -->
  <rect x="30" y="95" width="220" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="140" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">curl one-liner</text>
  <text x="140" y="148" text-anchor="middle" font-size="13" fill="#1a202c">curl "…" | jq '.field'</text>
  <text x="140" y="176" text-anchor="middle" font-size="13" fill="#1a202c">Use for: exploring an</text>
  <text x="140" y="194" text-anchor="middle" font-size="13" fill="#1a202c">API, a one-off fetch,</text>
  <text x="140" y="212" text-anchor="middle" font-size="13" fill="#1a202c">proving the call works.</text>

  <!-- Stage B: shell script -->
  <rect x="280" y="95" width="220" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="390" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">shell script</text>
  <text x="390" y="148" text-anchor="middle" font-size="13" fill="#1a202c">weather.sh (args,</text>
  <text x="390" y="166" text-anchor="middle" font-size="13" fill="#1a202c">a default, error checks)</text>
  <text x="390" y="194" text-anchor="middle" font-size="13" fill="#1a202c">Use for: a reusable tool,</text>
  <text x="390" y="212" text-anchor="middle" font-size="13" fill="#1a202c">a scheduled fetch,</text>
  <text x="390" y="230" text-anchor="middle" font-size="13" fill="#1a202c">a handful of steps.</text>

  <!-- Stage C: real program -->
  <rect x="530" y="95" width="220" height="150" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="640" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">real program</text>
  <text x="640" y="148" text-anchor="middle" font-size="13" fill="#ffffff">requests / fetch,</text>
  <text x="640" y="166" text-anchor="middle" font-size="13" fill="#ffffff">retries, real logic</text>
  <text x="640" y="194" text-anchor="middle" font-size="13" fill="#ffffff">Use for: loops over</text>
  <text x="640" y="212" text-anchor="middle" font-size="13" fill="#ffffff">many inputs, backoff,</text>
  <text x="640" y="230" text-anchor="middle" font-size="13" fill="#ffffff">combining many calls.</text>

  <!-- Arrows -->
  <line x1="250" y1="170" x2="278" y2="170" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="500" y1="170" x2="528" y2="170" stroke="#1a202c" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Decision labels on arrows -->
  <text x="264" y="160" text-anchor="middle" font-size="12" font-style="italic" fill="#1d4ed8">reuse?</text>
  <text x="514" y="160" text-anchor="middle" font-size="12" font-style="italic" fill="#1d4ed8">logic grows?</text>

  <!-- Graduation rule box -->
  <rect x="90" y="290" width="600" height="120" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5" rx="10"/>
  <text x="390" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Graduate one step when — and only when — you hit:</text>
  <text x="390" y="344" text-anchor="middle" font-size="14" fill="#1a202c">looping over many inputs · retries and backoff · branching error handling</text>
  <text x="390" y="366" text-anchor="middle" font-size="14" fill="#1a202c">combining several calls · anything hard to read as one line</text>
  <text x="390" y="394" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">The request itself never changes — endpoint, params, headers, parse.</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/>
    </marker>
  </defs>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 250 170 L 278 170" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 500 170 L 528 170" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
