visuals:
  - id: api-client-pipeline
    file: assets/api-client-pipeline.svg
    type: flowchart
    title: 'The API client pipeline'
    alt: 'Flowchart: the six stages of an API client, from reading the docs to presenting the result'
    description: 'A six-stage flow — read the docs, build the request, send it with curl, parse the JSON, handle errors, present the result — with each stage feeding the next and a note that the same six stages apply to an AI model call.'
  - id: shell-to-code
    file: assets/shell-to-code.svg
    type: diagram
    title: 'From shell one-liner to real program'
    alt: 'Diagram: when a curl one-liner graduates to a script and then to a real program'
    description: 'A decision diagram showing a curl one-liner graduating to a shell script when the call is reused, then to a real program with an HTTP client library when the logic grows to loops, retries, and combined calls — while the request itself stays the same.'
