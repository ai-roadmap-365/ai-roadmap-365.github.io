visuals:
  - id: api-client-pipeline
    file: assets/api-client-pipeline.svg
    type: flowchart
    title: 'The API client pipeline'
    alt: 'Flowchart: the six stages of an API client, from reading the docs to presenting the result'
    description: 'A six-stage flow — read the docs, build the request, send it with curl, parse the JSON, handle errors, present the result — with each stage feeding the next and a note that the same six stages apply to an AI model call.'
  - id: shell-to-code
    file: assets/shell-to-code.svg
    type: diagram
    title: 'From shell one-liner to real program'
    alt: 'Diagram: when a curl one-liner graduates to a script and then to a real program'
    description: 'A decision diagram showing a curl one-liner graduating to a shell script when the call is reused, then to a real program with an HTTP client library when the logic grows to loops, retries, and combined calls — while the request itself stays the same.'
  - id: one-call-anatomy
    file: assets/one-call-anatomy.svg
    type: diagram
    title: 'Every API call you will ever write'
    alt: 'Diagram: the anatomy of a single API call from URL to extracted field'
    description: 'A five-stage sequence of an API call: build the URL, send the request with headers, receive JSON, check the status, and extract one field.'
  - id: four-contract-questions
    file: assets/four-contract-questions.svg
    type: diagram
    title: 'Four questions every API''s docs answer'
    alt: 'Diagram: the four questions to answer when reading API documentation'
    description: 'A four-stage checklist for reading unfamiliar API documentation covering the endpoint, the parameters, the authentication requirement and the response shape.'
  - id: one-thing-at-a-time
    file: assets/one-thing-at-a-time.svg
    type: diagram
    title: 'Run their example first'
    alt: 'Diagram: adapting a documented example compared with writing from scratch'
    description: 'A two-column comparison of copying a documented example and changing it incrementally against writing a request from scratch, covering how quickly a mistake can be located.'
  - id: status-before-parse
    file: assets/status-before-parse.svg
    type: diagram
    title: 'Check the status before you parse'
    alt: 'Diagram: why checking the HTTP status before parsing matters'
    description: 'A four-stage sequence showing an unchecked failed request producing an HTML error body that reaches the JSON parser, and the alternative of failing on the status code first.'
  - id: jq-essentials
    file: assets/jq-essentials.svg
    type: diagram
    title: 'The four bits of jq worth learning'
    alt: 'Diagram: the essential jq operations'
    description: 'A four-stage reference to the most useful jq operations: navigating a path, indexing an array, filtering with select, and producing raw output without quotes.'
  - id: three-signals-to-graduate
    file: assets/three-signals-to-graduate.svg
    type: diagram
    title: 'When the one-liner should become a program'
    alt: 'Diagram: the signals that a shell client has outgrown the shell'
    description: 'A four-stage progression from a one-line command through a script to a full program, naming the three signals that indicate the shell is no longer the right tool.'
  - id: query-string-anatomy
    file: assets/query-string-anatomy.svg
    type: diagram
    title: 'Building a query string by hand'
    alt: 'Diagram: the parts of a URL query string'
    description: 'A four-stage breakdown of query string construction covering the question mark, name-value pairs, the ampersand separator, and the shell quoting required to protect them.'
  - id: failure-per-stage
    file: assets/failure-per-stage.svg
    type: diagram
    title: 'Each stage fails in its own way'
    alt: 'Diagram: the characteristic failure of each stage of an API client'
    description: 'A two-column comparison pairing each stage of the client pipeline with its characteristic failure and the check that catches it.'
  - id: validate-the-shape
    file: assets/validate-the-shape.svg
    type: diagram
    title: 'Checking the shape before trusting it'
    alt: 'Diagram: the checks to make on an API response before using it'
    description: 'A four-stage validation procedure for an API response covering the status code, the content type, the presence of expected fields, and the plausibility of the values.'
