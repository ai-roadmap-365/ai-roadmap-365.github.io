questions:
  - question: 'In the six-stage API client pipeline, what is the correct order of the stages?'
    options:
      - 'Send, read the docs, build the request, present, parse, handle errors'
      - 'Build the request, read the docs, parse, send, present, handle errors'
      - 'Read the docs, build the request, send, parse the JSON, handle errors, present'
      - 'Parse the JSON, send, build the request, read the docs, present, handle errors'
    answer_index: 2
    explanation: 'Every client follows the same path: read the documentation, build the request from it, send it with curl, parse the JSON reply, handle whatever went wrong, and present a clean result. Each stage feeds the next.'

  - question: 'Why must you wrap an API URL in double quotes when it contains a query string like ?a=1&b=2?'
    options:
      - 'Quotes make the request run faster'
      - 'Quotes encrypt the URL before sending it'
      - 'curl cannot read a URL longer than one parameter unless it is quoted'
      - 'A bare & means background, so curl gets only the first parameter'
    answer_index: 3
    explanation: 'An unquoted & tells the shell to run the command in the background, cutting the URL off after the first parameter. Double quotes pass the whole URL, & and ? included, to curl intact.'

  - question: 'Given the response {"current": {"temperature_2m": 12.4}}, which jq path prints 12.4?'
    options:
      - "jq '.current.temperature_2m'"
      - "jq '.current'"
      - "jq '.temperature_2m'"
      - "jq 'temperature_2m.current'"
    answer_index: 0
    explanation: 'A jq path reads left to right through the nesting: enter the current object, then take its temperature_2m field. The path mirrors exactly how the field is nested in the JSON.'

  - question: 'Which statement about free public APIs is correct?'
    options:
      - 'Every public API requires an API key before you can call it'
      - 'Some public APIs need no key at all'
      - 'Free APIs never return JSON, only plain text'
      - 'You must install a special library to call any public API'
    answer_index: 1
    explanation: 'Many excellent public APIs are "no-key": Open-Meteo, Open Notify, and JSONPlaceholder all respond to an anonymous request, which is why they are ideal for learning the request-and-parse loop.'

  - question: 'What is the single most transferable skill in consuming any new API?'
    options:
      - 'Memorizing every endpoint of the service'
      - 'Writing the client in a compiled language'
      - 'Reading the docs to find endpoints and parameters'
      - 'Guessing the field names until one works'
    answer_index: 2
    explanation: 'You are never expected to memorize an API. Every API''s docs answer the same four questions — endpoint, parameters, auth, response shape — so learning to read that contract makes any new service usable in minutes.'

  - question: 'Your curl command prints nothing at all. Which is the best first thing to check?'
    options:
      - 'Reinstall curl from scratch'
      - 'Delete your parse step and hope it works'
      - 'Assume the API has permanently shut down'
      - 'Run the raw curl command alone first'
    answer_index: 3
    explanation: 'Isolate the stages: run the raw curl first. If it prints JSON, the fetch works and the problem is in your parse; if it prints nothing, the request or the network is the issue — check quoting and add --max-time to fail fast.'

  - question: 'When should a curl one-liner graduate into a real program with an HTTP client library?'
    options:
      - 'When logic grows: loops, retries, branching, or several calls'
      - 'Never — a shell one-liner can do anything a program can'
      - 'Immediately — one-liners are never appropriate for real work'
      - 'Only when the API starts requiring a key'
    answer_index: 0
    explanation: 'Start at the command line to understand an API, then move the request into code exactly when the problem outgrows a single readable line — loops, retries, real error branching, or combining calls. The request itself does not change.'

  - question: 'Why is consuming a weather API called the direct prerequisite for every AI API call in the course?'
    options:
      - 'Weather models and language models use the same training data'
      - 'Calling an AI model is the same motion with a different URL and body'
      - 'AI APIs return weather data by default'
      - 'Language models can only be reached through weather services'
    answer_index: 1
    explanation: 'A language-model call is this exact pattern: send a request to the model''s endpoint, attach a JSON body describing the prompt, add an Authorization header, and parse the JSON reply. Endpoint, parameters, headers, auth, parse — every piece is what you practice on a free weather API.'
