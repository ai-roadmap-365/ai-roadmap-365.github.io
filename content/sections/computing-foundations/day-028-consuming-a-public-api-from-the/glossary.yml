terms:
  - term: API client
    definition: 'A program — even a single command — that sends a request to a remote service and uses the response it gets back. Today you build one for weather.'
  - term: endpoint
    definition: 'The URL a request is sent to, naming the specific resource or operation you want, like an address on an envelope.'
  - term: query parameter
    definition: 'A name=value pair carried in the URL after a ?, joined by &, that specifies the details of your request (for example latitude=52.52).'
  - term: JSON parsing
    definition: 'Pulling the fields you want out of a JSON response by their path, so a larger reply becomes the one or two values your program needs.'
  - term: jq
    definition: 'A command-line tool that reads JSON structurally and extracts fields by path (for example .current.temperature_2m), the way grep extracts lines by pattern.'
  - term: curl
    definition: 'A small, ubiquitous command-line program that makes an HTTP request to a URL and prints the response — the standard way to send an API call from a terminal.'
  - term: error handling
    definition: 'Checking whether a request actually succeeded and whether the expected field was present, so a failure produces a clear message instead of garbage or a crash.'
  - term: free tier
    definition: 'A level of an API that costs nothing to use within stated limits; free public APIs like Open-Meteo make them ideal for learning without a bill.'
  - term: no-auth API
    definition: 'A public API that requires no key or token to call — anyone can send an anonymous request and get a response, as with Open-Meteo, Open Notify, and JSONPlaceholder.'
  - term: request pipeline
    definition: 'The six repeatable stages of any API client: read the docs, build the request, send it, parse the JSON, handle errors, and present the result.'
  - term: HTTP client library
    definition: 'A library inside a programming language (such as Python''s requests or JavaScript''s built-in fetch) that sends HTTP requests from code, used when a shell one-liner outgrows a single line.'
  - term: documentation
    definition: 'The reference an API publishes describing its endpoints, parameters, authentication, and response shape; reading it is the core transferable skill of consuming any API.'
  - term: rate limit
    definition: 'A cap a service places on how many requests you may send in a period; a polite client stays within it, spacing requests and honoring any Retry-After header.'
