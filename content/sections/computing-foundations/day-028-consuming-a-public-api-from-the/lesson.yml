id: D028
day: 28
slug: consuming-a-public-api-from-the
title: 'Consuming a Public API from the Command Line'
section: computing-foundations
subsection: networks-and-the-internet
week: 4
learning_promise: 'After this lesson you will be able to read an API''s documentation and build a working client from scratch — form the request, send it with curl, parse the JSON reply, handle errors and rate limits, and present the result — the exact motion every AI API call needs.'
objectives:
  - 'Read API documentation and locate the four things every request needs: endpoint, parameters, authentication, and response shape'
  - 'Build and send a request from the command line with curl, quoting the URL and setting a timeout'
  - 'Parse a JSON response for the fields you want using jq and python3, reading nested fields by path'
  - 'Handle a failed request and a missing field gracefully so a client fails with a clear message instead of garbage'
  - 'Choose an appropriate free public API to practice on, and explain when a call needs an API key and when it does not'
  - 'Decide when a curl one-liner should graduate to a shell script and then to a real program with an HTTP client library'
  - 'Explain why calling an AI model is the same request-and-parse skill, with a JSON body and an auth header added'
prerequisites:
  - 'Days 22-27 (the APIs and the Web category): what an API is, REST, JSON, authentication, webhooks, rate limits and pagination'
  - 'A terminal with curl and python3 (both preinstalled on macOS and Linux); network access to reach a free public API'
reading_time_minutes: 40
practical_time_minutes: 30
last_verified: '2026-07-12'
tags: [api, curl, json, jq, command-line, http-client, foundations]
