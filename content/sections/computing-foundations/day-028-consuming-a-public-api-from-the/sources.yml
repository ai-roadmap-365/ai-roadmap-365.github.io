sources:
  - title: 'Open-Meteo — Free Weather API'
    url: 'https://open-meteo.com/en/docs'
    publisher: 'Open-Meteo'
    accessed: '2026-07-12'
    note: 'The no-key weather API this lesson and lab build a client for; documents the forecast endpoint and its parameters.'
  - title: 'curl Documentation'
    url: 'https://curl.se/docs/'
    publisher: 'curl / Daniel Stenberg'
    accessed: '2026-07-12'
    note: 'Reference for the command-line HTTP tool used to send every request in this lesson.'
  - title: 'jq Manual'
    url: 'https://jqlang.github.io/jq/manual/'
    publisher: 'jq'
    accessed: '2026-07-12'
    note: 'Reference for the command-line JSON processor used to parse responses by path.'
  - title: 'Working with JSON'
    url: 'https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Objects/JSON'
    publisher: 'MDN Web Docs'
    accessed: '2026-07-12'
    note: 'Background on the JSON format that nearly every API responds in.'
  - title: 'JSONPlaceholder — Free fake REST API'
    url: 'https://jsonplaceholder.typicode.com/'
    publisher: 'JSONPlaceholder'
    accessed: '2026-07-12'
    note: 'A free no-key test API used to practice reading lists and indexing arrays.'
