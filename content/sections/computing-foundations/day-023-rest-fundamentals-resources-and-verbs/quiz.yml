questions:
  - question: 'What does REST stand for, and what kind of thing is it?'
    options:
      - 'Representational State Transfer — an architectural style for networked software'
      - 'Reliable Encrypted Server Transport — a security protocol'
      - 'Remote Execution of Server Tasks — a programming language'
      - 'Resource Exchange Standard Table — a data format'
    answer_index: 0
    explanation: 'REST stands for Representational State Transfer, the architectural style Roy Fielding named in 2000. It is a set of design constraints — not a protocol, a format, or a piece of software — that a system usually applies on top of HTTP.'

  - question: 'Which URL is the well-designed REST way to address a single user, and why?'
    options:
      - '/getUser?id=1, because it says exactly what to do'
      - '/users/1, because the address names the resource and the HTTP verb carries the action'
      - '/user/fetch/1, because it lists the steps in order'
      - '/deleteUser/1, because it names the operation and the target together'
    answer_index: 1
    explanation: 'In REST the address is a noun that names the resource (/users/1), and the HTTP method (GET, DELETE, and so on) says what to do with it. Baking a verb into the path, like /getUser, throws away the predictability that is the whole point of REST.'

  - question: 'You want to CREATE a new post. Which request is correct?'
    options:
      - 'PUT to the collection: PUT /posts with the new body'
      - 'POST to an item: POST /posts/1 with the body'
      - 'POST to the collection: POST /posts with the body'
      - 'GET the collection: GET /posts and read it'
    answer_index: 2
    explanation: 'Create maps to POST against the collection (/posts). The server assigns the new id and typically returns 201 Created with the new resource. You POST to the collection, not to an item, because the item does not exist yet.'

  - question: 'Which HTTP verb corresponds to the "Read" operation in CRUD, and what property does it have?'
    options:
      - 'DELETE — it is safe and never changes anything'
      - 'POST — it is idempotent'
      - 'PATCH — it is safe but not idempotent'
      - 'GET — safe and idempotent, so cacheable'
    answer_index: 3
    explanation: 'Read maps to GET, which is safe (it only reads and never changes server state) and idempotent. Because GET changes nothing, caches and clients can store and repeat it freely — the basis of REST caching.'

  - question: 'Why must you be careful about blindly retrying a failed POST, but not a failed GET or DELETE?'
    options:
      - 'POST is not idempotent; GET and DELETE are'
      - 'POST requests are slower, so retrying wastes time'
      - 'POST requests cannot carry a body on the second attempt'
      - 'GET and DELETE are encrypted but POST is not'
    answer_index: 0
    explanation: 'POST is not idempotent: two identical POSTs may create two resources (for example, two orders and a double charge). GET is safe, and both GET and DELETE are idempotent, so repeating them leaves the server in the same state — which is why retry logic must know which verb it is retrying.'

  - question: 'What is the difference between PUT and PATCH?'
    options:
      - 'PUT reads a resource; PATCH writes one'
      - 'PUT replaces the whole resource; PATCH only the fields sent'
      - 'PUT works on collections; PATCH works on items'
      - 'They are identical; the name is just a preference'
    answer_index: 1
    explanation: 'PUT replaces the whole resource — omit a field and you may erase it — while PATCH merges only the fields you send, leaving the rest untouched. Use PATCH to change one attribute and PUT when you have the complete new version.'

  - question: 'What does it mean that REST is "stateless," and why does it matter for scaling?'
    options:
      - 'The server saves your session so later requests are faster'
      - 'The server has no database and stores nothing at all'
      - 'Each request carries all it needs, so any server copy can answer'
      - 'Only one client can talk to the server at a time'
    answer_index: 2
    explanation: 'Statelessness means every request is self-contained (identity travels in a token on each request) and the server remembers nothing between requests. That lets a provider run many identical copies behind a load balancer and send any request to any copy — the property that makes REST scale horizontally.'

  - question: 'What is the difference between a resource and its representation?'
    options:
      - 'They are the same thing with two names'
      - 'A resource is the JSON; a representation is the URL'
      - 'A representation is stored on disk; a resource exists only in memory'
      - 'A resource is the thing; a representation is a JSON snapshot of it'
    answer_index: 3
    explanation: 'The resource is the underlying thing (user 1); the representation is a document describing its current state — typically JSON — that the server sends you. The same resource can be represented as JSON, XML, or HTML; "Representational State Transfer" names exactly this exchange of representations.'
