visuals:
  - id: rest-resources
    file: assets/rest-resources.svg
    type: diagram
    title: 'Resources: a collection and its items'
    alt: 'Architecture diagram: the collection /users and the item /users/1, with the four verbs GET, POST, PUT/PATCH, and DELETE acting on them'
    description: 'An architecture diagram showing the collection /users (the shelf of all users) beside the item /users/1 (one user addressed by id), with GET and POST acting on the collection and GET, PUT/PATCH, and DELETE acting on the item, over the rule that the address names the thing while the verb carries the action.'
  - id: crud-http-map
    file: assets/crud-http-map.svg
    type: flowchart
    title: 'CRUD mapped to HTTP verbs'
    alt: 'Flow diagram: the CRUD operations Create, Read, Update, and Delete mapped to the HTTP methods POST, GET, PUT and PATCH, and DELETE'
    description: 'A flow diagram mapping each CRUD operation to its HTTP verb and typical success status code: Create to POST on a collection (201), Read to GET (200), Update to PUT or PATCH on an item (200), and Delete to DELETE on an item (200 or 204).'
  - id: rest-resource-verbs
    file: assets/rest-resource-verbs.svg
    type: diagram
    title: 'The address names the thing; the verb says what to do'
    alt: 'Diagram: REST collections compared with items, and which verb belongs where'
    description: 'A two-column comparison of a collection endpoint and an item endpoint, showing which HTTP verb applies to each and what it does.'
  - id: nouns-not-verbs
    file: assets/nouns-not-verbs.svg
    type: diagram
    title: 'The one rule that makes an API guessable'
    alt: 'Diagram: verb-based paths compared with resource-based paths'
    description: 'A two-column comparison of an API that puts operations in the path against one that names resources and uses HTTP methods for the action, covering predictability and the number of things a client must learn.'
  - id: collection-or-item
    file: assets/collection-or-item.svg
    type: diagram
    title: 'Which verb goes where'
    alt: 'Diagram: which HTTP methods act on collections and which act on items'
    description: 'A four-stage explanation of REST addressing showing that POST targets a collection to create, while GET, PUT, PATCH and DELETE target an item that already has an identifier.'
  - id: put-versus-patch
    file: assets/put-versus-patch.svg
    type: diagram
    title: 'PUT replaces. PATCH merges.'
    alt: 'Diagram: a PUT request compared with a PATCH request'
    description: 'A two-column comparison of PUT and PATCH sending an identical partial body, showing that PUT replaces the whole resource and clears omitted fields while PATCH leaves them untouched.'
  - id: stateless-scaling
    file: assets/stateless-scaling.svg
    type: diagram
    title: 'What statelessness actually buys'
    alt: 'Diagram: how statelessness allows any server to answer any request'
    description: 'A four-stage explanation of stateless request handling showing self-contained requests, interchangeable servers behind a load balancer, elastic capacity, and restarts that no client notices.'
  - id: broken-object-authorization
    file: assets/broken-object-authorization.svg
    type: diagram
    title: 'Predictable URLs are guessable URLs'
    alt: 'Diagram: checking authentication compared with checking ownership'
    description: 'A two-column comparison of an endpoint that verifies only that a caller is authenticated against one that also verifies the caller owns the requested resource.'
  - id: rest-or-graphql
    file: assets/rest-or-graphql.svg
    type: diagram
    title: 'Why GraphQL exists'
    alt: 'Diagram: REST compared with GraphQL'
    description: 'A two-column comparison of REST and GraphQL covering response shape, round trips, caching, and the complexity each requires.'
  - id: safe-idempotent-retry
    file: assets/safe-idempotent-retry.svg
    type: diagram
    title: 'What retry logic must know'
    alt: 'Diagram: which HTTP verbs are safe to retry after a timeout'
    description: 'A four-stage guide to retrying requests by verb, covering safe reads, idempotent replacements and deletions, non-idempotent creation, and the idempotency key that resolves it.'
  - id: hateoas-links
    file: assets/hateoas-links.svg
    type: diagram
    title: 'Following links, or constructing them'
    alt: 'Diagram: a client following hypermedia links compared with one building URLs'
    description: 'A two-column comparison of a client that navigates by following links in responses against one that constructs URLs from documentation, covering what happens when the server reorganises its addresses.'
  - id: query-parameters-not-endpoints
    file: assets/query-parameters-not-endpoints.svg
    type: diagram
    title: 'Filter with parameters, not with new endpoints'
    alt: 'Diagram: an endpoint per variation compared with query parameters on one collection'
    description: 'A two-column comparison of creating a separate endpoint for each way of querying a collection against using query parameters on a single collection endpoint, covering the number of endpoints to document and maintain.'
