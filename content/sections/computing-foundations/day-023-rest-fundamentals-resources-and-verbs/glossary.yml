terms:
  - term: REST
    definition: 'Representational State Transfer — an architectural style for networked software that models a service as resources at addresses, acted on by a fixed set of standard verbs, with a stateless client-server exchange.'
  - term: resource
    definition: 'Any thing a service exposes and names, such as a user, order, or post; the noun that a REST URL addresses.'
  - term: collection
    definition: 'A resource that contains many others, addressed by a plural path such as /users; you create a new member by POSTing to it.'
  - term: endpoint
    definition: 'A specific addressable URL through which a client acts on a resource, such as /users/1.'
  - term: CRUD
    definition: 'The four basic operations on stored data — Create, Read, Update, Delete — which REST maps onto the HTTP verbs POST, GET, PUT/PATCH, and DELETE.'
  - term: stateless
    definition: 'A design in which each request carries everything the server needs and the server keeps no memory of the client between requests, so any request can be handled by any server copy.'
  - term: representation
    definition: 'A serialized snapshot of a resource''s state that is transferred between client and server, most commonly as JSON; distinct from the resource itself.'
  - term: idempotent
    definition: 'A property of a request such that making it many times leaves the server in the same state as making it once; GET, PUT, and DELETE are idempotent, while POST is not.'
  - term: safe
    definition: 'A property of a request that only reads and never changes server state; GET is safe, which is why it can be cached and retried freely.'
  - term: HATEOAS
    definition: 'Hypermedia As The Engine Of Application State — the REST constraint that a resource''s representation includes links telling the client what it can do next and where.'
  - term: RPC
    definition: 'Remote Procedure Call — an API style that models operations as named functions to invoke (e.g. createUser) rather than resources to act on; gRPC is a modern high-performance form.'
  - term: GraphQL
    definition: 'An API style exposing a single endpoint where the client asks for exactly the fields it wants in one query, addressing REST''s tendency toward many round trips or over- and under-fetching.'
