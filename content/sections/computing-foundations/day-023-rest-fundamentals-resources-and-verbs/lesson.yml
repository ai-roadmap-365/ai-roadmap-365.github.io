id: D023
day: 23
slug: rest-fundamentals-resources-and-verbs
title: 'REST Fundamentals: Resources and Verbs'
section: computing-foundations
subsection: networks-and-the-internet
week: 4
learning_promise: 'After this lesson you will be able to read almost any web API as a set of resources at addresses acted on by standard verbs, map CRUD onto HTTP methods, and reason about statelessness, idempotency, and good URL design — the architecture behind nearly every API you will ever call.'
objectives:
  - 'Define REST as an architectural style and explain the resource-and-verb model, including why URLs name nouns (/users/1) rather than actions (/getUser)'
  - 'Map the four CRUD operations onto the HTTP verbs GET, POST, PUT, PATCH, and DELETE, and state which verb targets a collection versus an item'
  - 'Explain statelessness and why it lets a REST service scale horizontally behind a load balancer'
  - 'Distinguish a resource from its representation, and identify JSON as the common representation format'
  - 'Apply safety and idempotency to decide which verbs are safe to retry, and why blindly retrying a POST is risky'
  - 'Compare REST with RPC/gRPC and GraphQL at a high level and choose the right style for a given situation'
  - 'Run a full create-read-update-delete cycle against a real REST API with curl and read the status codes and representations it returns'
prerequisites:
  - 'Day 18 (HTTP requests, responses, and methods) and Day 22 (what an API is)'
  - 'A terminal with curl and network access; python3 optional for pretty-printing JSON'
reading_time_minutes: 40
practical_time_minutes: 30
