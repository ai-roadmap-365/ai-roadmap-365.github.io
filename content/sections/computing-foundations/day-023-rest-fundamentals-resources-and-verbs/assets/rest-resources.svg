<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>The collection /users and the item /users/1, with the four HTTP verbs acting on them</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Resources: a collection and its items</text>

  <!-- Collection box -->
  <rect x="60" y="80" width="280" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="200" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Collection</text>
  <text x="200" y="134" text-anchor="middle" font-size="16" fill="#1d4ed8" font-weight="bold">/users</text>
  <text x="200" y="158" text-anchor="middle" font-size="14" fill="#1a202c">the shelf of all users</text>
  <rect x="90" y="172" width="220" height="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="4"/>
  <text x="200" y="187" text-anchor="middle" font-size="13" fill="#1a202c">user 1 · user 2 · user 3 · ...</text>
  <text x="200" y="216" text-anchor="middle" font-size="13" fill="#1a202c">(a noun, not an action)</text>

  <!-- Item box -->
  <rect x="420" y="80" width="280" height="150" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="560" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Item</text>
  <text x="560" y="134" text-anchor="middle" font-size="16" fill="#1d4ed8" font-weight="bold">/users/1</text>
  <text x="560" y="158" text-anchor="middle" font-size="14" fill="#1a202c">one user, addressed by id</text>
  <text x="560" y="192" text-anchor="middle" font-size="13" fill="#1a202c">{ "id": 1, "name": "Ada" }</text>
  <text x="560" y="216" text-anchor="middle" font-size="13" fill="#1a202c">nests: /users/1/orders</text>

  <!-- addressing arrow -->
  <line x1="340" y1="130" x2="412" y2="130" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="420,130 406,123 406,137" fill="#1d4ed8"/>
  <text x="376" y="120" text-anchor="middle" font-size="12" fill="#1d4ed8">/1</text>

  <!-- Verbs on collection -->
  <text x="200" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">verbs on the collection</text>
  <rect x="70" y="298" width="120" height="40" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="130" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">GET</text>
  <text x="130" y="332" text-anchor="middle" font-size="12" fill="#1a202c">list all</text>
  <rect x="210" y="298" width="120" height="40" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="270" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">POST</text>
  <text x="270" y="332" text-anchor="middle" font-size="12" fill="#1a202c">create one</text>

  <!-- Verbs on item -->
  <text x="560" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">verbs on one item</text>
  <rect x="430" y="298" width="86" height="40" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="473" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">GET</text>
  <text x="473" y="332" text-anchor="middle" font-size="12" fill="#1a202c">read</text>
  <rect x="524" y="298" width="120" height="40" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="584" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">PUT / PATCH</text>
  <text x="584" y="332" text-anchor="middle" font-size="12" fill="#1a202c">update</text>
  <rect x="652" y="298" width="48" height="40" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="676" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">DEL</text>
  <text x="676" y="332" text-anchor="middle" font-size="11" fill="#1a202c">remove</text>

  <!-- connectors verbs to boxes -->
  <line x1="200" y1="230" x2="200" y2="270" stroke="#93c5fd" stroke-width="2"/>
  <line x1="560" y1="230" x2="560" y2="270" stroke="#93c5fd" stroke-width="2"/>

  <!-- Key idea -->
  <rect x="60" y="374" width="640" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">The address names the thing; the verb carries the action.</text>
  <text x="380" y="420" text-anchor="middle" font-size="13" fill="#1a202c">GET /users/1 reads user 1; DELETE /users/1 removes it — same noun, different verb.</text>
</svg>
