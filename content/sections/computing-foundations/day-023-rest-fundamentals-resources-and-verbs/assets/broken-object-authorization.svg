<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The most common REST vulnerability, by a wide margin.">
  <title>Predictable URLs are guessable URLs</title>
  <style>
    .broken-object-authorization-bg   { fill: #f8fafc; }
    .broken-object-authorization-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .broken-object-authorization-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .broken-object-authorization-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .broken-object-authorization-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .broken-object-authorization-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .broken-object-authorization-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .broken-object-authorization-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .broken-object-authorization-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .broken-object-authorization-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .broken-object-authorization-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .broken-object-authorization-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .broken-object-authorization-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .broken-object-authorization-row { opacity: 1; }
    .broken-object-authorization-r0 { animation-delay: 0.00s; }
    .broken-object-authorization-r1 { animation-delay: 0.45s; }
    .broken-object-authorization-r2 { animation-delay: 0.90s; }
    .broken-object-authorization-r3 { animation-delay: 1.35s; }
    .broken-object-authorization-r4 { animation-delay: 1.80s; }
    .broken-object-authorization-row { animation: broken-object-authorization-reveal 7.3s ease-in-out infinite; }
    @keyframes broken-object-authorization-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="broken-object-authorization-bg" width="980" height="390"/>
  <text class="broken-object-authorization-h1"  x="30" y="40">Predictable URLs are guessable URLs</text>
  <text class="broken-object-authorization-sub" x="30" y="64">The most common REST vulnerability, by a wide margin.</text>
  <rect class="broken-object-authorization-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="broken-object-authorization-name" x="46" y="122">Checks you are logged in</text>
  <text class="broken-object-authorization-desc" x="46" y="142">Authentication only.</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r0" x="46" y="182">A valid token reaches the endpoint</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r1" x="46" y="216">GET /orders/1 returns order 1</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r2" x="46" y="250">So does GET /orders/2, and /orders/3</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r3" x="46" y="284">Any user can read any order</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r4" x="46" y="318">The URL pattern told them the ids exist</text>
  <rect class="broken-object-authorization-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="broken-object-authorization-name" x="526" y="122">Checks the resource is yours</text>
  <text class="broken-object-authorization-desc" x="526" y="142">Authentication and authorisation.</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r0" x="526" y="182">A valid token reaches the endpoint</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r1" x="526" y="216">Then: does this token own THIS order?</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r2" x="526" y="250">GET /orders/2 returns 403, or 404</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r3" x="526" y="284">Checked per request, never assumed</text>
  <text class="broken-object-authorization-desc broken-object-authorization-row broken-object-authorization-r4" x="526" y="318">The pattern being guessable stops mattering</text>
  <text class="broken-object-authorization-sub" x="30" y="372">REST's predictability is a feature for clients and a map for attackers. The answer is not obscure identifiers; it is checking ownership on every single request.</text>
</svg>
