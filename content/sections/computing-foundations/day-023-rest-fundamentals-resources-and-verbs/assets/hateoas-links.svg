<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="How your browser uses the web, versus how most API clients do.">
  <title>Following links, or constructing them</title>
  <style>
    .hateoas-links-bg   { fill: #f8fafc; }
    .hateoas-links-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hateoas-links-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hateoas-links-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hateoas-links-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hateoas-links-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hateoas-links-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hateoas-links-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hateoas-links-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hateoas-links-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hateoas-links-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hateoas-links-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hateoas-links-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hateoas-links-row { opacity: 1; }
    .hateoas-links-r0 { animation-delay: 0.00s; }
    .hateoas-links-r1 { animation-delay: 0.45s; }
    .hateoas-links-r2 { animation-delay: 0.90s; }
    .hateoas-links-r3 { animation-delay: 1.35s; }
    .hateoas-links-r4 { animation-delay: 1.80s; }
    .hateoas-links-row { animation: hateoas-links-reveal 7.3s ease-in-out infinite; }
    @keyframes hateoas-links-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hateoas-links-bg" width="980" height="390"/>
  <text class="hateoas-links-h1"  x="30" y="40">Following links, or constructing them</text>
  <text class="hateoas-links-sub" x="30" y="64">How your browser uses the web, versus how most API clients do.</text>
  <rect class="hateoas-links-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hateoas-links-name" x="46" y="122">Constructing URLs</text>
  <text class="hateoas-links-desc" x="46" y="142">The pragmatic majority.</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r0" x="46" y="182">The client builds /users/1/orders itself</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r1" x="46" y="216">URL patterns are hard-coded from the docs</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r2" x="46" y="250">Simple, and works</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r3" x="46" y="284">A server reorganisation breaks every client</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r4" x="46" y="318">Which is why URLs are rarely reorganised</text>
  <rect class="hateoas-links-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hateoas-links-name" x="526" y="122">Following links</text>
  <text class="hateoas-links-desc" x="526" y="142">Full REST, rarely implemented.</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r0" x="526" y="182">Responses carry _links to what you can do</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r1" x="526" y="216">The client follows rather than constructs</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r2" x="526" y="250">The server can move things freely</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r3" x="526" y="284">This is exactly how your browser works</text>
  <text class="hateoas-links-desc hateoas-links-row hateoas-links-r4" x="526" y="318">The web is the purest REST system there is</text>
  <text class="hateoas-links-sub" x="30" y="372">Most APIs called RESTful skip this entirely. It is still worth recognising: where an API does return links, following them is strictly better than ignoring them.</text>
</svg>
