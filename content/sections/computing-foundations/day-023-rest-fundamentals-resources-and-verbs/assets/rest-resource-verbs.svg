<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Get this split wrong and the API stops being predictable.">
  <title>The address names the thing; the verb says what to do</title>
  <style>
    .rest-resource-verbs-bg   { fill: #f8fafc; }
    .rest-resource-verbs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-resource-verbs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-resource-verbs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-resource-verbs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-resource-verbs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rest-resource-verbs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rest-resource-verbs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rest-resource-verbs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rest-resource-verbs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rest-resource-verbs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rest-resource-verbs-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="rest-resource-verbs-bg" width="980" height="390"/>
  <text class="rest-resource-verbs-h1"  x="30" y="40">The address names the thing; the verb says what to do</text>
  <text class="rest-resource-verbs-sub" x="30" y="64">Get this split wrong and the API stops being predictable.</text>
  <rect class="rest-resource-verbs-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rest-resource-verbs-name" x="46" y="122">/posts — the collection</text>
  <text class="rest-resource-verbs-desc" x="46" y="142">Many things</text>
  <text class="rest-resource-verbs-desc" x="46" y="182">GET — list them</text>
  <text class="rest-resource-verbs-desc" x="46" y="216">POST — create a new one here</text>
  <text class="rest-resource-verbs-desc" x="46" y="250">PUT and DELETE on a collection are unusual</text>
  <text class="rest-resource-verbs-desc" x="46" y="284">POST is NOT idempotent — retry and you get two</text>
  <text class="rest-resource-verbs-desc" x="46" y="318">The server chooses the new id</text>
  <rect class="rest-resource-verbs-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rest-resource-verbs-name" x="526" y="122">/posts/1 — one item</text>
  <text class="rest-resource-verbs-desc" x="526" y="142">A specific thing</text>
  <text class="rest-resource-verbs-desc" x="526" y="182">GET — read it</text>
  <text class="rest-resource-verbs-desc" x="526" y="216">PUT — replace it entirely</text>
  <text class="rest-resource-verbs-desc" x="526" y="250">PATCH — change only the fields you send</text>
  <text class="rest-resource-verbs-desc" x="526" y="284">DELETE — remove it</text>
  <text class="rest-resource-verbs-desc" x="526" y="318">All four are idempotent: repeating them is safe</text>
  <text class="rest-resource-verbs-sub" x="30" y="372">POST to the collection, everything else to the item. That single rule removes most REST design arguments.</text>
</svg>
