questions:
  - question: 'You type https://example.com and press Enter. Which step happens FIRST, before the browser can request the page?'
    options:
      - 'The server renders the HTML for you'
      - 'The browser paints pixels to the screen'
      - 'The TLS handshake encrypts the page content'
      - 'The browser parses the URL and looks up the IP'
    answer_index: 3
    explanation: 'The browser first splits the URL into scheme, host, and path, then performs a DNS lookup to translate the host name into an IP address the network can route to. Only after there is an address can a connection be opened and the page requested.'

  - question: 'What does the Domain Name System (DNS) actually do?'
    options:
      - 'It translates a name like example.com into an IP address'
      - 'It guarantees that packets arrive in order and complete'
      - 'It encrypts the connection so eavesdroppers cannot read it'
      - 'It renders the HTML into a visible page'
    answer_index: 0
    explanation: 'DNS is the internet''s directory: it maps memorable names to the numeric IP addresses the network routes to. Reliability is TCP''s job, encryption is TLS''s job, and rendering is the browser''s job.'

  - question: 'On a fresh https connection, which sequence of setup steps happens in order before the first HTTP request is sent?'
    options:
      - 'TLS handshake, then TCP connection, then DNS lookup'
      - 'DNS lookup, then TCP connection, then TLS handshake'
      - 'DNS lookup, then TLS handshake, then TCP connection'
      - 'TCP connection, then DNS lookup, then TLS handshake'
    answer_index: 1
    explanation: 'You need an address before you can connect, so DNS comes first; then TCP opens the connection to that address; then TLS negotiates encryption over that connection. Only after all three can the HTTP request go out.'

  - question: 'Why does distance to a server matter so much for how fast a page starts to load?'
    options:
      - 'Longer distance reduces the available bandwidth to zero'
      - 'DNS cannot resolve names for far-away servers'
      - 'Each round trip takes longer, and setup needs several'
      - 'Servers far away always have slower processors'
    answer_index: 2
    explanation: 'Signals travel at a finite speed, so a longer distance means a longer round-trip time. Because setting up a connection (TCP handshake, TLS handshake, DNS misses, the request itself) costs several round trips, distance multiplies the setup delay — this is latency, and a faster computer cannot remove it.'

  - question: 'In the internet''s layered model, what is the job of the transport layer (TCP)?'
    options:
      - 'To move bits over the physical Wi-Fi or Ethernet medium'
      - 'To address and route individual packets across networks'
      - 'To agree what is being asked for and returned'
      - 'To deliver an ordered, reliable byte stream to the right program'
    answer_index: 3
    explanation: 'TCP (the transport layer) turns the unreliable packet delivery of IP into an ordered, complete byte stream for a specific program, retransmitting anything lost. Routing is IP''s job (internet layer), moving bits is the link layer''s job, and agreeing on the message format is the application layer''s job.'

  - question: 'A curl run prints: dns=0.030s connect=0.050s tls=0.100s total=0.180s. How long did the TLS handshake take?'
    options:
      - 'About 50 milliseconds'
      - 'About 100 milliseconds'
      - 'About 30 milliseconds'
      - 'About 180 milliseconds'
    answer_index: 0
    explanation: 'Each number is the elapsed time from the start at which that stage finished. TCP connect finished at 0.050s and TLS finished at 0.100s, so the TLS handshake took the gap between them: about 0.050s, or 50 milliseconds.'

  - question: 'Your ping to a website times out with no replies, but the site loads fine in your browser. What is the most likely explanation?'
    options:
      - 'The site is down and the browser is showing a cached copy'
      - 'The server or network blocks ping (ICMP), which is separate'
      - 'DNS is broken, so the browser guessed the address'
      - 'The TLS certificate has expired'
    answer_index: 1
    explanation: 'Ping uses the ICMP protocol, which many servers and networks block on purpose. Web pages travel over TCP on port 443, a different path, so a blocked ping does not mean the site is down — always confirm reachability with a tool like curl.'

  - question: 'The first response to a page load is usually just an HTML document. What does the browser do next?'
    options:
      - 'Nothing more — the single response contains the entire page'
      - 'It closes the connection and reports the page as finished'
      - 'It reads the HTML and requests the CSS, scripts, images, and fonts'
      - 'It re-runs the DNS lookup for every image individually'
    answer_index: 2
    explanation: 'The initial HTML is a skeleton that references more resources. The browser parses it, issues additional HTTP requests for the stylesheets, scripts, images, and fonts it names — usually reusing the open connection — and renders the page as those pieces arrive.'
