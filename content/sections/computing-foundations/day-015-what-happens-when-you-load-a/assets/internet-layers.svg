<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" font-family="system-ui, sans-serif">
  <title>The four layers of the internet protocol stack: application, transport, internet, and link, each with its job</title>
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The internet's four layers</text>

  <!-- Application -->
  <rect x="60" y="60" width="420" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="270" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Application layer</text>
  <text x="270" y="114" text-anchor="middle" font-size="14" fill="#1a202c">HTTP, DNS, TLS — agree what is asked and returned</text>
  <text x="500" y="99" font-size="14" fill="#1a202c">unit: message</text>

  <!-- Transport -->
  <rect x="60" y="142" width="420" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="270" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Transport layer</text>
  <text x="270" y="196" text-anchor="middle" font-size="14" fill="#1a202c">TCP — reliable, ordered byte stream to the right program</text>
  <text x="500" y="181" font-size="14" fill="#1a202c">unit: segment</text>

  <!-- Internet -->
  <rect x="60" y="224" width="420" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="270" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Internet layer</text>
  <text x="270" y="278" text-anchor="middle" font-size="14" fill="#1a202c">IP — address and route packets across networks</text>
  <text x="500" y="263" font-size="14" fill="#1a202c">unit: packet</text>

  <!-- Link -->
  <rect x="60" y="306" width="420" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="270" y="336" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Link layer</text>
  <text x="270" y="360" text-anchor="middle" font-size="14" fill="#1a202c">Wi-Fi, Ethernet — move bits to the next physical device</text>
  <text x="500" y="345" font-size="14" fill="#1a202c">unit: frame</text>

  <!-- Down arrow (encapsulation) -->
  <line x1="34" y1="70" x2="34" y2="366" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="34,378 27,362 41,362" fill="#1d4ed8"/>
  <text x="24" y="218" font-size="14" font-weight="bold" fill="#1d4ed8" transform="rotate(-90 24 218)" text-anchor="middle">sending: wrap</text>

  <!-- Up arrow -->
  <line x1="606" y1="366" x2="606" y2="70" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="606,58 599,74 613,74" fill="#1d4ed8"/>
  <text x="616" y="218" font-size="14" font-weight="bold" fill="#1d4ed8" transform="rotate(90 616 218)" text-anchor="middle">receiving: unwrap</text>

  <text x="360" y="410" text-anchor="middle" font-size="15" fill="#1a202c">Each layer adds its own wrapper going down and strips it going up (encapsulation).</text>
  <text x="360" y="436" text-anchor="middle" font-size="14" fill="#1a202c">Your HTTP request rides inside a TCP segment, inside an IP packet, inside a link frame.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 34 70 L 34 366" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 606 366 L 606 70" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
