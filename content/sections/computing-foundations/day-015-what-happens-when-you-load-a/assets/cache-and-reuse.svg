<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same page, and most of the cost is gone.">
  <title>Cold visit, warm visit</title>
  <style>
    .cache-and-reuse-bg   { fill: #f8fafc; }
    .cache-and-reuse-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-and-reuse-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-and-reuse-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-and-reuse-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-and-reuse-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-and-reuse-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-and-reuse-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cache-and-reuse-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cache-and-reuse-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cache-and-reuse-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cache-and-reuse-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cache-and-reuse-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-and-reuse-row { opacity: 1; }
    .cache-and-reuse-r0 { animation-delay: 0.00s; }
    .cache-and-reuse-r1 { animation-delay: 0.45s; }
    .cache-and-reuse-r2 { animation-delay: 0.90s; }
    .cache-and-reuse-r3 { animation-delay: 1.35s; }
    .cache-and-reuse-r4 { animation-delay: 1.80s; }
    .cache-and-reuse-row { animation: cache-and-reuse-reveal 7.3s ease-in-out infinite; }
    @keyframes cache-and-reuse-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cache-and-reuse-bg" width="980" height="390"/>
  <text class="cache-and-reuse-h1"  x="30" y="40">Cold visit, warm visit</text>
  <text class="cache-and-reuse-sub" x="30" y="64">The same page, and most of the cost is gone.</text>
  <rect class="cache-and-reuse-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cache-and-reuse-name" x="46" y="122">First visit</text>
  <text class="cache-and-reuse-desc" x="46" y="142">Everything from scratch.</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r0" x="46" y="182">DNS resolved from the hierarchy</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r1" x="46" y="216">New TCP connection, new handshake</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r2" x="46" y="250">Full TLS negotiation</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r3" x="46" y="284">Every image, script and font fetched</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r4" x="46" y="318">Three or four round trips before byte one</text>
  <rect class="cache-and-reuse-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cache-and-reuse-name" x="526" y="122">Repeat visit</text>
  <text class="cache-and-reuse-desc" x="526" y="142">Most of it skipped.</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r0" x="526" y="182">DNS answer served from cache</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r1" x="526" y="216">Connection reused, or resumed</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r2" x="526" y="250">TLS session resumed, not renegotiated</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r3" x="526" y="284">Unchanged resources served locally</text>
  <text class="cache-and-reuse-desc cache-and-reuse-row cache-and-reuse-r4" x="526" y="318">Often a single round trip, or none</text>
  <text class="cache-and-reuse-sub" x="30" y="372">This is why measuring performance with a warm cache flatters your site, and why the number that matters to a new user is the cold one.</text>
</svg>
