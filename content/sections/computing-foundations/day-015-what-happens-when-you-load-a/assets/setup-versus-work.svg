<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="On a distant connection, setup can outweigh the work.">
  <title>Most of a page load happens before the page is asked for</title>
  <style>
    .setup-versus-work-bg   { fill: #f8fafc; }
    .setup-versus-work-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .setup-versus-work-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .setup-versus-work-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .setup-versus-work-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .setup-versus-work-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .setup-versus-work-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .setup-versus-work-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .setup-versus-work-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .setup-versus-work-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .setup-versus-work-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .setup-versus-work-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="setup-versus-work-bg" width="980" height="390"/>
  <text class="setup-versus-work-h1"  x="30" y="40">Most of a page load happens before the page is asked for</text>
  <text class="setup-versus-work-sub" x="30" y="64">On a distant connection, setup can outweigh the work.</text>
  <rect class="setup-versus-work-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="setup-versus-work-name" x="46" y="122">Setup — before any data</text>
  <text class="setup-versus-work-desc" x="46" y="142">Three or four round trips</text>
  <text class="setup-versus-work-desc" x="46" y="182">DNS lookup, unless cached</text>
  <text class="setup-versus-work-desc" x="46" y="216">TCP three-way handshake</text>
  <text class="setup-versus-work-desc" x="46" y="250">TLS handshake, one or two trips</text>
  <text class="setup-versus-work-desc" x="46" y="284">At 150 ms each, that is most of a second</text>
  <text class="setup-versus-work-desc" x="46" y="318">Paid again for every new connection</text>
  <rect class="setup-versus-work-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="setup-versus-work-name" x="526" y="122">The work — the variable part</text>
  <text class="setup-versus-work-desc" x="526" y="142">What the server actually does</text>
  <text class="setup-versus-work-desc" x="526" y="182">Read a file, run code, query a database</text>
  <text class="setup-versus-work-desc" x="526" y="216">May be 5 ms, may be 5 seconds</text>
  <text class="setup-versus-work-desc" x="526" y="250">The only part making the response bigger</text>
  <text class="setup-versus-work-desc" x="526" y="284">Reduced by caching and faster code</text>
  <text class="setup-versus-work-desc" x="526" y="318">Often smaller than the setup around it</text>
  <text class="setup-versus-work-sub" x="30" y="372">This is why connection reuse and a CDN often beat optimising the server, and why moving closer to users wins twice.</text>
</svg>
