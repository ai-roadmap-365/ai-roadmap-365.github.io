<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each layer wraps the one above and never reads it.">
  <title>A letter inside an envelope inside a mailbag</title>
  <style>
    .encapsulation-bg   { fill: #f8fafc; }
    .encapsulation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encapsulation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encapsulation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encapsulation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encapsulation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encapsulation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encapsulation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encapsulation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encapsulation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encapsulation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encapsulation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encapsulation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .encapsulation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .encapsulation-stage { opacity: 1; }

    .encapsulation-s0 { animation-delay: 0.00s; }
    .encapsulation-e0 { animation-delay: 0.00s; }
    .encapsulation-s1 { animation-delay: 1.28s; }
    .encapsulation-e1 { animation-delay: 1.28s; }
    .encapsulation-s2 { animation-delay: 2.56s; }
    .encapsulation-e2 { animation-delay: 2.56s; }
    .encapsulation-s3 { animation-delay: 3.84s; }
    .encapsulation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .encapsulation-conn  { animation: encapsulation-trace 6.4s ease-in-out infinite; }
      .encapsulation-stage { animation: encapsulation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes encapsulation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes encapsulation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .encapsulation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .encapsulation-stage { animation: encapsulation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes encapsulation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="encapsulation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="encapsulation-bg" width="980" height="322"/>
  <text class="encapsulation-h1"  x="30" y="40">A letter inside an envelope inside a mailbag</text>
  <text class="encapsulation-sub" x="30" y="64">Each layer wraps the one above and never reads it.</text>
  <g class="encapsulation-stage encapsulation-s0">
    <rect class="encapsulation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="encapsulation-step" x="44" y="142">01</text>
    <text class="encapsulation-name" x="70" y="142">Your request</text>
    <text class="encapsulation-desc" x="44" y="166">HTTP: a method, a path, some</text>
    <text class="encapsulation-desc" x="44" y="182">headers. Plain text.</text>
    <text class="encapsulation-edge" x="44" y="242">message</text>
  </g>
  <line class="encapsulation-line encapsulation-conn encapsulation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#encapsulation-tip)"/>
  <g class="encapsulation-stage encapsulation-s1">
    <rect class="encapsulation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="encapsulation-step" x="280" y="142">02</text>
    <text class="encapsulation-name" x="306" y="142">TCP wraps it</text>
    <text class="encapsulation-desc" x="280" y="166">Splits it into numbered segments</text>
    <text class="encapsulation-desc" x="280" y="182">and promises order and</text>
    <text class="encapsulation-desc" x="280" y="198">completeness.</text>
    <text class="encapsulation-edge" x="280" y="242">segment</text>
  </g>
  <line class="encapsulation-line encapsulation-conn encapsulation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#encapsulation-tip)"/>
  <g class="encapsulation-stage encapsulation-s2">
    <rect class="encapsulation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="encapsulation-step" x="516" y="142">03</text>
    <text class="encapsulation-name" x="542" y="142">IP wraps that</text>
    <text class="encapsulation-desc" x="516" y="166">Adds source and destination</text>
    <text class="encapsulation-desc" x="516" y="182">addresses, and works out the</text>
    <text class="encapsulation-desc" x="516" y="198">next hop.</text>
    <text class="encapsulation-edge" x="516" y="242">packet</text>
  </g>
  <line class="encapsulation-line encapsulation-conn encapsulation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#encapsulation-tip)"/>
  <g class="encapsulation-stage encapsulation-s3">
    <rect class="encapsulation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="encapsulation-step" x="752" y="142">04</text>
    <text class="encapsulation-name" x="778" y="142">The link layer wraps that</text>
    <text class="encapsulation-desc" x="752" y="166">Wi-Fi or Ethernet moves the bits</text>
    <text class="encapsulation-desc" x="752" y="182">to the next physical device.</text>
    <text class="encapsulation-edge" x="752" y="242">frame</text>
  </g>
  <text class="encapsulation-sub" x="30" y="304">On the way up, each layer strips its own wrapper and hands the contents to the layer above, which never needed to know any of this happened.</text>
</svg>
