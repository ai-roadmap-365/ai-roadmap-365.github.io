terms:
  - term: URL
    definition: 'A Uniform Resource Locator — the full address of a resource on the web, made of a scheme (such as https), a host name, and a path, plus any query.'
  - term: DNS
    definition: 'The Domain Name System, the internet''s directory service that translates a human-friendly name like example.com into a numeric IP address.'
  - term: IP address
    definition: 'The numeric address (such as 104.20.23.154) that identifies a machine on the network, so packets can be routed to it.'
  - term: TCP
    definition: 'The Transmission Control Protocol, which delivers a reliable, ordered stream of bytes between two programs, retransmitting anything lost.'
  - term: TLS
    definition: 'Transport Layer Security, the protocol that encrypts a connection and verifies the server''s identity so traffic is private and tamper-proof; the S in https.'
  - term: HTTP
    definition: 'The HyperText Transfer Protocol, the request-and-response format a browser and server use to ask for and return web resources.'
  - term: round-trip time
    definition: 'The time for a signal to travel to the server and back again, abbreviated RTT; the basic unit of network delay.'
  - term: latency
    definition: 'The delay before data begins to arrive, dominated by round-trip time and set largely by distance; distinct from bandwidth.'
  - term: bandwidth
    definition: 'The amount of data a connection can carry per second; important for large transfers but not for the round trips of connection setup.'
  - term: packet
    definition: 'A small, individually addressed chunk of data that the network routes independently; messages are split into packets and reassembled at the destination.'
  - term: protocol
    definition: 'An agreed set of rules two computers follow to communicate, such as HTTP, TCP, IP, or TLS.'
  - term: client
    definition: 'The program that initiates a request and waits for a reply, such as your web browser.'
  - term: server
    definition: 'The program that listens for requests and returns responses, such as the machine hosting a website.'
  - term: encapsulation
    definition: 'The layered wrapping of data as it goes down the network stack — an HTTP message inside a TCP segment inside an IP packet inside a link frame — unwrapped again at the other end.'
