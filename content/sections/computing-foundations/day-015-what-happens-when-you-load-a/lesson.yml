id: D015
day: 15
slug: what-happens-when-you-load-a
title: 'What Happens When You Load a Web Page'
section: computing-foundations
subsection: networks-and-the-internet
week: 3
learning_promise: 'After this lesson you will be able to trace, stop by stop, the journey a web request takes — URL, DNS, TCP, TLS, HTTP, server, response, render — and use that map to reason about latency, failures, and the layered structure of the internet.'
objectives:
  - 'List the stops of a page load in order — URL parsing, DNS lookup, TCP connection, TLS handshake, HTTP request and response, sub-resource fetching, and rendering — and say what each accomplishes'
  - 'Explain the difference between a domain name and an IP address, and why DNS is needed to bridge them'
  - 'Name the four layers of the internet protocol stack (application, transport, internet, link) and the single job each performs'
  - 'Define round-trip time and latency and explain why round trips, not bandwidth, dominate the felt speed of connection setup'
  - 'Use dig, ping, and curl to measure DNS resolution, round-trip time, and per-stage connection timings for a real site'
  - 'Read a curl timing line as a timeline and compute the cost of each stop (DNS, TCP, TLS, server) from it'
  - 'Connect the request journey to networked services: explain that every hosted-service call, dataset download, and deployed endpoint is this same pipeline'
prerequisites:
  - 'Days 1–14 of this course (the computing stack, the terminal, and running commands)'
  - 'A computer running macOS or Linux (or Windows via WSL) with an internet connection and a terminal'
reading_time_minutes: 40
practical_time_minutes: 30
