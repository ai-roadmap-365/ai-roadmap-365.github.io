visuals:
  - id: request-journey
    file: assets/request-journey.svg
    type: flowchart
    title: 'The journey of one web request'
    alt: 'Diagram: the journey of a web request from browser to server and back'
    description: 'A horizontal flow showing a request travelling from the browser through DNS, TCP, TLS, and the HTTP request to the server, then the response travelling back through the browser parsing the HTML, fetching sub-resources, and rendering the page, with each hop labelled.'
  - id: internet-layers
    file: assets/internet-layers.svg
    type: diagram
    title: 'The internet''s four layers'
    alt: 'Diagram: the four layers of the internet protocol stack'
    description: 'A vertical stack of the four internet layers — application (HTTP, DNS, TLS), transport (TCP), internet (IP), and link (Wi-Fi, Ethernet) — with the job and data unit of each, and arrows showing data being wrapped going down and unwrapped going up (encapsulation).'
  - id: setup-versus-work
    file: assets/setup-versus-work.svg
    type: diagram
    title: 'Most of a page load happens before the page is asked for'
    alt: 'Diagram: connection setup cost compared with the server''s actual work'
    description: 'A two-column comparison separating the round trips spent on DNS, TCP and TLS from the time the server spends producing an answer, and listing what reduces each.'
  - id: latency-versus-bandwidth
    file: assets/latency-versus-bandwidth.svg
    type: diagram
    title: 'Latency and bandwidth are different problems'
    alt: 'Diagram: network latency compared with bandwidth'
    description: 'A two-column comparison of latency and bandwidth explaining what each measures, what improves it, and which one dominates the experience of loading a page.'
  - id: round-trip-budget
    file: assets/round-trip-budget.svg
    type: diagram
    title: 'Four round trips before the first byte'
    alt: 'Diagram: the round trips spent before a page''s first byte arrives'
    description: 'A four-stage accounting of the round trips a cold HTTPS request spends on DNS resolution, the TCP handshake, the TLS handshake, and the request itself, before any page content is transferred.'
  - id: encapsulation
    file: assets/encapsulation.svg
    type: diagram
    title: 'A letter inside an envelope inside a mailbag'
    alt: 'Diagram: how each network layer wraps the data from the layer above'
    description: 'A four-stage sequence following data down the protocol stack as each layer adds its own header: the application message, the transport segment, the internet packet, and the link-layer frame.'
  - id: cache-and-reuse
    file: assets/cache-and-reuse.svg
    type: diagram
    title: 'Cold visit, warm visit'
    alt: 'Diagram: a first page load compared with a repeat visit'
    description: 'A two-column comparison of a first visit to a site against a repeat visit, showing which of the setup steps are skipped thanks to DNS caching, connection reuse and cached resources.'
  - id: http-versions
    file: assets/http-versions.svg
    type: diagram
    title: 'Every HTTP version fought the same enemy'
    alt: 'Diagram: how each HTTP version reduced round trips'
    description: 'A four-stage progression through HTTP versions showing the connection-per-resource cost of HTTP/1.0, persistent connections in 1.1, multiplexing in HTTP/2, and the combined handshake of HTTP/3 over QUIC.'
  - id: where-it-fails
    file: assets/where-it-fails.svg
    type: diagram
    title: 'Which stop broke?'
    alt: 'Diagram: the characteristic failure at each stage of a web request'
    description: 'A five-stage diagnostic sequence pairing each stage of a request with its characteristic failure message, from name resolution through connection, certificate validation, server errors and sub-resource problems.'
  - id: curl-timing-map
    file: assets/curl-timing-map.svg
    type: diagram
    title: 'Reading curl''s timings as the journey'
    alt: 'Diagram: how curl''s timing fields map to the stages of a request'
    description: 'A four-stage mapping of curl''s cumulative timing fields to the stages of a request, explaining that each field is measured from the start so the stage costs come from subtracting neighbours.'
  - id: what-a-cdn-changes
    file: assets/what-a-cdn-changes.svg
    type: diagram
    title: 'What a content delivery network actually buys'
    alt: 'Diagram: serving from one origin compared with serving from edge locations'
    description: 'A two-column comparison of serving content from a single origin server against serving it from geographically distributed edge locations, in terms of round-trip time.'
