visuals:
  - id: request-journey
    file: assets/request-journey.svg
    type: flowchart
    title: 'The journey of one web request'
    alt: 'Diagram: the journey of a web request from browser to server and back'
    description: 'A horizontal flow showing a request travelling from the browser through DNS, TCP, TLS, and the HTTP request to the server, then the response travelling back through the browser parsing the HTML, fetching sub-resources, and rendering the page, with each hop labelled.'
  - id: internet-layers
    file: assets/internet-layers.svg
    type: diagram
    title: 'The internet''s four layers'
    alt: 'Diagram: the four layers of the internet protocol stack'
    description: 'A vertical stack of the four internet layers — application (HTTP, DNS, TLS), transport (TCP), internet (IP), and link (Wi-Fi, Ethernet) — with the job and data unit of each, and arrows showing data being wrapped going down and unwrapped going up (encapsulation).'
