<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The diff tells you almost nothing on its own.">
  <title>Reviewing a model change</title>
  <style>
    .reviewing-model-changes-bg   { fill: #f8fafc; }
    .reviewing-model-changes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reviewing-model-changes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reviewing-model-changes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reviewing-model-changes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reviewing-model-changes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reviewing-model-changes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reviewing-model-changes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reviewing-model-changes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reviewing-model-changes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reviewing-model-changes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reviewing-model-changes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reviewing-model-changes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reviewing-model-changes-row { opacity: 1; }
    .reviewing-model-changes-r0 { animation-delay: 0.00s; }
    .reviewing-model-changes-r1 { animation-delay: 0.45s; }
    .reviewing-model-changes-r2 { animation-delay: 0.90s; }
    .reviewing-model-changes-r3 { animation-delay: 1.35s; }
    .reviewing-model-changes-r4 { animation-delay: 1.80s; }
    .reviewing-model-changes-row { animation: reviewing-model-changes-reveal 7.3s ease-in-out infinite; }
    @keyframes reviewing-model-changes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="reviewing-model-changes-bg" width="980" height="390"/>
  <text class="reviewing-model-changes-h1"  x="30" y="40">Reviewing a model change</text>
  <text class="reviewing-model-changes-sub" x="30" y="64">The diff tells you almost nothing on its own.</text>
  <rect class="reviewing-model-changes-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="reviewing-model-changes-name" x="46" y="122">Not reviewable</text>
  <text class="reviewing-model-changes-desc" x="46" y="142">A diff with no context.</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r0" x="46" y="182">A changed hyperparameter, unexplained</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r1" x="46" y="216">No before-and-after numbers</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r2" x="46" y="250">No statement of which data was used</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r3" x="46" y="284">Preprocessing changed silently</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r4" x="46" y="318">"Improves performance" with no measure</text>
  <rect class="reviewing-model-changes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="reviewing-model-changes-name" x="526" y="122">Reviewable</text>
  <text class="reviewing-model-changes-desc" x="526" y="142">A claim someone can check.</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r0" x="526" y="182">The config change, with a reason</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r1" x="526" y="216">Metric before and after, on the same split</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r2" x="526" y="250">The held-out set named explicitly</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r3" x="526" y="284">Preprocessing changes called out</text>
  <text class="reviewing-model-changes-desc reviewing-model-changes-row reviewing-model-changes-r4" x="526" y="318">The commit hash of the run that produced it</text>
  <text class="reviewing-model-changes-sub" x="30" y="372">AI-generated code needs more review than hand-written code, not less: it is fluent and confidently wrong in ways that read as correct, which is precisely what a skimming reviewer misses.</text>
</svg>
