<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same observation, two different messages.">
  <title>Review the code, not the person</title>
  <style>
    .review-comment-tone-bg   { fill: #f8fafc; }
    .review-comment-tone-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-comment-tone-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-comment-tone-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-comment-tone-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-comment-tone-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-comment-tone-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-comment-tone-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-comment-tone-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-comment-tone-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-comment-tone-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-comment-tone-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-comment-tone-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-comment-tone-row { opacity: 1; }
    .review-comment-tone-r0 { animation-delay: 0.00s; }
    .review-comment-tone-r1 { animation-delay: 0.45s; }
    .review-comment-tone-r2 { animation-delay: 0.90s; }
    .review-comment-tone-r3 { animation-delay: 1.35s; }
    .review-comment-tone-r4 { animation-delay: 1.80s; }
    .review-comment-tone-row { animation: review-comment-tone-reveal 7.3s ease-in-out infinite; }
    @keyframes review-comment-tone-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="review-comment-tone-bg" width="980" height="390"/>
  <text class="review-comment-tone-h1"  x="30" y="40">Review the code, not the person</text>
  <text class="review-comment-tone-sub" x="30" y="64">The same observation, two different messages.</text>
  <rect class="review-comment-tone-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="review-comment-tone-name" x="46" y="122">About the person</text>
  <text class="review-comment-tone-desc" x="46" y="142">Accurate, and hard to act on.</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r0" x="46" y="182">"You forgot the empty case"</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r1" x="46" y="216">"Why did you do it this way?"</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r2" x="46" y="250">"This is wrong"</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r3" x="46" y="284">"Didn't you test this?"</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r4" x="46" y="318">Nitpicking a formatting rule by hand</text>
  <rect class="review-comment-tone-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="review-comment-tone-name" x="526" y="122">About the code</text>
  <text class="review-comment-tone-desc" x="526" y="142">The same point, actionable.</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r0" x="526" y="182">"This will fail on an empty list"</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r1" x="526" y="216">"What led to this approach over X?"</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r2" x="526" y="250">"This returns None when the key is missing"</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r3" x="526" y="284">"Worth a test for the timeout path?"</text>
  <text class="review-comment-tone-desc review-comment-tone-row review-comment-tone-r4" x="526" y="318">Let the linter say it, instantly</text>
  <text class="review-comment-tone-sub" x="30" y="372">And approve when it is good enough to ship, not when it is what you would have written. Holding a pull request to your own stylistic preferences is the most common way review becomes a bottleneck.</text>
</svg>
