<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A draft asks for direction, not approval.">
  <title>Opening a pull request early, on purpose</title>
  <style>
    .draft-pull-requests-bg   { fill: #f8fafc; }
    .draft-pull-requests-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .draft-pull-requests-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .draft-pull-requests-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .draft-pull-requests-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .draft-pull-requests-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .draft-pull-requests-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .draft-pull-requests-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .draft-pull-requests-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .draft-pull-requests-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .draft-pull-requests-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .draft-pull-requests-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .draft-pull-requests-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .draft-pull-requests-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .draft-pull-requests-stage { opacity: 1; }

    .draft-pull-requests-s0 { animation-delay: 0.00s; }
    .draft-pull-requests-e0 { animation-delay: 0.00s; }
    .draft-pull-requests-s1 { animation-delay: 1.28s; }
    .draft-pull-requests-e1 { animation-delay: 1.28s; }
    .draft-pull-requests-s2 { animation-delay: 2.56s; }
    .draft-pull-requests-e2 { animation-delay: 2.56s; }
    .draft-pull-requests-s3 { animation-delay: 3.84s; }
    .draft-pull-requests-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .draft-pull-requests-conn  { animation: draft-pull-requests-trace 6.4s ease-in-out infinite; }
      .draft-pull-requests-stage { animation: draft-pull-requests-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes draft-pull-requests-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes draft-pull-requests-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .draft-pull-requests-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .draft-pull-requests-stage { animation: draft-pull-requests-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes draft-pull-requests-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="draft-pull-requests-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="draft-pull-requests-bg" width="980" height="322"/>
  <text class="draft-pull-requests-h1"  x="30" y="40">Opening a pull request early, on purpose</text>
  <text class="draft-pull-requests-sub" x="30" y="64">A draft asks for direction, not approval.</text>
  <g class="draft-pull-requests-stage draft-pull-requests-s0">
    <rect class="draft-pull-requests-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="draft-pull-requests-step" x="44" y="142">01</text>
    <text class="draft-pull-requests-name" x="70" y="142">Open it before it is finished</text>
    <text class="draft-pull-requests-desc" x="44" y="166">Marked draft, so nobody is asked</text>
    <text class="draft-pull-requests-desc" x="44" y="182">to approve it yet.</text>
  </g>
  <line class="draft-pull-requests-line draft-pull-requests-conn draft-pull-requests-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#draft-pull-requests-tip)"/>
  <g class="draft-pull-requests-stage draft-pull-requests-s1">
    <rect class="draft-pull-requests-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="draft-pull-requests-step" x="280" y="142">02</text>
    <text class="draft-pull-requests-name" x="306" y="142">CI runs anyway</text>
    <text class="draft-pull-requests-desc" x="280" y="166">So you find the build and test</text>
    <text class="draft-pull-requests-desc" x="280" y="182">problems while still working.</text>
    <text class="draft-pull-requests-edge" x="280" y="242">early signal</text>
  </g>
  <line class="draft-pull-requests-line draft-pull-requests-conn draft-pull-requests-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#draft-pull-requests-tip)"/>
  <g class="draft-pull-requests-stage draft-pull-requests-s2">
    <rect class="draft-pull-requests-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="draft-pull-requests-step" x="516" y="142">03</text>
    <text class="draft-pull-requests-name" x="542" y="142">Ask a specific question</text>
    <text class="draft-pull-requests-desc" x="516" y="166">"Is this the right approach?" —</text>
    <text class="draft-pull-requests-desc" x="516" y="182">before you have built all of it.</text>
  </g>
  <line class="draft-pull-requests-line draft-pull-requests-conn draft-pull-requests-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#draft-pull-requests-tip)"/>
  <g class="draft-pull-requests-stage draft-pull-requests-s3">
    <rect class="draft-pull-requests-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="draft-pull-requests-step" x="752" y="142">04</text>
    <text class="draft-pull-requests-name" x="778" y="142">Mark it ready when it is</text>
    <text class="draft-pull-requests-desc" x="752" y="166">Now reviewers are asked to</text>
    <text class="draft-pull-requests-desc" x="752" y="182">approve, on something already</text>
    <text class="draft-pull-requests-desc" x="752" y="198">shaped by their input.</text>
  </g>
  <text class="draft-pull-requests-sub" x="30" y="304">This addresses the worst review outcome: a finished, polished change that took a week and went in the wrong direction, discovered at the point where nobody wants to say so.</text>
</svg>
