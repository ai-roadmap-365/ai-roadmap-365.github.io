<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>The life of a pull request, from branching off main through review and checks to a merge back into main</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The life of a pull request</text>

  <!-- Branch -->
  <rect x="30" y="70" width="150" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="105" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Branch</text>
  <text x="105" y="120" text-anchor="middle" font-size="14" fill="#1a202c">off main, commit</text>

  <!-- Open PR -->
  <rect x="220" y="70" width="150" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="295" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Open PR</text>
  <text x="295" y="120" text-anchor="middle" font-size="14" fill="#1a202c">title + description</text>

  <!-- Review -->
  <rect x="410" y="70" width="150" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="485" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3a. Review</text>
  <text x="485" y="120" text-anchor="middle" font-size="14" fill="#1a202c">comments, verdict</text>

  <!-- Checks -->
  <rect x="410" y="170" width="150" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="485" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3b. Checks (CI)</text>
  <text x="485" y="220" text-anchor="middle" font-size="14" fill="#1a202c">build and tests</text>

  <!-- Iterate -->
  <rect x="220" y="170" width="150" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="295" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Iterate</text>
  <text x="295" y="220" text-anchor="middle" font-size="14" fill="#1a202c">push fixes</text>

  <!-- Merge -->
  <rect x="600" y="120" width="130" height="66" fill="#bbf7d0" stroke="#166534" stroke-width="2" rx="8"/>
  <text x="665" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">5. Merge</text>
  <text x="665" y="170" text-anchor="middle" font-size="14" fill="#1a202c">into main</text>

  <!-- Arrows: branch -> open -->
  <line x1="180" y1="103" x2="212" y2="103" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="220,103 206,96 206,110" fill="#1d4ed8"/>

  <!-- open -> review -->
  <line x1="370" y1="103" x2="402" y2="103" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="410,103 396,96 396,110" fill="#1d4ed8"/>

  <!-- open -> checks (branch downward split) -->
  <line x1="295" y1="136" x2="295" y2="203" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="295" y1="203" x2="402" y2="203" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="5 4"/>
  <polygon points="410,203 396,196 396,210" fill="#1d4ed8"/>

  <!-- review -> iterate (feedback loop) -->
  <line x1="485" y1="136" x2="485" y2="152" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="485" y1="152" x2="295" y2="152" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="295" y1="152" x2="295" y2="164" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="295,170 288,156 302,156" fill="#1d4ed8"/>
  <text x="390" y="146" text-anchor="middle" font-size="13" fill="#1d4ed8">request changes</text>

  <!-- iterate -> review (re-review after push) -->
  <line x1="345" y1="185" x2="360" y2="185" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="360" y1="185" x2="360" y2="119" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="360,119 353,133 367,133" fill="#1d4ed8"/>
  <text x="352" y="260" text-anchor="middle" font-size="13" fill="#1a202c">push updates re-run review + checks</text>

  <!-- review -> merge (approved) -->
  <line x1="560" y1="120" x2="596" y2="140" stroke="#166534" stroke-width="3"/>
  <polygon points="600,143 585,140 590,127" fill="#166534"/>
  <text x="583" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">approved</text>

  <!-- checks -> merge (green) -->
  <line x1="560" y1="197" x2="596" y2="170" stroke="#166534" stroke-width="3"/>
  <polygon points="600,166 588,177 583,164" fill="#166534"/>
  <text x="583" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">green</text>

  <!-- After merge note -->
  <rect x="30" y="330" width="700" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Merge only when required approvals AND all checks are satisfied</text>
  <text x="380" y="382" text-anchor="middle" font-size="14" fill="#1a202c">The branch is then deleted; its commits and the whole review discussion live on in main's history.</text>
  <text x="380" y="401" text-anchor="middle" font-size="14" fill="#1a202c">Protected main refuses any change that skips this gate.</text>
</svg>
