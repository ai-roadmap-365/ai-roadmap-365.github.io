<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The strategy decides what main looks like afterwards.">
  <title>The same change, three histories</title>
  <style>
    .merge-strategy-shapes-bg   { fill: #f8fafc; }
    .merge-strategy-shapes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-strategy-shapes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-strategy-shapes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-strategy-shapes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-strategy-shapes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-strategy-shapes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-strategy-shapes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .merge-strategy-shapes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .merge-strategy-shapes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .merge-strategy-shapes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .merge-strategy-shapes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .merge-strategy-shapes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .merge-strategy-shapes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .merge-strategy-shapes-stage { opacity: 1; }

    .merge-strategy-shapes-s0 { animation-delay: 0.00s; }
    .merge-strategy-shapes-e0 { animation-delay: 0.00s; }
    .merge-strategy-shapes-s1 { animation-delay: 1.50s; }
    .merge-strategy-shapes-e1 { animation-delay: 1.50s; }
    .merge-strategy-shapes-s2 { animation-delay: 3.00s; }
    .merge-strategy-shapes-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .merge-strategy-shapes-conn  { animation: merge-strategy-shapes-trace 6s ease-in-out infinite; }
      .merge-strategy-shapes-stage { animation: merge-strategy-shapes-arrive 6s ease-in-out infinite; }
    }
    @keyframes merge-strategy-shapes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes merge-strategy-shapes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .merge-strategy-shapes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .merge-strategy-shapes-stage { animation: merge-strategy-shapes-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes merge-strategy-shapes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="merge-strategy-shapes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="merge-strategy-shapes-bg" width="980" height="322"/>
  <text class="merge-strategy-shapes-h1"  x="30" y="40">The same change, three histories</text>
  <text class="merge-strategy-shapes-sub" x="30" y="64">The strategy decides what main looks like afterwards.</text>
  <g class="merge-strategy-shapes-stage merge-strategy-shapes-s0">
    <rect class="merge-strategy-shapes-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="merge-strategy-shapes-step" x="44" y="142">01</text>
    <text class="merge-strategy-shapes-name" x="70" y="142">Merge commit</text>
    <text class="merge-strategy-shapes-desc" x="44" y="166">Every branch commit preserved, plus a merge</text>
    <text class="merge-strategy-shapes-desc" x="44" y="182">point. A diamond in the graph.</text>
    <text class="merge-strategy-shapes-edge" x="44" y="242">full record</text>
  </g>
  <line class="merge-strategy-shapes-line merge-strategy-shapes-conn merge-strategy-shapes-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#merge-strategy-shapes-tip)"/>
  <g class="merge-strategy-shapes-stage merge-strategy-shapes-s1">
    <rect class="merge-strategy-shapes-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="merge-strategy-shapes-step" x="359" y="142">02</text>
    <text class="merge-strategy-shapes-name" x="385" y="142">Squash and merge</text>
    <text class="merge-strategy-shapes-desc" x="359" y="166">One commit on main. The branch's steps are</text>
    <text class="merge-strategy-shapes-desc" x="359" y="182">discarded.</text>
    <text class="merge-strategy-shapes-edge" x="359" y="242">one per PR</text>
  </g>
  <line class="merge-strategy-shapes-line merge-strategy-shapes-conn merge-strategy-shapes-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#merge-strategy-shapes-tip)"/>
  <g class="merge-strategy-shapes-stage merge-strategy-shapes-s2">
    <rect class="merge-strategy-shapes-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="merge-strategy-shapes-step" x="674" y="142">03</text>
    <text class="merge-strategy-shapes-name" x="700" y="142">Rebase and merge</text>
    <text class="merge-strategy-shapes-desc" x="674" y="166">Each commit replayed onto main. Linear, and</text>
    <text class="merge-strategy-shapes-desc" x="674" y="182">the steps survive.</text>
    <text class="merge-strategy-shapes-edge" x="674" y="242">linear</text>
  </g>
  <text class="merge-strategy-shapes-sub" x="30" y="304">None is correct in general. Squash is popular because it makes each pull request a single revertible unit; the price is that the intermediate history is gone for good.</text>
</svg>
