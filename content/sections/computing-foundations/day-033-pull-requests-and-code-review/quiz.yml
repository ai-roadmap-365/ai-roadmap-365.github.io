questions:
  - question: 'What is a pull request?'
    options:
      - 'A Git command that instantly merges one branch into another'
      - 'A formal proposal to merge one branch into another, wrapped in a review conversation and merge gates'
      - 'A backup copy of the main branch kept on the remote'
      - 'A message that pulls the latest changes from the remote to your laptop'
    answer_index: 1
    explanation: 'A pull request is a proposal to integrate a branch, layered with a diff, discussion, checks, and approvals. Git itself has no pull-request command; hosting platforms build the feature on top of Git branches and merges.'

  - question: 'GitHub calls it a "pull request." What does GitLab call the same workflow?'
    options:
      - 'A push request'
      - 'A branch review'
      - 'A merge request'
      - 'A commit proposal'
    answer_index: 2
    explanation: 'GitLab uses the name "merge request" (MR) for the identical workflow. The two terms describe the same branch-based, reviewed-then-merged process.'

  - question: 'Why are small, focused pull requests generally better than large ones?'
    options:
      - 'They use less disk space on the remote server'
      - 'They are read carefully and merge faster, while large PRs get shallow reviews that hide bugs'
      - 'Git refuses to merge pull requests above a certain size'
      - 'They automatically skip the review step'
    answer_index: 1
    explanation: 'A small PR touching one concern can be reviewed thoroughly in minutes; a large PR mixing many changes buries the important lines and pushes reviewers toward rubber-stamping, which defeats the purpose of review.'

  - question: 'A reviewer sets their state to "request changes" on your pull request. What does this mean?'
    options:
      - 'The pull request is rejected and must be closed and reopened'
      - 'The reviewer is formally blocking the merge until you address their feedback — a normal step you respond to by pushing fixes'
      - 'The change has been merged with modifications'
      - 'Continuous integration has failed'
    answer_index: 1
    explanation: 'Requesting changes blocks the merge until the feedback is addressed, but it is ordinary iteration, not rejection. You push more commits to the same branch, the PR updates, and the reviewer re-reviews.'

  - question: 'Which merge strategy combines all of a branch''s commits into a single new commit on main?'
    options:
      - 'Merge commit'
      - 'Rebase and merge'
      - 'Squash and merge'
      - 'Fast-forward merge'
    answer_index: 2
    explanation: 'Squash and merge collapses every commit on the branch into one commit on main, producing a flat history where each pull request is a single, revertible unit. The intermediate commits are discarded.'

  - question: 'What does protecting the main branch accomplish?'
    options:
      - 'It encrypts the branch so only administrators can read it'
      - 'It refuses direct pushes and forces every change through a pull request that meets the branch''s rules'
      - 'It makes the branch read-only forever'
      - 'It automatically backs up every commit to a second server'
    answer_index: 1
    explanation: 'A protected branch cannot be pushed to directly; the only way in is a pull request that satisfies rules such as required approvals and passing checks. This is what lets a team trust that main is always in a releasable state.'

  - question: 'What are CI checks on a pull request?'
    options:
      - 'Comments left by senior reviewers'
      - 'Automated builds, tests, and linters that run on the change and report pass or fail before a human reviews it'
      - 'A manual checklist the author fills in by hand'
      - 'The list of files the pull request modifies'
    answer_index: 1
    explanation: 'Continuous-integration checks run automatically on every push to the pull request, building the code and running tests and linters. Their green or red status is one of the gates a protected branch can require before merging.'

  - question: 'Which of the following belongs in a good pull-request description?'
    options:
      - 'Nothing — the diff speaks for itself'
      - 'What the change does, why it is needed, and how it was verified'
      - 'A copy of every command you typed while working'
      - 'The reviewer''s home address so they can be reached quickly'
    answer_index: 1
    explanation: 'A strong description states what changed, the reason for the change, and how the author confirmed it works. It lets a reviewer understand intent quickly instead of reverse-engineering it from the diff, and it becomes a permanent record of why the change was made.'
