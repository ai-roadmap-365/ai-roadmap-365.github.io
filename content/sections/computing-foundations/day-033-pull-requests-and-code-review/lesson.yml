id: D033
day: 33
slug: pull-requests-and-code-review
title: 'Pull Requests and Code Review'
section: computing-foundations
subsection: developer-workflow
week: 5
learning_promise: 'After this lesson you will be able to explain the pull-request and code-review workflow end to end — propose a change on a branch, open a PR, review and iterate, choose a merge strategy, and protect a branch — and rehearse the whole loop locally with plain Git.'
objectives:
  - 'Describe the pull-request (merge-request) model and explain why teams route every change to shared code through it instead of pushing directly to main'
  - 'Name the parts of a pull request page — title and description, diff, inline comments, checks, reviewer states, merge button — and say what each contributes to a review'
  - 'Write the anatomy of a good pull request: small, focused, clearly described, and accompanied by a test'
  - 'Distinguish the three review verdicts (approve, comment, request changes) and treat requesting changes as normal iteration rather than rejection'
  - 'Compare the merge-commit, squash-and-merge, and rebase-and-merge strategies and the commit history each produces'
  - 'Explain protected branches, required reviews, and CI checks as the gate that keeps main releasable'
  - 'Simulate the full pull-request loop locally with branches, diffs, a no-fast-forward merge, and a squash merge'
prerequisites:
  - 'Days 30–32: creating branches, committing, merging, and pushing to a remote with Git'
  - 'A terminal with Git installed (version 2.23 or newer preferred for git switch; older versions work with git checkout)'
reading_time_minutes: 40
practical_time_minutes: 30
last_verified: '2026-07-12'
tags: [git, github, pull-requests, code-review, collaboration, developer-workflow]
