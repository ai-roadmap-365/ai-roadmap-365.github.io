visuals:
  - id: pr-lifecycle
    file: assets/pr-lifecycle.svg
    type: flowchart
    title: 'The life of a pull request'
    alt: 'Flowchart: the life of a pull request from branch to merge'
    description: 'A left-to-right flow from branching off main and committing, through opening the pull request, which fans out into parallel human review and automated CI checks; a feedback loop returns to iterate by pushing fixes, and only an approved review plus green checks unlocks the merge back into a protected main.'
  - id: review-anatomy
    file: assets/review-anatomy.svg
    type: diagram
    title: 'Anatomy of a pull request'
    alt: 'Diagram: the anatomy of a pull request page'
    description: 'A single pull request page broken into its parts: a title and description at the top, a colour-coded diff with an inline comment attached to a specific line, a panel of green CI checks, and a reviewers panel showing an approval that together enable the merge button.'
