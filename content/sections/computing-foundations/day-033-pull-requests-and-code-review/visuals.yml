visuals:
  - id: pr-lifecycle
    file: assets/pr-lifecycle.svg
    type: flowchart
    title: 'The life of a pull request'
    alt: 'Flowchart: the life of a pull request from branch to merge'
    description: 'A left-to-right flow from branching off main and committing, through opening the pull request, which fans out into parallel human review and automated CI checks; a feedback loop returns to iterate by pushing fixes, and only an approved review plus green checks unlocks the merge back into a protected main.'
  - id: review-anatomy
    file: assets/review-anatomy.svg
    type: diagram
    title: 'Anatomy of a pull request'
    alt: 'Diagram: the anatomy of a pull request page'
    description: 'A single pull request page broken into its parts: a title and description at the top, a colour-coded diff with an inline comment attached to a specific line, a panel of green CI checks, and a reviewers panel showing an approval that together enable the merge button.'
  - id: what-review-catches
    file: assets/what-review-catches.svg
    type: diagram
    title: 'What a machine can check, and what only a person can'
    alt: 'Diagram: checks a machine can run compared with what human review is for'
    description: 'A two-column comparison of automated checks and human review, showing which failures each catches and why machine-learning code needs the human column especially.'
  - id: description-quality
    file: assets/description-quality.svg
    type: diagram
    title: 'The description is the biggest lever'
    alt: 'Diagram: a poor pull request description compared with a useful one'
    description: 'A two-column comparison of an uninformative pull request description against one that states the problem, cause, fix and verification, with the effect on review time.'
  - id: review-size
    file: assets/review-size.svg
    type: diagram
    title: 'Review quality falls off a cliff with size'
    alt: 'Diagram: a small pull request compared with a large one'
    description: 'A two-column comparison of small and large pull requests, covering the depth of review each receives and why adding reviewers or time does not compensate.'
  - id: machines-or-humans
    file: assets/machines-or-humans.svg
    type: diagram
    title: 'What to automate, and what to ask a person'
    alt: 'Diagram: what automated checks should catch compared with what review is for'
    description: 'A two-column comparison of the defects automated checks can find against the questions only a human reviewer can answer.'
  - id: merge-strategy-shapes
    file: assets/merge-strategy-shapes.svg
    type: diagram
    title: 'The same change, three histories'
    alt: 'Diagram: the history produced by each merge strategy'
    description: 'A three-stage comparison of the commit history produced by a merge commit, a squash merge and a rebase merge for the same branch.'
  - id: protected-branch
    file: assets/protected-branch.svg
    type: diagram
    title: 'What a protected branch actually prevents'
    alt: 'Diagram: the rules a protected branch enforces'
    description: 'A four-stage explanation of branch protection covering the refusal of direct pushes, required approvals, required checks, and the guarantee this produces.'
  - id: reviewing-model-changes
    file: assets/reviewing-model-changes.svg
    type: diagram
    title: 'Reviewing a model change'
    alt: 'Diagram: what makes a machine learning change reviewable'
    description: 'A two-column comparison of an unreviewable model change against one that supplies the evidence a reviewer needs, covering configuration, metrics and the evaluation set.'
  - id: email-to-pull-request
    file: assets/email-to-pull-request.svg
    type: diagram
    title: 'Where the name comes from'
    alt: 'Diagram: the progression from mailed patches to hosted pull requests'
    description: 'A four-stage progression from emailed patches through hosted forks to the modern pull request with automated checks, noting that Git itself has no pull request concept.'
  - id: review-comment-tone
    file: assets/review-comment-tone.svg
    type: diagram
    title: 'Review the code, not the person'
    alt: 'Diagram: unhelpful review comments compared with useful ones'
    description: 'A two-column comparison of review comments phrased as criticism of the author against the same points phrased as observations about the code.'
  - id: draft-pull-requests
    file: assets/draft-pull-requests.svg
    type: diagram
    title: 'Opening a pull request early, on purpose'
    alt: 'Diagram: when to open a draft pull request'
    description: 'A four-stage sequence describing the use of draft pull requests to gather early feedback on direction before the implementation is complete.'
