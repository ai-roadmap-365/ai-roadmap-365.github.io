terms:
  - term: pull request
    definition: 'A formal proposal to merge the commits on one branch into another, presented with a diff, a description, a review discussion, and merge gates; abbreviated PR.'
  - term: merge request
    definition: 'GitLab''s name for a pull request — the identical branch-based, reviewed-then-merged workflow; abbreviated MR.'
  - term: code review
    definition: 'The practice of having one or more people read a proposed change before it is merged, to catch bugs, share knowledge, and improve design.'
  - term: diff
    definition: 'The line-by-line comparison between two versions of the code, showing exactly which lines a change adds, removes, and modifies.'
  - term: approval
    definition: 'A reviewer''s recorded verdict that a pull request is good enough to merge; protected branches can require one or more approvals before the merge button unlocks.'
  - term: request changes
    definition: 'A reviewer''s verdict that formally blocks the merge until the author addresses specific feedback; a normal step in iteration, not a rejection.'
  - term: squash merge
    definition: 'A merge strategy that combines all of a branch''s commits into a single new commit on the target branch, producing a flat, one-commit-per-pull-request history.'
  - term: protected branch
    definition: 'A branch the hosting platform refuses to let anyone push to directly; changes may enter it only through a pull request that satisfies its rules.'
  - term: CI check
    definition: 'A continuous-integration check — an automated build, test, or linter that runs on a pull request and reports pass or fail before a human reviews the change.'
  - term: reviewer
    definition: 'A person asked to read a pull request and record a verdict — approve, comment, or request changes — on whether it should be merged.'
  - term: draft pull request
    definition: 'A pull request marked as work-in-progress to signal it is not yet ready for formal review or merge; it is opened for review by marking it ready.'
  - term: merge commit
    definition: 'A commit with two parents that joins a branch back into the target branch, preserving the branch''s individual commits and recording where the merge happened.'
