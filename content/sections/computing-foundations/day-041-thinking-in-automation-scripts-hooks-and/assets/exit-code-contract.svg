<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every rung above the script reads exactly one thing.">
  <title>The exit code is the contract</title>
  <style>
    .exit-code-contract-bg   { fill: #f8fafc; }
    .exit-code-contract-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-code-contract-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-code-contract-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-code-contract-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-code-contract-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-code-contract-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exit-code-contract-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exit-code-contract-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exit-code-contract-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exit-code-contract-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exit-code-contract-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exit-code-contract-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exit-code-contract-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exit-code-contract-stage { opacity: 1; }

    .exit-code-contract-s0 { animation-delay: 0.00s; }
    .exit-code-contract-e0 { animation-delay: 0.00s; }
    .exit-code-contract-s1 { animation-delay: 1.28s; }
    .exit-code-contract-e1 { animation-delay: 1.28s; }
    .exit-code-contract-s2 { animation-delay: 2.56s; }
    .exit-code-contract-e2 { animation-delay: 2.56s; }
    .exit-code-contract-s3 { animation-delay: 3.84s; }
    .exit-code-contract-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exit-code-contract-conn  { animation: exit-code-contract-trace 6.4s ease-in-out infinite; }
      .exit-code-contract-stage { animation: exit-code-contract-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exit-code-contract-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exit-code-contract-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exit-code-contract-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exit-code-contract-stage { animation: exit-code-contract-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exit-code-contract-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exit-code-contract-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exit-code-contract-bg" width="980" height="322"/>
  <text class="exit-code-contract-h1"  x="30" y="40">The exit code is the contract</text>
  <text class="exit-code-contract-sub" x="30" y="64">Every rung above the script reads exactly one thing.</text>
  <g class="exit-code-contract-stage exit-code-contract-s0">
    <rect class="exit-code-contract-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exit-code-contract-step" x="44" y="142">01</text>
    <text class="exit-code-contract-name" x="70" y="142">You run it by hand</text>
    <text class="exit-code-contract-desc" x="44" y="166">You read the output. The exit</text>
    <text class="exit-code-contract-desc" x="44" y="182">code barely matters yet.</text>
    <text class="exit-code-contract-edge" x="44" y="242">$?</text>
  </g>
  <line class="exit-code-contract-line exit-code-contract-conn exit-code-contract-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exit-code-contract-tip)"/>
  <g class="exit-code-contract-stage exit-code-contract-s1">
    <rect class="exit-code-contract-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exit-code-contract-step" x="280" y="142">02</text>
    <text class="exit-code-contract-name" x="306" y="142">A scheduler runs it</text>
    <text class="exit-code-contract-desc" x="280" y="166">Nobody reads the output. The</text>
    <text class="exit-code-contract-desc" x="280" y="182">exit code is the only signal.</text>
    <text class="exit-code-contract-edge" x="280" y="242">cron</text>
  </g>
  <line class="exit-code-contract-line exit-code-contract-conn exit-code-contract-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exit-code-contract-tip)"/>
  <g class="exit-code-contract-stage exit-code-contract-s2">
    <rect class="exit-code-contract-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exit-code-contract-step" x="516" y="142">03</text>
    <text class="exit-code-contract-name" x="542" y="142">A hook runs it</text>
    <text class="exit-code-contract-desc" x="516" y="166">Non-zero rejects the commit.</text>
    <text class="exit-code-contract-desc" x="516" y="182">Zero lets it through.</text>
    <text class="exit-code-contract-edge" x="516" y="242">blocks</text>
  </g>
  <line class="exit-code-contract-line exit-code-contract-conn exit-code-contract-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exit-code-contract-tip)"/>
  <g class="exit-code-contract-stage exit-code-contract-s3">
    <rect class="exit-code-contract-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exit-code-contract-step" x="752" y="142">04</text>
    <text class="exit-code-contract-name" x="778" y="142">A pipeline runs it</text>
    <text class="exit-code-contract-desc" x="752" y="166">Non-zero stops the line. Every</text>
    <text class="exit-code-contract-desc" x="752" y="182">later stage depends on it.</text>
    <text class="exit-code-contract-edge" x="752" y="242">gates</text>
  </g>
  <text class="exit-code-contract-sub" x="30" y="304">A script that always exits 0 is invisible to every layer above it: it can be scheduled, hooked and piped, and none of them will ever know it failed. set -euo pipefail from Day 12 is what makes the contract honest.</text>
</svg>
