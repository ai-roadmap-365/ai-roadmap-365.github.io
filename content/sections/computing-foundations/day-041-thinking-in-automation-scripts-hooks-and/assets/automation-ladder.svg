<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" font-family="system-ui, sans-serif">
  <title>The automation ladder: manual work, then a script, then scheduling, then a git hook, then a CI pipeline, each rung adding leverage</title>
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The automation ladder</text>

  <!-- Rungs, lowest leverage at the bottom -->
  <rect x="60" y="360" width="360" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="240" y="384" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Manual</text>
  <text x="240" y="404" text-anchor="middle" font-size="13" fill="#1a202c">you type the steps by hand every time</text>

  <rect x="60" y="292" width="360" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="240" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Script</text>
  <text x="240" y="336" text-anchor="middle" font-size="13" fill="#1a202c">the steps captured in one file you run</text>

  <rect x="60" y="224" width="360" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="240" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Scheduled</text>
  <text x="240" y="268" text-anchor="middle" font-size="13" fill="#1a202c">cron runs the script on a clock</text>

  <rect x="60" y="156" width="360" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="240" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Hook</text>
  <text x="240" y="200" text-anchor="middle" font-size="13" fill="#1a202c">git runs the script on an event (a commit)</text>

  <rect x="60" y="88" width="360" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="240" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">5. CI pipeline</text>
  <text x="240" y="132" text-anchor="middle" font-size="13" fill="#1a202c">a shared server runs stages on every push</text>

  <!-- Leverage arrow -->
  <line x1="470" y1="410" x2="470" y2="100" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="470,88 463,104 477,104" fill="#1d4ed8"/>
  <text x="500" y="260" font-size="15" font-weight="bold" fill="#1d4ed8" transform="rotate(-90 500 260)" text-anchor="middle">more leverage, less human effort</text>

  <text x="360" y="446" text-anchor="middle" font-size="14" fill="#1a202c">Each rung reuses the script below it; you climb only as far as the task is worth.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 470 410 L 470 100" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
