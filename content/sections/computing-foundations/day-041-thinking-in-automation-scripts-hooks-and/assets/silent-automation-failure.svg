<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not with a crash. With nothing.">
  <title>How unwatched automation actually fails</title>
  <style>
    .silent-automation-failure-bg   { fill: #f8fafc; }
    .silent-automation-failure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-automation-failure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-automation-failure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-automation-failure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-automation-failure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-automation-failure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .silent-automation-failure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .silent-automation-failure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .silent-automation-failure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .silent-automation-failure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .silent-automation-failure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .silent-automation-failure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .silent-automation-failure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .silent-automation-failure-stage { opacity: 1; }

    .silent-automation-failure-s0 { animation-delay: 0.00s; }
    .silent-automation-failure-e0 { animation-delay: 0.00s; }
    .silent-automation-failure-s1 { animation-delay: 1.28s; }
    .silent-automation-failure-e1 { animation-delay: 1.28s; }
    .silent-automation-failure-s2 { animation-delay: 2.56s; }
    .silent-automation-failure-e2 { animation-delay: 2.56s; }
    .silent-automation-failure-s3 { animation-delay: 3.84s; }
    .silent-automation-failure-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .silent-automation-failure-conn  { animation: silent-automation-failure-trace 6.4s ease-in-out infinite; }
      .silent-automation-failure-stage { animation: silent-automation-failure-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes silent-automation-failure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes silent-automation-failure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .silent-automation-failure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .silent-automation-failure-stage { animation: silent-automation-failure-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes silent-automation-failure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="silent-automation-failure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="silent-automation-failure-bg" width="980" height="322"/>
  <text class="silent-automation-failure-h1"  x="30" y="40">How unwatched automation actually fails</text>
  <text class="silent-automation-failure-sub" x="30" y="64">Not with a crash. With nothing.</text>
  <g class="silent-automation-failure-stage silent-automation-failure-s0">
    <rect class="silent-automation-failure-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="silent-automation-failure-step" x="44" y="142">01</text>
    <text class="silent-automation-failure-name" x="70" y="142">Something changes</text>
    <text class="silent-automation-failure-desc" x="44" y="166">A path moves, a credential</text>
    <text class="silent-automation-failure-desc" x="44" y="182">expires, an API changes its</text>
    <text class="silent-automation-failure-desc" x="44" y="198">response.</text>
  </g>
  <line class="silent-automation-failure-line silent-automation-failure-conn silent-automation-failure-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#silent-automation-failure-tip)"/>
  <g class="silent-automation-failure-stage silent-automation-failure-s1">
    <rect class="silent-automation-failure-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="silent-automation-failure-step" x="280" y="142">02</text>
    <text class="silent-automation-failure-name" x="306" y="142">The job fails</text>
    <text class="silent-automation-failure-desc" x="280" y="166">Or worse, succeeds while doing</text>
    <text class="silent-automation-failure-desc" x="280" y="182">nothing at all.</text>
  </g>
  <line class="silent-automation-failure-line silent-automation-failure-conn silent-automation-failure-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#silent-automation-failure-tip)"/>
  <g class="silent-automation-failure-stage silent-automation-failure-s2">
    <rect class="silent-automation-failure-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="silent-automation-failure-step" x="516" y="142">03</text>
    <text class="silent-automation-failure-name" x="542" y="142">No signal</text>
    <text class="silent-automation-failure-desc" x="516" y="166">No log, or a log nobody reads.</text>
    <text class="silent-automation-failure-desc" x="516" y="182">Exit code zero, or unchecked.</text>
    <text class="silent-automation-failure-edge" x="516" y="242">silence</text>
  </g>
  <line class="silent-automation-failure-line silent-automation-failure-conn silent-automation-failure-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#silent-automation-failure-tip)"/>
  <g class="silent-automation-failure-stage silent-automation-failure-s3">
    <rect class="silent-automation-failure-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="silent-automation-failure-step" x="752" y="142">04</text>
    <text class="silent-automation-failure-name" x="778" y="142">Discovered weeks later</text>
    <text class="silent-automation-failure-desc" x="752" y="166">When someone needs what it</text>
    <text class="silent-automation-failure-desc" x="752" y="182">should have been producing.</text>
    <text class="silent-automation-failure-edge" x="752" y="242">weeks</text>
  </g>
  <text class="silent-automation-failure-sub" x="30" y="304">The fix is not more reliable automation; it is observable automation. A timestamped log, an honest exit code, and an alert on failure turn a silent liability into something you can trust.</text>
</svg>
