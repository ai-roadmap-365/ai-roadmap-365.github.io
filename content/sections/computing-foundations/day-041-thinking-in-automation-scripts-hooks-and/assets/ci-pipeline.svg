<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" font-family="system-ui, sans-serif">
  <title>A continuous integration pipeline: a push triggers lint, then test, then build, then deploy, with a failing gate stopping the line before deploy</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A CI pipeline runs on every push</text>

  <!-- Trigger -->
  <rect x="30" y="90" width="110" height="64" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="85" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">git push</text>
  <text x="85" y="138" text-anchor="middle" font-size="12" fill="#1a202c">the trigger</text>

  <!-- Stages -->
  <rect x="180" y="90" width="120" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="240" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">lint</text>
  <text x="240" y="138" text-anchor="middle" font-size="12" fill="#1a202c">style + format</text>

  <rect x="330" y="90" width="120" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="390" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">test</text>
  <text x="390" y="138" text-anchor="middle" font-size="12" fill="#1a202c">run checks</text>

  <rect x="480" y="90" width="120" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="540" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">build</text>
  <text x="540" y="138" text-anchor="middle" font-size="12" fill="#1a202c">package it</text>

  <rect x="630" y="90" width="110" height="64" fill="#bbf7d0" stroke="#15803d" stroke-width="2" rx="8"/>
  <text x="685" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">deploy</text>
  <text x="685" y="138" text-anchor="middle" font-size="12" fill="#1a202c">ship it</text>

  <!-- Arrows between stages -->
  <line x1="140" y1="122" x2="172" y2="122" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="180,122 166,115 166,129" fill="#1d4ed8"/>
  <line x1="300" y1="122" x2="322" y2="122" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="330,122 316,115 316,129" fill="#1d4ed8"/>
  <line x1="450" y1="122" x2="472" y2="122" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="480,122 466,115 466,129" fill="#1d4ed8"/>
  <line x1="600" y1="122" x2="622" y2="122" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="630,122 616,115 616,129" fill="#1d4ed8"/>

  <!-- Fail-fast gate -->
  <line x1="390" y1="154" x2="390" y2="228" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="390,236 383,220 397,220" fill="#b91c1c"/>
  <rect x="250" y="238" width="280" height="70" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="390" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">A stage fails? Stop the line.</text>
  <text x="390" y="286" text-anchor="middle" font-size="13" fill="#1a202c">Later stages never run; deploy is protected.</text>

  <text x="380" y="342" text-anchor="middle" font-size="14" fill="#1a202c">Fail fast: the cheapest, fastest checks run first, so mistakes are caught early.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 140 122 L 172 122" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 390 154 L 390 228" stroke="#b91c1c" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
