visuals:
  - id: automation-ladder
    file: assets/automation-ladder.svg
    type: diagram
    title: 'The automation ladder'
    alt: 'Diagram: the automation ladder, from manual work up through scripts, scheduling, hooks, and a CI pipeline, with increasing leverage'
    description: 'A five-rung ladder from manual work at the bottom, up through a script, a cron-scheduled script, a git hook that runs on an event, and a CI pipeline on a shared server at the top, with an arrow showing that each rung adds leverage while reusing the script below it.'
  - id: ci-pipeline
    file: assets/ci-pipeline.svg
    type: flowchart
    title: 'A CI pipeline runs on every push'
    alt: 'Flowchart: a CI pipeline where a push triggers lint, then test, then build, then deploy, with a failing gate stopping the line before deploy'
    description: 'A left-to-right flow from a git push through the lint, test, and build stages to deploy, with a red fail-fast gate showing that when any stage fails the line stops and later stages never run, protecting the deploy step.'
  - id: hook-versus-ci
    file: assets/hook-versus-ci.svg
    type: diagram
    title: 'The same check, run in two places, for two different reasons'
    alt: 'Diagram: a pre-commit hook compared with the same check in continuous integration'
    description: 'A two-column comparison of a local git hook and a CI check, showing that the hook is fast and skippable while CI is authoritative and cannot be bypassed individually.'
  - id: time-or-event
    file: assets/time-or-event.svg
    type: diagram
    title: 'Two kinds of trigger'
    alt: 'Diagram: time-triggered automation compared with event-triggered automation'
    description: 'A two-column comparison of scheduled and event-driven automation, covering what fires each and the work each suits.'
  - id: exit-code-contract
    file: assets/exit-code-contract.svg
    type: diagram
    title: 'The exit code is the contract'
    alt: 'Diagram: how the exit code connects each rung of the automation ladder'
    description: 'A four-stage explanation of how a script''s exit status is the interface every automation layer depends on, from manual runs through schedulers, hooks and pipelines.'
  - id: cheap-first
    file: assets/cheap-first.svg
    type: diagram
    title: 'Why stage order is the main optimisation'
    alt: 'Diagram: a pipeline ordered cheapest-first compared with expensive-first'
    description: 'A two-column comparison of pipeline stage ordering, showing the time to discover a failure when cheap checks run first versus last.'
  - id: secret-in-automation
    file: assets/secret-in-automation.svg
    type: diagram
    title: 'The most damaging automation mistake'
    alt: 'Diagram: a hard-coded secret compared with one supplied through the environment'
    description: 'A two-column comparison of hard-coding credentials in an automation script against reading them from the environment with the value held in a secret store.'
  - id: silent-automation-failure
    file: assets/silent-automation-failure.svg
    type: diagram
    title: 'How unwatched automation actually fails'
    alt: 'Diagram: the stages by which an unwatched automated job fails unnoticed'
    description: 'A four-stage sequence showing an automated job breaking, producing no visible signal, being assumed to work, and the delayed discovery weeks later.'
  - id: worth-automating
    file: assets/worth-automating.svg
    type: diagram
    title: 'Not everything is worth automating'
    alt: 'Diagram: tasks worth automating compared with tasks better done by hand'
    description: 'A two-column comparison of tasks that repay automation against those where the maintenance cost exceeds the saving.'
  - id: local-then-shared
    file: assets/local-then-shared.svg
    type: diagram
    title: 'Two lines of defence, and why you want both'
    alt: 'Diagram: a local hook and a CI check as two layers of the same defence'
    description: 'A four-stage sequence showing a local hook providing immediate private feedback and a CI pipeline providing an unskippable shared gate, running the same underlying script.'
  - id: pipeline-properties
    file: assets/pipeline-properties.svg
    type: diagram
    title: 'Three properties that make a pipeline trustworthy'
    alt: 'Diagram: fail fast, idempotency and reproducibility in a pipeline'
    description: 'A three-stage explanation of the properties that make an automated pipeline dependable: failing fast, being safe to re-run, and producing the same result from the same input.'
