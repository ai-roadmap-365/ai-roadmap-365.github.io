questions:
  - question: 'According to the common heuristic in this lesson, when is the clearest signal that a task is worth turning into a script?'
    options:
      - 'The first time you ever perform it'
      - 'Only after a manager asks you to'
      - 'By the third time you find yourself repeating it'
      - 'Never — every task should be scripted before it is done once'
    answer_index: 2
    explanation: 'The heuristic is "do it once, just do it; do it twice, note the steps; by the third time, script it." The third repetition signals the task is stable and frequent enough that automating it will pay back the cost of building it.'

  - question: 'What triggers a git hook, as opposed to a cron job?'
    options:
      - 'A clock reaching a scheduled time'
      - 'A user logging into the machine'
      - 'A change in the amount of free disk space'
      - 'A git event such as making a commit or pushing'
    answer_index: 3
    explanation: 'A git hook is event-driven: it fires on a git action like a commit (pre-commit) or a push (pre-push). A cron job is time-driven, firing when the clock matches its schedule. That difference is why hooks suit checks-on-change and cron suits time-based jobs.'

  - question: 'In a lint → test → build → deploy pipeline, what does "failing fast" mean?'
    options:
      - 'Stopping the moment a stage fails, so later stages never run'
      - 'Skipping the slow stages to save time'
      - 'Running all four stages as quickly as possible in parallel'
      - 'Deploying first and running the checks afterward'
    answer_index: 0
    explanation: 'Failing fast means the pipeline halts at the first failing stage and reports immediately. Because the cheap, fast checks run first, most mistakes are caught in the first second and the expensive later stages never run on code that was never going to pass.'

  - question: 'Why does a healthy project run both a local pre-commit hook and a CI pipeline, even when they run the same checks?'
    options:
      - 'CI is decorative; the hook does the real work'
      - 'The hook is fast but skippable; CI runs for everyone'
      - 'Running the checks twice makes them more accurate'
      - 'Hooks work only on macOS and CI works only on Linux'
    answer_index: 1
    explanation: 'A local hook is fast and private but skippable (with --no-verify) and only protects developers who installed it. CI runs on a shared server for every change from everyone and cannot be quietly bypassed, so it is the authoritative gate. The two are complementary lines of defense.'

  - question: 'What is the correct way to give an automated deploy script an API token?'
    options:
      - 'Hard-code the token as a variable at the top of the script'
      - 'Commit the token to the repository so the script can always find it'
      - 'Pass it via an environment variable from a secret store'
      - 'Email the token to the whole team before each run'
    answer_index: 2
    explanation: 'Secrets must never be hard-coded or committed, because git history is permanent and copied to every clone. The script should read the secret by name from the environment, with the value stored in an access-controlled secret store or a git-ignored file.'

  - question: 'What does it mean for a pipeline stage to be idempotent?'
    options:
      - 'It runs faster the second time'
      - 'It automatically deploys to production'
      - 'It can only ever be run once'
      - 'Running it twice gives the same result'
    answer_index: 3
    explanation: 'Idempotency means re-running a stage on the same input yields the same result and leaves no state that changes the next run. A stage that appends to a file instead of overwriting it is not idempotent and will eventually surprise you; idempotency is what makes automation safe to re-run.'

  - question: 'Which situation is the best candidate to leave manual rather than automate?'
    options:
      - 'A rare task whose steps change every time'
      - 'A nightly database backup'
      - 'A check that should run before every single commit'
      - 'Running the test suite on every push'
    answer_index: 0
    explanation: 'Automation pays off on repeated tasks with stable, well-understood steps. A task done rarely, whose steps keep changing, turns its automation into a maintenance burden that breaks as fast as you fix it — so it is better left manual until it stabilizes.'

  - question: 'A machine-learning workflow — pull data, preprocess, train, evaluate, deploy — is best understood as what?'
    options:
      - 'A single command that cannot be broken into steps'
      - 'An ordered pipeline where evaluate gates deploy'
      - 'A purely manual process that must be redone by hand each time'
      - 'A cron job that runs once a year'
    answer_index: 1
    explanation: 'An ML workflow is a pipeline with ordered stages and gates, exactly like lint-test-build-deploy. The evaluate stage is a fail-fast gate: if the new model scores worse, the pipeline stops and refuses to deploy it, protecting production the way a failing test stage protects a release.'
