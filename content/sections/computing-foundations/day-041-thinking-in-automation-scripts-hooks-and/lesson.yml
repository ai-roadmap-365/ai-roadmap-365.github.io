slug: thinking-in-automation-scripts-hooks-and
title: 'Thinking in Automation: Scripts, Hooks, and Pipelines'
section: computing-foundations
subsection: developer-workflow
week: 6
learning_promise: 'After this lesson you will be able to decide when a task is worth automating, climb the ladder from a shell script to a git hook to a CI pipeline, and install a real pre-commit quality gate that fails fast — the connective tissue that makes everything else you have learned dependable.'
objectives:
  - 'Apply the "do it three times, then script it" heuristic to decide when automation pays off and when a task should stay manual'
  - 'Place the automation building blocks — scripts, cron scheduling, git hooks, and CI/CD — on a ladder of increasing leverage and name what triggers each'
  - 'Explain the pipeline model of ordered stages (lint, test, build, deploy) and the roles of failing fast, idempotency, and reproducibility'
  - 'Contrast local git hooks with CI checks and justify why a healthy project runs both'
  - 'State the rule for handling secrets in automation and explain why hard-coding a key in a repository is dangerous'
  - 'Install a working pre-commit hook that blocks a bad commit and allows a clean one, and build a tiny pipeline that stops at the first failing stage'
  - 'Connect automation and pipelines to machine-learning practice, recognising an ML workflow as a reproducible, observable pipeline'
prerequisites:
  - 'Comfort running commands in a terminal and writing a basic shell script (Week 2)'
  - 'Basic git: staging files and making commits (Week 5)'
  - 'A computer running macOS or Linux (or WSL on Windows) with git and bash installed'
reading_time_minutes: 40
practical_time_minutes: 30
