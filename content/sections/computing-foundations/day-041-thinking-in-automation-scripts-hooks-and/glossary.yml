terms:
  - term: automation
    definition: 'The practice of encoding a repeatable task so a computer performs it without manual intervention, on a defined trigger, producing the same result every time.'
  - term: script
    definition: 'A file of commands that runs top to bottom, capturing a sequence of steps so they can be replayed identically — the foundation of all automation.'
  - term: cron
    definition: 'A background service that runs commands on a repeating schedule, defined by a crontab line with five time fields: minute, hour, day of month, month, and day of week.'
  - term: git hook
    definition: 'A script that git runs automatically at a point in its workflow, such as before a commit; a hook only takes effect if it is marked executable.'
  - term: pre-commit hook
    definition: 'A git hook that runs before a commit is recorded and can reject the commit by exiting with a non-zero status, acting as a local quality gate.'
  - term: CI/CD
    definition: 'Continuous integration and continuous delivery/deployment: a shared server that automatically runs checks on every change (CI) and, when they pass, packages and releases the result (CD).'
  - term: pipeline
    definition: 'A task broken into ordered stages where each stage must pass before the next begins, typically lint then test then build then deploy.'
  - term: stage
    definition: 'One step in a pipeline that runs a specific check or action, such as linting or testing, and must succeed for the pipeline to continue.'
  - term: fail fast
    definition: 'Stopping a pipeline the moment a stage fails, so no later stage runs on a known-bad input and the failure is reported immediately.'
  - term: idempotency
    definition: 'The property that running an operation twice on the same input produces the same result, with no leftover state leaking between runs, making automation safe to re-run.'
  - term: reproducibility
    definition: 'The property that the same inputs and environment produce the same output every time and everywhere, so an automated result can be trusted.'
  - term: task runner
    definition: 'A tool such as make that gives project tasks memorable names and declares their order, so a hook, a CI job, and a developer can all invoke the same steps.'
