questions:
  - question: 'What is the essential difference between polling and a webhook?'
    options:
      - 'Polling uses HTTPS while webhooks use plain HTTP'
      - 'Polling asks repeatedly; a webhook is the server calling you'
      - 'Polling is only for browsers while webhooks are only for servers'
      - 'A webhook keeps a connection open permanently while polling closes it'
    answer_index: 1
    explanation: 'Polling is pull — your app keeps asking "anything new?" — while a webhook is push: the server makes an HTTP request to a URL you registered, at the moment the event occurs. That reversal is why a webhook is called a "reverse API."'

  - question: 'Why is a webhook often described as a "reverse API"?'
    options:
      - 'Because it sends responses before requests'
      - 'Because the data travels backwards through the network stack'
      - 'Because your app receives the request instead of sending it'
      - 'Because it uses the DELETE method instead of GET'
    answer_index: 2
    explanation: 'In a normal API call your code sends the request; in a webhook the roles are swapped — the other server sends the HTTP POST to your endpoint, and your application is the one that must listen and respond.'

  - question: 'A webhook receiver replies with 200 OK. What does that status mean to the sending server?'
    options:
      - 'Nothing — webhook senders ignore the response status'
      - 'A request for the sender to send the event again'
      - 'That the receiver wants the payload in a different format'
      - 'The acknowledgement that the delivery was received, so the sender stops retrying'
    answer_index: 3
    explanation: 'The sender treats a 2xx response as an acknowledgement ("received, thank you") and stops retrying. Anything else — a 4xx, 5xx, or timeout — is read as a failed delivery and triggers a retry.'

  - question: 'Why must a webhook receiver verify the signature on an incoming delivery?'
    options:
      - 'The endpoint is public, so the signature proves it is authentic'
      - 'To measure how long the request took to arrive'
      - 'To decompress the payload before reading it'
      - 'Because the sender refuses to retry unsigned deliveries'
    answer_index: 0
    explanation: 'The URL alone proves nothing about who is calling — anyone who learns it can POST a forged event. A matching HMAC signature proves both authenticity (the caller knows the shared secret) and integrity (the body was not changed in transit).'

  - question: 'How does an HMAC signature let a receiver detect a tampered payload?'
    options:
      - 'The signature includes a plain-text copy of the original payload'
      - 'Changing one byte produces a different signature, so it fails'
      - 'The receiver asks the sender to confirm the payload by email'
      - 'Tampered payloads are automatically rejected by the network'
    answer_index: 1
    explanation: 'The receiver recomputes the HMAC over the body it received using the shared secret and compares. Because a hash changes drastically when any input byte changes, an altered body yields a signature that shares nothing with the original — the mismatch reveals the tampering.'

  - question: 'What does "at-least-once delivery" imply for how you must design a webhook handler?'
    options:
      - 'That every event is guaranteed to arrive exactly once and in order'
      - 'That you should poll as a backup in case the webhook never fires'
      - 'That the same event may arrive more than once, so the handler must be idempotent'
      - 'That the receiver must reply within one millisecond'
    answer_index: 2
    explanation: 'Because senders retry until they get a 2xx, a delivery can arrive more than once (for example if your handler did the work but crashed before acknowledging). Idempotency — making repeated processing of the same event have the same effect as processing it once — is what prevents double charges and duplicate actions.'

  - question: 'In event-driven architecture, what role does a message queue (broker) play?'
    options:
      - 'It replaces HTTPS with a faster custom protocol'
      - 'It converts JSON payloads into HTML for browsers'
      - 'It signs every webhook so receivers do not have to'
      - 'It stores events durably so producer and consumer need not overlap'
    answer_index: 3
    explanation: 'A message queue is an intermediary that buffers events between producers (which emit events) and consumers (which handle them), adding durability, ordering, and replay that a bare webhook lacks — so a consumer that is briefly offline loses nothing.'

  - question: 'Which push mechanism is the best fit for a continuous, two-way, real-time connection such as a chat app?'
    options:
      - 'A WebSocket'
      - 'Polling every few seconds'
      - 'Server-sent events (SSE)'
      - 'A single webhook callback'
    answer_index: 0
    explanation: 'A WebSocket keeps one persistent connection open and lets both client and server send messages at any time, which suits interactive real-time apps. A webhook is a one-shot server-to-server callback, and SSE streams one-way from server to client only.'
