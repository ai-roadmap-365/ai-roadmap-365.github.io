terms:
  - term: webhook
    definition: 'An HTTP request that a server sends to a URL you registered in advance, to notify you that an event happened; because the server calls you, it is often described as a "reverse API."'
  - term: polling
    definition: 'Repeatedly asking a server "has anything changed?" — the pull alternative to push, simple but wasteful because most requests return nothing and updates lag by the polling interval.'
  - term: event
    definition: 'A discrete thing that happened on a server (a payment succeeded, a job finished, code was pushed) that a webhook or event-driven system reports so others can react.'
  - term: payload
    definition: 'The body of a webhook delivery — a small JSON document describing the event, including its type, an identifier, a timestamp, and the relevant data.'
  - term: producer
    definition: 'In event-driven architecture, a service that emits events (for example, the system where a payment settles) for others to consume.'
  - term: consumer
    definition: 'In event-driven architecture, a service that receives and handles events emitted by producers (for example, your webhook receiver).'
  - term: signature
    definition: 'A value (typically an HMAC computed over the raw body with a shared secret) attached to a webhook delivery so the receiver can prove the payload is authentic and unaltered.'
  - term: HMAC
    definition: 'Hash-based message authentication code — a signature made by hashing a message together with a shared secret, used to verify a webhook came from someone who knows the secret and was not tampered with.'
  - term: secret
    definition: 'A random string known only to the sender and receiver, used to compute and verify webhook signatures; a credential that must be kept out of source code and logs.'
  - term: retry
    definition: 'The sender re-attempting a delivery (usually with growing gaps, called backoff) when it does not receive a 2xx acknowledgement, which is why the same event can arrive more than once.'
  - term: idempotency
    definition: 'The property that processing the same event more than once has the same effect as processing it once; required because at-least-once delivery can deliver duplicates.'
  - term: at-least-once delivery
    definition: 'A delivery guarantee that a sender will keep retrying until acknowledged, so an event arrives one or more times (possibly duplicated) rather than being silently lost.'
  - term: acknowledgement
    definition: 'The 2xx response (typically 200 OK) a receiver sends back to confirm it accepted a delivery, telling the sender it can stop retrying.'
  - term: message queue
    definition: 'Infrastructure that sits between producers and consumers, durably storing events so services can exchange them reliably with buffering, ordering, and replay.'
  - term: server-sent events
    definition: 'A web standard (SSE) in which a server streams a sequence of events to a client over one long-lived, one-way HTTP connection.'
  - term: WebSocket
    definition: 'A persistent, two-way connection over which client and server can both send messages at any time, used for interactive real-time applications.'
  - term: event-driven architecture
    definition: 'A style of building systems in which services communicate by emitting and reacting to events (via webhooks, queues, or streams) rather than constantly asking one another for updates.'
