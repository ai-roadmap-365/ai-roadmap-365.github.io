visuals:
  - id: polling-vs-webhook
    file: assets/polling-vs-webhook.svg
    type: diagram
    title: 'Polling vs. webhooks'
    alt: 'Diagram: polling versus webhooks, contrasting many repeated client requests with a single server callback'
    description: 'A side-by-side comparison. On the left, polling: the client sends repeated "anything new?" requests, most answered "no" and wasted, until one finally returns "yes." On the right, a webhook: the client registers its URL once, then the server makes a single POST to that URL exactly when the event happens.'
  - id: webhook-delivery
    file: assets/webhook-delivery.svg
    type: flowchart
    title: 'The life of one webhook delivery'
    alt: 'Diagram: the life of one webhook delivery from event through signature check, acknowledgement, and retry'
    description: 'A flow from top to bottom: an event happens on the server, the server POSTs a JSON payload with headers and a signature to your URL, your receiver verifies the signature (rejecting a forgery on mismatch), does the work and replies 200 OK to acknowledge, and if no 2xx is returned the sender retries later with backoff — so deliveries must be handled idempotently.'
  - id: polling-versus-webhook
    file: assets/polling-versus-webhook.svg
    type: diagram
    title: 'Who calls whom, and what that costs'
    alt: 'Diagram: polling compared with webhooks'
    description: 'A two-column comparison of polling and webhooks, covering who initiates the call, the cost of waiting, and the security obligations each creates.'
  - id: polling-arithmetic
    file: assets/polling-arithmetic.svg
    type: diagram
    title: 'The arithmetic that makes polling wasteful'
    alt: 'Diagram: how many polling requests are wasted between real events'
    description: 'A four-stage calculation showing the number of polling requests made per day at a ten-second interval, the number of real events, the proportion of wasted calls, and the worst-case delay the interval imposes.'
  - id: url-is-not-a-secret
    file: assets/url-is-not-a-secret.svg
    type: diagram
    title: 'A secret URL is not a credential'
    alt: 'Diagram: relying on an unguessable URL compared with verifying a signature'
    description: 'A two-column comparison of relying on URL obscurity against verifying an HMAC signature, covering what each proves about the sender and the payload.'
  - id: hmac-verification
    file: assets/hmac-verification.svg
    type: diagram
    title: 'Verifying a signature, correctly'
    alt: 'Diagram: the steps to verify a webhook signature'
    description: 'A four-stage verification procedure covering reading the raw request body, computing the HMAC with the shared secret, comparing in constant time, and only then doing any work.'
  - id: acknowledge-then-work
    file: assets/acknowledge-then-work.svg
    type: diagram
    title: 'Store, acknowledge, then process'
    alt: 'Diagram: slow inline processing compared with fast acknowledgement'
    description: 'A two-column comparison of a handler that processes an event before replying against one that stores and acknowledges immediately then processes in the background.'
  - id: idempotency-by-id
    file: assets/idempotency-by-id.svg
    type: diagram
    title: 'Making a repeat harmless'
    alt: 'Diagram: how recording delivery identifiers makes repeated events safe'
    description: 'A four-stage sequence for idempotent event handling covering reading the delivery identifier, checking whether it has been seen, recording it atomically with the work, and ignoring repeats.'
  - id: push-or-pull
    file: assets/push-or-pull.svg
    type: diagram
    title: 'When polling is still the right answer'
    alt: 'Diagram: when to choose webhooks and when to choose polling'
    description: 'A two-column comparison of the situations suiting webhooks against those where polling remains preferable, covering public addressability, event frequency and operational complexity.'
  - id: delivery-parts
    file: assets/delivery-parts.svg
    type: diagram
    title: 'What arrives, and what each part is for'
    alt: 'Diagram: the parts of a webhook delivery and their purpose'
    description: 'A four-stage breakdown of an incoming webhook delivery covering the method and URL, the headers including the signature and delivery identifier, the JSON payload, and the response the receiver must send.'
  - id: local-webhook-testing
    file: assets/local-webhook-testing.svg
    type: diagram
    title: 'Receiving a webhook on a laptop'
    alt: 'Diagram: how a tunnel exposes a local webhook receiver for testing'
    description: 'A four-stage sequence for local webhook development covering running a local receiver, opening a tunnel to obtain a public URL, registering that URL with the sender, and inspecting deliveries as they arrive.'
  - id: retry-schedule
    file: assets/retry-schedule.svg
    type: diagram
    title: 'What a sender''s retry schedule looks like'
    alt: 'Diagram: a typical webhook retry schedule'
    description: 'A four-stage illustration of webhook retry timing, showing attempts spaced by exponential backoff over an extended window and the eventual abandonment of delivery.'
