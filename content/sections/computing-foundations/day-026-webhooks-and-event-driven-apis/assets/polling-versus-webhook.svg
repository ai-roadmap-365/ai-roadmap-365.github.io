<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A webhook inverts the direction, and with it the trust relationship.">
  <title>Who calls whom, and what that costs</title>
  <style>
    .polling-versus-webhook-bg   { fill: #f8fafc; }
    .polling-versus-webhook-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-versus-webhook-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-versus-webhook-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-versus-webhook-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-versus-webhook-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-versus-webhook-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .polling-versus-webhook-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .polling-versus-webhook-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .polling-versus-webhook-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .polling-versus-webhook-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .polling-versus-webhook-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="polling-versus-webhook-bg" width="980" height="390"/>
  <text class="polling-versus-webhook-h1"  x="30" y="40">Who calls whom, and what that costs</text>
  <text class="polling-versus-webhook-sub" x="30" y="64">A webhook inverts the direction, and with it the trust relationship.</text>
  <rect class="polling-versus-webhook-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="polling-versus-webhook-name" x="46" y="122">Polling — you ask, repeatedly</text>
  <text class="polling-versus-webhook-desc" x="46" y="142">Your app is the caller</text>
  <text class="polling-versus-webhook-desc" x="46" y="182">Most requests return nothing new</text>
  <text class="polling-versus-webhook-desc" x="46" y="216">Delay is bounded by your interval</text>
  <text class="polling-versus-webhook-desc" x="46" y="250">Cost scales with how often you ask</text>
  <text class="polling-versus-webhook-desc" x="46" y="284">No public endpoint needed</text>
  <text class="polling-versus-webhook-desc" x="46" y="318">Nothing to authenticate inbound</text>
  <rect class="polling-versus-webhook-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="polling-versus-webhook-name" x="526" y="122">Webhook — they call you</text>
  <text class="polling-versus-webhook-desc" x="526" y="142">Their server is the caller</text>
  <text class="polling-versus-webhook-desc" x="526" y="182">Delivered when the event happens</text>
  <text class="polling-versus-webhook-desc" x="526" y="216">Your endpoint is public — anyone can POST to it</text>
  <text class="polling-versus-webhook-desc" x="526" y="250">The signature is what proves it is genuine</text>
  <text class="polling-versus-webhook-desc" x="526" y="284">Delivery is at-least-once, so handling must be idempotent</text>
  <text class="polling-versus-webhook-desc" x="526" y="318">Acknowledge fast, then work — or you get sent it again</text>
  <text class="polling-versus-webhook-sub" x="30" y="372">Long-running model work reports back this way: a fine-tune takes hours, and nobody holds a connection open for that.</text>
</svg>
