<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="An event twice a day, checked every ten seconds.">
  <title>The arithmetic that makes polling wasteful</title>
  <style>
    .polling-arithmetic-bg   { fill: #f8fafc; }
    .polling-arithmetic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-arithmetic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-arithmetic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-arithmetic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-arithmetic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polling-arithmetic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .polling-arithmetic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .polling-arithmetic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .polling-arithmetic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .polling-arithmetic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .polling-arithmetic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .polling-arithmetic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .polling-arithmetic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .polling-arithmetic-stage { opacity: 1; }

    .polling-arithmetic-s0 { animation-delay: 0.00s; }
    .polling-arithmetic-e0 { animation-delay: 0.00s; }
    .polling-arithmetic-s1 { animation-delay: 1.28s; }
    .polling-arithmetic-e1 { animation-delay: 1.28s; }
    .polling-arithmetic-s2 { animation-delay: 2.56s; }
    .polling-arithmetic-e2 { animation-delay: 2.56s; }
    .polling-arithmetic-s3 { animation-delay: 3.84s; }
    .polling-arithmetic-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .polling-arithmetic-conn  { animation: polling-arithmetic-trace 6.4s ease-in-out infinite; }
      .polling-arithmetic-stage { animation: polling-arithmetic-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes polling-arithmetic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes polling-arithmetic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .polling-arithmetic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .polling-arithmetic-stage { animation: polling-arithmetic-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes polling-arithmetic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="polling-arithmetic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="polling-arithmetic-bg" width="980" height="322"/>
  <text class="polling-arithmetic-h1"  x="30" y="40">The arithmetic that makes polling wasteful</text>
  <text class="polling-arithmetic-sub" x="30" y="64">An event twice a day, checked every ten seconds.</text>
  <g class="polling-arithmetic-stage polling-arithmetic-s0">
    <rect class="polling-arithmetic-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="polling-arithmetic-step" x="44" y="142">01</text>
    <text class="polling-arithmetic-name" x="70" y="142">Poll every 10 seconds</text>
    <text class="polling-arithmetic-desc" x="44" y="166">Six per minute, 360 per hour,</text>
    <text class="polling-arithmetic-desc" x="44" y="182">around the clock.</text>
    <text class="polling-arithmetic-edge" x="44" y="242">8,640/day</text>
  </g>
  <line class="polling-arithmetic-line polling-arithmetic-conn polling-arithmetic-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#polling-arithmetic-tip)"/>
  <g class="polling-arithmetic-stage polling-arithmetic-s1">
    <rect class="polling-arithmetic-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="polling-arithmetic-step" x="280" y="142">02</text>
    <text class="polling-arithmetic-name" x="306" y="142">Real events per day</text>
    <text class="polling-arithmetic-desc" x="280" y="166">Two. Everything else returns</text>
    <text class="polling-arithmetic-desc" x="280" y="182">"nothing has changed".</text>
    <text class="polling-arithmetic-edge" x="280" y="242">2</text>
  </g>
  <line class="polling-arithmetic-line polling-arithmetic-conn polling-arithmetic-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#polling-arithmetic-tip)"/>
  <g class="polling-arithmetic-stage polling-arithmetic-s2">
    <rect class="polling-arithmetic-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="polling-arithmetic-step" x="516" y="142">03</text>
    <text class="polling-arithmetic-name" x="542" y="142">Wasted requests</text>
    <text class="polling-arithmetic-desc" x="516" y="166">8,638 of 8,640. Against a rate</text>
    <text class="polling-arithmetic-desc" x="516" y="182">limit you are also paying for.</text>
    <text class="polling-arithmetic-edge" x="516" y="242">99.98%</text>
  </g>
  <line class="polling-arithmetic-line polling-arithmetic-conn polling-arithmetic-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#polling-arithmetic-tip)"/>
  <g class="polling-arithmetic-stage polling-arithmetic-s3">
    <rect class="polling-arithmetic-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="polling-arithmetic-step" x="752" y="142">04</text>
    <text class="polling-arithmetic-name" x="778" y="142">And still up to 10s late</text>
    <text class="polling-arithmetic-desc" x="752" y="166">The interval is also your</text>
    <text class="polling-arithmetic-desc" x="752" y="182">worst-case delay. Polling faster</text>
    <text class="polling-arithmetic-desc" x="752" y="198">costs more and still lags.</text>
    <text class="polling-arithmetic-edge" x="752" y="242">webhook: 0</text>
  </g>
  <text class="polling-arithmetic-sub" x="30" y="304">This is the trap: the only way to make polling feel immediate is to poll more often, which is also the only way to make it more expensive and more likely to be throttled.</text>
</svg>
