<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Growing gaps, over hours.">
  <title>What a sender's retry schedule looks like</title>
  <style>
    .retry-schedule-bg   { fill: #f8fafc; }
    .retry-schedule-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-schedule-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-schedule-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-schedule-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-schedule-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-schedule-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retry-schedule-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retry-schedule-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retry-schedule-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retry-schedule-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retry-schedule-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retry-schedule-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .retry-schedule-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .retry-schedule-stage { opacity: 1; }

    .retry-schedule-s0 { animation-delay: 0.00s; }
    .retry-schedule-e0 { animation-delay: 0.00s; }
    .retry-schedule-s1 { animation-delay: 1.28s; }
    .retry-schedule-e1 { animation-delay: 1.28s; }
    .retry-schedule-s2 { animation-delay: 2.56s; }
    .retry-schedule-e2 { animation-delay: 2.56s; }
    .retry-schedule-s3 { animation-delay: 3.84s; }
    .retry-schedule-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .retry-schedule-conn  { animation: retry-schedule-trace 6.4s ease-in-out infinite; }
      .retry-schedule-stage { animation: retry-schedule-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes retry-schedule-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes retry-schedule-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .retry-schedule-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .retry-schedule-stage { animation: retry-schedule-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes retry-schedule-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="retry-schedule-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="retry-schedule-bg" width="980" height="322"/>
  <text class="retry-schedule-h1"  x="30" y="40">What a sender's retry schedule looks like</text>
  <text class="retry-schedule-sub" x="30" y="64">Growing gaps, over hours.</text>
  <g class="retry-schedule-stage retry-schedule-s0">
    <rect class="retry-schedule-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="retry-schedule-step" x="44" y="142">01</text>
    <text class="retry-schedule-name" x="70" y="142">Immediately</text>
    <text class="retry-schedule-desc" x="44" y="166">The first delivery. No 2xx, so</text>
    <text class="retry-schedule-desc" x="44" y="182">it will try again.</text>
  </g>
  <line class="retry-schedule-line retry-schedule-conn retry-schedule-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#retry-schedule-tip)"/>
  <g class="retry-schedule-stage retry-schedule-s1">
    <rect class="retry-schedule-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="retry-schedule-step" x="280" y="142">02</text>
    <text class="retry-schedule-name" x="306" y="142">Then seconds, then minutes</text>
    <text class="retry-schedule-desc" x="280" y="166">Growing gaps — the same</text>
    <text class="retry-schedule-desc" x="280" y="182">exponential backoff as Day 27.</text>
    <text class="retry-schedule-edge" x="280" y="242">backoff</text>
  </g>
  <line class="retry-schedule-line retry-schedule-conn retry-schedule-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#retry-schedule-tip)"/>
  <g class="retry-schedule-stage retry-schedule-s2">
    <rect class="retry-schedule-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="retry-schedule-step" x="516" y="142">03</text>
    <text class="retry-schedule-name" x="542" y="142">Then hours</text>
    <text class="retry-schedule-desc" x="516" y="166">A brief outage on your side is</text>
    <text class="retry-schedule-desc" x="516" y="182">fully survivable.</text>
    <text class="retry-schedule-edge" x="516" y="242">hours</text>
  </g>
  <line class="retry-schedule-line retry-schedule-conn retry-schedule-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#retry-schedule-tip)"/>
  <g class="retry-schedule-stage retry-schedule-s3">
    <rect class="retry-schedule-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="retry-schedule-step" x="752" y="142">04</text>
    <text class="retry-schedule-name" x="778" y="142">Then it gives up</text>
    <text class="retry-schedule-desc" x="752" y="166">After a day or so. Most</text>
    <text class="retry-schedule-desc" x="752" y="182">providers expose the failed</text>
    <text class="retry-schedule-desc" x="752" y="198">deliveries for manual replay.</text>
    <text class="retry-schedule-edge" x="752" y="242">abandoned</text>
  </g>
  <text class="retry-schedule-sub" x="30" y="304">Two consequences: a short outage costs you nothing, and a long one means checking the provider's dashboard for what was abandoned — because after the final attempt, nobody will tell you again.</text>
</svg>
