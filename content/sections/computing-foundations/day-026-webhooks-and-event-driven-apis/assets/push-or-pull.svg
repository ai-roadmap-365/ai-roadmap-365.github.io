<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Webhooks are not universally better.">
  <title>When polling is still the right answer</title>
  <style>
    .push-or-pull-bg   { fill: #f8fafc; }
    .push-or-pull-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-or-pull-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-or-pull-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-or-pull-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-or-pull-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-or-pull-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .push-or-pull-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .push-or-pull-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .push-or-pull-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .push-or-pull-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .push-or-pull-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .push-or-pull-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .push-or-pull-row { opacity: 1; }
    .push-or-pull-r0 { animation-delay: 0.00s; }
    .push-or-pull-r1 { animation-delay: 0.45s; }
    .push-or-pull-r2 { animation-delay: 0.90s; }
    .push-or-pull-r3 { animation-delay: 1.35s; }
    .push-or-pull-r4 { animation-delay: 1.80s; }
    .push-or-pull-row { animation: push-or-pull-reveal 7.3s ease-in-out infinite; }
    @keyframes push-or-pull-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="push-or-pull-bg" width="980" height="390"/>
  <text class="push-or-pull-h1"  x="30" y="40">When polling is still the right answer</text>
  <text class="push-or-pull-sub" x="30" y="64">Webhooks are not universally better.</text>
  <rect class="push-or-pull-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="push-or-pull-name" x="46" y="122">Webhooks fit</text>
  <text class="push-or-pull-desc" x="46" y="142">Infrequent events that matter promptly.</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r0" x="46" y="182">You have a public HTTPS endpoint</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r1" x="46" y="216">Events are sparse and time-sensitive</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r2" x="46" y="250">You can verify signatures</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r3" x="46" y="284">You can deduplicate</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r4" x="46" y="318">Payments, builds, batch job completion</text>
  <rect class="push-or-pull-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="push-or-pull-name" x="526" y="122">Polling still fits</text>
  <text class="push-or-pull-desc" x="526" y="142">More often than its reputation suggests.</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r0" x="526" y="182">No public address — a laptop, a private network</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r1" x="526" y="216">Events are so frequent that a stream is better</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r2" x="526" y="250">You cannot operate a reliable receiver</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r3" x="526" y="284">Latency genuinely does not matter</text>
  <text class="push-or-pull-desc push-or-pull-row push-or-pull-r4" x="526" y="318">A cron job from Day 14 is enough</text>
  <text class="push-or-pull-sub" x="30" y="372">Inside your own system, a message queue usually beats both: it gives you ordering, replay and back-pressure that HTTP callbacks cannot.</text>
</svg>
