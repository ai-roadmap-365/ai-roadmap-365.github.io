<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and two of them are where people go wrong.">
  <title>Verifying a signature, correctly</title>
  <style>
    .hmac-verification-bg   { fill: #f8fafc; }
    .hmac-verification-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hmac-verification-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hmac-verification-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hmac-verification-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hmac-verification-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hmac-verification-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hmac-verification-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hmac-verification-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hmac-verification-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hmac-verification-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hmac-verification-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hmac-verification-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hmac-verification-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hmac-verification-stage { opacity: 1; }

    .hmac-verification-s0 { animation-delay: 0.00s; }
    .hmac-verification-e0 { animation-delay: 0.00s; }
    .hmac-verification-s1 { animation-delay: 1.28s; }
    .hmac-verification-e1 { animation-delay: 1.28s; }
    .hmac-verification-s2 { animation-delay: 2.56s; }
    .hmac-verification-e2 { animation-delay: 2.56s; }
    .hmac-verification-s3 { animation-delay: 3.84s; }
    .hmac-verification-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hmac-verification-conn  { animation: hmac-verification-trace 6.4s ease-in-out infinite; }
      .hmac-verification-stage { animation: hmac-verification-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hmac-verification-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hmac-verification-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hmac-verification-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hmac-verification-stage { animation: hmac-verification-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hmac-verification-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hmac-verification-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hmac-verification-bg" width="980" height="322"/>
  <text class="hmac-verification-h1"  x="30" y="40">Verifying a signature, correctly</text>
  <text class="hmac-verification-sub" x="30" y="64">Four steps, and two of them are where people go wrong.</text>
  <g class="hmac-verification-stage hmac-verification-s0">
    <rect class="hmac-verification-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hmac-verification-step" x="44" y="142">01</text>
    <text class="hmac-verification-name" x="70" y="142">Read the RAW body</text>
    <text class="hmac-verification-desc" x="44" y="166">Not the parsed and re-serialised</text>
    <text class="hmac-verification-desc" x="44" y="182">version. Key order and spacing</text>
    <text class="hmac-verification-desc" x="44" y="198">must match exactly.</text>
    <text class="hmac-verification-edge" x="44" y="242">raw bytes</text>
  </g>
  <line class="hmac-verification-line hmac-verification-conn hmac-verification-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hmac-verification-tip)"/>
  <g class="hmac-verification-stage hmac-verification-s1">
    <rect class="hmac-verification-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hmac-verification-step" x="280" y="142">02</text>
    <text class="hmac-verification-name" x="306" y="142">Compute the HMAC</text>
    <text class="hmac-verification-desc" x="280" y="166">Body plus the shared secret,</text>
    <text class="hmac-verification-desc" x="280" y="182">through SHA-256.</text>
  </g>
  <line class="hmac-verification-line hmac-verification-conn hmac-verification-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hmac-verification-tip)"/>
  <g class="hmac-verification-stage hmac-verification-s2">
    <rect class="hmac-verification-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hmac-verification-step" x="516" y="142">03</text>
    <text class="hmac-verification-name" x="542" y="142">Compare in constant time</text>
    <text class="hmac-verification-desc" x="516" y="166">An ordinary == returns early on</text>
    <text class="hmac-verification-desc" x="516" y="182">the first differing byte,</text>
    <text class="hmac-verification-desc" x="516" y="198">leaking the answer one byte at a</text>
    <text class="hmac-verification-edge" x="516" y="242">compare_digest</text>
  </g>
  <line class="hmac-verification-line hmac-verification-conn hmac-verification-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hmac-verification-tip)"/>
  <g class="hmac-verification-stage hmac-verification-s3">
    <rect class="hmac-verification-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hmac-verification-step" x="752" y="142">04</text>
    <text class="hmac-verification-name" x="778" y="142">Only then, do the work</text>
    <text class="hmac-verification-desc" x="752" y="166">Verification comes first,</text>
    <text class="hmac-verification-desc" x="752" y="182">unconditionally. Not after, not</text>
    <text class="hmac-verification-desc" x="752" y="198">sometimes.</text>
  </g>
  <text class="hmac-verification-sub" x="30" y="304">Step one is where most "signatures never match" problems live: a JSON library that reorders keys or changes spacing produces different bytes and therefore a different hash.</text>
</svg>
