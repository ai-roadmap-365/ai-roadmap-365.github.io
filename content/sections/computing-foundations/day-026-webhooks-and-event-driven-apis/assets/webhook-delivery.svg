<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" font-family="system-ui, sans-serif">
  <title>The life of one webhook delivery: event, POST to your endpoint, signature check, acknowledge, and retry on failure</title>
  <rect x="0" y="0" width="720" height="520" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The life of one webhook delivery</text>

  <!-- 1. event -->
  <rect x="250" y="58" width="220" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. An event happens</text>
  <text x="360" y="103" text-anchor="middle" font-size="14" fill="#1a202c">e.g. a payment succeeds (on the server)</text>

  <line x1="360" y1="116" x2="360" y2="142" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="360,150 353,136 367,136" fill="#1d4ed8"/>

  <!-- 2. POST -->
  <rect x="230" y="150" width="260" height="58" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="174" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Server POSTs to your URL</text>
  <text x="360" y="195" text-anchor="middle" font-size="14" fill="#1a202c">JSON payload + headers + a signature</text>

  <line x1="360" y1="208" x2="360" y2="234" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="360,242 353,228 367,228" fill="#1d4ed8"/>

  <!-- 3. verify (decision) -->
  <polygon points="360,246 500,300 360,354 220,300" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. Verify signature</text>
  <text x="360" y="312" text-anchor="middle" font-size="14" fill="#1a202c">recompute HMAC, compare</text>

  <!-- reject branch -->
  <line x1="500" y1="300" x2="586" y2="300" stroke="#dc2626" stroke-width="3"/>
  <polygon points="594,300 580,293 580,307" fill="#dc2626"/>
  <text x="548" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">no match</text>
  <rect x="596" y="272" width="112" height="56" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="652" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Reject</text>
  <text x="652" y="315" text-anchor="middle" font-size="14" fill="#1a202c">(forged)</text>

  <!-- accept branch down -->
  <line x1="360" y1="354" x2="360" y2="380" stroke="#16a34a" stroke-width="3"/>
  <polygon points="360,388 353,374 367,374" fill="#16a34a"/>
  <text x="392" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">match</text>

  <!-- 4. ack -->
  <rect x="230" y="388" width="260" height="58" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="360" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Do the work, reply 200 OK</text>
  <text x="360" y="433" text-anchor="middle" font-size="14" fill="#1a202c">the acknowledgement ("ack")</text>

  <!-- retry loop -->
  <line x1="230" y1="417" x2="120" y2="417" stroke="#ea580c" stroke-width="3"/>
  <line x1="120" y1="417" x2="120" y2="179" stroke="#ea580c" stroke-width="3"/>
  <line x1="120" y1="179" x2="226" y2="179" stroke="#ea580c" stroke-width="3"/>
  <polygon points="230,179 216,172 216,186" fill="#ea580c"/>
  <text x="120" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#ea580c" transform="rotate(-90 120 300)">5. no 2xx? the server retries later (backoff)</text>

  <text x="360" y="478" text-anchor="middle" font-size="14" fill="#1a202c">Retries mean a delivery can arrive more than once — handle each event idempotently.</text>
  <text x="360" y="500" text-anchor="middle" font-size="14" fill="#64748b">Reply fast: acknowledge first, do slow work afterwards.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 360 116 L 360 142" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 120 179 L 226 179" stroke="#ea580c" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 360 208 L 360 234" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 500 300 L 586 300" stroke="#dc2626" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 360 354 L 360 380" stroke="#16a34a" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
