<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="An ordinary HTTP request, read carefully.">
  <title>What arrives, and what each part is for</title>
  <style>
    .delivery-parts-bg   { fill: #f8fafc; }
    .delivery-parts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-parts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-parts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-parts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-parts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-parts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .delivery-parts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .delivery-parts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .delivery-parts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .delivery-parts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .delivery-parts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .delivery-parts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .delivery-parts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .delivery-parts-stage { opacity: 1; }

    .delivery-parts-s0 { animation-delay: 0.00s; }
    .delivery-parts-e0 { animation-delay: 0.00s; }
    .delivery-parts-s1 { animation-delay: 1.28s; }
    .delivery-parts-e1 { animation-delay: 1.28s; }
    .delivery-parts-s2 { animation-delay: 2.56s; }
    .delivery-parts-e2 { animation-delay: 2.56s; }
    .delivery-parts-s3 { animation-delay: 3.84s; }
    .delivery-parts-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .delivery-parts-conn  { animation: delivery-parts-trace 6.4s ease-in-out infinite; }
      .delivery-parts-stage { animation: delivery-parts-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes delivery-parts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes delivery-parts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .delivery-parts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .delivery-parts-stage { animation: delivery-parts-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes delivery-parts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="delivery-parts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="delivery-parts-bg" width="980" height="322"/>
  <text class="delivery-parts-h1"  x="30" y="40">What arrives, and what each part is for</text>
  <text class="delivery-parts-sub" x="30" y="64">An ordinary HTTP request, read carefully.</text>
  <g class="delivery-parts-stage delivery-parts-s0">
    <rect class="delivery-parts-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="delivery-parts-step" x="44" y="142">01</text>
    <text class="delivery-parts-name" x="70" y="142">POST to your URL</text>
    <text class="delivery-parts-desc" x="44" y="166">It creates a notification on</text>
    <text class="delivery-parts-desc" x="44" y="182">your side. It is not a lookup.</text>
    <text class="delivery-parts-edge" x="44" y="242">POST</text>
  </g>
  <line class="delivery-parts-line delivery-parts-conn delivery-parts-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#delivery-parts-tip)"/>
  <g class="delivery-parts-stage delivery-parts-s1">
    <rect class="delivery-parts-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="delivery-parts-step" x="280" y="142">02</text>
    <text class="delivery-parts-name" x="306" y="142">Headers</text>
    <text class="delivery-parts-desc" x="280" y="166">Event type for routing, delivery</text>
    <text class="delivery-parts-desc" x="280" y="182">ID for deduplication, signature</text>
    <text class="delivery-parts-desc" x="280" y="198">for proof.</text>
    <text class="delivery-parts-edge" x="280" y="242">metadata</text>
  </g>
  <line class="delivery-parts-line delivery-parts-conn delivery-parts-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#delivery-parts-tip)"/>
  <g class="delivery-parts-stage delivery-parts-s2">
    <rect class="delivery-parts-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="delivery-parts-step" x="516" y="142">03</text>
    <text class="delivery-parts-name" x="542" y="142">A small JSON body</text>
    <text class="delivery-parts-desc" x="516" y="166">Type, timestamp, ID, and the</text>
    <text class="delivery-parts-desc" x="516" y="182">data. This is the point;</text>
    <text class="delivery-parts-desc" x="516" y="198">everything else is envelope.</text>
    <text class="delivery-parts-edge" x="516" y="242">payload</text>
  </g>
  <line class="delivery-parts-line delivery-parts-conn delivery-parts-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#delivery-parts-tip)"/>
  <g class="delivery-parts-stage delivery-parts-s3">
    <rect class="delivery-parts-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="delivery-parts-step" x="752" y="142">04</text>
    <text class="delivery-parts-name" x="778" y="142">Your 2xx</text>
    <text class="delivery-parts-desc" x="752" y="166">The acknowledgement. Anything</text>
    <text class="delivery-parts-desc" x="752" y="182">else means the sender will try</text>
    <text class="delivery-parts-desc" x="752" y="198">again.</text>
    <text class="delivery-parts-edge" x="752" y="242">200 OK</text>
  </g>
  <text class="delivery-parts-sub" x="30" y="304">The response is the part people treat as a formality and is not one: your status code is the only signal the sender has about whether to retry.</text>
</svg>
