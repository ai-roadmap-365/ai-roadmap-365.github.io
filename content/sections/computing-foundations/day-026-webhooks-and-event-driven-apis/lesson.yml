id: D026
day: 26
slug: webhooks-and-event-driven-apis
title: 'Webhooks and Event-Driven APIs'
section: computing-foundations
subsection: networks-and-the-internet
week: 4
learning_promise: 'After this lesson you will understand the shift from pull to push: what a webhook is, how to receive one safely by verifying a signature, how retries and idempotency keep delivery reliable, and how these ideas open onto event-driven architecture.'
objectives:
  - 'Explain the difference between polling and webhooks, and state when each is the right choice'
  - 'Describe a webhook as a "reverse API" — the server making an HTTP POST to a URL you registered — and name the parts of a delivery (method, headers, JSON payload, signature)'
  - 'Verify a webhook by recomputing an HMAC signature over the raw body with a shared secret, and explain what a matching signature proves'
  - 'Explain at-least-once delivery, retries, and why idempotency and order-independence are required of a receiver'
  - 'Give a high-level account of event-driven architecture — producers, consumers, events, and queues/brokers'
  - 'Name real push mechanisms (webhooks, SSE, WebSockets, message queues) and choose among them for a given need'
prerequisites:
  - 'Days 18–25 (HTTP methods and status codes, HTTPS/TLS, JSON, and API authentication with keys and secrets)'
  - 'A terminal with curl and openssl (both preinstalled on macOS and Linux); no accounts or API keys'
reading_time_minutes: 40
practical_time_minutes: 30
