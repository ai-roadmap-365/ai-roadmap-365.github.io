terms:
  - term: ASCII
    definition: >-
      An early 7-bit character encoding that maps 128 codes to English
      letters, digits, punctuation, and control characters.
  - term: Unicode
    definition: >-
      A universal standard that assigns a unique number (a code point) to
      every character in every writing system, plus emoji.
  - term: code point
    definition: >-
      The unique number Unicode assigns to a character, written like U+0041
      for the letter A.
  - term: UTF-8
    definition: >-
      The dominant variable-length encoding of Unicode: it stores common
      characters in one byte and others in two to four bytes, staying
      backward-compatible with ASCII.
  - term: mojibake
    definition: >-
      Garbled text that appears when bytes are decoded with the wrong
      character encoding.
  - term: pixel
    definition: >-
      The smallest element of a raster image, holding a single color value.
  - term: RGB
    definition: >-
      A color model that represents a pixel as red, green, and blue channel
      values, commonly 0-255 each.
  - term: resolution
    definition: >-
      The number of pixels in an image, usually given as width by height.
  - term: raster image
    definition: >-
      An image stored as a grid of pixels (for example PNG or JPEG), as
      opposed to a vector image.
  - term: vector image
    definition: >-
      An image described as shapes and coordinates (for example SVG) that
      scales to any size without losing sharpness.
  - term: lossless compression
    definition: >-
      Compression that lets the original data be reconstructed exactly (for
      example PNG or ZIP).
  - term: lossy compression
    definition: >-
      Compression that discards some detail to shrink data further, which
      cannot be perfectly reversed (for example JPEG or MP3).
  - term: sampling rate
    definition: >-
      How many times per second a sound wave is measured when digitizing
      audio, in hertz (for example 44,100 Hz).
  - term: bit depth
    definition: >-
      How many bits represent each audio sample or color channel, setting
      how finely a value can be recorded.
  - term: magic bytes
    definition: >-
      A short signature at the start of a file that identifies its true
      format regardless of the filename extension.
