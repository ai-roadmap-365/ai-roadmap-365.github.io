<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Anything accepting uploads has to know the difference.">
  <title>The extension is a claim; the signature is the fact</title>
  <style>
    .trust-the-bytes-bg   { fill: #f8fafc; }
    .trust-the-bytes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-the-bytes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-the-bytes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-the-bytes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-the-bytes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-the-bytes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .trust-the-bytes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .trust-the-bytes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .trust-the-bytes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .trust-the-bytes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .trust-the-bytes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .trust-the-bytes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .trust-the-bytes-row { opacity: 1; }
    .trust-the-bytes-r0 { animation-delay: 0.00s; }
    .trust-the-bytes-r1 { animation-delay: 0.45s; }
    .trust-the-bytes-r2 { animation-delay: 0.90s; }
    .trust-the-bytes-r3 { animation-delay: 1.35s; }
    .trust-the-bytes-r4 { animation-delay: 1.80s; }
    .trust-the-bytes-row { animation: trust-the-bytes-reveal 7.3s ease-in-out infinite; }
    @keyframes trust-the-bytes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="trust-the-bytes-bg" width="980" height="390"/>
  <text class="trust-the-bytes-h1"  x="30" y="40">The extension is a claim; the signature is the fact</text>
  <text class="trust-the-bytes-sub" x="30" y="64">Anything accepting uploads has to know the difference.</text>
  <rect class="trust-the-bytes-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="trust-the-bytes-name" x="46" y="122">The extension</text>
  <text class="trust-the-bytes-desc" x="46" y="142">A human's assertion</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r0" x="46" y="182">Chosen by whoever named the file</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r1" x="46" y="216">Survives renaming, copying, uploading</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r2" x="46" y="250">A .jpg may hold a PNG, a script, anything</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r3" x="46" y="284">Trusting it on an upload is a vulnerability</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r4" x="46" y="318">Costs nothing to forge</text>
  <rect class="trust-the-bytes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="trust-the-bytes-name" x="526" y="122">The magic bytes</text>
  <text class="trust-the-bytes-desc" x="526" y="142">The file's own answer</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r0" x="526" y="182">%PDF- for PDF, 0x89PNG for PNG, PK for ZIP</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r1" x="526" y="216">Written by whatever produced the file</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r2" x="526" y="250">One read of the first eight bytes</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r3" x="526" y="284">file(1) and python-magic do this for you</text>
  <text class="trust-the-bytes-desc trust-the-bytes-row trust-the-bytes-r4" x="526" y="318">The only identification worth acting on</text>
  <text class="trust-the-bytes-sub" x="30" y="372">A .jpg that is really a PNG opens fine in a viewer and breaks a pipeline that trusted the name.</text>
</svg>
