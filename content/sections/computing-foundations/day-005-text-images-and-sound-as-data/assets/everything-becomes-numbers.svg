<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="A model never sees your file. It sees the numbers your preprocessing produced.">
  <title>Three kinds of input, one destination</title>
  <style>
    .everything-becomes-numbers-bg   { fill: #f8fafc; }
    .everything-becomes-numbers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .everything-becomes-numbers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .everything-becomes-numbers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .everything-becomes-numbers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .everything-becomes-numbers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .everything-becomes-numbers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .everything-becomes-numbers-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .everything-becomes-numbers-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .everything-becomes-numbers-tok { animation: everything-becomes-numbers-travel 7s ease-in-out infinite; }
    }
    @keyframes everything-becomes-numbers-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--everything-becomes-numbers-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .everything-becomes-numbers-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="everything-becomes-numbers-bg" width="980" height="334"/>
  <text class="everything-becomes-numbers-h1"  x="30" y="40">Three kinds of input, one destination</text>
  <text class="everything-becomes-numbers-sub" x="30" y="64">A model never sees your file. It sees the numbers your preprocessing produced.</text>
  <rect class="everything-becomes-numbers-box" x="30" y="132" width="213" height="96" rx="9"/>
  <text class="everything-becomes-numbers-name" x="44" y="160">Text</text>
  <text class="everything-becomes-numbers-desc" x="44" y="182">Characters to code points, code</text>
  <text class="everything-becomes-numbers-desc" x="44" y="198">points to bytes, bytes to token</text>
  <text class="everything-becomes-numbers-desc" x="44" y="214">ids.</text>
  <text class="everything-becomes-numbers-edge" x="44" y="248">UTF-8, then a tokeniser</text>
  <line class="everything-becomes-numbers-line" x1="246" y1="180" x2="262" y2="180"/>
  <rect class="everything-becomes-numbers-box" x="265" y="132" width="213" height="96" rx="9"/>
  <text class="everything-becomes-numbers-name" x="279" y="160">Images</text>
  <text class="everything-becomes-numbers-desc" x="279" y="182">A grid of pixels, each a red,</text>
  <text class="everything-becomes-numbers-desc" x="279" y="198">green and blue value.</text>
  <text class="everything-becomes-numbers-edge" x="279" y="248">height x width x 3</text>
  <line class="everything-becomes-numbers-line" x1="481" y1="180" x2="497" y2="180"/>
  <rect class="everything-becomes-numbers-box" x="500" y="132" width="213" height="96" rx="9"/>
  <text class="everything-becomes-numbers-name" x="514" y="160">Sound</text>
  <text class="everything-becomes-numbers-desc" x="514" y="182">Amplitude measured many</text>
  <text class="everything-becomes-numbers-desc" x="514" y="198">thousands of times a second.</text>
  <text class="everything-becomes-numbers-edge" x="514" y="248">sample rate</text>
  <line class="everything-becomes-numbers-line" x1="716" y1="180" x2="732" y2="180"/>
  <rect class="everything-becomes-numbers-hi" x="735" y="132" width="213" height="96" rx="9"/>
  <text class="everything-becomes-numbers-name" x="749" y="160">Arrays of numbers</text>
  <text class="everything-becomes-numbers-desc" x="749" y="182">One representation the</text>
  <text class="everything-becomes-numbers-desc" x="749" y="198">arithmetic can work on.</text>
  <text class="everything-becomes-numbers-edge" x="749" y="248">tensors</text>
  <rect class="everything-becomes-numbers-tok" x="34" y="106" width="58" height="14" rx="3" style="--everything-becomes-numbers-run: 705px"/>
  <text class="everything-becomes-numbers-sub" x="30" y="314">If encoding differs at all between training and serving, the model is being asked a question in a language it was not taught.</text>
</svg>
