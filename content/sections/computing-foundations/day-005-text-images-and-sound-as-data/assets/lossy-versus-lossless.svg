<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One you can undo. One you cannot.">
  <title>Two kinds of smaller</title>
  <style>
    .lossy-versus-lossless-bg   { fill: #f8fafc; }
    .lossy-versus-lossless-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lossy-versus-lossless-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lossy-versus-lossless-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lossy-versus-lossless-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lossy-versus-lossless-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lossy-versus-lossless-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lossy-versus-lossless-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lossy-versus-lossless-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lossy-versus-lossless-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lossy-versus-lossless-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lossy-versus-lossless-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lossy-versus-lossless-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lossy-versus-lossless-row { opacity: 1; }
    .lossy-versus-lossless-r0 { animation-delay: 0.00s; }
    .lossy-versus-lossless-r1 { animation-delay: 0.45s; }
    .lossy-versus-lossless-r2 { animation-delay: 0.90s; }
    .lossy-versus-lossless-r3 { animation-delay: 1.35s; }
    .lossy-versus-lossless-r4 { animation-delay: 1.80s; }
    .lossy-versus-lossless-row { animation: lossy-versus-lossless-reveal 7.3s ease-in-out infinite; }
    @keyframes lossy-versus-lossless-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lossy-versus-lossless-bg" width="980" height="390"/>
  <text class="lossy-versus-lossless-h1"  x="30" y="40">Two kinds of smaller</text>
  <text class="lossy-versus-lossless-sub" x="30" y="64">One you can undo. One you cannot.</text>
  <rect class="lossy-versus-lossless-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lossy-versus-lossless-name" x="46" y="122">Lossless — PNG, FLAC, ZIP</text>
  <text class="lossy-versus-lossless-desc" x="46" y="142">Restores the original exactly</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r0" x="46" y="182">Every original byte is recoverable</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r1" x="46" y="216">Typically 2-3x smaller</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r2" x="46" y="250">Right for text, code, medical images</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r3" x="46" y="284">Right for anything you will edit again</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r4" x="46" y="318">Compression is reversible arithmetic</text>
  <rect class="lossy-versus-lossless-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lossy-versus-lossless-name" x="526" y="122">Lossy — JPEG, MP3, H.264</text>
  <text class="lossy-versus-lossless-desc" x="526" y="142">Discards detail permanently</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r0" x="526" y="182">The original cannot be recovered</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r1" x="526" y="216">Often 10x smaller or more</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r2" x="526" y="250">Tuned to what human senses miss</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r3" x="526" y="284">Re-saving repeatedly degrades further</text>
  <text class="lossy-versus-lossless-desc lossy-versus-lossless-row lossy-versus-lossless-r4" x="526" y="318">Right for delivery, wrong for archives</text>
  <text class="lossy-versus-lossless-sub" x="30" y="372">A model trained on JPEGs learns the artefacts too. Whether that matters is a question you have to ask deliberately.</text>
</svg>
