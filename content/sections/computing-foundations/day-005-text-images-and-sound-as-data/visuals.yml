visuals:
  - id: text-encoding-layers
    file: assets/text-encoding-layers.svg
    type: diagram
    title: 'From character to bytes'
    alt: 'Diagram: from a character to its code point to UTF-8 bytes to bits'
    description: >-
      Shows a single character resolving down through its Unicode code point,
      its UTF-8 byte sequence, and finally the individual bits.
  - id: pixel-grid
    file: assets/pixel-grid.svg
    type: diagram
    title: 'An image as RGB numbers'
    alt: 'Diagram: a two-by-two pixel image as a grid of RGB numbers'
    description: >-
      Shows a two-by-two image with each pixel labelled by its red, green,
      and blue channel values to illustrate that images are grids of numbers.
  - id: everything-becomes-numbers
    file: assets/everything-becomes-numbers.svg
    type: diagram
    title: 'Three kinds of input, one destination'
    alt: 'Diagram: how text, images and sound each become arrays of numbers'
    description: 'A four-stage sequence showing text, images and audio each converted through an encoding step into arrays of numbers, then into the tensors a model consumes.'
  - id: utf8-byte-widths
    file: assets/utf8-byte-widths.svg
    type: diagram
    title: 'Why ''café'' is four characters and five bytes'
    alt: 'Diagram: how UTF-8 encodes characters in one to four bytes'
    description: 'A four-stage sequence showing UTF-8 byte widths: ASCII in one byte, Latin accents in two, most scripts in three, and emoji in four.'
  - id: lossy-versus-lossless
    file: assets/lossy-versus-lossless.svg
    type: diagram
    title: 'Two kinds of smaller'
    alt: 'Diagram: lossless compression compared with lossy'
    description: 'A two-column comparison of lossless and lossy compression covering what each guarantees, typical size reduction, and when each is appropriate.'
  - id: trust-the-bytes
    file: assets/trust-the-bytes.svg
    type: diagram
    title: 'The extension is a claim; the signature is the fact'
    alt: 'Diagram: identifying a file by extension compared with by magic bytes'
    description: 'A two-column comparison of trusting a filename extension versus reading the leading bytes, with the security consequence of each.'
  - id: preprocessing-must-match
    file: assets/preprocessing-must-match.svg
    type: diagram
    title: 'Training and serving must encode identically'
    alt: 'Diagram: matching compared with mismatched preprocessing between training and serving'
    description: 'A two-column comparison of consistent and inconsistent preprocessing between training and inference, listing the specific settings that must agree.'
  - id: image-decode-cost
    file: assets/image-decode-cost.svg
    type: diagram
    title: 'Where a training pipeline actually spends its time'
    alt: 'Diagram: the stages of turning a stored image into a training batch'
    description: 'A five-stage sequence from a compressed file on disk through decoding, resizing, normalising and batching, marking decode as the expensive stage.'
  - id: video-frame-cost
    file: assets/video-frame-cost.svg
    type: diagram
    title: 'Why video compression is not optional'
    alt: 'Diagram: the size of video before and after compression'
    description: 'A four-stage sequence from a single uncompressed frame through thirty frames per second to an hour of footage, then the compressed result, showing the scale of the reduction.'
  - id: audio-sampling
    file: assets/audio-sampling.svg
    type: diagram
    title: 'Turning a sound wave into numbers'
    alt: 'Diagram: a sound wave measured at intervals and stored as numbers'
    description: 'A four-stage sequence showing a continuous pressure wave measured 44,100 times per second, each measurement rounded to one of 65,536 levels, then stored as two bytes per sample per channel.'
  - id: two-audio-axes
    file: assets/two-audio-axes.svg
    type: diagram
    title: 'Sample rate and bit depth are independent'
    alt: 'Diagram: sample rate compared with bit depth'
    description: 'A four-stage explanation distinguishing how often an audio signal is measured from how precisely each measurement is recorded, and what each controls.'
