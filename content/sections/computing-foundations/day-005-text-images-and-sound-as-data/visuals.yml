visuals:
  - id: text-encoding-layers
    file: assets/text-encoding-layers.svg
    type: diagram
    title: 'From character to bytes'
    alt: 'Diagram: from a character to its code point to UTF-8 bytes to bits'
    description: >-
      Shows a single character resolving down through its Unicode code point,
      its UTF-8 byte sequence, and finally the individual bits.
  - id: pixel-grid
    file: assets/pixel-grid.svg
    type: diagram
    title: 'An image as RGB numbers'
    alt: 'Diagram: a two-by-two pixel image as a grid of RGB numbers'
    description: >-
      Shows a two-by-two image with each pixel labelled by its red, green,
      and blue channel values to illustrate that images are grids of numbers.
