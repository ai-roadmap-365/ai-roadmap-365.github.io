questions:
  - question: 'What does a Unicode code point represent?'
    options:
      - 'The number of bytes a character takes on disk'
      - 'A unique number assigned to a character, independent of how it is stored'
      - 'The color of a pixel'
      - 'The compression ratio of a file'
    answer_index: 1
    explanation: >-
      A code point (like U+0041 for A) is the identity Unicode gives a
      character; encodings such as UTF-8 then decide how to store it as bytes.
  - question: 'Why did UTF-8 become the dominant text encoding on the web?'
    options:
      - 'It uses exactly one byte for every possible character'
      - 'It is backward-compatible with ASCII and stores common characters compactly'
      - 'It stores text without any bytes at all'
      - 'It only works for English'
    answer_index: 1
    explanation: >-
      UTF-8 keeps the original ASCII bytes for English text and uses two to
      four bytes for everything else, so old ASCII files stay valid while all
      of Unicode is supported.
  - question: 'A file renamed from photo.png to photo.jpg still opens as a PNG. Why?'
    options:
      - 'The extension determines the real format'
      - "The file's magic bytes identify its true format, not the extension"
      - 'PNG and JPEG are identical formats'
      - 'The operating system converted it automatically'
    answer_index: 1
    explanation: >-
      Programs read the leading magic bytes (PNG starts with 89 50 4E 47) to
      detect the real format; the filename extension is only a hint.
  - question: 'How is a single pixel most commonly represented in a color image?'
    options:
      - 'As one bit, on or off'
      - 'As red, green, and blue channel values'
      - 'As a sampling rate'
      - 'As a Unicode code point'
    answer_index: 1
    explanation: >-
      A color pixel is typically three numbers — its red, green, and blue
      intensities — often 0 to 255 each.
  - question: 'What is the key difference between lossless and lossy compression?'
    options:
      - 'Lossless is always smaller than lossy'
      - 'Lossy can reconstruct the original exactly; lossless cannot'
      - 'Lossless reconstructs the original exactly; lossy discards some detail permanently'
      - 'They are two names for the same thing'
    answer_index: 2
    explanation: >-
      Lossless (PNG, ZIP) restores the exact original; lossy (JPEG, MP3)
      throws away detail to save space and cannot be perfectly reversed.
  - question: 'What does the sampling rate of digital audio measure?'
    options:
      - 'How loud the sound is'
      - 'How many times per second the sound wave is measured'
      - 'How many colors the audio contains'
      - 'The size of the file in bytes'
    answer_index: 1
    explanation: >-
      Sampling rate (for example 44,100 Hz) is how often the continuous
      waveform is measured to turn it into a sequence of numbers.
  - question: 'Why does an emoji often take four bytes in a UTF-8 file?'
    options:
      - 'Emoji are stored as images inside the text'
      - 'Its Unicode code point is high, so UTF-8 needs a multi-byte sequence'
      - 'UTF-8 always uses four bytes per character'
      - 'Emoji cannot be stored in UTF-8'
    answer_index: 1
    explanation: >-
      UTF-8 uses more bytes for higher code points; emoji sit high in the
      Unicode range and so require a three- or four-byte sequence.
  - question: 'How do AI models most directly consume images and audio?'
    options:
      - 'As filenames'
      - 'As grids or arrays of numbers (tensors and waveforms)'
      - 'As compressed ZIP archives only'
      - 'As Unicode text'
    answer_index: 1
    explanation: >-
      Because all media is already numbers, a model receives an image as a
      tensor of pixel values and audio as an array of samples — the same
      representations this lesson describes.
