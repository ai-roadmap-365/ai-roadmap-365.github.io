<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>Branch shapes of trunk-based development, GitHub Flow, and Git Flow compared</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Three branching strategies, compared</text>

  <!-- Panel 1: Trunk-based -->
  <text x="24" y="78" font-size="16" font-weight="bold" fill="#1d4ed8">Trunk-based development</text>
  <text x="24" y="98" font-size="14" fill="#1a202c">One main line; everyone commits many times a day; branches live only hours.</text>
  <line x1="120" y1="128" x2="700" y2="128" stroke="#1a202c" stroke-width="3"/>
  <text x="80" y="133" font-size="14" font-weight="bold" fill="#1a202c">main</text>
  <circle cx="170" cy="128" r="7" fill="#1d4ed8"/>
  <circle cx="270" cy="128" r="7" fill="#1d4ed8"/>
  <circle cx="370" cy="128" r="7" fill="#1d4ed8"/>
  <circle cx="470" cy="128" r="7" fill="#1d4ed8"/>
  <circle cx="570" cy="128" r="7" fill="#1d4ed8"/>
  <circle cx="670" cy="128" r="7" fill="#1d4ed8"/>

  <!-- Panel 2: GitHub Flow -->
  <text x="24" y="184" font-size="16" font-weight="bold" fill="#1d4ed8">GitHub Flow</text>
  <text x="24" y="204" font-size="14" fill="#1a202c">Short-lived branch, reviewed as a pull request, then merged back to a deployable main.</text>
  <line x1="120" y1="258" x2="700" y2="258" stroke="#1a202c" stroke-width="3"/>
  <text x="80" y="263" font-size="14" font-weight="bold" fill="#1a202c">main</text>
  <circle cx="170" cy="258" r="7" fill="#1d4ed8"/>
  <circle cx="640" cy="258" r="7" fill="#1d4ed8"/>
  <!-- feature branch arc up and back -->
  <path d="M 300 258 C 340 228, 360 228, 400 228" fill="none" stroke="#1a202c" stroke-width="2"/>
  <path d="M 500 228 C 560 228, 600 258, 640 258" fill="none" stroke="#1a202c" stroke-width="2"/>
  <line x1="400" y1="228" x2="500" y2="228" stroke="#1a202c" stroke-width="2"/>
  <circle cx="400" cy="228" r="7" fill="#1d4ed8"/>
  <circle cx="500" cy="228" r="7" fill="#1d4ed8"/>
  <text x="450" y="216" text-anchor="middle" font-size="13" fill="#1a202c">feature branch (pull request)</text>
  <text x="628" y="282" text-anchor="middle" font-size="13" fill="#1a202c">merge</text>

  <!-- Panel 3: Git Flow -->
  <text x="24" y="330" font-size="16" font-weight="bold" fill="#1d4ed8">Git Flow</text>
  <text x="24" y="350" font-size="14" fill="#1a202c">Long-lived main and develop lines, plus feature and release branches, for scheduled versions.</text>
  <!-- feature line (top) -->
  <line x1="300" y1="378" x2="470" y2="378" stroke="#1a202c" stroke-width="2"/>
  <text x="120" y="382" font-size="14" fill="#1a202c">feature</text>
  <circle cx="340" cy="378" r="6" fill="#1d4ed8"/>
  <circle cx="430" cy="378" r="6" fill="#1d4ed8"/>
  <!-- develop line (middle) -->
  <line x1="120" y1="410" x2="700" y2="410" stroke="#1a202c" stroke-width="3"/>
  <text x="120" y="404" font-size="14" font-weight="bold" fill="#1a202c">develop</text>
  <circle cx="200" cy="410" r="6" fill="#1d4ed8"/>
  <circle cx="560" cy="410" r="6" fill="#1d4ed8"/>
  <!-- feature branches off/into develop -->
  <line x1="300" y1="410" x2="300" y2="378" stroke="#1a202c" stroke-width="2"/>
  <line x1="470" y1="378" x2="470" y2="410" stroke="#1a202c" stroke-width="2"/>
  <!-- release branch to main -->
  <line x1="560" y1="410" x2="620" y2="446" stroke="#1a202c" stroke-width="2"/>
  <text x="600" y="432" font-size="12" fill="#1a202c">release</text>
  <!-- main line (bottom) -->
  <line x1="120" y1="446" x2="700" y2="446" stroke="#1a202c" stroke-width="3"/>
  <text x="120" y="462" font-size="14" font-weight="bold" fill="#1a202c">main</text>
  <circle cx="200" cy="446" r="6" fill="#1d4ed8"/>
  <circle cx="640" cy="446" r="7" fill="#1d4ed8"/>
  <text x="666" y="451" font-size="12" fill="#1d4ed8">tag</text>
</svg>
