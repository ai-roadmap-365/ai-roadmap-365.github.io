<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" font-family="system-ui, sans-serif">
  <title>Commits leading to an annotated tag v1.0.0 and a release, with the semantic version parts explained</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">From commits to a tagged release</text>

  <!-- commit chain -->
  <line x1="70" y1="120" x2="560" y2="120" stroke="#1a202c" stroke-width="3"/>
  <text x="60" y="98" font-size="14" font-weight="bold" fill="#1a202c">main</text>

  <circle cx="110" cy="120" r="10" fill="#1d4ed8"/>
  <text x="110" y="152" text-anchor="middle" font-size="13" fill="#1a202c">chore: init</text>

  <circle cx="240" cy="120" r="10" fill="#1d4ed8"/>
  <text x="240" y="152" text-anchor="middle" font-size="13" fill="#1a202c">feat: search</text>

  <circle cx="370" cy="120" r="10" fill="#1d4ed8"/>
  <text x="370" y="152" text-anchor="middle" font-size="13" fill="#1a202c">fix: empty query</text>

  <circle cx="500" cy="120" r="12" fill="#1d4ed8" stroke="#1a202c" stroke-width="2"/>
  <text x="500" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">merge commit</text>

  <!-- annotated tag pinned to merge commit -->
  <line x1="500" y1="108" x2="500" y2="66" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="430" y="34" width="140" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="500" y="56" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">tag -a v1.0.0</text>

  <!-- arrow to release -->
  <line x1="560" y1="120" x2="620" y2="120" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="632,120 616,112 616,128" fill="#1d4ed8"/>
  <rect x="632" y="96" width="110" height="48" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="687" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Release</text>
  <text x="687" y="136" text-anchor="middle" font-size="13" fill="#1a202c">v1.0.0</text>

  <!-- semver breakdown -->
  <text x="380" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Semantic versioning: what the number means</text>
  <text x="380" y="268" text-anchor="middle" font-size="34" font-weight="bold" fill="#1d4ed8">1 . 0 . 0</text>

  <rect x="120" y="300" width="150" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="195" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">MAJOR</text>
  <text x="195" y="346" text-anchor="middle" font-size="13" fill="#1a202c">breaking change</text>
  <line x1="205" y1="278" x2="195" y2="300" stroke="#1d4ed8" stroke-width="2"/>

  <rect x="305" y="300" width="150" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">MINOR</text>
  <text x="380" y="346" text-anchor="middle" font-size="13" fill="#1a202c">new feature</text>
  <line x1="380" y1="278" x2="380" y2="300" stroke="#1d4ed8" stroke-width="2"/>

  <rect x="490" y="300" width="150" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="565" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">PATCH</text>
  <text x="565" y="346" text-anchor="middle" font-size="13" fill="#1a202c">bug fix</text>
  <line x1="555" y1="278" x2="565" y2="300" stroke="#1d4ed8" stroke-width="2"/>

  <text x="380" y="398" text-anchor="middle" font-size="14" fill="#1a202c">An annotated tag records who cut the release and when; the number tells users what to expect.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 560 120 L 620 120" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
