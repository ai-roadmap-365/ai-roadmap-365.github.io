<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A hook nobody has installed protects nobody.">
  <title>Hooks are local, which is the catch</title>
  <style>
    .hooks-are-local-bg   { fill: #f8fafc; }
    .hooks-are-local-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hooks-are-local-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hooks-are-local-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hooks-are-local-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hooks-are-local-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hooks-are-local-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hooks-are-local-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hooks-are-local-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hooks-are-local-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hooks-are-local-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hooks-are-local-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hooks-are-local-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hooks-are-local-row { opacity: 1; }
    .hooks-are-local-r0 { animation-delay: 0.00s; }
    .hooks-are-local-r1 { animation-delay: 0.45s; }
    .hooks-are-local-r2 { animation-delay: 0.90s; }
    .hooks-are-local-r3 { animation-delay: 1.35s; }
    .hooks-are-local-r4 { animation-delay: 1.80s; }
    .hooks-are-local-row { animation: hooks-are-local-reveal 7.3s ease-in-out infinite; }
    @keyframes hooks-are-local-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hooks-are-local-bg" width="980" height="390"/>
  <text class="hooks-are-local-h1"  x="30" y="40">Hooks are local, which is the catch</text>
  <text class="hooks-are-local-sub" x="30" y="64">A hook nobody has installed protects nobody.</text>
  <rect class="hooks-are-local-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hooks-are-local-name" x="46" y="122">Written in .git/hooks</text>
  <text class="hooks-are-local-desc" x="46" y="142">Yours alone.</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r0" x="46" y="182">Lives inside .git/</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r1" x="46" y="216">Not version controlled</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r2" x="46" y="250">Does not travel with a clone</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r3" x="46" y="284">A new colleague has none of them</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r4" x="46" y="318">Which is deliberate — a cloned script would run automatically</text>
  <rect class="hooks-are-local-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hooks-are-local-name" x="526" y="122">Managed by a framework</text>
  <text class="hooks-are-local-desc" x="526" y="142">Installed on purpose.</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r0" x="526" y="182">Config file IS version controlled</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r1" x="526" y="216">One command installs the hooks</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r2" x="526" y="250">Everyone runs the same checks</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r3" x="526" y="284">Updates propagate with the repository</text>
  <text class="hooks-are-local-desc hooks-are-local-row hooks-are-local-r4" x="526" y="318">Still opt-in, which is the point</text>
  <text class="hooks-are-local-sub" x="30" y="372">The reason hooks do not travel is a security one: a repository that could install and run a script the moment you cloned it would be a serious problem. The framework makes installation explicit.</text>
</svg>
