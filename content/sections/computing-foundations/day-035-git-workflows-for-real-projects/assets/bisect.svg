<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three hundred commits, eight questions.">
  <title>git bisect finds a regression in logarithmic time</title>
  <style>
    .bisect-bg   { fill: #f8fafc; }
    .bisect-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bisect-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bisect-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bisect-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bisect-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bisect-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bisect-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bisect-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bisect-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bisect-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bisect-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bisect-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bisect-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bisect-stage { opacity: 1; }

    .bisect-s0 { animation-delay: 0.00s; }
    .bisect-e0 { animation-delay: 0.00s; }
    .bisect-s1 { animation-delay: 1.28s; }
    .bisect-e1 { animation-delay: 1.28s; }
    .bisect-s2 { animation-delay: 2.56s; }
    .bisect-e2 { animation-delay: 2.56s; }
    .bisect-s3 { animation-delay: 3.84s; }
    .bisect-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bisect-conn  { animation: bisect-trace 6.4s ease-in-out infinite; }
      .bisect-stage { animation: bisect-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bisect-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bisect-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bisect-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bisect-stage { animation: bisect-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bisect-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bisect-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bisect-bg" width="980" height="322"/>
  <text class="bisect-h1"  x="30" y="40">git bisect finds a regression in logarithmic time</text>
  <text class="bisect-sub" x="30" y="64">Three hundred commits, eight questions.</text>
  <g class="bisect-stage bisect-s0">
    <rect class="bisect-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bisect-step" x="44" y="142">01</text>
    <text class="bisect-name" x="70" y="142">Mark one good, one bad</text>
    <text class="bisect-desc" x="44" y="166">A release tag that worked, and</text>
    <text class="bisect-desc" x="44" y="182">the current broken state.</text>
    <text class="bisect-edge" x="44" y="242">the range</text>
  </g>
  <line class="bisect-line bisect-conn bisect-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bisect-tip)"/>
  <g class="bisect-stage bisect-s1">
    <rect class="bisect-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bisect-step" x="280" y="142">02</text>
    <text class="bisect-name" x="306" y="142">Git checks out the midpoint</text>
    <text class="bisect-desc" x="280" y="166">You test it and say good or bad.</text>
    <text class="bisect-desc" x="280" y="182">That is all you do.</text>
  </g>
  <line class="bisect-line bisect-conn bisect-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bisect-tip)"/>
  <g class="bisect-stage bisect-s2">
    <rect class="bisect-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bisect-step" x="516" y="142">03</text>
    <text class="bisect-name" x="542" y="142">The range halves, every time</text>
    <text class="bisect-desc" x="516" y="166">300 commits becomes 150, then</text>
    <text class="bisect-desc" x="516" y="182">75, then 38.</text>
    <text class="bisect-edge" x="516" y="242">log2</text>
  </g>
  <line class="bisect-line bisect-conn bisect-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bisect-tip)"/>
  <g class="bisect-stage bisect-s3">
    <rect class="bisect-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bisect-step" x="752" y="142">04</text>
    <text class="bisect-name" x="778" y="142">It names the first bad commit</text>
    <text class="bisect-desc" x="752" y="166">In about eight steps. Then git</text>
    <text class="bisect-desc" x="752" y="182">bisect reset.</text>
    <text class="bisect-edge" x="752" y="242">~8 steps</text>
  </g>
  <text class="bisect-sub" x="30" y="304">This is the highest-value command in the lesson, and it only works if commits are atomic: bisect can tell you WHICH commit, and only a small commit tells you why.</text>
</svg>
