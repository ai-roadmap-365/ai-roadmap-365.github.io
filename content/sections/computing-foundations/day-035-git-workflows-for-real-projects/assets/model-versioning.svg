<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same promise, about a different interface.">
  <title>Versioning a model</title>
  <style>
    .model-versioning-bg   { fill: #f8fafc; }
    .model-versioning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-versioning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-versioning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-versioning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-versioning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-versioning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-versioning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-versioning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-versioning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-versioning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-versioning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-versioning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-versioning-row { opacity: 1; }
    .model-versioning-r0 { animation-delay: 0.00s; }
    .model-versioning-r1 { animation-delay: 0.45s; }
    .model-versioning-r2 { animation-delay: 0.90s; }
    .model-versioning-r3 { animation-delay: 1.35s; }
    .model-versioning-r4 { animation-delay: 1.80s; }
    .model-versioning-row { animation: model-versioning-reveal 7.3s ease-in-out infinite; }
    @keyframes model-versioning-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="model-versioning-bg" width="980" height="390"/>
  <text class="model-versioning-h1"  x="30" y="40">Versioning a model</text>
  <text class="model-versioning-sub" x="30" y="64">The same promise, about a different interface.</text>
  <rect class="model-versioning-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="model-versioning-name" x="46" y="122">MINOR — same interface</text>
  <text class="model-versioning-desc" x="46" y="142">Retrain, same contract.</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r0" x="46" y="182">Retrained on more data</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r1" x="46" y="216">Same input shape and preprocessing</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r2" x="46" y="250">Same output categories</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r3" x="46" y="284">Metrics moved; nothing downstream breaks</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r4" x="46" y="318">Callers upgrade without reading</text>
  <rect class="model-versioning-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="model-versioning-name" x="526" y="122">MAJOR — interface changed</text>
  <text class="model-versioning-desc" x="526" y="142">Something downstream will break.</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r0" x="526" y="182">Output categories added or renamed</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r1" x="526" y="216">Different expected input size</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r2" x="526" y="250">Changed preprocessing or normalisation</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r3" x="526" y="284">A different tokenizer</text>
  <text class="model-versioning-desc model-versioning-row model-versioning-r4" x="526" y="318">Every caller must be checked</text>
  <text class="model-versioning-sub" x="30" y="372">And tag the commit that produced the published result. A metric in a report with no tag behind it is a number nobody, including you, can reproduce later.</text>
</svg>
