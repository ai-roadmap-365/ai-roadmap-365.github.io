<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A branch is a bet that the codebase will not move much while you work.">
  <title>Short-lived branches, and what happens when they are not</title>
  <style>
    .branch-lifetime-bg   { fill: #f8fafc; }
    .branch-lifetime-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-lifetime-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .branch-lifetime-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .branch-lifetime-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .branch-lifetime-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .branch-lifetime-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .branch-lifetime-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="branch-lifetime-bg" width="980" height="390"/>
  <text class="branch-lifetime-h1"  x="30" y="40">Short-lived branches, and what happens when they are not</text>
  <text class="branch-lifetime-sub" x="30" y="64">A branch is a bet that the codebase will not move much while you work.</text>
  <rect class="branch-lifetime-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="branch-lifetime-name" x="46" y="122">Merged in a day or two</text>
  <text class="branch-lifetime-desc" x="46" y="142">The bet usually holds</text>
  <text class="branch-lifetime-desc" x="46" y="182">Few conflicts, and small ones</text>
  <text class="branch-lifetime-desc" x="46" y="216">A review someone can actually read</text>
  <text class="branch-lifetime-desc" x="46" y="250">The baseline is still recognisable</text>
  <text class="branch-lifetime-desc" x="46" y="284">Easy to abandon if the idea fails</text>
  <text class="branch-lifetime-desc" x="46" y="318">Integration is a non-event</text>
  <rect class="branch-lifetime-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="branch-lifetime-name" x="526" y="122">Open for three weeks</text>
  <text class="branch-lifetime-desc" x="526" y="142">The bet has failed</text>
  <text class="branch-lifetime-desc" x="526" y="182">Main has moved on underneath it</text>
  <text class="branch-lifetime-desc" x="526" y="216">Conflicts across many files at once</text>
  <text class="branch-lifetime-desc" x="526" y="250">A review nobody has time to do properly</text>
  <text class="branch-lifetime-desc" x="526" y="284">Abandoning it now wastes three weeks</text>
  <text class="branch-lifetime-desc" x="526" y="318">Merging it becomes its own project</text>
  <text class="branch-lifetime-sub" x="30" y="372">This is why trunk-based work suits experiments: the branch that survives longest is the one hardest to trust.</text>
</svg>
