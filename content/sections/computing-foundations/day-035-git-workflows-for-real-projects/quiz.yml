questions:
  - question: 'What best describes GitHub Flow?'
    options:
      - 'Everyone commits directly to main many times a day with no branches'
      - 'Create a short-lived branch, open a pull request for review, then merge back to a main that stays deployable'
      - 'Maintain long-lived develop and release branches and merge to main only at release time'
      - 'Keep every feature on its own permanent branch that is never merged'
    answer_index: 1
    explanation: 'GitHub Flow is a lightweight, trunk-based-style model: branch off main, get the change reviewed as a pull request, and merge back while keeping main always deployable.'

  - question: 'Which situation is Git Flow, with its long-lived develop and release branches, best suited to?'
    options:
      - 'A tiny solo experiment you will delete next week'
      - 'A service that deploys to production dozens of times a day'
      - 'Installed or versioned software that ships discrete releases which must be stabilized and supported'
      - 'A repository that stores only images and no code'
    answer_index: 2
    explanation: 'Git Flow''s extra branches pay off when you ship scheduled, versioned releases that need a stabilization period and ongoing support; for continuously deployed services the ceremony is usually more cost than benefit.'

  - question: 'What is an atomic commit, and why does it matter?'
    options:
      - 'A commit that is encrypted so it cannot be read'
      - 'A commit containing exactly one logical change, so it can be reviewed, reverted, or bisected on its own'
      - 'The very first commit in a repository'
      - 'A commit that touches every file in the project at once'
    answer_index: 1
    explanation: 'An atomic commit does one logical thing, which makes it possible to revert just that change, review it in isolation, and use git bisect to find which commit introduced a bug.'

  - question: 'Under semantic versioning, a project at v1.4.2 adds a new backward-compatible feature. What is the next version?'
    options:
      - 'v1.4.3'
      - 'v1.5.0'
      - 'v2.0.0'
      - 'v1.4.2-feature'
    answer_index: 1
    explanation: 'A backward-compatible new feature increments the MINOR number and resets PATCH to zero, giving v1.5.0. PATCH is for bug fixes; MAJOR is for breaking changes.'

  - question: 'What is the difference between a lightweight tag and an annotated tag?'
    options:
      - 'A lightweight tag can move, while an annotated tag is fixed'
      - 'A lightweight tag is just a name on a commit; an annotated tag also stores the tagger, date, and a message'
      - 'A lightweight tag works only on Linux, an annotated tag only on macOS'
      - 'They are two names for the same thing'
    answer_index: 1
    explanation: 'Both point at one commit, but an annotated tag (git tag -a) is a full object recording who created it, when, and why — which is what releases should use.'

  - question: 'When is it dangerous to rebase or squash?'
    options:
      - 'Any time you use them at all'
      - 'When tidying your own local commits before they are reviewed'
      - 'When rewriting history on a branch that others have already pulled and based work on'
      - 'Only on branches with fewer than three commits'
    answer_index: 2
    explanation: 'Rebase and squash rewrite history into new commits. Doing that to your own unpushed work is safe; doing it to shared history breaks everyone else''s clone, so the rule is never rewrite history others already have.'

  - question: 'What does the --no-ff flag do when you run git merge?'
    options:
      - 'It deletes the branch being merged'
      - 'It forces a merge commit even when a fast-forward was possible, recording that the changes arrived as one reviewed unit'
      - 'It skips running any tests during the merge'
      - 'It merges without asking for a commit message ever'
    answer_index: 1
    explanation: '--no-ff ("no fast-forward") makes git create a merge commit instead of sliding main forward, so the history permanently shows the feature branch merging back — the shape of a merged pull request.'

  - question: 'A teammate wants to commit a 3 GB dataset and a .env file containing an API key. What is the right handling?'
    options:
      - 'Commit both normally; git handles any file the same way'
      - 'Keep the dataset in Git LFS (or out of the repo) and add .env to .gitignore so the secret is never committed'
      - 'Commit the .env file but delete it in the next commit to remove it from history'
      - 'Compress both into one zip and commit that instead'
    answer_index: 1
    explanation: 'Large binaries belong in Git LFS or outside the repo to avoid bloating history, and secrets must be excluded via .gitignore — committing a secret leaves it in history forever, even after a later deletion.'
