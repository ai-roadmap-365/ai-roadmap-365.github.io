visuals:
  - id: workflow-comparison
    file: assets/workflow-comparison.svg
    type: diagram
    title: 'Three branching strategies, compared'
    alt: 'Diagram comparing the branch shapes of trunk-based development, GitHub Flow, and Git Flow'
    description: 'A three-panel comparison: trunk-based development as one main line with many commits and no lasting branches; GitHub Flow as a main line with a single short-lived feature branch that arcs up, gathers commits, and merges back as a pull request; and Git Flow as stacked feature, develop, and main lines with a release branch bridging develop to a tagged main.'
  - id: release-tagging
    file: assets/release-tagging.svg
    type: flowchart
    title: 'From commits to a tagged release'
    alt: 'Flow diagram: a sequence of commits leading to an annotated tag v1.0.0 and a labeled release, with the MAJOR.MINOR.PATCH parts of the version explained'
    description: 'A commit chain (chore, feat, fix, then a merge commit) with an annotated tag v1.0.0 pinned to the merge commit and an arrow to a release box, followed by a breakdown of the version number 1.0.0 into MAJOR (breaking change), MINOR (new feature), and PATCH (bug fix).'
  - id: branch-lifetime
    file: assets/branch-lifetime.svg
    type: diagram
    title: 'Short-lived branches, and what happens when they are not'
    alt: 'Diagram: a short-lived branch compared with a long-lived one'
    description: 'A two-column comparison of a branch merged within days and one open for weeks, covering conflict likelihood, review size and the cost of integration.'
  - id: atomic-commit
    file: assets/atomic-commit.svg
    type: diagram
    title: 'Why one commit should do one thing'
    alt: 'Diagram: an atomic commit compared with a mixed one'
    description: 'A two-column comparison of atomic commits against commits mixing several changes, covering revertability, reviewability and whether bisect can isolate a defect.'
  - id: bisect
    file: assets/bisect.svg
    type: diagram
    title: 'git bisect finds a regression in logarithmic time'
    alt: 'Diagram: how git bisect binary-searches history for a bad commit'
    description: 'A four-stage explanation of git bisect covering marking a known-good and known-bad commit, testing the midpoint, halving the range each time, and arriving at the first bad commit.'
  - id: semver-promise
    file: assets/semver-promise.svg
    type: diagram
    title: 'A version number is a promise about breakage'
    alt: 'Diagram: what each part of a semantic version number means'
    description: 'A three-stage explanation of semantic versioning covering patch, minor and major increments and what each tells a user to expect when upgrading.'
  - id: branch-lifetime-cost
    file: assets/branch-lifetime-cost.svg
    type: diagram
    title: 'Every workflow is managing the same thing'
    alt: 'Diagram: short-lived branches compared with long-lived ones'
    description: 'A two-column comparison of short-lived and long-lived branches covering conflict size, review quality, integration risk and how each workflow addresses them.'
  - id: hooks-are-local
    file: assets/hooks-are-local.svg
    type: diagram
    title: 'Hooks are local, which is the catch'
    alt: 'Diagram: why git hooks are not shared by cloning'
    description: 'A two-column comparison of hooks written directly in the git directory against hooks managed by a framework, covering whether they travel with a clone.'
  - id: model-versioning
    file: assets/model-versioning.svg
    type: diagram
    title: 'Versioning a model'
    alt: 'Diagram: how semantic versioning applies to a trained model'
    description: 'A two-column comparison of model changes that preserve the interface against those that break it, mapped onto minor and major version increments.'
  - id: workflow-history
    file: assets/workflow-history.svg
    type: diagram
    title: 'Why the recommended workflow changed'
    alt: 'Diagram: how branching workflows evolved with delivery practice'
    description: 'A four-stage progression of branching workflows from Git Flow through GitHub Flow to trunk-based development, tied to how software delivery changed over the same period.'
  - id: lfs-pointer
    file: assets/lfs-pointer.svg
    type: diagram
    title: 'What Git LFS actually stores'
    alt: 'Diagram: how Git LFS keeps large files out of the repository history'
    description: 'A four-stage explanation of Git LFS covering the small pointer stored in the repository, the separate object store holding the real content, and the effect on clone size.'
  - id: release-checklist
    file: assets/release-checklist.svg
    type: diagram
    title: 'Cutting a release'
    alt: 'Diagram: the steps of tagging and publishing a release'
    description: 'A four-stage release procedure covering deciding the version from the commit log, creating an annotated tag, pushing the tag explicitly, and recording the changelog.'
