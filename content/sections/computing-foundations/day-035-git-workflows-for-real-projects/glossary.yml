terms:
  - term: workflow
    definition: 'A team''s shared set of rules for how changes flow from an idea into the main line of a project — which branches exist, how changes are reviewed, and how releases are marked.'
  - term: trunk-based development
    definition: 'A branching strategy where everyone commits to a single main branch (the trunk) many times a day, with any branches living only hours, relying on strong automated tests.'
  - term: GitHub Flow
    definition: 'A lightweight workflow: create a short-lived branch, open a pull request for review, then merge back into a main branch that is always kept deployable.'
  - term: Git Flow
    definition: 'A heavier branching model with long-lived main and develop branches plus temporary feature, release, and hotfix branches, suited to scheduled, versioned releases.'
  - term: tag
    definition: 'A fixed name pinned to one specific commit that never moves, used to mark releases; contrast with a branch, which advances with each new commit.'
  - term: annotated tag
    definition: 'A tag created with git tag -a that stores the tagger, date, and a message as a full git object — the kind used for releases.'
  - term: semantic versioning
    definition: 'A convention that gives version numbers meaning as MAJOR.MINOR.PATCH: MAJOR for breaking changes, MINOR for backward-compatible features, PATCH for backward-compatible bug fixes.'
  - term: Conventional Commits
    definition: 'A specification for structured commit messages of the form type(scope): description, using a small vocabulary such as feat, fix, docs, and refactor, so humans and tools can read the history.'
  - term: atomic commit
    definition: 'A commit that contains exactly one logical change, making it possible to review, revert, or bisect that change in isolation.'
  - term: Git LFS
    definition: 'Git Large File Storage, an extension that keeps large binaries (datasets, models, media) out of the repository''s normal storage by committing a small pointer and storing the real bytes separately.'
  - term: monorepo
    definition: 'A single repository that holds many projects together, making cross-project changes atomic and shared tooling simpler; contrast with a polyrepo, which gives each project its own repository.'
  - term: pre-commit hook
    definition: 'A script git runs automatically before a commit is recorded, able to reject the commit — commonly used to run formatters, linters, or secret scanners.'
