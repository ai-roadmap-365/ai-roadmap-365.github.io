id: D035
day: 35
slug: git-workflows-for-real-projects
title: 'Git Workflows for Real Projects'
section: computing-foundations
subsection: developer-workflow
week: 5
learning_promise: 'After this lesson you will be able to choose and run a real team git workflow — branching strategy, atomic commits with Conventional Commit messages, and semantic-versioned release tags — so a repository stays legible, releasable, and reproducible.'
objectives:
  - 'Compare trunk-based development, GitHub Flow, and Git Flow, and choose the right one for a given release rhythm and team size'
  - 'Write atomic commits with clear, imperative messages that follow the Conventional Commits structure (feat:, fix:, and friends)'
  - 'Tag a release with an annotated tag and choose the correct MAJOR.MINOR.PATCH version under semantic versioning'
  - 'Explain when it is safe to rebase or squash and the one rule that makes rewriting shared history dangerous'
  - 'Keep a repository healthy with a .gitignore, an awareness of Git LFS for large files, and the concept of a pre-commit hook'
  - 'Run a full GitHub Flow cycle locally — branch, atomic commits, --no-ff merge, and a v1.0.0 tag — and read the resulting history'
  - 'Connect disciplined git workflows to reproducibility in real projects, including versioning datasets and models with tags and LFS'
prerequisites:
  - 'Days 29-34: version control basics, commits, branching and merging, remotes, pull requests and code review, and undoing changes'
  - 'A computer with git installed and a terminal (macOS, Linux, or Windows via WSL)'
reading_time_minutes: 40
practical_time_minutes: 30
last_verified: '2026-07-12'
tags: [git, workflows, semantic-versioning, conventional-commits, developer-workflow]
