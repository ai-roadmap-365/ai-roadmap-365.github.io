questions:
  - question: 'What does the pipe operator `|` do in a command like `cat log | grep 404`?'
    options:
      - 'It saves the output of `cat` to a temporary file that `grep` then opens'
      - 'It connects the standard output of `cat` directly to the standard input of `grep`'
      - 'It runs `cat` and `grep` on two separate files at the same time'
      - 'It tells the shell to ignore any errors from `cat`'
    answer_index: 1
    explanation: 'A pipe streams one program''s standard output straight into the next program''s standard input, in memory, with no intermediate file — the core mechanism of composing small tools.'

  - question: 'Which statement about the three standard streams is correct?'
    options:
      - 'Standard input, output, and error all go to the same place and cannot be separated'
      - 'Standard error is where a program reads its input from'
      - 'Standard output carries a program''s results while standard error carries its diagnostic messages, and the two are kept separate'
      - 'Standard output is only used when writing to a file'
    answer_index: 2
    explanation: 'Results travel on stdout and diagnostics on stderr; keeping them separate is what lets a pipe carry clean data while error messages still reach your screen.'

  - question: 'Why does `uniq` almost always need `sort` before it in a pipeline?'
    options:
      - '`uniq` runs faster on sorted input but produces the same result either way'
      - '`uniq` only collapses duplicate lines that are adjacent, so identical lines must first be brought together by sorting'
      - '`sort` is required to convert the text into a format `uniq` can read'
      - '`uniq` cannot read from a pipe unless `sort` opens the stream first'
    answer_index: 1
    explanation: '`uniq` compares each line only with the one before it, so it collapses runs of adjacent duplicates; sorting first groups all identical lines together. `sort -u` does both steps at once.'

  - question: 'What is the key difference between `>` and `|`?'
    options:
      - '`>` writes standard output into a file, while `|` streams standard output into another program'
      - 'They are identical; both send output to a file'
      - '`>` appends to a file, while `|` overwrites it'
      - '`|` writes to a file, while `>` sends output to another program'
    answer_index: 0
    explanation: 'A redirect (`>`) sends output to a file (overwriting it), while a pipe (`|`) sends output to another running program. `>>` is the append form of the redirect.'

  - question: 'Which pipeline correctly prints the five most common values in the first column of a space-separated file?'
    options:
      - 'cut -d'' '' -f1 file | uniq -c | head -n 5'
      - 'cut -d'' '' -f1 file | sort | uniq -c | sort -rn | head -n 5'
      - 'sort file | cut -d'' '' -f1 | head -n 5'
      - 'grep -c file | sort -rn | head -n 5'
    answer_index: 1
    explanation: 'Extract the column with cut, group duplicates with sort, count each run with uniq -c, rank by count with sort -rn, and keep the top five with head — the canonical top-N pattern.'

  - question: 'What does `sed ''s/cat/dog/g''` do to each line of its input?'
    options:
      - 'Deletes every line that contains the word cat'
      - 'Replaces only the first occurrence of cat with dog on each line'
      - 'Replaces every occurrence of cat with dog on each line'
      - 'Permanently rewrites the original file, replacing cat with dog'
    answer_index: 2
    explanation: 'The trailing `g` (global) makes the substitution replace every match on a line, not just the first; by default sed prints the changed stream and leaves the source file untouched.'

  - question: 'In the log line format `IP - - [time] "GET /path HTTP/1.1" status size`, which command counts requests that returned status 404 by matching the ninth field?'
    options:
      - 'grep -v 404 access.log | wc -l'
      - 'cut -d'' '' -f1 access.log | wc -l'
      - 'awk ''$9 == 404'' access.log | wc -l'
      - 'sort access.log | uniq -c'
    answer_index: 2
    explanation: 'awk splits each line into whitespace-separated fields, so `$9 == 404` selects only lines whose status field is 404; piping to `wc -l` counts them. Matching the exact field avoids false hits from a stray 404 elsewhere in the line.'

  - question: 'Which best states the Unix philosophy behind these tools?'
    options:
      - 'Build one large program that can perform every text operation you might need'
      - 'Always store intermediate results in files so each step can be inspected later'
      - 'Prefer graphical tools because they are easier for beginners to use'
      - 'Write small programs that each do one thing well and work together through text streams'
    answer_index: 3
    explanation: 'The philosophy favors small, single-purpose programs composed through a universal text interface — which is exactly why pipes make the tools so powerful in combination.'
