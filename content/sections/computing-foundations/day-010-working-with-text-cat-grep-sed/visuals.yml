visuals:
  - id: stdio-streams
    file: assets/stdio-streams.svg
    type: diagram
    title: 'The three standard streams'
    alt: "Architecture diagram: a program's three standard streams — stdin, stdout, and stderr — and the pipes and redirects that connect them"
    description: 'A program at the center reads from standard input (stdin, fd 0) and writes to two separate outputs — standard output (stdout, fd 1) for results and standard error (stderr, fd 2) for diagnostics — with a legend showing how the pipe and the redirect operators connect these streams to other programs and files.'
  - id: pipeline-flow
    file: assets/pipeline-flow.svg
    type: flowchart
    title: 'A four-stage pipeline'
    alt: 'Flow diagram: text flowing through a cat, grep, sort, and uniq pipeline connected by pipes'
    description: 'Text from a log file flows left to right through four stages — cat reads the lines, grep keeps the matches, sort orders them, and uniq -c counts them — with each pipe wiring one stage''s standard output into the next stage''s standard input, ending at the terminal.'
  - id: pipeline-stages
    file: assets/pipeline-stages.svg
    type: diagram
    title: 'A pipeline is four small programs, none of which knows the others exist'
    alt: 'Diagram: text flowing through cat, grep, sort and uniq in a pipeline'
    description: 'A five-stage sequence showing a log file passing through cat, grep, sort and uniq -c, with the number of lines surviving each stage.'
  - id: unix-philosophy
    file: assets/unix-philosophy.svg
    type: diagram
    title: 'One big program, or many small ones'
    alt: 'Diagram: a monolithic tool compared with composable small tools'
    description: 'A two-column comparison of a single large program that does everything against a set of small single-purpose programs connected by pipes, covering flexibility, learning cost and what happens when requirements change.'
  - id: redirect-versus-pipe
    file: assets/redirect-versus-pipe.svg
    type: diagram
    title: 'Redirection and piping are not the same'
    alt: 'Diagram: redirection to a file compared with a pipe between programs'
    description: 'A two-column comparison of stream redirection, which connects a stream to a file, against piping, which connects one program''s output directly to another program''s input with no file involved.'
  - id: grep-flags
    file: assets/grep-flags.svg
    type: diagram
    title: 'Five grep flags carry most of the value'
    alt: 'Diagram: the most useful grep flags and what each does'
    description: 'A five-stage reference to the grep flags for case-insensitive matching, counting, line numbers, inverted matching and recursive directory search.'
  - id: tally-idiom
    file: assets/tally-idiom.svg
    type: diagram
    title: 'sort | uniq -c | sort -rn'
    alt: 'Diagram: the sort, uniq and sort pipeline that tallies and ranks values'
    description: 'A four-stage sequence showing why counting values requires sorting first so that uniq can collapse adjacent duplicates, then sorting numerically in reverse to rank the counts.'
  - id: stderr-separation
    file: assets/stderr-separation.svg
    type: diagram
    title: 'Why errors do not poison your pipeline'
    alt: 'Diagram: standard output compared with standard error'
    description: 'A two-column comparison of standard output and standard error explaining that data travels on one and diagnostics on the other, so that piping carries only the data and error messages still reach the screen.'
  - id: build-incrementally
    file: assets/build-incrementally.svg
    type: diagram
    title: 'Build a pipeline one stage at a time'
    alt: 'Diagram: growing a pipeline one stage at a time and checking the output'
    description: 'A five-stage walkthrough of building the top-client-IPs pipeline incrementally, from reading the log through cutting the column, sorting, counting and ranking, checking the intermediate output at each step.'
  - id: streaming-versus-loading
    file: assets/streaming-versus-loading.svg
    type: diagram
    title: 'Why a pipeline handles a file bigger than your laptop'
    alt: 'Diagram: streaming a file compared with loading it into memory'
    description: 'A two-column comparison of streaming tools that process a file line by line against tools that load a whole file into memory, covering peak memory use, the largest file each can handle, and which operations force a tool to stop streaming.'
  - id: tool-for-the-shape
    file: assets/tool-for-the-shape.svg
    type: diagram
    title: 'Match the tool to the shape of the data'
    alt: 'Diagram: which text tool suits which data shape'
    description: 'A two-column comparison of data shapes suited to line-based Unix text tools against shapes that require a format-aware tool.'
