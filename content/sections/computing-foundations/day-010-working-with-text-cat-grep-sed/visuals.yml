visuals:
  - id: stdio-streams
    file: assets/stdio-streams.svg
    type: diagram
    title: 'The three standard streams'
    alt: "Architecture diagram: a program's three standard streams — stdin, stdout, and stderr — and the pipes and redirects that connect them"
    description: 'A program at the center reads from standard input (stdin, fd 0) and writes to two separate outputs — standard output (stdout, fd 1) for results and standard error (stderr, fd 2) for diagnostics — with a legend showing how the pipe and the redirect operators connect these streams to other programs and files.'
  - id: pipeline-flow
    file: assets/pipeline-flow.svg
    type: flowchart
    title: 'A four-stage pipeline'
    alt: 'Flow diagram: text flowing through a cat, grep, sort, and uniq pipeline connected by pipes'
    description: 'Text from a log file flows left to right through four stages — cat reads the lines, grep keeps the matches, sort orders them, and uniq -c counts them — with each pipe wiring one stage''s standard output into the next stage''s standard input, ending at the terminal.'
