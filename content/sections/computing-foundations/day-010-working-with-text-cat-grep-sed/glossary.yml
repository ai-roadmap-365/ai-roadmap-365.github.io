terms:
  - term: Unix philosophy
    definition: 'A design approach that favors small programs each doing one job well, built to work together, communicating through text streams as a universal interface.'
  - term: pipe
    definition: 'The `|` operator, which connects one command''s standard output directly to the next command''s standard input so data flows between programs without any intermediate file.'
  - term: standard input
    definition: 'The default stream (stdin, file descriptor 0) a program reads from — the keyboard by default, or a file or pipe when redirected.'
  - term: standard output
    definition: 'The default stream (stdout, file descriptor 1) a program writes its results to — the terminal by default, or a file or the next command in a pipe when redirected.'
  - term: standard error
    definition: 'A second output stream (stderr, file descriptor 2) reserved for error and diagnostic messages, kept separate from standard output so errors never contaminate the data flowing through a pipe.'
  - term: redirection
    definition: 'Connecting a program''s stream to a file: `>` overwrites a file with standard output, `>>` appends to it, `<` supplies standard input from a file, and `2>` sends standard error to a file.'
  - term: filter
    definition: 'A program that reads a text stream, transforms it, and writes a text stream — such as grep, sed, sort, uniq, cut, or wc — the building block of a pipeline.'
  - term: cat
    definition: 'A command that prints the contents of one or more files to standard output, commonly used to view a short file or feed a file into a pipeline.'
  - term: grep
    definition: 'A command that searches its input line by line and prints the lines matching a pattern; common flags include -i (ignore case), -c (count), -n (line numbers), -v (invert), and -r (recursive).'
  - term: sed
    definition: 'The stream editor: a command that applies editing operations — most often substitution with `s/old/new/` — to a flowing stream of text, printing the result without changing the source file by default.'
  - term: regular expression
    definition: 'A compact notation for describing text patterns, where symbols such as ^ (start of line), $ (end of line), . (any character), and [0-9] (any digit) let a single expression match many strings.'
  - term: uniq
    definition: 'A command that collapses adjacent identical lines into one, and with -c prefixes each with a count of how many times it repeated — usually paired with a preceding sort.'
