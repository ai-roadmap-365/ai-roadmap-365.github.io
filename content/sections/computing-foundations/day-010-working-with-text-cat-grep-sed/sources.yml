sources:
  - title: 'The Missing Semester of Your CS Education — Data Wrangling'
    url: 'https://missing.csail.mit.edu/2020/data-wrangling/'
    publisher: 'MIT'
    accessed: '2026-07-12'
    note: 'A hands-on lecture on chaining command-line tools to slice and transform text.'
  - title: 'The Linux Command Line'
    url: 'https://linuxcommand.org/'
    publisher: 'William Shotts'
    accessed: '2026-07-12'
    note: 'A free book-length introduction to the shell, pipes, redirection, and text tools.'
  - title: 'GNU Grep Manual'
    url: 'https://www.gnu.org/software/grep/manual/grep.html'
    publisher: 'GNU Project'
    accessed: '2026-07-12'
    note: 'The authoritative reference for grep options and regular-expression syntax.'
  - title: 'GNU Sed Manual'
    url: 'https://www.gnu.org/software/sed/manual/sed.html'
    publisher: 'GNU Project'
    accessed: '2026-07-12'
    note: 'The authoritative reference for sed commands, including substitution.'
  - title: 'Pipeline (Unix)'
    url: 'https://en.wikipedia.org/wiki/Pipeline_(Unix)'
    publisher: 'Wikipedia'
    accessed: '2026-07-12'
