<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Each reads standard input and writes standard output. That is the entire contract.">
  <title>A pipeline is four small programs, none of which knows the others exist</title>
  <style>
    .pipeline-stages-bg   { fill: #f8fafc; }
    .pipeline-stages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-stages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-stages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-stages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-stages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-stages-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .pipeline-stages-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-stages-tok { animation: pipeline-stages-travel 7s ease-in-out infinite; }
    }
    @keyframes pipeline-stages-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--pipeline-stages-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pipeline-stages-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="pipeline-stages-bg" width="980" height="334"/>
  <text class="pipeline-stages-h1"  x="30" y="40">A pipeline is four small programs, none of which knows the others exist</text>
  <text class="pipeline-stages-sub" x="30" y="64">Each reads standard input and writes standard output. That is the entire contract.</text>
  <rect class="pipeline-stages-box" x="30" y="132" width="166" height="96" rx="9"/>
  <text class="pipeline-stages-name" x="44" y="160">access.log</text>
  <text class="pipeline-stages-desc" x="44" y="182">The whole file, every</text>
  <text class="pipeline-stages-desc" x="44" y="198">line.</text>
  <text class="pipeline-stages-edge" x="44" y="248">48,000 lines</text>
  <line class="pipeline-stages-line" x1="199" y1="180" x2="215" y2="180"/>
  <rect class="pipeline-stages-box" x="218" y="132" width="166" height="96" rx="9"/>
  <text class="pipeline-stages-name" x="232" y="160">grep 404</text>
  <text class="pipeline-stages-desc" x="232" y="182">Keeps only lines</text>
  <text class="pipeline-stages-desc" x="232" y="198">containing the pattern.</text>
  <text class="pipeline-stages-edge" x="232" y="248">1,240 lines</text>
  <line class="pipeline-stages-line" x1="387" y1="180" x2="403" y2="180"/>
  <rect class="pipeline-stages-box" x="406" y="132" width="166" height="96" rx="9"/>
  <text class="pipeline-stages-name" x="420" y="160">cut -d' ' -f7</text>
  <text class="pipeline-stages-desc" x="420" y="182">Keeps only the seventh</text>
  <text class="pipeline-stages-desc" x="420" y="198">field of each line.</text>
  <text class="pipeline-stages-edge" x="420" y="248">1,240 paths</text>
  <line class="pipeline-stages-line" x1="575" y1="180" x2="591" y2="180"/>
  <rect class="pipeline-stages-hi" x="594" y="132" width="166" height="96" rx="9"/>
  <text class="pipeline-stages-name" x="608" y="160">sort</text>
  <text class="pipeline-stages-desc" x="608" y="182">Brings identical values</text>
  <text class="pipeline-stages-desc" x="608" y="198">next to each other.</text>
  <text class="pipeline-stages-edge" x="608" y="248">required next</text>
  <line class="pipeline-stages-line" x1="763" y1="180" x2="779" y2="180"/>
  <rect class="pipeline-stages-box" x="782" y="132" width="166" height="96" rx="9"/>
  <text class="pipeline-stages-name" x="796" y="160">uniq -c</text>
  <text class="pipeline-stages-desc" x="796" y="182">Collapses adjacent</text>
  <text class="pipeline-stages-desc" x="796" y="198">duplicates and counts</text>
  <text class="pipeline-stages-desc" x="796" y="214">them.</text>
  <text class="pipeline-stages-edge" x="796" y="248">38 paths</text>
  <rect class="pipeline-stages-tok" x="34" y="106" width="58" height="14" rx="3" style="--pipeline-stages-run: 752px"/>
  <text class="pipeline-stages-sub" x="30" y="314">uniq only collapses ADJACENT duplicates, which is the whole reason sort has to come first.</text>
</svg>
