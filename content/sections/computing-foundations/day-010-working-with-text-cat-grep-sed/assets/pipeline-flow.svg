<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" font-family="system-ui, sans-serif">
  <title>Text flowing through a four-stage pipeline: cat, then grep, then sort, then uniq, connected by pipes</title>
  <rect x="0" y="0" width="820" height="380" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A pipeline: each tool's output is the next tool's input</text>

  <!-- Source file -->
  <rect x="24" y="150" width="120" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="84" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">access.log</text>
  <text x="84" y="202" text-anchor="middle" font-size="14" fill="#1a202c">the file</text>

  <!-- Stage boxes -->
  <rect x="196" y="150" width="120" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="256" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">cat</text>
  <text x="256" y="200" text-anchor="middle" font-size="14" fill="#1a202c">read lines</text>

  <rect x="356" y="150" width="120" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="416" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">grep 404</text>
  <text x="416" y="200" text-anchor="middle" font-size="14" fill="#1a202c">keep matches</text>

  <rect x="516" y="150" width="120" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="576" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">sort</text>
  <text x="576" y="200" text-anchor="middle" font-size="14" fill="#1a202c">order lines</text>

  <rect x="676" y="150" width="120" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="736" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">uniq -c</text>
  <text x="736" y="200" text-anchor="middle" font-size="14" fill="#1a202c">count runs</text>

  <!-- Arrows between stages, labelled with the pipe -->
  <line x1="144" y1="185" x2="188" y2="185" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="196,185 182,178 182,192" fill="#1d4ed8"/>

  <line x1="316" y1="185" x2="348" y2="185" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="356,185 342,178 342,192" fill="#1d4ed8"/>
  <text x="332" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">|</text>

  <line x1="476" y1="185" x2="508" y2="185" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="516,185 502,178 502,192" fill="#1d4ed8"/>
  <text x="492" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">|</text>

  <line x1="636" y1="185" x2="668" y2="185" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="676,185 662,178 662,192" fill="#1d4ed8"/>
  <text x="652" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">|</text>

  <!-- stdin / stdout labels along the flow -->
  <text x="170" y="240" text-anchor="middle" font-size="13" fill="#1a202c">stdout→stdin</text>
  <text x="332" y="240" text-anchor="middle" font-size="13" fill="#1a202c">stdout→stdin</text>
  <text x="492" y="240" text-anchor="middle" font-size="13" fill="#1a202c">stdout→stdin</text>
  <text x="652" y="240" text-anchor="middle" font-size="13" fill="#1a202c">stdout→stdin</text>

  <!-- Final output to terminal -->
  <line x1="736" y1="220" x2="736" y2="288" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="736,296 729,282 743,282" fill="#1d4ed8"/>
  <rect x="626" y="296" width="220" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="736" y="327" text-anchor="middle" font-size="14" fill="#1a202c">final result → your terminal</text>

  <!-- Note -->
  <text x="410" y="76" text-anchor="middle" font-size="14" fill="#1a202c">The pipe "|" wires one tool's standard output into the next tool's standard input. No file is written between stages.</text>
</svg>
