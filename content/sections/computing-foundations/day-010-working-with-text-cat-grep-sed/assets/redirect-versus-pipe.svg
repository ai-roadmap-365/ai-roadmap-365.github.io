<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="One writes to a file. One connects two programs.">
  <title>Redirection and piping are not the same</title>
  <style>
    .redirect-versus-pipe-bg   { fill: #f8fafc; }
    .redirect-versus-pipe-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirect-versus-pipe-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirect-versus-pipe-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirect-versus-pipe-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirect-versus-pipe-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirect-versus-pipe-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .redirect-versus-pipe-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .redirect-versus-pipe-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .redirect-versus-pipe-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .redirect-versus-pipe-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .redirect-versus-pipe-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .redirect-versus-pipe-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .redirect-versus-pipe-row { opacity: 1; }
    .redirect-versus-pipe-r0 { animation-delay: 0.00s; }
    .redirect-versus-pipe-r1 { animation-delay: 0.45s; }
    .redirect-versus-pipe-r2 { animation-delay: 0.90s; }
    .redirect-versus-pipe-r3 { animation-delay: 1.35s; }
    .redirect-versus-pipe-r4 { animation-delay: 1.80s; }
    .redirect-versus-pipe-r5 { animation-delay: 2.25s; }
    .redirect-versus-pipe-row { animation: redirect-versus-pipe-reveal 7.7s ease-in-out infinite; }
    @keyframes redirect-versus-pipe-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="redirect-versus-pipe-bg" width="980" height="424"/>
  <text class="redirect-versus-pipe-h1"  x="30" y="40">Redirection and piping are not the same</text>
  <text class="redirect-versus-pipe-sub" x="30" y="64">One writes to a file. One connects two programs.</text>
  <rect class="redirect-versus-pipe-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="redirect-versus-pipe-name" x="46" y="122">Redirection</text>
  <text class="redirect-versus-pipe-desc" x="46" y="142">Connects a stream to a file.</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r0" x="46" y="182">&gt; overwrites the file, silently</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r1" x="46" y="216">this appends instead: &gt;&gt;</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r2" x="46" y="250">&lt; takes input from a file</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r3" x="46" y="284">2&gt; sends errors to a file</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r4" x="46" y="318">The data lands on disk</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r5" x="46" y="352">Useful for keeping results</text>
  <rect class="redirect-versus-pipe-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="redirect-versus-pipe-name" x="526" y="122">Piping</text>
  <text class="redirect-versus-pipe-desc" x="526" y="142">Connects one program to the next.</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r0" x="526" y="182">| joins stdout to stdin</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r1" x="526" y="216">No file is created at all</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r2" x="526" y="250">Both programs run at the same time</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r3" x="526" y="284">Data flows as it is produced</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r4" x="526" y="318">Nothing touches disk</text>
  <text class="redirect-versus-pipe-desc redirect-versus-pipe-row redirect-versus-pipe-r5" x="526" y="352">Useful for transforming on the way</text>
  <text class="redirect-versus-pipe-sub" x="30" y="406">A pipeline can process a file larger than your disk, because nothing is ever stored — the data flows through.</text>
</svg>
