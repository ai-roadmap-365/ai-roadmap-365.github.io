<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Line-oriented text is where these tools shine.">
  <title>Match the tool to the shape of the data</title>
  <style>
    .tool-for-the-shape-bg   { fill: #f8fafc; }
    .tool-for-the-shape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-for-the-shape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-for-the-shape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-for-the-shape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-for-the-shape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-for-the-shape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-for-the-shape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-for-the-shape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-for-the-shape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-for-the-shape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-for-the-shape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-for-the-shape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-for-the-shape-row { opacity: 1; }
    .tool-for-the-shape-r0 { animation-delay: 0.00s; }
    .tool-for-the-shape-r1 { animation-delay: 0.45s; }
    .tool-for-the-shape-r2 { animation-delay: 0.90s; }
    .tool-for-the-shape-r3 { animation-delay: 1.35s; }
    .tool-for-the-shape-r4 { animation-delay: 1.80s; }
    .tool-for-the-shape-row { animation: tool-for-the-shape-reveal 7.3s ease-in-out infinite; }
    @keyframes tool-for-the-shape-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tool-for-the-shape-bg" width="980" height="390"/>
  <text class="tool-for-the-shape-h1"  x="30" y="40">Match the tool to the shape of the data</text>
  <text class="tool-for-the-shape-sub" x="30" y="64">Line-oriented text is where these tools shine.</text>
  <rect class="tool-for-the-shape-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tool-for-the-shape-name" x="46" y="122">Line tools work</text>
  <text class="tool-for-the-shape-desc" x="46" y="142">grep, cut, sort, uniq.</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r0" x="46" y="182">Log files, one record per line</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r1" x="46" y="216">Simple CSV with no quoted commas</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r2" x="46" y="250">Column-aligned output</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r3" x="46" y="284">JSONL — one object per line</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r4" x="46" y="318">Anything where a line is a record</text>
  <rect class="tool-for-the-shape-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tool-for-the-shape-name" x="526" y="122">Use a real parser</text>
  <text class="tool-for-the-shape-desc" x="526" y="142">jq, csvkit, a library.</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r0" x="526" y="182">JSON spanning multiple lines</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r1" x="526" y="216">CSV with commas inside quotes</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r2" x="526" y="250">XML or HTML</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r3" x="526" y="284">Anything with nested structure</text>
  <text class="tool-for-the-shape-desc tool-for-the-shape-row tool-for-the-shape-r4" x="526" y="318">Anything where a record spans lines</text>
  <text class="tool-for-the-shape-sub" x="30" y="372">The failure mode of using a line tool on nested data is the dangerous one: it works on your sample and silently mangles the first record that contains a newline or a quoted delimiter.</text>
</svg>
