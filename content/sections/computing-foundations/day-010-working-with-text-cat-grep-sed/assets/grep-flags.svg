<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="You will use these more than any other options in this course.">
  <title>Five grep flags carry most of the value</title>
  <style>
    .grep-flags-bg   { fill: #f8fafc; }
    .grep-flags-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grep-flags-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grep-flags-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grep-flags-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grep-flags-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grep-flags-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grep-flags-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .grep-flags-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .grep-flags-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .grep-flags-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .grep-flags-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .grep-flags-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .grep-flags-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .grep-flags-stage { opacity: 1; }

    .grep-flags-s0 { animation-delay: 0.00s; }
    .grep-flags-e0 { animation-delay: 0.00s; }
    .grep-flags-s1 { animation-delay: 1.33s; }
    .grep-flags-e1 { animation-delay: 1.33s; }
    .grep-flags-s2 { animation-delay: 2.67s; }
    .grep-flags-e2 { animation-delay: 2.67s; }
    .grep-flags-s3 { animation-delay: 4.00s; }
    .grep-flags-e3 { animation-delay: 4.00s; }
    .grep-flags-s4 { animation-delay: 5.33s; }
    .grep-flags-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .grep-flags-conn  { animation: grep-flags-trace 8s ease-in-out infinite; }
      .grep-flags-stage { animation: grep-flags-arrive 8s ease-in-out infinite; }
    }
    @keyframes grep-flags-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes grep-flags-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .grep-flags-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .grep-flags-stage { animation: grep-flags-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes grep-flags-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="grep-flags-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="grep-flags-bg" width="980" height="322"/>
  <text class="grep-flags-h1"  x="30" y="40">Five grep flags carry most of the value</text>
  <text class="grep-flags-sub" x="30" y="64">You will use these more than any other options in this course.</text>
  <g class="grep-flags-stage grep-flags-s0">
    <rect class="grep-flags-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="grep-flags-step" x="44" y="142">01</text>
    <text class="grep-flags-name" x="70" y="142">-i</text>
    <text class="grep-flags-desc" x="44" y="166">Ignore case. ERROR, Error</text>
    <text class="grep-flags-desc" x="44" y="182">and error all match.</text>
    <text class="grep-flags-edge" x="44" y="242">case</text>
  </g>
  <line class="grep-flags-line grep-flags-conn grep-flags-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#grep-flags-tip)"/>
  <g class="grep-flags-stage grep-flags-s1">
    <rect class="grep-flags-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="grep-flags-step" x="233" y="142">02</text>
    <text class="grep-flags-name" x="259" y="142">-c</text>
    <text class="grep-flags-desc" x="233" y="166">Print how many lines</text>
    <text class="grep-flags-desc" x="233" y="182">matched, instead of the</text>
    <text class="grep-flags-desc" x="233" y="198">lines.</text>
    <text class="grep-flags-edge" x="233" y="242">count</text>
  </g>
  <line class="grep-flags-line grep-flags-conn grep-flags-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#grep-flags-tip)"/>
  <g class="grep-flags-stage grep-flags-s2">
    <rect class="grep-flags-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="grep-flags-step" x="422" y="142">03</text>
    <text class="grep-flags-name" x="448" y="142">-n</text>
    <text class="grep-flags-desc" x="422" y="166">Prefix each match with</text>
    <text class="grep-flags-desc" x="422" y="182">its line number.</text>
    <text class="grep-flags-edge" x="422" y="242">line no.</text>
  </g>
  <line class="grep-flags-line grep-flags-conn grep-flags-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#grep-flags-tip)"/>
  <g class="grep-flags-stage grep-flags-s3">
    <rect class="grep-flags-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="grep-flags-step" x="611" y="142">04</text>
    <text class="grep-flags-name" x="637" y="142">-v</text>
    <text class="grep-flags-desc" x="611" y="166">Invert: print the lines</text>
    <text class="grep-flags-desc" x="611" y="182">that do NOT match.</text>
    <text class="grep-flags-edge" x="611" y="242">invert</text>
  </g>
  <line class="grep-flags-line grep-flags-conn grep-flags-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#grep-flags-tip)"/>
  <g class="grep-flags-stage grep-flags-s4">
    <rect class="grep-flags-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="grep-flags-step" x="800" y="142">05</text>
    <text class="grep-flags-name" x="826" y="142">-r</text>
    <text class="grep-flags-desc" x="800" y="166">Search a whole directory</text>
    <text class="grep-flags-desc" x="800" y="182">tree.</text>
    <text class="grep-flags-edge" x="800" y="242">recursive</text>
  </g>
  <text class="grep-flags-sub" x="30" y="304">The pattern can be a plain string or a regular expression: ^ anchors to line start, $ to line end, . matches any character, [0-9] any digit.</text>
</svg>
