<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Check the stream after every pipe. This is how professionals get it right first try.">
  <title>Build a pipeline one stage at a time</title>
  <style>
    .build-incrementally-bg   { fill: #f8fafc; }
    .build-incrementally-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-incrementally-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-incrementally-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-incrementally-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-incrementally-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-incrementally-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .build-incrementally-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .build-incrementally-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .build-incrementally-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .build-incrementally-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .build-incrementally-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .build-incrementally-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .build-incrementally-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .build-incrementally-stage { opacity: 1; }

    .build-incrementally-s0 { animation-delay: 0.00s; }
    .build-incrementally-e0 { animation-delay: 0.00s; }
    .build-incrementally-s1 { animation-delay: 1.33s; }
    .build-incrementally-e1 { animation-delay: 1.33s; }
    .build-incrementally-s2 { animation-delay: 2.67s; }
    .build-incrementally-e2 { animation-delay: 2.67s; }
    .build-incrementally-s3 { animation-delay: 4.00s; }
    .build-incrementally-e3 { animation-delay: 4.00s; }
    .build-incrementally-s4 { animation-delay: 5.33s; }
    .build-incrementally-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .build-incrementally-conn  { animation: build-incrementally-trace 8s ease-in-out infinite; }
      .build-incrementally-stage { animation: build-incrementally-arrive 8s ease-in-out infinite; }
    }
    @keyframes build-incrementally-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes build-incrementally-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .build-incrementally-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .build-incrementally-stage { animation: build-incrementally-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes build-incrementally-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="build-incrementally-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="build-incrementally-bg" width="980" height="322"/>
  <text class="build-incrementally-h1"  x="30" y="40">Build a pipeline one stage at a time</text>
  <text class="build-incrementally-sub" x="30" y="64">Check the stream after every pipe. This is how professionals get it right first try.</text>
  <g class="build-incrementally-stage build-incrementally-s0">
    <rect class="build-incrementally-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="build-incrementally-step" x="44" y="142">01</text>
    <text class="build-incrementally-name" x="70" y="142">cat access.log</text>
    <text class="build-incrementally-desc" x="44" y="166">Every line. Confirm the</text>
    <text class="build-incrementally-desc" x="44" y="182">file is what you think it</text>
    <text class="build-incrementally-desc" x="44" y="198">is.</text>
  </g>
  <line class="build-incrementally-line build-incrementally-conn build-incrementally-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#build-incrementally-tip)"/>
  <g class="build-incrementally-stage build-incrementally-s1">
    <rect class="build-incrementally-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="build-incrementally-step" x="233" y="142">02</text>
    <text class="build-incrementally-name" x="259" y="142">| cut -d' ' -f1</text>
    <text class="build-incrementally-desc" x="233" y="166">Just the first column —</text>
    <text class="build-incrementally-desc" x="233" y="182">the client address.</text>
    <text class="build-incrementally-edge" x="233" y="242">one column</text>
  </g>
  <line class="build-incrementally-line build-incrementally-conn build-incrementally-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#build-incrementally-tip)"/>
  <g class="build-incrementally-stage build-incrementally-s2">
    <rect class="build-incrementally-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="build-incrementally-step" x="422" y="142">03</text>
    <text class="build-incrementally-name" x="448" y="142">| sort</text>
    <text class="build-incrementally-desc" x="422" y="166">Identical addresses now</text>
    <text class="build-incrementally-desc" x="422" y="182">adjacent.</text>
  </g>
  <line class="build-incrementally-line build-incrementally-conn build-incrementally-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#build-incrementally-tip)"/>
  <g class="build-incrementally-stage build-incrementally-s3">
    <rect class="build-incrementally-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="build-incrementally-step" x="611" y="142">04</text>
    <text class="build-incrementally-name" x="637" y="142">| uniq -c</text>
    <text class="build-incrementally-desc" x="611" y="166">Each run collapsed to a</text>
    <text class="build-incrementally-desc" x="611" y="182">count and a value.</text>
    <text class="build-incrementally-edge" x="611" y="242">counted</text>
  </g>
  <line class="build-incrementally-line build-incrementally-conn build-incrementally-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#build-incrementally-tip)"/>
  <g class="build-incrementally-stage build-incrementally-s4">
    <rect class="build-incrementally-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="build-incrementally-step" x="800" y="142">05</text>
    <text class="build-incrementally-name" x="826" y="142">| sort -rn | head -n 5</text>
    <text class="build-incrementally-desc" x="800" y="166">Ranked, top five.</text>
    <text class="build-incrementally-edge" x="800" y="242">answered</text>
  </g>
  <text class="build-incrementally-sub" x="30" y="304">You can inspect the stream after any stage by simply not typing the rest of the line. Do that, every time, and pipelines stop being guesswork.</text>
</svg>
