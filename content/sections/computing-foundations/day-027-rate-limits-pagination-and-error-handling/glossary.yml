terms:
  - term: rate limit
    definition: 'A cap a server sets on how many requests a client may make in a window of time, protecting the shared service from overload and enforcing fair (or metered) access.'
  - term: 429 Too Many Requests
    definition: 'The HTTP status code a server returns when you have exceeded its rate limit; it is temporary and clears once you wait and retry.'
  - term: Retry-After
    definition: 'An HTTP header, often sent with a 429 or 503, telling the client exactly how long to wait before retrying — either a number of seconds or an HTTP date.'
  - term: X-RateLimit headers
    definition: 'A common convention of response headers (Limit, Remaining, Reset) that tell a client its quota, how many requests are left, and when the window resets.'
  - term: token bucket
    definition: 'A rate-limiting model in which each request removes a token from a bucket that refills at a steady rate; it permits short bursts up to the bucket size while enforcing a long-run average.'
  - term: exponential backoff
    definition: 'A retry strategy that waits a delay which doubles after each failed attempt (1s, 2s, 4s, ...) up to a cap, giving an overloaded server room to recover.'
  - term: jitter
    definition: 'A small random amount added to each backoff delay so that many clients do not all retry at the same instant and stampede the server (the "thundering herd").'
  - term: pagination
    definition: 'Splitting a large result set into ordered, individually requestable chunks (pages) so no single response has to carry all of it.'
  - term: offset
    definition: 'A pagination parameter telling the server how many rows to skip before returning the next batch; simple and jumpable but can shift under inserts and slow down on deep pages.'
  - term: cursor
    definition: 'An opaque marker naming the last row a client saw, used in cursor-based pagination to fetch the next batch stably even when rows are inserted or deleted.'
  - term: timeout
    definition: 'A deadline a client sets on a request so that a call which never answers becomes a handled failure rather than an indefinite hang.'
  - term: idempotent retry
    definition: 'Re-attempting a request that is safe to repeat because doing it twice has the same effect as doing it once (as with GET, PUT, and DELETE); non-idempotent writes need an idempotency key or must not be retried blindly.'
  - term: graceful degradation
    definition: 'Failing usefully when a request cannot succeed — serving a cached or partial result, or returning a clear error — instead of crashing or silently returning misleading data.'
