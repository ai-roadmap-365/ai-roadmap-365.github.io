questions:
  - question: 'What does an HTTP 429 Too Many Requests response mean?'
    options:
      - 'The server permanently banned your API key'
      - 'The server crashed while handling your valid request'
      - 'The URL you requested does not exist'
      - 'You exceeded the allowed rate; wait before retrying'
    answer_index: 3
    explanation: '429 is rate-limit flow control: you are asking too fast for the current window. It is temporary — backing off and retrying later clears it, unlike a permanent ban (usually a 403) or a missing resource (404).'

  - question: 'A server responds with 429 and includes a Retry-After: 30 header. What is the correct client behavior?'
    options:
      - 'Wait 30 seconds, then retry the request'
      - 'Give up permanently and report a fatal error'
      - 'Immediately resend the request as fast as possible'
      - 'Switch to a different URL to avoid the limit'
    answer_index: 0
    explanation: 'Retry-After tells you exactly how long to wait. When it is present, obey it — you cannot guess a better delay than the server just told you. Only when it is absent do you fall back to exponential backoff.'

  - question: 'Why is jitter (a small random amount) added to exponential backoff delays?'
    options:
      - 'To make the code harder to read'
      - 'To stop many clients retrying at the same instant'
      - 'To make each retry wait longer than the last'
      - 'To guarantee the request eventually succeeds'
    answer_index: 1
    explanation: 'Without jitter, a crowd of clients rate-limited at the same moment all retry at the same moment — the "thundering herd" that recreates the overload. Randomizing each wait spreads them out and lets the server recover.'

  - question: 'Which of these requests is it generally UNSAFE to retry automatically after a timeout?'
    options:
      - 'A GET that reads a list of posts'
      - 'A PUT that sets a record to a specific value'
      - 'A POST that creates a new order and charges a card'
      - 'A DELETE that ensures a record is gone'
    answer_index: 2
    explanation: 'A create-and-charge POST is non-idempotent: the first attempt may have succeeded even though the response never arrived, so a blind retry can create two orders. GET, PUT, and DELETE are idempotent — repeating them has the same effect as doing them once.'

  - question: 'What is the key difference between offset/limit pagination and cursor-based pagination?'
    options:
      - 'Offset returns JSON while cursor returns plain text'
      - 'Offset pagination is encrypted while cursor pagination is not'
      - 'Cursor pagination can only ever return one page'
      - 'Offset shifts under inserts; a cursor anchors to the last row'
    answer_index: 3
    explanation: 'Offset says "skip N rows"; if rows are inserted or deleted between requests, the window shifts and you can repeat or skip items, and deep pages get slow. A cursor names a specific row, so new inserts do not move your position, and it stays fast even far into a large set.'

  - question: 'How should a resilient client treat a 4xx client error such as 404 Not Found?'
    options:
      - 'Not retry — the request itself is wrong, so fix it'
      - 'Retry it repeatedly with exponential backoff'
      - 'Wait for a Retry-After header and obey it'
      - 'Treat it exactly the same as a 500 server error'
    answer_index: 0
    explanation: 'A 4xx means the problem is on your side (bad URL, auth, or body). The identical request will fail identically, so retrying is pointless. The exception is 429, a special 4xx that does clear after waiting.'

  - question: 'Why must a retry loop always have a hard cap on the number of attempts?'
    options:
      - 'Because servers charge extra for the first attempt'
      - 'Without a cap, a permanent failure loops forever'
      - 'Because caps make requests faster'
      - 'Because the HTTP specification forbids more than one attempt'
    answer_index: 1
    explanation: '"Keep trying until it works" becomes an infinite loop the moment the failure is permanent (a 404, a bad key, a down service). A bounded number of attempts guarantees the client gives up gracefully instead of hanging forever.'

  - question: 'What does graceful degradation mean when an API call ultimately cannot succeed?'
    options:
      - 'Crashing the whole program so the error is obvious'
      - 'Silently pretending the call succeeded and returning empty data'
      - 'Doing something sensible: a cached copy, partial result, or error'
      - 'Retrying forever until the server comes back'
    answer_index: 2
    explanation: 'Graceful degradation means failing usefully: fall back to cached or partial data, or report an honest error, rather than crashing or — worse — silently pretending nothing went wrong and returning misleading results.'
