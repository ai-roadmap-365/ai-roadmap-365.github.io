visuals:
  - id: backoff-retry
    file: assets/backoff-retry.svg
    type: flowchart
    title: 'Backoff and retry: surviving a 429'
    alt: 'Flowchart: exponential backoff with jitter after a 429 response'
    description: 'A request is rejected with 429, the client waits a growing, jittered delay (about 1s, 2s, 4s, then 8s capped) and retries, looping until a retry succeeds and returns the response or the retry cap is reached and the client gives up gracefully; a note explains that jitter spreads synchronized clients apart and that a present Retry-After header overrides the guessed delay.'
  - id: pagination-styles
    file: assets/pagination-styles.svg
    type: diagram
    title: 'Two ways to walk a large result set'
    alt: 'Diagram: offset pagination versus cursor pagination fetching pages'
    description: 'A side-by-side comparison: offset/page-number pagination asks for a page by position and can repeat or skip rows when data shifts and slows on deep pages, while cursor-based pagination asks for rows after a marker naming the last row seen, staying stable and fast but only stepping forward and backward rather than jumping to an arbitrary page.'
  - id: backoff-with-jitter
    file: assets/backoff-with-jitter.svg
    type: diagram
    title: 'Why every client waiting the same time makes it worse'
    alt: 'Diagram: fixed backoff compared with backoff plus jitter'
    description: 'A two-column comparison of retrying after a fixed delay and retrying after a randomised delay, showing that fixed delays keep clients synchronised while jitter spreads them out.'
  - id: token-bucket
    file: assets/token-bucket.svg
    type: diagram
    title: 'The bucket that allows a burst but not a flood'
    alt: 'Diagram: how a token bucket rate limiter allows bursts within an average'
    description: 'A four-stage explanation of token bucket rate limiting covering the refilling bucket, tokens consumed per request, a burst emptying it, and requests being refused once empty.'
  - id: classify-before-reacting
    file: assets/classify-before-reacting.svg
    type: diagram
    title: 'Classify first, react second'
    alt: 'Diagram: the order of steps when handling a failed request'
    description: 'A four-stage error-handling procedure covering reading the status, deciding whether the failure is the client''s or the server''s, checking idempotency before retrying, and capping attempts.'
  - id: offset-shifts
    file: assets/offset-shifts.svg
    type: diagram
    title: 'Why offset pagination loses rows'
    alt: 'Diagram: how insertions shift an offset-paginated window'
    description: 'A two-column comparison of offset and cursor pagination against a collection receiving new rows, showing how offsets shift while a cursor stays anchored.'
  - id: retry-what
    file: assets/retry-what.svg
    type: diagram
    title: 'What you may retry, and what you may not'
    alt: 'Diagram: which failures are safe to retry'
    description: 'A two-column comparison of retryable and non-retryable failures, covering server errors, rate limits, client errors and timeouts on non-idempotent writes.'
  - id: timeout-layers
    file: assets/timeout-layers.svg
    type: diagram
    title: 'The failure people forget to configure'
    alt: 'Diagram: the timeouts that should be set on an HTTP request'
    description: 'A four-stage reference to the timeouts governing an HTTP request covering connection establishment, time to first byte, total duration, and the overall budget for retries.'
  - id: proactive-pacing
    file: assets/proactive-pacing.svg
    type: diagram
    title: 'Pacing beats backing off'
    alt: 'Diagram: reactive backoff compared with proactive pacing'
    description: 'A two-column comparison of a client that waits to be rate-limited before slowing against one that reads remaining-quota headers and paces itself, covering wasted requests and total runtime.'
  - id: limit-headers
    file: assets/limit-headers.svg
    type: diagram
    title: 'Three headers tell you where you stand'
    alt: 'Diagram: the rate-limit headers and what each one reports'
    description: 'A four-stage reference to common rate-limit response headers covering the quota, the remaining allowance, the window reset time, and the Retry-After header sent with a refusal.'
  - id: pagination-loop
    file: assets/pagination-loop.svg
    type: diagram
    title: 'The pagination loop, and where it goes wrong'
    alt: 'Diagram: the steps of a pagination loop and its stopping conditions'
    description: 'A four-stage pagination loop covering requesting a page, collecting items, finding the next-page signal, and the two stopping conditions of an exhausted collection and a hard page cap.'
