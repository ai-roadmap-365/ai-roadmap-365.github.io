visuals:
  - id: backoff-retry
    file: assets/backoff-retry.svg
    type: flowchart
    title: 'Backoff and retry: surviving a 429'
    alt: 'Flowchart: exponential backoff with jitter after a 429 response'
    description: 'A request is rejected with 429, the client waits a growing, jittered delay (about 1s, 2s, 4s, then 8s capped) and retries, looping until a retry succeeds and returns the response or the retry cap is reached and the client gives up gracefully; a note explains that jitter spreads synchronized clients apart and that a present Retry-After header overrides the guessed delay.'
  - id: pagination-styles
    file: assets/pagination-styles.svg
    type: diagram
    title: 'Two ways to walk a large result set'
    alt: 'Diagram: offset pagination versus cursor pagination fetching pages'
    description: 'A side-by-side comparison: offset/page-number pagination asks for a page by position and can repeat or skip rows when data shifts and slows on deep pages, while cursor-based pagination asks for rows after a marker naming the last row seen, staying stable and fast but only stepping forward and backward rather than jumping to an arbitrary page.'
