<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="They all failed together, so they all retry together.">
  <title>Why every client waiting the same time makes it worse</title>
  <style>
    .backoff-with-jitter-bg   { fill: #f8fafc; }
    .backoff-with-jitter-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backoff-with-jitter-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backoff-with-jitter-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backoff-with-jitter-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backoff-with-jitter-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backoff-with-jitter-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backoff-with-jitter-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backoff-with-jitter-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backoff-with-jitter-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backoff-with-jitter-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backoff-with-jitter-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="backoff-with-jitter-bg" width="980" height="390"/>
  <text class="backoff-with-jitter-h1"  x="30" y="40">Why every client waiting the same time makes it worse</text>
  <text class="backoff-with-jitter-sub" x="30" y="64">They all failed together, so they all retry together.</text>
  <rect class="backoff-with-jitter-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="backoff-with-jitter-name" x="46" y="122">Fixed backoff</text>
  <text class="backoff-with-jitter-desc" x="46" y="142">1s, 2s, 4s — exactly</text>
  <text class="backoff-with-jitter-desc" x="46" y="182">All 200 clients hit the limit at once</text>
  <text class="backoff-with-jitter-desc" x="46" y="216">All 200 wait exactly one second</text>
  <text class="backoff-with-jitter-desc" x="46" y="250">All 200 retry at the same instant</text>
  <text class="backoff-with-jitter-desc" x="46" y="284">The limit is hit again, identically</text>
  <text class="backoff-with-jitter-desc" x="46" y="318">The pattern repeats until something gives</text>
  <rect class="backoff-with-jitter-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="backoff-with-jitter-name" x="526" y="122">Backoff with jitter</text>
  <text class="backoff-with-jitter-desc" x="526" y="142">1s x random(0.5, 1.5)</text>
  <text class="backoff-with-jitter-desc" x="526" y="182">All 200 clients still fail together</text>
  <text class="backoff-with-jitter-desc" x="526" y="216">Each waits a slightly different time</text>
  <text class="backoff-with-jitter-desc" x="526" y="250">Retries arrive spread across a window</text>
  <text class="backoff-with-jitter-desc" x="526" y="284">The server drains the backlog</text>
  <text class="backoff-with-jitter-desc" x="526" y="318">One line of code, and the difference is everything</text>
  <text class="backoff-with-jitter-sub" x="30" y="372">Jitter is not an optimisation. Without it, a retry policy is a mechanism for keeping an overloaded server overloaded.</text>
</svg>
