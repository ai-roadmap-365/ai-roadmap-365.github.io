<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The reaction is wrong if the classification was skipped.">
  <title>Classify first, react second</title>
  <style>
    .classify-before-reacting-bg   { fill: #f8fafc; }
    .classify-before-reacting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classify-before-reacting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classify-before-reacting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classify-before-reacting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classify-before-reacting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classify-before-reacting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .classify-before-reacting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .classify-before-reacting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .classify-before-reacting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .classify-before-reacting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .classify-before-reacting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .classify-before-reacting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .classify-before-reacting-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .classify-before-reacting-stage { opacity: 1; }

    .classify-before-reacting-s0 { animation-delay: 0.00s; }
    .classify-before-reacting-e0 { animation-delay: 0.00s; }
    .classify-before-reacting-s1 { animation-delay: 1.28s; }
    .classify-before-reacting-e1 { animation-delay: 1.28s; }
    .classify-before-reacting-s2 { animation-delay: 2.56s; }
    .classify-before-reacting-e2 { animation-delay: 2.56s; }
    .classify-before-reacting-s3 { animation-delay: 3.84s; }
    .classify-before-reacting-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .classify-before-reacting-conn  { animation: classify-before-reacting-trace 6.4s ease-in-out infinite; }
      .classify-before-reacting-stage { animation: classify-before-reacting-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes classify-before-reacting-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes classify-before-reacting-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .classify-before-reacting-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .classify-before-reacting-stage { animation: classify-before-reacting-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes classify-before-reacting-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="classify-before-reacting-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="classify-before-reacting-bg" width="980" height="322"/>
  <text class="classify-before-reacting-h1"  x="30" y="40">Classify first, react second</text>
  <text class="classify-before-reacting-sub" x="30" y="64">The reaction is wrong if the classification was skipped.</text>
  <g class="classify-before-reacting-stage classify-before-reacting-s0">
    <rect class="classify-before-reacting-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="classify-before-reacting-step" x="44" y="142">01</text>
    <text class="classify-before-reacting-name" x="70" y="142">Read the status and the body</text>
    <text class="classify-before-reacting-desc" x="44" y="166">The body usually names the</text>
    <text class="classify-before-reacting-desc" x="44" y="182">offending field. People read</text>
    <text class="classify-before-reacting-desc" x="44" y="198">only the status line.</text>
    <text class="classify-before-reacting-edge" x="44" y="242">both</text>
  </g>
  <line class="classify-before-reacting-line classify-before-reacting-conn classify-before-reacting-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#classify-before-reacting-tip)"/>
  <g class="classify-before-reacting-stage classify-before-reacting-s1">
    <rect class="classify-before-reacting-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="classify-before-reacting-step" x="280" y="142">02</text>
    <text class="classify-before-reacting-name" x="306" y="142">Whose fault was it?</text>
    <text class="classify-before-reacting-desc" x="280" y="166">4xx is yours and cannot be</text>
    <text class="classify-before-reacting-desc" x="280" y="182">retried into success. 5xx and</text>
    <text class="classify-before-reacting-desc" x="280" y="198">429 may recover.</text>
    <text class="classify-before-reacting-edge" x="280" y="242">4xx / 5xx</text>
  </g>
  <line class="classify-before-reacting-line classify-before-reacting-conn classify-before-reacting-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#classify-before-reacting-tip)"/>
  <g class="classify-before-reacting-stage classify-before-reacting-s2">
    <rect class="classify-before-reacting-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="classify-before-reacting-step" x="516" y="142">03</text>
    <text class="classify-before-reacting-name" x="542" y="142">Is the request idempotent?</text>
    <text class="classify-before-reacting-desc" x="516" y="166">A timeout means the response was</text>
    <text class="classify-before-reacting-desc" x="516" y="182">lost, not that nothing happened.</text>
  </g>
  <line class="classify-before-reacting-line classify-before-reacting-conn classify-before-reacting-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#classify-before-reacting-tip)"/>
  <g class="classify-before-reacting-stage classify-before-reacting-s3">
    <rect class="classify-before-reacting-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="classify-before-reacting-step" x="752" y="142">04</text>
    <text class="classify-before-reacting-name" x="778" y="142">Retry with backoff, jitter, and a cap</text>
    <text class="classify-before-reacting-desc" x="752" y="166">All three. A cap is what turns a</text>
    <text class="classify-before-reacting-desc" x="752" y="182">bad night into a bounded one.</text>
    <text class="classify-before-reacting-edge" x="752" y="242">capped</text>
  </g>
  <text class="classify-before-reacting-sub" x="30" y="304">Most retry bugs come from skipping step two: a client that retries everything spends its attempts on requests that were never going to succeed.</text>
</svg>
