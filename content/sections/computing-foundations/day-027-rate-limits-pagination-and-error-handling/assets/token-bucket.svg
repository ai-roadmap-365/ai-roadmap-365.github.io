<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Refill rate sets the average; bucket size sets the burst.">
  <title>The bucket that allows a burst but not a flood</title>
  <style>
    .token-bucket-bg   { fill: #f8fafc; }
    .token-bucket-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-bucket-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-bucket-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-bucket-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-bucket-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-bucket-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .token-bucket-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .token-bucket-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .token-bucket-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .token-bucket-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .token-bucket-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .token-bucket-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .token-bucket-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .token-bucket-stage { opacity: 1; }

    .token-bucket-s0 { animation-delay: 0.00s; }
    .token-bucket-e0 { animation-delay: 0.00s; }
    .token-bucket-s1 { animation-delay: 1.28s; }
    .token-bucket-e1 { animation-delay: 1.28s; }
    .token-bucket-s2 { animation-delay: 2.56s; }
    .token-bucket-e2 { animation-delay: 2.56s; }
    .token-bucket-s3 { animation-delay: 3.84s; }
    .token-bucket-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .token-bucket-conn  { animation: token-bucket-trace 6.4s ease-in-out infinite; }
      .token-bucket-stage { animation: token-bucket-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes token-bucket-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes token-bucket-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .token-bucket-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .token-bucket-stage { animation: token-bucket-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes token-bucket-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="token-bucket-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="token-bucket-bg" width="980" height="322"/>
  <text class="token-bucket-h1"  x="30" y="40">The bucket that allows a burst but not a flood</text>
  <text class="token-bucket-sub" x="30" y="64">Refill rate sets the average; bucket size sets the burst.</text>
  <g class="token-bucket-stage token-bucket-s0">
    <rect class="token-bucket-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="token-bucket-step" x="44" y="142">01</text>
    <text class="token-bucket-name" x="70" y="142">The bucket refills steadily</text>
    <text class="token-bucket-desc" x="44" y="166">Say one token per second, up to</text>
    <text class="token-bucket-desc" x="44" y="182">a maximum of 60.</text>
    <text class="token-bucket-edge" x="44" y="242">1/sec</text>
  </g>
  <line class="token-bucket-line token-bucket-conn token-bucket-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#token-bucket-tip)"/>
  <g class="token-bucket-stage token-bucket-s1">
    <rect class="token-bucket-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="token-bucket-step" x="280" y="142">02</text>
    <text class="token-bucket-name" x="306" y="142">Each request takes one</text>
    <text class="token-bucket-desc" x="280" y="166">While tokens remain, everything</text>
    <text class="token-bucket-desc" x="280" y="182">passes without delay.</text>
  </g>
  <line class="token-bucket-line token-bucket-conn token-bucket-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#token-bucket-tip)"/>
  <g class="token-bucket-stage token-bucket-s2">
    <rect class="token-bucket-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="token-bucket-step" x="516" y="142">03</text>
    <text class="token-bucket-name" x="542" y="142">A burst empties it</text>
    <text class="token-bucket-desc" x="516" y="166">Sixty requests in two seconds is</text>
    <text class="token-bucket-desc" x="516" y="182">allowed — that is what the</text>
    <text class="token-bucket-desc" x="516" y="198">bucket size is for.</text>
    <text class="token-bucket-edge" x="516" y="242">burst OK</text>
  </g>
  <line class="token-bucket-line token-bucket-conn token-bucket-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#token-bucket-tip)"/>
  <g class="token-bucket-stage token-bucket-s3">
    <rect class="token-bucket-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="token-bucket-step" x="752" y="142">04</text>
    <text class="token-bucket-name" x="778" y="142">Then you wait</text>
    <text class="token-bucket-desc" x="752" y="166">No token, no request. The server</text>
    <text class="token-bucket-desc" x="752" y="182">answers 429 rather than falling</text>
    <text class="token-bucket-desc" x="752" y="198">over.</text>
    <text class="token-bucket-edge" x="752" y="242">429</text>
  </g>
  <text class="token-bucket-sub" x="30" y="304">This is why a limit described as "60 per minute" often lets you send 60 instantly and then nothing: the average and the burst are two separate numbers.</text>
</svg>
