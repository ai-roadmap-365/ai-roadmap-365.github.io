<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Reading the remaining quota is cheaper than being refused.">
  <title>Pacing beats backing off</title>
  <style>
    .proactive-pacing-bg   { fill: #f8fafc; }
    .proactive-pacing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proactive-pacing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proactive-pacing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proactive-pacing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proactive-pacing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proactive-pacing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .proactive-pacing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .proactive-pacing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .proactive-pacing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .proactive-pacing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .proactive-pacing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .proactive-pacing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .proactive-pacing-row { opacity: 1; }
    .proactive-pacing-r0 { animation-delay: 0.00s; }
    .proactive-pacing-r1 { animation-delay: 0.45s; }
    .proactive-pacing-r2 { animation-delay: 0.90s; }
    .proactive-pacing-r3 { animation-delay: 1.35s; }
    .proactive-pacing-r4 { animation-delay: 1.80s; }
    .proactive-pacing-row { animation: proactive-pacing-reveal 7.3s ease-in-out infinite; }
    @keyframes proactive-pacing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="proactive-pacing-bg" width="980" height="390"/>
  <text class="proactive-pacing-h1"  x="30" y="40">Pacing beats backing off</text>
  <text class="proactive-pacing-sub" x="30" y="64">Reading the remaining quota is cheaper than being refused.</text>
  <rect class="proactive-pacing-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="proactive-pacing-name" x="46" y="122">Reactive</text>
  <text class="proactive-pacing-desc" x="46" y="142">Send until refused.</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r0" x="46" y="182">Every 429 is a wasted round trip</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r1" x="46" y="216">Then a backoff wait on top of it</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r2" x="46" y="250">Repeated refusals lengthen the waits</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r3" x="46" y="284">Total runtime is longer, not shorter</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r4" x="46" y="318">Simple to write, and it does work</text>
  <rect class="proactive-pacing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="proactive-pacing-name" x="526" y="122">Proactive</text>
  <text class="proactive-pacing-desc" x="526" y="142">Read the headers and slow down.</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r0" x="526" y="182">X-RateLimit-Remaining tells you where you stand</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r1" x="526" y="216">Slow down before the bucket empties</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r2" x="526" y="250">Almost no wasted requests</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r3" x="526" y="284">Shorter total runtime</text>
  <text class="proactive-pacing-desc proactive-pacing-row proactive-pacing-r4" x="526" y="318">And far gentler on the service</text>
  <text class="proactive-pacing-sub" x="30" y="372">Model APIs often limit tokens and requests separately, so you can be comfortably under one and refused on the other. Read both headers where the provider supplies them.</text>
</svg>
