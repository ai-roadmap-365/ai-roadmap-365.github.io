<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label=""Forever" is the default, and it is not a timeout.">
  <title>The failure people forget to configure</title>
  <style>
    .timeout-layers-bg   { fill: #f8fafc; }
    .timeout-layers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeout-layers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeout-layers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeout-layers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeout-layers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeout-layers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .timeout-layers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .timeout-layers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .timeout-layers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .timeout-layers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .timeout-layers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .timeout-layers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .timeout-layers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .timeout-layers-stage { opacity: 1; }

    .timeout-layers-s0 { animation-delay: 0.00s; }
    .timeout-layers-e0 { animation-delay: 0.00s; }
    .timeout-layers-s1 { animation-delay: 1.28s; }
    .timeout-layers-e1 { animation-delay: 1.28s; }
    .timeout-layers-s2 { animation-delay: 2.56s; }
    .timeout-layers-e2 { animation-delay: 2.56s; }
    .timeout-layers-s3 { animation-delay: 3.84s; }
    .timeout-layers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .timeout-layers-conn  { animation: timeout-layers-trace 6.4s ease-in-out infinite; }
      .timeout-layers-stage { animation: timeout-layers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes timeout-layers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes timeout-layers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .timeout-layers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .timeout-layers-stage { animation: timeout-layers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes timeout-layers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="timeout-layers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="timeout-layers-bg" width="980" height="322"/>
  <text class="timeout-layers-h1"  x="30" y="40">The failure people forget to configure</text>
  <text class="timeout-layers-sub" x="30" y="64">"Forever" is the default, and it is not a timeout.</text>
  <g class="timeout-layers-stage timeout-layers-s0">
    <rect class="timeout-layers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="timeout-layers-step" x="44" y="142">01</text>
    <text class="timeout-layers-name" x="70" y="142">Connect timeout</text>
    <text class="timeout-layers-desc" x="44" y="166">How long to wait for the</text>
    <text class="timeout-layers-desc" x="44" y="182">connection to open. Seconds, not</text>
    <text class="timeout-layers-desc" x="44" y="198">minutes.</text>
    <text class="timeout-layers-edge" x="44" y="242">connect</text>
  </g>
  <line class="timeout-layers-line timeout-layers-conn timeout-layers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#timeout-layers-tip)"/>
  <g class="timeout-layers-stage timeout-layers-s1">
    <rect class="timeout-layers-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="timeout-layers-step" x="280" y="142">02</text>
    <text class="timeout-layers-name" x="306" y="142">Read timeout</text>
    <text class="timeout-layers-desc" x="280" y="166">How long to wait for data once</text>
    <text class="timeout-layers-desc" x="280" y="182">connected. Longer for</text>
    <text class="timeout-layers-desc" x="280" y="198">generation.</text>
    <text class="timeout-layers-edge" x="280" y="242">read</text>
  </g>
  <line class="timeout-layers-line timeout-layers-conn timeout-layers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#timeout-layers-tip)"/>
  <g class="timeout-layers-stage timeout-layers-s2">
    <rect class="timeout-layers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="timeout-layers-step" x="516" y="142">03</text>
    <text class="timeout-layers-name" x="542" y="142">Total request timeout</text>
    <text class="timeout-layers-desc" x="516" y="166">An overall ceiling, so a slow</text>
    <text class="timeout-layers-desc" x="516" y="182">trickle cannot hold you forever.</text>
    <text class="timeout-layers-edge" x="516" y="242">total</text>
  </g>
  <line class="timeout-layers-line timeout-layers-conn timeout-layers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#timeout-layers-tip)"/>
  <g class="timeout-layers-stage timeout-layers-s3">
    <rect class="timeout-layers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="timeout-layers-step" x="752" y="142">04</text>
    <text class="timeout-layers-name" x="778" y="142">A budget across retries</text>
    <text class="timeout-layers-desc" x="752" y="166">Three attempts at 30 seconds</text>
    <text class="timeout-layers-desc" x="752" y="182">each is 90 seconds. Decide that</text>
    <text class="timeout-layers-desc" x="752" y="198">on purpose.</text>
    <text class="timeout-layers-edge" x="752" y="242">budget</text>
  </g>
  <text class="timeout-layers-sub" x="30" y="304">Many HTTP libraries default to no timeout at all. A pipeline that hung for six hours on one request almost always hung on a default nobody set.</text>
</svg>
