id: D027
day: 27
slug: rate-limits-pagination-and-error-handling
title: 'Rate Limits, Pagination, and Error Handling'
section: computing-foundations
subsection: networks-and-the-internet
week: 4
learning_promise: 'After this lesson you will be able to consume a real API robustly — backing off politely when rate-limited, paginating through large result sets without missing or repeating rows, and classifying failures so you retry only what is safe to retry and never hang or loop forever.'
objectives:
  - 'Explain why servers impose rate limits, and interpret a 429 Too Many Requests response together with the Retry-After and X-RateLimit-* headers'
  - 'Implement exponential backoff with jitter and a hard retry cap, and explain why jitter prevents a synchronized "thundering herd"'
  - 'Compare offset/limit, page-number, and cursor-based pagination, and choose the right style for a given situation'
  - 'Distinguish client (4xx) errors from server (5xx) errors from network failures, and decide correctly which are worth retrying'
  - 'Explain idempotency and why a non-idempotent write must not be retried blindly, using an idempotency key when needed'
  - 'Combine backoff, pagination, timeouts, and graceful degradation into a single resilient API client and run it against live test servers'
prerequisites:
  - 'Days 18-24: HTTP requests, responses, status codes, and JSON'
  - 'A terminal with curl and python3 available, and (for the live parts) internet access'
reading_time_minutes: 40
practical_time_minutes: 30
last_verified: '2026-07-12'
tags: [apis, rate-limiting, pagination, error-handling, retries, http, reliability]
