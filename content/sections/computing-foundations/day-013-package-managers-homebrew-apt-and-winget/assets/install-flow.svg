<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" font-family="system-ui, sans-serif">
  <title>The five stages of installing one package: resolve, download, verify, install, record</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Installing one package: brew / apt / winget install wget</text>

  <!-- Stage 1 -->
  <rect x="30" y="80" width="130" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="95" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. Resolve</text>
  <text x="95" y="131" text-anchor="middle" font-size="13" fill="#1a202c">read the index,</text>
  <text x="95" y="147" text-anchor="middle" font-size="13" fill="#1a202c">find dependencies</text>

  <!-- Stage 2 -->
  <rect x="190" y="80" width="130" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="255" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. Download</text>
  <text x="255" y="131" text-anchor="middle" font-size="13" fill="#1a202c">fetch files</text>
  <text x="255" y="147" text-anchor="middle" font-size="13" fill="#1a202c">(cache if present)</text>

  <!-- Stage 3 -->
  <rect x="350" y="80" width="130" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="415" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. Verify</text>
  <text x="415" y="131" text-anchor="middle" font-size="13" fill="#1a202c">check checksum /</text>
  <text x="415" y="147" text-anchor="middle" font-size="13" fill="#1a202c">signature</text>

  <!-- Stage 4 -->
  <rect x="510" y="80" width="130" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="575" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. Install</text>
  <text x="575" y="131" text-anchor="middle" font-size="13" fill="#1a202c">unpack in</text>
  <text x="575" y="147" text-anchor="middle" font-size="13" fill="#1a202c">dependency order</text>

  <!-- Stage 5 -->
  <rect x="510" y="230" width="130" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="575" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5. Record</text>
  <text x="575" y="281" text-anchor="middle" font-size="13" fill="#1a202c">write to the</text>
  <text x="575" y="297" text-anchor="middle" font-size="13" fill="#1a202c">local database</text>

  <!-- Arrows -->
  <line x1="160" y1="120" x2="182" y2="120" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="190,120 176,113 176,127" fill="#1d4ed8"/>
  <line x1="320" y1="120" x2="342" y2="120" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="350,120 336,113 336,127" fill="#1d4ed8"/>
  <line x1="480" y1="120" x2="502" y2="120" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="510,120 496,113 496,127" fill="#1d4ed8"/>
  <line x1="575" y1="160" x2="575" y2="222" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="575,230 568,216 582,216" fill="#1d4ed8"/>

  <!-- Verify-fail note -->
  <rect x="30" y="230" width="450" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="255" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">If resolve finds no compatible set, or verify fails,</text>
  <text x="255" y="285" text-anchor="middle" font-size="14" fill="#1a202c">the manager stops and installs nothing — your system stays clean.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 575 160 L 575 222" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
