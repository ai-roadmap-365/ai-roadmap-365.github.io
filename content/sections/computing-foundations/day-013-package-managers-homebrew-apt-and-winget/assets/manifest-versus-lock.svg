<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Only one of these makes a result reproducible.">
  <title>What you asked for, and what you actually got</title>
  <style>
    .manifest-versus-lock-bg   { fill: #f8fafc; }
    .manifest-versus-lock-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manifest-versus-lock-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manifest-versus-lock-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manifest-versus-lock-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manifest-versus-lock-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manifest-versus-lock-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .manifest-versus-lock-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .manifest-versus-lock-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .manifest-versus-lock-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .manifest-versus-lock-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .manifest-versus-lock-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="manifest-versus-lock-bg" width="980" height="390"/>
  <text class="manifest-versus-lock-h1"  x="30" y="40">What you asked for, and what you actually got</text>
  <text class="manifest-versus-lock-sub" x="30" y="64">Only one of these makes a result reproducible.</text>
  <rect class="manifest-versus-lock-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="manifest-versus-lock-name" x="46" y="122">The manifest — what you want</text>
  <text class="manifest-versus-lock-desc" x="46" y="142">requirements.txt, pyproject.toml</text>
  <text class="manifest-versus-lock-desc" x="46" y="182">torch&gt;=2.0</text>
  <text class="manifest-versus-lock-desc" x="46" y="216">A range, not a version</text>
  <text class="manifest-versus-lock-desc" x="46" y="250">Resolved fresh on every install</text>
  <text class="manifest-versus-lock-desc" x="46" y="284">Two machines, two days, two answers</text>
  <text class="manifest-versus-lock-desc" x="46" y="318">Written by a human</text>
  <rect class="manifest-versus-lock-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="manifest-versus-lock-name" x="526" y="122">The lock file — what was installed</text>
  <text class="manifest-versus-lock-desc" x="526" y="142">poetry.lock, uv.lock, package-lock.json</text>
  <text class="manifest-versus-lock-desc" x="526" y="182">torch==2.4.1, and every transitive dependency</text>
  <text class="manifest-versus-lock-desc" x="526" y="216">Exact versions, often exact build hashes</text>
  <text class="manifest-versus-lock-desc" x="526" y="250">Reproduces the same environment anywhere</text>
  <text class="manifest-versus-lock-desc" x="526" y="284">Regenerated deliberately, never edited</text>
  <text class="manifest-versus-lock-desc" x="526" y="318">Written by the tool</text>
  <text class="manifest-versus-lock-sub" x="30" y="372">Reproducibility in machine learning is much less about random seeds than it is about this distinction.</text>
</svg>
