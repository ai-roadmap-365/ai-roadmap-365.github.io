<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>How a package manager connects you to a remote repository and installs software locally with its dependencies</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">How a package manager works</text>

  <!-- You / client -->
  <rect x="30" y="150" width="150" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="105" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">You</text>
  <text x="105" y="208" text-anchor="middle" font-size="14" fill="#1a202c">run the client</text>
  <text x="105" y="226" text-anchor="middle" font-size="14" fill="#1a202c">brew / apt / winget</text>

  <!-- Local machine box: manager + database + cache -->
  <rect x="230" y="110" width="200" height="180" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="330" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Package manager</text>
  <rect x="250" y="150" width="160" height="50" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="330" y="172" text-anchor="middle" font-size="13" fill="#1a202c">Local database</text>
  <text x="330" y="190" text-anchor="middle" font-size="13" fill="#1a202c">(what is installed)</text>
  <rect x="250" y="212" width="160" height="50" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="330" y="234" text-anchor="middle" font-size="13" fill="#1a202c">Cache + index copy</text>
  <text x="330" y="252" text-anchor="middle" font-size="13" fill="#1a202c">(fast, offline)</text>

  <!-- Remote repository -->
  <rect x="490" y="110" width="120" height="180" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="550" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Remote</text>
  <text x="550" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">repository</text>
  <text x="550" y="200" text-anchor="middle" font-size="13" fill="#1a202c">index +</text>
  <text x="550" y="218" text-anchor="middle" font-size="13" fill="#1a202c">packages</text>
  <text x="550" y="248" text-anchor="middle" font-size="13" fill="#1a202c">(curated,</text>
  <text x="550" y="266" text-anchor="middle" font-size="13" fill="#1a202c">verified)</text>

  <!-- Arrows You -> manager -->
  <line x1="180" y1="185" x2="222" y2="185" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="230,185 216,178 216,192" fill="#1d4ed8"/>
  <text x="205" y="176" text-anchor="middle" font-size="12" fill="#1a202c">command</text>

  <!-- Arrows manager <-> repository -->
  <line x1="430" y1="175" x2="482" y2="175" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="490,175 476,168 476,182" fill="#1d4ed8"/>
  <text x="460" y="166" text-anchor="middle" font-size="12" fill="#1a202c">fetch</text>
  <line x1="490" y1="225" x2="438" y2="225" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="430,225 444,218 444,232" fill="#1d4ed8"/>
  <text x="460" y="245" text-anchor="middle" font-size="12" fill="#1a202c">packages</text>

  <!-- Dependency graph, lower-right -->
  <text x="330" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Dependency graph: one request pulls in the whole tree</text>

  <circle cx="330" cy="360" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="330" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">A</text>

  <circle cx="250" cy="420" r="18" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="250" y="425" text-anchor="middle" font-size="13" fill="#1a202c">B</text>
  <circle cx="330" cy="420" r="18" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="330" y="425" text-anchor="middle" font-size="13" fill="#1a202c">C</text>
  <circle cx="410" cy="420" r="18" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="410" y="425" text-anchor="middle" font-size="13" fill="#1a202c">D</text>

  <line x1="318" y1="374" x2="260" y2="406" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="330" y1="378" x2="330" y2="402" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="342" y1="374" x2="400" y2="406" stroke="#1d4ed8" stroke-width="2"/>
  <text x="530" y="400" text-anchor="middle" font-size="13" fill="#1a202c">Ask for A;</text>
  <text x="530" y="420" text-anchor="middle" font-size="13" fill="#1a202c">get B, C, D too,</text>
  <text x="530" y="440" text-anchor="middle" font-size="13" fill="#1a202c">in the right order.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 430 175 L 482 175" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 180 185 L 222 185" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 490 225 L 438 225" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
