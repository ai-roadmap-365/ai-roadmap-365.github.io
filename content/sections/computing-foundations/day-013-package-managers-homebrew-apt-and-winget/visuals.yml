visuals:
  - id: package-manager-architecture
    file: assets/package-manager-architecture.svg
    type: diagram
    title: 'How a package manager works'
    alt: 'Diagram: how a package manager connects you to a remote repository and installs software locally with its dependencies'
    description: 'A left-to-right architecture showing you running the client, the package manager on your machine with its local database and cache, and a remote curated repository, with a dependency graph illustrating how asking for one package pulls in the whole tree of packages it needs.'
  - id: install-flow
    file: assets/install-flow.svg
    type: flowchart
    title: 'Installing one package'
    alt: 'Flowchart: the five stages of installing one package — resolve, download, verify, install, record'
    description: 'The five-stage flow a package manager runs for a single install command — resolve the full dependency set from the index, download the files, verify their integrity, install them in dependency order, and record the result in the local database — with a note that a failed resolve or verify stops the install so the system stays clean.'
  - id: manifest-versus-lock
    file: assets/manifest-versus-lock.svg
    type: diagram
    title: 'What you asked for, and what you actually got'
    alt: 'Diagram: a dependency manifest compared with a lock file'
    description: 'A two-column comparison of a manifest and a lock file, showing that a manifest states intent while a lock file records the exact resolved versions, and that two machines resolving the same manifest on different days can differ.'
  - id: manual-versus-managed
    file: assets/manual-versus-managed.svg
    type: diagram
    title: 'Installing by hand, and installing by manager'
    alt: 'Diagram: installing software manually compared with using a package manager'
    description: 'A two-column comparison of manual installation from a website against installation through a package manager, covering dependencies, verification, updates, removal and reproducibility.'
  - id: dependency-graph
    file: assets/dependency-graph.svg
    type: diagram
    title: 'Why one install becomes eleven'
    alt: 'Diagram: how requesting one package pulls in its dependency tree'
    description: 'A four-stage explanation of dependency resolution: the package you asked for, the packages it needs, the packages those need, and the shared dependency that is installed only once.'
  - id: three-managers
    file: assets/three-managers.svg
    type: diagram
    title: 'Which manager, and why you do not choose'
    alt: 'Diagram: Homebrew compared with apt and winget'
    description: 'A two-column comparison of Homebrew on macOS against apt on Debian-based Linux, covering where each installs, whether administrator rights are needed, and the equivalent commands.'
  - id: supply-chain-risk
    file: assets/supply-chain-risk.svg
    type: diagram
    title: 'A package manager is a trust decision'
    alt: 'Diagram: the trust risks of installing packages and the habits that reduce them'
    description: 'A two-column comparison of package supply-chain risks against the practices that reduce them, covering typosquatting, unofficial repositories, install scripts and unpinned versions.'
  - id: update-versus-upgrade
    file: assets/update-versus-upgrade.svg
    type: diagram
    title: 'update and upgrade are not the same word'
    alt: 'Diagram: refreshing the package index compared with upgrading installed packages'
    description: 'A two-column comparison of the index-refresh command and the package-upgrade command, explaining that resolution happens against a local copy of the index which must be refreshed first.'
  - id: cache-cold-warm
    file: assets/cache-cold-warm.svg
    type: diagram
    title: 'Why the second install is instant'
    alt: 'Diagram: a cold install compared with one served from cache'
    description: 'A four-stage sequence contrasting a first installation that downloads everything with a repeat installation served from the local cache, and the consequence for continuous integration builds that start empty every time.'
  - id: gpu-stack-versions
    file: assets/gpu-stack-versions.svg
    type: diagram
    title: 'The dependency graph that causes most AI setup pain'
    alt: 'Diagram: the layered version dependencies of a GPU machine learning stack'
    description: 'A four-stage sequence up the GPU software stack from the kernel driver through the CUDA runtime and cuDNN to the framework build, noting that each layer constrains the ones above it.'
