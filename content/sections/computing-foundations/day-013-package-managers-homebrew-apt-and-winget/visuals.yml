visuals:
  - id: package-manager-architecture
    file: assets/package-manager-architecture.svg
    type: diagram
    title: 'How a package manager works'
    alt: 'Diagram: how a package manager connects you to a remote repository and installs software locally with its dependencies'
    description: 'A left-to-right architecture showing you running the client, the package manager on your machine with its local database and cache, and a remote curated repository, with a dependency graph illustrating how asking for one package pulls in the whole tree of packages it needs.'
  - id: install-flow
    file: assets/install-flow.svg
    type: flowchart
    title: 'Installing one package'
    alt: 'Flowchart: the five stages of installing one package — resolve, download, verify, install, record'
    description: 'The five-stage flow a package manager runs for a single install command — resolve the full dependency set from the index, download the files, verify their integrity, install them in dependency order, and record the result in the local database — with a note that a failed resolve or verify stops the install so the system stays clean.'
