title: 'Package Managers: Homebrew, apt, and winget'
section: computing-foundations
subsection: how-computers-work
week: 2
learning_promise: 'After this lesson you will be able to explain what a package manager does, use Homebrew, apt, or winget to install and manage software, and understand how manifests and version pinning make an environment reproducible on any machine.'
objectives:
  - 'Define package, dependency, repository, and dependency resolution, and explain why installing software by hand fails as dependencies grow'
  - 'Describe the four parts of a package manager (client, repository and index, local database, cache) and trace the five stages of a single install: resolve, download, verify, install, record'
  - 'Choose the right default package manager for macOS, Debian/Ubuntu, and Windows, and run install, search, list, and upgrade commands with each'
  - 'Explain the difference between a manifest and a lock file and why committing both makes a project reproducible'
  - 'Explain version pinning and why reproducible environments depend on recording exact versions rather than "the latest"'
  - 'Inspect which package managers are present on your own machine with safe, read-only commands, installing nothing'
prerequisites:
  - 'A computer running macOS, Linux, or Windows with permission to open a terminal'
  - 'Comfort running basic terminal commands (Days 8–12 of this course)'
