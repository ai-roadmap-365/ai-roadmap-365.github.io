terms:
  - term: package
    definition: 'A bundle of a program''s files together with metadata describing what it is, its version, and what other software it depends on — the unit a package manager installs, updates, and removes.'
  - term: package manager
    definition: 'A program whose job is to install, upgrade, and remove software from curated repositories, automatically resolving dependencies and keeping a local record of everything it has done.'
  - term: repository
    definition: 'A curated online collection of packages, plus an index of their versions and dependencies, that a package manager knows how to reach and trust.'
  - term: dependency
    definition: 'Other software a package needs installed first in order to run; the branching chain of these is what a package manager resolves automatically.'
  - term: dependency resolution
    definition: 'The process of reading each package''s requirements and computing the complete set of packages needed, in an order where nothing is missing when it is used.'
  - term: Homebrew
    definition: 'The popular free, open-source package manager for macOS (and Linux), driven by the brew command; its packages are called formulae.'
  - term: apt
    definition: 'The Advanced Package Tool, the default package manager on Debian and Ubuntu Linux, which resolves dependencies and installs system-wide packages (usually run with sudo).'
  - term: winget
    definition: 'The Windows Package Manager, Microsoft''s first-party command-line tool for installing, upgrading, and removing software on Windows 10 and 11.'
  - term: manifest
    definition: 'A file you write that lists the packages a project needs — its stated intent — turning "install everything this needs" into one shareable, repeatable command.'
  - term: lock file
    definition: 'A file written by the manager recording the exact versions of every package actually installed, so another machine can rebuild the identical environment.'
  - term: version pinning
    definition: 'Requesting a specific version of a package rather than "the latest," so a silent upgrade cannot change a project''s behavior.'
  - term: upgrade
    definition: 'Moving installed software to a newer version while preserving the surrounding dependency tree, as opposed to reinstalling the same version.'
  - term: mirror
    definition: 'A synchronized duplicate of a repository hosted elsewhere, providing faster and more reliable downloads and redundancy.'
