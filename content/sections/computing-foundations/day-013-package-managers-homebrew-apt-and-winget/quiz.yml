questions:
  - question: 'What is the single hardest job a package manager does for you?'
    options:
      - 'Downloading a file faster than a web browser can'
      - 'Resolving dependencies — working out the full tree of other software a package needs and installing it in the right order'
      - 'Writing the source code of the program being installed'
      - 'Displaying user ratings and reviews before you install'
    answer_index: 1
    explanation: 'Almost no program is self-contained; each package lists what it depends on, and the manager reads those descriptions to compute and install the complete dependency tree in a valid order — the work that manual installation gets wrong.'

  - question: 'Which sequence correctly orders the five stages of installing one package?'
    options:
      - 'Download, resolve, install, verify, record'
      - 'Resolve, download, verify, install, record'
      - 'Verify, download, resolve, record, install'
      - 'Install, resolve, download, record, verify'
    answer_index: 1
    explanation: 'The manager first resolves the full set of required packages from the index, downloads them, verifies their integrity, installs them in dependency order, and finally records the installation in its local database.'

  - question: 'What is the difference between a manifest and a lock file?'
    options:
      - 'A manifest is written by the manager; a lock file is written by you'
      - 'They are two names for the same file'
      - 'A manifest states which packages you want; a lock file records the exact versions that were actually installed'
      - 'A manifest is for macOS and a lock file is for Windows'
    answer_index: 2
    explanation: 'The manifest captures human intent (often loosely, e.g. "a spreadsheet library"), while the lock file records the precise resolved versions of everything installed, which is what makes an install reproducible on another machine.'

  - question: 'Which is the correct default command to install a package called wget on Debian/Ubuntu?'
    options:
      - 'brew install wget'
      - 'winget install wget'
      - 'sudo apt install wget'
      - 'pip install wget'
    answer_index: 2
    explanation: 'apt is the default system package manager on Debian-based Linux, and because it installs system-wide its changing commands need administrator rights via sudo. Homebrew (brew) is for macOS and winget is for Windows.'

  - question: 'Why does apt ask you to run "apt update" before installing?'
    options:
      - 'It upgrades every installed package to a newer version'
      - 'It refreshes the local copy of the repository index so apt resolves against current package information'
      - 'It creates a manifest file for your project'
      - 'It is required to give the terminal administrator rights'
    answer_index: 1
    explanation: 'apt resolves against its local copy of the repository index; "apt update" refreshes that copy so you install current versions. (Note that "apt upgrade", a different command, is the one that actually upgrades installed packages.)'

  - question: 'What does version pinning protect you from?'
    options:
      - 'Downloading packages over a slow network connection'
      - 'Running out of disk space during installation'
      - 'Silent upgrades that change a project''s behavior by swapping in a different version than the one it was built with'
      - 'Installing software without administrator rights'
    answer_index: 2
    explanation: 'Pinning requests a specific version rather than "the latest," so a dependency cannot quietly move to a new version and change how your project behaves — the usual cause of "it works on my machine" failures.'

  - question: 'Why is installing from a package manager''s official repository generally safer than downloading an installer from a search result?'
    options:
      - 'The manager scans your whole hard drive for viruses first'
      - 'Official repositories are curated and the manager verifies each download''s integrity against a checksum or signature before installing'
      - 'Package managers make software run faster once installed'
      - 'Downloaded installers can never contain useful software'
    answer_index: 1
    explanation: 'Managers fetch from curated repositories over verified channels and check integrity before installing, closing off tampered or corrupted downloads — a real security improvement, though the trust chain weakens if you add untrusted third-party repositories.'

  - question: 'How does a lock file support reproducibility at scale, across many machines?'
    options:
      - 'It stores a compressed backup of the operating system'
      - 'It records the exact versions of every package, so any machine can rebuild the identical environment instead of getting "the latest" on different days'
      - 'It automatically buys more servers when needed'
      - 'It prevents any software from ever being upgraded again'
    answer_index: 1
    explanation: 'Because the lock file freezes exact versions as plain text, the same specification provisions one machine or a whole fleet identically; without it, "install the latest" run on different days yields many slightly different, hard-to-debug environments.'
