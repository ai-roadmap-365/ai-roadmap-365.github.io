id: D012
day: 12
slug: shell-scripting-variables-loops-and-conditionals
title: 'Shell Scripting: Variables, Loops, and Conditionals'
section: computing-foundations
subsection: how-computers-work
week: 2
learning_promise: 'After this lesson you will be able to turn a sequence of commands into a reliable shell script — using variables, quoting, command substitution, arguments, conditionals, loops, and functions under strict mode — so your work runs the same way every time and is genuinely reproducible.'
objectives:
  - 'Save a sequence of commands as a script, add the shebang #!/usr/bin/env bash, and make it executable or run it with bash'
  - 'Assign and read variables, and explain why quoting every expansion ("$var") prevents word-splitting and globbing bugs'
  - 'Use command substitution $(...) to turn a command''s output into a value, and read positional parameters $1, $@, and $# with a sensible default'
  - 'Write conditionals with if, test/[ ], and [[ ]], and explain how exit codes drive the branch, including the difference between string and integer comparisons'
  - 'Write for and while loops and package reusable steps into functions with local variables'
  - 'Add set -euo pipefail to make a script stop on errors, catch unset variables, and detect pipeline failures, and connect this discipline to reproducible AI pipelines'
prerequisites:
  - 'Days 8–11: comfort in the terminal, navigating the filesystem, working with text, and setting environment variables'
  - 'A computer running macOS or Linux (or Windows with WSL) and a text editor'
reading_time_minutes: 40
practical_time_minutes: 30
