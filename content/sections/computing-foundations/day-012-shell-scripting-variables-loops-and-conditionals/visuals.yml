visuals:
  - id: script-anatomy
    file: assets/script-anatomy.svg
    type: diagram
    title: 'The anatomy of a shell script'
    alt: 'Diagram: the anatomy of a shell script, labelling the shebang, strict-mode line, variables, a function, a conditional, and a loop'
    description: 'A short annotated script shown in a code panel, with labels pointing at each structural part: the shebang that picks the interpreter, the set -euo pipefail strict-mode line, a variable holding an argument with a default, a function as a named sub-recipe, an if/else conditional, and a for loop over a list.'
  - id: control-flow
    file: assets/control-flow.svg
    type: flowchart
    title: 'Control flow: decision and loop'
    alt: 'Flowchart: an if/else decision and a for loop drawn as a control-flow diagram'
    description: 'Two flowcharts side by side. On the left, an if/else decision diamond branches on a test to either process files or exit with an error. On the right, a for loop repeatedly takes the "yes" path to handle the next item until the list is exhausted, then reaches done — both branching on exit codes.'
  - id: strict-mode-difference
    file: assets/strict-mode-difference.svg
    type: diagram
    title: 'The same failing script, with and without strict mode'
    alt: 'Diagram: a script failing with and without set -euo pipefail'
    description: 'A two-column comparison of one script whose download step fails, run with and without strict mode, showing that without it the script continues and exits zero while reporting success.'
  - id: quote-your-variables
    file: assets/quote-your-variables.svg
    type: diagram
    title: 'The one rule that prevents most shell disasters'
    alt: 'Diagram: an unquoted variable compared with a quoted one'
    description: 'A two-column comparison of unquoted and quoted variable expansion, showing how word splitting and globbing turn one value into several arguments, and how quoting passes the value through untouched.'
  - id: shebang-and-exec
    file: assets/shebang-and-exec.svg
    type: diagram
    title: 'Two ways to run a script'
    alt: 'Diagram: running a script with bash compared with running it directly'
    description: 'A four-stage sequence contrasting invoking a script by passing it to bash, which ignores the executable bit and the shebang, with marking it executable and running it directly, where the kernel reads the shebang to choose an interpreter.'
  - id: exit-codes-drive-everything
    file: assets/exit-codes-drive-everything.svg
    type: diagram
    title: 'Zero is success, and everything is built on it'
    alt: 'Diagram: how exit codes drive conditionals and pipelines'
    description: 'A four-stage explanation that every command returns an integer exit code, that zero means success, that the if statement branches on that code, and that the bracket test is itself an ordinary command.'
  - id: test-operators
    file: assets/test-operators.svg
    type: diagram
    title: 'Strings and numbers do not compare the same way'
    alt: 'Diagram: string test operators compared with numeric ones'
    description: 'A two-column comparison of the shell''s string comparison operators and its numeric comparison operators, with the file tests that are used most often.'
  - id: for-versus-while
    file: assets/for-versus-while.svg
    type: diagram
    title: 'for or while?'
    alt: 'Diagram: a for loop compared with a while loop'
    description: 'A two-column comparison of for loops, which walk a known list, and while loops, which repeat as long as a command succeeds, with the situations each suits.'
  - id: strict-mode-three-flags
    file: assets/strict-mode-three-flags.svg
    type: diagram
    title: 'set -euo pipefail, one flag at a time'
    alt: 'Diagram: the three protections in shell strict mode'
    description: 'A four-stage breakdown of the strict-mode line, explaining the exit-on-error flag, the undefined-variable flag, the pipefail option, and their combined effect on a script''s failure behaviour.'
  - id: shell-or-python
    file: assets/shell-or-python.svg
    type: diagram
    title: 'When to stop writing shell'
    alt: 'Diagram: the point at which a shell script should become a Python program'
    description: 'A two-column comparison of the work shell is good at against the signals that a script has outgrown it, covering data structures, error handling, testing and length.'
  - id: trap-cleanup
    file: assets/trap-cleanup.svg
    type: diagram
    title: 'Cleaning up even when the script fails'
    alt: 'Diagram: how a trap guarantees cleanup on exit'
    description: 'A four-stage sequence showing a script creating a temporary directory, registering a trap, and the cleanup running whether the script succeeds, fails or is interrupted.'
