questions:
  - question: 'What is the purpose of the first line `#!/usr/bin/env bash` in a script?'
    options:
      - 'It is a comment the shell ignores completely'
      - 'It is the shebang, telling the system to run the file with bash found on the PATH'
      - 'It imports a library of extra shell commands'
      - 'It makes the file executable automatically'
    answer_index: 1
    explanation: 'The shebang `#!` followed by an interpreter path tells the system which program should run the file. Using `/usr/bin/env bash` finds bash on the user''s PATH, which is more portable than a hard-coded path. It does not, by itself, set the executable permission bit.'

  - question: 'Why should you almost always quote a variable expansion, writing `rm "$file"` instead of `rm $file`?'
    options:
      - 'Quoting makes the script run faster'
      - 'Unquoted, the value is subject to word-splitting and globbing, so a filename with a space or a `*` becomes multiple arguments or expands unexpectedly'
      - 'Unquoted variables are a syntax error in bash'
      - 'Quotes convert the value to uppercase'
    answer_index: 1
    explanation: 'Without quotes the shell splits the value at spaces and expands glob characters like `*`. A value such as `my notes.txt` becomes two arguments, and `*` becomes every file in the directory. Quoting passes the value through as a single, literal argument.'

  - question: 'What does `set -euo pipefail` do?'
    options:
      - 'Turns on verbose logging of every command'
      - 'Exits on the first failed command, errors on unset variables, and fails a pipeline if any stage fails'
      - 'Disables all error checking so the script never stops'
      - 'Sets three environment variables named e, u, and o'
    answer_index: 1
    explanation: '`-e` exits on the first command that fails, `-u` treats use of an unset variable as an error (catching typos), and `-o pipefail` makes a pipeline report failure if any command in it fails, not just the last. Together they turn a forgiving shell into a strict one that stops when something is wrong.'

  - question: 'What does command substitution `$(date +%Y)` produce?'
    options:
      - 'The literal text "date +%Y"'
      - 'The output of running the `date +%Y` command, substituted in place'
      - 'An error, because commands cannot appear inside scripts'
      - 'The exit code of the date command'
    answer_index: 1
    explanation: 'Command substitution runs the command inside `$(...)`, captures what it prints, trims the trailing newline, and substitutes the result as a value. It lets a script react to real information rather than a hard-coded guess.'

  - question: 'A script uses `if [ $count = 5 ]` to compare a number and behaves oddly. What is the correct integer comparison?'
    options:
      - '`if [ $count == 5 ]`'
      - '`if [ $count -eq 5 ]`'
      - '`if [ $count -is 5 ]`'
      - '`if ( count = 5 )`'
    answer_index: 1
    explanation: 'In test expressions, `=` compares strings while `-eq`, `-gt`, `-lt`, and similar operators compare integers. Use `[ "$count" -eq 5 ]` for numbers. Quoting the variable also avoids an error when the value is empty.'

  - question: 'Which loop is the natural choice for reading a file one line at a time?'
    options:
      - 'A `for` loop over `*.txt`'
      - 'A `while read -r line; do ... done < file` loop'
      - 'A `case` statement'
      - 'Recursion, since shells have no loops'
    answer_index: 1
    explanation: 'A `while read -r line` loop reading from a redirected file processes one line per iteration and stops at end of file, which is exactly the "repeat while the command succeeds" pattern `while` is built for. A `for` loop suits iterating over a known list such as files matching a pattern.'

  - question: 'What is the difference between `$1` and `$@` in a script?'
    options:
      - 'They are identical'
      - '`$1` is the first positional argument; `$@` is all of the positional arguments'
      - '`$1` is the exit code; `$@` is the script name'
      - '`$1` is the number of arguments; `$@` is the first one'
    answer_index: 1
    explanation: '`$1` is the first argument passed to the script, `$2` the second, and so on. `$@` expands to all the arguments (quote it as `"$@"` to keep each one intact), and `$#` is the count of arguments.'

  - question: 'Why is `[[ ... ]]` generally preferred over `[ ... ]` in a bash script?'
    options:
      - 'It runs on every shell including minimal POSIX sh'
      - 'It is a bash built-in that does not word-split its operands and supports pattern matching, making it safer'
      - 'It is required for the shebang to work'
      - 'It automatically quotes every variable for you regardless of shell'
    answer_index: 1
    explanation: '`[[ ]]` is a bash keyword that avoids the word-splitting and globbing pitfalls of the older `[` command and adds pattern matching and logical operators inside the brackets. Use `[ ]` only when a script must run under plain POSIX `sh`, which lacks `[[ ]]`.'
