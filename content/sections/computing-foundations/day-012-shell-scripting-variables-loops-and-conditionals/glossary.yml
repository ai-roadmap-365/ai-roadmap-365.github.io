terms:
  - term: shebang
    definition: 'The `#!` characters on a script''s first line, followed by the path to an interpreter (e.g. `#!/usr/bin/env bash`), telling the system which program should run the file.'
  - term: variable
    definition: 'A named holder for a value in a script, assigned with `name=value` (no spaces around `=`) and read with `$name` or `${name}`.'
  - term: quoting
    definition: 'Wrapping a value in double quotes, as in `"$file"`, to stop the shell from word-splitting it at spaces and expanding glob characters like `*` — the single most important habit for correct scripts.'
  - term: command substitution
    definition: 'The `$(command)` form, which runs a command and replaces itself with that command''s captured output, letting a script use real results as values.'
  - term: exit code
    definition: 'The integer a command returns when it finishes — `0` for success and non-zero for failure — which conditionals and loops branch on.'
  - term: conditional
    definition: 'An `if`/`then`/`else` construct that runs commands based on whether a test succeeds, where the test is any command judged by its exit code.'
  - term: loop
    definition: 'A construct that repeats a block of commands: `for` iterates over a known list, while `while` (and `until`) repeats based on a command''s exit code.'
  - term: function
    definition: 'A named, reusable group of commands defined with `name() { ... }` and called like any command; inside it, `$1` and `$2` are the arguments passed to the function.'
  - term: positional parameter
    definition: 'The numbered inputs a script receives on the command line — `$1`, `$2`, and so on — with `$#` giving their count and `$@` expanding to all of them.'
  - term: test command
    definition: 'The `[ ... ]` (also spelled `test`) or the bash-only `[[ ... ]]` construct that evaluates a condition, such as `-d` for "is a directory", and returns an exit code.'
  - term: ShellCheck
    definition: 'A free, open-source static analyzer (linter) for shell scripts that flags bugs like unquoted variables and misused test brackets before the script is ever run.'
  - term: 'set -e'
    definition: 'A shell option (part of `set -euo pipefail`) that makes a script exit immediately when any command fails, instead of blindly continuing after an error.'
  - term: strict mode
    definition: 'The convention of putting `set -euo pipefail` near the top of a script so it stops on errors, errors on unset variables, and detects failures anywhere in a pipeline.'
