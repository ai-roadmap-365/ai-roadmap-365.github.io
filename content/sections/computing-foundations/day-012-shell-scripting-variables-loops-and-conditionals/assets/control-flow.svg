<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" font-family="system-ui, sans-serif">
  <title>Two control-flow shapes: an if/else decision that branches on a test, and a for loop that repeats over a list of items</title>
  <rect x="0" y="0" width="720" height="560" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Control flow: decision and loop</text>

  <!-- ===================== LEFT: if / else ===================== -->
  <text x="185" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">if / else</text>

  <!-- start -->
  <rect x="120" y="82" width="130" height="42" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="185" y="108" text-anchor="middle" font-size="14" fill="#1a202c">start</text>

  <!-- decision diamond -->
  <polygon points="185,144 265,206 185,268 105,206" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="185" y="200" text-anchor="middle" font-size="13" fill="#1a202c">[ -d "$dir" ]</text>
  <text x="185" y="218" text-anchor="middle" font-size="13" fill="#1a202c">true?</text>

  <line x1="185" y1="124" x2="185" y2="144" stroke="#1d4ed8" stroke-width="2"/>

  <!-- yes branch (down) -->
  <line x1="185" y1="268" x2="185" y2="300" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="185,308 178,294 192,294" fill="#1d4ed8"/>
  <text x="197" y="288" font-size="13" font-weight="bold" fill="#1d4ed8">yes</text>
  <rect x="120" y="308" width="130" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="185" y="335" text-anchor="middle" font-size="13" fill="#1a202c">process files</text>

  <!-- no branch (right) -->
  <line x1="265" y1="206" x2="315" y2="206" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="323,206 309,199 309,213" fill="#1d4ed8"/>
  <text x="278" y="198" font-size="13" font-weight="bold" fill="#1d4ed8">no</text>
  <rect x="323" y="184" width="60" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="353" y="211" text-anchor="middle" font-size="13" fill="#1a202c">exit 1</text>

  <!-- ===================== RIGHT: for loop ===================== -->
  <text x="545" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">for loop</text>

  <!-- start -->
  <rect x="480" y="82" width="130" height="42" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="545" y="108" text-anchor="middle" font-size="14" fill="#1a202c">start</text>
  <line x1="545" y1="124" x2="545" y2="150" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="545,158 538,144 552,144" fill="#1d4ed8"/>

  <!-- decision: more items? -->
  <polygon points="545,164 630,222 545,280 460,222" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="545" y="218" text-anchor="middle" font-size="13" fill="#1a202c">more items</text>
  <text x="545" y="236" text-anchor="middle" font-size="13" fill="#1a202c">in list?</text>

  <!-- yes: do body then loop back -->
  <line x1="545" y1="280" x2="545" y2="312" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="545,320 538,306 552,306" fill="#1d4ed8"/>
  <text x="557" y="300" font-size="13" font-weight="bold" fill="#1d4ed8">yes</text>
  <rect x="470" y="320" width="150" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="545" y="347" text-anchor="middle" font-size="13" fill="#1a202c">handle next item</text>

  <!-- loop-back arrow: from body left up to diamond left -->
  <line x1="470" y1="342" x2="410" y2="342" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="410" y1="342" x2="410" y2="222" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="410" y1="222" x2="460" y2="222" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="460,222 446,215 446,229" fill="#1d4ed8"/>
  <text x="405" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" transform="rotate(-90 405 285)">repeat</text>

  <!-- no: done -->
  <line x1="630" y1="222" x2="672" y2="222" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="680,222 666,215 666,229" fill="#1d4ed8"/>
  <text x="648" y="214" font-size="13" font-weight="bold" fill="#1d4ed8">no</text>
  <rect x="650" y="260" width="60" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="680" y="287" text-anchor="middle" font-size="13" fill="#1a202c">done</text>
  <line x1="680" y1="222" x2="680" y2="260" stroke="#1d4ed8" stroke-width="2"/>

  <text x="360" y="420" text-anchor="middle" font-size="15" fill="#1a202c">A conditional chooses one path once; a loop keeps taking the "yes" path until the list runs out.</text>
  <line x1="360" y1="440" x2="360" y2="472" stroke="#1d4ed8" stroke-width="0"/>
  <text x="360" y="470" text-anchor="middle" font-size="14" fill="#1a202c">Both branch on an exit code: 0 means the test succeeded, non-zero means it failed.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.40s}.dx-f2{animation-delay:0.80s}.dx-f3{animation-delay:1.20s}.dx-f4{animation-delay:1.60s}.dx-f5{animation-delay:2.00s}.dx-f6{animation-delay:2.40s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 545 124 L 545 150" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 265 206 L 315 206" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 410 222 L 460 222" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 630 222 L 672 222" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 185 268 L 185 300" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 545 280 L 545 312" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f6" d="M 680 260 L 680 222" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
