<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Only one of them consults the shebang.">
  <title>Two ways to run a script</title>
  <style>
    .shebang-and-exec-bg   { fill: #f8fafc; }
    .shebang-and-exec-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shebang-and-exec-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shebang-and-exec-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shebang-and-exec-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shebang-and-exec-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shebang-and-exec-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shebang-and-exec-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shebang-and-exec-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shebang-and-exec-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shebang-and-exec-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shebang-and-exec-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shebang-and-exec-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .shebang-and-exec-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .shebang-and-exec-stage { opacity: 1; }

    .shebang-and-exec-s0 { animation-delay: 0.00s; }
    .shebang-and-exec-e0 { animation-delay: 0.00s; }
    .shebang-and-exec-s1 { animation-delay: 1.28s; }
    .shebang-and-exec-e1 { animation-delay: 1.28s; }
    .shebang-and-exec-s2 { animation-delay: 2.56s; }
    .shebang-and-exec-e2 { animation-delay: 2.56s; }
    .shebang-and-exec-s3 { animation-delay: 3.84s; }
    .shebang-and-exec-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .shebang-and-exec-conn  { animation: shebang-and-exec-trace 6.4s ease-in-out infinite; }
      .shebang-and-exec-stage { animation: shebang-and-exec-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes shebang-and-exec-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes shebang-and-exec-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .shebang-and-exec-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .shebang-and-exec-stage { animation: shebang-and-exec-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes shebang-and-exec-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="shebang-and-exec-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="shebang-and-exec-bg" width="980" height="322"/>
  <text class="shebang-and-exec-h1"  x="30" y="40">Two ways to run a script</text>
  <text class="shebang-and-exec-sub" x="30" y="64">Only one of them consults the shebang.</text>
  <g class="shebang-and-exec-stage shebang-and-exec-s0">
    <rect class="shebang-and-exec-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="shebang-and-exec-step" x="44" y="142">01</text>
    <text class="shebang-and-exec-name" x="70" y="142">bash hello.sh</text>
    <text class="shebang-and-exec-desc" x="44" y="166">You named the interpreter. The</text>
    <text class="shebang-and-exec-desc" x="44" y="182">shebang and the executable bit</text>
    <text class="shebang-and-exec-desc" x="44" y="198">are both ignored.</text>
    <text class="shebang-and-exec-edge" x="44" y="242">works now</text>
  </g>
  <line class="shebang-and-exec-line shebang-and-exec-conn shebang-and-exec-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#shebang-and-exec-tip)"/>
  <g class="shebang-and-exec-stage shebang-and-exec-s1">
    <rect class="shebang-and-exec-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="shebang-and-exec-step" x="280" y="142">02</text>
    <text class="shebang-and-exec-name" x="306" y="142">chmod +x hello.sh</text>
    <text class="shebang-and-exec-desc" x="280" y="166">Turns on the execute bit. The</text>
    <text class="shebang-and-exec-desc" x="280" y="182">file is still text; it is now</text>
    <text class="shebang-and-exec-desc" x="280" y="198">allowed to be run.</text>
  </g>
  <line class="shebang-and-exec-line shebang-and-exec-conn shebang-and-exec-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#shebang-and-exec-tip)"/>
  <g class="shebang-and-exec-stage shebang-and-exec-s2">
    <rect class="shebang-and-exec-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="shebang-and-exec-step" x="516" y="142">03</text>
    <text class="shebang-and-exec-name" x="542" y="142">./hello.sh</text>
    <text class="shebang-and-exec-desc" x="516" y="166">The ./ is required — the shell</text>
    <text class="shebang-and-exec-desc" x="516" y="182">does not search the current</text>
    <text class="shebang-and-exec-desc" x="516" y="198">directory, by design.</text>
    <text class="shebang-and-exec-edge" x="516" y="242">./</text>
  </g>
  <line class="shebang-and-exec-line shebang-and-exec-conn shebang-and-exec-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#shebang-and-exec-tip)"/>
  <g class="shebang-and-exec-stage shebang-and-exec-s3">
    <rect class="shebang-and-exec-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="shebang-and-exec-step" x="752" y="142">04</text>
    <text class="shebang-and-exec-name" x="778" y="142">The shebang decides</text>
    <text class="shebang-and-exec-desc" x="752" y="166">#!/usr/bin/env bash asks the</text>
    <text class="shebang-and-exec-desc" x="752" y="182">system to find bash on PATH —</text>
    <text class="shebang-and-exec-desc" x="752" y="198">portable across macOS and Linux.</text>
  </g>
  <text class="shebang-and-exec-sub" x="30" y="304">Prefer #!/usr/bin/env bash to a hard path like /bin/bash: the two systems keep bash in different places.</text>
</svg>
