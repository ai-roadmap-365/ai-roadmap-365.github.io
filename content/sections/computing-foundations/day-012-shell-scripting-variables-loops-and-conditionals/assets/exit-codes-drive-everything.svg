<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="if does not test a value. It runs a command and reads its exit code.">
  <title>Zero is success, and everything is built on it</title>
  <style>
    .exit-codes-drive-everything-bg   { fill: #f8fafc; }
    .exit-codes-drive-everything-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-drive-everything-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-drive-everything-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-drive-everything-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-drive-everything-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-drive-everything-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exit-codes-drive-everything-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exit-codes-drive-everything-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exit-codes-drive-everything-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exit-codes-drive-everything-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exit-codes-drive-everything-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exit-codes-drive-everything-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exit-codes-drive-everything-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exit-codes-drive-everything-stage { opacity: 1; }

    .exit-codes-drive-everything-s0 { animation-delay: 0.00s; }
    .exit-codes-drive-everything-e0 { animation-delay: 0.00s; }
    .exit-codes-drive-everything-s1 { animation-delay: 1.28s; }
    .exit-codes-drive-everything-e1 { animation-delay: 1.28s; }
    .exit-codes-drive-everything-s2 { animation-delay: 2.56s; }
    .exit-codes-drive-everything-e2 { animation-delay: 2.56s; }
    .exit-codes-drive-everything-s3 { animation-delay: 3.84s; }
    .exit-codes-drive-everything-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exit-codes-drive-everything-conn  { animation: exit-codes-drive-everything-trace 6.4s ease-in-out infinite; }
      .exit-codes-drive-everything-stage { animation: exit-codes-drive-everything-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exit-codes-drive-everything-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exit-codes-drive-everything-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exit-codes-drive-everything-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exit-codes-drive-everything-stage { animation: exit-codes-drive-everything-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exit-codes-drive-everything-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exit-codes-drive-everything-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exit-codes-drive-everything-bg" width="980" height="322"/>
  <text class="exit-codes-drive-everything-h1"  x="30" y="40">Zero is success, and everything is built on it</text>
  <text class="exit-codes-drive-everything-sub" x="30" y="64">if does not test a value. It runs a command and reads its exit code.</text>
  <g class="exit-codes-drive-everything-stage exit-codes-drive-everything-s0">
    <rect class="exit-codes-drive-everything-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exit-codes-drive-everything-step" x="44" y="142">01</text>
    <text class="exit-codes-drive-everything-name" x="70" y="142">Every command returns a number</text>
    <text class="exit-codes-drive-everything-desc" x="44" y="166">0 means success. Anything else</text>
    <text class="exit-codes-drive-everything-desc" x="44" y="182">means some kind of failure.</text>
    <text class="exit-codes-drive-everything-edge" x="44" y="242">$?</text>
  </g>
  <line class="exit-codes-drive-everything-line exit-codes-drive-everything-conn exit-codes-drive-everything-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exit-codes-drive-everything-tip)"/>
  <g class="exit-codes-drive-everything-stage exit-codes-drive-everything-s1">
    <rect class="exit-codes-drive-everything-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exit-codes-drive-everything-step" x="280" y="142">02</text>
    <text class="exit-codes-drive-everything-name" x="306" y="142">if runs a command</text>
    <text class="exit-codes-drive-everything-desc" x="280" y="166">It does not compare values. It</text>
    <text class="exit-codes-drive-everything-desc" x="280" y="182">runs something and looks at the</text>
    <text class="exit-codes-drive-everything-desc" x="280" y="198">code.</text>
  </g>
  <line class="exit-codes-drive-everything-line exit-codes-drive-everything-conn exit-codes-drive-everything-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exit-codes-drive-everything-tip)"/>
  <g class="exit-codes-drive-everything-stage exit-codes-drive-everything-s2">
    <rect class="exit-codes-drive-everything-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exit-codes-drive-everything-step" x="516" y="142">03</text>
    <text class="exit-codes-drive-everything-name" x="542" y="142">[ is a command too</text>
    <text class="exit-codes-drive-everything-desc" x="516" y="166">Its other name is literally</text>
    <text class="exit-codes-drive-everything-desc" x="516" y="182">test. It exits 0 when its</text>
    <text class="exit-codes-drive-everything-desc" x="516" y="198">condition holds.</text>
    <text class="exit-codes-drive-everything-edge" x="516" y="242">[ -d dir ]</text>
  </g>
  <line class="exit-codes-drive-everything-line exit-codes-drive-everything-conn exit-codes-drive-everything-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exit-codes-drive-everything-tip)"/>
  <g class="exit-codes-drive-everything-stage exit-codes-drive-everything-s3">
    <rect class="exit-codes-drive-everything-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exit-codes-drive-everything-step" x="752" y="142">04</text>
    <text class="exit-codes-drive-everything-name" x="778" y="142">So any command can be a condition</text>
    <text class="exit-codes-drive-everything-desc" x="752" y="166">if grep -q error log; then —</text>
    <text class="exit-codes-drive-everything-desc" x="752" y="182">because grep's exit code says</text>
    <text class="exit-codes-drive-everything-desc" x="752" y="198">whether it matched.</text>
  </g>
  <text class="exit-codes-drive-everything-sub" x="30" y="304">This is why &amp;&amp; and || work on any command, and why a script that ignores exit codes is a script that cannot tell success from failure.</text>
</svg>
