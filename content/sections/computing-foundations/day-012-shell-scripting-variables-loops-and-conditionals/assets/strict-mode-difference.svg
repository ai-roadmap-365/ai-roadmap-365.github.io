<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One reports a problem. The other reports success.">
  <title>The same failing script, with and without strict mode</title>
  <style>
    .strict-mode-difference-bg   { fill: #f8fafc; }
    .strict-mode-difference-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strict-mode-difference-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strict-mode-difference-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strict-mode-difference-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strict-mode-difference-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strict-mode-difference-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .strict-mode-difference-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .strict-mode-difference-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .strict-mode-difference-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .strict-mode-difference-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .strict-mode-difference-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="strict-mode-difference-bg" width="980" height="390"/>
  <text class="strict-mode-difference-h1"  x="30" y="40">The same failing script, with and without strict mode</text>
  <text class="strict-mode-difference-sub" x="30" y="64">One reports a problem. The other reports success.</text>
  <rect class="strict-mode-difference-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="strict-mode-difference-name" x="46" y="122">Without set -euo pipefail</text>
  <text class="strict-mode-difference-desc" x="46" y="142">The download fails at step 2</text>
  <text class="strict-mode-difference-desc" x="46" y="182">curl fails — nothing is written</text>
  <text class="strict-mode-difference-desc" x="46" y="216">The script carries on to step 3</text>
  <text class="strict-mode-difference-desc" x="46" y="250">Training runs on an empty file</text>
  <text class="strict-mode-difference-desc" x="46" y="284">$UNSET_VAR expands to nothing, silently</text>
  <text class="strict-mode-difference-desc" x="46" y="318">Exits 0. The scheduler records success.</text>
  <rect class="strict-mode-difference-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="strict-mode-difference-name" x="526" y="122">With set -euo pipefail</text>
  <text class="strict-mode-difference-desc" x="526" y="142">The same failure, at the same step</text>
  <text class="strict-mode-difference-desc" x="526" y="182">curl fails — nothing is written</text>
  <text class="strict-mode-difference-desc" x="526" y="216">-e stops the script immediately</text>
  <text class="strict-mode-difference-desc" x="526" y="250">-u would have caught the unset variable</text>
  <text class="strict-mode-difference-desc" x="526" y="284">-o pipefail catches a failure mid-pipe</text>
  <text class="strict-mode-difference-desc" x="526" y="318">Exits non-zero. Someone finds out.</text>
  <text class="strict-mode-difference-sub" x="30" y="372">Three characters of configuration decide whether a broken run is a failure or a silently wrong result.</text>
</svg>
