questions:
  - question: 'What does it mean to serialize a piece of data?'
    options:
      - 'To sort the data into ascending order before saving it'
      - 'To turn an in-memory value into a string that can be rebuilt'
      - 'To encrypt the data so it cannot be read on the network'
      - 'To compress the data into the smallest possible binary form on disk'
    answer_index: 1
    explanation: 'Serialization writes a living in-memory value out as a self-contained string of characters; parsing reads that string back into an equivalent value. Sorting, encryption, and compression are separate concerns.'

  - question: 'Which of the following is NOT one of JSON''s six value types?'
    options:
      - 'object'
      - 'array'
      - 'date'
      - 'null'
    answer_index: 2
    explanation: 'JSON has exactly six value types: object, array, string, number, boolean, and null. There is no native date type — dates must be encoded as strings or numbers by convention.'

  - question: 'Why is `{"name": "x",}` invalid JSON?'
    options:
      - 'Keys are not allowed to be strings'
      - 'The value "x" must be a number rather than a quoted string'
      - 'Objects must contain at least two keys'
      - 'It has a trailing comma after the last key-value pair'
    answer_index: 3
    explanation: 'The comma after the last pair is a trailing comma: it promises another key-value pair that never arrives, so the parser stops and reports an error. Trailing commas are one of the most common JSON mistakes.'

  - question: 'What is the difference between the JSON values `512` and `"512"`?'
    options:
      - '`512` is a number and `"512"` is a string, and services treat them as different types'
      - 'They are identical; quotes around numbers are optional in JSON'
      - '`"512"` is valid but `512` is not, because all JSON values must be quoted'
      - '`512` is an integer type and `"512"` is a floating-point type'
    answer_index: 0
    explanation: 'JSON distinguishes strictly between a number (`512`) and a string of digits (`"512"`). A service expecting one will reject or misread the other, so the distinction matters in every request you send.'

  - question: 'Who specified JSON and published its grammar, and where did the syntax originate?'
    options:
      - 'Tim Berners-Lee, from the syntax of HTML'
      - 'Douglas Crockford, from JavaScript''s object and array notation'
      - 'A W3C committee, from the syntax of XML'
      - 'Google, from the Protocol Buffers schema language'
    answer_index: 1
    explanation: 'Douglas Crockford specified JSON in the early 2000s and published its grammar at json.org, drawing the syntax from JavaScript''s object literal notation — though JSON itself is language-independent text.'

  - question: 'What is the purpose of JSON Schema?'
    options:
      - 'To compress JSON documents into a compact binary format for storage'
      - 'To encrypt the values inside a JSON document'
      - 'To describe the shape a valid JSON document must have'
      - 'To translate JSON automatically into XML'
    answer_index: 2
    explanation: 'A JSON document is valid JSON regardless of whether it makes sense for your purpose. JSON Schema is a separate JSON document that specifies the required structure, so a validator can report exactly where data violates the rules.'

  - question: 'When would a binary format such as Protocol Buffers or MessagePack be a better choice than JSON?'
    options:
      - 'Whenever a human might need to read the data by eye'
      - 'For configuration files that people edit by hand'
      - 'Whenever the data contains nested objects and arrays'
      - 'For high-volume internal traffic where size or speed really matters'
    answer_index: 3
    explanation: 'Binary formats trade human-readability for compactness and speed, which pays off at high volume between internal services once profiling shows serialization is the bottleneck. For readable, universal exchange, JSON remains the default.'

  - question: 'Why should you always parse untrusted JSON with a real parser rather than evaluating it as code?'
    options:
      - 'Evaluating a malicious payload could run arbitrary code'
      - 'A parser produces prettier formatted output'
      - 'Evaluating it is slower than parsing the text'
      - 'Parsers automatically encrypt the result'
    answer_index: 0
    explanation: 'Because JSON''s syntax overlaps with JavaScript, evaluating a JSON string as code is tempting but dangerous: a malicious payload could execute. A real parser treats the input strictly as data and can only produce the six JSON value types.'
