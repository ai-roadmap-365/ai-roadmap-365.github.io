terms:
  - term: serialization
    definition: 'The act of turning an in-memory value into a flat, self-contained string of characters that can be stored or transmitted and later rebuilt.'
  - term: parsing
    definition: 'The reverse of serialization: reading a string and reconstructing an equivalent in-memory value from it. Also called deserializing.'
  - term: JSON
    definition: 'JavaScript Object Notation — a compact, human-readable text format for representing structured data, and the dominant format for web data exchange.'
  - term: object
    definition: 'A JSON value that is an unordered collection of "key": value pairs, where every key is a double-quoted string; it maps to a dictionary or map in most languages.'
  - term: array
    definition: 'A JSON value that is an ordered list of values of any type, written inside square brackets; it maps to a list in most languages.'
  - term: key-value pair
    definition: 'A single entry inside a JSON object: a double-quoted key, a colon, and a value, such as "lat": 26.9124.'
  - term: 'null'
    definition: 'The JSON literal for a value that is deliberately empty — a present slot whose contents are intentionally nothing.'
  - term: schema
    definition: 'A description of the shape valid data must take; for JSON, JSON Schema is itself a JSON document specifying required keys, value types, and allowed ranges.'
  - term: round-trip property
    definition: 'The contract that parsing a value you just serialized returns a value equal to the original, so no information is lost in the trip out and back.'
  - term: XML
    definition: 'The Extensible Markup Language, a tag-based text format for structured data that predates JSON and suits document-style and legacy enterprise data.'
  - term: YAML
    definition: 'A text data format that uses indentation instead of braces, favored for configuration files that people edit by hand.'
  - term: CSV
    definition: 'Comma-separated values, a flat text format for tables of uniform rows; simple and spreadsheet-friendly but unable to express nesting.'
  - term: MessagePack
    definition: 'A binary serialization format that keeps JSON''s exact data model in a smaller, faster encoding, used when compactness or speed matters more than readability.'
  - term: Protocol Buffers
    definition: 'A schema-first binary serialization format from Google, designed for compact, fast data exchange between high-volume internal services.'
