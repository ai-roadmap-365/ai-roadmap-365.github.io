visuals:
  - id: json-structure
    file: assets/json-structure.svg
    type: diagram
    title: 'Anatomy of a JSON object'
    alt: 'Diagram: an annotated JSON object showing the six value types nested inside one another'
    description: 'A single JSON object with each line labeled by its value type — string, boolean, number, a nested object of coordinates, an array of sensors, and an explicit null — showing how objects and arrays nest to any depth and how keys are always double-quoted.'
  - id: serialize-roundtrip
    file: assets/serialize-roundtrip.svg
    type: flowchart
    title: 'The serialize / parse round trip'
    alt: 'Diagram: the serialization round trip from an in-memory object to a JSON string, across a channel, and back to an object'
    description: 'A left-to-right flow: an in-memory object in Program A is serialized into a JSON string, the plain text travels over a network or file or pipe, and Program B parses it back into an equivalent object, with the round-trip rule that parsing what you serialized returns an equal value.'
  - id: json-versus-xml
    file: assets/json-versus-xml.svg
    type: diagram
    title: 'Why JSON displaced XML'
    alt: 'Diagram: XML compared with JSON'
    description: 'A two-column comparison of XML and JSON covering verbosity, tooling requirements, schema support and the reasons JSON became the default for web APIs.'
  - id: six-pitfalls
    file: assets/six-pitfalls.svg
    type: diagram
    title: 'Six mistakes account for most JSON trouble'
    alt: 'Diagram: the six most common JSON errors'
    description: 'A five-stage reference to common JSON errors covering trailing commas, single quotes, string and number confusion, escaping, and integer precision loss.'
  - id: parse-not-eval
    file: assets/parse-not-eval.svg
    type: diagram
    title: 'Parsing and evaluating are not the same'
    alt: 'Diagram: parsing JSON compared with evaluating it as code'
    description: 'A two-column comparison of parsing JSON with a dedicated parser against evaluating it as JavaScript source, covering what each does with untrusted input.'
  - id: json-versus-jsonl
    file: assets/json-versus-jsonl.svg
    type: diagram
    title: 'One document, or one per line'
    alt: 'Diagram: a single JSON array compared with JSON Lines'
    description: 'A two-column comparison of a single JSON array against JSON Lines format, covering memory use, streaming, appendability and the effect of one malformed record.'
  - id: structured-output
    file: assets/structured-output.svg
    type: diagram
    title: 'Getting JSON out of a model reliably'
    alt: 'Diagram: the steps to obtain and validate structured output from a model'
    description: 'A four-stage sequence for obtaining structured output from a language model covering supplying a schema, stripping markdown fences, parsing, and validating against the schema before use.'
  - id: format-by-size
    file: assets/format-by-size.svg
    type: diagram
    title: 'JSON is the right default and the wrong endpoint'
    alt: 'Diagram: which serialization format suits which data size'
    description: 'A four-stage progression of serialization formats by data size and use, from JSON for API responses through JSONL for datasets to columnar and binary formats for large or performance-critical data.'
  - id: serialize-parse-symmetry
    file: assets/serialize-parse-symmetry.svg
    type: diagram
    title: 'Two programs that never share memory'
    alt: 'Diagram: how a value travels between two programs as text'
    description: 'A four-stage sequence following a value from one program''s memory through serialization to text, transmission or storage as bytes, and parsing back into an equivalent value in another program.'
  - id: valid-versus-correct
    file: assets/valid-versus-correct.svg
    type: diagram
    title: 'Valid JSON and correct data are different claims'
    alt: 'Diagram: syntactic validity compared with schema validation'
    description: 'A two-column comparison of what a JSON parser guarantees against what schema validation adds, covering required fields, value types and ranges.'
  - id: parse-error-reading
    file: assets/parse-error-reading.svg
    type: diagram
    title: 'Reading a parse error'
    alt: 'Diagram: how to interpret a JSON parse error message'
    description: 'A four-stage guide to diagnosing JSON parse errors, covering reading the reported line and column, recognising that structural errors are reported late, checking the status code first, and stripping markdown fences.'
