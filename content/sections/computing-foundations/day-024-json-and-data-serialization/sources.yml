    publisher: 'json.org / Douglas Crockford'
    accessed: '2026-07-12'
    note: 'The canonical one-page description of the JSON grammar and its six value types.'
  - title: 'Working with JSON'
    url: 'https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Objects/JSON'
    publisher: 'MDN Web Docs'
