  - title: 'JSON'
    url: 'https://en.wikipedia.org/wiki/JSON'
    publisher: 'Wikipedia'
    accessed: '2026-07-12'
    note: 'History, standardization (ECMA-404, RFC 8259), and comparison with other formats.'
  - title: 'jq Manual'
    url: 'https://jqlang.github.io/jq/manual/'
    publisher: 'jq'
    accessed: '2026-07-12'
    note: 'Reference for the jq command-line tool used to filter and extract JSON fields.'
  - title: 'JSON Schema'
    url: 'https://json-schema.org/'
    publisher: 'JSON Schema'
    accessed: '2026-07-12'
    note: 'The specification and tooling for describing and validating the shape of JSON documents.'
