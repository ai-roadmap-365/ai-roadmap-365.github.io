id: D024
day: 24
slug: json-and-data-serialization
title: 'JSON and Data Serialization'
section: computing-foundations
subsection: networks-and-the-internet
week: 4
learning_promise: 'After this lesson you will be able to read and write JSON confidently — its six value types, its syntax rules, and its common pitfalls — turn data into a string and back through serialization, and choose JSON or a rival format for any data-exchange job.'
objectives:
  - 'Explain what serialization and parsing are and state the round-trip property that connects them'
  - 'Name JSON''s six value types (object, array, string, number, boolean, null) and give a correct example of each'
  - 'Apply JSON''s syntax rules and identify the common pitfalls: trailing commas, wrong quotes, numbers versus strings, escaping, and big integers'
  - 'Validate, pretty-print, and extract fields from a JSON document at the command line using tools already on the machine'
  - 'Compare JSON with XML, YAML, CSV, and binary formats (Protocol Buffers, MessagePack) and choose the right one for a given situation'
  - 'Describe the role of JSON Schema in validating that a document has the required shape'
  - 'Connect JSON to real web practice: requests and responses to hosted services are JSON documents that must be well-formed and validated'
prerequisites:
  - 'Days 1–23, especially the week''s material on HTTP and how web requests carry data'
  - 'A terminal with python3 available (preinstalled on macOS and Linux)'
reading_time_minutes: 40
practical_time_minutes: 30
