<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The syntax overlap with JavaScript is a trap, not a shortcut.">
  <title>Parsing and evaluating are not the same</title>
  <style>
    .parse-not-eval-bg   { fill: #f8fafc; }
    .parse-not-eval-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-not-eval-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-not-eval-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-not-eval-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-not-eval-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-not-eval-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parse-not-eval-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parse-not-eval-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parse-not-eval-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parse-not-eval-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parse-not-eval-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parse-not-eval-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parse-not-eval-row { opacity: 1; }
    .parse-not-eval-r0 { animation-delay: 0.00s; }
    .parse-not-eval-r1 { animation-delay: 0.45s; }
    .parse-not-eval-r2 { animation-delay: 0.90s; }
    .parse-not-eval-r3 { animation-delay: 1.35s; }
    .parse-not-eval-r4 { animation-delay: 1.80s; }
    .parse-not-eval-row { animation: parse-not-eval-reveal 7.3s ease-in-out infinite; }
    @keyframes parse-not-eval-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="parse-not-eval-bg" width="980" height="390"/>
  <text class="parse-not-eval-h1"  x="30" y="40">Parsing and evaluating are not the same</text>
  <text class="parse-not-eval-sub" x="30" y="64">The syntax overlap with JavaScript is a trap, not a shortcut.</text>
  <rect class="parse-not-eval-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="parse-not-eval-name" x="46" y="122">eval(text)</text>
  <text class="parse-not-eval-desc" x="46" y="142">Runs whatever arrived.</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r0" x="46" y="182">Treats the input as source code</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r1" x="46" y="216">Any expression in it executes</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r2" x="46" y="250">With your program's full privileges</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r3" x="46" y="284">Not faster; it is a compiler</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r4" x="46" y="318">Present in every language, and never the answer</text>
  <rect class="parse-not-eval-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="parse-not-eval-name" x="526" y="122">parse(text)</text>
  <text class="parse-not-eval-desc" x="526" y="142">Reads it as data.</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r0" x="526" y="182">Only the six value types are recognised</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r1" x="526" y="216">Anything else is a syntax error</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r2" x="526" y="250">Nothing can execute</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r3" x="526" y="284">In every standard library</text>
  <text class="parse-not-eval-desc parse-not-eval-row parse-not-eval-r4" x="526" y="318">Also gives you the line and column when it fails</text>
  <text class="parse-not-eval-sub" x="30" y="372">Two more limits worth setting on anything public: a maximum document size, and a maximum nesting depth. Deeply nested input can exhaust a parser's stack, and that is a denial of service.</text>
</svg>
