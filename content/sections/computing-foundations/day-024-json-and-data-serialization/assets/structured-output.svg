<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and the last two are the ones people skip.">
  <title>Getting JSON out of a model reliably</title>
  <style>
    .structured-output-bg   { fill: #f8fafc; }
    .structured-output-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-output-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-output-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-output-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-output-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-output-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structured-output-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .structured-output-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .structured-output-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .structured-output-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .structured-output-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .structured-output-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .structured-output-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .structured-output-stage { opacity: 1; }

    .structured-output-s0 { animation-delay: 0.00s; }
    .structured-output-e0 { animation-delay: 0.00s; }
    .structured-output-s1 { animation-delay: 1.28s; }
    .structured-output-e1 { animation-delay: 1.28s; }
    .structured-output-s2 { animation-delay: 2.56s; }
    .structured-output-e2 { animation-delay: 2.56s; }
    .structured-output-s3 { animation-delay: 3.84s; }
    .structured-output-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .structured-output-conn  { animation: structured-output-trace 6.4s ease-in-out infinite; }
      .structured-output-stage { animation: structured-output-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes structured-output-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes structured-output-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .structured-output-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .structured-output-stage { animation: structured-output-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes structured-output-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="structured-output-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="structured-output-bg" width="980" height="322"/>
  <text class="structured-output-h1"  x="30" y="40">Getting JSON out of a model reliably</text>
  <text class="structured-output-sub" x="30" y="64">Four steps, and the last two are the ones people skip.</text>
  <g class="structured-output-stage structured-output-s0">
    <rect class="structured-output-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="structured-output-step" x="44" y="142">01</text>
    <text class="structured-output-name" x="70" y="142">Give it the schema</text>
    <text class="structured-output-desc" x="44" y="166">Constraining the shape beats</text>
    <text class="structured-output-desc" x="44" y="182">asking nicely and hoping.</text>
    <text class="structured-output-edge" x="44" y="242">schema</text>
  </g>
  <line class="structured-output-line structured-output-conn structured-output-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#structured-output-tip)"/>
  <g class="structured-output-stage structured-output-s1">
    <rect class="structured-output-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="structured-output-step" x="280" y="142">02</text>
    <text class="structured-output-name" x="306" y="142">Strip the fence</text>
    <text class="structured-output-desc" x="280" y="166">Models often wrap output in</text>
    <text class="structured-output-desc" x="280" y="182">markdown. That is not JSON until</text>
    <text class="structured-output-desc" x="280" y="198">the fence is gone.</text>
    <text class="structured-output-edge" x="280" y="242">```json</text>
  </g>
  <line class="structured-output-line structured-output-conn structured-output-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#structured-output-tip)"/>
  <g class="structured-output-stage structured-output-s2">
    <rect class="structured-output-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="structured-output-step" x="516" y="142">03</text>
    <text class="structured-output-name" x="542" y="142">Parse it</text>
    <text class="structured-output-desc" x="516" y="166">With a real parser, catching the</text>
    <text class="structured-output-desc" x="516" y="182">error rather than assuming</text>
    <text class="structured-output-desc" x="516" y="198">success.</text>
  </g>
  <line class="structured-output-line structured-output-conn structured-output-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#structured-output-tip)"/>
  <g class="structured-output-stage structured-output-s3">
    <rect class="structured-output-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="structured-output-step" x="752" y="142">04</text>
    <text class="structured-output-name" x="778" y="142">Validate against the schema</text>
    <text class="structured-output-desc" x="752" y="166">Valid JSON is not correct data.</text>
    <text class="structured-output-desc" x="752" y="182">Check the fields before acting</text>
    <text class="structured-output-desc" x="752" y="198">on them.</text>
    <text class="structured-output-edge" x="752" y="242">validated</text>
  </g>
  <text class="structured-output-sub" x="30" y="304">Parsing tells you it is well-formed. Validation tells you it is what you asked for. Skipping the second is how a confidently wrong field reaches production.</text>
</svg>
