<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The difference matters most when the text came from somewhere else.">
  <title>Parsing produces data. Evaluating produces behaviour.</title>
  <style>
    .parse-versus-eval-bg   { fill: #f8fafc; }
    .parse-versus-eval-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-versus-eval-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-versus-eval-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-versus-eval-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-versus-eval-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-versus-eval-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parse-versus-eval-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parse-versus-eval-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parse-versus-eval-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parse-versus-eval-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parse-versus-eval-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parse-versus-eval-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parse-versus-eval-row { opacity: 1; }
    .parse-versus-eval-r0 { animation-delay: 0.00s; }
    .parse-versus-eval-r1 { animation-delay: 0.45s; }
    .parse-versus-eval-r2 { animation-delay: 0.90s; }
    .parse-versus-eval-r3 { animation-delay: 1.35s; }
    .parse-versus-eval-r4 { animation-delay: 1.80s; }
    .parse-versus-eval-row { animation: parse-versus-eval-reveal 7.3s ease-in-out infinite; }
    @keyframes parse-versus-eval-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="parse-versus-eval-bg" width="980" height="390"/>
  <text class="parse-versus-eval-h1"  x="30" y="40">Parsing produces data. Evaluating produces behaviour.</text>
  <text class="parse-versus-eval-sub" x="30" y="64">The difference matters most when the text came from somewhere else.</text>
  <rect class="parse-versus-eval-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="parse-versus-eval-name" x="46" y="122">json.loads(text)</text>
  <text class="parse-versus-eval-desc" x="46" y="142">Can only produce data</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r0" x="46" y="182">Lists, dicts, strings, numbers, booleans, null</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r1" x="46" y="216">Malformed input raises, loudly</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r2" x="46" y="250">Cannot call a function or import a module</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r3" x="46" y="284">Safe on text from anywhere</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r4" x="46" y="318">The only correct choice for model output</text>
  <rect class="parse-versus-eval-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="parse-versus-eval-name" x="526" y="122">eval(text)</text>
  <text class="parse-versus-eval-desc" x="526" y="142">Runs whatever it is given</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r0" x="526" y="182">Executes the string as Python</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r1" x="526" y="216">Can read files, open sockets, delete data</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r2" x="526" y="250">Looks like it works — until the input is hostile</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r3" x="526" y="284">Model output is untrusted input</text>
  <text class="parse-versus-eval-desc parse-versus-eval-row parse-versus-eval-r4" x="526" y="318">There is no version of this that is worth the risk</text>
  <text class="parse-versus-eval-sub" x="30" y="372">A parser is not a slower eval. It is a different operation with a much smaller set of possible outcomes.</text>
</svg>
