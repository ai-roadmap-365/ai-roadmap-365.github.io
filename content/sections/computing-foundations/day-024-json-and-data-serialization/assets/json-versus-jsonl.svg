<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The format decision that matters most for datasets.">
  <title>One document, or one per line</title>
  <style>
    .json-versus-jsonl-bg   { fill: #f8fafc; }
    .json-versus-jsonl-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-jsonl-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-jsonl-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-jsonl-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-jsonl-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-versus-jsonl-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .json-versus-jsonl-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .json-versus-jsonl-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .json-versus-jsonl-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .json-versus-jsonl-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .json-versus-jsonl-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .json-versus-jsonl-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .json-versus-jsonl-row { opacity: 1; }
    .json-versus-jsonl-r0 { animation-delay: 0.00s; }
    .json-versus-jsonl-r1 { animation-delay: 0.45s; }
    .json-versus-jsonl-r2 { animation-delay: 0.90s; }
    .json-versus-jsonl-r3 { animation-delay: 1.35s; }
    .json-versus-jsonl-r4 { animation-delay: 1.80s; }
    .json-versus-jsonl-row { animation: json-versus-jsonl-reveal 7.3s ease-in-out infinite; }
    @keyframes json-versus-jsonl-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="json-versus-jsonl-bg" width="980" height="390"/>
  <text class="json-versus-jsonl-h1"  x="30" y="40">One document, or one per line</text>
  <text class="json-versus-jsonl-sub" x="30" y="64">The format decision that matters most for datasets.</text>
  <rect class="json-versus-jsonl-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="json-versus-jsonl-name" x="46" y="122">One JSON array</text>
  <text class="json-versus-jsonl-desc" x="46" y="142">[{...}, {...}, {...}]</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r0" x="46" y="182">The parser must read it all before returning</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r1" x="46" y="216">Memory grows with the file</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r2" x="46" y="250">Cannot append without rewriting the end</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r3" x="46" y="284">One bad record invalidates the whole file</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r4" x="46" y="318">Fine for a response; poor for a dataset</text>
  <rect class="json-versus-jsonl-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="json-versus-jsonl-name" x="526" y="122">JSON Lines</text>
  <text class="json-versus-jsonl-desc" x="526" y="142">One object per line.</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r0" x="526" y="182">Parse one line at a time</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r1" x="526" y="216">Memory stays flat, whatever the size</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r2" x="526" y="250">Append by writing another line</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r3" x="526" y="284">A bad line loses one record, not the file</text>
  <text class="json-versus-jsonl-desc json-versus-jsonl-row json-versus-jsonl-r4" x="526" y="318">Works with grep, wc, head and split</text>
  <text class="json-versus-jsonl-sub" x="30" y="372">This is why training data is essentially always JSONL. It also means every tool from Day 10 works on it, which a single enormous array defeats entirely.</text>
</svg>
