<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Recognise them by sight and the debugging disappears.">
  <title>Six mistakes account for most JSON trouble</title>
  <style>
    .six-pitfalls-bg   { fill: #f8fafc; }
    .six-pitfalls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pitfalls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pitfalls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pitfalls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pitfalls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pitfalls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .six-pitfalls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .six-pitfalls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .six-pitfalls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .six-pitfalls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .six-pitfalls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .six-pitfalls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .six-pitfalls-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .six-pitfalls-stage { opacity: 1; }

    .six-pitfalls-s0 { animation-delay: 0.00s; }
    .six-pitfalls-e0 { animation-delay: 0.00s; }
    .six-pitfalls-s1 { animation-delay: 1.33s; }
    .six-pitfalls-e1 { animation-delay: 1.33s; }
    .six-pitfalls-s2 { animation-delay: 2.67s; }
    .six-pitfalls-e2 { animation-delay: 2.67s; }
    .six-pitfalls-s3 { animation-delay: 4.00s; }
    .six-pitfalls-e3 { animation-delay: 4.00s; }
    .six-pitfalls-s4 { animation-delay: 5.33s; }
    .six-pitfalls-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .six-pitfalls-conn  { animation: six-pitfalls-trace 8s ease-in-out infinite; }
      .six-pitfalls-stage { animation: six-pitfalls-arrive 8s ease-in-out infinite; }
    }
    @keyframes six-pitfalls-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes six-pitfalls-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .six-pitfalls-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .six-pitfalls-stage { animation: six-pitfalls-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes six-pitfalls-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="six-pitfalls-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="six-pitfalls-bg" width="980" height="322"/>
  <text class="six-pitfalls-h1"  x="30" y="40">Six mistakes account for most JSON trouble</text>
  <text class="six-pitfalls-sub" x="30" y="64">Recognise them by sight and the debugging disappears.</text>
  <g class="six-pitfalls-stage six-pitfalls-s0">
    <rect class="six-pitfalls-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="six-pitfalls-step" x="44" y="142">01</text>
    <text class="six-pitfalls-name" x="70" y="142">Trailing comma</text>
    <text class="six-pitfalls-desc" x="44" y="166">["a", "b",] promises</text>
    <text class="six-pitfalls-desc" x="44" y="182">another item that never</text>
    <text class="six-pitfalls-desc" x="44" y="198">comes.</text>
    <text class="six-pitfalls-edge" x="44" y="242">invalid</text>
  </g>
  <line class="six-pitfalls-line six-pitfalls-conn six-pitfalls-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#six-pitfalls-tip)"/>
  <g class="six-pitfalls-stage six-pitfalls-s1">
    <rect class="six-pitfalls-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="six-pitfalls-step" x="233" y="142">02</text>
    <text class="six-pitfalls-name" x="259" y="142">Single quotes</text>
    <text class="six-pitfalls-desc" x="233" y="166">{'name': 'x'} is</text>
    <text class="six-pitfalls-desc" x="233" y="182">JavaScript, not JSON.</text>
    <text class="six-pitfalls-desc" x="233" y="198">Double quotes always.</text>
    <text class="six-pitfalls-edge" x="233" y="242">invalid</text>
  </g>
  <line class="six-pitfalls-line six-pitfalls-conn six-pitfalls-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#six-pitfalls-tip)"/>
  <g class="six-pitfalls-stage six-pitfalls-s2">
    <rect class="six-pitfalls-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="six-pitfalls-step" x="422" y="142">03</text>
    <text class="six-pitfalls-name" x="448" y="142">"512" is not 512</text>
    <text class="six-pitfalls-desc" x="422" y="166">A string and a number. A</text>
    <text class="six-pitfalls-desc" x="422" y="182">service expecting one</text>
    <text class="six-pitfalls-desc" x="422" y="198">will reject or misread</text>
    <text class="six-pitfalls-edge" x="422" y="242">type</text>
  </g>
  <line class="six-pitfalls-line six-pitfalls-conn six-pitfalls-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#six-pitfalls-tip)"/>
  <g class="six-pitfalls-stage six-pitfalls-s3">
    <rect class="six-pitfalls-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="six-pitfalls-step" x="611" y="142">04</text>
    <text class="six-pitfalls-name" x="637" y="142">Unescaped characters</text>
    <text class="six-pitfalls-desc" x="611" y="166">A newline, a quote or a</text>
    <text class="six-pitfalls-desc" x="611" y="182">backslash inside a string</text>
    <text class="six-pitfalls-desc" x="611" y="198">must be escaped.</text>
    <text class="six-pitfalls-edge" x="611" y="242">backslash</text>
  </g>
  <line class="six-pitfalls-line six-pitfalls-conn six-pitfalls-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#six-pitfalls-tip)"/>
  <g class="six-pitfalls-stage six-pitfalls-s4">
    <rect class="six-pitfalls-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="six-pitfalls-step" x="800" y="142">05</text>
    <text class="six-pitfalls-name" x="826" y="142">Big integers</text>
    <text class="six-pitfalls-desc" x="800" y="166">Read as a float, exact</text>
    <text class="six-pitfalls-desc" x="800" y="182">only to about 2^53. A</text>
    <text class="six-pitfalls-desc" x="800" y="198">19-digit id loses its</text>
    <text class="six-pitfalls-edge" x="800" y="242">2^53</text>
  </g>
  <text class="six-pitfalls-sub" x="30" y="304">And a sixth that is an omission rather than an error: there is no date type. ISO 8601 strings are a convention every parser has agreed to, and nothing enforces.</text>
</svg>
