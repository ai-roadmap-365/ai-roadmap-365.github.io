<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A parser checks the grammar. Only a schema checks the meaning.">
  <title>Valid JSON and correct data are different claims</title>
  <style>
    .valid-versus-correct-bg   { fill: #f8fafc; }
    .valid-versus-correct-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-versus-correct-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-versus-correct-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-versus-correct-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-versus-correct-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-versus-correct-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .valid-versus-correct-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .valid-versus-correct-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .valid-versus-correct-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .valid-versus-correct-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .valid-versus-correct-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .valid-versus-correct-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .valid-versus-correct-row { opacity: 1; }
    .valid-versus-correct-r0 { animation-delay: 0.00s; }
    .valid-versus-correct-r1 { animation-delay: 0.45s; }
    .valid-versus-correct-r2 { animation-delay: 0.90s; }
    .valid-versus-correct-r3 { animation-delay: 1.35s; }
    .valid-versus-correct-r4 { animation-delay: 1.80s; }
    .valid-versus-correct-row { animation: valid-versus-correct-reveal 7.3s ease-in-out infinite; }
    @keyframes valid-versus-correct-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="valid-versus-correct-bg" width="980" height="390"/>
  <text class="valid-versus-correct-h1"  x="30" y="40">Valid JSON and correct data are different claims</text>
  <text class="valid-versus-correct-sub" x="30" y="64">A parser checks the grammar. Only a schema checks the meaning.</text>
  <rect class="valid-versus-correct-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="valid-versus-correct-name" x="46" y="122">The parser says yes</text>
  <text class="valid-versus-correct-desc" x="46" y="142">It is well-formed JSON.</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r0" x="46" y="182">Quotes, commas and braces are correct</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r1" x="46" y="216">It is one of the six value types</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r2" x="46" y="250">It parsed without error</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r3" x="46" y="284">And it may be complete nonsense</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r4" x="46" y="318">{} is perfectly valid JSON</text>
  <rect class="valid-versus-correct-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="valid-versus-correct-name" x="526" y="122">The schema says yes</text>
  <text class="valid-versus-correct-desc" x="526" y="142">It is the data you asked for.</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r0" x="526" y="182">The required fields are present</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r1" x="526" y="216">Each value has the right type</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r2" x="526" y="250">Numbers are within allowed ranges</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r3" x="526" y="284">Errors name the field and the rule</text>
  <text class="valid-versus-correct-desc valid-versus-correct-row valid-versus-correct-r4" x="526" y="318">"elevation_m must be a number"</text>
  <text class="valid-versus-correct-sub" x="30" y="372">That difference is the difference between "the service rejected my request" and knowing exactly which field was wrong — which is the difference between guessing and knowing.</text>
</svg>
