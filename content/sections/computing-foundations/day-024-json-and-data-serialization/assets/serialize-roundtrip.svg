<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>The serialization round trip: an in-memory object becomes a JSON string, travels, and is parsed back into an object</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The serialize / parse round trip</text>

  <!-- Sender in-memory object -->
  <rect x="30" y="80" width="180" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="120" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">In-memory object</text>
  <text x="120" y="128" text-anchor="middle" font-size="13" fill="#1a202c">(Program A)</text>
  <text x="120" y="152" text-anchor="middle" font-size="13" fill="#1a202c">structured values</text>
  <text x="120" y="170" text-anchor="middle" font-size="13" fill="#1a202c">living in RAM,</text>
  <text x="120" y="188" text-anchor="middle" font-size="13" fill="#1a202c">tied to one process</text>

  <!-- serialize arrow -->
  <line x1="210" y1="140" x2="286" y2="140" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="294,140 280,133 280,147" fill="#1d4ed8"/>
  <text x="250" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">serialize</text>

  <!-- JSON string -->
  <rect x="296" y="90" width="168" height="100" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">JSON string</text>
  <text x="380" y="140" text-anchor="middle" font-size="12" font-family="monospace" fill="#1a202c">{"station":</text>
  <text x="380" y="158" text-anchor="middle" font-size="12" font-family="monospace" fill="#1a202c">"Nimbus-7",</text>
  <text x="380" y="176" text-anchor="middle" font-size="12" font-family="monospace" fill="#1a202c">"active":true}</text>

  <!-- parse arrow -->
  <line x1="464" y1="140" x2="540" y2="140" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="548,140 534,133 534,147" fill="#1d4ed8"/>
  <text x="504" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">parse</text>

  <!-- Receiver in-memory object -->
  <rect x="550" y="80" width="180" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="640" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">In-memory object</text>
  <text x="640" y="128" text-anchor="middle" font-size="13" fill="#1a202c">(Program B)</text>
  <text x="640" y="152" text-anchor="middle" font-size="13" fill="#1a202c">an equivalent copy,</text>
  <text x="640" y="170" text-anchor="middle" font-size="13" fill="#1a202c">rebuilt from the</text>
  <text x="640" y="188" text-anchor="middle" font-size="13" fill="#1a202c">same text</text>

  <!-- transmit channel -->
  <rect x="120" y="250" width="520" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Transmit or store the plain text</text>
  <text x="380" y="302" text-anchor="middle" font-size="13" fill="#1a202c">over a network, into a file, or through a pipe — bytes only, no live objects</text>

  <!-- down arrow from JSON string to channel -->
  <line x1="380" y1="190" x2="380" y2="242" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="380,250 373,236 387,236" fill="#1d4ed8"/>
  <!-- up arrow from channel back to receiver side -->
  <line x1="560" y1="250" x2="560" y2="205" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="560,198 553,212 567,212" fill="#94a3b8"/>

  <text x="380" y="372" text-anchor="middle" font-size="14" fill="#1a202c">A string survives travel and storage; a live object does not. That is why we serialize.</text>
  <text x="380" y="404" text-anchor="middle" font-size="13" fill="#1d4ed8">Round trip rule: parse(serialize(x)) should give back a value equal to x.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 210 140 L 286 140" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 464 140 L 540 140" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 380 190 L 380 242" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 560 250 L 560 205" stroke="#94a3b8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
