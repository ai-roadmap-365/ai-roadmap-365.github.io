terms:
  - term: API
    definition: 'An Application Programming Interface: a defined contract by which one program asks another to do something, exposing the requests it accepts and responses it returns while hiding how it works inside.'
  - term: web API
    definition: 'An API reached over HTTP across the network — a service on another computer your program calls with requests and reads responses from, instead of a local function.'
  - term: endpoint
    definition: 'A specific URL that a web API answers at, usually standing for one resource or operation, such as /todos/1 or /users/1.'
  - term: request
    definition: 'What a client sends to an API: a method (verb), a path/endpoint, optional query parameters, headers, and an optional body.'
  - term: response
    definition: 'What the server sends back: a status code indicating the outcome, headers describing the answer, and a body carrying the data (usually JSON).'
  - term: payload
    definition: 'The data carried in the body of a request or response — for example the JSON describing a thing to create in a POST, or the data returned in a response.'
  - term: parameter
    definition: 'A value that refines a request, most often a query parameter appended after the path (such as ?userId=1) to filter or configure what the API returns.'
  - term: client
    definition: 'The program that initiates an API call — it builds and sends the request and reads the response. Your curl command or your program is the client.'
  - term: server
    definition: 'The machine and code that receives requests and fulfills them, implementing the API behind the contract while keeping its database and internals private.'
  - term: REST
    definition: 'A widely used architectural style for web APIs, described by Roy Fielding in 2000, that maps operations onto HTTP methods and resource URLs (covered in depth on Day 23).'
  - term: documentation
    definition: 'The human-written guide to an API that lists each endpoint, the parameters it accepts, and example requests and responses — what you read to learn how to call a new API.'
  - term: JSON
    definition: 'JavaScript Object Notation, a simple text format of nested keys and values that is the near-universal way web APIs format their request and response bodies.'
  - term: rate limit
    definition: 'A cap a service places on how many requests a caller may make per period; exceeding it returns HTTP 429 so that no single caller can overwhelm the shared service.'
  - term: API key
    definition: 'A secret token a caller sends (usually in an Authorization header) to prove who they are; like a password, it must never be shared publicly or sent to an echo service.'
