<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" font-family="system-ui, sans-serif">
  <title>An API as the defined contract between two programs: the client sends a request across it, the server sends a response back</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">An API is the contract between two programs</text>

  <!-- Client box -->
  <rect x="40" y="120" width="200" height="160" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="140" y="158" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Your program</text>
  <text x="140" y="182" text-anchor="middle" font-size="15" fill="#1a202c">the CLIENT</text>
  <text x="140" y="222" text-anchor="middle" font-size="14" fill="#1a202c">wants something</text>
  <text x="140" y="242" text-anchor="middle" font-size="14" fill="#1a202c">done</text>

  <!-- Server box -->
  <rect x="520" y="120" width="200" height="160" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="620" y="158" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">The service</text>
  <text x="620" y="182" text-anchor="middle" font-size="15" fill="#1a202c">the SERVER</text>
  <text x="620" y="222" text-anchor="middle" font-size="14" fill="#1a202c">database, code, model</text>
  <text x="620" y="242" text-anchor="middle" font-size="14" fill="#1a202c">(all kept private)</text>

  <!-- API boundary line -->
  <line x1="380" y1="80" x2="380" y2="360" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="330" y="150" width="100" height="100" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="380" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">API</text>
  <text x="380" y="218" text-anchor="middle" font-size="14" fill="#1a202c">the contract</text>

  <!-- Request arrow (client -> server) -->
  <line x1="242" y1="170" x2="516" y2="170" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="524,170 510,163 510,177" fill="#1d4ed8"/>
  <text x="380" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">request in</text>

  <!-- Response arrow (server -> client) -->
  <line x1="518" y1="232" x2="244" y2="232" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="236,232 250,225 250,239" fill="#1d4ed8"/>
  <text x="380" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">response out</text>

  <!-- Caption -->
  <text x="380" y="392" text-anchor="middle" font-size="14" fill="#1a202c">The client depends only on the contract; everything behind it stays hidden.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 242 170 L 516 170" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 518 232 L 244 232" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
