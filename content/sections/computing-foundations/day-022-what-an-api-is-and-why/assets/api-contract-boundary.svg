<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The hiding is the point — it is what lets the other side change.">
  <title>What an API promises, and what it hides</title>
  <style>
    .api-contract-boundary-bg   { fill: #f8fafc; }
    .api-contract-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-contract-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-contract-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-contract-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-contract-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-contract-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-contract-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api-contract-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api-contract-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api-contract-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api-contract-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api-contract-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-contract-boundary-row { opacity: 1; }
    .api-contract-boundary-r0 { animation-delay: 0.00s; }
    .api-contract-boundary-r1 { animation-delay: 0.45s; }
    .api-contract-boundary-r2 { animation-delay: 0.90s; }
    .api-contract-boundary-r3 { animation-delay: 1.35s; }
    .api-contract-boundary-r4 { animation-delay: 1.80s; }
    .api-contract-boundary-row { animation: api-contract-boundary-reveal 7.3s ease-in-out infinite; }
    @keyframes api-contract-boundary-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="api-contract-boundary-bg" width="980" height="390"/>
  <text class="api-contract-boundary-h1"  x="30" y="40">What an API promises, and what it hides</text>
  <text class="api-contract-boundary-sub" x="30" y="64">The hiding is the point — it is what lets the other side change.</text>
  <rect class="api-contract-boundary-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="api-contract-boundary-name" x="46" y="122">The contract — you can rely on this</text>
  <text class="api-contract-boundary-desc" x="46" y="142">Change it and you break every caller</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r0" x="46" y="182">The endpoint address and method</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r1" x="46" y="216">The parameters it accepts</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r2" x="46" y="250">The shape of a successful response</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r3" x="46" y="284">The error codes and what they mean</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r4" x="46" y="318">The rate limits and how they are signalled</text>
  <rect class="api-contract-boundary-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="api-contract-boundary-name" x="526" y="122">Behind it — free to change</text>
  <text class="api-contract-boundary-desc" x="526" y="142">Change it and nobody notices</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r0" x="526" y="182">The programming language and framework</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r1" x="526" y="216">The hardware and the region it runs in</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r2" x="526" y="250">The model version and its weights</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r3" x="526" y="284">Caching, batching and autoscaling</text>
  <text class="api-contract-boundary-desc api-contract-boundary-row api-contract-boundary-r4" x="526" y="318">The database behind the whole thing</text>
  <text class="api-contract-boundary-sub" x="30" y="372">This is why a provider can swap the model under an endpoint without asking, and why the contract is the part that is versioned.</text>
</svg>
