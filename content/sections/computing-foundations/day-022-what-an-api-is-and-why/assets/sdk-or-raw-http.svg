<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="They are not alternatives; they are two levels of the same thing.">
  <title>Use the SDK, understand the HTTP</title>
  <style>
    .sdk-or-raw-http-bg   { fill: #f8fafc; }
    .sdk-or-raw-http-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sdk-or-raw-http-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sdk-or-raw-http-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sdk-or-raw-http-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sdk-or-raw-http-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sdk-or-raw-http-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sdk-or-raw-http-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sdk-or-raw-http-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sdk-or-raw-http-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sdk-or-raw-http-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sdk-or-raw-http-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sdk-or-raw-http-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sdk-or-raw-http-row { opacity: 1; }
    .sdk-or-raw-http-r0 { animation-delay: 0.00s; }
    .sdk-or-raw-http-r1 { animation-delay: 0.45s; }
    .sdk-or-raw-http-r2 { animation-delay: 0.90s; }
    .sdk-or-raw-http-r3 { animation-delay: 1.35s; }
    .sdk-or-raw-http-r4 { animation-delay: 1.80s; }
    .sdk-or-raw-http-row { animation: sdk-or-raw-http-reveal 7.3s ease-in-out infinite; }
    @keyframes sdk-or-raw-http-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sdk-or-raw-http-bg" width="980" height="390"/>
  <text class="sdk-or-raw-http-h1"  x="30" y="40">Use the SDK, understand the HTTP</text>
  <text class="sdk-or-raw-http-sub" x="30" y="64">They are not alternatives; they are two levels of the same thing.</text>
  <rect class="sdk-or-raw-http-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sdk-or-raw-http-name" x="46" y="122">The official SDK</text>
  <text class="sdk-or-raw-http-desc" x="46" y="142">What you should use by default.</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r0" x="46" y="182">Retries and backoff already correct</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r1" x="46" y="216">Pagination handled for you</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r2" x="46" y="250">Types, so mistakes fail early</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r3" x="46" y="284">Streaming already implemented</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r4" x="46" y="318">Updated when the API changes</text>
  <rect class="sdk-or-raw-http-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sdk-or-raw-http-name" x="526" y="122">Raw HTTP</text>
  <text class="sdk-or-raw-http-desc" x="526" y="142">What you need when the SDK misbehaves.</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r0" x="526" y="182">Shows exactly what is being sent</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r1" x="526" y="216">No hidden defaults or added headers</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r2" x="526" y="250">Works when no SDK exists for your language</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r3" x="526" y="284">How you file a reproducible bug report</text>
  <text class="sdk-or-raw-http-desc sdk-or-raw-http-row sdk-or-raw-http-r4" x="526" y="318">How you learn what the SDK is doing</text>
  <text class="sdk-or-raw-http-sub" x="30" y="372">The rule that serves best: build with the SDK, debug with curl. An SDK you cannot see through is one you cannot fix.</text>
</svg>
