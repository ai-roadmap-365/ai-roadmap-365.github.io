<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five minutes, in this order, every time.">
  <title>How to use an API you have never seen</title>
  <style>
    .reading-documentation-bg   { fill: #f8fafc; }
    .reading-documentation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-documentation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-documentation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-documentation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-documentation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reading-documentation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reading-documentation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reading-documentation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reading-documentation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reading-documentation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reading-documentation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reading-documentation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reading-documentation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reading-documentation-stage { opacity: 1; }

    .reading-documentation-s0 { animation-delay: 0.00s; }
    .reading-documentation-e0 { animation-delay: 0.00s; }
    .reading-documentation-s1 { animation-delay: 1.33s; }
    .reading-documentation-e1 { animation-delay: 1.33s; }
    .reading-documentation-s2 { animation-delay: 2.67s; }
    .reading-documentation-e2 { animation-delay: 2.67s; }
    .reading-documentation-s3 { animation-delay: 4.00s; }
    .reading-documentation-e3 { animation-delay: 4.00s; }
    .reading-documentation-s4 { animation-delay: 5.33s; }
    .reading-documentation-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .reading-documentation-conn  { animation: reading-documentation-trace 8s ease-in-out infinite; }
      .reading-documentation-stage { animation: reading-documentation-arrive 8s ease-in-out infinite; }
    }
    @keyframes reading-documentation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reading-documentation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reading-documentation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reading-documentation-stage { animation: reading-documentation-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reading-documentation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reading-documentation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reading-documentation-bg" width="980" height="322"/>
  <text class="reading-documentation-h1"  x="30" y="40">How to use an API you have never seen</text>
  <text class="reading-documentation-sub" x="30" y="64">Five minutes, in this order, every time.</text>
  <g class="reading-documentation-stage reading-documentation-s0">
    <rect class="reading-documentation-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="reading-documentation-step" x="44" y="142">01</text>
    <text class="reading-documentation-name" x="70" y="142">Find the endpoint</text>
    <text class="reading-documentation-desc" x="44" y="166">Which one returns the</text>
    <text class="reading-documentation-desc" x="44" y="182">thing you actually want?</text>
    <text class="reading-documentation-desc" x="44" y="198">Ignore the rest of the</text>
  </g>
  <line class="reading-documentation-line reading-documentation-conn reading-documentation-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#reading-documentation-tip)"/>
  <g class="reading-documentation-stage reading-documentation-s1">
    <rect class="reading-documentation-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="reading-documentation-step" x="233" y="142">02</text>
    <text class="reading-documentation-name" x="259" y="142">Note method and required parameters</text>
    <text class="reading-documentation-desc" x="233" y="166">What must be present for</text>
    <text class="reading-documentation-desc" x="233" y="182">it to work at all.</text>
  </g>
  <line class="reading-documentation-line reading-documentation-conn reading-documentation-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#reading-documentation-tip)"/>
  <g class="reading-documentation-stage reading-documentation-s2">
    <rect class="reading-documentation-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="reading-documentation-step" x="422" y="142">03</text>
    <text class="reading-documentation-name" x="448" y="142">Run their example verbatim</text>
    <text class="reading-documentation-desc" x="422" y="166">Change nothing. Confirm</text>
    <text class="reading-documentation-desc" x="422" y="182">it works before you make</text>
    <text class="reading-documentation-desc" x="422" y="198">it yours.</text>
    <text class="reading-documentation-edge" x="422" y="242">curl</text>
  </g>
  <line class="reading-documentation-line reading-documentation-conn reading-documentation-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#reading-documentation-tip)"/>
  <g class="reading-documentation-stage reading-documentation-s3">
    <rect class="reading-documentation-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="reading-documentation-step" x="611" y="142">04</text>
    <text class="reading-documentation-name" x="637" y="142">Compare against the documented response</text>
    <text class="reading-documentation-desc" x="611" y="166">Documentation drifts. The</text>
    <text class="reading-documentation-desc" x="611" y="182">response is the truth.</text>
  </g>
  <line class="reading-documentation-line reading-documentation-conn reading-documentation-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#reading-documentation-tip)"/>
  <g class="reading-documentation-stage reading-documentation-s4">
    <rect class="reading-documentation-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="reading-documentation-step" x="800" y="142">05</text>
    <text class="reading-documentation-name" x="826" y="142">Then write code</text>
    <text class="reading-documentation-desc" x="800" y="166">Now you have a working</text>
    <text class="reading-documentation-desc" x="800" y="182">reference to diff against</text>
    <text class="reading-documentation-desc" x="800" y="198">when it breaks.</text>
  </g>
  <text class="reading-documentation-sub" x="30" y="304">The temptation is to skip to step five. Every hour lost to a new API was lost by someone who did.</text>
</svg>
