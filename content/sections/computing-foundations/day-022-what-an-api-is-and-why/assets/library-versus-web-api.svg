<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both are contracts. Only one crosses a network.">
  <title>The word means two things</title>
  <style>
    .library-versus-web-api-bg   { fill: #f8fafc; }
    .library-versus-web-api-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-versus-web-api-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-versus-web-api-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-versus-web-api-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-versus-web-api-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-versus-web-api-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-versus-web-api-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-versus-web-api-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-versus-web-api-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-versus-web-api-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-versus-web-api-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-versus-web-api-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-versus-web-api-row { opacity: 1; }
    .library-versus-web-api-r0 { animation-delay: 0.00s; }
    .library-versus-web-api-r1 { animation-delay: 0.45s; }
    .library-versus-web-api-r2 { animation-delay: 0.90s; }
    .library-versus-web-api-r3 { animation-delay: 1.35s; }
    .library-versus-web-api-r4 { animation-delay: 1.80s; }
    .library-versus-web-api-row { animation: library-versus-web-api-reveal 7.3s ease-in-out infinite; }
    @keyframes library-versus-web-api-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-versus-web-api-bg" width="980" height="390"/>
  <text class="library-versus-web-api-h1"  x="30" y="40">The word means two things</text>
  <text class="library-versus-web-api-sub" x="30" y="64">Both are contracts. Only one crosses a network.</text>
  <rect class="library-versus-web-api-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-versus-web-api-name" x="46" y="122">Library API</text>
  <text class="library-versus-web-api-desc" x="46" y="142">A function you call in your own process.</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r0" x="46" y="182">Nanoseconds; no network at all</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r1" x="46" y="216">Fails by raising an exception</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r2" x="46" y="250">Version pinned by your lock file</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r3" x="46" y="284">No authentication needed</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r4" x="46" y="318">The original meaning of the word</text>
  <rect class="library-versus-web-api-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-versus-web-api-name" x="526" y="122">Web API</text>
  <text class="library-versus-web-api-desc" x="526" y="142">A service you call across a network.</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r0" x="526" y="182">Milliseconds to seconds, and variable</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r1" x="526" y="216">Fails by timeout, status code, or silence</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r2" x="526" y="250">Versioned by the provider, on their schedule</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r3" x="526" y="284">Credentials on every request</text>
  <text class="library-versus-web-api-desc library-versus-web-api-row library-versus-web-api-r4" x="526" y="318">What people usually mean today</text>
  <text class="library-versus-web-api-sub" x="30" y="372">Everything from Week 3 applies to the second and none of it to the first: latency, TLS, retries, rate limits. That difference is why a network call is never "just a function call".</text>
</svg>
