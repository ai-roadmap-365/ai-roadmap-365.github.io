questions:
  - question: 'What is the best short description of an API?'
    options:
      - 'A program you download and install to speed up your computer'
      - 'The physical server that stores a website''s data'
      - 'A contract for how one program asks another to do something'
      - 'A visual dashboard that humans click to use a service'
    answer_index: 2
    explanation: 'An API is an Application Programming Interface: an agreed contract describing the requests one program accepts and the responses it returns, while hiding how it is implemented. The server, the data, and a human dashboard are all different things.'

  - question: 'Which kind of API is reached over HTTP across the network and is the focus of this week?'
    options:
      - 'A library API'
      - 'An operating-system (system-call) API'
      - 'A hardware API'
      - 'A web API'
    answer_index: 3
    explanation: 'A web API is a service on another computer that you call over HTTP, using the same request/response conversation your browser uses. Library and operating-system APIs are local — called within one machine — rather than across the network.'

  - question: 'In a web API request, what is the endpoint?'
    options:
      - 'The specific URL the API answers at, one per resource'
      - 'The status code the server sends back'
      - 'The secret key that proves who is calling'
      - 'The JSON data returned in the response body'
    answer_index: 0
    explanation: 'An endpoint is a specific URL a web API answers at, such as /todos/1 or /users/1. The path names what you are asking about; the status code and body are parts of the response, not the endpoint.'

  - question: 'Which list correctly names parts of an HTTP API request?'
    options:
      - 'Status code, headers, and body'
      - 'Method, path, parameters, headers, and body'
      - 'Latitude, longitude, and timestamp'
      - 'Client, server, and network'
    answer_index: 1
    explanation: 'A request carries a method (the verb), a path/endpoint, query parameters that refine it, headers of metadata, and an optional body (payload). Status code, headers, and body describe the response, not the request.'

  - question: 'You run `curl https://jsonplaceholder.typicode.com/todos/1` and get back `{"userId":1,"id":1,"title":"delectus aut autem","completed":false}`. What did you just do?'
    options:
      - 'Installed the JSONPlaceholder service on your computer'
      - 'Sent a secret API key to authenticate yourself'
      - 'Made a GET request to an endpoint and received a JSON response body'
      - 'Changed the data stored on the server'
    answer_index: 2
    explanation: 'This is a complete API exchange: a GET request to the /todos/1 endpoint returns a 200 response whose JSON body has named fields. Nothing was installed, no key was sent, and GET only reads — it does not change server data.'

  - question: 'Why does API documentation exist and need to be read for each new API?'
    options:
      - 'Because all APIs are identical, so one manual covers them all'
      - 'Because APIs are illegal to use without reading a legal notice first'
      - 'Because documentation is the program that runs the API'
      - 'Because every API defines its own endpoints and formats'
    answer_index: 3
    explanation: 'Each API defines its own set of endpoints, the parameters they accept, and the shape of their responses, so you read the docs to find the right endpoint and copy a working example. Documentation is a guide, not the running service, and APIs are not interchangeable.'

  - question: 'A paid API returns HTTP 429 when your program calls it rapidly in a loop. What does that mean and why did it happen?'
    options:
      - 'You are rate-limited for calling too fast; slow down'
      - 'The server crashed; there is nothing you can do'
      - 'Your request body was malformed; fix the JSON'
      - 'The endpoint URL was misspelled; correct the path'
    answer_index: 0
    explanation: '429 Too Many Requests signals a rate limit — a cap on requests per period that shared services enforce so no caller overwhelms them. A tight loop trips it; the fixes are to slow down, batch, or fetch fewer times. A malformed body is 400 and a bad path is usually 404.'

  - question: 'What does it mean to describe an API "as a product" with public, partner, and internal audiences?'
    options:
      - 'The API is sold in physical stores'
      - 'The same interface can be public, partner, or internal'
      - 'Only public APIs are real APIs; partner and internal ones are fakes'
      - 'A product API cannot be reached over HTTP'
    answer_index: 1
    explanation: 'Organizations treat APIs as products with different audiences: public APIs are open to any developer, partner APIs are shared with specific companies under agreement, and internal APIs connect a company''s own systems. All are the same technical idea aimed at different callers.'
