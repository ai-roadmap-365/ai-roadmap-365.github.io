visuals:
  - id: api-contract
    file: assets/api-contract.svg
    type: diagram
    title: 'An API as the contract between two programs'
    alt: 'Diagram: two programs and the API contract between them, with a request going in and a response coming out'
    description: 'An architecture diagram showing the client program on the left and the server service on the right, with a dashed boundary line labelled API between them: a request arrow crosses from client to server and a response arrow crosses back, while the server''s database, code, and model stay hidden behind the contract.'
  - id: api-request-response
    file: assets/api-request-response.svg
    type: flowchart
    title: 'The request and response flow of a web API call'
    alt: 'Flowchart: a client sends a request to an endpoint, the server processes it and returns a response'
    description: 'A flow diagram tracing one web API call: the client builds a request (method, path, parameters, body) that travels to an endpoint URL and on to the server, which does the work and returns a response (status code, headers, JSON body) back to the client, with a worked GET /todos/1 example beneath.'
  - id: api-contract-boundary
    file: assets/api-contract-boundary.svg
    type: diagram
    title: 'What an API promises, and what it hides'
    alt: 'Diagram: what an API contract exposes compared with what it keeps private'
    description: 'A two-column comparison. The left column lists what a caller can rely on: endpoint, parameters, response shape, error codes. The right lists what the provider is free to change: language, hardware, model version, caching, scaling.'
  - id: library-versus-web-api
    file: assets/library-versus-web-api.svg
    type: diagram
    title: 'The word means two things'
    alt: 'Diagram: a library API compared with a web API'
    description: 'A two-column comparison of a library API called within one program against a web API called across a network, covering latency, failure modes, versioning and authentication.'
  - id: request-five-parts
    file: assets/request-five-parts.svg
    type: diagram
    title: 'Five parts, and you already know all of them'
    alt: 'Diagram: the five parts of an API request'
    description: 'A five-stage breakdown of an API request covering the method, the path, query parameters, headers and the body, with what each contributes.'
  - id: reading-documentation
    file: assets/reading-documentation.svg
    type: diagram
    title: 'How to use an API you have never seen'
    alt: 'Diagram: the method for learning a new API from its documentation'
    description: 'A five-stage procedure for approaching unfamiliar API documentation: finding the right endpoint, noting its method and required parameters, running the provided example, comparing the response, and only then writing code.'
  - id: n-plus-one-calls
    file: assets/n-plus-one-calls.svg
    type: diagram
    title: 'A loop of calls is a loop of round trips'
    alt: 'Diagram: individual API calls in a loop compared with one batched request'
    description: 'A two-column comparison of making one API call per item in a loop against a single batched or filtered request, covering round trips, total latency, rate-limit consumption and cost.'
  - id: api-versus-scraping
    file: assets/api-versus-scraping.svg
    type: diagram
    title: 'An API and a scraper are not equivalent'
    alt: 'Diagram: using a documented API compared with scraping a page'
    description: 'A two-column comparison of consuming a documented API against scraping a rendered page, covering stability, structure, permission and maintenance cost.'
  - id: model-api-shape
    file: assets/model-api-shape.svg
    type: diagram
    title: 'Every hosted model call, in four parts'
    alt: 'Diagram: the shape of a request to a hosted model API'
    description: 'A four-stage breakdown of a typical hosted model API call covering the endpoint, the authorization header, the JSON body naming model and prompt, and the response containing the generation and usage counts.'
  - id: contract-hides-implementation
    file: assets/contract-hides-implementation.svg
    type: diagram
    title: 'What the boundary buys both sides'
    alt: 'Diagram: what each side of an API boundary gains from it'
    description: 'A four-stage explanation of the value of an API boundary, covering the client''s dependence on shape alone, the provider''s freedom to change implementation, versioning as an explicit promise, and the ability to swap providers.'
  - id: sdk-or-raw-http
    file: assets/sdk-or-raw-http.svg
    type: diagram
    title: 'Use the SDK, understand the HTTP'
    alt: 'Diagram: an official client library compared with raw HTTP calls'
    description: 'A two-column comparison of using an official SDK against making raw HTTP requests, covering what each handles for you and when you need to drop down a level.'
