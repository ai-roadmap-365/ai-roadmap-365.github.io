visuals:
  - id: tls-handshake
    file: assets/tls-handshake.svg
    type: flowchart
    title: 'The TLS handshake'
    alt: 'Diagram: the TLS handshake from ClientHello to an encrypted session'
    description: 'A flow between browser and server: the ClientHello offering cipher suites, the ServerHello with the certificate and public key, the browser verifying the certificate and agreeing a shared key, the public-key key exchange, and finally the fast symmetric encrypted session.'
  - id: chain-of-trust
    file: assets/chain-of-trust.svg
    type: diagram
    title: 'The chain of trust'
    alt: 'Diagram: the chain of trust from root CA through intermediate to site certificate'
    description: 'A vertical architecture diagram showing a self-signed root CA certificate signing an intermediate CA certificate, which signs the site (leaf) certificate, with the browser validating each link upward against a root it already trusts.'
  - id: encryption-without-identity
    file: assets/encryption-without-identity.svg
    type: diagram
    title: 'Encryption alone protects the wrong person'
    alt: 'Diagram: encryption without authentication compared with both together'
    description: 'A two-column comparison of encryption used without authentication against encryption combined with identity verification, showing what an interception attack achieves in each case.'
  - id: two-cryptographies
    file: assets/two-cryptographies.svg
    type: diagram
    title: 'Slow maths for trust, fast maths for data'
    alt: 'Diagram: symmetric encryption compared with public-key cryptography'
    description: 'A two-column comparison of symmetric and public-key cryptography covering key distribution, speed, and the role each plays within a TLS connection.'
  - id: four-certificate-checks
    file: assets/four-certificate-checks.svg
    type: diagram
    title: 'Four checks, and the error tells you which failed'
    alt: 'Diagram: the four checks a certificate must pass'
    description: 'A four-stage validation sequence for a certificate covering signature verification against a trusted chain, validity dates, hostname matching, and revocation, with the characteristic error each produces.'
  - id: verify-false-cost
    file: assets/verify-false-cost.svg
    type: diagram
    title: 'What verify=False actually turns off'
    alt: 'Diagram: what is lost when certificate verification is disabled'
    description: 'A two-column comparison of a verified TLS connection against one with certificate verification disabled, listing what each guarantees and what an attacker on the path can do in each case.'
  - id: hsts-first-request
    file: assets/hsts-first-request.svg
    type: diagram
    title: 'The gap HSTS closes'
    alt: 'Diagram: how HSTS removes the unprotected first request'
    description: 'A four-stage sequence showing a plain HTTP first request being vulnerable to hijacking, the redirect to HTTPS, the Strict-Transport-Security header being remembered, and subsequent requests being upgraded before leaving the machine.'
  - id: certificate-transparency
    file: assets/certificate-transparency.svg
    type: diagram
    title: 'Who watches the certificate authorities'
    alt: 'Diagram: how certificate transparency logs expose unauthorised certificates'
    description: 'A four-stage sequence explaining certificate transparency: an authority issuing a certificate, the certificate being logged publicly, browsers requiring proof of logging, and domain owners monitoring for certificates they did not request.'
  - id: tls13-versus-tls12
    file: assets/tls13-versus-tls12.svg
    type: diagram
    title: 'What TLS 1.3 removed'
    alt: 'Diagram: TLS 1.2 compared with TLS 1.3'
    description: 'A two-column comparison of TLS 1.2 and TLS 1.3 covering handshake round trips, the range of negotiable options, forward secrecy, and how much of the handshake is encrypted.'
  - id: padlock-is-not-trust
    file: assets/padlock-is-not-trust.svg
    type: diagram
    title: 'What the padlock actually claims'
    alt: 'Diagram: what a valid certificate proves and what it does not'
    description: 'A two-column comparison of what a valid TLS certificate proves against what users commonly assume it proves, covering domain control, honesty, and the ease of obtaining a certificate.'
  - id: renewal-automation
    file: assets/renewal-automation.svg
    type: diagram
    title: 'The most preventable outage there is'
    alt: 'Diagram: automated certificate renewal compared with manual renewal'
    description: 'A four-stage sequence for automated certificate renewal covering the scheduled check, early renewal well before expiry, reloading the server, and alerting when renewal fails.'
