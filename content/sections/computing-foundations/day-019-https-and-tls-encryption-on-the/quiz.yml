questions:
  - question: 'What are the three protections that TLS provides to an HTTP connection?'
    options:
      - 'Compression, caching, and load balancing'
      - 'Confidentiality, integrity, and authentication'
      - 'Speed, redundancy, and anonymity'
      - 'Encryption, compression, and error correction'
    answer_index: 1
    explanation: 'TLS provides confidentiality (nobody in the middle can read the data), integrity (nobody can alter it undetected), and authentication (you can be confident the server is genuine). All three are needed together — encryption to an impostor is worthless.'

  - question: 'Why does TLS use public-key cryptography for the handshake but symmetric encryption for the rest of the connection?'
    options:
      - 'Public-key encryption is illegal for bulk data in most countries'
      - 'Symmetric encryption cannot protect data at all, so it is only used as a backup'
      - 'Public-key math safely establishes a shared secret between strangers but is slow, while symmetric encryption is fast for the bulk of the data'
      - 'Symmetric encryption is more secure than public-key encryption for the handshake'
    answer_index: 2
    explanation: 'Public-key cryptography solves the problem of two strangers agreeing on a secret over a watched wire, but it is slow. So TLS uses it briefly to bootstrap a shared symmetric key, then switches to fast symmetric encryption for the actual traffic — the best of both.'

  - question: 'What does a Certificate Authority (CA) actually vouch for when it issues a certificate?'
    options:
      - 'That the website is honest and safe to give your data to'
      - 'That the certificate holder controls the domain named in the certificate'
      - 'That the website will never be hacked'
      - 'That the website loads quickly and is well designed'
    answer_index: 1
    explanation: 'A CA verifies that whoever requested the certificate controls the domain, then signs a certificate binding that domain to a public key. It certifies identity (control of the domain), not the honesty, safety, or quality of the site.'

  - question: 'A browser receives a site (leaf) certificate. How does it decide whether to trust it?'
    options:
      - 'It contacts the website owner by email to confirm'
      - 'It trusts any certificate that is not expired, regardless of who signed it'
      - 'It verifies the leaf against the intermediate, the intermediate against the root, and the root against its built-in trust store'
      - 'It asks the user to approve every certificate manually'
    answer_index: 2
    explanation: 'The browser follows the chain of trust upward: each certificate must be validly signed by the one above it, ending at a root CA whose public key is already in the browser or OS trust store. If any link fails, the connection is rejected.'

  - question: 'Which statement about the padlock icon in the address bar is correct?'
    options:
      - 'It guarantees the website is trustworthy and safe to share data with'
      - 'It means the connection is encrypted and the domain identity was verified, but says nothing about the site''s honesty'
      - 'It means the website cannot be hacked'
      - 'It appears only on websites owned by large companies'
    answer_index: 1
    explanation: 'The padlock confirms the connection is encrypted and the certificate for that domain checked out. It says nothing about whether the site is honest or handles your data well — even a scam site can obtain a valid certificate for its own domain.'

  - question: 'What is the purpose of HSTS (HTTP Strict Transport Security)?'
    options:
      - 'It compresses HTTPS traffic to make pages load faster'
      - 'It tells the browser to only ever contact a site over HTTPS, closing the gap of an initial plaintext request'
      - 'It replaces certificates with passwords'
      - 'It lets a site work without any certificate'
    answer_index: 1
    explanation: 'HSTS is a header a site sends telling the browser to use only HTTPS for that site in future and not to allow clicking through certificate warnings, which prevents an attacker from hijacking an initial unprotected HTTP request.'

  - question: 'What is the relationship between SSL and TLS?'
    options:
      - 'They are competing protocols made by different companies today'
      - 'SSL is the modern, secure version and TLS is obsolete'
      - 'TLS is the modern standard; SSL is its obsolete, insecure predecessor, though people still loosely say "SSL"'
      - 'They are completely unrelated technologies'
    answer_index: 2
    explanation: 'TLS is the standardized successor to Netscape''s SSL. The actual SSL versions are obsolete and insecure, but the name persists in casual usage; when people say "SSL certificate" they almost always mean TLS.'

  - question: 'A service that worked yesterday now shows a certificate error to every visitor, though the code did not change. What is the most likely cause?'
    options:
      - 'The website''s content was rewritten'
      - 'The certificate reached its expiry date and was not renewed'
      - 'The visitors all changed browsers at once'
      - 'HTTP was upgraded to HTTPS overnight'
    answer_index: 1
    explanation: 'Certificates are valid only within a not-before / not-after window. A very common outage is a certificate quietly expiring because renewal was not automated, which makes every browser reject the connection until it is renewed.'
