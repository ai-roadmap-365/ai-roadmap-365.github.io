<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Two round trips before a single byte of your request is sent.">
  <title>Proving identity, then agreeing a secret</title>
  <style>
    .tls-handshake-steps-bg   { fill: #f8fafc; }
    .tls-handshake-steps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tls-handshake-steps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tls-handshake-steps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tls-handshake-steps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tls-handshake-steps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tls-handshake-steps-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .tls-handshake-steps-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .tls-handshake-steps-tok { animation: tls-handshake-steps-travel 7s ease-in-out infinite; }
    }
    @keyframes tls-handshake-steps-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--tls-handshake-steps-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tls-handshake-steps-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="tls-handshake-steps-bg" width="980" height="334"/>
  <text class="tls-handshake-steps-h1"  x="30" y="40">Proving identity, then agreeing a secret</text>
  <text class="tls-handshake-steps-sub" x="30" y="64">Two round trips before a single byte of your request is sent.</text>
  <rect class="tls-handshake-steps-box" x="30" y="132" width="166" height="96" rx="9"/>
  <text class="tls-handshake-steps-name" x="44" y="160">ClientHello</text>
  <text class="tls-handshake-steps-desc" x="44" y="182">Versions and cipher</text>
  <text class="tls-handshake-steps-desc" x="44" y="198">suites the browser</text>
  <text class="tls-handshake-steps-desc" x="44" y="214">supports.</text>
  <text class="tls-handshake-steps-edge" x="44" y="248">trip 1</text>
  <line class="tls-handshake-steps-line" x1="199" y1="180" x2="215" y2="180"/>
  <rect class="tls-handshake-steps-box" x="218" y="132" width="166" height="96" rx="9"/>
  <text class="tls-handshake-steps-name" x="232" y="160">Certificate</text>
  <text class="tls-handshake-steps-desc" x="232" y="182">The server presents proof</text>
  <text class="tls-handshake-steps-desc" x="232" y="198">it owns this name.</text>
  <text class="tls-handshake-steps-edge" x="232" y="248">trip 1</text>
  <line class="tls-handshake-steps-line" x1="387" y1="180" x2="403" y2="180"/>
  <rect class="tls-handshake-steps-hi" x="406" y="132" width="166" height="96" rx="9"/>
  <text class="tls-handshake-steps-name" x="420" y="160">Verify chain</text>
  <text class="tls-handshake-steps-desc" x="420" y="182">Leaf to intermediate to</text>
  <text class="tls-handshake-steps-desc" x="420" y="198">root, ending in your</text>
  <text class="tls-handshake-steps-desc" x="420" y="214">trust store.</text>
  <text class="tls-handshake-steps-edge" x="420" y="248">local</text>
  <line class="tls-handshake-steps-line" x1="575" y1="180" x2="591" y2="180"/>
  <rect class="tls-handshake-steps-box" x="594" y="132" width="166" height="96" rx="9"/>
  <text class="tls-handshake-steps-name" x="608" y="160">Agree keys</text>
  <text class="tls-handshake-steps-desc" x="608" y="182">Public-key maths</text>
  <text class="tls-handshake-steps-desc" x="608" y="198">establishes a shared</text>
  <text class="tls-handshake-steps-desc" x="608" y="214">secret between strangers.</text>
  <text class="tls-handshake-steps-edge" x="608" y="248">trip 2</text>
  <line class="tls-handshake-steps-line" x1="763" y1="180" x2="779" y2="180"/>
  <rect class="tls-handshake-steps-box" x="782" y="132" width="166" height="96" rx="9"/>
  <text class="tls-handshake-steps-name" x="796" y="160">Encrypted</text>
  <text class="tls-handshake-steps-desc" x="796" y="182">Fast symmetric encryption</text>
  <text class="tls-handshake-steps-desc" x="796" y="198">carries everything from</text>
  <text class="tls-handshake-steps-desc" x="796" y="214">here.</text>
  <text class="tls-handshake-steps-edge" x="796" y="248">the bulk</text>
  <rect class="tls-handshake-steps-tok" x="34" y="106" width="58" height="14" rx="3" style="--tls-handshake-steps-run: 752px"/>
  <text class="tls-handshake-steps-sub" x="30" y="314">The padlock proves the connection is encrypted and the name was verified. It says nothing about whether the site is honest.</text>
</svg>
