<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two round trips before a single byte of your request is sent.">
  <title>Proving identity, then agreeing a secret</title>
  <style>
    .tls-handshake-steps-bg   { fill: #f8fafc; }
    .tls-handshake-steps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls-handshake-steps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tls-handshake-steps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tls-handshake-steps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tls-handshake-steps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tls-handshake-steps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tls-handshake-steps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tls-handshake-steps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tls-handshake-steps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tls-handshake-steps-stage { opacity: 1; }

    .tls-handshake-steps-s0 { animation-delay: 0.00s; }
    .tls-handshake-steps-e0 { animation-delay: 0.00s; }
    .tls-handshake-steps-s1 { animation-delay: 1.33s; }
    .tls-handshake-steps-e1 { animation-delay: 1.33s; }
    .tls-handshake-steps-s2 { animation-delay: 2.67s; }
    .tls-handshake-steps-e2 { animation-delay: 2.67s; }
    .tls-handshake-steps-s3 { animation-delay: 4.00s; }
    .tls-handshake-steps-e3 { animation-delay: 4.00s; }
    .tls-handshake-steps-s4 { animation-delay: 5.33s; }
    .tls-handshake-steps-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .tls-handshake-steps-conn  { animation: tls-handshake-steps-trace 8s ease-in-out infinite; }
      .tls-handshake-steps-stage { animation: tls-handshake-steps-arrive 8s ease-in-out infinite; }
    }
    @keyframes tls-handshake-steps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tls-handshake-steps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tls-handshake-steps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tls-handshake-steps-stage { animation: tls-handshake-steps-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tls-handshake-steps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tls-handshake-steps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tls-handshake-steps-bg" width="980" height="322"/>
  <text class="tls-handshake-steps-h1"  x="30" y="40">Proving identity, then agreeing a secret</text>
  <text class="tls-handshake-steps-sub" x="30" y="64">Two round trips before a single byte of your request is sent.</text>
  <g class="tls-handshake-steps-stage tls-handshake-steps-s0">
    <rect class="tls-handshake-steps-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="tls-handshake-steps-step" x="44" y="142">01</text>
    <text class="tls-handshake-steps-name" x="70" y="142">ClientHello</text>
    <text class="tls-handshake-steps-desc" x="44" y="166">Versions and cipher</text>
    <text class="tls-handshake-steps-desc" x="44" y="182">suites the browser</text>
    <text class="tls-handshake-steps-desc" x="44" y="198">supports.</text>
    <text class="tls-handshake-steps-edge" x="44" y="242">trip 1</text>
  </g>
  <line class="tls-handshake-steps-line tls-handshake-steps-conn tls-handshake-steps-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#tls-handshake-steps-tip)"/>
  <g class="tls-handshake-steps-stage tls-handshake-steps-s1">
    <rect class="tls-handshake-steps-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="tls-handshake-steps-step" x="233" y="142">02</text>
    <text class="tls-handshake-steps-name" x="259" y="142">Certificate</text>
    <text class="tls-handshake-steps-desc" x="233" y="166">The server presents proof</text>
    <text class="tls-handshake-steps-desc" x="233" y="182">it owns this name.</text>
    <text class="tls-handshake-steps-edge" x="233" y="242">trip 1</text>
  </g>
  <line class="tls-handshake-steps-line tls-handshake-steps-conn tls-handshake-steps-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#tls-handshake-steps-tip)"/>
  <g class="tls-handshake-steps-stage tls-handshake-steps-s2">
    <rect class="tls-handshake-steps-hi" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="tls-handshake-steps-step" x="422" y="142">03</text>
    <text class="tls-handshake-steps-name" x="448" y="142">Verify chain</text>
    <text class="tls-handshake-steps-desc" x="422" y="166">Leaf to intermediate to</text>
    <text class="tls-handshake-steps-desc" x="422" y="182">root, ending in your</text>
    <text class="tls-handshake-steps-desc" x="422" y="198">trust store.</text>
    <text class="tls-handshake-steps-edge" x="422" y="242">local</text>
  </g>
  <line class="tls-handshake-steps-line tls-handshake-steps-conn tls-handshake-steps-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#tls-handshake-steps-tip)"/>
  <g class="tls-handshake-steps-stage tls-handshake-steps-s3">
    <rect class="tls-handshake-steps-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="tls-handshake-steps-step" x="611" y="142">04</text>
    <text class="tls-handshake-steps-name" x="637" y="142">Agree keys</text>
    <text class="tls-handshake-steps-desc" x="611" y="166">Public-key maths</text>
    <text class="tls-handshake-steps-desc" x="611" y="182">establishes a shared</text>
    <text class="tls-handshake-steps-desc" x="611" y="198">secret between strangers.</text>
    <text class="tls-handshake-steps-edge" x="611" y="242">trip 2</text>
  </g>
  <line class="tls-handshake-steps-line tls-handshake-steps-conn tls-handshake-steps-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#tls-handshake-steps-tip)"/>
  <g class="tls-handshake-steps-stage tls-handshake-steps-s4">
    <rect class="tls-handshake-steps-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="tls-handshake-steps-step" x="800" y="142">05</text>
    <text class="tls-handshake-steps-name" x="826" y="142">Encrypted</text>
    <text class="tls-handshake-steps-desc" x="800" y="166">Fast symmetric encryption</text>
    <text class="tls-handshake-steps-desc" x="800" y="182">carries everything from</text>
    <text class="tls-handshake-steps-desc" x="800" y="198">here.</text>
    <text class="tls-handshake-steps-edge" x="800" y="242">the bulk</text>
  </g>
  <text class="tls-handshake-steps-sub" x="30" y="304">The padlock proves the connection is encrypted and the name was verified. It says nothing about whether the site is honest.</text>
</svg>
