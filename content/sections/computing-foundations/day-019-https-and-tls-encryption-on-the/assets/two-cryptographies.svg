<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each solves the half of the problem the other cannot.">
  <title>Slow maths for trust, fast maths for data</title>
  <style>
    .two-cryptographies-bg   { fill: #f8fafc; }
    .two-cryptographies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-cryptographies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-cryptographies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-cryptographies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-cryptographies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-cryptographies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-cryptographies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-cryptographies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-cryptographies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-cryptographies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-cryptographies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-cryptographies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-cryptographies-row { opacity: 1; }
    .two-cryptographies-r0 { animation-delay: 0.00s; }
    .two-cryptographies-r1 { animation-delay: 0.45s; }
    .two-cryptographies-r2 { animation-delay: 0.90s; }
    .two-cryptographies-r3 { animation-delay: 1.35s; }
    .two-cryptographies-r4 { animation-delay: 1.80s; }
    .two-cryptographies-row { animation: two-cryptographies-reveal 7.3s ease-in-out infinite; }
    @keyframes two-cryptographies-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="two-cryptographies-bg" width="980" height="390"/>
  <text class="two-cryptographies-h1"  x="30" y="40">Slow maths for trust, fast maths for data</text>
  <text class="two-cryptographies-sub" x="30" y="64">Each solves the half of the problem the other cannot.</text>
  <rect class="two-cryptographies-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="two-cryptographies-name" x="46" y="122">Symmetric</text>
  <text class="two-cryptographies-desc" x="46" y="142">One key locks and unlocks.</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r0" x="46" y="182">Fast enough for gigabytes</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r1" x="46" y="216">AES, in modern TLS</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r2" x="46" y="250">Carries all the actual data</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r3" x="46" y="284">Problem: both sides need the same secret</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r4" x="46" y="318">Sending it over a watched wire defeats it</text>
  <rect class="two-cryptographies-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="two-cryptographies-name" x="526" y="122">Public-key</text>
  <text class="two-cryptographies-desc" x="526" y="142">A pair: one published, one kept.</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r0" x="526" y="182">Far slower — used only for setup</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r1" x="526" y="216">What the public key locks, only the private key opens</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r2" x="526" y="250">A signature proves who holds the private key</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r3" x="526" y="284">Solves distribution between strangers</text>
  <text class="two-cryptographies-desc two-cryptographies-row two-cryptographies-r4" x="526" y="318">Used once per connection, then set aside</text>
  <text class="two-cryptographies-sub" x="30" y="372">The engineering idea at the centre of TLS is the handover: public-key cryptography establishes a shared secret, and symmetric encryption does everything after.</text>
</svg>
