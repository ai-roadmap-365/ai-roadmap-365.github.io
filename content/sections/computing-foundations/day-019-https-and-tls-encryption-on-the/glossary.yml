terms:
  - term: HTTPS
    definition: 'HTTP carried inside a TLS-encrypted connection (conventionally on port 443), giving web traffic confidentiality, integrity, and server authentication.'
  - term: TLS
    definition: 'Transport Layer Security, the protocol that wraps a network connection in encryption and authentication; the modern successor to SSL.'
  - term: encryption
    definition: 'Scrambling data with a key so that only someone with the right key can turn it back into readable form.'
  - term: symmetric key
    definition: 'A single shared secret key used to both encrypt and decrypt messages; fast, but both sides must already share the same key.'
  - term: public-key cryptography
    definition: 'Encryption using a matched public/private key pair so two strangers can establish a secret without pre-sharing one; also called asymmetric encryption, and slower than symmetric.'
  - term: certificate
    definition: 'A signed digital document that binds a domain name to a public key and carries an expiry date, presented by a server to prove its identity.'
  - term: Certificate Authority
    definition: 'A trusted organization (CA) that verifies control of a domain and signs certificates for it; browsers ship with a list of trusted CA roots.'
  - term: chain of trust
    definition: 'The sequence of signatures from a site certificate up through one or more intermediate CAs to a root the browser already trusts; if any link fails, the certificate is rejected.'
  - term: handshake
    definition: 'The opening exchange of a TLS connection that authenticates the server and agrees a shared symmetric key, after which data is encrypted symmetrically.'
  - term: HSTS
    definition: 'HTTP Strict Transport Security, a header telling a browser to contact a site only over HTTPS and never allow clicking through its certificate warnings.'
  - term: cipher
    definition: 'An algorithm used to encrypt and decrypt data; TLS negotiates a cipher suite (a bundle of algorithms for key agreement, bulk encryption, and integrity) during the handshake.'
  - term: man-in-the-middle attack
    definition: 'An attack in which someone secretly sits between you and a server, reading or altering traffic while both sides believe the line is private; authentication in TLS is designed to prevent it.'
  - term: root CA
    definition: 'A self-signed Certificate Authority certificate that anchors the chain of trust; its public key is preloaded in the browser or operating system trust store and kept offline for safety.'
