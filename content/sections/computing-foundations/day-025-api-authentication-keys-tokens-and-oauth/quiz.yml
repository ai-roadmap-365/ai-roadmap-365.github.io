questions:
  - question: 'What is the difference between authentication and authorization?'
    options:
      - 'Authentication encrypts the request; authorization decrypts it'
      - 'Authentication proves who you are; authorization decides what you are allowed to do'
      - 'They are two words for the same identity check'
      - 'Authentication is for users; authorization is only for machines'
    answer_index: 1
    explanation: 'Authentication answers "who are you" and fails with 401; authorization answers "may you do this" and fails with 403. They are separate steps, and confusing them leads to fixing the wrong problem.'

  - question: 'Which HTTP status code means the server does not recognize your credential (authentication failed)?'
    options:
      - '403 Forbidden'
      - '404 Not Found'
      - '401 Unauthorized'
      - '429 Too Many Requests'
    answer_index: 2
    explanation: '401 Unauthorized signals a missing or invalid credential — an authentication failure. 403 Forbidden means you are authenticated but lack permission (an authorization failure), which is a different fix.'

  - question: 'How is a bearer token sent in an HTTP request?'
    options:
      - 'In the URL as ?token=...'
      - 'In the Authorization header as "Authorization: Bearer <token>"'
      - 'As a base64-encoded username and password'
      - 'In a cookie the browser sets automatically'
    answer_index: 1
    explanation: 'A bearer token rides in the standard Authorization header with the scheme name Bearer. This is the format the great majority of modern APIs, including hosted model APIs, expect.'

  - question: 'Why is Basic auth unsafe over plain HTTP?'
    options:
      - 'Base64 encoding is reversible with no key, so anyone on the network can read the password'
      - 'Basic auth sends the password as an image that can be screenshotted'
      - 'The server refuses Basic auth unless a key is also supplied'
      - 'Basic auth works only with usernames longer than 16 characters'
    answer_index: 0
    explanation: 'Basic auth base64-encodes user:pass, and base64 is encoding, not encryption — dXNlcjpwYXNz decodes straight back to user:pass. Only the TLS in HTTPS actually protects it in transit.'

  - question: 'Why is putting an API key in a URL query string worse than putting it in a header?'
    options:
      - 'Query strings can only hold 8 characters'
      - 'Headers are automatically encrypted while query strings are not'
      - 'URLs are written to server logs, browser history, and caches, so the key leaks into places you do not control'
      - 'A key in a header is ignored by most servers'
    answer_index: 2
    explanation: 'A query string is part of the URL, and URLs get logged, cached, and stored in history. A header is far less likely to be recorded by accident, so the same secret is safer in a header.'

  - question: 'In the OAuth 2.0 authorization-code flow, where does the user type their password?'
    options:
      - 'Into the third-party app, which forwards it to the provider'
      - 'Into the provider''s own authorization server page — the app never sees it'
      - 'Into the API request as a Basic auth header'
      - 'Nowhere; OAuth does not use passwords at all'
    answer_index: 1
    explanation: 'The whole point of OAuth is delegation without disclosure: the user logs in on the provider''s own consent page, and the app receives a scoped access token instead of ever seeing the password.'

  - question: 'What is the difference between an access token and a refresh token?'
    options:
      - 'An access token is public; a refresh token is secret'
      - 'They are identical but issued by different servers'
      - 'An access token is short-lived and used on every API call; a refresh token is longer-lived and used only to obtain new access tokens'
      - 'An access token is for reading and a refresh token is for writing'
    answer_index: 2
    explanation: 'Access tokens are deliberately short-lived so a leaked one expires quickly; a refresh token lives longer and is used only to mint new access tokens without making the user log in again, which is why it is guarded most carefully.'

  - question: 'You discover an API key was pushed to a public repository ten minutes ago. What is the right first response?'
    options:
      - 'Delete the commit, since that removes the key from history'
      - 'Do nothing until the monthly bill arrives to confirm misuse'
      - 'Revoke the key at the provider immediately and issue a new one'
      - 'Rename the variable so bots cannot find it'
    answer_index: 2
    explanation: 'The instant a key touches a public place, treat it as burned: revoke it at the provider and issue a replacement. Deleting the commit does not help — automated scanners find keys within minutes, and the key may already be copied elsewhere.'
