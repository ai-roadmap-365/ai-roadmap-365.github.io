visuals:
  - id: auth-schemes
    file: assets/auth-schemes.svg
    type: diagram
    title: 'API authentication schemes'
    alt: 'Diagram: a request carrying different credential types to a server that checks them'
    description: 'One HTTP request shown carrying any of three credential envelopes — an API key in a custom header, a bearer token in the Authorization header, or a base64-encoded user:pass for Basic auth — to a server whose doorkeeper checks the credential and answers 200 OK when valid or 401 Unauthorized when missing or wrong.'
  - id: oauth-flow
    file: assets/oauth-flow.svg
    type: flowchart
    title: 'The OAuth 2.0 authorization-code flow'
    alt: 'Flowchart: the OAuth authorization-code flow — user to app to auth server to consent to token to API'
    description: 'The five-step authorization-code flow: the app redirects the user to the authorization server, the user logs in and consents, the auth server returns a one-time authorization code, the app exchanges the code for an access token, and the app then calls the API with that token as a bearer credential.'
  - id: where-the-key-goes
    file: assets/where-the-key-goes.svg
    type: diagram
    title: 'Two places to put a credential, one of them wrong'
    alt: 'Diagram: sending a key in a header compared with putting it in the URL'
    description: 'A two-column comparison of sending an API key in the Authorization header versus in a query string, listing everywhere a URL is recorded.'
  - id: authn-versus-authz
    file: assets/authn-versus-authz.svg
    type: diagram
    title: '401 and 403 answer different questions'
    alt: 'Diagram: authentication compared with authorization'
    description: 'A two-column comparison of authentication and authorization, pairing each with its HTTP status code and the action that resolves it.'
  - id: scheme-comparison
    file: assets/scheme-comparison.svg
    type: diagram
    title: 'Three schemes, one question each'
    alt: 'Diagram: API keys, bearer tokens and Basic auth compared'
    description: 'A three-stage comparison of API key, bearer token and Basic authentication, describing what each secret represents and where in the request it travels.'
  - id: base64-not-encryption
    file: assets/base64-not-encryption.svg
    type: diagram
    title: 'Encoding and encryption are not the same word'
    alt: 'Diagram: base64 encoding compared with encryption'
    description: 'A two-column comparison of base64 encoding and encryption, covering reversibility, whether a key is involved, and what each is actually for.'
  - id: leaked-key-response
    file: assets/leaked-key-response.svg
    type: diagram
    title: 'What to do the moment a key is exposed'
    alt: 'Diagram: the response procedure when a credential is exposed'
    description: 'A four-stage incident procedure for an exposed credential covering immediate revocation, issuing a replacement, checking usage for unauthorised activity, and understanding why deleting the commit is insufficient.'
  - id: key-hygiene
    file: assets/key-hygiene.svg
    type: diagram
    title: 'Four habits that make a leak survivable'
    alt: 'Diagram: unsafe and safe credential handling habits'
    description: 'A two-column comparison of careless and disciplined credential handling, covering hard-coding, scope, sharing and rotation.'
  - id: oauth-token-lifetimes
    file: assets/oauth-token-lifetimes.svg
    type: diagram
    title: 'Why there are two tokens'
    alt: 'Diagram: access tokens compared with refresh tokens'
    description: 'A two-column comparison of access tokens and refresh tokens covering lifetime, frequency of use, what each can do, and the consequence if each leaks.'
  - id: password-to-delegation
    file: assets/password-to-delegation.svg
    type: diagram
    title: 'Why OAuth had to be invented'
    alt: 'Diagram: the progression from shared passwords to delegated authorization'
    description: 'A four-stage progression from using the account password directly, through per-account API keys, to OAuth delegation with scopes and revocation.'
  - id: env-not-source
    file: assets/env-not-source.svg
    type: diagram
    title: 'Where a credential should live'
    alt: 'Diagram: how a secret reaches a program without entering the repository'
    description: 'A four-stage sequence showing a secret stored in a gitignored env file, loaded into the environment, read by the program at runtime, and an example file with empty values committed for collaborators.'
  - id: credential-checklist
    file: assets/credential-checklist.svg
    type: diagram
    title: 'Before a key leaves your machine'
    alt: 'Diagram: the checks to make before using a new API credential'
    description: 'A four-stage checklist for a newly issued API credential covering scope, spend limits, storage location and pre-commit scanning.'
