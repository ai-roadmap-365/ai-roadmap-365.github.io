terms:
  - term: authentication
    definition: 'The process by which a server verifies who is making a request, usually by checking a secret credential the caller presents; failing it returns HTTP 401.'
  - term: authorization
    definition: 'The process of deciding what an already-identified caller is permitted to do; failing it returns HTTP 403, distinct from an authentication failure.'
  - term: API key
    definition: 'A long random string an API issues to your account, attached to each request (usually in a header) to identify and authenticate the caller.'
  - term: bearer token
    definition: 'A credential sent in the standard Authorization header as "Bearer <token>"; possession alone grants access, so it must be guarded like cash.'
  - term: Basic auth
    definition: 'An HTTP authentication scheme that sends a username and password joined by a colon and base64-encoded in the Authorization header; safe only over TLS.'
  - term: OAuth
    definition: 'An open standard (OAuth 2.0, RFC 6749) that lets an application act on a user''s behalf at another service using a scoped, revocable token, without ever seeing the user''s password.'
  - term: access token
    definition: 'A short-lived credential, obtained through OAuth, that an app sends as a bearer token on each API call; it expires quickly to limit the damage from a leak.'
  - term: refresh token
    definition: 'A longer-lived OAuth credential used only to obtain new access tokens when they expire, so the user need not log in again; the more sensitive of the two tokens.'
  - term: scope
    definition: 'A named permission an OAuth token is limited to (such as read photos but not delete them), shown on the consent screen so the user can approve or refuse it.'
  - term: secret
    definition: 'Any credential — API key, token, or password — that grants access and must be kept out of code and version control; equivalent to a password in the harm a leak causes.'
  - term: least privilege
    definition: 'The practice of giving a credential the narrowest access that still does the job (read-only, one project, limited spend) so that a leak has the smallest possible blast radius.'
  - term: base64
    definition: 'A reversible text encoding with no key, used to package binary or colon-separated data for transport; it hides nothing on its own, which is why Basic auth needs TLS.'
