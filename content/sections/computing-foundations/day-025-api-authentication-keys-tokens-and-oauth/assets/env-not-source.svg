<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four files, and only one of them is committed.">
  <title>Where a credential should live</title>
  <style>
    .env-not-source-bg   { fill: #f8fafc; }
    .env-not-source-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-not-source-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-not-source-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-not-source-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-not-source-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-not-source-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .env-not-source-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .env-not-source-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .env-not-source-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .env-not-source-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .env-not-source-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .env-not-source-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .env-not-source-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .env-not-source-stage { opacity: 1; }

    .env-not-source-s0 { animation-delay: 0.00s; }
    .env-not-source-e0 { animation-delay: 0.00s; }
    .env-not-source-s1 { animation-delay: 1.28s; }
    .env-not-source-e1 { animation-delay: 1.28s; }
    .env-not-source-s2 { animation-delay: 2.56s; }
    .env-not-source-e2 { animation-delay: 2.56s; }
    .env-not-source-s3 { animation-delay: 3.84s; }
    .env-not-source-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .env-not-source-conn  { animation: env-not-source-trace 6.4s ease-in-out infinite; }
      .env-not-source-stage { animation: env-not-source-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes env-not-source-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes env-not-source-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .env-not-source-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .env-not-source-stage { animation: env-not-source-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes env-not-source-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="env-not-source-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="env-not-source-bg" width="980" height="322"/>
  <text class="env-not-source-h1"  x="30" y="40">Where a credential should live</text>
  <text class="env-not-source-sub" x="30" y="64">Four files, and only one of them is committed.</text>
  <g class="env-not-source-stage env-not-source-s0">
    <rect class="env-not-source-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="env-not-source-step" x="44" y="142">01</text>
    <text class="env-not-source-name" x="70" y="142">.env holds the real value</text>
    <text class="env-not-source-desc" x="44" y="166">Never committed. This is the</text>
    <text class="env-not-source-desc" x="44" y="182">only place the secret text</text>
    <text class="env-not-source-desc" x="44" y="198">exists.</text>
    <text class="env-not-source-edge" x="44" y="242">real</text>
  </g>
  <line class="env-not-source-line env-not-source-conn env-not-source-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#env-not-source-tip)"/>
  <g class="env-not-source-stage env-not-source-s1">
    <rect class="env-not-source-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="env-not-source-step" x="280" y="142">02</text>
    <text class="env-not-source-name" x="306" y="142">.gitignore lists it</text>
    <text class="env-not-source-desc" x="280" y="166">Added BEFORE the first commit.</text>
    <text class="env-not-source-desc" x="280" y="182">Git does not forget what it once</text>
    <text class="env-not-source-desc" x="280" y="198">tracked.</text>
    <text class="env-not-source-edge" x="280" y="242">ignored</text>
  </g>
  <line class="env-not-source-line env-not-source-conn env-not-source-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#env-not-source-tip)"/>
  <g class="env-not-source-stage env-not-source-s2">
    <rect class="env-not-source-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="env-not-source-step" x="516" y="142">03</text>
    <text class="env-not-source-name" x="542" y="142">The program reads the environment</text>
    <text class="env-not-source-desc" x="516" y="166">os.environ, or $VAR. The literal</text>
    <text class="env-not-source-desc" x="516" y="182">string never appears in source.</text>
    <text class="env-not-source-edge" x="516" y="242">runtime</text>
  </g>
  <line class="env-not-source-line env-not-source-conn env-not-source-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#env-not-source-tip)"/>
  <g class="env-not-source-stage env-not-source-s3">
    <rect class="env-not-source-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="env-not-source-step" x="752" y="142">04</text>
    <text class="env-not-source-name" x="778" y="142">.env.example is committed</text>
    <text class="env-not-source-desc" x="752" y="166">The variable NAMES with empty</text>
    <text class="env-not-source-desc" x="752" y="182">values, so collaborators know</text>
    <text class="env-not-source-desc" x="752" y="198">what to set.</text>
    <text class="env-not-source-edge" x="752" y="242">shared</text>
  </g>
  <text class="env-not-source-sub" x="30" y="304">That last file is what makes the discipline survivable for a team: without it, every new person has to guess which variables exist.</text>
</svg>
