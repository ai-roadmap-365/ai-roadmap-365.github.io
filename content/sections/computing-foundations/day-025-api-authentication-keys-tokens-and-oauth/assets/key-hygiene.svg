<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="None of them is a technique. All of them are discipline.">
  <title>Four habits that make a leak survivable</title>
  <style>
    .key-hygiene-bg   { fill: #f8fafc; }
    .key-hygiene-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .key-hygiene-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .key-hygiene-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .key-hygiene-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .key-hygiene-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .key-hygiene-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .key-hygiene-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .key-hygiene-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .key-hygiene-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .key-hygiene-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .key-hygiene-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .key-hygiene-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .key-hygiene-row { opacity: 1; }
    .key-hygiene-r0 { animation-delay: 0.00s; }
    .key-hygiene-r1 { animation-delay: 0.45s; }
    .key-hygiene-r2 { animation-delay: 0.90s; }
    .key-hygiene-r3 { animation-delay: 1.35s; }
    .key-hygiene-r4 { animation-delay: 1.80s; }
    .key-hygiene-row { animation: key-hygiene-reveal 7.3s ease-in-out infinite; }
    @keyframes key-hygiene-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="key-hygiene-bg" width="980" height="390"/>
  <text class="key-hygiene-h1"  x="30" y="40">Four habits that make a leak survivable</text>
  <text class="key-hygiene-sub" x="30" y="64">None of them is a technique. All of them are discipline.</text>
  <rect class="key-hygiene-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="key-hygiene-name" x="46" y="122">How keys cause damage</text>
  <text class="key-hygiene-desc" x="46" y="142">Each of these is common.</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r0" x="46" y="182">Hard-coded "just for now"</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r1" x="46" y="216">One key shared across a whole team</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r2" x="46" y="250">One key with full permissions everywhere</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r3" x="46" y="284">Never rotated, because nothing forced it</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r4" x="46" y="318">No spend limit on a metered key</text>
  <rect class="key-hygiene-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="key-hygiene-name" x="526" y="122">How the damage stays small</text>
  <text class="key-hygiene-desc" x="526" y="142">Cheap, all of them.</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r0" x="526" y="182">Read from the environment, always</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r1" x="526" y="216">One key per person and per project</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r2" x="526" y="250">Narrowest scope that does the job</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r3" x="526" y="284">Rotated on a schedule, not on an incident</text>
  <text class="key-hygiene-desc key-hygiene-row key-hygiene-r4" x="526" y="318">A spend limit, set when the key is created</text>
  <text class="key-hygiene-sub" x="30" y="372">A shared key cannot be revoked for one person, and cannot tell you whose request that was. Both problems disappear the moment keys are per-person.</text>
</svg>
