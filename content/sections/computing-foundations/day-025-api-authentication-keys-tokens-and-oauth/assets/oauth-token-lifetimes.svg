<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is used constantly. One is guarded carefully.">
  <title>Why there are two tokens</title>
  <style>
    .oauth-token-lifetimes-bg   { fill: #f8fafc; }
    .oauth-token-lifetimes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .oauth-token-lifetimes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .oauth-token-lifetimes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .oauth-token-lifetimes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .oauth-token-lifetimes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .oauth-token-lifetimes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .oauth-token-lifetimes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .oauth-token-lifetimes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .oauth-token-lifetimes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .oauth-token-lifetimes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .oauth-token-lifetimes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .oauth-token-lifetimes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .oauth-token-lifetimes-row { opacity: 1; }
    .oauth-token-lifetimes-r0 { animation-delay: 0.00s; }
    .oauth-token-lifetimes-r1 { animation-delay: 0.45s; }
    .oauth-token-lifetimes-r2 { animation-delay: 0.90s; }
    .oauth-token-lifetimes-r3 { animation-delay: 1.35s; }
    .oauth-token-lifetimes-r4 { animation-delay: 1.80s; }
    .oauth-token-lifetimes-row { animation: oauth-token-lifetimes-reveal 7.3s ease-in-out infinite; }
    @keyframes oauth-token-lifetimes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="oauth-token-lifetimes-bg" width="980" height="390"/>
  <text class="oauth-token-lifetimes-h1"  x="30" y="40">Why there are two tokens</text>
  <text class="oauth-token-lifetimes-sub" x="30" y="64">One is used constantly. One is guarded carefully.</text>
  <rect class="oauth-token-lifetimes-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="oauth-token-lifetimes-name" x="46" y="122">Access token</text>
  <text class="oauth-token-lifetimes-desc" x="46" y="142">Sent with every request.</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r0" x="46" y="182">Minutes to an hour</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r1" x="46" y="216">Used constantly, so exposed often</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r2" x="46" y="250">Limited to the granted scopes</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r3" x="46" y="284">A leak expires on its own, quickly</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r4" x="46" y="318">This is the bearer token the API sees</text>
  <rect class="oauth-token-lifetimes-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="oauth-token-lifetimes-name" x="526" y="122">Refresh token</text>
  <text class="oauth-token-lifetimes-desc" x="526" y="142">Sent only to mint new access.</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r0" x="526" y="182">Days to indefinite</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r1" x="526" y="216">Used rarely, so exposed rarely</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r2" x="526" y="250">Can mint fresh access tokens at will</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r3" x="526" y="284">A leak persists until revoked</text>
  <text class="oauth-token-lifetimes-desc oauth-token-lifetimes-row oauth-token-lifetimes-r4" x="526" y="318">Guarded far more carefully</text>
  <text class="oauth-token-lifetimes-sub" x="30" y="372">The short access-token lifetime is what makes a leak self-healing. The refresh token is what stops that convenience from meaning a login every hour — and is why revocation at the provider matters.</text>
</svg>
