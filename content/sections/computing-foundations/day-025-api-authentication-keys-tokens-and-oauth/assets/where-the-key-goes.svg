<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="URLs are written down in places you do not control.">
  <title>Two places to put a credential, one of them wrong</title>
  <style>
    .where-the-key-goes-bg   { fill: #f8fafc; }
    .where-the-key-goes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-the-key-goes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-the-key-goes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-the-key-goes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-the-key-goes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-the-key-goes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .where-the-key-goes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .where-the-key-goes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .where-the-key-goes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .where-the-key-goes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .where-the-key-goes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .where-the-key-goes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .where-the-key-goes-row { opacity: 1; }
    .where-the-key-goes-r0 { animation-delay: 0.00s; }
    .where-the-key-goes-r1 { animation-delay: 0.45s; }
    .where-the-key-goes-r2 { animation-delay: 0.90s; }
    .where-the-key-goes-r3 { animation-delay: 1.35s; }
    .where-the-key-goes-r4 { animation-delay: 1.80s; }
    .where-the-key-goes-row { animation: where-the-key-goes-reveal 7.3s ease-in-out infinite; }
    @keyframes where-the-key-goes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="where-the-key-goes-bg" width="980" height="390"/>
  <text class="where-the-key-goes-h1"  x="30" y="40">Two places to put a credential, one of them wrong</text>
  <text class="where-the-key-goes-sub" x="30" y="64">URLs are written down in places you do not control.</text>
  <rect class="where-the-key-goes-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="where-the-key-goes-name" x="46" y="122">Authorization header</text>
  <text class="where-the-key-goes-desc" x="46" y="142">Not recorded by default</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r0" x="46" y="182">Not in server access logs</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r1" x="46" y="216">Not in browser history</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r2" x="46" y="250">Not in proxy or CDN caches</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r3" x="46" y="284">Not in a Referer header sent onward</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r4" x="46" y="318">The standard place, for these reasons</text>
  <rect class="where-the-key-goes-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="where-the-key-goes-name" x="526" y="122">?api_key=... in the URL</text>
  <text class="where-the-key-goes-desc" x="526" y="142">Recorded almost everywhere</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r0" x="526" y="182">Written to every access log on the path</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r1" x="526" y="216">Kept in browser history</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r2" x="526" y="250">Cached by proxies and CDNs</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r3" x="526" y="284">Leaked in Referer headers to third parties</text>
  <text class="where-the-key-goes-desc where-the-key-goes-row where-the-key-goes-r4" x="526" y="318">Visible in a screen share</text>
  <text class="where-the-key-goes-sub" x="30" y="372">A key in a URL is not encrypted away by HTTPS — TLS protects it in transit, and the logging happens at both ends.</text>
</svg>
