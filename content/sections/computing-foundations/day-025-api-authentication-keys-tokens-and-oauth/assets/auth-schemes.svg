<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>One HTTP request carrying an API key, a bearer token, or Basic auth to a server that checks the credential and answers 200 or 401</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Three credential envelopes, one doorkeeper</text>

  <!-- Client -->
  <rect x="30" y="70" width="150" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="105" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Your client</text>
  <text x="105" y="122" text-anchor="middle" font-size="14" fill="#1a202c">(curl, app, script)</text>

  <!-- The three credential rows -->
  <rect x="230" y="70" width="330" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="245" y="90" font-size="14" font-weight="bold" fill="#1a202c">API key in a header</text>
  <text x="245" y="110" font-size="14" fill="#1a202c">X-API-Key: key-example-abc123</text>

  <rect x="230" y="132" width="330" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="245" y="152" font-size="14" font-weight="bold" fill="#1a202c">Bearer token</text>
  <text x="245" y="172" font-size="14" fill="#1a202c">Authorization: Bearer token-example-123</text>

  <rect x="230" y="194" width="330" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="245" y="214" font-size="14" font-weight="bold" fill="#1a202c">Basic auth (base64 of user:pass)</text>
  <text x="245" y="234" font-size="14" fill="#1a202c">Authorization: Basic dXNlcjpwYXNz</text>

  <!-- Arrows from client to each credential row -->
  <line x1="180" y1="105" x2="222" y2="96" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="230,94 216,92 219,105" fill="#1d4ed8"/>
  <line x1="180" y1="105" x2="222" y2="158" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="230,160 219,150 216,163" fill="#1d4ed8"/>
  <line x1="180" y1="105" x2="222" y2="220" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="230,222 219,212 215,224" fill="#1d4ed8"/>

  <text x="205" y="270" text-anchor="middle" font-size="13" fill="#1a202c">all sent over TLS (HTTPS)</text>

  <!-- Server / doorkeeper -->
  <rect x="600" y="118" width="130" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="665" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Server</text>
  <text x="665" y="172" text-anchor="middle" font-size="14" fill="#1a202c">checks the</text>
  <text x="665" y="190" text-anchor="middle" font-size="14" fill="#1a202c">credential</text>

  <!-- Arrow from credentials to server -->
  <line x1="560" y1="158" x2="592" y2="158" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="600,158 586,151 586,165" fill="#1d4ed8"/>

  <!-- Two outcomes -->
  <rect x="470" y="320" width="120" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="530" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">200 OK</text>
  <text x="530" y="365" text-anchor="middle" font-size="13" fill="#1a202c">valid credential</text>

  <rect x="620" y="320" width="120" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="680" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">401</text>
  <text x="680" y="365" text-anchor="middle" font-size="13" fill="#1a202c">missing or wrong</text>

  <line x1="655" y1="198" x2="560" y2="314" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="555,320 561,306 568,317" fill="#1d4ed8"/>
  <line x1="675" y1="198" x2="680" y2="314" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="680,320 674,307 687,307" fill="#1d4ed8"/>

  <text x="380" y="430" text-anchor="middle" font-size="14" fill="#1a202c">Authentication proves who is calling. A wrong or missing credential returns 401 Unauthorized.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}.dx-f5{animation-delay:2.10s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 180 105 L 222 96" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 180 105 L 222 158" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 180 105 L 222 220" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 560 158 L 592 158" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 655 198 L 560 314" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 675 198 L 680 314" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
