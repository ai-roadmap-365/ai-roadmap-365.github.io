<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Who are you, versus what you may do.">
  <title>401 and 403 answer different questions</title>
  <style>
    .authn-versus-authz-bg   { fill: #f8fafc; }
    .authn-versus-authz-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authn-versus-authz-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authn-versus-authz-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authn-versus-authz-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authn-versus-authz-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authn-versus-authz-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .authn-versus-authz-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .authn-versus-authz-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .authn-versus-authz-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .authn-versus-authz-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .authn-versus-authz-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .authn-versus-authz-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .authn-versus-authz-row { opacity: 1; }
    .authn-versus-authz-r0 { animation-delay: 0.00s; }
    .authn-versus-authz-r1 { animation-delay: 0.45s; }
    .authn-versus-authz-r2 { animation-delay: 0.90s; }
    .authn-versus-authz-r3 { animation-delay: 1.35s; }
    .authn-versus-authz-r4 { animation-delay: 1.80s; }
    .authn-versus-authz-row { animation: authn-versus-authz-reveal 7.3s ease-in-out infinite; }
    @keyframes authn-versus-authz-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="authn-versus-authz-bg" width="980" height="390"/>
  <text class="authn-versus-authz-h1"  x="30" y="40">401 and 403 answer different questions</text>
  <text class="authn-versus-authz-sub" x="30" y="64">Who are you, versus what you may do.</text>
  <rect class="authn-versus-authz-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="authn-versus-authz-name" x="46" y="122">Authentication — 401</text>
  <text class="authn-versus-authz-desc" x="46" y="142">We do not know who you are.</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r0" x="46" y="182">The credential is missing or invalid</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r1" x="46" y="216">A trailing newline from a paste does this</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r2" x="46" y="250">So does a missing Bearer prefix</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r3" x="46" y="284">A correct key fixes it</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r4" x="46" y="318">Check what you SENT, with curl -v</text>
  <rect class="authn-versus-authz-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="authn-versus-authz-name" x="526" y="122">Authorization — 403</text>
  <text class="authn-versus-authz-desc" x="526" y="142">We know, and the answer is no.</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r0" x="526" y="182">The credential is valid</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r1" x="526" y="216">It lacks the scope or permission</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r2" x="526" y="250">A different key will not help</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r3" x="526" y="284">Neither will retrying</text>
  <text class="authn-versus-authz-desc authn-versus-authz-row authn-versus-authz-r4" x="526" y="318">Check the scope, the plan, or the role</text>
  <text class="authn-versus-authz-sub" x="30" y="372">Reading a 403 as "log in again" is the single most common wasted half hour in API work. You already logged in.</text>
</svg>
