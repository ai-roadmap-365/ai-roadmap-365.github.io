<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="What does the secret actually represent?">
  <title>Three schemes, one question each</title>
  <style>
    .scheme-comparison-bg   { fill: #f8fafc; }
    .scheme-comparison-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheme-comparison-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheme-comparison-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheme-comparison-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheme-comparison-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheme-comparison-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scheme-comparison-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scheme-comparison-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scheme-comparison-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scheme-comparison-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scheme-comparison-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scheme-comparison-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scheme-comparison-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scheme-comparison-stage { opacity: 1; }

    .scheme-comparison-s0 { animation-delay: 0.00s; }
    .scheme-comparison-e0 { animation-delay: 0.00s; }
    .scheme-comparison-s1 { animation-delay: 1.50s; }
    .scheme-comparison-e1 { animation-delay: 1.50s; }
    .scheme-comparison-s2 { animation-delay: 3.00s; }
    .scheme-comparison-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .scheme-comparison-conn  { animation: scheme-comparison-trace 6s ease-in-out infinite; }
      .scheme-comparison-stage { animation: scheme-comparison-arrive 6s ease-in-out infinite; }
    }
    @keyframes scheme-comparison-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scheme-comparison-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scheme-comparison-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scheme-comparison-stage { animation: scheme-comparison-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scheme-comparison-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scheme-comparison-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scheme-comparison-bg" width="980" height="322"/>
  <text class="scheme-comparison-h1"  x="30" y="40">Three schemes, one question each</text>
  <text class="scheme-comparison-sub" x="30" y="64">What does the secret actually represent?</text>
  <g class="scheme-comparison-stage scheme-comparison-s0">
    <rect class="scheme-comparison-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="scheme-comparison-step" x="44" y="142">01</text>
    <text class="scheme-comparison-name" x="70" y="142">API key</text>
    <text class="scheme-comparison-desc" x="44" y="166">Identifies an account. Long-lived, revocable,</text>
    <text class="scheme-comparison-desc" x="44" y="182">in a header the API names.</text>
    <text class="scheme-comparison-edge" x="44" y="242">X-API-Key</text>
  </g>
  <line class="scheme-comparison-line scheme-comparison-conn scheme-comparison-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#scheme-comparison-tip)"/>
  <g class="scheme-comparison-stage scheme-comparison-s1">
    <rect class="scheme-comparison-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="scheme-comparison-step" x="359" y="142">02</text>
    <text class="scheme-comparison-name" x="385" y="142">Bearer token</text>
    <text class="scheme-comparison-desc" x="359" y="166">Possession IS the authorisation. Often</text>
    <text class="scheme-comparison-desc" x="359" y="182">short-lived and scoped.</text>
    <text class="scheme-comparison-edge" x="359" y="242">Authorization</text>
  </g>
  <line class="scheme-comparison-line scheme-comparison-conn scheme-comparison-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#scheme-comparison-tip)"/>
  <g class="scheme-comparison-stage scheme-comparison-s2">
    <rect class="scheme-comparison-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="scheme-comparison-step" x="674" y="142">03</text>
    <text class="scheme-comparison-name" x="700" y="142">Basic auth</text>
    <text class="scheme-comparison-desc" x="674" y="166">A username and password, base64-encoded. Safe</text>
    <text class="scheme-comparison-desc" x="674" y="182">only inside TLS.</text>
    <text class="scheme-comparison-edge" x="674" y="242">Basic</text>
  </g>
  <text class="scheme-comparison-sub" x="30" y="304">All three are equally exposed if the transport is not encrypted. TLS is what protects them; the scheme only decides what the secret means.</text>
</svg>
