questions:
  - question: 'You just ran git commit and immediately noticed a typo in the commit message. Which command fixes it most directly?'
    options:
      - 'git revert HEAD'
      - 'git reset --hard HEAD~1'
      - 'git commit --amend -m "corrected message"'
      - 'git restore --staged .'
    answer_index: 2
    explanation: 'git commit --amend replaces the most recent commit with a new one carrying the corrected message. The commit''s hash changes because amend creates a new commit object rather than editing the old one in place.'

  - question: 'What does git reset --soft HEAD~1 do to your staged changes and your working files?'
    options:
      - 'It moves HEAD back one commit but leaves the index and working tree untouched, so the rewound changes stay staged'
      - 'It moves HEAD back one commit and deletes all uncommitted changes in the working tree'
      - 'It creates a new commit that reverses the last commit'
      - 'It only un-stages files without moving HEAD'
    answer_index: 0
    explanation: 'A --soft reset moves only the branch pointer (HEAD). The index and working tree are left exactly as they were, so every change from the rewound commit remains staged and ready to be re-committed.'

  - question: 'Which git reset mode also overwrites your working-tree files, permanently discarding uncommitted changes?'
    options:
      - '--soft'
      - '--mixed'
      - '--hard'
      - 'All three affect the working tree equally'
    answer_index: 2
    explanation: 'Only --hard moves all three: HEAD, the index, and the working tree. It forcibly rewrites your files to match the target commit, and any uncommitted changes are destroyed with no undo — which is why it is the one genuinely dangerous mode.'

  - question: 'A bad commit is already pushed and three teammates have pulled it. What is the correct way to undo it?'
    options:
      - 'git reset --hard HEAD~1, then git push --force'
      - 'git revert <hash>, which adds a new inverse commit everyone can pull'
      - 'git commit --amend, then push again'
      - 'Delete the .git folder and re-clone'
    answer_index: 1
    explanation: 'Once history is shared, rewriting it with reset and force-push breaks teammates'' copies. git revert undoes the commit additively by recording a new inverse commit, so everyone can pull the change and stay in sync.'

  - question: 'How does git revert differ from git reset?'
    options:
      - 'Revert deletes commits while reset keeps them'
      - 'They are identical; revert is just an alias for reset'
      - 'Revert rewrites history by moving the pointer; reset adds a new commit'
      - 'Revert preserves history by adding a new inverse commit; reset rewrites history by moving the branch pointer'
    answer_index: 3
    explanation: 'Revert is additive and safe for shared branches: it leaves the original commit in place and records a new commit that cancels it. Reset is subtractive: it moves the branch pointer, rewriting what the history looks like.'

  - question: 'After git reset --hard HEAD~2 drops two commits, how do you get them back?'
    options:
      - 'You cannot; a hard reset permanently deletes commits'
      - 'Run git reflog to find the dropped commit''s hash, then git reset --hard <hash>'
      - 'Run git pull to re-download them from the remote'
      - 'Run git commit --amend to rebuild them'
    answer_index: 1
    explanation: 'The dropped commits become unreachable but still exist in the object store, and their hashes remain listed in git reflog. Pointing the branch back at the newest lost commit with git reset --hard restores the whole chain, since each commit points to its parent.'

  - question: 'What is the git reflog?'
    options:
      - 'A shared log on the remote server showing everyone''s commits'
      - 'A local, private record of every position HEAD has occupied, including commits no branch points to anymore'
      - 'The same thing as git log, showing only reachable commits'
      - 'A list of files currently staged for commit'
    answer_index: 1
    explanation: 'The reflog (reference log) records every movement of HEAD in your own repository. It is local and never pushed, and because it references commits even after they fall off a branch, it is the primary recovery mechanism after a mistaken reset.'

  - question: 'Which statement about Git''s safety net is accurate?'
    options:
      - 'Both committed and uncommitted work are always recoverable'
      - 'Nothing in Git can ever be recovered once a command runs'
      - 'Committed work is almost impossible to lose, but uncommitted work has no protection and is not in the reflog'
      - 'Only work pushed to a remote is safe'
    answer_index: 2
    explanation: 'Commits are content-addressed objects that linger in the object store and are tracked by the reflog, so committed work is nearly always recoverable. Uncommitted edits in the working tree are not snapshots and not in the reflog, so git reset --hard erases them with no undo — hence the habit of committing or stashing first.'
