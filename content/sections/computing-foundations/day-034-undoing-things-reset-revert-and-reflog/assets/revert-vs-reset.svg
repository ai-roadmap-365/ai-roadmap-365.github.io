<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" font-family="system-ui, sans-serif">
  <title>How git revert adds a new inverse commit while git reset moves the branch pointer backward and rewrites history</title>
  <rect x="0" y="0" width="780" height="580" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Two ways to undo commit C</text>

  <!-- Starting line -->
  <text x="30" y="82" font-size="15" font-weight="bold" fill="#1a202c">Start:</text>
  <circle cx="140" cy="100" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">A</text>
  <line x1="162" y1="100" x2="208" y2="100" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="230" cy="100" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="230" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">B</text>
  <line x1="252" y1="100" x2="298" y2="100" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="320" cy="100" r="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="320" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">C</text>
  <rect x="294" y="132" width="52" height="26" fill="#1d4ed8" rx="4"/>
  <text x="320" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">HEAD</text>
  <text x="420" y="105" font-size="15" fill="#1a202c">C is the commit we regret.</text>

  <!-- REVERT path -->
  <text x="30" y="222" font-size="16" font-weight="bold" fill="#15803d">git revert C  (safe for shared history)</text>
  <circle cx="140" cy="262" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="267" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">A</text>
  <line x1="162" y1="262" x2="208" y2="262" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="230" cy="262" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="230" y="267" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">B</text>
  <line x1="252" y1="262" x2="298" y2="262" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="320" cy="262" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="267" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">C</text>
  <line x1="342" y1="262" x2="388" y2="262" stroke="#15803d" stroke-width="3"/>
  <circle cx="412" cy="262" r="24" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="412" y="267" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">C'</text>
  <rect x="386" y="296" width="52" height="26" fill="#1d4ed8" rx="4"/>
  <text x="412" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">HEAD</text>
  <text x="470" y="250" font-size="14" fill="#1a202c">C stays in history. New commit C'</text>
  <text x="470" y="272" font-size="14" fill="#1a202c">cancels C's changes. Nothing is</text>
  <text x="470" y="294" font-size="14" fill="#1a202c">rewritten, so it is safe to push.</text>

  <!-- RESET path -->
  <text x="30" y="392" font-size="16" font-weight="bold" fill="#b91c1c">git reset --hard B  (rewrites history)</text>
  <circle cx="140" cy="432" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">A</text>
  <line x1="162" y1="432" x2="208" y2="432" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="230" cy="432" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="230" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">B</text>
  <rect x="204" y="464" width="52" height="26" fill="#1d4ed8" rx="4"/>
  <text x="230" y="482" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">HEAD</text>
  <line x1="252" y1="432" x2="298" y2="432" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="320" cy="432" r="22" fill="#f8fafc" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="320" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">C</text>
  <text x="380" y="420" font-size="14" fill="#1a202c">HEAD moves back to B. C is now</text>
  <text x="380" y="442" font-size="14" fill="#1a202c">dangling (dashed) — off the branch,</text>
  <text x="380" y="464" font-size="14" fill="#1a202c">but still findable in the reflog.</text>

  <!-- reflog safety net -->
  <rect x="20" y="504" width="740" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="390" y="528" text-anchor="middle" font-size="14" fill="#1a202c">Safety net: after a reset, git reflog still lists C's hash.</text>
  <text x="390" y="550" text-anchor="middle" font-size="14" fill="#1a202c">git reset --hard &lt;that hash&gt; brings C back, until garbage collection eventually prunes it.</text>
</svg>
