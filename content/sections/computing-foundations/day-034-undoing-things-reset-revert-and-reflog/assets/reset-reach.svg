<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="They all move HEAD. The question is what else they touch.">
  <title>Three modes, increasing reach</title>
  <style>
    .reset-reach-bg   { fill: #f8fafc; }
    .reset-reach-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reset-reach-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reset-reach-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reset-reach-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reset-reach-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reset-reach-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reset-reach-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reset-reach-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reset-reach-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reset-reach-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reset-reach-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reset-reach-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reset-reach-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reset-reach-stage { opacity: 1; }

    .reset-reach-s0 { animation-delay: 0.00s; }
    .reset-reach-e0 { animation-delay: 0.00s; }
    .reset-reach-s1 { animation-delay: 1.50s; }
    .reset-reach-e1 { animation-delay: 1.50s; }
    .reset-reach-s2 { animation-delay: 3.00s; }
    .reset-reach-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .reset-reach-conn  { animation: reset-reach-trace 6s ease-in-out infinite; }
      .reset-reach-stage { animation: reset-reach-arrive 6s ease-in-out infinite; }
    }
    @keyframes reset-reach-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reset-reach-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reset-reach-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reset-reach-stage { animation: reset-reach-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reset-reach-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reset-reach-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reset-reach-bg" width="980" height="322"/>
  <text class="reset-reach-h1"  x="30" y="40">Three modes, increasing reach</text>
  <text class="reset-reach-sub" x="30" y="64">They all move HEAD. The question is what else they touch.</text>
  <g class="reset-reach-stage reset-reach-s0">
    <rect class="reset-reach-good" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="reset-reach-step" x="44" y="142">01</text>
    <text class="reset-reach-name" x="70" y="142">--soft</text>
    <text class="reset-reach-desc" x="44" y="166">HEAD only. Changes stay staged, ready to</text>
    <text class="reset-reach-desc" x="44" y="182">re-commit.</text>
    <text class="reset-reach-edge" x="44" y="242">safe</text>
  </g>
  <line class="reset-reach-line reset-reach-conn reset-reach-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#reset-reach-tip)"/>
  <g class="reset-reach-stage reset-reach-s1">
    <rect class="reset-reach-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="reset-reach-step" x="359" y="142">02</text>
    <text class="reset-reach-name" x="385" y="142">--mixed (default)</text>
    <text class="reset-reach-desc" x="359" y="166">HEAD and the index. Changes stay on disk, but</text>
    <text class="reset-reach-desc" x="359" y="182">un-staged.</text>
    <text class="reset-reach-edge" x="359" y="242">safe</text>
  </g>
  <line class="reset-reach-line reset-reach-conn reset-reach-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#reset-reach-tip)"/>
  <g class="reset-reach-stage reset-reach-s2">
    <rect class="reset-reach-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="reset-reach-step" x="674" y="142">03</text>
    <text class="reset-reach-name" x="700" y="142">--hard</text>
    <text class="reset-reach-desc" x="674" y="166">All three. Files on disk are rewritten.</text>
    <text class="reset-reach-desc" x="674" y="182">Uncommitted work is destroyed.</text>
    <text class="reset-reach-edge" x="674" y="242">destructive</text>
  </g>
  <text class="reset-reach-sub" x="30" y="304">git reset --soft HEAD~1 is the everyday one: move back a commit and keep everything staged. It is the standard way to redo a commit you are not happy with.</text>
</svg>
