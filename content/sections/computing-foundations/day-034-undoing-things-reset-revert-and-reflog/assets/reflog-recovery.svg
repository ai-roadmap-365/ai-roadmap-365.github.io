<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and the first two are read-only.">
  <title>Recovering from a bad reset</title>
  <style>
    .reflog-recovery-bg   { fill: #f8fafc; }
    .reflog-recovery-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reflog-recovery-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reflog-recovery-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reflog-recovery-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reflog-recovery-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reflog-recovery-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reflog-recovery-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reflog-recovery-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reflog-recovery-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reflog-recovery-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reflog-recovery-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reflog-recovery-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reflog-recovery-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reflog-recovery-stage { opacity: 1; }

    .reflog-recovery-s0 { animation-delay: 0.00s; }
    .reflog-recovery-e0 { animation-delay: 0.00s; }
    .reflog-recovery-s1 { animation-delay: 1.28s; }
    .reflog-recovery-e1 { animation-delay: 1.28s; }
    .reflog-recovery-s2 { animation-delay: 2.56s; }
    .reflog-recovery-e2 { animation-delay: 2.56s; }
    .reflog-recovery-s3 { animation-delay: 3.84s; }
    .reflog-recovery-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .reflog-recovery-conn  { animation: reflog-recovery-trace 6.4s ease-in-out infinite; }
      .reflog-recovery-stage { animation: reflog-recovery-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes reflog-recovery-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reflog-recovery-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reflog-recovery-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reflog-recovery-stage { animation: reflog-recovery-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reflog-recovery-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reflog-recovery-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reflog-recovery-bg" width="980" height="322"/>
  <text class="reflog-recovery-h1"  x="30" y="40">Recovering from a bad reset</text>
  <text class="reflog-recovery-sub" x="30" y="64">Four steps, and the first two are read-only.</text>
  <g class="reflog-recovery-stage reflog-recovery-s0">
    <rect class="reflog-recovery-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="reflog-recovery-step" x="44" y="142">01</text>
    <text class="reflog-recovery-name" x="70" y="142">git status and git reflog</text>
    <text class="reflog-recovery-desc" x="44" y="166">Both read-only. Run these before</text>
    <text class="reflog-recovery-desc" x="44" y="182">touching anything.</text>
    <text class="reflog-recovery-edge" x="44" y="242">safe</text>
  </g>
  <line class="reflog-recovery-line reflog-recovery-conn reflog-recovery-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#reflog-recovery-tip)"/>
  <g class="reflog-recovery-stage reflog-recovery-s1">
    <rect class="reflog-recovery-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="reflog-recovery-step" x="280" y="142">02</text>
    <text class="reflog-recovery-name" x="306" y="142">Find the hash</text>
    <text class="reflog-recovery-desc" x="280" y="166">The entry just before the reset</text>
    <text class="reflog-recovery-desc" x="280" y="182">line is what you lost.</text>
    <text class="reflog-recovery-edge" x="280" y="242">HEAD@{1}</text>
  </g>
  <line class="reflog-recovery-line reflog-recovery-conn reflog-recovery-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#reflog-recovery-tip)"/>
  <g class="reflog-recovery-stage reflog-recovery-s2">
    <rect class="reflog-recovery-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="reflog-recovery-step" x="516" y="142">03</text>
    <text class="reflog-recovery-name" x="542" y="142">Inspect it first</text>
    <text class="reflog-recovery-desc" x="516" y="166">git show &lt;hash&gt; or git checkout</text>
    <text class="reflog-recovery-desc" x="516" y="182">&lt;hash&gt;. Confirm it is what you</text>
    <text class="reflog-recovery-desc" x="516" y="198">want.</text>
  </g>
  <line class="reflog-recovery-line reflog-recovery-conn reflog-recovery-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#reflog-recovery-tip)"/>
  <g class="reflog-recovery-stage reflog-recovery-s3">
    <rect class="reflog-recovery-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="reflog-recovery-step" x="752" y="142">04</text>
    <text class="reflog-recovery-name" x="778" y="142">Move the branch back</text>
    <text class="reflog-recovery-desc" x="752" y="166">git reset --hard &lt;hash&gt;. The</text>
    <text class="reflog-recovery-desc" x="752" y="182">whole chain returns, because</text>
    <text class="reflog-recovery-desc" x="752" y="198">commits name their parents.</text>
  </g>
  <text class="reflog-recovery-sub" x="30" y="304">The commit was never deleted — only unreferenced. Garbage collection may eventually prune it, but the window is roughly 30 to 90 days, which is far longer than it takes to notice.</text>
</svg>
