<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Everything else is a lookup away.">
  <title>The one thing you cannot get back</title>
  <style>
    .what-is-recoverable-bg   { fill: #f8fafc; }
    .what-is-recoverable-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-is-recoverable-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-is-recoverable-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-is-recoverable-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-is-recoverable-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-is-recoverable-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-is-recoverable-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .what-is-recoverable-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .what-is-recoverable-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .what-is-recoverable-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .what-is-recoverable-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .what-is-recoverable-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-is-recoverable-row { opacity: 1; }
    .what-is-recoverable-r0 { animation-delay: 0.00s; }
    .what-is-recoverable-r1 { animation-delay: 0.45s; }
    .what-is-recoverable-r2 { animation-delay: 0.90s; }
    .what-is-recoverable-r3 { animation-delay: 1.35s; }
    .what-is-recoverable-r4 { animation-delay: 1.80s; }
    .what-is-recoverable-row { animation: what-is-recoverable-reveal 7.3s ease-in-out infinite; }
    @keyframes what-is-recoverable-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="what-is-recoverable-bg" width="980" height="390"/>
  <text class="what-is-recoverable-h1"  x="30" y="40">The one thing you cannot get back</text>
  <text class="what-is-recoverable-sub" x="30" y="64">Everything else is a lookup away.</text>
  <rect class="what-is-recoverable-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="what-is-recoverable-name" x="46" y="122">Recoverable</text>
  <text class="what-is-recoverable-desc" x="46" y="142">It was committed at some point.</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r0" x="46" y="182">Commits dropped by a hard reset</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r1" x="46" y="216">A branch deleted with -D</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r2" x="46" y="250">A commit replaced by an amend</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r3" x="46" y="284">Work orphaned by a bad rebase</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r4" x="46" y="318">All of it: git reflog</text>
  <rect class="what-is-recoverable-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="what-is-recoverable-name" x="526" y="122">Not recoverable</text>
  <text class="what-is-recoverable-desc" x="526" y="142">It was never committed.</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r0" x="526" y="182">Edits discarded by git restore &lt;file&gt;</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r1" x="526" y="216">Uncommitted changes wiped by reset --hard</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r2" x="526" y="250">Untracked files removed by git clean</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r3" x="526" y="284">Nothing ever recorded them</text>
  <text class="what-is-recoverable-desc what-is-recoverable-row what-is-recoverable-r4" x="526" y="318">The reflog tracks commits, not edits</text>
  <text class="what-is-recoverable-sub" x="30" y="372">This is the whole boundary, and it has one practical consequence: commit often, even imperfectly. A messy commit can be tidied later; an uncommitted edit cannot be retrieved at all.</text>
</svg>
