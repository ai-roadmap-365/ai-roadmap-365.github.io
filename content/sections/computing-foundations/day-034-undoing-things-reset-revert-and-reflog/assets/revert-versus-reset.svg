<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="On a shared branch only one of these is safe.">
  <title>Undo by adding, or undo by rewriting</title>
  <style>
    .revert-versus-reset-bg   { fill: #f8fafc; }
    .revert-versus-reset-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .revert-versus-reset-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .revert-versus-reset-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .revert-versus-reset-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .revert-versus-reset-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .revert-versus-reset-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .revert-versus-reset-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .revert-versus-reset-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .revert-versus-reset-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .revert-versus-reset-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .revert-versus-reset-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="revert-versus-reset-bg" width="980" height="390"/>
  <text class="revert-versus-reset-h1"  x="30" y="40">Undo by adding, or undo by rewriting</text>
  <text class="revert-versus-reset-sub" x="30" y="64">On a shared branch only one of these is safe.</text>
  <rect class="revert-versus-reset-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="revert-versus-reset-name" x="46" y="122">git revert</text>
  <text class="revert-versus-reset-desc" x="46" y="142">Adds a new commit that undoes</text>
  <text class="revert-versus-reset-desc" x="46" y="182">The original commit stays in history</text>
  <text class="revert-versus-reset-desc" x="46" y="216">Everyone can simply pull it</text>
  <text class="revert-versus-reset-desc" x="46" y="250">Safe on a shared branch</text>
  <text class="revert-versus-reset-desc" x="46" y="284">The record of what happened is preserved</text>
  <text class="revert-versus-reset-desc" x="46" y="318">Answers 'when did this change?' later</text>
  <rect class="revert-versus-reset-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="revert-versus-reset-name" x="526" y="122">git reset --hard</text>
  <text class="revert-versus-reset-desc" x="526" y="142">Moves the branch pointer back</text>
  <text class="revert-versus-reset-desc" x="526" y="182">The commits become unreachable</text>
  <text class="revert-versus-reset-desc" x="526" y="216">Still recoverable via reflog or fsck</text>
  <text class="revert-versus-reset-desc" x="526" y="250">Only safe on unpushed local work</text>
  <text class="revert-versus-reset-desc" x="526" y="284">Forces everyone else into a mess</text>
  <text class="revert-versus-reset-desc" x="526" y="318">The commits are pruned eventually, not immediately</text>
  <text class="revert-versus-reset-sub" x="30" y="372">Unreachable is not the same as gone. That gap is why the reflog rescues so many bad afternoons.</text>
</svg>
