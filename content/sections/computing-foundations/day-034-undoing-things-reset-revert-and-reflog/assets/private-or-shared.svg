<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The second rule worth memorising word for word.">
  <title>Reset for private, revert for shared</title>
  <style>
    .private-or-shared-bg   { fill: #f8fafc; }
    .private-or-shared-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-shared-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-shared-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-shared-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-shared-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-shared-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .private-or-shared-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .private-or-shared-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .private-or-shared-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .private-or-shared-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .private-or-shared-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .private-or-shared-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .private-or-shared-row { opacity: 1; }
    .private-or-shared-r0 { animation-delay: 0.00s; }
    .private-or-shared-r1 { animation-delay: 0.45s; }
    .private-or-shared-r2 { animation-delay: 0.90s; }
    .private-or-shared-r3 { animation-delay: 1.35s; }
    .private-or-shared-r4 { animation-delay: 1.80s; }
    .private-or-shared-row { animation: private-or-shared-reveal 7.3s ease-in-out infinite; }
    @keyframes private-or-shared-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="private-or-shared-bg" width="980" height="390"/>
  <text class="private-or-shared-h1"  x="30" y="40">Reset for private, revert for shared</text>
  <text class="private-or-shared-sub" x="30" y="64">The second rule worth memorising word for word.</text>
  <rect class="private-or-shared-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="private-or-shared-name" x="46" y="122">reset — rewrites</text>
  <text class="private-or-shared-desc" x="46" y="142">The commit falls off the branch.</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r0" x="46" y="182">History shrinks; it looks like it never happened</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r1" x="46" y="216">Fine on a branch only you have</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r2" x="46" y="250">A disaster on a branch others pulled</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r3" x="46" y="284">Their history and yours now disagree</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r4" x="46" y="318">Safe only for unshared commits</text>
  <rect class="private-or-shared-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="private-or-shared-name" x="526" y="122">revert — adds</text>
  <text class="private-or-shared-desc" x="526" y="142">A new commit cancels the old one.</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r0" x="526" y="182">History grows; the original stays visible</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r1" x="526" y="216">The record of what happened stays honest</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r2" x="526" y="250">Everyone can pull it and stay in sync</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r3" x="526" y="284">Nothing is rewritten, so nothing diverges</text>
  <text class="private-or-shared-desc private-or-shared-row private-or-shared-r4" x="526" y="318">Safe always</text>
  <text class="private-or-shared-sub" x="30" y="372">And note what revert does not do: the original commit stays in the history, contents and all. Reverting a leaked secret undoes its effect and publishes nothing less.</text>
</svg>
