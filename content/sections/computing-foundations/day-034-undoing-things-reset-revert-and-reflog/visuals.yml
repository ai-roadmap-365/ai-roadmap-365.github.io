visuals:
  - id: reset-modes
    file: assets/reset-modes.svg
    type: diagram
    title: 'The three git reset modes'
    alt: 'Diagram: git reset modes and which of HEAD, the index, and the working tree each one moves'
    description: 'A three-row table showing that --soft moves only HEAD, --mixed (the default) also resets the index, and --hard additionally overwrites the working tree, permanently discarding uncommitted changes.'
  - id: revert-vs-reset
    file: assets/revert-vs-reset.svg
    type: flowchart
    title: 'Revert versus reset'
    alt: 'Flowchart: git revert adds a new inverse commit while git reset moves the branch pointer backward'
    description: 'A branching diagram: from a starting history A-B-C, git revert adds a new commit C-prime that cancels C while keeping history intact, whereas git reset moves HEAD back to B and leaves C dangling but recoverable through the reflog.'
  - id: revert-versus-reset
    file: assets/revert-versus-reset.svg
    type: diagram
    title: 'Undo by adding, or undo by rewriting'
    alt: 'Diagram: git revert compared with git reset'
    description: 'A two-column comparison of revert and reset, showing that revert adds an inverse commit while reset moves the branch pointer, and which is appropriate on shared history.'
  - id: three-trees
    file: assets/three-trees.svg
    type: diagram
    title: 'Three places, and one pointer'
    alt: 'Diagram: the working tree, the index and HEAD'
    description: 'A three-stage explanation of Git''s working tree, index and HEAD pointer, describing what each holds and how content moves between them.'
  - id: reset-reach
    file: assets/reset-reach.svg
    type: diagram
    title: 'Three modes, increasing reach'
    alt: 'Diagram: how far each git reset mode reaches'
    description: 'A three-stage progression through the soft, mixed and hard reset modes, describing which of HEAD, the index and the working tree each one affects.'
  - id: what-is-recoverable
    file: assets/what-is-recoverable.svg
    type: diagram
    title: 'The one thing you cannot get back'
    alt: 'Diagram: what can be recovered in Git and what cannot'
    description: 'A two-column comparison of recoverable and unrecoverable states in Git, distinguishing committed work that survives in the reflog from uncommitted edits that were never recorded.'
  - id: reflog-recovery
    file: assets/reflog-recovery.svg
    type: diagram
    title: 'Recovering from a bad reset'
    alt: 'Diagram: the steps to recover a lost commit using the reflog'
    description: 'A four-stage recovery procedure using the reflog, covering running read-only inspection first, finding the lost commit, verifying it, and moving the branch back onto it.'
  - id: private-or-shared
    file: assets/private-or-shared.svg
    type: diagram
    title: 'Reset for private, revert for shared'
    alt: 'Diagram: rewriting history compared with adding an inverse commit'
    description: 'A two-column comparison of reset and revert as ways to undo a commit, covering what happens to history and the consequence for other people who have the commits.'
  - id: stash-instead
    file: assets/stash-instead.svg
    type: diagram
    title: 'Most resets could have been a stash'
    alt: 'Diagram: using git stash compared with resetting to clear the working tree'
    description: 'A two-column comparison of resetting to clear uncommitted changes against stashing them, covering whether the work is preserved and how it is retrieved.'
  - id: amend-replaces
    file: assets/amend-replaces.svg
    type: diagram
    title: 'Amend does not edit — it replaces'
    alt: 'Diagram: how git commit --amend replaces the previous commit'
    description: 'A four-stage sequence showing an amend combining staged content with the previous commit, producing a new commit with a new hash, and the original drifting into the reflog.'
  - id: restore-two-flavours
    file: assets/restore-two-flavours.svg
    type: diagram
    title: 'Two "I changed my mind" situations'
    alt: 'Diagram: git restore --staged compared with git restore'
    description: 'A two-column comparison of unstaging a file against discarding its edits, noting that only one of the two preserves the work.'
  - id: undo-decision
    file: assets/undo-decision.svg
    type: diagram
    title: 'Which undo do you want?'
    alt: 'Diagram: choosing between the undo commands'
    description: 'A four-stage decision procedure for choosing an undo command based on whether the work is committed and whether the commits have been shared.'
