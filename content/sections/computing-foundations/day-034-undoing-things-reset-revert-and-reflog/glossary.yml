terms:
  - term: amend
    definition: 'Replacing the most recent commit with a new one — used to fix its message or add a forgotten file. Because it builds a new commit object, the commit''s hash changes.'
  - term: reset
    definition: 'A command that moves the current branch pointer to a specified commit, optionally also updating the index and working tree depending on its mode (soft, mixed, or hard).'
  - term: soft reset
    definition: 'git reset --soft: moves only HEAD to the target commit, leaving the index and working tree untouched, so the rewound changes remain staged.'
  - term: hard reset
    definition: 'git reset --hard: moves HEAD, the index, and the working tree to the target commit, permanently discarding any uncommitted changes. The one genuinely destructive undo mode.'
  - term: revert
    definition: 'A command that undoes a commit by creating a new commit which applies its exact inverse, preserving history. The safe way to undo commits that have already been shared.'
  - term: restore
    definition: 'A command (added in Git 2.23) for undoing changes to files: git restore --staged un-stages a file, while git restore discards a file''s uncommitted edits to match the last commit.'
  - term: reflog
    definition: 'Short for "reference log": a local, private record of every position HEAD has occupied, including commits that no branch points to anymore, making it Git''s primary recovery mechanism.'
  - term: HEAD
    definition: 'A pointer to the commit you currently have checked out — normally the tip of the current branch, and the snapshot you would return to if you discarded everything else.'
  - term: detached HEAD
    definition: 'The state where HEAD points directly at a specific commit instead of a branch, so new commits belong to no branch and can be lost if you switch away without saving them to one.'
  - term: force push
    definition: 'git push --force: overwriting the remote branch with your local history, used after rewriting history. It can destroy teammates'' commits; git push --force-with-lease is a safer variant that refuses to overwrite work you have not seen.'
  - term: index
    definition: 'Also called the staging area: a holding area for the changes marked as ready to go into the next commit. git add copies changes into it; a commit freezes its contents into a new snapshot.'
