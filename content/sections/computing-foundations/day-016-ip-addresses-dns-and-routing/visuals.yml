visuals:
  - id: dns-resolution
    file: assets/dns-resolution.svg
    type: flowchart
    title: 'How DNS resolution walks the hierarchy'
    alt: 'Flowchart: a resolver walking the DNS hierarchy from root to TLD to authoritative server, with caching'
    description: 'A left-to-right flow: your computer asks a recursive resolver for the address of example.com; the resolver queries a root server (referred to the .com servers), then a .com TLD server (referred to the domain''s authoritative servers), then an authoritative server that returns the A record; the answer flows back with a TTL, and a caching note explains that the resolver reuses it until it expires.'
  - id: ip-routing
    file: assets/ip-routing.svg
    type: diagram
    title: 'A packet routed hop by hop across autonomous systems'
    alt: 'Diagram: a packet hopping across routers and autonomous systems from a source computer to a destination server'
    description: 'A source computer sends a packet through a chain of routers (R1 gateway, R2, R3, R4) grouped into three autonomous systems — your network, a transit ISP, and the destination network — to a destination server; annotations explain that each router forwards toward the next hop, that BGP lets autonomous systems advertise reachable address blocks, and that traceroute exposes the hops by using increasing hop limits.'
