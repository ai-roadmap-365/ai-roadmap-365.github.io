visuals:
  - id: dns-resolution
    file: assets/dns-resolution.svg
    type: flowchart
    title: 'How DNS resolution walks the hierarchy'
    alt: 'Flowchart: a resolver walking the DNS hierarchy from root to TLD to authoritative server, with caching'
    description: 'A left-to-right flow: your computer asks a recursive resolver for the address of example.com; the resolver queries a root server (referred to the .com servers), then a .com TLD server (referred to the domain''s authoritative servers), then an authoritative server that returns the A record; the answer flows back with a TTL, and a caching note explains that the resolver reuses it until it expires.'
  - id: ip-routing
    file: assets/ip-routing.svg
    type: diagram
    title: 'A packet routed hop by hop across autonomous systems'
    alt: 'Diagram: a packet hopping across routers and autonomous systems from a source computer to a destination server'
    description: 'A source computer sends a packet through a chain of routers (R1 gateway, R2, R3, R4) grouped into three autonomous systems — your network, a transit ISP, and the destination network — to a destination server; annotations explain that each router forwards toward the next hop, that BGP lets autonomous systems advertise reachable address blocks, and that traceroute exposes the hops by using increasing hop limits.'
  - id: dns-resolution-path
    file: assets/dns-resolution-path.svg
    type: diagram
    title: 'Turning a name into an address'
    alt: 'Diagram: the steps a DNS lookup passes through from cache to authoritative server'
    description: 'A five-stage sequence showing a DNS lookup checked against the local cache, the resolver''s cache, the root servers, the top-level domain servers, and finally the authoritative server, with the time each step adds.'
  - id: one-file-to-hierarchy
    file: assets/one-file-to-hierarchy.svg
    type: diagram
    title: 'Why DNS is a hierarchy and not a directory'
    alt: 'Diagram: a single hosts file compared with delegated DNS'
    description: 'A two-column comparison of the original single HOSTS.TXT file against the delegated DNS hierarchy, covering who maintains the data, how changes propagate, and how each scales.'
  - id: ttl-tradeoff
    file: assets/ttl-tradeoff.svg
    type: diagram
    title: 'The TTL you choose is a trade'
    alt: 'Diagram: a short DNS time-to-live compared with a long one'
    description: 'A two-column comparison of short and long DNS time-to-live values, covering how quickly a change propagates, how many lookups are made, and what happens if the authoritative server is unreachable.'
  - id: private-versus-public
    file: assets/private-versus-public.svg
    type: diagram
    title: 'Why your laptop''s address is useless to a server'
    alt: 'Diagram: private address ranges compared with public ones'
    description: 'A two-column comparison of private and public IP address ranges, covering which blocks are reserved, whether they are routed on the public internet, and the role of network address translation.'
  - id: cidr-arithmetic
    file: assets/cidr-arithmetic.svg
    type: diagram
    title: 'Reading a slash number'
    alt: 'Diagram: how the CIDR prefix length determines block size'
    description: 'A four-stage explanation of CIDR notation showing how the prefix length fixes leading bits, leaves the remainder for hosts, and determines the size of the address block.'
  - id: dns-failure-modes
    file: assets/dns-failure-modes.svg
    type: diagram
    title: 'When DNS is the actual problem'
    alt: 'Diagram: four DNS failures and what each looks like'
    description: 'A four-stage diagnostic sequence of DNS failure modes: a container with no resolver, a stale cached record, a lapsed registration, and a hijacked or intercepted answer.'
  - id: resolver-versus-authoritative
    file: assets/resolver-versus-authoritative.svg
    type: diagram
    title: 'Two very different kinds of DNS server'
    alt: 'Diagram: a recursive resolver compared with an authoritative server'
    description: 'A two-column comparison of recursive resolvers and authoritative name servers, covering who runs each, what each stores, and which one you change when you deploy a service.'
  - id: cname-chain
    file: assets/cname-chain.svg
    type: diagram
    title: 'A CNAME costs another lookup'
    alt: 'Diagram: how a CNAME record leads to a second lookup'
    description: 'A four-stage sequence following a CNAME from the requested name to the aliased name and finally to an address record, showing that each alias adds a resolution step.'
  - id: traceroute-mechanism
    file: assets/traceroute-mechanism.svg
    type: diagram
    title: 'How traceroute sees routers that never introduce themselves'
    alt: 'Diagram: how traceroute uses the hop limit to reveal each router'
    description: 'A four-stage explanation of the traceroute mechanism, sending packets with increasing hop limits so that each expires one router further along the path and elicits an error revealing that router.'
  - id: ipv4-versus-ipv6
    file: assets/ipv4-versus-ipv6.svg
    type: diagram
    title: 'Why IPv6 exists, and why it took decades'
    alt: 'Diagram: IPv4 compared with IPv6'
    description: 'A two-column comparison of IPv4 and IPv6 covering address length, total address space, notation, and the role NAT played in delaying adoption.'
  - id: hosts-file-wins
    file: assets/hosts-file-wins.svg
    type: diagram
    title: 'The file that overrides DNS entirely'
    alt: 'Diagram: how the hosts file takes precedence over DNS'
    description: 'A four-stage explanation of name resolution order showing the local hosts file being consulted before any DNS query, and the consequences for testing and for confusion.'
