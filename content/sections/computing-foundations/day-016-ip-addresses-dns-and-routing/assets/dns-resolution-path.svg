<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Usually this is instant, because almost every step is cached.">
  <title>Turning a name into an address</title>
  <style>
    .dns-resolution-path-bg   { fill: #f8fafc; }
    .dns-resolution-path-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dns-resolution-path-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dns-resolution-path-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dns-resolution-path-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dns-resolution-path-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dns-resolution-path-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dns-resolution-path-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dns-resolution-path-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dns-resolution-path-stage { opacity: 1; }

    .dns-resolution-path-s0 { animation-delay: 0.00s; }
    .dns-resolution-path-e0 { animation-delay: 0.00s; }
    .dns-resolution-path-s1 { animation-delay: 1.33s; }
    .dns-resolution-path-e1 { animation-delay: 1.33s; }
    .dns-resolution-path-s2 { animation-delay: 2.67s; }
    .dns-resolution-path-e2 { animation-delay: 2.67s; }
    .dns-resolution-path-s3 { animation-delay: 4.00s; }
    .dns-resolution-path-e3 { animation-delay: 4.00s; }
    .dns-resolution-path-s4 { animation-delay: 5.33s; }
    .dns-resolution-path-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .dns-resolution-path-conn  { animation: dns-resolution-path-trace 8s ease-in-out infinite; }
      .dns-resolution-path-stage { animation: dns-resolution-path-arrive 8s ease-in-out infinite; }
    }
    @keyframes dns-resolution-path-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dns-resolution-path-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dns-resolution-path-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dns-resolution-path-stage { animation: dns-resolution-path-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dns-resolution-path-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dns-resolution-path-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dns-resolution-path-bg" width="980" height="322"/>
  <text class="dns-resolution-path-h1"  x="30" y="40">Turning a name into an address</text>
  <text class="dns-resolution-path-sub" x="30" y="64">Usually this is instant, because almost every step is cached.</text>
  <g class="dns-resolution-path-stage dns-resolution-path-s0">
    <rect class="dns-resolution-path-hi" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="dns-resolution-path-step" x="44" y="142">01</text>
    <text class="dns-resolution-path-name" x="70" y="142">Local cache</text>
    <text class="dns-resolution-path-desc" x="44" y="166">Your machine may already</text>
    <text class="dns-resolution-path-desc" x="44" y="182">know the answer.</text>
    <text class="dns-resolution-path-edge" x="44" y="242">0 ms</text>
  </g>
  <line class="dns-resolution-path-line dns-resolution-path-conn dns-resolution-path-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#dns-resolution-path-tip)"/>
  <g class="dns-resolution-path-stage dns-resolution-path-s1">
    <rect class="dns-resolution-path-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="dns-resolution-path-step" x="233" y="142">02</text>
    <text class="dns-resolution-path-name" x="259" y="142">Resolver cache</text>
    <text class="dns-resolution-path-desc" x="233" y="166">Your ISP or company</text>
    <text class="dns-resolution-path-desc" x="233" y="182">resolver may know it.</text>
    <text class="dns-resolution-path-edge" x="233" y="242">~1 ms</text>
  </g>
  <line class="dns-resolution-path-line dns-resolution-path-conn dns-resolution-path-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#dns-resolution-path-tip)"/>
  <g class="dns-resolution-path-stage dns-resolution-path-s2">
    <rect class="dns-resolution-path-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="dns-resolution-path-step" x="422" y="142">03</text>
    <text class="dns-resolution-path-name" x="448" y="142">Root servers</text>
    <text class="dns-resolution-path-desc" x="422" y="166">They do not know, but</text>
    <text class="dns-resolution-path-desc" x="422" y="182">they know who handles</text>
    <text class="dns-resolution-path-desc" x="422" y="198">.com.</text>
    <text class="dns-resolution-path-edge" x="422" y="242">~20 ms</text>
  </g>
  <line class="dns-resolution-path-line dns-resolution-path-conn dns-resolution-path-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#dns-resolution-path-tip)"/>
  <g class="dns-resolution-path-stage dns-resolution-path-s3">
    <rect class="dns-resolution-path-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="dns-resolution-path-step" x="611" y="142">04</text>
    <text class="dns-resolution-path-name" x="637" y="142">TLD servers</text>
    <text class="dns-resolution-path-desc" x="611" y="166">They know which servers</text>
    <text class="dns-resolution-path-desc" x="611" y="182">are authoritative for the</text>
    <text class="dns-resolution-path-desc" x="611" y="198">domain.</text>
    <text class="dns-resolution-path-edge" x="611" y="242">~20 ms</text>
  </g>
  <line class="dns-resolution-path-line dns-resolution-path-conn dns-resolution-path-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#dns-resolution-path-tip)"/>
  <g class="dns-resolution-path-stage dns-resolution-path-s4">
    <rect class="dns-resolution-path-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="dns-resolution-path-step" x="800" y="142">05</text>
    <text class="dns-resolution-path-name" x="826" y="142">Authoritative</text>
    <text class="dns-resolution-path-desc" x="800" y="166">The definitive answer,</text>
    <text class="dns-resolution-path-desc" x="800" y="182">with a time-to-live</text>
    <text class="dns-resolution-path-desc" x="800" y="198">attached.</text>
    <text class="dns-resolution-path-edge" x="800" y="242">~20 ms</text>
  </g>
  <text class="dns-resolution-path-sub" x="30" y="304">The TTL decides how long everyone above may reuse the answer — which is why a DNS change takes time to reach everybody.</text>
</svg>
