<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Usually this is instant, because almost every step is cached.">
  <title>Turning a name into an address</title>
  <style>
    .dns-resolution-path-bg   { fill: #f8fafc; }
    .dns-resolution-path-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-resolution-path-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dns-resolution-path-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dns-resolution-path-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dns-resolution-path-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dns-resolution-path-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dns-resolution-path-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .dns-resolution-path-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .dns-resolution-path-tok { animation: dns-resolution-path-travel 7s ease-in-out infinite; }
    }
    @keyframes dns-resolution-path-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--dns-resolution-path-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dns-resolution-path-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="dns-resolution-path-bg" width="980" height="334"/>
  <text class="dns-resolution-path-h1"  x="30" y="40">Turning a name into an address</text>
  <text class="dns-resolution-path-sub" x="30" y="64">Usually this is instant, because almost every step is cached.</text>
  <rect class="dns-resolution-path-hi" x="30" y="132" width="166" height="96" rx="9"/>
  <text class="dns-resolution-path-name" x="44" y="160">Local cache</text>
  <text class="dns-resolution-path-desc" x="44" y="182">Your machine may already</text>
  <text class="dns-resolution-path-desc" x="44" y="198">know the answer.</text>
  <text class="dns-resolution-path-edge" x="44" y="248">0 ms</text>
  <line class="dns-resolution-path-line" x1="199" y1="180" x2="215" y2="180"/>
  <rect class="dns-resolution-path-box" x="218" y="132" width="166" height="96" rx="9"/>
  <text class="dns-resolution-path-name" x="232" y="160">Resolver cache</text>
  <text class="dns-resolution-path-desc" x="232" y="182">Your ISP or company</text>
  <text class="dns-resolution-path-desc" x="232" y="198">resolver may know it.</text>
  <text class="dns-resolution-path-edge" x="232" y="248">~1 ms</text>
  <line class="dns-resolution-path-line" x1="387" y1="180" x2="403" y2="180"/>
  <rect class="dns-resolution-path-box" x="406" y="132" width="166" height="96" rx="9"/>
  <text class="dns-resolution-path-name" x="420" y="160">Root servers</text>
  <text class="dns-resolution-path-desc" x="420" y="182">They do not know, but</text>
  <text class="dns-resolution-path-desc" x="420" y="198">they know who handles</text>
  <text class="dns-resolution-path-desc" x="420" y="214">.com.</text>
  <text class="dns-resolution-path-edge" x="420" y="248">~20 ms</text>
  <line class="dns-resolution-path-line" x1="575" y1="180" x2="591" y2="180"/>
  <rect class="dns-resolution-path-box" x="594" y="132" width="166" height="96" rx="9"/>
  <text class="dns-resolution-path-name" x="608" y="160">TLD servers</text>
  <text class="dns-resolution-path-desc" x="608" y="182">They know which servers</text>
  <text class="dns-resolution-path-desc" x="608" y="198">are authoritative for the</text>
  <text class="dns-resolution-path-desc" x="608" y="214">domain.</text>
  <text class="dns-resolution-path-edge" x="608" y="248">~20 ms</text>
  <line class="dns-resolution-path-line" x1="763" y1="180" x2="779" y2="180"/>
  <rect class="dns-resolution-path-box" x="782" y="132" width="166" height="96" rx="9"/>
  <text class="dns-resolution-path-name" x="796" y="160">Authoritative</text>
  <text class="dns-resolution-path-desc" x="796" y="182">The definitive answer,</text>
  <text class="dns-resolution-path-desc" x="796" y="198">with a time-to-live</text>
  <text class="dns-resolution-path-desc" x="796" y="214">attached.</text>
  <text class="dns-resolution-path-edge" x="796" y="248">~20 ms</text>
  <rect class="dns-resolution-path-tok" x="34" y="106" width="58" height="14" rx="3" style="--dns-resolution-path-run: 752px"/>
  <text class="dns-resolution-path-sub" x="30" y="314">The TTL decides how long everyone above may reuse the answer — which is why a DNS change takes time to reach everybody.</text>
</svg>
