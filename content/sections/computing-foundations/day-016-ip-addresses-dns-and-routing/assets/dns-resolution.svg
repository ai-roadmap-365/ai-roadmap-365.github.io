<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>How a resolver walks the DNS hierarchy from root to TLD to authoritative server, then caches the answer</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Resolving example.com through the DNS hierarchy</text>

  <!-- Your computer -->
  <rect x="30" y="70" width="150" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="105" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Your computer</text>
  <text x="105" y="118" text-anchor="middle" font-size="14" fill="#1a202c">"address for</text>
  <text x="105" y="134" text-anchor="middle" font-size="14" fill="#1a202c">example.com?"</text>

  <!-- Resolver -->
  <rect x="280" y="70" width="200" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Recursive resolver</text>
  <text x="380" y="118" text-anchor="middle" font-size="14" fill="#1a202c">walks the hierarchy,</text>
  <text x="380" y="134" text-anchor="middle" font-size="14" fill="#1a202c">then caches the answer</text>

  <!-- Arrow computer -> resolver -->
  <line x1="180" y1="102" x2="272" y2="102" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="280,102 266,95 266,109" fill="#1d4ed8"/>

  <!-- Hierarchy boxes -->
  <rect x="560" y="70" width="170" height="58" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="645" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. Root server</text>
  <text x="645" y="114" text-anchor="middle" font-size="14" fill="#1a202c">"ask the .com servers"</text>

  <rect x="560" y="160" width="170" height="58" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="645" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. .com TLD server</text>
  <text x="645" y="204" text-anchor="middle" font-size="14" fill="#1a202c">"ask example.com's</text>

  <rect x="560" y="250" width="170" height="72" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="645" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. Authoritative</text>
  <text x="645" y="292" text-anchor="middle" font-size="14" fill="#1a202c">server for the domain</text>
  <text x="645" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">A → 93.184.216.34</text>

  <!-- Arrows resolver -> each level -->
  <line x1="480" y1="99" x2="552" y2="99" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="560,99 546,92 546,106" fill="#1d4ed8"/>
  <line x1="480" y1="120" x2="540" y2="189" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="560,189 543,185 550,172" fill="#1d4ed8"/>
  <line x1="480" y1="128" x2="540" y2="280" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="560,286 549,272 542,285" fill="#1d4ed8"/>

  <!-- Answer back -->
  <rect x="280" y="250" width="200" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. Answer returned</text>
  <text x="380" y="298" text-anchor="middle" font-size="14" fill="#1a202c">93.184.216.34 (with TTL)</text>

  <line x1="645" y1="322" x2="645" y2="360" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="645" y1="360" x2="380" y2="360" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="380" y1="360" x2="380" y2="322" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="380,314 373,328 387,328" fill="#1d4ed8"/>

  <line x1="280" y1="282" x2="188" y2="282" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="180,282 194,275 194,289" fill="#1d4ed8"/>

  <!-- Caching note -->
  <rect x="30" y="390" width="700" height="58" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Caching</text>
  <text x="380" y="434" text-anchor="middle" font-size="14" fill="#1a202c">Every answer carries a TTL; the resolver serves it from cache until it expires, so repeat lookups skip the walk.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}.dx-f5{animation-delay:2.10s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 480 99 L 552 99" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 180 102 L 272 102" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 480 120 L 540 189" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 480 128 L 540 280" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 280 282 L 188 282" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 380 360 L 380 322" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
