<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One asks the questions. One holds the answers.">
  <title>Two very different kinds of DNS server</title>
  <style>
    .resolver-versus-authoritative-bg   { fill: #f8fafc; }
    .resolver-versus-authoritative-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resolver-versus-authoritative-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resolver-versus-authoritative-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resolver-versus-authoritative-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resolver-versus-authoritative-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resolver-versus-authoritative-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resolver-versus-authoritative-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .resolver-versus-authoritative-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .resolver-versus-authoritative-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .resolver-versus-authoritative-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .resolver-versus-authoritative-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .resolver-versus-authoritative-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resolver-versus-authoritative-row { opacity: 1; }
    .resolver-versus-authoritative-r0 { animation-delay: 0.00s; }
    .resolver-versus-authoritative-r1 { animation-delay: 0.45s; }
    .resolver-versus-authoritative-r2 { animation-delay: 0.90s; }
    .resolver-versus-authoritative-r3 { animation-delay: 1.35s; }
    .resolver-versus-authoritative-r4 { animation-delay: 1.80s; }
    .resolver-versus-authoritative-row { animation: resolver-versus-authoritative-reveal 7.3s ease-in-out infinite; }
    @keyframes resolver-versus-authoritative-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="resolver-versus-authoritative-bg" width="980" height="390"/>
  <text class="resolver-versus-authoritative-h1"  x="30" y="40">Two very different kinds of DNS server</text>
  <text class="resolver-versus-authoritative-sub" x="30" y="64">One asks the questions. One holds the answers.</text>
  <rect class="resolver-versus-authoritative-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="resolver-versus-authoritative-name" x="46" y="122">Recursive resolver</text>
  <text class="resolver-versus-authoritative-desc" x="46" y="142">Does the legwork for you.</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r0" x="46" y="182">Run by your ISP, or 1.1.1.1 / 8.8.8.8</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r1" x="46" y="216">Stores nothing of its own — only a cache</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r2" x="46" y="250">Walks the hierarchy on your behalf</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r3" x="46" y="284">Sees every name you look up</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r4" x="46" y="318">You choose which one to use</text>
  <rect class="resolver-versus-authoritative-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="resolver-versus-authoritative-name" x="526" y="122">Authoritative server</text>
  <text class="resolver-versus-authoritative-desc" x="526" y="142">Holds the real records.</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r0" x="526" y="182">Run by you, or your DNS provider</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r1" x="526" y="216">The source of truth for one domain</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r2" x="526" y="250">Answers only about domains it owns</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r3" x="526" y="284">Named in the domain's NS records</text>
  <text class="resolver-versus-authoritative-desc resolver-versus-authoritative-row resolver-versus-authoritative-r4" x="526" y="318">This is what you edit to deploy</text>
  <text class="resolver-versus-authoritative-sub" x="30" y="372">"DNS is broken" nearly always means one specific resolver is, or one specific authoritative server is. There is no single system to fail.</text>
</svg>
