id: D016
day: 16
slug: ip-addresses-dns-and-routing
title: 'IP Addresses, DNS, and Routing'
section: computing-foundations
subsection: networks-and-the-internet
week: 3
learning_promise: 'After this lesson you will be able to explain how a machine is addressed, how a name is turned into that address by DNS, and how packets are routed to it — and to diagnose the two most common "can''t reach the server" failures by hand with dig, ping, and traceroute.'
objectives:
  - 'Describe IPv4 dotted-quad and IPv6 addresses, the IPv4 address-exhaustion story, and why IPv6 was created'
  - 'Distinguish public from private address ranges (10.x, 172.16.x, 192.168.x) and the loopback 127.0.0.1, and read CIDR notation at an intuitive level'
  - 'Explain the DNS hierarchy — root, TLD, and authoritative servers — and the role of recursive resolvers, caching, and TTL'
  - 'Identify the common DNS record types (A, AAAA, CNAME, MX, TXT) and explain why a CNAME requires a second lookup'
  - 'Explain how packets are routed hop by hop between routers and, at a high level, how BGP and autonomous systems stitch networks together'
  - 'Use dig, nslookup, traceroute, whois, and ping to resolve names, inspect records, and trace the path to a host'
  - 'Diagnose whether a connection failure is a naming (DNS) problem or a reachability (routing) problem'
prerequisites:
  - 'Day 15 — What Happens When You Load a Web Page (the end-to-end request overview this lesson zooms into)'
  - 'Comfort running commands in a terminal (Days 8–14)'
  - 'A computer with a network connection and the dig/traceroute tools (installation covered in the lab)'
reading_time_minutes: 40
practical_time_minutes: 30
