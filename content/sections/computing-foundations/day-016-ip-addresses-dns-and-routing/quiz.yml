questions:
  - question: 'What is an IP address, and what is it primarily used for?'
    options:
      - 'A human-friendly name that the network routes traffic by directly'
      - 'A password that authenticates a machine to the network'
      - 'A permanent serial number burned into a device at the factory'
      - 'A numeric identifier for a network interface that routers use to deliver packets'
    answer_index: 3
    explanation: 'An IP address is a numeric location on the network that routers use to forward packets. It is not a permanent device identity — addresses are reassigned, shared behind NAT, and change when a device moves networks.'

  - question: 'A recursive resolver has never seen a name before. Which order does it query the DNS hierarchy?'
    options:
      - 'Root server, then TLD server, then authoritative server'
      - 'TLD server, then root server, then authoritative server'
      - 'Authoritative server, then TLD server, then root server'
      - 'It asks all three at once and takes the fastest reply'
    answer_index: 0
    explanation: 'The resolver asks a root server which servers handle the TLD (e.g. .com), then asks a TLD server which servers are authoritative for the domain, then asks an authoritative server for the actual record. Each step returns a referral until the last one returns the answer.'

  - question: 'What is the key difference between an A record and a CNAME record?'
    options:
      - 'An A record is for IPv4 and a CNAME is for IPv6'
      - 'An A record maps to an IP; a CNAME points to another name'
      - 'A CNAME maps a name to an IP address; an A record points to another name'
      - 'They are identical; CNAME is just an older spelling of A'
    answer_index: 1
    explanation: 'An A record ends in an actual IPv4 address. A CNAME is an alias that points to a different name, so the resolver must perform a second lookup on that name to eventually reach an address. (AAAA is the record type for IPv6 addresses.)'

  - question: 'Which of these addresses is a private address that cannot be reached from the public internet?'
    options:
      - '93.184.216.34'
      - '8.8.8.8'
      - '192.168.1.10'
      - '1.1.1.1'
    answer_index: 2
    explanation: '192.168.0.0/16 is one of the RFC 1918 private ranges (along with 10.0.0.0/8 and 172.16.0.0/12), usable only inside a local network. The other three are public, globally routable addresses.'

  - question: 'What does the TTL on a DNS record control?'
    options:
      - 'How many routers a packet may cross before being discarded'
      - 'How many times the record may be queried per second'
      - 'The maximum size in bytes of the DNS response'
      - 'How long a resolver may serve the answer from cache'
    answer_index: 3
    explanation: 'A DNS record''s TTL (time to live) is how many seconds a resolver may cache and reuse the answer before it must re-query. This is why the second lookup of a name is fast, and why a record change can take time to take effect everywhere.'

  - question: 'Why was IPv6 created?'
    options:
      - 'IPv4''s 32-bit address space was running out'
      - 'IPv4 could not represent domain names, only numbers'
      - 'IPv6 replaced DNS with a simpler naming scheme'
      - 'IPv4 was too slow to route packets quickly enough'
    answer_index: 0
    explanation: 'IPv4 has 32-bit addresses — about 4.3 billion — which the growth of the internet exhausted (the central pool ran out in 2011). IPv6 uses 128-bit addresses, an effectively unlimited space, and now runs alongside IPv4.'

  - question: 'How does a router decide where to send a packet?'
    options:
      - 'It knows the complete path to every machine on the internet in advance'
      - 'It reads the destination, picks the best next hop, and forwards'
      - 'It asks a central internet switchboard for directions'
      - 'It sends the packet to every neighbor and lets them sort it out'
    answer_index: 1
    explanation: 'Each router makes one local decision: it reads the destination IP, looks up the best next hop in its routing table, and forwards the packet one step closer. No router holds a map of the whole internet — a workable path emerges from many local decisions.'

  - question: 'A service "can''t be reached." You run `dig +short A the-host` and get a correct, expected IP address. What does this tell you?'
    options:
      - 'The problem is definitely inside the application code'
      - 'The DNS record is wrong and must be fixed first'
      - 'DNS works, so suspect routing, a firewall, or the service itself'
      - 'Nothing useful; the command cannot help diagnose connection issues'
    answer_index: 2
    explanation: 'A correct resolution rules out DNS as the cause. The next step is to test reachability with ping and traceroute to see whether packets get to the destination and where they stop. Separating "wrong address" from "can''t reach the address" is the core networking-debugging habit.'
