questions:
  - question: 'Which tool rewrites your code''s layout — indentation, spacing, quote style — without changing what the code does?'
    options:
      - 'A debugger'
      - 'A formatter'
      - 'A linter'
      - 'A type checker'
    answer_index: 1
    explanation: 'A formatter regenerates the layout from the code''s meaning, producing one consistent style while leaving behavior untouched. It does not judge correctness — a broken program is formatted just as happily as a correct one.'

  - question: 'What does it mean that a linter performs "static analysis"?'
    options:
      - 'It analyzes the program only after it has finished running'
      - 'It measures how fast the program runs'
      - 'It inspects the source without running it, against rules'
      - 'It formats the code so it never changes again'
    answer_index: 2
    explanation: '"Static" means the program sits still on disk rather than executing. A linter parses the source and checks it against rules — unused variables, unquoted values, unreachable branches — catching likely bugs before the code ever runs.'

  - question: 'In a debugger, what is the difference between "step over" and "step into" at a line that calls a function?'
    options:
      - '"Step over" skips the line entirely; "step into" runs it twice'
      - '"Step over" restarts the program; "step into" ends it'
      - 'They are two names for the same command'
      - 'Step over runs the call as one step; step into descends into it'
    answer_index: 3
    explanation: 'Step over treats a function call as one step, running it and stopping at the next line in the current function. Step into descends into the called function so you can debug its inner lines. Step out then finishes a function and returns to its caller.'

  - question: 'A shell script passes `bash -n` (the syntax check) but ShellCheck still reports an unquoted variable. How can both be true?'
    options:
      - 'Valid syntax only means it parses; a linter flags bad behavior'
      - 'The syntax check is broken and should be ignored'
      - 'ShellCheck is wrong because valid syntax means correct behavior'
      - 'The script must be run first for either check to apply'
    answer_index: 0
    explanation: '`bash -n` only confirms the shell can parse the script. An unquoted variable is perfectly valid syntax but a real bug — it word-splits or breaks on empty or spaced values. The linter catches this class of behavioral problem that a syntax check cannot.'

  - question: 'What does the call stack show you when a debugger pauses deep inside a helper function?'
    options:
      - 'The list of every variable in the program'
      - 'The ordered chain of calls that led to the current line'
      - 'A history of every keystroke you have typed'
      - 'The formatted version of the source file'
    answer_index: 1
    explanation: 'The call stack is the sequence of active function calls, with the current function on top and its caller beneath, all the way down. It tells you how execution reached this point, and you can move up and down it to inspect each caller''s variables.'

  - question: 'When is logging (a print statement) usually a better choice than an interactive debugger?'
    options:
      - 'When you can reproduce a bug on demand and want to explore it'
      - 'Never — a debugger is always better'
      - 'For rare events, production, or a durable record'
      - 'Only when the code has no functions'
    answer_index: 2
    explanation: 'A debugger shines for reproducible bugs you can trigger and explore live. Logging wins for rare or hard-to-reproduce events, production systems where attaching a debugger is impractical, and cases where you want a permanent trace to consult later.'

  - question: 'Which statement about formatters and linters is correct?'
    options:
      - 'A formatter judges whether your code is correct; a linter only changes spacing'
      - 'They are interchangeable and do exactly the same thing'
      - 'Both tools run the program to see what it does'
      - 'A formatter changes layout; a linter flags likely bugs'
    answer_index: 3
    explanation: 'The division of labor is the key idea: a formatter owns appearance (layout only), while a linter judges patterns and likely bugs. A linter can occasionally flag something you did on purpose — a false positive — which a formatter, being purely mechanical about layout, cannot.'

  - question: 'Why do teams run the same linter and formatter in CI that developers already run locally?'
    options:
      - 'The local run helps you; the CI run guarantees it for everyone'
      - 'CI runs are faster than local runs, so local runs are pointless'
      - 'CI uses entirely different rules to catch different bugs'
      - 'It is required only for projects written in C'
    answer_index: 0
    explanation: 'The editor loop gives you fast private feedback, but only an automated CI gate guarantees that every change — across many contributors and thousands of commits — meets the standard. Running identical tools in both places means what you see locally is exactly what the gate enforces.'
