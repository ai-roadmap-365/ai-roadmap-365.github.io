<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="This is the entire economic argument for every tool today.">
  <title>The same defect, five places</title>
  <style>
    .cost-of-late-detection-bg   { fill: #f8fafc; }
    .cost-of-late-detection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-of-late-detection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-of-late-detection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-of-late-detection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-of-late-detection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-of-late-detection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-of-late-detection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-of-late-detection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-of-late-detection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-of-late-detection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-of-late-detection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-of-late-detection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-of-late-detection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-of-late-detection-stage { opacity: 1; }

    .cost-of-late-detection-s0 { animation-delay: 0.00s; }
    .cost-of-late-detection-e0 { animation-delay: 0.00s; }
    .cost-of-late-detection-s1 { animation-delay: 1.33s; }
    .cost-of-late-detection-e1 { animation-delay: 1.33s; }
    .cost-of-late-detection-s2 { animation-delay: 2.67s; }
    .cost-of-late-detection-e2 { animation-delay: 2.67s; }
    .cost-of-late-detection-s3 { animation-delay: 4.00s; }
    .cost-of-late-detection-e3 { animation-delay: 4.00s; }
    .cost-of-late-detection-s4 { animation-delay: 5.33s; }
    .cost-of-late-detection-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-of-late-detection-conn  { animation: cost-of-late-detection-trace 8s ease-in-out infinite; }
      .cost-of-late-detection-stage { animation: cost-of-late-detection-arrive 8s ease-in-out infinite; }
    }
    @keyframes cost-of-late-detection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-of-late-detection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-of-late-detection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-of-late-detection-stage { animation: cost-of-late-detection-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-of-late-detection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-of-late-detection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-of-late-detection-bg" width="980" height="322"/>
  <text class="cost-of-late-detection-h1"  x="30" y="40">The same defect, five places</text>
  <text class="cost-of-late-detection-sub" x="30" y="64">This is the entire economic argument for every tool today.</text>
  <g class="cost-of-late-detection-stage cost-of-late-detection-s0">
    <rect class="cost-of-late-detection-good" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="cost-of-late-detection-step" x="44" y="142">01</text>
    <text class="cost-of-late-detection-name" x="70" y="142">While typing</text>
    <text class="cost-of-late-detection-desc" x="44" y="166">A red underline. You fix</text>
    <text class="cost-of-late-detection-desc" x="44" y="182">it before finishing the</text>
    <text class="cost-of-late-detection-desc" x="44" y="198">line.</text>
    <text class="cost-of-late-detection-edge" x="44" y="242">seconds</text>
  </g>
  <line class="cost-of-late-detection-line cost-of-late-detection-conn cost-of-late-detection-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#cost-of-late-detection-tip)"/>
  <g class="cost-of-late-detection-stage cost-of-late-detection-s1">
    <rect class="cost-of-late-detection-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="cost-of-late-detection-step" x="233" y="142">02</text>
    <text class="cost-of-late-detection-name" x="259" y="142">On save or commit</text>
    <text class="cost-of-late-detection-desc" x="233" y="166">A formatter or a hook.</text>
    <text class="cost-of-late-detection-desc" x="233" y="182">Still entirely private.</text>
    <text class="cost-of-late-detection-edge" x="233" y="242">seconds</text>
  </g>
  <line class="cost-of-late-detection-line cost-of-late-detection-conn cost-of-late-detection-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#cost-of-late-detection-tip)"/>
  <g class="cost-of-late-detection-stage cost-of-late-detection-s2">
    <rect class="cost-of-late-detection-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="cost-of-late-detection-step" x="422" y="142">03</text>
    <text class="cost-of-late-detection-name" x="448" y="142">In CI</text>
    <text class="cost-of-late-detection-desc" x="422" y="166">A failed check. A context</text>
    <text class="cost-of-late-detection-desc" x="422" y="182">switch, and a push to</text>
    <text class="cost-of-late-detection-desc" x="422" y="198">fix.</text>
    <text class="cost-of-late-detection-edge" x="422" y="242">minutes</text>
  </g>
  <line class="cost-of-late-detection-line cost-of-late-detection-conn cost-of-late-detection-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#cost-of-late-detection-tip)"/>
  <g class="cost-of-late-detection-stage cost-of-late-detection-s3">
    <rect class="cost-of-late-detection-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="cost-of-late-detection-step" x="611" y="142">04</text>
    <text class="cost-of-late-detection-name" x="637" y="142">In review</text>
    <text class="cost-of-late-detection-desc" x="611" y="166">A reviewer's time, plus</text>
    <text class="cost-of-late-detection-desc" x="611" y="182">yours, plus a round trip.</text>
    <text class="cost-of-late-detection-edge" x="611" y="242">hours</text>
  </g>
  <line class="cost-of-late-detection-line cost-of-late-detection-conn cost-of-late-detection-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#cost-of-late-detection-tip)"/>
  <g class="cost-of-late-detection-stage cost-of-late-detection-s4">
    <rect class="cost-of-late-detection-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="cost-of-late-detection-step" x="800" y="142">05</text>
    <text class="cost-of-late-detection-name" x="826" y="142">In production</text>
    <text class="cost-of-late-detection-desc" x="800" y="166">An incident, a rollback,</text>
    <text class="cost-of-late-detection-desc" x="800" y="182">and everyone who used it</text>
    <text class="cost-of-late-detection-desc" x="800" y="198">meanwhile.</text>
    <text class="cost-of-late-detection-edge" x="800" y="242">days</text>
  </g>
  <text class="cost-of-late-detection-sub" x="30" y="304">Every tool in this lesson is a bet that moving detection leftward is worth its setup cost. Across five orders of magnitude, it is not a close bet.</text>
</svg>
