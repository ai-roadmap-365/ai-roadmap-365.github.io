<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" font-family="system-ui, sans-serif">
  <title>The code-quality pipeline: write, format, lint, type-check, debug, then commit — where catching issues earlier is cheaper</title>
  <rect x="0" y="0" width="820" height="340" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The code-quality pipeline</text>
  <text x="410" y="60" text-anchor="middle" font-size="14" fill="#1a202c">Each stage catches a different kind of problem before the next one runs.</text>

  <!-- Stage boxes -->
  <rect x="24" y="92" width="118" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="83" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Write</text>
  <text x="83" y="146" text-anchor="middle" font-size="13" fill="#1a202c">you type code</text>

  <rect x="166" y="92" width="118" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="225" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Format</text>
  <text x="225" y="140" text-anchor="middle" font-size="13" fill="#1a202c">consistent</text>
  <text x="225" y="156" text-anchor="middle" font-size="13" fill="#1a202c">layout</text>

  <rect x="308" y="92" width="118" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="367" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Lint</text>
  <text x="367" y="140" text-anchor="middle" font-size="13" fill="#1a202c">bad patterns,</text>
  <text x="367" y="156" text-anchor="middle" font-size="13" fill="#1a202c">likely bugs</text>

  <rect x="450" y="92" width="118" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="509" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Type-check</text>
  <text x="509" y="140" text-anchor="middle" font-size="13" fill="#1a202c">kinds of</text>
  <text x="509" y="156" text-anchor="middle" font-size="13" fill="#1a202c">values fit</text>

  <rect x="592" y="92" width="118" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="651" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Debug</text>
  <text x="651" y="140" text-anchor="middle" font-size="13" fill="#1a202c">runtime</text>
  <text x="651" y="156" text-anchor="middle" font-size="13" fill="#1a202c">problems</text>

  <rect x="734" y="92" width="62" height="72" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="765" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Commit</text>
  <text x="765" y="146" text-anchor="middle" font-size="13" fill="#1a202c">ship it</text>

  <!-- Arrows between stages -->
  <g stroke="#1d4ed8" stroke-width="3" fill="#1d4ed8">
    <line x1="142" y1="128" x2="160" y2="128"/><polygon points="166,128 154,122 154,134"/>
    <line x1="284" y1="128" x2="302" y2="128"/><polygon points="308,128 296,122 296,134"/>
    <line x1="426" y1="128" x2="444" y2="128"/><polygon points="450,128 438,122 438,134"/>
    <line x1="568" y1="128" x2="586" y2="128"/><polygon points="592,128 580,122 580,134"/>
    <line x1="710" y1="128" x2="728" y2="128"/><polygon points="734,128 722,122 722,134"/>
  </g>

  <!-- Cost gradient bar -->
  <rect x="24" y="214" width="772" height="30" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="40" y="234" text-anchor="start" font-size="14" font-weight="bold" fill="#1a202c">cheap to fix</text>
  <text x="780" y="234" text-anchor="end" font-size="14" font-weight="bold" fill="#1a202c">expensive to fix</text>
  <g stroke="#1d4ed8" stroke-width="3" fill="#1d4ed8">
    <line x1="360" y1="229" x2="470" y2="229"/><polygon points="476,229 464,223 464,235"/>
  </g>

  <text x="410" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Catching an issue earlier — further left — costs far less than catching it later.</text>
  <text x="410" y="312" text-anchor="middle" font-size="13" fill="#1a202c">The same tools run in your editor as you type and again in CI on every change.</text>
</svg>
