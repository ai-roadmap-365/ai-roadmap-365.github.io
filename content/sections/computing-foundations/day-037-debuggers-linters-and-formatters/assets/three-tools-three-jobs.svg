<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Arguing about the first is how teams avoid doing the other two.">
  <title>Formatter, linter, debugger — three different questions</title>
  <style>
    .three-tools-three-jobs-bg   { fill: #f8fafc; }
    .three-tools-three-jobs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-three-jobs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-three-jobs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-three-jobs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-three-jobs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-three-jobs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-tools-three-jobs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-tools-three-jobs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-tools-three-jobs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-tools-three-jobs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-tools-three-jobs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-tools-three-jobs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-tools-three-jobs-row { opacity: 1; }
    .three-tools-three-jobs-r0 { animation-delay: 0.00s; }
    .three-tools-three-jobs-r1 { animation-delay: 0.45s; }
    .three-tools-three-jobs-r2 { animation-delay: 0.90s; }
    .three-tools-three-jobs-r3 { animation-delay: 1.35s; }
    .three-tools-three-jobs-r4 { animation-delay: 1.80s; }
    .three-tools-three-jobs-row { animation: three-tools-three-jobs-reveal 7.3s ease-in-out infinite; }
    @keyframes three-tools-three-jobs-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="three-tools-three-jobs-bg" width="980" height="390"/>
  <text class="three-tools-three-jobs-h1"  x="30" y="40">Formatter, linter, debugger — three different questions</text>
  <text class="three-tools-three-jobs-sub" x="30" y="64">Arguing about the first is how teams avoid doing the other two.</text>
  <rect class="three-tools-three-jobs-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="three-tools-three-jobs-name" x="46" y="122">Read the code, do not run it</text>
  <text class="three-tools-three-jobs-desc" x="46" y="142">Formatter and linter</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r0" x="46" y="182">Formatter: changes layout only, never meaning</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r1" x="46" y="216">Nothing to argue about — pick one, commit it</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r2" x="46" y="250">Linter: flags likely bugs and bad patterns</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r3" x="46" y="284">Catches the mutable default, the unused name</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r4" x="46" y="318">Both run in CI on every change</text>
  <rect class="three-tools-three-jobs-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="three-tools-three-jobs-name" x="526" y="122">Run the code, inspect it</text>
  <text class="three-tools-three-jobs-desc" x="526" y="142">Debugger</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r0" x="526" y="182">Stops the program and shows you real values</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r1" x="526" y="216">What shape IS this batch, actually</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r2" x="526" y="250">Are the labels aligned with the inputs</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r3" x="526" y="284">Is this tensor on the device I think</text>
  <text class="three-tools-three-jobs-desc three-tools-three-jobs-row three-tools-three-jobs-r4" x="526" y="318">The questions logging cannot answer</text>
  <text class="three-tools-three-jobs-sub" x="30" y="372">Machine-learning failures are quiet: a shape mismatch raises, a silently broadcast tensor does not.</text>
</svg>
