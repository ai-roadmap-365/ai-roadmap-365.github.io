visuals:
  - id: quality-pipeline
    file: assets/quality-pipeline.svg
    type: flowchart
    title: 'The code-quality pipeline'
    alt: 'Flow diagram: the code-quality pipeline from writing to committing, catching issues earlier where they are cheaper to fix'
    description: 'A left-to-right flow — write, format, lint, type-check, debug, commit — above a cost gradient showing that a defect caught earlier (further left) is far cheaper to fix than one caught later, with a note that the same tools run in the editor and again in CI.'
  - id: debugger-anatomy
    file: assets/debugger-anatomy.svg
    type: diagram
    title: 'Anatomy of a debugger session'
    alt: 'Architecture diagram: the anatomy of a debugger session, showing the paused program, breakpoint, call stack, variables panel, and step controls'
    description: 'A paused debugger session with a source panel marking a breakpoint and the current line, a call stack panel listing the chain of function calls, a variables panel showing live values, and a row of step controls — continue, step over, step into, step out.'
  - id: three-tools-three-jobs
    file: assets/three-tools-three-jobs.svg
    type: diagram
    title: 'Formatter, linter, debugger — three different questions'
    alt: 'Diagram: what a formatter, a linter and a debugger each do'
    description: 'A two-column comparison separating the formatter and linter, which read code without running it, from the debugger, which inspects a running program.'
