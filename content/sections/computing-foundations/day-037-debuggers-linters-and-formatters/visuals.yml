visuals:
  - id: quality-pipeline
    file: assets/quality-pipeline.svg
    type: flowchart
    title: 'The code-quality pipeline'
    alt: 'Flow diagram: the code-quality pipeline from writing to committing, catching issues earlier where they are cheaper to fix'
    description: 'A left-to-right flow — write, format, lint, type-check, debug, commit — above a cost gradient showing that a defect caught earlier (further left) is far cheaper to fix than one caught later, with a note that the same tools run in the editor and again in CI.'
  - id: debugger-anatomy
    file: assets/debugger-anatomy.svg
    type: diagram
    title: 'Anatomy of a debugger session'
    alt: 'Architecture diagram: the anatomy of a debugger session, showing the paused program, breakpoint, call stack, variables panel, and step controls'
    description: 'A paused debugger session with a source panel marking a breakpoint and the current line, a call stack panel listing the chain of function calls, a variables panel showing live values, and a row of step controls — continue, step over, step into, step out.'
  - id: three-tools-three-jobs
    file: assets/three-tools-three-jobs.svg
    type: diagram
    title: 'Formatter, linter, debugger — three different questions'
    alt: 'Diagram: what a formatter, a linter and a debugger each do'
    description: 'A two-column comparison separating the formatter and linter, which read code without running it, from the debugger, which inspects a running program.'
  - id: cost-of-late-detection
    file: assets/cost-of-late-detection.svg
    type: diagram
    title: 'The same defect, five places'
    alt: 'Diagram: the cost of finding a defect at each stage'
    description: 'A five-stage progression showing the cost of detecting the same defect while typing, in a local check, in continuous integration, in review, and in production.'
  - id: parse-to-tree
    file: assets/parse-to-tree.svg
    type: diagram
    title: 'Why both tools start by parsing'
    alt: 'Diagram: how source code becomes a syntax tree for analysis'
    description: 'A four-stage sequence from raw source characters through parsing into a syntax tree, to a formatter regenerating layout and a linter walking the tree for patterns.'
  - id: debugger-versus-print
    file: assets/debugger-versus-print.svg
    type: diagram
    title: 'Why print debugging stops scaling'
    alt: 'Diagram: print debugging compared with a debugger'
    description: 'A two-column comparison of print-statement debugging against using a debugger, covering how many questions each answers per run and what state is visible.'
  - id: editor-and-ci
    file: assets/editor-and-ci.svg
    type: diagram
    title: 'The same tools, twice, on purpose'
    alt: 'Diagram: quality checks in the editor compared with in continuous integration'
    description: 'A two-column comparison of running quality tools in the editor against running them in continuous integration, covering speed, privacy and enforcement.'
  - id: opinionated-formatter
    file: assets/opinionated-formatter.svg
    type: diagram
    title: 'Why the best formatter has no options'
    alt: 'Diagram: a configurable formatter compared with an opinionated one'
    description: 'A two-column comparison of highly configurable formatters against opinionated ones with few or no settings, covering whether the formatting argument is actually ended.'
  - id: tools-versus-tests
    file: assets/tools-versus-tests.svg
    type: diagram
    title: 'What these tools cannot tell you'
    alt: 'Diagram: what static analysis catches compared with what tests catch'
    description: 'A two-column comparison of the defects static analysis can find against those only tests and runtime inspection can find.'
  - id: conditional-breakpoint
    file: assets/conditional-breakpoint.svg
    type: diagram
    title: 'Stopping on the one iteration that matters'
    alt: 'Diagram: using a conditional breakpoint to stop on a specific case'
    description: 'A four-stage sequence for debugging a failure that occurs in one iteration of many, using a conditional breakpoint rather than stepping through every case.'
  - id: three-tools-summary
    file: assets/three-tools-summary.svg
    type: diagram
    title: 'Which tool answers which question'
    alt: 'Diagram: the question each of the three tools answers'
    description: 'A four-stage reference pairing formatters, linters, type checkers and debuggers with the specific question each one answers about code.'
  - id: gradual-typing
    file: assets/gradual-typing.svg
    type: diagram
    title: 'Adding types to a codebase that has none'
    alt: 'Diagram: introducing a type checker to an existing codebase gradually'
    description: 'A four-stage strategy for adopting static type checking incrementally, module by module, rather than enabling strict checking across an entire existing codebase.'
