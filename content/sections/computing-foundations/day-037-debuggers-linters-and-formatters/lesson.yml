title: 'Debuggers, Linters, and Formatters'
section: computing-foundations
subsection: developer-workflow
week: 6
learning_promise: 'After this lesson you will be able to explain what debuggers, linters, and formatters each do, choose the right one for a given problem, and run a real quality pipeline — syntax check, lint, and format check — over a broken script.'
objectives:
  - 'Explain the distinct job of a formatter, a linter, and a type checker, and state which one changes your code''s layout'
  - 'Describe the core debugger controls — breakpoints, stepping (over, into, out), inspecting state, watch expressions, and the call stack — and what each reveals'
  - 'Decide when to reach for a debugger versus logging, based on whether a bug is reproducible and where it occurs'
  - 'Understand static analysis: how a linter catches bugs and bad patterns without running the code, and why passing lint is not the same as being correct'
  - 'Name the leading free tools for shell, JavaScript, and Python (ShellCheck, ESLint, Prettier, Ruff, Black, flake8) and say when to use each'
  - 'Explain how these tools fit an editor and a CI pipeline, and why catching issues earlier is cheaper'
  - 'Run bash -n, a lint pass, and a formatting check over a flawed script and interpret each finding'
prerequisites:
  - 'Day 36 (a configured code editor) and comfort running commands in a terminal'
  - 'Basic shell scripting from Week 2 (variables, if-tests, running a .sh file)'
reading_time_minutes: 40
practical_time_minutes: 30
