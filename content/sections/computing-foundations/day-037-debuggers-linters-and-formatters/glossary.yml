terms:
  - term: debugger
    definition: 'A tool that controls the execution of another program — starting it, pausing it at chosen points, and letting you inspect its live state — so you can watch exactly what the code does rather than guess.'
  - term: breakpoint
    definition: 'A marker on a line that tells the debugger to pause the program when execution reaches it; a conditional breakpoint pauses only when a condition you specify is true.'
  - term: step over
    definition: 'A debugger command that runs the next line and stops again, treating any function call on that line as a single step rather than descending into it.'
  - term: step into
    definition: 'A debugger command that descends into a function being called so you can watch its inner lines execute one at a time; its counterpart, step out, finishes the current function and returns to its caller.'
  - term: call stack
    definition: 'The ordered chain of function calls that led to the currently executing line — who called whom, with the current function on top — which you can navigate to inspect each caller''s variables.'
  - term: watch expression
    definition: 'A value or expression you ask the debugger to re-evaluate and display continuously as you step, so you can watch a single quantity change over the course of execution.'
  - term: linter
    definition: 'A static-analysis tool that reads source code without running it and reports likely bugs and bad patterns, such as unused variables or unquoted values, each with a file, line, and message.'
  - term: static analysis
    definition: 'Examining a program by reading its source code while it sits still on disk — without executing it — to find problems; the opposite of dynamic analysis, which observes a running program.'
  - term: formatter
    definition: 'A tool that rewrites code''s layout — indentation, spacing, line breaks, quote style — into one consistent style while leaving behavior unchanged; running it twice changes nothing the second time.'
  - term: type checker
    definition: 'A static tool that verifies the kinds of values fit together — that text is not passed where a number is required, or a possibly-missing value read as if present — without running the code.'
  - term: ShellCheck
    definition: 'A free, open-source linter for shell and Bash scripts that flags quoting, test-command, and portability bugs, each tagged with a rule code (such as SC2086) linking to an explanation.'
  - term: Debug Adapter Protocol (DAP)
    definition: 'A shared, open standard that lets a single editor debugging interface drive debuggers for many different languages through language-specific adapters.'
  - term: continuous integration (CI)
    definition: 'An automated system that runs checks — such as formatting and linting — on a shared server every time code is pushed, refusing changes that fail, so standards are enforced on every commit.'
