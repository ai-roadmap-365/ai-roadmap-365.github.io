id: D031
day: 31
slug: branching-and-merging
title: 'Branching and Merging'
section: computing-foundations
subsection: developer-workflow
week: 5
learning_promise: 'After this lesson you will be able to create and switch branches, merge them, resolve a merge conflict calmly, and explain when to merge versus rebase — the everyday loop for working on anything in parallel without breaking the version that works.'
objectives:
  - 'Explain what a branch is — a movable pointer to a commit — and why creating one in Git costs almost nothing'
  - 'Create and switch between branches with git branch and git switch (and the classic git checkout equivalents)'
  - 'Distinguish a fast-forward merge from a three-way merge and identify which occurred from the history graph'
  - 'Produce, read, and resolve a merge conflict: interpret the <<<<<<< / ======= / >>>>>>> markers, edit the file, and complete the merge with git add and git commit'
  - 'Explain rebasing at an intuitive level, compare it with merging, and state the golden rule of never rebasing shared history'
  - 'Apply branch hygiene — short, focused, short-lived branches deleted after merging — and read branch history with git log --graph'
prerequisites:
  - 'Day 30 (Git Fundamentals): comfortable with git init, git add, git commit, and git log'
  - 'A terminal with git installed (git --version prints a version)'
reading_time_minutes: 40
practical_time_minutes: 30
