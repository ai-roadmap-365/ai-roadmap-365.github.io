<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Conflict resolution is code, written under pressure.">
  <title>The change nobody reviews</title>
  <style>
    .merge-review-risk-bg   { fill: #f8fafc; }
    .merge-review-risk-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-review-risk-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-review-risk-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-review-risk-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-review-risk-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-review-risk-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-review-risk-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .merge-review-risk-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .merge-review-risk-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .merge-review-risk-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .merge-review-risk-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .merge-review-risk-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-review-risk-row { opacity: 1; }
    .merge-review-risk-r0 { animation-delay: 0.00s; }
    .merge-review-risk-r1 { animation-delay: 0.45s; }
    .merge-review-risk-r2 { animation-delay: 0.90s; }
    .merge-review-risk-r3 { animation-delay: 1.35s; }
    .merge-review-risk-r4 { animation-delay: 1.80s; }
    .merge-review-risk-row { animation: merge-review-risk-reveal 7.3s ease-in-out infinite; }
    @keyframes merge-review-risk-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="merge-review-risk-bg" width="980" height="390"/>
  <text class="merge-review-risk-h1"  x="30" y="40">The change nobody reviews</text>
  <text class="merge-review-risk-sub" x="30" y="64">Conflict resolution is code, written under pressure.</text>
  <rect class="merge-review-risk-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="merge-review-risk-name" x="46" y="122">An ordinary change</text>
  <text class="merge-review-risk-desc" x="46" y="142">Written and reviewed.</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r0" x="46" y="182">Written deliberately</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r1" x="46" y="216">Committed on its own</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r2" x="46" y="250">Appears in a diff someone reads</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r3" x="46" y="284">Discussed if it looks wrong</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r4" x="46" y="318">Tested before merging</text>
  <rect class="merge-review-risk-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="merge-review-risk-name" x="526" y="122">A conflict resolution</text>
  <text class="merge-review-risk-desc" x="526" y="142">Written to make the merge finish.</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r0" x="526" y="182">Written under time pressure</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r1" x="526" y="216">Buried inside a merge commit</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r2" x="526" y="250">Often invisible in a pull-request diff</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r3" x="526" y="284">Rarely questioned by anyone</text>
  <text class="merge-review-risk-desc merge-review-risk-row merge-review-risk-r4" x="526" y="318">And it can silently drop either side's work</text>
  <text class="merge-review-risk-sub" x="30" y="372">Review the merged result, not only the diff of your own changes. A merge can quietly reintroduce code someone deleted on another branch, including the reason they deleted it.</text>
</svg>
