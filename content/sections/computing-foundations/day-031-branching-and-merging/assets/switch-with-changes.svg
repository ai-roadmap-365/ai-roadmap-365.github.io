<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which surprises everyone exactly once.">
  <title>Uncommitted changes follow you across branches</title>
  <style>
    .switch-with-changes-bg   { fill: #f8fafc; }
    .switch-with-changes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .switch-with-changes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .switch-with-changes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .switch-with-changes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .switch-with-changes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .switch-with-changes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .switch-with-changes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .switch-with-changes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .switch-with-changes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .switch-with-changes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .switch-with-changes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .switch-with-changes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .switch-with-changes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .switch-with-changes-stage { opacity: 1; }

    .switch-with-changes-s0 { animation-delay: 0.00s; }
    .switch-with-changes-e0 { animation-delay: 0.00s; }
    .switch-with-changes-s1 { animation-delay: 1.28s; }
    .switch-with-changes-e1 { animation-delay: 1.28s; }
    .switch-with-changes-s2 { animation-delay: 2.56s; }
    .switch-with-changes-e2 { animation-delay: 2.56s; }
    .switch-with-changes-s3 { animation-delay: 3.84s; }
    .switch-with-changes-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .switch-with-changes-conn  { animation: switch-with-changes-trace 6.4s ease-in-out infinite; }
      .switch-with-changes-stage { animation: switch-with-changes-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes switch-with-changes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes switch-with-changes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .switch-with-changes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .switch-with-changes-stage { animation: switch-with-changes-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes switch-with-changes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="switch-with-changes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="switch-with-changes-bg" width="980" height="322"/>
  <text class="switch-with-changes-h1"  x="30" y="40">Uncommitted changes follow you across branches</text>
  <text class="switch-with-changes-sub" x="30" y="64">Which surprises everyone exactly once.</text>
  <g class="switch-with-changes-stage switch-with-changes-s0">
    <rect class="switch-with-changes-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="switch-with-changes-step" x="44" y="142">01</text>
    <text class="switch-with-changes-name" x="70" y="142">A branch is a pointer, not a folder</text>
    <text class="switch-with-changes-desc" x="44" y="166">Switching re-aims HEAD and</text>
    <text class="switch-with-changes-desc" x="44" y="182">rewrites the files in place.</text>
    <text class="switch-with-changes-desc" x="44" y="198">Same directory throughout.</text>
  </g>
  <line class="switch-with-changes-line switch-with-changes-conn switch-with-changes-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#switch-with-changes-tip)"/>
  <g class="switch-with-changes-stage switch-with-changes-s1">
    <rect class="switch-with-changes-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="switch-with-changes-step" x="280" y="142">02</text>
    <text class="switch-with-changes-name" x="306" y="142">So uncommitted edits come with you</text>
    <text class="switch-with-changes-desc" x="280" y="166">They belong to your working</text>
    <text class="switch-with-changes-desc" x="280" y="182">tree, not to any branch.</text>
    <text class="switch-with-changes-edge" x="280" y="242">they follow</text>
  </g>
  <line class="switch-with-changes-line switch-with-changes-conn switch-with-changes-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#switch-with-changes-tip)"/>
  <g class="switch-with-changes-stage switch-with-changes-s2">
    <rect class="switch-with-changes-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="switch-with-changes-step" x="516" y="142">03</text>
    <text class="switch-with-changes-name" x="542" y="142">Unless they conflict</text>
    <text class="switch-with-changes-desc" x="516" y="166">Then Git refuses the switch</text>
    <text class="switch-with-changes-desc" x="516" y="182">rather than silently overwriting</text>
    <text class="switch-with-changes-desc" x="516" y="198">your work.</text>
    <text class="switch-with-changes-edge" x="516" y="242">refused</text>
  </g>
  <line class="switch-with-changes-line switch-with-changes-conn switch-with-changes-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#switch-with-changes-tip)"/>
  <g class="switch-with-changes-stage switch-with-changes-s3">
    <rect class="switch-with-changes-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="switch-with-changes-step" x="752" y="142">04</text>
    <text class="switch-with-changes-name" x="778" y="142">Commit, or stash</text>
    <text class="switch-with-changes-desc" x="752" y="166">A commit if the work is</text>
    <text class="switch-with-changes-desc" x="752" y="182">coherent; git stash if it is not</text>
    <text class="switch-with-changes-desc" x="752" y="198">ready to be one.</text>
    <text class="switch-with-changes-edge" x="752" y="242">stash</text>
  </g>
  <text class="switch-with-changes-sub" x="30" y="304">The refusal is the safety feature. Git will not discard uncommitted work to complete a switch, which is why the error is a prompt to decide rather than a problem to route around.</text>
</svg>
