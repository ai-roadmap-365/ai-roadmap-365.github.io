<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Rebase private work. Merge anything public.">
  <title>The one Git rule worth memorising verbatim</title>
  <style>
    .rebase-golden-rule-bg   { fill: #f8fafc; }
    .rebase-golden-rule-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rebase-golden-rule-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rebase-golden-rule-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rebase-golden-rule-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rebase-golden-rule-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rebase-golden-rule-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rebase-golden-rule-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rebase-golden-rule-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rebase-golden-rule-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rebase-golden-rule-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rebase-golden-rule-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rebase-golden-rule-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rebase-golden-rule-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rebase-golden-rule-stage { opacity: 1; }

    .rebase-golden-rule-s0 { animation-delay: 0.00s; }
    .rebase-golden-rule-e0 { animation-delay: 0.00s; }
    .rebase-golden-rule-s1 { animation-delay: 1.28s; }
    .rebase-golden-rule-e1 { animation-delay: 1.28s; }
    .rebase-golden-rule-s2 { animation-delay: 2.56s; }
    .rebase-golden-rule-e2 { animation-delay: 2.56s; }
    .rebase-golden-rule-s3 { animation-delay: 3.84s; }
    .rebase-golden-rule-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rebase-golden-rule-conn  { animation: rebase-golden-rule-trace 6.4s ease-in-out infinite; }
      .rebase-golden-rule-stage { animation: rebase-golden-rule-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rebase-golden-rule-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rebase-golden-rule-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rebase-golden-rule-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rebase-golden-rule-stage { animation: rebase-golden-rule-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rebase-golden-rule-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rebase-golden-rule-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rebase-golden-rule-bg" width="980" height="322"/>
  <text class="rebase-golden-rule-h1"  x="30" y="40">The one Git rule worth memorising verbatim</text>
  <text class="rebase-golden-rule-sub" x="30" y="64">Rebase private work. Merge anything public.</text>
  <g class="rebase-golden-rule-stage rebase-golden-rule-s0">
    <rect class="rebase-golden-rule-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rebase-golden-rule-step" x="44" y="142">01</text>
    <text class="rebase-golden-rule-name" x="70" y="142">Rebase creates NEW commits</text>
    <text class="rebase-golden-rule-desc" x="44" y="166">Same changes, different</text>
    <text class="rebase-golden-rule-desc" x="44" y="182">identities. The originals are</text>
    <text class="rebase-golden-rule-desc" x="44" y="198">not moved — they are replaced.</text>
  </g>
  <line class="rebase-golden-rule-line rebase-golden-rule-conn rebase-golden-rule-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rebase-golden-rule-tip)"/>
  <g class="rebase-golden-rule-stage rebase-golden-rule-s1">
    <rect class="rebase-golden-rule-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rebase-golden-rule-step" x="280" y="142">02</text>
    <text class="rebase-golden-rule-name" x="306" y="142">On your own machine, that is fine</text>
    <text class="rebase-golden-rule-desc" x="280" y="166">Nobody else has the originals,</text>
    <text class="rebase-golden-rule-desc" x="280" y="182">so nobody notices they are gone.</text>
    <text class="rebase-golden-rule-edge" x="280" y="242">safe</text>
  </g>
  <line class="rebase-golden-rule-line rebase-golden-rule-conn rebase-golden-rule-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rebase-golden-rule-tip)"/>
  <g class="rebase-golden-rule-stage rebase-golden-rule-s2">
    <rect class="rebase-golden-rule-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rebase-golden-rule-step" x="516" y="142">03</text>
    <text class="rebase-golden-rule-name" x="542" y="142">Once pushed, others may have them</text>
    <text class="rebase-golden-rule-desc" x="516" y="166">Their work points at commits</text>
    <text class="rebase-golden-rule-desc" x="516" y="182">that are about to stop existing</text>
    <text class="rebase-golden-rule-desc" x="516" y="198">upstream.</text>
  </g>
  <line class="rebase-golden-rule-line rebase-golden-rule-conn rebase-golden-rule-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rebase-golden-rule-tip)"/>
  <g class="rebase-golden-rule-stage rebase-golden-rule-s3">
    <rect class="rebase-golden-rule-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rebase-golden-rule-step" x="752" y="142">04</text>
    <text class="rebase-golden-rule-name" x="778" y="142">Now the histories disagree</text>
    <text class="rebase-golden-rule-desc" x="752" y="166">Yours and theirs describe</text>
    <text class="rebase-golden-rule-desc" x="752" y="182">different pasts, and untangling</text>
    <text class="rebase-golden-rule-desc" x="752" y="198">it is genuinely painful.</text>
    <text class="rebase-golden-rule-edge" x="752" y="242">never</text>
  </g>
  <text class="rebase-golden-rule-sub" x="30" y="304">Rebase your private, unshared work to tidy it before review. Merge — never rebase — anything you have already pushed. That sentence is the whole rule.</text>
</svg>
