<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is why creating one is instant.">
  <title>A branch is a pointer, not a copy</title>
  <style>
    .branch-is-a-pointer-bg   { fill: #f8fafc; }
    .branch-is-a-pointer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-is-a-pointer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-is-a-pointer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-is-a-pointer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-is-a-pointer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-is-a-pointer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .branch-is-a-pointer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .branch-is-a-pointer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .branch-is-a-pointer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .branch-is-a-pointer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .branch-is-a-pointer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .branch-is-a-pointer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .branch-is-a-pointer-row { opacity: 1; }
    .branch-is-a-pointer-r0 { animation-delay: 0.00s; }
    .branch-is-a-pointer-r1 { animation-delay: 0.45s; }
    .branch-is-a-pointer-r2 { animation-delay: 0.90s; }
    .branch-is-a-pointer-r3 { animation-delay: 1.35s; }
    .branch-is-a-pointer-r4 { animation-delay: 1.80s; }
    .branch-is-a-pointer-row { animation: branch-is-a-pointer-reveal 7.3s ease-in-out infinite; }
    @keyframes branch-is-a-pointer-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="branch-is-a-pointer-bg" width="980" height="390"/>
  <text class="branch-is-a-pointer-h1"  x="30" y="40">A branch is a pointer, not a copy</text>
  <text class="branch-is-a-pointer-sub" x="30" y="64">Which is why creating one is instant.</text>
  <rect class="branch-is-a-pointer-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="branch-is-a-pointer-name" x="46" y="122">What people assume</text>
  <text class="branch-is-a-pointer-desc" x="46" y="142">A copy of the project.</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r0" x="46" y="182">Files duplicated somewhere</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r1" x="46" y="216">A separate folder to work in</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r2" x="46" y="250">Expensive to create</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r3" x="46" y="284">Something to be used sparingly</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r4" x="46" y="318">This WAS true before Git</text>
  <rect class="branch-is-a-pointer-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="branch-is-a-pointer-name" x="526" y="122">What it actually is</text>
  <text class="branch-is-a-pointer-desc" x="526" y="142">One line naming one commit.</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r0" x="526" y="182">Nothing is duplicated at all</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r1" x="526" y="216">Same directory; files change in place</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r2" x="526" y="250">Instant, whatever the project size</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r3" x="526" y="284">Cheap enough to make casually</text>
  <text class="branch-is-a-pointer-desc branch-is-a-pointer-row branch-is-a-pointer-r4" x="526" y="318">Which is why the culture changed</text>
  <text class="branch-is-a-pointer-sub" x="30" y="372">Centralised systems copied whole directory trees on the server, so branches were rare and heavyweight. Making a branch a pointer is the change that made the pull-request workflow possible.</text>
</svg>
