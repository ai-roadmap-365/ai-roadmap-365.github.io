<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Because abandoning one should cost nothing.">
  <title>A branch per experiment</title>
  <style>
    .branch-per-experiment-bg   { fill: #f8fafc; }
    .branch-per-experiment-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-per-experiment-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-per-experiment-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-per-experiment-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-per-experiment-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .branch-per-experiment-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .branch-per-experiment-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .branch-per-experiment-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .branch-per-experiment-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .branch-per-experiment-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .branch-per-experiment-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .branch-per-experiment-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .branch-per-experiment-row { opacity: 1; }
    .branch-per-experiment-r0 { animation-delay: 0.00s; }
    .branch-per-experiment-r1 { animation-delay: 0.45s; }
    .branch-per-experiment-r2 { animation-delay: 0.90s; }
    .branch-per-experiment-r3 { animation-delay: 1.35s; }
    .branch-per-experiment-r4 { animation-delay: 1.80s; }
    .branch-per-experiment-row { animation: branch-per-experiment-reveal 7.3s ease-in-out infinite; }
    @keyframes branch-per-experiment-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="branch-per-experiment-bg" width="980" height="390"/>
  <text class="branch-per-experiment-h1"  x="30" y="40">A branch per experiment</text>
  <text class="branch-per-experiment-sub" x="30" y="64">Because abandoning one should cost nothing.</text>
  <rect class="branch-per-experiment-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="branch-per-experiment-name" x="46" y="122">All on main</text>
  <text class="branch-per-experiment-desc" x="46" y="142">Edit, run, edit, run.</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r0" x="46" y="182">No commit maps cleanly to a result</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r1" x="46" y="216">Reverting a failed idea is manual</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r2" x="46" y="250">Two directions cannot coexist</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r3" x="46" y="284">"Which config produced that number?"</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r4" x="46" y="318">Abandoning means undoing by hand</text>
  <rect class="branch-per-experiment-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="branch-per-experiment-name" x="526" y="122">One branch each</text>
  <text class="branch-per-experiment-desc" x="526" y="142">Code and config together.</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r0" x="526" y="182">Each result cites one commit hash</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r1" x="526" y="216">A failed idea is deleted, not undone</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r2" x="526" y="250">Several directions run in parallel</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r3" x="526" y="284">The config is committed with the code</text>
  <text class="branch-per-experiment-desc branch-per-experiment-row branch-per-experiment-r4" x="526" y="318">Abandoning costs nothing at all</text>
  <text class="branch-per-experiment-sub" x="30" y="372">"This did not work" is a result worth keeping. A short note in the log plus the deleted branch preserves the finding without carrying the code.</text>
</svg>
