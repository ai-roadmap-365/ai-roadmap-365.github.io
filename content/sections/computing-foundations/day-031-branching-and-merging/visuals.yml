visuals:
  - id: branch-merge
    file: assets/branch-merge.svg
    type: diagram
    title: 'Branching and merging: one feature branch'
    alt: 'Diagram: a feature branch diverging from main and merging back at a merge commit'
    description: 'A left-to-right commit graph showing the main line growing through commits C1, C2, C3, a feature branch created at C2 that adds commits F1 and F2 in isolation, and a two-parent merge commit M that rejoins the feature branch into main.'
  - id: conflict-resolution
    file: assets/conflict-resolution.svg
    type: flowchart
    title: 'Resolving a merge conflict'
    alt: 'Flowchart: two edits to the same line become a conflict, then get resolved and committed'
    description: 'A top-to-bottom flow showing two branches editing the same line differently, git merge reporting a conflict and writing the <<<<<<< / ======= / >>>>>>> markers, the file edited down to the wanted version with the markers removed, and git add plus git commit sealing the resolution into a merge commit.'
  - id: merge-versus-rebase
    file: assets/merge-versus-rebase.svg
    type: diagram
    title: 'Two ways to combine work, and one rule about when'
    alt: 'Diagram: merge compared with rebase'
    description: 'A two-column comparison of merging and rebasing, covering the history each produces, what each preserves, and the rule against rebasing shared branches.'
  - id: branch-is-a-pointer
    file: assets/branch-is-a-pointer.svg
    type: diagram
    title: 'A branch is a pointer, not a copy'
    alt: 'Diagram: what people assume a branch is compared with what it actually is'
    description: 'A two-column comparison of the intuitive but wrong idea of a branch as a copied directory against the actual implementation as a movable pointer to a commit.'
  - id: fast-forward-or-three-way
    file: assets/fast-forward-or-three-way.svg
    type: diagram
    title: 'Two kinds of merge, and Git picks'
    alt: 'Diagram: a fast-forward merge compared with a three-way merge'
    description: 'A two-column comparison of fast-forward and three-way merges, covering whether the target branch advanced, whether a merge commit is created, and the resulting history shape.'
  - id: conflict-anatomy
    file: assets/conflict-anatomy.svg
    type: diagram
    title: 'Reading conflict markers'
    alt: 'Diagram: how to read and resolve Git conflict markers'
    description: 'A four-stage guide to conflict markers covering the ours section, the divider, the theirs section, and the requirement to delete all three marker lines when resolving.'
  - id: conflict-is-not-an-error
    file: assets/conflict-is-not-an-error.svg
    type: diagram
    title: 'A conflict is a question, not a failure'
    alt: 'Diagram: what a merge conflict means and what it does not'
    description: 'A two-column comparison of what a merge conflict actually indicates against common misunderstandings, covering when Git can merge automatically and why it stops.'
  - id: branch-drift
    file: assets/branch-drift.svg
    type: diagram
    title: 'Why a long-lived branch gets harder every day'
    alt: 'Diagram: how merge difficulty grows with branch age'
    description: 'A four-stage progression showing a branch diverging from main over time, with the merge cost growing as more commits accumulate on both sides.'
  - id: merge-review-risk
    file: assets/merge-review-risk.svg
    type: diagram
    title: 'The change nobody reviews'
    alt: 'Diagram: why merge resolutions are a source of bugs'
    description: 'A two-column comparison of ordinary reviewed changes against conflict resolutions, covering how each is written and whether it receives scrutiny.'
  - id: rebase-golden-rule
    file: assets/rebase-golden-rule.svg
    type: diagram
    title: 'The one Git rule worth memorising verbatim'
    alt: 'Diagram: when rebasing is safe and when it is not'
    description: 'A four-stage explanation of the rebase safety rule covering what rebasing does to commit identity, why unshared commits are safe to rewrite, and what breaks when shared commits are rewritten.'
  - id: branch-per-experiment
    file: assets/branch-per-experiment.svg
    type: diagram
    title: 'A branch per experiment'
    alt: 'Diagram: running experiments on one branch compared with one branch each'
    description: 'A two-column comparison of running multiple experiments on a single branch against giving each its own branch, covering traceability and the cost of abandoning a direction.'
  - id: switch-with-changes
    file: assets/switch-with-changes.svg
    type: diagram
    title: 'Uncommitted changes follow you across branches'
    alt: 'Diagram: what happens to uncommitted work when switching branches'
    description: 'A four-stage explanation of switching branches with uncommitted changes, covering why the work travels with you, when Git refuses, and the two ways to resolve it.'
