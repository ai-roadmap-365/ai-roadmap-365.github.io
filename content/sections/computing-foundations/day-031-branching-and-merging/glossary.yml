terms:
  - term: branch
    definition: 'A separate line of development, represented in Git as a movable pointer to a commit; creating one is instant because it copies nothing, only writes a small pointer.'
  - term: HEAD
    definition: 'A special reference marking the branch (and commit) you are currently on — "you are here." It moves to the new commit each time you commit.'
  - term: checkout
    definition: 'The classic Git command for switching branches (git checkout NAME) or creating and switching (git checkout -b NAME); it also does other jobs, which is why git switch was later split out of it.'
  - term: switch
    definition: 'The modern Git command (added in version 2.23) for moving between branches: git switch NAME to switch, git switch -c NAME to create and switch.'
  - term: merge
    definition: 'Combining the commits of one branch into another so the target contains both lines of work; a three-way merge creates a new merge commit with two parents.'
  - term: fast-forward
    definition: 'A merge in which the target branch has not advanced since the split, so Git simply slides its pointer forward to the other branch tip — no merge commit is created and history stays linear.'
  - term: three-way merge
    definition: 'A merge that combines two diverged branches using their common ancestor (the merge base) plus both branch tips, producing a merge commit with two parents.'
  - term: merge conflict
    definition: 'The situation where two branches changed the same lines differently, so Git stops the merge and asks you to choose, marking the disputed region with conflict markers.'
  - term: rebase
    definition: 'Replaying a branch''s commits on top of another branch as new commits, producing a straight linear history with no merge commit; it rewrites the commits, so it must never be used on shared history.'
  - term: main
    definition: 'The conventional name of the default branch that holds the primary, shippable line of a project''s history (older projects often call it master).'
  - term: feature branch
    definition: 'A short-lived branch created to hold one distinct piece of work — a feature, fix, or experiment — kept isolated from main until it is ready to merge and then deleted.'
  - term: merge base
    definition: 'The most recent commit two branches share — their common ancestor — which Git uses as the reference point when performing a three-way merge.'
  - term: conflict markers
    definition: 'The <<<<<<<, =======, and >>>>>>> lines Git inserts around a conflicting region to show both competing versions; a conflict is resolved only once all three are removed.'
