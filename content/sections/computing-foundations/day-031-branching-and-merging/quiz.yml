questions:
  - question: 'In Git, what is a branch?'
    options:
      - 'A complete copy of every file in the project, stored in a new folder'
      - 'A movable pointer to a commit, naming the latest commit on a line of work'
      - 'A backup of the repository kept on a separate server'
      - 'A permanent record that can never be deleted once created'
    answer_index: 1
    explanation: 'A branch is just a small movable pointer to a commit — a few dozen bytes on disk — which is why creating one is instant and does not copy any files.'

  - question: 'Which command creates a new branch AND moves you onto it in one step?'
    options:
      - 'git branch feature-x'
      - 'git merge feature-x'
      - 'git switch -c feature-x'
      - 'git log --graph feature-x'
    answer_index: 2
    explanation: 'git switch -c NAME creates the branch and switches to it. Plain git branch NAME creates the branch but leaves you where you are; the classic equivalent of switch -c is git checkout -b NAME.'

  - question: 'When does Git perform a fast-forward merge instead of a three-way merge?'
    options:
      - 'Whenever the two branches changed the same lines'
      - 'When the target branch has not advanced since you branched off it, so its pointer can simply slide forward'
      - 'Only when you explicitly pass the --no-ff option'
      - 'When the branch being merged has more commits than the target'
    answer_index: 1
    explanation: 'If the target branch has not moved since the split, there is nothing to combine and Git just slides its pointer forward — a fast-forward, with no merge commit. A three-way merge happens when both branches advanced.'

  - question: 'A merge conflict occurs when:'
    options:
      - 'Two branches changed the same lines in different ways, so Git cannot know which to keep'
      - 'A branch has been left un-deleted for too long'
      - 'You forget to write a commit message'
      - 'Two branches have the same name'
    answer_index: 0
    explanation: 'Git combines non-overlapping changes automatically. It only stops and asks for a conflict resolution when both sides changed the same lines differently — it refuses to guess which version you meant.'

  - question: 'In a conflict block, which part is the version from your current branch (HEAD)?'
    options:
      - 'The text below ======= and above >>>>>>>'
      - 'The text between <<<<<<< HEAD and ======='
      - 'The =======  line itself'
      - 'None of it — HEAD is never shown in a conflict'
    answer_index: 1
    explanation: 'The region between <<<<<<< HEAD and ======= is "ours" — the version on your current branch. The region between ======= and >>>>>>> is "theirs", from the branch being merged.'

  - question: 'What must be true of a file before you commit it to resolve a conflict?'
    options:
      - 'It must be renamed to avoid the conflict'
      - 'It must contain all three marker lines so Git can track the history'
      - 'No <<<<<<<, =======, or >>>>>>> marker lines may remain, and you must git add the file'
      - 'It must be identical to the version on main'
    answer_index: 2
    explanation: 'Resolving means editing the file to the version you want, deleting all three marker lines, then staging it with git add and running git commit. Leftover markers would be committed as literal text.'

  - question: 'How does rebasing differ from merging?'
    options:
      - 'Rebasing deletes the branch, while merging keeps it'
      - 'Rebasing replays your commits onto another branch as new commits, producing a straight linear history with no merge commit'
      - 'Rebasing only works on the main branch'
      - 'There is no difference; they are two names for the same operation'
    answer_index: 1
    explanation: 'A merge combines branches with a two-parent merge commit and preserves the branch shape; a rebase replays your commits on top of another branch as new commits, rewriting them into a straight line with no merge commit.'

  - question: 'What is the golden rule of rebasing?'
    options:
      - 'Always rebase before every commit'
      - 'Never rebase commits you have already shared with others'
      - 'Only rebase on Fridays'
      - 'Rebase only branches that have merge conflicts'
    answer_index: 1
    explanation: 'Rebasing rewrites commits into new ones. Doing that to commits others have already based work on makes their history and yours disagree — so you rebase only your own private, un-shared work and merge anything public.'
