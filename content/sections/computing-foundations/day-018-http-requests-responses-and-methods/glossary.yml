terms:
  - term: HTTP
    definition: 'The HyperText Transfer Protocol: the set of rules a client and server follow to exchange request and response messages over a network. It is the protocol every web page load and every hosted-model API call speaks.'
  - term: request
    definition: 'The message a client sends to a server, made of a request line (method, path, version), headers, a blank line, and an optional body.'
  - term: response
    definition: 'The message a server sends back, made of a status line (version, status code, reason), headers, a blank line, and a body.'
  - term: method
    definition: 'The verb of a request that declares intent — GET to read, POST to send data for processing, PUT to replace, PATCH to partially update, DELETE to remove.'
  - term: status code
    definition: 'A three-digit number in the response that summarizes the outcome; its first digit sorts it into a class (1xx informational, 2xx success, 3xx redirection, 4xx client error, 5xx server error).'
  - term: header
    definition: 'A Name: value line carrying metadata about a request or response, such as Content-Type or Authorization; headers come before the blank line that precedes the body.'
  - term: body
    definition: 'The optional payload of a message — the JSON prompt you send in a request, or the HTML or JSON data returned in a response.'
  - term: GET
    definition: 'The method for reading a resource without changing anything; it is both safe (read-only) and idempotent (repeating it has the same effect as doing it once).'
  - term: POST
    definition: 'The method for sending a body to be processed, often creating a resource; it is neither safe nor idempotent, so repeating it may duplicate a side effect. Every hosted-model call is a POST.'
  - term: idempotent
    definition: 'A property of a method meaning that making the same request many times has the same effect as making it once; GET, PUT, and DELETE are idempotent, POST is not.'
  - term: stateless
    definition: 'The property that each HTTP request is self-contained and the server keeps no memory of a client between requests, which is what lets many identical servers share the load.'
  - term: Content-Type
    definition: 'A header declaring the format of the body, such as application/json or text/html, so the receiver parses the bytes correctly.'
  - term: Authorization
    definition: 'A header carrying the credential that proves who the client is, most often as "Bearer <token>"; it is the header that decides between a 200 and a 401.'
  - term: cookie
    definition: 'A small piece of data the server sends with Set-Cookie and the client returns in a Cookie header on later requests, used to fake a continuous session on top of stateless HTTP.'
