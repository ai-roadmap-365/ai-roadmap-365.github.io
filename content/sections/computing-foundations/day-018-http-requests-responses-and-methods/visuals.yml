visuals:
  - id: http-request-response
    file: assets/http-request-response.svg
    type: architecture
    title: 'One HTTP round trip: request and response'
    alt: 'Architecture diagram: an HTTP request message beside an HTTP response message, each labelled part by part'
    description: 'Two message panels side by side. The request panel shows the request line (POST /v1/messages HTTP/1.1), headers (Host, Content-Type, Authorization, Content-Length), a blank line, and a JSON body. The response panel mirrors it with a status line (HTTP/1.1 200 OK), headers, a blank line, and a JSON body — teaching the four parts of a request and three parts of a response.'
  - id: status-code-classes
    file: assets/status-code-classes.svg
    type: flowchart
    title: 'The five HTTP status-code classes'
    alt: 'Flow diagram: the five HTTP status-code classes and what each one signals'
    description: 'Five stacked rows, one per status class, keyed by first digit: 1xx informational, 2xx success, 3xx redirection, 4xx client error (highlighted, your request was wrong), and 5xx server error (highlighted, the server failed). Each row names the important codes in that class and states what you should do.'
  - id: http-status-families
    file: assets/http-status-families.svg
    type: diagram
    title: 'The two status families that mean opposite things'
    alt: 'Diagram: 4xx client errors compared with 5xx server errors'
    description: 'A two-column comparison of 4xx and 5xx status codes, showing who is at fault, whether a retry can help, and the common codes in each family.'
  - id: message-shape
    file: assets/message-shape.svg
    type: diagram
    title: 'Both messages have the same four parts'
    alt: 'Diagram: the four parts shared by every HTTP request and response'
    description: 'A four-stage breakdown of the common HTTP message structure: the first line, the header block, the mandatory blank line, and the optional body.'
  - id: safe-and-idempotent
    file: assets/safe-and-idempotent.svg
    type: diagram
    title: 'Safe and idempotent are different promises'
    alt: 'Diagram: safe methods compared with idempotent methods'
    description: 'A two-column comparison of the safe property, meaning a method only reads, against the idempotent property, meaning repeating a request has the same effect as making it once.'
  - id: retry-decision
    file: assets/retry-decision.svg
    type: diagram
    title: 'Should you retry?'
    alt: 'Diagram: which HTTP status codes are worth retrying'
    description: 'A four-stage decision procedure for retrying a failed HTTP request based on the status class, covering client errors, rate limits, server errors and backoff strategy.'
  - id: cookie-round-trip
    file: assets/cookie-round-trip.svg
    type: diagram
    title: 'How a stateless protocol feels continuous'
    alt: 'Diagram: how a session cookie is issued and returned'
    description: 'A four-stage sequence showing a server issuing a session identifier in a Set-Cookie header, the client storing it, returning it on later requests, and the server looking up the real session in its own storage.'
  - id: token-in-url
    file: assets/token-in-url.svg
    type: diagram
    title: 'Why a token never belongs in a URL'
    alt: 'Diagram: a credential in a URL compared with one in a header'
    description: 'A two-column comparison of placing a credential in a URL query string against placing it in an Authorization header, listing the places each is recorded.'
  - id: http-multiplexing
    file: assets/http-multiplexing.svg
    type: diagram
    title: 'Head-of-line blocking, and what fixed it'
    alt: 'Diagram: HTTP/1.1 sequential requests compared with HTTP/2 multiplexing'
    description: 'A two-column comparison of HTTP/1.1''s one-request-at-a-time connections against HTTP/2''s multiplexed streams, covering blocking behaviour and the workarounds sites built for the older version.'
  - id: status-first-digit
    file: assets/status-first-digit.svg
    type: diagram
    title: 'The first digit is the whole diagnosis'
    alt: 'Diagram: what each HTTP status class means for what you do next'
    description: 'A five-stage reference to the HTTP status classes, pairing each leading digit with the action it calls for, from informational through success, redirection, client error and server error.'
  - id: authentication-versus-authorization
    file: assets/authentication-versus-authorization.svg
    type: diagram
    title: '401 and 403 are not the same rejection'
    alt: 'Diagram: a 401 unauthorized response compared with a 403 forbidden response'
    description: 'A two-column comparison of the 401 and 403 status codes, distinguishing a failure to authenticate from a successful authentication that lacks permission.'
  - id: streaming-response
    file: assets/streaming-response.svg
    type: diagram
    title: 'Why the first token arrives before the last'
    alt: 'Diagram: a buffered response compared with a streamed one'
    description: 'A four-stage sequence contrasting a fully buffered response, which arrives only when generation completes, with a streamed response that delivers tokens as they are produced over a held-open connection.'
