<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The first digit answers it, almost always.">
  <title>Should you retry?</title>
  <style>
    .retry-decision-bg   { fill: #f8fafc; }
    .retry-decision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-decision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-decision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-decision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-decision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-decision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retry-decision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retry-decision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retry-decision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retry-decision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retry-decision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retry-decision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .retry-decision-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .retry-decision-stage { opacity: 1; }

    .retry-decision-s0 { animation-delay: 0.00s; }
    .retry-decision-e0 { animation-delay: 0.00s; }
    .retry-decision-s1 { animation-delay: 1.28s; }
    .retry-decision-e1 { animation-delay: 1.28s; }
    .retry-decision-s2 { animation-delay: 2.56s; }
    .retry-decision-e2 { animation-delay: 2.56s; }
    .retry-decision-s3 { animation-delay: 3.84s; }
    .retry-decision-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .retry-decision-conn  { animation: retry-decision-trace 6.4s ease-in-out infinite; }
      .retry-decision-stage { animation: retry-decision-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes retry-decision-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes retry-decision-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .retry-decision-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .retry-decision-stage { animation: retry-decision-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes retry-decision-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="retry-decision-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="retry-decision-bg" width="980" height="322"/>
  <text class="retry-decision-h1"  x="30" y="40">Should you retry?</text>
  <text class="retry-decision-sub" x="30" y="64">The first digit answers it, almost always.</text>
  <g class="retry-decision-stage retry-decision-s0">
    <rect class="retry-decision-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="retry-decision-step" x="44" y="142">01</text>
    <text class="retry-decision-name" x="70" y="142">4xx — no</text>
    <text class="retry-decision-desc" x="44" y="166">Your request was wrong. Waiting</text>
    <text class="retry-decision-desc" x="44" y="182">changes nothing. Fix it.</text>
    <text class="retry-decision-edge" x="44" y="242">never</text>
  </g>
  <line class="retry-decision-line retry-decision-conn retry-decision-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#retry-decision-tip)"/>
  <g class="retry-decision-stage retry-decision-s1">
    <rect class="retry-decision-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="retry-decision-step" x="280" y="142">02</text>
    <text class="retry-decision-name" x="306" y="142">429 — yes, on their terms</text>
    <text class="retry-decision-desc" x="280" y="166">You are rate-limited.</text>
    <text class="retry-decision-desc" x="280" y="182">Retry-After often tells you</text>
    <text class="retry-decision-desc" x="280" y="198">exactly how long.</text>
    <text class="retry-decision-edge" x="280" y="242">wait</text>
  </g>
  <line class="retry-decision-line retry-decision-conn retry-decision-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#retry-decision-tip)"/>
  <g class="retry-decision-stage retry-decision-s2">
    <rect class="retry-decision-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="retry-decision-step" x="516" y="142">03</text>
    <text class="retry-decision-name" x="542" y="142">5xx — yes, with backoff</text>
    <text class="retry-decision-desc" x="516" y="166">The server failed. It may not</text>
    <text class="retry-decision-desc" x="516" y="182">fail next time.</text>
    <text class="retry-decision-edge" x="516" y="242">backoff</text>
  </g>
  <line class="retry-decision-line retry-decision-conn retry-decision-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#retry-decision-tip)"/>
  <g class="retry-decision-stage retry-decision-s3">
    <rect class="retry-decision-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="retry-decision-step" x="752" y="142">04</text>
    <text class="retry-decision-name" x="778" y="142">Add jitter</text>
    <text class="retry-decision-desc" x="752" y="166">Or a thousand clients retry in</text>
    <text class="retry-decision-desc" x="752" y="182">unison and finish the server</text>
    <text class="retry-decision-desc" x="752" y="198">off.</text>
    <text class="retry-decision-edge" x="752" y="242">jitter</text>
  </g>
  <text class="retry-decision-sub" x="30" y="304">And before retrying a POST at all, ask whether the work may already have happened. A timeout means the response was lost, not that nothing occurred.</text>
</svg>
