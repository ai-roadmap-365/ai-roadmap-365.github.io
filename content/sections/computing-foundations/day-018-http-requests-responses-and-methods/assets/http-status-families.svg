<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One says fix your request. The other says try again.">
  <title>The two status families that mean opposite things</title>
  <style>
    .http-status-families-bg   { fill: #f8fafc; }
    .http-status-families-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-status-families-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-status-families-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-status-families-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-status-families-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-status-families-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .http-status-families-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .http-status-families-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .http-status-families-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .http-status-families-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .http-status-families-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="http-status-families-bg" width="980" height="390"/>
  <text class="http-status-families-h1"  x="30" y="40">The two status families that mean opposite things</text>
  <text class="http-status-families-sub" x="30" y="64">One says fix your request. The other says try again.</text>
  <rect class="http-status-families-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="http-status-families-name" x="46" y="122">4xx — the request was wrong</text>
  <text class="http-status-families-desc" x="46" y="142">Retrying it unchanged will fail again</text>
  <text class="http-status-families-desc" x="46" y="182">400 malformed; 401 no valid credential</text>
  <text class="http-status-families-desc" x="46" y="216">403 authenticated but not allowed; 404 no such thing</text>
  <text class="http-status-families-desc" x="46" y="250">422 well-formed but unacceptable</text>
  <text class="http-status-families-desc" x="46" y="284">429 is the exception — wait, then retry</text>
  <text class="http-status-families-desc" x="46" y="318">Fix the request, not the timing</text>
  <rect class="http-status-families-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="http-status-families-name" x="526" y="122">5xx — the server failed</text>
  <text class="http-status-families-desc" x="526" y="142">The same request may well succeed</text>
  <text class="http-status-families-desc" x="526" y="182">500 something broke inside</text>
  <text class="http-status-families-desc" x="526" y="216">502 a bad reply from upstream</text>
  <text class="http-status-families-desc" x="526" y="250">503 temporarily unavailable; 504 upstream timed out</text>
  <text class="http-status-families-desc" x="526" y="284">Retry with backoff and jitter</text>
  <text class="http-status-families-desc" x="526" y="318">Nothing about your request needs to change</text>
  <text class="http-status-families-sub" x="30" y="372">Getting these two families the wrong way round is how a client either gives up too early or retries forever.</text>
</svg>
