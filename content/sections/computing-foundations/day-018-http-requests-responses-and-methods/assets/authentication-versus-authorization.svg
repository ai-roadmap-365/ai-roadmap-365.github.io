<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Who are you, versus what you may do.">
  <title>401 and 403 are not the same rejection</title>
  <style>
    .authentication-versus-authorization-bg   { fill: #f8fafc; }
    .authentication-versus-authorization-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authentication-versus-authorization-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authentication-versus-authorization-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authentication-versus-authorization-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authentication-versus-authorization-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .authentication-versus-authorization-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .authentication-versus-authorization-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .authentication-versus-authorization-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .authentication-versus-authorization-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .authentication-versus-authorization-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .authentication-versus-authorization-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .authentication-versus-authorization-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .authentication-versus-authorization-row { opacity: 1; }
    .authentication-versus-authorization-r0 { animation-delay: 0.00s; }
    .authentication-versus-authorization-r1 { animation-delay: 0.45s; }
    .authentication-versus-authorization-r2 { animation-delay: 0.90s; }
    .authentication-versus-authorization-r3 { animation-delay: 1.35s; }
    .authentication-versus-authorization-r4 { animation-delay: 1.80s; }
    .authentication-versus-authorization-row { animation: authentication-versus-authorization-reveal 7.3s ease-in-out infinite; }
    @keyframes authentication-versus-authorization-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="authentication-versus-authorization-bg" width="980" height="390"/>
  <text class="authentication-versus-authorization-h1"  x="30" y="40">401 and 403 are not the same rejection</text>
  <text class="authentication-versus-authorization-sub" x="30" y="64">Who are you, versus what you may do.</text>
  <rect class="authentication-versus-authorization-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="authentication-versus-authorization-name" x="46" y="122">401 Unauthorized</text>
  <text class="authentication-versus-authorization-desc" x="46" y="142">We do not know who you are.</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r0" x="46" y="182">The credential is missing, malformed or expired</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r1" x="46" y="216">Named badly: it means unauthenticated</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r2" x="46" y="250">Sending a valid token fixes it</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r3" x="46" y="284">Your first AI error, almost always</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r4" x="46" y="318">Check the header name and the Bearer prefix</text>
  <rect class="authentication-versus-authorization-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="authentication-versus-authorization-name" x="526" y="122">403 Forbidden</text>
  <text class="authentication-versus-authorization-desc" x="526" y="142">We know exactly who you are.</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r0" x="526" y="182">Authentication succeeded</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r1" x="526" y="216">You lack permission for this action</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r2" x="526" y="250">A better token will not help</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r3" x="526" y="284">Neither will retrying</text>
  <text class="authentication-versus-authorization-desc authentication-versus-authorization-row authentication-versus-authorization-r4" x="526" y="318">Usually a plan limit, a scope, or a role</text>
  <text class="authentication-versus-authorization-sub" x="30" y="372">Reading 403 as "log in again" wastes an afternoon. You already logged in; the answer is no.</text>
</svg>
