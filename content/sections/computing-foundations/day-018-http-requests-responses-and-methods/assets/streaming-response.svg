<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One response, delivered as it is produced.">
  <title>Why the first token arrives before the last</title>
  <style>
    .streaming-response-bg   { fill: #f8fafc; }
    .streaming-response-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-response-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-response-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-response-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-response-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-response-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-response-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .streaming-response-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .streaming-response-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .streaming-response-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .streaming-response-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .streaming-response-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .streaming-response-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .streaming-response-stage { opacity: 1; }

    .streaming-response-s0 { animation-delay: 0.00s; }
    .streaming-response-e0 { animation-delay: 0.00s; }
    .streaming-response-s1 { animation-delay: 1.28s; }
    .streaming-response-e1 { animation-delay: 1.28s; }
    .streaming-response-s2 { animation-delay: 2.56s; }
    .streaming-response-e2 { animation-delay: 2.56s; }
    .streaming-response-s3 { animation-delay: 3.84s; }
    .streaming-response-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .streaming-response-conn  { animation: streaming-response-trace 6.4s ease-in-out infinite; }
      .streaming-response-stage { animation: streaming-response-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes streaming-response-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes streaming-response-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .streaming-response-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .streaming-response-stage { animation: streaming-response-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes streaming-response-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="streaming-response-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="streaming-response-bg" width="980" height="322"/>
  <text class="streaming-response-h1"  x="30" y="40">Why the first token arrives before the last</text>
  <text class="streaming-response-sub" x="30" y="64">One response, delivered as it is produced.</text>
  <g class="streaming-response-stage streaming-response-s0">
    <rect class="streaming-response-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-response-step" x="44" y="142">01</text>
    <text class="streaming-response-name" x="70" y="142">Request sent</text>
    <text class="streaming-response-desc" x="44" y="166">An ordinary POST, with stream</text>
    <text class="streaming-response-desc" x="44" y="182">requested in the body.</text>
  </g>
  <line class="streaming-response-line streaming-response-conn streaming-response-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#streaming-response-tip)"/>
  <g class="streaming-response-stage streaming-response-s1">
    <rect class="streaming-response-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-response-step" x="280" y="142">02</text>
    <text class="streaming-response-name" x="306" y="142">Headers come back immediately</text>
    <text class="streaming-response-desc" x="280" y="166">Status 200, and a content type</text>
    <text class="streaming-response-desc" x="280" y="182">saying the body will arrive in</text>
    <text class="streaming-response-desc" x="280" y="198">pieces.</text>
    <text class="streaming-response-edge" x="280" y="242">200 OK</text>
  </g>
  <line class="streaming-response-line streaming-response-conn streaming-response-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#streaming-response-tip)"/>
  <g class="streaming-response-stage streaming-response-s2">
    <rect class="streaming-response-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-response-step" x="516" y="142">03</text>
    <text class="streaming-response-name" x="542" y="142">Tokens arrive as generated</text>
    <text class="streaming-response-desc" x="516" y="166">The connection stays open; each</text>
    <text class="streaming-response-desc" x="516" y="182">chunk is usable on arrival.</text>
    <text class="streaming-response-edge" x="516" y="242">first token</text>
  </g>
  <line class="streaming-response-line streaming-response-conn streaming-response-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#streaming-response-tip)"/>
  <g class="streaming-response-stage streaming-response-s3">
    <rect class="streaming-response-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-response-step" x="752" y="142">04</text>
    <text class="streaming-response-name" x="778" y="142">The stream ends</text>
    <text class="streaming-response-desc" x="752" y="166">A terminating event closes it.</text>
    <text class="streaming-response-desc" x="752" y="182">Total time is unchanged —</text>
    <text class="streaming-response-desc" x="752" y="198">perceived time is not.</text>
  </g>
  <text class="streaming-response-sub" x="30" y="304">Nothing here is faster. The generation takes exactly as long. What changed is that you stopped waiting for all of it before seeing any of it.</text>
</svg>
