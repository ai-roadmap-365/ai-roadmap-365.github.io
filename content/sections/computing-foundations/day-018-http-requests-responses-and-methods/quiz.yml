questions:
  - question: 'What are the four parts of an HTTP request, in order?'
    options:
      - 'Status line, headers, blank line, body'
      - 'Request line (method, path, version), headers, blank line, optional body'
      - 'Method, cookie, encryption, body'
      - 'URL, port, protocol, payload'
    answer_index: 1
    explanation: 'A request begins with a request line naming the method, path, and HTTP version, followed by headers, a mandatory blank line that marks the end of the headers, and an optional body. A response has the parallel shape but opens with a status line instead of a request line.'

  - question: 'A method is called "idempotent" when:'
    options:
      - 'It never sends a body'
      - 'It is encrypted on the wire'
      - 'Making the same request many times has the same effect as making it once'
      - 'It only reads data and never changes anything'
    answer_index: 2
    explanation: 'Idempotent means repeating the request produces the same end state as sending it once — true of GET, PUT, and DELETE. The property that a method only reads and changes nothing is "safe," which is a different (though related) idea; POST is neither safe nor idempotent.'

  - question: 'Your script POSTs a model prompt, the request times out, and it retries automatically. Why is this riskier for POST than for GET?'
    options:
      - 'POST is slower than GET, so retries waste more time'
      - 'POST is not idempotent, so a retry may create a second resource or double a side effect'
      - 'GET cannot be retried at all'
      - 'POST responses are always cached, so the retry returns stale data'
    answer_index: 1
    explanation: 'GET is idempotent, so repeating it is harmless. POST is not idempotent: if the first request actually completed but the response was lost, the retry can create a duplicate — for a paid model call, that can mean paying twice. This is why retry logic on POST needs care.'

  - question: 'You call a hosted model API and get a 401 status code. What does it mean and what should you do?'
    options:
      - 'The server crashed; retry the same request in a few seconds'
      - 'The resource was not found; check the path'
      - 'You are being rate-limited; slow down your requests'
      - 'Your authentication failed; fix or supply a valid credential — retrying unchanged will not help'
    answer_index: 3
    explanation: '401 Unauthorized is a 4xx client error meaning the request lacked valid authentication. It is your request that is wrong, so retrying the identical request forever cannot succeed; you must fix the Authorization header. (429 is rate limiting, 404 is not found, 5xx is a server fault.)'

  - question: 'What distinguishes a 4xx status code from a 5xx status code?'
    options:
      - '4xx means the client request was wrong; 5xx means the server itself failed'
      - '4xx means success; 5xx means redirection'
      - '4xx is for GET requests; 5xx is for POST requests'
      - '4xx codes are encrypted; 5xx codes are not'
    answer_index: 0
    explanation: '4xx blames the client — a bad path, bad credentials, or malformed body — so you must fix the request before retrying. 5xx blames the server, so a later retry (ideally with backoff) is a reasonable response. Getting this distinction right is the core of debugging failed API calls.'

  - question: 'Which header carries the credential that decides between a 200 and a 401 for a hosted-model call?'
    options:
      - 'Content-Type'
      - 'User-Agent'
      - 'Authorization'
      - 'Cache-Control'
    answer_index: 2
    explanation: 'The Authorization header carries your credential, most often as "Bearer <token>". If it is missing or invalid the server answers 401; if it is valid the request can proceed. Content-Type describes the body format, User-Agent identifies the client, and Cache-Control governs caching.'

  - question: 'HTTP is described as "stateless." What does that mean, and how do sites keep you logged in anyway?'
    options:
      - 'The server stores no data at all; login is impossible over HTTP'
      - 'Each request is self-contained and the server remembers nothing between them; sites re-send identity each request using a cookie or token'
      - 'The connection is dropped after every byte, so nothing can persist'
      - 'State is stored in the URL, which is why URLs are so long'
    answer_index: 1
    explanation: 'Statelessness means every request stands alone and the server keeps no memory of you between requests. A session is faked on top: the server sends a Set-Cookie with a session ID, and your client returns it in a Cookie header on every later request, so each self-contained request still lets the server look you up.'

  - question: 'What is the difference between HTTP/1.1, HTTP/2, and HTTP/3?'
    options:
      - 'They use completely different methods and status codes'
      - 'Only HTTP/3 supports POST; the others are read-only'
      - 'They differ in how messages travel on the wire (text vs binary, multiplexing, transport), but the methods, headers, and status codes are the same'
      - 'HTTP/2 and HTTP/3 remove the need for the Authorization header'
    answer_index: 2
    explanation: 'The versions change transport and efficiency — HTTP/2 uses a compact binary form and multiplexes many requests over one connection, and HTTP/3 swaps in the QUIC transport — but the request/response model, methods, headers, and status codes stay identical. Your tools negotiate the version automatically.'
