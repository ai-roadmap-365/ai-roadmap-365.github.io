terms:
  - term: terminal
    definition: 'The text-based interface for typing commands to a computer and reading their text output; historically a separate device at the end of a wire, today usually a software window.'
  - term: terminal emulator
    definition: 'The application that opens a window, displays text, and forwards your keystrokes to the shell — a program that behaves like the old physical terminal hardware it is named after.'
  - term: shell
    definition: 'The program running inside a terminal that reads your command lines, interprets them, launches the corresponding programs, and prints their output; examples include bash, zsh, and fish.'
  - term: prompt
    definition: 'The short piece of text a shell prints to signal it is ready for your input, such as `you@laptop %`; its exact look is set by the prompt string.'
  - term: command
    definition: 'A single line of text you give the shell, beginning with the name of a program to run and followed by any options and arguments.'
  - term: flag
    definition: 'An option on a command line, usually starting with `-` or `--`, that changes how a command behaves — for example `-l` in `ls -l`.'
  - term: argument
    definition: 'The target a command acts on, such as a file or folder name — for example `/Users` in `ls -l /Users`.'
  - term: bash
    definition: 'The Bourne Again Shell, written by Brian Fox for the Free Software Foundation in 1989; the most widely documented shell and a common default on Linux systems.'
  - term: zsh
    definition: 'The Z shell, released by Paul Falstad in 1990; the default shell on macOS since Catalina (2019), offering richer completion and customization while staying broadly bash-compatible.'
  - term: read-eval-print loop (REPL)
    definition: 'The repeating cycle a shell runs for every command: read the line you type, evaluate it, print the result, and loop back to the prompt to wait for the next line.'
  - term: man page
    definition: 'A command''s built-in reference manual, shown by the `man` command (for example `man ls`); you scroll with the arrow keys and press `q` to quit.'
  - term: tab completion
    definition: 'A shell feature that finishes a partly typed command or filename when you press the Tab key, or lists the choices if several match, saving keystrokes and preventing typos.'
  - term: command history
    definition: 'The shell''s record of the commands you have run, recalled with the Up arrow or listed with the `history` command, so past commands can be re-run without retyping.'
  - term: PATH
    definition: 'The list of directories a shell searches to find the program named by a command, so that typing `ls` locates and runs the `ls` program wherever it is installed.'
