slug: meet-the-terminal-shells-prompts-and
title: 'Meet the Terminal: Shells, Prompts, and Commands'
section: computing-foundations
subsection: how-computers-work
week: 2
learning_promise: 'After this lesson you will be able to tell the terminal, the shell, and a command apart, read any command by its anatomy, describe the read-eval-print loop your shell runs, and use history, tab completion, and the manual to work quickly at the prompt.'
objectives:
  - 'Distinguish the terminal emulator, the shell, and a command, and identify which one actually interprets and runs your instructions'
  - 'Break any command line into its three kinds of word — the command, its options/flags, and its arguments'
  - 'Describe the shell''s read-eval-print loop step by step, from typing a line to the prompt returning'
  - 'Name the common shells (bash, zsh, fish), start each one, and explain why macOS defaults to zsh while many Linux systems default to bash'
  - 'Use command history, tab completion, and man pages to run commands faster and look up options without memorising them'
  - 'Discover which shell you are running and what your prompt string is, using echo $0, echo $SHELL, ps -p $$, and echo "$PS1"'
  - 'Explain why automation, reproducibility, and remote control make the terminal the primary interface for serious computational work'
prerequisites:
  - 'A computer running macOS, Linux, or Windows with permission to open a terminal'
  - 'Days 1–7: a working mental model of how a computer runs programs (the terminal is how you will now drive it)'
reading_time_minutes: 40
practical_time_minutes: 30
last_verified: '2026-07-12'
tags: [terminal, shell, command-line, bash, zsh, foundations]
