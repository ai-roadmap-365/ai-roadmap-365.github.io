<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="The shell is a program waiting for input, and this is its whole loop.">
  <title>What happens between Return and the next prompt</title>
  <style>
    .shell-read-eval-print-bg   { fill: #f8fafc; }
    .shell-read-eval-print-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-read-eval-print-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shell-read-eval-print-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shell-read-eval-print-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shell-read-eval-print-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shell-read-eval-print-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .shell-read-eval-print-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .shell-read-eval-print-tok { animation: shell-read-eval-print-travel 7s ease-in-out infinite; }
    }
    @keyframes shell-read-eval-print-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--shell-read-eval-print-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .shell-read-eval-print-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="shell-read-eval-print-bg" width="980" height="334"/>
  <text class="shell-read-eval-print-h1"  x="30" y="40">What happens between Return and the next prompt</text>
  <text class="shell-read-eval-print-sub" x="30" y="64">The shell is a program waiting for input, and this is its whole loop.</text>
  <rect class="shell-read-eval-print-box" x="30" y="132" width="166" height="96" rx="9"/>
  <text class="shell-read-eval-print-name" x="44" y="160">Prompt</text>
  <text class="shell-read-eval-print-desc" x="44" y="182">The shell prints it and</text>
  <text class="shell-read-eval-print-desc" x="44" y="198">waits. Nothing is</text>
  <text class="shell-read-eval-print-desc" x="44" y="214">happening yet.</text>
  <text class="shell-read-eval-print-edge" x="44" y="248">idle</text>
  <line class="shell-read-eval-print-line" x1="199" y1="180" x2="215" y2="180"/>
  <rect class="shell-read-eval-print-box" x="218" y="132" width="166" height="96" rx="9"/>
  <text class="shell-read-eval-print-name" x="232" y="160">Read</text>
  <text class="shell-read-eval-print-desc" x="232" y="182">Your line is taken as</text>
  <text class="shell-read-eval-print-desc" x="232" y="198">text when you press</text>
  <text class="shell-read-eval-print-desc" x="232" y="214">Return.</text>
  <text class="shell-read-eval-print-edge" x="232" y="248">one line</text>
  <line class="shell-read-eval-print-line" x1="387" y1="180" x2="403" y2="180"/>
  <rect class="shell-read-eval-print-hi" x="406" y="132" width="166" height="96" rx="9"/>
  <text class="shell-read-eval-print-name" x="420" y="160">Parse</text>
  <text class="shell-read-eval-print-desc" x="420" y="182">Split into a command and</text>
  <text class="shell-read-eval-print-desc" x="420" y="198">its arguments; expand</text>
  <text class="shell-read-eval-print-desc" x="420" y="214">variables and globs.</text>
  <text class="shell-read-eval-print-edge" x="420" y="248">where quoting matters</text>
  <line class="shell-read-eval-print-line" x1="575" y1="180" x2="591" y2="180"/>
  <rect class="shell-read-eval-print-box" x="594" y="132" width="166" height="96" rx="9"/>
  <text class="shell-read-eval-print-name" x="608" y="160">Execute</text>
  <text class="shell-read-eval-print-desc" x="608" y="182">Find the program on PATH,</text>
  <text class="shell-read-eval-print-desc" x="608" y="198">launch it, wait for it to</text>
  <text class="shell-read-eval-print-desc" x="608" y="214">finish.</text>
  <text class="shell-read-eval-print-edge" x="608" y="248">a child process</text>
  <line class="shell-read-eval-print-line" x1="763" y1="180" x2="779" y2="180"/>
  <rect class="shell-read-eval-print-box" x="782" y="132" width="166" height="96" rx="9"/>
  <text class="shell-read-eval-print-name" x="796" y="160">Print</text>
  <text class="shell-read-eval-print-desc" x="796" y="182">Its output reaches your</text>
  <text class="shell-read-eval-print-desc" x="796" y="198">screen; its exit code</text>
  <text class="shell-read-eval-print-desc" x="796" y="214">reaches the shell.</text>
  <text class="shell-read-eval-print-edge" x="796" y="248">$?</text>
  <rect class="shell-read-eval-print-tok" x="34" y="106" width="58" height="14" rx="3" style="--shell-read-eval-print-run: 752px"/>
  <text class="shell-read-eval-print-sub" x="30" y="314">Every command you will run on a remote machine is this loop, with the network between Read and Execute.</text>
</svg>
