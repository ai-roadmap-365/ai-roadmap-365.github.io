<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Parse one and no command looks alien again.">
  <title>Every command line is the same three things</title>
  <style>
    .command-line-parts-bg   { fill: #f8fafc; }
    .command-line-parts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .command-line-parts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .command-line-parts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .command-line-parts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .command-line-parts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .command-line-parts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .command-line-parts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .command-line-parts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .command-line-parts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .command-line-parts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .command-line-parts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .command-line-parts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .command-line-parts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .command-line-parts-stage { opacity: 1; }

    .command-line-parts-s0 { animation-delay: 0.00s; }
    .command-line-parts-e0 { animation-delay: 0.00s; }
    .command-line-parts-s1 { animation-delay: 1.50s; }
    .command-line-parts-e1 { animation-delay: 1.50s; }
    .command-line-parts-s2 { animation-delay: 3.00s; }
    .command-line-parts-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .command-line-parts-conn  { animation: command-line-parts-trace 6s ease-in-out infinite; }
      .command-line-parts-stage { animation: command-line-parts-arrive 6s ease-in-out infinite; }
    }
    @keyframes command-line-parts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes command-line-parts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .command-line-parts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .command-line-parts-stage { animation: command-line-parts-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes command-line-parts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="command-line-parts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="command-line-parts-bg" width="980" height="322"/>
  <text class="command-line-parts-h1"  x="30" y="40">Every command line is the same three things</text>
  <text class="command-line-parts-sub" x="30" y="64">Parse one and no command looks alien again.</text>
  <g class="command-line-parts-stage command-line-parts-s0">
    <rect class="command-line-parts-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="command-line-parts-step" x="44" y="142">01</text>
    <text class="command-line-parts-name" x="70" y="142">The command</text>
    <text class="command-line-parts-desc" x="44" y="166">Always first. Names the program to run.</text>
    <text class="command-line-parts-edge" x="44" y="242">ls</text>
  </g>
  <line class="command-line-parts-line command-line-parts-conn command-line-parts-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#command-line-parts-tip)"/>
  <g class="command-line-parts-stage command-line-parts-s1">
    <rect class="command-line-parts-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="command-line-parts-step" x="359" y="142">02</text>
    <text class="command-line-parts-name" x="385" y="142">The options</text>
    <text class="command-line-parts-desc" x="359" y="166">Switches that change how it behaves. One dash</text>
    <text class="command-line-parts-desc" x="359" y="182">and a letter, or two dashes and a word.</text>
    <text class="command-line-parts-edge" x="359" y="242">-l</text>
  </g>
  <line class="command-line-parts-line command-line-parts-conn command-line-parts-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#command-line-parts-tip)"/>
  <g class="command-line-parts-stage command-line-parts-s2">
    <rect class="command-line-parts-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="command-line-parts-step" x="674" y="142">03</text>
    <text class="command-line-parts-name" x="700" y="142">The arguments</text>
    <text class="command-line-parts-desc" x="674" y="166">What it acts on — a file, a folder, a value.</text>
    <text class="command-line-parts-edge" x="674" y="242">/Users</text>
  </g>
  <text class="command-line-parts-sub" x="30" y="304">Short options bundle: -l -a becomes -la. Not every command needs all three — date takes neither.</text>
</svg>
