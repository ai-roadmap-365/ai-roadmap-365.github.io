<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Why "command not found" is almost never about the program missing.">
  <title>How the shell finds the program</title>
  <style>
    .path-lookup-bg   { fill: #f8fafc; }
    .path-lookup-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-lookup-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-lookup-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-lookup-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-lookup-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-lookup-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .path-lookup-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .path-lookup-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .path-lookup-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .path-lookup-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .path-lookup-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .path-lookup-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .path-lookup-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .path-lookup-stage { opacity: 1; }

    .path-lookup-s0 { animation-delay: 0.00s; }
    .path-lookup-e0 { animation-delay: 0.00s; }
    .path-lookup-s1 { animation-delay: 1.28s; }
    .path-lookup-e1 { animation-delay: 1.28s; }
    .path-lookup-s2 { animation-delay: 2.56s; }
    .path-lookup-e2 { animation-delay: 2.56s; }
    .path-lookup-s3 { animation-delay: 3.84s; }
    .path-lookup-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .path-lookup-conn  { animation: path-lookup-trace 6.4s ease-in-out infinite; }
      .path-lookup-stage { animation: path-lookup-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes path-lookup-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes path-lookup-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .path-lookup-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .path-lookup-stage { animation: path-lookup-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes path-lookup-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="path-lookup-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="path-lookup-bg" width="980" height="322"/>
  <text class="path-lookup-h1"  x="30" y="40">How the shell finds the program</text>
  <text class="path-lookup-sub" x="30" y="64">Why "command not found" is almost never about the program missing.</text>
  <g class="path-lookup-stage path-lookup-s0">
    <rect class="path-lookup-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="path-lookup-step" x="44" y="142">01</text>
    <text class="path-lookup-name" x="70" y="142">Is it a built-in?</text>
    <text class="path-lookup-desc" x="44" y="166">cd and export are the shell</text>
    <text class="path-lookup-desc" x="44" y="182">itself. No file is involved.</text>
  </g>
  <line class="path-lookup-line path-lookup-conn path-lookup-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#path-lookup-tip)"/>
  <g class="path-lookup-stage path-lookup-s1">
    <rect class="path-lookup-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="path-lookup-step" x="280" y="142">02</text>
    <text class="path-lookup-name" x="306" y="142">Search PATH in order</text>
    <text class="path-lookup-desc" x="280" y="166">A list of directories, checked</text>
    <text class="path-lookup-desc" x="280" y="182">left to right. First match wins.</text>
    <text class="path-lookup-edge" x="280" y="242">/usr/bin:/bin</text>
  </g>
  <line class="path-lookup-line path-lookup-conn path-lookup-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#path-lookup-tip)"/>
  <g class="path-lookup-stage path-lookup-s2">
    <rect class="path-lookup-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="path-lookup-step" x="516" y="142">03</text>
    <text class="path-lookup-name" x="542" y="142">Found — run it</text>
    <text class="path-lookup-desc" x="516" y="166">The shell asks the kernel to</text>
    <text class="path-lookup-desc" x="516" y="182">start it, then waits.</text>
  </g>
  <line class="path-lookup-line path-lookup-conn path-lookup-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#path-lookup-tip)"/>
  <g class="path-lookup-stage path-lookup-s3">
    <rect class="path-lookup-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="path-lookup-step" x="752" y="142">04</text>
    <text class="path-lookup-name" x="778" y="142">Not found anywhere</text>
    <text class="path-lookup-desc" x="752" y="166">The program may well be</text>
    <text class="path-lookup-desc" x="752" y="182">installed — just not in a</text>
    <text class="path-lookup-desc" x="752" y="198">directory on PATH.</text>
    <text class="path-lookup-edge" x="752" y="242">not found</text>
  </g>
  <text class="path-lookup-sub" x="30" y="304">Run type ls to see which of these happened. It distinguishes a built-in, an alias and a real program on disk.</text>
</svg>
