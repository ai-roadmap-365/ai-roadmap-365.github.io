<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" font-family="system-ui, sans-serif">
  <title>The shell's read-eval-print loop, from typing a line through parsing and running a program to the prompt returning</title>
  <rect x="0" y="0" width="700" height="440" fill="#f8fafc"/>
  <text x="350" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The shell's read-eval-print loop</text>

  <!-- Boxes -->
  <rect x="40" y="80" width="180" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="130" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. You type a line</text>
  <text x="130" y="132" text-anchor="middle" font-size="14" fill="#1a202c">and press Return</text>

  <rect x="260" y="80" width="180" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="350" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Shell parses</text>
  <text x="350" y="132" text-anchor="middle" font-size="14" fill="#1a202c">splits into words, expands</text>

  <rect x="480" y="80" width="180" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="570" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Runs the</text>
  <text x="570" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">program</text>
  <text x="570" y="144" text-anchor="middle" font-size="14" fill="#1a202c">found on the PATH</text>

  <rect x="480" y="230" width="180" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="570" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Prints output</text>
  <text x="570" y="282" text-anchor="middle" font-size="14" fill="#1a202c">to your screen</text>

  <rect x="260" y="230" width="180" height="72" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="350" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">5. Prompt returns</text>
  <text x="350" y="282" text-anchor="middle" font-size="14" fill="#1a202c">"ready; type here"</text>

  <!-- Arrows -->
  <line x1="220" y1="116" x2="252" y2="116" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="260,116 246,109 246,123" fill="#1d4ed8"/>

  <line x1="440" y1="116" x2="472" y2="116" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="480,116 466,109 466,123" fill="#1d4ed8"/>

  <line x1="570" y1="152" x2="570" y2="222" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="570,230 563,216 577,216" fill="#1d4ed8"/>

  <line x1="480" y1="266" x2="442" y2="266" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="440,266 454,259 454,273" fill="#1d4ed8"/>

  <!-- Loop back arrow: prompt returns to typing -->
  <line x1="350" y1="230" x2="350" y2="185" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="350" y1="185" x2="130" y2="185" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="130" y1="185" x2="130" y2="158" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="130,150 123,164 137,164" fill="#1d4ed8"/>
  <text x="240" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">loop: wait for your next command</text>

  <!-- Note -->
  <rect x="40" y="345" width="620" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="350" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Read, evaluate, print, repeat</text>
  <text x="350" y="391" text-anchor="middle" font-size="14" fill="#1a202c">The same loop runs whether the command is one word or a hundred; only step 2 grows richer.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 220 116 L 252 116" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 440 116 L 472 116" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 570 152 L 570 222" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 130 185 L 130 158" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 480 266 L 442 266" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
