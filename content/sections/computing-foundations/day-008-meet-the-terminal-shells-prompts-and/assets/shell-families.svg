<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="They share a core and differ at the edges.">
  <title>Which shell you are actually typing into</title>
  <style>
    .shell-families-bg   { fill: #f8fafc; }
    .shell-families-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-families-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-families-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-families-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-families-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-families-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-families-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shell-families-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shell-families-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shell-families-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shell-families-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shell-families-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-families-row { opacity: 1; }
    .shell-families-r0 { animation-delay: 0.00s; }
    .shell-families-r1 { animation-delay: 0.45s; }
    .shell-families-r2 { animation-delay: 0.90s; }
    .shell-families-r3 { animation-delay: 1.35s; }
    .shell-families-r4 { animation-delay: 1.80s; }
    .shell-families-row { animation: shell-families-reveal 7.3s ease-in-out infinite; }
    @keyframes shell-families-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shell-families-bg" width="980" height="390"/>
  <text class="shell-families-h1"  x="30" y="40">Which shell you are actually typing into</text>
  <text class="shell-families-sub" x="30" y="64">They share a core and differ at the edges.</text>
  <rect class="shell-families-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shell-families-name" x="46" y="122">bash</text>
  <text class="shell-families-desc" x="46" y="142">The default on almost every Linux server.</text>
  <text class="shell-families-desc shell-families-row shell-families-r0" x="46" y="182">What deployment scripts assume</text>
  <text class="shell-families-desc shell-families-row shell-families-r1" x="46" y="216">Present essentially everywhere</text>
  <text class="shell-families-desc shell-families-row shell-families-r2" x="46" y="250">Conservative, stable, well documented</text>
  <text class="shell-families-desc shell-families-row shell-families-r3" x="46" y="284">Learn its syntax for scripts you ship</text>
  <text class="shell-families-desc shell-families-row shell-families-r4" x="46" y="318">Startup files: .bashrc, .bash_profile</text>
  <rect class="shell-families-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shell-families-name" x="526" y="122">zsh</text>
  <text class="shell-families-desc" x="526" y="142">The default on macOS since Catalina.</text>
  <text class="shell-families-desc shell-families-row shell-families-r0" x="526" y="182">What your laptop probably runs</text>
  <text class="shell-families-desc shell-families-row shell-families-r1" x="526" y="216">Better completion and prompt customisation</text>
  <text class="shell-families-desc shell-families-row shell-families-r2" x="526" y="250">Largely bash-compatible for everyday use</text>
  <text class="shell-families-desc shell-families-row shell-families-r3" x="526" y="284">Fine interactively; test scripts under bash</text>
  <text class="shell-families-desc shell-families-row shell-families-r4" x="526" y="318">Startup file: .zshrc</text>
  <text class="shell-families-sub" x="30" y="372">Run echo $SHELL to see which you are in. The differences rarely matter until you write a script, and then they matter a lot.</text>
</svg>
