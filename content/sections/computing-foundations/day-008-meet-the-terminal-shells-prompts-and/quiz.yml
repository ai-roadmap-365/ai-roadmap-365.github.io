questions:
  - question: 'Which component actually reads your typed command, interprets it, and launches the right program?'
    options:
      - 'The terminal emulator'
      - 'The keyboard driver'
      - 'The operating system kernel by itself'
      - 'The shell'
    answer_index: 3
    explanation: 'The terminal emulator only displays text and forwards your keystrokes; the shell is the program running inside it that parses each command line and launches the program that does the work.'

  - question: 'In the command `ls -l /Users`, what is `-l`?'
    options:
      - 'An option that changes how the command behaves'
      - 'An argument naming the folder to act on'
      - 'The name of the command being run first'
      - 'The shell''s prompt string shown before it'
    answer_index: 0
    explanation: '`ls` is the command and `/Users` is the argument it acts on; `-l` is an option, or flag, that switches `ls` into its long, detailed listing format.'

  - question: 'What does the acronym REPL stand for, describing the shell''s core behaviour?'
    options:
      - 'Run-Execute-Process-Log'
      - 'Read-Eval-Print Loop'
      - 'Receive-Encode-Parse-Launch'
      - 'Render-Emit-Print-List'
    answer_index: 1
    explanation: 'A shell is a read-eval-print loop: it reads a line you type, evaluates it (parsing and finding the program), prints the result, and loops back to the prompt to wait for the next command.'

  - question: 'Why does macOS show a `%` prompt by default while many Linux systems show `$`?'
    options:
      - 'macOS uses a graphical shell and Linux uses a text shell'
      - 'The `%` means an error occurred and `$` means success'
      - 'macOS defaults to zsh (`%`); many Linux systems default to bash (`$`)'
      - 'The symbol is chosen at random each time a new terminal window is opened'
    answer_index: 2
    explanation: 'The prompt symbol comes from the default shell: zsh, the macOS default since Catalina in 2019, traditionally uses `%`, whereas bash, a common Linux default, traditionally uses `$`.'

  - question: 'Which statement about most commands (like `ls` or `date`) is true?'
    options:
      - 'They only work when connected to the internet'
      - 'They are features built directly into the shell program itself'
      - 'They are part of the terminal emulator window'
      - 'They are separate programs on disk that the shell launches'
    answer_index: 3
    explanation: 'Most commands are independent programs the shell finds by searching the PATH and then runs; the shell''s job is to locate the right program and pass along your options and arguments, not to do the work itself.'

  - question: 'What is the purpose of tab completion?'
    options:
      - 'It completes a partly typed command or filename'
      - 'It opens the manual page for a command'
      - 'It deletes the current line entirely'
      - 'It runs the previous command again'
    answer_index: 0
    explanation: 'Pressing Tab asks the shell to finish a partly typed command or filename (or show the choices if several match), which saves keystrokes and prevents typos in long names.'

  - question: 'Which command shows the reference manual for a command such as `ls`?'
    options:
      - '`help ls`'
      - '`man ls`'
      - '`info -q ls`'
      - '`ls --manual`'
    answer_index: 1
    explanation: '`man ls` opens the manual page for `ls`; you scroll with the arrow keys and press `q` to quit. Many commands also accept `--help` for a shorter summary.'

  - question: 'You typed `bash` to start a new shell, but `echo $SHELL` still prints `/bin/zsh`. Why?'
    options:
      - 'The command failed silently and no shell is running'
      - '`$SHELL` is always wrong and should be ignored'
      - '`$SHELL` reports your login shell, not the running one'
      - 'zsh and bash are the same program with two names'
    answer_index: 2
    explanation: '`$SHELL` names your default login shell, which stays zsh even after you start bash by hand. To see the shell running at this moment, use `echo $0` or `ps -p $$`.'
