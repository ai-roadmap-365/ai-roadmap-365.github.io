visuals:
  - id: terminal-anatomy
    file: assets/terminal-anatomy.svg
    type: diagram
    title: 'Anatomy of a terminal session'
    alt: 'Diagram: the terminal emulator, the shell inside it, and the operating system beneath, with a labelled command line'
    description: 'A nested diagram showing the terminal emulator containing the shell, which sits on the operating system, above a dissected command line (ls -l /Users) labelling the command, the option/flag, and the argument.'
  - id: shell-repl-loop
    file: assets/shell-repl-loop.svg
    type: flowchart
    title: "The shell's read-eval-print loop"
    alt: "Flowchart: the shell's read-eval-print loop, from typing a line to the prompt returning"
    description: 'A five-step loop: you type a line and press Return, the shell parses it, runs the program found on the PATH, prints the output, and the prompt returns to wait for your next command.'
  - id: shell-read-eval-print
    file: assets/shell-read-eval-print.svg
    type: diagram
    title: 'What happens between Return and the next prompt'
    alt: 'Diagram: the shell''s read, parse, execute and print cycle'
    description: 'A five-stage sequence showing the shell printing a prompt, reading a line, splitting it into a command and arguments, launching the program, and printing the result before returning to the prompt.'
  - id: command-line-parts
    file: assets/command-line-parts.svg
    type: diagram
    title: 'Every command line is the same three things'
    alt: 'Diagram: a command line split into command, options and arguments'
    description: 'A three-stage breakdown of the command line ls -l /Users into the command word that names the program, the option that changes its behaviour, and the argument that names what it acts on.'
  - id: gui-versus-shell
    file: assets/gui-versus-shell.svg
    type: diagram
    title: 'Pointing at things, and naming them'
    alt: 'Diagram: a graphical interface compared with a shell'
    description: 'A two-column comparison of graphical interfaces and command-line shells covering discoverability, repeatability, how work is shared, and how each scales from one item to thousands.'
  - id: path-lookup
    file: assets/path-lookup.svg
    type: diagram
    title: 'How the shell finds the program'
    alt: 'Diagram: how the shell searches PATH to locate a command'
    description: 'A four-stage sequence showing the shell checking built-ins and aliases, then searching each directory in PATH in order, running the first match found, and reporting command not found when no directory contains it.'
  - id: three-speed-features
    file: assets/three-speed-features.svg
    type: diagram
    title: 'The three habits worth building on day one'
    alt: 'Diagram: command history, tab completion and the manual'
    description: 'A three-stage sequence covering command history recalled with the up arrow, tab completion of commands and filenames, and the built-in manual pages, with the command that exposes each.'
  - id: shell-families
    file: assets/shell-families.svg
    type: diagram
    title: 'Which shell you are actually typing into'
    alt: 'Diagram: bash compared with zsh and the other common shells'
    description: 'A two-column comparison of bash and zsh covering where each is the default, what it is best at, and how portable scripts written for each are.'
  - id: terminal-safety
    file: assets/terminal-safety.svg
    type: diagram
    title: 'The shell does exactly what you said'
    alt: 'Diagram: safe and unsafe habits at the command line'
    description: 'A two-column comparison of dangerous command-line habits against safer equivalents, covering deletion, piping downloads to a shell, secrets on the command line, and working as an administrator.'
  - id: expansion-before-launch
    file: assets/expansion-before-launch.svg
    type: diagram
    title: 'The shell rewrites your line before anything runs'
    alt: 'Diagram: the expansions the shell performs before launching a program'
    description: 'A four-stage sequence showing the shell expanding a tilde to the home directory, a variable to its value, a wildcard to matching filenames, and then splitting the result into words before the program is started.'
