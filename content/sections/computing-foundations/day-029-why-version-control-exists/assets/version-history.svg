<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="system-ui, sans-serif">
  <title>A project history as a timeline of commits, with a feature branch that splits off the main line and merges back</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A project history: commits, a branch, and a merge</text>

  <!-- Track labels -->
  <text x="20" y="300" font-size="15" font-weight="bold" fill="#1a202c">main</text>
  <text x="20" y="150" font-size="15" font-weight="bold" fill="#1d4ed8">feature</text>

  <!-- Main line connectors -->
  <line x1="110" y1="290" x2="230" y2="290" stroke="#1a202c" stroke-width="3"/>
  <line x1="230" y1="290" x2="470" y2="290" stroke="#1a202c" stroke-width="3"/>
  <line x1="470" y1="290" x2="600" y2="290" stroke="#1a202c" stroke-width="3"/>

  <!-- Branch out and back -->
  <line x1="230" y1="290" x2="330" y2="150" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="330" y1="150" x2="470" y2="150" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="470" y1="150" x2="600" y2="290" stroke="#1d4ed8" stroke-width="3"/>

  <!-- Main commits -->
  <circle cx="110" cy="290" r="20" fill="#dbeafe" stroke="#1a202c" stroke-width="2"/>
  <text x="110" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">C1</text>
  <circle cx="230" cy="290" r="20" fill="#dbeafe" stroke="#1a202c" stroke-width="2"/>
  <text x="230" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">C2</text>
  <circle cx="470" cy="290" r="20" fill="#dbeafe" stroke="#1a202c" stroke-width="2"/>
  <text x="470" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">C3</text>
  <circle cx="600" cy="290" r="22" fill="#1d4ed8" stroke="#1a202c" stroke-width="2"/>
  <text x="600" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">M</text>

  <!-- Feature commits -->
  <circle cx="330" cy="150" r="20" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="330" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">F1</text>
  <circle cx="470" cy="150" r="20" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="470" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">F2</text>

  <!-- HEAD pointer -->
  <line x1="600" y1="345" x2="600" y2="316" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="600,312 593,326 607,326" fill="#1d4ed8"/>
  <text x="600" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">HEAD</text>

  <!-- Annotations -->
  <text x="230" y="248" text-anchor="middle" font-size="14" fill="#1a202c">branch splits off</text>
  <text x="600" y="248" text-anchor="middle" font-size="14" fill="#1a202c">merge joins back</text>

  <!-- Legend -->
  <text x="360" y="398" text-anchor="middle" font-size="14" fill="#1a202c">Each circle is a commit (a labeled snapshot); arrows run back to each commit's parent. Nothing is ever erased.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 600 345 L 600 316" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
