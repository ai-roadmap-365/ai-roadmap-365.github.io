<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>Centralized version control with one server holding the history beside distributed version control where every clone holds the full history</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Centralized vs. distributed version control</text>

  <!-- Divider -->
  <line x1="380" y1="60" x2="380" y2="440" stroke="#1a202c" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- ===== LEFT: CENTRALIZED ===== -->
  <text x="190" y="76" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Centralized</text>

  <!-- Central server with full history -->
  <rect x="120" y="96" width="140" height="72" fill="#1d4ed8" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="190" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">Server</text>
  <text x="190" y="148" text-anchor="middle" font-size="14" fill="#f8fafc">full history</text>

  <!-- Working copies (no history) -->
  <rect x="60" y="300" width="120" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="120" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Developer A</text>
  <text x="120" y="346" text-anchor="middle" font-size="14" fill="#1a202c">working copy</text>

  <rect x="200" y="300" width="120" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="260" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Developer B</text>
  <text x="260" y="346" text-anchor="middle" font-size="14" fill="#1a202c">working copy</text>

  <!-- Links to server -->
  <line x1="120" y1="300" x2="175" y2="170" stroke="#1a202c" stroke-width="2"/>
  <line x1="260" y1="300" x2="205" y2="170" stroke="#1a202c" stroke-width="2"/>

  <text x="190" y="398" text-anchor="middle" font-size="14" fill="#1a202c">History lives only on the server;</text>
  <text x="190" y="418" text-anchor="middle" font-size="14" fill="#1a202c">most actions need the network.</text>

  <!-- ===== RIGHT: DISTRIBUTED ===== -->
  <text x="570" y="76" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Distributed</text>

  <!-- Shared/reference clone -->
  <rect x="500" y="96" width="140" height="72" fill="#1d4ed8" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="570" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">Shared clone</text>
  <text x="570" y="148" text-anchor="middle" font-size="14" fill="#f8fafc">full history</text>

  <!-- Two developer clones, each full history -->
  <rect x="440" y="300" width="120" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="500" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Developer A</text>
  <text x="500" y="346" text-anchor="middle" font-size="14" fill="#1a202c">full history</text>

  <rect x="580" y="300" width="120" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="640" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Developer B</text>
  <text x="640" y="346" text-anchor="middle" font-size="14" fill="#1a202c">full history</text>

  <!-- Push/pull links -->
  <line x1="500" y1="300" x2="555" y2="170" stroke="#1a202c" stroke-width="2"/>
  <line x1="640" y1="300" x2="585" y2="170" stroke="#1a202c" stroke-width="2"/>

  <text x="570" y="398" text-anchor="middle" font-size="14" fill="#1a202c">Every clone holds the full history;</text>
  <text x="570" y="418" text-anchor="middle" font-size="14" fill="#1a202c">commit, log, and diff run locally.</text>
</svg>
