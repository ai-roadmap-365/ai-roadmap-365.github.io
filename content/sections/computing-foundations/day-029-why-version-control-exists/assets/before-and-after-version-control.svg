<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four problems, and the one mechanism that answers all of them.">
  <title>The same team, with and without history</title>
  <style>
    .before-and-after-version-control-bg   { fill: #f8fafc; }
    .before-and-after-version-control-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-and-after-version-control-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-and-after-version-control-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-and-after-version-control-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-and-after-version-control-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-and-after-version-control-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .before-and-after-version-control-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .before-and-after-version-control-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .before-and-after-version-control-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .before-and-after-version-control-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .before-and-after-version-control-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="before-and-after-version-control-bg" width="980" height="390"/>
  <text class="before-and-after-version-control-h1"  x="30" y="40">The same team, with and without history</text>
  <text class="before-and-after-version-control-sub" x="30" y="64">Four problems, and the one mechanism that answers all of them.</text>
  <rect class="before-and-after-version-control-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="before-and-after-version-control-name" x="46" y="122">Without</text>
  <text class="before-and-after-version-control-desc" x="46" y="142">final_v2_FINAL_actually.docx</text>
  <text class="before-and-after-version-control-desc" x="46" y="182">Save over a file and the old version is gone</text>
  <text class="before-and-after-version-control-desc" x="46" y="216">Nobody knows when the broken line arrived</text>
  <text class="before-and-after-version-control-desc" x="46" y="250">Trying an idea risks the working version</text>
  <text class="before-and-after-version-control-desc" x="46" y="284">Two people editing means one overwrites the other</text>
  <text class="before-and-after-version-control-desc" x="46" y="318">'It worked last week' is unfalsifiable</text>
  <rect class="before-and-after-version-control-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="before-and-after-version-control-name" x="526" y="122">With</text>
  <text class="before-and-after-version-control-desc" x="526" y="142">Every state, recoverable</text>
  <text class="before-and-after-version-control-desc" x="526" y="182">Every commit is kept and can be restored</text>
  <text class="before-and-after-version-control-desc" x="526" y="216">Author, time and message on every line</text>
  <text class="before-and-after-version-control-desc" x="526" y="250">Branches make experiments free to abandon</text>
  <text class="before-and-after-version-control-desc" x="526" y="284">Independent work merges; real conflicts are flagged</text>
  <text class="before-and-after-version-control-desc" x="526" y="318">'This commit, this config, this data'</text>
  <text class="before-and-after-version-control-sub" x="30" y="372">A result you cannot reproduce is a claim, not a finding. This is the first of the things that make it a finding.</text>
</svg>
