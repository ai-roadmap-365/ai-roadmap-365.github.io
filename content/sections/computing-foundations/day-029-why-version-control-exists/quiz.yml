questions:
  - question: 'Which pair of roles best captures what a version control system does?'
    options:
      - 'A time machine for your files and a system for many people to change them safely'
      - 'A spell-checker and a file compressor'
      - 'A password manager and a cloud backup scheduler'
      - 'A text editor and a code compiler'
    answer_index: 0
    explanation: 'Version control fuses two tools: a time machine that lets you snapshot and return to any earlier state, and a collaboration system that lets many people change the same files without losing work.'

  - question: 'What is a commit?'
    options:
      - 'A permanent lock that prevents a file from ever being edited again'
      - 'A copy of a file uploaded to a cloud drive'
      - 'A promise to finish a feature by a deadline'
      - 'A saved snapshot of the project, stamped with an author, a timestamp, a message, and a link to its parent commit'
    answer_index: 3
    explanation: 'A commit records the state of the tracked files plus metadata — who made it, when, a descriptive message, and a pointer to the previous (parent) commit — and a chain of commits is the project history.'

  - question: 'Which statement about version control is accurate?'
    options:
      - 'It is simply an automatic backup that snapshots files on a schedule'
      - 'It records intentional, labeled changes and why they were made, and lets you branch and merge'
      - 'It keeps only the most recent version of each file to save space'
      - 'It is the same as a shared cloud folder that syncs your latest file everywhere'
    answer_index: 1
    explanation: 'Unlike a scheduled backup or a sync service, version control captures deliberate, labeled changes and their reasons, keeps the full history, and supports branching and merging.'

  - question: 'What does a diff show?'
    options:
      - 'The total number of files in a repository'
      - 'A list of every person who has ever cloned the repository'
      - 'The precise lines that were added and removed between two commits'
      - 'The amount of disk space the history occupies'
    answer_index: 2
    explanation: 'A diff compares two commits and reports exactly which lines changed — additions and deletions — which is how you answer "what changed?" without reading whole files.'

  - question: 'Why did the Linux kernel project prompt the creation of Git in 2005?'
    options:
      - 'Its developers wanted a system with no history at all'
      - 'The free license for the distributed system it had been using (BitKeeper) was withdrawn, so it needed a new distributed system'
      - 'Subversion had become too fast for their needs'
      - 'They wanted to stop using version control entirely'
    answer_index: 1
    explanation: 'The kernel had relied on BitKeeper under a free license; when that license was withdrawn in 2005, Linus Torvalds wrote Git to provide a fast, distributed, integrity-checked replacement.'

  - question: 'In a distributed version control system such as Git, where does the project history live?'
    options:
      - 'Only on a single central server'
      - 'Only in the cloud, never on your machine'
      - 'On every developer''s clone — each holds the full history'
      - 'Nowhere; distributed systems keep no history'
    answer_index: 2
    explanation: 'Every clone in a distributed system contains the entire history, which is why committing, viewing the log, diffing, and branching are all local and instant, and why the project survives any single machine failing.'

  - question: 'Which everyday operation is fast in a distributed system specifically because it needs no network?'
    options:
      - 'Downloading the entire history for the first time'
      - 'Inviting a new collaborator by email'
      - 'Buying more server storage'
      - 'Viewing the commit log'
    answer_index: 3
    explanation: 'Because your clone already holds the full history, viewing the log — like committing, diffing, and switching branches — runs locally at disk speed with no server round-trip.'

  - question: 'Why do practitioners put datasets, notebooks, and configurations under version control, not just source code?'
    options:
      - 'So that a past result can be reproduced by recovering the exact files and settings that produced it'
      - 'Because version control automatically improves the accuracy of any dataset'
      - 'Because it converts binary files into text'
      - 'Because hosting platforms require every file to be a dataset'
    answer_index: 0
    explanation: 'Reproducibility depends on recovering the exact code, data reference, and configuration behind a result; committing all of them means you can check out the commit that produced a past outcome and get it back.'
