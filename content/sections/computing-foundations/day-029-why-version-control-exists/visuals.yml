visuals:
  - id: version-history
    file: assets/version-history.svg
    type: diagram
    title: 'A project history: commits, a branch, and a merge'
    alt: 'Diagram: a project history as a timeline of commits with a branch that splits off and merges back'
    description: 'A left-to-right timeline where each circle is a commit linked to its parent: a main line of commits, a feature branch that splits off, gains its own commits, and merges back into main, with a HEAD pointer marking the current commit and nothing ever erased.'
  - id: centralized-vs-distributed
    file: assets/centralized-vs-distributed.svg
    type: flowchart
    title: 'Centralized vs. distributed version control'
    alt: 'Diagram: a centralized model with one server holding history beside a distributed model where every clone holds the full history'
    description: 'A side-by-side comparison: on the left a centralized model where one server holds the full history and developers keep only working copies that must reach the server; on the right a distributed model where a shared clone and every developer''s clone each hold the full history, so commit, log, and diff run locally.'
  - id: before-and-after-version-control
    file: assets/before-and-after-version-control.svg
    type: diagram
    title: 'The same team, with and without history'
    alt: 'Diagram: working without version control compared with working with it'
    description: 'A two-column comparison of a project without version control and the same project with it, covering history, attribution, experimentation and collaboration.'
  - id: commit-anatomy-29
    file: assets/commit-anatomy-29.svg
    type: diagram
    title: 'What one commit records'
    alt: 'Diagram: the parts of a single commit'
    description: 'A four-stage breakdown of a commit covering the snapshot of tracked files, the author and timestamp, the message explaining the change, and the pointer to the parent commit.'
  - id: folder-versioning
    file: assets/folder-versioning.svg
    type: diagram
    title: 'The system everyone invents first'
    alt: 'Diagram: dated folder copies compared with version control'
    description: 'A two-column comparison of manually copying folders with dated names against using version control, covering what each records and how each behaves with more than one person.'
  - id: undo-is-a-new-commit
    file: assets/undo-is-a-new-commit.svg
    type: diagram
    title: 'Undoing adds to history rather than removing from it'
    alt: 'Diagram: how reverting a change is recorded as a new commit'
    description: 'A four-stage sequence showing a mistaken commit, a revert that restores the earlier content as a new commit, and the mistaken commit remaining visible in the history.'
  - id: binaries-in-git
    file: assets/binaries-in-git.svg
    type: diagram
    title: 'Why large files ruin a repository'
    alt: 'Diagram: how text and binary files behave differently in version control'
    description: 'A two-column comparison of text and binary files in a repository, covering how storage grows with each change and the effect on clone time.'
  - id: vcs-history
    file: assets/vcs-history.svg
    type: diagram
    title: 'Four generations, each fixing the last'
    alt: 'Diagram: the progression of version control systems'
    description: 'A four-stage progression of version control from single-file locking systems, through project-wide centralised systems, to distributed systems, naming what each generation made possible.'
  - id: branch-and-merge
    file: assets/branch-and-merge.svg
    type: diagram
    title: 'Why branching changes how you work'
    alt: 'Diagram: how a branch isolates work and a merge rejoins it'
    description: 'A four-stage sequence showing a branch splitting from the main line, work proceeding independently on both, the branch being merged back, and the option of discarding it instead.'
  - id: experiment-reproducibility
    file: assets/experiment-reproducibility.svg
    type: diagram
    title: 'What makes a result reproducible'
    alt: 'Diagram: what must be recorded for an experiment to be reproducible'
    description: 'A two-column comparison of an unreproducible experiment against a reproducible one, covering code, configuration, data and the record linking them to a result.'
  - id: commit-message-quality
    file: assets/commit-message-quality.svg
    type: diagram
    title: 'The one part of a commit a machine cannot reconstruct'
    alt: 'Diagram: unhelpful commit messages compared with useful ones'
    description: 'A two-column comparison of commit messages that restate the diff against messages that explain the reason for a change, and what each is worth when read months later.'
  - id: what-a-diff-shows
    file: assets/what-a-diff-shows.svg
    type: diagram
    title: 'What a diff shows, and what it cannot'
    alt: 'Diagram: what a diff reveals compared with what only a commit message can'
    description: 'A two-column comparison of the information a diff conveys against the information that must be recorded in a commit message.'
