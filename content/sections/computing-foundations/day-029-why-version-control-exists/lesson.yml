id: D029
day: 29
slug: why-version-control-exists
title: 'Why Version Control Exists'
section: computing-foundations
subsection: developer-workflow
week: 5
learning_promise: 'After this lesson you will be able to explain what problem version control solves, name its core ideas — history, commits, diffs, reverting, branching, and merging — and say why the distributed design Git uses won, so you understand what every repository you touch is really doing.'
objectives:
  - 'Explain the problems version control solves — lost work, untraceable changes, unsafe experimentation, uncoordinated collaboration, and irreproducible results — in terms of the world before it existed'
  - 'Define version control as both a time machine and a collaboration system, and describe a commit, its metadata, and how a chain of commits forms a project history'
  - 'Explain diffs, reverting, branching, and merging, and how they build safe, reversible change on top of an append-only history'
  - 'Distinguish centralized from distributed version control and give concrete reasons the distributed model won on speed, offline work, and resilience'
  - 'Name the leading tools — Git, Mercurial, Perforce, and the hosting platforms GitHub, GitLab, and Bitbucket — with when to choose each and what is free'
  - 'Connect version control to reproducible, collaborative work with code, datasets, notebooks, and configurations, and inspect a real three-commit history from the command line'
prerequisites:
  - 'A computer running macOS, Linux, or Windows with a terminal (Days 8–14 introduced the shell)'
  - 'Git installed, or the ability to install it freely (the lab explains how); no prior version control experience required'
reading_time_minutes: 40
practical_time_minutes: 30
