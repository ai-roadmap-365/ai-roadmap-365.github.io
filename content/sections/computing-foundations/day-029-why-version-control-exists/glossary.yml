terms:
  - term: version control
    definition: 'A system that records the full history of a set of files over time so you can recall any earlier version, see what changed, and let many people change the files without losing work.'
  - term: repository
    definition: 'The store of a project''s complete history — in Git, a hidden database (often a `.git` folder) that lives alongside the files and holds every commit.'
  - term: commit
    definition: 'One saved snapshot of a project, stamped with its author, a timestamp, a descriptive message, a unique identifier, and a pointer to its parent commit.'
  - term: snapshot
    definition: 'The captured state of the tracked files at the moment of a commit; a project''s history is a sequence of these snapshots.'
  - term: history
    definition: 'The ordered chain of commits that records how a project reached its current state, with each commit linked to the one before it.'
  - term: diff
    definition: 'The precise list of lines added and removed between two commits, used to answer "what changed?" without reading whole files.'
  - term: revert
    definition: 'Bringing back the content of an earlier commit — recorded as a new step in the history rather than by erasing the commits in between.'
  - term: branch
    definition: 'A separate line of commits that splits off from the main line so you can experiment or build a feature in isolation without disturbing others.'
  - term: merge
    definition: 'Folding the changes from two branches back together into one; where both changed the same lines, the system flags a conflict for a human to resolve.'
  - term: centralized VCS
    definition: 'A version control design in which one server holds the authoritative history and developers keep only working copies, so most operations require the network (for example, Subversion).'
  - term: distributed VCS
    definition: 'A version control design in which every developer clones the entire repository, history and all, so committing, diffing, and branching are local and instant (for example, Git and Mercurial).'
  - term: clone
    definition: 'A full local copy of a repository, including its complete history, made when you obtain a project from another copy.'
  - term: merge conflict
    definition: 'The situation where two branches changed the same lines and the system cannot combine them automatically, so it asks a person to decide the correct result.'
