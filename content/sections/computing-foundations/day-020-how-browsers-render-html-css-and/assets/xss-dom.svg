<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The browser cannot tell your markup from theirs.">
  <title>Why you never build HTML from user input</title>
  <style>
    .xss-dom-bg   { fill: #f8fafc; }
    .xss-dom-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xss-dom-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xss-dom-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xss-dom-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xss-dom-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .xss-dom-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .xss-dom-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .xss-dom-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .xss-dom-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .xss-dom-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .xss-dom-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .xss-dom-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .xss-dom-row { opacity: 1; }
    .xss-dom-r0 { animation-delay: 0.00s; }
    .xss-dom-r1 { animation-delay: 0.45s; }
    .xss-dom-r2 { animation-delay: 0.90s; }
    .xss-dom-r3 { animation-delay: 1.35s; }
    .xss-dom-r4 { animation-delay: 1.80s; }
    .xss-dom-row { animation: xss-dom-reveal 7.3s ease-in-out infinite; }
    @keyframes xss-dom-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="xss-dom-bg" width="980" height="390"/>
  <text class="xss-dom-h1"  x="30" y="40">Why you never build HTML from user input</text>
  <text class="xss-dom-sub" x="30" y="64">The browser cannot tell your markup from theirs.</text>
  <rect class="xss-dom-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="xss-dom-name" x="46" y="122">As markup</text>
  <text class="xss-dom-desc" x="46" y="142">innerHTML = userInput</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r0" x="46" y="182">The browser parses it as HTML</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r1" x="46" y="216">A &lt;script&gt; in the input becomes a script</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r2" x="46" y="250">It runs with your page's privileges</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r3" x="46" y="284">It can read cookies and call your API</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r4" x="46" y="318">This is cross-site scripting</text>
  <rect class="xss-dom-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="xss-dom-name" x="526" y="122">As text</text>
  <text class="xss-dom-desc" x="526" y="142">textContent = userInput</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r0" x="526" y="182">The browser creates a text node</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r1" x="526" y="216">Tags are shown as characters, not parsed</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r2" x="526" y="250">Nothing can execute</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r3" x="526" y="284">Same visible result for ordinary input</text>
  <text class="xss-dom-desc xss-dom-row xss-dom-r4" x="526" y="318">Escape properly if you truly need markup</text>
  <text class="xss-dom-sub" x="30" y="372">Every script you include on a page has this same access, which is why a third-party analytics tag is a party to your users' data whether you intended that or not.</text>
</svg>
