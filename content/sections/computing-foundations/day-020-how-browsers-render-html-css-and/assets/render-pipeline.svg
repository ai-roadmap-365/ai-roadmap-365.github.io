<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="A script in the middle stops the whole thing until it has run.">
  <title>From bytes on the wire to pixels on the screen</title>
  <style>
    .render-pipeline-bg   { fill: #f8fafc; }
    .render-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .render-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .render-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .render-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .render-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .render-pipeline-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .render-pipeline-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .render-pipeline-tok { animation: render-pipeline-travel 7s ease-in-out infinite; }
    }
    @keyframes render-pipeline-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--render-pipeline-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .render-pipeline-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="render-pipeline-bg" width="980" height="334"/>
  <text class="render-pipeline-h1"  x="30" y="40">From bytes on the wire to pixels on the screen</text>
  <text class="render-pipeline-sub" x="30" y="64">A script in the middle stops the whole thing until it has run.</text>
  <rect class="render-pipeline-box" x="30" y="132" width="166" height="96" rx="9"/>
  <text class="render-pipeline-name" x="44" y="160">Parse HTML</text>
  <text class="render-pipeline-desc" x="44" y="182">Build the DOM — a live</text>
  <text class="render-pipeline-desc" x="44" y="198">tree scripts can change.</text>
  <text class="render-pipeline-edge" x="44" y="248">blocking</text>
  <line class="render-pipeline-line" x1="199" y1="180" x2="215" y2="180"/>
  <rect class="render-pipeline-box" x="218" y="132" width="166" height="96" rx="9"/>
  <text class="render-pipeline-name" x="232" y="160">Parse CSS</text>
  <text class="render-pipeline-desc" x="232" y="182">Build the CSSOM — which</text>
  <text class="render-pipeline-desc" x="232" y="198">rules apply to which</text>
  <text class="render-pipeline-desc" x="232" y="214">elements.</text>
  <text class="render-pipeline-edge" x="232" y="248">blocking</text>
  <line class="render-pipeline-line" x1="387" y1="180" x2="403" y2="180"/>
  <rect class="render-pipeline-hi" x="406" y="132" width="166" height="96" rx="9"/>
  <text class="render-pipeline-name" x="420" y="160">Render tree</text>
  <text class="render-pipeline-desc" x="420" y="182">Combine the two;</text>
  <text class="render-pipeline-desc" x="420" y="198">display:none elements are</text>
  <text class="render-pipeline-desc" x="420" y="214">excluded here.</text>
  <text class="render-pipeline-edge" x="420" y="248">visible only</text>
  <line class="render-pipeline-line" x1="575" y1="180" x2="591" y2="180"/>
  <rect class="render-pipeline-box" x="594" y="132" width="166" height="96" rx="9"/>
  <text class="render-pipeline-name" x="608" y="160">Layout</text>
  <text class="render-pipeline-desc" x="608" y="182">Work out the size and</text>
  <text class="render-pipeline-desc" x="608" y="198">position of every box.</text>
  <text class="render-pipeline-edge" x="608" y="248">reflow</text>
  <line class="render-pipeline-line" x1="763" y1="180" x2="779" y2="180"/>
  <rect class="render-pipeline-box" x="782" y="132" width="166" height="96" rx="9"/>
  <text class="render-pipeline-name" x="796" y="160">Paint</text>
  <text class="render-pipeline-desc" x="796" y="182">Fill in pixels. The page</text>
  <text class="render-pipeline-desc" x="796" y="198">becomes visible.</text>
  <text class="render-pipeline-edge" x="796" y="248">first paint</text>
  <rect class="render-pipeline-tok" x="34" y="106" width="58" height="14" rx="3" style="--render-pipeline-run: 752px"/>
  <text class="render-pipeline-sub" x="30" y="314">An ordinary script tag is render-blocking: the parser stops to run it before continuing to build the DOM.</text>
</svg>
