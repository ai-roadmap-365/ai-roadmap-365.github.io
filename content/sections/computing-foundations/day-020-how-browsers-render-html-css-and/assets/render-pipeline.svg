<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A script in the middle stops the whole thing until it has run.">
  <title>From bytes on the wire to pixels on the screen</title>
  <style>
    .render-pipeline-bg   { fill: #f8fafc; }
    .render-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .render-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .render-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .render-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .render-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .render-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .render-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .render-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .render-pipeline-stage { opacity: 1; }

    .render-pipeline-s0 { animation-delay: 0.00s; }
    .render-pipeline-e0 { animation-delay: 0.00s; }
    .render-pipeline-s1 { animation-delay: 1.33s; }
    .render-pipeline-e1 { animation-delay: 1.33s; }
    .render-pipeline-s2 { animation-delay: 2.67s; }
    .render-pipeline-e2 { animation-delay: 2.67s; }
    .render-pipeline-s3 { animation-delay: 4.00s; }
    .render-pipeline-e3 { animation-delay: 4.00s; }
    .render-pipeline-s4 { animation-delay: 5.33s; }
    .render-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .render-pipeline-conn  { animation: render-pipeline-trace 8s ease-in-out infinite; }
      .render-pipeline-stage { animation: render-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes render-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes render-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .render-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .render-pipeline-stage { animation: render-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes render-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="render-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="render-pipeline-bg" width="980" height="322"/>
  <text class="render-pipeline-h1"  x="30" y="40">From bytes on the wire to pixels on the screen</text>
  <text class="render-pipeline-sub" x="30" y="64">A script in the middle stops the whole thing until it has run.</text>
  <g class="render-pipeline-stage render-pipeline-s0">
    <rect class="render-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="render-pipeline-step" x="44" y="142">01</text>
    <text class="render-pipeline-name" x="70" y="142">Parse HTML</text>
    <text class="render-pipeline-desc" x="44" y="166">Build the DOM — a live</text>
    <text class="render-pipeline-desc" x="44" y="182">tree scripts can change.</text>
    <text class="render-pipeline-edge" x="44" y="242">blocking</text>
  </g>
  <line class="render-pipeline-line render-pipeline-conn render-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#render-pipeline-tip)"/>
  <g class="render-pipeline-stage render-pipeline-s1">
    <rect class="render-pipeline-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="render-pipeline-step" x="233" y="142">02</text>
    <text class="render-pipeline-name" x="259" y="142">Parse CSS</text>
    <text class="render-pipeline-desc" x="233" y="166">Build the CSSOM — which</text>
    <text class="render-pipeline-desc" x="233" y="182">rules apply to which</text>
    <text class="render-pipeline-desc" x="233" y="198">elements.</text>
    <text class="render-pipeline-edge" x="233" y="242">blocking</text>
  </g>
  <line class="render-pipeline-line render-pipeline-conn render-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#render-pipeline-tip)"/>
  <g class="render-pipeline-stage render-pipeline-s2">
    <rect class="render-pipeline-hi" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="render-pipeline-step" x="422" y="142">03</text>
    <text class="render-pipeline-name" x="448" y="142">Render tree</text>
    <text class="render-pipeline-desc" x="422" y="166">Combine the two;</text>
    <text class="render-pipeline-desc" x="422" y="182">display:none elements are</text>
    <text class="render-pipeline-desc" x="422" y="198">excluded here.</text>
    <text class="render-pipeline-edge" x="422" y="242">visible only</text>
  </g>
  <line class="render-pipeline-line render-pipeline-conn render-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#render-pipeline-tip)"/>
  <g class="render-pipeline-stage render-pipeline-s3">
    <rect class="render-pipeline-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="render-pipeline-step" x="611" y="142">04</text>
    <text class="render-pipeline-name" x="637" y="142">Layout</text>
    <text class="render-pipeline-desc" x="611" y="166">Work out the size and</text>
    <text class="render-pipeline-desc" x="611" y="182">position of every box.</text>
    <text class="render-pipeline-edge" x="611" y="242">reflow</text>
  </g>
  <line class="render-pipeline-line render-pipeline-conn render-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#render-pipeline-tip)"/>
  <g class="render-pipeline-stage render-pipeline-s4">
    <rect class="render-pipeline-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="render-pipeline-step" x="800" y="142">05</text>
    <text class="render-pipeline-name" x="826" y="142">Paint</text>
    <text class="render-pipeline-desc" x="800" y="166">Fill in pixels. The page</text>
    <text class="render-pipeline-desc" x="800" y="182">becomes visible.</text>
    <text class="render-pipeline-edge" x="800" y="242">first paint</text>
  </g>
  <text class="render-pipeline-sub" x="30" y="304">An ordinary script tag is render-blocking: the parser stops to run it before continuing to build the DOM.</text>
</svg>
