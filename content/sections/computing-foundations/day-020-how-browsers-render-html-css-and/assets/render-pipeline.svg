<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" font-family="system-ui, sans-serif">
  <title>The browser rendering pipeline, turning HTML and CSS into the render tree, then layout, then the painted page</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The browser rendering pipeline</text>

  <!-- Inputs: HTML and CSS -->
  <rect x="30" y="80" width="150" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="105" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">HTML</text>
  <text x="105" y="126" text-anchor="middle" font-size="14" fill="#1a202c">bytes from server</text>

  <rect x="30" y="210" width="150" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="105" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">CSS</text>
  <text x="105" y="256" text-anchor="middle" font-size="14" fill="#1a202c">styles from page</text>

  <!-- Parsed trees -->
  <rect x="220" y="80" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="295" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">DOM tree</text>
  <text x="295" y="126" text-anchor="middle" font-size="14" fill="#1a202c">parse HTML</text>

  <rect x="220" y="210" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="295" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">CSSOM tree</text>
  <text x="295" y="256" text-anchor="middle" font-size="14" fill="#1a202c">parse CSS</text>

  <!-- Render tree -->
  <rect x="410" y="145" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="485" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Render tree</text>
  <text x="485" y="191" text-anchor="middle" font-size="14" fill="#1a202c">visible + styled</text>

  <!-- Layout -->
  <rect x="410" y="255" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="485" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Layout</text>
  <text x="485" y="301" text-anchor="middle" font-size="14" fill="#1a202c">size + position</text>

  <!-- Paint -->
  <rect x="600" y="145" width="130" height="60" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="665" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Paint</text>
  <text x="665" y="191" text-anchor="middle" font-size="14" fill="#ffffff">pixels on screen</text>

  <!-- Arrows -->
  <!-- HTML -> DOM -->
  <line x1="180" y1="110" x2="212" y2="110" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="220,110 206,103 206,117" fill="#1d4ed8"/>
  <!-- CSS -> CSSOM -->
  <line x1="180" y1="240" x2="212" y2="240" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="220,240 206,233 206,247" fill="#1d4ed8"/>
  <!-- DOM -> render tree -->
  <line x1="370" y1="110" x2="405" y2="160" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="410,166 396,160 405,150" fill="#1d4ed8"/>
  <!-- CSSOM -> render tree -->
  <line x1="370" y1="240" x2="405" y2="190" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="410,184 405,200 396,190" fill="#1d4ed8"/>
  <!-- render tree -> layout -->
  <line x1="485" y1="205" x2="485" y2="247" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="485,255 478,241 492,241" fill="#1d4ed8"/>
  <!-- layout -> paint -->
  <line x1="560" y1="270" x2="640" y2="270" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="640" y1="270" x2="640" y2="212" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="640,205 633,219 647,219" fill="#1d4ed8"/>

  <text x="380" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">This whole left-to-right path — bytes to pixels — is the critical rendering path.</text>
</svg>
