<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The single most useful front-end technique for AI work.">
  <title>Getting heavy work off the main thread</title>
  <style>
    .main-thread-offload-bg   { fill: #f8fafc; }
    .main-thread-offload-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .main-thread-offload-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .main-thread-offload-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .main-thread-offload-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .main-thread-offload-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .main-thread-offload-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .main-thread-offload-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .main-thread-offload-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .main-thread-offload-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .main-thread-offload-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .main-thread-offload-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .main-thread-offload-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .main-thread-offload-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .main-thread-offload-stage { opacity: 1; }

    .main-thread-offload-s0 { animation-delay: 0.00s; }
    .main-thread-offload-e0 { animation-delay: 0.00s; }
    .main-thread-offload-s1 { animation-delay: 1.28s; }
    .main-thread-offload-e1 { animation-delay: 1.28s; }
    .main-thread-offload-s2 { animation-delay: 2.56s; }
    .main-thread-offload-e2 { animation-delay: 2.56s; }
    .main-thread-offload-s3 { animation-delay: 3.84s; }
    .main-thread-offload-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .main-thread-offload-conn  { animation: main-thread-offload-trace 6.4s ease-in-out infinite; }
      .main-thread-offload-stage { animation: main-thread-offload-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes main-thread-offload-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes main-thread-offload-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .main-thread-offload-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .main-thread-offload-stage { animation: main-thread-offload-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes main-thread-offload-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="main-thread-offload-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="main-thread-offload-bg" width="980" height="322"/>
  <text class="main-thread-offload-h1"  x="30" y="40">Getting heavy work off the main thread</text>
  <text class="main-thread-offload-sub" x="30" y="64">The single most useful front-end technique for AI work.</text>
  <g class="main-thread-offload-stage main-thread-offload-s0">
    <rect class="main-thread-offload-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="main-thread-offload-step" x="44" y="142">01</text>
    <text class="main-thread-offload-name" x="70" y="142">On the main thread</text>
    <text class="main-thread-offload-desc" x="44" y="166">Layout, paint and your</text>
    <text class="main-thread-offload-desc" x="44" y="182">computation share one thread.</text>
    <text class="main-thread-offload-desc" x="44" y="198">The page freezes.</text>
    <text class="main-thread-offload-edge" x="44" y="242">frozen</text>
  </g>
  <line class="main-thread-offload-line main-thread-offload-conn main-thread-offload-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#main-thread-offload-tip)"/>
  <g class="main-thread-offload-stage main-thread-offload-s1">
    <rect class="main-thread-offload-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="main-thread-offload-step" x="280" y="142">02</text>
    <text class="main-thread-offload-name" x="306" y="142">Post it to a worker</text>
    <text class="main-thread-offload-desc" x="280" y="166">A separate thread with no DOM</text>
    <text class="main-thread-offload-desc" x="280" y="182">access, by design.</text>
  </g>
  <line class="main-thread-offload-line main-thread-offload-conn main-thread-offload-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#main-thread-offload-tip)"/>
  <g class="main-thread-offload-stage main-thread-offload-s2">
    <rect class="main-thread-offload-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="main-thread-offload-step" x="516" y="142">03</text>
    <text class="main-thread-offload-name" x="542" y="142">The page stays responsive</text>
    <text class="main-thread-offload-desc" x="516" y="166">Clicks handled, animation</text>
    <text class="main-thread-offload-desc" x="516" y="182">smooth, scrolling normal.</text>
    <text class="main-thread-offload-edge" x="516" y="242">responsive</text>
  </g>
  <line class="main-thread-offload-line main-thread-offload-conn main-thread-offload-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#main-thread-offload-tip)"/>
  <g class="main-thread-offload-stage main-thread-offload-s3">
    <rect class="main-thread-offload-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="main-thread-offload-step" x="752" y="142">04</text>
    <text class="main-thread-offload-name" x="778" y="142">The result comes back</text>
    <text class="main-thread-offload-desc" x="752" y="166">As a message. Now update the</text>
    <text class="main-thread-offload-desc" x="752" y="182">DOM, on the main thread,</text>
    <text class="main-thread-offload-desc" x="752" y="198">quickly.</text>
  </g>
  <text class="main-thread-offload-sub" x="30" y="304">A worker cannot touch the DOM, and that restriction is the point: it is why the browser can run it truly in parallel without the page ending up half-modified.</text>
</svg>
