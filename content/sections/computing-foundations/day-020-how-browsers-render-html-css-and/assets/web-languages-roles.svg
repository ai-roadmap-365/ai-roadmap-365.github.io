<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" font-family="system-ui, sans-serif">
  <title>HTML, CSS, and JavaScript layered over one page element, each providing structure, style, and behavior</title>
  <rect x="0" y="0" width="700" height="470" fill="#f8fafc"/>
  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Three languages, one page element</text>

  <!-- The single page element being described -->
  <rect x="230" y="330" width="240" height="90" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="350" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">One button on the page</text>
  <text x="350" y="384" text-anchor="middle" font-size="14" fill="#1a202c">Navy, rounded, says "Send",</text>
  <text x="350" y="402" text-anchor="middle" font-size="14" fill="#1a202c">and reacts when you click it</text>

  <!-- HTML layer -->
  <rect x="60" y="70" width="580" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="100" font-size="17" font-weight="bold" fill="#1a202c">HTML — structure</text>
  <text x="80" y="124" font-size="14" fill="#1a202c">Says the element exists and is a button: &lt;button&gt;Send&lt;/button&gt;</text>

  <!-- CSS layer -->
  <rect x="60" y="155" width="580" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="185" font-size="17" font-weight="bold" fill="#1a202c">CSS — style</text>
  <text x="80" y="209" font-size="14" fill="#1a202c">Says how it looks: navy background, white text, rounded corners</text>

  <!-- JS layer -->
  <rect x="60" y="240" width="580" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="270" font-size="17" font-weight="bold" fill="#1a202c">JavaScript — behavior</text>
  <text x="80" y="294" font-size="14" fill="#1a202c">Says what happens on click: send the message and update the page</text>

  <!-- Arrows from each layer down to the element -->
  <line x1="350" y1="310" x2="350" y2="326" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="350,330 343,316 357,316" fill="#1d4ed8"/>

  <text x="350" y="452" text-anchor="middle" font-size="15" fill="#1a202c">Structure, style, and behavior are separate — and all describe the same element.</text>
</svg>
