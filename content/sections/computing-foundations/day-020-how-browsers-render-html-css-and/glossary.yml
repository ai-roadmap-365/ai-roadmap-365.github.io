terms:
  - term: HTML
    definition: 'HyperText Markup Language, the language that describes a web page''s structure and content by marking text as headings, paragraphs, lists, links, and other elements.'
  - term: CSS
    definition: 'Cascading Style Sheets, the language that describes a page''s presentation — colors, sizes, spacing, and layout — kept separate from its structure.'
  - term: JavaScript
    definition: 'The programming language that runs in the browser to give a page behavior: responding to clicks, updating content, and talking to servers without reloading.'
  - term: DOM
    definition: 'The Document Object Model, a live tree of nodes the browser builds from the HTML; every element is a node, and scripts can add, remove, or change nodes to update the page.'
  - term: CSSOM
    definition: 'The CSS Object Model, the tree the browser builds by parsing all the page''s CSS, recording the computed style that applies to each element.'
  - term: render tree
    definition: 'The tree the browser builds by combining the DOM with the CSSOM, containing only the visible elements together with their computed styles — the list of things that will actually be drawn.'
  - term: layout
    definition: 'The pipeline step, also called reflow, in which the browser computes the exact size and position of every element in the render tree.'
  - term: reflow
    definition: 'Another name for layout; also used for the re-computation of geometry the browser must do when something changes an element''s size or position after the page has loaded.'
  - term: paint
    definition: 'The final rendering step, in which the browser fills in the pixels — text, colors, borders, and images — for the laid-out elements.'
  - term: critical rendering path
    definition: 'The sequence of steps from receiving HTML and CSS to painting the first pixels; its length largely determines how fast a page feels.'
  - term: event loop
    definition: 'The mechanism by which the browser runs JavaScript one task at a time from a queue on the main thread, running each task to completion before updating the screen and taking the next.'
  - term: client-side rendering
    definition: 'Building a page''s content in the browser with JavaScript after a nearly empty HTML file loads; cheap to host but slower to first paint and harder for crawlers to read.'
  - term: server-side rendering
    definition: 'Assembling the finished HTML on the server for each request so content appears quickly and is easy for search engines to index, at the cost of more work per request.'
  - term: render-blocking resource
    definition: 'A file, typically CSS or an ordinary script, that the browser must finish processing before it can paint, delaying when the user first sees content.'
