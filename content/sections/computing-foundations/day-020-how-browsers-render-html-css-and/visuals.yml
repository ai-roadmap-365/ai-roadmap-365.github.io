visuals:
  - id: web-languages-roles
    file: assets/web-languages-roles.svg
    type: diagram
    title: 'Three languages, one page element'
    alt: 'Diagram: HTML, CSS, and JavaScript layered over one page element, showing structure, style, and behavior'
    description: 'Three stacked layers — HTML (structure), CSS (style), and JavaScript (behavior) — all pointing down to a single button on the page, showing that the three languages separately describe the same element''s existence, appearance, and response to a click.'
  - id: render-pipeline
    file: assets/render-pipeline.svg
    type: flowchart
    title: 'The browser rendering pipeline'
    alt: 'Flowchart: the browser rendering pipeline from HTML and CSS to the painted page'
    description: 'A left-to-right flow in which HTML is parsed into the DOM tree and CSS into the CSSOM tree, the two combine into the render tree of visible styled elements, layout computes each element''s size and position, and paint fills in the pixels — the whole path labelled the critical rendering path.'
