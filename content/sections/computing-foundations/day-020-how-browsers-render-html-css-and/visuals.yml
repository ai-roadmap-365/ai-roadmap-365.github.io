visuals:
  - id: web-languages-roles
    file: assets/web-languages-roles.svg
    type: diagram
    title: 'Three languages, one page element'
    alt: 'Diagram: HTML, CSS, and JavaScript layered over one page element, showing structure, style, and behavior'
    description: 'Three stacked layers — HTML (structure), CSS (style), and JavaScript (behavior) — all pointing down to a single button on the page, showing that the three languages separately describe the same element''s existence, appearance, and response to a click.'
  - id: render-pipeline
    file: assets/render-pipeline.svg
    type: flowchart
    title: 'The browser rendering pipeline'
    alt: 'Flowchart: the browser rendering pipeline from HTML and CSS to the painted page'
    description: 'A left-to-right flow in which HTML is parsed into the DOM tree and CSS into the CSSOM tree, the two combine into the render tree of visible styled elements, layout computes each element''s size and position, and paint fills in the pixels — the whole path labelled the critical rendering path.'
  - id: source-versus-dom
    file: assets/source-versus-dom.svg
    type: diagram
    title: 'The source and the page are different things'
    alt: 'Diagram: the HTML source compared with the live DOM'
    description: 'A two-column comparison of the original HTML source against the live DOM, explaining that scripts modify the tree after parsing so the two can differ completely.'
  - id: two-trees-one-render
    file: assets/two-trees-one-render.svg
    type: diagram
    title: 'Two trees in, one picture out'
    alt: 'Diagram: how the DOM and CSSOM combine into the render tree'
    description: 'A four-stage sequence showing the DOM and CSSOM being built separately, combined into a render tree containing only visible nodes, then laid out and painted.'
  - id: render-blocking
    file: assets/render-blocking.svg
    type: diagram
    title: 'Why a script in the head slows everything'
    alt: 'Diagram: a blocking script compared with a deferred one'
    description: 'A two-column comparison of an ordinary script tag that blocks HTML parsing against deferred and asynchronous loading, covering the effect on the DOM build and first paint.'
  - id: event-loop-block
    file: assets/event-loop-block.svg
    type: diagram
    title: 'Why the page freezes'
    alt: 'Diagram: how a long task blocks the event loop'
    description: 'A four-stage sequence showing the event loop taking a task, a long task running to completion, clicks queueing unhandled, and the screen updating only once the thread is free.'
  - id: layout-thrash
    file: assets/layout-thrash.svg
    type: diagram
    title: 'Reading geometry is not free'
    alt: 'Diagram: interleaved DOM reads and writes compared with batched ones'
    description: 'A two-column comparison of a loop that interleaves reading a layout property with writing a style against one that batches all reads before all writes, explaining the forced synchronous layout in the first case.'
  - id: streaming-dom-updates
    file: assets/streaming-dom-updates.svg
    type: diagram
    title: 'Streaming tokens into a page'
    alt: 'Diagram: appending streamed text compared with re-rendering the whole panel'
    description: 'A two-column comparison of appending each streamed token to an existing text node against re-rendering the entire output panel per token, covering layout cost and perceived smoothness.'
  - id: three-languages-independence
    file: assets/three-languages-independence.svg
    type: diagram
    title: 'Add one layer at a time'
    alt: 'Diagram: a page built up from HTML through CSS to JavaScript'
    description: 'A three-stage sequence adding HTML, then CSS, then JavaScript to the same page, showing what each layer contributes and what still works without the ones above it.'
  - id: xss-dom
    file: assets/xss-dom.svg
    type: diagram
    title: 'Why you never build HTML from user input'
    alt: 'Diagram: inserting untrusted input as markup compared with as text'
    description: 'A two-column comparison of inserting untrusted input as HTML markup against inserting it as plain text, showing how the first allows script execution within the page''s own privileges.'
  - id: main-thread-offload
    file: assets/main-thread-offload.svg
    type: diagram
    title: 'Getting heavy work off the main thread'
    alt: 'Diagram: moving computation from the main thread to a web worker'
    description: 'A four-stage sequence moving a heavy computation into a web worker, covering the frozen main-thread case, posting work to a worker, the page remaining responsive, and receiving the result.'
  - id: layout-shift
    file: assets/layout-shift.svg
    type: diagram
    title: 'Why images need declared dimensions'
    alt: 'Diagram: an image without declared dimensions compared with one that has them'
    description: 'A two-column comparison of images with and without width and height attributes, covering the layout passes required and the visible content shift.'
