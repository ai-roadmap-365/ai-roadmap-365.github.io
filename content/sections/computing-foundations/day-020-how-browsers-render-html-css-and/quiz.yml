questions:
  - question: 'Which pairing of web language to job is correct?'
    options:
      - 'HTML styles the page, CSS adds behavior, JavaScript defines structure'
      - 'HTML defines structure and content, CSS defines presentation, JavaScript defines behavior'
      - 'HTML defines behavior, CSS defines structure, JavaScript defines presentation'
      - 'All three define presentation; only their syntax differs'
    answer_index: 1
    explanation: 'The three web languages divide the work cleanly: HTML marks up structure and content, CSS controls how it looks, and JavaScript makes it respond to the user.'

  - question: 'What is the DOM?'
    options:
      - 'The original HTML text file exactly as the server sent it'
      - 'A compressed copy of the page kept for faster downloads'
      - 'A live tree of nodes the browser builds from the HTML, which scripts can change'
      - 'The list of CSS rules that apply to the page'
    answer_index: 2
    explanation: 'The Document Object Model is a live, in-memory tree the browser builds by parsing the HTML; because scripts can add, remove, and edit nodes, the DOM can differ from the original source text.'

  - question: 'What does the browser build by parsing the page''s CSS?'
    options:
      - 'The DOM tree'
      - 'The CSSOM, a tree recording which style rules apply to which elements'
      - 'The render tree'
      - 'The event loop'
    answer_index: 1
    explanation: 'Parsing CSS produces the CSSOM (CSS Object Model), which stores the computed styles; the browser later combines it with the DOM to form the render tree.'

  - question: 'Which sequence correctly orders the critical rendering path?'
    options:
      - 'Layout, paint, parse HTML, build render tree'
      - 'Parse HTML and CSS, build the render tree, layout, paint'
      - 'Paint, layout, build the render tree, parse HTML'
      - 'Build the render tree, parse HTML, paint, layout'
    answer_index: 1
    explanation: 'The browser first parses HTML and CSS into the DOM and CSSOM, combines them into the render tree, computes geometry in the layout step, and finally paints the pixels.'

  - question: 'An element is styled with display: none. What happens to it?'
    options:
      - 'It is removed from the DOM entirely'
      - 'It stays in the DOM but is excluded from the render tree, so it is not drawn'
      - 'It is painted but placed off-screen'
      - 'It causes a parsing error'
    answer_index: 1
    explanation: 'display: none keeps the node in the DOM but drops it from the render tree, so it takes no space and is never painted — existence in the DOM and visibility on screen are different things.'

  - question: 'Why can a large JavaScript file placed in the page''s <head> delay when content first appears?'
    options:
      - 'JavaScript files are always larger than HTML files'
      - 'An ordinary script is render-blocking: the parser stops to run it before continuing to build the DOM'
      - 'The browser refuses to paint any page that contains JavaScript'
      - 'CSS cannot load until all JavaScript has finished'
    answer_index: 1
    explanation: 'When the parser reaches an ordinary <script> tag it must run it before continuing, because the script might change the HTML being parsed; a big script in the head therefore blocks DOM construction and delays first paint.'

  - question: 'Why can a single slow JavaScript function make an entire page freeze?'
    options:
      - 'JavaScript runs on the main thread one task at a time, so a long task blocks rendering and input'
      - 'The browser deletes the DOM while a function runs'
      - 'Slow functions disconnect the page from the network'
      - 'The CSSOM must be rebuilt on every function call'
    answer_index: 0
    explanation: 'The event loop processes work one task at a time on the same main thread that handles layout and paint, so one long-running task blocks everything until it finishes — clicks and scrolling pile up unhandled.'

  - question: 'How do client-side and server-side rendering differ?'
    options:
      - 'Client-side rendering never uses JavaScript; server-side rendering never uses HTML'
      - 'They are two names for the same technique'
      - 'In client-side rendering the browser builds the content with JavaScript; in server-side rendering the server sends finished HTML, so content appears sooner'
      - 'Server-side rendering only works without CSS'
    answer_index: 2
    explanation: 'With server-side rendering the server sends ready-made HTML and content shows quickly (and is easy for crawlers to read); with client-side rendering the browser assembles the content from JavaScript, which is cheaper to host but appears later and can be harder to index.'
