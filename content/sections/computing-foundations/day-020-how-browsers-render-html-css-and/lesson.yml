slug: how-browsers-render-html-css-and
title: 'How Browsers Render: HTML, CSS, and JavaScript'
section: computing-foundations
subsection: networks-and-the-internet
week: 3
learning_promise: 'After this lesson you will be able to explain what a browser does after it receives a page — parsing HTML into the DOM and CSS into the CSSOM, building the render tree, laying out and painting — and use that pipeline to reason about page speed, client-side versus server-side rendering, and how interactive front-ends update the page.'
objectives:
  - 'Name the three web languages and state the single role of each: HTML for structure, CSS for presentation, JavaScript for behavior'
  - 'Describe how the browser parses HTML into the DOM tree and CSS into the CSSOM, and explain why the DOM differs from the HTML source'
  - 'Order the steps of the critical rendering path — parse, render tree, layout (reflow), paint — and say what each step produces'
  - 'Explain render-blocking resources and how the single-threaded event loop makes a heavy script freeze a page'
  - 'Contrast client-side and server-side rendering and explain why the choice affects load speed, discoverability, and cost'
  - 'Use free built-in tools — DevTools Elements, Console, Network, and Performance panels, View Source, and Lighthouse — to inspect a real page''s rendering'
  - 'Connect rendering to model front-ends: explain how a streaming interface repeatedly edits the DOM and why a short critical path keeps it feeling instant'
prerequisites:
  - 'A computer running macOS, Linux, or Windows with any modern web browser installed'
  - 'Days 15–19: how a page travels from URL to your browser (DNS, TCP, HTTP, HTTPS) — today picks up where the bytes arrive'
reading_time_minutes: 40
practical_time_minutes: 30
