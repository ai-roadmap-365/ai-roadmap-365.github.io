<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" font-family="system-ui, sans-serif">
  <title>A progression from a plain text editor to a code editor with extensions to a full IDE, showing what each stage adds</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">From plain editor to full IDE</text>

  <!-- Stage 1: plain text editor -->
  <rect x="30" y="90" width="200" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="130" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Plain text editor</text>
  <text x="130" y="150" text-anchor="middle" font-size="14" fill="#1a202c">Stores characters.</text>
  <text x="130" y="172" text-anchor="middle" font-size="14" fill="#1a202c">No idea it is code.</text>
  <text x="130" y="210" text-anchor="middle" font-size="13" fill="#1a202c">Notepad-style app</text>

  <!-- Stage 2: code editor -->
  <rect x="280" y="90" width="200" height="150" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Code editor</text>
  <text x="380" y="150" text-anchor="middle" font-size="14" fill="#1a202c">Text, now aware</text>
  <text x="380" y="172" text-anchor="middle" font-size="14" fill="#1a202c">it is code.</text>
  <text x="380" y="210" text-anchor="middle" font-size="13" fill="#1a202c">Grows via extensions</text>

  <!-- Stage 3: full IDE -->
  <rect x="530" y="90" width="200" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="630" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Full IDE</text>
  <text x="630" y="150" text-anchor="middle" font-size="14" fill="#1a202c">Editor plus build,</text>
  <text x="630" y="172" text-anchor="middle" font-size="14" fill="#1a202c">run, and debug.</text>
  <text x="630" y="210" text-anchor="middle" font-size="13" fill="#1a202c">Heaviest, most capable</text>

  <!-- Arrows -->
  <line x1="230" y1="165" x2="272" y2="165" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="280,165 266,158 266,172" fill="#1d4ed8"/>
  <line x1="480" y1="165" x2="522" y2="165" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="530,165 516,158 516,172" fill="#1d4ed8"/>

  <!-- What each transition adds -->
  <rect x="255" y="285" width="250" height="100" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">adds</text>
  <text x="380" y="309" text-anchor="middle" font-size="13" fill="#1a202c">syntax highlighting, autocomplete,</text>
  <text x="380" y="329" text-anchor="middle" font-size="13" fill="#1a202c">integrated terminal, git integration,</text>
  <text x="380" y="349" text-anchor="middle" font-size="13" fill="#1a202c">multi-cursor, project search, LSP</text>
  <text x="380" y="371" text-anchor="middle" font-size="13" fill="#1a202c">(all via extensions)</text>

  <rect x="530" y="285" width="200" height="100" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="630" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">adds</text>
  <text x="630" y="313" text-anchor="middle" font-size="13" fill="#1a202c">preconfigured compiler,</text>
  <text x="630" y="333" text-anchor="middle" font-size="13" fill="#1a202c">debugger, and build tools</text>
  <text x="630" y="353" text-anchor="middle" font-size="13" fill="#1a202c">for one language,</text>
  <text x="630" y="373" text-anchor="middle" font-size="13" fill="#1a202c">bundled in one package</text>

  <line x1="380" y1="240" x2="380" y2="283" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="630" y1="240" x2="630" y2="283" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
