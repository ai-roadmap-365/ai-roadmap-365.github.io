<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="With the same access you have.">
  <title>An extension is code you install</title>
  <style>
    .extension-trust-bg   { fill: #f8fafc; }
    .extension-trust-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extension-trust-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extension-trust-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extension-trust-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extension-trust-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extension-trust-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .extension-trust-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .extension-trust-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .extension-trust-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .extension-trust-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .extension-trust-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .extension-trust-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .extension-trust-row { opacity: 1; }
    .extension-trust-r0 { animation-delay: 0.00s; }
    .extension-trust-r1 { animation-delay: 0.45s; }
    .extension-trust-r2 { animation-delay: 0.90s; }
    .extension-trust-r3 { animation-delay: 1.35s; }
    .extension-trust-r4 { animation-delay: 1.80s; }
    .extension-trust-row { animation: extension-trust-reveal 7.3s ease-in-out infinite; }
    @keyframes extension-trust-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="extension-trust-bg" width="980" height="390"/>
  <text class="extension-trust-h1"  x="30" y="40">An extension is code you install</text>
  <text class="extension-trust-sub" x="30" y="64">With the same access you have.</text>
  <rect class="extension-trust-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="extension-trust-name" x="46" y="122">What people assume</text>
  <text class="extension-trust-desc" x="46" y="142">A feature, like a setting.</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r0" x="46" y="182">"It just adds syntax highlighting"</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r1" x="46" y="216">Installed on a recommendation</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r2" x="46" y="250">Publisher never checked</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r3" x="46" y="284">Never audited afterwards</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r4" x="46" y="318">Updates applied automatically</text>
  <rect class="extension-trust-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="extension-trust-name" x="526" y="122">What it actually has</text>
  <text class="extension-trust-desc" x="526" y="142">Your privileges.</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r0" x="526" y="182">Reads every file you open</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r1" x="526" y="216">Including .env and SSH keys</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r2" x="526" y="250">Can run commands and reach the network</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r3" x="526" y="284">Some send code to a remote service</text>
  <text class="extension-trust-desc extension-trust-row extension-trust-r4" x="526" y="318">Check the publisher and downloads first</text>
  <text class="extension-trust-sub" x="30" y="372">Extensions are the least-scrutinised software most developers install, and they get more access than most packages. Apply the Day 13 supply-chain habits here too.</text>
</svg>
