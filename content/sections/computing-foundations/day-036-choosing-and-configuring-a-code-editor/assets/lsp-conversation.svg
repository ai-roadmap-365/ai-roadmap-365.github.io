<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The editor asks. Something else knows.">
  <title>The conversation behind every red underline</title>
  <style>
    .lsp-conversation-bg   { fill: #f8fafc; }
    .lsp-conversation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lsp-conversation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lsp-conversation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lsp-conversation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lsp-conversation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lsp-conversation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lsp-conversation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lsp-conversation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lsp-conversation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lsp-conversation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lsp-conversation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lsp-conversation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lsp-conversation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lsp-conversation-stage { opacity: 1; }

    .lsp-conversation-s0 { animation-delay: 0.00s; }
    .lsp-conversation-e0 { animation-delay: 0.00s; }
    .lsp-conversation-s1 { animation-delay: 1.28s; }
    .lsp-conversation-e1 { animation-delay: 1.28s; }
    .lsp-conversation-s2 { animation-delay: 2.56s; }
    .lsp-conversation-e2 { animation-delay: 2.56s; }
    .lsp-conversation-s3 { animation-delay: 3.84s; }
    .lsp-conversation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lsp-conversation-conn  { animation: lsp-conversation-trace 6.4s ease-in-out infinite; }
      .lsp-conversation-stage { animation: lsp-conversation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lsp-conversation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lsp-conversation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lsp-conversation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lsp-conversation-stage { animation: lsp-conversation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lsp-conversation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lsp-conversation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lsp-conversation-bg" width="980" height="322"/>
  <text class="lsp-conversation-h1"  x="30" y="40">The conversation behind every red underline</text>
  <text class="lsp-conversation-sub" x="30" y="64">The editor asks. Something else knows.</text>
  <g class="lsp-conversation-stage lsp-conversation-s0">
    <rect class="lsp-conversation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lsp-conversation-step" x="44" y="142">01</text>
    <text class="lsp-conversation-name" x="70" y="142">You open a file</text>
    <text class="lsp-conversation-desc" x="44" y="166">The editor launches the server</text>
    <text class="lsp-conversation-desc" x="44" y="182">for that language, in the</text>
    <text class="lsp-conversation-desc" x="44" y="198">background.</text>
  </g>
  <line class="lsp-conversation-line lsp-conversation-conn lsp-conversation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lsp-conversation-tip)"/>
  <g class="lsp-conversation-stage lsp-conversation-s1">
    <rect class="lsp-conversation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lsp-conversation-step" x="280" y="142">02</text>
    <text class="lsp-conversation-name" x="306" y="142">You type</text>
    <text class="lsp-conversation-desc" x="280" y="166">The editor sends: the document</text>
    <text class="lsp-conversation-desc" x="280" y="182">changed, here. What applies?</text>
    <text class="lsp-conversation-edge" x="280" y="242">a message</text>
  </g>
  <line class="lsp-conversation-line lsp-conversation-conn lsp-conversation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lsp-conversation-tip)"/>
  <g class="lsp-conversation-stage lsp-conversation-s2">
    <rect class="lsp-conversation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lsp-conversation-step" x="516" y="142">03</text>
    <text class="lsp-conversation-name" x="542" y="142">The server analyses</text>
    <text class="lsp-conversation-desc" x="516" y="166">It knows the language and your</text>
    <text class="lsp-conversation-desc" x="516" y="182">project. The editor knows</text>
    <text class="lsp-conversation-desc" x="516" y="198">neither.</text>
    <text class="lsp-conversation-edge" x="516" y="242">analysis</text>
  </g>
  <line class="lsp-conversation-line lsp-conversation-conn lsp-conversation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lsp-conversation-tip)"/>
  <g class="lsp-conversation-stage lsp-conversation-s3">
    <rect class="lsp-conversation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lsp-conversation-step" x="752" y="142">04</text>
    <text class="lsp-conversation-name" x="778" y="142">The editor renders the answer</text>
    <text class="lsp-conversation-desc" x="752" y="166">Completions, red underlines,</text>
    <text class="lsp-conversation-desc" x="752" y="182">hover tips. It is displaying,</text>
    <text class="lsp-conversation-desc" x="752" y="198">not deciding.</text>
  </g>
  <text class="lsp-conversation-sub" x="30" y="304">One protocol, one server per language, and every editor that speaks it gets that language for free. This is why the ecosystem grew so quickly after 2016, and why your editor supports languages its authors have never used.</text>
</svg>
