<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Neither is more professional. They assume different things.">
  <title>Two tools, two different bets</title>
  <style>
    .editor-versus-ide-bg   { fill: #f8fafc; }
    .editor-versus-ide-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-versus-ide-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-versus-ide-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-versus-ide-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-versus-ide-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-versus-ide-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .editor-versus-ide-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .editor-versus-ide-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .editor-versus-ide-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .editor-versus-ide-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .editor-versus-ide-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .editor-versus-ide-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .editor-versus-ide-row { opacity: 1; }
    .editor-versus-ide-r0 { animation-delay: 0.00s; }
    .editor-versus-ide-r1 { animation-delay: 0.45s; }
    .editor-versus-ide-r2 { animation-delay: 0.90s; }
    .editor-versus-ide-r3 { animation-delay: 1.35s; }
    .editor-versus-ide-r4 { animation-delay: 1.80s; }
    .editor-versus-ide-row { animation: editor-versus-ide-reveal 7.3s ease-in-out infinite; }
    @keyframes editor-versus-ide-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="editor-versus-ide-bg" width="980" height="390"/>
  <text class="editor-versus-ide-h1"  x="30" y="40">Two tools, two different bets</text>
  <text class="editor-versus-ide-sub" x="30" y="64">Neither is more professional. They assume different things.</text>
  <rect class="editor-versus-ide-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="editor-versus-ide-name" x="46" y="122">Editor</text>
  <text class="editor-versus-ide-desc" x="46" y="142">Light, extended by you</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r0" x="46" y="182">Starts in a second</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r1" x="46" y="216">Language support arrives as extensions</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r2" x="46" y="250">One tool for every language you touch</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r3" x="46" y="284">Each extension costs startup and memory</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r4" x="46" y="318">You assemble the setup you want</text>
  <rect class="editor-versus-ide-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="editor-versus-ide-name" x="526" y="122">IDE</text>
  <text class="editor-versus-ide-desc" x="526" y="142">Heavy, complete on arrival</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r0" x="526" y="182">Build, run and debug configured already</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r1" x="526" y="216">Deep refactoring for its target language</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r2" x="526" y="250">Strong defaults, less to decide</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r3" x="526" y="284">Slower to start, heavier to run</text>
  <text class="editor-versus-ide-desc editor-versus-ide-row editor-versus-ide-r4" x="526" y="318">Best when you live in one language</text>
  <text class="editor-versus-ide-sub" x="30" y="372">The Language Server Protocol is why the gap narrowed: one language server can serve any editor that speaks it.</text>
</svg>
