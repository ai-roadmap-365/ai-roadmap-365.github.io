<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A distinction AI work blurs constantly.">
  <title>Notebook or editor</title>
  <style>
    .editor-or-notebook-bg   { fill: #f8fafc; }
    .editor-or-notebook-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-or-notebook-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-or-notebook-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-or-notebook-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-or-notebook-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-or-notebook-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .editor-or-notebook-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .editor-or-notebook-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .editor-or-notebook-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .editor-or-notebook-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .editor-or-notebook-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .editor-or-notebook-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .editor-or-notebook-row { opacity: 1; }
    .editor-or-notebook-r0 { animation-delay: 0.00s; }
    .editor-or-notebook-r1 { animation-delay: 0.45s; }
    .editor-or-notebook-r2 { animation-delay: 0.90s; }
    .editor-or-notebook-r3 { animation-delay: 1.35s; }
    .editor-or-notebook-r4 { animation-delay: 1.80s; }
    .editor-or-notebook-row { animation: editor-or-notebook-reveal 7.3s ease-in-out infinite; }
    @keyframes editor-or-notebook-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="editor-or-notebook-bg" width="980" height="390"/>
  <text class="editor-or-notebook-h1"  x="30" y="40">Notebook or editor</text>
  <text class="editor-or-notebook-sub" x="30" y="64">A distinction AI work blurs constantly.</text>
  <rect class="editor-or-notebook-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="editor-or-notebook-name" x="46" y="122">A notebook</text>
  <text class="editor-or-notebook-desc" x="46" y="142">Exploration.</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r0" x="46" y="182">Trying something once</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r1" x="46" y="216">Seeing output beside the code</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r2" x="46" y="250">Charts and tables inline</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r3" x="46" y="284">Hidden state: cells run out of order</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r4" x="46" y="318">Painful to test and to diff</text>
  <rect class="editor-or-notebook-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="editor-or-notebook-name" x="526" y="122">A code file</text>
  <text class="editor-or-notebook-desc" x="526" y="142">Anything reused.</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r0" x="526" y="182">Imported by something else</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r1" x="526" y="216">Runs top to bottom, always</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r2" x="526" y="250">Testable, and reviewable</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r3" x="526" y="284">Diffs a person can read</text>
  <text class="editor-or-notebook-desc editor-or-notebook-row editor-or-notebook-r4" x="526" y="318">The moment it is reused, it belongs here</text>
  <text class="editor-or-notebook-sub" x="30" y="372">The signal to move is reuse, not size. A notebook you copy a cell out of has already told you the code should be in a file that both places import.</text>
</svg>
