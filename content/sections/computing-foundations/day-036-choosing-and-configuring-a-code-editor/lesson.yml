title: 'Choosing and Configuring a Code Editor'
section: computing-foundations
subsection: developer-workflow
week: 6
learning_promise: 'After this lesson you will be able to choose a code editor with clear reasons, configure the handful of settings and shared rules that actually pay off, and explain why a well-organized editor makes you faster at every project — including the AI work later in this course.'
objectives:
  - 'Distinguish a plain text editor, a code editor, and an IDE, and name the feature that separates each from the one before it'
  - 'Explain the core editor features — syntax highlighting, autocomplete/IntelliSense, integrated terminal, git integration, extensions, multi-cursor, search/replace, and the Language Server Protocol — and the specific problem each solves'
  - 'Compare the leading editors (VS Code, the JetBrains IDEs, Vim/Neovim, Zed, Sublime Text) and state when to choose each, along with what is free versus paid'
  - 'Configure an editor with settings and keybindings, and use EditorConfig to keep a whole team''s formatting consistent regardless of editor'
  - 'Write an .editorconfig file with the standard keys and run a checker that reports which files obey the rules and which break them'
  - 'Explain why AI coding assistants live inside the editor and how a well-configured workspace makes them and you more effective'
prerequisites:
  - 'A computer running macOS, Linux, or Windows with permission to open a terminal'
  - 'Comfort with the terminal and basic git from the earlier lessons in this section'
