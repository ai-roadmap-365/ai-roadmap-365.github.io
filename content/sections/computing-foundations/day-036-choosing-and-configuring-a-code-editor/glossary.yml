terms:
  - term: code editor
    definition: 'A program for writing and editing source code that understands the text is programming code — coloring it, completing names, and flagging errors — and grows through add-ons called extensions.'
  - term: IDE
    definition: 'An Integrated Development Environment: an editor bundled with the preconfigured machinery for building, running, and debugging a particular language or platform, all in one package.'
  - term: syntax highlighting
    definition: 'Coloring the different parts of code — keywords, strings, comments — differently so the structure of the code is easy to see at a glance; a display effect that never changes the file on disk.'
  - term: autocomplete
    definition: 'A feature that suggests and completes valid names as you type and shows what a function expects; Microsoft''s branded version is called IntelliSense.'
  - term: LSP
    definition: 'The Language Server Protocol, a common language (introduced by Microsoft in 2016) that lets an editor talk to a separate language server, so many editors can share expert completion and error-checking for the same programming language.'
  - term: extension
    definition: 'An add-on that expands a code editor with new capabilities — support for a language, a theme, a tool — installed and managed from the editor.'
  - term: keybinding
    definition: 'A mapping from a keystroke to an editor action, letting frequent operations become muscle memory instead of menu hunts.'
  - term: EditorConfig
    definition: 'A small standard — a file named .editorconfig placed in a project — that many editors read automatically to agree on basic formatting like indentation, line endings, and final newlines, keeping a whole team consistent regardless of editor.'
  - term: integrated terminal
    definition: 'A full command-line shell running inside the editor, so you can run commands, tests, and git without switching to a separate window.'
  - term: multi-cursor
    definition: 'An editing feature that places several cursors at once so you can type or edit in many places simultaneously — for example renaming a name everywhere it appears.'
  - term: settings
    definition: 'A list of an editor''s preferences — font size, tab width, whether to trim stray whitespace on save — usually stored as a plain-text file you can edit and share.'
  - term: language server
    definition: 'A separate program that understands one programming language and provides completion, go-to-definition, and error-checking to an editor, usually through the Language Server Protocol.'
  - term: plain text editor
    definition: 'A basic editor that stores characters and nothing more, with no awareness that the text might be code — the Notepad-style app that ships with an operating system.'
