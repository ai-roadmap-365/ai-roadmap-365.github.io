questions:
  - question: 'What single capability most clearly separates a code editor from a plain text editor?'
    options:
      - 'A code editor can save files to disk, which a plain text editor cannot'
      - 'A code editor understands that the text is programming code — coloring it, completing names, and flagging errors'
      - 'A code editor stores text with hidden formatting like a word processor'
      - 'A code editor can only open one file at a time'
    answer_index: 1
    explanation: 'Both store plain-text characters, but a code editor adds a layer of language awareness — syntax highlighting, autocomplete, and inline error checking — that a plain text editor lacks entirely.'

  - question: 'What does the Language Server Protocol (LSP) make possible?'
    options:
      - 'It lets one editor talk to reusable language servers, so many editors can offer expert completion and error-checking for the same language'
      - 'It translates your code from one programming language into another automatically'
      - 'It runs your program on a remote server instead of your machine'
      - 'It encrypts your source files while you edit them'
    answer_index: 0
    explanation: 'Before LSP, every editor had to build language intelligence itself. LSP defines a common language between editors and separate language servers, so a single Python server can power completion and errors in dozens of different editors.'

  - question: 'How does an IDE differ from a code editor?'
    options:
      - 'An IDE cannot install extensions, while a code editor can'
      - 'An IDE only works with one operating system'
      - 'An IDE bundles building, running, and debugging for a language out of the box, whereas a code editor stays lightweight and grows through extensions'
      - 'An IDE stores files as images rather than text'
    answer_index: 2
    explanation: 'An IDE is an Integrated Development Environment: it packages the heavier machinery of compiling, running, and debugging for a language, all preconfigured. A code editor starts lighter and adds capability through extensions.'

  - question: 'What is the purpose of an .editorconfig file placed at the root of a project?'
    options:
      - 'To store your personal editor preferences that only apply to you'
      - 'To list which extensions each teammate must install'
      - 'To give an editor-agnostic, shared set of formatting rules so everyone''s files come out consistent regardless of editor'
      - 'To run the project''s tests automatically on every save'
    answer_index: 2
    explanation: 'EditorConfig is a small standard many editors read automatically. Because it lives with the project and is editor-agnostic, a whole team formats code the same way — indentation, line endings, final newlines — without each person configuring their editor by hand.'

  - question: 'For a beginner in this course, which editor is the recommended default, and what does it cost?'
    options:
      - 'PyCharm Professional, which is paid'
      - 'Visual Studio Code, which is free and open source'
      - 'Sublime Text, whose license must be purchased before use'
      - 'A plain text editor, because code editors cost money'
    answer_index: 1
    explanation: 'VS Code is free, open source, cross-platform, forgiving for beginners, and flexible enough to handle every topic in this course — which is why it is the recommended starting point. Nothing in the course requires a paid editor.'

  - question: 'Which problem does the multi-cursor feature (together with project-wide search and replace) directly solve?'
    options:
      - 'Running a program without leaving the editor'
      - 'Changing the same word or making the same edit in many places at once'
      - 'Coloring keywords so the structure of code is visible'
      - 'Remembering your git commit history'
    answer_index: 1
    explanation: 'Multi-cursor editing and project-wide search and replace answer the pain of needing to make the same change in many places — for example renaming a variable everywhere it appears — quickly and consistently.'

  - question: 'Why can installing many extensions hurt your editing experience?'
    options:
      - 'Extensions permanently change the files on disk'
      - 'Each extension adds startup time and memory use, so a cluttered editor becomes slower and more distracting'
      - 'Extensions disable the integrated terminal'
      - 'Editors refuse to open once more than five extensions are installed'
    answer_index: 1
    explanation: 'Every extension costs some startup time and memory. Installing only the ones you actually use keeps the editor fast and focused; loading dozens "just in case" taxes performance and attention.'

  - question: 'Where do AI coding assistants run, and why does that matter for how you set up your editor?'
    options:
      - 'On a separate website you visit; your editor setup is irrelevant to them'
      - 'Inside the editor, reading your open file and project — so a clean, well-configured workspace makes them and you more effective'
      - 'Only inside the operating system, with no access to your code'
      - 'Exclusively on the language server, never touching your files'
    answer_index: 1
    explanation: 'AI coding assistants live inside the editor and read the file you have open and the project around it. A well-organized, well-configured workspace is the foundation they stand on, which is why configuring your primary tool now pays off for every later AI project.'
