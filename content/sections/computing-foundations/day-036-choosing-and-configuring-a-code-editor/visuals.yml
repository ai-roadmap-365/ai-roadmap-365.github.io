visuals:
  - id: editor-anatomy
    file: assets/editor-anatomy.svg
    type: diagram
    title: 'The anatomy of a code editor'
    alt: 'Diagram: the anatomy of a code editor window with its main parts labelled'
    description: 'A single editor window divided into cooperating regions — an extensions rail and file explorer on the left, a large editor pane in the center showing colored code and an autocomplete popup, an integrated terminal docked at the bottom, and a status bar reporting the git branch, language, cursor position, and error count.'
  - id: editor-vs-ide
    file: assets/editor-vs-ide.svg
    type: flowchart
    title: 'From plain editor to full IDE'
    alt: 'Flowchart: from a plain text editor to a code editor with extensions to a full IDE'
    description: 'A left-to-right progression: a plain text editor that only stores characters, then a code editor that adds syntax highlighting, autocomplete, an integrated terminal, git integration, multi-cursor, project search, and LSP through extensions, then a full IDE that further bundles a preconfigured compiler, debugger, and build tools for a language.'
  - id: editor-versus-ide
    file: assets/editor-versus-ide.svg
    type: diagram
    title: 'Two tools, two different bets'
    alt: 'Diagram: a code editor compared with an integrated development environment'
    description: 'A two-column comparison of a code editor and an IDE, covering what arrives out of the box, how each is extended, and what each costs in startup and memory.'
  - id: lsp-conversation
    file: assets/lsp-conversation.svg
    type: diagram
    title: 'The conversation behind every red underline'
    alt: 'Diagram: the exchange between an editor and a language server'
    description: 'A four-stage sequence of the editor-language server exchange covering the server launching, the editor notifying it of an edit, the server analysing and responding, and the editor rendering the result.'
  - id: four-things-to-configure
    file: assets/four-things-to-configure.svg
    type: diagram
    title: 'Configure four things, then stop'
    alt: 'Diagram: the four editor settings worth configuring'
    description: 'A four-stage checklist of high-value editor configuration covering the language server, format on save, a linter, and a committed EditorConfig file.'
  - id: formatting-diff-noise
    file: assets/formatting-diff-noise.svg
    type: diagram
    title: 'Why a shared formatting file matters'
    alt: 'Diagram: a diff with formatting noise compared with a clean one'
    description: 'A two-column comparison of a pull request containing formatting changes from mismatched editor settings against one where formatting is agreed project-wide.'
  - id: extension-trust
    file: assets/extension-trust.svg
    type: diagram
    title: 'An extension is code you install'
    alt: 'Diagram: the access an editor extension has'
    description: 'A two-column comparison of how casually extensions are typically installed against the access they actually receive, and the checks worth making first.'
  - id: editor-or-notebook
    file: assets/editor-or-notebook.svg
    type: diagram
    title: 'Notebook or editor'
    alt: 'Diagram: when to use a notebook and when to use an editor'
    description: 'A two-column comparison of notebooks and code files, covering exploration, reuse, testing and version control.'
  - id: editor-progression
    file: assets/editor-progression.svg
    type: diagram
    title: 'From teletypes to language servers'
    alt: 'Diagram: the evolution from line editors to modern code editors'
    description: 'A four-stage progression from terse line editors through extensible editors and language-specific IDEs to editors built on the Language Server Protocol.'
  - id: keyboard-five
    file: assets/keyboard-five.svg
    type: diagram
    title: 'Five shortcuts worth learning properly'
    alt: 'Diagram: the five most valuable editor keyboard shortcuts'
    description: 'A five-stage reference to the highest-value editor keyboard shortcuts covering opening a file by name, jumping to a symbol, searching the project, renaming across files, and toggling the terminal.'
  - id: workspace-settings
    file: assets/workspace-settings.svg
    type: diagram
    title: 'Two levels of editor settings'
    alt: 'Diagram: user settings compared with workspace settings'
    description: 'A two-column comparison of personal editor settings against project-level workspace settings, covering scope and whether each is shared.'
