visuals:
  - id: editor-anatomy
    file: assets/editor-anatomy.svg
    type: diagram
    title: 'The anatomy of a code editor'
    alt: 'Diagram: the anatomy of a code editor window with its main parts labelled'
    description: 'A single editor window divided into cooperating regions — an extensions rail and file explorer on the left, a large editor pane in the center showing colored code and an autocomplete popup, an integrated terminal docked at the bottom, and a status bar reporting the git branch, language, cursor position, and error count.'
  - id: editor-vs-ide
    file: assets/editor-vs-ide.svg
    type: flowchart
    title: 'From plain editor to full IDE'
    alt: 'Flowchart: from a plain text editor to a code editor with extensions to a full IDE'
    description: 'A left-to-right progression: a plain text editor that only stores characters, then a code editor that adds syntax highlighting, autocomplete, an integrated terminal, git integration, multi-cursor, project search, and LSP through extensions, then a full IDE that further bundles a preconfigured compiler, debugger, and build tools for a language.'
  - id: editor-versus-ide
    file: assets/editor-versus-ide.svg
    type: diagram
    title: 'Two tools, two different bets'
    alt: 'Diagram: a code editor compared with an integrated development environment'
    description: 'A two-column comparison of a code editor and an IDE, covering what arrives out of the box, how each is extended, and what each costs in startup and memory.'
