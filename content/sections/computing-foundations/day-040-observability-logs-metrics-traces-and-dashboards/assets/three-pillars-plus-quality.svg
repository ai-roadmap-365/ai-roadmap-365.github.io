<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A model can keep answering on time, with no errors, while the answers get worse.">
  <title>The three pillars, and the signal they cannot see</title>
  <style>
    .three-pillars-plus-quality-bg   { fill: #f8fafc; }
    .three-pillars-plus-quality-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-pillars-plus-quality-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-pillars-plus-quality-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-pillars-plus-quality-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-pillars-plus-quality-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-pillars-plus-quality-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-pillars-plus-quality-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-pillars-plus-quality-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-pillars-plus-quality-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-pillars-plus-quality-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-pillars-plus-quality-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-pillars-plus-quality-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-pillars-plus-quality-row { opacity: 1; }
    .three-pillars-plus-quality-r0 { animation-delay: 0.00s; }
    .three-pillars-plus-quality-r1 { animation-delay: 0.45s; }
    .three-pillars-plus-quality-r2 { animation-delay: 0.90s; }
    .three-pillars-plus-quality-r3 { animation-delay: 1.35s; }
    .three-pillars-plus-quality-r4 { animation-delay: 1.80s; }
    .three-pillars-plus-quality-row { animation: three-pillars-plus-quality-reveal 7.3s ease-in-out infinite; }
    @keyframes three-pillars-plus-quality-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="three-pillars-plus-quality-bg" width="980" height="390"/>
  <text class="three-pillars-plus-quality-h1"  x="30" y="40">The three pillars, and the signal they cannot see</text>
  <text class="three-pillars-plus-quality-sub" x="30" y="64">A model can keep answering on time, with no errors, while the answers get worse.</text>
  <rect class="three-pillars-plus-quality-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="three-pillars-plus-quality-name" x="46" y="122">Logs, metrics, traces</text>
  <text class="three-pillars-plus-quality-desc" x="46" y="142">What ordinary software needs</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r0" x="46" y="182">Logs: what happened, in detail, per event</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r1" x="46" y="216">Metrics: how much and how long, aggregated</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r2" x="46" y="250">Traces: which stage of a request was slow</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r3" x="46" y="284">Together they answer 'is it up and fast'</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r4" x="46" y="318">All three stay green while a model degrades</text>
  <rect class="three-pillars-plus-quality-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="three-pillars-plus-quality-name" x="526" y="122">A quality signal</text>
  <text class="three-pillars-plus-quality-desc" x="526" y="142">What AI systems also need</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r0" x="526" y="182">Groundedness: is the answer supported</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r1" x="526" y="216">Refusal rate: is it abstaining more than it was</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r2" x="526" y="250">Output distribution: has it shifted</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r3" x="526" y="284">None of these is latency, traffic, errors or saturation</text>
  <text class="three-pillars-plus-quality-desc three-pillars-plus-quality-row three-pillars-plus-quality-r4" x="526" y="318">Without it, degradation is invisible until a human complains</text>
  <text class="three-pillars-plus-quality-sub" x="30" y="372">Alert on symptoms, not causes: on what the user feels, not on a CPU number that may be harmless.</text>
</svg>
