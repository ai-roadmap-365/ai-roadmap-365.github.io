<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The rule that decides whether your alerts get ignored.">
  <title>Alert on symptoms, not causes</title>
  <style>
    .symptoms-not-causes-bg   { fill: #f8fafc; }
    .symptoms-not-causes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptoms-not-causes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptoms-not-causes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptoms-not-causes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptoms-not-causes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptoms-not-causes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .symptoms-not-causes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .symptoms-not-causes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .symptoms-not-causes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .symptoms-not-causes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .symptoms-not-causes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .symptoms-not-causes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .symptoms-not-causes-row { opacity: 1; }
    .symptoms-not-causes-r0 { animation-delay: 0.00s; }
    .symptoms-not-causes-r1 { animation-delay: 0.45s; }
    .symptoms-not-causes-r2 { animation-delay: 0.90s; }
    .symptoms-not-causes-r3 { animation-delay: 1.35s; }
    .symptoms-not-causes-r4 { animation-delay: 1.80s; }
    .symptoms-not-causes-row { animation: symptoms-not-causes-reveal 7.3s ease-in-out infinite; }
    @keyframes symptoms-not-causes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="symptoms-not-causes-bg" width="980" height="390"/>
  <text class="symptoms-not-causes-h1"  x="30" y="40">Alert on symptoms, not causes</text>
  <text class="symptoms-not-causes-sub" x="30" y="64">The rule that decides whether your alerts get ignored.</text>
  <rect class="symptoms-not-causes-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="symptoms-not-causes-name" x="46" y="122">Cause-based</text>
  <text class="symptoms-not-causes-desc" x="46" y="142">Internal conditions.</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r0" x="46" y="182">"CPU above 80%"</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r1" x="46" y="216">"Memory above 90%"</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r2" x="46" y="250">"Queue longer than 100"</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r3" x="46" y="284">Fires while everything works fine</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r4" x="46" y="318">And so gets muted, permanently</text>
  <rect class="symptoms-not-causes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="symptoms-not-causes-name" x="526" y="122">Symptom-based</text>
  <text class="symptoms-not-causes-desc" x="526" y="142">What the user feels.</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r0" x="526" y="182">"Error rate above 2% for five minutes"</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r1" x="526" y="216">"p95 latency above one second"</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r2" x="526" y="250">"Orders not completing"</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r3" x="526" y="284">Fires only when someone is affected</text>
  <text class="symptoms-not-causes-desc symptoms-not-causes-row symptoms-not-causes-r4" x="526" y="318">And so stays trusted</text>
  <text class="symptoms-not-causes-sub" x="30" y="372">A busy server is fine if requests are still fast. Paging someone at 3am because a number was high while everything worked is how a team learns that alerts can be ignored — and then they are, when it matters.</text>
</svg>
