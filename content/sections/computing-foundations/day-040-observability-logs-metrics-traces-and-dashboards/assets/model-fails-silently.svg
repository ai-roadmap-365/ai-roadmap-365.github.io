<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is why the three pillars are not enough on their own.">
  <title>A model does not fail like a service</title>
  <style>
    .model-fails-silently-bg   { fill: #f8fafc; }
    .model-fails-silently-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-fails-silently-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-fails-silently-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-fails-silently-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-fails-silently-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-fails-silently-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-fails-silently-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-fails-silently-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-fails-silently-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-fails-silently-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-fails-silently-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-fails-silently-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-fails-silently-row { opacity: 1; }
    .model-fails-silently-r0 { animation-delay: 0.00s; }
    .model-fails-silently-r1 { animation-delay: 0.45s; }
    .model-fails-silently-r2 { animation-delay: 0.90s; }
    .model-fails-silently-r3 { animation-delay: 1.35s; }
    .model-fails-silently-r4 { animation-delay: 1.80s; }
    .model-fails-silently-row { animation: model-fails-silently-reveal 7.3s ease-in-out infinite; }
    @keyframes model-fails-silently-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="model-fails-silently-bg" width="980" height="390"/>
  <text class="model-fails-silently-h1"  x="30" y="40">A model does not fail like a service</text>
  <text class="model-fails-silently-sub" x="30" y="64">Which is why the three pillars are not enough on their own.</text>
  <rect class="model-fails-silently-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="model-fails-silently-name" x="46" y="122">A service fails</text>
  <text class="model-fails-silently-desc" x="46" y="142">Loudly, and measurably.</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r0" x="46" y="182">Errors appear in the error rate</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r1" x="46" y="216">Latency rises visibly</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r2" x="46" y="250">Something crashes, or times out</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r3" x="46" y="284">Existing alerts fire</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r4" x="46" y="318">You find out within minutes</text>
  <rect class="model-fails-silently-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="model-fails-silently-name" x="526" y="122">A model degrades</text>
  <text class="model-fails-silently-desc" x="526" y="142">Silently, over weeks.</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r0" x="526" y="182">No errors — it answers every request</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r1" x="526" y="216">Latency is unchanged</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r2" x="526" y="250">Nothing crashes</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r3" x="526" y="284">Every dashboard stays green</text>
  <text class="model-fails-silently-desc model-fails-silently-row model-fails-silently-r4" x="526" y="318">You find out from a user, or a quarter later</text>
  <text class="model-fails-silently-sub" x="30" y="372">So an AI system needs a fourth signal the classic three do not supply: output quality. Accuracy on a held-out set, sampled human ratings, or a downstream business measure — anything that would move when the answers get worse.</text>
</svg>
