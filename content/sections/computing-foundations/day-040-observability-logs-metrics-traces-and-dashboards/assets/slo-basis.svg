<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="SLIs and SLOs give alerting a principled basis.">
  <title>From a measurement to a page at 3am</title>
  <style>
    .slo-basis-bg   { fill: #f8fafc; }
    .slo-basis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-basis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-basis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-basis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-basis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-basis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .slo-basis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .slo-basis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .slo-basis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .slo-basis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .slo-basis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .slo-basis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .slo-basis-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .slo-basis-stage { opacity: 1; }

    .slo-basis-s0 { animation-delay: 0.00s; }
    .slo-basis-e0 { animation-delay: 0.00s; }
    .slo-basis-s1 { animation-delay: 1.28s; }
    .slo-basis-e1 { animation-delay: 1.28s; }
    .slo-basis-s2 { animation-delay: 2.56s; }
    .slo-basis-e2 { animation-delay: 2.56s; }
    .slo-basis-s3 { animation-delay: 3.84s; }
    .slo-basis-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .slo-basis-conn  { animation: slo-basis-trace 6.4s ease-in-out infinite; }
      .slo-basis-stage { animation: slo-basis-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes slo-basis-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes slo-basis-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .slo-basis-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .slo-basis-stage { animation: slo-basis-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes slo-basis-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="slo-basis-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="slo-basis-bg" width="980" height="322"/>
  <text class="slo-basis-h1"  x="30" y="40">From a measurement to a page at 3am</text>
  <text class="slo-basis-sub" x="30" y="64">SLIs and SLOs give alerting a principled basis.</text>
  <g class="slo-basis-stage slo-basis-s0">
    <rect class="slo-basis-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="slo-basis-step" x="44" y="142">01</text>
    <text class="slo-basis-name" x="70" y="142">Define an SLI</text>
    <text class="slo-basis-desc" x="44" y="166">A precise measurement of</text>
    <text class="slo-basis-desc" x="44" y="182">experience: requests succeeding</text>
    <text class="slo-basis-desc" x="44" y="198">under 300 ms.</text>
    <text class="slo-basis-edge" x="44" y="242">the measure</text>
  </g>
  <line class="slo-basis-line slo-basis-conn slo-basis-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#slo-basis-tip)"/>
  <g class="slo-basis-stage slo-basis-s1">
    <rect class="slo-basis-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="slo-basis-step" x="280" y="142">02</text>
    <text class="slo-basis-name" x="306" y="142">Commit to an SLO</text>
    <text class="slo-basis-desc" x="280" y="166">The target: 99.9% of them, over</text>
    <text class="slo-basis-desc" x="280" y="182">a rolling 30 days.</text>
    <text class="slo-basis-edge" x="280" y="242">the target</text>
  </g>
  <line class="slo-basis-line slo-basis-conn slo-basis-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#slo-basis-tip)"/>
  <g class="slo-basis-stage slo-basis-s2">
    <rect class="slo-basis-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="slo-basis-step" x="516" y="142">03</text>
    <text class="slo-basis-name" x="542" y="142">That implies a budget</text>
    <text class="slo-basis-desc" x="516" y="166">0.1% may fail. That is your</text>
    <text class="slo-basis-desc" x="516" y="182">room, and it is spendable.</text>
    <text class="slo-basis-edge" x="516" y="242">budget</text>
  </g>
  <line class="slo-basis-line slo-basis-conn slo-basis-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#slo-basis-tip)"/>
  <g class="slo-basis-stage slo-basis-s3">
    <rect class="slo-basis-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="slo-basis-step" x="752" y="142">04</text>
    <text class="slo-basis-name" x="778" y="142">Alert on burn rate</text>
    <text class="slo-basis-desc" x="752" y="166">Page when you are consuming the</text>
    <text class="slo-basis-desc" x="752" y="182">budget fast enough to miss the</text>
    <text class="slo-basis-desc" x="752" y="198">objective.</text>
    <text class="slo-basis-edge" x="752" y="242">justified</text>
  </g>
  <text class="slo-basis-sub" x="30" y="304">This is what replaces arbitrary thresholds: the alert fires because a commitment about real user happiness is at risk, which is a reason someone can be woken up for.</text>
</svg>
