<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" font-family="system-ui, sans-serif">
  <title>One request drawn as a trace: a parent span for the whole request with nested child spans for each step, each labelled with its duration on a time axis</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One request as a trace of nested spans</text>

  <!-- Time axis -->
  <line x1="60" y1="80" x2="720" y2="80" stroke="#1a202c" stroke-width="1"/>
  <text x="60" y="70" text-anchor="middle" font-size="13" fill="#1a202c">0 ms</text>
  <text x="720" y="70" text-anchor="middle" font-size="13" fill="#1a202c">812 ms</text>
  <text x="390" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">time &#8594;</text>

  <!-- Parent span: total_request 0-812 across full width -->
  <rect x="60" y="100" width="660" height="46" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="75" y="128" font-size="15" font-weight="bold" fill="#ffffff">span: total_request</text>
  <text x="705" y="128" text-anchor="end" font-size="14" font-weight="bold" fill="#ffffff">812 ms</text>

  <!-- Child 1: validate_input 0-12 (tiny) width ~ 660*12/812 = 9.8 -->
  <rect x="80" y="162" width="14" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="104" y="187" font-size="14" fill="#1a202c">span: validate_input &#8212; 12 ms</text>

  <!-- Child 2: db_query 12-552 width = 660*540/812 = 439 starting at 80 + 660*12/812=9.8 -> x~90 -->
  <rect x="90" y="218" width="439" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="105" y="243" font-size="14" font-weight="bold" fill="#1a202c">span: db_query &#8212; 540 ms (the slow step)</text>

  <!-- Child 3: call_service 552-800 width = 660*248/812 = 202 start x = 80 + 660*552/812 = 80+448=528 -->
  <rect x="529" y="274" width="202" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="544" y="299" font-size="14" fill="#1a202c">span: call_service &#8212; 248 ms</text>

  <!-- Note -->
  <rect x="60" y="336" width="660" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="390" y="364" text-anchor="middle" font-size="14" fill="#1a202c">All spans share one trace ID; child durations sit inside the parent and add up to its total.</text>
</svg>
