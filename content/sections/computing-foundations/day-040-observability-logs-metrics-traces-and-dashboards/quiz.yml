questions:
  - question: 'What are the three pillars of observability?'
    options:
      - 'Firewalls, backups, and load balancers'
      - 'Logs, metrics, and traces'
      - 'Testing, staging, and production'
      - 'CPU, memory, and disk'
    answer_index: 1
    explanation: 'The three pillars are logs (timestamped events), metrics (numbers over time), and traces (one request followed across services). Together they let you notice, locate, and explain a problem.'

  - question: 'Why is structured (JSON) logging generally preferred over plain-text logging?'
    options:
      - 'It uses less disk space than plain text in every case'
      - 'It is the only format that operating systems can write'
      - 'Its fields are machine-readable, so you can query them precisely instead of writing fragile text-parsing rules'
      - 'It hides sensitive data automatically'
    answer_index: 2
    explanation: 'Structured logs record events as machine-readable key-value data, so you can ask precise questions like "every ERROR with latency_ms over 3000" without brittle regular expressions over free-form text.'

  - question: 'Which metric type is best suited to measuring a value that can rise and fall, such as the current length of a queue?'
    options:
      - 'A counter'
      - 'A gauge'
      - 'A histogram'
      - 'A trace'
    answer_index: 1
    explanation: 'A gauge measures a value that can go up or down at any moment, such as current memory in use or queue length. A counter only ever increases, and a histogram records the distribution of many measured values.'

  - question: 'A service has an average response time of 550 ms, but its p50 is 140 ms and its p95 is 4200 ms. What does this most likely indicate?'
    options:
      - 'The average is the most trustworthy number to report'
      - 'Every request is consistently slow at around 550 ms'
      - 'A typical request is fast (140 ms), but a small tail of requests is very slow, and that tail is pulling the average up'
      - 'The percentiles were computed incorrectly'
    answer_index: 2
    explanation: 'The median (p50) of 140 ms shows typical requests are fast, while the p95 of 4200 ms reveals a slow tail. The average is dragged upward by those few outliers, which is exactly why percentiles describe real user experience better than an average.'

  - question: 'In distributed tracing, what is a span?'
    options:
      - 'The total number of servers a system runs on'
      - 'A single unit of work within a request, with a start time, a duration, and a name, nested under a parent span'
      - 'The gap in time between two separate requests'
      - 'A log line that contains no timestamp'
    answer_index: 1
    explanation: 'A span records one unit of work — a database query, a service call, a computation — with its start, duration, and name. Spans nest under a parent span and all share a trace ID, so one request can be reassembled across many machines.'

  - question: 'What is the key difference between monitoring and observability?'
    options:
      - 'Monitoring is free while observability always requires paid tools'
      - 'Monitoring watches questions defined in advance; observability lets you ask new questions after the fact from the signals already collected'
      - 'Observability only applies to hardware, monitoring only to software'
      - 'They are two names for exactly the same thing'
    answer_index: 1
    explanation: 'Monitoring answers predefined questions ("is CPU over 90%?"). Observability is the richer property that, because you emit enough well-structured signal, you can investigate failures you never anticipated when you wrote the code.'

  - question: 'What does the guidance "alert on symptoms, not causes" mean?'
    options:
      - 'Only send alerts about hardware failures'
      - 'Alert on internal conditions like high CPU rather than on user-facing behavior'
      - 'Alert on what the user actually feels — errors or slow responses — rather than on internal conditions that may be harmless'
      - 'Never set up any alerts, because they are always noise'
    answer_index: 2
    explanation: 'Good alerts fire on symptoms the user experiences, such as a high error rate or slow responses, not on internal causes like high CPU that may not be hurting anyone. Alerting on harmless causes trains teams to ignore their alerts.'

  - question: 'Why do high-volume systems often sample their traces, keeping only a fraction of them?'
    options:
      - 'Because traces are inaccurate unless sampled'
      - 'Because storing and processing every trace can cost more than running the system itself, and a sample still preserves the overall statistical shape'
      - 'Because sampling makes the system run faster for users'
      - 'Because traces are illegal to store in full'
    answer_index: 1
    explanation: 'Telemetry has a real cost to ingest, index, and retain. Keeping, say, one trace in a hundred trades completeness for affordability while still preserving the statistical picture — one of the central cost trade-offs in observability.'
