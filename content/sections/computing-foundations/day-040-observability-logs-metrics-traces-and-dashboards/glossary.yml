terms:
  - term: observability
    definition: 'The extent to which you can understand what is happening inside a running system purely from the signals it emits, including questions you did not think to ask in advance.'
  - term: log
    definition: 'A timestamped record of a single event that happened in a system, such as a request completing or an error occurring — the diary of the system, one line per event.'
  - term: structured logging
    definition: 'The practice of emitting each log entry as machine-readable key-value data (usually JSON) rather than free-form prose, so its fields can be queried precisely.'
  - term: metric
    definition: 'A numeric measurement sampled over time, forming a time-series of (timestamp, value) pairs that can be charted and aggregated across many events.'
  - term: counter
    definition: 'A metric that only ever increases (resetting to zero on restart), such as the total number of requests served; its rate of change per second is usually what you chart.'
  - term: gauge
    definition: 'A metric that can rise and fall over time, such as current memory in use or the length of a queue right now.'
  - term: histogram
    definition: 'A metric that records the distribution of many measured values into buckets, such as request latencies, from which percentiles like the p95 are computed.'
  - term: percentile
    definition: 'A value below which a given fraction of measurements fall; the p95 latency is the value below which 95% of requests finished, describing the slow tail that averages hide.'
  - term: trace
    definition: 'A record of a single request as it travels through a system, reassembled from many spans that share one trace identifier, showing where the time was spent.'
  - term: span
    definition: 'One unit of work within a trace — a database query, a service call, a computation — with a start time, a duration, and a name, nested under a parent span.'
  - term: dashboard
    definition: 'A screen of charts built from metrics that shows a system''s vital signs at a glance, such as request rate, error rate, and latency percentiles, for a human who is actively watching.'
  - term: alert
    definition: 'A rule that turns a metric crossing a threshold into a notification for a human who is not watching, best configured to fire on user-facing symptoms rather than internal causes.'
  - term: SLO
    definition: 'A Service Level Objective: a target you commit to for a measurement of user experience, such as 99.9% of requests succeeding in under 300 ms over a 30-day window, giving alerting a principled basis.'
