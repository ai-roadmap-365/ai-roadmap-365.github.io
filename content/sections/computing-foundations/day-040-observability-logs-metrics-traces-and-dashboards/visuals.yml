visuals:
  - id: three-pillars
    file: assets/three-pillars.svg
    type: diagram
    title: 'The three pillars of observability'
    alt: 'Diagram: the three pillars of observability — logs, metrics, and traces — feeding dashboards and alerts'
    description: 'An architecture diagram showing running services emitting three kinds of signal — logs, metrics, and traces — into a collector that stores them and feeds dashboards for humans to watch and alerts that page when something matters, with the reminder that metrics notice a problem, traces locate it, and logs explain it.'
  - id: trace-spans
    file: assets/trace-spans.svg
    type: flowchart
    title: 'One request as a trace of nested spans'
    alt: 'Flowchart: one request drawn as a trace of nested spans across services, with the time spent in each step'
    description: 'A flow diagram of a single request drawn on a time axis: a parent span for the whole request containing nested child spans for validating input, a database query, and a service call, each labelled with its duration, showing that the child spans sit inside the parent and add up to its total.'
  - id: three-pillars-plus-quality
    file: assets/three-pillars-plus-quality.svg
    type: diagram
    title: 'The three pillars, and the signal they cannot see'
    alt: 'Diagram: logs, metrics and traces compared with a quality signal'
    description: 'A two-column comparison of the three observability pillars against a quality signal, showing what each answers and why AI systems need the fourth.'
  - id: three-questions
    file: assets/three-questions.svg
    type: diagram
    title: 'Three signals, three questions'
    alt: 'Diagram: the question each observability signal answers'
    description: 'A three-stage reference pairing metrics, traces and logs with the specific question each answers when investigating a problem.'
  - id: structured-logs
    file: assets/structured-logs.svg
    type: diagram
    title: 'The most valuable decision you make about logs'
    alt: 'Diagram: plain text logs compared with structured logs'
    description: 'A two-column comparison of free-form text logging against structured key-value logging, covering queryability and robustness to format changes.'
  - id: average-lies
    file: assets/average-lies.svg
    type: diagram
    title: 'Why percentiles and not averages'
    alt: 'Diagram: an average latency compared with percentiles'
    description: 'A two-column comparison of reporting mean latency against reporting percentiles, showing how an acceptable average can conceal a badly affected minority.'
  - id: symptoms-not-causes
    file: assets/symptoms-not-causes.svg
    type: diagram
    title: 'Alert on symptoms, not causes'
    alt: 'Diagram: alerting on internal conditions compared with alerting on user experience'
    description: 'A two-column comparison of alerts based on internal resource conditions against alerts based on user-facing symptoms, covering false positives and alert fatigue.'
  - id: span-nesting
    file: assets/span-nesting.svg
    type: diagram
    title: 'How a trace localises a slow request'
    alt: 'Diagram: how nested spans reveal where a request spent its time'
    description: 'A four-stage explanation of distributed tracing covering the top-level span, nested child spans, the shared trace identifier, and reading the durations to find the slow step.'
  - id: cardinality-cost
    file: assets/cardinality-cost.svg
    type: diagram
    title: 'The label that explodes your bill'
    alt: 'Diagram: low-cardinality metric labels compared with high-cardinality ones'
    description: 'A two-column comparison of bounded and unbounded metric label values, explaining how each affects the number of time series stored.'
  - id: model-fails-silently
    file: assets/model-fails-silently.svg
    type: diagram
    title: 'A model does not fail like a service'
    alt: 'Diagram: how a service failure differs from a model failure'
    description: 'A two-column comparison of service failures, which are visible in system metrics, against model quality degradation, which leaves every system signal healthy.'
  - id: slo-basis
    file: assets/slo-basis.svg
    type: diagram
    title: 'From a measurement to a page at 3am'
    alt: 'Diagram: how an SLI and an SLO produce a justified alert'
    description: 'A four-stage progression from defining a service level indicator through committing to an objective, tracking the error budget, and alerting on burn rate.'
  - id: sampling
    file: assets/sampling.svg
    type: diagram
    title: 'You cannot keep everything'
    alt: 'Diagram: how trace sampling reduces volume while preserving signal'
    description: 'A four-stage explanation of sampling strategies for traces, covering the volume problem, head-based sampling, tail-based sampling, and always keeping errors.'
