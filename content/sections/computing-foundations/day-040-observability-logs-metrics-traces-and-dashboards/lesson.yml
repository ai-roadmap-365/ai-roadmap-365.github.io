slug: observability-logs-metrics-traces-and-dashboards
title: 'Observability: Logs, Metrics, Traces, and Dashboards'
section: computing-foundations
subsection: developer-workflow
week: 6
learning_promise: 'After this lesson you will be able to explain how a running system reports what it is doing through logs, metrics, and traces, compute a real percentile from raw latencies, and reason about dashboards, alerting, sampling, and cost — the literacy you will reuse to instrument every service you build.'
objectives:
  - 'Explain the three pillars of observability — logs, metrics, and traces — and the distinct question each one best answers'
  - 'Distinguish structured (JSON) logging from plain text and state why structure makes signals answerable at scale'
  - 'Identify the three metric types (counter, gauge, histogram) and compute a rate and a p95 percentile from raw values by hand'
  - 'Describe how a trace follows one request across services as nested spans sharing a trace ID'
  - 'Explain dashboards, alerting on symptoms rather than causes, and SLIs/SLOs at an introductory level'
  - 'Distinguish monitoring (predefined questions) from observability (asking new questions), and reason about sampling and telemetry cost'
prerequisites:
  - 'Day 6 and Day 7 (operating systems and processes) — what a running program and its output are'
  - 'Day 14 (logging in automation) — the idea of a program writing records as it runs'
  - 'A terminal with bash and python3 (both preinstalled on macOS and Linux)'
reading_time_minutes: 40
practical_time_minutes: 30
