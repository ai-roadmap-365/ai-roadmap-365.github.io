<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" font-family="system-ui, sans-serif">
  <title>A loop reading an array sequentially: one slow trip to RAM loads a whole cache line, then the next accesses are fast cache hits</title>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Why loops love the cache: locality of reference</text>

  <!-- CPU core box -->
  <rect x="40" y="90" width="200" height="130" rx="10" fill="#1d4ed8"/>
  <text x="140" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">CPU core</text>
  <text x="140" y="150" text-anchor="middle" font-size="14" fill="#f8fafc">running a loop:</text>
  <text x="140" y="176" text-anchor="middle" font-size="14" fill="#f8fafc">for each x in array:</text>
  <text x="140" y="200" text-anchor="middle" font-size="14" fill="#f8fafc">total = total + x</text>

  <!-- Cache box -->
  <rect x="310" y="80" width="220" height="150" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="420" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Cache (L1/L2)</text>
  <text x="420" y="130" text-anchor="middle" font-size="14" fill="#1a202c">holds one 64-byte cache line:</text>
  <!-- cache line cells a[0..7] -->
  <g font-size="14" fill="#1a202c">
    <rect x="326" y="146" width="47" height="34" fill="#f8fafc" stroke="#1d4ed8"/>
    <rect x="373" y="146" width="47" height="34" fill="#f8fafc" stroke="#1d4ed8"/>
    <rect x="420" y="146" width="47" height="34" fill="#f8fafc" stroke="#1d4ed8"/>
    <rect x="467" y="146" width="47" height="34" fill="#f8fafc" stroke="#1d4ed8"/>
    <text x="349" y="168" text-anchor="middle">a[0]</text>
    <text x="396" y="168" text-anchor="middle">a[1]</text>
    <text x="443" y="168" text-anchor="middle">a[2]</text>
    <text x="490" y="168" text-anchor="middle">a[3]</text>
  </g>
  <text x="420" y="208" text-anchor="middle" font-size="14" fill="#1a202c">… up to a[7] in the same line</text>

  <!-- RAM box -->
  <rect x="600" y="70" width="160" height="170" rx="10" fill="#93c5fd"/>
  <text x="680" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">RAM</text>
  <text x="680" y="126" text-anchor="middle" font-size="14" fill="#1a202c">the whole array</text>
  <text x="680" y="150" text-anchor="middle" font-size="14" fill="#1a202c">a[0] … a[999999]</text>
  <text x="680" y="182" text-anchor="middle" font-size="14" fill="#1a202c">plus everything else</text>
  <text x="680" y="206" text-anchor="middle" font-size="14" fill="#1a202c">the program uses</text>

  <!-- Miss arrow: RAM -> cache -->
  <line x1="600" y1="155" x2="546" y2="155" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="534,155 550,147 550,163" fill="#1d4ed8"/>
  <text x="568" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">1 miss on a[0]</text>
  <text x="568" y="280" text-anchor="middle" font-size="14" fill="#1a202c">copies the whole line</text>
  <text x="568" y="302" text-anchor="middle" font-size="14" fill="#1a202c">from RAM (~100 ns)</text>

  <!-- Hit arrow: cache -> CPU -->
  <line x1="310" y1="155" x2="256" y2="155" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="244,155 260,147 260,163" fill="#1d4ed8"/>
  <text x="278" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">next 7 reads are hits</text>
  <text x="278" y="280" text-anchor="middle" font-size="14" fill="#1a202c">served from cache</text>
  <text x="278" y="302" text-anchor="middle" font-size="14" fill="#1a202c">(~1 ns each)</text>

  <!-- Bottom summary band -->
  <rect x="40" y="340" width="720" height="120" rx="10" fill="#dbeafe"/>
  <text x="400" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Sequential access: one slow trip to RAM pays for eight fast cache hits.</text>
  <text x="400" y="402" text-anchor="middle" font-size="14" fill="#1a202c">Jumping randomly through a large array defeats this: almost every access misses</text>
  <text x="400" y="426" text-anchor="middle" font-size="14" fill="#1a202c">and waits the full ~100 ns trip — the same loop can run many times slower.</text>
  <text x="400" y="488" text-anchor="middle" font-size="14" fill="#1a202c">Latencies are approximate orders of magnitude.</text>
</svg>
