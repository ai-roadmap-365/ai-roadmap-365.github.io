<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both extremes are unusable. The pyramid is the only affordable answer.">
  <title>Why not build everything from the fast stuff</title>
  <style>
    .why-the-pyramid-exists-bg   { fill: #f8fafc; }
    .why-the-pyramid-exists-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-pyramid-exists-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-pyramid-exists-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-pyramid-exists-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-pyramid-exists-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-pyramid-exists-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-the-pyramid-exists-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-the-pyramid-exists-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-the-pyramid-exists-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-the-pyramid-exists-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-the-pyramid-exists-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-the-pyramid-exists-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-the-pyramid-exists-row { opacity: 1; }
    .why-the-pyramid-exists-r0 { animation-delay: 0.00s; }
    .why-the-pyramid-exists-r1 { animation-delay: 0.45s; }
    .why-the-pyramid-exists-r2 { animation-delay: 0.90s; }
    .why-the-pyramid-exists-r3 { animation-delay: 1.35s; }
    .why-the-pyramid-exists-r4 { animation-delay: 1.80s; }
    .why-the-pyramid-exists-row { animation: why-the-pyramid-exists-reveal 7.3s ease-in-out infinite; }
    @keyframes why-the-pyramid-exists-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="why-the-pyramid-exists-bg" width="980" height="390"/>
  <text class="why-the-pyramid-exists-h1"  x="30" y="40">Why not build everything from the fast stuff</text>
  <text class="why-the-pyramid-exists-sub" x="30" y="64">Both extremes are unusable. The pyramid is the only affordable answer.</text>
  <rect class="why-the-pyramid-exists-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="why-the-pyramid-exists-name" x="46" y="122">All register-speed</text>
  <text class="why-the-pyramid-exists-desc" x="46" y="142">Unaffordable</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r0" x="46" y="182">More transistors per bit, more area, more power</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r1" x="46" y="216">Must sit physically close to the ALU</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r2" x="46" y="250">A laptop would cost more than a house</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r3" x="46" y="284">And hold a few megabytes</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r4" x="46" y="318">Fast is not the problem. Fast AND large is.</text>
  <rect class="why-the-pyramid-exists-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="why-the-pyramid-exists-name" x="526" y="122">All disk-speed</text>
  <text class="why-the-pyramid-exists-desc" x="526" y="142">Unusably slow</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r0" x="526" y="182">Cheap, enormous, and about 100 microseconds away</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r1" x="526" y="216">A modern processor would wait for essentially everything</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r2" x="526" y="250">300,000 cycles per access</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r3" x="526" y="284">Capacity is not the problem either</text>
  <text class="why-the-pyramid-exists-desc why-the-pyramid-exists-row why-the-pyramid-exists-r4" x="526" y="318">The pyramid buys most of both</text>
  <text class="why-the-pyramid-exists-sub" x="30" y="372">Nearly the speed of the fastest at nearly the price of the cheapest — and it only works because of locality.</text>
</svg>
