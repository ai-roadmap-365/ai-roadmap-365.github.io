<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two properties of real programs, not of hardware.">
  <title>Why a small fast cache helps at all</title>
  <style>
    .why-caches-work-bg   { fill: #f8fafc; }
    .why-caches-work-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-caches-work-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-caches-work-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-caches-work-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-caches-work-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-caches-work-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-caches-work-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-caches-work-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-caches-work-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-caches-work-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-caches-work-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-caches-work-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .why-caches-work-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .why-caches-work-stage { opacity: 1; }

    .why-caches-work-s0 { animation-delay: 0.00s; }
    .why-caches-work-e0 { animation-delay: 0.00s; }
    .why-caches-work-s1 { animation-delay: 1.28s; }
    .why-caches-work-e1 { animation-delay: 1.28s; }
    .why-caches-work-s2 { animation-delay: 2.56s; }
    .why-caches-work-e2 { animation-delay: 2.56s; }
    .why-caches-work-s3 { animation-delay: 3.84s; }
    .why-caches-work-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .why-caches-work-conn  { animation: why-caches-work-trace 6.4s ease-in-out infinite; }
      .why-caches-work-stage { animation: why-caches-work-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes why-caches-work-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes why-caches-work-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .why-caches-work-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .why-caches-work-stage { animation: why-caches-work-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes why-caches-work-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="why-caches-work-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="why-caches-work-bg" width="980" height="322"/>
  <text class="why-caches-work-h1"  x="30" y="40">Why a small fast cache helps at all</text>
  <text class="why-caches-work-sub" x="30" y="64">Two properties of real programs, not of hardware.</text>
  <g class="why-caches-work-stage why-caches-work-s0">
    <rect class="why-caches-work-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="why-caches-work-step" x="44" y="142">01</text>
    <text class="why-caches-work-name" x="70" y="142">Temporal locality</text>
    <text class="why-caches-work-desc" x="44" y="166">What you used once, you will</text>
    <text class="why-caches-work-desc" x="44" y="182">probably use again shortly. A</text>
    <text class="why-caches-work-desc" x="44" y="198">loop counter, a lookup table.</text>
    <text class="why-caches-work-edge" x="44" y="242">again soon</text>
  </g>
  <line class="why-caches-work-line why-caches-work-conn why-caches-work-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#why-caches-work-tip)"/>
  <g class="why-caches-work-stage why-caches-work-s1">
    <rect class="why-caches-work-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="why-caches-work-step" x="280" y="142">02</text>
    <text class="why-caches-work-name" x="306" y="142">Spatial locality</text>
    <text class="why-caches-work-desc" x="280" y="166">What you use, you will probably</text>
    <text class="why-caches-work-desc" x="280" y="182">use its neighbours. The next</text>
    <text class="why-caches-work-desc" x="280" y="198">array element.</text>
    <text class="why-caches-work-edge" x="280" y="242">nearby</text>
  </g>
  <line class="why-caches-work-line why-caches-work-conn why-caches-work-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#why-caches-work-tip)"/>
  <g class="why-caches-work-stage why-caches-work-s2">
    <rect class="why-caches-work-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="why-caches-work-step" x="516" y="142">03</text>
    <text class="why-caches-work-name" x="542" y="142">So caches fetch whole lines</text>
    <text class="why-caches-work-desc" x="516" y="166">Not one byte but a block,</text>
    <text class="why-caches-work-desc" x="516" y="182">betting you will want the rest.</text>
    <text class="why-caches-work-edge" x="516" y="242">a line</text>
  </g>
  <line class="why-caches-work-line why-caches-work-conn why-caches-work-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#why-caches-work-tip)"/>
  <g class="why-caches-work-stage why-caches-work-s3">
    <rect class="why-caches-work-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="why-caches-work-step" x="752" y="142">04</text>
    <text class="why-caches-work-name" x="778" y="142">Which is why layout matters</text>
    <text class="why-caches-work-desc" x="752" y="166">Walking an array in order is</text>
    <text class="why-caches-work-desc" x="752" y="182">fast; jumping randomly through</text>
    <text class="why-caches-work-desc" x="752" y="198">memory defeats both.</text>
    <text class="why-caches-work-edge" x="752" y="242">order</text>
  </g>
  <text class="why-caches-work-sub" x="30" y="304">This is why the same number of operations can differ in speed by an order of magnitude depending on the order you touch memory in — and it is the reason data layout is a performance decision.</text>
</svg>
