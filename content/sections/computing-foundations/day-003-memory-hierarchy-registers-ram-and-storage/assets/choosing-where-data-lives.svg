<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Optimising access patterns before profiling costs a day to save a millisecond.">
  <title>When the hierarchy is the answer, and when it is a distraction</title>
  <style>
    .choosing-where-data-lives-bg   { fill: #f8fafc; }
    .choosing-where-data-lives-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-where-data-lives-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-where-data-lives-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-where-data-lives-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-where-data-lives-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-where-data-lives-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .choosing-where-data-lives-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .choosing-where-data-lives-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .choosing-where-data-lives-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .choosing-where-data-lives-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .choosing-where-data-lives-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .choosing-where-data-lives-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .choosing-where-data-lives-row { opacity: 1; }
    .choosing-where-data-lives-r0 { animation-delay: 0.00s; }
    .choosing-where-data-lives-r1 { animation-delay: 0.45s; }
    .choosing-where-data-lives-r2 { animation-delay: 0.90s; }
    .choosing-where-data-lives-r3 { animation-delay: 1.35s; }
    .choosing-where-data-lives-r4 { animation-delay: 1.80s; }
    .choosing-where-data-lives-row { animation: choosing-where-data-lives-reveal 7.3s ease-in-out infinite; }
    @keyframes choosing-where-data-lives-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="choosing-where-data-lives-bg" width="980" height="390"/>
  <text class="choosing-where-data-lives-h1"  x="30" y="40">When the hierarchy is the answer, and when it is a distraction</text>
  <text class="choosing-where-data-lives-sub" x="30" y="64">Optimising access patterns before profiling costs a day to save a millisecond.</text>
  <rect class="choosing-where-data-lives-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="choosing-where-data-lives-name" x="46" y="122">Reason about it</text>
  <text class="choosing-where-data-lives-desc" x="46" y="142">The model earns its keep</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r0" x="46" y="182">Slower than the arithmetic can explain</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r1" x="46" y="216">A job will not fit in memory</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r2" x="46" y="250">Fast on one machine, slow on another</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r3" x="46" y="284">Choosing hardware to buy or rent</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r4" x="46" y="318">The processor is busy but work is not progressing</text>
  <rect class="choosing-where-data-lives-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="choosing-where-data-lives-name" x="526" y="122">Leave it alone</text>
  <text class="choosing-where-data-lives-desc" x="526" y="142">Not yet</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r0" x="526" y="182">The data is small</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r1" x="526" y="216">It is already fast enough</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r2" x="526" y="250">You have not profiled anything</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r3" x="526" y="284">Getting a first version working</text>
  <text class="choosing-where-data-lives-desc choosing-where-data-lives-row choosing-where-data-lives-r4" x="526" y="318">The bottleneck has not been measured</text>
  <text class="choosing-where-data-lives-sub" x="30" y="372">The tell is a program that slows down far more than its input grew.</text>
</svg>
