visuals:
  - id: memory-pyramid-detailed
    file: assets/memory-pyramid-detailed.svg
    type: diagram
    title: 'The memory hierarchy, level by level'
    alt: 'Diagram: the memory hierarchy pyramid with approximate sizes and latencies at every level'
    description: 'An eight-tier pyramid from registers (~1 KB, ~0.5 ns) through L1, L2, and L3 caches, RAM (~100 ns), SSD (~100 µs), and hard disk (~5–10 ms) down to network storage, with arrows showing that levels get faster and costlier per byte going up, larger and cheaper going down, and a note that all figures are approximate orders of magnitude.'
  - id: cache-locality
    file: assets/cache-locality.svg
    type: diagram
    title: 'Why loops love the cache: locality of reference'
    alt: 'Diagram: a loop reading data from cache versus reaching out to RAM'
    description: 'A CPU core running a summing loop next to a cache holding one 64-byte cache line of array elements and a RAM box holding the whole array: one miss copies a whole line from RAM (~100 ns) and the next seven reads are ~1 ns cache hits, while random access would miss almost every time.'
  - id: weights-bandwidth-ceiling
    file: assets/weights-bandwidth-ceiling.svg
    type: diagram
    title: 'Weights, bandwidth, and the token ceiling'
    alt: 'Diagram: how model size and memory bandwidth set a token-per-second ceiling'
    description: 'A two-row data-flow diagram. The top row carries 14 GB of fp16 weights across a 400 GB/s bus, giving roughly 30 tokens per second. The bottom row carries the same model quantised to 4 bits at 3.5 GB across the same bus, giving roughly 114 tokens per second. Motion shows a token-sized packet crossing each bus, the lower one four times as often.'
