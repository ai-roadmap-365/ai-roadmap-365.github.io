visuals:
  - id: memory-pyramid-detailed
    file: assets/memory-pyramid-detailed.svg
    type: diagram
    title: 'The memory hierarchy, level by level'
    alt: 'Diagram: the memory hierarchy pyramid with approximate sizes and latencies at every level'
    description: 'An eight-tier pyramid from registers (~1 KB, ~0.5 ns) through L1, L2, and L3 caches, RAM (~100 ns), SSD (~100 µs), and hard disk (~5–10 ms) down to network storage, with arrows showing that levels get faster and costlier per byte going up, larger and cheaper going down, and a note that all figures are approximate orders of magnitude.'
  - id: cache-locality
    file: assets/cache-locality.svg
    type: diagram
    title: 'Why loops love the cache: locality of reference'
    alt: 'Diagram: a loop reading data from cache versus reaching out to RAM'
    description: 'A CPU core running a summing loop next to a cache holding one 64-byte cache line of array elements and a RAM box holding the whole array: one miss copies a whole line from RAM (~100 ns) and the next seven reads are ~1 ns cache hits, while random access would miss almost every time.'
  - id: weights-bandwidth-ceiling
    file: assets/weights-bandwidth-ceiling.svg
    type: diagram
    title: 'Weights, bandwidth, and the token ceiling'
    alt: 'Diagram: how model size and memory bandwidth set a token-per-second ceiling'
    description: 'A two-row data-flow diagram. The top row carries 14 GB of fp16 weights across a 400 GB/s bus, giving roughly 30 tokens per second. The bottom row carries the same model quantised to 4 bits at 3.5 GB across the same bus, giving roughly 114 tokens per second. Motion shows a token-sized packet crossing each bus, the lower one four times as often.'
  - id: latency-at-human-scale
    file: assets/latency-at-human-scale.svg
    type: diagram
    title: 'The pyramid, if a register access took one second'
    alt: 'Diagram: memory latencies rescaled to human time'
    description: 'A five-stage sequence rescaling memory latencies to human time: register one second, L1 three seconds, RAM five minutes, SSD four days, network storage months.'
  - id: sequential-versus-random
    file: assets/sequential-versus-random.svg
    type: diagram
    title: 'Same data, same loop, ten times the time'
    alt: 'Diagram: sequential access compared with random access'
    description: 'A two-column comparison of sequential and random array traversal, showing why one runs at nearly cache speed and the other misses on every read.'
  - id: page-fault-stall
    file: assets/page-fault-stall.svg
    type: diagram
    title: 'What happens when RAM runs out'
    alt: 'Diagram: the sequence of a page fault when memory is oversubscribed'
    description: 'A four-stage sequence showing RAM filling, the OS evicting least-recently-used pages to disk, a program touching an evicted page, and the resulting stall for an SSD access.'
  - id: latency-versus-bandwidth
    file: assets/latency-versus-bandwidth.svg
    type: diagram
    title: 'The pair people mix up most'
    alt: 'Diagram: latency compared with bandwidth'
    description: 'A two-column comparison of latency and bandwidth, what each bounds, and which one limits a model''s size versus its speed.'
  - id: choosing-where-data-lives
    file: assets/choosing-where-data-lives.svg
    type: diagram
    title: 'When the hierarchy is the answer, and when it is a distraction'
    alt: 'Diagram: when to reason about the memory hierarchy'
    description: 'A two-column comparison of situations where memory-hierarchy reasoning is the right tool and situations where it is premature.'
  - id: why-the-pyramid-exists
    file: assets/why-the-pyramid-exists.svg
    type: diagram
    title: 'Why not build everything from the fast stuff'
    alt: 'Diagram: a machine built entirely of fast memory compared with one built entirely of slow memory'
    description: 'A two-column comparison of hypothetical machines built entirely from register-speed memory or entirely from disk-speed memory, showing why neither is viable and why layering is.'
  - id: memory-wall
    file: assets/memory-wall.svg
    type: diagram
    title: 'The gap that every tier since exists to hide'
    alt: 'Diagram: the widening gap between processor speed and memory latency'
    description: 'A four-stage sequence showing processors outpacing memory through the 1980s, caches appearing, multiple cache levels becoming necessary, and stacked high-bandwidth memory on accelerators.'
  - id: why-caches-work
    file: assets/why-caches-work.svg
    type: diagram
    title: 'Why a small fast cache helps at all'
    alt: 'Diagram: temporal and spatial locality and why caching works'
    description: 'A four-stage explanation of why caching is effective, covering temporal locality, spatial locality, cache lines, and the access patterns that defeat both.'
