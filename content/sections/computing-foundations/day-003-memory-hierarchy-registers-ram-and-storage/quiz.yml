questions:
  - question: 'Why do computers use a hierarchy of memories instead of one single memory?'
    options:
      - 'Because no memory technology is simultaneously fast, large, and cheap, so systems layer small fast memories over large slow ones'
      - 'Because operating systems can only address one type of memory at a time'
      - 'Because older computers had many memory types and modern ones keep them for compatibility'
      - 'Because programs must be stored separately from the data they use'
    answer_index: 0
    explanation: 'Speed, size, and cost form a triangle: SRAM is fast but expensive and small, DRAM is bigger and slower, storage is bigger and slower again. Layering them — and relying on locality of reference — delivers nearly the speed of the fastest at nearly the price of the cheapest.'

  - question: 'Which sequence orders the levels from fastest (lowest latency) to slowest?'
    options:
      - 'Registers, RAM, L1 cache, SSD, HDD'
      - 'L1 cache, registers, RAM, HDD, SSD'
      - 'Registers, L1 cache, RAM, SSD, HDD'
      - 'RAM, registers, L1 cache, SSD, HDD'
    answer_index: 2
    explanation: 'Registers respond in about a CPU cycle (~0.5 ns), L1 cache in ~1 ns, RAM in ~100 ns, an SSD random read in ~100 µs, and a hard disk seek in several milliseconds — each step roughly an order of magnitude or more.'

  - question: 'A loop reads a large array element by element and runs at nearly cache speed even though the array lives in RAM. What best explains this?'
    options:
      - 'RAM automatically becomes as fast as cache when accessed by a loop'
      - 'Each miss loads a whole 64-byte cache line, so one slow RAM trip pays for several fast cache hits on the neighboring elements, and the prefetcher fetches upcoming lines early'
      - 'The compiler moves the entire array into the CPU''s registers before the loop starts'
      - 'The operating system pauses all other programs so the loop gets the full memory bus'
    answer_index: 1
    explanation: 'Sequential access has strong spatial locality: a miss on a[0] brings a[1]..a[7] along in the same cache line, and hardware prefetching notices the regular pattern and stays ahead of the loop. Random access defeats both and can be many times slower.'

  - question: 'What is the difference between latency and bandwidth for a memory or storage level?'
    options:
      - 'They are two names for the same measurement'
      - 'Latency applies only to disks, while bandwidth applies only to RAM'
      - 'Latency is measured in bytes and bandwidth in seconds'
      - 'Latency is how long one access takes; bandwidth is how many bytes per second the level can stream once transfers are flowing'
    answer_index: 3
    explanation: 'A level can pair high bandwidth with poor latency (network storage is the classic case). Latency punishes many small scattered accesses; bandwidth caps large sequential transfers — which is why batching small accesses into large ones is such a common optimization.'

  - question: 'What actually happens when a machine starts swapping (thrashing)?'
    options:
      - 'The CPU overheats and reduces its clock speed until memory cools down'
      - 'The operating system compresses the CPU caches to make room for more programs'
      - 'RAM is full, so the OS moves least-recently-used memory pages to disk and stalls programs with page faults whenever they touch a page that must be fetched back'
      - 'The SSD takes over executing instructions while RAM is cleared'
    answer_index: 2
    explanation: 'Virtual memory lets the OS back overflowing RAM with disk, but every touched-and-missing page costs a ~hundred-microsecond (or worse) trip. Sustained swapping effectively demotes RAM to SSD speed, which users feel as the machine becoming unresponsive.'

  - question: 'Why is the second read of a large file often several times faster than the first?'
    options:
      - 'The SSD physically speeds up once its circuits warm to operating temperature'
      - 'The operating system kept the file''s contents in spare RAM (the page cache), so the second read never touches the disk'
      - 'The file becomes smaller after it has been read once'
      - 'The first read defragments the file so later reads are sequential'
    answer_index: 1
    explanation: 'The OS uses otherwise-idle RAM as a cache of recently read disk contents. A warm read is served at RAM speed — the same caching trick as CPU caches, applied one level down the pyramid. Today''s lab measures this directly.'

  - question: 'A 7-billion-parameter model stored at 2 bytes per weight runs on hardware with roughly 400 GB/s of memory bandwidth. Why does 4-bit quantization speed up token generation?'
    options:
      - 'Quantization increases the memory bandwidth of the hardware'
      - 'Quantized weights are stored in the CPU''s registers permanently'
      - 'Quantization lets the model skip reading most of its weights for each token'
      - 'Generating each token reads essentially all the weights, so shrinking the model from ~14 GB to ~3.5 GB moves a quarter of the bytes per token, roughly quadrupling the bandwidth-set ceiling'
    answer_index: 3
    explanation: 'Token generation is usually memory-bandwidth-bound: the ceiling is approximately bandwidth divided by model size. Quantization shrinks the bytes that must stream through memory for every token — and also lets larger models fit in fast memory at all.'

  - question: 'What makes unified memory (as on Apple Silicon Macs) interesting for running models locally?'
    options:
      - 'The CPU and GPU share one large memory pool, so models that exceed a typical discrete GPU''s 8–16 GB of onboard memory can still sit entirely in fast memory'
      - 'Unified memory is faster than the high-bandwidth memory used in datacenter GPUs'
      - 'Unified memory is persistent, so models stay loaded after the machine powers off'
      - 'Unified memory eliminates the need for caches on the CPU'
    answer_index: 0
    explanation: 'Unified memory trades the raw bandwidth of dedicated GPU memory for one large shared pool — often far larger than a consumer GPU''s onboard memory — so mid-sized models fit in fast memory on a laptop instead of spilling to a slower tier.'
