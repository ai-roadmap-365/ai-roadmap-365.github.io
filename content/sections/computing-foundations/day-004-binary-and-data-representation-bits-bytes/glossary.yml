terms:
  - term: bit
    definition: 'A single binary digit, 0 or 1 — the smallest unit of information, physically realized as one two-state switch.'
  - term: byte
    definition: 'A group of 8 bits, able to hold 256 distinct patterns; the smallest unit of memory most machines address, standardized at 8 bits by IBM''s System/360 in 1964.'
  - term: nibble
    definition: 'Half a byte — 4 bits — which is exactly the amount of information one hexadecimal digit represents.'
  - term: word
    definition: 'The natural chunk of bits a processor handles in one operation, typically 32 or 64 bits on modern machines.'
  - term: place value
    definition: 'The worth of a digit position in a positional numeral system: powers of 10 in decimal, powers of 2 in binary, powers of 16 in hexadecimal.'
  - term: hexadecimal
    definition: 'Base-16 notation using digits 0–9 and A–F, written with the 0x prefix; each digit encodes exactly four bits, making it the standard human-readable shorthand for raw binary.'
  - term: two's complement
    definition: 'The standard representation of signed integers, in which −n is the bit pattern of 2ᵏ − n (flip the bits, add 1); it gives one unique zero and lets a single adder circuit perform both addition and subtraction.'
  - term: sign bit
    definition: 'The leftmost bit of a signed integer; in two''s complement it carries a negative place value (−128 in a byte), so a 1 there makes the whole number negative.'
  - term: overflow
    definition: 'What happens when an arithmetic result exceeds what a fixed-width register can hold: the value silently wraps around, as when an unsigned byte computes 255 + 1 = 0.'
  - term: floating point
    definition: 'Binary scientific notation for storing fractional numbers as a sign, a mantissa, and an exponent, standardized by IEEE 754 in 1985; it trades exactness for enormous range.'
  - term: mantissa
    definition: 'The significant-digits field of a floating-point number (also called the significand or fraction), which controls precision; float32 gives it 23 bits.'
  - term: exponent
    definition: 'The field of a floating-point number that scales the mantissa by a power of two, controlling range; when it cannot hold a needed power, the number overflows.'
  - term: quantization
    definition: 'Reducing the bits used per number — for example mapping float32 model weights onto 256 int8 levels plus a scale factor — shrinking memory and data movement at a small cost in precision.'
  - term: endianness
    definition: 'The convention for which byte of a multi-byte number is stored first in memory: least-significant first (little-endian, x86 and most ARM) or most-significant first (big-endian, traditional in network protocols).'
  - term: gibibyte
    definition: 'The binary giga-unit, GiB = 1,024³ bytes, defined by the IEC in 1998 to end the ambiguity with the decimal gigabyte (GB = 10⁹ bytes) that makes a "1 TB" drive report about 931 GiB.'
