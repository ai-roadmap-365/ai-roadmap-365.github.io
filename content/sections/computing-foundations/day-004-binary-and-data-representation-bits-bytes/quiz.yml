questions:
  - question: 'What decimal number does the binary pattern 101010 represent?'
    options:
      - '52, because the digits sum with place values 16, 8, 4'
      - '20, because there are two 1-bits and a trailing zero'
      - '42, because the 1-bits sit on the place values 32, 8, and 2'
      - '84, because each 1-bit doubles the previous total'
    answer_index: 2
    explanation: 'Binary place values run 1, 2, 4, 8, 16, 32 from the right; 101010 has 1-bits under 32, 8, and 2, and 32 + 8 + 2 = 42.'

  - question: 'Why do engineers write bit patterns in hexadecimal?'
    options:
      - 'Hexadecimal avoids the rounding errors that binary introduces'
      - 'Processors compute faster on hexadecimal numbers than on binary ones'
      - 'Hexadecimal can represent negative numbers while binary cannot'
      - 'Each hex digit maps to exactly four bits, shortening long binary strings'
    answer_index: 3
    explanation: 'Hex is purely a human convenience: because 16 = 2⁴, each hex digit stands for one four-bit group, so conversion is table lookup with no arithmetic. The processor itself only ever sees bits.'

  - question: 'In 8-bit two''s complement, how do you form the representation of −44 from 44 (00101100)?'
    options:
      - 'Flip every bit and add 1, giving 11010100'
      - 'Reverse the order of the bits, giving 00110100'
      - 'Subtract the pattern from 11111111, giving 11010011'
      - 'Set the leftmost bit to 1, giving 10101100'
    answer_index: 0
    explanation: 'Two''s complement negation is invert-then-increment: 00101100 flips to 11010011, and adding 1 gives 11010100. Adding that to 00101100 produces a ninth bit that falls off the register, leaving exactly zero.'

  - question: 'What actually went wrong in the software aboard Ariane 5 flight 501 in 1996?'
    options:
      - 'A floating-point division by zero crashed the main flight computer'
      - 'A 64-bit float was converted to a 16-bit integer it could not fit'
      - 'Cosmic radiation flipped a bit in the guidance program''s memory'
      - 'The engines were commanded in imperial units while guidance computed in metric'
    answer_index: 1
    explanation: 'Alignment code reused from Ariane 4 converted the horizontal-bias value to a 16-bit signed integer. Ariane 5''s faster, flatter ascent pushed the value past 32,767 about 37 seconds after ignition; the operand-error exception halted both identical inertial units, and the vehicle broke up and self-destructed.'

  - question: 'Why does 0.1 + 0.2 print as 0.30000000000000004 in most programming languages?'
    options:
      - 'The addition circuit in the ALU has a known rounding defect'
      - 'The decimal point character is being misread as a thousands separator'
      - 'One tenth has no finite binary form, so the sum is microscopically off'
      - 'Floating-point numbers can only store values greater than 1 exactly'
    answer_index: 2
    explanation: '0.1 in binary is 0.000110011001100… repeating forever, just as 1/3 repeats in decimal. Floats store the nearest representable values, and the sum of those approximations rounds to a number a hair above 0.3. The hardware adds flawlessly; the inputs were never exactly 0.1 and 0.2.'

  - question: 'A 7-billion-parameter model is quantized from float32 to int8. What happens to its memory footprint for weights?'
    options:
      - 'It drops to about 875 MB, because int8 uses one bit per weight'
      - 'It halves from about 28 GB to about 14 GB, because int8 stores two weights per byte'
      - 'It stays the same, because quantization only changes computation speed, not storage'
      - 'It drops from about 28 GB to about 7 GB, because each weight shrinks from 4 bytes to 1 byte'
    answer_index: 3
    explanation: 'Quantization to int8 stores each weight in a single two''s-complement byte (with a scale factor for reconstruction) instead of four bytes: 7 billion × 4 bytes ≈ 28 GB becomes 7 billion × 1 byte ≈ 7 GB.'

  - question: 'Both float16 and bfloat16 use 16 bits. What is the key difference, and why does machine learning generally prefer bfloat16?'
    options:
      - 'bfloat16 keeps float32''s exponent range, trading mantissa precision'
      - 'float16 is an integer format while bfloat16 is a floating-point format'
      - 'bfloat16 stores two numbers per 16 bits, doubling effective memory capacity'
      - 'bfloat16 rounds decimal fractions like 0.1 exactly, avoiding accumulation error'
    answer_index: 0
    explanation: 'float16 spends its bits on precision (10-bit mantissa, 5-bit exponent); bfloat16 spends them on range (7-bit mantissa, 8-bit exponent, matching float32). Gradients and activations routinely exceed float16''s ~65,504 ceiling, so keeping the exponent field is the safer trade for learning.'

  - question: 'A drive sold as "1 TB" shows about 931 GiB in the operating system. Why?'
    options:
      - 'The filesystem permanently reserves 7% of every drive for error correction'
      - 'The maker counts in powers of 1,000 and the OS in powers of 1,024'
      - 'The operating system is misreading the drive''s firmware and the true size is 1,024 GiB'
      - 'The drive shipped partly full of preinstalled recovery software'
    answer_index: 1
    explanation: 'Both numbers describe the same bytes. Marketing prefixes are decimal (kilo = 1,000), while KiB/MiB/GiB are binary (kibi = 1,024); the gap compounds to about 7% at the tera scale. No storage is missing.'
