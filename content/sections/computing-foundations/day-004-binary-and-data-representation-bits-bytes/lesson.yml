id: D004
day: 4
slug: binary-and-data-representation-bits-bytes
title: 'Binary and Data Representation: Bits, Bytes, and Numbers'
section: computing-foundations
subsection: how-computers-work
week: 1
learning_promise: 'After this lesson you will be able to convert numbers between decimal, binary, and hexadecimal by hand, add and negate binary numbers the way the hardware does, and explain overflow, floating point, and quantization well enough to size an AI model from its bit format.'
objectives:
  - 'Explain place value in bases 2, 10, and 16 and read any byte by summing the place values under its 1-bits'
  - 'Convert numbers between decimal, binary, and hexadecimal by hand using the subtraction, division, and bit-grouping methods'
  - 'Add two 8-bit binary numbers column by column, tracking carries, and verify the result in decimal'
  - 'Negate a number in two''s complement (flip the bits, add 1) and explain why one adder circuit then handles both addition and subtraction'
  - 'Describe integer overflow, including the Ariane 5 flight 501 conversion failure and the Year 2038 problem, and state the range limits of 8-, 16-, and 32-bit integers'
  - 'Explain in plain language why 0.1 + 0.2 ≠ 0.3 in floating point and what the sign, exponent, and mantissa fields of a float32 each control'
  - 'Compute the memory footprint of a model from its parameter count and numeric format (float32, float16, bfloat16, int8), and distinguish KiB/MiB/GiB from kB/MB/GB'
prerequisites:
  - 'Day 1 (How a Computer Works) — transistors, registers, and the adder circuit are assumed'
  - 'Comfort opening a terminal, as practiced in the Day 1 lab'
  - 'Primary-school column addition — the carry rule is reused unchanged in base 2'
reading_time_minutes: 40
practical_time_minutes: 30
last_verified: '2026-07-12'
