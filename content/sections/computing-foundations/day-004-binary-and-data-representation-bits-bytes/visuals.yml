visuals:
  - id: binary-place-values
    file: assets/binary-place-values.svg
    type: diagram
    title: 'Reading a byte with place values'
    alt: 'Diagram: the eight place values of a byte decoding 10110101 into 181'
    description: 'A row of eight bit boxes holding 10110101 with the place values 128, 64, 32, 16, 8, 4, 2, 1 above them, the per-bit contributions below, and the sum 128 + 32 + 16 + 4 + 1 = 181, showing that reading binary means adding the place values under the 1-bits.'
  - id: float-vs-int
    file: assets/float-vs-int.svg
    type: diagram
    title: 'One bit pattern, two meanings'
    alt: 'Diagram: the same 32 bits read as the integer 1078530011 and as the float 3.1415927'
    description: 'The 32-bit pattern 0x40490FDB shown once at the top, then interpreted two ways: as an int32 whose place values sum to 1,078,530,011, and as an IEEE 754 float32 split into a sign bit (0, positive), an 8-bit exponent (10000000 = 128, meaning 2¹), and a 23-bit mantissa, yielding 3.1415927 — demonstrating that meaning comes from the encoding contract, not the bits.'
  - id: same-bits-three-readings
    file: assets/same-bits-three-readings.svg
    type: diagram
    title: 'The same 32 bits, read three ways'
    alt: 'Diagram: one pattern of bits interpreted as an integer, a float, and text'
    description: 'A two-column comparison showing one 32-bit pattern interpreted as an unsigned integer, as an IEEE-754 float, and as four ASCII characters, with the value each reading produces.'
