visuals:
  - id: binary-place-values
    file: assets/binary-place-values.svg
    type: diagram
    title: 'Reading a byte with place values'
    alt: 'Diagram: the eight place values of a byte decoding 10110101 into 181'
    description: 'A row of eight bit boxes holding 10110101 with the place values 128, 64, 32, 16, 8, 4, 2, 1 above them, the per-bit contributions below, and the sum 128 + 32 + 16 + 4 + 1 = 181, showing that reading binary means adding the place values under the 1-bits.'
  - id: float-vs-int
    file: assets/float-vs-int.svg
    type: diagram
    title: 'One bit pattern, two meanings'
    alt: 'Diagram: the same 32 bits read as the integer 1078530011 and as the float 3.1415927'
    description: 'The 32-bit pattern 0x40490FDB shown once at the top, then interpreted two ways: as an int32 whose place values sum to 1,078,530,011, and as an IEEE 754 float32 split into a sign bit (0, positive), an 8-bit exponent (10000000 = 128, meaning 2¹), and a 23-bit mantissa, yielding 3.1415927 — demonstrating that meaning comes from the encoding contract, not the bits.'
  - id: same-bits-three-readings
    file: assets/same-bits-three-readings.svg
    type: diagram
    title: 'The same 32 bits, read three ways'
    alt: 'Diagram: one pattern of bits interpreted as an integer, a float, and text'
    description: 'A two-column comparison showing one 32-bit pattern interpreted as an unsigned integer, as an IEEE-754 float, and as four ASCII characters, with the value each reading produces.'
  - id: twos-complement
    file: assets/twos-complement.svg
    type: diagram
    title: 'Negative numbers, without a sign field'
    alt: 'Diagram: forming a negative number with two''s complement'
    description: 'A four-stage sequence converting 44 to -44 in eight bits: write the positive value, invert every bit, add one, and observe that the top bit now reads as the sign.'
  - id: precision-formats
    file: assets/precision-formats.svg
    type: diagram
    title: 'float16 and bfloat16 spend 16 bits differently'
    alt: 'Diagram: float16 compared with bfloat16'
    description: 'A two-column comparison of float16 and bfloat16 showing how each divides its 16 bits between exponent and mantissa, and the consequence for training.'
  - id: model-size-arithmetic
    file: assets/model-size-arithmetic.svg
    type: diagram
    title: 'Parameters times bytes is the whole calculation'
    alt: 'Diagram: the memory footprint of one model at four precisions'
    description: 'A four-stage sequence showing a 70-billion-parameter model at float32, bfloat16, int8 and 4-bit precision, with the memory footprint at each.'
  - id: why-two-states
    file: assets/why-two-states.svg
    type: diagram
    title: 'Why two states and not ten'
    alt: 'Diagram: two voltage states compared with ten'
    description: 'A two-column comparison of binary and decimal voltage encoding, showing why a wide margin between two states is more robust than ten narrow ones.'
  - id: hex-as-shorthand
    file: assets/hex-as-shorthand.svg
    type: diagram
    title: 'Hexadecimal exists for humans'
    alt: 'Diagram: how a byte becomes two hexadecimal digits'
    description: 'A four-stage sequence taking the byte 10110101, splitting it into two four-bit halves, converting each to a hex digit, and producing 0xb5.'
  - id: the-ariane-failure
    file: assets/the-ariane-failure.svg
    type: diagram
    title: '37 seconds'
    alt: 'Diagram: the sequence of the Ariane 5 flight 501 failure'
    description: 'A five-stage sequence of the Ariane 5 failure: reused software, a deliberately unprotected conversion, a faster trajectory, an unhandled overflow, and the loss of both units.'
  - id: kb-versus-kib
    file: assets/kb-versus-kib.svg
    type: diagram
    title: 'Why your 1 TB drive shows 931 GB'
    alt: 'Diagram: powers of 1000 compared with powers of 1024'
    description: 'A two-column comparison of decimal and binary size prefixes, showing how the gap compounds and why a drive appears smaller than the box claims.'
  - id: float-comparison-rule
    file: assets/float-comparison-rule.svg
    type: diagram
    title: 'How to compare two decimals'
    alt: 'Diagram: comparing floats with equality compared with a tolerance'
    description: 'A two-column comparison of using == on floats against using a tolerance, with the failure mode of each and the rule for choosing.'
