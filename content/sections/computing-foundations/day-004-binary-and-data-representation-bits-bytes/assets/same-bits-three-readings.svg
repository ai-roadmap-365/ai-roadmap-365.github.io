<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Bits carry no meaning. The type decides what they say.">
  <title>The same 32 bits, read three ways</title>
  <style>
    .same-bits-three-readings-bg   { fill: #f8fafc; }
    .same-bits-three-readings-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-bits-three-readings-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-bits-three-readings-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-bits-three-readings-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-bits-three-readings-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-bits-three-readings-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .same-bits-three-readings-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .same-bits-three-readings-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .same-bits-three-readings-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .same-bits-three-readings-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .same-bits-three-readings-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="same-bits-three-readings-bg" width="980" height="390"/>
  <text class="same-bits-three-readings-h1"  x="30" y="40">The same 32 bits, read three ways</text>
  <text class="same-bits-three-readings-sub" x="30" y="64">Bits carry no meaning. The type decides what they say.</text>
  <rect class="same-bits-three-readings-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="same-bits-three-readings-name" x="46" y="122">01000001 01000010 01000011 01000100</text>
  <text class="same-bits-three-readings-desc" x="46" y="142">One pattern in memory</text>
  <text class="same-bits-three-readings-desc" x="46" y="182">As an unsigned integer: 1,094,861,636</text>
  <text class="same-bits-three-readings-desc" x="46" y="216">As an IEEE-754 float: about 12.14</text>
  <text class="same-bits-three-readings-desc" x="46" y="250">As four ASCII bytes: "ABCD"</text>
  <text class="same-bits-three-readings-desc" x="46" y="284">As two 16-bit integers: 16706 and 17220</text>
  <rect class="same-bits-three-readings-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="same-bits-three-readings-name" x="526" y="122">What decides the reading</text>
  <text class="same-bits-three-readings-desc" x="526" y="142">Never the bits themselves</text>
  <text class="same-bits-three-readings-desc" x="526" y="182">The declared type in your program</text>
  <text class="same-bits-three-readings-desc" x="526" y="216">The format a file claims in its header</text>
  <text class="same-bits-three-readings-desc" x="526" y="250">The column type in a database</text>
  <text class="same-bits-three-readings-desc" x="526" y="284">The dtype of a tensor</text>
  <text class="same-bits-three-readings-desc" x="526" y="318">Get it wrong and nothing raises — you just get a different number</text>
  <text class="same-bits-three-readings-sub" x="30" y="372">This is why a dtype mismatch between training and serving degrades a model quietly instead of failing loudly.</text>
</svg>
