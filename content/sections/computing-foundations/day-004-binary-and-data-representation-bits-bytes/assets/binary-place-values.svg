<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" font-family="system-ui, sans-serif">
  <title>The eight place values of a byte, decoding the bit pattern 10110101 into the decimal number 181</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Reading a byte with place values</text>

  <!-- Place value labels -->
  <text x="90" y="86" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">128</text>
  <text x="170" y="86" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">64</text>
  <text x="250" y="86" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">32</text>
  <text x="330" y="86" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">16</text>
  <text x="410" y="86" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">8</text>
  <text x="490" y="86" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">4</text>
  <text x="570" y="86" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">2</text>
  <text x="650" y="86" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">1</text>
  <text x="710" y="86" text-anchor="start" font-size="14" fill="#1a202c">place value</text>

  <!-- Bit boxes: 1 0 1 1 0 1 0 1 (1-bits highlighted) -->
  <rect x="60" y="100" width="60" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="90" y="139" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a202c">1</text>
  <rect x="140" y="100" width="60" height="60" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="170" y="139" text-anchor="middle" font-size="26" fill="#1a202c">0</text>
  <rect x="220" y="100" width="60" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="139" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a202c">1</text>
  <rect x="300" y="100" width="60" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="139" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a202c">1</text>
  <rect x="380" y="100" width="60" height="60" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="410" y="139" text-anchor="middle" font-size="26" fill="#1a202c">0</text>
  <rect x="460" y="100" width="60" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="490" y="139" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a202c">1</text>
  <rect x="540" y="100" width="60" height="60" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="570" y="139" text-anchor="middle" font-size="26" fill="#1a202c">0</text>
  <rect x="620" y="100" width="60" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="650" y="139" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a202c">1</text>
  <text x="710" y="139" text-anchor="start" font-size="14" fill="#1a202c">bit</text>

  <!-- Contribution row: bit × place value -->
  <text x="90" y="196" text-anchor="middle" font-size="15" fill="#1a202c">128</text>
  <text x="170" y="196" text-anchor="middle" font-size="15" fill="#1a202c">0</text>
  <text x="250" y="196" text-anchor="middle" font-size="15" fill="#1a202c">32</text>
  <text x="330" y="196" text-anchor="middle" font-size="15" fill="#1a202c">16</text>
  <text x="410" y="196" text-anchor="middle" font-size="15" fill="#1a202c">0</text>
  <text x="490" y="196" text-anchor="middle" font-size="15" fill="#1a202c">4</text>
  <text x="570" y="196" text-anchor="middle" font-size="15" fill="#1a202c">0</text>
  <text x="650" y="196" text-anchor="middle" font-size="15" fill="#1a202c">1</text>
  <text x="710" y="196" text-anchor="start" font-size="14" fill="#1a202c">bit × value</text>

  <!-- Arrows from boxes to contributions -->
  <line x1="90" y1="164" x2="90" y2="180" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="250" y1="164" x2="250" y2="180" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="330" y1="164" x2="330" y2="180" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="490" y1="164" x2="490" y2="180" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="650" y1="164" x2="650" y2="180" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Sum box -->
  <rect x="60" y="230" width="620" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="370" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">128 + 32 + 16 + 4 + 1 = 181</text>
  <text x="370" y="278" text-anchor="middle" font-size="14" fill="#1a202c">add the place values under the 1-bits; the 0-bits contribute nothing</text>

  <text x="370" y="330" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">10110101 (binary) = 181 (decimal) = 0xB5 (hexadecimal)</text>
</svg>
