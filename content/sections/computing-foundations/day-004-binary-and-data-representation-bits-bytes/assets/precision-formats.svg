<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same size. Opposite trade. Only one is right for training.">
  <title>float16 and bfloat16 spend 16 bits differently</title>
  <style>
    .precision-formats-bg   { fill: #f8fafc; }
    .precision-formats-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-formats-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-formats-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-formats-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-formats-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-formats-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .precision-formats-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .precision-formats-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .precision-formats-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .precision-formats-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .precision-formats-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .precision-formats-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .precision-formats-row { opacity: 1; }
    .precision-formats-r0 { animation-delay: 0.00s; }
    .precision-formats-r1 { animation-delay: 0.45s; }
    .precision-formats-r2 { animation-delay: 0.90s; }
    .precision-formats-r3 { animation-delay: 1.35s; }
    .precision-formats-r4 { animation-delay: 1.80s; }
    .precision-formats-row { animation: precision-formats-reveal 7.3s ease-in-out infinite; }
    @keyframes precision-formats-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="precision-formats-bg" width="980" height="390"/>
  <text class="precision-formats-h1"  x="30" y="40">float16 and bfloat16 spend 16 bits differently</text>
  <text class="precision-formats-sub" x="30" y="64">Same size. Opposite trade. Only one is right for training.</text>
  <rect class="precision-formats-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="precision-formats-name" x="46" y="122">float16</text>
  <text class="precision-formats-desc" x="46" y="142">5 exponent, 10 mantissa</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r0" x="46" y="182">More precision per value</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r1" x="46" y="216">Largest value about 65,504</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r2" x="46" y="250">Gradients routinely exceed that</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r3" x="46" y="284">Overflow to infinity, and training dies</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r4" x="46" y="318">Needs loss scaling to survive</text>
  <rect class="precision-formats-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="precision-formats-name" x="526" y="122">bfloat16</text>
  <text class="precision-formats-desc" x="526" y="142">8 exponent, 7 mantissa</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r0" x="526" y="182">Same range as float32</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r1" x="526" y="216">Coarser values, and that is fine</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r2" x="526" y="250">Training tolerates imprecision</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r3" x="526" y="284">It does not tolerate overflow</text>
  <text class="precision-formats-desc precision-formats-row precision-formats-r4" x="526" y="318">Now the default on ML hardware</text>
  <text class="precision-formats-sub" x="30" y="372">Three exponent bits bought with three mantissa bits. A noisy statistical process can afford that; a ledger cannot.</text>
</svg>
