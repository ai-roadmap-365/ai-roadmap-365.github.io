<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" font-family="system-ui, sans-serif">
  <title>The same 32 bits, 0x40490FDB, read as the integer 1078530011 and as the IEEE 754 float 3.1415927 with its sign, exponent, and mantissa fields</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One bit pattern, two meanings</text>

  <!-- The raw 32 bits -->
  <rect x="40" y="60" width="680" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c" font-family="ui-monospace, monospace">01000000 01001001 00001111 11011011</text>
  <text x="380" y="126" text-anchor="middle" font-size="14" fill="#1a202c">32 bits in a register — hexadecimal 0x40490FDB. What number is it? The bits alone cannot say.</text>

  <!-- Arrows down to the two readings -->
  <line x1="200" y1="136" x2="200" y2="166" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="200,174 193,160 207,160" fill="#1d4ed8"/>
  <line x1="560" y1="136" x2="560" y2="166" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="560,174 553,160 567,160" fill="#1d4ed8"/>

  <!-- Left: int32 reading -->
  <rect x="40" y="180" width="320" height="112" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="200" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Read as int32</text>
  <text x="200" y="230" text-anchor="middle" font-size="14" fill="#1a202c">all 32 bits are place values</text>
  <text x="200" y="250" text-anchor="middle" font-size="14" fill="#1a202c">2³⁰ + 2²² + 2¹⁹ + 2¹⁶ + … + 2¹ + 2⁰</text>
  <text x="200" y="278" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">= 1,078,530,011</text>

  <!-- Right: float32 reading -->
  <rect x="400" y="180" width="320" height="112" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="560" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Read as float32 (IEEE 754)</text>
  <text x="560" y="230" text-anchor="middle" font-size="14" fill="#1a202c">bits split into three fields:</text>
  <text x="560" y="250" text-anchor="middle" font-size="14" fill="#1a202c">sign × 1.mantissa × 2^(exponent − 127)</text>
  <text x="560" y="278" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">= 3.1415927 (≈ π)</text>

  <!-- Field breakdown of the float reading -->
  <text x="380" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The float32 fields inside those 32 bits</text>

  <rect x="40" y="340" width="42" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="61" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c" font-family="ui-monospace, monospace">0</text>
  <text x="61" y="402" text-anchor="middle" font-size="14" fill="#1a202c">sign: +</text>

  <rect x="94" y="340" width="176" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="182" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c" font-family="ui-monospace, monospace">10000000</text>
  <text x="182" y="402" text-anchor="middle" font-size="14" fill="#1a202c">exponent: 128 → 2¹</text>

  <rect x="282" y="340" width="438" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="501" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c" font-family="ui-monospace, monospace">10010010000111111011011</text>
  <text x="501" y="402" text-anchor="middle" font-size="14" fill="#1a202c">mantissa: 1.5707963… × 2¹ = 3.1415927</text>
</svg>
