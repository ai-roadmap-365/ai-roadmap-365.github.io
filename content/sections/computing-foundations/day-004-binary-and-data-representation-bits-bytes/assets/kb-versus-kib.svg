<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Nothing is missing. Two conventions are being used at once.">
  <title>Why your 1 TB drive shows 931 GB</title>
  <style>
    .kb-versus-kib-bg   { fill: #f8fafc; }
    .kb-versus-kib-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kb-versus-kib-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kb-versus-kib-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kb-versus-kib-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kb-versus-kib-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kb-versus-kib-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kb-versus-kib-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kb-versus-kib-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kb-versus-kib-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kb-versus-kib-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kb-versus-kib-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kb-versus-kib-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kb-versus-kib-row { opacity: 1; }
    .kb-versus-kib-r0 { animation-delay: 0.00s; }
    .kb-versus-kib-r1 { animation-delay: 0.45s; }
    .kb-versus-kib-r2 { animation-delay: 0.90s; }
    .kb-versus-kib-r3 { animation-delay: 1.35s; }
    .kb-versus-kib-r4 { animation-delay: 1.80s; }
    .kb-versus-kib-row { animation: kb-versus-kib-reveal 7.3s ease-in-out infinite; }
    @keyframes kb-versus-kib-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kb-versus-kib-bg" width="980" height="390"/>
  <text class="kb-versus-kib-h1"  x="30" y="40">Why your 1 TB drive shows 931 GB</text>
  <text class="kb-versus-kib-sub" x="30" y="64">Nothing is missing. Two conventions are being used at once.</text>
  <rect class="kb-versus-kib-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kb-versus-kib-name" x="46" y="122">The manufacturer</text>
  <text class="kb-versus-kib-desc" x="46" y="142">Powers of 1,000</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r0" x="46" y="182">1 KB = 1,000 bytes</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r1" x="46" y="216">1 TB = 1,000,000,000,000 bytes</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r2" x="46" y="250">Matches SI prefixes</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r3" x="46" y="284">Printed on the box</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r4" x="46" y="318">Also what df -H reports</text>
  <rect class="kb-versus-kib-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kb-versus-kib-name" x="526" y="122">The operating system</text>
  <text class="kb-versus-kib-desc" x="526" y="142">Powers of 1,024</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r0" x="526" y="182">1 KiB = 1,024 bytes</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r1" x="526" y="216">1 TiB = 1,099,511,627,776 bytes</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r2" x="526" y="250">Matches how addressing works</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r3" x="526" y="284">10^12 divided by 1024^3 is about 931</text>
  <text class="kb-versus-kib-desc kb-versus-kib-row kb-versus-kib-r4" x="526" y="318">Also what df -h reports</text>
  <text class="kb-versus-kib-sub" x="30" y="372">The gap compounds: about 2% at kilobytes, about 7% at terabytes. Neither side is lying.</text>
</svg>
