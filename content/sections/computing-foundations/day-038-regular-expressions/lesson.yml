slug: regular-expressions
title: 'Regular Expressions'
section: computing-foundations
subsection: developer-workflow
week: 6
learning_promise: 'After this lesson you will be able to read and write regular expressions with confidence — describing the shape of text with literals, character classes, anchors, quantifiers, groups, and alternation — and use them from the command line to search, extract, and reformat real data.'
objectives:
  - 'Explain what a regular expression is: a compact language that describes a set of strings by their shape, not one literal string'
  - 'Read and write the core syntax — literals, character classes ([abc], \d \w \s), anchors (^ $ \b), quantifiers (* + ? {n,m}), groups, and alternation (|) — and combine them into working patterns'
  - 'Use capture groups and backreferences to extract fields and reformat text, and explain the difference between greedy and lazy matching'
  - 'Write practical patterns for emails, dates, IP addresses, and log lines, and state honestly what each pattern does and does not verify'
  - 'Distinguish the common regex flavors (POSIX basic vs extended vs PCRE) and know why a pattern that works in Python may need adjusting for grep or sed'
  - 'Choose the right tool for a text job — string method, regex, or a real parser — and recognize when regex is the wrong choice (nested formats like HTML or JSON)'
  - 'Search, extract, and reformat text from the command line with grep -E and sed -E, verifying results against known counts'
prerequisites:
  - 'A terminal with grep and sed (preinstalled on macOS and Linux)'
  - 'Comfort running basic shell commands and reading command output (Days 8–14)'
reading_time_minutes: 40
practical_time_minutes: 30
