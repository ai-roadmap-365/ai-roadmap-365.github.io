visuals:
  - id: regex-anatomy
    file: assets/regex-anatomy.svg
    type: diagram
    title: 'Anatomy of a regular expression'
    alt: 'Diagram: the anatomy of a regular expression, with each part of a date pattern labelled'
    description: 'An annotated specimen of the pattern ^(\d{4})-(\d{2})-(\d{2})$ for an ISO date, labelling the anchors (^ and $), the capture groups in parentheses, the character class \d, the quantifiers {4} and {2}, and the literal hyphens.'
  - id: regex-match
    file: assets/regex-match.svg
    type: flowchart
    title: 'How the engine scans and captures'
    alt: 'Diagram: a regex engine scanning a string left to right, finding a date match and handing back three captured groups'
    description: 'A regex engine dragging left to right along the text "id 2026-07-12", failing at the leading characters, matching the date, and returning the three captured groups 2026, 07, and 12 ready to extract or reassemble as \1-\2-\3.'
  - id: greedy-versus-lazy
    file: assets/greedy-versus-lazy.svg
    type: diagram
    title: 'Why <.*> matches far more than you meant'
    alt: 'Diagram: greedy quantifiers compared with lazy ones'
    description: 'A two-column comparison of greedy and lazy quantifiers applied to the same HTML input, showing what each matches and why.'
  - id: regex-pieces
    file: assets/regex-pieces.svg
    type: diagram
    title: 'Five kinds of piece, and that is all'
    alt: 'Diagram: the five kinds of component in a regular expression'
    description: 'A five-stage reference to the building blocks of regular expressions: literals, character classes, anchors, quantifiers and groups.'
  - id: greedy-trap
    file: assets/greedy-trap.svg
    type: diagram
    title: 'The trap that catches everyone once'
    alt: 'Diagram: how a greedy quantifier over-matches and how to fix it'
    description: 'A four-stage walkthrough of greedy matching over-consuming text, the backtracking that lands on the last delimiter, and the two available fixes.'
  - id: regex-or-parser
    file: assets/regex-or-parser.svg
    type: diagram
    title: 'Where regex stops working'
    alt: 'Diagram: text regex handles well compared with structures that need a parser'
    description: 'A two-column comparison of text regular expressions handle reliably against nested structures that require a parser, explaining why attempts at the latter fail on real data.'
  - id: catastrophic-backtracking
    file: assets/catastrophic-backtracking.svg
    type: diagram
    title: 'When a pattern takes exponential time'
    alt: 'Diagram: how nested quantifiers cause catastrophic backtracking'
    description: 'A four-stage explanation of catastrophic backtracking covering nested quantifiers, the number of ways to divide input between them, the exponential growth, and the mitigations.'
  - id: regex-flavours
    file: assets/regex-flavours.svg
    type: diagram
    title: 'Why a pattern moves badly between tools'
    alt: 'Diagram: differences between regular expression flavours'
    description: 'A two-column comparison of basic and extended regular expression support across common tools, covering shorthand classes, quantifier escaping and lookahead.'
  - id: readable-regex
    file: assets/readable-regex.svg
    type: diagram
    title: 'The regex you cannot read is the one you will rewrite'
    alt: 'Diagram: an unreadable regex compared with a documented one'
    description: 'A two-column comparison of a single dense regular expression against the same logic split, named and commented, covering maintainability.'
  - id: capture-to-extract
    file: assets/capture-to-extract.svg
    type: diagram
    title: 'Detecting and extracting are different jobs'
    alt: 'Diagram: how capture groups extract fields from a match'
    description: 'A four-stage sequence showing a pattern matching a whole date, capture groups recording each component, the groups being numbered, and the fields being reused in a replacement.'
  - id: model-output-parsing
    file: assets/model-output-parsing.svg
    type: diagram
    title: 'Parsing model output'
    alt: 'Diagram: extracting model output with regex compared with requesting JSON'
    description: 'A two-column comparison of using regular expressions to extract values from model prose against requesting structured JSON and validating it.'
  - id: lookahead
    file: assets/lookahead.svg
    type: diagram
    title: 'Matching without consuming'
    alt: 'Diagram: how regex lookahead asserts without consuming characters'
    description: 'A four-stage explanation of lookahead assertions covering positive and negative forms, the fact that they consume no characters, and a practical use.'
