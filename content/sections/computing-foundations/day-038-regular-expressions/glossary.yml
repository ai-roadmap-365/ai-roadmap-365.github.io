terms:
  - term: regular expression
    definition: 'A compact string of characters that describes a pattern for matching text — a whole set of strings that share a shape, rather than one literal string.'
  - term: metacharacter
    definition: 'A character with special meaning in a pattern rather than its literal value, such as . * + ? [ ] ( ) ^ $ | and \, which express classes, repetition, position, and structure.'
  - term: literal
    definition: 'A character in a pattern that matches itself, such as the a, b, and c in the pattern abc.'
  - term: character class
    definition: 'A set of characters written in square brackets, any one of which may match; [abc] matches a, b, or c, [a-z] any lowercase letter, and [^0-9] any non-digit.'
  - term: anchor
    definition: 'A pattern element that matches a position rather than a character: ^ marks the start of a line, $ the end, and \b a word boundary.'
  - term: quantifier
    definition: 'A symbol that says how many times the preceding item may repeat: * (zero or more), + (one or more), ? (zero or one), and {n,m} (between n and m times).'
  - term: group
    definition: 'A sub-pattern enclosed in parentheses, which lets a quantifier apply to the whole sub-pattern and, unless made non-capturing, remembers the text it matched.'
  - term: capture group
    definition: 'A parenthesised group whose matched text the engine stores, numbered left to right (\1, \2, ...), so it can be extracted, reformatted, or referenced later.'
  - term: alternation
    definition: 'The | operator meaning "this or that"; cat|dog matches either cat or dog, and gr(a|e)y matches gray or grey.'
  - term: backreference
    definition: 'A reference in a pattern to text an earlier group captured; \1 demands the same text the first group matched, so (\w+) \1 matches a doubled word.'
  - term: greedy
    definition: 'The default behavior of a quantifier, which matches as much text as possible while still letting the overall pattern succeed — the reason .* often matches too much.'
  - term: lazy
    definition: 'A quantifier made non-greedy by adding ?, which matches as little text as possible; .*? stops at the first point that lets the rest of the pattern succeed.'
  - term: PCRE
    definition: 'Perl Compatible Regular Expressions, a widely used C library from 1997 that spread Perl''s rich regex syntax to many tools and languages, shaping the modern PCRE-style flavor.'
  - term: regex engine
    definition: 'The program that takes a pattern and some text and reports whether, and where, the text matches — scanning left to right and backtracking when a choice fails.'
