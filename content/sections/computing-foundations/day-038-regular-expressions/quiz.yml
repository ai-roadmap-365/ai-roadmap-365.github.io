questions:
  - question: 'What does a regular expression describe?'
    options:
      - 'One specific, literal string of characters'
      - 'A set of strings that all share the same shape or pattern'
      - 'The physical layout of characters on a keyboard'
      - 'A compressed version of a text file'
    answer_index: 1
    explanation: 'A regex names the rules text must satisfy, so a single pattern like \d+ matches a whole family of strings (7, 42, 1000000) rather than one fixed value.'

  - question: 'Which quantifier means "one or more of the preceding item"?'
    options:
      - '*'
      - '?'
      - '+'
      - '{0,1}'
    answer_index: 2
    explanation: 'The + quantifier matches one or more repetitions. In contrast, * means zero or more, and ? means zero or one (optional).'

  - question: 'In the pattern ^cat$, what do the ^ and $ do?'
    options:
      - 'They match a literal caret and dollar sign in the text'
      - 'They capture the matched text into groups 1 and 2'
      - 'They are anchors: ^ matches the start of the line and $ the end, so the line must be exactly "cat"'
      - 'They make the match case-insensitive'
    answer_index: 2
    explanation: 'Anchors match positions, not characters. ^ is the start of the line and $ is the end, so ^cat$ matches only a line containing exactly cat and nothing else.'

  - question: 'Why does the pattern <.*> match the entire string <a><b> instead of just <a>?'
    options:
      - 'Because .* is greedy and matches as much as possible, running to the last >'
      - 'Because . cannot match the letters a or b'
      - 'Because <.*> is invalid and matches everything by default'
      - 'Because anchors force it to match the whole line'
    answer_index: 0
    explanation: 'Quantifiers are greedy by default, so .* consumes as much text as it can while the pattern still succeeds — here, everything up to the final >. Making it lazy with .*? or using [^>]* fixes it.'

  - question: 'What is the purpose of a capture group written with parentheses, such as (\d{4})?'
    options:
      - 'It makes the pattern run faster'
      - 'It matches text literally, ignoring any metacharacters inside'
      - 'It groups a sub-pattern and remembers the exact text it matched, so you can extract or reuse it'
      - 'It marks the end of the regular expression'
    answer_index: 2
    explanation: 'A capturing group both applies quantifiers to a sub-pattern and stores the matched text (as \1, \2, and so on) for extraction, reformatting, or backreferences.'

  - question: 'You need to reliably parse deeply nested HTML. Why is a regex the wrong tool?'
    options:
      - 'Regex is too slow to read HTML files'
      - 'Regex cannot match arbitrarily nested or recursive structure; a real HTML parser understands the hierarchy'
      - 'Regex only works on numbers, not tags'
      - 'HTML files are too large for any regex engine'
    answer_index: 1
    explanation: 'Classic regular expressions provably cannot match arbitrarily nested structure. HTML, JSON, and source code need a format-aware parser; using regex for them produces fragile patterns that break on edge cases.'

  - question: 'On the command line, why do many patterns use [0-9] instead of \d?'
    options:
      - '\d matches letters as well as digits'
      - '[0-9] is faster in every engine'
      - '\d is not supported by every grep and sed dialect, while [0-9] and [[:digit:]] are portable'
      - 'They mean completely different things'
    answer_index: 2
    explanation: 'The \d shorthand comes from the PCRE tradition (Python, JavaScript) and is not available in every command-line tool. [0-9] or the POSIX class [[:digit:]] works portably across grep and sed.'

  - question: 'What is catastrophic backtracking (ReDoS) a risk of?'
    options:
      - 'A pattern accidentally deleting the file it searches'
      - 'Certain patterns with nested quantifiers forcing an engine into near-exponential work, letting one input freeze the CPU'
      - 'Regex leaking memory to other programs'
      - 'A pattern matching the wrong file on disk'
    answer_index: 1
    explanation: 'Patterns like (a+)+$ against adversarial input can force a backtracking engine to try an exponential number of paths, so a single request can pin a CPU. Prefer specific classes, avoid nested quantifiers over overlapping classes, and use timeouts.'
