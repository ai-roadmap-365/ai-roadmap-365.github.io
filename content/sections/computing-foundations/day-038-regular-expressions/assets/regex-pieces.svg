<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every pattern you will ever read is built from these.">
  <title>Five kinds of piece, and that is all</title>
  <style>
    .regex-pieces-bg   { fill: #f8fafc; }
    .regex-pieces-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-pieces-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-pieces-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-pieces-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-pieces-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-pieces-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regex-pieces-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .regex-pieces-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .regex-pieces-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .regex-pieces-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .regex-pieces-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .regex-pieces-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .regex-pieces-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .regex-pieces-stage { opacity: 1; }

    .regex-pieces-s0 { animation-delay: 0.00s; }
    .regex-pieces-e0 { animation-delay: 0.00s; }
    .regex-pieces-s1 { animation-delay: 1.33s; }
    .regex-pieces-e1 { animation-delay: 1.33s; }
    .regex-pieces-s2 { animation-delay: 2.67s; }
    .regex-pieces-e2 { animation-delay: 2.67s; }
    .regex-pieces-s3 { animation-delay: 4.00s; }
    .regex-pieces-e3 { animation-delay: 4.00s; }
    .regex-pieces-s4 { animation-delay: 5.33s; }
    .regex-pieces-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .regex-pieces-conn  { animation: regex-pieces-trace 8s ease-in-out infinite; }
      .regex-pieces-stage { animation: regex-pieces-arrive 8s ease-in-out infinite; }
    }
    @keyframes regex-pieces-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes regex-pieces-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .regex-pieces-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .regex-pieces-stage { animation: regex-pieces-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes regex-pieces-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="regex-pieces-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="regex-pieces-bg" width="980" height="322"/>
  <text class="regex-pieces-h1"  x="30" y="40">Five kinds of piece, and that is all</text>
  <text class="regex-pieces-sub" x="30" y="64">Every pattern you will ever read is built from these.</text>
  <g class="regex-pieces-stage regex-pieces-s0">
    <rect class="regex-pieces-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="regex-pieces-step" x="44" y="142">01</text>
    <text class="regex-pieces-name" x="70" y="142">Literals</text>
    <text class="regex-pieces-desc" x="44" y="166">Characters matching</text>
    <text class="regex-pieces-desc" x="44" y="182">themselves. cat matches</text>
    <text class="regex-pieces-desc" x="44" y="198">c, a, t.</text>
    <text class="regex-pieces-edge" x="44" y="242">cat</text>
  </g>
  <line class="regex-pieces-line regex-pieces-conn regex-pieces-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#regex-pieces-tip)"/>
  <g class="regex-pieces-stage regex-pieces-s1">
    <rect class="regex-pieces-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="regex-pieces-step" x="233" y="142">02</text>
    <text class="regex-pieces-name" x="259" y="142">Character classes</text>
    <text class="regex-pieces-desc" x="233" y="166">Any one of a set. [a-z],</text>
    <text class="regex-pieces-desc" x="233" y="182">\\d, or a negated [^0-9].</text>
    <text class="regex-pieces-edge" x="233" y="242">[a-z]</text>
  </g>
  <line class="regex-pieces-line regex-pieces-conn regex-pieces-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#regex-pieces-tip)"/>
  <g class="regex-pieces-stage regex-pieces-s2">
    <rect class="regex-pieces-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="regex-pieces-step" x="422" y="142">03</text>
    <text class="regex-pieces-name" x="448" y="142">Anchors</text>
    <text class="regex-pieces-desc" x="422" y="166">Positions, not</text>
    <text class="regex-pieces-desc" x="422" y="182">characters. ^ start, $</text>
    <text class="regex-pieces-desc" x="422" y="198">end, \\b word boundary.</text>
    <text class="regex-pieces-edge" x="422" y="242">^ $ \\b</text>
  </g>
  <line class="regex-pieces-line regex-pieces-conn regex-pieces-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#regex-pieces-tip)"/>
  <g class="regex-pieces-stage regex-pieces-s3">
    <rect class="regex-pieces-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="regex-pieces-step" x="611" y="142">04</text>
    <text class="regex-pieces-name" x="637" y="142">Quantifiers</text>
    <text class="regex-pieces-desc" x="611" y="166">How many times. * + ? and</text>
    <text class="regex-pieces-desc" x="611" y="182">{n,m}.</text>
    <text class="regex-pieces-edge" x="611" y="242">* + ?</text>
  </g>
  <line class="regex-pieces-line regex-pieces-conn regex-pieces-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#regex-pieces-tip)"/>
  <g class="regex-pieces-stage regex-pieces-s4">
    <rect class="regex-pieces-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="regex-pieces-step" x="800" y="142">05</text>
    <text class="regex-pieces-name" x="826" y="142">Groups</text>
    <text class="regex-pieces-desc" x="800" y="166">Parentheses: apply a</text>
    <text class="regex-pieces-desc" x="800" y="182">quantifier to a</text>
    <text class="regex-pieces-desc" x="800" y="198">sub-pattern, and capture</text>
    <text class="regex-pieces-edge" x="800" y="242">( )</text>
  </g>
  <text class="regex-pieces-sub" x="30" y="304">Learning them in this order matters: each one adds exactly one new power, and a pattern that confuses you is almost always confusing at the level of which piece is which.</text>
</svg>
