<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Nesting is the line, and it is a hard one.">
  <title>Where regex stops working</title>
  <style>
    .regex-or-parser-bg   { fill: #f8fafc; }
    .regex-or-parser-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-or-parser-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-or-parser-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-or-parser-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-or-parser-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-or-parser-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regex-or-parser-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .regex-or-parser-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .regex-or-parser-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .regex-or-parser-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .regex-or-parser-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .regex-or-parser-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regex-or-parser-row { opacity: 1; }
    .regex-or-parser-r0 { animation-delay: 0.00s; }
    .regex-or-parser-r1 { animation-delay: 0.45s; }
    .regex-or-parser-r2 { animation-delay: 0.90s; }
    .regex-or-parser-r3 { animation-delay: 1.35s; }
    .regex-or-parser-r4 { animation-delay: 1.80s; }
    .regex-or-parser-row { animation: regex-or-parser-reveal 7.3s ease-in-out infinite; }
    @keyframes regex-or-parser-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="regex-or-parser-bg" width="980" height="390"/>
  <text class="regex-or-parser-h1"  x="30" y="40">Where regex stops working</text>
  <text class="regex-or-parser-sub" x="30" y="64">Nesting is the line, and it is a hard one.</text>
  <rect class="regex-or-parser-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="regex-or-parser-name" x="46" y="122">Regex handles this</text>
  <text class="regex-or-parser-desc" x="46" y="142">Flat, local structure.</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r0" x="46" y="182">Log lines and timestamps</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r1" x="46" y="216">Identifiers and reference codes</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r2" x="46" y="250">Fixed-format dates</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r3" x="46" y="284">One field of a simple CSV</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r4" x="46" y="318">Anything you can describe left to right</text>
  <rect class="regex-or-parser-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="regex-or-parser-name" x="526" y="122">This needs a parser</text>
  <text class="regex-or-parser-desc" x="526" y="142">Nesting and recursion.</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r0" x="526" y="182">HTML and XML</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r1" x="526" y="216">JSON — use jq, from Day 24</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r2" x="526" y="250">Source code</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r3" x="526" y="284">Quoted CSV with embedded commas</text>
  <text class="regex-or-parser-desc regex-or-parser-row regex-or-parser-r4" x="526" y="318">Anything where things contain themselves</text>
  <text class="regex-or-parser-sub" x="30" y="372">The failure mode is what makes this dangerous: a regex for nested structure works on your examples and fails on real data, so the problem arrives in production rather than in testing.</text>
</svg>
