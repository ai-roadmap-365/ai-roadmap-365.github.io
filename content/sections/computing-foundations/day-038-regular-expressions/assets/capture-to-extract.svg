<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Groups are what turn one into the other.">
  <title>Detecting and extracting are different jobs</title>
  <style>
    .capture-to-extract-bg   { fill: #f8fafc; }
    .capture-to-extract-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capture-to-extract-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capture-to-extract-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capture-to-extract-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capture-to-extract-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capture-to-extract-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .capture-to-extract-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .capture-to-extract-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .capture-to-extract-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .capture-to-extract-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .capture-to-extract-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .capture-to-extract-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .capture-to-extract-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .capture-to-extract-stage { opacity: 1; }

    .capture-to-extract-s0 { animation-delay: 0.00s; }
    .capture-to-extract-e0 { animation-delay: 0.00s; }
    .capture-to-extract-s1 { animation-delay: 1.28s; }
    .capture-to-extract-e1 { animation-delay: 1.28s; }
    .capture-to-extract-s2 { animation-delay: 2.56s; }
    .capture-to-extract-e2 { animation-delay: 2.56s; }
    .capture-to-extract-s3 { animation-delay: 3.84s; }
    .capture-to-extract-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .capture-to-extract-conn  { animation: capture-to-extract-trace 6.4s ease-in-out infinite; }
      .capture-to-extract-stage { animation: capture-to-extract-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes capture-to-extract-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes capture-to-extract-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .capture-to-extract-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .capture-to-extract-stage { animation: capture-to-extract-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes capture-to-extract-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="capture-to-extract-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="capture-to-extract-bg" width="980" height="322"/>
  <text class="capture-to-extract-h1"  x="30" y="40">Detecting and extracting are different jobs</text>
  <text class="capture-to-extract-sub" x="30" y="64">Groups are what turn one into the other.</text>
  <g class="capture-to-extract-stage capture-to-extract-s0">
    <rect class="capture-to-extract-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="capture-to-extract-step" x="44" y="142">01</text>
    <text class="capture-to-extract-name" x="70" y="142">Match the whole thing</text>
    <text class="capture-to-extract-desc" x="44" y="166">The pattern finds a date. You</text>
    <text class="capture-to-extract-desc" x="44" y="182">know it is there, and nothing</text>
    <text class="capture-to-extract-desc" x="44" y="198">more.</text>
    <text class="capture-to-extract-edge" x="44" y="242">detect</text>
  </g>
  <line class="capture-to-extract-line capture-to-extract-conn capture-to-extract-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#capture-to-extract-tip)"/>
  <g class="capture-to-extract-stage capture-to-extract-s1">
    <rect class="capture-to-extract-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="capture-to-extract-step" x="280" y="142">02</text>
    <text class="capture-to-extract-name" x="306" y="142">Add parentheses</text>
    <text class="capture-to-extract-desc" x="280" y="166">(\\d{4})-(\\d{2})-(\\d{2}) — the</text>
    <text class="capture-to-extract-desc" x="280" y="182">same match, now in three parts.</text>
  </g>
  <line class="capture-to-extract-line capture-to-extract-conn capture-to-extract-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#capture-to-extract-tip)"/>
  <g class="capture-to-extract-stage capture-to-extract-s2">
    <rect class="capture-to-extract-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="capture-to-extract-step" x="516" y="142">03</text>
    <text class="capture-to-extract-name" x="542" y="142">Numbered left to right</text>
    <text class="capture-to-extract-desc" x="516" y="166">By opening parenthesis: \\1 is</text>
    <text class="capture-to-extract-desc" x="516" y="182">the year, \\2 the month, \\3 the</text>
    <text class="capture-to-extract-desc" x="516" y="198">day.</text>
    <text class="capture-to-extract-edge" x="516" y="242">\\1 \\2 \\3</text>
  </g>
  <line class="capture-to-extract-line capture-to-extract-conn capture-to-extract-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#capture-to-extract-tip)"/>
  <g class="capture-to-extract-stage capture-to-extract-s3">
    <rect class="capture-to-extract-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="capture-to-extract-step" x="752" y="142">04</text>
    <text class="capture-to-extract-name" x="778" y="142">Now reuse them</text>
    <text class="capture-to-extract-desc" x="752" y="166">Reorder, reformat, or pull each</text>
    <text class="capture-to-extract-desc" x="752" y="182">field into a column.</text>
    <text class="capture-to-extract-edge" x="752" y="242">extract</text>
  </g>
  <text class="capture-to-extract-sub" x="30" y="304">Named groups are worth the extra characters on anything you will read again: (?P&lt;year&gt;\\d{4}) says what it is, where \\1 makes you count parentheses.</text>
</svg>
