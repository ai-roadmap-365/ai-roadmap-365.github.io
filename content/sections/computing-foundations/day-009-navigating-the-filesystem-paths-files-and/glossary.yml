terms:
  - term: path
    definition: 'A sequence of directory names separated by slashes that spells out the route to a file or directory in the filesystem tree.'
  - term: absolute path
    definition: 'A path that starts at the root directory (/) and gives the full route from the top, so it means the same thing no matter what the current directory is.'
  - term: relative path
    definition: 'A path that starts from the current working directory rather than from the root, so its meaning depends on where you currently are.'
  - term: working directory
    definition: 'The directory a shell is currently "in," from which relative paths are interpreted; printed by the pwd command.'
  - term: home directory
    definition: 'The personal directory where a user''s own files live and where a terminal usually starts; abbreviated by the shell as the tilde (~).'
  - term: root directory
    definition: 'The single directory at the top of the filesystem tree, written as a lone forward slash (/), under which everything else lives.'
  - term: directory
    definition: 'A named list that maps names to files and to other directories, forming the branches of the filesystem tree (called a "folder" in graphical tools).'
  - term: hidden file
    definition: 'A file or directory whose name begins with a dot, which plain ls and most file browsers skip by default; revealed with ls -a.'
  - term: permission
    definition: 'A rule recording whether a class of user (owner, group, or other) may read, write, or execute a given file or directory.'
  - term: chmod
    definition: 'The command that changes a file or directory''s permissions, using either symbolic form (such as +x) or octal form (such as 754).'
  - term: octal notation
    definition: 'A three-digit way of writing permissions in which each digit is the sum, within one class, of read (4), write (2), and execute (1) — for example, 754.'
  - term: symbolic link
    definition: 'A small special file that points at another path, so following it reaches the target; proof that a path is a name for a file rather than the file itself.'
  - term: execute permission
    definition: 'The permission (x) that, for a file, allows it to be run as a program, and for a directory, allows entering it and reaching items through it.'
