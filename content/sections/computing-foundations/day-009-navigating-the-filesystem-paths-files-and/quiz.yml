questions:
  - question: 'What does the single forward slash / mean at the very start of a path?'
    options:
      - 'The current working directory'
      - 'A hidden file'
      - 'The user''s home directory'
      - 'The root of the filesystem tree'
    answer_index: 3
    explanation: 'A leading / is the root directory, the one point from which every file and directory on a macOS or Linux system descends. In the middle of a path, / instead separates one name from the next.'

  - question: 'Which statement about absolute and relative paths is correct?'
    options:
      - 'An absolute path starts at /; a relative one starts where you are'
      - 'Absolute and relative paths can never point at the same file'
      - 'An absolute path starts from your current directory; a relative path starts from /'
      - 'Relative paths only work for directories, never for files'
    answer_index: 0
    explanation: 'An absolute path begins at the root / and is valid no matter where you are standing, while a relative path begins from your current working directory and depends on it. Both can name the same file.'

  - question: 'In a path, what does .. mean?'
    options:
      - 'The current directory'
      - 'The parent directory, one up'
      - 'Your home directory'
      - 'A hidden file'
    answer_index: 1
    explanation: 'A single dot (.) means the current directory, while two dots (..) mean its parent — the directory one level up. The tilde (~) means your home directory.'

  - question: 'Which command shows a long listing that also includes hidden files whose names start with a dot?'
    options:
      - 'ls'
      - 'ls -h'
      - 'ls -la'
      - 'pwd -a'
    answer_index: 2
    explanation: 'The -l flag gives the long listing (permissions, owner, size, date) and the -a flag includes hidden dot-files; combined as ls -la they show a detailed listing of everything in the directory.'

  - question: 'The permission string -rwxr-xr-- corresponds to which octal number?'
    options:
      - '644'
      - '755'
      - '777'
      - '754'
    answer_index: 3
    explanation: 'Within each group of three, read is 4, write is 2, execute is 1. So rwx = 4+2+1 = 7, r-x = 4+0+1 = 5, and r-- = 4+0+0 = 4, giving 754.'

  - question: 'For a plain file, what does the execute (x) permission allow?'
    options:
      - 'Running the file as a program'
      - 'Changing or deleting the file''s contents'
      - 'Viewing the file''s contents'
      - 'Renaming the file'
    answer_index: 0
    explanation: 'For a file, read (r) allows viewing its contents, write (w) allows changing them, and execute (x) allows running it as a program — which is why making a script runnable means adding the execute bit.'

  - question: 'Why is the command rm -rf considered especially dangerous?'
    options:
      - 'It only works if you are an administrator'
      - 'It deletes everything under a path, with no undo'
      - 'It permanently changes the file''s owner and group'
      - 'It sends files to the Trash, which then fills up'
    answer_index: 1
    explanation: 'The -r flag makes rm recurse into directories and -f suppresses confirmation prompts, so rm -rf erases an entire tree at once with no Trash and no undo — a mistyped or wrong path can destroy far more than intended.'

  - question: 'What is the difference between chmod and chown?'
    options:
      - 'chmod works only on directories; chown works only on files'
      - 'chmod deletes a file; chown copies it'
      - 'chmod sets what is allowed; chown sets who owns it'
      - 'They are two names for the same command'
    answer_index: 2
    explanation: 'chmod ("change mode") sets the read/write/execute permissions on a file, while chown ("change owner") reassigns which user and group own it. Changing owners is a system-level act that usually needs administrator rights; changing permissions on your own files does not.'
