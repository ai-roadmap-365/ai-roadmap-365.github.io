sources:
  - title: 'The Linux Command Line'
    url: 'https://linuxcommand.org/'
    publisher: 'William Shotts'
    accessed: '2026-07-12'
    note: 'A thorough, beginner-friendly guide to the shell, navigation, files, and permissions.'
  - title: 'The Missing Semester of Your CS Education — The Shell'
    url: 'https://missing.csail.mit.edu/2020/course-shell/'
    publisher: 'MIT'
    accessed: '2026-07-12'
    note: 'Practical lecture and exercises on the shell and working with files.'
  - title: 'Filesystem Hierarchy Standard'
    url: 'https://en.wikipedia.org/wiki/Filesystem_Hierarchy_Standard'
    publisher: 'Wikipedia'
    accessed: '2026-07-12'
    note: 'The conventional meaning of top-level directories such as /bin, /etc, /home, and /usr.'
  - title: 'File-system permissions'
    url: 'https://en.wikipedia.org/wiki/File-system_permissions'
    publisher: 'Wikipedia'
    accessed: '2026-07-12'
    note: 'The read/write/execute model for user, group, and other, and octal notation.'
  - title: 'GNU Coreutils Manual'
    url: 'https://www.gnu.org/software/coreutils/manual/coreutils.html'
    publisher: 'GNU'
    accessed: '2026-07-12'
    note: 'The authoritative reference for ls, cp, mv, rm, mkdir, chmod, and chown.'
