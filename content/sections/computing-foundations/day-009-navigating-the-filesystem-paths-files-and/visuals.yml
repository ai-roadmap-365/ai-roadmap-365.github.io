visuals:
  - id: filesystem-tree
    file: assets/filesystem-tree.svg
    type: diagram
    title: 'The filesystem tree'
    alt: 'Diagram: a filesystem tree rooted at slash, showing an absolute and a relative path to the same file'
    description: 'An architecture diagram of a directory tree from the root (/) down through home, the user alice, projects, and data to the file notes.txt, annotated to show that ~ equals /home/alice, that a dot-prefixed name is hidden, and that the same file has an absolute path (/home/alice/projects/data/notes.txt) and a relative path (data/notes.txt from projects).'
  - id: permissions-bits
    file: assets/permissions-bits.svg
    type: diagram
    title: 'Reading a permission string'
    alt: 'Diagram: decoding the permission string dash r w x r dash x r dash dash into user, group, and other, and into octal 754'
    description: 'A flow diagram that splits the ls -l permission string -rwxr-xr-- into its type character and three triads (user rwx, group r-x, other r--), converts each triad to binary and to a digit using read 4, write 2, execute 1, and combines them into the octal number 754 set by chmod 754.'
  - id: absolute-versus-relative
    file: assets/absolute-versus-relative.svg
    type: diagram
    title: 'Two kinds of path, and why jobs fail on one'
    alt: 'Diagram: absolute paths compared with relative paths'
    description: 'A two-column comparison of absolute and relative paths, showing what each means, when each is right, and why a scheduler that starts a job from a different directory resolves them differently.'
  - id: path-symbols
    file: assets/path-symbols.svg
    type: diagram
    title: 'Four symbols do most of the navigating'
    alt: 'Diagram: the four special path symbols and what each means'
    description: 'A four-stage reference for the path symbols: slash as root and separator, dot as the current directory, double dot as the parent, and tilde as the home directory.'
  - id: filesystem-verbs
    file: assets/filesystem-verbs.svg
    type: diagram
    title: 'Reshaping the tree'
    alt: 'Diagram: the commands that create, copy, move and delete files'
    description: 'A five-stage sequence covering mkdir, touch, cp, mv and rm, noting the recursive flag each needs for directories and the irreversibility of removal.'
  - id: rm-safety
    file: assets/rm-safety.svg
    type: diagram
    title: 'rm -rf is the most dangerous command a beginner runs'
    alt: 'Diagram: unsafe and safe habits around deletion'
    description: 'A two-column comparison of careless and careful deletion habits, covering checking the target first, variables in scripts, stray spaces in paths, and preferring a temporary trash directory.'
  - id: file-versus-directory-bits
    file: assets/file-versus-directory-bits.svg
    type: diagram
    title: 'The same three letters mean different things'
    alt: 'Diagram: what read, write and execute mean on a file compared with a directory'
    description: 'A two-column comparison of the read, write and execute permissions as they apply to ordinary files and as they apply to directories, where execute means the right to enter rather than to run.'
  - id: hidden-files
    file: assets/hidden-files.svg
    type: diagram
    title: 'Why half your home directory is invisible'
    alt: 'Diagram: how dot-prefixed files are hidden from ordinary listings'
    description: 'A four-stage explanation of hidden files: the leading dot convention, what ordinary ls shows, what ls -a reveals, and why configuration is kept out of the way.'
  - id: one-tree-mounting
    file: assets/one-tree-mounting.svg
    type: diagram
    title: 'Why Unix has no drive letters'
    alt: 'Diagram: separate drive namespaces compared with one mounted tree'
    description: 'A two-column comparison of systems that give each disk its own namespace against Unix, which mounts every filesystem into a single tree, covering how paths change when storage changes.'
  - id: octal-arithmetic
    file: assets/octal-arithmetic.svg
    type: diagram
    title: 'Reading 754 without looking it up'
    alt: 'Diagram: converting permission letters into octal digits'
    description: 'A four-stage walkthrough converting the permission string rwxr-xr-- into the octal number 754 by valuing read as four, write as two and execute as one within each group of three.'
  - id: finding-what-fills-a-disk
    file: assets/finding-what-fills-a-disk.svg
    type: diagram
    title: 'Finding what filled the disk'
    alt: 'Diagram: how to locate what is consuming disk space'
    description: 'A four-stage procedure for diagnosing a full disk, from checking overall usage to narrowing down by directory and identifying the largest consumers.'
