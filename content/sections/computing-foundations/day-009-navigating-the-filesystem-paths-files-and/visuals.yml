visuals:
  - id: filesystem-tree
    file: assets/filesystem-tree.svg
    type: diagram
    title: 'The filesystem tree'
    alt: 'Diagram: a filesystem tree rooted at slash, showing an absolute and a relative path to the same file'
    description: 'An architecture diagram of a directory tree from the root (/) down through home, the user alice, projects, and data to the file notes.txt, annotated to show that ~ equals /home/alice, that a dot-prefixed name is hidden, and that the same file has an absolute path (/home/alice/projects/data/notes.txt) and a relative path (data/notes.txt from projects).'
  - id: permissions-bits
    file: assets/permissions-bits.svg
    type: diagram
    title: 'Reading a permission string'
    alt: 'Diagram: decoding the permission string dash r w x r dash x r dash dash into user, group, and other, and into octal 754'
    description: 'A flow diagram that splits the ls -l permission string -rwxr-xr-- into its type character and three triads (user rwx, group r-x, other r--), converts each triad to binary and to a digit using read 4, write 2, execute 1, and combines them into the octal number 754 set by chmod 754.'
