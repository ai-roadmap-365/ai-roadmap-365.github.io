<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three digits, one per class, each a sum.">
  <title>Reading 754 without looking it up</title>
  <style>
    .octal-arithmetic-bg   { fill: #f8fafc; }
    .octal-arithmetic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .octal-arithmetic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .octal-arithmetic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .octal-arithmetic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .octal-arithmetic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .octal-arithmetic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .octal-arithmetic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .octal-arithmetic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .octal-arithmetic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .octal-arithmetic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .octal-arithmetic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .octal-arithmetic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .octal-arithmetic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .octal-arithmetic-stage { opacity: 1; }

    .octal-arithmetic-s0 { animation-delay: 0.00s; }
    .octal-arithmetic-e0 { animation-delay: 0.00s; }
    .octal-arithmetic-s1 { animation-delay: 1.28s; }
    .octal-arithmetic-e1 { animation-delay: 1.28s; }
    .octal-arithmetic-s2 { animation-delay: 2.56s; }
    .octal-arithmetic-e2 { animation-delay: 2.56s; }
    .octal-arithmetic-s3 { animation-delay: 3.84s; }
    .octal-arithmetic-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .octal-arithmetic-conn  { animation: octal-arithmetic-trace 6.4s ease-in-out infinite; }
      .octal-arithmetic-stage { animation: octal-arithmetic-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes octal-arithmetic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes octal-arithmetic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .octal-arithmetic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .octal-arithmetic-stage { animation: octal-arithmetic-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes octal-arithmetic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="octal-arithmetic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="octal-arithmetic-bg" width="980" height="322"/>
  <text class="octal-arithmetic-h1"  x="30" y="40">Reading 754 without looking it up</text>
  <text class="octal-arithmetic-sub" x="30" y="64">Three digits, one per class, each a sum.</text>
  <g class="octal-arithmetic-stage octal-arithmetic-s0">
    <rect class="octal-arithmetic-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="octal-arithmetic-step" x="44" y="142">01</text>
    <text class="octal-arithmetic-name" x="70" y="142">Value each letter</text>
    <text class="octal-arithmetic-desc" x="44" y="166">read = 4, write = 2, execute =</text>
    <text class="octal-arithmetic-desc" x="44" y="182">1. A dash is 0.</text>
    <text class="octal-arithmetic-edge" x="44" y="242">4 2 1</text>
  </g>
  <line class="octal-arithmetic-line octal-arithmetic-conn octal-arithmetic-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#octal-arithmetic-tip)"/>
  <g class="octal-arithmetic-stage octal-arithmetic-s1">
    <rect class="octal-arithmetic-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="octal-arithmetic-step" x="280" y="142">02</text>
    <text class="octal-arithmetic-name" x="306" y="142">User: rwx</text>
    <text class="octal-arithmetic-desc" x="280" y="166">4 + 2 + 1. Full control for the</text>
    <text class="octal-arithmetic-desc" x="280" y="182">owner.</text>
    <text class="octal-arithmetic-edge" x="280" y="242">7</text>
  </g>
  <line class="octal-arithmetic-line octal-arithmetic-conn octal-arithmetic-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#octal-arithmetic-tip)"/>
  <g class="octal-arithmetic-stage octal-arithmetic-s2">
    <rect class="octal-arithmetic-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="octal-arithmetic-step" x="516" y="142">03</text>
    <text class="octal-arithmetic-name" x="542" y="142">Group: r-x</text>
    <text class="octal-arithmetic-desc" x="516" y="166">4 + 0 + 1. Read and run, but not</text>
    <text class="octal-arithmetic-desc" x="516" y="182">change.</text>
    <text class="octal-arithmetic-edge" x="516" y="242">5</text>
  </g>
  <line class="octal-arithmetic-line octal-arithmetic-conn octal-arithmetic-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#octal-arithmetic-tip)"/>
  <g class="octal-arithmetic-stage octal-arithmetic-s3">
    <rect class="octal-arithmetic-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="octal-arithmetic-step" x="752" y="142">04</text>
    <text class="octal-arithmetic-name" x="778" y="142">Other: r--</text>
    <text class="octal-arithmetic-desc" x="752" y="166">4 + 0 + 0. Read only.</text>
    <text class="octal-arithmetic-edge" x="752" y="242">4</text>
  </g>
  <text class="octal-arithmetic-sub" x="30" y="304">So 644 is rw-r--r-- and 755 is rwxr-xr-x — the two you will type most. 777 is everything for everyone, and is almost never the right answer.</text>
</svg>
