<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A relative path is a claim about where you are standing.">
  <title>Two kinds of path, and why jobs fail on one</title>
  <style>
    .absolute-versus-relative-bg   { fill: #f8fafc; }
    .absolute-versus-relative-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-versus-relative-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-versus-relative-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-versus-relative-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-versus-relative-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-versus-relative-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .absolute-versus-relative-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .absolute-versus-relative-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .absolute-versus-relative-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .absolute-versus-relative-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .absolute-versus-relative-line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect class="absolute-versus-relative-bg" width="980" height="390"/>
  <text class="absolute-versus-relative-h1"  x="30" y="40">Two kinds of path, and why jobs fail on one</text>
  <text class="absolute-versus-relative-sub" x="30" y="64">A relative path is a claim about where you are standing.</text>
  <rect class="absolute-versus-relative-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="absolute-versus-relative-name" x="46" y="122">Absolute — starts at /</text>
  <text class="absolute-versus-relative-desc" x="46" y="142">Means the same thing from anywhere</text>
  <text class="absolute-versus-relative-desc" x="46" y="182">/home/ada/data/train.csv</text>
  <text class="absolute-versus-relative-desc" x="46" y="216">Independent of the current directory</text>
  <text class="absolute-versus-relative-desc" x="46" y="250">Right for scripts, cron jobs and containers</text>
  <text class="absolute-versus-relative-desc" x="46" y="284">Longer to type, and machine-specific</text>
  <text class="absolute-versus-relative-desc" x="46" y="318">A scheduler resolves it the same way you do</text>
  <rect class="absolute-versus-relative-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="absolute-versus-relative-name" x="526" y="122">Relative — starts where you are</text>
  <text class="absolute-versus-relative-desc" x="526" y="142">Means something different from elsewhere</text>
  <text class="absolute-versus-relative-desc" x="526" y="182">data/train.csv, or ../notes.txt</text>
  <text class="absolute-versus-relative-desc" x="526" y="216">Depends entirely on the working directory</text>
  <text class="absolute-versus-relative-desc" x="526" y="250">Right for interactive work and portable repos</text>
  <text class="absolute-versus-relative-desc" x="526" y="284">Shorter, and the usual cause of 'file not found'</text>
  <text class="absolute-versus-relative-desc" x="526" y="318">A job launched from / resolves it to nothing</text>
  <text class="absolute-versus-relative-sub" x="30" y="372">Most 'it works on my laptop' failures in a training pipeline are this distinction, arriving late.</text>
</svg>
