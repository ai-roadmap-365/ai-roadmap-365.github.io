id: D006
day: 6
slug: operating-systems-what-they-do-and
title: 'Operating Systems: What They Do and Why'
section: computing-foundations
subsection: how-computers-work
week: 1
learning_promise: 'After this lesson you will be able to explain what an operating system does — kernel vs user space, system calls, processes, virtual memory, filesystems, drivers, and permissions — and use that model to explain why AI and server work runs on Linux and to interrogate your own OS from the terminal.'
objectives:
  - 'Explain why bare hardware is unusable without an operating system, using the manager/illusionist/guard framing'
  - 'Distinguish kernel space from user space and describe how the CPU''s privilege modes enforce the boundary in hardware'
  - 'Trace a system call end to end — what happens when a program opens a file, including the permission check and the file descriptor'
  - 'Name the operating system''s five core jobs (processes, memory, filesystems, drivers, security) and match each to a real-world symptom or tool'
  - 'Recount the honest lineage of today''s OS families: Unix 1969 at Bell Labs, BSD and System V, Linux 1991, macOS via NeXT/Darwin, and Windows NT — and place WSL as the bridge'
  - 'Explain why server and GPU/AI infrastructure runs overwhelmingly on Linux, and what containers add as OS-level isolation'
  - 'Interrogate your own OS from the terminal: kernel version, uptime, user, shell, mounted filesystems, and the top memory-consuming processes'
prerequisites:
  - 'Days 1–5 of this course (the layered stack, the CPU, the memory hierarchy, binary, and data representation)'
  - 'A terminal on macOS, Linux, or Windows with WSL'
reading_time_minutes: 40
practical_time_minutes: 30
