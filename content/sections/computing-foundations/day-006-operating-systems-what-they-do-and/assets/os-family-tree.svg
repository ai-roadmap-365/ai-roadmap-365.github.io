<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" font-family="system-ui, sans-serif">
  <title>A simplified family tree of operating systems: the Unix lineage from 1969 leading to BSD, macOS, and Linux, and the separate Windows NT lineage, bridged today by WSL</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The operating-system family tree (simplified)</text>

  <!-- Timeline axis -->
  <line x1="60" y1="510" x2="780" y2="510" stroke="#1a202c" stroke-width="2"/>
  <text x="80" y="534" text-anchor="middle" font-size="14" fill="#1a202c">1969</text>
  <text x="240" y="534" text-anchor="middle" font-size="14" fill="#1a202c">1980s</text>
  <text x="420" y="534" text-anchor="middle" font-size="14" fill="#1a202c">1990s</text>
  <text x="590" y="534" text-anchor="middle" font-size="14" fill="#1a202c">2000s</text>
  <text x="750" y="534" text-anchor="middle" font-size="14" fill="#1a202c">today</text>

  <!-- Unix root -->
  <rect x="40" y="200" width="140" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" rx="6"/>
  <text x="110" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Unix — 1969</text>
  <text x="110" y="246" text-anchor="middle" font-size="14" fill="#1a202c">Bell Labs</text>

  <!-- BSD branch -->
  <rect x="230" y="100" width="150" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="305" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">BSD — 1978</text>
  <text x="305" y="144" text-anchor="middle" font-size="14" fill="#1a202c">UC Berkeley</text>
  <line x1="180" y1="216" x2="228" y2="140" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="231,135 219,140 228,149" fill="#1d4ed8"/>

  <!-- System V branch -->
  <rect x="230" y="220" width="150" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="305" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">System V — 1983</text>
  <text x="305" y="264" text-anchor="middle" font-size="14" fill="#1a202c">AT&amp;T (commercial)</text>
  <line x1="180" y1="240" x2="222" y2="248" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="230,250 218,242 216,254" fill="#1d4ed8"/>

  <!-- NeXTSTEP → macOS -->
  <rect x="430" y="80" width="160" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="510" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">NeXTSTEP — 1989</text>
  <text x="510" y="124" text-anchor="middle" font-size="14" fill="#1a202c">Mach + BSD core</text>
  <line x1="380" y1="122" x2="422" y2="114" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="430,112 418,108 420,120" fill="#1d4ed8"/>

  <rect x="640" y="80" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" rx="6"/>
  <text x="715" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">macOS — 2001</text>
  <text x="715" y="124" text-anchor="middle" font-size="14" fill="#1a202c">Darwin/XNU kernel</text>
  <line x1="590" y1="110" x2="632" y2="110" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="640,110 628,104 628,116" fill="#1d4ed8"/>

  <!-- Linux (inspired, not derived) -->
  <rect x="430" y="200" width="160" height="64" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="510" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Linux — 1991</text>
  <text x="510" y="246" text-anchor="middle" font-size="14" fill="#1a202c">Torvalds, from scratch</text>
  <line x1="380" y1="250" x2="422" y2="236" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="430,233 418,231 421,243" fill="#1d4ed8"/>
  <text x="398" y="270" text-anchor="middle" font-size="14" fill="#1d4ed8">ideas, not code</text>

  <rect x="640" y="190" width="150" height="84" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" rx="6"/>
  <text x="715" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Linux today</text>
  <text x="715" y="234" text-anchor="middle" font-size="14" fill="#1a202c">servers, clouds,</text>
  <text x="715" y="252" text-anchor="middle" font-size="14" fill="#1a202c">Android, GPU</text>
  <text x="715" y="268" text-anchor="middle" font-size="14" fill="#1a202c">clusters</text>
  <line x1="590" y1="232" x2="632" y2="232" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="640,232 628,226 628,238" fill="#1d4ed8"/>

  <!-- Windows lineage -->
  <rect x="230" y="380" width="150" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="305" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">MS-DOS — 1981</text>
  <text x="305" y="424" text-anchor="middle" font-size="14" fill="#1a202c">then Windows 9x</text>

  <rect x="430" y="380" width="160" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="510" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Windows NT — 1993</text>
  <text x="510" y="424" text-anchor="middle" font-size="14" fill="#1a202c">new kernel, not Unix</text>
  <line x1="380" y1="410" x2="422" y2="410" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="430,410 418,404 418,416" fill="#1d4ed8"/>

  <rect x="640" y="380" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" rx="6"/>
  <text x="715" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Windows 10/11</text>
  <text x="715" y="424" text-anchor="middle" font-size="14" fill="#1a202c">NT kernel line</text>
  <line x1="590" y1="410" x2="632" y2="410" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="640,410 628,404 628,416" fill="#1d4ed8"/>

  <!-- WSL bridge -->
  <line x1="715" y1="380" x2="715" y2="282" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="715,274 709,286 721,286" fill="#1d4ed8"/>
  <text x="758" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">WSL</text>
  <text x="757" y="348" text-anchor="middle" font-size="14" fill="#1d4ed8">bridge</text>

  <text x="410" y="490" text-anchor="middle" font-size="14" fill="#1a202c">Solid arrows: direct descent. Dashed arrows: influence or a bridge, not shared code.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.33s}.dx-f2{animation-delay:0.65s}.dx-f3{animation-delay:0.98s}.dx-f4{animation-delay:1.31s}.dx-f5{animation-delay:1.64s}.dx-f6{animation-delay:1.96s}.dx-f7{animation-delay:2.29s}.dx-f8{animation-delay:2.62s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 380 122 L 422 114" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 590 110 L 632 110" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 180 216 L 228 140" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 180 240 L 222 248" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 380 250 L 422 236" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 590 232 L 632 232" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f6" d="M 380 410 L 422 410" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f7" d="M 590 410 L 632 410" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f8" d="M 715 380 L 715 282" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
