<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From power-on to your shell prompt.">
  <title>How the OS gets there in the first place</title>
  <style>
    .boot-sequence-bg   { fill: #f8fafc; }
    .boot-sequence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boot-sequence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boot-sequence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boot-sequence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boot-sequence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boot-sequence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boot-sequence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boot-sequence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boot-sequence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boot-sequence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boot-sequence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boot-sequence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .boot-sequence-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .boot-sequence-stage { opacity: 1; }

    .boot-sequence-s0 { animation-delay: 0.00s; }
    .boot-sequence-e0 { animation-delay: 0.00s; }
    .boot-sequence-s1 { animation-delay: 1.33s; }
    .boot-sequence-e1 { animation-delay: 1.33s; }
    .boot-sequence-s2 { animation-delay: 2.67s; }
    .boot-sequence-e2 { animation-delay: 2.67s; }
    .boot-sequence-s3 { animation-delay: 4.00s; }
    .boot-sequence-e3 { animation-delay: 4.00s; }
    .boot-sequence-s4 { animation-delay: 5.33s; }
    .boot-sequence-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .boot-sequence-conn  { animation: boot-sequence-trace 8s ease-in-out infinite; }
      .boot-sequence-stage { animation: boot-sequence-arrive 8s ease-in-out infinite; }
    }
    @keyframes boot-sequence-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes boot-sequence-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .boot-sequence-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .boot-sequence-stage { animation: boot-sequence-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes boot-sequence-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="boot-sequence-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="boot-sequence-bg" width="980" height="322"/>
  <text class="boot-sequence-h1"  x="30" y="40">How the OS gets there in the first place</text>
  <text class="boot-sequence-sub" x="30" y="64">From power-on to your shell prompt.</text>
  <g class="boot-sequence-stage boot-sequence-s0">
    <rect class="boot-sequence-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="boot-sequence-step" x="44" y="142">01</text>
    <text class="boot-sequence-name" x="70" y="142">Power on</text>
    <text class="boot-sequence-desc" x="44" y="166">Firmware — UEFI on modern</text>
    <text class="boot-sequence-desc" x="44" y="182">machines — initialises</text>
    <text class="boot-sequence-desc" x="44" y="198">just enough hardware to</text>
  </g>
  <line class="boot-sequence-line boot-sequence-conn boot-sequence-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#boot-sequence-tip)"/>
  <g class="boot-sequence-stage boot-sequence-s1">
    <rect class="boot-sequence-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="boot-sequence-step" x="233" y="142">02</text>
    <text class="boot-sequence-name" x="259" y="142">The bootloader</text>
    <text class="boot-sequence-desc" x="233" y="166">Found on disk. Loads the</text>
    <text class="boot-sequence-desc" x="233" y="182">kernel into memory and</text>
    <text class="boot-sequence-desc" x="233" y="198">jumps to it.</text>
  </g>
  <line class="boot-sequence-line boot-sequence-conn boot-sequence-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#boot-sequence-tip)"/>
  <g class="boot-sequence-stage boot-sequence-s2">
    <rect class="boot-sequence-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="boot-sequence-step" x="422" y="142">03</text>
    <text class="boot-sequence-name" x="448" y="142">The kernel initialises</text>
    <text class="boot-sequence-desc" x="422" y="166">Subsystems come up:</text>
    <text class="boot-sequence-desc" x="422" y="182">scheduler, memory</text>
    <text class="boot-sequence-desc" x="422" y="198">manager, drivers.</text>
  </g>
  <line class="boot-sequence-line boot-sequence-conn boot-sequence-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#boot-sequence-tip)"/>
  <g class="boot-sequence-stage boot-sequence-s3">
    <rect class="boot-sequence-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="boot-sequence-step" x="611" y="142">04</text>
    <text class="boot-sequence-name" x="637" y="142">Root filesystem mounted</text>
    <text class="boot-sequence-desc" x="611" y="166">Now there are files, and</text>
    <text class="boot-sequence-desc" x="611" y="182">the kernel can read them.</text>
  </g>
  <line class="boot-sequence-line boot-sequence-conn boot-sequence-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#boot-sequence-tip)"/>
  <g class="boot-sequence-stage boot-sequence-s4">
    <rect class="boot-sequence-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="boot-sequence-step" x="800" y="142">05</text>
    <text class="boot-sequence-name" x="826" y="142">The first process</text>
    <text class="boot-sequence-desc" x="800" y="166">It starts the services,</text>
    <text class="boot-sequence-desc" x="800" y="182">the login screen, and</text>
    <text class="boot-sequence-desc" x="800" y="198">eventually your shell.</text>
    <text class="boot-sequence-edge" x="800" y="242">PID 1</text>
  </g>
  <text class="boot-sequence-sub" x="30" y="304">From here the kernel is a permanent resident: every program you launch for the rest of the session is loaded, scheduled and supervised by it.</text>
</svg>
