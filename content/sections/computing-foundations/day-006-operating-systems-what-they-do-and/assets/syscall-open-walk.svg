<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five steps across the only door between your program and the machine.">
  <title>What open("data.csv") actually does</title>
  <style>
    .syscall-open-walk-bg   { fill: #f8fafc; }
    .syscall-open-walk-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-open-walk-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-open-walk-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-open-walk-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-open-walk-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-open-walk-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .syscall-open-walk-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .syscall-open-walk-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .syscall-open-walk-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .syscall-open-walk-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .syscall-open-walk-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .syscall-open-walk-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .syscall-open-walk-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .syscall-open-walk-stage { opacity: 1; }

    .syscall-open-walk-s0 { animation-delay: 0.00s; }
    .syscall-open-walk-e0 { animation-delay: 0.00s; }
    .syscall-open-walk-s1 { animation-delay: 1.33s; }
    .syscall-open-walk-e1 { animation-delay: 1.33s; }
    .syscall-open-walk-s2 { animation-delay: 2.67s; }
    .syscall-open-walk-e2 { animation-delay: 2.67s; }
    .syscall-open-walk-s3 { animation-delay: 4.00s; }
    .syscall-open-walk-e3 { animation-delay: 4.00s; }
    .syscall-open-walk-s4 { animation-delay: 5.33s; }
    .syscall-open-walk-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .syscall-open-walk-conn  { animation: syscall-open-walk-trace 8s ease-in-out infinite; }
      .syscall-open-walk-stage { animation: syscall-open-walk-arrive 8s ease-in-out infinite; }
    }
    @keyframes syscall-open-walk-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes syscall-open-walk-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .syscall-open-walk-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .syscall-open-walk-stage { animation: syscall-open-walk-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes syscall-open-walk-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="syscall-open-walk-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="syscall-open-walk-bg" width="980" height="322"/>
  <text class="syscall-open-walk-h1"  x="30" y="40">What open("data.csv") actually does</text>
  <text class="syscall-open-walk-sub" x="30" y="64">Five steps across the only door between your program and the machine.</text>
  <g class="syscall-open-walk-stage syscall-open-walk-s0">
    <rect class="syscall-open-walk-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="syscall-open-walk-step" x="44" y="142">01</text>
    <text class="syscall-open-walk-name" x="70" y="142">Your program asks</text>
    <text class="syscall-open-walk-desc" x="44" y="166">open("data.csv") reaches</text>
    <text class="syscall-open-walk-desc" x="44" y="182">the C library, which</text>
    <text class="syscall-open-walk-desc" x="44" y="198">loads the syscall number</text>
  </g>
  <line class="syscall-open-walk-line syscall-open-walk-conn syscall-open-walk-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#syscall-open-walk-tip)"/>
  <g class="syscall-open-walk-stage syscall-open-walk-s1">
    <rect class="syscall-open-walk-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="syscall-open-walk-step" x="233" y="142">02</text>
    <text class="syscall-open-walk-name" x="259" y="142">The CPU switches mode</text>
    <text class="syscall-open-walk-desc" x="233" y="166">One special instruction.</text>
    <text class="syscall-open-walk-desc" x="233" y="182">The kernel chooses where</text>
    <text class="syscall-open-walk-desc" x="233" y="198">it lands — not your</text>
    <text class="syscall-open-walk-edge" x="233" y="242">user to kernel</text>
  </g>
  <line class="syscall-open-walk-line syscall-open-walk-conn syscall-open-walk-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#syscall-open-walk-tip)"/>
  <g class="syscall-open-walk-stage syscall-open-walk-s2">
    <rect class="syscall-open-walk-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="syscall-open-walk-step" x="422" y="142">03</text>
    <text class="syscall-open-walk-name" x="448" y="142">The kernel resolves the path</text>
    <text class="syscall-open-walk-desc" x="422" y="166">Directory by directory,</text>
    <text class="syscall-open-walk-desc" x="422" y="182">using the driver for the</text>
    <text class="syscall-open-walk-desc" x="422" y="198">disk that holds them.</text>
  </g>
  <line class="syscall-open-walk-line syscall-open-walk-conn syscall-open-walk-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#syscall-open-walk-tip)"/>
  <g class="syscall-open-walk-stage syscall-open-walk-s3">
    <rect class="syscall-open-walk-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="syscall-open-walk-step" x="611" y="142">04</text>
    <text class="syscall-open-walk-name" x="637" y="142">The permission check</text>
    <text class="syscall-open-walk-desc" x="611" y="166">File owner and mode bits</text>
    <text class="syscall-open-walk-desc" x="611" y="182">against the calling</text>
    <text class="syscall-open-walk-desc" x="611" y="198">process's identity.</text>
    <text class="syscall-open-walk-edge" x="611" y="242">Permission denied</text>
  </g>
  <line class="syscall-open-walk-line syscall-open-walk-conn syscall-open-walk-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#syscall-open-walk-tip)"/>
  <g class="syscall-open-walk-stage syscall-open-walk-s4">
    <rect class="syscall-open-walk-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="syscall-open-walk-step" x="800" y="142">05</text>
    <text class="syscall-open-walk-name" x="826" y="142">A number comes back</text>
    <text class="syscall-open-walk-desc" x="800" y="166">A file descriptor. Not</text>
    <text class="syscall-open-walk-desc" x="800" y="182">the data, not the disk</text>
    <text class="syscall-open-walk-desc" x="800" y="198">address, not any right to</text>
    <text class="syscall-open-walk-edge" x="800" y="242">fd 3</text>
  </g>
  <text class="syscall-open-walk-sub" x="30" y="304">Every language bottoms out here. Python, C, Rust and JavaScript all make the same few hundred calls.</text>
</svg>
