<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A distinction the AI world will force on you.">
  <title>Linux is a kernel; Ubuntu is a product</title>
  <style>
    .kernel-versus-distribution-bg   { fill: #f8fafc; }
    .kernel-versus-distribution-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-versus-distribution-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-versus-distribution-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-versus-distribution-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-versus-distribution-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-versus-distribution-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kernel-versus-distribution-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kernel-versus-distribution-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kernel-versus-distribution-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kernel-versus-distribution-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kernel-versus-distribution-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kernel-versus-distribution-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kernel-versus-distribution-row { opacity: 1; }
    .kernel-versus-distribution-r0 { animation-delay: 0.00s; }
    .kernel-versus-distribution-r1 { animation-delay: 0.45s; }
    .kernel-versus-distribution-r2 { animation-delay: 0.90s; }
    .kernel-versus-distribution-r3 { animation-delay: 1.35s; }
    .kernel-versus-distribution-r4 { animation-delay: 1.80s; }
    .kernel-versus-distribution-row { animation: kernel-versus-distribution-reveal 7.3s ease-in-out infinite; }
    @keyframes kernel-versus-distribution-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kernel-versus-distribution-bg" width="980" height="390"/>
  <text class="kernel-versus-distribution-h1"  x="30" y="40">Linux is a kernel; Ubuntu is a product</text>
  <text class="kernel-versus-distribution-sub" x="30" y="64">A distinction the AI world will force on you.</text>
  <rect class="kernel-versus-distribution-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kernel-versus-distribution-name" x="46" y="122">The Linux kernel</text>
  <text class="kernel-versus-distribution-desc" x="46" y="142">One codebase. Scheduler, memory, drivers, syscalls.</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r0" x="46" y="182">Started by Linus Torvalds, 1991</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r1" x="46" y="216">Process, memory and device management</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r2" x="46" y="250">The system-call interface</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r3" x="46" y="284">No shell, no installer, no package manager</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r4" x="46" y="318">Version numbers like 6.8</text>
  <rect class="kernel-versus-distribution-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kernel-versus-distribution-name" x="526" y="122">A distribution</text>
  <text class="kernel-versus-distribution-desc" x="526" y="142">The kernel plus everything around it.</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r0" x="526" y="182">Ubuntu, Debian, Fedora, Arch — same kernel</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r1" x="526" y="216">An installer and a package manager</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r2" x="526" y="250">Default shell and userland tools</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r3" x="526" y="284">An update and support policy</text>
  <text class="kernel-versus-distribution-desc kernel-versus-distribution-row kernel-versus-distribution-r4" x="526" y="318">Names like Ubuntu 24.04 LTS</text>
  <text class="kernel-versus-distribution-sub" x="30" y="372">When a cloud provider offers "Ubuntu 24.04 LTS", it is offering the Linux kernel plus Canonical's curated bundle around it.</text>
</svg>
