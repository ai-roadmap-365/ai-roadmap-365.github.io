<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" font-family="system-ui, sans-serif">
  <title>Applications in user space cross the system-call boundary into the kernel, which manages the hardware</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Kernel and user space</text>

  <!-- User space band -->
  <rect x="40" y="56" width="680" height="120" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4" rx="8"/>
  <text x="56" y="80" font-size="14" font-weight="bold" fill="#1d4ed8">USER SPACE (unprivileged)</text>

  <rect x="64" y="94" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="139" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Python script</text>
  <text x="139" y="140" text-anchor="middle" font-size="14" fill="#1a202c">training a model</text>

  <rect x="234" y="94" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="309" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Web browser</text>
  <text x="309" y="140" text-anchor="middle" font-size="14" fill="#1a202c">dozens of tabs</text>

  <rect x="404" y="94" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="479" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Terminal + shell</text>
  <text x="479" y="140" text-anchor="middle" font-size="14" fill="#1a202c">your commands</text>

  <rect x="574" y="94" width="130" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="639" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Container</text>
  <text x="639" y="140" text-anchor="middle" font-size="14" fill="#1a202c">isolated app</text>

  <!-- Arrows down to boundary -->
  <line x1="139" y1="176" x2="139" y2="212" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="139,220 133,208 145,208" fill="#1d4ed8"/>
  <line x1="309" y1="176" x2="309" y2="212" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="309,220 303,208 315,208" fill="#1d4ed8"/>
  <line x1="479" y1="176" x2="479" y2="212" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="479,220 473,208 485,208" fill="#1d4ed8"/>
  <line x1="639" y1="176" x2="639" y2="212" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="639,220 633,208 645,208" fill="#1d4ed8"/>

  <!-- System call boundary -->
  <rect x="40" y="222" width="680" height="44" fill="#1d4ed8" rx="6"/>
  <text x="380" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#f8fafc">SYSTEM-CALL BOUNDARY — open, read, write, fork, exec, mmap …</text>

  <!-- Kernel band -->
  <rect x="40" y="282" width="680" height="150" fill="none" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
  <text x="56" y="306" font-size="14" font-weight="bold" fill="#1d4ed8">KERNEL SPACE (privileged)</text>

  <rect x="60" y="320" width="122" height="92" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="121" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Process</text>
  <text x="121" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">manager</text>
  <text x="121" y="394" text-anchor="middle" font-size="14" fill="#1a202c">scheduling</text>

  <rect x="196" y="320" width="122" height="92" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="257" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Memory</text>
  <text x="257" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">manager</text>
  <text x="257" y="394" text-anchor="middle" font-size="14" fill="#1a202c">virtual memory</text>

  <rect x="332" y="320" width="122" height="92" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="393" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Filesystem</text>
  <text x="393" y="376" text-anchor="middle" font-size="14" fill="#1a202c">files, folders,</text>
  <text x="393" y="394" text-anchor="middle" font-size="14" fill="#1a202c">permissions</text>

  <rect x="468" y="320" width="122" height="92" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="529" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Device</text>
  <text x="529" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">drivers</text>
  <text x="529" y="394" text-anchor="middle" font-size="14" fill="#1a202c">disk, GPU, net</text>

  <rect x="604" y="320" width="100" height="92" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="654" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Security</text>
  <text x="654" y="376" text-anchor="middle" font-size="14" fill="#1a202c">users,</text>
  <text x="654" y="394" text-anchor="middle" font-size="14" fill="#1a202c">isolation</text>

  <!-- Arrow to hardware -->
  <line x1="380" y1="432" x2="380" y2="462" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="380,470 374,458 386,458" fill="#1d4ed8"/>

  <!-- Hardware band -->
  <rect x="40" y="472" width="680" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">HARDWARE — CPU · RAM · disk · GPU · network</text>
  <text x="380" y="520" text-anchor="middle" font-size="14" fill="#1a202c">Only the kernel touches it directly</text>

  <text x="380" y="550" text-anchor="middle" font-size="14" fill="#1a202c">Every request from an application must cross the system-call boundary — there is no other door.</text>
</svg>
