questions:
  - question: 'What is the fundamental difference between kernel space and user space?'
    options:
      - 'Kernel space is stored on disk while user space lives in RAM'
      - 'Kernel space runs privileged; user space must ask via system calls'
      - 'Kernel space is for system administrators and user space is for ordinary user accounts'
      - 'Kernel space runs faster because it uses a separate, faster processor'
    answer_index: 1
    explanation: 'The split is enforced by the CPU''s hardware privilege modes: kernel-mode code may execute any instruction and access any memory, while user-mode programs are confined to their own memory and must cross the system-call boundary for anything more.'

  - question: 'What is a system call?'
    options:
      - 'A phone-home request an operating system makes to its vendor'
      - 'Any function call between two functions in the same program'
      - 'How a user-space program requests a service from the kernel'
      - 'A message one application sends to another application'
    answer_index: 2
    explanation: 'A system call is the single doorway between user space and the kernel: the program executes a special instruction that switches the CPU into kernel mode at a kernel-chosen entry point, where the request is checked and serviced.'

  - question: 'When a program successfully opens a file, what does the operating system actually hand back to it?'
    options:
      - 'The physical disk address where the file''s data begins'
      - 'A complete copy of the file loaded into the kernel''s memory'
      - 'Direct read/write access to the disk hardware for that file'
      - 'A file descriptor — a small integer used as a ticket for later calls'
    answer_index: 3
    explanation: 'The kernel keeps all the real bookkeeping and hardware access to itself; the program receives only a file descriptor — a number it hands back across the system-call boundary on every subsequent read or write.'

  - question: 'Which statement about the Unix family history is accurate?'
    options:
      - 'Unix began at Bell Labs in 1969; Linux is a from-scratch Unix-like kernel'
      - 'Linux was created by AT&T in 1983 as the commercial successor to Unix systems'
      - 'Unix was derived from Windows NT in the early 1990s'
      - 'macOS abandoned its Unix heritage when Apple bought NeXT in 1996'
    answer_index: 0
    explanation: 'Ken Thompson and Dennis Ritchie started Unix at Bell Labs in 1969; the family branched into BSD and System V; and in 1991 Linus Torvalds wrote the Linux kernel independently — Unix-like in design, but new code. macOS, via NeXT and Darwin, genuinely descends from the Unix/BSD line.'

  - question: 'Why does virtually all server and GPU/AI infrastructure run on Linux?'
    options:
      - 'Linux is the only operating system that can run Python programs'
      - 'It is license-free at any scale, adaptable, scriptable, and remotely run'
      - 'Linux is the only operating system with a graphical desktop'
      - 'Laws in most countries require datacenter servers to run open-source software'
    answer_index: 1
    explanation: 'Zero per-machine license cost across huge fleets, an open kernel that cloud and GPU vendors can modify, end-to-end scriptability, and remote text-based administration made Linux the default for servers, clouds, and GPU clusters — not fashion or legal mandate.'

  - question: 'What is a container, in operating-system terms?'
    options:
      - 'A complete emulated computer running its own separate kernel'
      - 'A compressed archive format for shipping source code'
      - 'A kernel-enforced isolated slice of user space sharing the host kernel'
      - 'A physical case that holds multiple separate servers in a datacenter rack'
    answer_index: 2
    explanation: 'Containers use kernel features (namespaces and control groups on Linux) to isolate processes while sharing the host kernel — lighter and faster to start than a virtual machine, which emulates a whole machine with its own kernel.'

  - question: 'A script works on your laptop but fails on a server with "Permission denied". Which OS subsystem produced that message, and at what moment?'
    options:
      - 'The compiler, when the script was first written'
      - 'The CPU cache, when it ran out of room for the script'
      - 'The bootloader, when the server last restarted'
      - 'The kernel''s permission check, against the file''s ownership bits'
    answer_index: 3
    explanation: 'Permission checks happen inside the kernel during system calls such as open: the caller''s user identity is compared against the file''s owner and permission bits, and a mismatch returns the error the program reports as "Permission denied".'

  - question: 'What is the relationship between Linux and a Linux distribution such as Ubuntu?'
    options:
      - 'Linux is the kernel; Ubuntu packages it into a complete product'
      - 'Ubuntu is a rival kernel that competes with Linux'
      - 'Linux is a graphical desktop that runs on top of Ubuntu'
      - 'They are the same thing under two names'
    answer_index: 0
    explanation: 'Linux proper is only the kernel. Distributions like Ubuntu, Debian, and Fedora bundle it with user-space tools and policies — which is why cloud providers offer "Ubuntu" images rather than "Linux" ones.'
