visuals:
  - id: kernel-userspace
    file: assets/kernel-userspace.svg
    type: diagram
    title: 'Kernel and user space'
    alt: 'Diagram: applications in user space crossing the system-call boundary into the kernel and hardware'
    description: 'Applications (a Python script, a browser, a terminal with its shell, a container) sit in unprivileged user space; every request crosses the system-call boundary into the privileged kernel, whose subsystems — process manager, memory manager, filesystem, device drivers, and security — alone touch the hardware below.'
  - id: os-family-tree
    file: assets/os-family-tree.svg
    type: diagram
    title: 'The operating-system family tree'
    alt: 'Timeline: the Unix and Windows family tree from 1969 to today'
    description: 'A simplified lineage timeline: Unix (Bell Labs, 1969) branches into BSD and System V; BSD flows through NeXTSTEP into macOS with its Darwin/XNU kernel; Linux (1991) is written from scratch, inspired by Unix design but not derived from its code; Windows follows its separate MS-DOS and Windows NT lineage, with WSL shown as a dashed modern bridge to Linux.'
  - id: kernel-boundary
    file: assets/kernel-boundary.svg
    type: diagram
    title: 'The line every program has to ask across'
    alt: 'Diagram: what runs in user space compared with what only the kernel may do'
    description: 'A two-column comparison of user space and kernel space, listing what each may do and naming the system call as the only doorway between them.'
  - id: bare-metal-versus-os
    file: assets/bare-metal-versus-os.svg
    type: diagram
    title: 'A machine without an OS, and one with'
    alt: 'Diagram: running on bare hardware compared with running under an operating system'
    description: 'A two-column comparison of a machine with no operating system against one running an operating system, covering how programs are loaded, how devices are reached, how memory is protected and how many programs can run.'
  - id: os-five-jobs
    file: assets/os-five-jobs.svg
    type: diagram
    title: 'The five jobs, and the failure each one prevents'
    alt: 'Diagram: the five jobs an operating system does and the problem each solves'
    description: 'A five-stage sequence naming process management, memory management, filesystems, device drivers and permissions, with the concrete failure each one prevents and the everyday symptom you meet it as.'
  - id: syscall-open-walk
    file: assets/syscall-open-walk.svg
    type: diagram
    title: 'What open("data.csv") actually does'
    alt: 'Diagram: the steps a file-open system call takes through the kernel'
    description: 'A five-stage sequence tracing a Python open call through the C library, the syscall instruction, the kernel handler, path resolution, the permission check, and the file descriptor returned to user space.'
  - id: boot-sequence
    file: assets/boot-sequence.svg
    type: diagram
    title: 'How the OS gets there in the first place'
    alt: 'Diagram: the boot sequence from firmware to the first user-space process'
    description: 'A five-stage sequence from power-on firmware through the bootloader, kernel initialisation, mounting the root filesystem, and starting the first user-space process which starts everything else.'
  - id: kernel-versus-distribution
    file: assets/kernel-versus-distribution.svg
    type: diagram
    title: 'Linux is a kernel; Ubuntu is a product'
    alt: 'Diagram: the Linux kernel compared with a Linux distribution'
    description: 'A two-column comparison separating the Linux kernel from a Linux distribution, listing what each supplies and who maintains it.'
  - id: vm-versus-container
    file: assets/vm-versus-container.svg
    type: diagram
    title: 'Why a container starts in a second'
    alt: 'Diagram: a virtual machine compared with a container'
    description: 'A two-column comparison of virtual machines and containers covering what each virtualises, startup time, isolation strength and the kernel each uses.'
  - id: syscall-batching
    file: assets/syscall-batching.svg
    type: diagram
    title: 'Why fast code batches its reads'
    alt: 'Diagram: reading a file one byte at a time compared with reading it in blocks'
    description: 'A two-column comparison of reading one megabyte one byte per system call against reading it in sixty-four-kilobyte blocks, showing the number of boundary crossings each requires and why the difference dominates the runtime.'
