terms:
  - term: operating system
    definition: 'The software layer that manages a computer''s hardware and provides common services to programs — a manager of resources, an illusionist providing private-machine fictions, and a guard enforcing protection.'
  - term: kernel
    definition: 'The privileged core of an operating system, running in a special CPU mode with unrestricted access to memory and devices; it contains the scheduler, memory manager, filesystems, drivers, and security machinery.'
  - term: user space
    definition: 'The unprivileged world where all ordinary programs run, confined to their own memory and required to request every hardware service from the kernel through system calls.'
  - term: system call
    definition: 'The controlled doorway through which a user-space program asks the kernel for a service such as opening a file, allocating memory, or sending a network packet.'
  - term: file descriptor
    definition: 'The small integer the kernel returns when a program opens a file — a ticket the program hands back on every subsequent read or write, while the kernel keeps the real bookkeeping.'
  - term: device driver
    definition: 'A hardware-specific module, usually loaded into the kernel, that translates one device''s particular dialect into the standard interface the rest of the system expects.'
  - term: filesystem
    definition: 'The OS subsystem that organizes raw disk blocks into named files, folders, timestamps, and permissions — the human-usable fiction layered over storage hardware.'
  - term: permission
    definition: 'A rule attached to a file or resource stating which users may read, write, or execute it; the kernel checks permissions during system calls, producing "Permission denied" on failure.'
  - term: virtual memory
    definition: 'The memory-management scheme that gives each process a private, contiguous-looking address space mapped by page tables onto physical RAM, with less-used pages evicted to disk when memory runs short.'
  - term: process
    definition: 'A program in execution: the running instance of a program file, with its own virtual address space, identity, and entry in the scheduler''s ledger.'
  - term: shell
    definition: 'The user-space program (such as zsh or bash) that reads typed commands and asks the kernel to run them — distinct from both the terminal window and the operating system itself.'
  - term: Unix
    definition: 'The operating system begun at Bell Labs in 1969 by Ken Thompson and Dennis Ritchie, whose portable C implementation and licensed source code made its design the ancestor or model for macOS, Linux, and most server systems.'
  - term: Linux distribution
    definition: 'A complete product (Ubuntu, Debian, Fedora, Arch) that packages the Linux kernel with installers, a package manager, default tools, and an update policy.'
  - term: WSL
    definition: 'The Windows Subsystem for Linux — a Windows feature whose current version runs a real Linux kernel in a lightweight virtual machine, giving Windows users a genuine Linux environment alongside Windows.'
  - term: container
    definition: 'A kernel-enforced isolated compartment of user space — separate process list, filesystem view, and network stack — that shares the host''s kernel, packaged with an application''s exact environment so it runs identically anywhere.'
