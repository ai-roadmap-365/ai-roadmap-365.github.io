terms:
  - term: process
    definition: 'A running instance of a program: the program''s instructions loaded into private memory, plus the PID, file handles, owner, parent, and state the operating system tracks to run and clean up after it.'
  - term: PID
    definition: 'Process identifier — the unique number the operating system assigns to each process, used to observe it (ps -p) and signal it (kill).'
  - term: thread
    definition: 'An independent stream of instructions inside a process, with its own program counter and stack but sharing the process''s memory and file handles with its sibling threads.'
  - term: scheduler
    definition: 'The part of the operating system that decides which runnable thread gets which CPU core, and for how long, balancing responsiveness, throughput, and fairness.'
  - term: context switch
    definition: 'The act of saving one thread''s complete CPU state and loading another''s so a core can change what it is running — pure overhead that pays for the illusion of simultaneity.'
  - term: time slice
    definition: 'The brief interval, typically a few milliseconds, that the scheduler lets a thread run before preempting it and giving the core to another.'
  - term: preemption
    definition: 'The scheduler forcibly interrupting a running thread when its time slice expires or something more urgent arrives — the thread is not asked, it is stopped.'
  - term: signal
    definition: 'A small numbered notification the kernel delivers to a process, such as SIGTERM ("please shut down"), SIGINT (Ctrl+C), or SIGKILL (unrefusable termination).'
  - term: exit code
    definition: 'The number a process leaves behind when it terminates: 0 means success, other values signal failure, and 128 plus a signal number marks death by that signal (143 for SIGTERM, 137 for SIGKILL).'
  - term: zombie process
    definition: 'A process that has exited but whose exit code has not yet been collected by its parent, leaving a dead entry in the process table until it is reaped.'
  - term: concurrency
    definition: 'Structuring many tasks so they make progress over overlapping time periods — achievable on a single core through time slicing, with no true simultaneity required.'
  - term: parallelism
    definition: 'Executing more than one task at the same physical instant, which requires multiple execution units such as several CPU cores or a GPU''s thousands of cores.'
  - term: background job
    definition: 'A command started with & so the shell does not wait for it: the process runs while the prompt returns immediately, its PID captured in $! and listed by jobs.'
  - term: race condition
    definition: 'A bug in which the result depends on the timing of threads touching shared data — for example two threads both incrementing a counter and silently losing one update.'
