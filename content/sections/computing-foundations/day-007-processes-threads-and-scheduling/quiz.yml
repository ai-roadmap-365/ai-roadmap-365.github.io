questions:
  - question: 'What is the difference between a program and a process?'
    options:
      - 'A program is a file on disk; a process is a running instance of it'
      - 'They are two words for the same thing'
      - 'A program runs in RAM while a process runs on the disk'
      - 'A process is the source code and a program is the compiled version'
    answer_index: 0
    explanation: 'A program is just a file until the operating system loads it into memory, assigns it a PID, gives it private memory and file handles, and starts executing it — that running instance is a process, and one program can run as many processes at once.'

  - question: 'A process asks to read a block from disk. Which lifecycle state does it enter while the disk works, and what does that cost in CPU time?'
    options:
      - 'Running — it keeps its core until the read completes'
      - 'Waiting — it is blocked until the event arrives and consumes no CPU at all'
      - 'Ready — it goes back into the scheduler queue and keeps consuming its slice'
      - 'Zombie — it is dead until the disk revives it'
    answer_index: 1
    explanation: 'A process blocked on input or output moves to the waiting state, where the scheduler ignores it entirely; when the event arrives it returns to ready. Blocked processes cost no CPU, which is why one core can host hundreds of mostly-idle processes.'

  - question: 'What exactly is a zombie process?'
    options:
      - 'A process whose parent died before it did'
      - 'A process consuming 100 percent CPU that cannot be killed'
      - 'A process that has exited but whose exit code is uncollected'
      - 'A background process detached from any terminal'
    answer_index: 2
    explanation: 'When a process exits, the kernel keeps a small process-table entry holding its exit code until the parent reads it with a wait call; until then the dead process is a zombie. A few momentary zombies are normal — accumulating zombies indicate a parent that never reaps its children.'

  - question: 'Why are threads described as cheap compared with processes — and what makes them dangerous?'
    options:
      - 'Threads run on special low-power cores, but overheat easily'
      - 'Threads copy the whole process memory at creation, which is fast but wastes RAM'
      - 'Threads are cheaper because the scheduler never preempts them, which risks freezing the machine'
      - 'Threads share the process''s memory, which is why races are possible'
    answer_index: 3
    explanation: 'Creating a thread only adds a stack and registers inside an existing address space, so it is far lighter than creating a process. But because all threads of a process share one memory, simultaneous unsynchronized updates can silently corrupt data — the race condition.'

  - question: 'Your laptop has 14 cores and 480 processes. How do they all appear to run at once?'
    options:
      - 'Most are waiting; the scheduler time-slices too fast to notice'
      - 'The operating system compresses processes so 480 fit onto 14 cores simultaneously'
      - 'Each core secretly contains about 34 smaller cores'
      - 'Only 14 processes ever exist at a time; the rest are swapped to disk'
    answer_index: 0
    explanation: 'At any instant at most 14 threads truly execute. Nearly all processes are blocked in the waiting state, and the few runnable ones take rapid preempted turns — time slices separated by context switches — creating the illusion of simultaneity.'

  - question: 'What is the practical difference between kill (SIGTERM) and kill -9 (SIGKILL)?'
    options:
      - 'SIGTERM works only on background jobs; SIGKILL works on any process'
      - 'SIGTERM can be caught and handled; SIGKILL cannot be refused'
      - 'SIGKILL politely asks the process to stop; SIGTERM forces it'
      - 'They are identical; -9 just makes it faster'
    answer_index: 1
    explanation: 'SIGTERM (signal 15, the default) lets a process save files and shut down gracefully — a process killed by it exits with code 143. SIGKILL (signal 9) is enforced by the kernel, runs no cleanup, and yields exit code 137; use it only after SIGTERM fails.'

  - question: 'Which statement correctly distinguishes concurrency from parallelism?'
    options:
      - 'Parallelism is possible on a single core; concurrency requires at least two cores'
      - 'Concurrency is the hardware feature; parallelism is the software feature'
      - 'Concurrency overlaps tasks on one core; parallelism needs several'
      - 'They are synonyms used by different operating systems'
    answer_index: 2
    explanation: 'A single core running three processes in time slices is concurrent but never parallel; simultaneous execution needs multiple cores (or a GPU''s thousands). All parallelism on a shared machine also involves concurrency, but not vice versa.'

  - question: 'Why do machine-learning frameworks load training data with several worker processes rather than threads in Python?'
    options:
      - 'Threads cannot read files on most operating systems'
      - 'Worker processes can share the GPU while threads cannot'
      - 'Processes are always faster than threads for every workload'
      - 'The GIL lets only one thread run Python, so parallelism needs processes'
    answer_index: 3
    explanation: 'Under the GIL, Python threads provide concurrency (overlapping waits) but not parallel execution of Python code. Spawning worker processes gives each its own interpreter and memory, so many cores can genuinely preprocess batches simultaneously to keep the GPU fed.'
