<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The difference decides whether your checkpoint file survives.">
  <title>Ask politely, then insist</title>
  <style>
    .signal-etiquette-bg   { fill: #f8fafc; }
    .signal-etiquette-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-etiquette-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-etiquette-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-etiquette-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-etiquette-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-etiquette-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .signal-etiquette-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .signal-etiquette-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .signal-etiquette-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .signal-etiquette-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .signal-etiquette-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .signal-etiquette-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .signal-etiquette-row { opacity: 1; }
    .signal-etiquette-r0 { animation-delay: 0.00s; }
    .signal-etiquette-r1 { animation-delay: 0.45s; }
    .signal-etiquette-r2 { animation-delay: 0.90s; }
    .signal-etiquette-r3 { animation-delay: 1.35s; }
    .signal-etiquette-r4 { animation-delay: 1.80s; }
    .signal-etiquette-row { animation: signal-etiquette-reveal 7.3s ease-in-out infinite; }
    @keyframes signal-etiquette-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="signal-etiquette-bg" width="980" height="390"/>
  <text class="signal-etiquette-h1"  x="30" y="40">Ask politely, then insist</text>
  <text class="signal-etiquette-sub" x="30" y="64">The difference decides whether your checkpoint file survives.</text>
  <rect class="signal-etiquette-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="signal-etiquette-name" x="46" y="122">SIGTERM (15)</text>
  <text class="signal-etiquette-desc" x="46" y="142">kill PID — the default.</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r0" x="46" y="182">The process may catch it</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r1" x="46" y="216">It can flush files and release resources</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r2" x="46" y="250">It may also ignore it entirely</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r3" x="46" y="284">Exit code 143 (128 + 15)</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r4" x="46" y="318">Always try this first</text>
  <rect class="signal-etiquette-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="signal-etiquette-name" x="526" y="122">SIGKILL (9)</text>
  <text class="signal-etiquette-desc" x="526" y="142">kill -9 PID — the last resort.</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r0" x="526" y="182">The process cannot refuse</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r1" x="526" y="216">No cleanup code runs at all</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r2" x="526" y="250">The kernel simply ends it</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r3" x="526" y="284">Exit code 137 (128 + 9)</text>
  <text class="signal-etiquette-desc signal-etiquette-row signal-etiquette-r4" x="526" y="318">This is how half-written checkpoints happen</text>
  <text class="signal-etiquette-sub" x="30" y="372">Exit code 137 is worth memorising: a containerised job killed for exceeding its memory limit dies with exactly that.</text>
</svg>
