<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="What the difference costs, and what it buys.">
  <title>A process and a thread, side by side</title>
  <style>
    .process-versus-thread-bg   { fill: #f8fafc; }
    .process-versus-thread-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-versus-thread-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-versus-thread-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-versus-thread-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-versus-thread-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-versus-thread-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .process-versus-thread-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .process-versus-thread-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .process-versus-thread-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .process-versus-thread-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .process-versus-thread-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .process-versus-thread-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .process-versus-thread-row { opacity: 1; }
    .process-versus-thread-r0 { animation-delay: 0.00s; }
    .process-versus-thread-r1 { animation-delay: 0.45s; }
    .process-versus-thread-r2 { animation-delay: 0.90s; }
    .process-versus-thread-r3 { animation-delay: 1.35s; }
    .process-versus-thread-r4 { animation-delay: 1.80s; }
    .process-versus-thread-r5 { animation-delay: 2.25s; }
    .process-versus-thread-row { animation: process-versus-thread-reveal 7.7s ease-in-out infinite; }
    @keyframes process-versus-thread-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="process-versus-thread-bg" width="980" height="424"/>
  <text class="process-versus-thread-h1"  x="30" y="40">A process and a thread, side by side</text>
  <text class="process-versus-thread-sub" x="30" y="64">What the difference costs, and what it buys.</text>
  <rect class="process-versus-thread-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="process-versus-thread-name" x="46" y="122">Process</text>
  <text class="process-versus-thread-desc" x="46" y="142">Its own address space.</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r0" x="46" y="182">Creating one builds a whole address space</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r1" x="46" y="216">Expensive to start</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r2" x="46" y="250">Switching remaps memory — costlier</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r3" x="46" y="284">Shares data only through explicit channels</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r4" x="46" y="318">A crash takes down only itself</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r5" x="46" y="352">Safer for heavy parallel computation</text>
  <rect class="process-versus-thread-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="process-versus-thread-name" x="526" y="122">Thread</text>
  <text class="process-versus-thread-desc" x="526" y="142">Shares its process's address space.</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r0" x="526" y="182">Creating one adds a program counter, registers, a stack</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r1" x="526" y="216">Orders of magnitude cheaper to start</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r2" x="526" y="250">Switching keeps the memory map — cheaper</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r3" x="526" y="284">Shares all memory by default</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r4" x="526" y="318">A crash can take down the whole process</text>
  <text class="process-versus-thread-desc process-versus-thread-row process-versus-thread-r5" x="526" y="352">Best when the work is mostly waiting</text>
  <text class="process-versus-thread-sub" x="30" y="406">The shared memory that makes threads cheap is exactly what makes them dangerous.</text>
</svg>
