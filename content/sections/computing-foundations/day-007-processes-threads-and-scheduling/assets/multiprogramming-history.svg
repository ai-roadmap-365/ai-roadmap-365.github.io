<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each one answers a failure of the one before it.">
  <title>Four ideas, in the order they were needed</title>
  <style>
    .multiprogramming-history-bg   { fill: #f8fafc; }
    .multiprogramming-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiprogramming-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiprogramming-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiprogramming-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiprogramming-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiprogramming-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multiprogramming-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multiprogramming-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multiprogramming-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multiprogramming-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multiprogramming-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multiprogramming-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multiprogramming-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multiprogramming-history-stage { opacity: 1; }

    .multiprogramming-history-s0 { animation-delay: 0.00s; }
    .multiprogramming-history-e0 { animation-delay: 0.00s; }
    .multiprogramming-history-s1 { animation-delay: 1.28s; }
    .multiprogramming-history-e1 { animation-delay: 1.28s; }
    .multiprogramming-history-s2 { animation-delay: 2.56s; }
    .multiprogramming-history-e2 { animation-delay: 2.56s; }
    .multiprogramming-history-s3 { animation-delay: 3.84s; }
    .multiprogramming-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .multiprogramming-history-conn  { animation: multiprogramming-history-trace 6.4s ease-in-out infinite; }
      .multiprogramming-history-stage { animation: multiprogramming-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes multiprogramming-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multiprogramming-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multiprogramming-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multiprogramming-history-stage { animation: multiprogramming-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multiprogramming-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multiprogramming-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multiprogramming-history-bg" width="980" height="322"/>
  <text class="multiprogramming-history-h1"  x="30" y="40">Four ideas, in the order they were needed</text>
  <text class="multiprogramming-history-sub" x="30" y="64">Each one answers a failure of the one before it.</text>
  <g class="multiprogramming-history-stage multiprogramming-history-s0">
    <rect class="multiprogramming-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="multiprogramming-history-step" x="44" y="142">01</text>
    <text class="multiprogramming-history-name" x="70" y="142">One at a time</text>
    <text class="multiprogramming-history-desc" x="44" y="166">The CPU sits idle whenever the</text>
    <text class="multiprogramming-history-desc" x="44" y="182">program waits for anything.</text>
    <text class="multiprogramming-history-edge" x="44" y="242">1950s</text>
  </g>
  <line class="multiprogramming-history-line multiprogramming-history-conn multiprogramming-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#multiprogramming-history-tip)"/>
  <g class="multiprogramming-history-stage multiprogramming-history-s1">
    <rect class="multiprogramming-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="multiprogramming-history-step" x="280" y="142">02</text>
    <text class="multiprogramming-history-name" x="306" y="142">Multiprogramming</text>
    <text class="multiprogramming-history-desc" x="280" y="166">Several programs in memory, so</text>
    <text class="multiprogramming-history-desc" x="280" y="182">the CPU switches when one</text>
    <text class="multiprogramming-history-desc" x="280" y="198">blocks.</text>
    <text class="multiprogramming-history-edge" x="280" y="242">1960s</text>
  </g>
  <line class="multiprogramming-history-line multiprogramming-history-conn multiprogramming-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#multiprogramming-history-tip)"/>
  <g class="multiprogramming-history-stage multiprogramming-history-s2">
    <rect class="multiprogramming-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="multiprogramming-history-step" x="516" y="142">03</text>
    <text class="multiprogramming-history-name" x="542" y="142">Preemptive time-sharing</text>
    <text class="multiprogramming-history-desc" x="516" y="166">A hardware timer stops a program</text>
    <text class="multiprogramming-history-desc" x="516" y="182">whether or not it is ready.</text>
    <text class="multiprogramming-history-desc" x="516" y="198">Terminals became responsive.</text>
    <text class="multiprogramming-history-edge" x="516" y="242">1970s</text>
  </g>
  <line class="multiprogramming-history-line multiprogramming-history-conn multiprogramming-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#multiprogramming-history-tip)"/>
  <g class="multiprogramming-history-stage multiprogramming-history-s3">
    <rect class="multiprogramming-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="multiprogramming-history-step" x="752" y="142">04</text>
    <text class="multiprogramming-history-name" x="778" y="142">Threads</text>
    <text class="multiprogramming-history-desc" x="752" y="166">Processes proved too heavy for</text>
    <text class="multiprogramming-history-desc" x="752" y="182">programs wanting many activities</text>
    <text class="multiprogramming-history-desc" x="752" y="198">over shared data.</text>
    <text class="multiprogramming-history-edge" x="752" y="242">1990s</text>
  </g>
  <text class="multiprogramming-history-sub" x="30" y="304">The trade was made at the last step and stands today: threads bought speed by sharing memory, and the sharing is what still bites.</text>
</svg>
