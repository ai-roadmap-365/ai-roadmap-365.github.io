<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The answer follows from whether the work waits or computes.">
  <title>Which one your AI workload wants</title>
  <style>
    .threads-or-processes-bg   { fill: #f8fafc; }
    .threads-or-processes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threads-or-processes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threads-or-processes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threads-or-processes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threads-or-processes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threads-or-processes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .threads-or-processes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .threads-or-processes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .threads-or-processes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .threads-or-processes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .threads-or-processes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .threads-or-processes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .threads-or-processes-row { opacity: 1; }
    .threads-or-processes-r0 { animation-delay: 0.00s; }
    .threads-or-processes-r1 { animation-delay: 0.45s; }
    .threads-or-processes-r2 { animation-delay: 0.90s; }
    .threads-or-processes-r3 { animation-delay: 1.35s; }
    .threads-or-processes-r4 { animation-delay: 1.80s; }
    .threads-or-processes-row { animation: threads-or-processes-reveal 7.3s ease-in-out infinite; }
    @keyframes threads-or-processes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="threads-or-processes-bg" width="980" height="390"/>
  <text class="threads-or-processes-h1"  x="30" y="40">Which one your AI workload wants</text>
  <text class="threads-or-processes-sub" x="30" y="64">The answer follows from whether the work waits or computes.</text>
  <rect class="threads-or-processes-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="threads-or-processes-name" x="46" y="122">Reach for threads</text>
  <text class="threads-or-processes-desc" x="46" y="142">When the work is mostly waiting.</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r0" x="46" y="182">Fetching many URLs</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r1" x="46" y="216">Reading many files from disk</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r2" x="46" y="250">Feeding a GPU while it computes</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r3" x="46" y="284">Waits overlap; the GIL is released during them</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r4" x="46" y="318">Cheap to start, cheap to switch</text>
  <rect class="threads-or-processes-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="threads-or-processes-name" x="526" y="122">Reach for processes</text>
  <text class="threads-or-processes-desc" x="526" y="142">When the work is real computation.</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r0" x="526" y="182">CPU-bound preprocessing</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r1" x="526" y="216">Parallel tokenisation or feature extraction</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r2" x="526" y="250">Anything the GIL would serialise</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r3" x="526" y="284">Separate address spaces, explicit hand-offs</text>
  <text class="threads-or-processes-desc threads-or-processes-row threads-or-processes-r4" x="526" y="318">Safer: no shared state to race on</text>
  <text class="threads-or-processes-sub" x="30" y="372">This is why data loaders use worker processes rather than worker threads, and why the number of workers is tuned to cores rather than to files.</text>
</svg>
