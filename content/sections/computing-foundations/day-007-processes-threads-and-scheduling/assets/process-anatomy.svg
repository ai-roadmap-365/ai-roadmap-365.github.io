<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Your shell asks; the kernel assembles the whole kit.">
  <title>What the kernel builds when you run a command</title>
  <style>
    .process-anatomy-bg   { fill: #f8fafc; }
    .process-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .process-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .process-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .process-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .process-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .process-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .process-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .process-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .process-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .process-anatomy-stage { opacity: 1; }

    .process-anatomy-s0 { animation-delay: 0.00s; }
    .process-anatomy-e0 { animation-delay: 0.00s; }
    .process-anatomy-s1 { animation-delay: 1.33s; }
    .process-anatomy-e1 { animation-delay: 1.33s; }
    .process-anatomy-s2 { animation-delay: 2.67s; }
    .process-anatomy-e2 { animation-delay: 2.67s; }
    .process-anatomy-s3 { animation-delay: 4.00s; }
    .process-anatomy-e3 { animation-delay: 4.00s; }
    .process-anatomy-s4 { animation-delay: 5.33s; }
    .process-anatomy-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .process-anatomy-conn  { animation: process-anatomy-trace 8s ease-in-out infinite; }
      .process-anatomy-stage { animation: process-anatomy-arrive 8s ease-in-out infinite; }
    }
    @keyframes process-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes process-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .process-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .process-anatomy-stage { animation: process-anatomy-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes process-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="process-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="process-anatomy-bg" width="980" height="322"/>
  <text class="process-anatomy-h1"  x="30" y="40">What the kernel builds when you run a command</text>
  <text class="process-anatomy-sub" x="30" y="64">Your shell asks; the kernel assembles the whole kit.</text>
  <g class="process-anatomy-stage process-anatomy-s0">
    <rect class="process-anatomy-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="process-anatomy-step" x="44" y="142">01</text>
    <text class="process-anatomy-name" x="70" y="142">A fresh PID</text>
    <text class="process-anatomy-desc" x="44" y="166">The number everything</text>
    <text class="process-anatomy-desc" x="44" y="182">else will address it by.</text>
    <text class="process-anatomy-edge" x="44" y="242">pid 4812</text>
  </g>
  <line class="process-anatomy-line process-anatomy-conn process-anatomy-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#process-anatomy-tip)"/>
  <g class="process-anatomy-stage process-anatomy-s1">
    <rect class="process-anatomy-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="process-anatomy-step" x="233" y="142">02</text>
    <text class="process-anatomy-name" x="259" y="142">A private address space</text>
    <text class="process-anatomy-desc" x="233" y="166">The program's code and</text>
    <text class="process-anatomy-desc" x="233" y="182">its global data, mapped</text>
    <text class="process-anatomy-desc" x="233" y="198">for this process alone.</text>
  </g>
  <line class="process-anatomy-line process-anatomy-conn process-anatomy-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#process-anatomy-tip)"/>
  <g class="process-anatomy-stage process-anatomy-s2">
    <rect class="process-anatomy-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="process-anatomy-step" x="422" y="142">03</text>
    <text class="process-anatomy-name" x="448" y="142">A heap and a stack</text>
    <text class="process-anatomy-desc" x="422" y="166">Heap for memory requested</text>
    <text class="process-anatomy-desc" x="422" y="182">as it runs; one stack per</text>
    <text class="process-anatomy-desc" x="422" y="198">thread for function</text>
  </g>
  <line class="process-anatomy-line process-anatomy-conn process-anatomy-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#process-anatomy-tip)"/>
  <g class="process-anatomy-stage process-anatomy-s3">
    <rect class="process-anatomy-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="process-anatomy-step" x="611" y="142">04</text>
    <text class="process-anatomy-name" x="637" y="142">A file-handle table</text>
    <text class="process-anatomy-desc" x="611" y="166">Entries 0, 1 and 2 are</text>
    <text class="process-anatomy-desc" x="611" y="182">standard input, output</text>
    <text class="process-anatomy-desc" x="611" y="198">and error.</text>
    <text class="process-anatomy-edge" x="611" y="242">fd 0,1,2</text>
  </g>
  <line class="process-anatomy-line process-anatomy-conn process-anatomy-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#process-anatomy-tip)"/>
  <g class="process-anatomy-stage process-anatomy-s4">
    <rect class="process-anatomy-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="process-anatomy-step" x="800" y="142">05</text>
    <text class="process-anatomy-name" x="826" y="142">Its parent's PID</text>
    <text class="process-anatomy-desc" x="800" y="166">Which is why every</text>
    <text class="process-anatomy-desc" x="800" y="182">process but the first</text>
    <text class="process-anatomy-desc" x="800" y="198">sits in one giant family</text>
    <text class="process-anatomy-edge" x="800" y="242">ppid</text>
  </g>
  <text class="process-anatomy-sub" x="30" y="304">Run ps -o pid,ppid,command to see the tree on your own machine.</text>
</svg>
