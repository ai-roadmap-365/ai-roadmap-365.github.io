visuals:
  - id: process-lifecycle
    file: assets/process-lifecycle.svg
    type: diagram
    title: 'The process lifecycle'
    alt: 'State diagram: the process lifecycle from spawn through ready, running, and waiting to exit'
    description: 'A state diagram showing a process spawning, entering the ready queue, being dispatched to running, looping between running and ready as time slices expire, detouring to waiting while blocked on slow input or output, and finally exiting with an exit code — with the zombie state noted between exit and parental cleanup.'
  - id: scheduler-timeslices
    file: assets/scheduler-timeslices.svg
    type: diagram
    title: 'Time slices on one core'
    alt: 'Timeline: three processes sharing one CPU core through time slices and context switches'
    description: 'A timeline of one CPU core running processes A, B, and C in interleaved time slices a few milliseconds long, with thin context-switch markers between slices and a dashed stretch where process B waits on a disk read consuming no CPU, illustrating that only one process executes at any instant.'
  - id: process-state-machine
    file: assets/process-state-machine.svg
    type: diagram
    title: 'The process lifecycle'
    alt: 'Diagram: the states a process moves through, and what causes each transition'
    description: 'A state machine showing new, ready, running, waiting and exited, with the transition that causes each move: the scheduler picking a process, a time slice expiring, a slow request, and an event arriving. The running state is highlighted because it is the only one that consumes a core.'
  - id: process-anatomy
    file: assets/process-anatomy.svg
    type: diagram
    title: 'What the kernel builds when you run a command'
    alt: 'Diagram: the pieces the kernel creates for a new process'
    description: 'A five-stage sequence listing the parts of a new process: its process identifier, its private virtual address space with code, heap and stack, its file-handle table, and the record of its parent.'
  - id: process-versus-thread
    file: assets/process-versus-thread.svg
    type: diagram
    title: 'A process and a thread, side by side'
    alt: 'Diagram: a process compared with a thread'
    description: 'A two-column comparison of processes and threads covering what each owns, the cost of creating one, the cost of switching between them, how they share data, and what happens when one crashes.'
  - id: race-condition
    file: assets/race-condition.svg
    type: diagram
    title: 'How an increment goes missing'
    alt: 'Diagram: two threads incrementing a shared counter and losing one update'
    description: 'A five-stage sequence showing two threads each reading a shared counter at value 41, each adding one, and each writing 42, so that two increments produce a single increase and no error is raised.'
  - id: context-switch-cost
    file: assets/context-switch-cost.svg
    type: diagram
    title: 'What a context switch actually costs'
    alt: 'Diagram: the steps of a context switch and the overhead each adds'
    description: 'A five-stage sequence through a context switch: the timer interrupt, saving the outgoing thread''s registers, the scheduler''s choice, loading the incoming thread''s state, and the cache penalty the new thread inherits.'
  - id: signal-etiquette
    file: assets/signal-etiquette.svg
    type: diagram
    title: 'Ask politely, then insist'
    alt: 'Diagram: SIGTERM compared with SIGKILL'
    description: 'A two-column comparison of SIGTERM and SIGKILL covering whether the process can refuse, whether cleanup runs, the exit code each produces, and when each is appropriate.'
  - id: concurrency-versus-parallelism
    file: assets/concurrency-versus-parallelism.svg
    type: diagram
    title: 'Concurrency is not parallelism'
    alt: 'Diagram: concurrency compared with parallelism'
    description: 'A two-column comparison distinguishing concurrency, which is dealing with many tasks in overlapping periods, from parallelism, which is executing more than one task at the same physical instant.'
  - id: threads-or-processes
    file: assets/threads-or-processes.svg
    type: diagram
    title: 'Which one your AI workload wants'
    alt: 'Diagram: when to choose threads and when to choose processes'
    description: 'A two-column comparison giving the workloads suited to threads and those suited to processes, with the reason each choice follows from whether the work is waiting or computing.'
  - id: multiprogramming-history
    file: assets/multiprogramming-history.svg
    type: diagram
    title: 'Four ideas, in the order they were needed'
    alt: 'Diagram: the progression from batch processing to threads'
    description: 'A four-stage sequence from one-program-at-a-time batch machines through multiprogramming, preemptive time-sharing and threads, naming the failure each stage was invented to fix.'
