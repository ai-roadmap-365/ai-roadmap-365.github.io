visuals:
  - id: process-lifecycle
    file: assets/process-lifecycle.svg
    type: diagram
    title: 'The process lifecycle'
    alt: 'State diagram: the process lifecycle from spawn through ready, running, and waiting to exit'
    description: 'A state diagram showing a process spawning, entering the ready queue, being dispatched to running, looping between running and ready as time slices expire, detouring to waiting while blocked on slow input or output, and finally exiting with an exit code — with the zombie state noted between exit and parental cleanup.'
  - id: scheduler-timeslices
    file: assets/scheduler-timeslices.svg
    type: diagram
    title: 'Time slices on one core'
    alt: 'Timeline: three processes sharing one CPU core through time slices and context switches'
    description: 'A timeline of one CPU core running processes A, B, and C in interleaved time slices a few milliseconds long, with thin context-switch markers between slices and a dashed stretch where process B waits on a disk read consuming no CPU, illustrating that only one process executes at any instant.'
  - id: process-state-machine
    file: assets/process-state-machine.svg
    type: diagram
    title: 'The process lifecycle'
    alt: 'Diagram: the states a process moves through, and what causes each transition'
    description: 'A state machine showing new, ready, running, waiting and exited, with the transition that causes each move: the scheduler picking a process, a time slice expiring, a slow request, and an event arriving. The running state is highlighted because it is the only one that consumes a core.'
