id: D007
day: 7
slug: processes-threads-and-scheduling
title: 'Processes, Threads, and Scheduling'
section: computing-foundations
subsection: how-computers-work
week: 1
learning_promise: 'After this lesson you will be able to explain what a process really is, how the scheduler makes hundreds of programs share a few cores, and spawn, observe, and signal processes yourself from the shell.'
objectives:
  - 'Distinguish a program from a process, and name what every process owns: a PID, private memory, file handles, an owner, a parent, and an exit code'
  - 'Trace the process lifecycle — spawn, ready, running, waiting, exit — including where zombies come from and what exit codes mean'
  - 'Explain why threads are cheaper than processes and why shared memory makes them dangerous, including what a race condition is'
  - 'Describe how the scheduler uses time slices, preemption, and context switches to run hundreds of processes on a handful of cores'
  - 'Control processes from the shell: start background jobs with &, capture PIDs from $!, inspect with jobs and ps, and send signals with kill'
  - 'Distinguish concurrency from parallelism precisely and choose between threads and processes for a given kind of work'
  - 'Connect scheduling to AI practice: data-loader worker processes, GPU kernel queues, the GIL preview, and the batch throughput-versus-latency trade-off'
prerequisites:
  - 'Days 1–6 of this course, especially Day 6 (operating systems) — this lesson builds directly on the OS mental model'
  - 'A terminal on macOS or Linux (or WSL on Windows) for the hands-on exercise'
reading_time_minutes: 40
practical_time_minutes: 30
last_verified: '2026-07-12'
tags: [processes, threads, scheduling, operating-systems, foundations, shell]
