<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Everything after here assumes all of it.">
  <title>What this foundation is for</title>
  <style>
    .what-comes-next-bg   { fill: #f8fafc; }
    .what-comes-next-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-comes-next-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-comes-next-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-comes-next-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-comes-next-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-comes-next-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-comes-next-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .what-comes-next-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .what-comes-next-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .what-comes-next-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .what-comes-next-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .what-comes-next-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .what-comes-next-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .what-comes-next-stage { opacity: 1; }

    .what-comes-next-s0 { animation-delay: 0.00s; }
    .what-comes-next-e0 { animation-delay: 0.00s; }
    .what-comes-next-s1 { animation-delay: 1.28s; }
    .what-comes-next-e1 { animation-delay: 1.28s; }
    .what-comes-next-s2 { animation-delay: 2.56s; }
    .what-comes-next-e2 { animation-delay: 2.56s; }
    .what-comes-next-s3 { animation-delay: 3.84s; }
    .what-comes-next-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .what-comes-next-conn  { animation: what-comes-next-trace 6.4s ease-in-out infinite; }
      .what-comes-next-stage { animation: what-comes-next-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes what-comes-next-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes what-comes-next-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .what-comes-next-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .what-comes-next-stage { animation: what-comes-next-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes what-comes-next-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="what-comes-next-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="what-comes-next-bg" width="980" height="322"/>
  <text class="what-comes-next-h1"  x="30" y="40">What this foundation is for</text>
  <text class="what-comes-next-sub" x="30" y="64">Everything after here assumes all of it.</text>
  <g class="what-comes-next-stage what-comes-next-s0">
    <rect class="what-comes-next-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="what-comes-next-step" x="44" y="142">01</text>
    <text class="what-comes-next-name" x="70" y="142">Programming</text>
    <text class="what-comes-next-desc" x="44" y="166">Runs as a process, in an</text>
    <text class="what-comes-next-desc" x="44" y="182">environment, versioned in a</text>
    <text class="what-comes-next-desc" x="44" y="198">repository.</text>
    <text class="what-comes-next-edge" x="44" y="242">days 1-14</text>
  </g>
  <line class="what-comes-next-line what-comes-next-conn what-comes-next-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#what-comes-next-tip)"/>
  <g class="what-comes-next-stage what-comes-next-s1">
    <rect class="what-comes-next-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="what-comes-next-step" x="280" y="142">02</text>
    <text class="what-comes-next-name" x="306" y="142">Data work</text>
    <text class="what-comes-next-desc" x="280" y="166">Fetched over a network, parsed</text>
    <text class="what-comes-next-desc" x="280" y="182">from JSON, stored deliberately.</text>
    <text class="what-comes-next-edge" x="280" y="242">days 15-28</text>
  </g>
  <line class="what-comes-next-line what-comes-next-conn what-comes-next-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#what-comes-next-tip)"/>
  <g class="what-comes-next-stage what-comes-next-s2">
    <rect class="what-comes-next-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="what-comes-next-step" x="516" y="142">03</text>
    <text class="what-comes-next-name" x="542" y="142">Models</text>
    <text class="what-comes-next-desc" x="516" y="166">Trained by a scheduled job,</text>
    <text class="what-comes-next-desc" x="516" y="182">evaluated by a gated pipeline,</text>
    <text class="what-comes-next-desc" x="516" y="198">results tied to a commit.</text>
    <text class="what-comes-next-edge" x="516" y="242">days 29-41</text>
  </g>
  <line class="what-comes-next-line what-comes-next-conn what-comes-next-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#what-comes-next-tip)"/>
  <g class="what-comes-next-stage what-comes-next-s3">
    <rect class="what-comes-next-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="what-comes-next-step" x="752" y="142">04</text>
    <text class="what-comes-next-name" x="778" y="142">Deployment</text>
    <text class="what-comes-next-desc" x="752" y="166">An API, behind TLS,</text>
    <text class="what-comes-next-desc" x="752" y="182">rate-limited, observed,</text>
    <text class="what-comes-next-desc" x="752" y="198">automated.</text>
    <text class="what-comes-next-edge" x="752" y="242">all of it</text>
  </g>
  <text class="what-comes-next-sub" x="30" y="304">None of the later courses will re-explain a process, a request, or a commit. That is what a foundation is for — and it is why the gaps you find today are worth closing today.</text>
</svg>
