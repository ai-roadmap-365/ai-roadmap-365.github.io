<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And that is the correct outcome.">
  <title>You have the map, not the contents</title>
  <style>
    .map-not-contents-bg   { fill: #f8fafc; }
    .map-not-contents-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-not-contents-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-not-contents-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-not-contents-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-not-contents-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-not-contents-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-not-contents-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .map-not-contents-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .map-not-contents-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .map-not-contents-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .map-not-contents-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .map-not-contents-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-not-contents-row { opacity: 1; }
    .map-not-contents-r0 { animation-delay: 0.00s; }
    .map-not-contents-r1 { animation-delay: 0.45s; }
    .map-not-contents-r2 { animation-delay: 0.90s; }
    .map-not-contents-r3 { animation-delay: 1.35s; }
    .map-not-contents-r4 { animation-delay: 1.80s; }
    .map-not-contents-row { animation: map-not-contents-reveal 7.3s ease-in-out infinite; }
    @keyframes map-not-contents-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="map-not-contents-bg" width="980" height="390"/>
  <text class="map-not-contents-h1"  x="30" y="40">You have the map, not the contents</text>
  <text class="map-not-contents-sub" x="30" y="64">And that is the correct outcome.</text>
  <rect class="map-not-contents-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="map-not-contents-name" x="46" y="122">What you have</text>
  <text class="map-not-contents-desc" x="46" y="142">Structure.</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r0" x="46" y="182">You know which layer to look at</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r1" x="46" y="216">You know what to search for</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r2" x="46" y="250">You can read an unfamiliar README</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r3" x="46" y="284">You can judge a trade-off</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r4" x="46" y="318">You can look inside every step</text>
  <rect class="map-not-contents-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="map-not-contents-name" x="526" y="122">What you do not</text>
  <text class="map-not-contents-desc" x="526" y="142">And do not need.</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r0" x="526" y="182">Every flag of every command</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r1" x="526" y="216">Regex syntax from memory</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r2" x="526" y="250">SQL syntax from memory</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r3" x="526" y="284">Which header a given API wants</text>
  <text class="map-not-contents-desc map-not-contents-row map-not-contents-r4" x="526" y="318">You will look these up forever</text>
  <text class="map-not-contents-sub" x="30" y="372">Not knowing a flag is a ten-second lookup. Not knowing which layer a problem lives in is an afternoon. The foundation is entirely on the second side of that line.</text>
</svg>
