<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" font-family="system-ui, sans-serif">
  <title>A single action — calling an API and storing the result — traced through every layer of Course 1: you type a command in the shell, it runs as a process on the machine, opens a network connection, sends an HTTP request to an API, stores the result, is observable in logs, and is versioned and automated</title>
  <rect x="0" y="0" width="760" height="620" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One action through the whole stack</text>
  <text x="380" y="58" text-anchor="middle" font-size="15" fill="#1a202c">Task: fetch data from an API and save it to a database</text>

  <!-- Step 1 -->
  <rect x="140" y="76" width="480" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. You type a command in the shell</text>
  <text x="380" y="118" text-anchor="middle" font-size="14" fill="#1a202c">Command line — Days 8-14</text>

  <!-- Step 2 -->
  <rect x="140" y="148" width="480" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. It runs as a process on the machine</text>
  <text x="380" y="190" text-anchor="middle" font-size="14" fill="#1a202c">The machine — Days 1-7</text>

  <!-- Step 3 -->
  <rect x="140" y="220" width="480" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. It opens a network connection (DNS, TCP, TLS)</text>
  <text x="380" y="262" text-anchor="middle" font-size="14" fill="#1a202c">The internet — Days 15-21</text>

  <!-- Step 4 -->
  <rect x="140" y="292" width="480" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. It sends an HTTP request to an API</text>
  <text x="380" y="334" text-anchor="middle" font-size="14" fill="#1a202c">APIs — Days 22-28</text>

  <!-- Step 5 -->
  <rect x="140" y="364" width="480" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5. It stores the result in a database</text>
  <text x="380" y="406" text-anchor="middle" font-size="14" fill="#1a202c">Storage — Day 39</text>

  <!-- Step 6 -->
  <rect x="140" y="436" width="480" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">6. You can see what happened in the logs</text>
  <text x="380" y="478" text-anchor="middle" font-size="14" fill="#1a202c">Observability — Day 40</text>

  <!-- Step 7 -->
  <rect x="140" y="508" width="480" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="530" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">7. All of it is versioned and automated</text>
  <text x="380" y="550" text-anchor="middle" font-size="14" fill="#1a202c">Git &amp; automation — Days 29-35, 41</text>

  <!-- Down arrows -->
  <g stroke="#1d4ed8" stroke-width="3" fill="#1d4ed8">
    <line x1="380" y1="128" x2="380" y2="146"/><polygon points="380,148 373,136 387,136"/>
    <line x1="380" y1="200" x2="380" y2="218"/><polygon points="380,220 373,208 387,208"/>
    <line x1="380" y1="272" x2="380" y2="290"/><polygon points="380,292 373,280 387,280"/>
    <line x1="380" y1="344" x2="380" y2="362"/><polygon points="380,364 373,352 387,352"/>
    <line x1="380" y1="416" x2="380" y2="434"/><polygon points="380,436 373,424 387,424"/>
    <line x1="380" y1="488" x2="380" y2="506"/><polygon points="380,508 373,496 387,496"/>
  </g>

  <text x="380" y="600" text-anchor="middle" font-size="15" fill="#1a202c">One command · seven lessons · five of your six areas · in a heartbeat.</text>
</svg>
