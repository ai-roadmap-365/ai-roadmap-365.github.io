<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Everything in this section, arranged as a single request passing through it.">
  <title>One command, six areas, in the order they engage</title>
  <style>
    .section-map-bg   { fill: #f8fafc; }
    .section-map-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .section-map-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .section-map-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .section-map-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .section-map-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .section-map-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .section-map-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .section-map-tok { animation: section-map-travel 7s ease-in-out infinite; }
    }
    @keyframes section-map-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--section-map-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .section-map-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="section-map-bg" width="980" height="334"/>
  <text class="section-map-h1"  x="30" y="40">One command, six areas, in the order they engage</text>
  <text class="section-map-sub" x="30" y="64">Everything in this section, arranged as a single request passing through it.</text>
  <rect class="section-map-box" x="30" y="132" width="135" height="96" rx="9"/>
  <text class="section-map-name" x="44" y="160">The command line</text>
  <text class="section-map-desc" x="44" y="182">Days 8-14. The shell</text>
  <text class="section-map-desc" x="44" y="198">parses your line and</text>
  <text class="section-map-desc" x="44" y="214">launches a program.</text>
  <text class="section-map-edge" x="44" y="248">shell</text>
  <line class="section-map-line" x1="168" y1="180" x2="184" y2="180"/>
  <rect class="section-map-box" x="187" y="132" width="135" height="96" rx="9"/>
  <text class="section-map-name" x="201" y="160">The machine</text>
  <text class="section-map-desc" x="201" y="182">Days 1-7. It becomes</text>
  <text class="section-map-desc" x="201" y="198">a process, using</text>
  <text class="section-map-desc" x="201" y="214">CPU, memory and</text>
  <text class="section-map-edge" x="201" y="248">OS</text>
  <line class="section-map-line" x1="325" y1="180" x2="341" y2="180"/>
  <rect class="section-map-box" x="344" y="132" width="135" height="96" rx="9"/>
  <text class="section-map-name" x="358" y="160">The network</text>
  <text class="section-map-desc" x="358" y="182">Days 15-21. DNS,</text>
  <text class="section-map-desc" x="358" y="198">TCP, TLS, HTTP carry</text>
  <text class="section-map-desc" x="358" y="214">the request out.</text>
  <text class="section-map-edge" x="358" y="248">four layers</text>
  <line class="section-map-line" x1="482" y1="180" x2="498" y2="180"/>
  <rect class="section-map-box" x="501" y="132" width="135" height="96" rx="9"/>
  <text class="section-map-name" x="515" y="160">The API</text>
  <text class="section-map-desc" x="515" y="182">Days 22-28. A</text>
  <text class="section-map-desc" x="515" y="198">contract answers, in</text>
  <text class="section-map-desc" x="515" y="214">JSON, with a status</text>
  <text class="section-map-edge" x="515" y="248">REST</text>
  <line class="section-map-line" x1="639" y1="180" x2="655" y2="180"/>
  <rect class="section-map-box" x="658" y="132" width="135" height="96" rx="9"/>
  <text class="section-map-name" x="672" y="160">Storage</text>
  <text class="section-map-desc" x="672" y="182">Days 39-40. The</text>
  <text class="section-map-desc" x="672" y="198">result lands</text>
  <text class="section-map-desc" x="672" y="214">somewhere, and is</text>
  <text class="section-map-edge" x="672" y="248">four shapes</text>
  <line class="section-map-line" x1="796" y1="180" x2="812" y2="180"/>
  <rect class="section-map-hi" x="815" y="132" width="135" height="96" rx="9"/>
  <text class="section-map-name" x="829" y="160">Version control</text>
  <text class="section-map-desc" x="829" y="182">Days 29-35. The code</text>
  <text class="section-map-desc" x="829" y="198">that did it is</text>
  <text class="section-map-desc" x="829" y="214">recoverable.</text>
  <text class="section-map-edge" x="829" y="248">git</text>
  <rect class="section-map-tok" x="34" y="106" width="58" height="14" rx="3" style="--section-map-run: 785px"/>
  <text class="section-map-sub" x="30" y="314">Python arrives tomorrow and will be installed by a package manager, run from a terminal, and committed to git. None of that is explained again.</text>
</svg>
