<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Everything in this section, arranged as a single request passing through it.">
  <title>One command, six areas, in the order they engage</title>
  <style>
    .section-map-bg   { fill: #f8fafc; }
    .section-map-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .section-map-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .section-map-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .section-map-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .section-map-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .section-map-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .section-map-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .section-map-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .section-map-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .section-map-stage { opacity: 1; }

    .section-map-s0 { animation-delay: 0.00s; }
    .section-map-e0 { animation-delay: 0.00s; }
    .section-map-s1 { animation-delay: 1.37s; }
    .section-map-e1 { animation-delay: 1.37s; }
    .section-map-s2 { animation-delay: 2.74s; }
    .section-map-e2 { animation-delay: 2.74s; }
    .section-map-s3 { animation-delay: 4.11s; }
    .section-map-e3 { animation-delay: 4.11s; }
    .section-map-s4 { animation-delay: 5.49s; }
    .section-map-e4 { animation-delay: 5.49s; }
    .section-map-s5 { animation-delay: 6.86s; }
    .section-map-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .section-map-conn  { animation: section-map-trace 9.600000000000001s ease-in-out infinite; }
      .section-map-stage { animation: section-map-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes section-map-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes section-map-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .section-map-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .section-map-stage { animation: section-map-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes section-map-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="section-map-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="section-map-bg" width="980" height="322"/>
  <text class="section-map-h1"  x="30" y="40">One command, six areas, in the order they engage</text>
  <text class="section-map-sub" x="30" y="64">Everything in this section, arranged as a single request passing through it.</text>
  <g class="section-map-stage section-map-s0">
    <rect class="section-map-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="section-map-step" x="44" y="142">01</text>
    <text class="section-map-name" x="70" y="142">The command line</text>
    <text class="section-map-desc" x="44" y="166">Days 8-14. The shell</text>
    <text class="section-map-desc" x="44" y="182">parses your line and</text>
    <text class="section-map-desc" x="44" y="198">launches a program.</text>
    <text class="section-map-edge" x="44" y="242">shell</text>
  </g>
  <line class="section-map-line section-map-conn section-map-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#section-map-tip)"/>
  <g class="section-map-stage section-map-s1">
    <rect class="section-map-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="section-map-step" x="201" y="142">02</text>
    <text class="section-map-name" x="227" y="142">The machine</text>
    <text class="section-map-desc" x="201" y="166">Days 1-7. It becomes</text>
    <text class="section-map-desc" x="201" y="182">a process, using</text>
    <text class="section-map-desc" x="201" y="198">CPU, memory and</text>
    <text class="section-map-edge" x="201" y="242">OS</text>
  </g>
  <line class="section-map-line section-map-conn section-map-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#section-map-tip)"/>
  <g class="section-map-stage section-map-s2">
    <rect class="section-map-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="section-map-step" x="358" y="142">03</text>
    <text class="section-map-name" x="384" y="142">The network</text>
    <text class="section-map-desc" x="358" y="166">Days 15-21. DNS,</text>
    <text class="section-map-desc" x="358" y="182">TCP, TLS, HTTP carry</text>
    <text class="section-map-desc" x="358" y="198">the request out.</text>
    <text class="section-map-edge" x="358" y="242">four layers</text>
  </g>
  <line class="section-map-line section-map-conn section-map-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#section-map-tip)"/>
  <g class="section-map-stage section-map-s3">
    <rect class="section-map-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="section-map-step" x="515" y="142">04</text>
    <text class="section-map-name" x="541" y="142">The API</text>
    <text class="section-map-desc" x="515" y="166">Days 22-28. A</text>
    <text class="section-map-desc" x="515" y="182">contract answers, in</text>
    <text class="section-map-desc" x="515" y="198">JSON, with a status</text>
    <text class="section-map-edge" x="515" y="242">REST</text>
  </g>
  <line class="section-map-line section-map-conn section-map-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#section-map-tip)"/>
  <g class="section-map-stage section-map-s4">
    <rect class="section-map-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="section-map-step" x="672" y="142">05</text>
    <text class="section-map-name" x="698" y="142">Storage</text>
    <text class="section-map-desc" x="672" y="166">Days 39-40. The</text>
    <text class="section-map-desc" x="672" y="182">result lands</text>
    <text class="section-map-desc" x="672" y="198">somewhere, and is</text>
    <text class="section-map-edge" x="672" y="242">four shapes</text>
  </g>
  <line class="section-map-line section-map-conn section-map-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#section-map-tip)"/>
  <g class="section-map-stage section-map-s5">
    <rect class="section-map-hi" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="section-map-step" x="829" y="142">06</text>
    <text class="section-map-name" x="855" y="142">Version control</text>
    <text class="section-map-desc" x="829" y="166">Days 29-35. The code</text>
    <text class="section-map-desc" x="829" y="182">that did it is</text>
    <text class="section-map-desc" x="829" y="198">recoverable.</text>
    <text class="section-map-edge" x="829" y="242">git</text>
  </g>
  <text class="section-map-sub" x="30" y="304">Python arrives tomorrow and will be installed by a package manager, run from a terminal, and committed to git. None of that is explained again.</text>
</svg>
