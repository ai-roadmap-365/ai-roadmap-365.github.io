questions:
  - question: 'Course 1 taught six connected areas. Which two of them "wrap" the whole stack rather than sitting at a single layer?'
    options:
      - 'The machine and the command line'
      - 'The internet and APIs'
      - 'Git/GitHub and systems foundations (storage, observability, automation)'
      - 'The command line and the internet'
    answer_index: 2
    explanation: 'You version, observe, and automate at every layer, so git/GitHub (days 29-35) and the systems foundations (days 36-41) wrap the entire stack instead of occupying one layer of it.'

  - question: 'When you trace "fetch data from an API and save it to a database" through the stack, in which order do the layers engage?'
    options:
      - 'Network connection, then shell command, then process on the machine, then storage'
      - 'Shell command, then process on the machine, then network connection, then HTTP request to the API, then storage'
      - 'HTTP request, then storage, then shell command, then the machine'
      - 'Storage, then the API, then the network, then the shell'
    answer_index: 1
    explanation: 'You type a command in the shell (8-14); it runs as a process on the machine (1-7); the process opens a network connection (15-21); it sends an HTTP request to the API (22-28); then the result is stored (39). The action moves from your keyboard down and out through the layers.'

  - question: 'A script reports it cannot connect to a host. Following the Course 1 foundation, what is the first layer to check?'
    options:
      - 'Whether the database schema is correct'
      - 'Whether the name resolves to an IP address (DNS)'
      - 'Whether the git history is clean'
      - 'Whether the code has a linter warning'
    answer_index: 1
    explanation: 'Cannot-connect problems are networking problems first. You check name resolution (DNS, Day 16), then the connection and port (Day 17), then the HTTP status (Day 18) — naming the layer before touching the code.'

  - question: 'An HTTP response comes back with status 401 when your script calls an API. What does the foundation tell you it most likely means?'
    options:
      - 'The server is rate-limiting you; slow down'
      - 'The resource path is wrong; the endpoint does not exist'
      - 'Your API key or token is missing or invalid (an authentication problem)'
      - 'The JSON body is malformed'
    answer_index: 2
    explanation: 'A 401 is an authentication failure (Day 25): the key or token is wrong or missing. A 429 would be a rate limit (Day 27) and a 404 a wrong resource path (Day 23) — knowing the status codes turns a vague failure into a precise fix.'

  - question: 'Why does this course teach six weeks of foundations before you write a single line of Python?'
    options:
      - 'Because Python is too hard to learn without a computer science degree'
      - 'Because everything ahead depends on this foundation, so teaching it first means nothing later has to be presented as magic'
      - 'Because the foundations are more important than Python and you will rarely use Python'
      - 'Because employers require a certificate in each area before hiring'
    answer_index: 1
    explanation: 'The foundation is a dependency for everything ahead: learn the shell, HTTP, git, and debugging first and their Python equivalents become obvious rather than magical. The ordering removes magic from the rest of the course.'

  - question: 'A teammate accidentally committed an API key to a shared repository. Drawing on the git and API weeks, what must happen?'
    options:
      - 'Nothing — committed keys are automatically encrypted by git'
      - 'The key must be treated as compromised and rotated, and it must be removed from the repository going forward'
      - 'Delete the whole repository and start over'
      - 'Only make the repository private; the key is then safe'
    answer_index: 1
    explanation: 'A secret in version control should be assumed exposed (Days 25, 30): rotate/revoke the key with the provider and remove it from the tracked files. Making a repo private later does not undo the exposure — the key must be rotated.'

  - question: 'Your program runs slowly even though the CPU is barely busy. Which Course 1 ideas best explain where to look?'
    options:
      - 'Only the choice of programming language matters for speed'
      - 'The memory hierarchy and the storage/network layers — slow systems are usually waiting on data, not computing, and observability helps you find where'
      - 'Slow runs are always caused by a git merge conflict'
      - 'The regular-expression engine is the only possible bottleneck'
    answer_index: 1
    explanation: 'Slow-but-idle usually means waiting, not computing: the memory hierarchy (Day 3), storage choices (Day 39), and network round trips (Days 15-17) are the usual culprits, and observability (Day 40) is how you find the actual slow layer instead of guessing.'

  - question: 'What is the single most valuable habit to carry out of Course 1 when something breaks?'
    options:
      - 'Immediately rewrite the whole program from scratch'
      - 'Retype the failing command repeatedly until it works'
      - 'Name the layer the problem lives in before touching anything — is it networking, version control, memory/storage, or observability?'
      - 'Assume the tool is broken and switch to a different one'
    answer_index: 2
    explanation: 'The foundation turns confusion into a plan: asking "which layer is this?" narrows a vague failure to a specific area with its own tools and concepts, which is the fastest route to a real fix.'
