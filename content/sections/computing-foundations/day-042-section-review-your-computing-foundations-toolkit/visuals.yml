visuals:
  - id: foundations-map
    file: assets/foundations-map.svg
    type: diagram
    title: 'Your computing foundations: six connected domains'
    alt: 'Diagram: the six domains of your computing foundations as one connected system'
    description: 'An architecture diagram showing the machine (days 1-7) at the center, wrapped by the command line (8-14), the internet (15-21), and APIs (22-28) as expanding layers, with git/GitHub (29-35) and systems foundations (36-41) drawn as a dashed wrapper that applies at every layer.'
  - id: stack-journey
    file: assets/stack-journey.svg
    type: flowchart
    title: 'One action through the whole stack'
    alt: 'Flowchart: a single action — calling an API and storing the result — traced through every layer you learned'
    description: 'A flow diagram tracing one task — fetch data from an API and save it to a database — through seven steps: typing a shell command, running as a process on the machine, opening a network connection, sending an HTTP request to an API, storing the result, seeing it in logs, and versioning and automating the whole thing.'
  - id: section-map
    file: assets/section-map.svg
    type: diagram
    title: 'One command, six areas, in the order they engage'
    alt: 'Diagram: the six areas of Computing Foundations as stages of one request'
    description: 'A six-stage sequence mapping the section''s areas onto one command: the shell parses it, the machine runs it as a process, the network carries it, an API answers it, storage holds the result, and version control records the code that did it.'
  - id: six-weeks-one-system
    file: assets/six-weeks-one-system.svg
    type: diagram
    title: 'Four layers that stack, two that wrap'
    alt: 'Diagram: how the six areas of the section relate to each other'
    description: 'A four-stage progression up the stack from the machine through the command line and the internet to APIs, noting that version control and daily craft apply at every layer rather than sitting on top.'
  - id: abstraction-throughline
    file: assets/abstraction-throughline.svg
    type: diagram
    title: 'Every layer exists to hide the one below'
    alt: 'Diagram: what each layer of abstraction hides and when it leaks'
    description: 'A two-column comparison of what abstraction layers successfully hide against the situations in which each becomes visible again.'
  - id: name-the-layer
    file: assets/name-the-layer.svg
    type: diagram
    title: 'Name the layer before changing anything'
    alt: 'Diagram: the ordered questions for locating a problem by layer'
    description: 'A five-stage diagnostic ordering for locating a fault by layer, from the machine''s resources through the environment, the network, the protocol and the application.'
  - id: recurring-rules
    file: assets/recurring-rules.svg
    type: diagram
    title: 'The rules that appeared in every week'
    alt: 'Diagram: the principles that recurred across the whole section'
    description: 'A two-column presentation of the recurring principles of the section, pairing each rule with the days on which it appeared.'
  - id: map-not-contents
    file: assets/map-not-contents.svg
    type: diagram
    title: 'You have the map, not the contents'
    alt: 'Diagram: what a foundation gives you compared with what it does not'
    description: 'A two-column comparison of what this foundation provides against what it deliberately does not, distinguishing structural understanding from memorised detail.'
  - id: where-ai-fails
    file: assets/where-ai-fails.svg
    type: diagram
    title: 'AI failures are foundations failures'
    alt: 'Diagram: where AI systems actually fail compared with where people look'
    description: 'A two-column comparison of where practitioners tend to look when an AI system fails against where the causes usually are, mapped to the lessons that cover them.'
  - id: what-comes-next
    file: assets/what-comes-next.svg
    type: diagram
    title: 'What this foundation is for'
    alt: 'Diagram: how the foundation supports the work that follows'
    description: 'A four-stage progression showing how the section''s foundations underpin subsequent work in programming, data, models and deployment.'
  - id: trace-your-own
    file: assets/trace-your-own.svg
    type: diagram
    title: 'The exercise that proves you have it'
    alt: 'Diagram: how to test your own understanding of the stack'
    description: 'A four-stage self-assessment procedure asking the learner to trace a familiar command through the layers and identify which steps they cannot yet explain.'
