visuals:
  - id: foundations-map
    file: assets/foundations-map.svg
    type: diagram
    title: 'Your computing foundations: six connected domains'
    alt: 'Diagram: the six domains of your computing foundations as one connected system'
    description: 'An architecture diagram showing the machine (days 1-7) at the center, wrapped by the command line (8-14), the internet (15-21), and APIs (22-28) as expanding layers, with git/GitHub (29-35) and systems foundations (36-41) drawn as a dashed wrapper that applies at every layer.'
  - id: stack-journey
    file: assets/stack-journey.svg
    type: flowchart
    title: 'One action through the whole stack'
    alt: 'Flowchart: a single action — calling an API and storing the result — traced through every layer you learned'
    description: 'A flow diagram tracing one task — fetch data from an API and save it to a database — through seven steps: typing a shell command, running as a process on the machine, opening a network connection, sending an HTTP request to an API, storing the result, seeing it in logs, and versioning and automating the whole thing.'
  - id: section-map
    file: assets/section-map.svg
    type: diagram
    title: 'One command, six areas, in the order they engage'
    alt: 'Diagram: the six areas of Computing Foundations as stages of one request'
    description: 'A six-stage sequence mapping the section''s areas onto one command: the shell parses it, the machine runs it as a process, the network carries it, an API answers it, storage holds the result, and version control records the code that did it.'
