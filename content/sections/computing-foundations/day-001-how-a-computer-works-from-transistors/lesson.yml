week: 1
learning_promise: 'After this lesson you will be able to explain, layer by layer, how billions of on/off switches become running programs — and use that mental model to reason about AI hardware, memory limits, and cost.'
objectives:
  - 'Explain how transistors combine into logic gates, and logic gates into circuits that add and remember, without appealing to any "magic" layer'
  - 'Describe the von Neumann architecture and why the stored-program idea makes one machine general-purpose'
  - 'Trace the fetch-decode-execute cycle step by step for a concrete ADD instruction, including the role of the program counter'
  - 'Rank the levels of the memory hierarchy by approximate latency and state the speed/size/cost trade-off that creates it'
  - 'Measure your own machine''s CPU model, core count, RAM, disk space, and OS version from the terminal and place each in the layered stack'
  - 'Connect the memory hierarchy to AI practice: explain why model weights must fit in GPU memory and why quantization reduces memory footprint'
prerequisites:
  - 'A computer running macOS, Linux, or Windows with permission to open a terminal'
  - 'No prior programming or hardware knowledge — this is Day 1'
