terms:
  - term: transistor
    definition: 'A microscopic electrical switch with no moving parts whose on/off state is the physical basis of all digital computing.'
  - term: logic gate
    definition: 'A small circuit built from transistors that computes a simple rule, such as AND (output on only if both inputs are on), OR, or NOT.'
  - term: binary
    definition: 'A way of writing numbers and encoding all data using only two digits, 0 and 1, which map directly onto a switch''s off and on states.'
  - term: bit
    definition: 'The smallest unit of information, a single 0 or 1.'
  - term: byte
    definition: 'A group of 8 bits, enough to store one of 256 possible values, such as a single ASCII character.'
  - term: CPU
    definition: 'The central processing unit, the chip that executes program instructions one after another by repeating the fetch-decode-execute cycle.'
  - term: register
    definition: 'One of a small set of ultra-fast storage slots inside the CPU that hold the values being worked on at this instant.'
  - term: RAM
    definition: 'Random-access memory, the computer''s fast temporary workspace that holds running programs and their data and is emptied when power is cut.'
  - term: cache
    definition: 'Small, very fast memory on the CPU chip that keeps recently used data close to the processor so it rarely has to wait on slower RAM.'
  - term: machine code
    definition: 'The raw binary instructions a CPU executes directly, the lowest-level form of any program.'
  - term: operating system
    definition: 'The master program that manages the hardware, shares the CPU and memory among running programs, and handles all input and output.'
  - term: memory hierarchy
    definition: 'The layered arrangement of storage from registers through cache and RAM to disk, trading speed against size and cost per byte at each level.'
