visuals:
  - id: layers-of-computing
    file: assets/layers-of-computing.svg
    type: diagram
    title: 'The layers of computing'
    alt: 'Diagram: the layers of computing, from transistors to applications'
    description: 'A vertical stack showing how transistors form logic gates, gates form the CPU and memory, the CPU runs machine code, the operating system manages it all, and applications sit on top, with each layer hiding the details of the one below.'
  - id: fetch-decode-execute
    file: assets/fetch-decode-execute.svg
    type: flowchart
    title: 'The fetch-decode-execute cycle'
    alt: 'Flowchart: the fetch-decode-execute cycle'
    description: 'The four-step loop every CPU repeats — fetch an instruction from memory, decode it in the control unit, execute it in the ALU, write the result back — with the program counter tracking the address of the next instruction.'
  - id: memory-hierarchy
    file: assets/memory-hierarchy.svg
    type: diagram
    title: 'The memory hierarchy'
    alt: 'Diagram: the memory hierarchy trade-off between speed, size, and cost'
    description: 'A pyramid from registers at the fast, tiny, expensive top through cache, RAM, and SSD down to vast but slow network storage, showing that speed and capacity pull in opposite directions.'
