visuals:
  - id: layers-of-computing
    file: assets/layers-of-computing.svg
    type: diagram
    title: 'The layers of computing'
    alt: 'Diagram: the layers of computing, from transistors to applications'
    description: 'A vertical stack showing how transistors form logic gates, gates form the CPU and memory, the CPU runs machine code, the operating system manages it all, and applications sit on top, with each layer hiding the details of the one below.'
  - id: fetch-decode-execute
    file: assets/fetch-decode-execute.svg
    type: flowchart
    title: 'The fetch-decode-execute cycle'
    alt: 'Flowchart: the fetch-decode-execute cycle'
    description: 'The four-step loop every CPU repeats — fetch an instruction from memory, decode it in the control unit, execute it in the ALU, write the result back — with the program counter tracking the address of the next instruction.'
  - id: memory-hierarchy
    file: assets/memory-hierarchy.svg
    type: diagram
    title: 'The memory hierarchy'
    alt: 'Diagram: the memory hierarchy trade-off between speed, size, and cost'
    description: 'A pyramid from registers at the fast, tiny, expensive top through cache, RAM, and SSD down to vast but slow network storage, showing that speed and capacity pull in opposite directions.'
  - id: abstraction-ladder
    file: assets/abstraction-ladder.svg
    type: diagram
    title: 'From a switch to a running program'
    alt: 'Diagram: the ladder of abstraction from transistor to running program'
    description: 'A five-stage sequence showing how a transistor becomes a logic gate, gates become an adder, adders and registers become a processor, and a processor running stored instructions becomes a program.'
  - id: why-gpus-run-ai
    file: assets/why-gpus-run-ai.svg
    type: diagram
    title: 'The same transistor budget, spent two ways'
    alt: 'Diagram: how a CPU and a GPU spend the same transistor budget differently'
    description: 'A two-column comparison of how a CPU and a GPU allocate silicon: the CPU to a few complex cores with large caches and branch prediction, the GPU to thousands of simple arithmetic cores.'
  - id: launching-an-application
    file: assets/launching-an-application.svg
    type: diagram
    title: 'What a double-click actually sets off'
    alt: 'Diagram: the stages of launching an application from storage to running'
    description: 'A five-stage sequence from reading machine code off storage into RAM, through the processor fetching instructions, caches filling, and the operating system interleaving the process with others.'
  - id: which-layer-to-work-at
    file: assets/which-layer-to-work-at.svg
    type: diagram
    title: 'Work at the highest layer that solves the problem'
    alt: 'Diagram: when to reason about hardware and when to ignore it'
    description: 'A two-column comparison of when the hardware model is the right tool and when it is a distraction, with the rule that measurement decides.'
  - id: transistor-to-arithmetic
    file: assets/transistor-to-arithmetic.svg
    type: diagram
    title: 'Arithmetic is a shape, not an ability'
    alt: 'Diagram: how switches become gates, gates become adders, and loops become memory'
    description: 'A four-stage sequence showing a transistor as a switch, transistors wired into a logic gate, gates cascaded into an adder, and gates looped back on themselves to hold state as a memory cell.'
  - id: ram-versus-storage
    file: assets/ram-versus-storage.svg
    type: diagram
    title: 'The two that get confused most often'
    alt: 'Diagram: RAM compared with storage'
    description: 'A two-column comparison of RAM and storage covering speed, persistence, typical size and what each is for.'
