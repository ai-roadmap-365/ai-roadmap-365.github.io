<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Mixing these up is how people buy the wrong upgrade.">
  <title>The two that get confused most often</title>
  <style>
    .ram-versus-storage-bg   { fill: #f8fafc; }
    .ram-versus-storage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ram-versus-storage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ram-versus-storage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ram-versus-storage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ram-versus-storage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ram-versus-storage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ram-versus-storage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ram-versus-storage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ram-versus-storage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ram-versus-storage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ram-versus-storage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ram-versus-storage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ram-versus-storage-row { opacity: 1; }
    .ram-versus-storage-r0 { animation-delay: 0.00s; }
    .ram-versus-storage-r1 { animation-delay: 0.45s; }
    .ram-versus-storage-r2 { animation-delay: 0.90s; }
    .ram-versus-storage-r3 { animation-delay: 1.35s; }
    .ram-versus-storage-r4 { animation-delay: 1.80s; }
    .ram-versus-storage-row { animation: ram-versus-storage-reveal 7.3s ease-in-out infinite; }
    @keyframes ram-versus-storage-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ram-versus-storage-bg" width="980" height="390"/>
  <text class="ram-versus-storage-h1"  x="30" y="40">The two that get confused most often</text>
  <text class="ram-versus-storage-sub" x="30" y="64">Mixing these up is how people buy the wrong upgrade.</text>
  <rect class="ram-versus-storage-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ram-versus-storage-name" x="46" y="122">RAM (memory)</text>
  <text class="ram-versus-storage-desc" x="46" y="142">Fast, temporary</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r0" x="46" y="182">About 100 nanoseconds to reach</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r1" x="46" y="216">Empties completely at power-off</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r2" x="46" y="250">Usually 8-32 GB on a laptop</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r3" x="46" y="284">Holds what is running right now</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r4" x="46" y="318">The counter you are working on</text>
  <rect class="ram-versus-storage-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ram-versus-storage-name" x="526" y="122">Storage (SSD)</text>
  <text class="ram-versus-storage-desc" x="526" y="142">Slow, permanent</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r0" x="526" y="182">About 100 microseconds — a thousand times slower</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r1" x="526" y="216">Survives power-off</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r2" x="526" y="250">Usually 256 GB - 2 TB</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r3" x="526" y="284">Holds everything, whether running or not</text>
  <text class="ram-versus-storage-desc ram-versus-storage-row ram-versus-storage-r4" x="526" y="318">The warehouse across town</text>
  <text class="ram-versus-storage-sub" x="30" y="372">The '512 GB' on a laptop box is almost always storage. A model's weights have to fit in the left column to run fast.</text>
</svg>
