<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="This is why AI runs on GPUs — a fact about hardware, not a fashion in software.">
  <title>The same transistor budget, spent two ways</title>
  <style>
    .why-gpus-run-ai-bg   { fill: #f8fafc; }
    .why-gpus-run-ai-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gpus-run-ai-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gpus-run-ai-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gpus-run-ai-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gpus-run-ai-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gpus-run-ai-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-gpus-run-ai-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-gpus-run-ai-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-gpus-run-ai-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-gpus-run-ai-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-gpus-run-ai-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-gpus-run-ai-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-gpus-run-ai-row { opacity: 1; }
    .why-gpus-run-ai-r0 { animation-delay: 0.00s; }
    .why-gpus-run-ai-r1 { animation-delay: 0.45s; }
    .why-gpus-run-ai-r2 { animation-delay: 0.90s; }
    .why-gpus-run-ai-r3 { animation-delay: 1.35s; }
    .why-gpus-run-ai-r4 { animation-delay: 1.80s; }
    .why-gpus-run-ai-row { animation: why-gpus-run-ai-reveal 7.3s ease-in-out infinite; }
    @keyframes why-gpus-run-ai-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="why-gpus-run-ai-bg" width="980" height="390"/>
  <text class="why-gpus-run-ai-h1"  x="30" y="40">The same transistor budget, spent two ways</text>
  <text class="why-gpus-run-ai-sub" x="30" y="64">This is why AI runs on GPUs — a fact about hardware, not a fashion in software.</text>
  <rect class="why-gpus-run-ai-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="why-gpus-run-ai-name" x="46" y="122">CPU</text>
  <text class="why-gpus-run-ai-desc" x="46" y="142">A few clever cores</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r0" x="46" y="182">Large caches and branch prediction</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r1" x="46" y="216">Optimised for one varied instruction stream</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r2" x="46" y="250">Fast at work that must happen in order</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r3" x="46" y="284">8-16 cores doing different things</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r4" x="46" y="318">Runs the operating system and your script</text>
  <rect class="why-gpus-run-ai-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="why-gpus-run-ai-name" x="526" y="122">GPU</text>
  <text class="why-gpus-run-ai-desc" x="526" y="142">Thousands of simple cores</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r0" x="526" y="182">Almost all silicon spent on arithmetic units</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r1" x="526" y="216">Every core does the SAME operation</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r2" x="526" y="250">Useless for branching, decisive for matrices</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r3" x="526" y="284">Thousands of cores doing one thing</text>
  <text class="why-gpus-run-ai-desc why-gpus-run-ai-row why-gpus-run-ai-r4" x="526" y="318">A neural network is matrix multiplication</text>
  <text class="why-gpus-run-ai-sub" x="30" y="372">Training moved onto graphics hardware because the shape of the work matched the shape of the chip.</text>
</svg>
