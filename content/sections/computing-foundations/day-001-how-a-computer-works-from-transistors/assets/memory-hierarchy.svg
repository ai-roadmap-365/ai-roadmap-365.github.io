<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" font-family="system-ui, sans-serif">
  <title>The memory hierarchy pyramid: faster and smaller at the top, larger and slower at the bottom</title>
  <rect x="0" y="0" width="700" height="480" fill="#f8fafc"/>
  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The memory hierarchy</text>

  <!-- Pyramid tiers (centered at x=350) -->
  <polygon points="350,60 305,120 395,120" fill="#1d4ed8"/>
  <text x="350" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Registers — ~1 CPU cycle, a few hundred bytes</text>

  <polygon points="300,150 260,210 440,210 400,150" fill="#3b82f6"/>
  <text x="350" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">Cache</text>
  <text x="465" y="186" font-size="14" fill="#1a202c">~1–30 ns, KB to MB</text>

  <polygon points="255,220 215,280 485,280 445,220" fill="#60a5fa"/>
  <text x="350" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">RAM</text>
  <text x="510" y="256" font-size="14" fill="#1a202c">~100 ns, GBs</text>

  <polygon points="210,290 170,350 530,350 490,290" fill="#93c5fd"/>
  <text x="350" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">SSD</text>
  <text x="555" y="326" font-size="14" fill="#1a202c">~100 µs, TBs</text>

  <polygon points="165,360 125,420 575,420 535,360" fill="#bfdbfe"/>
  <text x="350" y="396" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Network storage</text>
  <text x="470" y="396" font-size="14" fill="#1a202c">milliseconds+, effectively unlimited</text>

  <!-- Speed arrow (up-left) -->
  <line x1="95" y1="400" x2="95" y2="110" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="95,98 88,114 102,114" fill="#1d4ed8"/>
  <text x="84" y="255" font-size="14" font-weight="bold" fill="#1d4ed8" transform="rotate(-90 84 255)" text-anchor="middle">faster, smaller, costlier per byte</text>

  <!-- Capacity arrow (down-right) -->
  <line x1="640" y1="110" x2="640" y2="400" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="640,412 633,396 647,396" fill="#1d4ed8"/>
  <text x="654" y="255" font-size="14" font-weight="bold" fill="#1d4ed8" transform="rotate(90 654 255)" text-anchor="middle">larger, slower, cheaper per byte</text>

  <text x="350" y="456" text-anchor="middle" font-size="15" fill="#1a202c">All latencies are approximate orders of magnitude, not exact figures.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 640 110 L 640 400" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 95 400 L 95 110" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
