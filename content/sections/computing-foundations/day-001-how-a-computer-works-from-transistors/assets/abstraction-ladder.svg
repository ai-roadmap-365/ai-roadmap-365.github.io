<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Each rung is built only from the rung below it. Nothing else is added.">
  <title>From a switch to a running program</title>
  <style>
    .abstraction-ladder-bg   { fill: #f8fafc; }
    .abstraction-ladder-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .abstraction-ladder-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .abstraction-ladder-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .abstraction-ladder-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .abstraction-ladder-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .abstraction-ladder-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .abstraction-ladder-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .abstraction-ladder-tok { animation: abstraction-ladder-travel 7s ease-in-out infinite; }
    }
    @keyframes abstraction-ladder-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--abstraction-ladder-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .abstraction-ladder-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="abstraction-ladder-bg" width="980" height="334"/>
  <text class="abstraction-ladder-h1"  x="30" y="40">From a switch to a running program</text>
  <text class="abstraction-ladder-sub" x="30" y="64">Each rung is built only from the rung below it. Nothing else is added.</text>
  <rect class="abstraction-ladder-box" x="30" y="132" width="166" height="96" rx="9"/>
  <text class="abstraction-ladder-name" x="44" y="160">Transistor</text>
  <text class="abstraction-ladder-desc" x="44" y="182">A switch. On or off,</text>
  <text class="abstraction-ladder-desc" x="44" y="198">nothing more.</text>
  <text class="abstraction-ladder-edge" x="44" y="248">physics</text>
  <line class="abstraction-ladder-line" x1="199" y1="180" x2="215" y2="180"/>
  <rect class="abstraction-ladder-box" x="218" y="132" width="166" height="96" rx="9"/>
  <text class="abstraction-ladder-name" x="232" y="160">Logic gate</text>
  <text class="abstraction-ladder-desc" x="232" y="182">A few switches wired to</text>
  <text class="abstraction-ladder-desc" x="232" y="198">compute AND, OR, NOT.</text>
  <text class="abstraction-ladder-edge" x="232" y="248">~2-6 transistors</text>
  <line class="abstraction-ladder-line" x1="387" y1="180" x2="403" y2="180"/>
  <rect class="abstraction-ladder-box" x="406" y="132" width="166" height="96" rx="9"/>
  <text class="abstraction-ladder-name" x="420" y="160">Adder</text>
  <text class="abstraction-ladder-desc" x="420" y="182">Gates arranged to add two</text>
  <text class="abstraction-ladder-desc" x="420" y="198">binary numbers.</text>
  <text class="abstraction-ladder-edge" x="420" y="248">~30 gates</text>
  <line class="abstraction-ladder-line" x1="575" y1="180" x2="591" y2="180"/>
  <rect class="abstraction-ladder-hi" x="594" y="132" width="166" height="96" rx="9"/>
  <text class="abstraction-ladder-name" x="608" y="160">Processor</text>
  <text class="abstraction-ladder-desc" x="608" y="182">Adders, registers and</text>
  <text class="abstraction-ladder-desc" x="608" y="198">control, driven by a</text>
  <text class="abstraction-ladder-desc" x="608" y="214">clock.</text>
  <text class="abstraction-ladder-edge" x="608" y="248">billions</text>
  <line class="abstraction-ladder-line" x1="763" y1="180" x2="779" y2="180"/>
  <rect class="abstraction-ladder-box" x="782" y="132" width="166" height="96" rx="9"/>
  <text class="abstraction-ladder-name" x="796" y="160">Program</text>
  <text class="abstraction-ladder-desc" x="796" y="182">Instructions held in</text>
  <text class="abstraction-ladder-desc" x="796" y="198">memory as data, fetched</text>
  <text class="abstraction-ladder-desc" x="796" y="214">and run.</text>
  <text class="abstraction-ladder-edge" x="796" y="248">software</text>
  <rect class="abstraction-ladder-tok" x="34" y="106" width="58" height="14" rx="3" style="--abstraction-ladder-run: 752px"/>
  <text class="abstraction-ladder-sub" x="30" y="314">The jump that matters is the last one: instructions live in memory as data, which is why one machine can do any job.</text>
</svg>
