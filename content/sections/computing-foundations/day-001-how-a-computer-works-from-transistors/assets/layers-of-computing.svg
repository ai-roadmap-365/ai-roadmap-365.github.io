<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" font-family="system-ui, sans-serif">
  <title>The layers of computing, from transistors at the bottom to applications at the top</title>
  <rect x="0" y="0" width="700" height="520" fill="#f8fafc"/>
  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The layers of computing</text>

  <!-- Layer stack -->
  <rect x="60" y="60" width="380" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Applications</text>

  <rect x="60" y="128" width="380" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="164" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Operating system</text>

  <rect x="60" y="196" width="380" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Machine code</text>

  <rect x="60" y="264" width="380" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">CPU &amp; memory</text>

  <rect x="60" y="332" width="380" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="368" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Logic gates</text>

  <rect x="60" y="400" width="380" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="436" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Transistors (physics)</text>

  <!-- Side annotations -->
  <text x="460" y="86" font-size="14" fill="#1a202c">Browsers, editors,</text>
  <text x="460" y="104" font-size="14" fill="#1a202c">AI models you run</text>

  <text x="460" y="154" font-size="14" fill="#1a202c">Manages hardware,</text>
  <text x="460" y="172" font-size="14" fill="#1a202c">runs many programs</text>

  <text x="460" y="222" font-size="14" fill="#1a202c">Binary instructions</text>
  <text x="460" y="240" font-size="14" fill="#1a202c">the CPU executes</text>

  <text x="460" y="290" font-size="14" fill="#1a202c">Fetch, decode,</text>
  <text x="460" y="308" font-size="14" fill="#1a202c">execute; store data</text>

  <text x="460" y="358" font-size="14" fill="#1a202c">AND, OR, NOT built</text>
  <text x="460" y="376" font-size="14" fill="#1a202c">from switches</text>

  <text x="460" y="426" font-size="14" fill="#1a202c">Billions of tiny</text>
  <text x="460" y="444" font-size="14" fill="#1a202c">electronic switches</text>

  <!-- Abstraction arrow -->
  <line x1="34" y1="450" x2="34" y2="80" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="34,68 27,84 41,84" fill="#1d4ed8"/>
  <text x="24" y="270" font-size="14" font-weight="bold" fill="#1d4ed8" transform="rotate(-90 24 270)" text-anchor="middle">more abstract</text>

  <text x="350" y="496" text-anchor="middle" font-size="15" fill="#1a202c">Each layer hides the details of the layer below it.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 34 450 L 34 80" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
