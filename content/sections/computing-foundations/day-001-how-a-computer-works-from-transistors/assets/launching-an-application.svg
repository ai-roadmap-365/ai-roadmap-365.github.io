<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The slowest step is the first one, which is why a second launch feels quicker.">
  <title>What a double-click actually sets off</title>
  <style>
    .launching-an-application-bg   { fill: #f8fafc; }
    .launching-an-application-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .launching-an-application-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .launching-an-application-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .launching-an-application-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .launching-an-application-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .launching-an-application-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .launching-an-application-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .launching-an-application-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .launching-an-application-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .launching-an-application-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .launching-an-application-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .launching-an-application-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .launching-an-application-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .launching-an-application-stage { opacity: 1; }

    .launching-an-application-s0 { animation-delay: 0.00s; }
    .launching-an-application-e0 { animation-delay: 0.00s; }
    .launching-an-application-s1 { animation-delay: 1.33s; }
    .launching-an-application-e1 { animation-delay: 1.33s; }
    .launching-an-application-s2 { animation-delay: 2.67s; }
    .launching-an-application-e2 { animation-delay: 2.67s; }
    .launching-an-application-s3 { animation-delay: 4.00s; }
    .launching-an-application-e3 { animation-delay: 4.00s; }
    .launching-an-application-s4 { animation-delay: 5.33s; }
    .launching-an-application-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .launching-an-application-conn  { animation: launching-an-application-trace 8s ease-in-out infinite; }
      .launching-an-application-stage { animation: launching-an-application-arrive 8s ease-in-out infinite; }
    }
    @keyframes launching-an-application-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes launching-an-application-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .launching-an-application-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .launching-an-application-stage { animation: launching-an-application-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes launching-an-application-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="launching-an-application-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="launching-an-application-bg" width="980" height="322"/>
  <text class="launching-an-application-h1"  x="30" y="40">What a double-click actually sets off</text>
  <text class="launching-an-application-sub" x="30" y="64">The slowest step is the first one, which is why a second launch feels quicker.</text>
  <g class="launching-an-application-stage launching-an-application-s0">
    <rect class="launching-an-application-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="launching-an-application-step" x="44" y="142">01</text>
    <text class="launching-an-application-name" x="70" y="142">On storage</text>
    <text class="launching-an-application-desc" x="44" y="166">The program sits on the</text>
    <text class="launching-an-application-desc" x="44" y="182">SSD as machine code.</text>
    <text class="launching-an-application-edge" x="44" y="242">permanent</text>
  </g>
  <line class="launching-an-application-line launching-an-application-conn launching-an-application-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#launching-an-application-tip)"/>
  <g class="launching-an-application-stage launching-an-application-s1">
    <rect class="launching-an-application-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="launching-an-application-step" x="233" y="142">02</text>
    <text class="launching-an-application-name" x="259" y="142">Into RAM</text>
    <text class="launching-an-application-desc" x="233" y="166">The OS copies it into</text>
    <text class="launching-an-application-desc" x="233" y="182">memory. The slowest step</text>
    <text class="launching-an-application-desc" x="233" y="198">by far.</text>
    <text class="launching-an-application-edge" x="233" y="242">~100 microseconds</text>
  </g>
  <line class="launching-an-application-line launching-an-application-conn launching-an-application-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#launching-an-application-tip)"/>
  <g class="launching-an-application-stage launching-an-application-s2">
    <rect class="launching-an-application-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="launching-an-application-step" x="422" y="142">03</text>
    <text class="launching-an-application-name" x="448" y="142">Fetch begins</text>
    <text class="launching-an-application-desc" x="422" y="166">The processor starts</text>
    <text class="launching-an-application-desc" x="422" y="182">pulling instructions</text>
    <text class="launching-an-application-desc" x="422" y="198">through the cycle.</text>
    <text class="launching-an-application-edge" x="422" y="242">~0.3 ns each</text>
  </g>
  <line class="launching-an-application-line launching-an-application-conn launching-an-application-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#launching-an-application-tip)"/>
  <g class="launching-an-application-stage launching-an-application-s3">
    <rect class="launching-an-application-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="launching-an-application-step" x="611" y="142">04</text>
    <text class="launching-an-application-name" x="637" y="142">Caches fill</text>
    <text class="launching-an-application-desc" x="611" y="166">Recently used data moves</text>
    <text class="launching-an-application-desc" x="611" y="182">into the fast tiers.</text>
    <text class="launching-an-application-edge" x="611" y="242">why launch 2 is quicker</text>
  </g>
  <line class="launching-an-application-line launching-an-application-conn launching-an-application-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#launching-an-application-tip)"/>
  <g class="launching-an-application-stage launching-an-application-s4">
    <rect class="launching-an-application-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="launching-an-application-step" x="800" y="142">05</text>
    <text class="launching-an-application-name" x="826" y="142">Interleaved</text>
    <text class="launching-an-application-desc" x="800" y="166">The OS gives it turns</text>
    <text class="launching-an-application-desc" x="800" y="182">alongside every other</text>
    <text class="launching-an-application-desc" x="800" y="198">process.</text>
    <text class="launching-an-application-edge" x="800" y="242">milliseconds</text>
  </g>
  <text class="launching-an-application-sub" x="30" y="304">Nothing here is metaphor: every stage is measurable, and the lab measures the first two.</text>
</svg>
