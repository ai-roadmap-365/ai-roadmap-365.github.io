questions:
  - question: 'What is the fundamental role of a transistor in a computer?'
    options:
      - 'It stores a complete file permanently'
      - 'It cools the processor while it runs'
      - 'It converts binary numbers into decimal numbers'
      - 'It acts as a switch that is either on or off'
    answer_index: 3
    explanation: 'A transistor is a microscopic switch whose on/off state represents one bit of possibility; billions of them wired into logic gates form all of a computer''s processing and memory circuitry.'

  - question: 'Which sequence correctly orders the steps a CPU repeats for every instruction?'
    options:
      - 'Fetch, decode, execute, write back'
      - 'Execute, decode, fetch, write back'
      - 'Decode, fetch, execute, write back'
      - 'Fetch, execute, decode, write back'
    answer_index: 0
    explanation: 'The CPU first fetches the instruction from memory, then the control unit decodes its bit pattern, the ALU executes the operation, and the result is written back to a register or memory before the cycle repeats.'

  - question: 'What is the key difference between RAM and storage (SSD/disk)?'
    options:
      - 'RAM holds programs while storage holds only pictures and documents'
      - 'RAM is fast but empties at power-off; storage is slower but permanent'
      - 'RAM is measured in terabytes while storage is measured in gigabytes'
      - 'Storage is faster than RAM but more expensive per byte'
    answer_index: 1
    explanation: 'RAM is the machine''s fast, volatile workspace for running programs, while storage is the slower, persistent layer that survives shutdown — roughly a thousand times slower than RAM for an SSD.'

  - question: 'The capital letter A is stored in a computer using ASCII as which of the following?'
    options:
      - 'The binary pattern 00000001, which is the number 1'
      - 'A miniature photograph of the letter shape'
      - 'The binary pattern 01000001, which is the number 65'
      - 'A special letter-transistor distinct from number-transistors'
    answer_index: 2
    explanation: 'ASCII assigns the number 65 to capital A, and 65 in binary is 01000001; text, like everything else in a computer, is bit patterns given meaning by convention.'

  - question: 'What was the central insight of the von Neumann architecture described in the 1945 EDVAC report?'
    options:
      - 'Computers should use decimal arithmetic instead of binary'
      - 'Every computer needs a separate machine for each task it performs'
      - 'Processors should be built from vacuum tubes rather than relays'
      - 'Programs live in the same memory as data, making one machine general-purpose'
    answer_index: 3
    explanation: 'Storing instructions in memory alongside data means a computer can switch tasks just by loading different instructions, instead of being physically rewired like ENIAC.'

  - question: 'Why do computers use a memory hierarchy instead of building all memory as fast as registers?'
    options:
      - 'Fast memory costs more per byte and must sit close to the CPU'
      - 'Slow memory produces more accurate results than fast memory'
      - 'Operating systems cannot address more than a few kilobytes of fast memory'
      - 'Registers wear out quickly, so they are kept scarce as spare parts'
    answer_index: 0
    explanation: 'Speed, size, and cost trade off against each other: register-speed memory is expensive and must sit near the ALU, so machines pair tiny fast layers with progressively larger, slower, cheaper ones and rely on locality to make it work.'

  - question: 'Why are GPUs better suited than CPUs for running neural networks?'
    options:
      - 'GPUs have higher clock speeds than any CPU'
      - 'Thousands of simple cores do the same math on many values at once'
      - 'GPUs store model weights permanently even when powered off'
      - 'GPUs understand the meaning of the data they process'
    answer_index: 1
    explanation: 'Neural networks consist mostly of huge uniform grids of multiplications and additions, which map naturally onto a GPU''s thousands of parallel arithmetic cores rather than a CPU''s few powerful sequential cores.'

  - question: 'What does it mean to say a computer is a "stored-program" machine?'
    options:
      - 'Its programs are permanently burned into the processor at the factory'
      - 'It keeps a backup of every program it has ever run'
      - 'Its instructions live in memory as data, so loading new ones changes its job'
      - 'Programs can only be loaded from external punched cards'
    answer_index: 2
    explanation: 'Because the program lives in memory just like data, the same hardware can become a calculator, a text editor, or a neural network simply by loading different instructions — the foundation of general-purpose computing.'
