slug: automating-tasks-with-shell-scripts-and
title: 'Automating Tasks with Shell Scripts and cron'
section: computing-foundations
subsection: how-computers-work
week: 2
learning_promise: 'After this lesson you will be able to turn a repetitive chore into a safe, logged shell script and read a cron schedule field by field — so you can decide what to automate, when to run it, and how to keep it trustworthy while nobody is watching.'
objectives:
  - 'Explain what automation is — a script plus a scheduler — and identify which tasks are worth automating (repetitive, scheduled, error-prone)'
  - 'Decode any five-field cron schedule (minute, hour, day-of-month, month, day-of-week) and write lines for common cases such as "8 p.m. every day" and "9 a.m. every Monday"'
  - 'Edit and inspect a personal schedule with crontab -e and crontab -l, and describe how the scheduler wakes each minute to match and run jobs'
  - 'Compare the leading schedulers — cron, macOS launchd, Linux systemd timers, and Windows Task Scheduler — and choose the right one for a platform'
  - 'Explain why unattended scripts must log their output, and make a script idempotent and dry-run-capable so it is safe to run twice and safe to preview'
  - 'Connect scheduled automation to real pipelines — scheduled data pulls, nightly training and evaluation runs, automated reports, and pipeline glue'
prerequisites:
  - 'Day 12 (shell scripting: variables, loops, and conditionals) — this lesson schedules the scripts you learned to write there'
  - 'A terminal on macOS, Linux, or WSL; no software to install, and no changes to your real crontab required'
reading_time_minutes: 40
practical_time_minutes: 30
last_verified: '2026-07-12'
tags: [automation, cron, shell-scripting, scheduling, command-line]
