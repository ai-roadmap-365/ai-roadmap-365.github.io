terms:
  - term: automation
    definition: 'Pairing a script that performs a task with a scheduler that runs it at chosen times, so the work happens reliably without a person doing it by hand.'
  - term: cron
    definition: 'The classic Unix scheduler: a background program that wakes every minute, checks a table of jobs against the current time, and runs the ones that match.'
  - term: crontab
    definition: 'The cron table — a per-user list of scheduled jobs, one job per line; edited with crontab -e and viewed with crontab -l.'
  - term: cron expression
    definition: 'The five whitespace-separated time fields at the start of a crontab line — minute, hour, day-of-month, month, day-of-week — that say when a job runs.'
  - term: scheduled task
    definition: 'A command or script set to run automatically at specified times or intervals by a scheduler, rather than being started by hand.'
  - term: launchd
    definition: 'The service manager and scheduler on macOS, introduced in 2005 and now the recommended tool there; it can also run jobs that were missed while the Mac was asleep.'
  - term: systemd timer
    definition: 'A scheduling unit on most Linux distributions that runs a paired service on a schedule, managed and logged like any other systemd service.'
  - term: idempotent
    definition: 'A property of a task that makes running it more than once no more harmful than running it once, because it checks the current state before acting.'
  - term: dry run
    definition: 'A mode in which a script prints the actions it would take without performing any of them, so you can safely preview a destructive job before trusting it.'
  - term: logging
    definition: 'Writing a record of what a program did — usually timestamped lines appended to a file — which is essential for unattended jobs that have no screen to watch.'
  - term: at
    definition: 'A Unix command that runs a job once at a single future time rather than on a recurring schedule, for one-off delayed or reminder tasks.'
  - term: Task Scheduler
    definition: 'The built-in scheduler on Microsoft Windows, used through its graphical tool or commands like schtasks to run programs at set times.'
