visuals:
  - id: cron-schedule-anatomy
    file: assets/cron-schedule-anatomy.svg
    type: diagram
    title: 'Anatomy of a crontab schedule'
    alt: 'Diagram: the five crontab fields decoded, with the example schedule 0 9 star star 1 meaning 9am every Monday'
    description: 'The five crontab time fields — minute, hour, day of month, month, day of week — laid out left to right, with the example 0 9 * * 1 decoded field by field to show it means run at 09:00 every Monday, plus a legend for wildcards, lists, ranges, and steps.'
  - id: automation-flow
    file: assets/automation-flow.svg
    type: flowchart
    title: 'The flow of a scheduled job'
    alt: 'Flowchart: a scheduler triggers a script, the script runs and logs its output, then success or failure is handled'
    description: 'The life of a scheduled job: the scheduler fires at the appointed minute, the script runs and skips work already done, it appends a timestamped line to a log, and its exit status branches to a success path that waits for the next run or a failure path that logs loudly and alerts a human.'
  - id: safe-automation-shape
    file: assets/safe-automation-shape.svg
    type: diagram
    title: 'The shape of an automation you can trust unattended'
    alt: 'Diagram: the stages of a safe unattended automation'
    description: 'A five-stage sequence for an unattended job: preview without acting, act idempotently, log what happened, exit with a meaningful code, and be checked for absence of success.'
