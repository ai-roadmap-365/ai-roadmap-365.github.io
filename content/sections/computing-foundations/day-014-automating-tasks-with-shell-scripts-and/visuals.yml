visuals:
  - id: cron-schedule-anatomy
    file: assets/cron-schedule-anatomy.svg
    type: diagram
    title: 'Anatomy of a crontab schedule'
    alt: 'Diagram: the five crontab fields decoded, with the example schedule 0 9 star star 1 meaning 9am every Monday'
    description: 'The five crontab time fields — minute, hour, day of month, month, day of week — laid out left to right, with the example 0 9 * * 1 decoded field by field to show it means run at 09:00 every Monday, plus a legend for wildcards, lists, ranges, and steps.'
  - id: automation-flow
    file: assets/automation-flow.svg
    type: flowchart
    title: 'The flow of a scheduled job'
    alt: 'Flowchart: a scheduler triggers a script, the script runs and logs its output, then success or failure is handled'
    description: 'The life of a scheduled job: the scheduler fires at the appointed minute, the script runs and skips work already done, it appends a timestamped line to a log, and its exit status branches to a success path that waits for the next run or a failure path that logs loudly and alerts a human.'
  - id: safe-automation-shape
    file: assets/safe-automation-shape.svg
    type: diagram
    title: 'The shape of an automation you can trust unattended'
    alt: 'Diagram: the stages of a safe unattended automation'
    description: 'A five-stage sequence for an unattended job: preview without acting, act idempotently, log what happened, exit with a meaningful code, and be checked for absence of success.'
  - id: cron-minimal-environment
    file: assets/cron-minimal-environment.svg
    type: diagram
    title: 'cron does not run in your shell'
    alt: 'Diagram: your interactive shell compared with cron''s minimal environment'
    description: 'A two-column comparison of an interactive shell against the environment cron provides, covering PATH, config files, the working directory, and where output goes.'
  - id: idempotence
    file: assets/idempotence.svg
    type: diagram
    title: 'A job you can safely run twice'
    alt: 'Diagram: a job that is unsafe to repeat compared with one that is idempotent'
    description: 'A two-column comparison of jobs that cause damage when repeated against idempotent jobs that check state first, covering appending, downloading, sending and deleting.'
  - id: cron-field-traps
    file: assets/cron-field-traps.svg
    type: diagram
    title: 'Three schedules, read correctly'
    alt: 'Diagram: three cron schedules decoded field by field'
    description: 'A four-stage reading of cron schedules, decoding a weekly nine-o''clock job, a daily evening job, a business-hours interval, and the classic mistake of omitting the minute field.'
  - id: cron-alternatives
    file: assets/cron-alternatives.svg
    type: diagram
    title: 'cron, and what replaced it'
    alt: 'Diagram: cron compared with modern schedulers'
    description: 'A two-column comparison of classic cron against systemd timers and launchd, covering what happens to missed runs, logging, dependencies and failure handling.'
  - id: unattended-checklist
    file: assets/unattended-checklist.svg
    type: diagram
    title: 'Before you schedule anything'
    alt: 'Diagram: the checks a script should pass before being scheduled'
    description: 'A five-stage checklist for unattended jobs covering strict mode, absolute paths, logging with timestamps, safety on repeat runs, and a meaningful exit code.'
  - id: schedule-failure-silence
    file: assets/schedule-failure-silence.svg
    type: diagram
    title: 'How a scheduled job fails'
    alt: 'Diagram: the stages by which an unwatched scheduled job fails unnoticed'
    description: 'A four-stage sequence showing a scheduled job breaking, producing no visible signal, being assumed to work, and the delayed discovery when downstream data is found missing.'
  - id: overlap-lock
    file: assets/overlap-lock.svg
    type: diagram
    title: 'When a job runs alongside itself'
    alt: 'Diagram: overlapping scheduled runs compared with a lock file preventing them'
    description: 'A two-column comparison of a scheduled job with no locking, whose runs accumulate and overlap, against one that takes a lock and exits early when a previous run is still going.'
