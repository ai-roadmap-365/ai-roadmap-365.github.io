questions:
  - question: 'In a standard crontab line, what are the five time fields in order?'
    options:
      - 'Hour, minute, day of month, month, day of week'
      - 'Minute, hour, day of week, day of month, month'
      - 'Second, minute, hour, day, month'
      - 'Minute, hour, day of month, month, day of week'
    answer_index: 3
    explanation: 'A crontab line is minute, hour, day-of-month, month, day-of-week, followed by the command. Because the first field is minutes (not hours), reading the fields smallest-unit-first is the reliable way to avoid the most common cron mistake.'

  - question: 'What does the schedule `0 9 * * 1` mean?'
    options:
      - 'At 09:00 every Monday'
      - 'Every 9 minutes on Mondays'
      - 'At 9 a.m. on the 1st of every month'
      - 'At minute 0 of every hour on the 9th'
    answer_index: 0
    explanation: 'Minute 0, hour 9, any day of month, any month, and day-of-week 1 (Monday). The two star fields remove any calendar-date restriction, so it runs at nine o''clock sharp every Monday.'

  - question: 'Why must a script that runs unattended on a schedule write to a log file?'
    options:
      - 'Log files make the script run faster'
      - 'At 3 a.m. nobody is watching; the log is the only record'
      - 'cron refuses to run any script that does not log'
      - 'Logging is required to convert bytes to gigabytes'
    answer_index: 1
    explanation: 'A scheduled job runs while no one is watching, so without a log a failure is silent until someone notices the missing result. The log is the unattended job''s only way to report what it did and whether it succeeded.'

  - question: 'What does it mean for a task to be idempotent?'
    options:
      - 'It runs faster each time it is repeated'
      - 'It can only ever be run a single time'
      - 'Running it twice does no more harm than running it once'
      - 'It requires administrator privileges to run'
    answer_index: 2
    explanation: 'An idempotent job checks the current state before acting, so re-running it is harmless. This matters for scheduled jobs, which may fire twice or run on already-processed data — a non-idempotent job could double-apply and corrupt data.'

  - question: 'What is the purpose of a dry-run mode in a script that moves or deletes files?'
    options:
      - 'It makes the file operations permanent and irreversible'
      - 'It compresses the files before moving them'
      - 'It schedules the script to run later with cron'
      - 'It prints what the script would do without changing anything'
    answer_index: 3
    explanation: 'A dry run prints the intended actions and changes nothing, letting you verify a destructive script before trusting it. Building the dry-run mode first is the habit that protects your data.'

  - question: 'On modern macOS, which scheduler is the recommended tool, with cron deprecated though still present?'
    options:
      - 'launchd'
      - 'Windows Task Scheduler'
      - 'systemd timers'
      - 'at'
    answer_index: 0
    explanation: 'Apple introduced launchd in 2005 and it is now the recommended scheduler on macOS. It has the practical advantage of catching up on jobs that were missed while the Mac was asleep, which cron never runs.'

  - question: 'A colleague says "the cron job is broken." What is usually the real cause?'
    options:
      - 'cron itself has crashed and must be reinstalled'
      - 'A bug in the script or its environment; cron only launches it'
      - 'The schedule fields were written in the wrong century'
      - 'The computer has run out of transistors'
    answer_index: 1
    explanation: 'cron only launches the command at the scheduled time; it does not understand or retry the job. Most "cron problems" are ordinary script bugs — often a relative path or missing environment variable — that reproduce when you run the command by hand.'

  - question: 'Which tool is designed to run a command once at a single future time rather than on a repeating schedule?'
    options:
      - 'crontab'
      - 'launchd'
      - 'at'
      - 'systemd timer'
    answer_index: 2
    explanation: 'The `at` command schedules a one-off job for a single future time, such as `echo "command" | at 20:00`. cron and the other schedulers are for recurring jobs; `at` is for "just once, later."'

  - question: 'Why should you quote variables such as `"$file"` in a scheduled shell script?'
    options:
      - 'Quoting makes cron run the job on time'
      - 'Quoting converts the file to a different format'
      - 'Unquoted variables are automatically deleted by the shell itself'
      - 'A filename with a space would break the command into pieces'
    answer_index: 3
    explanation: 'cron runs commands through the shell, which splits unquoted values on spaces. Quoting every variable keeps a filename like "my report.pdf" as a single argument, so a space or special character cannot turn the command into something you did not intend — a safety essential for unattended jobs.'
