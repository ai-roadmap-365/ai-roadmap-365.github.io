<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Fields run from smallest unit upward, which is where the mistakes live.">
  <title>Three schedules, read correctly</title>
  <style>
    .cron-field-traps-bg   { fill: #f8fafc; }
    .cron-field-traps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-field-traps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-field-traps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-field-traps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-field-traps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-field-traps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cron-field-traps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cron-field-traps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cron-field-traps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cron-field-traps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cron-field-traps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cron-field-traps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cron-field-traps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cron-field-traps-stage { opacity: 1; }

    .cron-field-traps-s0 { animation-delay: 0.00s; }
    .cron-field-traps-e0 { animation-delay: 0.00s; }
    .cron-field-traps-s1 { animation-delay: 1.28s; }
    .cron-field-traps-e1 { animation-delay: 1.28s; }
    .cron-field-traps-s2 { animation-delay: 2.56s; }
    .cron-field-traps-e2 { animation-delay: 2.56s; }
    .cron-field-traps-s3 { animation-delay: 3.84s; }
    .cron-field-traps-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cron-field-traps-conn  { animation: cron-field-traps-trace 6.4s ease-in-out infinite; }
      .cron-field-traps-stage { animation: cron-field-traps-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cron-field-traps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cron-field-traps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cron-field-traps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cron-field-traps-stage { animation: cron-field-traps-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cron-field-traps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cron-field-traps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cron-field-traps-bg" width="980" height="322"/>
  <text class="cron-field-traps-h1"  x="30" y="40">Three schedules, read correctly</text>
  <text class="cron-field-traps-sub" x="30" y="64">Fields run from smallest unit upward, which is where the mistakes live.</text>
  <g class="cron-field-traps-stage cron-field-traps-s0">
    <rect class="cron-field-traps-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cron-field-traps-step" x="44" y="142">01</text>
    <text class="cron-field-traps-name" x="70" y="142">0 9 * * 1</text>
    <text class="cron-field-traps-desc" x="44" y="166">Minute 0, hour 9, any date, any</text>
    <text class="cron-field-traps-desc" x="44" y="182">month, Monday.</text>
    <text class="cron-field-traps-edge" x="44" y="242">09:00 Mondays</text>
  </g>
  <line class="cron-field-traps-line cron-field-traps-conn cron-field-traps-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cron-field-traps-tip)"/>
  <g class="cron-field-traps-stage cron-field-traps-s1">
    <rect class="cron-field-traps-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cron-field-traps-step" x="280" y="142">02</text>
    <text class="cron-field-traps-name" x="306" y="142">0 20 * * *</text>
    <text class="cron-field-traps-desc" x="280" y="166">Minute 0, hour 20, every day.</text>
    <text class="cron-field-traps-edge" x="280" y="242">20:00 daily</text>
  </g>
  <line class="cron-field-traps-line cron-field-traps-conn cron-field-traps-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cron-field-traps-tip)"/>
  <g class="cron-field-traps-stage cron-field-traps-s2">
    <rect class="cron-field-traps-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cron-field-traps-step" x="516" y="142">03</text>
    <text class="cron-field-traps-name" x="542" y="142">*/15 9-17 * * 1-5</text>
    <text class="cron-field-traps-desc" x="516" y="166">Every 15 minutes, hours 9 to 17,</text>
    <text class="cron-field-traps-desc" x="516" y="182">Monday to Friday.</text>
    <text class="cron-field-traps-edge" x="516" y="242">weekdays</text>
  </g>
  <line class="cron-field-traps-line cron-field-traps-conn cron-field-traps-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cron-field-traps-tip)"/>
  <g class="cron-field-traps-stage cron-field-traps-s3">
    <rect class="cron-field-traps-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cron-field-traps-step" x="752" y="142">04</text>
    <text class="cron-field-traps-name" x="778" y="142">* 9 * * *</text>
    <text class="cron-field-traps-desc" x="752" y="166">The classic mistake: EVERY</text>
    <text class="cron-field-traps-desc" x="752" y="182">MINUTE of the 9 o'clock hour.</text>
    <text class="cron-field-traps-desc" x="752" y="198">Sixty runs, not one.</text>
    <text class="cron-field-traps-edge" x="752" y="242">60 runs</text>
  </g>
  <text class="cron-field-traps-sub" x="30" y="304">The first field is minutes, not hours. Forgetting that turns an intended nine-o'clock job into sixty jobs, and you find out from the log.</text>
</svg>
