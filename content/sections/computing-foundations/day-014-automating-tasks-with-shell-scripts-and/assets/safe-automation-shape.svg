<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Nobody is watching at 3 a.m. Every property here exists because of that.">
  <title>The shape of an automation you can trust unattended</title>
  <style>
    .safe-automation-shape-bg   { fill: #f8fafc; }
    .safe-automation-shape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safe-automation-shape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .safe-automation-shape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .safe-automation-shape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .safe-automation-shape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .safe-automation-shape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .safe-automation-shape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .safe-automation-shape-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .safe-automation-shape-stage { opacity: 1; }

    .safe-automation-shape-s0 { animation-delay: 0.00s; }
    .safe-automation-shape-e0 { animation-delay: 0.00s; }
    .safe-automation-shape-s1 { animation-delay: 1.33s; }
    .safe-automation-shape-e1 { animation-delay: 1.33s; }
    .safe-automation-shape-s2 { animation-delay: 2.67s; }
    .safe-automation-shape-e2 { animation-delay: 2.67s; }
    .safe-automation-shape-s3 { animation-delay: 4.00s; }
    .safe-automation-shape-e3 { animation-delay: 4.00s; }
    .safe-automation-shape-s4 { animation-delay: 5.33s; }
    .safe-automation-shape-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .safe-automation-shape-conn  { animation: safe-automation-shape-trace 8s ease-in-out infinite; }
      .safe-automation-shape-stage { animation: safe-automation-shape-arrive 8s ease-in-out infinite; }
    }
    @keyframes safe-automation-shape-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes safe-automation-shape-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .safe-automation-shape-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .safe-automation-shape-stage { animation: safe-automation-shape-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes safe-automation-shape-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="safe-automation-shape-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="safe-automation-shape-bg" width="980" height="322"/>
  <text class="safe-automation-shape-h1"  x="30" y="40">The shape of an automation you can trust unattended</text>
  <text class="safe-automation-shape-sub" x="30" y="64">Nobody is watching at 3 a.m. Every property here exists because of that.</text>
  <g class="safe-automation-shape-stage safe-automation-shape-s0">
    <rect class="safe-automation-shape-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="safe-automation-shape-step" x="44" y="142">01</text>
    <text class="safe-automation-shape-name" x="70" y="142">Preview</text>
    <text class="safe-automation-shape-desc" x="44" y="166">A dry run that shows what</text>
    <text class="safe-automation-shape-desc" x="44" y="182">would change, and changes</text>
    <text class="safe-automation-shape-desc" x="44" y="198">nothing.</text>
    <text class="safe-automation-shape-edge" x="44" y="242">--dry-run</text>
  </g>
  <line class="safe-automation-shape-line safe-automation-shape-conn safe-automation-shape-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#safe-automation-shape-tip)"/>
  <g class="safe-automation-shape-stage safe-automation-shape-s1">
    <rect class="safe-automation-shape-hi" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="safe-automation-shape-step" x="233" y="142">02</text>
    <text class="safe-automation-shape-name" x="259" y="142">Act</text>
    <text class="safe-automation-shape-desc" x="233" y="166">Idempotent, so running</text>
    <text class="safe-automation-shape-desc" x="233" y="182">twice does no more harm</text>
    <text class="safe-automation-shape-desc" x="233" y="198">than once.</text>
    <text class="safe-automation-shape-edge" x="233" y="242">safe to re-run</text>
  </g>
  <line class="safe-automation-shape-line safe-automation-shape-conn safe-automation-shape-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#safe-automation-shape-tip)"/>
  <g class="safe-automation-shape-stage safe-automation-shape-s2">
    <rect class="safe-automation-shape-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="safe-automation-shape-step" x="422" y="142">03</text>
    <text class="safe-automation-shape-name" x="448" y="142">Log</text>
    <text class="safe-automation-shape-desc" x="422" y="166">A timestamp and a count.</text>
    <text class="safe-automation-shape-desc" x="422" y="182">The only account anyone</text>
    <text class="safe-automation-shape-desc" x="422" y="198">will have.</text>
    <text class="safe-automation-shape-edge" x="422" y="242">append</text>
  </g>
  <line class="safe-automation-shape-line safe-automation-shape-conn safe-automation-shape-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#safe-automation-shape-tip)"/>
  <g class="safe-automation-shape-stage safe-automation-shape-s3">
    <rect class="safe-automation-shape-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="safe-automation-shape-step" x="611" y="142">04</text>
    <text class="safe-automation-shape-name" x="637" y="142">Exit code</text>
    <text class="safe-automation-shape-desc" x="611" y="166">Zero means it worked.</text>
    <text class="safe-automation-shape-desc" x="611" y="182">Non-zero means someone</text>
    <text class="safe-automation-shape-desc" x="611" y="198">should look.</text>
    <text class="safe-automation-shape-edge" x="611" y="242">$?</text>
  </g>
  <line class="safe-automation-shape-line safe-automation-shape-conn safe-automation-shape-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#safe-automation-shape-tip)"/>
  <g class="safe-automation-shape-stage safe-automation-shape-s4">
    <rect class="safe-automation-shape-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="safe-automation-shape-step" x="800" y="142">05</text>
    <text class="safe-automation-shape-name" x="826" y="142">Check absence</text>
    <text class="safe-automation-shape-desc" x="800" y="166">Alert when a success is</text>
    <text class="safe-automation-shape-desc" x="800" y="182">MISSING, not just when</text>
    <text class="safe-automation-shape-desc" x="800" y="198">one fails.</text>
    <text class="safe-automation-shape-edge" x="800" y="242">the hard part</text>
  </g>
  <text class="safe-automation-shape-sub" x="30" y="304">A job that silently stops running produces no error, because it produces nothing at all.</text>
</svg>
