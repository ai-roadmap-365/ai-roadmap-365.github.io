<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Nobody is watching at 3 a.m. Every property here exists because of that.">
  <title>The shape of an automation you can trust unattended</title>
  <style>
    .safe-automation-shape-bg   { fill: #f8fafc; }
    .safe-automation-shape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-automation-shape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safe-automation-shape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .safe-automation-shape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .safe-automation-shape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .safe-automation-shape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .safe-automation-shape-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .safe-automation-shape-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .safe-automation-shape-tok { animation: safe-automation-shape-travel 7s ease-in-out infinite; }
    }
    @keyframes safe-automation-shape-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--safe-automation-shape-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .safe-automation-shape-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="safe-automation-shape-bg" width="980" height="334"/>
  <text class="safe-automation-shape-h1"  x="30" y="40">The shape of an automation you can trust unattended</text>
  <text class="safe-automation-shape-sub" x="30" y="64">Nobody is watching at 3 a.m. Every property here exists because of that.</text>
  <rect class="safe-automation-shape-box" x="30" y="132" width="166" height="96" rx="9"/>
  <text class="safe-automation-shape-name" x="44" y="160">Preview</text>
  <text class="safe-automation-shape-desc" x="44" y="182">A dry run that shows what</text>
  <text class="safe-automation-shape-desc" x="44" y="198">would change, and changes</text>
  <text class="safe-automation-shape-desc" x="44" y="214">nothing.</text>
  <text class="safe-automation-shape-edge" x="44" y="248">--dry-run</text>
  <line class="safe-automation-shape-line" x1="199" y1="180" x2="215" y2="180"/>
  <rect class="safe-automation-shape-hi" x="218" y="132" width="166" height="96" rx="9"/>
  <text class="safe-automation-shape-name" x="232" y="160">Act</text>
  <text class="safe-automation-shape-desc" x="232" y="182">Idempotent, so running</text>
  <text class="safe-automation-shape-desc" x="232" y="198">twice does no more harm</text>
  <text class="safe-automation-shape-desc" x="232" y="214">than once.</text>
  <text class="safe-automation-shape-edge" x="232" y="248">safe to re-run</text>
  <line class="safe-automation-shape-line" x1="387" y1="180" x2="403" y2="180"/>
  <rect class="safe-automation-shape-box" x="406" y="132" width="166" height="96" rx="9"/>
  <text class="safe-automation-shape-name" x="420" y="160">Log</text>
  <text class="safe-automation-shape-desc" x="420" y="182">A timestamp and a count.</text>
  <text class="safe-automation-shape-desc" x="420" y="198">The only account anyone</text>
  <text class="safe-automation-shape-desc" x="420" y="214">will have.</text>
  <text class="safe-automation-shape-edge" x="420" y="248">append</text>
  <line class="safe-automation-shape-line" x1="575" y1="180" x2="591" y2="180"/>
  <rect class="safe-automation-shape-box" x="594" y="132" width="166" height="96" rx="9"/>
  <text class="safe-automation-shape-name" x="608" y="160">Exit code</text>
  <text class="safe-automation-shape-desc" x="608" y="182">Zero means it worked.</text>
  <text class="safe-automation-shape-desc" x="608" y="198">Non-zero means someone</text>
  <text class="safe-automation-shape-desc" x="608" y="214">should look.</text>
  <text class="safe-automation-shape-edge" x="608" y="248">$?</text>
  <line class="safe-automation-shape-line" x1="763" y1="180" x2="779" y2="180"/>
  <rect class="safe-automation-shape-box" x="782" y="132" width="166" height="96" rx="9"/>
  <text class="safe-automation-shape-name" x="796" y="160">Check absence</text>
  <text class="safe-automation-shape-desc" x="796" y="182">Alert when a success is</text>
  <text class="safe-automation-shape-desc" x="796" y="198">MISSING, not just when</text>
  <text class="safe-automation-shape-desc" x="796" y="214">one fails.</text>
  <text class="safe-automation-shape-edge" x="796" y="248">the hard part</text>
  <rect class="safe-automation-shape-tok" x="34" y="106" width="58" height="14" rx="3" style="--safe-automation-shape-run: 752px"/>
  <text class="safe-automation-shape-sub" x="30" y="314">A job that silently stops running produces no error, because it produces nothing at all.</text>
</svg>
