<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" font-family="system-ui, sans-serif">
  <title>A scheduler triggers a script, the script runs and logs its output, then success or failure is handled</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The flow of a scheduled job</text>

  <!-- Step 1: scheduler triggers -->
  <rect x="40" y="80" width="180" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="130" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Scheduler</text>
  <text x="130" y="132" text-anchor="middle" font-size="14" fill="#1a202c">fires at the</text>
  <text x="130" y="150" text-anchor="middle" font-size="14" fill="#1a202c">scheduled minute</text>

  <!-- Step 2: script runs -->
  <rect x="290" y="80" width="180" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Script runs</text>
  <text x="380" y="132" text-anchor="middle" font-size="14" fill="#1a202c">does its work; skips</text>
  <text x="380" y="150" text-anchor="middle" font-size="14" fill="#1a202c">what is already done</text>

  <!-- Step 3: logs output -->
  <rect x="540" y="80" width="180" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="630" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Logs output</text>
  <text x="630" y="132" text-anchor="middle" font-size="14" fill="#1a202c">appends a timestamped</text>
  <text x="630" y="150" text-anchor="middle" font-size="14" fill="#1a202c">line per action</text>

  <!-- arrows across the top row -->
  <line x1="220" y1="120" x2="282" y2="120" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="290,120 276,113 276,127" fill="#1d4ed8"/>
  <line x1="470" y1="120" x2="532" y2="120" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="540,120 526,113 526,127" fill="#1d4ed8"/>

  <!-- down arrow to decision -->
  <line x1="630" y1="160" x2="630" y2="212" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="630,220 623,206 637,206" fill="#1d4ed8"/>

  <!-- Decision diamond: exit status -->
  <polygon points="630,220 710,270 630,320 550,270" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="630" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. Exit</text>
  <text x="630" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">status?</text>

  <!-- Success branch -->
  <rect x="330" y="240" width="200" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="430" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Success</text>
  <text x="430" y="286" text-anchor="middle" font-size="14" fill="#1a202c">log it, wait for next run</text>
  <line x1="550" y1="270" x2="532" y2="270" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="530,270 544,263 544,277" fill="#1d4ed8"/>
  <text x="500" y="234" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="bold">ok</text>

  <!-- Failure branch -->
  <rect x="530" y="350" width="200" height="60" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="630" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Failure</text>
  <text x="630" y="396" text-anchor="middle" font-size="14" fill="#1a202c">log loudly, alert a human</text>
  <line x1="630" y1="320" x2="630" y2="344" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="630,350 623,336 637,336" fill="#1d4ed8"/>
  <text x="668" y="338" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="bold">error</text>

  <!-- loop-back note from success to scheduler -->
  <line x1="330" y1="270" x2="130" y2="270" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="130" y1="270" x2="130" y2="168" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="130,160 123,174 137,174" fill="#1d4ed8"/>
  <text x="230" y="290" text-anchor="middle" font-size="13" fill="#1d4ed8">safe to repeat next time</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 220 120 L 282 120" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 470 120 L 532 120" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 630 160 L 630 212" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 130 270 L 130 168" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
