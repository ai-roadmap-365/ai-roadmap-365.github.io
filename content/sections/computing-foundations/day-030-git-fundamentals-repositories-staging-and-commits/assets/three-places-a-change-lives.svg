<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" role="img"
     aria-label="Knowing which one a file is in explains almost every confusing git status.">
  <title>A change passes through three places before it is history</title>
  <style>
    .three-places-a-change-lives-bg   { fill: #f8fafc; }
    .three-places-a-change-lives-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-places-a-change-lives-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-places-a-change-lives-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-places-a-change-lives-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-places-a-change-lives-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-places-a-change-lives-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-places-a-change-lives-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-places-a-change-lives-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-places-a-change-lives-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-places-a-change-lives-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-places-a-change-lives-line { stroke: #64748b; stroke-width: 2; fill: none; }
    /* The token rests visible at the first stage; the static frame already shows
       every stage and label, so motion only draws attention to the order. */
    .three-places-a-change-lives-tok { fill: #1d4ed8; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .three-places-a-change-lives-tok { animation: three-places-a-change-lives-travel 7s ease-in-out infinite; }
    }
    @keyframes three-places-a-change-lives-travel {
      0%, 6%    { transform: translateX(0);    opacity: 1; }
      94%, 100% { transform: translateX(var(--three-places-a-change-lives-run, 600px)); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .three-places-a-change-lives-tok { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>
  <rect class="three-places-a-change-lives-bg" width="980" height="334"/>
  <text class="three-places-a-change-lives-h1"  x="30" y="40">A change passes through three places before it is history</text>
  <text class="three-places-a-change-lives-sub" x="30" y="64">Knowing which one a file is in explains almost every confusing git status.</text>
  <rect class="three-places-a-change-lives-box" x="30" y="132" width="213" height="96" rx="9"/>
  <text class="three-places-a-change-lives-name" x="44" y="160">Working directory</text>
  <text class="three-places-a-change-lives-desc" x="44" y="182">You edited a file. Nothing is</text>
  <text class="three-places-a-change-lives-desc" x="44" y="198">recorded yet.</text>
  <text class="three-places-a-change-lives-edge" x="44" y="248">modified</text>
  <line class="three-places-a-change-lives-line" x1="246" y1="180" x2="262" y2="180"/>
  <rect class="three-places-a-change-lives-hi" x="265" y="132" width="213" height="96" rx="9"/>
  <text class="three-places-a-change-lives-name" x="279" y="160">Staging area</text>
  <text class="three-places-a-change-lives-desc" x="279" y="182">You chose what belongs in the</text>
  <text class="three-places-a-change-lives-desc" x="279" y="198">next commit.</text>
  <text class="three-places-a-change-lives-edge" x="279" y="248">git add</text>
  <line class="three-places-a-change-lives-line" x1="481" y1="180" x2="497" y2="180"/>
  <rect class="three-places-a-change-lives-box" x="500" y="132" width="213" height="96" rx="9"/>
  <text class="three-places-a-change-lives-name" x="514" y="160">Repository</text>
  <text class="three-places-a-change-lives-desc" x="514" y="182">A permanent snapshot with</text>
  <text class="three-places-a-change-lives-desc" x="514" y="198">author, time and parent.</text>
  <text class="three-places-a-change-lives-edge" x="514" y="248">git commit</text>
  <line class="three-places-a-change-lives-line" x1="716" y1="180" x2="732" y2="180"/>
  <rect class="three-places-a-change-lives-box" x="735" y="132" width="213" height="96" rx="9"/>
  <text class="three-places-a-change-lives-name" x="749" y="160">Remote</text>
  <text class="three-places-a-change-lives-desc" x="749" y="182">Shared, and now other people can</text>
  <text class="three-places-a-change-lives-desc" x="749" y="198">pull it.</text>
  <text class="three-places-a-change-lives-edge" x="749" y="248">git push</text>
  <rect class="three-places-a-change-lives-tok" x="34" y="106" width="58" height="14" rx="3" style="--three-places-a-change-lives-run: 705px"/>
  <text class="three-places-a-change-lives-sub" x="30" y="314">git diff shows the first gap; git diff --staged shows the second. Different questions, different commands.</text>
</svg>
