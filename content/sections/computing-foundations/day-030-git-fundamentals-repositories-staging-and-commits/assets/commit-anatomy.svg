<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a Git commit — a snapshot plus author, message, and parent hash — and how commits link into a chain</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">What a commit really is</text>

  <!-- One commit, exploded into its parts -->
  <rect x="40" y="60" width="300" height="250" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="190" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Commit 712412c</text>

  <rect x="60" y="100" width="260" height="44" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="72" y="120" font-size="14" font-weight="bold" fill="#1a202c">Snapshot (tree)</text>
  <text x="72" y="138" font-size="14" fill="#1a202c">the full state of every tracked file</text>

  <rect x="60" y="152" width="260" height="40" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="72" y="171" font-size="14" font-weight="bold" fill="#1a202c">Author + date</text>
  <text x="72" y="187" font-size="14" fill="#1a202c">who made it, and when</text>

  <rect x="60" y="200" width="260" height="40" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="72" y="219" font-size="14" font-weight="bold" fill="#1a202c">Message</text>
  <text x="72" y="235" font-size="14" fill="#1a202c">why the change was made</text>

  <rect x="60" y="248" width="260" height="44" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="72" y="268" font-size="14" font-weight="bold" fill="#1a202c">Parent hash</text>
  <text x="72" y="286" font-size="14" fill="#1a202c">the commit that came before</text>

  <text x="190" y="330" text-anchor="middle" font-size="14" fill="#1a202c">All of this is hashed into one id:</text>
  <text x="190" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">712412c… (a fingerprint of the content)</text>

  <!-- The chain -->
  <text x="560" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Commits form a chain</text>

  <rect x="470" y="110" width="180" height="54" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="560" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">fa3f66b</text>
  <text x="560" y="152" text-anchor="middle" font-size="14" fill="#1a202c">first commit (no parent)</text>

  <rect x="470" y="200" width="180" height="54" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="560" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">712412c</text>
  <text x="560" y="242" text-anchor="middle" font-size="14" fill="#1a202c">parent = fa3f66b</text>

  <rect x="470" y="290" width="180" height="54" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="560" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">945beab</text>
  <text x="560" y="332" text-anchor="middle" font-size="14" fill="#1a202c">parent = 712412c</text>

  <!-- chain arrows point child -> parent -->
  <line x1="560" y1="200" x2="560" y2="168" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="560,164 553,178 567,178" fill="#1d4ed8"/>
  <line x1="560" y1="290" x2="560" y2="258" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="560,254 553,268 567,268" fill="#1d4ed8"/>

  <!-- HEAD pointer -->
  <rect x="672" y="298" width="72" height="38" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="708" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">HEAD</text>
  <line x1="672" y1="317" x2="654" y2="317" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="650,317 664,310 664,324" fill="#1d4ed8"/>

  <text x="560" y="372" text-anchor="middle" font-size="14" fill="#1a202c">Each arrow points to the parent.</text>
  <text x="560" y="392" text-anchor="middle" font-size="14" fill="#1a202c">HEAD marks the commit you are on.</text>

  <!-- Note -->
  <rect x="40" y="378" width="420" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="250" y="406" text-anchor="middle" font-size="14" fill="#1a202c">Change any byte of any part and the hash changes — so history is tamper-evident.</text>
</svg>
