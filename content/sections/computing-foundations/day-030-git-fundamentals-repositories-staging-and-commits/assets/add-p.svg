<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The staging area only helps if you use it.">
  <title>git add . or git add -p</title>
  <style>
    .add-p-bg   { fill: #f8fafc; }
    .add-p-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-p-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-p-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-p-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-p-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-p-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .add-p-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .add-p-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .add-p-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .add-p-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .add-p-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .add-p-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .add-p-row { opacity: 1; }
    .add-p-r0 { animation-delay: 0.00s; }
    .add-p-r1 { animation-delay: 0.45s; }
    .add-p-r2 { animation-delay: 0.90s; }
    .add-p-r3 { animation-delay: 1.35s; }
    .add-p-r4 { animation-delay: 1.80s; }
    .add-p-row { animation: add-p-reveal 7.3s ease-in-out infinite; }
    @keyframes add-p-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="add-p-bg" width="980" height="390"/>
  <text class="add-p-h1"  x="30" y="40">git add . or git add -p</text>
  <text class="add-p-sub" x="30" y="64">The staging area only helps if you use it.</text>
  <rect class="add-p-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="add-p-name" x="46" y="122">git add .</text>
  <text class="add-p-desc" x="46" y="142">Everything, whatever it is.</text>
  <text class="add-p-desc add-p-row add-p-r0" x="46" y="182">Sweeps in files you forgot about</text>
  <text class="add-p-desc add-p-row add-p-r1" x="46" y="216">Including debugging prints and scratch files</text>
  <text class="add-p-desc add-p-row add-p-r2" x="46" y="250">And secrets, if .gitignore missed one</text>
  <text class="add-p-desc add-p-row add-p-r3" x="46" y="284">Produces commits that do three things</text>
  <text class="add-p-desc add-p-row add-p-r4" x="46" y="318">Makes the staging area pointless</text>
  <rect class="add-p-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="add-p-name" x="526" y="122">git add -p</text>
  <text class="add-p-desc" x="526" y="142">Change by change, with a prompt.</text>
  <text class="add-p-desc add-p-row add-p-r0" x="526" y="182">You see each hunk before staging it</text>
  <text class="add-p-desc add-p-row add-p-r1" x="526" y="216">The fix goes in; the print statement does not</text>
  <text class="add-p-desc add-p-row add-p-r2" x="526" y="250">One commit, one coherent change</text>
  <text class="add-p-desc add-p-row add-p-r3" x="526" y="284">Reviewable by someone else, later</text>
  <text class="add-p-desc add-p-row add-p-r4" x="526" y="318">This is what staging was invented for</text>
  <text class="add-p-sub" x="30" y="372">Most systems commit straight from the working directory. Git's staging area is deliberate extra work, and it only pays for itself if you actually choose what goes in.</text>
</svg>
