<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Left is staged. Right is your working directory.">
  <title>Reading git status in two columns</title>
  <style>
    .status-codes-bg   { fill: #f8fafc; }
    .status-codes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .status-codes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .status-codes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .status-codes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .status-codes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .status-codes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .status-codes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .status-codes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .status-codes-stage { opacity: 1; }

    .status-codes-s0 { animation-delay: 0.00s; }
    .status-codes-e0 { animation-delay: 0.00s; }
    .status-codes-s1 { animation-delay: 1.33s; }
    .status-codes-e1 { animation-delay: 1.33s; }
    .status-codes-s2 { animation-delay: 2.67s; }
    .status-codes-e2 { animation-delay: 2.67s; }
    .status-codes-s3 { animation-delay: 4.00s; }
    .status-codes-e3 { animation-delay: 4.00s; }
    .status-codes-s4 { animation-delay: 5.33s; }
    .status-codes-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .status-codes-conn  { animation: status-codes-trace 8s ease-in-out infinite; }
      .status-codes-stage { animation: status-codes-arrive 8s ease-in-out infinite; }
    }
    @keyframes status-codes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes status-codes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .status-codes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .status-codes-stage { animation: status-codes-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes status-codes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="status-codes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="status-codes-bg" width="980" height="322"/>
  <text class="status-codes-h1"  x="30" y="40">Reading git status in two columns</text>
  <text class="status-codes-sub" x="30" y="64">Left is staged. Right is your working directory.</text>
  <g class="status-codes-stage status-codes-s0">
    <rect class="status-codes-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="status-codes-step" x="44" y="142">01</text>
    <text class="status-codes-name" x="70" y="142">??</text>
    <text class="status-codes-desc" x="44" y="166">Untracked. Git can see it</text>
    <text class="status-codes-desc" x="44" y="182">and is not recording it.</text>
    <text class="status-codes-edge" x="44" y="242">unknown</text>
  </g>
  <line class="status-codes-line status-codes-conn status-codes-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#status-codes-tip)"/>
  <g class="status-codes-stage status-codes-s1">
    <rect class="status-codes-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="status-codes-step" x="233" y="142">02</text>
    <text class="status-codes-name" x="259" y="142">A_</text>
    <text class="status-codes-desc" x="233" y="166">A new file, staged, ready</text>
    <text class="status-codes-desc" x="233" y="182">to commit.</text>
    <text class="status-codes-edge" x="233" y="242">staged</text>
  </g>
  <line class="status-codes-line status-codes-conn status-codes-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#status-codes-tip)"/>
  <g class="status-codes-stage status-codes-s2">
    <rect class="status-codes-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="status-codes-step" x="422" y="142">03</text>
    <text class="status-codes-name" x="448" y="142">_M</text>
    <text class="status-codes-desc" x="422" y="166">Tracked and modified, but</text>
    <text class="status-codes-desc" x="422" y="182">not yet staged.</text>
    <text class="status-codes-edge" x="422" y="242">unstaged</text>
  </g>
  <line class="status-codes-line status-codes-conn status-codes-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#status-codes-tip)"/>
  <g class="status-codes-stage status-codes-s3">
    <rect class="status-codes-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="status-codes-step" x="611" y="142">04</text>
    <text class="status-codes-name" x="637" y="142">M_</text>
    <text class="status-codes-desc" x="611" y="166">Modified, and the</text>
    <text class="status-codes-desc" x="611" y="182">modification is staged.</text>
    <text class="status-codes-edge" x="611" y="242">staged</text>
  </g>
  <line class="status-codes-line status-codes-conn status-codes-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#status-codes-tip)"/>
  <g class="status-codes-stage status-codes-s4">
    <rect class="status-codes-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="status-codes-step" x="800" y="142">05</text>
    <text class="status-codes-name" x="826" y="142">MM</text>
    <text class="status-codes-desc" x="800" y="166">Staged one change, then</text>
    <text class="status-codes-desc" x="800" y="182">edited again. Both</text>
    <text class="status-codes-desc" x="800" y="198">versions exist.</text>
    <text class="status-codes-edge" x="800" y="242">both</text>
  </g>
  <text class="status-codes-sub" x="30" y="304">That last state is the proof the two areas are genuinely separate: what you would commit right now is not what is on disk right now, and Git is telling you so.</text>
</svg>
