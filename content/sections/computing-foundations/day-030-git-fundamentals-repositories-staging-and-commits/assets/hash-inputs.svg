<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four inputs, and altering any one changes the identity.">
  <title>What goes into a commit hash</title>
  <style>
    .hash-inputs-bg   { fill: #f8fafc; }
    .hash-inputs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hash-inputs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hash-inputs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hash-inputs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hash-inputs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hash-inputs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hash-inputs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hash-inputs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hash-inputs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hash-inputs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hash-inputs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hash-inputs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hash-inputs-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hash-inputs-stage { opacity: 1; }

    .hash-inputs-s0 { animation-delay: 0.00s; }
    .hash-inputs-e0 { animation-delay: 0.00s; }
    .hash-inputs-s1 { animation-delay: 1.28s; }
    .hash-inputs-e1 { animation-delay: 1.28s; }
    .hash-inputs-s2 { animation-delay: 2.56s; }
    .hash-inputs-e2 { animation-delay: 2.56s; }
    .hash-inputs-s3 { animation-delay: 3.84s; }
    .hash-inputs-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hash-inputs-conn  { animation: hash-inputs-trace 6.4s ease-in-out infinite; }
      .hash-inputs-stage { animation: hash-inputs-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hash-inputs-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hash-inputs-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hash-inputs-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hash-inputs-stage { animation: hash-inputs-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hash-inputs-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hash-inputs-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hash-inputs-bg" width="980" height="322"/>
  <text class="hash-inputs-h1"  x="30" y="40">What goes into a commit hash</text>
  <text class="hash-inputs-sub" x="30" y="64">Four inputs, and altering any one changes the identity.</text>
  <g class="hash-inputs-stage hash-inputs-s0">
    <rect class="hash-inputs-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hash-inputs-step" x="44" y="142">01</text>
    <text class="hash-inputs-name" x="70" y="142">The snapshot</text>
    <text class="hash-inputs-desc" x="44" y="166">The tree of tracked file</text>
    <text class="hash-inputs-desc" x="44" y="182">contents.</text>
  </g>
  <line class="hash-inputs-line hash-inputs-conn hash-inputs-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hash-inputs-tip)"/>
  <g class="hash-inputs-stage hash-inputs-s1">
    <rect class="hash-inputs-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hash-inputs-step" x="280" y="142">02</text>
    <text class="hash-inputs-name" x="306" y="142">Author and timestamp</text>
    <text class="hash-inputs-desc" x="280" y="166">Which is why two people</text>
    <text class="hash-inputs-desc" x="280" y="182">committing identical files get</text>
    <text class="hash-inputs-desc" x="280" y="198">different hashes.</text>
  </g>
  <line class="hash-inputs-line hash-inputs-conn hash-inputs-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hash-inputs-tip)"/>
  <g class="hash-inputs-stage hash-inputs-s2">
    <rect class="hash-inputs-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hash-inputs-step" x="516" y="142">03</text>
    <text class="hash-inputs-name" x="542" y="142">The message</text>
    <text class="hash-inputs-desc" x="516" y="166">Change a word and the commit</text>
    <text class="hash-inputs-desc" x="516" y="182">becomes a different commit.</text>
  </g>
  <line class="hash-inputs-line hash-inputs-conn hash-inputs-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hash-inputs-tip)"/>
  <g class="hash-inputs-stage hash-inputs-s3">
    <rect class="hash-inputs-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hash-inputs-step" x="752" y="142">04</text>
    <text class="hash-inputs-name" x="778" y="142">The parent's hash</text>
    <text class="hash-inputs-desc" x="752" y="166">So altering any past commit</text>
    <text class="hash-inputs-desc" x="752" y="182">changes every hash after it.</text>
    <text class="hash-inputs-edge" x="752" y="242">tamper-evident</text>
  </g>
  <text class="hash-inputs-sub" x="30" y="304">This is the property Git was designed around: you cannot quietly edit history, because the identity of every later commit depends on every earlier one.</text>
</svg>
