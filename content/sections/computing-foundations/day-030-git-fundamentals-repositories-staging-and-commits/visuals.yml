visuals:
  - id: three-areas
    file: assets/three-areas.svg
    type: diagram
    title: 'Git''s three areas'
    alt: 'Diagram: Git''s three areas — working directory, staging area, and repository — with the commands that move a file between them'
    description: 'An architecture diagram of the three areas of a Git project — working directory, staging area (index), and repository — with git add promoting changes to staging, git commit recording them into the repository, and git status and git diff comparing the areas.'
  - id: commit-anatomy
    file: assets/commit-anatomy.svg
    type: flowchart
    title: 'The anatomy of a commit'
    alt: 'Diagram: the anatomy of a Git commit — snapshot, author, message, and parent hash — and how commits link into a chain'
    description: 'A commit exploded into its parts — a snapshot (tree) of the tracked files, the author and date, the message, and the parent hash — all hashed into one identifier, and three commits linked child-to-parent into a chain with HEAD marking the current commit.'
  - id: three-places-a-change-lives
    file: assets/three-places-a-change-lives.svg
    type: diagram
    title: 'A change passes through three places before it is history'
    alt: 'Diagram: working directory, staging area and repository'
    description: 'A four-stage sequence showing a change moving from the working directory to the staging area to the repository, and out to a remote, with the command that moves it at each step.'
  - id: status-codes
    file: assets/status-codes.svg
    type: diagram
    title: 'Reading git status in two columns'
    alt: 'Diagram: how to read the two-column output of git status'
    description: 'A five-stage reference to the short-form git status codes covering untracked files, staged additions, unstaged modifications, staged modifications, and files that are both staged and further modified.'
  - id: which-diff
    file: assets/which-diff.svg
    type: diagram
    title: 'Two diffs, comparing different pairs'
    alt: 'Diagram: git diff compared with git diff --staged'
    description: 'A two-column comparison of the default git diff and git diff --staged, naming which pair of areas each compares and when to use it.'
  - id: gitignore-timing
    file: assets/gitignore-timing.svg
    type: diagram
    title: 'Why ignoring after the fact does nothing'
    alt: 'Diagram: why a gitignore rule does not affect an already-tracked file'
    description: 'A four-stage sequence showing a file being committed, an ignore rule added afterwards, the file continuing to be tracked, and the untracking step required to stop it.'
  - id: hash-inputs
    file: assets/hash-inputs.svg
    type: diagram
    title: 'What goes into a commit hash'
    alt: 'Diagram: the inputs that produce a commit hash'
    description: 'A four-stage explanation of commit hashing covering the snapshot contents, the author and timestamp, the message, and the parent hash, and the tamper-evidence that results.'
  - id: add-p
    file: assets/add-p.svg
    type: diagram
    title: 'git add . or git add -p'
    alt: 'Diagram: staging everything compared with staging selectively'
    description: 'A two-column comparison of staging all changes at once against staging change by change, covering commit coherence and the risk of including unwanted files.'
  - id: notebooks-in-git
    file: assets/notebooks-in-git.svg
    type: diagram
    title: 'Why notebooks fight version control'
    alt: 'Diagram: a notebook committed with outputs compared with one stripped'
    description: 'A two-column comparison of committing notebooks with their outputs against stripping outputs first, covering diff readability, repository growth and accidental data disclosure.'
  - id: file-journey
    file: assets/file-journey.svg
    type: diagram
    title: 'One file, three areas, two commands'
    alt: 'Diagram: a file moving from the working directory through staging into the repository'
    description: 'A four-stage sequence following a file from an untracked edit in the working directory, through staging, to a commit, and the cleared staging area afterwards.'
  - id: three-questions
    file: assets/three-questions.svg
    type: diagram
    title: 'Three commands answer three questions'
    alt: 'Diagram: the three inspection commands and the question each answers'
    description: 'A three-stage reference pairing git status, git diff and git log with the question each answers about the state and history of a repository.'
  - id: inside-dot-git
    file: assets/inside-dot-git.svg
    type: diagram
    title: 'What is actually inside .git'
    alt: 'Diagram: the contents of a git repository directory'
    description: 'A four-stage tour of the git directory covering the object database, the references, HEAD, and the index.'
