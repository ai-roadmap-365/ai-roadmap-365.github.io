terms:
  - term: repository
    definition: 'A project folder that Git is tracking, together with the hidden .git directory that stores its complete history of committed snapshots.'
  - term: working directory
    definition: 'The live files on disk that you see and edit right now — the in-progress version of the project, before anything is staged or committed.'
  - term: staging area
    definition: 'A holding area where you assemble exactly the changes to include in the next commit; git add puts changes here. Also called the index.'
  - term: index
    definition: 'Git''s internal name for the staging area — the list of changes prepared for the next commit.'
  - term: commit
    definition: 'A permanent, recorded snapshot of the tracked files at one instant, wrapped with an author, timestamp, message, and the parent commit''s hash, and identified by its own hash.'
  - term: snapshot
    definition: 'The complete state of every tracked file at the moment of a commit; Git stores snapshots rather than lists of edits, and computes differences on demand.'
  - term: hash
    definition: 'A commit''s unique identifier — a long hexadecimal fingerprint computed from the commit''s full contents (snapshot, author, time, message, and parent); usually shown as the first seven characters.'
  - term: HEAD
    definition: 'A pointer to the commit you are currently on, normally the newest commit on your branch; it advances to each new commit you make.'
  - term: parent
    definition: 'The commit that came just before a given commit; the parent reference is what links commits into a chain reaching back to the first commit.'
  - term: .gitignore
    definition: 'A file listing path patterns Git should not track, so build outputs, temp files, and secrets never get staged or committed by accident.'
  - term: git add
    definition: 'The command that copies changes from the working directory into the staging area, marking them for inclusion in the next commit.'
  - term: git commit
    definition: 'The command that records everything currently staged as a new permanent snapshot in the repository, with a message describing the change.'
  - term: git status
    definition: 'The command that reports which files are untracked, staged, or modified — the window that tells you which area holds each file''s current content.'
  - term: distributed version control
    definition: 'A model, used by Git, in which every clone is a full copy of the repository and its history, so you can commit and inspect history without a central server.'
