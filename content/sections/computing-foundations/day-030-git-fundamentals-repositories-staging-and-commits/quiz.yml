questions:
  - question: 'What does running git init do to an ordinary folder?'
    options:
      - 'It uploads the folder to a hosting website automatically'
      - 'It deletes any files Git does not recognise'
      - 'It commits every file in the folder immediately'
      - 'It creates a .git directory, making the folder a repository'
    answer_index: 3
    explanation: 'git init creates the hidden .git directory, which is the repository''s memory. The folder is now a repository with an empty history; nothing is committed or uploaded until you tell Git to do so.'

  - question: 'Which command moves a change from the working directory into the staging area?'
    options:
      - 'git add'
      - 'git log'
      - 'git commit'
      - 'git status'
    answer_index: 0
    explanation: 'git add copies changes from the working directory into the staging area (the index), where you assemble the exact snapshot for the next commit. git commit then records what is staged.'

  - question: 'In git status --short, what does the code ?? in front of a file name mean?'
    options:
      - 'The file is staged and ready to commit'
      - 'The file is untracked — seen but not recorded yet'
      - 'The file is tracked and modified but not staged'
      - 'The file has a merge conflict'
    answer_index: 1
    explanation: '?? marks an untracked file: it exists in the working directory, but Git is not yet recording its history. Running git add on it stages it, after which status shows A instead.'

  - question: 'What is a Git commit, precisely?'
    options:
      - 'A list of only the lines that changed since the last save'
      - 'A backup copy stored on a remote server'
      - 'A snapshot plus author, timestamp, message, and parent hash'
      - 'A temporary draft that disappears when you close the terminal'
    answer_index: 2
    explanation: 'A commit records a full snapshot of the tracked files, wrapped with the author, time, message, and the parent commit''s hash, and Git hashes all of that into the commit''s own identifier. It is not merely a diff, a backup, or a draft.'

  - question: 'Why do two people who commit files with identical contents still get different commit hashes?'
    options:
      - 'Git assigns hashes at random'
      - 'They do not — identical contents always produce identical hashes'
      - 'Hashes depend on the operating system, not the commit'
      - 'The hash covers author, timestamp, and parent, which differ'
    answer_index: 3
    explanation: 'A commit''s hash is a fingerprint of its full contents: the snapshot AND the author, timestamp, and parent hash. Since at least those metadata differ, the hashes differ even when the file bytes match.'

  - question: 'A teammate committed a secret API key last week, then deleted the file in a newer commit. Are they safe?'
    options:
      - 'No — the key is still in the earlier commit; rewrite and rotate'
      - 'Yes — commits older than a day are automatically purged'
      - 'Yes — deleting the file removes it from the whole repository'
      - 'No — but only if the repository was shared online'
    answer_index: 0
    explanation: 'Deleting a file in a new commit does not erase it from earlier commits; the key remains in history. Truly removing it requires rewriting history, and because it may already be exposed, the key should be rotated (revoked and reissued).'

  - question: 'What is the purpose of a .gitignore file?'
    options:
      - 'To list the files Git should commit automatically'
      - 'To list paths Git should never track'
      - 'To store your commit messages'
      - 'To encrypt sensitive files inside the repository'
    answer_index: 1
    explanation: '.gitignore lists path patterns Git should leave untracked — build outputs, temp files, and especially secrets. Ignored files never appear as candidates to add, so they cannot be committed by accident. Note it only affects files not already tracked.'

  - question: 'With no arguments, what does git diff compare?'
    options:
      - 'Two different branches of the repository'
      - 'The staging area against the last commit'
      - 'The working directory against the staging area'
      - 'Your repository against a remote server'
    answer_index: 2
    explanation: 'Plain git diff shows what is changed in the working directory but not yet staged. To see what is staged and about to be committed, use git diff --staged, which compares the staging area against the last commit.'
