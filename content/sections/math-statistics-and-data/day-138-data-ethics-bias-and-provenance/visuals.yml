visuals:
  - id: bias-sources-architecture
    file: assets/bias-sources-architecture.svg
    type: diagram
    title: >-
      The pipeline from the world to a decision, with each kind of bias drawn at the stage where it
      actually enters -- historical in the world itself, selection and coverage at collection, measurement
      at recording, aggregation at modelling -- and the datasheet field that records each one
    alt: >-
      Diagram: five pipeline stages from the world through collection, recording, the dataset and
      modelling, each annotated with the bias that enters at that stage and with the datasheet field that
      records it, plus notes stating that more data moves none of them and that historical bias is where
      measurement runs out
    description: >-
      A static architecture diagram in three horizontal bands. The middle band is the pipeline: five
      blue-bordered stage boxes in sequence -- 1 the world (the process that produces outcomes), 2
      collection (who gets reached, and who does not), 3 recording (what gets written down, and as what), 4
      the dataset (a file, plus the decisions inside it), and 5 modelling (one fit, one score, one decision
      rule) -- joined left to right by blue arrows. The top band, captioned "bias enters here", carries four
      red-bordered callouts dropping into the stage where each bias actually enters: historical bias into
      the world ("the record is accurate; the process it records was not just"), selection and coverage
      bias into collection ("the sampling frame is a claim about who is in the world"), measurement bias
      into recording ("arrests are not crimes, clicks are not interest, the proxy is not the thing"), and
      aggregation bias into modelling ("one model for a mixed population can be wrong for every subgroup in
      it"). The bottom band, captioned "the datasheet field that makes it checkable", carries five
      green-bordered boxes rising into the same five stages: purpose and known_gaps, sampling_frame and
      inclusion or exclusion criteria, population_definition and the data dictionary, collector licence
      version and changelog, and the declared fairness criterion and why. Four closing notes state that
      more data moves none of these and that a tenfold sample tightens the interval by about 3.2 times
      around an answer that stays exactly as wrong, that historical bias is the one measurement genuinely
      runs out on because a model fitting an unjust record perfectly reproduces the injustice faithfully,
      that accuracy is not fairness and no accuracy number will say so, and that every red box is a
      decision somebody made while every green box is where that decision was written down.
  - id: frame-vs-population-flow
    file: assets/frame-vs-population-flow.svg
    type: flow-animated
    title: >-
      A population whose minority group the sampling frame barely reaches, and three growing sample sizes
      whose confidence intervals tighten around an estimate that stays 5.94 away from the truth
    alt: >-
      Diagram: a population containing a minority group, a dashed sampling frame that reaches almost none
      of that group, and three sample sizes whose confidence intervals visibly tighten around an estimate
      that stays the same distance from the truth
    description: >-
      An animated flow diagram, fully readable as a still image. On the left, a population panel shows
      group A as a large blue block (90% of people, reachable by the survey's daytime telephone frame, true
      intercept 2.0) and group B as a smaller amber block (10% of people, true intercept 8.0, six units
      higher). A red dashed outline drawn over both is the sampling frame: it encloses all of group A and
      only a narrow sliver of group B, labelled "the sampling frame reaches 1% of group B, not 10% -- and
      it always will". A blue token rests at the frame's edge and travels along a marching-dashed wire
      labelled "draw n rows" into the right-hand panel. On the right, three stacked rows are emphasised in
      turn: n = 500 with interval plus or minus 0.118 and in-sample RMSE 1.167, n = 5,000 with interval
      plus or minus 0.035 and RMSE 1.159, and n = 50,000 with interval plus or minus 0.010 and RMSE 1.165.
      Each row draws a confidence bracket around the same estimate point, and the brackets narrow visibly
      from top to bottom while all three stay centred on the same vertical dashed line. A green vertical
      line marks the truth for group B, well to the left, and a red double-headed arrow between the two
      lines is labelled "bias = 5.94, at every n". A note states that the intervals are drawn enlarged so
      the tightening is visible, since on the bias bar's own scale all three would be thinner than the line
      itself. Four closing notes give the measured values: bias 5.9459 then 5.9384 then 5.9397, a spread of
      0.0075 across a hundredfold increase in n; standard deviations 0.06025, 0.01796 and 0.00524, ratios
      of 3.35 and 3.43 against the 3.16 sampling theory predicts; precision improved 11.5-fold and accuracy
      not at all, so the estimate became a confident wrong answer instead of an uncertain one; group A's
      bias never exceeds 0.062, so the model is wrong for exactly the group nobody measured; and the frame
      rather than the sample size is the problem, documented in a datasheet field rather than an accuracy
      score. A prefers-reduced-motion media query sets every animation to none, turns the marching dashes
      into a solid line, freezes the token at its resting position at the frame's edge, and returns all
      three sample rows to their plain white background, while every label, bracket, number and note stays
      fully drawn and fully legible.
