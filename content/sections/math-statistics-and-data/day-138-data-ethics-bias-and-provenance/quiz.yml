questions:
  - question: >-
      A pooled model's error for an under-represented subgroup is 5.9459 at n = 500 and 5.9397 at
      n = 50,000, while the standard deviation of that error falls from 0.06025 to 0.00524. What did the
      hundredfold increase in data actually buy?
    options:
      - A more precise estimate of an answer that is just as wrong as it was
      - A more accurate model, since the standard deviation fell by a factor of 11.5
      - Nothing at all -- neither the bias nor the variance changed
      - A better model for the under-represented group, since larger samples are more representative
    answer_index: 0
    explanation: >-
      The two quantities move independently, and that is the whole point. Variance is a property of the
      sample size and falls as one over the square root of n, exactly as it did here. Bias is a property of
      the sampling frame -- who could possibly have been sampled at all -- and n does not appear in it.
      Growing the sample tightened the interval 11.5-fold around an estimate that moved by 0.0075. The
      practical consequence is worse than "no improvement": a wide interval around a wrong answer at least
      signals uncertainty, while a narrow one around the same wrong answer signals confidence nobody has
      earned.
  - question: >-
      A coverage check against a reference population returns a total variation distance of 0.0896, and
      per-group representation ratios of 1.094, 1.101, 1.111 and 0.104. Which number should lead the
      report, and why?
    options:
      - The total variation distance, because a single summary is easier for a reader to act on
      - The ratio of 1.111, because it is the largest deviation above 1.0
      - The average of the four ratios, because it summarises the whole comparison
      - The ratio of 0.104, because it names one group and says it appears at a tenth of its population share
    answer_index: 3
    explanation: >-
      A distance of 0.0896 is genuinely small and reads as reassuring, which is exactly the trap: one
      region can be almost absent from a sample while the distance between the two distributions stays
      under a tenth. The representation ratio is attached to a name and a magnitude -- "the west appears at
      0.104 of its population share" -- and that is the sentence a reader can act on. Report the distance
      too; just do not lead with it.
  - question: >-
      A selection procedure ranks by a proxy that correlates with the true target at 0.93. The total true
      need served comes to 98.3% of what a target-ranked selection would have achieved. What can you
      conclude about the fairness of the procedure?
    options:
      - Nothing yet -- the aggregate is compatible with one group receiving a small fraction of what it should
      - It is fair, because a 1.7% aggregate loss is within any reasonable tolerance
      - It is unfair, because any proxy-based ranking is unfair by definition
      - It is fair for the majority group and therefore fair overall
    answer_index: 0
    explanation: >-
      In the lesson's measured example the aggregate fell by 1.7% while the under-recorded group's share of
      the selection fell from 0.25 to 0.04 and its true need served fell to 0.1785 of the target-ranked
      figure. The aggregate barely moved precisely because the harmed group is a minority of the
      population, which is the mechanism by which measurement bias survives review. The check that catches
      it is one groupby: disaggregate the outcome metric before drawing any conclusion from the pooled one.
  - question: >-
      A pooled linear model fitted across two subgroups produces a slope of +1.98, while the true slopes
      within each subgroup are -0.99 and -1.00. What is the most precise description of the defect?
    options:
      - The pooled model is less precise than it could be, and needs more data to resolve the two groups
      - The pooled model has the wrong sign for every subgroup in the data, not merely a worse average error
      - The subgroups were mislabelled, since a positive pooled slope implies at least one positive subgroup slope
      - The pooled model is fine overall and only fails at the extremes of the x range
    answer_index: 1
    explanation: >-
      This is Simpson's paradox in a regression. The between-group offset -- group B sits at higher x and a
      much higher intercept -- dominates the pooled fit and reverses the direction. "Worse on average"
      would invite the reply "but it is better for most people"; here there is no subgroup for whom it is
      better. The pooled RMSE was 5.03 and 5.05 against per-group fits of 1.02 and 1.00. More data does not
      help: the model is misspecified, not under-determined.
  - question: >-
      A risk score is perfectly calibrated for two groups whose base rates are 0.66 and 0.34. A single
      threshold is applied to both. What must be true?
    options:
      - Demographic parity holds, because the same threshold is applied to everyone
      - Both demographic parity and equal opportunity hold, since calibration implies both
      - Demographic parity is violated, and no alternative policy can close all three gaps at once
      - Nothing can be concluded without knowing the threshold value
    answer_index: 2
    explanation: >-
      With calibrated scores and different base rates, a common threshold selects the higher-base-rate
      group at a higher rate -- 0.85 against 0.35 in the lesson's example, a parity gap of 0.50. The deeper
      point is the second half: this is not a defect of the threshold. Enforcing parity drives that gap to
      exactly zero and pushes the precision gap out to 0.3333; enforcing equal true-positive rates drives
      that gap to zero and pushes parity to 0.1160. No policy closes all three, and that is a theorem about
      arithmetic whenever base rates differ, established independently in the mid-2010s.
  - question: >-
      Given that no policy can satisfy demographic parity, equal opportunity and equal precision at once,
      what is the correct professional response?
    options:
      - Report whichever criterion the system already satisfies, since the others are unattainable anyway
      - Use whichever criterion the fairness library computes by default, since the defaults encode expert consensus
      - Choose one criterion, declare it and the reasoning behind it in writing, and report all three metrics
      - Abandon fairness metrics entirely, since they cannot be jointly satisfied
    answer_index: 2
    explanation: >-
      The impossibility makes the choice unavoidable, not optional. Which criterion matters depends on what
      the system does, what a false positive and a false negative each cost the person they land on, and
      whether the base-rate difference is itself a product of the history you are trying not to reproduce.
      Informed people disagree about that in good faith. What is not a matter of opinion is that the choice
      must be made deliberately and stated: the common failure is not picking the wrong criterion but
      picking one by accident and never telling anyone. Reporting only the criterion you happen to satisfy
      is advocacy with a table attached.
  - question: >-
      A table with no names, addresses or identifiers has 2,723 of its 5,000 rows uniquely determined by
      birth year, postcode and sex. What does removing the direct identifiers accomplish?
    options:
      - It makes the table anonymous, since no individual can be named from it
      - It removes one route to identification while leaving over half the rows singled out by three ordinary facts
      - It has no effect at all on disclosure risk
      - It satisfies k-anonymity for k = 1, which is the relevant standard
    answer_index: 1
    explanation: >-
      Anonymity is a claim about a threat model, not a property of a file. Removing names defeats an
      adversary who only has a name; it does nothing against an adversary who knows a birth year, a
      postcode and a sex -- a neighbour, a colleague, an employer. In this table 54.46% of rows are
      singletons on those three fields. Coarsening one of them, exact birth year to a decade band, cut that
      to 13 rows, a reduction factor of 209.5, from a single edit. The measurement is one groupby, and the
      reason it is skipped is never cost.
  - question: >-
      Two releases of a dataset have identical count, mean, standard deviation, minimum, median and maximum
      for the measured column. What change is fully consistent with all six matching exactly?
    options:
      - No change at all -- identical summary statistics prove the data is unchanged
      - A change in the unit of the measured column, which shifts every statistic equally
      - A change in group composition, if both groups' values come from the same distribution
      - A change in row count, since count is insensitive to which rows were included
    answer_index: 2
    explanation: >-
      In the lesson's constructed example the value column is byte-for-byte identical between the two
      releases and only the group labels changed: group B went from half the sample to a quarter, a
      composition shift of 0.25. Every statistic of the value column is therefore identical, and a reader
      diffing describe() output sees nothing at all. The only artifact in which the change exists is the
      provenance record -- the sampling_frame field differs and the changelog gained one line naming the
      re-scoping. That is the strongest available argument for the documentation habit: it is not paperwork
      attached to the analysis, it is the sole place the change is visible.
