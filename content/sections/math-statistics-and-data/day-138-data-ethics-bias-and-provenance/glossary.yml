terms:
  - term: sampling frame
    definition: >-
      The list of things that could possibly have been sampled at all -- every telephone number that could
      have been dialled, every record that could have been drawn. It is a claim about who is in the world,
      and when the claim is wrong, everything downstream is wrong in a way no amount of additional sampling
      repairs. The frame is the single most important thing a datasheet records and the single thing least
      often written down.
  - term: sampling bias
    definition: >-
      Systematic mismatch between the sampling frame and the population it claims to describe. Unlike
      sampling error it does not shrink with sample size: in this lesson's measurement the error for an
      under-represented group was 5.9459 at n = 500 and 5.9397 at n = 50,000, a change of 0.13% across a
      hundredfold increase in data.
  - term: coverage bias
    definition: >-
      The specific form of selection bias in which some part of the target population is systematically
      absent or under-represented. Measurable whenever a reference distribution exists, by dividing each
      group's sample share by its reference share to get a representation ratio.
  - term: representation ratio
    definition: >-
      A group's share of the sample divided by its share of the reference population. A ratio of 1.0 means
      the group appears exactly as often as it should; 0.104 means it appears at roughly a tenth of that
      rate. Reported per group and by name, which is what makes it more useful than a single distribution
      distance that can read as reassuring while one group is nearly absent.
  - term: total variation distance
    definition: >-
      Half the sum of absolute differences between two probability vectors: 0.0 when they match exactly,
      1.0 when they share no mass. A legitimate one-number summary of how far a sample's composition sits
      from a reference, and a poor thing to lead a report with, because a severe shortfall in one small
      group produces only a small distance.
  - term: measurement bias
    definition: >-
      Error introduced when what gets recorded is a proxy for what you actually care about, and the gap
      between proxy and target differs systematically between groups. Arrests are a proxy for offences,
      clicks for interest, billed diagnosis codes for disease, prior spending for need. Each correlates
      strongly with its target and each fails differently for different people.
  - term: proxy
    definition: >-
      A recorded quantity standing in for an unrecorded one. The procedural discipline this lesson asks for
      is to name the proxy and the thing it stands in for, in writing, before optimising it -- because once
      the pair is written down, the question of whether the gap varies by group becomes askable and is
      frequently answerable from data already in hand.
  - term: historical bias
    definition: >-
      The case where the data is an accurate record of an unjust process. A model that fits it well
      reproduces the injustice faithfully, and its accuracy score will be excellent, because reproducing
      the past accurately is what a high accuracy score means. This is where measurement genuinely runs
      out: no divergence, ratio or error figure detects it, because nothing in the data is wrong.
  - term: aggregation bias
    definition: >-
      The error introduced by fitting one model to a heterogeneous population. In this lesson's example the
      pooled slope was +1.98 while both subgroups' true slopes were about -1.0, and the pooled model's
      error was worse for every subgroup, not merely worse on average.
  - term: demographic parity
    definition: >-
      The criterion that both groups be selected at the same rate, regardless of their base rates. Easy to
      state and easy to enforce exactly; enforcing it in this lesson's example drove the selection-rate gap
      to 0.0000 and pushed the precision gap out to 0.3333.
  - term: equal opportunity
    definition: >-
      The criterion that both groups' genuinely-positive members be selected at the same rate -- equal
      true-positive rates. Enforcing it in this lesson's example drove that gap to 0.0000 while reopening
      the selection-rate gap to 0.1160 and the precision gap to 0.3012.
  - term: calibration
    definition: >-
      The property that a score can be read as a probability: among everyone scored 0.7, seven in ten
      really are positive, in every group. The lesson's constructed population is calibrated exactly, with
      a maximum deviation of zero, which is what makes the impossibility result visible rather than
      arguable.
  - term: fairness impossibility
    definition: >-
      The result that demographic parity, equal true-positive rates and equal precision cannot generally
      all hold at once when two groups have different base rates. Established independently in the
      mid-2010s and reproducible by hand on a twenty-number table. Choosing among the criteria is
      consequently unavoidable, and it is a value judgement about what a system is for and who bears the
      cost of a wrong decision -- not something a library default can settle.
  - term: quasi-identifier
    definition: >-
      A field that is not an identifier on its own but combines with others to single someone out: birth
      year, postcode, sex, occupation, employer. In this lesson's 5,000-row table with no names at all,
      2,723 rows were uniquely determined by exactly three of them.
  - term: k-anonymity
    definition: >-
      The property that every combination of quasi-identifiers appearing in a released table appears at
      least k times, so no individual can be isolated to fewer than k people. Introduced by Latanya Sweeney
      in 2002. Bought with generalisation and suppression, and the rows suppression removes are the unusual
      ones -- frequently the people an analysis was supposed to be about.
  - term: homogeneity attack
    definition: >-
      Disclosure of a sensitive attribute from a k-anonymous table because every member of an equivalence
      class shares the same value. Nobody is re-identified; membership in the class is enough. This is the
      limit that motivated l-diversity, and it is why a check trusted past its stated guarantee is worse
      than no check.
  - term: differential privacy
    definition: >-
      A property of the algorithm producing an output rather than of the released table: the guarantee that
      the output is nearly as likely whether or not any one individual's record is present. Introduced in
      2006 by Dwork, McSherry, Nissim and Smith. Structurally different from k-anonymity and not
      interchangeable with it. Described in this lesson, not demonstrated -- no differentially private
      mechanism was implemented or run here.
  - term: datasheet
    definition: >-
      A document travelling with a dataset that records its motivation, composition, collection process and
      recommended uses -- by analogy with the datasheet shipped with every electronic component. Proposed
      by Gebru and colleagues in 2018. This lesson's contract enforces eleven fields and names each missing
      one, because "documentation incomplete" is not actionable and "no exclusion criteria recorded" is.
  - term: provenance
    definition: >-
      Who collected a dataset, when, why, under what definitions, with what inclusion criteria, and what
      changed between versions. A dataset without it cannot be cited, re-fetched or compared across
      releases. In this lesson's version-drift example the provenance record is the only artifact in which
      the change exists at all, because every summary statistic is identical between the two releases.
  - term: purpose limitation
    definition: >-
      The principle that data collected for a specified purpose should not be further processed in a way
      incompatible with that purpose. Set out as a research ethics principle in the Belmont Report in 1979
      and given an enforcement mechanism in the GDPR, which became applicable on 25 May 2018. The practical
      form is the datasheet's purpose field: a dataset built for national estimates is not thereby a
      dataset for small-area estimates.
  - term: pseudonymisation
    definition: >-
      Replacing a direct identifier with a stable substitute. It removes the name and preserves the ability
      to link rows across releases, which is often exactly what was wanted and is also exactly what makes
      re-identification tractable. Distinct from anonymisation, which is a claim that no individual can be
      singled out at all -- a claim that has to be substantiated by measurement rather than asserted by
      having deleted a column.
