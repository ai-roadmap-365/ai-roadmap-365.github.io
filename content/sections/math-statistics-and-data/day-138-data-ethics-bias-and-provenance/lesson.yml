title: 'Data Ethics, Bias, and Provenance'
section: math-statistics-and-data
subsection: data-analysis
week: 20
learning_promise: >-
  After this lesson you will be able to prove, with numbers rather than principles, that collecting more
  data does not repair a biased sampling frame: you will run a bias-versus-n ladder showing the error for
  an under-represented group flat at 5.94 across a hundredfold increase in sample size while the interval
  around it tightens 11.5-fold. You will compute a coverage mismatch against a reference distribution and
  report the representation ratio that names the affected group rather than the single divergence number
  that hides it. You will demonstrate that optimising a proxy correlated at 0.93 with its target can cut
  one group's share of a selection from 25% to 4% while the aggregate falls by under 2%, and that one
  pooled model can be worse for every subgroup than per-subgroup models. You will compute demographic
  parity, equal opportunity and precision for three decision policies on one calibrated population and
  show that no policy closes all three gaps when base rates differ -- and you will be able to state
  plainly why choosing among them is a value judgement to declare rather than a technical default to
  accept. You will count how many rows of a name-free table are unique on three quasi-identifiers,
  achieve k-anonymity and report what it cost in suppressed rows, and demonstrate a k-anonymous table
  that discloses a sensitive attribute anyway. Finally you will build a datasheet contract that names
  every missing provenance field, and detect a version change that every summary statistic hides.
objectives:
  - 'Show that sampling bias is flat in n while sampling error falls as one over the square root of n, with measured numbers at three sample sizes'
  - 'Compute a coverage mismatch against a reference population and report a per-group representation ratio, not just a divergence number'
  - 'Name a proxy and the thing it stands in for, and measure whether optimising the proxy harms one group while the aggregate holds steady'
  - 'Demonstrate that one pooled model can be worse for every subgroup than per-subgroup models, with the wrong slope sign for both'
  - 'Compute demographic parity, equal opportunity and precision for three policies and show that no policy satisfies all three when base rates differ'
  - 'State which fairness criterion a system should satisfy as a declared value judgement, and explain why no library can make that choice'
  - 'Count rows that are unique on a small set of quasi-identifiers, and measure what generalising one field buys'
  - 'Achieve k-anonymity, report the rows suppressed to get there, and demonstrate a case where k-anonymity holds and a sensitive attribute is still disclosed'
  - 'Check a dataset against an eleven-field provenance contract that names each missing field rather than reporting a count'
  - 'Detect a version change that every summary statistic hides, and show that the provenance record is the only artifact in which it exists'
  - 'Distinguish what a licence permits from what is appropriate, and treat permitted as a floor rather than a ceiling'
prerequisites:
  - 'Day 117 -- sampling and the central limit theorem. This lesson assumes you already know that standard error falls as one over the square root of n, and turns that into the argument that bias does not'
  - 'Day 116 -- Simpson''s paradox and summary statistics as lossy compression. The aggregation-bias section is that day with a decision attached'
  - 'Day 130 -- what each view of a distribution hides, and Day 132 -- chart honesty and the lie factor'
  - 'Day 134 -- source assessment, licences and provenance records. This lesson builds the datasheet that day''s provenance gate was pointing at'
  - 'Comfort with pandas groupby, NumPy arrays and pytest'
