<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four questions.">
  <title>What data ethics covers</title>
  <style>
    .ethics-idea-bg   { fill: #f8fafc; }
    .ethics-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ethics-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ethics-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ethics-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ethics-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ethics-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ethics-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ethics-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ethics-idea-stage { opacity: 1; }

    .ethics-idea-s0 { animation-delay: 0.00s; }
    .ethics-idea-e0 { animation-delay: 0.00s; }
    .ethics-idea-s1 { animation-delay: 1.28s; }
    .ethics-idea-e1 { animation-delay: 1.28s; }
    .ethics-idea-s2 { animation-delay: 2.56s; }
    .ethics-idea-e2 { animation-delay: 2.56s; }
    .ethics-idea-s3 { animation-delay: 3.84s; }
    .ethics-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ethics-idea-conn  { animation: ethics-idea-trace 6.4s ease-in-out infinite; }
      .ethics-idea-stage { animation: ethics-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ethics-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ethics-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ethics-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ethics-idea-stage { animation: ethics-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ethics-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ethics-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ethics-idea-bg" width="980" height="322"/>
  <text class="ethics-idea-h1"  x="30" y="40">What data ethics covers</text>
  <text class="ethics-idea-sub" x="30" y="64">Four questions.</text>
  <g class="ethics-idea-stage ethics-idea-s0">
    <rect class="ethics-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ethics-idea-step" x="44" y="142">01</text>
    <text class="ethics-idea-name" x="70" y="142">Did the people in this data agree to this use?</text>
    <text class="ethics-idea-desc" x="44" y="166">Which is rarely a simple yes.</text>
  </g>
  <line class="ethics-idea-line ethics-idea-conn ethics-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ethics-idea-tip)"/>
  <g class="ethics-idea-stage ethics-idea-s1">
    <rect class="ethics-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ethics-idea-step" x="280" y="142">02</text>
    <text class="ethics-idea-name" x="306" y="142">Who is represented, and who is missing?</text>
    <text class="ethics-idea-desc" x="280" y="166">Which determines who the system</text>
    <text class="ethics-idea-desc" x="280" y="182">serves.</text>
  </g>
  <line class="ethics-idea-line ethics-idea-conn ethics-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ethics-idea-tip)"/>
  <g class="ethics-idea-stage ethics-idea-s2">
    <rect class="ethics-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ethics-idea-step" x="516" y="142">03</text>
    <text class="ethics-idea-name" x="542" y="142">What will this be used for, and who is affected?</text>
    <text class="ethics-idea-desc" x="516" y="166">Including uses you did not</text>
    <text class="ethics-idea-desc" x="516" y="182">intend.</text>
  </g>
  <line class="ethics-idea-line ethics-idea-conn ethics-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ethics-idea-tip)"/>
  <g class="ethics-idea-stage ethics-idea-s3">
    <rect class="ethics-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ethics-idea-step" x="752" y="142">04</text>
    <text class="ethics-idea-name" x="778" y="142">And who is accountable when it causes harm?</text>
    <text class="ethics-idea-desc" x="752" y="166">Which must have an answer before</text>
    <text class="ethics-idea-desc" x="752" y="182">deployment.</text>
  </g>
  <text class="ethics-idea-sub" x="30" y="304">The accountability question is the one that most reliably surfaces problems, because a system nobody will answer for is usually a system nobody has examined.</text>
</svg>
