<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="d138f-title d138f-desc" width="1200" height="760">
  <title id="d138f-title">A sampling frame that misses part of the population, and a sample growing inside it</title>
  <desc id="d138f-desc">A population containing a minority group, a sampling frame that reaches almost none of that group, and three sample sizes whose confidence intervals tighten around an estimate that stays the same distance from the truth.</desc>
  <style>
    .d138f-bg { fill: #f8fafc; }
    .d138f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d138f-sub { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; }
    .d138f-cap { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .d138f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d138f-small { fill: #334155; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d138f-note { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d138f-note-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d138f-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d138f-groupa { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d138f-groupb { fill: #fde68a; stroke: #b45309; stroke-width: 2; }
    .d138f-frame { fill: none; stroke: #b91c1c; stroke-width: 3; stroke-dasharray: 10 7; }
    .d138f-framelabel { fill: #7f1d1d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d138f-truth { stroke: #15803d; stroke-width: 3; }
    .d138f-truthlabel { fill: #14532d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d138f-est { fill: #1d4ed8; }
    .d138f-ci { stroke: #1d4ed8; stroke-width: 4; }
    .d138f-cicap { stroke: #1d4ed8; stroke-width: 3; }
    .d138f-biasbar { stroke: #b91c1c; stroke-width: 2.5; fill: none; }
    .d138f-biaslabel { fill: #7f1d1d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }

    /* motion 1: a marching wire from the frame into the sampling column */
    .d138f-wire { stroke: #1d4ed8; stroke-width: 3; fill: none; stroke-dasharray: 11 8;
                  animation: d138f-march 1.8s linear infinite; }
    @keyframes d138f-march { to { stroke-dashoffset: -19; } }

    /* motion 2: a token travelling from the population, through the frame, to the samples */
    .d138f-token { animation: d138f-travel 7s ease-in-out infinite; }
    @keyframes d138f-travel {
      0%, 6%    { transform: translate(0px, 0px); }
      34%, 40%  { transform: translate(0px, 0px); }
      66%       { transform: translate(310px, 0px); }
      100%      { transform: translate(310px, 0px); }
    }

    /* motion 3: the three sample rows emphasised in order */
    .d138f-row { animation: d138f-lift 7s ease-in-out infinite; }
    .d138f-r1 { animation-delay: 0s; }
    .d138f-r2 { animation-delay: 2.33s; }
    .d138f-r3 { animation-delay: 4.66s; }
    @keyframes d138f-lift {
      0%, 26%, 100% { fill: #ffffff; }
      6%, 20%       { fill: #eff6ff; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d138f-wire  { animation: none; stroke-dasharray: none; }
      .d138f-token { animation: none; transform: none; }
      .d138f-row   { animation: none; fill: #ffffff; }
    }
  </style>

  <defs>
    <marker id="d138f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d138f-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
    <marker id="d138f-arrow-red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#b91c1c" />
    </marker>
  </defs>

  <rect class="d138f-bg" x="0" y="0" width="1200" height="760" />

  <text class="d138f-title" x="40" y="46">More data does not fix a biased frame</text>
  <text class="d138f-sub" x="40" y="74">The interval tightens. The answer stays exactly as wrong. Measured values from this day's lab, seed 138, 40 replicates per sample size.</text>

  <!-- left: population and frame -->
  <text class="d138f-cap" x="40" y="118">THE POPULATION</text>
  <rect class="d138f-panel" x="40" y="130" width="380" height="330" rx="10" />

  <rect class="d138f-groupa" x="64" y="158" width="332" height="212" rx="8" />
  <text class="d138f-label" x="84" y="188">Group A — 90% of people</text>
  <text class="d138f-small" x="84" y="212">reachable by the survey's</text>
  <text class="d138f-small" x="84" y="232">daytime telephone frame</text>
  <text class="d138f-small" x="84" y="262">true intercept 2.0</text>

  <rect class="d138f-groupb" x="64" y="290" width="332" height="72" rx="8" />
  <text class="d138f-label" x="84" y="318">Group B — 10% of people</text>
  <text class="d138f-small" x="84" y="342">true intercept 8.0 — six units higher</text>

  <!-- the frame: covers all of A, only a sliver of B -->
  <path class="d138f-frame" d="M 52 146 L 408 146 L 408 300 L 108 300 L 108 376 L 52 376 Z" />
  <text class="d138f-framelabel" x="140" y="400">the sampling frame reaches 1% of group B,</text>
  <text class="d138f-framelabel" x="140" y="422">not 10% — and it always will</text>
  <text class="d138f-small" x="140" y="446">(the dashed outline is the frame; what it excludes is unmeasured, not unmeasurable)</text>

  <!-- travelling token: rests visible at the frame edge -->
  <g class="d138f-token">
    <circle class="d138f-est" cx="424" cy="250" r="10" />
  </g>

  <path class="d138f-wire" d="M 440 250 L 560 250" marker-end="url(#d138f-arrow)" />
  <text class="d138f-small" x="446" y="236">draw n rows</text>

  <!-- right: the three sample sizes -->
  <text class="d138f-cap" x="600" y="118">WHAT GROWING THE SAMPLE INSIDE THAT FRAME BUYS YOU</text>

  <!-- the three sample-size panels, drawn first so the reference lines sit on top -->
  <rect class="d138f-panel d138f-row d138f-r1" x="600" y="156" width="570" height="86" rx="8" />
  <rect class="d138f-panel d138f-row d138f-r2" x="600" y="258" width="570" height="86" rx="8" />
  <rect class="d138f-panel d138f-row d138f-r3" x="600" y="360" width="570" height="86" rx="8" />

  <!-- truth and estimate reference lines -->
  <line class="d138f-truth" x1="950" y1="156" x2="950" y2="470" />
  <text class="d138f-truthlabel" x="950" y="146" text-anchor="middle">truth for group B</text>
  <line x1="1120" y1="156" x2="1120" y2="470" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 5" />
  <text class="d138f-label" x="1120" y="146" text-anchor="middle">the estimate</text>

  <!-- bias bar -->
  <path class="d138f-biasbar" d="M 956 486 L 1114 486" marker-end="url(#d138f-arrow-red)" marker-start="url(#d138f-arrow-red-start)" />
  <text class="d138f-biaslabel" x="1035" y="510" text-anchor="middle">bias = 5.94, at every n</text>

  <!-- row 1 -->
  <text class="d138f-label" x="616" y="184">n = 500</text>
  <text class="d138f-small" x="616" y="208">interval ±0.118</text>
  <text class="d138f-small" x="616" y="230">RMSE 1.167 — looks fine</text>
  <line class="d138f-ci" x1="1080" y1="200" x2="1160" y2="200" />
  <line class="d138f-cicap" x1="1080" y1="188" x2="1080" y2="212" />
  <line class="d138f-cicap" x1="1160" y1="188" x2="1160" y2="212" />
  <circle class="d138f-est" cx="1120" cy="200" r="7" />

  <!-- row 2 -->
  <text class="d138f-label" x="616" y="286">n = 5,000</text>
  <text class="d138f-small" x="616" y="310">interval ±0.035</text>
  <text class="d138f-small" x="616" y="332">RMSE 1.159 — still looks fine</text>
  <line class="d138f-ci" x1="1106" y1="302" x2="1134" y2="302" />
  <line class="d138f-cicap" x1="1106" y1="290" x2="1106" y2="314" />
  <line class="d138f-cicap" x1="1134" y1="290" x2="1134" y2="314" />
  <circle class="d138f-est" cx="1120" cy="302" r="7" />

  <!-- row 3 -->
  <text class="d138f-label" x="616" y="388">n = 50,000</text>
  <text class="d138f-small" x="616" y="412">interval ±0.010</text>
  <text class="d138f-small" x="616" y="434">RMSE 1.165 — still looks fine</text>
  <line class="d138f-ci" x1="1116" y1="404" x2="1124" y2="404" />
  <line class="d138f-cicap" x1="1116" y1="392" x2="1116" y2="416" />
  <line class="d138f-cicap" x1="1124" y1="392" x2="1124" y2="416" />
  <circle class="d138f-est" cx="1120" cy="404" r="7" />

  <text class="d138f-small" x="600" y="540">Intervals are drawn enlarged so the tightening is visible; on the bias bar's own scale all three would be thinner than the line itself.</text>

  <!-- notes -->
  <text class="d138f-note-strong" x="40" y="596">Measured: bias 5.9459, then 5.9384, then 5.9397 — a spread of 0.0075 across a hundredfold increase in n.</text>
  <text class="d138f-note" x="40" y="624">Measured: the interval's standard deviation fell 0.06025, 0.01796, 0.00524 — ratios of 3.35 and 3.43, against the 3.16 that sampling theory predicts for a tenfold increase.</text>
  <text class="d138f-note" x="40" y="652">So precision improved 11.5-fold and accuracy improved not at all. The estimate became a confident wrong answer instead of an uncertain one.</text>
  <text class="d138f-note" x="40" y="680">Group A, the group the frame does reach, is fine throughout: its bias never exceeds 0.062. The model is wrong for exactly the group nobody measured.</text>
  <text class="d138f-note-strong" x="40" y="708">Nothing about the sample size is the problem. The frame is the problem, and the frame is documented in a datasheet field, not in an accuracy score.</text>
</svg>
