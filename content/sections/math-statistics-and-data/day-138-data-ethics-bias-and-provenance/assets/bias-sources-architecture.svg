<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="d138a-title d138a-desc" width="1200" height="720">
  <title id="d138a-title">Where each kind of bias enters the pipeline from the world to a decision</title>
  <desc id="d138a-desc">Five pipeline stages — the world, collection, recording, the dataset, modelling — each annotated with the bias that enters at that stage and the documentation field that records it.</desc>
  <style>
    .d138a-bg { fill: #f8fafc; }
    .d138a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d138a-sub { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; }
    .d138a-stage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d138a-stage-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; text-anchor: middle; }
    .d138a-stage-note { fill: #334155; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; text-anchor: middle; }
    .d138a-bias { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .d138a-bias-label { fill: #7f1d1d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .d138a-bias-note { fill: #7f1d1d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; text-anchor: middle; }
    .d138a-doc { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .d138a-doc-label { fill: #14532d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; text-anchor: middle; }
    .d138a-wire { stroke: #1d4ed8; stroke-width: 3; fill: none; }
    .d138a-drop { stroke: #b91c1c; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .d138a-lift { stroke: #15803d; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .d138a-note { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d138a-note-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d138a-band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d138a-cap { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
  </style>

  <defs>
    <marker id="d138a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d138a-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
    <marker id="d138a-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
  </defs>

  <rect class="d138a-bg" x="0" y="0" width="1200" height="720" />

  <text class="d138a-title" x="40" y="46">Where each bias enters — locate it, then name it</text>
  <text class="d138a-sub" x="40" y="74">Data is not found. It is made, by someone, for a purpose, under constraints — and every one of those decisions is still in the file.</text>

  <text class="d138a-cap" x="40" y="118">BIAS ENTERS HERE</text>
  <rect class="d138a-band" x="30" y="128" width="1140" height="112" rx="8" />

  <!-- bias callouts -->
  <rect class="d138a-bias" x="40" y="140" width="200" height="88" rx="8" />
  <text class="d138a-bias-label" x="140" y="166">Historical bias</text>
  <text class="d138a-bias-note" x="140" y="188">The record is accurate.</text>
  <text class="d138a-bias-note" x="140" y="206">The process it records</text>
  <text class="d138a-bias-note" x="140" y="224">was not just.</text>

  <rect class="d138a-bias" x="270" y="140" width="200" height="88" rx="8" />
  <text class="d138a-bias-label" x="370" y="166">Selection &amp; coverage</text>
  <text class="d138a-bias-note" x="370" y="188">The sampling frame is</text>
  <text class="d138a-bias-note" x="370" y="206">a claim about who is</text>
  <text class="d138a-bias-note" x="370" y="224">in the world.</text>

  <rect class="d138a-bias" x="500" y="140" width="200" height="88" rx="8" />
  <text class="d138a-bias-label" x="600" y="166">Measurement bias</text>
  <text class="d138a-bias-note" x="600" y="188">Arrests are not crimes.</text>
  <text class="d138a-bias-note" x="600" y="206">Clicks are not interest.</text>
  <text class="d138a-bias-note" x="600" y="224">The proxy is not the thing.</text>

  <rect class="d138a-bias" x="960" y="140" width="200" height="88" rx="8" />
  <text class="d138a-bias-label" x="1060" y="166">Aggregation bias</text>
  <text class="d138a-bias-note" x="1060" y="188">One model for a mixed</text>
  <text class="d138a-bias-note" x="1060" y="206">population can be wrong</text>
  <text class="d138a-bias-note" x="1060" y="224">for every subgroup in it.</text>

  <!-- drops from bias into stage -->
  <path class="d138a-drop" d="M 140 228 L 140 292" marker-end="url(#d138a-arrow-red)" />
  <path class="d138a-drop" d="M 370 228 L 370 292" marker-end="url(#d138a-arrow-red)" />
  <path class="d138a-drop" d="M 600 228 L 600 292" marker-end="url(#d138a-arrow-red)" />
  <path class="d138a-drop" d="M 1060 228 L 1060 292" marker-end="url(#d138a-arrow-red)" />

  <!-- pipeline -->
  <rect class="d138a-stage" x="40" y="300" width="200" height="96" rx="10" />
  <text class="d138a-stage-label" x="140" y="334">1. The world</text>
  <text class="d138a-stage-note" x="140" y="358">the process that</text>
  <text class="d138a-stage-note" x="140" y="378">produces outcomes</text>

  <rect class="d138a-stage" x="270" y="300" width="200" height="96" rx="10" />
  <text class="d138a-stage-label" x="370" y="334">2. Collection</text>
  <text class="d138a-stage-note" x="370" y="358">who gets reached,</text>
  <text class="d138a-stage-note" x="370" y="378">and who does not</text>

  <rect class="d138a-stage" x="500" y="300" width="200" height="96" rx="10" />
  <text class="d138a-stage-label" x="600" y="334">3. Recording</text>
  <text class="d138a-stage-note" x="600" y="358">what gets written</text>
  <text class="d138a-stage-note" x="600" y="378">down, and as what</text>

  <rect class="d138a-stage" x="730" y="300" width="200" height="96" rx="10" />
  <text class="d138a-stage-label" x="830" y="334">4. The dataset</text>
  <text class="d138a-stage-note" x="830" y="358">a file, plus the</text>
  <text class="d138a-stage-note" x="830" y="378">decisions inside it</text>

  <rect class="d138a-stage" x="960" y="300" width="200" height="96" rx="10" />
  <text class="d138a-stage-label" x="1060" y="334">5. Modelling</text>
  <text class="d138a-stage-note" x="1060" y="358">one fit, one score,</text>
  <text class="d138a-stage-note" x="1060" y="378">one decision rule</text>

  <path class="d138a-wire" d="M 240 348 L 262 348" marker-end="url(#d138a-arrow)" />
  <path class="d138a-wire" d="M 470 348 L 492 348" marker-end="url(#d138a-arrow)" />
  <path class="d138a-wire" d="M 700 348 L 722 348" marker-end="url(#d138a-arrow)" />
  <path class="d138a-wire" d="M 930 348 L 952 348" marker-end="url(#d138a-arrow)" />

  <!-- documentation row -->
  <path class="d138a-lift" d="M 140 470 L 140 402" marker-end="url(#d138a-arrow-green)" />
  <path class="d138a-lift" d="M 370 470 L 370 402" marker-end="url(#d138a-arrow-green)" />
  <path class="d138a-lift" d="M 600 470 L 600 402" marker-end="url(#d138a-arrow-green)" />
  <path class="d138a-lift" d="M 830 470 L 830 402" marker-end="url(#d138a-arrow-green)" />
  <path class="d138a-lift" d="M 1060 470 L 1060 402" marker-end="url(#d138a-arrow-green)" />

  <text class="d138a-cap" x="40" y="500">THE DATASHEET FIELD THAT MAKES IT CHECKABLE</text>
  <rect class="d138a-doc" x="40" y="510" width="200" height="66" rx="8" />
  <text class="d138a-doc-label" x="140" y="536">purpose,</text>
  <text class="d138a-doc-label" x="140" y="556">known_gaps</text>

  <rect class="d138a-doc" x="270" y="510" width="200" height="66" rx="8" />
  <text class="d138a-doc-label" x="370" y="536">sampling_frame,</text>
  <text class="d138a-doc-label" x="370" y="556">inclusion / exclusion</text>

  <rect class="d138a-doc" x="500" y="510" width="200" height="66" rx="8" />
  <text class="d138a-doc-label" x="600" y="536">population_definition,</text>
  <text class="d138a-doc-label" x="600" y="556">the data dictionary</text>

  <rect class="d138a-doc" x="730" y="510" width="200" height="66" rx="8" />
  <text class="d138a-doc-label" x="830" y="536">collector, licence,</text>
  <text class="d138a-doc-label" x="830" y="556">version, changelog</text>

  <rect class="d138a-doc" x="960" y="510" width="200" height="66" rx="8" />
  <text class="d138a-doc-label" x="1060" y="536">the declared fairness</text>
  <text class="d138a-doc-label" x="1060" y="556">criterion, and why</text>

  <!-- notes -->
  <text class="d138a-note-strong" x="40" y="620">More data does not move any of these. Ten times the sample tightens the interval by about 3.2x around an answer that stays exactly as wrong.</text>
  <text class="d138a-note" x="40" y="648">Historical bias is the one measurement genuinely runs out on: a model that fits an unjust record perfectly reproduces the injustice faithfully.</text>
  <text class="d138a-note" x="40" y="676">Accuracy is not fairness, and no accuracy number on any dashboard will ever say so.</text>
  <text class="d138a-note" x="40" y="704">Every red box above is a decision somebody made. Every green box is where that decision was written down — or where the gap in the record is.</text>
</svg>
