title: 'Transforming Images with Matrices'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 15
learning_promise: 'After this lesson you will be able to rotate, scale, shear and flip an image with matrices you wrote yourself, and check them against a mature library pixel for pixel. You will see that an image IS a matrix — greyscale as (height, width), colour as (height, width, 3) — and you will stop being caught by the ordering trap that rows are y and columns are x, which is the reverse of the (x, y) convention Week 15 used and the single most common source of confusion in the subject. You will learn the idea the whole day rests on: you transform the COORDINATES, not the pixels. You will write forward mapping, watch it punch 22 holes in an 81-pixel picture, and understand why patching them is the wrong instinct — then turn the loop inside out and get a rotation with no holes at all, not because you were careful but because a loop over the output visits every output pixel exactly once. You will meet homogeneous coordinates for the reason they exist: translation moves the origin, Day 102 proved a linear map cannot, so a third coordinate is added and translation becomes a matrix multiply that composes with everything else. You will compose several transformations into one matrix and measure what repeated resampling costs — twelve 30-degree rotations lose 16 of 81 pixels while the same full turn as one matrix loses zero. You will settle, by measurement, the half-pixel question Day 102 raised and deferred: Pillow evaluates an affine transform at each output pixel CENTRE, which is why a shear coefficient of 2.0 moves row 0 even though the shear term is multiplied by y. And you will finish holding a result worth more than any assertion: your twenty-odd lines and Pillow produce byte-for-byte identical output on 510 of 510 transformations — and differ on 8 of the 360 whole-degree rotations, by at most 2 pixels, every one a floating-point tie at a pixel boundary, reported honestly rather than smoothed away.'
objectives:
  - 'Read an image as a matrix — greyscale as (height, width), colour as three stacked planes — and index it as img[y, x] without guessing which number comes first'
  - 'Explain why the origin is top-left and y grows downward for images, and why that makes a counter-clockwise rotation matrix turn a picture clockwise'
  - 'State the idea the day rests on: a transformation acts on coordinates, not on pixel values'
  - 'Implement forward mapping, count the holes it leaves, and explain why they are a property of the loop rather than of the arithmetic'
  - 'Implement inverse mapping with nearest-neighbour sampling, and say why it cannot leave holes'
  - 'Distinguish a hole from clipping, and prove the difference by mapping the fill-valued pixels back'
  - 'Build translation as a 3 by 3 matrix using homogeneous coordinates, and say why no 2 by 2 matrix can do it'
  - 'Compose several transformations into a single matrix, and measure what resampling repeatedly costs instead'
  - 'Choose between nearest-neighbour and bilinear interpolation, and say which kinds of image each is wrong for'
  - 'Convert an affine matrix into Pillow''s six coefficients, remembering that they run output to input'
  - 'Explain why a transformation is evaluated at each pixel''s centre, and what a missing half-pixel looks like when it goes wrong'
  - 'State what affine transformations cannot do — perspective, lens distortion, dense warps — and name what each of those needs instead'
  - 'Report an honest comparison against a library: where it agrees exactly, where it does not, and why the disagreements are floating-point ties'
  - 'Judge whether an augmentation is legitimate for a dataset, and explain why a flip is fine for photographs but not for text or many medical scans'
prerequisites:
  - 'Day 99 — vectors: a point with coordinates, which is what a pixel position is'
  - 'Day 100 — matrices: a rectangle of numbers, which is what an image is'
  - 'Day 101 — matrix multiplication as composition, and the right-to-left order rule that has not changed'
  - 'Day 102 — linear transformations, the columns as landing places, determinants, inverses, and the proof that a linear map cannot move the origin'
  - 'Day 103 — dot products, which is the arithmetic inside every matrix product here'
  - 'Day 104 — NumPy: arrays, shape, dtype and slicing, all used directly today'
  - 'Day 70 — floating point, which is why every comparison in this lesson declares a tolerance and why eight rotations disagree with Pillow'
  - 'Day 43 — python3 -m venv and pip; the lab installs numpy, Pillow and pytest into a lab-local environment'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'No prior image-processing experience, and no mathematics beyond Week 15'
