visuals:
  - id: image-as-matrix-architecture
    file: assets/image-as-matrix-architecture.svg
    type: diagram
    title: 'An image is a matrix: a five by five patch drawn as shaded squares beside the same patch written as numbers, with the row-versus-column trap called out and colour shown as three stacked planes'
    alt: 'Diagram: a five by five patch of a greyscale picture drawn as shaded squares beside the same patch written out as numbers, with the row and column indices labelled in different colours, the mismatch between array indexing and point notation called out explicitly, and a colour image shown as three stacked planes'
    description: 'A static architecture diagram carrying the day''s first idea in one picture: an image is a matrix, and the only hard part is which number comes first. The left panel, headed The picture, shows a five by five corner of the lab''s test pattern drawn as twenty-five squares, each either black or white, with a caption noting that each pixel is one square and one number from 0 for black to 255 for white. Column indices 0 to 4 run across the top in blue and row indices 0 to 4 run down the left in amber, with a blue arrow along the top labelled x equals column and an amber arrow down the left side labelled y equals row, and it grows DOWNWARD. Beneath the grid three lines record that row 0 is the top, that on Day 102''s graphs y grew upward but here it does not, and that this is why a counter-clockwise rotation matrix turns a picture clockwise. The right panel, headed The same thing, as the numbers it really is, shows the identical patch written as a grid of numbers — zeros and two hundred and fifty-fives — with the same blue column indices and amber row indices, and the note that the shape is 5 by 5, which is height then width, so rows first. Two lines below record that the dtype is uint8, one byte per pixel, so twenty-five pixels is twenty-five bytes, and that a colour pixel is three of these, so twenty-five pixels is seventy-five bytes. Two cells are highlighted, one blue and one amber, and dashed green arrows run from each highlighted square in the drawn picture across to its number in the written array, so the correspondence is drawn rather than described. Across the lower left an amber panel headed The one mistake everybody makes, and it never raises states that all week a point has been written x then y while a NumPy array is indexed rows first, and that those are the same two numbers in the opposite order. Two boxed examples sit side by side: img at 3 comma 1 equals 255, labelled row 3, column 1 — the blue square; and img at 1 comma 3 equals 0, labelled row 1, column 3 — a different pixel. Beneath them two lines warn that swapping the two numbers does not make Python complain, that it returns the wrong pixel silently, and that a rotation then comes out transposed with no error anywhere, closing with the rule in large monospace: row is y, column is x, read it back as img at y comma x. The lower right blue panel, headed Colour is not a new idea, shows three overlapping offset rectangles coloured blue, green and red and labelled blue, green and red, with the shape written large as 5 comma 5 comma 3 and annotated height, width, channel. Its caption states that these are three stacked planes, each one a matrix exactly like the one above, and concludes in green that the three share their COORDINATES, so one matrix transforms all three.'
  - id: inverse-mapping-flow
    file: assets/inverse-mapping-flow.svg
    type: flow-animated
    title: 'Forward mapping leaves 22 holes of 81 and inverse mapping leaves none: the same rotation done both ways, ending with the two answers to a sample that fell between pixels'
    alt: 'Diagram: forward mapping pushing input pixels to the output and leaving 22 of 81 output pixels never written, then inverse mapping walking each output pixel backward through the inverse matrix to a position between input pixels, and taking either the nearest pixel or a weighted blend of the four around it'
    description: 'An animated flow diagram in three numbered parts, fully readable as a still image, showing the same 30 degree rotation of the same 9 by 9 picture done two ways, with every number measured rather than illustrated. Part one, headed Forward mapping — walk the INPUT and push each pixel to where it lands, gives the loop in monospace as: for each input pixel, out at floor of M times centre equals in at y at x, with the remark that it reads like the definition of the transformation and that this is exactly why it is tempting. On the left the input is drawn as an 81-square grid showing the capital F test pattern, labelled INPUT — 81 pixels, every one of them read. A marching-dash arrow carrying a small blue travelling token runs across to the right, captioned each pixel flies to wherever it lands. On the right the result is drawn as another 81-square grid labelled OUTPUT — and 22 of the 81 were never written, in which twenty-two squares are filled amber and gently pulse, captioned amber equals a hole: no input pixel ever reached it. An amber panel beside it reads 22 of 81 output pixels never assigned — 27 per cent, then instructs the reader to look WHERE: not only at the edges, single pixels punched through solid ink, and records that the determinant of M is 1 so the rotation lost no area — the rounding did. Two lines below add that enlarging makes it a counting argument rather than a rounding one, since 81 input pixels cannot fill 324 output pixels, so doubling by forward mapping leaves at least 243 holes, and that the measured figure is exactly 243. Part two, headed Inverse mapping — walk the OUTPUT and ask each pixel where it came from, gives its loop in monospace as: for each output pixel, out at y at x equals in at floor of M inverse times centre. On the right the output is drawn as an 81-square grid labelled OUTPUT — every pixel assigned, with a green box outlining one specific pixel and a caption noting that the twelve grey squares are clipped, being pixels whose source lies outside the picture, and are not holes. A green marching-dash arrow carrying a green travelling token runs BACKWARD from that outlined output pixel across to the left, where the input is drawn zoomed to columns 0 to 3 and rows 1 to 4 at sixteen times the size. Between the two, the working is set out: take output pixel row 1 column 2, its centre is 2.5 comma 2.5, send that centre backward, M inverse times 2.5 comma 2.5 equals 1.2679 comma 2.9019 — and in green, it landed between pixels, with the note that it almost always does, that this is not a failure but the normal case, and that it is the question interpolation answers, closing with the observation that every output pixel is visited exactly once so holes are impossible by construction. In the zoomed grid, four blue dots mark the centres of the four pixels surrounding the landing and a green dot marks the landing itself at 1.2679 comma 2.9019, ringed by a circle that pulses outward and rests visible. Part three, headed Two honest answers to a sample that fell between pixels, sets two panels side by side. The blue panel reads NEAREST NEIGHBOUR — take the pixel it fell inside, gives floor of 1.2679 comma 2.9019 equals column 1 row 2 giving 255, and notes hard edges, stair-stepped diagonals, and that every value in the output was already in the input so nothing was invented. The green panel reads BILINEAR — blend the four, weighted by nearness, gives 0.139 times 0 plus 0.459 times 255 plus 0.093 times 0 plus 0.309 times 255 equals 195.83, and notes smooth edges and a value that was never in the input, adding that the four weights sum to exactly 1 so it cannot brighten or darken. A prefers-reduced-motion block stops every animation and restores the resting state, in which the twenty-two holes are amber, both connecting arrows are solid, both travelling tokens sit at the start of their paths, the ring around the landing point is at its resting width, and every grid, number and caption is present.'
