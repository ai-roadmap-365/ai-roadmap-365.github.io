terms:
  - term: 'Raster image'
    definition: 'A picture stored as a rectangular grid of individual samples, one per position, rather than as a description of shapes. Every image in this lesson is a raster image, which is why it is a matrix. The alternative is a vector image, which stores instructions — a line from here to there, a circle of this radius — and is resolution-independent because it is redrawn rather than resampled. Transforming a vector image is exact and lossless; transforming a raster image always involves the resampling question this day is about.'
  - term: 'Pixel'
    definition: 'One sample of a raster image: a single position and the value stored there. The word is a contraction of "picture element", coined at NASA''s Jet Propulsion Laboratory in the 1960s. For the purposes of transformation, a pixel is not a point — it is a little SQUARE. Pixel (x, y) covers the region from (x, y) to (x + 1, y + 1), and the point that represents it is its centre at (x + 0.5, y + 0.5). Treating it as a point at its corner instead is the half-pixel error that displaces an entire image.'
  - term: 'Greyscale'
    definition: 'An image with a single value per pixel, representing brightness. Stored as a 2-D array of shape (height, width) — rows then columns, which is (y, x). With the usual 8-bit depth each value runs from 0 (black) to 255 (white), one byte per pixel, so a 9 by 9 greyscale image is exactly 81 bytes.'
  - term: 'Channel'
    definition: 'One of the stacked planes of a colour image. A standard colour image has three — red, green and blue — giving an array of shape (height, width, 3), where the last axis is the channel. Each channel is a greyscale matrix in its own right. The point that matters for this lesson: the three channels share their COORDINATES, and a transformation acts on coordinates, so the same matrix transforms all three and colour introduces no new mathematics at all.'
  - term: 'Affine transformation'
    definition: 'A linear map followed by a translation, written as a 3 by 3 matrix whose bottom row is (0, 0, 1). The top-left 2 by 2 block is Day 102''s linear part, whose columns are still where the basis vectors land; the third column is the translation. Six numbers, and that is the entire family. Affine transformations guarantee two things: straight lines stay straight, and parallel lines stay parallel. Rotation, scaling, shear, reflection and translation are all affine, as is any composition of them. Perspective is not, and neither is lens distortion.'
  - term: 'Homogeneous coordinates'
    definition: 'Writing the point (x, y) as the triple (x, y, 1) so that a 3 by 3 matrix can add a constant, because the constant is multiplied by that third 1. Introduced by August Ferdinand Möbius in 1827, long before there was any image to apply them to. They exist here for one reason: translation moves the origin, Day 102 proved a linear map cannot, so no 2 by 2 matrix performs a translation — and without a matrix form, a translation cannot be COMPOSED with a rotation into a single operation. The third coordinate is not a z axis and the picture is not three-dimensional; it is a bookkeeping slot.'
  - term: 'Forward mapping'
    definition: 'Transforming an image by walking the INPUT: for each input pixel, work out where it lands and write its value there. It reads like the definition of a transformation, and it does not work. Because the loop runs over the input, nothing guarantees every output pixel is visited — a 30 degree rotation of the 9 by 9 test picture leaves 22 of 81 output pixels never written, including pixels punched through solid ink, and doubling leaves at least 243 of 324 unwritten as a matter of counting. Shrinking leaves no holes but overwrites instead, so which value survives is decided by loop order.'
  - term: 'Inverse mapping'
    definition: 'Transforming an image by walking the OUTPUT: for each output pixel, take its centre, send it backward through the inverse matrix, and take the value it came from. Every real implementation works this way. The guarantee is structural rather than numerical — a loop over the output visits every output pixel exactly once, so "never assigned" is not a state that can occur. Two consequences: the transformation must be invertible, so a determinant of 0 fails before any pixel is touched; and the coefficients a library asks for are in the output-to-input direction, which is the algorithm showing through the interface.'
  - term: 'Interpolation'
    definition: 'Deciding what value to use when an inverse-mapped position lands between pixels, which it almost always does. Not an error state and not a failure — it is the normal case, and the two standard answers are nearest neighbour and bilinear. Interpolation cannot recover detail that was never captured; enlarging an image gives you more pixels and not one bit more information, whatever the resampling rule.'
  - term: 'Nearest neighbour'
    definition: 'The interpolation rule that takes the value of the pixel whose square CONTAINS the sampled position — that is, floor of each coordinate, not rounding. Produces hard, stair-stepped edges, and its defining property is that every value in the output was already in the input. That makes it correct for images whose pixel values are categories rather than quantities: segmentation masks, label maps, indexed palettes. Blending class 3 and class 7 into class 5 is a silent data-corruption bug, and nearest neighbour cannot commit it.'
  - term: 'Bilinear'
    definition: 'The interpolation rule that blends the four pixels surrounding the sampled position, weighted by how close the position is to each — linear in x, then linear in y, hence "bi-linear". The four weights sum to exactly 1, so it can neither brighten nor darken an image overall. Produces smooth edges and produces values that were never in the input, which is both the point and the cost. Right for photographs and any continuous quantity; wrong for anything whose values are categories.'
  - term: 'Clipping'
    definition: 'What happens to an output pixel whose inverse-mapped source lies outside the input image. The corners of a rotated square do not fit inside a square, so something must go there — a fill colour, a mirror of the edge, a wrap-around, or a larger output canvas that avoids the question. Clipping is a DECISION and not a failure, and it is worth distinguishing carefully from a hole: after a 30 degree rotation, inverse mapping leaves 12 fill-valued pixels and every one of them maps back outside the picture, which the lab proves rather than assumes.'
  - term: 'Augmentation'
    definition: 'Applying random transformations — rotations, flips, shears, shifts — to training images so that a model learns the invariances you intend rather than accidents of how the data was collected. It is one of the cheapest and most effective regularisers available, and it is nothing but the arithmetic of this lesson run at volume. An augmentation is legitimate exactly when the transformed image is one that could genuinely occur in your data with the SAME label: a mirrored cat is a plausible cat, mirrored text is not text, and a mirrored chest X-ray depicts a rare and clinically significant condition rather than a normal patient.'
  - term: 'Resampling'
    definition: 'The act of reading an image at positions that are not its own pixel positions, which is what applying any transformation other than an exact quarter turn or flip involves. Every resampling pass quantises the result to whole pixel values and discards the sub-pixel remainder, and the loss is not recoverable by a later pass. Measured here: twelve separate 30 degree rotations lose 16 of 81 pixels, while the same full turn composed into one matrix and resampled once loses exactly zero. Compose the matrices; resample once.'
  - term: 'Composition'
    definition: 'Multiplying several transformation matrices together into one, applied right to left so that compose(B, A) means "do A first, then B" — the Day 101 convention, unchanged. Composition is only possible for translations because homogeneous coordinates gave them a matrix form. It is both cheaper (one pass over the pixels instead of several) and more accurate (one quantisation instead of several), which is a rare combination and worth always taking.'
  - term: 'Projective transformation'
    definition: 'The next family up from affine: a 3 by 3 matrix whose bottom row is NOT (0, 0, 1), so the third coordinate does not come out as 1 and the first two must be divided by it. That division is what makes distant things smaller, and it is why parallel lines can converge. This is what perspective needs and what no affine transformation can produce. It is about five lines more code than the affine case.'
