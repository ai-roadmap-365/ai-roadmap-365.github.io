questions:
  - question: 'You rotate an image by walking every input pixel, working out where the matrix sends it, and writing the value there. The result has single pixels missing from the middle of solid areas. Why?'
    options:
      - 'Nothing guarantees every output pixel is visited'
      - 'Rotation does not preserve area, so the output is larger than the input can fill'
      - 'Floating-point error accumulates across the loop and eventually skips a pixel'
      - 'The rotation matrix has a sign error, so some pixels are sent outside the output'
    answer_index: 0
    explanation: 'The holes are a property of which array the loop iterates over, not of the arithmetic inside it. Walking the input means you visit every input pixel exactly once — but you have no control over which output pixels get written, and the rounded landing positions collide unevenly: some output pixels collect two input pixels while their neighbours collect none. On the 9 by 9 test picture a 30 degree rotation leaves 22 of 81 output pixels unwritten, including pixels punched through the middle of the glyph. The second option gets the geometry exactly backwards and is worth ruling out carefully: a rotation''s determinant is exactly 1, so it preserves area precisely — which is why the holes cannot be blamed on the output being too big. The first option describes a real and common bug, but a sign error gives you a picture rotated the wrong way, not a picture with speckle in it. The third misunderstands the scale of floating-point error, which is around 1e-16 and never reaches a rounding boundary. The fix is not to patch the holes afterwards — that is a second pass that guesses — but to turn the loop inside out.'
  - question: 'Why does every real image library use inverse mapping — walking the output and looking backward — rather than forward mapping?'
    options:
      - 'It is faster, because the inverse matrix is cheaper to compute than the forward one'
      - 'It visits every output pixel exactly once'
      - 'It is more numerically accurate, because the inverse matrix has smaller entries'
      - 'It is the only direction in which interpolation is defined'
    answer_index: 1
    explanation: 'The guarantee is structural rather than numerical. If your loop runs over the output array, then by the time the loop ends you have been to every slot and written to every slot, so "never assigned" is not a state that can occur. That is not a claim about the arithmetic being better — it is a claim about which array you iterate. The first option is wrong twice over: inverting a 3 by 3 affine matrix is done once for the whole image and costs nothing either way, and inverse mapping''s cost is proportional to the OUTPUT size, so upscaling is actually more expensive. The second is not a real property; the inverse of a rotation is another rotation with entries of exactly the same size. The fourth is tempting but false — you could interpolate in a forward-mapped scheme too, by splatting each input pixel across several output pixels with weights; it is just far more work and still does not guarantee coverage. One consequence worth carrying: because inverse mapping needs the inverse, a transformation with determinant 0 cannot be applied at all, and the error arrives before any pixel is touched.'
  - question: 'Why does translation require homogeneous coordinates — a third coordinate fixed at 1 — when rotation, scaling and shear do not?'
    options:
      - 'Because translation is the only transformation that needs floating-point coefficients'
      - 'Because translation changes the image size, and only a 3 by 3 matrix can encode a size change'
      - 'Because translation moves the origin, and Day 102 proved that no linear map can do that'
      - 'Because a 2 by 2 matrix cannot represent negative offsets'
    answer_index: 2
    explanation: 'Every 2 by 2 matrix sends (0, 0) to (0, 0), and the reason is one line of arithmetic: the result is the columns weighted by the input coordinates, and weighting anything by zero and zero gives zero. Translation by (3, 0) sends the origin to (3, 0). So translation is not a linear map and no 2 by 2 matrix performs it — not because we have not found the right one, but because the right one cannot exist. Writing the point (x, y) as the triple (x, y, 1) fixes it: now the third column of a 3 by 3 matrix is multiplied by that 1, so it can add a constant. The third coordinate is not a z axis and the picture has not become three-dimensional; it is a bookkeeping slot whose only job is to give the translation something to multiply. The second option confuses the transformation with the output canvas — translation does not change the image size, and you choose the output size separately. The third is false: a rotation by 30 degrees has thoroughly irrational coefficients while a translation by 3 pixels is an integer. The fourth is simply wrong; 2 by 2 matrices hold negative numbers happily, which is how reflections work. The payoff is composition: once translation is a matrix, it can be multiplied together with rotations and scales into a single matrix, which is what lets you resample once instead of three times.'
  - question: 'You have a NumPy image array and the point (x, y) = (3, 4). Which expression reads that pixel?'
    options:
      - 'img[3, 4]'
      - 'Either — NumPy accepts both orders and resolves them from the shape'
      - 'img[3][4] for greyscale and img[4][3] for colour'
      - 'img[4, 3]'
    answer_index: 3
    explanation: 'A NumPy array is indexed rows first, and the row is y. So the point (x, y) is read back as img[y, x] — here img[4, 3]. This is the single most common source of confusion in image work, and what makes it dangerous is that getting it wrong does not raise: img[3, 4] is a perfectly valid index into a different pixel, so Python returns a wrong answer silently and your rotation comes out transposed with no error anywhere to guide you. The lab asserts the trap directly: on its test pattern img[4, 3] is 255 and img[3, 4] is 0. The third option invents a distinction that does not exist — the row-first rule is identical for greyscale and colour, and colour simply adds a third index for the channel, so a colour pixel is img[y, x] giving three numbers. The fourth is a comforting fiction; NumPy has no idea what your two numbers were meant to mean and cannot rescue you. The rule worth writing down: row is y, column is x, shape is (height, width).'
  - question: 'You need to rotate an image 30 degrees, scale it, and shift it. Why compose the three matrices into one rather than applying them as three passes?'
    options:
      - 'Each pass quantises to whole pixels, so three passes degrade'
      - 'Because matrix multiplication does not commute, so three passes would apply them in the wrong order'
      - 'Only to save memory; the pixel results are identical either way'
      - 'Because Pillow only accepts one matrix per call'
    answer_index: 0
    explanation: 'Every resampling pass rounds each sampled position to a whole pixel and throws away the sub-pixel remainder, and the next pass has no way of knowing what was lost. Composing keeps all the arithmetic in the matrix, where it stays in full floating-point precision, and quantises exactly once. The measurements from the lab make it concrete: three passes versus one differed in 36 of 324 pixels — 11 per cent of the image — and the composed version is the correct one. The starkest case is a full turn: rotation by 2 pi as a single matrix changes exactly zero pixels of the 81, while twelve separate 30 degree rotations lose 16. Same 360 degrees, different number of resamplings. The first option is the trap, and it is the belief this question exists to break: composing does save memory and time, but the accuracy gain is the bigger prize. The second is a genuine fact about matrices stated irrelevantly — three sequential passes do apply the operations in a well-defined order, and you can get that order right; the problem is the resampling between them. The fourth is false; you can call Pillow as many times as you like, which is precisely how people end up with this bug.'
  - question: 'You inverse-map an output pixel and the source position lands at (1.2679, 2.9019) — between pixels. What does nearest-neighbour interpolation do, and when is it the right choice?'
    options:
      - 'It rounds to (1, 3) and is right for photographs, because it avoids blurring'
      - 'It takes floor, and is right for label masks'
      - 'It leaves the pixel at the fill value, and is right only for exact quarter turns'
      - 'It averages the two closest pixels, and is right whenever speed matters'
    answer_index: 1
    explanation: 'Nearest-neighbour takes floor of the sampled position, because you want the input pixel whose square CONTAINS the point — floor(1.2679, 2.9019) is column 1, row 2. The property that decides where it belongs is that every value in the output was already in the input; nothing is invented. That makes it correct, and bilinear incorrect, for images whose pixel values are categories rather than quantities: segmentation masks, label maps, indexed palettes. Blending class 3 and class 7 into class 5 is a silent data-corruption bug that surfaces only in your metrics. The first option gets both halves wrong: floor is not the same as rounding, and for photographs at odd angles nearest-neighbour is usually the WORSE choice because it produces jagged, stair-stepped edges — bilinear is the normal pick there. The second describes bilinear, badly: bilinear blends four pixels rather than two, and while nearest-neighbour is indeed cheaper, speed is rarely the reason to choose it. The third confuses interpolation with clipping; the fill value is for sources that fall outside the picture entirely. Worth noting that for exact quarter turns and flips the question does not arise at all, because every pixel lands on a pixel and no interpolation happens.'
  - question: 'Pillow''s affine coefficients (a, b, c, d, e, f) are passed with c = +1 and everything else at identity. Which way does the picture appear to move, and why?'
    options:
      - 'It does not move; c only takes effect when a or b is non-zero'
      - 'Right by one pixel, because c is the x translation'
      - 'Left by one pixel — the coefficients are the inverse map'
      - 'Right by half a pixel, because sampling happens at pixel centres'
    answer_index: 2
    explanation: 'Pillow''s coefficients mean input_x = a·output_x + b·output_y + c — they describe where each OUTPUT pixel should look in the INPUT, which is the inverse of the effect you see. A positive c tells every output pixel to look one pixel further right in the source, so the content appears to move LEFT. The lab measures it in one line: a single bright pixel at input x = 3 comes out at x = 2. This is not an API quirk; it is the inverse-mapping algorithm showing through the interface, because output-to-input is the only direction in which the operation fills every output pixel exactly once. The practical consequence is that you read the coefficients off the INVERSE of the matrix you mean, so to_pillow_coefficients(translation(1, 0)) is (1.0, 0.0, -1.0, 0.0, 1.0, 0.0) — note the minus. Forgetting to invert is the most common way to get a Pillow transform backwards, and it does not raise; it just moves the picture the wrong way. The second option is the mistake this question exists to catch. The third is false — c acts independently of the linear part. The fourth confuses the half-pixel sampling offset, which is a real and separate thing, with the translation coefficient; the half decides which pixel a sample falls in, not how far the picture moves.'
  - question: 'A from-scratch implementation and Pillow produce byte-for-byte identical output on 510 random affine transformations, but disagree on 8 of the 360 whole-degree rotations — 30, 60, 120, 150, 210, 240, 300 and 330 — by at most 2 pixels of 81. What is the best explanation?'
    options:
      - 'The from-scratch implementation has a bug that only shows on multiples of 30 degrees'
      - 'The random transformations were not testing rotations, so the two sets are not comparable'
      - 'Pillow uses a different interpolation rule for those angles'
      - 'Those angles put samples exactly on pixel boundaries'
    answer_index: 3
    explanation: 'Every disagreeing sample landed within 2.22e-15 of a pixel boundary — about one unit in the last place. At 30 degrees the source row for one output pixel comes out as 4.999999999999999 where the exact answer is 5, so one implementation floors to 4 and the other reaches 5.0 and floors to 5. Neither is wrong. Pillow''s C loop accumulates the source coordinate step by step along each output row while the Python evaluates the whole expression per pixel; same formula, different rounding in the last bit. The instructive part is WHICH angles failed: every one is a "nice" angle whose sine or cosine is exactly a half or half the square root of three, and those exact values are precisely what put samples on boundaries. The angles nobody would think to test — 37 degrees, 113 degrees — all agreed. Round numbers are where floating-point ties live, which is the opposite of most people''s intuition about safe test cases. The first option is the tempting conclusion and the one worth resisting: a bug that produced systematically wrong pixels would not confine itself to 8 of 368 cases at exactly 2 pixels or fewer, and would not place every disagreement within one ulp of a boundary. The third is false — the same NEAREST rule was used throughout. The fourth is wrong on the facts; the random set included rotations, and it also included deliberate quarter- and half-turn edge cases. The practical lesson: if you need bit-identical output across libraries, keep samples away from boundaries or state a one-pixel tolerance.'
