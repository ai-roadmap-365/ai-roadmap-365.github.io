<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1010" role="img" aria-labelledby="d105a-title d105a-desc" width="1240" height="1010">
  <title id="d105a-title">An image is a matrix, and rows are y while columns are x</title>
  <desc id="d105a-desc">A five by five patch of a greyscale picture drawn as shaded squares beside the same patch written out as numbers, with the row and column indices labelled, the mismatch between array indexing and point notation called out explicitly, and a colour image shown as three stacked planes.</desc>

  <style>
    .d105a-bg     { fill: #f8fafc; }
    .d105a-title  { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; }
    .d105a-sub    { fill: #334155; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; }
    .d105a-head   { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; }
    .d105a-text   { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; }
    .d105a-small  { fill: #334155; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d105a-mono   { fill: #1a202c; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 18px; }
    .d105a-monosm { fill: #334155; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; }
    .d105a-monobig{ fill: #1a202c; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 21px; font-weight: 700; }

    .d105a-panel  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d105a-note   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d105a-warn   { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }

    .d105a-ink    { fill: #1a202c; stroke: #94a3b8; stroke-width: 1; }
    .d105a-paper  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
    .d105a-cellA  { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 3; }
    .d105a-cellB  { fill: #fde68a; stroke: #b45309; stroke-width: 3; }

    .d105a-idx    { fill: #1d4ed8; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; }
    .d105a-idy    { fill: #b45309; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; }
    .d105a-lblx   { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d105a-lbly   { fill: #b45309; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d105a-axisx  { stroke: #1d4ed8; stroke-width: 3; fill: none; }
    .d105a-axisy  { stroke: #b45309; stroke-width: 3; fill: none; }
    .d105a-link   { stroke: #15803d; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
    .d105a-numA   { fill: #1d4ed8; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 19px; font-weight: 700; }
    .d105a-numB   { fill: #b45309; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 19px; font-weight: 700; }

    .d105a-planeR { fill: #fecaca; stroke: #b91c1c; stroke-width: 2; }
    .d105a-planeG { fill: #bbf7d0; stroke: #15803d; stroke-width: 2; }
    .d105a-planeB { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 2; }
    .d105a-good   { fill: #15803d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
  </style>

  <defs>
    <marker id="d105a-arrowblue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1d4ed8"/>
    </marker>
    <marker id="d105a-arrowamber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#b45309"/>
    </marker>
    <marker id="d105a-arrowgreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect class="d105a-bg" x="0" y="0" width="1240" height="1010"/>

  <text class="d105a-title" x="40" y="48">An image IS a matrix. The only hard part is which number comes first.</text>
  <text class="d105a-sub" x="40" y="82">A five by five corner of this lab's test picture, drawn on the left and written out on the right. They are the same object.</text>

  <!-- ================= LEFT: the picture as squares ================= -->
  <text class="d105a-head" x="40" y="132">The picture</text>
  <text class="d105a-small" x="40" y="156">each pixel is one square, and one number from 0 (black) to 255 (white)</text>

  <!-- column index labels -->
  <text class="d105a-idx" x="185" y="196" text-anchor="middle">0</text>
  <text class="d105a-idx" x="255" y="196" text-anchor="middle">1</text>
  <text class="d105a-idx" x="325" y="196" text-anchor="middle">2</text>
  <text class="d105a-idx" x="395" y="196" text-anchor="middle">3</text>
  <text class="d105a-idx" x="465" y="196" text-anchor="middle">4</text>

  <!-- row index labels -->
  <text class="d105a-idy" x="132" y="252" text-anchor="middle">0</text>
  <text class="d105a-idy" x="132" y="322" text-anchor="middle">1</text>
  <text class="d105a-idy" x="132" y="392" text-anchor="middle">2</text>
  <text class="d105a-idy" x="132" y="462" text-anchor="middle">3</text>
  <text class="d105a-idy" x="132" y="532" text-anchor="middle">4</text>

  <!-- row 0: 0 255 255 255 255 -->
  <rect class="d105a-ink"   x="150" y="210" width="70" height="70"/>
  <rect class="d105a-paper" x="220" y="210" width="70" height="70"/>
  <rect class="d105a-paper" x="290" y="210" width="70" height="70"/>
  <rect class="d105a-paper" x="360" y="210" width="70" height="70"/>
  <rect class="d105a-paper" x="430" y="210" width="70" height="70"/>
  <!-- row 1 -->
  <rect class="d105a-ink"   x="150" y="280" width="70" height="70"/>
  <rect class="d105a-paper" x="220" y="280" width="70" height="70"/>
  <rect class="d105a-paper" x="290" y="280" width="70" height="70"/>
  <rect class="d105a-ink"   x="360" y="280" width="70" height="70"/>
  <rect class="d105a-ink"   x="430" y="280" width="70" height="70"/>
  <!-- row 2 -->
  <rect class="d105a-ink"   x="150" y="350" width="70" height="70"/>
  <rect class="d105a-paper" x="220" y="350" width="70" height="70"/>
  <rect class="d105a-paper" x="290" y="350" width="70" height="70"/>
  <rect class="d105a-ink"   x="360" y="350" width="70" height="70"/>
  <rect class="d105a-ink"   x="430" y="350" width="70" height="70"/>
  <!-- row 3: the highlighted A cell is (row 3, column 1) -->
  <rect class="d105a-ink"   x="150" y="420" width="70" height="70"/>
  <rect class="d105a-cellA" x="220" y="420" width="70" height="70"/>
  <rect class="d105a-paper" x="290" y="420" width="70" height="70"/>
  <rect class="d105a-ink"   x="360" y="420" width="70" height="70"/>
  <rect class="d105a-ink"   x="430" y="420" width="70" height="70"/>
  <!-- row 4 -->
  <rect class="d105a-ink"   x="150" y="490" width="70" height="70"/>
  <rect class="d105a-paper" x="220" y="490" width="70" height="70"/>
  <rect class="d105a-paper" x="290" y="490" width="70" height="70"/>
  <rect class="d105a-paper" x="360" y="490" width="70" height="70"/>
  <rect class="d105a-cellB" x="430" y="490" width="70" height="70"/>

  <!-- the two axes, coloured to match the index labels -->
  <path class="d105a-axisx" d="M 150 178 L 480 178" marker-end="url(#d105a-arrowblue)"/>
  <text class="d105a-lblx" x="492" y="184">x = column</text>
  <path class="d105a-axisy" d="M 118 210 L 118 545" marker-end="url(#d105a-arrowamber)"/>
  <text class="d105a-lbly" x="40" y="590">y = row, and it grows DOWNWARD</text>
  <text class="d105a-small" x="40" y="614">row 0 is the TOP. On Day 102's graphs y grew upward; here it does not.</text>
  <text class="d105a-small" x="40" y="638">That is why a counter-clockwise rotation matrix turns a picture clockwise.</text>

  <!-- ================= RIGHT: the same thing as numbers ================= -->
  <text class="d105a-head" x="620" y="132">The same thing, as the numbers it really is</text>
  <text class="d105a-small" x="620" y="156">shape (5, 5) — that is (height, width), so rows first</text>

  <rect class="d105a-panel" x="620" y="176" width="580" height="400" rx="6"/>

  <text class="d105a-idx" x="760" y="212" text-anchor="middle">0</text>
  <text class="d105a-idx" x="840" y="212" text-anchor="middle">1</text>
  <text class="d105a-idx" x="920" y="212" text-anchor="middle">2</text>
  <text class="d105a-idx" x="1000" y="212" text-anchor="middle">3</text>
  <text class="d105a-idx" x="1080" y="212" text-anchor="middle">4</text>
  <text class="d105a-lblx" x="1110" y="212">column</text>

  <text class="d105a-idy" x="690" y="256" text-anchor="middle">0</text>
  <text class="d105a-idy" x="690" y="306" text-anchor="middle">1</text>
  <text class="d105a-idy" x="690" y="356" text-anchor="middle">2</text>
  <text class="d105a-idy" x="690" y="406" text-anchor="middle">3</text>
  <text class="d105a-idy" x="690" y="456" text-anchor="middle">4</text>
  <text class="d105a-lbly" x="644" y="500">row</text>

  <text class="d105a-mono" x="760" y="256" text-anchor="middle">0</text>
  <text class="d105a-mono" x="840" y="256" text-anchor="middle">255</text>
  <text class="d105a-mono" x="920" y="256" text-anchor="middle">255</text>
  <text class="d105a-mono" x="1000" y="256" text-anchor="middle">255</text>
  <text class="d105a-mono" x="1080" y="256" text-anchor="middle">255</text>

  <text class="d105a-mono" x="760" y="306" text-anchor="middle">0</text>
  <text class="d105a-mono" x="840" y="306" text-anchor="middle">255</text>
  <text class="d105a-mono" x="920" y="306" text-anchor="middle">255</text>
  <text class="d105a-mono" x="1000" y="306" text-anchor="middle">0</text>
  <text class="d105a-mono" x="1080" y="306" text-anchor="middle">0</text>

  <text class="d105a-mono" x="760" y="356" text-anchor="middle">0</text>
  <text class="d105a-mono" x="840" y="356" text-anchor="middle">255</text>
  <text class="d105a-mono" x="920" y="356" text-anchor="middle">255</text>
  <text class="d105a-mono" x="1000" y="356" text-anchor="middle">0</text>
  <text class="d105a-mono" x="1080" y="356" text-anchor="middle">0</text>

  <text class="d105a-mono" x="760" y="406" text-anchor="middle">0</text>
  <text class="d105a-numA" x="840" y="406" text-anchor="middle">255</text>
  <text class="d105a-mono" x="920" y="406" text-anchor="middle">255</text>
  <text class="d105a-mono" x="1000" y="406" text-anchor="middle">0</text>
  <text class="d105a-mono" x="1080" y="406" text-anchor="middle">0</text>

  <text class="d105a-mono" x="760" y="456" text-anchor="middle">0</text>
  <text class="d105a-mono" x="840" y="456" text-anchor="middle">255</text>
  <text class="d105a-mono" x="920" y="456" text-anchor="middle">255</text>
  <text class="d105a-mono" x="1000" y="456" text-anchor="middle">255</text>
  <text class="d105a-numB" x="1080" y="456" text-anchor="middle">255</text>

  <text class="d105a-monosm" x="644" y="536">dtype uint8 — one byte per pixel, so 25 pixels is 25 bytes</text>
  <text class="d105a-monosm" x="644" y="558">a colour pixel is three of these, so 25 pixels is 75 bytes</text>

  <!-- dashed links tying the two highlighted cells to their numbers -->
  <path class="d105a-link" d="M 292 455 C 420 470, 560 430, 700 408" marker-end="url(#d105a-arrowgreen)"/>
  <path class="d105a-link" d="M 502 525 C 560 520, 600 480, 700 458" marker-end="url(#d105a-arrowgreen)"/>

  <!-- ================= THE TRAP ================= -->
  <rect class="d105a-warn" x="40" y="666" width="700" height="304" rx="8"/>
  <text class="d105a-head" x="64" y="702">The one mistake everybody makes, and it never raises</text>

  <text class="d105a-text" x="64" y="740">All week a point has been written (x, y). A NumPy array is indexed rows first.</text>
  <text class="d105a-text" x="64" y="766">Those are the SAME two numbers in the OPPOSITE order.</text>

  <rect class="d105a-panel" x="64" y="786" width="320" height="80" rx="6"/>
  <text class="d105a-monobig" x="80" y="820">img[3, 1] = 255</text>
  <text class="d105a-monosm" x="80" y="848">row 3, column 1 — the blue square</text>

  <rect class="d105a-panel" x="404" y="786" width="320" height="80" rx="6"/>
  <text class="d105a-monobig" x="420" y="820">img[1, 3] = 0</text>
  <text class="d105a-monosm" x="420" y="848">row 1, column 3 — a different pixel</text>

  <text class="d105a-text" x="64" y="900">Swap the two numbers and Python does not complain. It returns the wrong pixel,</text>
  <text class="d105a-text" x="64" y="926">silently, and your rotation comes out transposed with no error anywhere.</text>
  <text class="d105a-monobig" x="64" y="956">row is y   ·   column is x   ·   read it back as img[y, x]</text>

  <!-- ================= COLOUR AS THREE PLANES ================= -->
  <text class="d105a-head" x="790" y="644">Colour is not a new idea</text>

  <rect class="d105a-note" x="790" y="666" width="410" height="304" rx="8"/>

  <rect class="d105a-planeB" x="826" y="700" width="150" height="112"/>
  <text class="d105a-mono" x="901" y="762" text-anchor="middle">blue</text>
  <rect class="d105a-planeG" x="856" y="730" width="150" height="112"/>
  <text class="d105a-mono" x="931" y="792" text-anchor="middle">green</text>
  <rect class="d105a-planeR" x="886" y="760" width="150" height="112"/>
  <text class="d105a-mono" x="961" y="822" text-anchor="middle">red</text>

  <text class="d105a-mono" x="1054" y="716">shape</text>
  <text class="d105a-monobig" x="1054" y="744">(5, 5, 3)</text>
  <text class="d105a-small" x="1054" y="770">height,</text>
  <text class="d105a-small" x="1054" y="790">width,</text>
  <text class="d105a-small" x="1054" y="810">channel</text>

  <text class="d105a-text" x="814" y="880">Three stacked planes. Each one is a matrix</text>
  <text class="d105a-text" x="814" y="906">exactly like the one above.</text>
  <text class="d105a-good" x="814" y="940">The three share their COORDINATES,</text>
  <text class="d105a-good" x="814" y="962">so one matrix transforms all three.</text>
</svg>
