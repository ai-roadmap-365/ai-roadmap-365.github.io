<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three choices.">
  <title>Interpolation</title>
  <style>
    .interpolation-bg   { fill: #f8fafc; }
    .interpolation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interpolation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .interpolation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .interpolation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .interpolation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .interpolation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .interpolation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .interpolation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .interpolation-stage { opacity: 1; }

    .interpolation-s0 { animation-delay: 0.00s; }
    .interpolation-e0 { animation-delay: 0.00s; }
    .interpolation-s1 { animation-delay: 1.50s; }
    .interpolation-e1 { animation-delay: 1.50s; }
    .interpolation-s2 { animation-delay: 3.00s; }
    .interpolation-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .interpolation-conn  { animation: interpolation-trace 6s ease-in-out infinite; }
      .interpolation-stage { animation: interpolation-arrive 6s ease-in-out infinite; }
    }
    @keyframes interpolation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes interpolation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .interpolation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .interpolation-stage { animation: interpolation-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes interpolation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="interpolation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="interpolation-bg" width="980" height="322"/>
  <text class="interpolation-h1"  x="30" y="40">Interpolation</text>
  <text class="interpolation-sub" x="30" y="64">Three choices.</text>
  <g class="interpolation-stage interpolation-s0">
    <rect class="interpolation-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="interpolation-step" x="44" y="142">01</text>
    <text class="interpolation-name" x="70" y="142">Nearest neighbour: take the closest pixel</text>
    <text class="interpolation-desc" x="44" y="166">Fast, and visibly blocky.</text>
  </g>
  <line class="interpolation-line interpolation-conn interpolation-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#interpolation-tip)"/>
  <g class="interpolation-stage interpolation-s1">
    <rect class="interpolation-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="interpolation-step" x="359" y="142">02</text>
    <text class="interpolation-name" x="385" y="142">Bilinear: weight the four surrounding pixels</text>
    <text class="interpolation-desc" x="359" y="166">Smooth, and slightly soft.</text>
  </g>
  <line class="interpolation-line interpolation-conn interpolation-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#interpolation-tip)"/>
  <g class="interpolation-stage interpolation-s2">
    <rect class="interpolation-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="interpolation-step" x="674" y="142">03</text>
    <text class="interpolation-name" x="700" y="142">Higher order: use a wider neighbourhood</text>
    <text class="interpolation-desc" x="674" y="166">Sharper, slower, and can overshoot.</text>
  </g>
  <text class="interpolation-sub" x="30" y="304">The choice changes the pixel values a model sees, which makes it a training decision rather than a rendering preference — augmentation pipelines specify it explicitly.</text>
</svg>
