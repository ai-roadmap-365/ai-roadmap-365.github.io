questions:
  - question: 'Two samples of 30 users, drawn from the exact same population, give average session lengths of 42 seconds and 51 seconds. What does this demonstrate?'
    options:
      - 'One of the two measurements must contain an error'
      - 'The population itself changed between the two measurements'
      - 'A sample statistic is itself a random variable with its own distribution, so two honest samples can legitimately disagree'
      - 'Session length is not a valid metric to measure this way'
    answer_index: 2
    explanation: 'Nothing was done incorrectly in either measurement. A sample mean is a function of which particular users happened to land in the sample, and different samples produce different means -- that variation is exactly what a sampling distribution and its standard error describe. Reporting either 42 or 51 as "the" answer, without the spread, is the mistake this lesson exists to prevent.'

  - question: 'The standard error of the mean is sigma / sqrt(n). If n is quadrupled from 100 to 400, what happens to the standard error?'
    options:
      - 'It falls to one half of its previous value'
      - 'It falls to one quarter of its previous value'
      - 'It stays the same, since only the variance changes with n'
      - 'It falls to one sixteenth of its previous value'
    answer_index: 0
    explanation: 'sqrt(400)/sqrt(100) = 20/10 = 2, so the standard error is divided by 2, not 4. This lesson measured it directly across four sample sizes each 4x the last (10, 40, 160, 640) and found ratios of 1.985, 1.991 and 2.011 -- consistently near 2.0, and the compounded ratio from n=10 to n=640 came out to 7.95 against a predicted sqrt(64)=8.00, nowhere near the 64x a 1/n law would predict.'

  - question: 'What is the difference between the law of large numbers and the central limit theorem?'
    options:
      - 'They are two names for the same result'
      - 'The LLN applies only to discrete random variables and the CLT only to continuous ones'
      - 'The CLT is a special case of the LLN that only applies to Normal populations'
      - 'The LLN says the sample mean converges to the true mean; the CLT says how fast (1/sqrt(n)) and what shape the errors take (Normal, given finite variance)'
    answer_index: 3
    explanation: 'This is the distinction most commonly conflated. Jacob Bernoulli''s 1713 result (published posthumously in Ars Conjectandi) established convergence -- more data gets you closer to the truth. It says nothing about the rate or the shape of the errors along the way. The central limit theorem, building on Abraham de Moivre''s 1733 result and generalized by Pierre-Simon Laplace, supplies exactly that missing rate and shape.'

  - question: 'An Exponential population''s sample mean tightens by about 9.85x from n=10 to n=1,000 (a 100x increase in data). A standard Cauchy population''s sample mean, measured the same way, shows a ratio of only 1.02x. What explains the difference?'
    options:
      - 'The Cauchy measurement used too few trials to detect the shrinkage'
      - 'The Exponential population happened to have unusually low variance in this run'
      - 'The Cauchy distribution has no defined mean or variance, so the mean of n Cauchy draws is itself Cauchy distributed with the same spread for every n -- the central limit theorem''s finite-variance condition fails outright'
      - 'The IQR is not a valid spread measure for comparing the two distributions'
    answer_index: 2
    explanation: 'This is the central limit theorem''s condition, not decoration. Averaging more Cauchy draws is mathematically no better than looking at a single one, because there is no finite population variance for the averaging process to shrink toward. The interquartile range (IQR) is used specifically because a Cauchy sample''s own standard deviation is not an estimate of anything -- the quantity it would estimate does not exist.'

  - question: 'A sampler restricted to drawing only from the upper half of a population shows a mean absolute error of 2.0712 at n=30 and 2.0722 at n=3,000 -- essentially unchanged despite 100x more data. An honest sampler''s error shrinks from 0.4455 to 0.0433 (10.28x) over the same range. What does the biased sampler''s result demonstrate?'
    options:
      - 'The biased sampler needs an even larger n before its error will start shrinking'
      - 'The mean absolute error formula was applied incorrectly'
      - 'Both samplers actually behaved the same way, within rounding'
      - 'Sampling bias does not shrink with more data, because it is a mismatch between the sampling frame and the target population, not sampling error -- more data buys a more precise estimate of the wrong number'
    answer_index: 3
    explanation: 'This is the practical lesson the mathematics cannot rescue you from. The biased sampler''s confidence interval DOES get tighter as n grows, because its variance still shrinks -- but its center stays fixed on the biased pool''s mean, which is not the true population mean. A confidently precise wrong answer is exactly what sampling bias looks like from the inside, and no amount of additional data collected the same way fixes it.'

  - question: 'The bootstrap standard error of a sample mean (0.7195) is checked against the formula sigma_hat/sqrt(n) (0.7118) and agrees within about 1%. The same bootstrap code is then applied to the sample median, giving 0.5740. Why is this second result checked against fresh samples rather than a formula?'
    options:
      - 'Because the median is always less reliable than the mean and should never be trusted'
      - 'Because no simple closed-form standard error exists for the median, which is precisely why the bootstrap -- resample, recompute, read off the spread -- is a genuinely useful technique rather than a redundant one'
      - 'Because bootstrapping only works correctly for the arithmetic mean'
      - 'Because the median formula is too complicated to implement in this lab'
    answer_index: 1
    explanation: 'The mean case is a sanity check on the method, using a statistic where an independent formula exists to compare against. The median case is the actual point of the exercise: the exact same resample-and-recompute code, unchanged, produces a usable standard error for a statistic that has no simple formula at all -- checked here against the spread of medians from genuinely fresh, independent samples of the same population.'

  - question: 'An autocorrelated (AR(1)) series has a true standard error, measured by replication, of 0.1692. The naive sample_std/sqrt(n) formula applied to a single series gives 0.0693 -- less than a third of the truth. Why is this a more dangerous failure than the Cauchy counterexample?'
    options:
      - 'It is not more dangerous; both are equally obvious once you compute a number'
      - 'Autocorrelation always makes the naive standard error too LARGE, which is a safer direction to be wrong in'
      - 'This failure only occurs with financial time-series data and is not relevant elsewhere'
      - 'The naive formula looks completely ordinary -- a plausible float from a correct-for-independent-data formula -- so nothing about the output signals that anything has gone wrong, unlike a Cauchy histogram, which announces its heavy tails visually'
    answer_index: 3
    explanation: 'The naive standard error understates the truth here by a factor of 2.44, and it does so silently: the formula is arithmetically correct, the output is a normal-looking float, and nothing about the number itself signals a problem. An analyst trusting it becomes confident in exact proportion to how wrong they are -- this is why the lesson calls dependence a QUIET failure, in contrast to the Cauchy case, which a histogram exposes immediately.'

  - question: 'A model scores 91.4% on a 500-example held-out test set, and a rival model scores 91.1% on the same set -- a 0.3 percentage-point gap. Using the binomial standard error formula, what does this gap represent?'
    options:
      - 'A gap that cannot be evaluated without knowing the exact examples in the test set'
      - 'A statistically significant improvement, since the raw percentage went up'
      - 'A 0.3-point gap that is always meaningful regardless of test-set size'
      - 'The binomial standard error is about 1.25 percentage points, so the 0.3-point gap is only about 0.24 standard errors -- well inside the range of pure sampling noise, demonstrating essentially nothing'
    answer_index: 3
    explanation: 'sqrt(0.914 * 0.086 / 500) is approximately 0.0125, or 1.25 percentage points. A 0.3-point difference is a small fraction of one standard error. Leaderboard comparisons smaller than the standard error are noise, not evidence -- which is exactly why held-out evaluation sets need to be large: shrinking the standard error to make small real differences detectable requires the same 1/sqrt(n) law measured throughout this lesson.'
