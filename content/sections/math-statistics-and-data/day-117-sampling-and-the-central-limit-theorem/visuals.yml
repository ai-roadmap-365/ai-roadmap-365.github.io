visuals:
  - id: sampling-distribution-anatomy-architecture
    file: assets/sampling-distribution-anatomy-architecture.svg
    type: diagram
    title: 'A statistic has its own distribution: the population, several samples, and the sampling distribution with its standard error'
    alt: 'Diagram: three panels — left, a population of scattered points with mean and sigma marked; middle, five separate samples drawn from that population, each with its own sample mean marked as a short vertical tick; right, the distribution of those sample means, narrower than the population, centered on the population mean, with its standard error marked as a bracketed width'
    description: 'A static architecture diagram, on a light background, split into three side-by-side panels connected by two rightward arrows. The left panel, headed "1. POPULATION", draws a scattered population of grey dots -- lopsided, not bell-shaped, on purpose -- with a dashed blue line marking the true population mean, captioned that both the true mean and true sigma are fixed but unknown to the observer. The middle panel, headed "2. FIVE SAMPLES", draws five small rows of sampled dots, each row a different sample of a few points, each with its own short blue tick marking that sample''s mean, captioned that none of the five ticks equal each other and none equal the true mean. The right panel, headed "3. THE SAMPLING DISTRIBUTION", draws a bell-shaped histogram built from many sample means, narrower than the population panel''s spread and centered on a dashed line at the true mean, with a green bracket beneath it labelled "standard error = sigma over the square root of n", closing with a caption that this distribution is shaped closer to Normal than the population itself was -- the central limit theorem, drawn.'

  - id: clt-flow
    file: assets/clt-flow.svg
    type: flow-animated
    title: 'The central limit theorem and its condition: a lumpy population''s sample means pile into a bell as n grows, while Cauchy sample means never do'
    alt: 'Diagram: animated flow, two panels. Top panel shows a lumpy, non-normal population''s sample means piling up into a bell-shaped histogram as n increases through several stages. Bottom panel shows the same staged buildup for Cauchy draws, whose sample means refuse to concentrate no matter how large n grows, staying just as spread out at the last stage as at the first'
    description: 'An animated flow diagram, fully readable as a still image. The heading reads "The theorem, and its condition, in one motion" and states that n grows through four stages: 10, 40, 160, 640. The top panel, labelled "Lumpy, non-Normal population (finite variance) -- the sample mean concentrates", shows four small histograms side by side, one per stage, each animating a gentle vertical growth that settles into an increasingly tall, increasingly bell-shaped peak as the stage number rises, captioned with the measured skewness values 1.42, 0.89, 0.45 and 0.11 falling toward zero. The bottom panel, labelled "Standard Cauchy population (infinite variance) -- the sample mean never concentrates", shows four small histograms of similar overall width and flatness at every stage, animating only a gentle opacity pulse rather than any growth or narrowing, captioned with the measured IQR values 2.00, 1.98, 1.97 and 1.96 staying flat across a 64x growth in n. A closing caption states that the same amount of data was spent at every stage in both panels, and one population''s estimate tightened while the other''s did not move at all. A prefers-reduced-motion block stops every animation: the top panel''s four histograms rest at their full, most-concentrated designed heights (already increasingly peaked left to right), and the bottom panel''s four histograms rest at full opacity at their designed flat heights -- every bar, label, stage heading and both captions remain fully present with no motion.'
