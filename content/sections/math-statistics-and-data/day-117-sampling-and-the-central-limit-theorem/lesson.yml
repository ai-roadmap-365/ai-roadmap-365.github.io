title: 'Sampling and the Central Limit Theorem'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 17
learning_promise: 'After this lesson you will be able to explain why a sample statistic has its own distribution, and compute how much to trust it. You will build the sampling distribution of the mean by literally repeating a sampling experiment thousands of times, watch its own mean settle near the population mean and its own spread settle near sigma/sqrt(n), and measure the sqrt(n) law directly: quadrupling the sample size from 10 to 40 to 160 to 640 roughly halves the standard error at each step, ratios of 1.985, 1.991 and 2.011 against a predicted 2.0. You will demonstrate the central limit theorem from a population shaped nothing like a bell curve, watching the skewness of the sampling distribution of the mean fall monotonically from 1.42 at n=2 to 0.11 at n=320. You will then meet the two honest halves of this topic most treatments skip. First, where the theorem actually fails: the Cauchy distribution has no defined mean or variance, and its sample mean is itself Cauchy distributed for every n -- measured directly, an Exponential population''s sample mean tightens by 9.85x from n=10 to n=1,000 while a Cauchy population''s sample mean does not tighten at all, ratio 1.02. Second, that sampling bias is not sampling error and n does not fix it: a sampler restricted to the upper half of a population keeps a completely flat error (2.0712 versus 2.0722) across a hundredfold growth in n, while an honest sampler''s error shrinks by 10.28x over the same range -- a confidently precise wrong answer is what bias looks like from the inside. You will build the bootstrap completely from scratch, checking it against a known formula for the mean (within about 1%) and applying the identical code to the median, where no formula exists, checked instead against genuinely fresh samples. You will measure how quietly dependence between observations makes the textbook standard-error formula understate the truth by more than a factor of two. And you will compute, from the binomial standard-error formula, that a model scoring 91.4% on a 500-example test beating another by 0.3 points has demonstrated almost nothing -- the gap sits at 0.24 standard errors, well inside noise.'
objectives:
  - 'Explain why a sample statistic (a mean, a proportion, a median) is itself a random variable with its own sampling distribution, its own mean, and its own spread'
  - 'State and demonstrate the sqrt(n) law: quadrupling the sample size roughly halves the standard error, and derive why the naive expectation of halving from doubling the data is wrong'
  - 'Demonstrate the central limit theorem numerically by measuring the skewness of a sampling distribution of the mean fall toward zero as n grows, starting from a population that is heavily skewed, discrete, or bimodal'
  - 'State the Cauchy distribution''s counterexample precisely -- the mean of n Cauchy draws is itself Cauchy distributed with the same spread for every n -- and explain why the central limit theorem''s finite-variance condition is a real constraint rather than decoration'
  - 'Distinguish sampling bias from sampling error, explain why bias does not shrink with more data while error does, and recognize a confidently precise wrong answer as the signature of a biased sampling frame'
  - 'Distinguish the law of large numbers (convergence) from the central limit theorem (rate and shape), a distinction routinely conflated'
  - 'Build the bootstrap from scratch -- resample with replacement, recompute a statistic, read its standard error off the spread -- and apply it to a statistic with no closed-form standard error'
  - 'Demonstrate that dependence between observations makes the naive standard-error formula understate the truth, and explain why this failure mode is more dangerous in practice than an honest formula being merely imprecise'
  - 'Compute the standard error of a model-evaluation accuracy from the binomial formula and use it to judge whether a reported improvement is real or noise'
  - 'Use numpy.random.default_rng(seed), passed explicitly into every sampling function, and explain why an internally reseeded generator silently breaks both reproducibility and independence between calls'
prerequisites:
  - 'Day 113 -- probability rules and the observation that Monte Carlo error shrinks as 1/sqrt(n), named properly today'
  - 'Day 114 -- random variables, expectation, variance, the named distributions, and inverse-CDF sampling with numpy.random.Generator'
  - 'Day 116 -- descriptive statistics, the n-1 bias correction, and the bootstrap''s general shape, applied here to a specific standard-error question'
  - 'Comfort with NumPy arrays and basic vectorised operations'
  - 'Days 71-74 -- running pytest and reading its skip-versus-fail output'
