<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are limits.">
  <title>Four consequences of sampling</title>
  <style>
    .sample-implications-bg   { fill: #f8fafc; }
    .sample-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sample-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sample-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sample-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sample-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sample-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sample-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sample-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sample-implications-stage { opacity: 1; }

    .sample-implications-s0 { animation-delay: 0.00s; }
    .sample-implications-e0 { animation-delay: 0.00s; }
    .sample-implications-s1 { animation-delay: 1.28s; }
    .sample-implications-e1 { animation-delay: 1.28s; }
    .sample-implications-s2 { animation-delay: 2.56s; }
    .sample-implications-e2 { animation-delay: 2.56s; }
    .sample-implications-s3 { animation-delay: 3.84s; }
    .sample-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sample-implications-conn  { animation: sample-implications-trace 6.4s ease-in-out infinite; }
      .sample-implications-stage { animation: sample-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sample-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sample-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sample-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sample-implications-stage { animation: sample-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sample-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sample-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sample-implications-bg" width="980" height="322"/>
  <text class="sample-implications-h1"  x="30" y="40">Four consequences of sampling</text>
  <text class="sample-implications-sub" x="30" y="64">Two are limits.</text>
  <g class="sample-implications-stage sample-implications-s0">
    <rect class="sample-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sample-implications-step" x="44" y="142">01</text>
    <text class="sample-implications-name" x="70" y="142">Conclusions about millions from thousands</text>
    <text class="sample-implications-desc" x="44" y="166">At a fraction of the cost.</text>
  </g>
  <line class="sample-implications-line sample-implications-conn sample-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sample-implications-tip)"/>
  <g class="sample-implications-stage sample-implications-s1">
    <rect class="sample-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sample-implications-step" x="280" y="142">02</text>
    <text class="sample-implications-name" x="306" y="142">With uncertainty that can be stated honestly</text>
    <text class="sample-implications-desc" x="280" y="166">Rather than implied.</text>
  </g>
  <line class="sample-implications-line sample-implications-conn sample-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sample-implications-tip)"/>
  <g class="sample-implications-stage sample-implications-s2">
    <rect class="sample-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sample-implications-step" x="516" y="142">03</text>
    <text class="sample-implications-name" x="542" y="142">But any bias in selection propagates entirely</text>
    <text class="sample-implications-desc" x="516" y="166">Into every conclusion.</text>
  </g>
  <line class="sample-implications-line sample-implications-conn sample-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sample-implications-tip)"/>
  <g class="sample-implications-stage sample-implications-s3">
    <rect class="sample-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sample-implications-step" x="752" y="142">04</text>
    <text class="sample-implications-name" x="778" y="142">And conclusions apply only to the sampled population</text>
    <text class="sample-implications-desc" x="752" y="166">Not beyond it.</text>
  </g>
  <text class="sample-implications-sub" x="30" y="304">Conclusions applying only to the sampled population is the constraint most often violated in machine learning, where a model is trained on one group and deployed on another.</text>
</svg>
