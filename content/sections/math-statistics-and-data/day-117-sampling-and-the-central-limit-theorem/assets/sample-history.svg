<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward random selection.">
  <title>Four steps in sampling practice</title>
  <style>
    .sample-history-bg   { fill: #f8fafc; }
    .sample-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sample-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sample-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sample-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sample-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sample-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sample-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sample-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sample-history-stage { opacity: 1; }

    .sample-history-s0 { animation-delay: 0.00s; }
    .sample-history-e0 { animation-delay: 0.00s; }
    .sample-history-s1 { animation-delay: 1.28s; }
    .sample-history-e1 { animation-delay: 1.28s; }
    .sample-history-s2 { animation-delay: 2.56s; }
    .sample-history-e2 { animation-delay: 2.56s; }
    .sample-history-s3 { animation-delay: 3.84s; }
    .sample-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sample-history-conn  { animation: sample-history-trace 6.4s ease-in-out infinite; }
      .sample-history-stage { animation: sample-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sample-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sample-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sample-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sample-history-stage { animation: sample-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sample-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sample-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sample-history-bg" width="980" height="322"/>
  <text class="sample-history-h1"  x="30" y="40">Four steps in sampling practice</text>
  <text class="sample-history-sub" x="30" y="64">Toward random selection.</text>
  <g class="sample-history-stage sample-history-s0">
    <rect class="sample-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sample-history-step" x="44" y="142">01</text>
    <text class="sample-history-name" x="70" y="142">Complete censuses, expensive and slow</text>
    <text class="sample-history-desc" x="44" y="166">And still incomplete.</text>
  </g>
  <line class="sample-history-line sample-history-conn sample-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sample-history-tip)"/>
  <g class="sample-history-stage sample-history-s1">
    <rect class="sample-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sample-history-step" x="280" y="142">02</text>
    <text class="sample-history-name" x="306" y="142">Then purposive selection of 'typical' cases</text>
    <text class="sample-history-desc" x="280" y="166">Which embedded the selector's</text>
    <text class="sample-history-desc" x="280" y="182">beliefs.</text>
  </g>
  <line class="sample-history-line sample-history-conn sample-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sample-history-tip)"/>
  <g class="sample-history-stage sample-history-s2">
    <rect class="sample-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sample-history-step" x="516" y="142">03</text>
    <text class="sample-history-name" x="542" y="142">Then random sampling with quantified error</text>
    <text class="sample-history-desc" x="516" y="166">Which was a genuine</text>
    <text class="sample-history-desc" x="516" y="182">breakthrough.</text>
  </g>
  <line class="sample-history-line sample-history-conn sample-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sample-history-tip)"/>
  <g class="sample-history-stage sample-history-s3">
    <rect class="sample-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sample-history-step" x="752" y="142">04</text>
    <text class="sample-history-name" x="778" y="142">And a modern struggle with falling response rates</text>
    <text class="sample-history-desc" x="752" y="166">Which reintroduces the old</text>
    <text class="sample-history-desc" x="752" y="182">problem.</text>
  </g>
  <text class="sample-history-sub" x="30" y="304">Falling response rates are the live methodological crisis in survey work, since a random invitation answered by an unrepresentative few is not a random sample.</text>
</svg>
