<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="d117aTitleId d117aDescId">
  <title id="d117aTitleId">A statistic has a distribution: the population, several samples drawn from it, and the resulting sampling distribution with its standard error marked</title>
  <desc id="d117aDescId">Three panels. Left: a scattered population of points with its true mean and sigma labelled. Middle: five samples drawn from the population, each with its own sample mean marked as a short tick, showing the ticks scattered around the true mean. Right: the distribution of those sample means -- narrower than the population, centered on the true mean, with its standard error bracketed and labelled sigma over the square root of n.</desc>

  <style>
    .d117a-bg     { fill: #f8fafc; }
    .d117a-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d117a-panelh { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1a202c; }
    .d117a-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d117a-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d117a-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d117a-dot    { fill: #64748b; }
    .d117a-mean   { stroke: #1d4ed8; stroke-width: 2.5; }
    .d117a-tick   { stroke: #1d4ed8; stroke-width: 2.5; }
    .d117a-bar    { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.25; }
    .d117a-arrow  { fill: #1d4ed8; }
    .d117a-wire   { stroke: #1d4ed8; stroke-width: 2; fill: none; }
    .d117a-bracket{ stroke: #047857; stroke-width: 2; fill: none; }
    .d117a-se     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #047857; font-weight: 600; }
  </style>

  <rect class="d117a-bg" x="0" y="0" width="1040" height="560" />
  <text class="d117a-title" x="30" y="38">A statistic has its own distribution</text>

  <defs>
    <marker id="d117a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Panel 1: population -->
  <rect class="d117a-panel" x="24" y="66" width="290" height="440" rx="10" />
  <text class="d117a-panelh" x="44" y="96">1. POPULATION</text>

  <!-- scattered population dots, denser near center, spread with a right tail -->
  <g>
    <circle class="d117a-dot" cx="80" cy="200" r="4" />
    <circle class="d117a-dot" cx="100" cy="230" r="4" />
    <circle class="d117a-dot" cx="70" cy="260" r="4" />
    <circle class="d117a-dot" cx="120" cy="180" r="4" />
    <circle class="d117a-dot" cx="140" cy="245" r="4" />
    <circle class="d117a-dot" cx="95" cy="290" r="4" />
    <circle class="d117a-dot" cx="160" cy="210" r="4" />
    <circle class="d117a-dot" cx="60" cy="230" r="4" />
    <circle class="d117a-dot" cx="130" cy="300" r="4" />
    <circle class="d117a-dot" cx="180" cy="260" r="4" />
    <circle class="d117a-dot" cx="110" cy="320" r="4" />
    <circle class="d117a-dot" cx="150" cy="330" r="4" />
    <circle class="d117a-dot" cx="85" cy="345" r="4" />
    <circle class="d117a-dot" cx="200" cy="230" r="4" />
    <circle class="d117a-dot" cx="220" cy="280" r="4" />
    <circle class="d117a-dot" cx="240" cy="200" r="4" />
    <circle class="d117a-dot" cx="255" cy="330" r="4" />
    <circle class="d117a-dot" cx="65" cy="370" r="4" />
    <circle class="d117a-dot" cx="190" cy="360" r="4" />
    <circle class="d117a-dot" cx="270" cy="250" r="4" />
    <circle class="d117a-dot" cx="105" cy="400" r="4" />
    <circle class="d117a-dot" cx="45" cy="290" r="4" />
    <circle class="d117a-dot" cx="165" cy="400" r="4" />
    <circle class="d117a-dot" cx="230" cy="410" r="4" />
    <circle class="d117a-dot" cx="290" cy="300" r="4" />
  </g>

  <line class="d117a-mean" x1="150" y1="170" x2="150" y2="420" stroke-dasharray="6 4" />
  <text class="d117a-label" x="150" y="160" text-anchor="middle">population mean</text>
  <text class="d117a-small" x="44" y="440">every dot is one member of the</text>
  <text class="d117a-small" x="44" y="458">population -- lopsided on purpose,</text>
  <text class="d117a-small" x="44" y="476">not bell-shaped</text>
  <text class="d117a-label" x="44" y="500" font-weight="700">true mean, true sigma</text>
  <text class="d117a-small" x="44" y="518">both fixed, both unknown to us</text>

  <path class="d117a-wire" d="M 320 286 L 380 286" marker-end="url(#d117a-arrowhead)" />

  <!-- Panel 2: samples -->
  <rect class="d117a-panel" x="388" y="66" width="290" height="440" rx="10" />
  <text class="d117a-panelh" x="408" y="96">2. FIVE SAMPLES</text>
  <text class="d117a-small" x="408" y="118">each sample draws n points and</text>
  <text class="d117a-small" x="408" y="136">averages them -- five different</text>
  <text class="d117a-small" x="408" y="154">answers from one population</text>

  <g>
    <!-- sample rows: dots + resulting mean tick, ticks scattered around a center line -->
    <line class="d117a-wire" x1="420" y1="180" x2="655" y2="180" stroke="#cbd5e1" stroke-dasharray="3 4" />
    <line class="d117a-wire" x1="420" y1="440" x2="655" y2="440" stroke="#cbd5e1" stroke-dasharray="3 4" />

    <!-- sample 1 -->
    <text class="d117a-small" x="410" y="210">n=1</text>
    <circle class="d117a-dot" cx="450" cy="205" r="3.5" /><circle class="d117a-dot" cx="465" cy="200" r="3.5" /><circle class="d117a-dot" cx="480" cy="212" r="3.5" /><circle class="d117a-dot" cx="500" cy="198" r="3.5" />
    <line class="d117a-tick" x1="472" y1="195" x2="472" y2="222" />

    <!-- sample 2 -->
    <text class="d117a-small" x="410" y="255">n=2</text>
    <circle class="d117a-dot" cx="440" cy="250" r="3.5" /><circle class="d117a-dot" cx="470" cy="245" r="3.5" /><circle class="d117a-dot" cx="500" cy="260" r="3.5" /><circle class="d117a-dot" cx="520" cy="248" r="3.5" />
    <line class="d117a-tick" x1="500" y1="240" x2="500" y2="267" />

    <!-- sample 3 -->
    <text class="d117a-small" x="410" y="300">n=3</text>
    <circle class="d117a-dot" cx="445" cy="295" r="3.5" /><circle class="d117a-dot" cx="460" cy="305" r="3.5" /><circle class="d117a-dot" cx="490" cy="292" r="3.5" /><circle class="d117a-dot" cx="510" cy="308" r="3.5" />
    <line class="d117a-tick" x1="452" y1="285" x2="452" y2="312" />

    <!-- sample 4 -->
    <text class="d117a-small" x="410" y="345">n=4</text>
    <circle class="d117a-dot" cx="455" cy="340" r="3.5" /><circle class="d117a-dot" cx="480" cy="350" r="3.5" /><circle class="d117a-dot" cx="505" cy="338" r="3.5" /><circle class="d117a-dot" cx="525" cy="352" r="3.5" />
    <line class="d117a-tick" x1="490" y1="330" x2="490" y2="357" />

    <!-- sample 5 -->
    <text class="d117a-small" x="410" y="390">n=5</text>
    <circle class="d117a-dot" cx="448" cy="385" r="3.5" /><circle class="d117a-dot" cx="465" cy="395" r="3.5" /><circle class="d117a-dot" cx="485" cy="382" r="3.5" /><circle class="d117a-dot" cx="510" cy="398" r="3.5" />
    <line class="d117a-tick" x1="464" y1="375" x2="464" y2="402" />
  </g>

  <text class="d117a-label" x="408" y="470" font-weight="700">five samples, five means</text>
  <text class="d117a-small" x="408" y="488">none of them equal to each other,</text>
  <text class="d117a-small" x="408" y="506">and none equal to the true mean</text>

  <path class="d117a-wire" d="M 684 286 L 744 286" marker-end="url(#d117a-arrowhead)" />

  <!-- Panel 3: sampling distribution -->
  <rect class="d117a-panel" x="752" y="66" width="264" height="440" rx="10" />
  <text class="d117a-panelh" x="772" y="96">3. THE SAMPLING DISTRIBUTION</text>
  <text class="d117a-small" x="772" y="118">what you get if you kept</text>
  <text class="d117a-small" x="772" y="136">drawing samples forever</text>

  <!-- bell-ish histogram of the sample means -->
  <g>
    <rect class="d117a-bar" x="778" y="330" width="14" height="20" />
    <rect class="d117a-bar" x="795" y="300" width="14" height="50" />
    <rect class="d117a-bar" x="812" y="260" width="14" height="90" />
    <rect class="d117a-bar" x="829" y="220" width="14" height="130" />
    <rect class="d117a-bar" x="846" y="195" width="14" height="155" />
    <rect class="d117a-bar" x="863" y="220" width="14" height="130" />
    <rect class="d117a-bar" x="880" y="260" width="14" height="90" />
    <rect class="d117a-bar" x="897" y="300" width="14" height="50" />
    <rect class="d117a-bar" x="914" y="330" width="14" height="20" />
  </g>
  <line x1="770" y1="350" x2="936" y2="350" stroke="#1a202c" stroke-width="1.5" />

  <line class="d117a-mean" x1="853" y1="190" x2="853" y2="352" stroke-dasharray="6 4" />
  <text class="d117a-label" x="853" y="182" text-anchor="middle">true mean</text>

  <!-- standard error bracket -->
  <path class="d117a-bracket" d="M 812 370 L 812 378 L 894 378 L 894 370" />
  <text class="d117a-se" x="853" y="396" text-anchor="middle">standard error = sigma / sqrt(n)</text>

  <text class="d117a-label" x="772" y="430" font-weight="700">narrower than the population,</text>
  <text class="d117a-small" x="772" y="448">centered on the true mean,</text>
  <text class="d117a-small" x="772" y="466">shaped closer to Normal than the</text>
  <text class="d117a-small" x="772" y="484">population itself was -- the</text>
  <text class="d117a-small" x="772" y="502">central limit theorem, drawn</text>
</svg>
