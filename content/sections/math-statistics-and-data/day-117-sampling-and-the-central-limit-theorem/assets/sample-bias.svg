<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four failures.">
  <title>How samples go wrong</title>
  <style>
    .sample-bias-bg   { fill: #f8fafc; }
    .sample-bias-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-bias-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-bias-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-bias-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-bias-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-bias-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sample-bias-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sample-bias-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sample-bias-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sample-bias-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sample-bias-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sample-bias-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sample-bias-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sample-bias-stage { opacity: 1; }

    .sample-bias-s0 { animation-delay: 0.00s; }
    .sample-bias-e0 { animation-delay: 0.00s; }
    .sample-bias-s1 { animation-delay: 1.28s; }
    .sample-bias-e1 { animation-delay: 1.28s; }
    .sample-bias-s2 { animation-delay: 2.56s; }
    .sample-bias-e2 { animation-delay: 2.56s; }
    .sample-bias-s3 { animation-delay: 3.84s; }
    .sample-bias-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sample-bias-conn  { animation: sample-bias-trace 6.4s ease-in-out infinite; }
      .sample-bias-stage { animation: sample-bias-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sample-bias-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sample-bias-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sample-bias-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sample-bias-stage { animation: sample-bias-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sample-bias-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sample-bias-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sample-bias-bg" width="980" height="322"/>
  <text class="sample-bias-h1"  x="30" y="40">How samples go wrong</text>
  <text class="sample-bias-sub" x="30" y="64">Four failures.</text>
  <g class="sample-bias-stage sample-bias-s0">
    <rect class="sample-bias-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sample-bias-step" x="44" y="142">01</text>
    <text class="sample-bias-name" x="70" y="142">Selection bias: some members could never be chosen</text>
    <text class="sample-bias-desc" x="44" y="166">Which no sample size fixes.</text>
  </g>
  <line class="sample-bias-line sample-bias-conn sample-bias-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sample-bias-tip)"/>
  <g class="sample-bias-stage sample-bias-s1">
    <rect class="sample-bias-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sample-bias-step" x="280" y="142">02</text>
    <text class="sample-bias-name" x="306" y="142">Non-response: those who reply differ from those who do not</text>
    <text class="sample-bias-desc" x="280" y="166">Systematically.</text>
  </g>
  <line class="sample-bias-line sample-bias-conn sample-bias-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sample-bias-tip)"/>
  <g class="sample-bias-stage sample-bias-s2">
    <rect class="sample-bias-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sample-bias-step" x="516" y="142">03</text>
    <text class="sample-bias-name" x="542" y="142">Survivorship: only what remains is observed</text>
    <text class="sample-bias-desc" x="516" y="166">So failures are invisible.</text>
  </g>
  <line class="sample-bias-line sample-bias-conn sample-bias-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sample-bias-tip)"/>
  <g class="sample-bias-stage sample-bias-s3">
    <rect class="sample-bias-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sample-bias-step" x="752" y="142">04</text>
    <text class="sample-bias-name" x="778" y="142">And sampling the wrong population entirely</text>
    <text class="sample-bias-desc" x="752" y="166">Which answers a different</text>
    <text class="sample-bias-desc" x="752" y="182">question.</text>
  </g>
  <text class="sample-bias-sub" x="30" y="304">No sample size fixing selection bias is the point to hold onto, because a large biased sample is more dangerous than a small one: it looks authoritative.</text>
</svg>
