terms:
  - term: Population
    definition: >-
      The complete set of things you would measure if you could measure
      everything -- every user, every possible model output, every unit
      that could ever be produced. Almost always too large, too expensive,
      or too undefined (still growing, still being generated) to measure
      directly, which is the entire reason sampling exists.

  - term: Sample
    definition: >-
      The subset of the population actually observed. A sample of size n
      drawn "with replacement" allows the same population member to appear
      more than once; this lesson's lab draws every sample this way, which
      is what lets a finite array stand in for an effectively infinite
      population.

  - term: Estimator
    definition: >-
      A rule for turning a sample into a number that estimates some
      property of the population -- the sample mean estimating the
      population mean, the sample proportion estimating the true rate. An
      estimator is itself a function of the random sample, which is exactly
      why it is a random variable with its own distribution.

  - term: Sampling distribution
    definition: >-
      The distribution of a statistic's value across every sample the
      sampling process could have produced. Not a single number and not the
      population -- a genuinely separate object, built in this lesson's lab
      by literally repeating the draw-a-sample-and-compute-the-mean process
      thousands of times and studying the resulting array of means.

  - term: Standard error
    definition: >-
      The standard deviation of a statistic's own sampling distribution --
      how much the statistic itself wobbles from sample to sample. For the
      sample mean, the standard error equals sigma / sqrt(n), where sigma is
      the population's standard deviation. Not the same quantity as the
      population's own standard deviation, which describes individual
      observations rather than the average of several of them.

  - term: The sqrt(n) law
    definition: >-
      The consequence of the standard error formula that quadrupling the
      sample size roughly halves the standard error, not quarters it.
      Measured directly across four sample sizes each 4x the last (10, 40,
      160, 640), the ratios came out to 1.985, 1.991 and 2.011, against a
      predicted 2.0 at every step.

  - term: Central limit theorem (CLT)
    definition: >-
      The result that, whatever shape a population has, the sampling
      distribution of its mean approaches a Normal distribution as n grows,
      provided the observations are independent and the population has
      finite variance. First appeared as a special case in Abraham de
      Moivre's 1733 work on the Binomial distribution, generalized by
      Pierre-Simon Laplace by 1812, and given its modern name by George
      Polya in 1920.

  - term: Law of large numbers (LLN)
    definition: >-
      Jacob Bernoulli's 1713 result that a sample mean converges to the
      true population mean as the sample size grows. A weaker claim than
      the central limit theorem: the LLN says convergence happens; the CLT
      says how fast (1/sqrt(n)) and what shape the errors take (Normal,
      given finite variance) along the way.

  - term: Cauchy distribution
    definition: >-
      A continuous distribution, named for Augustin-Louis Cauchy, with no
      defined mean or variance -- its tails are too heavy for either
      integral to converge. The standard counterexample to the central
      limit theorem: the mean of n Cauchy draws is itself Cauchy
      distributed, with exactly the same spread, for every value of n.
      Measured in this lesson's lab, its sample mean's interquartile range
      changed by only 2% from n=10 to n=1,000, against an Exponential
      population's 9.85x tightening over the same range.

  - term: Interquartile range (IQR)
    definition: >-
      The 75th percentile minus the 25th percentile of a sample -- a spread
      measure that depends only on the order of the data, not on its
      moments. Used in place of the standard deviation when comparing the
      Cauchy and Exponential sampling distributions, because a Cauchy
      sample's own standard deviation is not an estimate of anything: the
      population variance it would estimate does not exist.

  - term: Sampling error
    definition: >-
      The honest wobble in a statistic that comes purely from which
      particular population members happened to land in the sample. Shrinks
      as 1/sqrt(n), exactly as the standard error formula predicts, and is
      what every standard error and confidence interval in this lesson
      measures.

  - term: Sampling bias
    definition: >-
      A systematic mismatch between the population a sampling frame
      actually reaches and the population being claimed. Unlike sampling
      error, it does not shrink with n at all: measured in this lesson's
      lab, a sampler restricted to the upper half of a population showed a
      mean absolute error that stayed essentially flat (2.0712 versus
      2.0722) across a hundredfold growth in sample size, while an honest
      sampler's error shrank by 10.28x over the same range.

  - term: Bootstrap
    definition: >-
      A technique, introduced by Bradley Efron in 1979, for estimating a
      statistic's standard error by resampling one dataset with
      replacement, recomputing the statistic on each resample, and reading
      the standard error off the spread of the results -- no formula for
      the statistic's own sampling distribution required. Checked in this
      lesson against a known formula for the mean (agreement within about
      1%) and applied to the median, where no formula exists.

  - term: AR(1) process
    definition: >-
      An autoregressive series of order 1: each observation equals phi
      times the previous observation plus fresh, independent noise. Used in
      this lesson to build a dataset with genuine dependence between
      consecutive observations, on which the naive standard-error formula
      is measured to understate the truth by more than a factor of two.

  - term: Binomial standard error
    definition: >-
      The standard error of a sample proportion (equivalently, a model
      accuracy measured on n examples): sqrt(phat * (1 - phat) / n). For an
      accuracy of 91.4% on 500 examples, this comes out to about 1.25
      percentage points -- large enough that a 0.3-point difference between
      two models sits at only about 0.24 standard errors, well inside the
      range of pure sampling noise.
