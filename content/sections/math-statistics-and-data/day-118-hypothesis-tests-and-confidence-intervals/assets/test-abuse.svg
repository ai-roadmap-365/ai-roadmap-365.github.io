<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four ways.">
  <title>How tests are misused</title>
  <style>
    .test-abuse-bg   { fill: #f8fafc; }
    .test-abuse-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-abuse-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-abuse-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-abuse-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-abuse-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-abuse-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-abuse-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-abuse-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-abuse-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-abuse-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-abuse-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-abuse-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .test-abuse-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .test-abuse-stage { opacity: 1; }

    .test-abuse-s0 { animation-delay: 0.00s; }
    .test-abuse-e0 { animation-delay: 0.00s; }
    .test-abuse-s1 { animation-delay: 1.28s; }
    .test-abuse-e1 { animation-delay: 1.28s; }
    .test-abuse-s2 { animation-delay: 2.56s; }
    .test-abuse-e2 { animation-delay: 2.56s; }
    .test-abuse-s3 { animation-delay: 3.84s; }
    .test-abuse-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .test-abuse-conn  { animation: test-abuse-trace 6.4s ease-in-out infinite; }
      .test-abuse-stage { animation: test-abuse-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes test-abuse-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes test-abuse-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .test-abuse-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .test-abuse-stage { animation: test-abuse-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes test-abuse-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="test-abuse-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="test-abuse-bg" width="980" height="322"/>
  <text class="test-abuse-h1"  x="30" y="40">How tests are misused</text>
  <text class="test-abuse-sub" x="30" y="64">Four ways.</text>
  <g class="test-abuse-stage test-abuse-s0">
    <rect class="test-abuse-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="test-abuse-step" x="44" y="142">01</text>
    <text class="test-abuse-name" x="70" y="142">Testing many hypotheses, reporting the one that passed</text>
    <text class="test-abuse-desc" x="44" y="166">Which guarantees false</text>
    <text class="test-abuse-desc" x="44" y="182">positives.</text>
  </g>
  <line class="test-abuse-line test-abuse-conn test-abuse-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#test-abuse-tip)"/>
  <g class="test-abuse-stage test-abuse-s1">
    <rect class="test-abuse-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="test-abuse-step" x="280" y="142">02</text>
    <text class="test-abuse-name" x="306" y="142">Stopping as soon as the result becomes significant</text>
    <text class="test-abuse-desc" x="280" y="166">Which inflates the error rate.</text>
  </g>
  <line class="test-abuse-line test-abuse-conn test-abuse-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#test-abuse-tip)"/>
  <g class="test-abuse-stage test-abuse-s2">
    <rect class="test-abuse-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="test-abuse-step" x="516" y="142">03</text>
    <text class="test-abuse-name" x="542" y="142">Reporting significance without effect size</text>
    <text class="test-abuse-desc" x="516" y="166">A tiny effect can be</text>
    <text class="test-abuse-desc" x="516" y="182">significant.</text>
  </g>
  <line class="test-abuse-line test-abuse-conn test-abuse-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#test-abuse-tip)"/>
  <g class="test-abuse-stage test-abuse-s3">
    <rect class="test-abuse-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="test-abuse-step" x="752" y="142">04</text>
    <text class="test-abuse-name" x="778" y="142">And treating a failure to reject as proof of no effect</text>
    <text class="test-abuse-desc" x="752" y="166">Which it is not.</text>
  </g>
  <text class="test-abuse-sub" x="30" y="304">Absence of evidence not being evidence of absence is the misreading with the largest real-world cost, particularly in safety and medical contexts.</text>
</svg>
