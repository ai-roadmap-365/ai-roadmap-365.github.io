<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="d118fTitleId d118fDescId">
  <title id="d118fTitleId">Twenty 95% confidence intervals stacking against a fixed true value, one visibly missing</title>
  <desc id="d118fDescId">Twenty horizontal confidence-interval bars stack top to bottom against a fixed vertical dashed line marking the true population value. Nineteen bars cross the line; one bar, highlighted in amber, sits entirely to one side and misses it. Each bar briefly brightens in sequence from top to bottom as it is built, then settles to its resting color, looping. With motion disabled every bar rests at full opacity in its final, already-built position.</desc>

  <style>
    .d118f-bg      { fill: #f8fafc; }
    .d118f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d118f-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d118f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d118f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d118f-true    { stroke: #1a202c; stroke-width: 2; stroke-dasharray: 6 5; }

    .d118f-bar     { stroke: #1d4ed8; stroke-width: 5; stroke-linecap: round; animation: d118f-build 8s ease-in-out infinite; }
    .d118f-whisk   { stroke: #1d4ed8; stroke-width: 2.5; }
    .d118f-miss    { stroke: #b45309; stroke-width: 5; stroke-linecap: round; animation: d118f-buildmiss 8s ease-in-out infinite; }
    .d118f-misswhisk { stroke: #b45309; stroke-width: 2.5; }

    @keyframes d118f-build {
      0%, 4%, 100% { stroke: #1d4ed8; stroke-width: 5; }
      1.5%         { stroke: #93c5fd; stroke-width: 8; }
    }
    @keyframes d118f-buildmiss {
      0%, 4%, 100% { stroke: #b45309; stroke-width: 5; }
      1.5%         { stroke: #fbbf24; stroke-width: 8; }
    }

    /* Twenty staggered delays, one row lighting up after another top to bottom. */
    .d118f-r0  { animation-delay: 0.00s; } .d118f-r1  { animation-delay: 0.35s; }
    .d118f-r2  { animation-delay: 0.70s; } .d118f-r3  { animation-delay: 1.05s; }
    .d118f-r4  { animation-delay: 1.40s; } .d118f-r5  { animation-delay: 1.75s; }
    .d118f-r6  { animation-delay: 2.10s; } .d118f-r7  { animation-delay: 2.45s; }
    .d118f-r8  { animation-delay: 2.80s; } .d118f-r9  { animation-delay: 3.15s; }
    .d118f-r10 { animation-delay: 3.50s; } .d118f-r11 { animation-delay: 3.85s; }
    .d118f-r12 { animation-delay: 4.20s; } .d118f-r13 { animation-delay: 4.55s; }
    .d118f-r14 { animation-delay: 4.90s; } .d118f-r15 { animation-delay: 5.25s; }
    .d118f-r16 { animation-delay: 5.60s; } .d118f-r17 { animation-delay: 5.95s; }
    .d118f-r18 { animation-delay: 6.30s; } .d118f-r19 { animation-delay: 6.65s; }

    @media (prefers-reduced-motion: reduce) {
      .d118f-bar, .d118f-miss { animation: none; }
      .d118f-bar  { stroke: #1d4ed8; stroke-width: 5; }
      .d118f-miss { stroke: #b45309; stroke-width: 5; }
    }
  </style>

  <rect class="d118f-bg" x="0" y="0" width="900" height="520" />
  <text class="d118f-title" x="30" y="38">Ten thousand of these, and 95.09% cover the truth</text>
  <text class="d118f-small" x="30" y="60">Twenty of the 10,000 intervals this lesson's lab built, stacked against the known true population mean</text>

  <g transform="translate(30,80)">
    <!-- the fixed true value line, spanning the full stack -->
    <line class="d118f-true" x1="450" y1="0" x2="450" y2="410" />
    <text class="d118f-label" x="450" y="-8" text-anchor="middle">true population mean (known, fixed)</text>

    <!-- 20 interval rows: (lo, hi) pairs, one (row 12) misses -->
    <!-- row 0 -->
    <g transform="translate(0,10)">
      <line class="d118f-whisk" x1="339.7" y1="-7" x2="339.7" y2="7" />
      <line class="d118f-whisk" x1="492.4" y1="-7" x2="492.4" y2="7" />
      <line class="d118f-bar d118f-r0" x1="339.7" y1="0" x2="492.4" y2="0" />
    </g>
    <!-- row 1 -->
    <g transform="translate(0,30)">
      <line class="d118f-whisk" x1="380.9" y1="-7" x2="380.9" y2="7" />
      <line class="d118f-whisk" x1="496.8" y1="-7" x2="496.8" y2="7" />
      <line class="d118f-bar d118f-r1" x1="380.9" y1="0" x2="496.8" y2="0" />
    </g>
    <!-- row 2 -->
    <g transform="translate(0,50)">
      <line class="d118f-whisk" x1="350.5" y1="-7" x2="350.5" y2="7" />
      <line class="d118f-whisk" x1="506.6" y1="-7" x2="506.6" y2="7" />
      <line class="d118f-bar d118f-r2" x1="350.5" y1="0" x2="506.6" y2="0" />
    </g>
    <!-- row 3 -->
    <g transform="translate(0,70)">
      <line class="d118f-whisk" x1="380.7" y1="-7" x2="380.7" y2="7" />
      <line class="d118f-whisk" x1="543.9" y1="-7" x2="543.9" y2="7" />
      <line class="d118f-bar d118f-r3" x1="380.7" y1="0" x2="543.9" y2="0" />
    </g>
    <!-- row 4 -->
    <g transform="translate(0,90)">
      <line class="d118f-whisk" x1="390.4" y1="-7" x2="390.4" y2="7" />
      <line class="d118f-whisk" x1="530.9" y1="-7" x2="530.9" y2="7" />
      <line class="d118f-bar d118f-r4" x1="390.4" y1="0" x2="530.9" y2="0" />
    </g>
    <!-- row 5 -->
    <g transform="translate(0,110)">
      <line class="d118f-whisk" x1="379.6" y1="-7" x2="379.6" y2="7" />
      <line class="d118f-whisk" x1="523.8" y1="-7" x2="523.8" y2="7" />
      <line class="d118f-bar d118f-r5" x1="379.6" y1="0" x2="523.8" y2="0" />
    </g>
    <!-- row 6 -->
    <g transform="translate(0,130)">
      <line class="d118f-whisk" x1="391.2" y1="-7" x2="391.2" y2="7" />
      <line class="d118f-whisk" x1="550.0" y1="-7" x2="550.0" y2="7" />
      <line class="d118f-bar d118f-r6" x1="391.2" y1="0" x2="550.0" y2="0" />
    </g>
    <!-- row 7 -->
    <g transform="translate(0,150)">
      <line class="d118f-whisk" x1="330.8" y1="-7" x2="330.8" y2="7" />
      <line class="d118f-whisk" x1="471.7" y1="-7" x2="471.7" y2="7" />
      <line class="d118f-bar d118f-r7" x1="330.8" y1="0" x2="471.7" y2="0" />
    </g>
    <!-- row 8 -->
    <g transform="translate(0,170)">
      <line class="d118f-whisk" x1="357.2" y1="-7" x2="357.2" y2="7" />
      <line class="d118f-whisk" x1="479.7" y1="-7" x2="479.7" y2="7" />
      <line class="d118f-bar d118f-r8" x1="357.2" y1="0" x2="479.7" y2="0" />
    </g>
    <!-- row 9 -->
    <g transform="translate(0,190)">
      <line class="d118f-whisk" x1="420.9" y1="-7" x2="420.9" y2="7" />
      <line class="d118f-whisk" x1="583.6" y1="-7" x2="583.6" y2="7" />
      <line class="d118f-bar d118f-r9" x1="420.9" y1="0" x2="583.6" y2="0" />
    </g>
    <!-- row 10 -->
    <g transform="translate(0,210)">
      <line class="d118f-whisk" x1="407.4" y1="-7" x2="407.4" y2="7" />
      <line class="d118f-whisk" x1="540.0" y1="-7" x2="540.0" y2="7" />
      <line class="d118f-bar d118f-r10" x1="407.4" y1="0" x2="540.0" y2="0" />
    </g>
    <!-- row 11 -->
    <g transform="translate(0,230)">
      <line class="d118f-whisk" x1="420.8" y1="-7" x2="420.8" y2="7" />
      <line class="d118f-whisk" x1="534.7" y1="-7" x2="534.7" y2="7" />
      <line class="d118f-bar d118f-r11" x1="420.8" y1="0" x2="534.7" y2="0" />
    </g>
    <!-- row 12: THE MISS -->
    <g transform="translate(0,250)">
      <line class="d118f-misswhisk" x1="477.3" y1="-7" x2="477.3" y2="7" />
      <line class="d118f-misswhisk" x1="578.6" y1="-7" x2="578.6" y2="7" />
      <line class="d118f-miss d118f-r12" x1="477.3" y1="0" x2="578.6" y2="0" />
      <text class="d118f-caption" x="586" y="4" fill="#b45309" font-weight="600">misses</text>
    </g>
    <!-- row 13 -->
    <g transform="translate(0,270)">
      <line class="d118f-whisk" x1="414.9" y1="-7" x2="414.9" y2="7" />
      <line class="d118f-whisk" x1="563.4" y1="-7" x2="563.4" y2="7" />
      <line class="d118f-bar d118f-r13" x1="414.9" y1="0" x2="563.4" y2="0" />
    </g>
    <!-- row 14 -->
    <g transform="translate(0,290)">
      <line class="d118f-whisk" x1="367.2" y1="-7" x2="367.2" y2="7" />
      <line class="d118f-whisk" x1="523.0" y1="-7" x2="523.0" y2="7" />
      <line class="d118f-bar d118f-r14" x1="367.2" y1="0" x2="523.0" y2="0" />
    </g>
    <!-- row 15 -->
    <g transform="translate(0,310)">
      <line class="d118f-whisk" x1="367.4" y1="-7" x2="367.4" y2="7" />
      <line class="d118f-whisk" x1="482.6" y1="-7" x2="482.6" y2="7" />
      <line class="d118f-bar d118f-r15" x1="367.4" y1="0" x2="482.6" y2="0" />
    </g>
    <!-- row 16 -->
    <g transform="translate(0,330)">
      <line class="d118f-whisk" x1="388.4" y1="-7" x2="388.4" y2="7" />
      <line class="d118f-whisk" x1="549.8" y1="-7" x2="549.8" y2="7" />
      <line class="d118f-bar d118f-r16" x1="388.4" y1="0" x2="549.8" y2="0" />
    </g>
    <!-- row 17 -->
    <g transform="translate(0,350)">
      <line class="d118f-whisk" x1="415.8" y1="-7" x2="415.8" y2="7" />
      <line class="d118f-whisk" x1="525.9" y1="-7" x2="525.9" y2="7" />
      <line class="d118f-bar d118f-r17" x1="415.8" y1="0" x2="525.9" y2="0" />
    </g>
    <!-- row 18 -->
    <g transform="translate(0,370)">
      <line class="d118f-whisk" x1="353.1" y1="-7" x2="353.1" y2="7" />
      <line class="d118f-whisk" x1="467.8" y1="-7" x2="467.8" y2="7" />
      <line class="d118f-bar d118f-r18" x1="353.1" y1="0" x2="467.8" y2="0" />
    </g>
    <!-- row 19 -->
    <g transform="translate(0,390)">
      <line class="d118f-whisk" x1="415.6" y1="-7" x2="415.6" y2="7" />
      <line class="d118f-whisk" x1="579.7" y1="-7" x2="579.7" y2="7" />
      <line class="d118f-bar d118f-r19" x1="415.6" y1="0" x2="579.7" y2="0" />
    </g>
  </g>

  <text class="d118f-caption" x="30" y="500">19 of these 20 cross the true value; roughly 1 in 20 misses, as expected from a 95% procedure. Each bar briefly brightens as it is "built," top to bottom, then rests -- the miss rests in amber, visible with no motion needed.</text>
</svg>
