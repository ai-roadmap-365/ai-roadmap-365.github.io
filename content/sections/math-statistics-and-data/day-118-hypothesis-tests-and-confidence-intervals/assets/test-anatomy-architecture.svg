<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="d118aTitleId d118aDescId">
  <title id="d118aTitleId">Anatomy of a test and its matching interval: the null distribution, the p-value tail, the rejection region, and the confidence interval beside it</title>
  <desc id="d118aDescId">Left panel: a bell-shaped null distribution centered at zero, with the observed statistic marked, its tail area shaded as the p-value, and the more extreme rejection region beyond the critical value shaded darker at each end. Right panel: a number line showing the matching confidence interval, with the null value marked outside it, showing the interval excludes the null exactly when the test rejects.</desc>

  <style>
    .d118a-bg     { fill: #f8fafc; }
    .d118a-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d118a-h2     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d118a-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d118a-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d118a-caption{ font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d118a-curve  { fill: none; stroke: #1a202c; stroke-width: 2.2; }
    .d118a-axis   { stroke: #94a3b8; stroke-width: 1.5; }
    .d118a-pval   { fill: #93c5fd; opacity: 0.85; }
    .d118a-reject { fill: #1d4ed8; opacity: 0.9; }
    .d118a-panel  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d118a-obs    { stroke: #b45309; stroke-width: 2.5; }
    .d118a-obsdot { fill: #b45309; }
    .d118a-crit   { stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .d118a-cline  { stroke: #1a202c; stroke-width: 3; }
    .d118a-cwhisk { stroke: #1a202c; stroke-width: 3; }
    .d118a-cfill  { fill: #93c5fd; opacity: 0.85; }
    .d118a-null   { fill: #b45309; }
    .d118a-nullln { stroke: #b45309; stroke-width: 2; stroke-dasharray: 4 4; }
  </style>

  <rect class="d118a-bg" x="0" y="0" width="1000" height="620" />
  <text class="d118a-title" x="30" y="38">A test and its matching interval, side by side</text>
  <text class="d118a-small" x="30" y="60">Same underlying calculation, viewed two ways: reject at alpha exactly when the interval excludes the null value.</text>

  <!-- LEFT PANEL: null distribution -->
  <g transform="translate(30,90)">
    <rect class="d118a-panel" x="0" y="0" width="440" height="470" rx="6" />
    <text class="d118a-h2" x="20" y="34">1. The null distribution</text>
    <text class="d118a-small" x="20" y="56">Sampling distribution of the test statistic, assuming H0 is true</text>

    <g transform="translate(20,70)">
      <!-- baseline axis -->
      <line class="d118a-axis" x1="30" y1="210" x2="390" y2="210" />

      <!-- p-value tail shading (z = 1.6 to 3.5) -->
      <path class="d118a-pval" d="M 292.3,210 L 292.3,159.9 L 294.7,163.6 L 297.2,167.2 L 299.6,170.5 L 302.1,173.7 L 304.5,176.7 L 306.9,179.5 L 309.4,182.2 L 311.8,184.6 L 314.3,186.9 L 316.7,189.1 L 319.2,191.1 L 321.6,192.9 L 324.0,194.6 L 326.5,196.2 L 328.9,197.6 L 331.4,198.9 L 333.8,200.1 L 336.3,201.2 L 338.7,202.1 L 341.1,203.0 L 343.6,203.8 L 346.0,204.6 L 348.5,205.2 L 350.9,205.8 L 353.4,206.3 L 355.8,206.8 L 358.2,207.2 L 360.7,207.5 L 363.1,207.9 L 365.6,208.1 L 368.0,208.4 L 370.5,208.6 L 372.9,208.8 L 375.3,209.0 L 377.8,209.1 L 380.2,209.2 L 382.7,209.4 L 385.1,209.5 L 387.6,209.5 L 390.0,209.6 L 390.0,210 Z" />

      <!-- rejection region shading, both tails, beyond +/- 1.96 -->
      <path class="d118a-reject" d="M 310.8,210 L 310.8,183.6 L 312.8,185.6 L 314.8,187.4 L 316.7,189.1 L 318.7,190.7 L 320.7,192.2 L 322.7,193.7 L 324.7,195.0 L 326.6,196.2 L 328.6,197.4 L 330.6,198.5 L 332.6,199.5 L 334.6,200.4 L 336.5,201.3 L 338.5,202.1 L 340.5,202.8 L 342.5,203.5 L 344.5,204.1 L 346.4,204.7 L 348.4,205.2 L 350.4,205.7 L 352.4,206.1 L 354.4,206.5 L 356.3,206.9 L 358.3,207.2 L 360.3,207.5 L 362.3,207.8 L 364.3,208.0 L 366.2,208.2 L 368.2,208.4 L 370.2,208.6 L 372.2,208.8 L 374.2,208.9 L 376.1,209.0 L 378.1,209.1 L 380.1,209.2 L 382.1,209.3 L 384.1,209.4 L 386.0,209.5 L 388.0,209.5 L 390.0,209.6 L 390.0,210 Z" />
      <path class="d118a-reject" d="M 30.0,210 L 30.0,209.6 L 32.0,209.5 L 34.0,209.5 L 35.9,209.4 L 37.9,209.3 L 39.9,209.2 L 41.9,209.1 L 43.9,209.0 L 45.8,208.9 L 47.8,208.8 L 49.8,208.6 L 51.8,208.4 L 53.8,208.2 L 55.7,208.0 L 57.7,207.8 L 59.7,207.5 L 61.7,207.2 L 63.7,206.9 L 65.6,206.5 L 67.6,206.1 L 69.6,205.7 L 71.6,205.2 L 73.6,204.7 L 75.5,204.1 L 77.5,203.5 L 79.5,202.8 L 81.5,202.1 L 83.5,201.3 L 85.4,200.4 L 87.4,199.5 L 89.4,198.5 L 91.4,197.4 L 93.4,196.2 L 95.3,195.0 L 97.3,193.7 L 99.3,192.2 L 101.3,190.7 L 103.3,189.1 L 105.2,187.4 L 107.2,185.6 L 109.2,183.6 L 109.2,210 Z" />

      <!-- the bell curve itself, drawn over the shading -->
      <polyline class="d118a-curve" points="30.0,209.6 33.0,209.5 36.1,209.4 39.1,209.3 42.1,209.1 45.1,208.9 48.2,208.7 51.2,208.5 54.2,208.2 57.2,207.8 60.3,207.4 63.3,206.9 66.3,206.4 69.3,205.7 72.4,205.0 75.4,204.1 78.4,203.2 81.4,202.1 84.5,200.9 87.5,199.5 90.5,197.9 93.5,196.1 96.6,194.2 99.6,192.0 102.6,189.7 105.6,187.0 108.7,184.2 111.7,181.0 114.7,177.6 117.7,174.0 120.8,170.0 123.8,165.8 126.8,161.3 129.8,156.6 132.9,151.5 135.9,146.3 138.9,140.7 141.9,135.0 145.0,129.1 148.0,123.0 151.0,116.7 154.0,110.4 157.1,104.0 160.1,97.6 163.1,91.2 166.1,84.8 169.2,78.6 172.2,72.6 175.2,66.8 178.2,61.2 181.3,56.0 184.3,51.1 187.3,46.6 190.3,42.6 193.4,39.1 196.4,36.1 199.4,33.7 202.4,31.9 205.5,30.6 208.5,30.0 211.5,30.0 214.5,30.6 217.6,31.9 220.6,33.7 223.6,36.1 226.6,39.1 229.7,42.6 232.7,46.6 235.7,51.1 238.7,56.0 241.8,61.2 244.8,66.8 247.8,72.6 250.8,78.6 253.9,84.8 256.9,91.2 259.9,97.6 262.9,104.0 266.0,110.4 269.0,116.7 272.0,123.0 275.0,129.1 278.1,135.0 281.1,140.7 284.1,146.3 287.1,151.5 290.2,156.6 293.2,161.3 296.2,165.8 299.2,170.0 302.3,174.0 305.3,177.6 308.3,181.0 311.3,184.2 314.4,187.0 317.4,189.7 320.4,192.0 323.4,194.2 326.5,196.1 329.5,197.9 332.5,199.5 335.5,200.9 338.6,202.1 341.6,203.2 344.6,204.1 347.6,205.0 350.7,205.7 353.7,206.4 356.7,206.9 359.7,207.4 362.8,207.8 365.8,208.2 368.8,208.5 371.8,208.7 374.9,208.9 377.9,209.1 380.9,209.3 383.9,209.4 387.0,209.5 390.0,209.6" />

      <!-- critical value dashed lines, at z = +/- 1.96 -->
      <line class="d118a-crit" x1="310.8" y1="20" x2="310.8" y2="210" />
      <line class="d118a-crit" x1="109.2" y1="20" x2="109.2" y2="210" />

      <!-- observed statistic marker, at z = 1.6 -->
      <line class="d118a-obs" x1="292.3" y1="60" x2="292.3" y2="210" />
      <circle class="d118a-obsdot" cx="292.3" cy="60" r="5" />

      <!-- axis labels -->
      <text class="d118a-small" x="210" y="230" text-anchor="middle">0 (the null value)</text>
      <text class="d118a-small" x="310.8" y="15" text-anchor="middle">z_crit = 1.96</text>
      <text class="d118a-small" x="109.2" y="15" text-anchor="middle">-1.96</text>
      <text class="d118a-caption" x="292.3" y="48" text-anchor="middle" fill="#b45309" font-weight="600">observed z = 1.6</text>
    </g>

    <!-- legend -->
    <g transform="translate(20,340)">
      <rect x="0" y="0" width="16" height="16" class="d118a-pval" />
      <text class="d118a-label" x="24" y="13">shaded tail beyond the observed value = the p-value</text>
      <rect x="0" y="26" width="16" height="16" class="d118a-reject" />
      <text class="d118a-label" x="24" y="39">darker region beyond z_crit = the rejection region at alpha</text>
    </g>
    <text class="d118a-caption" x="20" y="410">Here the observed z=1.6 falls short of z_crit=1.96 (the p-value tail does not reach the rejection region), so this test does NOT reject at alpha=0.05.</text>
    <text class="d118a-caption" x="20" y="434">The p-value is the shaded area itself: P(a statistic this extreme | H0 true) -- not the probability H0 is true.</text>
  </g>

  <!-- RIGHT PANEL: matching confidence interval -->
  <g transform="translate(500,90)">
    <rect class="d118a-panel" x="0" y="0" width="470" height="470" rx="6" />
    <text class="d118a-h2" x="20" y="34">2. The matching confidence interval</text>
    <text class="d118a-small" x="20" y="56">Same data, same z -- built as an interval instead of a yes/no answer</text>

    <g transform="translate(40,150)">
      <!-- number line -->
      <line class="d118a-axis" x1="0" y1="80" x2="380" y2="80" />

      <!-- the interval itself: from x=90 to x=330 (does not reach 0, the null value, at x=190) -->
      <rect class="d118a-cfill" x="90" y="68" width="240" height="24" rx="3" />
      <line class="d118a-cwhisk" x1="90" y1="55" x2="90" y2="105" />
      <line class="d118a-cwhisk" x1="330" y1="55" x2="330" y2="105" />
      <line class="d118a-cline" x1="90" y1="80" x2="330" y2="80" />

      <!-- the null value, marked, OUTSIDE the interval -->
      <line class="d118a-nullln" x1="30" y1="30" x2="30" y2="105" />
      <circle class="d118a-null" cx="30" cy="30" r="5" />
      <text class="d118a-caption" x="30" y="18" text-anchor="middle" fill="#b45309" font-weight="600">null value = 0</text>

      <text class="d118a-small" x="90" y="128" text-anchor="middle">lower bound</text>
      <text class="d118a-small" x="330" y="128" text-anchor="middle">upper bound</text>
      <text class="d118a-label" x="210" y="80" text-anchor="middle" dy="-32" font-weight="600">95% confidence interval</text>
    </g>

    <text class="d118a-caption" x="20" y="330">Here the interval EXCLUDES the null value of 0 -- the point estimate and its uncertainty band both sit clear of the null.</text>
    <text class="d118a-caption" x="20" y="354">The duality: this test rejects at alpha exactly when the interval excludes the null. Same information, but the interval also carries magnitude and precision -- how far, and how tightly measured.</text>
    <text class="d118a-caption" x="20" y="400" font-weight="600">Measured in this lesson's lab: zero disagreements between "test rejects" and "interval excludes the null" across 2,000 simulated datasets.</text>
    <text class="d118a-caption" x="20" y="424">"95% confidence" means: repeat this interval-building procedure many times, and about 95% of the resulting intervals contain the true value -- verified directly by building 10,000 of them (measured coverage: 95.09%).</text>
  </g>
</svg>
