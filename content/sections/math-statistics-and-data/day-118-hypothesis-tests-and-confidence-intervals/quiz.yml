questions:
  - question: 'A p-value of 0.03 for a two-sample test most precisely means:'
    options:
      - 'If the null hypothesis were true, data at least this extreme would occur about 3% of the time'
      - 'There is a 97% chance the observed difference is real'
      - 'There is a 3% chance the null hypothesis is true'
      - 'The effect size is 0.03 standard deviations'
    answer_index: 0
    explanation: 'A p-value is P(data at least this extreme | the null hypothesis is true) -- a conditional probability computed under an assumption, not a probability about the assumption itself. Reading it as P(null true | data) skips exactly the prior-probability step Day 115''s Bayes'' theorem requires, which a bare p-value never supplies.'

  - question: 'A researcher checks 15 independent metrics at alpha = 0.05 each, with no correction, and all 15 true nulls are actually true. The probability at least one comes back "significant" is closest to:'
    options:
      - '0.05'
      - '0.54'
      - '0.75'
      - '0.15'
    answer_index: 1
    explanation: '1 - (1 - 0.05)^15 = 1 - 0.95^15 = 0.537. This lesson derived the m=20 version of the same formula (0.6415) and confirmed it by simulation; the mechanism is identical at m=15, just slightly less severe.'

  - question: 'What does "95% confidence" in a 95% confidence interval actually describe, according to this lesson''s coverage measurement?'
    options:
      - 'The probability the true parameter lies in this specific interval'
      - 'The probability the null hypothesis is false'
      - 'The fraction of intervals built this way, across repeated sampling, that contain the true parameter'
      - 'The reliability of the measuring instrument used to collect the data'
    answer_index: 2
    explanation: 'This lesson built 10,000 real intervals from a population with a known true mean and measured that 95.09% of them actually contained it -- a property of the interval-BUILDING PROCEDURE, verified by repetition, not a probability statement about any one already-built interval, which either does or does not contain the fixed true value.'

  - question: 'A two-sided test at alpha = 0.05 and a 95% confidence interval, built from the same data:'
    options:
      - 'Are unrelated procedures that can disagree'
      - 'Agree only when the sample size is large'
      - 'Agree only for one-sample tests, not two-sample tests'
      - 'Always agree: the test rejects exactly when the interval excludes the null value'
    answer_index: 3
    explanation: 'This lesson confirmed zero disagreements across 2,000 simulated datasets, because both are built from the identical standardized statistic. The interval carries more information than the test''s bare yes/no answer -- its width and location -- while agreeing with it exactly on the reject/fail-to-reject question.'

  - question: 'A study finds a statistically significant (p = 0.001) but very small effect size, using an enormous sample size. The most accurate conclusion is:'
    options:
      - 'The result is strong evidence the effect is non-zero, but says nothing on its own about whether it is large enough to matter'
      - 'The effect is definitely important in practice'
      - 'The p-value is wrong because the effect is too small'
      - 'A small p-value always implies a large effect'
    answer_index: 0
    explanation: 'This lesson demonstrated exactly this pattern directly: a fixed 0.5% relative difference (Cohen''s d about 0.02, a tiny effect) was non-significant at n=30 and overwhelmingly significant at n=100,000, with the effect size itself completely unchanged between the two runs. Significance and importance are different questions.'

  - question: 'A team checks a live experiment''s p-value every day and stops the first time it drops below 0.05. Compared to a fixed-sample-size test run once, this procedure''s true false-positive rate is:'
    options:
      - 'The same, since each day''s p-value is computed correctly'
      - 'Higher, often substantially, because repeated looking inflates the real error rate beyond the nominal alpha'
      - 'Lower, because more looks means more chances to correct early mistakes'
      - 'Undefined, because p-values cannot be computed on partial data'
    answer_index: 1
    explanation: 'This lesson measured it directly: under a population where the null was true the entire time, checking after every 10 observations for up to 5 looks and stopping at the first p<0.05 produced a false-positive rate of 0.1888 -- nearly four times the nominal 5% a single, fixed-n test achieved (0.0493).'

  - question: 'A permutation test''s key advantage over a z-test is:'
    options:
      - 'It always produces a smaller p-value'
      - 'It never requires random number generation'
      - 'It requires no assumption about the shape of the population''s distribution'
      - 'It is mathematically identical to the z-test in every case'
    answer_index: 2
    explanation: 'The permutation test shuffles group labels and rebuilds the null distribution empirically, with no assumption of normality. This lesson showed it agreeing closely with the z-test at a moderate n from a normal population, and diverging more (while remaining valid) at a small n from a skewed population -- exactly where the z-test''s normal approximation is on shakier ground.'

  - question: 'Statistical power depends jointly on:'
    options:
      - 'Only the sample size'
      - 'Only the significance level (alpha)'
      - 'Only whether the null hypothesis happens to be true'
      - 'The true effect size, the sample size, and alpha, together'
    answer_index: 3
    explanation: 'This lesson computed power directly and confirmed it rises monotonically with both n and the true effect size, and showed the closed-form formula agreeing with a direct simulation to within 0.002 at one configuration. "Found nothing" without a stated power figure does not distinguish a genuine absence of effect from a test that never had a realistic chance to detect it.'
