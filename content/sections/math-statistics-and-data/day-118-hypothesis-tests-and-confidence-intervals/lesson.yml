learning_promise: 'After this lesson you will be able to state precisely what a p-value does and does not mean, build a hypothesis test and a confidence interval from scratch using nothing but math.erf, and defend or challenge any significance claim you meet in practice. You will open by deriving, by hand and then by simulation, that checking twenty independent metrics at alpha=0.05 gives a 64.15% chance of at least one false positive purely from noise -- and that a Bonferroni correction pulls that back to about 4.9%. You will build the centrepiece yourself: 10,000 nominal-95% confidence intervals from a population with a known true mean, measuring coverage at 95.09%, which is what "95% confidence" actually means -- a property of the procedure, not a probability about any one interval. You will prove the test/interval duality holds with zero exceptions across 2,000 simulated datasets, build a permutation test from scratch that needs no distributional assumption, and compute statistical power directly, confirming a closed-form formula against a live simulation to within 0.002. You will demonstrate that the identical 0.5% relative difference is not significant at n=30 (p=0.57) and is significant at n=100,000 (p close to zero), with the effect size itself completely unchanged -- and you will measure peeking''s real cost directly: checking a true null after every 10 observations and stopping at the first p<0.05 pushes the false-positive rate to 0.19, nearly four times the nominal 5%. You will close by applying both halves of the day to a single AI-evaluation sentence: a 500-example test carries a 1.25-point standard error, so a leaderboard entry claiming +0.2 points after trying twenty configurations has demonstrated almost nothing.'
objectives:
  - 'State precisely what a p-value is -- P(data at least this extreme | the null hypothesis is true) -- and explain why reading it as P(null true | data) repeats Day 115''s base-rate error'
  - 'Build a two-sample z-test and its p-value from math.erf alone, and check it against an independent hand computation to at least six decimal places'
  - 'Derive by hand and confirm by simulation that checking m independent tests at alpha gives a family-wise false-positive rate of 1 - (1-alpha)^m, and apply the Bonferroni correction to pull it back to alpha'
  - 'Build 10,000 real confidence intervals from a population with a known true mean and measure their coverage, demonstrating that "95% confidence" describes the interval-building procedure, not any single interval'
  - 'Demonstrate the exact duality between a two-sided test at alpha and a (1 - alpha) confidence interval, and explain why the interval carries more information than the test alone'
  - 'Build a permutation test from scratch with no distributional assumption, and compare it to the z-test where the normal approximation does and does not hold well'
  - 'Compute statistical power as a function of true effect size, sample size, and alpha together, and explain why a null result without a stated power is not evidence of absence'
  - 'Demonstrate that a fixed, tiny effect size can be non-significant at a small n and significant at an enormous one, and distinguish statistical significance from practical importance'
  - 'Measure by simulation how checking a test repeatedly and stopping at the first significant result inflates the true false-positive rate well past the nominal alpha'
  - 'Apply both the effect-size-versus-n and multiple-comparisons ideas to judge whether a claimed model-evaluation improvement is a real, demonstrated effect'
prerequisites:
  - 'Day 113 -- probability rules and Monte Carlo error shrinking as 1/sqrt(n)'
  - 'Day 114 -- random variables, expectation, variance, and numpy.random.Generator'
  - 'Day 115 -- Bayes'' theorem and the base-rate error this lesson''s p-value section names explicitly'
  - 'Day 117 -- the sampling distribution, the standard error, and the bootstrap built from scratch, all reused here directly'
  - 'Comfort with NumPy arrays and basic vectorised operations'
  - 'Days 71-74 -- running pytest and reading its skip-versus-fail output'
