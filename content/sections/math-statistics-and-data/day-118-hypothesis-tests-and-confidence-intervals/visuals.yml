visuals:
  - id: test-anatomy-architecture
    file: assets/test-anatomy-architecture.svg
    type: diagram
    title: 'A test and its matching interval: the null distribution, the p-value tail, the rejection region, and the confidence interval beside it'
    alt: 'Diagram: two panels. Left, a bell-shaped null distribution centered at zero, with the observed statistic marked, its tail area shaded as the p-value, and the more extreme rejection region beyond the critical value shaded darker at each end. Right, a number line showing the matching confidence interval, with the null value marked outside it, showing the interval excludes the null exactly when the test rejects'
    description: 'A static architecture diagram on a light background, split into two side-by-side panels. The left panel, headed "1. The null distribution," draws a bell curve for the sampling distribution of a test statistic under the null hypothesis, with a light blue shaded tail beyond the observed statistic (marked with an amber line and dot) labelled as the p-value, and a darker blue shaded region beyond dashed critical-value lines at plus and minus 1.96 labelled as the rejection region at alpha. A caption states that because the observed value falls short of the critical value here, this particular test does not reject. The right panel, headed "2. The matching confidence interval," draws a horizontal interval bar built from the identical data, with the null value marked in amber outside the bar, captioned that the interval excludes the null exactly when the test rejects -- the duality -- and that the interval additionally carries magnitude and precision the bare test does not. Both panels close with the measured results from this lesson''s lab: zero test/interval disagreements across 2,000 datasets, and 95.09% measured coverage across 10,000 real intervals.'

  - id: ci-coverage-flow
    file: assets/ci-coverage-flow.svg
    type: flow-animated
    title: 'Twenty 95% confidence intervals stacking against a fixed true value, one visibly missing'
    alt: 'Diagram: animated flow. Twenty horizontal confidence-interval bars stack top to bottom against a fixed vertical dashed line marking the true population value. Nineteen bars cross the line; one bar, highlighted in amber, sits entirely to one side and misses it. Each bar briefly brightens in sequence from top to bottom as it is built, then settles to its resting color, looping. With motion disabled every bar rests at full opacity in its final, already-built position'
    description: 'An animated flow diagram, fully readable as a still image. The heading reads "Ten thousand of these, and 95.09% cover the truth" and subheads that this shows twenty of the 10,000 intervals this lesson''s lab actually built, stacked against the known true population mean, marked by a fixed dashed vertical line. Twenty horizontal interval bars are stacked one per row; each briefly brightens from resting blue to a lighter highlight color in a staggered sequence from the top row to the bottom row, then returns to its resting blue, looping every eight seconds, visually suggesting the intervals being built one after another. One row (the thirteenth) is drawn in amber instead of blue and sits entirely to the right of the true-value line, never crossing it -- the one interval, of the twenty shown, that misses the true value. A closing caption states that 19 of the 20 shown cross the true value and roughly 1 in 20 misses, as expected from a 95% procedure. A prefers-reduced-motion block stops every animation: every bar rests at its final blue or amber resting color and width, at full opacity, in its already-built position -- every bar, whisker, label and both captions remain fully present with no motion.'
