terms:
  - term: Null hypothesis (H0)
    definition: >-
      The default assumption a hypothesis test holds until the evidence
      overwhelms it -- typically "no difference" or "no effect." A test
      never proves the null true; it only asks how surprising the observed
      data would be if the null were true, and rejects the null when the
      answer is "very surprising."

  - term: p-value
    definition: >-
      P(data at least this extreme | the null hypothesis is true). Not the
      probability the null hypothesis is true, and not the probability the
      observed effect is real -- both of those require a prior probability
      the p-value never supplies, exactly the ingredient Day 115's Bayes'
      theorem needs and a p-value alone does not have.

  - term: Alpha (significance level)
    definition: >-
      The Type I error rate a test is willing to tolerate, fixed before the
      data is collected -- the pre-agreed burden of proof, not a threshold
      adjusted after seeing how convincing the evidence turned out to be.
      Conventionally 0.05, though that number is a historical convention
      (Fisher, 1925), not a mathematically derived optimum.

  - term: Type I error
    definition: >-
      Rejecting a true null hypothesis -- a false positive. Its rate is
      controlled directly by alpha, by design, for a single test run
      exactly once at a fixed sample size.

  - term: Type II error
    definition: >-
      Failing to reject a false null hypothesis -- a false negative. Its
      rate, beta, is not controlled by alpha alone; it depends on the true
      effect size and the sample size too, which is exactly what power
      measures.

  - term: Statistical power
    definition: >-
      The probability of correctly rejecting a false null hypothesis of a
      given true effect size -- 1 minus beta. Depends jointly on the true
      effect size, the sample size, and alpha; this lesson measured power
      rising monotonically with both n and effect size and confirmed a
      closed-form formula against a direct simulation to within 0.002.

  - term: Confidence interval
    definition: >-
      A range built from data by a procedure whose long-run coverage rate
      is known -- a (1 - alpha) interval, repeated across many samples,
      contains the true parameter about (1 - alpha) of the time. This
      lesson measured 95.09% coverage across 10,000 real intervals from a
      population with a known true mean, which is the content of "95%
      confidence," not a probability statement about any single interval.

  - term: Coverage
    definition: >-
      The measured fraction of confidence intervals, built the same way
      across repeated sampling, that actually contain the true parameter
      value. The only way to verify a confidence procedure's stated level
      is genuinely accurate, rather than assumed.

  - term: Test/interval duality
    definition: >-
      The exact equivalence between a two-sided hypothesis test at level
      alpha and a (1 - alpha) confidence interval: the test rejects a null
      value precisely when the interval excludes it. This lesson confirmed
      zero disagreements across 2,000 simulated datasets, because both are
      built from the identical standardized statistic.

  - term: Permutation test
    definition: >-
      A hypothesis test built by shuffling group labels on pooled data
      thousands of times, recomputing the statistic each time, and reading
      the p-value off how often a shuffle produced something at least as
      extreme as what was actually observed. Requires no assumption about
      the population's distributional shape.

  - term: Effect size
    definition: >-
      A measure of how large a difference is, independent of sample size --
      for example Cohen's d, the standardized mean difference. A tiny
      effect size can still reach statistical significance given enough
      data; this lesson demonstrated a fixed 0.5% relative difference
      going from non-significant (n=30) to overwhelmingly significant
      (n=100,000) with the effect size itself unchanged.

  - term: Multiple comparisons
    definition: >-
      The problem created by running many hypothesis tests and evaluating
      each at the same alpha without correction. The family-wise
      false-positive rate for m independent tests is 1 - (1-alpha)^m, not
      alpha -- 0.6415 for 20 tests at alpha=0.05, confirmed by simulation
      in this lesson.

  - term: Bonferroni correction
    definition: >-
      A simple, conservative fix for multiple comparisons: test each of m
      hypotheses at alpha/m instead of alpha, which pulls the family-wise
      error rate back down near the original alpha. Simulated in this
      lesson at 0.0515 against an analytic target of 0.0488.

  - term: Peeking
    definition: >-
      Checking a hypothesis test's p-value repeatedly as data arrives and
      stopping at the first significant result. Inflates the true
      false-positive rate well past the nominal alpha, even though every
      individual p-value along the way was computed correctly -- measured
      in this lesson at nearly 4x the nominal rate under a true null.

  - term: Welch's t-test
    definition: >-
      The small-sample-correct cousin of this lesson's large-sample
      two-sample z-test: uses a t rather than a normal reference
      distribution, with Welch-Satterthwaite degrees of freedom, and does
      not assume the two groups share a common variance. Implemented as
      scipy.stats.ttest_ind(a, b, equal_var=False), described but not run
      in this lesson.
