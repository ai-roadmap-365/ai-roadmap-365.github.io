terms:
  - term: groupby
    definition: >-
      The pandas operation implementing split-apply-combine: partition a DataFrame or Series into
      groups sharing the same value(s) on one or more key columns, apply a function independently to
      each group, and combine the per-group results back into a single pandas object.
  - term: split-apply-combine
    definition: >-
      The three-stage pattern groupby implements. Split: rows are sorted into buckets by their group
      key, and rows with a missing key are excluded from every bucket by default. Apply: a function
      runs once per bucket, on that bucket's rows only. Combine: the per-bucket results are stitched
      back into a final object, whose shape depends on which combine strategy (agg, transform, filter,
      apply) was used.
  - term: DataFrameGroupBy
    definition: >-
      The lazy object returned by df.groupby(...). It records the grouping plan but performs no
      computation until an aggregation, transformation or filter is attached to it.
  - term: dropna (groupby)
    definition: >-
      A groupby keyword, default True, controlling whether rows with a missing group key are excluded
      from every group (True, the default) or collected into their own NaN-labelled group (False). The
      default is the mechanism behind this lesson's opening failure: a grouped sum under dropna=True
      can be silently less than the true overall sum.
  - term: reconciliation invariant
    definition: >-
      The check that the sum of a groupby aggregation's per-group results equals the corresponding
      aggregation over the whole, ungrouped column -- true under dropna=False, false under dropna=True
      whenever any key is missing, in which case the gap equals exactly the missing-key rows' own
      total.
  - term: size() (GroupBy)
    definition: >-
      Counts the number of rows in each group, regardless of whether any column's value is missing.
      Differs from count() exactly on groups containing missing values.
  - term: count() (GroupBy)
    definition: >-
      Counts, per column, the number of non-missing values in each group. A per-column method, unlike
      size(), which is scalar-per-group and does not vary by column.
  - term: .agg()
    definition: >-
      A GroupBy method that reduces each group to a single summary row. Accepts a single function name,
      a list of function names, a dict mapping columns to functions, or named aggregation
      (result_name=(column, function)). The list and dict forms on a multi-column selection typically
      produce a MultiIndex on the result columns; named aggregation always produces flat column names.
  - term: named aggregation
    definition: >-
      The agg(result=(column, function)) syntax, added in pandas 0.25, that names each output column
      explicitly and produces a flat column index rather than the MultiIndex the list and dict forms of
      .agg() typically produce on a multi-column selection.
  - term: .transform()
    definition: >-
      A GroupBy method that computes a per-group statistic and returns it aligned to every original
      row -- the result has the same length and order as the input, unlike .agg(), which reduces each
      group to one row.
  - term: .apply() (GroupBy)
    definition: >-
      A GroupBy method that runs an arbitrary user function once per group, passing the whole group as
      a DataFrame or Series, and reassembles whatever the function returns. The most general and, for
      built-in-equivalent computations, the slowest of the three, because it calls a Python function
      once per group rather than dispatching to a vectorised path.
  - term: GroupBy.filter
    definition: >-
      A method that keeps or drops entire groups based on a predicate evaluated once per group (for
      example, a minimum group size), returning a subset of the original rows with the surviving
      groups' structure otherwise unchanged. Distinct from row-level boolean-mask filtering (Day 122),
      which decides row by row rather than group by group.
  - term: multi-key grouping
    definition: >-
      Grouping by more than one column at once (groupby(["region", "rep"])). The combined result
      carries a pandas.MultiIndex with one level per grouping key, unless as_index=False is passed, in
      which case the same values are returned as ordinary columns in a flat DataFrame.
  - term: MultiIndex
    definition: >-
      A pandas index with more than one level, produced by multi-key grouping (one level per key) or by
      the list/dict forms of .agg() on a multi-column selection (one level for the source column, one
      for the applied function).
  - term: as_index
    definition: >-
      A groupby keyword, default True, controlling whether the grouping key(s) become the result's
      index (True) or ordinary columns in a flat DataFrame (False).
  - term: observed
    definition: >-
      A groupby keyword for categorical group keys, default False, controlling whether every possible
      combination of declared categories appears in the result (False, including combinations never
      actually observed in the data) or only combinations that actually occur (True). With several
      categorical keys, observed=False's row count grows as the product of every key's category count.
  - term: pivot_table
    definition: >-
      A DataFrame method built on groupby that reshapes an aggregation into a cross-tabulation, with
      one grouping key sent to the row index and another to the columns, filling combinations that were
      never observed with a chosen fill_value rather than omitting them silently.
  - term: weighted mean
    definition: >-
      A mean where each value contributes proportionally to an associated weight rather than equally --
      computed here with np.average(values, weights=weights), either inside a per-group apply call or
      via a vectorised sum-of-products-over-sum-of-weights route that avoids apply entirely.
  - term: include_groups
    definition: >-
      A keyword added to GroupBy.apply() in pandas 2.2 controlling whether the grouping column(s) are
      included in the DataFrame passed to the applied function. Does not exist on pandas versions
      before 2.2, in which the grouping columns are always included.
  - term: sort (groupby)
    definition: >-
      A groupby keyword, default True, controlling whether the result is sorted by the group key. Passing
      sort=False skips that sort as a cheap performance win when the result's order does not matter, without
      changing any of the computed values.
