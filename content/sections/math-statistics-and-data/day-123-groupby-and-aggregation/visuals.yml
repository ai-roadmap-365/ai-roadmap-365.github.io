visuals:
  - id: split-apply-combine-architecture
    file: assets/split-apply-combine-architecture.svg
    type: diagram
    title: 'Split, apply, combine -- with the missing-key rows falling out at the split'
    alt: 'Diagram: a six-row orders table splits into three group boxes by region — North, South, East — with two rows whose region is missing falling out below the split into a separate "dropped: region missing" tray rather than joining any group; each group box has a function applied inside it, producing one summed value per group, and the three group results combine into a final two-column result table; a caption states that groupby drops rows with a missing key by default, silently, and that the fix is dropna=False'
    description: >-
      A static architecture diagram of split-apply-combine on a six-row orders table grouped by region.
      Stage 1, the source table, lists six rows with region and amount columns; two of them have no
      region at all and are drawn with a dashed red outline. Stage 2 shows three blue group boxes --
      North, South, East -- each receiving its rows via a solid blue arrow from the source, with a sum
      symbol applied inside each box and the per-group total printed beneath it; the two rows with a
      missing region are instead routed by a dashed red arrow down into a separate "dropped: region
      missing" tray beneath the group boxes, visibly never reaching any group. Stage 3, on the right, is
      a green combine table listing each region's total, fed by arrows from the three group boxes only
      -- nothing arrives at the combine stage from the dropped tray. A caption band beneath states the
      arithmetic explicitly: the grouped total plus the dropped rows' total equals the true overall
      total, and that groupby(dropna=False) is what keeps the dropped tray from being silently
      discarded.
  - id: groupby-flow
    file: assets/groupby-flow.svg
    type: flow-animated
    title: 'agg shrinks to one row per group; transform keeps every row'
    alt: 'Diagram: six rows — three North, three South — sort from a source column on the left into two group buckets; from the North bucket, one wire feeds an agg result table showing a single row, North, mean 120, while another set of wires feeds a transform result column that still has six rows, with every North row showing 120 and every South row showing its own group''s mean, so the transform output is the same length and order as the source — a caption states that agg reduces each group to one row while transform returns a value for every original row, the shape difference being the whole point'
    description: >-
      An animated flow diagram, fully readable as a still image, contrasting agg and transform on the
      same six-row source column (three North, three South amounts). The six source rows drift a short
      distance to the right and settle into two labelled buckets, North and South, each showing its
      three raw values and computed mean. Marching-dash wires then fade in from each bucket: three
      converge into a two-row agg result table on the upper right, whose two rows pulse from neutral
      grey to green once fed, reading North 120 and South 200 -- one row per group. A second set of
      wires fans from the same two buckets down into a six-row transform result column on the lower
      right, whose six rows pulse to their own group's colour (blue for North, purple for South) once
      fed, each one labelled with its original row number and the group mean it now carries -- 120, 200,
      120, 200, 120, 200, in the source's original order. Captions beneath each result state its shape
      explicitly: (2,) for agg, (6,) for transform, same as the source. A closing caption band states
      that agg collapses each group to one summary row while transform returns a value for every
      original row in its original order and length, which is how a group statistic gets attached back
      onto the row it came from. A prefers-reduced-motion block stops every slide, wire-march and colour
      pulse, leaving the buckets in their settled position, the wires drawn as solid lines, and both
      result tables already shown in their final, fully-coloured state, so every fact in the diagram is
      visible without motion.
