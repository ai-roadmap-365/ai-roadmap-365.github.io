questions:
  - question: >-
      orders.groupby("region")["amount"].sum().sum() returns 1945.0, but orders["amount"].sum()
      returns 2115.0. What explains the 170.0 gap?
    options:
      - 'A rounding error in floating-point summation'
      - 'groupby, by default, excludes rows whose region is missing, and 170.0 is exactly those rows'' amount total'
      - 'groupby double-counts rows that appear in more than one group'
      - 'sum() and .sum().sum() use different numeric precision internally'
    answer_index: 1
    explanation: >-
      dropna=True is groupby's default: rows whose key is missing are excluded from every group,
      silently. The gap between a grouped total and the true overall total always equals exactly the
      missing-key rows' own total -- not a rounding artifact, not double-counting, but a real
      exclusion. groupby(dropna=False) collects those rows into their own group instead, and the
      grouped total then matches the overall total exactly.
  - question: >-
      A GroupBy object g has size() reporting South as 3 rows and count()['amount'] reporting South
      as 2. What is the most likely explanation?
    options:
      - 'South has 3 rows total, and one of them has a missing amount value'
      - 'count() only works on the first column of a DataFrame'
      - 'size() and count() disagree only when the group key itself is a duplicate'
      - 'This is a bug -- size() and count() should always report the same number'
    answer_index: 0
    explanation: >-
      size() counts rows in a group regardless of missing values; count() counts, per column, only the
      non-missing values. They disagree exactly where a column has missing data -- here, one of
      South's three amount values is NaN, so count() reports 2 while size() still reports 3. Both
      numbers are correct answers to two different questions.
  - question: >-
      Which of the four .agg() forms covered in this lesson -- single function, list, per-column dict,
      or named aggregation -- is guaranteed to produce FLAT column names rather than a MultiIndex?
    options:
      - 'The list form, agg(["sum", "mean"])'
      - 'The per-column dict form, agg({"amount": "sum"})'
      - 'Named aggregation, agg(total=("amount", "sum"))'
      - 'All four forms always produce flat columns'
    answer_index: 2
    explanation: >-
      Named aggregation (result_name=(column, function)) names each output column explicitly and
      always produces a flat column index. The list and dict forms, applied to a multi-column
      selection, typically produce a MultiIndex of (column, function) pairs on the result -- correct,
      but requiring a flattening step if plain column names are needed downstream.
  - question: >-
      sales.groupby("region")["amount"].agg("mean") has shape (4,). What shape does
      sales.groupby("region")["amount"].transform("mean") have, on the same 12-row sales table?
    options:
      - '(4,), the same as agg, because both compute a group mean'
      - '(1,), a single overall mean'
      - '(12,), the same as the input, because transform returns a value for every original row'
      - 'It depends on how many unique means there are'
    answer_index: 2
    explanation: >-
      agg reduces each group down to one summary row -- four groups, four rows out. transform instead
      returns a result the same length and order as the INPUT -- twelve rows in, twelve rows out, with
      every row carrying its own group's mean. This shape difference is exactly what lets transform
      attach a group statistic back onto every original row without a separate merge.
  - question: >-
      orders.groupby("region").filter(lambda g: len(g) >= 3) is run on a table where the West group
      has only 1 row and every other group has 3 or more. What happens to West's row?
    options:
      - 'It is kept, because filter only removes rows where an individual value fails the predicate'
      - 'It is moved into a separate "small groups" DataFrame automatically'
      - 'An error is raised because West has fewer than the minimum group size'
      - 'It is dropped entirely, because filter evaluates the predicate once per GROUP and removes every row in a group that fails it'
    answer_index: 3
    explanation: >-
      GroupBy.filter evaluates its predicate once per group, not once per row. len(g) >= 3 is False
      for West's one-row group, so every row belonging to West -- all one of them -- is dropped
      wholesale. This is distinct from Day 122's row-level boolean-mask filtering, which decides row by
      row rather than group by group, despite sharing the word "filter."
  - question: >-
      cat_sales has region (5 categories) and rep (4 categories) both declared as pandas Categorical,
      with 9 of the 20 possible combinations actually present in the data. What does
      cat_sales.groupby(["region", "rep"], observed=False).size() return?
    options:
      - 'A Series with exactly 9 rows, one per combination actually observed'
      - 'An error, because observed=False is not a valid combination with two categorical keys'
      - 'A Series with 4 rows, one per rep category only'
      - 'A Series with 20 rows -- every possible category combination, most with a count of 0'
    answer_index: 3
    explanation: >-
      observed=False (the default for a categorical groupby) manufactures a row for every possible
      combination of the declared categories -- 5 regions times 4 reps equals 20 -- regardless of
      whether that combination ever actually occurred in the data. observed=True restricts the result
      to the 9 combinations genuinely present. With several categorical keys, the observed=False row
      count grows as the product of every key's category count, a real memory hazard on wide data.
  - question: >-
      A built-in .agg("mean") call on a 200,000-row, 2,000-key groupby is measured against the
      equivalent .apply(lambda g: g.mean()) on the same data. Why is the built-in call reliably faster?
    options:
      - '.apply always returns wrong values, so pandas has to recompute internally'
      - '.apply is only slower on Windows, not on macOS or Linux'
      - '.agg("mean") dispatches to a vectorised, largely C-level path across all groups at once, while .apply calls a Python function once per group, paying Python''s per-call overhead 2,000 times over'
      - 'There is no reliable difference; any measured gap is pure noise'
    answer_index: 2
    explanation: >-
      Built-in aggregation names dispatch to pandas' optimised, largely C-level implementations that
      process every group in one pass. .apply(lambda g: g.mean()) genuinely calls a Python function
      once per distinct group -- 2,000 separate Python-level calls here -- and Python's per-call
      overhead is paid every single time. The exact ratio varies by machine, but the shape of the gap
      (built-in wins, and by a wide margin) is stable, which is why this lesson's lab asserts a
      conservative ratio floor rather than a specific number.
  - question: >-
      A dataset already lives inside a production database, and the question is simply "total revenue
      per region." According to this lesson's Tools section, what is the better first choice?
    options:
      - 'Always pull every raw row into pandas first, because pandas groupby is always faster than SQL'
      - 'Run GROUP BY where the data already lives, letting the database use its own indexes and query planner, and pull back only the summarised result'
      - 'Convert the database to a CSV file first, then load it with pandas'
      - 'There is no meaningful difference; the choice never affects performance'
    answer_index: 1
    explanation: >-
      When the data already lives in, or belongs in, a database, running GROUP BY there and pulling
      back only the aggregated result is usually better than pulling every raw row across the wire into
      Python and grouping it in pandas afterward -- the database can use its own indexes and query
      planner, and far less data has to move. pandas groupby is the better choice once the data is
      already a DataFrame in memory or needs pandas-specific work before or after grouping.
