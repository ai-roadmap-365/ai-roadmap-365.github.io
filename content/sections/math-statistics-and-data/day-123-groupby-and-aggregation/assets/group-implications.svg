<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are cost.">
  <title>Four consequences of grouping</title>
  <style>
    .group-implications-bg   { fill: #f8fafc; }
    .group-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .group-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .group-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .group-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .group-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .group-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .group-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .group-implications-stage { opacity: 1; }

    .group-implications-s0 { animation-delay: 0.00s; }
    .group-implications-e0 { animation-delay: 0.00s; }
    .group-implications-s1 { animation-delay: 1.28s; }
    .group-implications-e1 { animation-delay: 1.28s; }
    .group-implications-s2 { animation-delay: 2.56s; }
    .group-implications-e2 { animation-delay: 2.56s; }
    .group-implications-s3 { animation-delay: 3.84s; }
    .group-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .group-implications-conn  { animation: group-implications-trace 6.4s ease-in-out infinite; }
      .group-implications-stage { animation: group-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes group-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes group-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .group-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .group-implications-stage { animation: group-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes group-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="group-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="group-implications-bg" width="980" height="322"/>
  <text class="group-implications-h1"  x="30" y="40">Four consequences of grouping</text>
  <text class="group-implications-sub" x="30" y="64">Two are cost.</text>
  <g class="group-implications-stage group-implications-s0">
    <rect class="group-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="group-implications-step" x="44" y="142">01</text>
    <text class="group-implications-name" x="70" y="142">Complex summaries become one readable line</text>
    <text class="group-implications-desc" x="44" y="166">Which is the productivity gain.</text>
  </g>
  <line class="group-implications-line group-implications-conn group-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#group-implications-tip)"/>
  <g class="group-implications-stage group-implications-s1">
    <rect class="group-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="group-implications-step" x="280" y="142">02</text>
    <text class="group-implications-name" x="306" y="142">But grouping by a high-cardinality key uses memory</text>
    <text class="group-implications-desc" x="280" y="166">One entry per distinct value.</text>
  </g>
  <line class="group-implications-line group-implications-conn group-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#group-implications-tip)"/>
  <g class="group-implications-stage group-implications-s2">
    <rect class="group-implications-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="group-implications-step" x="516" y="142">03</text>
    <text class="group-implications-name" x="542" y="142">And silent drops of missing keys distort totals</text>
    <text class="group-implications-desc" x="516" y="166">Which nothing warns about.</text>
  </g>
  <line class="group-implications-line group-implications-conn group-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#group-implications-tip)"/>
  <g class="group-implications-stage group-implications-s3">
    <rect class="group-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="group-implications-step" x="752" y="142">04</text>
    <text class="group-implications-name" x="778" y="142">While vectorised aggregation is far faster than loops</text>
    <text class="group-implications-desc" x="752" y="166">By a large factor.</text>
  </g>
  <text class="group-implications-sub" x="30" y="304">Totals not reconciling is the usual symptom of silently dropped keys, and checking that group counts sum to the row count catches it in one line.</text>
</svg>
