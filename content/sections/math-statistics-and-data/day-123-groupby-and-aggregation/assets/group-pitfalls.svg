<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four issues.">
  <title>Where grouping goes wrong</title>
  <style>
    .group-pitfalls-bg   { fill: #f8fafc; }
    .group-pitfalls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-pitfalls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-pitfalls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-pitfalls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-pitfalls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-pitfalls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-pitfalls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .group-pitfalls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .group-pitfalls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .group-pitfalls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .group-pitfalls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .group-pitfalls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .group-pitfalls-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .group-pitfalls-stage { opacity: 1; }

    .group-pitfalls-s0 { animation-delay: 0.00s; }
    .group-pitfalls-e0 { animation-delay: 0.00s; }
    .group-pitfalls-s1 { animation-delay: 1.28s; }
    .group-pitfalls-e1 { animation-delay: 1.28s; }
    .group-pitfalls-s2 { animation-delay: 2.56s; }
    .group-pitfalls-e2 { animation-delay: 2.56s; }
    .group-pitfalls-s3 { animation-delay: 3.84s; }
    .group-pitfalls-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .group-pitfalls-conn  { animation: group-pitfalls-trace 6.4s ease-in-out infinite; }
      .group-pitfalls-stage { animation: group-pitfalls-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes group-pitfalls-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes group-pitfalls-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .group-pitfalls-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .group-pitfalls-stage { animation: group-pitfalls-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes group-pitfalls-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="group-pitfalls-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="group-pitfalls-bg" width="980" height="322"/>
  <text class="group-pitfalls-h1"  x="30" y="40">Where grouping goes wrong</text>
  <text class="group-pitfalls-sub" x="30" y="64">Four issues.</text>
  <g class="group-pitfalls-stage group-pitfalls-s0">
    <rect class="group-pitfalls-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="group-pitfalls-step" x="44" y="142">01</text>
    <text class="group-pitfalls-name" x="70" y="142">Rows with a missing key are dropped by default</text>
    <text class="group-pitfalls-desc" x="44" y="166">Silently.</text>
  </g>
  <line class="group-pitfalls-line group-pitfalls-conn group-pitfalls-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#group-pitfalls-tip)"/>
  <g class="group-pitfalls-stage group-pitfalls-s1">
    <rect class="group-pitfalls-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="group-pitfalls-step" x="280" y="142">02</text>
    <text class="group-pitfalls-name" x="306" y="142">The key becomes the index of the result</text>
    <text class="group-pitfalls-desc" x="280" y="166">Which surprises people</text>
    <text class="group-pitfalls-desc" x="280" y="182">downstream.</text>
  </g>
  <line class="group-pitfalls-line group-pitfalls-conn group-pitfalls-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#group-pitfalls-tip)"/>
  <g class="group-pitfalls-stage group-pitfalls-s2">
    <rect class="group-pitfalls-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="group-pitfalls-step" x="516" y="142">03</text>
    <text class="group-pitfalls-name" x="542" y="142">Aggregations skip missing values</text>
    <text class="group-pitfalls-desc" x="516" y="166">So means come from varying</text>
    <text class="group-pitfalls-desc" x="516" y="182">counts.</text>
  </g>
  <line class="group-pitfalls-line group-pitfalls-conn group-pitfalls-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#group-pitfalls-tip)"/>
  <g class="group-pitfalls-stage group-pitfalls-s3">
    <rect class="group-pitfalls-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="group-pitfalls-step" x="752" y="142">04</text>
    <text class="group-pitfalls-name" x="778" y="142">And categories with no rows may vanish entirely</text>
    <text class="group-pitfalls-desc" x="752" y="166">Which breaks comparisons across</text>
    <text class="group-pitfalls-desc" x="752" y="182">periods.</text>
  </g>
  <text class="group-pitfalls-sub" x="30" y="304">Categories vanishing when they have no rows is what produces reports where a zero-sales region simply disappears rather than showing zero.</text>
</svg>
