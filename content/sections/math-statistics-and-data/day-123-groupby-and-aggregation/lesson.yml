slug: groupby-and-aggregation
title: 'Groupby and Aggregation'
section: math-statistics-and-data
subsection: data-analysis
week: 18
learning_promise: >-
  After this lesson you will be able to state and demonstrate that groupby drops rows with a missing
  key by default, silently, and show that the gap between a grouped sum and the overall sum equals
  exactly the missing-key rows' own total, then fix it with dropna=False; explain and demonstrate why
  size() and count() disagree exactly where a column has missing values; write .agg() four ways --
  single function, list, per-column dict, and named aggregation -- and say which produces a flat
  column index and which produces a MultiIndex; state and demonstrate the shape difference between agg
  (one row per group) and transform (the input's shape), and use transform to build a within-group
  z-score; use GroupBy.filter to keep or drop whole groups by a predicate and explain how that differs
  from row-level filtering; build and read a multi-key groupby's MultiIndex, and produce the same
  values flat with as_index=False; explain what observed= controls for a categorical groupby and
  measure how many unobserved combinations the default manufactures; measure a built-in aggregation
  against the equivalent .apply(lambda ...) and report the gap as a ratio, never a millisecond figure;
  and compute a weighted mean per group with apply and again without it, checking that the two agree.
objectives:
  - 'Demonstrate that groupby(...).sum() silently excludes rows with a missing key by default, and that the gap between the grouped total and the overall total equals exactly the missing-key rows'' own total'
  - 'Use dropna=False to make a groupby aggregation''s parts sum back to the whole, and state this as a habit to run after every groupby aggregation'
  - 'Explain the difference between size() (rows) and count() (non-missing values per column) on a GroupBy object, and predict exactly where they will disagree'
  - 'Write .agg() four ways -- a single function, a list of functions, a per-column dict, and named aggregation -- and state which forms produce a MultiIndex on the result columns and which stay flat'
  - 'Demonstrate the shape difference between agg (one row per group) and transform (the input''s shape), and use transform to attach a group mean back onto every original row'
  - 'Build a within-group z-score using transform for both the group mean and the group standard deviation, and verify each group''s z-scores average to zero'
  - 'Use GroupBy.filter to keep or drop whole groups by a size or aggregate predicate, and explain how this differs from Day 122''s row-level boolean-mask filtering despite sharing the word "filter"'
  - 'Build a multi-key groupby, read its resulting MultiIndex names and values, and produce the same result in a flat frame with as_index=False'
  - 'Explain what observed= controls for a categorical groupby, and measure how many unobserved category combinations the observed=False default manufactures on a two-key grouping'
  - 'Measure a built-in .agg() aggregation against the equivalent .apply(lambda ...) on the same data, and report the result as a ratio and a shape, never a millisecond figure'
  - 'Compute a weighted mean per group two ways -- with apply, and with a vectorised assign-then-agg route that avoids apply entirely -- and confirm the two results agree exactly'
  - 'State when SQL GROUP BY (executed where the data already lives) or pivot_table is the better choice over a plain pandas groupby, and describe polars'' group_by as a documented design alternative'
prerequisites:
  - 'Day 120 -- pandas Series and DataFrames, index alignment, and Copy-on-Write; every table in this lesson is an ordinary DataFrame built the way that day taught'
  - 'Day 121 -- loading and inspecting data, the habit of checking a frame before trusting it'
  - 'Day 122 -- boolean masks, .query(), and the partition invariant (a filter that silently drops NaN rows so the halves no longer sum to the whole), which this lesson''s exercise 1 directly extends to groupby'
  - 'Day 116 -- descriptive statistics and Simpson''s paradox, which this lesson''s AI-thread paragraph connects to per-group model evaluation'
  - 'Week 13 -- SQL and SQLite, the tool this lesson''s Tools section compares groupby against for tabular questions already living in a database'
  - 'A working python3 on your PATH; the lab creates its own virtual environment with pandas 3.0.5 pinned exactly'
reading_time_minutes: 50
