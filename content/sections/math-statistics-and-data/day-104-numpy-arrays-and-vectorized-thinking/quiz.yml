questions:
  - question: 'You write `(readings > 30) and (readings < 70)` on a NumPy array and get `ValueError: The truth value of an array with more than one element is ambiguous`. Why?'
    options:
      - 'The two comparisons produce arrays of different lengths, which cannot be combined'
      - 'NumPy has not implemented `and` for arrays yet; a future version will'
      - '`and` only works on lists, so the arrays must be converted with `.tolist()` first'
      - '`and` asks the array for one True or False, and twenty cannot'
    answer_index: 3
    explanation: 'This is not something NumPy could fix if it wanted to. `and` is control flow: Python evaluates the left operand and asks whether it is truthy so it can decide whether to bother evaluating the right one. There is no method for Python to call on the array — it calls `bool()`, and an array of twenty answers has no single answer, so it refuses rather than guessing. `&` IS an operator, so NumPy defines it to mean elementwise-and, which is what you meant. Option 1 is the reassuring misreading; option 2 is backwards, since converting to lists loses the very thing that makes the expression worth writing; option 3 is wrong because both comparisons are made on the same array and so produce identical shapes. Note the error message names its own escape routes, `.any()` and `.all()`, which are the two questions that DO have a single answer.'

  - question: '`row = grid[1]` on a 2-D array, then `row[0] = 999`. What happens to `grid`?'
    options:
      - '`grid[1, 0]` becomes 999, because a slice returns a view onto the same memory'
      - 'Nothing — `grid[1]` returned a copy of row one, exactly as list slicing would'
      - 'NumPy raises an error, because views are read-only'
      - '`grid` is unchanged but `row` is now detached from it, so later reads diverge'
    answer_index: 0
    explanation: 'Slicing an array returns a *view*: a new header over the same bytes. NumPy''s own beginner''s guide draws the contrast explicitly — "slice indexing of a list copies the elements into a new list, but slicing an array returns a view ... The original array can be mutated using the view" — and adds "modifying data in a view also modifies the original array!". Option 0 is the intuition you bring from lists and it is exactly what makes this bug hard: the code that breaks is nowhere near the code that caused it. Option 2 is wrong; views are perfectly writable, which is the whole problem. The useful pattern is that if the elements you asked for are evenly spaced, a stride can describe them and you get a view — slices, transposes, reshapes, `ravel`. If they are not, NumPy has no choice but to copy — boolean masks, fancy indexing, `flatten`. So the cheap operations are the dangerous ones. `.copy()` breaks the link, and `np.shares_memory(a, b)` answers the question directly.'

  - question: '`np.array([127], dtype=np.int8) + 1` — what does it give, and what happens on the way?'
    options:
      - '`[128]` as int64, because the plain Python 1 widens the result'
      - '`[-128]` as int8, silently — no exception and no warning'
      - 'It raises `OverflowError`, which is how Python normally reports this'
      - '`[127]`, because NumPy clamps rather than wrapping'
    answer_index: 1
    explanation: 'An int8 holds -128 to 127. In two''s complement, 127 is 0111 1111 and adding 1 carries all the way into the sign bit to give 1000 0000, which reads as -128. Nothing raises, and this was measured rather than assumed: the lab captures the warning list and asserts it is empty on numpy 2.5.2, so that if a future release started warning, the suite would say so rather than let the lesson quietly go stale. Option 0 was closer to true under NumPy 1; since NumPy 2 a Python scalar takes the array''s dtype rather than dragging it upward, which is why the lab pins the version and checks the major number before asserting anything about dtypes. Option 1 describes saturating arithmetic, which some image libraries do and NumPy does not. Option 2 describes Python''s own integers, which have no maximum at all — the hazard is acquired the moment you put data into a fixed-width array. The fix is to say what you meant: `.astype(np.int16)` before the arithmetic gives 128, at a cost of one extra byte per element.'

  - question: '`grid` has shape `(3, 4)`. What shape does `grid.sum(axis=1)` have?'
    options:
      - '`(4,)` — axis 1 has length 4, so four numbers come out'
      - '`(3, 4)` — summing does not change the shape unless you ask it to'
      - '`(3,)` — the named axis disappears, one number per row'
      - '`(1, 4)` — the summed axis is kept at length one'
    answer_index: 2
    explanation: 'The rule is: **the axis you name is the one that disappears.** Naming `axis=1` collapses the 4 and leaves shape `(3,)` — one total per row, which for `np.arange(12).reshape(3, 4)` is `[6, 22, 38]`. Option 0 is the single most common error in the whole topic, and it comes from reading `axis` as "the axis I want to keep"; anyone reading it that way is wrong by exactly one, every time. Option 3 describes what you get with `keepdims=True`, which is genuinely useful and is a different request: it holds the collapsed dimension open at length 1 so the result can broadcast back against the array it came from, which is exactly what normalising every row to sum to one requires. The same rule governs `min`, `max`, `mean` and `np.linalg.norm`, which is why `np.linalg.norm(matrix, axis=1)` on a 6 by 4 catalogue gives six lengths rather than four.'

  - question: 'You have a million integers in a Python list and the same million in an int64 array. `sys.getsizeof(list)` is 8,000,056 and `array.nbytes` is 8,000,000. What should you conclude?'
    options:
      - 'That the memory advantage of arrays is a myth for integers, and only applies to floats'
      - 'That the two are equal because CPython caches all integers, so the list stores no duplicates'
      - 'That the array is inefficient here, since it saved only 56 bytes'
      - '`sys.getsizeof` measured the list and its pointers, not the ints'
    answer_index: 3
    explanation: '`sys.getsizeof` reports the size of the object you hand it: for a list, a 56-byte header plus one 8-byte pointer per element. It cannot include the integers, because the list does not own them — they are a million separate objects elsewhere in memory. Each is 28 bytes on CPython 3.14, since a Python int carries a reference count, a type pointer and a length before any digits. Count them and the honest total is 36,000,056 against 8,000,000, a ratio of 4.5. Option 3 contains a real fact used wrongly: CPython does cache the integers from -5 to 256, but `range(1_000_000)` builds a fresh object for every value above that, and the lab verifies there are a million distinct objects rather than assuming it. Options 0 and 2 both take a wrong measurement at face value, which is the actual lesson here — the right number matters less than knowing which question you asked.'

  - question: 'You need the three nearest articles to a query from six similarity scores. Which is the right tool?'
    options:
      - '`np.argsort(scores)[::-1][:3]`'
      - '`np.sort(scores)[::-1][:3]`, which gives the three best scores'
      - '`scores.sort()`, which returns the ranking'
      - '`np.max(scores)` three times, removing the winner each time'
    answer_index: 0
    explanation: '`argsort` returns the indices that would sort the array, and the indices are the entire answer: when the rows mean something — an article, a customer, a token, a candidate — knowing that the best score was 0.903 tells you nothing without knowing which row it came from. `scores[np.argsort(scores)]` reconstructs the sorted values, so nothing is lost by taking indices, while option 0 loses the identity permanently. Option 2 is a real trap worth knowing: the method `a.sort()` sorts IN PLACE and returns `None`, so that line assigns nothing and quietly reorders the array you were holding — a different behaviour from `np.sort(a)`, which returns a new array and leaves the original alone. Option 3 works and is the loop you are learning not to write. At scale there is a better relative still: `np.argpartition` only guarantees the k best land in the first k places, which on a hundred thousand rows is the difference between sorting them all and not.'

  - question: 'An array contains `[1.0, 2.0, nan, 4.0]`. You write `a[a == np.nan]` to find the missing value. What happens?'
    options:
      - 'It returns the nan, since the comparison matches it'
      - 'An empty array — nan compares unequal to everything'
      - 'It raises a ValueError, because nan cannot be compared'
      - 'It returns all four elements, because any comparison with nan is True'
    answer_index: 1
    explanation: 'IEEE-754 specifies that nan compares unequal to everything, itself included — `np.nan == np.nan` is False. The reason is not arbitrary: nan means *not a number*, so two of them are two unknowns, and two unknowns are not known to be the same unknown. The consequence is that this filter finds nothing and reports success, which is worse than raising, and it is why `np.isnan(a)` exists: it asks about the bit pattern instead of about equality. The same rule explains why `a.mean()` on that array returns nan rather than 2.333 — the nan propagates through every arithmetic operation it touches. That is a feature, not a bug: it tells you loudly, at the point where it matters, that a value is missing. `np.nanmean` gives 7/3, the mean of the three readings that exist, and reaching for it should be a decision rather than a reflex, because the mean of the three you have is not the mean of the four you wanted.'

  - question: 'When is a Python loop the better choice over a vectorised NumPy expression?'
    options:
      - 'Never — vectorising is always faster and always clearer'
      - 'Only when NumPy is unavailable, since the vectorised form is otherwise strictly better'
      - 'When it is small, sequential, or would allocate too much'
      - 'When the data is floating point, since integer arrays are the only ones NumPy handles well'
    answer_index: 2
    explanation: 'All three of those were measured rather than asserted. **Small arrays:** every NumPy call resolves dtypes, works out the output shape and allocates it before any arithmetic; on four elements that setup is the whole bill, and on the authoring machine the list comprehension won at 0.108 microseconds against 0.325. **Sequential dependence:** a running balance floored at zero cannot be written as one expression, because step four depends on the floor applied at step three — `np.cumsum` gives a different and wrong answer, and the lab asserts that it differs. **Memory:** the elegant one-line pairwise table `x[:, None] - x[None, :]` allocates n squared elements, which at a hundred thousand points is 80 GB; the ugly loop that handles a thousand at a time is slower and finishes. Option 0 is the sales pitch and this course does not sell things. Vectorising is a trade — speed and expressiveness for the ability to put a print, a breakpoint or an early exit inside the loop — and a tool you can only argue for is a tool you do not understand yet.'
