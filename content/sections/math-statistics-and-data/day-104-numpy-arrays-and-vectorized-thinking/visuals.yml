visuals:
  - id: ndarray-memory-architecture
    file: assets/ndarray-memory-architecture.svg
    type: diagram
    title: 'A Python list of numbers beside a NumPy ndarray: scattered boxed objects against one contiguous typed block, with the measured memory totals'
    alt: 'Diagram: a Python list holding one 8-byte pointer per element, each aimed at a separate 28-byte integer object scattered across memory, beside a NumPy ndarray holding a small header with dtype, shape and strides followed by one contiguous block of 8-byte values, with the measured totals of 36,000,056 bytes against 8,000,000 bytes for one million integers'
    description: 'A static architecture diagram carrying the day''s first measured fact in one picture. The left half, headed "A Python list", shows the list object as a white panel containing a row of eight amber cells each labelled 8 B, captioned as a 56-byte header followed by the pointers. Eight red arrows fan out from those cells at different angles to eight red-bordered boxes scattered at different heights below, each labelled as an integer object holding one of the invented values 12, 7, 91, 4, 33, 60, 18 and 25, under the caption that they sit wherever the allocator put them. Beneath the scatter, three lines record that each one is a full object of 28 bytes of reference count, type pointer and length before any digits, that any element may be any type, and that every read must therefore check. A closing panel gives the arithmetic for one million integers: 8,000,056 bytes of pointers plus 28,000,000 bytes of objects equals 36,000,056 bytes. The right half, headed "A NumPy ndarray", shows a single blue header panel listing the three attributes decided once for the whole array — dtype int64 meaning every element is 8 bytes with no exceptions, shape (8,) meaning how the block is to be read, and strides (8,) meaning the bytes to skip per step along each axis — followed by eight blue cells packed edge to edge holding the same eight values. A small brace under the first cell marks 8 B and a wide brace under the whole row is captioned: one allocation, no pointers, no gaps, no per-element type check. Two lines record that the address of element i is base plus i times stride, and that the processor can fetch the next eight while it works on this one. A closing panel gives the total for one million integers: a 112-byte header plus 8,000,000 of data. Across the foot, a wide section headed "The trap: the obvious measurement says they are the same size" shows sys.getsizeof on a list of a million integers as 8,000,056 bytes against the array''s nbytes of 8,000,000, a ratio of 1.0000, and explains that getsizeof measures the list object and its pointers but not the integers it points at, because the list does not own them — count those and the honest ratio is 4.50. A final line notes that the right number matters less than knowing which question was asked, that all eight sample values are invented, and that the byte totals are not.'
  - id: vectorized-vs-loop-flow
    file: assets/vectorized-vs-loop-flow.svg
    type: flow-animated
    title: 'The same computation two ways: a Python loop stepping element by element against one vectorised expression applied to the whole block'
    alt: 'Diagram: the same computation done two ways, with a Python loop stepping element by element through seven pieces of bookkeeping per element while the vectorised expression applies the operation to the whole million-element block at once, showing the measured medians of 29.92 milliseconds and 0.243 milliseconds and a note that the vectorised loop still happens, just in C'
    description: 'An animated flow diagram in two stacked tracks, fully readable as a still image. A heading states the computation once: out[i] equals 2.5 times x[i] plus 1.25, over one million float64 elements, with the note that both routes give bit-for-bit identical results. The upper track is headed "Your loop, in Python" and shows the loop written out, then a row of eight amber cells labelled x0 to x6 and an ellipsis. The cells brighten one after another in sequence so the eye follows the interpreter visiting one element at a time, and each rests fully legible. A slow dashed arrow leads off the end of the row to the note "999,993 more, one at a time", and a small amber marker crawls along beneath the row, resting at the start. An amber panel headed "what happens at EVERY element" lists the seven steps in order: fetch a pointer, follow it, check the object''s type, unbox the double, multiply, add, box the answer into a new float object, store a pointer to it — closing with the summary that this is seven steps of bookkeeping around one of arithmetic. Beside it a white panel gives the measurement, median of five runs, as 29.92 milliseconds, and records that timings are one machine on one day — CPython 3.14.0, numpy 2.5.2, macOS on arm64 — and that the lab''s tests assert only that the gap exceeds twentyfold, never a millisecond. A rule separates the tracks. The lower track is headed "The same thing, expressed on the whole array" and shows the single expression, then one wide blue block labelled as one contiguous block of a million float64 totalling 8,000,000 bytes; the whole block brightens at once rather than cell by cell. A marching-dash arrow runs the full width beneath it, and three lines state that the loop did not disappear but moved into compiled C inside NumPy, where there is no type check, no boxing, and the processor can work on several elements per instruction. Beside it a white panel gives the measurement as 0.243 milliseconds and 123.2 times faster, and records that the two results were identical over one million elements, compared with a double equals rather than with a tolerance, because it is the same computation and not merely a similar one. Two closing lines state what was given up: no print, no breakpoint and no early exit inside the loop; on four elements the comprehension wins; on a sequential dependence there is no one-line version at all; vectorised is a trade, not an upgrade. A prefers-reduced-motion block stops every animation and restores the resting state, in which all eight loop cells are shaded, the whole vectorised block is shaded, both connecting arrows are solid, the crawling marker sits at the start of its path, and every figure and caption is present.'
