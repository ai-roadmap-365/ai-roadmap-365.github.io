terms:
  - term: 'ndarray'
    definition: 'NumPy''s array type: a fixed-size, homogeneous, N-dimensional block of values described by a small header. NumPy''s own beginner''s guide states all three constraints — it "represents an N-dimensional array", "all elements of the array must be of the same type of data", and "once created, the total size of the array can''t change". Those constraints are not tolerated limitations; they are the entire source of the speed and memory advantage, because they are what allow the values to be packed in one block and read without a per-element type check.'
  - term: 'dtype'
    definition: 'The data type shared by every element of an array, recorded once in the header rather than per element. It fixes the width of every element, which is what makes the block contiguous and the address of element i computable as base plus i times stride. It is also a promise about range and precision that can be broken by accident: an int8 holds -128 to 127 and wraps silently past either end, and a float32 has 24 bits of significand and cannot distinguish 16,777,216 from 16,777,217. Check a.dtype first whenever a number looks impossible.'
  - term: 'shape'
    definition: 'A tuple of non-negative integers giving the number of elements along each axis — NumPy''s guide defines it as exactly that. A (3, 4) array holds twelve values arranged as three rows of four, in one block. The shape is a description of how to read the block, not a description of how it is stored, which is why reshaping and transposing can cost nothing.'
  - term: 'stride'
    definition: 'How many BYTES to skip to move one step along an axis. A (3, 4) array of int64 has strides (32, 8): one column across is one 8-byte element, one row down is four of them. Strides are what turn indexing into arithmetic rather than a search, and swapping two of them is all a transpose has to do — which is why a transpose copies nothing.'
  - term: 'contiguous'
    definition: 'Laid out in one unbroken run of memory, so that consecutive elements sit at consecutive addresses. C-contiguous means the last axis varies fastest — rows laid end to end; F-contiguous means the first does. A transpose of a C-contiguous array is F-contiguous over the same bytes. Contiguity is what lets the processor fetch the next values while it is still working on the current one, and it is inseparable from the fixed dtype: without a fixed width there is no way to pack without gaps.'
  - term: 'Universal function'
    definition: 'A NumPy function that applies elementwise to an array of any shape and returns an array of the same shape — np.sqrt, np.exp, np.abs, np.sign, np.maximum and the arithmetic operators are all ufuncs. Usually shortened to ufunc. The equivalent list comprehension gives the same answer and takes roughly a hundred times as long, because the ufunc''s loop is compiled rather than interpreted. math.sqrt is not a ufunc and raises TypeError when handed an array.'
  - term: 'Vectorisation'
    definition: 'Expressing an operation on a whole array at once rather than element by element in Python. The loop does not disappear — NumPy''s broadcasting documentation puts it exactly: "Broadcasting provides a means of vectorizing array operations so that looping occurs in C instead of Python." What you gain is speed and expressiveness; what you give up is the ability to put a print, a breakpoint or an early exit inside the loop, and the option of a step that depends on the one before it.'
  - term: 'Boolean mask'
    definition: 'An array of True and False values, one per element, produced by a comparison such as a > 50. Because a comparison on an array is an array, a mask can be summed to count, averaged to get a fraction, negated with the tilde, combined with the ampersand and pipe operators, and used to index or to assign. It must be & and | rather than the keywords and and or, because a keyword is control flow rather than an operator and NumPy has no way to redefine it.'
  - term: 'Fancy indexing'
    definition: 'Indexing with an array of positions rather than with a slice or a mask, as in readings[[0, 5, 19, 5]]. Three properties distinguish it: the result takes the shape of the index array rather than the source, the order is whatever you asked for, and the same element may be requested more than once. It always returns a copy, because arbitrary positions cannot be described by a stride. It is how a batch of rows is pulled out of a dataset, and how an argsort result is turned into an answer.'
  - term: 'View'
    definition: 'An array that shares its data with another array, differing only in the header. Slicing, transposing, reshaping and ravel all return views when they can. NumPy''s guide is explicit that this differs from a list: "slice indexing of a list copies the elements into a new list, but slicing an array returns a view ... The original array can be mutated using the view." Writing through a view writes through to the original, which is the hardest NumPy bug to find because the damage appears nowhere near its cause. np.shares_memory answers the question directly.'
  - term: 'Copy'
    definition: 'An array with its own data, so that changing one leaves the other alone. Boolean masking, fancy indexing, .copy(), .flatten() and any arithmetic produce copies. The useful pattern: if the elements requested are evenly spaced, a stride can describe them and NumPy returns a view; if they are not, it has no choice but to copy. Which means the cheap operations are the dangerous ones and the expensive ones are safe — the opposite of most people''s intuition. Note that ravel returns a view where flatten always copies.'
  - term: 'axis'
    definition: 'A dimension of an array, and the argument that tells an aggregation which one to collapse. The rule worth memorising is that the axis you name is the one that DISAPPEARS: a (3, 4) array summed with axis=0 leaves shape (4,), one number per column, and with axis=1 leaves (3,), one per row. Reading it as "the axis I want to keep" is wrong by exactly one every time. keepdims=True holds the collapsed dimension open at length 1 so the result can broadcast back against the array it came from.'
  - term: 'Broadcasting'
    definition: 'How NumPy reconciles arrays of different shapes in an operation. Its documentation defines it as: "the smaller array is broadcast across the larger array so that they have compatible shapes", with shapes compared from the trailing dimension leftwards and two dimensions compatible when they are equal or one of them is 1. No copy is made — a scalar added to a million elements is not turned into a million scalars. Failure raises ValueError: operands could not be broadcast together. np.newaxis is how you insert a length-1 dimension deliberately, turning a row into a column so that every pairing can be computed at once.'
  - term: 'argsort'
    definition: 'A function returning the INDICES that would sort an array, rather than the sorted values. a[np.argsort(a)] reconstructs np.sort(a), so nothing is lost by taking the indices, while taking the values loses which row each score came from. That is why a search uses argsort: when the rows mean something — an article, a token, a candidate — the ranking is the answer and the scores are only how you got there. np.argpartition is the cheaper relative that only guarantees the k best land in the first k places, which is what model code uses at scale.'
  - term: 'nan'
    definition: 'Not a Number: the IEEE-754 value produced by 0/0, by the square root of a negative, by infinity minus infinity, and used to mark a reading that was never taken. Its defining oddity is that it compares unequal to everything including itself, so a == np.nan is always False and a filter written that way finds nothing while reporting success; np.isnan asks about the bit pattern instead. It propagates through every plain aggregation on purpose — one nan makes a whole mean nan — which is a loud report of a missing value rather than a bug. np.nanmean, np.nansum and np.nanmax skip them, and choosing one should be a decision rather than a reflex.'
  - term: 'Integer overflow'
    definition: 'What happens when a fixed-width integer type is asked to hold a value outside its range. In an int8 array, 127 plus 1 is -128: no exception, no promotion, and on numpy 2.5.2 no warning either — the top bit of 0111 1111 plus one carries into the sign bit. A Python int has no such limit because it grows, so this is a hazard you acquire the moment you put data into an array. It is a long-established source of exploitable bugs, because a value that should have been too large becomes negative and passes the check meant to stop it.'
  - term: 'Seeded generator'
    definition: 'An object produced by numpy.random.default_rng(seed) that yields a reproducible stream of pseudo-random values. It replaces the older numpy.random.seed, which the library''s own docstring calls "a convenience, legacy function": that one sets a single global generator shared by every library in the process, so a call you did not write can move your sequence. A generator you own and pass around cannot be moved by anyone else, which is what allows a lab to assert on specific numbers rather than on vague properties.'
