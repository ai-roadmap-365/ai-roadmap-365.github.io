<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img" aria-labelledby="d104a-title d104a-desc">
  <title id="d104a-title">A Python list of numbers beside a NumPy ndarray: scattered boxed objects against one contiguous typed block, with the measured memory totals</title>
  <desc id="d104a-desc">On the left, a Python list holds a row of eight-byte pointers, each aimed at a separate twenty-eight-byte integer object scattered across the heap. On the right, an ndarray holds a small header carrying dtype, shape and strides, followed by one contiguous block of eight-byte values with no pointers and no objects. Beneath both, the measured totals for one million integers: 36,000,056 bytes for the list against 8,000,000 for the array.</desc>

  <style>
    .d104a-bg     { fill: #f8fafc; }
    .d104a-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d104a-head   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d104a-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d104a-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d104a-mono   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d104a-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d104a-ptr    { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .d104a-obj    { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; }
    .d104a-cell   { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
    .d104a-hdr    { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d104a-wire   { fill: none; stroke: #b91c1c; stroke-width: 1.4; }
    .d104a-rule   { stroke: #cbd5e1; stroke-width: 1.5; }
    .d104a-brace  { fill: none; stroke: #1d4ed8; stroke-width: 2; }
  </style>

  <rect class="d104a-bg" x="0" y="0" width="980" height="700" />

  <defs>
    <marker id="d104a-arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
  </defs>

  <text class="d104a-title" x="32" y="40">The same eight numbers, held two ways</text>
  <text class="d104a-small" x="32" y="64">All figures measured on the authoring machine: CPython 3.14.0, numpy 2.5.2, macOS on arm64.</text>

  <line class="d104a-rule" x1="490" y1="84" x2="490" y2="536" />

  <!-- ============================ LEFT: the list ============================ -->
  <text class="d104a-head" x="32" y="108">A Python list</text>
  <text class="d104a-small" x="32" y="130">one pointer per element, aimed at a separate object</text>

  <rect class="d104a-panel" x="32" y="146" width="424" height="66" rx="6" />
  <text class="d104a-small" x="44" y="166">the list object: 56-byte header, then the pointers</text>
  <rect class="d104a-ptr" x="44" y="174" width="46" height="28" rx="4" />
  <rect class="d104a-ptr" x="96" y="174" width="46" height="28" rx="4" />
  <rect class="d104a-ptr" x="148" y="174" width="46" height="28" rx="4" />
  <rect class="d104a-ptr" x="200" y="174" width="46" height="28" rx="4" />
  <rect class="d104a-ptr" x="252" y="174" width="46" height="28" rx="4" />
  <rect class="d104a-ptr" x="304" y="174" width="46" height="28" rx="4" />
  <rect class="d104a-ptr" x="356" y="174" width="46" height="28" rx="4" />
  <rect class="d104a-ptr" x="408" y="174" width="36" height="28" rx="4" />
  <text class="d104a-small" x="67" y="193" text-anchor="middle">8 B</text>
  <text class="d104a-small" x="119" y="193" text-anchor="middle">8 B</text>
  <text class="d104a-small" x="171" y="193" text-anchor="middle">8 B</text>
  <text class="d104a-small" x="223" y="193" text-anchor="middle">8 B</text>
  <text class="d104a-small" x="275" y="193" text-anchor="middle">8 B</text>
  <text class="d104a-small" x="327" y="193" text-anchor="middle">8 B</text>
  <text class="d104a-small" x="379" y="193" text-anchor="middle">8 B</text>
  <text class="d104a-small" x="426" y="193" text-anchor="middle">8 B</text>

  <path class="d104a-wire" d="M 67 206 L 67 244" marker-end="url(#d104a-arrowRed)" />
  <path class="d104a-wire" d="M 119 206 L 172 258" marker-end="url(#d104a-arrowRed)" />
  <path class="d104a-wire" d="M 171 206 L 96 306" marker-end="url(#d104a-arrowRed)" />
  <path class="d104a-wire" d="M 223 206 L 300 244" marker-end="url(#d104a-arrowRed)" />
  <path class="d104a-wire" d="M 275 206 L 386 300" marker-end="url(#d104a-arrowRed)" />
  <path class="d104a-wire" d="M 327 206 L 236 306" marker-end="url(#d104a-arrowRed)" />
  <path class="d104a-wire" d="M 379 206 L 404 244" marker-end="url(#d104a-arrowRed)" />
  <path class="d104a-wire" d="M 426 206 L 330 352" marker-end="url(#d104a-arrowRed)" />

  <text class="d104a-small" x="32" y="240">scattered wherever the allocator put them:</text>

  <rect class="d104a-obj" x="40" y="248" width="82" height="34" rx="4" />
  <text class="d104a-mono" x="81" y="270" text-anchor="middle">int 12</text>
  <rect class="d104a-obj" x="150" y="258" width="82" height="34" rx="4" />
  <text class="d104a-mono" x="191" y="280" text-anchor="middle">int 7</text>
  <rect class="d104a-obj" x="270" y="244" width="82" height="34" rx="4" />
  <text class="d104a-mono" x="311" y="266" text-anchor="middle">int 91</text>
  <rect class="d104a-obj" x="368" y="244" width="82" height="34" rx="4" />
  <text class="d104a-mono" x="409" y="266" text-anchor="middle">int 4</text>
  <rect class="d104a-obj" x="56" y="308" width="82" height="34" rx="4" />
  <text class="d104a-mono" x="97" y="330" text-anchor="middle">int 33</text>
  <rect class="d104a-obj" x="196" y="308" width="82" height="34" rx="4" />
  <text class="d104a-mono" x="237" y="330" text-anchor="middle">int 60</text>
  <rect class="d104a-obj" x="346" y="302" width="82" height="34" rx="4" />
  <text class="d104a-mono" x="387" y="324" text-anchor="middle">int 18</text>
  <rect class="d104a-obj" x="290" y="356" width="82" height="34" rx="4" />
  <text class="d104a-mono" x="331" y="378" text-anchor="middle">int 25</text>

  <text class="d104a-small" x="32" y="414">Each one is a full object: 28 bytes of reference count,</text>
  <text class="d104a-small" x="32" y="434">type pointer and length, before any digits at all.</text>
  <text class="d104a-small" x="32" y="454">Any element may be any type. Every read must check.</text>

  <rect class="d104a-panel" x="32" y="470" width="424" height="60" rx="6" />
  <text class="d104a-label" x="44" y="492">For one million integers:</text>
  <text class="d104a-mono" x="44" y="516">8,000,056 pointers + 28,000,000 objects = 36,000,056 B</text>

  <!-- ============================ RIGHT: the array ============================ -->
  <text class="d104a-head" x="522" y="108">A NumPy ndarray</text>
  <text class="d104a-small" x="522" y="130">a small header, then one contiguous typed block</text>

  <rect class="d104a-hdr" x="522" y="146" width="424" height="94" rx="6" />
  <text class="d104a-label" x="534" y="170">the header, decided once for the whole array</text>
  <text class="d104a-mono" x="534" y="194">dtype   int64        every element is 8 bytes, no exceptions</text>
  <text class="d104a-mono" x="534" y="214">shape   (8,)         how the block is to be read</text>
  <text class="d104a-mono" x="534" y="234">strides (8,)         bytes to skip per step along each axis</text>

  <text class="d104a-small" x="522" y="272">and then the numbers themselves, end to end:</text>

  <rect class="d104a-cell" x="522" y="284" width="52" height="40" rx="3" />
  <rect class="d104a-cell" x="574" y="284" width="52" height="40" rx="3" />
  <rect class="d104a-cell" x="626" y="284" width="52" height="40" rx="3" />
  <rect class="d104a-cell" x="678" y="284" width="52" height="40" rx="3" />
  <rect class="d104a-cell" x="730" y="284" width="52" height="40" rx="3" />
  <rect class="d104a-cell" x="782" y="284" width="52" height="40" rx="3" />
  <rect class="d104a-cell" x="834" y="284" width="52" height="40" rx="3" />
  <rect class="d104a-cell" x="886" y="284" width="52" height="40" rx="3" />
  <text class="d104a-mono" x="548" y="309" text-anchor="middle">12</text>
  <text class="d104a-mono" x="600" y="309" text-anchor="middle">7</text>
  <text class="d104a-mono" x="652" y="309" text-anchor="middle">91</text>
  <text class="d104a-mono" x="704" y="309" text-anchor="middle">4</text>
  <text class="d104a-mono" x="756" y="309" text-anchor="middle">33</text>
  <text class="d104a-mono" x="808" y="309" text-anchor="middle">60</text>
  <text class="d104a-mono" x="860" y="309" text-anchor="middle">18</text>
  <text class="d104a-mono" x="912" y="309" text-anchor="middle">25</text>

  <path class="d104a-brace" d="M 522 334 L 522 344 L 574 344 L 574 334" />
  <text class="d104a-small" x="548" y="362" text-anchor="middle">8 B</text>
  <path class="d104a-brace" d="M 522 372 L 522 384 L 938 384 L 938 372" />
  <text class="d104a-small" x="730" y="404" text-anchor="middle">one allocation, no pointers, no gaps, no per-element type check</text>

  <text class="d104a-small" x="522" y="434">Address of element i = base + i x stride. The processor</text>
  <text class="d104a-small" x="522" y="454">can fetch the next eight while it works on this one.</text>

  <rect class="d104a-panel" x="522" y="470" width="424" height="60" rx="6" />
  <text class="d104a-label" x="534" y="492">For one million integers:</text>
  <text class="d104a-mono" x="534" y="516">112-byte header + 8,000,000 of data = 8,000,000 B counted</text>

  <!-- ============================ FOOT ============================ -->
  <line class="d104a-rule" x1="32" y1="556" x2="948" y2="556" />

  <text class="d104a-head" x="32" y="584">The trap: the obvious measurement says they are the same size</text>
  <text class="d104a-mono" x="32" y="610">sys.getsizeof(list(range(1_000_000)))  =  8,000,056 B</text>
  <text class="d104a-mono" x="32" y="632">np.arange(1_000_000).nbytes            =  8,000,000 B      ratio 1.0000</text>
  <text class="d104a-small" x="32" y="656">getsizeof measures the list OBJECT — its header and its pointers — and not the integers it points at, because the</text>
  <text class="d104a-small" x="32" y="676">list does not own them. Count those and the honest ratio is 4.50. The right number matters less than knowing which</text>
  <text class="d104a-small" x="32" y="696">question you asked. All eight sample values are invented; the byte totals are not.</text>
</svg>
