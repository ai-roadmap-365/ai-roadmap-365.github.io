<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" aria-labelledby="d104f-title d104f-desc">
  <title id="d104f-title">The same computation two ways: a Python loop stepping element by element against one vectorised expression applied to the whole block</title>
  <desc id="d104f-desc">The upper track shows a Python loop visiting one element at a time, doing seven steps of bookkeeping around one multiply and add, with a marker crawling across a million elements. The lower track shows the same computation expressed once on the whole array, with the block lighting up together and the loop moved into compiled C. Both produce identical results over one million elements; the measured medians were 29.92 milliseconds and 0.243 milliseconds.</desc>

  <style>
    .d104f-bg     { fill: #f8fafc; }
    .d104f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d104f-head   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d104f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d104f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d104f-mono   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d104f-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d104f-slow   { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .d104f-cell   { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
    .d104f-rule   { stroke: #cbd5e1; stroke-width: 1.5; }

    /* Motion 3 — the loop visits one cell at a time, in order. */
    .d104f-step   { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5;
                    animation: d104f-visit 6s ease-in-out infinite; }
    .d104f-p1 { animation-delay: 0s; }
    .d104f-p2 { animation-delay: 0.5s; }
    .d104f-p3 { animation-delay: 1.0s; }
    .d104f-p4 { animation-delay: 1.5s; }
    .d104f-p5 { animation-delay: 2.0s; }
    .d104f-p6 { animation-delay: 2.5s; }
    .d104f-p7 { animation-delay: 3.0s; }
    .d104f-p8 { animation-delay: 3.5s; }
    @keyframes d104f-visit {
      0%, 12%, 100% { fill: #fef3c7; }
      3%, 9%        { fill: #fbbf24; }
    }

    /* Motion 1 — a marker crawls along the loop's row, resting at the start. */
    .d104f-crawl  { fill: #b45309; animation: d104f-creep 6s linear infinite; }
    @keyframes d104f-creep {
      0%   { transform: translateX(0); }
      70%  { transform: translateX(364px); }
      100% { transform: translateX(364px); }
    }

    /* Motion 3 again — the whole vectorised block lights at once, briefly. */
    .d104f-block  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5;
                    animation: d104f-sweep 6s ease-in-out infinite; }
    @keyframes d104f-sweep {
      0%, 6%, 24%, 100% { fill: #dbeafe; }
      10%, 20%          { fill: #93c5fd; }
    }

    /* Motion 2 — the C loop inside NumPy is still a loop, and it flows. */
    .d104f-wire   { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                    stroke-dasharray: 10 8; animation: d104f-march 1.6s linear infinite; }
    @keyframes d104f-march { to { stroke-dashoffset: -18; } }

    .d104f-slowwire { fill: none; stroke: #b45309; stroke-width: 2.5;
                      stroke-dasharray: 4 10; animation: d104f-trudge 4s linear infinite; }
    @keyframes d104f-trudge { to { stroke-dashoffset: -14; } }

    @media (prefers-reduced-motion: reduce) {
      .d104f-step     { animation: none; fill: #fef3c7; }
      .d104f-crawl    { animation: none; transform: none; }
      .d104f-block    { animation: none; fill: #dbeafe; }
      .d104f-wire     { animation: none; stroke-dasharray: none; }
      .d104f-slowwire { animation: none; stroke-dasharray: none; }
    }
  </style>

  <rect class="d104f-bg" x="0" y="0" width="980" height="640" />

  <defs>
    <marker id="d104f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d104f-arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
  </defs>

  <text class="d104f-title" x="32" y="40">One computation, two ways of asking for it</text>
  <text class="d104f-small" x="32" y="64">out[i] = 2.5 * x[i] + 1.25, over 1,000,000 float64 elements. Both routes give bit-for-bit identical results.</text>

  <!-- ============================ TOP: the loop ============================ -->
  <text class="d104f-head" x="32" y="102">Your loop, in Python</text>
  <text class="d104f-mono" x="32" y="126">for i, x in enumerate(values): out[i] = 2.5 * x + 1.25</text>

  <rect class="d104f-step d104f-p1" x="32" y="146" width="44" height="40" rx="3" />
  <rect class="d104f-step d104f-p2" x="80" y="146" width="44" height="40" rx="3" />
  <rect class="d104f-step d104f-p3" x="128" y="146" width="44" height="40" rx="3" />
  <rect class="d104f-step d104f-p4" x="176" y="146" width="44" height="40" rx="3" />
  <rect class="d104f-step d104f-p5" x="224" y="146" width="44" height="40" rx="3" />
  <rect class="d104f-step d104f-p6" x="272" y="146" width="44" height="40" rx="3" />
  <rect class="d104f-step d104f-p7" x="320" y="146" width="44" height="40" rx="3" />
  <rect class="d104f-step d104f-p8" x="368" y="146" width="44" height="40" rx="3" />
  <text class="d104f-mono" x="54" y="171" text-anchor="middle">x0</text>
  <text class="d104f-mono" x="102" y="171" text-anchor="middle">x1</text>
  <text class="d104f-mono" x="150" y="171" text-anchor="middle">x2</text>
  <text class="d104f-mono" x="198" y="171" text-anchor="middle">x3</text>
  <text class="d104f-mono" x="246" y="171" text-anchor="middle">x4</text>
  <text class="d104f-mono" x="294" y="171" text-anchor="middle">x5</text>
  <text class="d104f-mono" x="342" y="171" text-anchor="middle">x6</text>
  <text class="d104f-mono" x="390" y="171" text-anchor="middle">...</text>

  <path class="d104f-slowwire" d="M 424 166 L 500 166" marker-end="url(#d104f-arrowAmber)" />
  <text class="d104f-small" x="512" y="171">999,993 more, one at a time</text>

  <circle class="d104f-crawl" cx="54" cy="204" r="8" />
  <text class="d104f-small" x="32" y="232">the interpreter, visiting element by element</text>

  <rect class="d104f-slow" x="32" y="246" width="440" height="112" rx="6" />
  <text class="d104f-label" x="44" y="268">what happens at EVERY element:</text>
  <text class="d104f-small" x="44" y="290">fetch a pointer, follow it, check the object's type,</text>
  <text class="d104f-small" x="44" y="310">unbox the double, multiply, add, box the answer into a</text>
  <text class="d104f-small" x="44" y="330">NEW float object, store a pointer to it</text>
  <text class="d104f-small" x="44" y="350">seven steps of bookkeeping around one of arithmetic</text>

  <rect class="d104f-panel" x="492" y="246" width="456" height="112" rx="6" />
  <text class="d104f-label" x="504" y="268">measured here, median of five runs:</text>
  <text class="d104f-mono" x="504" y="294">29.92 ms</text>
  <text class="d104f-small" x="504" y="318">Timings are one machine on one day: CPython 3.14.0,</text>
  <text class="d104f-small" x="504" y="338">numpy 2.5.2, macOS on arm64. The lab's tests assert</text>
  <text class="d104f-small" x="504" y="358">only that the gap exceeds 20x, never a millisecond.</text>

  <line class="d104f-rule" x1="32" y1="382" x2="948" y2="382" />

  <!-- ============================ BOTTOM: vectorised ============================ -->
  <text class="d104f-head" x="32" y="412">The same thing, expressed on the whole array</text>
  <text class="d104f-mono" x="32" y="436">out = 2.5 * values + 1.25</text>

  <rect class="d104f-block" x="32" y="456" width="440" height="40" rx="3" />
  <text class="d104f-mono" x="252" y="481" text-anchor="middle">one contiguous block of 1,000,000 float64 — 8,000,000 bytes</text>

  <path class="d104f-wire" d="M 32 514 L 472 514" marker-end="url(#d104f-arrow)" />
  <text class="d104f-small" x="32" y="538">the loop did NOT disappear — it moved into compiled C inside NumPy,</text>
  <text class="d104f-small" x="32" y="558">where there is no type check, no boxing, and the processor can work</text>
  <text class="d104f-small" x="32" y="578">on several elements per instruction</text>

  <rect class="d104f-panel" x="492" y="456" width="456" height="122" rx="6" />
  <text class="d104f-label" x="504" y="478">measured here, median of five runs:</text>
  <text class="d104f-mono" x="504" y="504">0.243 ms          123.2x faster</text>
  <text class="d104f-small" x="504" y="528">identical over 1,000,000 elements: True — compared</text>
  <text class="d104f-small" x="504" y="548">with ==, not with a tolerance, because it is the SAME</text>
  <text class="d104f-small" x="504" y="568">computation and not merely a similar one</text>

  <text class="d104f-small" x="32" y="614">What you gave up: you can no longer put a print, a breakpoint or an early exit inside the loop. On four elements the</text>
  <text class="d104f-small" x="32" y="634">comprehension wins; on a sequential dependence there is no one-line version at all. Vectorised is a trade, not an upgrade.</text>
</svg>
