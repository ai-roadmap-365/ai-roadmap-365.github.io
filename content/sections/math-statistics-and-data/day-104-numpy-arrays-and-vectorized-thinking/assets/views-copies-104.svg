<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="When each is returned.">
  <title>Views against copies</title>
  <style>
    .views-copies-104-bg   { fill: #f8fafc; }
    .views-copies-104-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-copies-104-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-copies-104-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-copies-104-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-copies-104-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-copies-104-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .views-copies-104-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .views-copies-104-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .views-copies-104-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .views-copies-104-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .views-copies-104-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .views-copies-104-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .views-copies-104-row { opacity: 1; }
    .views-copies-104-r0 { animation-delay: 0.00s; }
    .views-copies-104-r1 { animation-delay: 0.45s; }
    .views-copies-104-r2 { animation-delay: 0.90s; }
    .views-copies-104-r3 { animation-delay: 1.35s; }
    .views-copies-104-r4 { animation-delay: 1.80s; }
    .views-copies-104-row { animation: views-copies-104-reveal 7.3s ease-in-out infinite; }
    @keyframes views-copies-104-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="views-copies-104-bg" width="980" height="390"/>
  <text class="views-copies-104-h1"  x="30" y="40">Views against copies</text>
  <text class="views-copies-104-sub" x="30" y="64">When each is returned.</text>
  <rect class="views-copies-104-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="views-copies-104-name" x="46" y="122">Returns a view</text>
  <text class="views-copies-104-desc" x="46" y="142">Shares memory.</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r0" x="46" y="182">Basic slicing</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r1" x="46" y="216">Reshaping, usually</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r2" x="46" y="250">Transposing</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r3" x="46" y="284">Cheap: no data moved</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r4" x="46" y="318">Modifying it modifies the original</text>
  <rect class="views-copies-104-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="views-copies-104-name" x="526" y="122">Returns a copy</text>
  <text class="views-copies-104-desc" x="526" y="142">Independent memory.</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r0" x="526" y="182">Boolean mask indexing</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r1" x="526" y="216">Fancy indexing with a list</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r2" x="526" y="250">Explicit copying</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r3" x="526" y="284">Costs memory and time</text>
  <text class="views-copies-104-desc views-copies-104-row views-copies-104-r4" x="526" y="318">Safe to modify</text>
  <text class="views-copies-104-sub" x="30" y="372">The difference is invisible until something is modified, which is why the distinction is worth learning before rather than after a confusing bug.</text>
</svg>
