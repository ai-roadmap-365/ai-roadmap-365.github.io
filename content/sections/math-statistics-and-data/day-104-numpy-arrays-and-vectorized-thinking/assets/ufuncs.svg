<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Universal functions</title>
  <style>
    .ufuncs-bg   { fill: #f8fafc; }
    .ufuncs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ufuncs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ufuncs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ufuncs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ufuncs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ufuncs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ufuncs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ufuncs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ufuncs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ufuncs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ufuncs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ufuncs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ufuncs-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ufuncs-stage { opacity: 1; }

    .ufuncs-s0 { animation-delay: 0.00s; }
    .ufuncs-e0 { animation-delay: 0.00s; }
    .ufuncs-s1 { animation-delay: 1.28s; }
    .ufuncs-e1 { animation-delay: 1.28s; }
    .ufuncs-s2 { animation-delay: 2.56s; }
    .ufuncs-e2 { animation-delay: 2.56s; }
    .ufuncs-s3 { animation-delay: 3.84s; }
    .ufuncs-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ufuncs-conn  { animation: ufuncs-trace 6.4s ease-in-out infinite; }
      .ufuncs-stage { animation: ufuncs-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ufuncs-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ufuncs-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ufuncs-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ufuncs-stage { animation: ufuncs-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ufuncs-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ufuncs-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ufuncs-bg" width="980" height="322"/>
  <text class="ufuncs-h1"  x="30" y="40">Universal functions</text>
  <text class="ufuncs-sub" x="30" y="64">Four properties.</text>
  <g class="ufuncs-stage ufuncs-s0">
    <rect class="ufuncs-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ufuncs-step" x="44" y="142">01</text>
    <text class="ufuncs-name" x="70" y="142">Applied to every element, with no loop written</text>
    <text class="ufuncs-desc" x="44" y="166">One call, whatever the size.</text>
  </g>
  <line class="ufuncs-line ufuncs-conn ufuncs-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ufuncs-tip)"/>
  <g class="ufuncs-stage ufuncs-s1">
    <rect class="ufuncs-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ufuncs-step" x="280" y="142">02</text>
    <text class="ufuncs-name" x="306" y="142">Following the broadcasting rules for mismatched shapes</text>
    <text class="ufuncs-desc" x="280" y="166">Which is where surprises live.</text>
  </g>
  <line class="ufuncs-line ufuncs-conn ufuncs-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ufuncs-tip)"/>
  <g class="ufuncs-stage ufuncs-s2">
    <rect class="ufuncs-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ufuncs-step" x="516" y="142">03</text>
    <text class="ufuncs-name" x="542" y="142">Allocating a new array unless told otherwise</text>
    <text class="ufuncs-desc" x="516" y="166">Which costs memory on large</text>
    <text class="ufuncs-desc" x="516" y="182">arrays.</text>
  </g>
  <line class="ufuncs-line ufuncs-conn ufuncs-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ufuncs-tip)"/>
  <g class="ufuncs-stage ufuncs-s3">
    <rect class="ufuncs-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ufuncs-step" x="752" y="142">04</text>
    <text class="ufuncs-name" x="778" y="142">And composing into a single expression</text>
    <text class="ufuncs-desc" x="752" y="166">Which reads as the mathematics</text>
    <text class="ufuncs-desc" x="752" y="182">does.</text>
  </g>
  <text class="ufuncs-sub" x="30" y="304">Writing the expression as it appears in the mathematics is the real benefit: the code becomes checkable against the formula it implements.</text>
</svg>
