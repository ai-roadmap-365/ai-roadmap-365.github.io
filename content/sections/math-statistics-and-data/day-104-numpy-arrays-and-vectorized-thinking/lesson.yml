title: 'NumPy: Arrays and Vectorized Thinking'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 15
learning_promise: 'After this lesson you will stop reaching for a loop, and you will know exactly what that change costs you. You will be able to say what an ndarray actually is — a fixed dtype, one contiguous block, and a shape with strides, which are three faces of one decision — and you will have measured the consequence rather than been told it: a million Python integers cost 36,000,056 bytes and the same million in an int64 array cost 8,000,000, and the obvious measurement with sys.getsizeof says they are the same size, which is the most useful wrong answer in the day. You will write three operations twice, once as a loop and once as an expression, prove they agree bit for bit over a million elements with == rather than a tolerance, and then measure the gap at over a hundredfold on one machine on one day. You will meet the dtype as a promise you can break by accident, with an int8 wrapping silently from 127 to -128 and a float32 unable to tell sixteen million from sixteen million and one. You will learn boolean masking properly — combining masks with & and |, why the keyword and cannot work and what ValueError it raises, np.where, mask assignment and fancy indexing — and the axis rule that the axis you name is the one that disappears. You will tell a view from a copy and understand why the cheap operations are the dangerous ones. You will rank with argsort rather than sort, because when the rows mean something the indices are the entire answer, and you will use it to turn Day 103''s similarity scores into a top-three search in one line. You will handle nan, which is not equal to itself. And you will finish holding the honest half that most introductions leave out: three measured situations where the loop is the better code, including one where the elegant one-line version needs 80 GB and the ugly loop finishes.'
objectives:
  - 'Say what an ndarray is in three facts — a fixed dtype, a contiguous block, and a shape with strides — and explain why they are one decision rather than three'
  - 'Measure the memory difference between a list and an array honestly, and explain why sys.getsizeof on a list is not the measurement you want'
  - 'Choose a dtype deliberately, predict what an int8 does at 127, and recognise the float32 blind spot at two to the twenty-fourth'
  - 'Write a computation as an explicit loop and as a vectorised expression, and prove the two agree bit for bit rather than approximately'
  - 'Measure both, report the gap with its spread and its machine, and say why the millisecond figure is not worth asserting in a test'
  - 'Create arrays with array, zeros, ones, arange, linspace, full, eye and a seeded default_rng, and say which of arange and linspace each situation calls for'
  - 'Apply universal functions to whole arrays, and distinguish the elementwise np.maximum from the reducing np.max and elementwise star from the matrix product at sign'
  - 'Build boolean masks, combine them with ampersand and pipe, and explain why the keyword and raises ValueError where the operator does not'
  - 'Use np.where, assignment through a mask, and fancy indexing in place of an if inside a loop'
  - 'State and apply the axis rule — the axis you name is the one that disappears — and use keepdims and np.newaxis to make shapes line up'
  - 'Tell a view from a copy, predict which operations give which, and explain why evenly spaced selections are views and mask selections cannot be'
  - 'Rank with argsort rather than sort, and say why the indices rather than the values are what a search needs'
  - 'Handle missing values: why nan is not equal to itself, why np.isnan is the only comparison that finds one, and when a nan-aware aggregation is a decision rather than a default'
  - 'Name three measured situations in which vectorising is the wrong choice, and give the reason for each'
prerequisites:
  - 'Day 99 — vectors, and the six-article catalogue this lesson ranks'
  - 'Day 100 — matrices, and the three ways to read one; today those same objects get their storage explained'
  - 'Day 101 — matrix multiplication, which is why star and at sign are different operators here'
  - 'Day 102 — linear transformations; np.maximum(x, 0) is that day''s ReLU written as one call'
  - 'Day 103 — dot products and cosine similarity. Today''s search is that search, done to every row at once'
  - 'Day 70 — floating point, which is why one section of this lesson is about precision rather than speed'
  - 'Day 43 — python3 -m venv and installing a package with pip; the lab installs numpy and pytest into a lab-local environment'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'No mathematics beyond school arithmetic'
