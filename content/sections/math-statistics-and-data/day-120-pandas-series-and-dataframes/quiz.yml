questions:
  - question: >-
      Two Series are added: x has index a, b, c with values 1, 2, 3; y has index b, c, d with values
      10, 20, 30. What does x + y put at label 'a'?
    options:
      - '1, unchanged, because a only appears in x'
      - '11, because pandas fills the missing side with the first value of y'
      - 'An error is raised because the indexes do not match'
      - 'NaN, because pandas aligns by label and a has no partner in y'
    answer_index: 3
    explanation: >-
      Addition between two Series aligns on the UNION of both indexes first, then adds. Label a exists
      only in x, so there is nothing on the y side to add to, and pandas writes NaN rather than guessing
      a value or silently reusing x's own number. This is the opening failure of the whole lesson: the
      operation succeeds and returns a plausible-looking Series, with no exception anywhere.
  - question: >-
      On pandas 3.0.5, what does pd.Series(['a', 'b']).dtype return?
    options:
      - 'str, the new pandas 3.0 default for a column of Python strings'
      - 'object, the same as every earlier pandas version'
      - 'string, a legacy alias kept for backward compatibility'
      - 'category, because pandas infers repeated short strings as categorical'
    answer_index: 0
    explanation: >-
      pandas 3.0, built on PyArrow, made str the default dtype for a column of Python strings, replacing
      object in that role. object still exists and is still what a genuinely mixed-type column falls
      back to, and remains available on request with dtype="object", but it is no longer the default for
      a column that is actually just text -- which almost every tutorial written before 3.0 still assumes.
  - question: >-
      On pandas 3.0.5, what happens when you run df[df['a'] > 1]['b'] = 0 on a DataFrame df?
    options:
      - 'df is updated correctly, and a SettingWithCopyWarning is raised'
      - 'A hard exception is raised immediately and the line never completes'
      - 'df is left completely unchanged, and a ChainedAssignmentError warning explains why'
      - 'df is updated only for the first matching row, silently'
    answer_index: 2
    explanation: >-
      df[df['a'] > 1] is evaluated first and produces a temporary DataFrame; ['b'] = 0 assigns into that
      temporary, which is then discarded. The original df is never touched. pandas 3.0.5 raises a
      ChainedAssignmentError -- a Warning subclass, not a raised exception, so the statement still
      "completes" -- naming the exact fix: a single .loc[row_indexer, col_indexer] = value statement.
  - question: >-
      On a DataFrame indexed a, b, c, d, e, which pair of slices returns the identical three rows
      (b, c, d)?
    options:
      - "df.loc['b':'d'] and df.iloc[1:3]"
      - "df.iloc[1:3] and df.iloc[1:4]"
      - "df.loc['b':'e'] and df.iloc[1:4]"
      - "df.loc['b':'d'] and df.iloc[1:4]"
    answer_index: 3
    explanation: >-
      .loc's stop is a label to INCLUDE; .iloc's stop is a position to stop BEFORE. 'd' sits at position
      3, so .loc['b':'d'] and .iloc[1:4] -- a DIFFERENT stop number -- return the same three rows.
      .iloc[1:3] stops before position 3, dropping 'd' and returning only two rows, even though 3 looks
      like the "matching" number to someone reading the .loc slice.
  - question: >-
      Why does `some_series == np.nan` never find a Series' missing values, even where they really are?
    options:
      - "It does find them; == np.nan is the recommended way to test for missing data"
      - "np.nan only matches values assigned with the literal token np.nan, not pd.NA or None"
      - "NaN is never equal to anything, including itself, so every comparison against it returns False"
      - "== raises a TypeError when comparing against NaN, which pandas silently swallows"
    answer_index: 2
    explanation: >-
      NaN follows IEEE 754: NaN != NaN by definition, and every comparison against NaN using ==, <, >,
      <=, >= returns False, never an error. That is exactly why .isna() exists as a dedicated method --
      it checks the underlying missing-value marker directly rather than relying on equality, which can
      never succeed against NaN by construction.
  - question: >-
      An int64 column is reindexed onto a label it never had before. What happens to the column's dtype,
      and why?
    options:
      - "It stays int64, with the new row left uninitialized"
      - "The whole column is promoted to float64, because int64 has no bit pattern for a missing value"
      - "Only the new row becomes a separate float64 Series; the rest stays int64"
      - "pandas raises a ValueError, refusing the reindex"
    answer_index: 1
    explanation: >-
      NumPy's int64 has no reserved bit pattern for "missing". The instant a missing value enters an
      int64 Series -- through a reindex, a failed join, or an explicit NaN assignment -- pandas rebuilds
      the ENTIRE column as float64, which does have NaN available. This can silently cost precision past
      2**53 for large integer IDs. The nullable Int64 dtype (capital I) avoids this by staying in the
      integer family and using pd.NA instead.
  - question: >-
      A vectorised column operation runs roughly 250x faster than the equivalent .apply(lambda x: ...)
      on 200,000 rows, measured on one machine on one day. How should this lesson's discipline report
      that gap?
    options:
      - "As an exact benchmark: '.apply is 187.9 milliseconds slower per call'"
      - "As a ratio and a shape: 'at least 20x faster on 200,000 rows', never a millisecond figure"
      - "It should not be reported at all, since timing is not reproducible"
      - "As a percentage improvement relative to a Python for-loop baseline"
    answer_index: 1
    explanation: >-
      A millisecond figure is a fact about one machine on one day and misleads if quoted more precisely
      than that. Reporting a ratio with a comfortable margin below the measured value -- '.apply is at
      least 20x faster on 200,000 rows,' measured here at roughly 250x -- is a claim that holds on
      hardware slower or faster than the one it was measured on, which a specific millisecond number
      cannot promise.
  - question: >-
      What design choice does polars make differently from pandas that this lesson uses as a contrast to
      sharpen what the pandas index actually costs and buys?
    options:
      - "polars has no support for missing values at all"
      - "polars stores every column as a Python object, regardless of its contents"
      - "polars cannot represent more than one dtype per DataFrame"
      - "polars has no implicit row index; operations are positional by design, with no built-in alignment"
    answer_index: 3
    explanation: >-
      polars DataFrames have no implicit row index at all -- a deliberate design decision. Every
      alignment behaviour this lesson covers (the NaN from mismatched labels, .loc vs .iloc, when
      .reset_index(drop=True) is the right move) exists because pandas gives every row a persistent,
      checked identity beyond its position. polars judged that identity a cost more often than a benefit
      for its target workloads, trading pandas' automatic safety net for a simpler, purely positional
      model and, for large data, faster execution.
