visuals:
  - id: dataframe-anatomy-architecture
    file: assets/dataframe-anatomy-architecture.svg
    type: diagram
    title: 'A DataFrame dissected: one shared index and three Series bolted onto it'
    alt: 'Diagram: a DataFrame with four rows labelled a through d, an index running down the left as one shared column, and three separately outlined Series to its right — order_id as a nullable Int64 column, price as a float64 column, and category as a str column — each drawn as its own bracketed unit sharing the same four index labels, with a caption stating that a DataFrame is a set of Series that agree on one index, not a spreadsheet of independent cells'
    description: >-
      A static architecture diagram dissecting a DataFrame into its parts. Four rows, labelled a through
      d, run down a shared index column on the left, drawn with a light grey header and grey-outlined
      cells. To its right sit three independently outlined Series, each with its own header block naming
      its dtype: order_id as nullable Int64 (with a genuine <NA> value in row c, demonstrating that a
      missing entry does not force a dtype change under Int64), price as float64 (with a genuine NaN in
      row d), and category as the pandas 3.0 default str dtype. Each column is bracketed on its left edge
      to visually separate it as its own Series unit. Dashed horizontal guide lines connect the index
      labels to every column at the same row, visually asserting that row "c" pulls order_id <NA>, price
      7.25 and category "books" together, from three separately stored columns, because all three answer
      to the same index. A caption block at the foot explains explicitly that a DataFrame is not a table
      of independent cells but three separately-typed Series sharing one index, states what each dtype
      choice buys (Int64 avoids precision loss on a missing order; float64 is required for price's NaN;
      str is the pandas-3.0 default rather than the legacy object dtype), and closes by noting that two
      Series with different indexes may share no rows at all, which is exactly what makes arithmetic
      between them produce NaN instead of an error.
  - id: index-alignment-flow
    file: assets/index-alignment-flow.svg
    type: flow-animated
    title: 'Addition aligns on LABEL, not position'
    alt: 'Diagram: Series x, indexed a, b, c with values 1, 2, 3, slides in from the left, and Series y, indexed b, c, d with values 10, 20, 30, slides in from the right, converging on a shared row of index labels a, b, c, d — labels b and c exist on both sides and light up green with their summed values 12 and 23, while labels a and d exist on only one side and light up red with NaN'
    description: >-
      An animated flow diagram, readable in full as a still image, showing the day's opening failure as
      one picture. Series x (index a, b, c; values 1, 2, 3) is drawn as a small labelled table on the
      left; Series y (index b, c, d; values 10, 20, 30) is drawn as a matching table on the right. Both
      blocks drift a short distance toward the centre and settle, representing the two Series being
      brought together for the "+" operation. A result row in the middle lists the shared index labels a,
      b, c, d in order. Marching-dash wires run from x's b and c cells and from y's b and c cells into
      their corresponding result rows, which are shaded green with a solid border and show the real sums:
      12.0 (2 + 10) for b and 23.0 (3 + 20) for c. The result rows for a and d, which have no incoming
      wire from the missing side, are shaded red with a dashed border and read NaN, annotated "(only in
      x)" and "(only in y)" respectively. A caption beneath states plainly that labels a and d exist on
      only one side, so the sum has nothing to add to, and pandas writes NaN rather than guessing. A
      prefers-reduced-motion block stops the slide, the marching dashes and the colour pulse, leaving the
      two source blocks in their settled position, the wires drawn as solid lines, and the result row
      already shaded in its final green/red state, so every fact in the diagram is visible without motion.
