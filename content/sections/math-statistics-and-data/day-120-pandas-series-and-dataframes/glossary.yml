terms:
  - term: Series
    definition: >-
      A one-dimensional pandas data structure: a sequence of values paired with a sequence of labels
      called the index. The values are typically backed by a NumPy array (or, for certain dtypes since
      pandas 2.0, a PyArrow array); the index is what a bare NumPy array does not have.
  - term: DataFrame
    definition: >-
      A pandas data structure representing a table: a collection of Series that all share the same
      index. Each column keeps its own dtype independently; the shared index is what lets df.loc["c"]
      pull the same logical row out of every column at once.
  - term: index
    definition: >-
      The array of labels attached to a Series or DataFrame's rows. Two Series with different indexes do
      not correspond position by position; arithmetic between them aligns on the labels first.
  - term: index alignment
    definition: >-
      The rule that binary operations between two Series (or DataFrames) compute the union of both
      indexes, reindex both operands onto it (filling missing positions with NaN), and only then perform
      the elementwise operation. Alignment happens unconditionally, whether or not the two indexes
      already agree.
  - term: Copy-on-Write (CoW)
    definition: >-
      pandas' memory-management strategy, unconditional as of pandas 3.0, in which a Series or DataFrame
      derived from another shares the same underlying memory until either object is written to, at which
      point the write triggers an actual copy so the other object is unaffected. It is what makes chained
      assignment fail to reach the original object.
  - term: chained assignment
    definition: >-
      Writing two indexing operations back to back in one assignment statement, such as
      df[mask]["col"] = value. The first indexing operation produces a temporary object; the assignment
      writes into that temporary, which is then discarded, so the original object is never modified. On
      pandas 3.0.5 this raises a ChainedAssignmentError warning.
  - term: ChainedAssignmentError
    definition: >-
      A Warning subclass (not a raised exception) that pandas 3.0.5 emits when it detects chained
      assignment. The statement still completes and execution continues, which is why the warning is easy
      to miss if warnings are filtered or the script's stderr is not read.
  - term: '.loc'
    definition: >-
      A label-based indexer. df.loc[row_label, col_label] selects by the labels present in the index and
      columns. A slice given to .loc is inclusive of its stop label: df.loc["b":"d"] includes the row
      labelled "d".
  - term: '.iloc'
    definition: >-
      A positional indexer, exactly like indexing a Python list or NumPy array by integer position,
      regardless of the labels present. A slice given to .iloc is exclusive of its stop position, matching
      ordinary Python slice semantics.
  - term: dtype
    definition: >-
      The single data type every value in a given Series or column shares. Common dtypes include int64,
      float64, bool, and, as of pandas 3.0, str (replacing object as the default for text columns).
  - term: str dtype (pandas 3.0)
    definition: >-
      The default dtype pandas 3.0 assigns to a column built from Python strings, backed by PyArrow's
      contiguous string storage. It replaces object as the default; object remains available on request
      and is still what a genuinely mixed-type column falls back to.
  - term: object dtype
    definition: >-
      The pre-pandas-3.0 default dtype for a column of strings (and the dtype still used for genuinely
      mixed-type columns on any pandas version): an array of pointers to separately allocated Python
      objects, with no contiguous storage benefit.
  - term: dtype promotion
    definition: >-
      The automatic widening of a column's dtype -- most commonly int64 to float64 -- that pandas performs
      when a value the original dtype cannot represent (such as a missing value) is introduced. int64 has
      no bit pattern for "missing"; float64 does, via NaN.
  - term: Int64 (nullable integer dtype)
    definition: >-
      A pandas extension dtype (capital I, distinct from lowercase int64) that stays in the integer
      family while supporting a missing-value marker (pd.NA) instead of borrowing NaN from float64. It
      avoids the precision loss that int64-to-float64 promotion causes past 2**53.
  - term: NaN
    definition: >-
      "Not a Number", the IEEE 754 floating-point value used to represent a missing entry in a float64
      column. By the IEEE 754 standard, NaN is never equal to anything, including itself, so
      series == np.nan can never find it; .isna() is the reliable test.
  - term: pd.NA
    definition: >-
      pandas' newer, dtype-agnostic missing-value marker, used by nullable extension dtypes such as
      Int64, distinct from the float-only NaN.
  - term: '.isna()'
    definition: >-
      A Series or DataFrame method that returns a boolean mask marking which positions hold a missing
      value, checking the underlying missing-value representation directly rather than relying on
      equality comparison, which can never succeed against NaN.
  - term: vectorisation
    definition: >-
      Expressing a computation as one operation over a whole array or Series, which runs inside compiled
      code, rather than looping over elements in interpreted Python (as .apply(lambda ...) does). Covered
      first for bare NumPy arrays on Day 104.
  - term: '.describe()'
    definition: >-
      A DataFrame or Series method that computes count, mean, standard deviation, min, the quartiles, and
      max for every numeric column at once -- the same summary statistics Day 116 covered computing by
      hand, including Bessel's correction for the standard deviation.
  - term: 'memory_usage(deep=True)'
    definition: >-
      A DataFrame method reporting the real byte cost per column. For the pandas-3.0 str dtype, deep=True
      and deep=False agree, because the underlying storage is already contiguous; for the legacy object
      dtype, deep=True reports substantially more, revealing the cost of the pointer indirection that
      deep=False cannot see.
  - term: RangeIndex
    definition: >-
      The default index pandas assigns when nothing else is specified: the integers 0, 1, 2, ... in
      order. It offers no protection against index-alignment surprises, because it is positional by
      construction rather than meaningfully labelled.
  - term: polars
    definition: >-
      A DataFrame library for Python, written in Rust, built around multi-threaded execution. Unlike
      pandas, polars DataFrames have no implicit row index at all; every operation is positional by
      design, trading pandas' automatic label-alignment safety net for a simpler model and, on large
      data, faster execution.
