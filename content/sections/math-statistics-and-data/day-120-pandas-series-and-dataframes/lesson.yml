id: D120
day: 120
slug: pandas-series-and-dataframes
title: 'pandas: Series and DataFrames'
section: math-statistics-and-data
subsection: data-analysis
week: 18
learning_promise: >-
  After this lesson you will be able to build a pandas Series and a DataFrame three different ways and
  say correctly what the index becomes each time; predict, before running it, exactly which labels go
  NaN when two Series with partially overlapping indexes are added, because you understand that pandas
  aligns on label rather than position; state the pandas 3.0 default dtype for a column of strings and
  demonstrate why it differs from the object dtype almost all existing tutorials describe; show precisely
  why chained assignment leaves a DataFrame completely unchanged under pandas 3.0's unconditional
  Copy-on-Write, and write the single .loc statement that performs the assignment correctly; state and
  demonstrate the exact endpoint asymmetry between .loc (label-based, inclusive of its stop) and .iloc
  (positional, exclusive of its stop); explain why comparing a Series against NaN with == can never find a
  missing value and use .isna() instead; measure vectorised arithmetic against .apply with a lambda and
  report the gap honestly, as a ratio and a shape rather than a timing; declare an integer column that
  might ever meet a missing value as the nullable Int64 dtype rather than int64, and say exactly what
  precision loss that avoids; and read .describe(), .info(), .head() and memory_usage(deep=True) as the
  four commands you run on any frame you have not met before.
objectives:
  - 'Build a Series and a DataFrame from a dict, from records, and from a bare NumPy array, and state correctly what the index becomes in each case'
  - 'Predict exactly which labels go NaN when two Series with partially overlapping indexes are added, and explain why pandas aligns on label rather than position'
  - 'Opt out of index alignment deliberately with .to_numpy() or .reset_index(drop=True), and say when each is the right choice'
  - 'State the pandas 3.0 default string dtype (str) and demonstrate how it differs from the pre-3.0 object default, including for memory_usage(deep=True)'
  - 'Demonstrate that an int64 column silently promotes to float64 the moment a missing value enters it, losing exact precision past 2**53, and use the nullable Int64 dtype to prevent it'
  - 'Show that chained assignment leaves a DataFrame unchanged under pandas 3.0''s unconditional Copy-on-Write, name the ChainedAssignmentError warning it raises, and write the single .loc statement that performs the assignment correctly'
  - 'State the exact endpoint difference between .loc (label-based, inclusive of the stop) and .iloc (positional, exclusive of the stop), and predict which rows a given slice returns before running it'
  - 'Explain why comparing a Series against NaN with == always returns False and use .isna() as the reliable test instead'
  - 'Measure vectorised arithmetic against .apply(lambda ...) on the same column and report the result as a ratio and a shape, never a millisecond figure'
  - 'Read .describe(), .info(), .head() and memory_usage(deep=True) as the four commands to run on any new frame, and check .describe()''s numbers against hand computation from Day 116'
  - 'Explain how a DataFrame differs from a NumPy array (Day 104), a SQL table (Week 13), and a polars DataFrame, specifically regarding the index'
  - 'Trace how a silent index-alignment NaN, buried by a downstream fillna(0), can corrupt a machine-learning feature column without raising any error'
prerequisites:
  - 'Day 104 — NumPy arrays, dtypes, shape and vectorised thinking; a Series is an ndarray with an index bolted on'
  - 'Day 116 — descriptive statistics computed by hand, including Bessel''s correction, which .describe() reproduces exactly'
  - 'Days 92-98 — data formats and pipelines, and the habit of reading data before trusting it'
  - 'Week 13 — SQL and SQLite, the tool this lesson compares pandas against for tabular questions that do not fit in memory'
  - 'A working python3 on your PATH; the lab creates its own virtual environment with pandas 3.0.5 pinned exactly'
reading_time_minutes: 45
practical_time_minutes: 40
