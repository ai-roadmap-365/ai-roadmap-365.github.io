<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" aria-labelledby="d120aTitleId d120aDescId">
  <title id="d120aTitleId">A DataFrame dissected: one shared index and three Series bolted onto it</title>
  <desc id="d120aDescId">A DataFrame with four rows labelled a through d. The index runs down the left as one shared column. To its right sit three separately-outlined Series -- order_id as a nullable Int64 column, price as a float64 column, and category as a str column -- each drawn as its own bracketed unit sharing the same four index labels, with a caption stating that a DataFrame is a set of Series that agree on one index, not a spreadsheet of independent cells.</desc>

  <style>
    .d120a-bg      { fill: #f8fafc; }
    .d120a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d120a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d120a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d120a-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; fill: #1a202c; }
    .d120a-dtype   { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #1d4ed8; font-weight: 600; }
    .d120a-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d120a-idxcell { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.25; }
    .d120a-cell    { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .d120a-header  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d120a-bracket { fill: none; stroke: #1d4ed8; stroke-width: 2; }
    .d120a-idxline { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 4 4; }
  </style>

  <rect class="d120a-bg" x="0" y="0" width="980" height="640" />

  <text class="d120a-title" x="32" y="42">A DataFrame is aligned Series, not a spreadsheet</text>
  <text class="d120a-sub" x="32" y="66">Four rows, one shared index down the left; three independently-typed Series bolted onto it on the right</text>

  <!-- Index column -->
  <text class="d120a-label" x="70" y="112" text-anchor="middle" font-weight="700">index</text>
  <g>
    <rect class="d120a-header" x="30" y="122" width="80" height="36" />
    <text class="d120a-dtype" x="70" y="145" text-anchor="middle">object</text>
  </g>
  <g>
    <rect class="d120a-idxcell" x="30" y="158" width="80" height="44" />
    <text class="d120a-mono" x="70" y="185" text-anchor="middle">a</text>
    <rect class="d120a-idxcell" x="30" y="202" width="80" height="44" />
    <text class="d120a-mono" x="70" y="229" text-anchor="middle">b</text>
    <rect class="d120a-idxcell" x="30" y="246" width="80" height="44" />
    <text class="d120a-mono" x="70" y="273" text-anchor="middle">c</text>
    <rect class="d120a-idxcell" x="30" y="290" width="80" height="44" />
    <text class="d120a-mono" x="70" y="317" text-anchor="middle">d</text>
  </g>

  <!-- Column 1: order_id, Int64 -->
  <g>
    <text class="d120a-label" x="245" y="100" text-anchor="middle" font-weight="700">order_id  (a Series)</text>
    <rect class="d120a-header" x="150" y="122" width="190" height="36" />
    <text class="d120a-dtype" x="245" y="145" text-anchor="middle">Int64  (nullable)</text>
    <rect class="d120a-cell" x="150" y="158" width="190" height="44" />
    <text class="d120a-mono" x="245" y="185" text-anchor="middle">1001</text>
    <rect class="d120a-cell" x="150" y="202" width="190" height="44" />
    <text class="d120a-mono" x="245" y="229" text-anchor="middle">1002</text>
    <rect class="d120a-cell" x="150" y="246" width="190" height="44" />
    <text class="d120a-mono" x="245" y="273" text-anchor="middle">&lt;NA&gt;</text>
    <rect class="d120a-cell" x="150" y="290" width="190" height="44" />
    <text class="d120a-mono" x="245" y="317" text-anchor="middle">1004</text>
    <path class="d120a-bracket" d="M 150 118 L 142 118 L 142 336 L 150 336" />
  </g>

  <!-- Column 2: price, float64 -->
  <g>
    <text class="d120a-label" x="455" y="100" text-anchor="middle" font-weight="700">price  (a Series)</text>
    <rect class="d120a-header" x="360" y="122" width="190" height="36" />
    <text class="d120a-dtype" x="455" y="145" text-anchor="middle">float64</text>
    <rect class="d120a-cell" x="360" y="158" width="190" height="44" />
    <text class="d120a-mono" x="455" y="185" text-anchor="middle">19.99</text>
    <rect class="d120a-cell" x="360" y="202" width="190" height="44" />
    <text class="d120a-mono" x="455" y="229" text-anchor="middle">44.50</text>
    <rect class="d120a-cell" x="360" y="246" width="190" height="44" />
    <text class="d120a-mono" x="455" y="273" text-anchor="middle">7.25</text>
    <rect class="d120a-cell" x="360" y="290" width="190" height="44" />
    <text class="d120a-mono" x="455" y="317" text-anchor="middle">NaN</text>
    <path class="d120a-bracket" d="M 360 118 L 352 118 L 352 336 L 360 336" />
  </g>

  <!-- Column 3: category, str -->
  <g>
    <text class="d120a-label" x="665" y="100" text-anchor="middle" font-weight="700">category  (a Series)</text>
    <rect class="d120a-header" x="570" y="122" width="190" height="36" />
    <text class="d120a-dtype" x="665" y="145" text-anchor="middle">str  (pandas 3.0 default)</text>
    <rect class="d120a-cell" x="570" y="158" width="190" height="44" />
    <text class="d120a-mono" x="665" y="185" text-anchor="middle">books</text>
    <rect class="d120a-cell" x="570" y="202" width="190" height="44" />
    <text class="d120a-mono" x="665" y="229" text-anchor="middle">tools</text>
    <rect class="d120a-cell" x="570" y="246" width="190" height="44" />
    <text class="d120a-mono" x="665" y="273" text-anchor="middle">books</text>
    <rect class="d120a-cell" x="570" y="290" width="190" height="44" />
    <text class="d120a-mono" x="665" y="317" text-anchor="middle">toys</text>
    <path class="d120a-bracket" d="M 570 118 L 562 118 L 562 336 L 570 336" />
  </g>

  <!-- Dashed lines showing the shared index binds every column at the same row -->
  <line class="d120a-idxline" x1="110" y1="180" x2="800" y2="180" />
  <line class="d120a-idxline" x1="110" y1="224" x2="800" y2="224" />
  <line class="d120a-idxline" x1="110" y1="268" x2="800" y2="268" />
  <line class="d120a-idxline" x1="110" y1="312" x2="800" y2="312" />
  <text class="d120a-caption" x="810" y="184">row "a" across every</text>
  <text class="d120a-caption" x="810" y="202">column, same index label</text>

  <!-- Caption block -->
  <rect class="d120a-cell" x="30" y="380" width="920" height="230" fill="#ffffff" stroke="#cbd5e1" />
  <text class="d120a-label" x="52" y="412" font-weight="700">Read it this way:</text>
  <text class="d120a-caption" x="52" y="440">A DataFrame is NOT one table of independent cells. It is three separate Series -- order_id, price,</text>
  <text class="d120a-caption" x="52" y="462">category -- that happen to share one index. Each column keeps its OWN dtype: order_id is nullable</text>
  <text class="d120a-caption" x="52" y="484">Int64 so a missing order never silently costs precision; price is float64 because NaN needs a float</text>
  <text class="d120a-caption" x="52" y="506">to live in; category is the pandas 3.0 default str dtype, not the pre-3.0 object dtype.</text>
  <text class="d120a-caption" x="52" y="536">The index is what makes df.loc["c"] pull the SAME logical row -- 1002 is wrong here, "c" pulls</text>
  <text class="d120a-caption" x="52" y="558">order_id &lt;NA&gt;, price 7.25, category "books" -- from three separately-stored columns at once. Two</text>
  <text class="d120a-caption" x="52" y="580">Series with different indexes are not "the same rows in a different order." They may share no rows</text>
  <text class="d120a-caption" x="52" y="602">at all, which is exactly what makes arithmetic between them produce NaN instead of an error.</text>
</svg>
