<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What a data frame is</title>
  <style>
    .df-idea-bg   { fill: #f8fafc; }
    .df-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .df-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .df-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .df-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .df-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .df-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .df-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .df-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .df-idea-stage { opacity: 1; }

    .df-idea-s0 { animation-delay: 0.00s; }
    .df-idea-e0 { animation-delay: 0.00s; }
    .df-idea-s1 { animation-delay: 1.28s; }
    .df-idea-e1 { animation-delay: 1.28s; }
    .df-idea-s2 { animation-delay: 2.56s; }
    .df-idea-e2 { animation-delay: 2.56s; }
    .df-idea-s3 { animation-delay: 3.84s; }
    .df-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .df-idea-conn  { animation: df-idea-trace 6.4s ease-in-out infinite; }
      .df-idea-stage { animation: df-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes df-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes df-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .df-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .df-idea-stage { animation: df-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes df-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="df-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="df-idea-bg" width="980" height="322"/>
  <text class="df-idea-h1"  x="30" y="40">What a data frame is</text>
  <text class="df-idea-sub" x="30" y="64">Four properties.</text>
  <g class="df-idea-stage df-idea-s0">
    <rect class="df-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="df-idea-step" x="44" y="142">01</text>
    <text class="df-idea-name" x="70" y="142">A table of named columns</text>
    <text class="df-idea-desc" x="44" y="166">Each one a series of values.</text>
  </g>
  <line class="df-idea-line df-idea-conn df-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#df-idea-tip)"/>
  <g class="df-idea-stage df-idea-s1">
    <rect class="df-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="df-idea-step" x="280" y="142">02</text>
    <text class="df-idea-name" x="306" y="142">Each column with a single type</text>
    <text class="df-idea-desc" x="280" y="166">Which is where the speed comes</text>
    <text class="df-idea-desc" x="280" y="182">from.</text>
  </g>
  <line class="df-idea-line df-idea-conn df-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#df-idea-tip)"/>
  <g class="df-idea-stage df-idea-s2">
    <rect class="df-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="df-idea-step" x="516" y="142">03</text>
    <text class="df-idea-name" x="542" y="142">Rows addressed by an index</text>
    <text class="df-idea-desc" x="516" y="166">Which need not be a position.</text>
  </g>
  <line class="df-idea-line df-idea-conn df-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#df-idea-tip)"/>
  <g class="df-idea-stage df-idea-s3">
    <rect class="df-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="df-idea-step" x="752" y="142">04</text>
    <text class="df-idea-name" x="778" y="142">And operations aligned on that index</text>
    <text class="df-idea-desc" x="752" y="166">Automatically, which surprises</text>
    <text class="df-idea-desc" x="752" y="182">people.</text>
  </g>
  <text class="df-idea-sub" x="30" y="304">Automatic index alignment is the single most distinctive behaviour here: adding two series matches them by label, not by position, whatever order they are in.</text>
</svg>
