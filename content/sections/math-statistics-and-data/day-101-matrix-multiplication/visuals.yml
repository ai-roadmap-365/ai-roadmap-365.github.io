visuals:
  - id: matmul-anatomy-architecture
    file: assets/matmul-anatomy-architecture.svg
    type: diagram
    title: 'The anatomy of a matrix product: a 2 by 3 times a 3 by 2, with one output cell traced back to the exact row and column that produced it'
    alt: 'Diagram: a 2 by 3 matrix multiplied by a 3 by 2 matrix, with one row and one column shaded and the single output cell they produce shaded in the answer, the arithmetic for that cell written out beneath, and a panel annotating which two dimensions must match and are consumed and which two survive'
    description: 'A static architecture diagram that makes one output cell completely accountable. Across the middle sit three grids: on the left the batch X of shape 2 by 3 holding 1, 2, 0 on its first row and 0, 1, 3 on its second, labelled as two examples with three features each; in the centre the weight matrix W of shape 3 by 2 holding 2, 0 then minus 1, 1 then 0, 4, labelled as three inputs in and two outputs out; and on the right the answer X @ W of shape 2 by 2 holding 0, 2 on its first row and minus 1, 13 on its second. Row 1 of X is shaded blue and annotated as row 1, column 1 of W is shaded green and annotated as column 1, and the single cell of the answer that those two produce — the 13 — is shaded amber with a heavier border. Two dashed amber ties run from the shaded row and the shaded column towards that cell, with a note beside it saying that the shaded row and the shaded column meet in this one cell. Each grid carries its shape underneath in large type. A bordered panel below shows that cell worked out in full: row 1 of X is 0, 1, 3, column 1 of W is 0, 1, 4, and 0 times 0 plus 1 times 1 plus 3 times 4 equals 0 plus 1 plus 12 equals 13, with a note that this is three multiplications and two additions and that the other three cells are the same thing with a different row or column. A final panel at the foot annotates the shape rule by writing 2 comma 3 at 3 comma 2 equals 2 comma 2 in large type with the individual numbers colour-coded: a green arc joins the 2 on the far left to the first 2 of the answer, a blue arc joins the 2 in the middle to the second 2 of the answer, and a dashed red arc joins the two 3s underneath. A colour-keyed legend explains each: the green 2 is the number of rows going in and survives as the answer rows; the blue 2 is the width of the layer and survives as the answer columns; the two red 3s must match because the second matrix has to accept what the first one produces, and that 3 is then consumed and gone from the answer entirely, and when those two disagree that is the shape error and it is the whole bug. A side note records that X holds data while W transforms it, so every row of X is passed through W. A closing line states that all values are invented and every number can be re-derived with a pen in under a minute.'
  - id: matmul-composition-flow
    file: assets/matmul-composition-flow.svg
    type: flow-animated
    title: 'Matrix multiplication is composition: a point passed through two transformations in turn, and through their single product matrix, arriving at the same place'
    alt: 'Diagram: the point 3 comma 1 travelling through a reflection to 3 comma minus 1 and then through a quarter turn to 1 comma 3, drawn on real coordinate grids, beside the same point travelling through the single product matrix and arriving at 1 comma 3 in one step, with the product worked out entry by entry underneath'
    description: 'An animated flow diagram in two halves, with real coordinates throughout so that the still frame proves composition rather than asserting it. The upper half, headed the long way — do B, then do A, runs three small coordinate planes left to right. The first plane draws the starting point 3, 1 as an amber dot with an arm from the origin and dashed guide lines down to each axis, labelled the starting point. A dashed blue wire with an arrowhead leads into a dark blue box holding the matrix B, written as 1, 0 over 0, minus 1, annotated as a reflection in the horizontal axis. Another wire leads to the second plane, which draws the point 3, minus 1 the same way and is labelled after B, y has flipped sign. A further wire leads into a second dark blue box holding the matrix A, written as 0, minus 1 over 1, 0, annotated as a quarter turn anticlockwise, and on into the third plane, drawn on a green background, which holds the point 1, 3 and is labelled after A, the destination. A line beneath notes that this took two multiplications for one point and that the intermediate result 3, minus 1 has to exist along the way. The lower half, headed the short way — do A @ B, once, repeats the same starting plane with the point 3, 1, leads through a single wide dark blue box holding A @ B written as 0, 1 over 1, 0 and labelled reflection in y equals x and one matrix, one multiplication, and arrives at a green plane holding 1, 3, labelled the same destination. Both destination planes share the same green background so the match is visible at a glance. An amber marker travels each route: the upper marker pauses at the intermediate plane before continuing, the lower marker runs straight through, and both reach their destination at the same moment in the cycle. The transformation boxes brighten as the marker reaches them, and the wires carry marching dashes in the direction of travel. A panel at the foot shows where the combined matrix came from, computing A @ B entry by entry as 0 times 1 plus minus 1 times 0 equals 0, then 0 times 0 plus minus 1 times minus 1 equals 1, then 1 times 1 plus 0 times 0 equals 1, then 1 times 0 plus 0 times minus 1 equals 0, alongside a note that order matters because B @ A would instead give 0, minus 1 over minus 1, 0, the reflection in y equals minus x, which sends 3, 1 to minus 1, minus 3. A prefers-reduced-motion block stops every animation and restores the resting state, in which both markers sit at the start of their routes, the wires are solid arrows, the boxes are their resting blue, and every coordinate, matrix, arrow and caption is still present and legible. A closing line records that all values are invented, that every coordinate can be re-derived with a pen, and that the animation only moves the two markers so nothing is shown by motion alone.'
