terms:
  - term: 'Dot product'
    definition: 'The operation that takes two vectors of the same length, multiplies them entry by entry, and adds up the products, returning a single number rather than a vector. Written u dot v. It has an equivalent geometric form, the product of the two lengths times the cosine of the angle between them, and the two forms give the same number — which is why a dot product of zero means the vectors are perpendicular, and why a vector dotted with itself is its squared length.'
  - term: 'Matrix product'
    definition: 'The operation written A @ B, whose entry (i, j) is row i of A dotted with column j of B. The recipe is the coordinate form of something simpler: A @ B is the single transformation that does B and then does A. Cayley defined it this way in 1858 precisely because it was the operation corresponding to composing two linear substitutions, so composition is the definition and the recipe is the consequence, not the other way round.'
  - term: 'Composition'
    definition: 'Doing one transformation and then another. The reason matrix multiplication has the rule it has. Because matrices compose like nested function calls, the rightmost matrix in A @ B @ v is the one that meets the vector first — English reads left to right and the arithmetic does not, which is the single most common conceptual error on this topic.'
  - term: 'Inner dimension'
    definition: 'In an (m, n) @ (n, p), the n that appears on both sides. It must match because the second transformation has to accept what the first one produces, and it is then CONSUMED — it does not appear in the answer at all. It was the size of the intermediate result, and the combined transformation has no intermediate. When the two inner dimensions disagree, that is the shape error.'
  - term: 'Shape rule'
    definition: 'An (m, n) @ (n, p) gives an (m, p). Worth deriving rather than memorising: the inner dimensions match because of what each side accepts and produces, and the outer dimensions survive because they are the two ends of the pipeline — what goes in at one end and what comes out at the other. Reading a shape error means printing both shapes and looking only at the inner two numbers.'
  - term: 'Commutative'
    definition: 'An operation where the order of the operands does not change the answer. Addition of numbers is commutative; matrix multiplication is NOT. A @ B and B @ A are usually different matrices and frequently not even the same shape, and often only one of them is legal. This is not a technicality to be apologised for: it is the honest consequence of composition, in the same way that putting on socks and then shoes differs from shoes and then socks.'
  - term: 'Associative'
    definition: 'An operation where the brackets may be moved without changing the answer: (A @ B) @ C equals A @ (B @ C). Matrix multiplication is associative. Note the precise claim — the BRACKETS may move freely, the ORDER may not, and confusing those two statements is the usual mistake. Associativity is what makes it legal to pick the cheaper evaluation order, which on realistic adapter shapes is worth a factor of 258 in arithmetic for an identical answer.'
  - term: 'Distributive'
    definition: 'The property that A @ (B + C) equals A @ B plus A @ C — matrix multiplication splits over addition. It is what allows a layer weight matrix to be decomposed into a base part and a small correction whose results are then added, which is half the reason low-rank adapters work.'
  - term: 'Identity matrix'
    definition: 'The square matrix with 1 on the main diagonal and 0 everywhere else. The transformation that does nothing: applied to a vector it returns that same vector, and multiplying any matrix by it changes nothing. It is really one matrix per size, and the shape rule decides which — a (2, 3) matrix takes a 2 by 2 identity on its left and a 3 by 3 identity on its right. numpy.eye(n) builds one.'
  - term: 'Elementwise product'
    definition: 'Multiplying two arrays of the same shape entry by entry, with no summing anywhere, written A * B in NumPy. A different operation from the matrix product and not a slower or sloppier version of it. The compact way to hold the distinction: @ is * followed by a sum along the last axis, and it is the summing that loses a dimension and makes the result a transformation rather than a rescaling.'
  - term: 'Hadamard product'
    definition: 'The formal name for the elementwise product, so called after Jacques Hadamard. Worth knowing because papers use the name and a small circle symbol for it where code uses a bare asterisk, and a reader who does not recognise the name can mistake it for the matrix product and misread the whole equation.'
  - term: 'Linear combination'
    definition: 'A weighted sum of a set of vectors — so many copies of the first, plus so many of the second, and so on. The key to matrix-vector multiplication: A @ v is a linear combination of A COLUMNS, with the entries of v as the weights. This picture explains at once why the output has as many entries as A has rows, why v must have one entry per column, and why the answer can never land outside the space A columns reach.'
  - term: 'Basis vector'
    definition: 'One of the vectors that is all zeros except a single 1, such as (1, 0) and (0, 1) in the plane. Feeding one into a matrix picks out exactly one column, so the columns of a transformation matrix ARE the images of the basis vectors. That lets you read a transformation matrix straight off a picture — work out where each basis vector lands and write those down as the columns — with no arithmetic at all.'
  - term: 'Forward pass'
    definition: 'Computing a network output from its input by running the data through each layer in turn. One layer of it is X @ W + b: a matrix multiply and a vector add, with the bias broadcast across the rows of the batch. This is not a simplification for teaching — it is the actual operation, and it is where essentially all the compute in training goes.'
  - term: 'Batch'
    definition: 'A stack of examples processed together, conventionally with one example per ROW so that example i lives at X[i], matching the layout of every CSV file and database table. Each row is computed independently of the others, which is exactly what makes batching worth doing: one multiply reuses the same weights across every example. Growing the batch changes the shape of X and nothing else — the weights and the bias belong to the layer.'
  - term: 'Bias'
    definition: 'A vector added to a layer output after the matrix multiply, with one entry per OUTPUT unit rather than per example. It is added to every row of the product by broadcasting, so a layer two units wide takes exactly two numbers however large the batch is. Getting its length wrong raises a broadcasting ValueError rather than failing silently, which is one of the few places in this area where you are told.'
  - term: 'BLAS'
    definition: 'Basic Linear Algebra Subprograms — a standard interface for vector and matrix routines, published from 1979 onwards, with many competing implementations such as OpenBLAS, Intel MKL and Apple Accelerate. NumPy does not implement floating-point matrix multiplication itself; it calls out to whichever BLAS it was built against. Critically, BLAS matrix-multiply routines exist only for floating-point and complex types, which is why an int64 product in NumPy is measurably far slower than a float64 one of the same shape and values — the integer case falls back to NumPy own compiled loop and never reaches BLAS at all.'
  - term: 'Multiplication count'
    definition: 'How many multiplications a product costs: m times n times p for an (m, n) @ (n, p), one per row, column and inner step. Not an estimate — it is exactly how many times the innermost line of the loop runs. Since training compute is dominated by these products, the multiplication count is effectively the bill, which is why choosing the cheaper association of a chain is a free and exact optimisation.'
  - term: 'Shape error'
    definition: 'The ValueError raised when the inner dimensions of a product disagree, and the most common error in applied linear algebra. NumPy message mentions a gufunc signature which can be ignored on first reading; the useful part is the phrase naming the two sizes. The repair is usually a transpose, but there are two of them — X @ X.T compares examples with examples and X.T @ X compares features with features — and they have different shapes and different meanings, so transposing until the error goes away trades a loud failure for a quiet wrong answer.'
  - term: 'Low-rank adapter'
    definition: 'A way of adjusting a large layer by inserting a narrow detour: a wide input passes through one small matrix down to a few dimensions and back out through another. Its cost depends entirely on the association order — keeping the brackets so the batch meets the narrow matrices first costs 67 million multiplications on typical shapes, while multiplying the two small matrices together first builds a full wide matrix and costs 17.3 billion for the identical answer, a factor of 258.'
