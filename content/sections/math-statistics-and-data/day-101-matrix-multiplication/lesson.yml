title: 'Matrix Multiplication'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 15
learning_promise: 'After this lesson matrix multiplication will stop being a rule you memorised and become the only rule it could be, because you will see it as composition — A @ B is the single transformation that does B and then does A. From that one idea everything else falls out without needing to be remembered separately: the inner dimensions must match because the second machine has to accept what the first one produces, that inner dimension is then consumed and vanishes from the answer, and the two outer dimensions survive because they are the ends of the pipeline. You will compute the dot product both ways and reconcile the multiply-and-add recipe with the geometric statement about lengths and the angle; read matrix-vector multiplication as a weighted sum of the matrix columns, which is the picture that makes span, rank and everything after it easy; watch A @ B and B @ A come out as two genuinely different transformations with both computed in full; use associativity to cut the arithmetic in a realistic chain by a factor of 258 without changing a single digit of the answer; meet the trap where * and @ are both legal, both return the same shape, and give completely different numbers with no warning; read a shape error properly and choose between the two transpose repairs on meaning rather than on which one runs; and finally compute one layer of a neural network by hand — X @ W + b, with the bias broadcast across rows — which is the operation that consumes essentially all the compute in training any model you will ever use, and the concrete answer to why a GPU beats a CPU at bulk mathematics.'
objectives:
  - 'Explain matrix multiplication as composition — A @ B is the single transformation that does B and then A — and derive the shape rule from that rather than recalling it'
  - 'Compute a dot product by multiplying pairwise and adding, reconcile it with the geometric form using lengths and the cosine of the angle, and read a zero result as perpendicularity'
  - 'Read matrix-vector multiplication as a weighted sum of the matrix columns, and read a transformation matrix columns as the images of the basis vectors'
  - 'Implement matrix multiplication from first principles three ways — nested loops, a list of dot products, and one matrix-vector product per column — and assert all three against NumPy'
  - 'Demonstrate that multiplication is not commutative using a pair where both A @ B and B @ A are defined, computed in full, and geometrically different'
  - 'Apply associativity and distributivity correctly, count the multiplications each association of a chain costs, and choose the cheap one on realistic adapter shapes'
  - 'Distinguish the elementwise product from the matrix product precisely — @ is * followed by a sum along the last axis — and predict both the shape and the values of each'
  - 'Recognise the identity matrix as the transformation that does nothing, and explain why a non-square matrix needs a different size of identity on each side'
  - 'Read a NumPy shape error by printing the two shapes first, and choose between X @ X.T and X.T @ X on what each one means rather than on which one runs'
  - 'Compute one layer of a neural network by hand as X @ W + b with the bias broadcast across rows, and explain why two linear layers with no activation between them collapse into one'
  - 'Explain why a Python loop loses to NumPy by thousands of times, and why the dtype decides whether BLAS is reached at all — a measured result that contradicts the usual because it is C explanation'
  - 'Compare pure Python, NumPy, PyTorch, JAX and BLAS implementations with when to choose each, stating honestly which were run and which were described from documentation'
  - 'Connect the operation to AI practice: essentially all training compute is these products, and a GPU is a machine built to do this one thing in parallel'
prerequisites:
  - 'Day 99 — vectors: components, magnitude, the L2 norm, and the dot product introduced geometrically. This lesson computes it both ways and reconciles them'
  - 'Day 100 — matrices: shape, transpose, broadcasting, views versus copies and axis semantics. The bias add here is broadcasting doing its job'
  - 'Day 70 — floating point, which is why the associativity section states a tolerance instead of comparing with double equals'
  - 'Day 65 and Day 85 — CSV files and database tables, which is why frameworks stack a batch as rows rather than columns'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'Day 43 — python3 -m venv and installing a package with pip; the lab installs numpy and pytest into a lab-local environment'
  - 'Day 2 — the question of why GPUs beat CPUs at bulk mathematics, which this lesson finally answers precisely'
  - 'No mathematics beyond school arithmetic. Every symbol is defined where it first appears'
