<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Order matters</title>
  <style>
    .not-commutative-bg   { fill: #f8fafc; }
    .not-commutative-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-commutative-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-commutative-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-commutative-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-commutative-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-commutative-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-commutative-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-commutative-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-commutative-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-commutative-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-commutative-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-commutative-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .not-commutative-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .not-commutative-stage { opacity: 1; }

    .not-commutative-s0 { animation-delay: 0.00s; }
    .not-commutative-e0 { animation-delay: 0.00s; }
    .not-commutative-s1 { animation-delay: 1.28s; }
    .not-commutative-e1 { animation-delay: 1.28s; }
    .not-commutative-s2 { animation-delay: 2.56s; }
    .not-commutative-e2 { animation-delay: 2.56s; }
    .not-commutative-s3 { animation-delay: 3.84s; }
    .not-commutative-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .not-commutative-conn  { animation: not-commutative-trace 6.4s ease-in-out infinite; }
      .not-commutative-stage { animation: not-commutative-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes not-commutative-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes not-commutative-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .not-commutative-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .not-commutative-stage { animation: not-commutative-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes not-commutative-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="not-commutative-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="not-commutative-bg" width="980" height="322"/>
  <text class="not-commutative-h1"  x="30" y="40">Order matters</text>
  <text class="not-commutative-sub" x="30" y="64">Four steps.</text>
  <g class="not-commutative-stage not-commutative-s0">
    <rect class="not-commutative-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="not-commutative-step" x="44" y="142">01</text>
    <text class="not-commutative-name" x="70" y="142">Swapping the order can be undefined</text>
    <text class="not-commutative-desc" x="44" y="166">The shapes may not permit it at</text>
    <text class="not-commutative-desc" x="44" y="182">all.</text>
  </g>
  <line class="not-commutative-line not-commutative-conn not-commutative-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#not-commutative-tip)"/>
  <g class="not-commutative-stage not-commutative-s1">
    <rect class="not-commutative-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="not-commutative-step" x="280" y="142">02</text>
    <text class="not-commutative-name" x="306" y="142">And where both are defined, the shapes can differ</text>
    <text class="not-commutative-desc" x="280" y="166">Giving results of different</text>
    <text class="not-commutative-desc" x="280" y="182">sizes.</text>
  </g>
  <line class="not-commutative-line not-commutative-conn not-commutative-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#not-commutative-tip)"/>
  <g class="not-commutative-stage not-commutative-s2">
    <rect class="not-commutative-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="not-commutative-step" x="516" y="142">03</text>
    <text class="not-commutative-name" x="542" y="142">Even for square matrices the values differ</text>
    <text class="not-commutative-desc" x="516" y="166">Almost always.</text>
  </g>
  <line class="not-commutative-line not-commutative-conn not-commutative-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#not-commutative-tip)"/>
  <g class="not-commutative-stage not-commutative-s3">
    <rect class="not-commutative-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="not-commutative-step" x="752" y="142">04</text>
    <text class="not-commutative-name" x="778" y="142">Because rotating then stretching is not stretching then rotating</text>
    <text class="not-commutative-desc" x="752" y="166">Which is the geometric reason.</text>
  </g>
  <text class="not-commutative-sub" x="30" y="304">The geometric reason is the one to hold onto: order matters for transformations in the physical world too, and the algebra is only recording that.</text>
</svg>
