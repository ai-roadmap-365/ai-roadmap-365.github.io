<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Order changes the product.">
  <title>Two machines in sequence</title>
  <style>
    .assembly-composition-bg   { fill: #f8fafc; }
    .assembly-composition-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-composition-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-composition-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-composition-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-composition-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembly-composition-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assembly-composition-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assembly-composition-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assembly-composition-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assembly-composition-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assembly-composition-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assembly-composition-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assembly-composition-row { opacity: 1; }
    .assembly-composition-r0 { animation-delay: 0.00s; }
    .assembly-composition-r1 { animation-delay: 0.45s; }
    .assembly-composition-r2 { animation-delay: 0.90s; }
    .assembly-composition-r3 { animation-delay: 1.35s; }
    .assembly-composition-r4 { animation-delay: 1.80s; }
    .assembly-composition-row { animation: assembly-composition-reveal 7.3s ease-in-out infinite; }
    @keyframes assembly-composition-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="assembly-composition-bg" width="980" height="390"/>
  <text class="assembly-composition-h1"  x="30" y="40">Two machines in sequence</text>
  <text class="assembly-composition-sub" x="30" y="64">Order changes the product.</text>
  <rect class="assembly-composition-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="assembly-composition-name" x="46" y="122">Cut, then paint</text>
  <text class="assembly-composition-desc" x="46" y="142">One outcome.</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r0" x="46" y="182">Shape it first</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r1" x="46" y="216">Then apply the finish</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r2" x="46" y="250">Paint covers the cut edges</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r3" x="46" y="284">A clean result</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r4" x="46" y="318">This is one order</text>
  <rect class="assembly-composition-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="assembly-composition-name" x="526" y="122">Paint, then cut</text>
  <text class="assembly-composition-desc" x="526" y="142">A different outcome.</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r0" x="526" y="182">Finish it first</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r1" x="526" y="216">Then shape it</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r2" x="526" y="250">Cutting exposes bare edges</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r3" x="526" y="284">A different result entirely</text>
  <text class="assembly-composition-desc assembly-composition-row assembly-composition-r4" x="526" y="318">This is the other order</text>
  <text class="assembly-composition-sub" x="30" y="372">Nobody finds it surprising that these differ physically, which is the intuition to carry into why matrix multiplication does not commute.</text>
</svg>
