questions:
  - question: 'A has shape (2, 3) and B has shape (3, 4). Why must those inner dimensions — the 3 and the 3 — be equal?'
    options:
      - 'So that the answer comes out square, which matrix multiplication requires'
      - 'Because A @ B means do B and then do A, and A can only accept vectors of the length B produces'
      - 'It is a convention chosen to make the arithmetic tidy; other definitions are equally valid'
      - 'Because both matrices must contain the same number of entries in total'
    answer_index: 1
    explanation: 'Read the shapes as machines. B is (3, 4), so it accepts vectors of length 4 and produces vectors of length 3. A is (2, 3), so it accepts vectors of length 3 and produces vectors of length 2. The inner dimensions must match because the second thing has to accept what the first one hands it — that is the whole reason, and it is why the rule is not something you need to memorise. Notice too what happens to that 3: it is CONSUMED. It was the size of the intermediate result, and the combined transformation has no intermediate, so it does not appear in the answer (2, 4) at all. Option 0 is simply false — the answer here is (2, 4), which is not square, and most useful products are not. Option 2 gets the history backwards: Cayley defined the product in 1858 precisely because it was the operation that composed two linear substitutions, so composition came first and the recipe is what you get by writing it out in coordinates. Option 3 is not a rule of anything: A has 6 entries here and B has 12.'

  - question: 'P and Q are both (2, 2). Which statement about `P * Q` and `P @ Q` in NumPy is true?'
    options:
      - '`*` raises a ValueError, because matrices must be multiplied with `@`'
      - 'They return arrays of different shapes, so a shape check will catch the mistake'
      - 'Both are legal, both return a (2, 2) array, and the values are completely different'
      - 'They are the same operation; `@` is simply the newer spelling of `*`'
    answer_index: 2
    explanation: 'This is the trap the lesson opens with, and it is dangerous precisely because nothing goes wrong visibly. With P = [[1, 2], [3, 4]] and Q = [[5, 6], [7, 8]], P * Q is [[5, 12], [21, 32]] — every entry multiplied by the matching entry, nothing summed — while P @ Q is [[19, 22], [43, 50]], each entry a row dotted with a column. Both are (2, 2). No exception, no warning, not one number in common. Option 1 describes the safer case, which happens only when the shapes are such that one of the two operations is illegal; on two square matrices of the same size you get no such protection. The one-sentence statement worth carrying is that `@` is `*` followed by a sum along the last axis — the summing is the entire difference, and it is what loses a dimension and makes the result a transformation rather than a rescaling.'

  - question: 'A is a quarter turn anticlockwise and B is a reflection in the horizontal axis. In `A @ B @ v`, which transformation is applied to v first?'
    options:
      - 'B, because the rightmost matrix is the one standing next to the vector'
      - 'A, because expressions are read left to right'
      - 'They are applied simultaneously, so the question does not arise'
      - 'It depends on whether A and B commute'
    answer_index: 0
    explanation: 'Matrices compose right to left, exactly like nested function calls: A @ B @ v is A(B(v)), and B is the one touching the vector. Working it through with v = (3, 1): B sends it to (3, -1) by flipping the sign of y, then A turns that a quarter anticlockwise to (1, 3). The single product A @ B is [[0, 1], [1, 0]], the reflection in the line y = x, and applying it to (3, 1) in one step also gives (1, 3) — same destination, one multiplication instead of two. Option 1 is the mistake almost everyone makes once, because English reads "A times B" left to right and the arithmetic does not. Option 3 is a real red herring: whether they commute affects whether the OTHER order gives the same answer, not which one runs first. Here they do not commute — B @ A is [[0, -1], [-1, 0]], the reflection in y = -x, which sends (3, 1) to (-1, -3) instead. One caveat worth carrying: all of this assumes vectors are columns. Frameworks store a batch with one example per row and write X @ W, where the chain then reads left to right — the same computation, transposed.'

  - question: 'You have a chain (1024, 4096) @ (4096, 8) @ (8, 4096). What does the choice of bracketing change?'
    options:
      - 'The answer, because matrix multiplication is not associative'
      - 'Nothing measurable; both orders do essentially the same amount of work'
      - 'Only whether the operation is legal at all'
      - 'Nothing about the answer, but the arithmetic differs by a factor of 258'
    answer_index: 3
    explanation: 'Matrix multiplication IS associative, so both bracketings give the identical answer — that is a theorem, not a coincidence. What differs is the cost, and the gap is not a rounding difference. An (m, n) @ (n, p) costs m*n*p multiplications, so (AB)C costs 1024*4096*8 + 1024*8*4096 = 67,108,864, while A(BC) costs 4096*8*4096 + 1024*4096*4096 = 17,314,086,912. That is exactly 258 times more work for the same result, because multiplying the two small matrices together first builds a full 4096 by 4096 matrix and then hits the whole batch with it. Those are the shapes of a low-rank adapter, which people really do train, and this cost gap is most of why they are affordable. Option 0 confuses two different statements: the BRACKETS may move freely, the ORDER may not, and mixing those up is the usual mistake. Since training compute is dominated by these products, the multiplication count is effectively the bill — which makes bracket placement one of the very few optimisations that is free, exact and requires no approximation.'

  - question: 'X has shape (2, 3), so `X @ X` raises a ValueError. Both `X @ X.T` and `X.T @ X` fix it. What should decide which one you write?'
    options:
      - 'Whichever one runs without raising — they compute the same thing either way'
      - 'X.T @ X always, since transposing the left operand is the conventional repair'
      - 'What the result means: one compares examples with examples, the other compares features with features'
      - 'Whichever produces the smaller array, to save memory'
    answer_index: 2
    explanation: 'They are not interchangeable and they are not the same size. X @ X.T is (2, 3) @ (3, 2) giving (2, 2), whose entry (i, j) is example i dotted with example j — a table of how alike the two EXAMPLES are, which for this X is [[5, 2], [2, 10]]. X.T @ X is (3, 2) @ (2, 3) giving (3, 3), whose entry (i, j) is feature i dotted with feature j — a table of how alike the three FEATURES are, which is [[1, 2, 0], [2, 5, 3], [0, 3, 9]]. Both are symmetric, as any such table must be. Option 0 is the habit worth breaking: "just transpose it until it runs" trades a loud failure for a quiet wrong answer, and the shape error was telling you something useful. Option 3 would have you pick on an irrelevance. The general discipline when a shape error appears is to print the two shapes, look only at the inner two numbers, work out which table you actually wanted, and then write that.'

  - question: 'In NumPy, multiplying two 200 by 200 float64 arrays with `@` is dramatically faster than multiplying two int64 arrays of the same shape and the same values. Why?'
    options:
      - 'Floating-point numbers occupy less memory than 64-bit integers'
      - 'BLAS implements matrix multiply only for floating-point and complex types, so the integer case never reaches it'
      - 'NumPy checks every integer entry for overflow, and those checks dominate the time'
      - 'Integer arrays are stored as Python objects rather than as a contiguous block'
    answer_index: 1
    explanation: 'This was measured while writing the lesson rather than assumed, and it contradicted the expectation. On the authoring machine the same 200 by 200 product took 0.002479 s as int64 and 0.000037 s as float64 — the float version 66 times faster, with identical shapes, identical values and the identical operator. The reason is that NumPy does not implement floating-point matrix multiplication itself; it hands the work to BLAS, whose matrix-multiply routines are defined only for float and complex types. An int64 product therefore falls back to NumPy own compiled C loop — far better than interpreted Python, and nowhere near BLAS. This is why the usual answer to "why is NumPy fast?" — because it is C — is wrong: the int64 row IS C, and it is the slow NumPy row. Option 0 is false; both are 8 bytes here. Option 2 is false; NumPy integer arithmetic wraps silently with no checks at all, which is a separate hazard worth knowing. Option 3 describes a Python list, not a NumPy array. The practical rule: if a matrix multiply is slower than you expected, check the dtype before anything else.'

  - question: 'A network layer computes `X @ W + b`, where X is (64, 3) — a batch of 64 examples — and W is (3, 2). What shape must b have?'
    options:
      - '(64,), one bias per example in the batch'
      - '(64, 2), a separate bias for every example and every output'
      - '(2,), one bias per output unit'
      - '(3,), one bias per input feature'
    answer_index: 2
    explanation: 'X @ W is (64, 3) @ (3, 2), which gives (64, 2). The bias has one entry per OUTPUT unit, so it is (2,), and broadcasting adds that same pair of numbers to every one of the 64 rows: lining (64, 2) up against (2,) pads to (1, 2), the trailing 2s match, and the 1 stretches down the rows. The test that settles it is to grow the batch — the bias belongs to the layer, not to the data, so going from 64 examples to 640 changes the shape of X and nothing else. That independence is exactly what makes batching worth doing: the same weights and the same bias are reused across every example in a single multiply, and each row is computed without reference to any other. Option 0 is the tempting wrong answer because 64 is the number you were just looking at. Getting this wrong does at least raise a ValueError naming both shapes rather than failing silently — one of the few places in this area where you are told.'

  - question: 'You stack two layers with no activation function between them: first `X @ W1 + b1`, then that result `@ W2 + b2`. What have you built?'
    options:
      - 'A genuinely two-layer network, since two matrix multiplies are strictly more expressive than one'
      - 'Something that will raise a shape error, because layers cannot be chained directly'
      - 'A network that is harder to train but ultimately more capable'
      - 'Exactly one layer: the pair collapses into a single matrix and a single bias'
    answer_index: 3
    explanation: 'Associativity does something uncomfortable here. X @ (W1 @ W2) + (b1 @ W2 + b2) produces exactly the same numbers as running the two layers in turn — the lab asserts it entry for entry. So the two layers collapse into one matrix W1 @ W2 and one bias, and this holds however deep you make the stack: a chain of pure matrix multiplies is just one matrix multiply. Depth buys nothing without something non-linear in between. That is not a design preference or a rule of thumb; it is a theorem, and it is the reason activation functions exist and sit BETWEEN layers rather than being folded into them. It also draws the boundary of what this operation can express: matrix multiplication can only represent transformations where scaling the input scales the output and adding inputs adds outputs. Anything else — a threshold, a maximum, a comparison — is not a matrix and cannot be made into one. Adding a single ReLU between the two layers breaks the collapse immediately, which is worth demonstrating for yourself.'
