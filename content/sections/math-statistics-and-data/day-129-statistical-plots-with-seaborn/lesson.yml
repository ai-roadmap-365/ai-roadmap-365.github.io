id: D129
day: 129
slug: statistical-plots-with-seaborn
title: 'Statistical Plots with seaborn'
section: math-statistics-and-data
subsection: data-analysis
week: 19
learning_promise: >-
  After this lesson you will be able to explain that a barplot draws a computed group mean with a
  bootstrapped confidence interval rather than any raw value, and demonstrate a case where that hides
  what mattered; tell an axes-level seaborn function (which draws into an Axes you own and returns it)
  from a figure-level function (which creates and owns its own Figure and returns a FacetGrid) by their
  return types; demonstrate that seaborn's default error bar is a random bootstrap and fix it with
  seed=; compare errorbar= options including 'sd', ('ci', 95), ('pi', 95) and 'se'; convert wide data to
  the long form seaborn's hue, col and row mappings require, using Day 124's melt; facet a plot with
  col=/row= and read how many Axes a facet grid produced; overlay raw points on an aggregated chart as
  the honest form for a small sample; use the Day 128 matplotlib object API as seaborn's escape hatch;
  and know that set_theme() is a global side effect on matplotlib's rcParams.
objectives:
  - 'Demonstrate that a barplot''s bar heights are group means -- not any value present in the raw data -- and recover the individual observations a bar chart hides with a stripplot or swarmplot of the same column'
  - 'Distinguish axes-level seaborn functions (scatterplot, histplot, boxplot: draw into an Axes, return that Axes) from figure-level functions (relplot, displot, catplot, lmplot: create and own their own Figure, return a FacetGrid) by their return types, and explain why ax= works on one family and not the other'
  - 'Demonstrate that two unseeded barplot calls produce bootstrapped error bars of slightly different extent, and that a fixed seed= makes two runs identical'
  - 'Compare errorbar=''sd'', errorbar=(''ci'', 95), errorbar=(''pi'', 95) and errorbar=''se'' on the same data and state which are closed-form statistics versus bootstrapped resampling procedures'
  - 'Convert a wide DataFrame to seaborn''s required long (tidy) form with melt, and explain why hue, col and row mappings read column names that only exist once the data is long'
  - 'Use hue, size, style and col=/row= faceting, and read exactly how many Axes a FacetGrid produced from the number of categories and from col_wrap'
  - 'Choose between boxplot, violinplot and stripplot/swarmplot for a given sample size, and state the honest recommendation of overlaying raw points on a box for a small sample'
  - 'Use the Day 128 matplotlib object API (ax.set_ylabel, ax.set_ylim, and similar) as the escape hatch after a seaborn call has already drawn, on both axes-level and figure-level results'
  - 'Explain that sns.set_theme() and its context/palette arguments mutate matplotlib''s global rcParams as a side effect that persists for every plot drawn afterwards, seaborn or not, until explicitly reset'
  - 'State which of seaborn, matplotlib, plotnine and Altair/Vega-Lite is the better choice for a given plotting task, and which of the four were actually run to produce this lesson''s output versus described from documentation'
prerequisites:
  - 'Day 117 -- sampling and the Central Limit Theorem, specifically the bootstrap resampling technique that reappears in this lesson, unannounced, as barplot''s default error bar'
  - 'Day 124 -- merging and reshaping, specifically melt, the exact operation this lesson uses to turn wide data into the long form seaborn requires'
  - 'Day 127 -- why to visualize and how to choose a chart type; this lesson assumes that decision is already made and focuses on what seaborn actually computes and draws'
  - 'Day 128 -- matplotlib''s object model (fig, ax = plt.subplots(), the Figure/Axes/Artist hierarchy, and testing by asserting on artists), which this lesson''s escape hatch and every artist-level claim depend on directly'
  - 'A working python3 on your PATH; the lab creates its own virtual environment with seaborn 0.13.2 and matplotlib 3.11.1 pinned exactly'
reading_time_minutes: 60
practical_time_minutes: 50
