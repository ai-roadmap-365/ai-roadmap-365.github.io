<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a statistical plotting layer is not</title>
  <style>
    .sns-not-bg   { fill: #f8fafc; }
    .sns-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sns-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sns-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sns-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sns-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sns-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sns-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sns-not-row { opacity: 1; }
    .sns-not-r0 { animation-delay: 0.00s; }
    .sns-not-r1 { animation-delay: 0.45s; }
    .sns-not-r2 { animation-delay: 0.90s; }
    .sns-not-r3 { animation-delay: 1.35s; }
    .sns-not-r4 { animation-delay: 1.80s; }
    .sns-not-row { animation: sns-not-reveal 7.3s ease-in-out infinite; }
    @keyframes sns-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sns-not-bg" width="980" height="390"/>
  <text class="sns-not-h1"  x="30" y="40">Four things a statistical plotting layer is not</text>
  <text class="sns-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="sns-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sns-not-name" x="46" y="122">The misconception</text>
  <text class="sns-not-desc" x="46" y="142">Commonly held.</text>
  <text class="sns-not-desc sns-not-row sns-not-r0" x="46" y="182">It replaces the underlying library</text>
  <text class="sns-not-desc sns-not-row sns-not-r1" x="46" y="216">Wide data works as well as long</text>
  <text class="sns-not-desc sns-not-row sns-not-r2" x="46" y="250">The default statistics are always right</text>
  <text class="sns-not-desc sns-not-row sns-not-r3" x="46" y="284">A confidence band is a prediction band</text>
  <text class="sns-not-desc sns-not-row sns-not-r4" x="46" y="318">Box plots show the distribution</text>
  <rect class="sns-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sns-not-name" x="526" y="122">What is true</text>
  <text class="sns-not-desc" x="526" y="142">Actually.</text>
  <text class="sns-not-desc sns-not-row sns-not-r0" x="526" y="182">It builds on it; you still need it</text>
  <text class="sns-not-desc sns-not-row sns-not-r1" x="526" y="216">Long form is what it expects</text>
  <text class="sns-not-desc sns-not-row sns-not-r2" x="526" y="250">Check which transform is applied</text>
  <text class="sns-not-desc sns-not-row sns-not-r3" x="526" y="284">They mean different things entirely</text>
  <text class="sns-not-desc sns-not-row sns-not-r4" x="526" y="318">They hide multimodality; add the points</text>
  <text class="sns-not-sub" x="30" y="372">Box plots hiding multimodality is a real limitation, and overlaying the individual observations costs one argument and prevents a genuine misreading.</text>
</svg>
