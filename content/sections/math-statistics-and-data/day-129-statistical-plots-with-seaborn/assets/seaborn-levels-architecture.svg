<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" width="1220" height="700" role="img" aria-labelledby="d129aTitleId d129aDescId">
  <title id="d129aTitleId">Two families of seaborn function -- axes-level functions draw into an Axes you own, figure-level functions own their own Figure and return a FacetGrid</title>
  <desc id="d129aDescId">On the left, an axes-level function such as scatterplot, histplot or boxplot draws into a matplotlib Axes the caller already created with fig, ax = plt.subplots(), and returns that same Axes; the caller keeps full control of the Figure, and matplotlib calls like ax.set_ylabel work directly afterward. On the right, a figure-level function such as relplot, displot, catplot or lmplot is called with no ax= argument, creates and owns a brand new Figure internally, arranges one or more Axes inside it, and returns a FacetGrid wrapping that Figure; a plt.title call made by the caller afterward affects the wrong, previously current, figure instead.</desc>

  <style>
    .d129a-bg        { fill: #f8fafc; }
    .d129a-title     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d129a-sub       { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
    .d129a-stage     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; font-weight: 700; fill: #1d4ed8; letter-spacing: 0.5px; }
    .d129a-label     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 700; fill: #1a202c; }
    .d129a-small     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d129a-mono      { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d129a-mono-b    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1a202c; }
    .d129a-caption   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d129a-callout   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #1d4ed8; }
    .d129a-box       { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
    .d129a-box-fn    { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.75; }
    .d129a-box-ret   { fill: #dcfce7; stroke: #047857; stroke-width: 1.75; }
    .d129a-mini-ax   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
    .d129a-panel     { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d129a-arrow     { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#d129a-arrowhead); }
    .d129a-arrow-grey { stroke: #64748b; stroke-width: 1.75; fill: none; marker-end: url(#d129a-arrowhead-grey); stroke-dasharray: 4 3; }
    .d129a-divider   { stroke: #cbd5e1; stroke-width: 1.25; stroke-dasharray: 6 5; }
  </style>

  <defs>
    <marker id="d129a-arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#1d4ed8" />
    </marker>
    <marker id="d129a-arrowhead-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="d129a-bg" x="0" y="0" width="1220" height="700" />

  <text class="d129a-title" x="24" y="34">Two families of seaborn function</text>
  <text class="d129a-sub" x="24" y="56">The single most confusing thing in the library, settled by what each family returns</text>

  <line class="d129a-divider" x1="610" y1="76" x2="610" y2="660" />

  <!-- ===================== LEFT: AXES-LEVEL ===================== -->
  <text class="d129a-stage" x="40" y="92">AXES-LEVEL -- scatterplot, histplot, boxplot, lineplot, stripplot...</text>

  <g transform="translate(40,110)">
    <rect class="d129a-box" x="0" y="0" width="230" height="52" rx="6" />
    <text class="d129a-mono" x="12" y="22">fig, ax =</text>
    <text class="d129a-mono" x="12" y="40">plt.subplots()</text>
    <text class="d129a-small" x="242" y="20">you create the Figure</text>
    <text class="d129a-small" x="242" y="38">and the Axes yourself</text>
  </g>

  <line class="d129a-arrow" x1="155" y1="162" x2="155" y2="196" />

  <g transform="translate(40,198)">
    <rect class="d129a-box-fn" x="0" y="0" width="230" height="58" rx="6" />
    <text class="d129a-mono-b" x="12" y="24">sns.scatterplot(</text>
    <text class="d129a-mono-b" x="24" y="42">data=df, ax=ax)</text>
  </g>

  <line class="d129a-arrow" x1="155" y1="256" x2="155" y2="290" />

  <g transform="translate(40,292)">
    <rect class="d129a-box-ret" x="0" y="0" width="230" height="52" rx="6" />
    <text class="d129a-mono-b" x="12" y="22">returns ax</text>
    <text class="d129a-mono" x="12" y="40">type: Axes</text>
  </g>

  <!-- feedback loop: the returned ax IS the same ax, so escape-hatch calls land on it -->
  <path class="d129a-arrow" d="M 270 318 C 340 318, 340 224, 270 224" />
  <text class="d129a-callout" x="346" y="188">it is the SAME</text>
  <text class="d129a-callout" x="346" y="204">Axes object --</text>
  <text class="d129a-callout" x="346" y="220">result is ax</text>

  <g transform="translate(40,368)">
    <rect class="d129a-panel" x="0" y="0" width="530" height="120" rx="6" />
    <text class="d129a-label" x="16" y="24">what this buys you</text>
    <text class="d129a-small" x="16" y="46">- You choose the Figure size, DPI and layout up front.</text>
    <text class="d129a-small" x="16" y="66">- ax.set_ylabel(...), ax.set_ylim(...), any Day 128</text>
    <text class="d129a-small" x="16" y="84">  matplotlib method works immediately afterward --</text>
    <text class="d129a-small" x="16" y="102">  the "escape hatch" this lesson relies on throughout.</text>
  </g>

  <g transform="translate(40,510)">
    <rect class="d129a-panel" x="0" y="0" width="530" height="120" rx="6" />
    <text class="d129a-label" x="16" y="24">the trap</text>
    <text class="d129a-small" x="16" y="46">- Faceting by hand (multiple team/quarter panels) means</text>
    <text class="d129a-small" x="16" y="66">  you manage plt.subplots(nrows, ncols) yourself.</text>
    <text class="d129a-small" x="16" y="86">- No hue=/col= convenience across a whole grid of panels --</text>
    <text class="d129a-small" x="16" y="104">  that convenience is what the other family exists for.</text>
  </g>

  <!-- ===================== RIGHT: FIGURE-LEVEL ===================== -->
  <text class="d129a-stage" x="650" y="92">FIGURE-LEVEL -- relplot, displot, catplot, lmplot</text>

  <g transform="translate(650,110)">
    <rect class="d129a-box-fn" x="0" y="0" width="230" height="58" rx="6" />
    <text class="d129a-mono-b" x="12" y="24">sns.catplot(</text>
    <text class="d129a-mono-b" x="24" y="42">data=df, col="region")</text>
    <text class="d129a-small" x="242" y="24">no ax= argument</text>
    <text class="d129a-small" x="242" y="42">accepted at all</text>
  </g>

  <line class="d129a-arrow" x1="765" y1="168" x2="765" y2="200" />

  <g transform="translate(650,202)">
    <rect class="d129a-box" x="0" y="0" width="230" height="56" rx="6" />
    <text class="d129a-mono" x="12" y="22">creates its OWN</text>
    <text class="d129a-mono-b" x="12" y="40">new Figure, internally</text>
  </g>

  <line class="d129a-arrow" x1="765" y1="258" x2="765" y2="290" />

  <!-- the grid of small axes the new Figure owns -->
  <g transform="translate(650,292)">
    <rect class="d129a-panel" x="0" y="0" width="530" height="120" rx="6" />
    <text class="d129a-label" x="16" y="22">the new Figure, holding one Axes per category</text>
    <g transform="translate(16,32)">
      <rect class="d129a-mini-ax" x="0" y="0" width="98" height="72" />
      <rect class="d129a-mini-ax" x="108" y="0" width="98" height="72" />
      <rect class="d129a-mini-ax" x="216" y="0" width="98" height="72" />
      <rect class="d129a-mini-ax" x="324" y="0" width="98" height="72" />
      <rect class="d129a-mini-ax" x="432" y="0" width="98" height="72" />
      <text class="d129a-small" x="18" y="40">North</text>
      <text class="d129a-small" x="126" y="40">South</text>
      <text class="d129a-small" x="238" y="40">East</text>
      <text class="d129a-small" x="348" y="40">West</text>
      <text class="d129a-small" x="440" y="40">Central</text>
    </g>
  </g>

  <line class="d129a-arrow" x1="765" y1="412" x2="765" y2="444" />

  <g transform="translate(650,446)">
    <rect class="d129a-box-ret" x="0" y="0" width="230" height="52" rx="6" />
    <text class="d129a-mono-b" x="12" y="22">returns grid</text>
    <text class="d129a-mono" x="12" y="40">type: FacetGrid</text>
  </g>

  <path class="d129a-arrow-grey" d="M 900 472 C 990 472, 990 316, 900 316" />
  <text class="d129a-callout" x="960" y="200">grid.figure is the</text>
  <text class="d129a-callout" x="960" y="216">new Figure; grid.axes</text>
  <text class="d129a-callout" x="960" y="232">is the array of 5 Axes</text>

  <g transform="translate(650,530)">
    <rect class="d129a-panel" x="0" y="0" width="530" height="100" rx="6" />
    <text class="d129a-label" x="16" y="24">the trap</text>
    <text class="d129a-small" x="16" y="46">plt.title("...") after this call titles whatever Figure</text>
    <text class="d129a-small" x="16" y="66">was current BEFORE catplot ran -- not the grid's own new</text>
    <text class="d129a-small" x="16" y="86">Figure. Use grid.figure.suptitle(...) or grid.set(title=...) instead.</text>
  </g>

  <g transform="translate(650,650)">
    <text class="d129a-caption" x="0" y="0">col_wrap= reshapes the grid above (e.g. 2 rows of 3) without changing how many Axes exist.</text>
  </g>
</svg>
