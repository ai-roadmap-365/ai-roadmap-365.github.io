<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And what each shows.">
  <title>Four statistical plots worth knowing</title>
  <style>
    .sns-plots-bg   { fill: #f8fafc; }
    .sns-plots-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-plots-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-plots-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-plots-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-plots-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-plots-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sns-plots-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sns-plots-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sns-plots-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sns-plots-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sns-plots-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sns-plots-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sns-plots-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sns-plots-stage { opacity: 1; }

    .sns-plots-s0 { animation-delay: 0.00s; }
    .sns-plots-e0 { animation-delay: 0.00s; }
    .sns-plots-s1 { animation-delay: 1.28s; }
    .sns-plots-e1 { animation-delay: 1.28s; }
    .sns-plots-s2 { animation-delay: 2.56s; }
    .sns-plots-e2 { animation-delay: 2.56s; }
    .sns-plots-s3 { animation-delay: 3.84s; }
    .sns-plots-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sns-plots-conn  { animation: sns-plots-trace 6.4s ease-in-out infinite; }
      .sns-plots-stage { animation: sns-plots-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sns-plots-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sns-plots-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sns-plots-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sns-plots-stage { animation: sns-plots-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sns-plots-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sns-plots-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sns-plots-bg" width="980" height="322"/>
  <text class="sns-plots-h1"  x="30" y="40">Four statistical plots worth knowing</text>
  <text class="sns-plots-sub" x="30" y="64">And what each shows.</text>
  <g class="sns-plots-stage sns-plots-s0">
    <rect class="sns-plots-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sns-plots-step" x="44" y="142">01</text>
    <text class="sns-plots-name" x="70" y="142">Distribution plots: the shape of one variable</text>
    <text class="sns-plots-desc" x="44" y="166">Histogram, density, cumulative.</text>
  </g>
  <line class="sns-plots-line sns-plots-conn sns-plots-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sns-plots-tip)"/>
  <g class="sns-plots-stage sns-plots-s1">
    <rect class="sns-plots-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sns-plots-step" x="280" y="142">02</text>
    <text class="sns-plots-name" x="306" y="142">Categorical plots: distributions across groups</text>
    <text class="sns-plots-desc" x="280" y="166">Box, violin, strip.</text>
  </g>
  <line class="sns-plots-line sns-plots-conn sns-plots-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sns-plots-tip)"/>
  <g class="sns-plots-stage sns-plots-s2">
    <rect class="sns-plots-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sns-plots-step" x="516" y="142">03</text>
    <text class="sns-plots-name" x="542" y="142">Relationship plots: two variables together</text>
    <text class="sns-plots-desc" x="516" y="166">Scatter, with an optional fit.</text>
  </g>
  <line class="sns-plots-line sns-plots-conn sns-plots-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sns-plots-tip)"/>
  <g class="sns-plots-stage sns-plots-s3">
    <rect class="sns-plots-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sns-plots-step" x="752" y="142">04</text>
    <text class="sns-plots-name" x="778" y="142">And pair plots: every pair at once</text>
    <text class="sns-plots-desc" x="752" y="166">Which is the fastest first look.</text>
  </g>
  <text class="sns-plots-sub" x="30" y="304">A pair plot on a modest number of columns is the single most efficient first look at a dataset, and it routinely surfaces relationships nobody expected.</text>
</svg>
