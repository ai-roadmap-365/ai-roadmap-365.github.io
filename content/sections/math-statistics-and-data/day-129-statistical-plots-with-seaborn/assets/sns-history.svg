<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward grammar.">
  <title>Four steps toward statistical graphics libraries</title>
  <style>
    .sns-history-bg   { fill: #f8fafc; }
    .sns-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sns-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sns-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sns-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sns-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sns-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sns-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sns-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sns-history-stage { opacity: 1; }

    .sns-history-s0 { animation-delay: 0.00s; }
    .sns-history-e0 { animation-delay: 0.00s; }
    .sns-history-s1 { animation-delay: 1.28s; }
    .sns-history-e1 { animation-delay: 1.28s; }
    .sns-history-s2 { animation-delay: 2.56s; }
    .sns-history-e2 { animation-delay: 2.56s; }
    .sns-history-s3 { animation-delay: 3.84s; }
    .sns-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sns-history-conn  { animation: sns-history-trace 6.4s ease-in-out infinite; }
      .sns-history-stage { animation: sns-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sns-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sns-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sns-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sns-history-stage { animation: sns-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sns-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sns-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sns-history-bg" width="980" height="322"/>
  <text class="sns-history-h1"  x="30" y="40">Four steps toward statistical graphics libraries</text>
  <text class="sns-history-sub" x="30" y="64">Toward grammar.</text>
  <g class="sns-history-stage sns-history-s0">
    <rect class="sns-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sns-history-step" x="44" y="142">01</text>
    <text class="sns-history-name" x="70" y="142">Low-level libraries drawing exactly what you specify</text>
    <text class="sns-history-desc" x="44" y="166">Flexible, and verbose.</text>
  </g>
  <line class="sns-history-line sns-history-conn sns-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sns-history-tip)"/>
  <g class="sns-history-stage sns-history-s1">
    <rect class="sns-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sns-history-step" x="280" y="142">02</text>
    <text class="sns-history-name" x="306" y="142">Then conventions for common statistical charts</text>
    <text class="sns-history-desc" x="280" y="166">Which encoded good defaults.</text>
  </g>
  <line class="sns-history-line sns-history-conn sns-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sns-history-tip)"/>
  <g class="sns-history-stage sns-history-s2">
    <rect class="sns-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sns-history-step" x="516" y="142">03</text>
    <text class="sns-history-name" x="542" y="142">Then the grammar of graphics as a formal idea</text>
    <text class="sns-history-desc" x="516" y="166">Data mapped to encodings.</text>
  </g>
  <line class="sns-history-line sns-history-conn sns-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sns-history-tip)"/>
  <g class="sns-history-stage sns-history-s3">
    <rect class="sns-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sns-history-step" x="752" y="142">04</text>
    <text class="sns-history-name" x="778" y="142">And Python implementations of that grammar</text>
    <text class="sns-history-desc" x="752" y="166">Which is where the field is</text>
    <text class="sns-history-desc" x="752" y="182">heading.</text>
  </g>
  <text class="sns-history-sub" x="30" y="304">The grammar's contribution was conceptual: it replaced a catalogue of named chart types with a small set of composable mappings.</text>
</svg>
