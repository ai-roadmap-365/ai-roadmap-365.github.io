<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img" aria-labelledby="d129fTitleId d129fDescId">
  <title id="d129fTitleId">What a bar actually represents -- raw observations reduced to an estimator, and a bootstrap resample producing the error bar drawn around it</title>
  <desc id="d129fDescId">Four raw observations for one group -- 90, 88, 92 and 10 -- travel down into a reduction step that computes their mean, 70.0, which becomes the bar's height. In parallel, the same four observations are resampled with replacement many times; each resample's own mean is plotted as a small dot, and the spread of those dots becomes the bootstrapped error bar drawn on top of the bar. A caption states that the bar shows the mean and the error bar shows how much that mean would wobble on a different sample of the same size -- and that both numbers are computed, not read directly off any one observation. With motion disabled, every token, the reduction arrow, the scatter of resampled means and the final bar and error bar are all shown already in their finished positions.</desc>

  <style>
    .d129f-bg      { fill: #f8fafc; }
    .d129f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d129f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
    .d129f-stage   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #1d4ed8; letter-spacing: 0.5px; }
    .d129f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 700; fill: #1a202c; }
    .d129f-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d129f-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d129f-mono-b  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #1a202c; }
    .d129f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
    .d129f-obs     { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
    .d129f-reduce  { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.75; }
    .d129f-bar-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d129f-bar     { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 1.5; }
    .d129f-wire    { stroke: #64748b; stroke-width: 1.75; fill: none; stroke-dasharray: 8 6; animation: d129f-march 1.4s linear infinite; }
    .d129f-wire-out { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#d129f-arrow-blue); }
    @keyframes d129f-march { to { stroke-dashoffset: -14; } }

    /* Motion 1: the four raw observation tokens travel down into the reducer, resting visible at their start row. */
    .d129f-obs-token { animation: d129f-fall 5.5s ease-in-out infinite; }
    .d129f-obs-1 { animation-delay: 0s; }
    .d129f-obs-2 { animation-delay: 0.3s; }
    .d129f-obs-3 { animation-delay: 0.6s; }
    .d129f-obs-4 { animation-delay: 0.9s; }
    @keyframes d129f-fall {
      0%   { transform: translateY(0);    opacity: 1; }
      18%  { transform: translateY(0);    opacity: 1; }
      42%  { transform: translateY(120px); opacity: 1; }
      100% { transform: translateY(120px); opacity: 1; }
    }

    /* Motion 2: the reducer box pulses once the tokens arrive. */
    .d129f-reduce-pulse { animation: d129f-pulse 5.5s ease-in-out infinite; transform-origin: 405px 300px; }
    @keyframes d129f-pulse {
      0%, 44%  { filter: none; }
      50%, 58% { filter: brightness(1.15); }
      66%, 100% { filter: none; }
    }

    /* Motion 3: the resampled-mean dots appear one at a time, scattering around 70. */
    .d129f-resample-dot { animation: d129f-appear 5.5s ease-in-out infinite; opacity: 0.85; }
    .d129f-rs-1 { animation-delay: 1.0s; }
    .d129f-rs-2 { animation-delay: 1.15s; }
    .d129f-rs-3 { animation-delay: 1.3s; }
    .d129f-rs-4 { animation-delay: 1.45s; }
    .d129f-rs-5 { animation-delay: 1.6s; }
    .d129f-rs-6 { animation-delay: 1.75s; }
    .d129f-rs-7 { animation-delay: 1.9s; }
    .d129f-rs-8 { animation-delay: 2.05s; }
    @keyframes d129f-appear {
      0%, 18%  { opacity: 0; r: 2; }
      22%      { opacity: 0.85; r: 4; }
      100%     { opacity: 0.85; r: 4; }
    }

    /* Motion 4: the error-bar whiskers grow from zero to their final extent once the resample completes. */
    .d129f-errorbar { animation: d129f-grow 5.5s ease-in-out infinite; transform-origin: 940px 300px; }
    @keyframes d129f-grow {
      0%, 60%  { transform: scaleY(0.05); opacity: 0.4; }
      78%, 100% { transform: scaleY(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d129f-obs-token, .d129f-reduce-pulse, .d129f-resample-dot, .d129f-errorbar, .d129f-wire {
        animation: none !important;
      }
      .d129f-obs-token { transform: translateY(120px); opacity: 1; }
      .d129f-resample-dot { opacity: 0.85; r: 4; }
      .d129f-errorbar { transform: scaleY(1); opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d129f-arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d129f-bg" x="0" y="0" width="1080" height="720" />

  <text class="d129f-title" x="24" y="34">What a bar actually represents</text>
  <text class="d129f-sub" x="24" y="56">Team B's four raw scores -- reduced to a mean, and resampled to build the error bar drawn around it</text>

  <text class="d129f-stage" x="40" y="92">1. FOUR RAW OBSERVATIONS</text>

  <!-- four raw observation tokens, team B: 90, 88, 92, 10 -->
  <g transform="translate(40,110)">
    <g class="d129f-obs-token d129f-obs-1">
      <rect class="d129f-obs" x="0" y="0" width="120" height="40" rx="6" />
      <text class="d129f-mono-b" x="46" y="26">90</text>
    </g>
  </g>
  <g transform="translate(40,160)">
    <g class="d129f-obs-token d129f-obs-2">
      <rect class="d129f-obs" x="0" y="0" width="120" height="40" rx="6" />
      <text class="d129f-mono-b" x="46" y="26">88</text>
    </g>
  </g>
  <g transform="translate(40,210)">
    <g class="d129f-obs-token d129f-obs-3">
      <rect class="d129f-obs" x="0" y="0" width="120" height="40" rx="6" />
      <text class="d129f-mono-b" x="46" y="26">92</text>
    </g>
  </g>
  <g transform="translate(40,260)">
    <g class="d129f-obs-token d129f-obs-4">
      <rect class="d129f-obs" x="0" y="0" width="120" height="40" rx="6" />
      <text class="d129f-mono-b" x="46" y="26">10</text>
    </g>
  </g>
  <text class="d129f-small" x="40" y="440">Four real scores recorded for team B. One (10) is an outlier</text>
  <text class="d129f-small" x="40" y="458">that will drag the mean well below the other three.</text>

  <!-- wires from observations into the reducer -->
  <path class="d129f-wire" d="M 170 130 L 300 260" />
  <path class="d129f-wire" d="M 170 180 L 300 270" />
  <path class="d129f-wire" d="M 170 230 L 300 290" />
  <path class="d129f-wire" d="M 170 280 L 300 310" />

  <text class="d129f-stage" x="330" y="92">2. REDUCED TO AN ESTIMATOR</text>

  <g class="d129f-reduce-pulse" transform="translate(300,240)">
    <rect class="d129f-reduce" x="0" y="0" width="210" height="120" rx="8" />
    <text class="d129f-small" x="14" y="26">estimator = mean</text>
    <text class="d129f-mono-b" x="14" y="58">(90+88+92+10)/4</text>
    <text class="d129f-mono-b" x="14" y="84">= 70.0</text>
    <text class="d129f-small" x="14" y="106">this is the bar's height</text>
  </g>

  <line class="d129f-wire-out" x1="510" y1="300" x2="600" y2="300" />

  <text class="d129f-stage" x="620" y="92">3. THE BAR, WITH A BOOTSTRAPPED INTERVAL</text>

  <!-- the drawn bar -->
  <g transform="translate(620,180)">
    <rect class="d129f-bar-box" x="0" y="0" width="150" height="260" />
    <!-- bar height proportional: 70 out of a 0-100 axis, drawn from bottom -->
    <rect class="d129f-bar" x="30" y="78" width="90" height="182" />
    <text class="d129f-mono" x="34" y="70">70.0</text>
    <!-- error bar whisker, grown by animation -->
    <g class="d129f-errorbar">
      <line x1="75" y1="55" x2="75" y2="101" stroke="#1a202c" stroke-width="2.25" />
      <line x1="60" y1="55" x2="90" y2="55" stroke="#1a202c" stroke-width="2.25" />
      <line x1="60" y1="101" x2="90" y2="101" stroke="#1a202c" stroke-width="2.25" />
    </g>
  </g>
  <text class="d129f-small" x="620" y="460">The bar height (70.0) is the mean from step 2.</text>
  <text class="d129f-small" x="620" y="478">The whisker above it is the bootstrapped 95% CI from step 4.</text>

  <text class="d129f-stage" x="800" y="92">4. THE BOOTSTRAP THAT BUILDS THE INTERVAL</text>

  <g transform="translate(800,110)">
    <rect class="d129f-bar-box" x="0" y="0" width="230" height="150" rx="6" />
    <text class="d129f-small" x="12" y="22">resample the 4 scores</text>
    <text class="d129f-small" x="12" y="40">with replacement, many</text>
    <text class="d129f-small" x="12" y="58">times; plot each resample's</text>
    <text class="d129f-small" x="12" y="76">own mean as a dot below</text>
    <!-- axis line for the dot scatter -->
    <line x1="12" y1="110" x2="218" y2="110" stroke="#94a3b8" stroke-width="1.25" />
    <circle class="d129f-resample-dot d129f-rs-1" cx="40" cy="108" r="4" fill="#1d4ed8" />
    <circle class="d129f-resample-dot d129f-rs-2" cx="58" cy="104" r="4" fill="#1d4ed8" />
    <circle class="d129f-resample-dot d129f-rs-3" cx="80" cy="112" r="4" fill="#1d4ed8" />
    <circle class="d129f-resample-dot d129f-rs-4" cx="100" cy="98" r="4" fill="#1d4ed8" />
    <circle class="d129f-resample-dot d129f-rs-5" cx="120" cy="106" r="4" fill="#1d4ed8" />
    <circle class="d129f-resample-dot d129f-rs-6" cx="140" cy="116" r="4" fill="#1d4ed8" />
    <circle class="d129f-resample-dot d129f-rs-7" cx="160" cy="100" r="4" fill="#1d4ed8" />
    <circle class="d129f-resample-dot d129f-rs-8" cx="184" cy="110" r="4" fill="#1d4ed8" />
    <text class="d129f-small" x="12" y="138">the SPREAD of these dots</text>
  </g>
  <text class="d129f-small" x="800" y="284">becomes the whisker in step 3. No seed= means a</text>
  <text class="d129f-small" x="800" y="302">different random resample, and a slightly different whisker,</text>
  <text class="d129f-small" x="800" y="320">every single time this call is made.</text>

  <path class="d129f-wire-out" d="M 800 185 C 760 185, 760 240, 700 260" />

  <g transform="translate(40,510)">
    <rect class="d129f-bar-box" x="0" y="0" width="1000" height="130" rx="6" />
    <text class="d129f-label" x="16" y="26">what got discarded</text>
    <text class="d129f-small" x="16" y="50">The bar and its whisker are both computed numbers -- 70.0 and a bootstrapped spread around it. Neither one</text>
    <text class="d129f-small" x="16" y="70">is any of the four raw scores 90, 88, 92 or 10, and neither shows that one of the four is an outlier.</text>
    <text class="d129f-small" x="16" y="90">A stripplot of the same four points, drawn instead of or alongside the bar, keeps every raw value visible --</text>
    <text class="d129f-small" x="16" y="110">which is exactly what this lesson's exercise 2 measures directly.</text>
  </g>

  <text class="d129f-caption" x="40" y="672">With motion disabled: every observation token, the reduction, the resampled dots and the error bar are all shown in their finished state.</text>
</svg>
