questions:
  - question: >-
      A `sns.barplot(data=df, x="team", y="score")` draws four bars, one per team. What does the height
      of each bar represent?
    options:
      - The mean of that team's scores, computed by seaborn before drawing
      - The largest score recorded for that team
      - The most recently recorded score for that team
      - The count of rows belonging to that team
    answer_index: 0
    explanation: >-
      `barplot`'s default estimator is the mean. The bar height is a computed statistic, not any single
      recorded value -- which is exactly the trap this lesson opens with: a team whose four scores are
      90, 88, 92 and 10 gets a bar at 70.0, a number none of its four observations equals, and that bar
      can end up lower than a much more consistent team's, even though three of the four scores are the
      best in the whole dataset.
  - question: >-
      `sns.scatterplot(data=df, x="a", y="b", ax=ax)` and `sns.relplot(data=df, x="a", y="b")` are both
      called on the same data. What is the key difference in what each one returns?
    options:
      - scatterplot returns None; relplot returns a DataFrame of computed statistics
      - scatterplot returns the Axes it was given; relplot returns a FacetGrid that owns its own Figure
      - Both return the same Axes object, just with different default styling
      - relplot returns an Axes; scatterplot returns a FacetGrid
    answer_index: 1
    explanation: >-
      scatterplot is axes-level: it draws into an Axes you already own (or creates one if you don't pass
      ax=) and returns that Axes. relplot is figure-level: it always creates and owns its own Figure,
      and returns a FacetGrid wrapping it -- which is why relplot does not accept ax= at all, and why
      plt.title() called after relplot appears to do nothing (it titles the wrong, now-current, Figure).
  - question: >-
      Two calls to `sns.barplot(data=df, x="team", y="score")` are made back to back, with no `seed=`
      argument passed to either. What should you expect about their error bars?
    options:
      - Identical extents every time, because barplot caches its computation
      - An exception on the second call, because seaborn refuses to redraw the same data twice
      - Slightly different extents, because the default error bar is a random bootstrap resample
      - Identical extents only if the data has fewer than five rows
    answer_index: 2
    explanation: >-
      seaborn's default error bar is a bootstrapped 95% confidence interval -- resampling the data with
      replacement many times and reporting the spread of the resulting means. Each call draws a fresh
      random sample unless a seed is fixed, so two unseeded calls on identical data can (and typically
      do) produce slightly different bar extents. Passing seed= to both calls makes them identical.
  - question: >-
      Which `errorbar=` value draws a fixed, non-random interval that does not change between two calls
      with different (or no) `seed=` values?
    options:
      - "('ci', 95) (a bootstrapped 95% confidence interval)"
      - "('pi', 95) (a bootstrapped 95% prediction interval)"
      - "The default value, whatever it happens to be"
      - "'sd' (one standard deviation)"
    answer_index: 3
    explanation: >-
      'sd' draws the sample standard deviation directly -- a closed-form arithmetic computation with no
      resampling step, so it is identical on every call regardless of any seed. ('ci', 95) and
      ('pi', 95) are both bootstrapped and therefore random unless seeded.
  - question: >-
      A DataFrame has one row per region with separate q1, q2, q3 and q4 columns. Calling
      `sns.lineplot(data=df, x="quarter", y="revenue", hue="region")` on this frame directly raises an
      error. Why?
    options:
      - There is no column named "quarter" or "revenue" in this wide-form frame
      - seaborn only accepts NumPy arrays, never pandas DataFrames
      - hue= is not a valid argument to lineplot
      - The DataFrame has too many rows for lineplot to handle
    answer_index: 0
    explanation: >-
      seaborn's long-form interface reads x=, y= and hue= as literal column names. A wide frame with
      q1..q4 columns has no column called "quarter" or "revenue" -- those variables only exist once the
      frame is melted into one row per (region, quarter) observation, exactly the operation Day 124's
      melt performs.
  - question: >-
      `sns.catplot(data=df, x="quarter", y="revenue", col="region", kind="bar")` is called on data with
      5 distinct regions, then repeated with `col_wrap=3` added. What changes between the two calls?
    options:
      - The number of Axes drawn changes from 5 to 6
      - The number of Axes stays 5, but the grid reshapes from one row of 5 to two rows (3 and 2)
      - Nothing changes; col_wrap has no effect on catplot
      - col_wrap converts the figure-level plot into an axes-level plot
    answer_index: 1
    explanation: >-
      col= always produces exactly one Axes per category -- 5 Axes for 5 regions, in both calls.
      col_wrap only changes how those 5 Axes are arranged: without it, one row of 5; with col_wrap=3,
      the grid becomes 2 rows (3 in the first, 2 in the second), same 5 Axes throughout.
  - question: >-
      After `sns.boxplot(data=df, x="team", y="score", ax=ax)` has drawn, you call
      `ax.set_ylabel("Score (0-100 scale)")`. What happens?
    options:
      - Nothing -- seaborn locks the label and further calls to ax are ignored
      - It raises an error, because boxplot returns a FacetGrid, not an Axes
      - The label changes, because seaborn draws with matplotlib underneath and ax is a real matplotlib Axes
      - It changes the label on every other Axes in the same Figure
    answer_index: 2
    explanation: >-
      seaborn's axes-level functions draw into an ordinary matplotlib Axes and hand it back (or, if you
      passed ax=, mutate the one you gave them). Nothing about that Axes becomes special or locked --
      any matplotlib Axes method, called afterward, behaves exactly as it would on a plot you built by
      hand. This is the escape hatch: seaborn for the statistics, matplotlib's object API for anything
      seaborn doesn't expose an argument for.
  - question: >-
      Calling `sns.set_theme()` early in a notebook, then later drawing a plain `matplotlib.pyplot.plot`
      call with no seaborn involved at all, still shows seaborn's grid and background styling. Why?
    options:
      - matplotlib silently imports seaborn internally by default
      - This only happens inside Jupyter notebooks, never in a script
      - It is a bug that will be fixed in a future seaborn release
      - set_theme() mutates matplotlib's global rcParams, which every subsequent plot inherits regardless of which library draws it
    answer_index: 3
    explanation: >-
      set_theme() (and its lower-level equivalents, set_style() and set_context()) work by updating
      matplotlib's rcParams dictionary -- the same global configuration every matplotlib plot reads its
      defaults from. That is a real, intentional, and easily-forgotten global side effect: once called,
      it affects every plot drawn afterward in the same process, seaborn or plain matplotlib, until the
      rcParams are explicitly reset.
