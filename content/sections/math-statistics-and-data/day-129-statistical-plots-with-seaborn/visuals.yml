visuals:
  - id: seaborn-levels-architecture
    file: assets/seaborn-levels-architecture.svg
    type: diagram
    title: 'Two families of seaborn function -- axes-level functions draw into an Axes you own, figure-level functions own their own Figure and return a FacetGrid'
    alt: 'Diagram: on the left, an axes-level function such as scatterplot, histplot or boxplot draws into a matplotlib Axes the caller already created with fig, ax = plt.subplots(), and returns that same Axes; the caller keeps full control of the Figure, and matplotlib calls like ax.set_ylabel work directly afterward. On the right, a figure-level function such as relplot, displot, catplot or lmplot is called with no ax= argument, creates and owns a brand new Figure internally, arranges one or more Axes inside it, and returns a FacetGrid wrapping that Figure; a plt.title call made by the caller afterward affects the wrong, previously current, figure instead'
    description: >-
      A static architecture diagram in two halves, split by a vertical divider. On the left, "AXES-LEVEL",
      a box labelled fig, ax = plt.subplots() feeds an arrow down into sns.scatterplot(data=df, ax=ax),
      which feeds an arrow down into a green returns-ax box labelled type: Axes; a curved arrow loops back
      up labelling it "the SAME Axes object -- result is ax", with two panels below listing what this
      buys the caller (full control of Figure size and layout, and the Day 128 matplotlib escape hatch
      working immediately) and the trap (no hue=/col= convenience across a hand-managed grid of panels).
      On the right, "FIGURE-LEVEL", a box labelled sns.catplot(data=df, col="region") with a note "no ax=
      argument accepted at all" feeds an arrow down into a box labelled "creates its OWN new Figure,
      internally", which feeds an arrow down into a panel showing five small Axes rectangles labelled
      North, South, East, West and Central, which feeds an arrow down into a green returns-grid box
      labelled type: FacetGrid, with a dashed grey arrow looping back up to the five-Axes panel labelled
      "grid.figure is the new Figure; grid.axes is the array of 5 Axes", and a trap panel below warning
      that plt.title(...) after this call titles the wrong, previously current, figure instead of the
      grid's own new one. A caption at the bottom notes that col_wrap= reshapes the five-Axes grid without
      changing how many Axes exist.
  - id: estimator-flow
    file: assets/estimator-flow.svg
    type: flow-animated
    title: 'What a bar actually represents -- raw observations reduced to an estimator, and a bootstrap resample producing the error bar drawn around it'
    alt: 'Diagram: four raw observations for one group -- 90, 88, 92 and 10 -- travel down into a reduction step that computes their mean, 70.0, which becomes the bar''s height. In parallel, the same four observations are resampled with replacement many times; each resample''s own mean is plotted as a small dot, and the spread of those dots becomes the bootstrapped error bar drawn on top of the bar. A caption states that the bar shows the mean and the error bar shows how much that mean would wobble on a different sample of the same size -- and that both numbers are computed, not read directly off any one observation. With motion disabled, every token, the reduction arrow, the scatter of resampled means and the final bar and error bar are all shown already in their finished positions'
    description: >-
      An animated flow diagram, fully readable as a still image, in four stages left to right. Stage 1
      shows four raw-observation tokens (90, 88, 92, 10) falling from a stacked column toward stage 2, a
      "reduced to an estimator" box computing (90+88+92+10)/4 = 70.0 and labelled "this is the bar's
      height", which pulses once the tokens arrive. An arrow carries that number into stage 3, a drawn bar
      reaching height 70.0 on a 0-100 axis with a growing error-bar whisker on top. Stage 4, to the right,
      shows the bootstrap that builds that whisker: the same four scores resampled with replacement many
      times, each resample's own mean appearing one at a time as a dot along a small axis, captioned "the
      SPREAD of these dots becomes the whisker in step 3. No seed= means a different random resample, and
      a slightly different whisker, every single time this call is made." A bottom panel captioned "what
      got discarded" states that neither the bar nor its whisker is any of the four raw scores, that
      neither shows the outlier among them, and that a stripplot of the same four points keeps every raw
      value visible instead. A prefers-reduced-motion block freezes every token at its finished position,
      every resampled dot fully opaque, and the error bar at its full grown height, with no animation.
