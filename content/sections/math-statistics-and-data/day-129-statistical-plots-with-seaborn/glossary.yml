terms:
  - term: axes-level function
    definition: >-
      A seaborn plotting function (scatterplot, histplot, boxplot, lineplot, stripplot, and others) that
      draws into a single matplotlib Axes -- either one you pass with ax=, or a new one it creates -- and
      returns that Axes. Because the return value is an ordinary matplotlib Axes, every matplotlib Axes
      method (set_ylabel, set_xlim, and so on) works on it afterward.
  - term: figure-level function
    definition: >-
      A seaborn plotting function (relplot, displot, catplot, lmplot) that always creates and owns its
      own matplotlib Figure -- it does not accept ax= -- and returns a FacetGrid wrapping that Figure.
      Figure-level functions are how seaborn builds multi-panel facet grids; their return value is not a
      plain Axes, which is why matplotlib calls that expect an Axes (like some uses of plt.title) behave
      differently after one.
  - term: FacetGrid
    definition: >-
      The object every figure-level seaborn function returns. It owns a matplotlib Figure and an array of
      Axes (grid.axes), one per combination of the col= and row= categories requested, plus convenience
      methods for labeling and adjusting every panel at once.
  - term: estimator
    definition: >-
      The summary statistic a seaborn plotting function computes from raw observations before drawing --
      by default the mean, for functions like barplot and pointplot. Passing estimator= changes which
      statistic (for example, "median" or a custom callable) is drawn instead.
  - term: bootstrap (resampling)
    definition: >-
      A method for estimating the sampling variability of a statistic by repeatedly resampling the
      observed data with replacement, recomputing the statistic on each resample, and reading the spread
      of the results -- the same technique Day 117 introduced for the sampling distribution of the mean.
      seaborn's default error bar on barplot and pointplot is a bootstrapped confidence interval, which
      is why it is random unless a seed is fixed.
  - term: errorbar (parameter)
    definition: >-
      The seaborn keyword controlling which interval a statistical plot draws around its estimator.
      Accepts 'sd' (one standard deviation, a closed-form statistic), 'se' (standard error), or a tuple
      like ('ci', 95) or ('pi', 95) for a bootstrapped confidence or prediction interval at the given
      percentage. Only the tuple forms depend on the random bootstrap and therefore on seed=.
  - term: seed (in a seaborn call)
    definition: >-
      An integer passed to functions that compute a bootstrapped error bar (for example
      sns.barplot(..., seed=42)), fixing the random number generator's starting state so the same call on
      the same data produces an identical interval on every run. Omitting it means two runs of the same
      call can produce slightly different bar extents.
  - term: long-form (tidy) data
    definition: >-
      A table shaped with one row per observation and one column per variable -- the shape seaborn's
      hue=, size=, style=, col= and row= arguments require, because each one names a column that must
      exist. Day 124's melt is the standard way to convert a wide table (one row per group, one column
      per condition) into long form.
  - term: wide-form data
    definition: >-
      A table shaped with one row per group and multiple columns representing different conditions or
      time points (for example, one column per quarter). seaborn's long-form interface cannot read a
      variable that is spread across several column names, which is why hue= and similar arguments fail
      on wide data until it is melted into long form.
  - term: col= / row= (faceting)
    definition: >-
      Arguments to seaborn's figure-level functions that split the data into one small multiple (facet)
      per category of the named column, arranging one Axes per category into a grid. col_wrap= reshapes
      how many facets appear per row without changing how many facets exist in total.
  - term: strip plot / swarm plot
    definition: >-
      Plots that draw every individual observation as a point along a categorical axis (stripplot jitters
      points randomly to reduce overlap; swarmplot arranges them so none overlap) rather than reducing
      each group to a single summary statistic -- the natural counterpart to a barplot or boxplot when
      the sample size is small enough that individual points matter.
  - term: escape hatch (matplotlib object API)
    definition: >-
      The practice of calling matplotlib Axes and Figure methods directly (ax.set_ylabel, ax.set_ylim,
      fig.suptitle, and similar, from Day 128's object model) after a seaborn call has already drawn,
      to set anything seaborn's own arguments do not expose. Works because seaborn's return value -- an
      Axes for axes-level functions, a FacetGrid wrapping a Figure for figure-level ones -- is always a
      real matplotlib object underneath.
  - term: rcParams (global theme state)
    definition: >-
      matplotlib's global dictionary of default plotting settings (colors, grid visibility, font family,
      and more). sns.set_theme() (and the lower-level set_style()/set_context()) work by mutating this
      dictionary directly, so the change persists for every plot drawn afterward in the same process --
      seaborn or plain matplotlib -- until it is explicitly reset.
