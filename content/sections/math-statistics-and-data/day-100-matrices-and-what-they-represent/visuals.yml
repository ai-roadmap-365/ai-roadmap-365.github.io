visuals:
  - id: matrix-three-meanings-architecture
    file: assets/matrix-three-meanings-architecture.svg
    type: diagram
    title: 'One 3 by 4 matrix drawn three times: as a table of data, as a collection of row vectors, and as a transformation'
    alt: 'Diagram: one 3 by 4 matrix drawn three times — once as a labelled data table with named rows and columns, once as a stack of row vectors with arrows, and once as a transformation box taking a vector of length four in and returning a vector of length three out, with the shape rule and the worked arithmetic underneath'
    description: 'A static architecture diagram carrying the day''s whole argument in one picture: the same twelve numbers, drawn three times, with nothing about them changing between the three drawings. The left panel shows the matrix as a table of data, with named row headers Seedling, Container and Alpine down the side and named column headers base, bark, grit and compost across the top, the twelve entries 2 4 1 3, 0 5 2 7 and 6 1 4 2 filling the grid, and a caption noting that the shape is 3 by 4 with rows first, that M at position 2 comma 0 is 6, and that a paper would call that same entry a-31 because mathematics counts from 1 while the code counts from 0. The middle panel shows the same numbers as a collection of vectors: three coloured bars holding the bracketed rows, each with its own arrow leading out to the right, labelled as Seedling being one point in four dimensions, then Container and Alpine, under a caption saying that this is three row vectors of length 4 or four column vectors of length 3, a different set of vectors entirely. The right panel shows the matrix as a transformation, drawn as a vertical machine: an input box holding the price vector 10, 2, 5, 1 labelled length 4 and noted as one entry per column, an arrow down into a blue box labelled with the matrix and the note that each row is multiplied entry by entry and then summed, and an arrow down into a green output box holding 36, 27, 84 labelled length 3 and noted as one entry per row. A wide panel across the middle of the diagram states the rule that ties the three readings together: a matrix of shape 3 by 4 applied to a vector of length 4 returns a vector of length 3, the 4 is consumed because it had to match the number of columns and is gone from the answer, the 3 survives because it was the number of rows and is the length of what comes back, and every shape error in a model is two pieces of code disagreeing about which meaning each assumed. A final panel across the foot shows the output worked out entirely by hand, one line per mix: 2 times 10 plus 4 times 2 plus 1 times 5 plus 3 times 1 equals 20 plus 8 plus 5 plus 3 equals 36, and the corresponding lines giving 27 and 84, closing with the observation that reading one calls these ingredient quantities, reading two calls each row a point and reading three calls the whole grid a price calculator, that all three are true at once, and that the numbers never moved. A note records that the data is invented.'
  - id: broadcasting-flow
    file: assets/broadcasting-flow.svg
    type: flow-animated
    title: 'Broadcasting a shape (4,) array across a shape (3, 4) array, the same attempt with a shape (3,) array failing, and the rule that predicted both'
    alt: 'Diagram: a shape 3 by 4 array and a shape 4 array being combined, with the smaller one shown stretching across the rows step by step with real numbers, then the same attempt with a shape 3 array failing at the right-hand end, the exact ValueError NumPy raises, and the five-line shape rule that predicted both outcomes'
    description: 'An animated flow diagram in two cases plus a stated rule, readable in full as a still image. Case A, across the top, shows shape 3 by 4 combined with shape 4 succeeding. On the left is the matrix, three bands holding 2 4 1 3, then 0 5 2 7, then 6 1 4 2. In the middle is the price vector 10, 2, 5, 1 drawn as a single dark blue bar labelled as one array making three visits, with a marching-dash wire leading from it towards the grid; the bar slides down from row 0 to row 1 to row 2 and back, and each of the three bands lights up briefly as it arrives, so the reader sees the same four numbers being reused rather than copied. On the right is the result, three rows reading 20 8 5 3, then 0 10 10 7, then 60 2 20 2. A green box applies the rule right to left: 3 comma 4 above 1 comma 4 padded, 4 equals 4 and the 1 stretches, result 3 comma 4. Three lines beneath record that row 0 became 2, 4, 1, 3 times 10, 2, 5, 1 which is 20, 8, 5, 3, that numpy.broadcast_to shows the fiction directly by sharing memory with the price vector, and that the stretched array is read-only because one write into it would appear in three places at once. Case B, across the middle, shows the same 3 by 4 matrix combined with a three-entry vector 100, 200, 300 drawn in red, with a note that three numbers cannot line up against four columns. A red box, which pulses gently and rests fully legible, applies the rule again: 3 comma 4 above 1 comma 3 padded, the last pair is 4 against 3 which is neither equal nor 1, and the word STOP. Beside it a box quotes what NumPy actually raises: ValueError, operands could not be broadcast together with shapes 3 comma 4 and 3 comma. A line underneath gives the fix, reshaping the vector to shape 3 comma 1 so that 1 against 4 stretches and the result is 3 comma 4. A panel across the foot states the whole rule in five numbered lines: line the two shapes up from the right-hand end, a missing entry on the left of the shorter shape counts as 1, two dimensions are compatible when they are equal or one of them is 1, if any pair is neither the operation is a ValueError, and the result takes the larger of each pair — closing with the advice to check before trusting by calling numpy.broadcast_shapes, and a note that the data is invented. A prefers-reduced-motion block stops every animation and restores the resting state, in which all three bands are shaded, the price vector sits at row 0, the wire is a solid arrow, and every number, shape, product and message is present.'
