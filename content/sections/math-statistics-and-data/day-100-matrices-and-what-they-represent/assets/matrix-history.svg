<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Notation, then hardware.">
  <title>Four steps for matrices</title>
  <style>
    .matrix-history-bg   { fill: #f8fafc; }
    .matrix-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matrix-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .matrix-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .matrix-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .matrix-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .matrix-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .matrix-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .matrix-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .matrix-history-stage { opacity: 1; }

    .matrix-history-s0 { animation-delay: 0.00s; }
    .matrix-history-e0 { animation-delay: 0.00s; }
    .matrix-history-s1 { animation-delay: 1.28s; }
    .matrix-history-e1 { animation-delay: 1.28s; }
    .matrix-history-s2 { animation-delay: 2.56s; }
    .matrix-history-e2 { animation-delay: 2.56s; }
    .matrix-history-s3 { animation-delay: 3.84s; }
    .matrix-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .matrix-history-conn  { animation: matrix-history-trace 6.4s ease-in-out infinite; }
      .matrix-history-stage { animation: matrix-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes matrix-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes matrix-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .matrix-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .matrix-history-stage { animation: matrix-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes matrix-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="matrix-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="matrix-history-bg" width="980" height="322"/>
  <text class="matrix-history-h1"  x="30" y="40">Four steps for matrices</text>
  <text class="matrix-history-sub" x="30" y="64">Notation, then hardware.</text>
  <g class="matrix-history-stage matrix-history-s0">
    <rect class="matrix-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="matrix-history-step" x="44" y="142">01</text>
    <text class="matrix-history-name" x="70" y="142">Systems of linear equations, solved by hand</text>
    <text class="matrix-history-desc" x="44" y="166">For centuries, without the</text>
    <text class="matrix-history-desc" x="44" y="182">notation.</text>
  </g>
  <line class="matrix-history-line matrix-history-conn matrix-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#matrix-history-tip)"/>
  <g class="matrix-history-stage matrix-history-s1">
    <rect class="matrix-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="matrix-history-step" x="280" y="142">02</text>
    <text class="matrix-history-name" x="306" y="142">The notation formalised the manipulation</text>
    <text class="matrix-history-desc" x="280" y="166">Which made the general case</text>
    <text class="matrix-history-desc" x="280" y="182">tractable.</text>
  </g>
  <line class="matrix-history-line matrix-history-conn matrix-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#matrix-history-tip)"/>
  <g class="matrix-history-stage matrix-history-s2">
    <rect class="matrix-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="matrix-history-step" x="516" y="142">03</text>
    <text class="matrix-history-name" x="542" y="142">Then optimised numerical libraries</text>
    <text class="matrix-history-desc" x="516" y="166">Decades of tuning, still</text>
    <text class="matrix-history-desc" x="516" y="182">underneath everything.</text>
  </g>
  <line class="matrix-history-line matrix-history-conn matrix-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#matrix-history-tip)"/>
  <g class="matrix-history-stage matrix-history-s3">
    <rect class="matrix-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="matrix-history-step" x="752" y="142">04</text>
    <text class="matrix-history-name" x="778" y="142">And hardware built for exactly this operation</text>
    <text class="matrix-history-desc" x="752" y="166">Which is what an accelerator is.</text>
  </g>
  <text class="matrix-history-sub" x="30" y="304">The line from a notational convenience to purpose-built silicon is unusually direct, and it explains why AI hardware has the shape it does.</text>
</svg>
