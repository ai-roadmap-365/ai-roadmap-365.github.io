<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a matrix is not</title>
  <style>
    .matrix-not-bg   { fill: #f8fafc; }
    .matrix-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matrix-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .matrix-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .matrix-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .matrix-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .matrix-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .matrix-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matrix-not-row { opacity: 1; }
    .matrix-not-r0 { animation-delay: 0.00s; }
    .matrix-not-r1 { animation-delay: 0.45s; }
    .matrix-not-r2 { animation-delay: 0.90s; }
    .matrix-not-r3 { animation-delay: 1.35s; }
    .matrix-not-r4 { animation-delay: 1.80s; }
    .matrix-not-row { animation: matrix-not-reveal 7.3s ease-in-out infinite; }
    @keyframes matrix-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="matrix-not-bg" width="980" height="390"/>
  <text class="matrix-not-h1"  x="30" y="40">Four things a matrix is not</text>
  <text class="matrix-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="matrix-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="matrix-not-name" x="46" y="122">The misconception</text>
  <text class="matrix-not-desc" x="46" y="142">Commonly held.</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r0" x="46" y="182">A matrix is just a table</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r1" x="46" y="216">Shape is columns by rows</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r2" x="46" y="250">Reshaping copies the data</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r3" x="46" y="284">Broadcasting always does what you meant</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r4" x="46" y="318">Transpose is an expensive operation</text>
  <rect class="matrix-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="matrix-not-name" x="526" y="122">What is true</text>
  <text class="matrix-not-desc" x="526" y="142">Actually.</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r0" x="526" y="182">It is also a transformation, which is the useful reading</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r1" x="526" y="216">It is rows by columns, consistently</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r2" x="526" y="250">It usually returns a view sharing memory</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r3" x="526" y="284">It follows a rule that can align by accident</text>
  <text class="matrix-not-desc matrix-not-row matrix-not-r4" x="526" y="318">It changes the reading order, not the data</text>
  <text class="matrix-not-sub" x="30" y="372">Broadcasting doing something other than what was intended is the row that causes silent wrong answers rather than errors.</text>
</svg>
