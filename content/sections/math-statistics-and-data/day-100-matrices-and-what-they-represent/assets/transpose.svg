<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Transpose</title>
  <style>
    .transpose-bg   { fill: #f8fafc; }
    .transpose-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transpose-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transpose-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transpose-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transpose-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transpose-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transpose-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transpose-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transpose-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transpose-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transpose-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transpose-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transpose-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transpose-stage { opacity: 1; }

    .transpose-s0 { animation-delay: 0.00s; }
    .transpose-e0 { animation-delay: 0.00s; }
    .transpose-s1 { animation-delay: 1.28s; }
    .transpose-e1 { animation-delay: 1.28s; }
    .transpose-s2 { animation-delay: 2.56s; }
    .transpose-e2 { animation-delay: 2.56s; }
    .transpose-s3 { animation-delay: 3.84s; }
    .transpose-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .transpose-conn  { animation: transpose-trace 6.4s ease-in-out infinite; }
      .transpose-stage { animation: transpose-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes transpose-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transpose-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transpose-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transpose-stage { animation: transpose-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transpose-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transpose-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transpose-bg" width="980" height="322"/>
  <text class="transpose-h1"  x="30" y="40">Transpose</text>
  <text class="transpose-sub" x="30" y="64">Four steps.</text>
  <g class="transpose-stage transpose-s0">
    <rect class="transpose-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="transpose-step" x="44" y="142">01</text>
    <text class="transpose-name" x="70" y="142">Reflect the matrix across its diagonal</text>
    <text class="transpose-desc" x="44" y="166">Rows become columns.</text>
  </g>
  <line class="transpose-line transpose-conn transpose-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#transpose-tip)"/>
  <g class="transpose-stage transpose-s1">
    <rect class="transpose-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="transpose-step" x="280" y="142">02</text>
    <text class="transpose-name" x="306" y="142">So a 3 by 4 becomes a 4 by 3</text>
    <text class="transpose-desc" x="280" y="166">The shape reverses.</text>
  </g>
  <line class="transpose-line transpose-conn transpose-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#transpose-tip)"/>
  <g class="transpose-stage transpose-s2">
    <rect class="transpose-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="transpose-step" x="516" y="142">03</text>
    <text class="transpose-name" x="542" y="142">Which is how a shape mismatch is usually fixed</text>
    <text class="transpose-desc" x="516" y="166">One transpose, and the</text>
    <text class="transpose-desc" x="516" y="182">multiplication works.</text>
  </g>
  <line class="transpose-line transpose-conn transpose-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#transpose-tip)"/>
  <g class="transpose-stage transpose-s3">
    <rect class="transpose-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="transpose-step" x="752" y="142">04</text>
    <text class="transpose-name" x="778" y="142">And it is free: no data is copied</text>
    <text class="transpose-desc" x="752" y="166">Only the reading order changes.</text>
  </g>
  <text class="transpose-sub" x="30" y="304">Transposition being a view rather than a copy is worth knowing for performance, and it is also why modifying a transpose can modify the original.</text>
</svg>
