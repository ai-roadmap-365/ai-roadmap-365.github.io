<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Shape</title>
  <style>
    .shape-100-bg   { fill: #f8fafc; }
    .shape-100-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-100-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-100-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-100-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-100-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-100-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shape-100-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shape-100-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shape-100-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shape-100-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shape-100-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shape-100-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .shape-100-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .shape-100-stage { opacity: 1; }

    .shape-100-s0 { animation-delay: 0.00s; }
    .shape-100-e0 { animation-delay: 0.00s; }
    .shape-100-s1 { animation-delay: 1.28s; }
    .shape-100-e1 { animation-delay: 1.28s; }
    .shape-100-s2 { animation-delay: 2.56s; }
    .shape-100-e2 { animation-delay: 2.56s; }
    .shape-100-s3 { animation-delay: 3.84s; }
    .shape-100-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .shape-100-conn  { animation: shape-100-trace 6.4s ease-in-out infinite; }
      .shape-100-stage { animation: shape-100-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes shape-100-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes shape-100-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .shape-100-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .shape-100-stage { animation: shape-100-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes shape-100-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="shape-100-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="shape-100-bg" width="980" height="322"/>
  <text class="shape-100-h1"  x="30" y="40">Shape</text>
  <text class="shape-100-sub" x="30" y="64">Four rules.</text>
  <g class="shape-100-stage shape-100-s0">
    <rect class="shape-100-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="shape-100-step" x="44" y="142">01</text>
    <text class="shape-100-name" x="70" y="142">Shape is rows first, then columns</text>
    <text class="shape-100-desc" x="44" y="166">Always, in this convention.</text>
  </g>
  <line class="shape-100-line shape-100-conn shape-100-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#shape-100-tip)"/>
  <g class="shape-100-stage shape-100-s1">
    <rect class="shape-100-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="shape-100-step" x="280" y="142">02</text>
    <text class="shape-100-name" x="306" y="142">So a 3 by 4 matrix has three rows</text>
    <text class="shape-100-desc" x="280" y="166">And four columns. Not the</text>
    <text class="shape-100-desc" x="280" y="182">reverse.</text>
  </g>
  <line class="shape-100-line shape-100-conn shape-100-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#shape-100-tip)"/>
  <g class="shape-100-stage shape-100-s2">
    <rect class="shape-100-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="shape-100-step" x="516" y="142">03</text>
    <text class="shape-100-name" x="542" y="142">Say the shape aloud before every operation</text>
    <text class="shape-100-desc" x="516" y="166">Which sounds trivial and</text>
    <text class="shape-100-desc" x="516" y="182">prevents most errors.</text>
  </g>
  <line class="shape-100-line shape-100-conn shape-100-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#shape-100-tip)"/>
  <g class="shape-100-stage shape-100-s3">
    <rect class="shape-100-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="shape-100-step" x="752" y="142">04</text>
    <text class="shape-100-name" x="778" y="142">Because shape errors are the commonest bug in model code</text>
    <text class="shape-100-desc" x="752" y="166">And nearly all are a transpose</text>
    <text class="shape-100-desc" x="752" y="182">away.</text>
  </g>
  <text class="shape-100-sub" x="30" y="304">The habit of stating shapes before writing an operation is the single most effective debugging practice in array programming.</text>
</svg>
