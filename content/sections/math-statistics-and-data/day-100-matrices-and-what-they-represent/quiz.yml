questions:
  - question: 'A NumPy array M has shape (3, 4). What does M.sum(axis=0) return?'
    options:
      - 'Three numbers — one per row — because axis=0 means "along the rows"'
      - 'A single number, the total of all twelve entries'
      - 'A (3, 4) array of running totals'
      - 'Four numbers — one per column — because naming axis 0 collapses the rows'
    answer_index: 3
    explanation: 'The rule that settles this permanently is: the axis you name is the axis that disappears. Shape (3, 4) with axis=0 loses the 3 and returns shape (4,), which is one number per column. On the lesson''s matrix that is [8, 10, 7, 12] — the litres of each ingredient. Option 0 states the English reading that sounds right and is wrong; "along the rows" is ambiguous in English and the shape is not, which is exactly why you should reason from the shape. Option 1 is what M.sum() with no axis gives, which is 37 here. Option 2 describes cumsum, a different function entirely. And note why the lesson''s matrix is deliberately not square: because 3 and 4 differ, the length of the answer tells you which axis you actually used, every time, without thinking.'

  - question: 'You write M.reshape(12), then set flat[0] = 99 on the result. What is M[0, 0] afterwards?'
    options:
      - '99 — the reshaped array is a view onto the same memory'
      - '2, the original value — reshape returns a new array'
      - 'It depends on whether M was created with numpy.array or numpy.asarray'
      - 'A ValueError is raised, because a reshaped array is read-only'
    answer_index: 0
    explanation: 'A NumPy array is a flat block of memory plus a description of how to read it as a grid, and reshape usually rewrites only the description. The two names are then two windows onto one block, and writing through either changes what the other sees — so M[0, 0] becomes 99 even though nothing was assigned to M. This is not a quirk; it is the reason NumPy is fast, because a reshape of a 300 MB array moves no bytes at all. numpy.shares_memory(M, flat) returns True, and flat.base is M. The practical consequence is the one to carry: a function that "just reshapes" its input can silently edit the caller''s data. Option 3 describes numpy.broadcast_to''s result, which really is read-only, and for a good reason — a single write there would appear in several places at once.'

  - question: 'After independent = M.copy().reshape(12), which check correctly tells you that independent is independent of M?'
    options:
      - 'independent.base is None'
      - 'numpy.shares_memory(M, independent) returns False'
      - 'independent.flags.owndata is the only reliable attribute'
      - 'independent.shape != M.shape'
    answer_index: 1
    explanation: 'This one was found while building the lab rather than invented for the quiz. `.base is None` looks like the obvious test and gives the wrong answer here: M.copy().reshape(12) creates TWO arrays — an anonymous copy, and a reshaped view of that copy — so .base truthfully points at the copy and is not None, while the array is nonetheless completely independent of M. numpy.shares_memory(a, b) asks the question you actually care about, which is whether writing through one can be seen through the other, and it returns False. Option 3 is not a test of anything: a view of M has a different shape from M in exactly this case, and shares all of its memory. The general habit is worth more than the specific fact — when you want to know whether two arrays are linked, ask, do not infer.'

  - question: 'M has shape (3, 4). Which of these raises ValueError: operands could not be broadcast together?'
    options:
      - 'M + numpy.array([100, 200, 300, 400])'
      - 'M + numpy.array([100, 200, 300]).reshape(3, 1)'
      - 'M + numpy.array([100, 200, 300])'
      - 'M + 100'
    answer_index: 2
    explanation: 'Apply the rule from the right-hand end. Option 0 is (3, 4) against (4,), which pads to (1, 4): the trailing pair is 4 against 4 and the next is 3 against 1, so the 1 stretches and the result is (3, 4) — it works, and the vector is applied to every row. Option 1 is (3, 4) against (3,), which pads to (1, 3): the trailing pair is 4 against 3, neither equal nor 1, so the rule stops and NumPy raises. There is nothing special about the numbers 3 and 4 here; what matters is that the rule works from the right, and the rightmost dimensions did not agree. Option 2 is the fix — reshaping to (3, 1) says out loud that you meant one value per row, and 1 against 4 stretches. Option 3 treats the scalar as (1, 1) and works trivially. The habit to take away: when a broadcast fails, do not add a dimension at random — say which axis you meant.'

  - question: 'S is a (4, 4) array. You write centred = S - S.mean(axis=1), intending to centre each row on its own mean. What happens?'
    options:
      - 'A ValueError, because a (4,) cannot be combined with a (4, 4)'
      - 'It works correctly; axis=1 already gives one mean per row'
      - 'It runs but returns shape (4,), which is the clue that something is wrong'
      - 'It runs with no error and subtracts each row''s mean from a column'
    answer_index: 3
    explanation: 'S.mean(axis=1) has shape (4,), which the broadcasting rule pads on the LEFT to (1, 4) — so it lines up against the columns, not the rows. Row 0''s mean is subtracted from column 0, row 1''s from column 1, and so on. No exception is raised, the result has the shape you expected, and every number in it is plausible. It is a transposed answer wearing the right shape. The reason it survives is squareness: on a (4, 5) array the same code raises ValueError immediately and you fix it in one second. Two defences, and use both. First, keepdims=True — S.mean(axis=1, keepdims=True) has shape (4, 1), which cannot line up the wrong way. Second, a property check on the result: correctly row-centred data has every ROW summing to zero, and in the lab''s captured run the wrong version''s row sums are [-2767.5, -2677.5, -1777.5, 7222.5].'

  - question: 'Which of these NumPy operations returns a COPY rather than a view?'
    options:
      - 'M[[0, 2]] — indexing with a list of rows'
      - 'M.T — transpose'
      - 'M[:, 2] — basic slicing with a colon'
      - 'M.ravel()'
    answer_index: 0
    explanation: 'Indexing with a list of positions, or with a boolean mask, is called fancy indexing and always produces a copy — NumPy cannot describe "rows 0 and 2 only" as a stride pattern over the original memory, so it has to build a new array. Everything else in the list gives a view when it can. Basic slicing with colons is the one that surprises people most, because a Python list slice copies and the NumPy syntax is identical: py_list[0][:] is a new list, M[:, 2] is a window. Transpose is a view because transposing moves no numbers at all — it swaps two entries in the description of how to walk the memory, which is why it is free. ravel gives a view when it can while flatten always copies, and the names give you no clue about that, so it is a fact to memorise. When in doubt, ask numpy.shares_memory rather than guessing.'

  - question: 'A paper describes the entry a-23 of a matrix. Which NumPy expression refers to the same entry?'
    options:
      - 'M[2, 3]'
      - 'M[1, 2]'
      - 'M[3, 2]'
      - 'M[2][3], which is different from M[2, 3]'
    answer_index: 1
    explanation: 'Mathematics numbers rows and columns from 1; NumPy numbers them from 0. So the paper''s a-ij is the code''s M[i-1, j-1], and a-23 — row 2, column 3 in from-1 counting — is M[1, 2]. There is no clever way around this: you hold both conventions and translate consciously, and it is the single most common source of off-by-one confusion when the paper is in one window and the code is in the other. Say the translation out loud once and it stops being a trap. Option 0 is the mistake of copying the subscripts straight across. Option 2 additionally transposes them. Option 3 is a red herring on a real point: M[2][3] does work on a NumPy array and gives the same entry as M[2, 3], but it gets there by building an intermediate row array first, so M[2, 3] is both clearer and cheaper — and on the from-scratch class in the lab, M[2][3] is rejected outright.'

  - question: 'You are handed a (32, 768) array and told it is a batch of sentence embeddings. Which reading of it is meaningful, and which is usually a mistake?'
    options:
      - 'Both are equally meaningful, because the matrix is symmetric'
      - 'Comparing two columns is meaningful; comparing two rows is usually a mistake'
      - 'Comparing two rows is meaningful; comparing two columns is usually a mistake'
      - 'Neither is meaningful until the array is transposed to (768, 32)'
    answer_index: 2
    explanation: 'A row here is one sentence — a complete point in the 768-dimensional embedding space — so comparing two rows asks "are these two sentences alike?", which is the question the embedding exists to answer. A column is a single coordinate of that space taken across 32 unrelated sentences, and on its own it usually means nothing at all: the individual dimensions of a learned embedding are not interpretable features. This is meaning two from the lesson, and the point is that NOTHING IN THE ARRAY marks the difference. The same twelve-hundred-odd numbers support both readings and only one is sensible, so the knowledge lives in your head or in a comment, never in the data. Option 2 is wrong twice over: a (32, 768) array is not square so it cannot be symmetric, and symmetry would not make columns interpretable anyway. Option 3 is wrong because transposing changes nothing about meaning — the same facts, differently arranged.'
