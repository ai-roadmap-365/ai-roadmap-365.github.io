terms:
  - term: 'Matrix'
    definition: 'A rectangular grid of numbers arranged in rows and columns, every row the same length. The definition is almost useless on its own, because it says what a matrix is made of and nothing about what it means. In practice a matrix is at least three things at once — a table of data, a collection of vectors, and a transformation — and knowing which one is in play is the whole skill.'
  - term: 'Shape'
    definition: 'The pair (rows, columns) describing a matrix''s size, and in NumPy the tuple returned by .shape. Rows first — a convention rather than a law, and one worth saying out loud, because half the time spent confused about an array is time spent unsure which number is which. Related: .ndim is how many axes there are (2 for a matrix) and .size is the total entry count, rows times columns.'
  - term: 'Row'
    definition: 'One horizontal line of a matrix, selected by the first index. Under the table reading a row is one item; under the vector reading it is one point in feature-space; under the transformation reading it is the recipe for one entry of the output. In row-major storage a row''s entries sit next to each other in memory, which is why reading a row is cheaper than reading a column.'
  - term: 'Column'
    definition: 'One vertical line of a matrix, selected by the second index. Under the table reading a column is one feature measured across every item; under the vector reading it is a vector of a different length from any row. Reading a column means stepping across the whole array rather than along it. Rows and columns are different kinds of thing living in the same rectangle, and that asymmetry is the source of nearly every axis mistake.'
  - term: 'Index'
    definition: 'The pair of numbers that names one entry. NumPy counts from 0, so M[0, 0] is the top-left entry; mathematics counts from 1, so a paper calls the same entry a-11. The translation is exact and unavoidable: the paper''s a-ij is the code''s M[i-1, j-1]. This is the single most common source of off-by-one confusion when reading a paper and writing the code at the same time.'
  - term: 'Transpose'
    definition: 'The matrix obtained by swapping rows and columns: entry (i, j) of the transpose is entry (j, i) of the original, and an (r, c) matrix becomes (c, r). Written M-transpose in mathematics and M.T in NumPy. Transposing twice returns exactly the original. In NumPy it is a view and it moves no numbers at all — it swaps two entries in the description of how to walk the memory, which is why it costs nothing.'
  - term: 'Identity matrix'
    definition: 'The square matrix with 1 on the main diagonal and 0 everywhere else. It leaves every vector exactly as it found it, which makes it the "do nothing" transformation and the starting point for defining an inverse. numpy.eye(n) builds one. Recognising it on sight tells you an operation is a no-op without reading any of the numbers.'
  - term: 'Diagonal matrix'
    definition: 'A square matrix whose only non-zero entries lie on the main diagonal. Applied to a vector it scales each coordinate by its own factor, independently of the others — no coordinate influences any other. numpy.diag builds one from a list of values. The identity matrix is the special case where every diagonal entry is 1.'
  - term: 'Symmetric matrix'
    definition: 'A matrix equal to its own transpose, so entry (i, j) always equals entry (j, i). Only a square matrix can be symmetric. It means the relationship from i to j is the same as from j to i, which is why distance matrices, similarity matrices, covariance matrices and undirected graphs are symmetric — and why an attention score table, where token i attending to token j is not the same as the reverse, generally is not.'
  - term: 'Broadcasting'
    definition: 'NumPy''s rule for combining arrays of different shapes by conceptually stretching the smaller one. Shapes are lined up from the right-hand end, a missing entry counts as 1, two dimensions are compatible when equal or when one is 1, and anything else is a ValueError. Nothing is copied — the stretching is a fiction maintained by reading the smaller array''s memory more than once. It is the point where NumPy stops doing the obvious thing, and therefore where silent wrong answers begin.'
  - term: 'View'
    definition: 'An array that shares memory with another array rather than owning its own. Writing through a view changes what the other name sees, and nothing in either name says so. Reshaping, basic slicing with colons, transposing and ravel all give views when they can. This is why NumPy is fast — a reshape of a 300 MB array moves no bytes — and why a function that receives an array can modify the caller''s data without returning anything.'
  - term: 'Copy'
    definition: 'An array with its own memory, independent of whatever it was made from. Produced by .copy(), by .flatten(), and by fancy indexing. A copy costs the memory and shares nothing; a view costs nothing and shares everything; neither is the right answer, and knowing which one you have is. The reliable test is numpy.shares_memory(a, b), not .base is None — after M.copy().reshape(12), .base points at the anonymous copy and is not None even though the result is fully independent of M.'
  - term: 'Axis'
    definition: 'Which dimension of an array an operation works along, given as a number counting from 0. For a 2-D array, axis 0 is the rows and axis 1 is the columns. The rule that settles every case: the axis you name is the axis that disappears — a (3, 4) array summed with axis=0 returns shape (4,), and with axis=1 returns shape (3,). The rule holds for every reduction and generalises to arrays with more than two axes without amendment.'
  - term: 'keepdims'
    definition: 'An argument to every NumPy reduction that leaves a 1 in place of the axis it collapsed instead of removing it, so a (4, 4) array reduced with axis=1 and keepdims=True gives shape (4, 1) rather than (4,). It matters because a (4,) result pads on the LEFT and lines up against the columns, which is how row-centring silently becomes column-centring on a square matrix. Make it your default whenever a reduction is about to be broadcast back against the array it came from.'
  - term: 'Reshape'
    definition: 'Rewriting how a block of numbers is read as a grid, without changing the numbers or their order. Any shape whose dimensions multiply to the same total is allowed, and -1 means "work out this one". A reshape is usually a view, so writing through the result changes the original. The entries come out in row-major order — the whole of row 0, then row 1 — which is what NumPy calls C order and uses by default.'
  - term: 'Row-major and column-major order'
    definition: 'Two conventions for laying a grid out in linear memory. Row-major stores one row at a time and is what C, and NumPy after it, use by default; column-major stores one column at a time and is what Fortran uses. NumPy calls them C order and F order. Neither is more correct — they are historical accidents — but which one you have decides which reshapes are free and which require a copy.'
  - term: 'Sparse matrix'
    definition: 'A representation that stores only the non-zero entries plus their coordinates, for matrices where nearly every entry is zero. Not a niche case: document-term matrices, recommendation data and graph adjacency matrices are all overwhelmingly zero. A 100,000 by 50,000 document-term matrix is 40 GB dense in float64 and unremarkable sparse. The cost is real — some operations are slower and some unsupported, and when only a modest fraction of entries are zero the bookkeeping can outweigh the saving — but when a sparse representation is the only workable one, it is genuinely the only one.'
  - term: 'Tensor'
    definition: 'In machine-learning code, an array with any number of dimensions: a scalar is 0-dimensional, a vector 1-dimensional, a matrix 2-dimensional, and a batch of colour images 4-dimensional. This is the usage in PyTorch and everything downstream of it. In mathematics and physics the word is stricter, describing how the object behaves under a change of coordinates, and a matrix is not automatically a tensor in that sense. Both usages are correct in their own fields.'
  - term: 'Elementwise operation'
    definition: 'An operation applied to each entry independently — addition, subtraction, multiplication by a scalar, and NumPy''s * between two arrays. Requires shapes that are identical or that broadcast. Not to be confused with matrix multiplication, written @ in NumPy, which has a completely different shape rule and is Day 101''s subject. The notation is one character apart and confusing the two is a rite of passage.'
  - term: 'Fancy indexing'
    definition: 'Selecting entries with a list of positions or a boolean mask, as in M[[0, 2]] or M[M > 3], rather than with slices. It always produces a copy, because the selection cannot be described as a stride pattern over the original memory. Worth knowing precisely because basic slicing with colons does the opposite, and the two look similar on the page.'
