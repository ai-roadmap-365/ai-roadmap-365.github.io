id: D100
day: 100
slug: matrices-and-what-they-represent
title: 'Matrices and What They Represent'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 15
learning_promise: 'After this lesson you will be able to look at any rectangle of numbers and say which of its three meanings is in play — a table whose rows are items and columns are features, a collection of vectors that is three vectors one way and four the other, or a transformation that eats a vector of one length and returns a vector of another — and you will know why that question is the one that matters, because every shape error you will ever hit in a model is two sides assuming different answers to it. You will build a matrix from nothing but nested lists, with shape, indexing, transpose, addition and scalar multiplication, and assert every one of them against NumPy; recognise the zero, identity, diagonal and symmetric matrices on sight and say what each one does; apply the broadcasting rule by hand from the right-hand end and predict success or failure before running anything; reproduce the case where broadcasting silently does the wrong thing on a square matrix, and state the one-line check that catches it; prove that a reshape is a view by writing through it and watching the original change, prove that .copy() breaks that link, and know why .base is None is the wrong test; and settle axis=0 against axis=1 permanently with the rule that the axis you name is the axis that disappears.'
objectives:
  - 'Read one rectangle of numbers three ways — as a table of items and features, as a collection of row or column vectors, and as a transformation — and say which reading any given operation assumed'
  - 'State a shape as (rows, columns), read .ndim and .size, and translate consciously between the paper''s from-1 subscript a-ij and the code''s from-0 M[i-1, j-1]'
  - 'Implement shape, indexing, transpose, addition, scalar multiplication and the identity matrix from first principles on nested lists, and assert each against NumPy'
  - 'Recognise the zero, identity, diagonal and symmetric matrices on sight, and say what each one does to a vector rather than only what it looks like'
  - 'Apply the five-line broadcasting rule from the right-hand end, predict the result shape or the failure before running anything, and use numpy.broadcast_shapes to check'
  - 'Reproduce the silent broadcasting trap on a square matrix, explain why squareness is what makes it silent, and state a property-of-the-result check that catches it'
  - 'Use keepdims=True as the default whenever a reduction is about to be broadcast back against the array it came from'
  - 'Say whether reshape, basic slicing, fancy indexing, ravel, flatten and transpose give a view or a copy, and prove it with numpy.shares_memory instead of .base'
  - 'Choose between axis=0 and axis=1 from the rule that the axis you name is the axis that disappears, and use the length of the answer as the check'
  - 'Explain why a NumPy view handed across a function boundary carries write access, and name the two ways to prevent that'
  - 'Compare nested lists, NumPy, PyTorch tensors, JAX arrays, pandas DataFrames and SciPy sparse matrices, with when to choose each, and state honestly which were actually run'
  - 'Connect the three meanings to AI practice: a dataset, a batch of embeddings, a layer of weights and an attention score table are all matrices, and every shape error between them is a disagreement about which meaning each side assumed'
prerequisites:
  - 'Day 99 — vectors: components, magnitude, the L2 and L1 norms, unit vectors and distance. The row and column norms in this lesson assume it'
  - 'Day 65 — reading a CSV file, which is where the table reading of a matrix comes from'
  - 'Day 85 — database tables, the same rectangle with names and types attached'
  - 'Day 70 — floating point, which is why every float comparison here declares a tolerance'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'Day 43 — python3 -m venv and installing a package with pip; the lab installs numpy and pytest into a lab-local environment'
  - 'No mathematics beyond school arithmetic. Every symbol is defined where it first appears'
reading_time_minutes: 40
practical_time_minutes: 30
