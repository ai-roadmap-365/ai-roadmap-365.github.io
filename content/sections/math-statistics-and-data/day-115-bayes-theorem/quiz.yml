questions:
  - question: 'A test is 99% sensitive and 99% specific. The condition affects 1 person in 1,000. You test positive. What is the true probability you have the condition?'
    options:
      - 'Exactly 50%, since the outcome is now genuinely uncertain'
      - 'About 9% -- close to 99/1098 -- because the 1% false-positive rate applied to the much larger healthy population produces more false positives than the tiny sick population can supply true positives'
      - 'It cannot be determined without knowing the total population size'
      - 'About 99%, matching the test''s stated accuracy'
    answer_index: 1
    explanation: 'Out of 100,000 people at this prevalence, 100 have the condition and 99,900 do not. The test catches 99 of the 100 sick people (true positives) but also fires on 999 of the 99,900 healthy people (false positives, from the 1% false-positive rate). Among the 1,098 people who test positive, only 99 actually have the condition: 99/1098, about 9.02%. The test''s "99% accuracy" describes how it behaves given the true condition status -- it says nothing on its own about how common that condition was to begin with, which is exactly the base rate Bayes'' theorem forces into the calculation.'

  - question: 'The denominator of Bayes'' theorem, P(evidence), is computed as P(condition) x P(positive|condition) + P(no condition) x P(positive|no condition). What is this expression, in terms of concepts from Day 113?'
    options:
      - 'It is the addition rule, applied to two overlapping events'
      - 'It is a brand new rule specific to Bayes'' theorem, unrelated to anything in Day 113'
      - 'It is exactly the law of total probability, applied to the partition {condition, no condition}, with "positive" as the event being summed over'
      - 'It is the complement rule, applied to the event "no condition"'
    answer_index: 2
    explanation: 'The law of total probability from Day 113 states P(A) = sum over i of P(piece_i) x P(A | piece_i), for any partition of the sample space. Here the partition is {condition, no condition} and A is "tests positive" -- exactly the same structural computation Day 113 worked across two urns of different composition. Bayes'' theorem''s denominator is not a new idea; it is that exact rule, arrived at from the opposite direction: instead of asking the overall chance of the event across the partition, Bayes'' theorem asks which piece of the partition the observed event most likely came from.'

  - question: 'Two different tests both come back positive: test A (99% sensitive, 99% specific) and test B (95% sensitive, 98% specific). Updated sequentially in odds form, does the order (A then B, or B then A) change the final posterior?'
    options:
      - 'Yes -- the test performed second always carries more weight than the test performed first'
      - 'It depends on which test has the higher sensitivity'
      - 'The orders differ, but only by a negligible rounding amount'
      - 'No -- both orders give the identical posterior, because each update multiplies the running odds by a likelihood ratio, and multiplication is commutative'
    answer_index: 3
    explanation: 'In odds form, each update multiplies the running odds by one more likelihood ratio: posterior_odds = prior_odds x LR_A x LR_B (or LR_B x LR_A). Since a x b always equals b x a for real numbers, the final product -- and therefore the final posterior -- is identical regardless of the order the two factors are applied in. This is not a special property of Bayes'' theorem; it is a property of multiplication that Bayes'' theorem, written in odds form, happens to be built from. The lesson''s lab computes both orders explicitly and confirms an identical Fraction result to the digit, rather than only asserting the algebra.'

  - question: 'The same diagnostic test is run twice on ONE sample. Half the time, both runs share a single failure mode (a contaminated sample) and give the same result regardless of the true condition; the other half, the two runs are genuinely independent. Why does calculating the posterior as if the two runs were fully independent (squaring the single-run likelihoods) produce a WRONG answer?'
    options:
      - 'It silently assumes the two runs are conditionally independent given the hypothesis, which is false here, and it overstates confidence by treating one shared piece of evidence as if it were two separate pieces'
      - 'It produces the wrong answer because two positive results are always weaker evidence than one'
      - 'It does not -- squaring the likelihoods is correct in any two-test scenario'
      - 'It produces the wrong answer only because the specific numbers chosen happen to be unusual'
    answer_index: 0
    explanation: 'Multiplying likelihood ratios (or squaring a single likelihood, for two identical tests) is only valid when the pieces of evidence are conditionally independent given the hypothesis. Here they are not: half the time, a shared failure mode makes the two runs report the same outcome regardless of the true condition, so they are really one piece of evidence, reported twice. The naive calculation reports a posterior of 363/400 = 0.9075, while the correct, correlation-aware calculation gives about 0.1634 -- the naive answer is not just different, it is substantially overconfident, exactly the same shape of error as double-counting an overlap in Day 113''s addition rule.'

  - question: 'A prosecutor argues that because a piece of forensic evidence would occur in only 1 innocent person in a million, the defendant is "999,999 times more likely to be guilty than innocent." What is wrong with this argument?'
    options:
      - 'The argument is wrong only because forensic evidence is inherently unreliable'
      - 'The argument is correct, but only if the defendant had no prior connection to the case at all'
      - 'It confuses P(evidence | innocent), which is genuinely small, with P(innocent | evidence), which depends on the prior probability of guilt and how many people could plausibly have been tested -- treating a small P(evidence|innocent) as automatically making P(innocent|evidence) small is the prosecutor''s fallacy'
      - 'Nothing is wrong with it; the reasoning is mathematically sound'
    answer_index: 2
    explanation: 'This is the prosecutor''s fallacy: treating P(evidence | innocent) as if it were interchangeable with P(innocent | evidence). Bayes'' theorem shows these can be very different numbers -- in a city of ten million people, a 1-in-a-million false-match rate still implicates roughly ten innocent people by chance alone, and without a genuine prior narrowing the suspect pool before the forensic evidence, a tiny P(evidence|innocent) does not by itself make P(innocent|evidence) tiny. The correct computation needs the prior probability of guilt and the actual pool of people who could plausibly have produced the evidence, not just the evidence''s rarity in isolation.'

  - question: 'A tiny Naive Bayes spam classifier is trained so that the word "watches" never appears in any ham training document. A held-out document contains three strongly ham-associated words and the word "watches". What happens WITHOUT Laplace smoothing (alpha=0)?'
    options:
      - 'The classifier correctly weighs all four words and classifies the document ham'
      - 'P(watches | ham) is exactly 0, so multiplying it into ham''s score makes ham''s entire probability exactly 0 regardless of the other three words -- a single absent word vetoes all the evidence that would otherwise favour ham'
      - 'The classifier ignores "watches" entirely since it has zero probability, and classifies based on the remaining three words'
      - 'Laplace smoothing has no effect on this scenario either way'
    answer_index: 1
    explanation: 'Without smoothing, P(word | class) for a word that never appeared in that class''s training data is exactly count/total = 0/total = 0. Multiplying anything by zero gives zero, so a single unseen word can override however much genuine evidence the other words carry. In the lesson''s lab, this document''s unsmoothed score for BOTH classes actually reaches exactly 0.0 (a second word, "review", is similarly absent from spam training), and the classifier silently returns whichever class happens to be checked first -- not the class the evidence supports. Laplace smoothing (alpha=1) gives every word in the vocabulary a small nonzero probability under every class specifically to prevent this veto.'

  - question: 'A real Naive Bayes classifier is built to sum LOG probabilities rather than multiply raw probabilities together. Why is this not optional at realistic document lengths?'
    options:
      - 'Log space is only needed when using a GPU, not on a CPU'
      - 'Multiplying probabilities is actually faster, so log space is a tradeoff of speed for a purely cosmetic benefit'
      - 'Summing logs is merely a stylistic convention with no practical effect'
      - 'A product of several hundred small per-word probabilities can underflow to EXACTLY 0.0 in float64, at which point every class ties and the classifier silently returns whichever class came first -- summing logs turns the product into a sum, which stays finite'
    answer_index: 3
    explanation: 'A document with several hundred words, each contributing a per-word probability on the order of a percent or two, is exactly the shape of a product that underflows: multiplying 500 factors of 0.01 as plain float64 reaches EXACTLY 0.0 well before the 500th factor, because the true value (10^-1000) sits roughly 676 orders of magnitude below float64''s smallest representable positive number (about 5e-324). Once that happens, every class''s score ties at 0.0 and the classifier silently picks whichever class it checks first, regardless of the evidence -- the identical failure mode as the one-word veto, caused by scale instead of an absent word. Summing the corresponding logs instead (500 x ln(0.01) = -2302.585..., computed and confirmed finite) avoids the underflow entirely.'

  - question: 'The word "naive" in Naive Bayes names a specific assumption: that every word in a document is conditionally independent of every other word, given the document''s class. Why does the classifier still work well despite this assumption being false?'
    options:
      - 'Ranking P(spam | words) against P(ham | words) correctly does not require the independence assumption to be literally true -- only for its errors to not systematically favour the wrong class, which holds often enough in practice for the classifier to be useful'
      - 'The assumption is not actually false; word choice really is independent of context'
      - 'The classifier only works on very short documents where independence happens to hold exactly'
      - 'Smoothing corrects the independence assumption, making it effectively true'
    answer_index: 0
    explanation: 'Word choice is genuinely shaped by grammar and context, so the conditional-independence assumption is known to be false. But Naive Bayes only needs to get the RELATIVE ordering right -- which class''s score is higher -- not the individual probabilities exactly right. As long as the independence assumption''s errors do not systematically push the ranking toward the wrong class, the classifier''s decisions stay accurate even though its literal probability estimates are not calibrated. Smoothing (option 3) fixes a completely separate problem -- the one-word veto -- and does nothing to make the independence assumption itself true.'
