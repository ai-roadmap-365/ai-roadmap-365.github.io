visuals:
  - id: bayes-anatomy-architecture
    file: assets/bayes-anatomy-architecture.svg
    type: diagram
    title: "Anatomy of Bayes' theorem: 100,000 people, branching into four outcome cells"
    alt: "Diagram: a tree diagram starting from 100,000 people, branching by true condition status and then by test result, with the four outcome cells labelled true positive, false negative, false positive and true negative, and a footer showing the prior, likelihood, evidence and posterior computed from those counts"
    description: 'A static architecture diagram, on a light background, drawn as a branching tree over 100,000 people. The root box reads "100,000 people, the whole sample space." It branches into two level-two boxes: an amber box "100 have the condition," labelled PRIOR = 100/100,000 = 1/1000, and a blue box "99,900 no condition," labelled 1 − PRIOR = 999/1000. Each level-two box branches again into two level-three boxes. Under the condition box: a filled amber box "99 test positive," tagged TRUE POSITIVE and labelled LIKELIHOOD = sensitivity = 99/100, and a dashed outline box "1 tests negative," labelled false negative. Under the no-condition box: a filled blue box "999 test positive," tagged FALSE POSITIVE and labelled 1 − specificity = 1/100, and a dashed outline box "98,901 test negative," labelled true negative. Both positive-branch boxes converge downward into a single orange-tinted box, "1,098 people test positive, total," labelled EVIDENCE = P(positive) = 99/100,000 + 999/100,000 = 1098/100,000, with a note that this is 99 true positives plus 999 false positives, Day 113''s law of total probability. A footer band spans the full width, headed "The posterior: how many of the 1,098 positives are true positives?", showing in bold monospace P(condition | positive) = TP / (TP + FP) = 99/1098 = 11/122, then ≈ 0.0902, about 9%, NOT the 99% most people guess, followed by two lines explaining that 91 of every 100 positives are false alarms because a 1% error rate applied to 99,900 healthy people produces ten times more false positives than the one true positive it competes with, and closing with the formula''s parts labelled underneath: PRIOR × LIKELIHOOD, divided by EVIDENCE, equals POSTERIOR.'
  - id: posterior-update-flow
    file: assets/posterior-update-flow.svg
    type: flow-animated
    title: 'The same evidence, two base rates, two very different posteriors'
    alt: 'Diagram: two animated panels, each showing a prior bar, a positive test result arriving as evidence, and a posterior bar. The left panel starts from a rare 1-in-1,000 prior and lands near 9 percent. The right panel starts from a common 1-in-2 prior and lands at exactly 99 percent, using the identical test and the identical evidence, demonstrating that the base rate decides where the posterior ends up'
    description: 'An animated flow diagram, fully readable as a still image. The heading reads "Same evidence. Different base rate. Different answer.", with a subheading noting both panels use the identical 99%-sensitive, 99%-specific test and the identical positive result. Two side-by-side panels. Panel A, "RARE CONDITION, prior = 1 in 1,000," shows a grey prior bar so thin it is nearly invisible, labelled 1/1000, a dashed vertical connector down the middle labelled "EVIDENCE: positive test, LR+ = 99," and an amber posterior bar filling about one-eleventh of its track, labelled 0.0902 and captioned "≈ 9% — mostly still healthy." Panel B, "COMMON CONDITION, prior = 1 in 2," shows a grey prior bar filling half its track, labelled 1/2, the identical dashed evidence connector and LR+ = 99 label, and a blue posterior bar filling nearly the entire track, labelled 0.99 and captioned "= 99% — almost certainly the condition." A footer band across the full width, headed "The base rate decides where you end up," states the odds-form formula posterior odds = prior odds × likelihood ratio, then Panel A''s working, (1/999) × 99 → posterior ≈ 0.0902, and Panel B''s working, (1/1) × 99 → posterior = 0.99 exactly, closing with the lines "The likelihood ratio — how much the evidence is worth — never changed. Only the prior did." and "0.99 was never the wrong number. It was always the right answer to a different question." Each panel''s border briefly thickens and turns blue in sequence, Panel A first and then Panel B, over a repeating cycle, and a small blue token travels down each panel''s dashed evidence connector in turn, timed to arrive as that panel''s border highlights, so the eye follows the same evidence being applied to each prior in turn. A prefers-reduced-motion block stops every animation and restores the resting state, in which both panel borders sit at their normal thin grey stroke, both tokens rest at the bottom of their connectors, and both bar charts, every label and the full footer text remain fully present.'
