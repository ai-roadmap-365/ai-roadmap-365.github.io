<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="d115a-title d115a-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d115a-title">Anatomy of Bayes' theorem: 100,000 people, branching into four outcome cells</title>
  <desc id="d115a-desc">A tree diagram starting from 100,000 people, branching by true condition status and then by test result, with the four outcome cells labelled true positive, false negative, false positive and true negative, and a footer showing the prior, likelihood, evidence and posterior computed from those counts.</desc>

  <style>
    .d115a-bg { fill: #f8fafc; }
    .d115a-heading { font-size: 18px; font-weight: 700; fill: #1a202c; }
    .d115a-subheading { font-size: 13.5px; fill: #475569; }
    .d115a-node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d115a-node-cond { fill: #fef3c7; stroke: #b45309; stroke-width: 1.75; }
    .d115a-node-nocond { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d115a-node-tp { fill: #fde68a; stroke: #b45309; stroke-width: 2; }
    .d115a-node-fn { fill: #ffffff; stroke: #b45309; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .d115a-node-fp { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .d115a-node-tn { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .d115a-label { font-size: 14px; fill: #1a202c; }
    .d115a-label-bold { font-size: 14.5px; font-weight: 700; fill: #1a202c; }
    .d115a-small { font-size: 12.5px; fill: #475569; }
    .d115a-mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 13.5px; fill: #1a202c; }
    .d115a-mono-bold { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d115a-edge { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .d115a-edge-cond { stroke: #b45309; stroke-width: 1.75; fill: none; }
    .d115a-edge-nocond { stroke: #1d4ed8; stroke-width: 1.5; fill: none; }
    .d115a-footer { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    .d115a-tag { font-size: 12px; font-weight: 700; fill: #b45309; }
    .d115a-tag-blue { font-size: 12px; font-weight: 700; fill: #1d4ed8; }
  </style>

  <rect class="d115a-bg" x="0" y="0" width="1000" height="720" />

  <text x="500" y="32" text-anchor="middle" class="d115a-heading">Bayes' theorem, anchored to counts you can see</text>
  <text x="500" y="52" text-anchor="middle" class="d115a-subheading">99% sensitive, 99% specific test. Condition affects 1 in 1,000. Every count below is exact.</text>

  <!-- Root -->
  <rect class="d115a-node" x="410" y="72" width="180" height="46" rx="8" />
  <text x="500" y="92" text-anchor="middle" class="d115a-label-bold">100,000 people</text>
  <text x="500" y="110" text-anchor="middle" class="d115a-small">the whole sample space</text>

  <!-- Level 2 edges -->
  <path class="d115a-edge-cond" d="M 460 118 L 260 190" />
  <path class="d115a-edge-nocond" d="M 540 118 L 740 190" />

  <!-- Level 2: condition / no condition -->
  <rect class="d115a-node-cond" x="160" y="190" width="200" height="58" rx="8" />
  <text x="260" y="212" text-anchor="middle" class="d115a-label-bold">100 have the condition</text>
  <text x="260" y="230" text-anchor="middle" class="d115a-mono">PRIOR = 100/100,000 = 1/1000</text>
  <text x="260" y="245" text-anchor="middle" class="d115a-tag">P(condition)</text>

  <rect class="d115a-node-nocond" x="640" y="190" width="200" height="58" rx="8" />
  <text x="740" y="212" text-anchor="middle" class="d115a-label-bold">99,900 no condition</text>
  <text x="740" y="230" text-anchor="middle" class="d115a-mono">1 - PRIOR = 999/1000</text>
  <text x="740" y="245" text-anchor="middle" class="d115a-tag-blue">P(no condition)</text>

  <!-- Level 3 edges: from condition node -->
  <path class="d115a-edge-cond" d="M 230 248 L 130 320" />
  <path class="d115a-edge" d="M 290 248 L 390 320" />
  <!-- Level 3 edges: from no-condition node -->
  <path class="d115a-edge-nocond" d="M 710 248 L 610 320" />
  <path class="d115a-edge" d="M 770 248 L 870 320" />

  <!-- Level 3 boxes -->
  <rect class="d115a-node-tp" x="40" y="320" width="180" height="64" rx="8" />
  <text x="130" y="342" text-anchor="middle" class="d115a-label-bold">99 test positive</text>
  <text x="130" y="360" text-anchor="middle" class="d115a-tag">TRUE POSITIVE</text>
  <text x="130" y="376" text-anchor="middle" class="d115a-mono">LIKELIHOOD = sensitivity = 99/100</text>

  <rect class="d115a-node-fn" x="300" y="320" width="180" height="64" rx="8" />
  <text x="390" y="342" text-anchor="middle" class="d115a-label-bold">1 tests negative</text>
  <text x="390" y="360" text-anchor="middle" class="d115a-small">false negative</text>
  <text x="390" y="376" text-anchor="middle" class="d115a-small">missed by the test</text>

  <rect class="d115a-node-fp" x="520" y="320" width="180" height="64" rx="8" />
  <text x="610" y="342" text-anchor="middle" class="d115a-label-bold">999 test positive</text>
  <text x="610" y="360" text-anchor="middle" class="d115a-tag-blue">FALSE POSITIVE</text>
  <text x="610" y="376" text-anchor="middle" class="d115a-mono">1 - specificity = 1/100</text>

  <rect class="d115a-node-tn" x="780" y="320" width="180" height="64" rx="8" />
  <text x="870" y="342" text-anchor="middle" class="d115a-label-bold">98,901 test negative</text>
  <text x="870" y="360" text-anchor="middle" class="d115a-small">true negative</text>
  <text x="870" y="376" text-anchor="middle" class="d115a-small">correctly cleared</text>

  <!-- Converge the two positive branches down to the evidence box -->
  <path class="d115a-edge-cond" d="M 130 384 L 400 460" />
  <path class="d115a-edge-nocond" d="M 610 384 L 460 460" />

  <rect class="d115a-node" x="330" y="460" width="340" height="60" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.75" />
  <text x="500" y="482" text-anchor="middle" class="d115a-label-bold">1,098 people test positive, total</text>
  <text x="500" y="500" text-anchor="middle" class="d115a-mono">EVIDENCE = P(positive) = 99/100,000 + 999/100,000 = 1098/100,000</text>
  <text x="500" y="514" text-anchor="middle" class="d115a-small">99 true positives + 999 false positives — Day 113's law of total probability</text>

  <!-- Footer: the posterior -->
  <rect class="d115a-footer" x="120" y="548" width="760" height="150" rx="8" />
  <text x="500" y="576" text-anchor="middle" class="d115a-heading" font-size="16px">The posterior: how many of the 1,098 positives are true positives?</text>
  <text x="500" y="602" text-anchor="middle" class="d115a-mono-bold">P(condition | positive) = TP / (TP + FP) = 99 / 1098 = 11/122</text>
  <text x="500" y="624" text-anchor="middle" class="d115a-mono-bold" fill="#b45309">≈ 0.0902 — about 9%, NOT the 99% most people guess</text>
  <text x="500" y="648" text-anchor="middle" class="d115a-small">91 of every 100 positives are false alarms. Nothing is wrong with the test — a 1% error rate</text>
  <text x="500" y="664" text-anchor="middle" class="d115a-small">applied to 99,900 healthy people produces ten times more false positives than the one true one it competes with.</text>
  <text x="500" y="686" text-anchor="middle" class="d115a-tag">PRIOR × LIKELIHOOD</text>
  <text x="330" y="686" text-anchor="middle" class="d115a-small" fill="#64748b">/</text>
  <text x="670" y="686" text-anchor="middle" class="d115a-tag-blue">EVIDENCE = POSTERIOR</text>
</svg>
