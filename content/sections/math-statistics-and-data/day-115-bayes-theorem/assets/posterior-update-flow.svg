<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="d115f-title d115f-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d115f-title">The same evidence, two base rates, two very different posteriors</title>
  <desc id="d115f-desc">Two animated panels, each showing a prior bar, a positive test result arriving as evidence, and a posterior bar. The left panel starts from a rare 1-in-1,000 prior and lands near 9 percent. The right panel starts from a common 1-in-2 prior and lands at exactly 99 percent, using the identical test and the identical evidence, demonstrating that the base rate decides where the posterior ends up.</desc>

  <style>
    .d115f-bg { fill: #f8fafc; }
    .d115f-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d115f-heading { font-size: 17px; font-weight: 700; fill: #1a202c; }
    .d115f-subheading { font-size: 13px; fill: #475569; }
    .d115f-panel-title { font-size: 14.5px; font-weight: 700; fill: #1a202c; }
    .d115f-label { font-size: 13px; fill: #1a202c; }
    .d115f-small { font-size: 12px; fill: #475569; }
    .d115f-mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d115f-mono-bold { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 14.5px; font-weight: 700; fill: #1a202c; }
    .d115f-track { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    .d115f-prior-bar { fill: #94a3b8; }
    .d115f-posterior-bar-a { fill: #f59e0b; }
    .d115f-posterior-bar-b { fill: #1d4ed8; }
    .d115f-footer { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }

    .d115f-panelA-frame { stroke: #cbd5e1; stroke-width: 1.5; transition: stroke 0.3s, stroke-width 0.3s; }
    .d115f-panelB-frame { stroke: #cbd5e1; stroke-width: 1.5; transition: stroke 0.3s, stroke-width 0.3s; }
    .d115f-panelA-frame { animation: d115f-pulseA 7s ease-in-out infinite; }
    .d115f-panelB-frame { animation: d115f-pulseB 7s ease-in-out infinite; }
    @keyframes d115f-pulseA {
      0%, 8% { stroke: #1d4ed8; stroke-width: 3; }
      45%, 100% { stroke: #cbd5e1; stroke-width: 1.5; }
    }
    @keyframes d115f-pulseB {
      50%, 58% { stroke: #1d4ed8; stroke-width: 3; }
      0%, 45%, 95%, 100% { stroke: #cbd5e1; stroke-width: 1.5; }
    }

    .d115f-token {
      offset-rotate: 0deg;
      opacity: 1;
      animation: d115f-travelA 7s ease-in-out infinite;
    }
    .d115f-tokenA { offset-path: path('M 270 210 L 270 340'); animation-name: d115f-travelA; }
    .d115f-tokenB { offset-path: path('M 770 210 L 770 340'); animation-name: d115f-travelB; }
    @keyframes d115f-travelA {
      0%, 8% { offset-distance: 0%; opacity: 1; }
      40% { offset-distance: 100%; opacity: 1; }
      48%, 100% { offset-distance: 100%; opacity: 0.85; }
    }
    @keyframes d115f-travelB {
      0%, 50% { offset-distance: 0%; opacity: 0.85; }
      58% { offset-distance: 0%; opacity: 1; }
      90% { offset-distance: 100%; opacity: 1; }
      100% { offset-distance: 100%; opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d115f-panelA-frame, .d115f-panelB-frame { animation: none; stroke: #cbd5e1; stroke-width: 1.5; }
      .d115f-token, .d115f-tokenA, .d115f-tokenB { animation: none; offset-distance: 100%; opacity: 1; }
    }
  </style>

  <rect class="d115f-bg" x="0" y="0" width="1000" height="620" />

  <text x="500" y="30" text-anchor="middle" class="d115f-heading">Same evidence. Different base rate. Different answer.</text>
  <text x="500" y="50" text-anchor="middle" class="d115f-subheading">Both panels use the identical 99%-sensitive, 99%-specific test and the identical positive result.</text>

  <!-- PANEL A: rare condition -->
  <rect class="d115f-panel d115f-panelA-frame" x="60" y="80" width="420" height="330" rx="8" />
  <text x="270" y="108" text-anchor="middle" class="d115f-panel-title">PANEL A — RARE CONDITION</text>
  <text x="270" y="126" text-anchor="middle" class="d115f-small">prior = 1 in 1,000</text>

  <text x="90" y="155" class="d115f-label">prior</text>
  <rect class="d115f-track" x="90" y="162" width="360" height="22" rx="4" />
  <rect class="d115f-prior-bar" x="90" y="162" width="0.4" height="22" rx="2" />
  <text x="460" y="178" class="d115f-mono">1/1000</text>

  <line x1="270" y1="195" x2="270" y2="335" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle class="d115f-token d115f-tokenA" r="8" fill="#1d4ed8" />
  <text x="300" y="265" class="d115f-mono">EVIDENCE:</text>
  <text x="300" y="282" class="d115f-mono">positive test</text>
  <text x="300" y="299" class="d115f-mono">LR+ = 99</text>

  <text x="90" y="345" class="d115f-label">posterior</text>
  <rect class="d115f-track" x="90" y="352" width="360" height="22" rx="4" />
  <rect class="d115f-posterior-bar-a" x="90" y="352" width="32.5" height="22" rx="2" />
  <text x="460" y="368" class="d115f-mono-bold" fill="#b45309">0.0902</text>

  <rect x="90" y="385" width="360" height="15" fill="none" />
  <text x="270" y="395" text-anchor="middle" class="d115f-mono-bold" fill="#b45309">≈ 9% — mostly still healthy</text>

  <!-- PANEL B: common condition -->
  <rect class="d115f-panel d115f-panelB-frame" x="520" y="80" width="420" height="330" rx="8" />
  <text x="730" y="108" text-anchor="middle" class="d115f-panel-title">PANEL B — COMMON CONDITION</text>
  <text x="730" y="126" text-anchor="middle" class="d115f-small">prior = 1 in 2</text>

  <text x="550" y="155" class="d115f-label">prior</text>
  <rect class="d115f-track" x="550" y="162" width="360" height="22" rx="4" />
  <rect class="d115f-prior-bar" x="550" y="162" width="180" height="22" rx="2" />
  <text x="920" y="178" class="d115f-mono">1/2</text>

  <line x1="770" y1="195" x2="770" y2="335" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle class="d115f-token d115f-tokenB" r="8" fill="#1d4ed8" />
  <text x="800" y="265" class="d115f-mono">EVIDENCE:</text>
  <text x="800" y="282" class="d115f-mono">positive test</text>
  <text x="800" y="299" class="d115f-mono">LR+ = 99</text>

  <text x="550" y="345" class="d115f-label">posterior</text>
  <rect class="d115f-track" x="550" y="352" width="360" height="22" rx="4" />
  <rect class="d115f-posterior-bar-b" x="550" y="352" width="356.4" height="22" rx="2" />
  <text x="920" y="368" class="d115f-mono-bold" fill="#1d4ed8">0.99</text>

  <rect x="550" y="385" width="360" height="15" fill="none" />
  <text x="730" y="395" text-anchor="middle" class="d115f-mono-bold" fill="#1d4ed8">= 99% — almost certainly the condition</text>

  <!-- Footer -->
  <rect class="d115f-footer" x="60" y="432" width="880" height="164" rx="8" />
  <text x="500" y="460" text-anchor="middle" class="d115f-heading" font-size="15.5px">The base rate decides where you end up</text>
  <text x="500" y="486" text-anchor="middle" class="d115f-mono">posterior odds = prior odds × likelihood ratio</text>
  <text x="500" y="508" text-anchor="middle" class="d115f-label">Panel A: (1/999) × 99 → posterior ≈ 0.0902</text>
  <text x="500" y="528" text-anchor="middle" class="d115f-label">Panel B: (1/1) × 99 → posterior = 0.99 exactly</text>
  <text x="500" y="552" text-anchor="middle" class="d115f-small">The likelihood ratio — how much the evidence is worth — never changed. Only the prior did.</text>
  <text x="500" y="572" text-anchor="middle" class="d115f-small">0.99 was never the wrong number. It was always the right answer to a different question.</text>
</svg>
