slug: descriptive-statistics-that-dont-lie
title: Descriptive Statistics That Don’t Lie
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 17
learning_promise: >-
  After this lesson you will be unable to read a reported mean without asking what shape it hid.
  In 1973 Francis Anscombe published four small datasets that agree, to two decimal places, on the
  mean of x, the mean of y, the variance of both, the correlation, and the fitted regression line —
  and look nothing alike: one is a roughly linear scatter, one is a perfect parabola, one is a
  perfect line with a single outlier dragging it, and one has ten identical x-values and a single
  point that alone determines the slope. You will verify that agreement yourself and then compute
  three diagnostics that finally separate the four sets, none of them part of the classic summary.
  From there you will demonstrate the breakdown point precisely — a single corrupted salary drags a
  mean by over a million dollars while the median does not move a cent, because the median's
  breakdown point is near 50% and the mean's is exactly zero. You will measure Bessel's correction
  by simulation rather than take it on faith: dividing by n underestimates the true variance by
  exactly the factor (n-1)/n, because the sample's own mean is fitted to that sample and sits closer
  to it than the true population mean does. You will compute the 75th percentile of one small array
  under several of NumPy's nine documented interpolation conventions and get genuinely different
  answers, proving that "the percentile" is not a single well-defined number. You will show Pearson's
  correlation collapse to essentially zero on a perfect, deterministic parabola while Spearman's
  rank correlation reports exactly 1.0 on a perfect monotone cubic — the same data, two different
  questions, two very different answers. You will build the smallest possible table demonstrating
  Simpson's paradox, where a treatment wins every subgroup and still loses overall, purely because of
  how the subgroups were weighted. And you will prove that standardising a dataset to mean 0 and
  standard deviation 1 cannot change its correlation with anything else, because correlation is a
  statement about relative structure and standardising changes nothing relative to anything.
objectives:
  - 'Compute mean, median and mode from scratch, and explain precisely when each one misleads, including why "average income" reported as a mean is usually the wrong number'
  - 'State the breakdown point of the mean (exactly zero) and the median (near 50%), and demonstrate the gap with a concrete corrupted salary list where the mean moves by over a million dollars and the median does not move at all'
  - 'Derive and measure Bessel''s correction: explain why dividing a sample''s squared deviations by n underestimates the true population variance by the factor (n-1)/n, and confirm it by simulation over 20,000 trials'
  - 'Show that "the 75th percentile" is not a well-defined number by computing it under several of numpy.percentile''s documented method= conventions and reading off genuinely disagreeing values on the same eight numbers'
  - 'Distinguish Pearson correlation (linear association only) from Spearman correlation (monotone association of any shape), with a worked case — a perfect parabola versus a perfect monotone cubic — where the two report completely different verdicts'
  - 'Reproduce Anscombe''s 1973 quartet, verify its classic summary statistics agree across all four sets to documented precision, and compute three further diagnostics — leverage, outlier ratio, and residual sign changes — that finally separate the four shapes'
  - 'Construct and explain Simpson''s paradox: build the smallest table where one group wins every subgroup comparison and loses the pooled comparison, and explain the weighting mechanism that produces the reversal'
  - 'Compare the standard deviation against the median absolute deviation under 3% contamination, and quantify how many times more the standard deviation inflates'
  - 'Standardise a sample to z-scores and prove, both algebraically and by measurement, that standardising cannot change the Pearson correlation between two variables'
  - 'State when to reach for pandas.DataFrame.describe() versus raw numpy.percentile(), and name the exact interpolation convention each one defaults to'
  - 'Explain Simpson''s paradox as the operational risk behind any aggregated model-evaluation metric, and state the specific question — "what does the subgroup breakdown show" — that defends against it'
prerequisites:
  - 'Days 113-115 — probability rules, random variables and distributions, and Bayes'' theorem; this lesson assumes that vocabulary without repeating it'
  - 'Day 107 — norms, distances and similarity measures, referenced directly by the standardisation section'
  - 'Comfort with Python lists, basic arithmetic, and reading a pytest failure message'
  - 'Days 71-74 — running pytest and reading its skip-versus-fail output'
  - 'Day 43 — python3 -m venv and installing a package with pip'
