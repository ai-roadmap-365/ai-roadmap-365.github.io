<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="d116f-title d116f-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d116f-title">Anscombe's quartet: four differently-shaped scatter plots, one unchanging panel of summary statistics</title>
  <desc id="d116f-desc">Four small scatter plots, each visibly different in shape: set I is roughly linear with scatter, set II is a smooth parabola, set III is a perfect line with one outlier pulling it, and set IV has all its x-values identical except for one point that alone determines the fitted line. Below them a single panel lists mean x = 9.0, mean y = 7.5, variance x = 11.0, variance y about 4.1, correlation about 0.82, and regression slope about 0.50 -- identical figures for all four datasets. An animated highlight walks across the four panels in turn, drawing attention to each differently-shaped plot in sequence while the shared statistics panel never changes.</desc>

  <style>
    .d116f-bg { fill: #f8fafc; }
    .d116f-heading { font-size: 17px; font-weight: 700; fill: #1a202c; }
    .d116f-subheading { font-size: 14px; font-weight: 700; fill: #1a202c; }
    .d116f-label { font-size: 12px; fill: #1a202c; }
    .d116f-small { font-size: 12px; fill: #475569; }
    .d116f-mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d116f-mono-bold { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1a202c; }

    .d116f-panel {
      fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.5;
      animation: d116f-lift 8s ease-in-out infinite;
    }
    .d116f-p1 { animation-delay: 0s; }
    .d116f-p2 { animation-delay: 2s; }
    .d116f-p3 { animation-delay: 4s; }
    .d116f-p4 { animation-delay: 6s; }
    @keyframes d116f-lift {
      0%, 20%, 100% { stroke: #cbd5e1; stroke-width: 2.5; }
      6%, 14%       { stroke: #1d4ed8; stroke-width: 4.5; }
    }

    .d116f-dot { fill: #1d4ed8; }
    .d116f-axis { stroke: #94a3b8; stroke-width: 1.2; }

    .d116f-stats-panel { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }

    @media (prefers-reduced-motion: reduce) {
      .d116f-panel { animation: none; stroke: #cbd5e1; stroke-width: 2.5; }
    }
  </style>

  <rect class="d116f-bg" x="0" y="0" width="1000" height="640" />

  <text x="500" y="32" text-anchor="middle" class="d116f-heading">Four differently-shaped datasets. One unchanging panel of statistics.</text>
  <text x="500" y="52" text-anchor="middle" class="d116f-small">Anscombe's quartet (1973) -- every dataset below agrees on mean, variance, correlation and regression slope.</text>

  <!-- Panel I -->
  <g transform="translate(30,70)">
    <rect class="d116f-panel d116f-p1" x="0" y="0" width="220" height="240" rx="8" />
    <text x="110" y="24" text-anchor="middle" class="d116f-subheading">Set I -- roughly linear</text>
    <line class="d116f-axis" x1="16" y1="200" x2="204" y2="200" />
    <line class="d116f-axis" x1="16" y1="40" x2="16" y2="200" />
    <g transform="translate(16,40)">
      <circle class="d116f-dot" cx="85.2" cy="99.4" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="114.7" r="4.5" /><circle class="d116f-dot" cx="114.8" cy="105.9" r="4.5" /><circle class="d116f-dot" cx="75.3" cy="88.7" r="4.5" /><circle class="d116f-dot" cx="95.1" cy="95.4" r="4.5" /><circle class="d116f-dot" cx="124.7" cy="72.6" r="4.5" /><circle class="d116f-dot" cx="45.6" cy="110.6" r="4.5" /><circle class="d116f-dot" cx="25.9" cy="152.4" r="4.5" /><circle class="d116f-dot" cx="104.9" cy="60.2" r="4.5" /><circle class="d116f-dot" cx="55.5" cy="144.5" r="4.5" /><circle class="d116f-dot" cx="35.8" cy="132.5" r="4.5" />
    </g>
    <text x="110" y="228" text-anchor="middle" class="d116f-small">honest linear scatter</text>
  </g>

  <!-- Panel II -->
  <g transform="translate(270,70)">
    <rect class="d116f-panel d116f-p2" x="0" y="0" width="220" height="240" rx="8" />
    <text x="110" y="24" text-anchor="middle" class="d116f-subheading">Set II -- a smooth curve</text>
    <line class="d116f-axis" x1="16" y1="200" x2="204" y2="200" />
    <line class="d116f-axis" x1="16" y1="40" x2="16" y2="200" />
    <g transform="translate(16,40)">
      <circle class="d116f-dot" cx="85.2" cy="84.0" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="98.0" r="4.5" /><circle class="d116f-dot" cx="114.8" cy="89.6" r="4.5" /><circle class="d116f-dot" cx="75.3" cy="89.2" r="4.5" /><circle class="d116f-dot" cx="95.1" cy="82.4" r="4.5" /><circle class="d116f-dot" cx="124.7" cy="98.6" r="4.5" /><circle class="d116f-dot" cx="45.6" cy="126.2" r="4.5" /><circle class="d116f-dot" cx="25.9" cy="168.6" r="4.5" /><circle class="d116f-dot" cx="104.9" cy="84.2" r="4.5" /><circle class="d116f-dot" cx="55.5" cy="110.4" r="4.5" /><circle class="d116f-dot" cx="35.8" cy="145.6" r="4.5" />
    </g>
    <text x="110" y="228" text-anchor="middle" class="d116f-small">a straight line fit hides the bend</text>
  </g>

  <!-- Panel III -->
  <g transform="translate(510,70)">
    <rect class="d116f-panel d116f-p3" x="0" y="0" width="220" height="240" rx="8" />
    <text x="110" y="24" text-anchor="middle" class="d116f-subheading">Set III -- a line plus one outlier</text>
    <line class="d116f-axis" x1="16" y1="200" x2="204" y2="200" />
    <line class="d116f-axis" x1="16" y1="40" x2="16" y2="200" />
    <g transform="translate(16,40)">
      <circle class="d116f-dot" cx="85.2" cy="107.6" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="117.2" r="4.5" /><circle class="d116f-dot" cx="114.8" cy="33.6" r="5.5" fill="#b91c1c" /><circle class="d116f-dot" cx="75.3" cy="112.5" r="4.5" /><circle class="d116f-dot" cx="95.1" cy="102.7" r="4.5" /><circle class="d116f-dot" cx="124.7" cy="88.2" r="4.5" /><circle class="d116f-dot" cx="45.6" cy="126.9" r="4.5" /><circle class="d116f-dot" cx="25.9" cy="136.5" r="4.5" /><circle class="d116f-dot" cx="104.9" cy="97.9" r="4.5" /><circle class="d116f-dot" cx="55.5" cy="122.1" r="4.5" /><circle class="d116f-dot" cx="35.8" cy="131.8" r="4.5" />
    </g>
    <text x="110" y="228" text-anchor="middle" class="d116f-small">one point (red) drags the whole line</text>
  </g>

  <!-- Panel IV -->
  <g transform="translate(750,70)">
    <rect class="d116f-panel d116f-p4" x="0" y="0" width="220" height="240" rx="8" />
    <text x="110" y="24" text-anchor="middle" class="d116f-subheading">Set IV -- one x-value decides it all</text>
    <line class="d116f-axis" x1="16" y1="200" x2="204" y2="200" />
    <line class="d116f-axis" x1="16" y1="40" x2="16" y2="200" />
    <g transform="translate(16,40)">
      <circle class="d116f-dot" cx="65.4" cy="119.9" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="131.4" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="104.1" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="88.2" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="93.4" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="113.4" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="138.5" r="4.5" /><circle class="d116f-dot" cx="174.1" cy="37.0" r="5.5" fill="#b91c1c" /><circle class="d116f-dot" cx="65.4" cy="134.2" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="101.3" r="4.5" /><circle class="d116f-dot" cx="65.4" cy="115.5" r="4.5" />
    </g>
    <text x="110" y="228" text-anchor="middle" class="d116f-small">ten stacked points, one (red) sets the slope</text>
  </g>

  <!-- Shared, unchanging stats panel -->
  <rect class="d116f-stats-panel" x="30" y="340" width="940" height="270" rx="10" />
  <text x="500" y="368" text-anchor="middle" class="d116f-heading">ONE PANEL OF NUMBERS -- IDENTICAL FOR ALL FOUR DATASETS ABOVE</text>

  <g transform="translate(80,400)">
    <text class="d116f-mono-bold" x="0" y="0">mean(x)  = 9.00</text>
    <text class="d116f-mono-bold" x="0" y="34">mean(y)  = 7.50</text>
    <text class="d116f-mono-bold" x="0" y="68">var(x)   = 11.00</text>
  </g>
  <g transform="translate(400,400)">
    <text class="d116f-mono-bold" x="0" y="0">var(y)   ≈ 4.13</text>
    <text class="d116f-mono-bold" x="0" y="34">r        ≈ 0.816</text>
    <text class="d116f-mono-bold" x="0" y="68">slope    ≈ 0.500</text>
  </g>
  <g transform="translate(700,400)">
    <text class="d116f-label" x="0" y="0">These six numbers are what most</text>
    <text class="d116f-label" x="0" y="20">dashboards would report -- and</text>
    <text class="d116f-label" x="0" y="40">they cannot tell these four apart.</text>
  </g>

  <text x="500" y="480" text-anchor="middle" class="d116f-small">A summary statistic is a compression, and every compression discards. The only professional question is: what did this one hide?</text>
  <text x="500" y="502" text-anchor="middle" class="d116f-small">Every familiar number above agrees. Not one of them could have told you these four plots look nothing alike.</text>

  <line class="d116f-axis" x1="80" y1="530" x2="920" y2="530" />
  <text x="500" y="556" text-anchor="middle" class="d116f-label">Look at the shape. A number alone never proves it.</text>
  <text x="500" y="580" text-anchor="middle" class="d116f-small">Anscombe, F. J. (1973). "Graphs in Statistical Analysis." The American Statistician, 27(1), 17-21.</text>
</svg>
