<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four summaries.">
  <title>What descriptive statistics do</title>
  <style>
    .desc-idea-bg   { fill: #f8fafc; }
    .desc-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .desc-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .desc-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .desc-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .desc-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .desc-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .desc-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .desc-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .desc-idea-stage { opacity: 1; }

    .desc-idea-s0 { animation-delay: 0.00s; }
    .desc-idea-e0 { animation-delay: 0.00s; }
    .desc-idea-s1 { animation-delay: 1.28s; }
    .desc-idea-e1 { animation-delay: 1.28s; }
    .desc-idea-s2 { animation-delay: 2.56s; }
    .desc-idea-e2 { animation-delay: 2.56s; }
    .desc-idea-s3 { animation-delay: 3.84s; }
    .desc-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .desc-idea-conn  { animation: desc-idea-trace 6.4s ease-in-out infinite; }
      .desc-idea-stage { animation: desc-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes desc-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes desc-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .desc-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .desc-idea-stage { animation: desc-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes desc-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="desc-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="desc-idea-bg" width="980" height="322"/>
  <text class="desc-idea-h1"  x="30" y="40">What descriptive statistics do</text>
  <text class="desc-idea-sub" x="30" y="64">Four summaries.</text>
  <g class="desc-idea-stage desc-idea-s0">
    <rect class="desc-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="desc-idea-step" x="44" y="142">01</text>
    <text class="desc-idea-name" x="70" y="142">Centre: where the values sit</text>
    <text class="desc-idea-desc" x="44" y="166">Mean, or median.</text>
  </g>
  <line class="desc-idea-line desc-idea-conn desc-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#desc-idea-tip)"/>
  <g class="desc-idea-stage desc-idea-s1">
    <rect class="desc-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="desc-idea-step" x="280" y="142">02</text>
    <text class="desc-idea-name" x="306" y="142">Spread: how much they vary</text>
    <text class="desc-idea-desc" x="280" y="166">Deviation, or interquartile</text>
    <text class="desc-idea-desc" x="280" y="182">range.</text>
  </g>
  <line class="desc-idea-line desc-idea-conn desc-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#desc-idea-tip)"/>
  <g class="desc-idea-stage desc-idea-s2">
    <rect class="desc-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="desc-idea-step" x="516" y="142">03</text>
    <text class="desc-idea-name" x="542" y="142">Shape: symmetric, skewed, or multimodal</text>
    <text class="desc-idea-desc" x="516" y="166">Which a number cannot convey.</text>
  </g>
  <line class="desc-idea-line desc-idea-conn desc-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#desc-idea-tip)"/>
  <g class="desc-idea-stage desc-idea-s3">
    <rect class="desc-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="desc-idea-step" x="752" y="142">04</text>
    <text class="desc-idea-name" x="778" y="142">And count: how many, and how many missing</text>
    <text class="desc-idea-desc" x="752" y="166">Which is reported far too</text>
    <text class="desc-idea-desc" x="752" y="182">rarely.</text>
  </g>
  <text class="desc-idea-sub" x="30" y="304">Reporting how many values are missing is the discipline most often skipped, and a summary of a column that is half empty is usually meaningless.</text>
</svg>
