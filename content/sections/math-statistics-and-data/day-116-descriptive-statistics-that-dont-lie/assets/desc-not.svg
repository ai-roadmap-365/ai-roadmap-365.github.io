<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things descriptive statistics are not</title>
  <style>
    .desc-not-bg   { fill: #f8fafc; }
    .desc-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .desc-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .desc-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .desc-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .desc-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .desc-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .desc-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .desc-not-row { opacity: 1; }
    .desc-not-r0 { animation-delay: 0.00s; }
    .desc-not-r1 { animation-delay: 0.45s; }
    .desc-not-r2 { animation-delay: 0.90s; }
    .desc-not-r3 { animation-delay: 1.35s; }
    .desc-not-r4 { animation-delay: 1.80s; }
    .desc-not-row { animation: desc-not-reveal 7.3s ease-in-out infinite; }
    @keyframes desc-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="desc-not-bg" width="980" height="390"/>
  <text class="desc-not-h1"  x="30" y="40">Four things descriptive statistics are not</text>
  <text class="desc-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="desc-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="desc-not-name" x="46" y="122">The misconception</text>
  <text class="desc-not-desc" x="46" y="142">Commonly held.</text>
  <text class="desc-not-desc desc-not-row desc-not-r0" x="46" y="182">The mean is the typical value</text>
  <text class="desc-not-desc desc-not-row desc-not-r1" x="46" y="216">A summary replaces the data</text>
  <text class="desc-not-desc desc-not-row desc-not-r2" x="46" y="250">Standard deviation always describes spread</text>
  <text class="desc-not-desc desc-not-row desc-not-r3" x="46" y="284">Outliers should be removed</text>
  <text class="desc-not-desc desc-not-row desc-not-r4" x="46" y="318">Descriptive means objective</text>
  <rect class="desc-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="desc-not-name" x="526" y="122">What is true</text>
  <text class="desc-not-desc" x="526" y="142">Actually.</text>
  <text class="desc-not-desc desc-not-row desc-not-r0" x="526" y="182">Only for symmetric distributions</text>
  <text class="desc-not-desc desc-not-row desc-not-r1" x="526" y="216">Different data can share a summary</text>
  <text class="desc-not-desc desc-not-row desc-not-r2" x="526" y="250">Not for skewed or heavy-tailed data</text>
  <text class="desc-not-desc desc-not-row desc-not-r3" x="526" y="284">Investigate first; they may be the point</text>
  <text class="desc-not-desc desc-not-row desc-not-r4" x="526" y="318">The choice of summary is a choice</text>
  <text class="desc-not-sub" x="30" y="372">Different datasets sharing identical summaries is demonstrable and famous, which is the strongest possible argument for plotting before reporting.</text>
</svg>
