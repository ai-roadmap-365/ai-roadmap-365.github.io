<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the distribution.">
  <title>Which summary when</title>
  <style>
    .desc-when-bg   { fill: #f8fafc; }
    .desc-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desc-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .desc-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .desc-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .desc-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .desc-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .desc-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .desc-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .desc-when-row { opacity: 1; }
    .desc-when-r0 { animation-delay: 0.00s; }
    .desc-when-r1 { animation-delay: 0.45s; }
    .desc-when-r2 { animation-delay: 0.90s; }
    .desc-when-r3 { animation-delay: 1.35s; }
    .desc-when-r4 { animation-delay: 1.80s; }
    .desc-when-row { animation: desc-when-reveal 7.3s ease-in-out infinite; }
    @keyframes desc-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="desc-when-bg" width="980" height="390"/>
  <text class="desc-when-h1"  x="30" y="40">Which summary when</text>
  <text class="desc-when-sub" x="30" y="64">By the distribution.</text>
  <rect class="desc-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="desc-when-name" x="46" y="122">The data</text>
  <text class="desc-when-desc" x="46" y="142">Its shape.</text>
  <text class="desc-when-desc desc-when-row desc-when-r0" x="46" y="182">Roughly symmetric, no outliers</text>
  <text class="desc-when-desc desc-when-row desc-when-r1" x="46" y="216">Skewed</text>
  <text class="desc-when-desc desc-when-row desc-when-r2" x="46" y="250">Heavy-tailed with extremes</text>
  <text class="desc-when-desc desc-when-row desc-when-r3" x="46" y="284">Two or more distinct groups</text>
  <text class="desc-when-desc desc-when-row desc-when-r4" x="46" y="318">Categorical</text>
  <rect class="desc-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="desc-when-name" x="526" y="122">The summary</text>
  <text class="desc-when-desc" x="526" y="142">What to report.</text>
  <text class="desc-when-desc desc-when-row desc-when-r0" x="526" y="182">Mean and standard deviation</text>
  <text class="desc-when-desc desc-when-row desc-when-r1" x="526" y="216">Median and quartiles</text>
  <text class="desc-when-desc desc-when-row desc-when-r2" x="526" y="250">Median, quartiles, and the tail explicitly</text>
  <text class="desc-when-desc desc-when-row desc-when-r3" x="526" y="284">Report per group, never combined</text>
  <text class="desc-when-desc desc-when-row desc-when-r4" x="526" y="318">Counts and proportions</text>
  <text class="desc-when-sub" x="30" y="372">Reporting per group rather than combining is the row that prevents the most misleading tables, and identifying the groups is usually the analysis itself.</text>
</svg>
