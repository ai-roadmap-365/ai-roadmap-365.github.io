visuals:
  - id: summary-anatomy-architecture
    file: assets/summary-anatomy-architecture.svg
    type: diagram
    title: 'Where mean, median and mode land on a symmetric distribution versus a skewed one'
    alt: 'Diagram: two panels showing a symmetric distribution where the mean, median and mode all coincide at the centre, and beside it a right-skewed distribution where the mode stays at the peak, the median shifts right of it, and the mean is pulled furthest right of all past the third quartile, with the interquartile range marked on both'
    description: 'A static architecture diagram, on a light background, split into two side-by-side panels. The left panel, headed "Symmetric: all three agree", draws a bell-shaped histogram in blue bars over a light interquartile-range band, with three vertical lines -- a solid red mean line, a dashed blue median line, and a dotted green mode line -- all landing at the exact centre of the distribution, labelled "mean = median = mode, all three land at the centre." The right panel, headed "Right-skewed: they separate", draws a right-skewed histogram in red-orange bars with a sharp rise and a long declining tail, over a shifted interquartile-range band, with three vertical lines at three DIFFERENT x-positions: a dotted green mode line at the peak of the histogram, a dashed blue median line somewhat to its right, and a solid red mean line furthest right of all, past the third quartile, labelled "the long tail drags the mean past Q3." A shared legend beneath each panel names the three lines and states plainly that the mean is pulled toward the tail, the median is the honest "typical" figure under skew, and the mode stays at the peak regardless of skew.'
  - id: same-summary-different-data-flow
    file: assets/same-summary-different-data-flow.svg
    type: flow-animated
    title: "Anscombe's quartet: four differently-shaped scatter plots, one unchanging panel of summary statistics"
    alt: "Diagram: four small scatter plots of Anscombe's 1973 quartet -- a roughly linear set, a smooth parabola, a line with one outlier, and a set where one x-value alone determines the fitted line -- each visibly different in shape, beside an unchanging panel reporting mean x 9.00, mean y 7.50, variance x 11.00, variance y about 4.13, correlation about 0.816 and regression slope about 0.500, identical across all four"
    description: 'An animated flow diagram, fully readable as a still image. The heading reads "Four differently-shaped datasets. One unchanging panel of statistics." and credits Anscombe''s 1973 quartet. Four side-by-side panels each hold a small scatter plot with its own axes: Set I (roughly linear, captioned "honest linear scatter"), Set II (a smooth parabola, captioned "a straight line fit hides the bend"), Set III (a near-perfect line with one point recoloured red as an outlier, captioned "one point (red) drags the whole line"), and Set IV (ten points stacked at one x-value with a single red point far to the right, captioned "ten stacked points, one (red) sets the slope"). Beneath all four, a single shaded panel headed "ONE PANEL OF NUMBERS -- IDENTICAL FOR ALL FOUR DATASETS ABOVE" lists mean(x) = 9.00, mean(y) = 7.50, var(x) = 11.00, var(y) ≈ 4.13, r ≈ 0.816, and slope ≈ 0.500 in monospace, with a short note that these six numbers are what most dashboards would report and cannot tell the four datasets apart. Each of the four scatter panels'' border briefly thickens and turns blue in sequence, cycling continuously, drawing the eye across all four shapes in turn while the statistics panel beneath never animates at all. A closing line reads "Look at the shape. A number alone never proves it," followed by the Anscombe 1973 citation. A prefers-reduced-motion block stops the border animation and restores every panel to its normal thin grey stroke, leaving all four scatter plots, all axis lines, all captions, and the full statistics panel completely present and legible without any motion.'
