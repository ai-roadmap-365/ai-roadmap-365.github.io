terms:
  - term: 'Mean'
    definition: 'The arithmetic average: the sum of every value divided by the count. It is the single value that minimises the sum of squared distances to every point in the dataset. Its breakdown point is exactly zero -- one arbitrarily extreme value can drag it to any value at all.'
  - term: 'Median'
    definition: 'The middle value once the data is sorted -- the average of the two middle values for an even-length dataset. It depends only on the RANK of values, not their magnitude, which gives it a breakdown point near 50%: close to half the data must be corrupted before it can be forced to move.'
  - term: 'Mode'
    definition: 'The most frequently occurring value or values in a dataset. A distribution can be multimodal; Python''s statistics.mode() (singular) silently returns just one tied value, while statistics.multimode() returns every one.'
  - term: 'Skew'
    definition: 'Asymmetry in a distribution''s shape. A right-skewed distribution (a long tail of unusually high values, such as income or house prices) pulls the mean above the median; a left-skewed distribution pulls it below. For a symmetric distribution, mean, median and mode coincide.'
  - term: 'Breakdown point'
    definition: 'The largest fraction of a dataset that can be replaced with arbitrarily extreme values before a statistic can be dragged to an arbitrary value. The mean''s breakdown point is exactly zero; the median''s is close to 50%.'
  - term: "Bessel's correction"
    definition: 'Dividing a sample''s sum of squared deviations by n-1 rather than n when estimating population variance, correcting a provable low bias of exactly (n-1)/n that arises because the sample''s own mean is fitted to that sample and sits closer to it than the true population mean does. numpy.var() defaults to ddof=0 (the biased n divisor) unless ddof=1 is passed explicitly.'
  - term: 'Percentile'
    definition: 'The value below which a given percentage of the data falls. When the target percentile does not land exactly on a data point -- the ordinary case -- the result depends on an interpolation convention; numpy.percentile() documents nine of them (method=), and they can genuinely disagree on the same data.'
  - term: 'Interquartile range (IQR)'
    definition: 'Q3 minus Q1: the spread of the middle half of a dataset, deliberately ignoring the extreme quarter on each end, which makes it substantially less sensitive to outliers than the standard deviation.'
  - term: 'Median absolute deviation (MAD)'
    definition: 'The median of the absolute deviations of every value from the dataset''s median -- a robust measure of spread built entirely from robust ingredients. Under 3% contamination in this lesson''s lab, the MAD moved by about 1.00x (essentially unchanged) while the standard deviation inflated by about 15.10x.'
  - term: "Pearson correlation"
    definition: "A measure of LINEAR association between two variables, on a scale from -1 to +1. Blind to any non-linear relationship: a perfect, symmetric parabola (y = x^2) has a Pearson correlation of essentially zero despite y being exactly determined by x."
  - term: "Spearman correlation"
    definition: "A measure of MONOTONE association of any shape, computed as Pearson's correlation applied to the RANKS of two variables rather than their raw values. Reports exactly 1.0 for any perfectly increasing relationship, linear or not -- for example, y = x^3."
  - term: "Anscombe's quartet"
    definition: 'Four datasets published by Francis Anscombe in 1973 that agree, to documented precision, on mean x, mean y, variance x, variance y, correlation and regression slope -- and look nothing alike in shape: a roughly linear scatter, a perfect parabola, a perfect line with one outlier, and a set where a single non-repeated x-value determines the entire fitted slope.'
  - term: "Leverage"
    definition: "In a fitted regression line, a measure of how much a single point's X-VALUE ALONE (before its y-value is even considered) could determine the line. Depends only on the x-values, so datasets sharing an x-column share identical leverage; in Anscombe's quartet, set IV's one non-repeated x-value carries almost all the leverage."
  - term: "Simpson's paradox"
    definition: 'A trend that holds in every subgroup of a dataset and reverses when the subgroups are pooled, purely because of how the subgroups were weighted, with no error anywhere in the arithmetic. The overall (pooled) rate is a weighted average of the subgroup rates, and unequal weights across the groups being compared can flip the ranking entirely.'
  - term: 'Standardisation (z-score)'
    definition: '(x - mean) / standard deviation, applied to every value in a dataset, producing a new dataset with mean exactly 0 and standard deviation exactly 1. Standardising does not change the Pearson correlation between two variables, because correlation depends only on relative structure, which a uniform rescaling cannot alter.'
  - term: 'Correlation is not causation'
    definition: 'A correlation between X and Y is consistent with X causing Y, Y causing X, a third factor causing both, or coincidence in a finite sample; the correlation coefficient alone carries no information distinguishing between these. The useful move is actively generating the plausible alternative explanations, not merely reciting the slogan.'
  - term: 'Variance'
    definition: 'The average squared distance of every value from the mean. For a full known population it is exact; for a sample, the naive divide-by-n formula is biased low, which is what Bessel''s correction fixes.'
  - term: 'Contamination'
    definition: "A small fraction of extreme or corrupted values mixed into an otherwise ordinary sample. This lesson's lab measures how differently the standard deviation and the median absolute deviation respond to the same 3% contamination -- a roughly 15x inflation for the standard deviation against essentially no change for the MAD."
