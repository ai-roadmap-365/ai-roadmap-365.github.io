questions:
  - question: 'Anscombe''s four published 1973 datasets agree, to documented precision, on mean x, mean y, variance x, variance y, correlation, and regression slope. What does this actually demonstrate?'
    options:
      - 'Six identical summary statistics can hide very different shapes'
      - 'That Anscombe made a computational error, since real datasets this different could not share so many statistics'
      - 'That correlation is a more reliable statistic than the mean, since it captured the relationship correctly in all four cases'
      - 'That the four datasets are essentially identical and any one of them could stand in for the others'
    answer_index: 0
    explanation: 'The four sets are a roughly linear scatter, a perfect parabola, a perfect line with one outlier, and a set where a single non-repeated x-value determines the entire fitted slope — visibly, dramatically different shapes. Every one of the six classic summary statistics is nonetheless correct and identical (to documented precision) across all four. This is not a coincidence or an error; Anscombe built the datasets deliberately to prove the point. The correlation option above is backwards: correlation is exactly one of the six numbers that failed to distinguish the shapes — it did not "capture the relationship correctly" for the parabola at all, since a parabola has no linear relationship for Pearson''s r to capture.'

  - question: 'A salary list''s largest value ($60,000) is replaced with an obviously corrupted $10,000,000. The mean moves from $50,777.78 to $1,155,222.22. What happens to the median?'
    options:
      - 'It also moves substantially, though by less than the mean'
      - 'It does not move — the value still holds the same rank'
      - 'It moves by a small, bounded amount determined by how many values are below it'
      - 'It is undefined once an extreme outlier is present'
    answer_index: 1
    explanation: 'The median depends only on the RANK of the middle value, never on the magnitude of any value. Whether the largest of nine salaries is $60,000 or $10,000,000, it is still the 9th-ranked (largest) value in a 9-item list, so the median (the 5th-ranked value) is completely unaffected. This is the sharpest way to state the mean-versus-median trade-off: the mean''s breakdown point is exactly zero (one value, arbitrarily corrupted, can drag it anywhere), while the median tolerates close to half the data being corrupted before it can be forced to move at all.'

  - question: 'Dividing a sample''s sum of squared deviations by n, rather than n-1, to estimate the population variance produces a value that is, on average:'
    options:
      - 'Biased high, because squaring always inflates the result'
      - 'Unbiased -- dividing by n is the mathematically correct choice for any sample size'
      - 'Biased low by (n-1)/n, since the mean is fitted to the sample'
      - 'Biased in a direction that depends on whether the population is symmetric or skewed'
    answer_index: 2
    explanation: 'The sample mean is, by construction, the single value that minimises the sum of squared distances to that specific sample. The true population mean is generally a different number and is therefore, on average, no closer to the sample than the sample mean is -- meaning the sample''s squared distances to its own mean are, on average, smaller than its squared distances to the true mean would be. Dividing that understated sum by n understates the true variance by exactly the factor (n-1)/n. A simulation of 20,000 samples of size 5 in this lesson''s lab measured the divide-by-n estimator at 0.8007 of the true variance, matching the predicted (5-1)/5 = 0.8000 to three significant figures.'

  - question: 'The 75th percentile of the array [1, 2, 3, 4, 6, 8, 9, 15] is computed under several of numpy.percentile''s method= conventions. What is the honest conclusion?'
    options:
      - 'They should all agree exactly, since percentile is a precisely defined mathematical concept with one correct answer'
      - 'Only the linear method is correct; the other eight are legacy conventions kept only for backward compatibility'
      - 'They disagree only due to floating-point rounding error, and would agree exactly with infinite precision arithmetic'
      - 'They genuinely disagree — 8.25, 8.0 and 9.0'
    answer_index: 3
    explanation: 'Whenever a target percentile does not land exactly on a data point -- the ordinary case, not a rare edge case -- every implementation must choose how to interpolate, and there is no single universally agreed convention for that choice. NumPy documents nine of them, and on this eight-value array they genuinely disagree: lower and higher do not merely round differently, they select two different real data points from the array. This is not a floating-point artefact; it is a genuine difference in what question each convention answers. pandas.DataFrame.describe() uses the linear convention by default, which is worth knowing precisely because most people never check.'

  - question: 'Pearson''s correlation on a perfect, symmetric parabola (y = x² for x running from -5 to 5) is essentially zero, even though y is exactly, deterministically determined by x. What does this reveal about Pearson''s correlation?'
    options:
      - 'Pearson measures linear association only'
      - 'That Pearson''s correlation is broken and should not be used for any real dataset'
      - 'That the result is a computational bug specific to symmetric data and would not occur for an asymmetric parabola'
      - 'That correlation coefficients should always be computed on ranks rather than raw values to avoid this problem'
    answer_index: 0
    explanation: 'Pearson''s r is built entirely from how well a straight line fits the data. A symmetric parabola gives a straight-line fit literally nothing to grab onto: every unit y rises on one side of the parabola is mirrored by an equal fall on the corresponding point on the other side, and those cancel out exactly in the linear-fit calculation, driving r to (essentially) zero despite total determinism. This is not a flaw to fix -- it is Pearson''s r doing exactly its job, correctly reporting "no linear trend," which is a different and narrower question than "is there a relationship at all." Spearman''s rank correlation answers the broader monotone-relationship question, but even Spearman would correctly report the symmetric parabola as having no consistent (non-monotone) trend either -- the parabola both rises and falls as x increases from -5 to 5, so it fails the monotone test as much as the linear one.'

  - question: 'In the smallest table demonstrating Simpson''s paradox, treatment A beats treatment B in the easy subgroup (100% vs 90%) and in the hard subgroup (10% vs 0%), yet treatment B wins overall (81.8% vs 11.0%). What produces the reversal?'
    options:
      - 'A calculation error somewhere in the pooled totals -- one of the subgroup or overall numbers must be wrong'
      - 'The two treatments were tried in very different subgroups'
      - 'Treatment B is secretly better and the subgroup comparisons were measured incorrectly'
      - 'Simpson''s paradox only occurs with very small sample sizes and would not appear with more data'
    answer_index: 1
    explanation: 'Every number in this table is exact arithmetic on the same fixed counts; nothing is miscalculated in either direction. The overall rate for each treatment is total successes divided by total trials, which is a WEIGHTED average of the subgroup rates -- and the weights (how many trials landed in the easy subgroup versus the hard one) differ dramatically between the two treatments. Pooling erases exactly the information -- which subgroup each trial came from -- that would explain the true picture, and once erased, the pooled comparison answers a different, less useful question than "which treatment works better, controlling for difficulty." Simpson''s paradox is not a small-sample artefact; it is the generic behaviour of any weighted average whenever the weights differ and correlate with the outcome, at any scale.'

  - question: 'A clean sample and a 3%-contaminated version of it (97 clean values plus 3 extreme outliers) are compared using the standard deviation and the median absolute deviation (MAD). What is the honest result?'
    options:
      - 'Both measures inflate by roughly the same amount, since both measure "spread"'
      - 'The MAD inflates more than the standard deviation, because it uses absolute values rather than squares'
      - 'SD inflates about 15x while MAD barely moves'
      - 'Neither measure changes meaningfully, since 3% is too small a fraction to matter'
    answer_index: 2
    explanation: 'A measured run in this lesson''s lab found the standard deviation inflating from 4.565 to 68.918 -- about a 15x increase -- from just 3 contaminated values out of 100, while the median absolute deviation moved from 2.869 to 2.863, essentially unchanged. The standard deviation is doubly compromised by outliers: it squares distances (which weights large deviations heavily) FROM the mean, and the mean itself is already dragged toward the outliers. The MAD is built from robust ingredients at every step -- the median first, then the median (not the mean) of the absolute deviations from it -- which is exactly why 3% contamination barely registers.'

  - question: 'A dataset is standardised to z-scores: every value has (mean subtracted, then divided by standard deviation) applied to it, giving the new dataset mean 0 and standard deviation 1. What happens to its Pearson correlation with a second variable?'
    options:
      - 'It changes, because rescaling the units always changes how strongly two variables appear to move together'
      - 'It becomes exactly 1.0 for any two standardised variables, regardless of their original relationship'
      - 'It cannot be computed on standardised data, since standardisation removes the original units correlation depends on'
      - 'It stays the same — correlation is about relative structure'
    answer_index: 3
    explanation: 'A measured example in this lesson found the Pearson correlation identical before and after standardising -- 0.9701497165 both times, differing only by 3.33e-16, which is floating-point noise rather than a real difference. This is not a coincidence: standardising applies the same linear rescaling (subtract a constant, divide by a constant) to every value in a variable, which changes the units a value is measured in but changes nothing about how far any one point sits from any other point, relatively. Correlation, being built entirely from relative structure, is invariant to exactly this kind of transformation -- which is why standardisation is a safe preprocessing step before correlation-based analysis, never a risky one.'
