terms:
  - term: 'Contour plot'
    definition: 'A picture of a function of two variables built from level curves or level bands — regions of roughly equal value. Every contour plot in this lesson starts from the same triple of arrays, (X, Y, Z), produced by evaluating a function over a grid.'
  - term: 'numpy.meshgrid'
    definition: 'A NumPy function that takes two 1D arrays of coordinates and expands them into two 2D arrays, X and Y, such that X[i, j] and Y[i, j] together give the coordinates of grid cell (i, j). Applying a function to both arrays at once, vectorized, produces a value array Z with the same shape.'
  - term: 'Level band'
    definition: 'A range of values shaded with one character or colour. This lesson''s ASCII and Pillow contour renderers both shade by level band: every grid cell is assigned to a band by where its value falls between the grid''s own minimum and maximum, and the boundary between two bands is wherever two adjacent cells happen to land in different bands.'
  - term: 'Marching squares'
    definition: 'An algorithm that traces a level LINE rather than shading a level band: for one specific value, it finds exactly where that value''s curve crosses each grid cell''s edges by linear interpolation, then connects the crossings into a smooth line. matplotlib''s contour function implements this; this lesson describes it but implements only the simpler level-band version.'
  - term: 'World-to-pixel transform'
    definition: 'The function that maps a data-space point (x, y) to an image-space pixel (column, row). x needs no flip because it grows rightward in both spaces; y needs one, because y grows upward in data space while pixel row 0 is the top of the image, so pixel row is computed from (ymax - y) rather than (y - ymin).'
  - term: 'Loss curve'
    definition: 'A plot of a loss value against training iteration. Read on a linear axis it shows whether the loss is decreasing; read on a log axis, for a linearly convergent method, it becomes a straight line whose slope is the convergence rate itself.'
  - term: 'Linear convergence'
    definition: 'A convergence pattern where the error shrinks by roughly the same multiplicative ratio r at every step: loss_n is approximately c times r to the n. Its defining signature is a straight line on a log-scaled loss-against-iteration plot.'
  - term: 'Convergence rate'
    definition: 'The constant ratio r (or its logarithm) that governs how fast a linearly convergent method''s error shrinks per step. On a log-scale loss curve it is literally the slope of the line, not a separately computed quantity.'
  - term: 'Gradient norm'
    definition: 'The magnitude (Euclidean length) of the gradient vector at a point, written ||grad f(x)||. It distinguishes a run that has genuinely converged (gradient near zero) from one merely stalled on a flat plateau or oscillating on a stability boundary (gradient not shrinking toward zero even though the loss has stopped changing).'
  - term: 'Path length'
    definition: 'The total Euclidean distance travelled along an optimization path: the sum of the step sizes between every pair of consecutive points. Two runs can reach nearly identical final losses with path lengths differing by an order of magnitude or more, which is exactly what happened in this lesson''s opening comparison.'
  - term: 'Condition number'
    definition: 'Informally, how stretched a bowl-shaped loss surface is along one axis relative to another. A well-conditioned bowl (equal stretch in every direction) lets gradient descent head almost straight for the minimum; an ill-conditioned one (very different stretch along different axes) forces the steepest-descent direction to point mostly across the narrow axis, producing the zig-zag this lesson measures directly.'
  - term: 'Learning-rate sweep'
    definition: 'Running the same optimization, from the same start, for the same number of steps, once per learning rate across a range of values, then plotting the final loss against the rate. Its characteristic shape is slow convergence at the low end, a broad basin of good rates, and a sharp cliff at the stability threshold beyond which every run diverges.'
  - term: 'Stability threshold'
    definition: 'The learning rate beyond which an iterative update stops converging and starts diverging. For gradient descent on f(x) = a*x^2, the exact threshold is eta = 1/a: below it the update multiplier |1 - 2*a*eta| is under 1 and the run shrinks toward the minimum; above it, the multiplier exceeds 1 and the run grows without bound.'
  - term: 'Numeric overflow (in a learning-rate sweep)'
    definition: 'The point at which a diverging run''s value grows past the largest number a float64 can represent (about 1.8e308) and becomes float(''inf''). This lesson''s sweep catches it deliberately with numpy.errstate and an explicit isfinite check after every step, rather than letting a warning or an OverflowError interrupt the sweep.'
  - term: 'Colour ramp'
    definition: 'A rule mapping a rescaled value to a colour, usually defined by a small number of named "stops" with linear interpolation between them. This lesson''s ramp runs from dark blue (lowest value) through blue and gold to dark red (highest), implemented with numpy.interp on each colour channel independently.'
