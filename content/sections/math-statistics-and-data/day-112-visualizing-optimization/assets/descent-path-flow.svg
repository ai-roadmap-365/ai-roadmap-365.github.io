<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="d112fTitleId d112fDescId">
  <title id="d112fTitleId">A marker walking down a contour bowl on the left while its matching loss curve draws itself on the right</title>
  <desc id="d112fDescId">On the left, a marker travels along a descent path across a shaded contour bowl from an outer starting point toward a central minimum. On the right, a loss curve on a log-scaled vertical axis lights up point by point in step with the marker, ending as a straight declining line. Both panels share the same six numbered steps. With motion disabled, the full path, all six markers, and the complete loss line are all shown at once.</desc>

  <style>
    .d112f-bg     { fill: #f8fafc; }
    .d112f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d112f-sub    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d112f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d112f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d112f-axis   { stroke: #1a202c; stroke-width: 1.5; }
    .d112f-tick   { stroke: #64748b; stroke-width: 1; }
    .d112f-path   { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linejoin: round; }
    .d112f-marker { fill: #ffffff; stroke: #1a202c; stroke-width: 1.5; }
    .d112f-line   { fill: none; stroke: #1d4ed8; stroke-width: 2.5; }

    /* Motion 1 -- the marker travels the descent path, resting visible at the start. */
    .d112f-token {
      fill: #f8fafc; stroke: #1d4ed8; stroke-width: 2;
      offset-path: path('M 402 140 L 335 174 L 290 230 L 260 268 L 245 283 L 234 268 L 230 260');
      offset-rotate: 0deg;
      animation: d112f-travel 6s ease-in-out infinite;
    }
    @keyframes d112f-travel {
      0%   { offset-distance: 0%;   opacity: 1; }
      8%   { offset-distance: 0%;   opacity: 1; }
      92%  { offset-distance: 100%; opacity: 1; }
      100% { offset-distance: 100%; opacity: 1; }
    }

    /* Motion 3 -- the six loss-curve points light up in the same order, so the
       right panel appears to "draw itself" in step with the travelling marker. */
    .d112f-point  { fill: #1d4ed8; stroke: #1a202c; stroke-width: 1; animation: d112f-lift 6s ease-in-out infinite; }
    .d112f-p1 { animation-delay: 0.6s; }
    .d112f-p2 { animation-delay: 1.6s; }
    .d112f-p3 { animation-delay: 2.6s; }
    .d112f-p4 { animation-delay: 3.6s; }
    .d112f-p5 { animation-delay: 4.6s; }
    .d112f-p6 { animation-delay: 5.4s; }
    @keyframes d112f-lift {
      0%, 14%, 100% { fill: #1d4ed8; r: 5; }
      6%            { fill: #fac515; r: 8; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d112f-token { animation: none; offset-distance: 0%; opacity: 1; }
      .d112f-point { animation: none; fill: #1d4ed8; r: 5; }
    }
  </style>

  <rect class="d112f-bg" x="0" y="0" width="1000" height="460" />
  <text class="d112f-title" x="24" y="34">One run, two pictures</text>
  <text class="d112f-sub" x="24" y="54">The contour path and the loss curve are the same six steps, seen two different ways.</text>

  <!-- left panel: THE PATH -->
  <text class="d112f-label" x="20" y="82">THE PATH</text>
  <g transform="translate(230,260)">
    <rect x="-190" y="-150" width="380" height="300" rx="16" fill="#7f1d1d" />
    <rect x="-150" y="-118" width="300" height="236" rx="14" fill="#b91c1c" />
    <rect x="-112" y="-88"  width="224" height="176" rx="12" fill="#1d4ed8" />
    <rect x="-74"  y="-58"  width="148" height="116" rx="10" fill="#2563eb" />
    <rect x="-36"  y="-28"  width="72"  height="56"  rx="8"  fill="#0d1b54" />
  </g>

  <path class="d112f-path" d="M 402 140 L 335 174 L 290 230 L 260 268 L 245 283 L 234 268 L 230 260" />
  <g>
    <circle class="d112f-marker" cx="402" cy="140" r="6" />
    <circle class="d112f-marker" cx="335" cy="174" r="6" />
    <circle class="d112f-marker" cx="290" cy="230" r="6" />
    <circle class="d112f-marker" cx="260" cy="268" r="6" />
    <circle class="d112f-marker" cx="245" cy="283" r="6" />
    <circle class="d112f-marker" cx="234" cy="268" r="6" />
    <circle class="d112f-marker" cx="230" cy="260" r="6" />
  </g>
  <circle class="d112f-token" r="9" />
  <text class="d112f-small" x="24" y="424">Minimum near the centre; the marker starts at the outer edge (step 1) and ends there.</text>

  <!-- right panel: THE LOSS CURVE -->
  <text class="d112f-label" x="560" y="82">THE LOSS CURVE (log scale)</text>
  <line class="d112f-axis" x1="560" y1="120" x2="560" y2="380" />
  <line class="d112f-axis" x1="560" y1="380" x2="940" y2="380" />
  <text class="d112f-label" x="600" y="410">step</text>
  <text class="d112f-label" x="520" y="250" transform="rotate(-90 520 250)" text-anchor="middle">loss (log10 scale)</text>

  <g class="d112f-small">
    <line class="d112f-tick" x1="580" y1="380" x2="580" y2="386" /><text x="580" y="400" text-anchor="middle">1</text>
    <line class="d112f-tick" x1="640" y1="380" x2="640" y2="386" /><text x="640" y="400" text-anchor="middle">2</text>
    <line class="d112f-tick" x1="700" y1="380" x2="700" y2="386" /><text x="700" y="400" text-anchor="middle">3</text>
    <line class="d112f-tick" x1="760" y1="380" x2="760" y2="386" /><text x="760" y="400" text-anchor="middle">4</text>
    <line class="d112f-tick" x1="820" y1="380" x2="820" y2="386" /><text x="820" y="400" text-anchor="middle">5</text>
    <line class="d112f-tick" x1="880" y1="380" x2="880" y2="386" /><text x="880" y="400" text-anchor="middle">6</text>

    <line class="d112f-tick" x1="554" y1="150" x2="560" y2="150" /><text x="546" y="154" text-anchor="end">10^1</text>
    <line class="d112f-tick" x1="554" y1="230" x2="560" y2="230" /><text x="546" y="234" text-anchor="end">10^0</text>
    <line class="d112f-tick" x1="554" y1="310" x2="560" y2="310" /><text x="546" y="314" text-anchor="end">10^-1</text>
  </g>

  <path class="d112f-line" d="M 580 150 L 640 190 L 700 230 L 760 270 L 820 310 L 880 350" />
  <circle class="d112f-point d112f-p1" cx="580" cy="150" r="5" />
  <circle class="d112f-point d112f-p2" cx="640" cy="190" r="5" />
  <circle class="d112f-point d112f-p3" cx="700" cy="230" r="5" />
  <circle class="d112f-point d112f-p4" cx="760" cy="270" r="5" />
  <circle class="d112f-point d112f-p5" cx="820" cy="310" r="5" />
  <circle class="d112f-point d112f-p6" cx="880" cy="350" r="5" />

  <text class="d112f-small" x="560" y="424">A straight line here means this run decays by the same ratio every step.</text>

  <text class="d112f-sub" x="24" y="450">The marker's position on the left and the line's length on the right are the same six numbers, read two ways.</text>
</svg>
