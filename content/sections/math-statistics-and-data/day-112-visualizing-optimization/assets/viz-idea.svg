<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four features.">
  <title>What a loss surface shows</title>
  <style>
    .viz-idea-bg   { fill: #f8fafc; }
    .viz-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .viz-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .viz-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .viz-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .viz-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .viz-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .viz-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .viz-idea-stage { opacity: 1; }

    .viz-idea-s0 { animation-delay: 0.00s; }
    .viz-idea-e0 { animation-delay: 0.00s; }
    .viz-idea-s1 { animation-delay: 1.28s; }
    .viz-idea-e1 { animation-delay: 1.28s; }
    .viz-idea-s2 { animation-delay: 2.56s; }
    .viz-idea-e2 { animation-delay: 2.56s; }
    .viz-idea-s3 { animation-delay: 3.84s; }
    .viz-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .viz-idea-conn  { animation: viz-idea-trace 6.4s ease-in-out infinite; }
      .viz-idea-stage { animation: viz-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes viz-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes viz-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .viz-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .viz-idea-stage { animation: viz-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes viz-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="viz-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="viz-idea-bg" width="980" height="322"/>
  <text class="viz-idea-h1"  x="30" y="40">What a loss surface shows</text>
  <text class="viz-idea-sub" x="30" y="64">Four features.</text>
  <g class="viz-idea-stage viz-idea-s0">
    <rect class="viz-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="viz-idea-step" x="44" y="142">01</text>
    <text class="viz-idea-name" x="70" y="142">The surface: loss as a function of parameters</text>
    <text class="viz-idea-desc" x="44" y="166">Height is error.</text>
  </g>
  <line class="viz-idea-line viz-idea-conn viz-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#viz-idea-tip)"/>
  <g class="viz-idea-stage viz-idea-s1">
    <rect class="viz-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="viz-idea-step" x="280" y="142">02</text>
    <text class="viz-idea-name" x="306" y="142">Minima: basins the optimiser can settle into</text>
    <text class="viz-idea-desc" x="280" y="166">Global, or merely local.</text>
  </g>
  <line class="viz-idea-line viz-idea-conn viz-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#viz-idea-tip)"/>
  <g class="viz-idea-stage viz-idea-s2">
    <rect class="viz-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="viz-idea-step" x="516" y="142">03</text>
    <text class="viz-idea-name" x="542" y="142">Saddles: flat in one direction, sloped in another</text>
    <text class="viz-idea-desc" x="516" y="166">Which slow progress badly.</text>
  </g>
  <line class="viz-idea-line viz-idea-conn viz-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#viz-idea-tip)"/>
  <g class="viz-idea-stage viz-idea-s3">
    <rect class="viz-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="viz-idea-step" x="752" y="142">04</text>
    <text class="viz-idea-name" x="778" y="142">And plateaus: nearly flat regions</text>
    <text class="viz-idea-desc" x="752" y="166">Where gradients are tiny.</text>
  </g>
  <text class="viz-idea-sub" x="30" y="304">Saddles rather than local minima are the main obstacle in high dimensions, because a point that is a minimum in every one of a thousand directions is very unlikely.</text>
</svg>
