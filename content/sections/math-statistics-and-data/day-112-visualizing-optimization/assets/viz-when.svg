<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to visualise</title>
  <style>
    .viz-when-bg   { fill: #f8fafc; }
    .viz-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .viz-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .viz-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .viz-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .viz-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .viz-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz-when-row { opacity: 1; }
    .viz-when-r0 { animation-delay: 0.00s; }
    .viz-when-r1 { animation-delay: 0.45s; }
    .viz-when-r2 { animation-delay: 0.90s; }
    .viz-when-r3 { animation-delay: 1.35s; }
    .viz-when-r4 { animation-delay: 1.80s; }
    .viz-when-row { animation: viz-when-reveal 7.3s ease-in-out infinite; }
    @keyframes viz-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="viz-when-bg" width="980" height="390"/>
  <text class="viz-when-h1"  x="30" y="40">When to visualise</text>
  <text class="viz-when-sub" x="30" y="64">And when not to.</text>
  <rect class="viz-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="viz-when-name" x="46" y="122">Visualise</text>
  <text class="viz-when-desc" x="46" y="142">Four cases.</text>
  <text class="viz-when-desc viz-when-row viz-when-r0" x="46" y="182">Diagnosing a failing training run</text>
  <text class="viz-when-desc viz-when-row viz-when-r1" x="46" y="216">Comparing optimisers or schedules</text>
  <text class="viz-when-desc viz-when-row viz-when-r2" x="46" y="250">Teaching and building intuition</text>
  <text class="viz-when-desc viz-when-row viz-when-r3" x="46" y="284">Investigating instability</text>
  <text class="viz-when-desc viz-when-row viz-when-r4" x="46" y="318">Always plot the training curves</text>
  <rect class="viz-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="viz-when-name" x="526" y="122">Do not bother</text>
  <text class="viz-when-desc" x="526" y="142">Also four.</text>
  <text class="viz-when-desc viz-when-row viz-when-r0" x="526" y="182">Training that is already working</text>
  <text class="viz-when-desc viz-when-row viz-when-r1" x="526" y="216">As evidence for a general claim</text>
  <text class="viz-when-desc viz-when-row viz-when-r2" x="526" y="250">Where the compute cost is significant</text>
  <text class="viz-when-desc viz-when-row viz-when-r3" x="526" y="284">Very high-dimensional landscape plots</text>
  <text class="viz-when-desc viz-when-row viz-when-r4" x="526" y="318">Instead of a validation metric</text>
  <text class="viz-when-sub" x="30" y="372">Always plotting the training curves is the one unconditional recommendation here, since they cost nothing and answer most questions people ask.</text>
</svg>
