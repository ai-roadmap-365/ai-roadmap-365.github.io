visuals:
  - id: plot-anatomy-architecture
    file: assets/plot-anatomy-architecture.svg
    type: diagram
    title: 'The anatomy of a contour plot: level bands, the colour ramp, a start point, a descent path, and the minimum'
    alt: 'Diagram: the anatomy of a contour plot, showing five nested level bands shaded from dark blue at the outside to dark red at the centre, each band labelled with its value range, a white descent path with numbered step markers running from a start point at the outer edge to the minimum near the centre, both axes labelled x and y with tick values, and a horizontal colour ramp legend beneath explaining low to high value and which end is the minimum'
    description: 'A static architecture diagram on a light background, labelled "THE ANATOMY OF A CONTOUR PLOT" at the top with a subheading stating that every picture on this page is built from one array of values, mapped to colour, with a path drawn on top. The main panel holds a large square contour region made of five concentric, roughly diamond-shaped level bands, shaded from a dark blue outer band through blue and gold to a dark red band at the very centre, each band edge labelled in small monospace with the value range it covers, for example "0 to 2", "2 to 8", up to the innermost "32+". A labelled point near the outer edge, marked with a filled circle and the text "START (x0, y0)", begins a white polyline with six small circular markers spaced along it, each numbered 1 through 6 in order, weaving slightly before settling at a point near the centre marked with a small target symbol and the label "MINIMUM". Both the horizontal and vertical axes are drawn along the left and bottom edges of the panel with evenly spaced tick marks and numeric labels, and axis titles read "x" and "y" respectively. Beneath the main panel, a full-width horizontal colour-ramp bar repeats the same dark-blue-to-dark-red gradient used in the bands, with a tick and label at each end reading "LOW VALUE (near the minimum)" on the blue side and "HIGH VALUE (far from the minimum)" on the red side, and a short caption beneath the bar states that colour alone never carries information that is not also shown by a label, a tick, or a marker elsewhere in the picture. A small side note to the right of the main panel lists the three components in monospace: "Z = f(X, Y) via meshgrid", "colour = ramp(rescale(Z))", "pixel = world_to_pixel(x, y)".'
  - id: descent-path-flow
    file: assets/descent-path-flow.svg
    type: flow-animated
    title: 'A marker walking down a contour bowl on the left while its matching loss curve draws itself on the right'
    alt: 'Diagram: on the left, a marker travelling along a spiral descent path across a shaded contour bowl from an outer starting point toward a central minimum; on the right, a loss curve on a log-scaled vertical axis drawing itself point by point in step with the marker, ending as a straight declining line, with both panels sharing the same six numbered steps'
    description: 'An animated flow diagram, fully readable as a still image, titled "ONE RUN, TWO PICTURES" with a subheading stating that the contour path and the loss curve are the same six steps, seen two different ways. The picture is split into two square panels side by side. The left panel, headed "THE PATH", shows the same nested blue-to-red level bands as the architecture diagram with a white descent path already fully drawn from an outer start point to a central minimum, passing through six numbered markers; one marker, a filled white circle with a subtle glow, travels along the path from marker 1 to marker 6 and back over the course of the animation cycle, so the eye can follow which point in the path corresponds to which point in time. The right panel, headed "THE LOSS CURVE (log scale)", draws a set of axes with the vertical axis labelled "loss (log10 scale)" carrying tick labels at decreasing powers of ten and the horizontal axis labelled "step" carrying tick marks 1 through 6; a blue polyline is drawn progressively from left to right in step with the travelling marker in the left panel, so that when the marker is at step 3 on the path, the loss curve is drawn only as far as step 3, and a small blue token at the growing tip of the line pulses gently. A connecting caption beneath both panels reads "the marker''s position on the LEFT and the line''s length on the RIGHT are the same six numbers, read two ways" and states that the loss curve is a straight line here because this run''s loss decays geometrically. A prefers-reduced-motion block stops both the travelling marker and the progressive line-drawing, restoring the resting state in which the full white path and all six markers are shown at full opacity on the left, and the complete loss line through all six points is shown at full opacity on the right, so every number and both panel headings remain legible without motion.'
