questions:
  - question: 'Two training runs land within 3% of the same final loss. Their path lengths, measured this lesson at 5.6075 and 75.9767, differ by over 13x. What does that difference tell you that the final-loss number alone could not?'
    options:
      - 'Nothing real — path length is an artifact of the coordinate system, not the optimization'
      - 'The run with the longer path used a larger learning rate and will always converge faster on a new problem'
      - 'One run descended nearly straight to the minimum while the other zig-zagged across a narrow valley for most of its steps, which is a sign the second run is more fragile to a changed starting point or learning rate'
      - 'The two runs actually reached different minima, and the final-loss numbers are misleading'
    answer_index: 2
    explanation: 'Both runs in this lesson start at the same point, use the same learning rate, and take the same number of steps — the only difference is the shape of the bowl they descend. The short, direct path (5.6075) belongs to a well-conditioned, round bowl; the long, zig-zagging path (75.9767) belongs to an ill-conditioned, narrow one, where the steepest-descent direction points mostly across the valley rather than along it. A run that only just arrived by accumulating many small corrections is one bad step away from overshooting entirely — you can watch that happen at a slightly larger learning rate in the sweep. The final-loss number cannot see any of this; only the path can.'

  - question: 'A loss curve is plotted on a log-scaled vertical axis. For the first half of training it is a straight line; for the second half it visibly bends flatter. What does the bend mean?'
    options:
      - 'Nothing — a log axis always looks slightly curved and the bend is a plotting artifact'
      - 'The run has diverged, because a straight line means convergence and a curve means the opposite'
      - 'The convergence rate itself changed partway through training — the run is no longer decaying by the same constant ratio per step'
      - 'The loss function changed definition partway through, which is the only thing that can cause a log-axis bend'
    answer_index: 2
    explanation: 'For a linearly convergent method, loss_n is approximately c times r to the n, so log(loss_n) is a straight line in n with slope log(r) — the rate. A bend away from straight is telling you, directly and quantitatively, that r itself is no longer constant: the run sped up or slowed down. This is the single most useful reading skill the lesson teaches, because it turns "the loss went down" into a checkable claim about how. The well-conditioned run measured in this lesson is exactly linear (consecutive-loss ratio 0.853776 on every one of its sixty steps), and fitting a line to its own drawn pixel coordinates gives a residual on the order of 1e-13 — not asserted, measured.'

  - question: 'world_to_pixel computes pixel column from (x - xmin) but pixel row from (ymax - y), not (y - ymin). Why the difference between the two axes?'
    options:
      - 'It is arbitrary — either formula for y would work equally well as long as it is used consistently'
      - 'x grows rightward in both data space and pixel space, so no flip is needed; y grows upward in data space but pixel row 0 is the TOP of the image, so a larger y must produce a SMALLER row'
      - 'Pillow requires row-major arrays, which forces the row formula to subtract from ymax rather than ymin'
      - 'The flip corrects for the fact that meshgrid returns Y before X'
    answer_index: 1
    explanation: 'Two coordinate systems disagree about which way is "up": data coordinates put larger y higher on the page, while pixel coordinates count rows downward from the top. x has no such disagreement — larger x is to the right in both systems — so its formula needs no flip. Getting the y-flip backwards is dangerous specifically because a heatmap of a bowl centred at the origin is vertically symmetric on its own, so the bug is invisible until something asymmetric — a descent path — is drawn on top of it, at which point it walks toward the wrong edge.'

  - question: 'A run''s loss has been flat for the last twenty steps. The gradient norm over the same twenty steps is also flat, holding steady at a nonzero value rather than approaching zero. What does that combination indicate?'
    options:
      - 'The run has converged to a good minimum — a flat loss always means convergence'
      - 'The run is oscillating rather than converging — a genuinely converged run''s gradient norm should be shrinking toward zero, not holding steady at a nonzero value'
      - 'The learning rate is too small, which is why the loss looks flat'
      - 'The gradient norm is irrelevant once the loss has stopped changing'
    answer_index: 1
    explanation: 'A flat loss is ambiguous by itself — it could mean genuine convergence (gradient near zero, nothing left to do) or a plateau (gradient small for an unrelated reason). But a gradient norm that is flat and NONZERO is a third, distinct signal: at exactly the stability threshold of a quadratic (eta = 1 for f(x) = x^2), x flips sign every step forever, the loss sits fixed at its starting value, and the gradient magnitude sits fixed at exactly 8.0, never shrinking. That is neither convergence nor a plateau near a minimum — it is a run stuck oscillating on the boundary of stability, and only tracking the gradient''s own magnitude reveals it.'

  - question: 'In a learning-rate sweep on f(x) = x^2 over 300 steps, eta = 2.05 produces a large but finite loss (about 1.05e296) while eta = 2.15 produces float(''inf''). Both are past the theoretical divergence threshold eta = 1. What is the correct way to describe eta = 2.05''s result?'
    options:
      - 'It is converging, just slowly, because the value is still finite'
      - 'It is a bug in the sweep — a diverging run should always report inf'
      - 'It is already diverging exponentially; it simply has not yet grown past the largest number float64 can represent within the 300 steps this sweep runs'
      - 'It is a rounding error and should be discarded from the sweep'
    answer_index: 2
    explanation: 'A run with |1 - 2*eta| > 1 diverges exponentially regardless of whether the specific number your interpreter prints is finite or inf — "finite" and "converging" are not the same claim. eta = 2.05 and eta = 2.15 are both past the exact threshold eta = 1; they differ only in whether 300 steps of exponential growth from x0 = 4.0 has yet exceeded roughly 1.8e308, the largest representable float64. Treating "still prints a number" as "still converging" is exactly the mistake this lesson warns against, and the sweep code catches the eventual overflow deliberately with numpy.errstate rather than letting a warning or exception interrupt it.'

  - question: 'Why does this lesson''s lab shade a contour by level BAND (rescale values into a small number of ranges and colour each range) rather than trace level LINES with marching squares?'
    options:
      - 'Level-band shading is simpler and cheaper to compute, and is entirely sufficient for showing where a descent path went relative to the surface''s shape — precise level lines matter more when publishing an exact contour at a specific value, which is a different job'
      - 'Level bands are mathematically more accurate than level lines'
      - 'Marching squares cannot be implemented without matplotlib installed'
      - 'Level lines only work for one-dimensional functions'
    answer_index: 0
    explanation: 'Marching squares finds, for one specific value, exactly where that value''s curve crosses each grid cell''s edges by linear interpolation, then connects the crossings into a smooth line — real extra work for a real extra guarantee (a precise, continuous contour at an exact level). For this lesson''s purpose, seeing roughly where a path crossed a valley versus where it ran along the bottom, shading by band is both simpler to implement correctly and entirely sufficient. matplotlib''s contour function does the marching-squares version for you; contourf does level bands. Neither is "more accurate" in general — they answer different questions.'

  - question: 'What is the one thing a loss-against-iteration curve can never show you that a contour-and-path plot can?'
    options:
      - 'The final loss value reached'
      - 'Whether the run diverged'
      - 'WHY a run was slow — for example, that it zig-zagged across a narrow valley rather than heading directly toward the minimum'
      - 'How many steps the run took'
    answer_index: 2
    explanation: 'A loss curve shows one number — how altitude changed over time — and a zig-zagging, inefficient path can produce a perfectly ordinary-looking, monotonically decreasing loss curve, the same shape a direct, efficient path produces. The zig-zag is only visible once you draw the actual route on the actual surface. This is precisely why the lesson opens with two runs whose loss curves would look unremarkably similar and whose contour-and-path pictures would look completely different.'

  - question: 'A learning-rate sweep on f(x) = x^2 finds that etas from 0.05 through 0.95 all drive the loss to near zero, with the best result at eta = 0.45. What does the existence of that whole range, rather than a single best value, demonstrate?'
    options:
      - 'That the sweep has a bug, since only one eta should be optimal'
      - 'That the function f(x) = x^2 is unusually forgiving and real loss surfaces would not show this basin'
      - 'That eta = 0.45 is a coincidence and any value in the range would perform identically on a different problem'
      - 'That a good learning rate is a range you can measure, not a single number you must guess exactly right — something a single training run at one fixed rate could never show you'
    answer_index: 3
    explanation: 'A single run at a single learning rate tells you whether that one choice worked. Sweeping many rates and plotting the result reveals the SHAPE of the whole space of choices: slow convergence at the low end, a broad basin of rates that all work well, and a sharp cliff at the exact theoretical threshold (eta = 1 here) beyond which every run diverges. That basin''s width is the practical, transferable finding — "pick something in this range" is a far more useful, and far more honestly earned, statement than "pick exactly 0.45."'
