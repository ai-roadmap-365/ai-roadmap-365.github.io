terms:
  - term: 'Exploratory data analysis (EDA)'
    definition: >-
      The discipline of looking at data to generate questions and hypotheses, as distinct from confirmatory
      data analysis, which tests a hypothesis already decided in advance. Named and formalized by John
      Tukey in his 1977 book of the same title.
  - term: 'Confirmatory analysis'
    definition: >-
      Testing a specific, pre-declared hypothesis against data that was not used to generate that
      hypothesis. Confirmatory analysis is where a p-value can be taken at face value; exploratory analysis
      is where it usually cannot.
  - term: 'Confirmation set (holdout)'
    definition: >-
      A portion of the data set aside before any exploration begins and left untouched until a specific
      hypothesis has been formed. Testing that hypothesis once against the confirmation set is what
      separates a real finding from a shape in the noise.
  - term: 'Forking paths'
    definition: >-
      The set of all the different analyses -- different subsets, outcome definitions, cutoffs and
      transformations -- an analyst could plausibly have run on a given dataset. Coined by Andrew Gelman
      and Eric Loken (2013) to describe how the reported result is one path among many, chosen because it
      looked good, even when no formal test was declared for the paths not taken.
  - term: 'Multiple comparisons problem'
    definition: >-
      The fact that running several independent hypothesis tests at a fixed significance level alpha
      raises the chance that at least one comes back "significant" by chance alone, well above alpha
      itself -- exactly 1 - (1 - alpha)^k for k independent tests.
  - term: 'Family-wise error rate (FWER)'
    definition: >-
      The probability of at least one false positive across an entire family of comparisons, as opposed to
      the per-comparison error rate (alpha) of any single one. This is the rate a multiple-comparisons
      correction is designed to control.
  - term: 'Bonferroni correction'
    definition: >-
      Dividing the significance threshold alpha by the number of comparisons, m, so that the family-wise
      error rate across all m tests stays near the original alpha. Exact and conservative when m is known
      and correct; useless when the true number of comparisons run exceeds the reported one.
  - term: 'Researcher degrees of freedom'
    definition: >-
      The many small, often undeclared choices available during analysis -- which subset, which outcome,
      which cutoff, which transformation -- each of which is effectively a comparison, whether or not a
      formal test was run for it. Named by Simmons, Nelson and Simonsohn (2011).
  - term: 'Research log'
    definition: >-
      A dated record of every question asked of a dataset, what was looked at to answer it, and what was
      found -- including outcomes of "nothing found." The log's own length is the true comparison count,
      which is what a multiple-comparisons correction needs to be honest.
  - term: 'Triage (in exploration)'
    definition: >-
      Deciding which candidate questions are worth pursuing before spending time on any of them, typically
      weighing expected information, cost, and how much the answer would change a real decision.
  - term: 'Stopping rule'
    definition: >-
      A rule, decided in advance, for when exploration ends -- for example a fixed time budget or a fixed
      count of questions. A stopping rule that depends on what has been found so far ("stop when
      significant") inflates the true false-positive rate well above the nominal alpha.
  - term: 'Effect size (Cohen''s d)'
    definition: >-
      A standardized measure of how large a difference is, expressed in units of pooled standard deviation,
      independent of sample size or the p-value's magnitude. A conventional rule of thumb (Cohen, 1988)
      treats d around 0.5 as the boundary between a "medium" and a "large" effect.
  - term: 'Winner''s curse (in this context)'
    definition: >-
      The tendency for a result selected because it looked best among many candidates to have both an
      inflated p-value's apparent extremity and an inflated effect size, simply because of the selection
      itself -- not because the underlying effect is actually that large.
  - term: 'Handoff object'
    definition: >-
      In this lesson's lab, the structured record passed from the exploration stage to a report-writing
      stage (Day 133), required to carry a finding, its result on the confirmation set, and the number of
      comparisons run before it was chosen.
