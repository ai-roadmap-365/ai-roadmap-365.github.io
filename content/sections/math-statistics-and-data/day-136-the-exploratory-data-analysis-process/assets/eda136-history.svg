<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward looking first.">
  <title>Four steps toward exploratory analysis</title>
  <style>
    .eda136-history-bg   { fill: #f8fafc; }
    .eda136-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda136-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eda136-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eda136-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eda136-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eda136-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eda136-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eda136-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eda136-history-stage { opacity: 1; }

    .eda136-history-s0 { animation-delay: 0.00s; }
    .eda136-history-e0 { animation-delay: 0.00s; }
    .eda136-history-s1 { animation-delay: 1.28s; }
    .eda136-history-e1 { animation-delay: 1.28s; }
    .eda136-history-s2 { animation-delay: 2.56s; }
    .eda136-history-e2 { animation-delay: 2.56s; }
    .eda136-history-s3 { animation-delay: 3.84s; }
    .eda136-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eda136-history-conn  { animation: eda136-history-trace 6.4s ease-in-out infinite; }
      .eda136-history-stage { animation: eda136-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eda136-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eda136-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eda136-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eda136-history-stage { animation: eda136-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eda136-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eda136-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eda136-history-bg" width="980" height="322"/>
  <text class="eda136-history-h1"  x="30" y="40">Four steps toward exploratory analysis</text>
  <text class="eda136-history-sub" x="30" y="64">Toward looking first.</text>
  <g class="eda136-history-stage eda136-history-s0">
    <rect class="eda136-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eda136-history-step" x="44" y="142">01</text>
    <text class="eda136-history-name" x="70" y="142">Statistics as confirmation of stated hypotheses</text>
    <text class="eda136-history-desc" x="44" y="166">Where looking first was suspect.</text>
  </g>
  <line class="eda136-history-line eda136-history-conn eda136-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eda136-history-tip)"/>
  <g class="eda136-history-stage eda136-history-s1">
    <rect class="eda136-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eda136-history-step" x="280" y="142">02</text>
    <text class="eda136-history-name" x="306" y="142">Then an argument for exploring before testing</text>
    <text class="eda136-history-desc" x="280" y="166">Which legitimised looking.</text>
  </g>
  <line class="eda136-history-line eda136-history-conn eda136-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eda136-history-tip)"/>
  <g class="eda136-history-stage eda136-history-s2">
    <rect class="eda136-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eda136-history-step" x="516" y="142">03</text>
    <text class="eda136-history-name" x="542" y="142">Then interactive computing made it fast</text>
    <text class="eda136-history-desc" x="516" y="166">Which changed how much was</text>
    <text class="eda136-history-desc" x="516" y="182">looked at.</text>
  </g>
  <line class="eda136-history-line eda136-history-conn eda136-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eda136-history-tip)"/>
  <g class="eda136-history-stage eda136-history-s3">
    <rect class="eda136-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eda136-history-step" x="752" y="142">04</text>
    <text class="eda136-history-name" x="778" y="142">And automated profiling for a first pass</text>
    <text class="eda136-history-desc" x="752" y="166">Which starts the work, not</text>
    <text class="eda136-history-desc" x="752" y="182">finishes it.</text>
  </g>
  <text class="eda136-history-sub" x="30" y="304">The exploratory turn resolved a real tension by separating the two activities: explore to generate hypotheses, then test them on data you have not seen.</text>
</svg>
