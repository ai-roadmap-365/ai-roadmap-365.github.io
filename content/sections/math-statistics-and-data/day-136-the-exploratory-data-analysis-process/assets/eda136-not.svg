<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things exploration is not</title>
  <style>
    .eda136-not-bg   { fill: #f8fafc; }
    .eda136-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda136-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eda136-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eda136-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eda136-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eda136-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eda136-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda136-not-row { opacity: 1; }
    .eda136-not-r0 { animation-delay: 0.00s; }
    .eda136-not-r1 { animation-delay: 0.45s; }
    .eda136-not-r2 { animation-delay: 0.90s; }
    .eda136-not-r3 { animation-delay: 1.35s; }
    .eda136-not-r4 { animation-delay: 1.80s; }
    .eda136-not-row { animation: eda136-not-reveal 7.3s ease-in-out infinite; }
    @keyframes eda136-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eda136-not-bg" width="980" height="390"/>
  <text class="eda136-not-h1"  x="30" y="40">Four things exploration is not</text>
  <text class="eda136-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="eda136-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eda136-not-name" x="46" y="122">The misconception</text>
  <text class="eda136-not-desc" x="46" y="142">Commonly held.</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r0" x="46" y="182">It is a preliminary step before real work</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r1" x="46" y="216">Findings are conclusions</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r2" x="46" y="250">Automated profiling replaces it</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r3" x="46" y="284">It is unstructured</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r4" x="46" y="318">More plots means better exploration</text>
  <rect class="eda136-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eda136-not-name" x="526" y="122">What is true</text>
  <text class="eda136-not-desc" x="526" y="142">Actually.</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r0" x="526" y="182">It is where most understanding forms</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r1" x="526" y="216">They are hypotheses needing testing</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r2" x="526" y="250">Profiling reports what; you ask why</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r3" x="526" y="284">A routine limits bias</text>
  <text class="eda136-not-desc eda136-not-row eda136-not-r4" x="526" y="318">Directed looking beats volume</text>
  <text class="eda136-not-sub" x="30" y="372">Profiling tools reporting what rather than why is the useful distinction, and it explains why an automated report is a starting point rather than an analysis.</text>
</svg>
