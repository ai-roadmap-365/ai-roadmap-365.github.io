<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the stakes.">
  <title>How much exploration when</title>
  <style>
    .eda136-when-bg   { fill: #f8fafc; }
    .eda136-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda136-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eda136-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eda136-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eda136-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eda136-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eda136-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda136-when-row { opacity: 1; }
    .eda136-when-r0 { animation-delay: 0.00s; }
    .eda136-when-r1 { animation-delay: 0.45s; }
    .eda136-when-r2 { animation-delay: 0.90s; }
    .eda136-when-r3 { animation-delay: 1.35s; }
    .eda136-when-r4 { animation-delay: 1.80s; }
    .eda136-when-row { animation: eda136-when-reveal 7.3s ease-in-out infinite; }
    @keyframes eda136-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eda136-when-bg" width="980" height="390"/>
  <text class="eda136-when-h1"  x="30" y="40">How much exploration when</text>
  <text class="eda136-when-sub" x="30" y="64">By the stakes.</text>
  <rect class="eda136-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eda136-when-name" x="46" y="122">Explore thoroughly</text>
  <text class="eda136-when-desc" x="46" y="142">Four cases.</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r0" x="46" y="182">An unfamiliar dataset</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r1" x="46" y="216">Data feeding a model</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r2" x="46" y="250">High-stakes decisions</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r3" x="46" y="284">Data from an external source</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r4" x="46" y="318">Anything you will publish</text>
  <rect class="eda136-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eda136-when-name" x="526" y="122">Less is needed</text>
  <text class="eda136-when-desc" x="526" y="142">Also four.</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r0" x="526" y="182">A dataset you know well</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r1" x="526" y="216">A routine refresh of a known source</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r2" x="526" y="250">A quick sanity check</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r3" x="526" y="284">Where automated checks already run</text>
  <text class="eda136-when-desc eda136-when-row eda136-when-r4" x="526" y="318">But still check the shape and counts</text>
  <text class="eda136-when-sub" x="30" y="372">Still checking shape and counts is the irreducible minimum, and it takes seconds while catching the majority of data delivery failures.</text>
</svg>
