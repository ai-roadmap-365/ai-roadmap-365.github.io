questions:
  - question: >-
      Twenty independent comparisons at alpha = 0.05, run on data with no real signal, come back with at
      least one "significant" result approximately how often?
    options:
      - '64.15%'
      - '5%, the same as any single comparison'
      - '22.6%'
      - '100%, guaranteed'
    answer_index: 0
    explanation: >-
      The exact formula is 1 - (1 - 0.05)^20 = 0.6415, confirmed by simulation in this lesson's lab exercise
      1. 22.6% is the corresponding figure for k=5 comparisons, not 20 -- the rate depends heavily on how
      many independent comparisons were actually tried, which is the whole point of the lesson.
  - question: >-
      An analyst tries five subset filters and two outcome definitions, reports the single best-looking
      combination, and never formally declares a test for any of the ten variants. According to this
      lesson, is "I only ran one test" a valid defence?
    options:
      - 'Yes, because no p-value was computed for the other nine'
      - 'No — each silent choice is a comparison'
      - 'Yes, as long as the winning result is significant at alpha = 0.05'
      - 'It depends on whether the outcome was pre-registered'
    answer_index: 1
    explanation: >-
      Exercise 4 measures this directly: ten silent variants with no test declared for any of them still
      inflated the apparent significance rate to roughly 24.8%, against about 5.1% for one pre-declared
      comparison on identical data. A choice IS a comparison, counted or not.
  - question: >-
      A Bonferroni correction is applied using a reported comparison count of 20, but the analyst actually
      tried 60 comparisons before settling on the 20 that were written down. What happens to the true
      family-wise false-positive rate?
    options:
      - 'It falls further below nominal, becoming overly conservative'
      - 'It becomes undefined'
      - 'It rises above nominal — the correction used the wrong count'
      - 'It stays at the corrected nominal level, because the formula is exact'
    answer_index: 2
    explanation: >-
      Exercise 5 measures this: the correction restores the rate to about 4.64% when m=20 is correct, but
      the same corrected alpha applied to a true m=60 pushes the real rate to about 14.06% -- nearly three
      times nominal. The arithmetic is exact; the comparison count fed into it was wrong.
  - question: >-
      In this lesson's centrepiece exercise, a real planted effect and the best of thirty spurious columns
      both look significant on the exploration half of the data. What distinguishes them on the untouched
      confirmation half?
    options:
      - 'Both remain significant, because significance is a property of the data, not the split'
      - 'The spurious one becomes more significant, because more data resolves noise into signal'
      - 'Neither remains significant, because a holdout always erases real effects too'
      - 'The real effect remains significant; the spurious one does not'
    answer_index: 3
    explanation: >-
      The measured result: the real effect stays overwhelming (p around 2e-12) on confirmation, while the
      spurious column chosen for looking best on exploration collapses to p around 0.92 -- nowhere near
      significant, because it never had anything real behind it.
  - question: 'What is the primary purpose of a research log, as this lesson builds it?'
    options:
      - 'To make the true comparison count knowable'
      - 'To document code for future maintainers'
      - 'To record only the findings worth reporting'
      - 'To satisfy a compliance requirement unrelated to the statistics'
    answer_index: 0
    explanation: >-
      The log's length is exactly the comparison count -- not remembered or estimated afterward. Recording
      nulls (outcome = None) is essential: a log that only keeps the interesting entries cannot answer "how
      many things did you look at?" any better than memory can.
  - question: >-
      A time-boxed stopping rule (fixed budget of questions, reporting a pre-declared result) and a "stop
      when significant" rule are run on identical data with no real signal, using the identical budget of
      looks. What does this lesson's measurement show?
    options:
      - 'Both report a false positive near the nominal alpha'
      - 'The "stop when significant" rule reports several times more false positives than the time-boxed rule'
      - 'The time-boxed rule reports far more false positives, because it asks more questions'
      - 'Neither rule can be meaningfully compared without knowing the true effect size'
    answer_index: 1
    explanation: >-
      Measured: the time-boxed rule lands at about 5.05% (near the nominal 5% alpha), while "stop when
      significant" on the identical ten-question budget lands at about 39.97% -- roughly eight times higher,
      because the stopping decision itself was made using the data.
  - question: >-
      In this lesson's triage scoring (expected information x decision relevance / cost), why does a
      question about button color, which would teach the team something real, rank below a costlier pricing
      question?
    options:
      - 'Button-color questions are inherently uninteresting'
      - 'Color-related metrics are always noisier than pricing metrics'
      - 'It would not change any decision on the table'
      - 'The scoring formula penalizes any question with the word "color" in it'
    answer_index: 2
    explanation: >-
      Day 119's framing: ask first whether the answer would change a decision, not only whether it would be
      interesting. High expected information with near-zero decision relevance still scores low, because the
      formula multiplies information by relevance before dividing by cost.
  - question: >-
      Why does this lesson describe reporting the highest test-set accuracy across a hundred trained model
      configurations as the same failure mode as the garden of forking paths?
    options:
      - 'It is not the same failure mode -- model selection is immune to multiple-comparisons problems'
      - 'Because training a hundred models always overfits the training data'
      - 'Because hyperparameter search requires a paid experiment tracker to be valid'
      - 'The reported score is the maximum of a hundred draws'
    answer_index: 3
    explanation: >-
      A validation set used for a hundred rounds of model selection has already been "explored" in this
      lesson's sense. Only a test set that never influenced a single decision, checked once at the very end,
      plays the role of this lesson's confirmation set -- the same discipline, applied to model development.
