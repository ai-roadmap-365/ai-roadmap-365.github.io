visuals:
  - id: exploration-loop-architecture
    file: assets/exploration-loop-architecture.svg
    type: diagram
    title: >-
      The exploratory loop -- ask a question, take a look, refine the question -- with a sealed confirmation
      set opened once and a research log accumulating beneath both
    alt: >-
      Diagram: a three-stage cycle on the left labelled ask a question, take a look, and refine the
      question, connected by curved arrows that loop back on themselves, with a note that most cycles find
      nothing and the loop simply continues. An occasional dashed arrow breaks off toward the right, labelled
      occasionally something looks interesting. On the right, a sealed confirmation set box, shown with a
      lock icon, is labelled sealed at the start and untouched until a hypothesis exists, connected by one
      arrow labelled opened once, when a hypothesis is chosen, leading down to a small panel stating that a
      survivor is worth reporting and a failure was a shape in the noise. Beneath both halves, a research
      log panel accumulates dated rows: two rows marked with a grey dot and a null outcome of nothing found,
      and one row marked with a green dot carrying a real p-value and effect size, with a closing note that
      the log's own length is the true comparison count
    description: >-
      A static architecture diagram. Three boxes on the left form a triangular cycle -- ask a question, take
      a look, refine the question -- joined by curved blue arrows with an inline note that most looks find
      nothing. A dashed red arrow occasionally breaks off from the cycle toward a red-bordered sealed box on
      the right labelled confirmation set, opened once when a hypothesis is chosen; a blue arrow below it
      leads to a small panel describing the two possible outcomes. Beneath the whole diagram, a white panel
      shows three example research-log rows with a timestamp, question, look and outcome column, two marked
      null and one marked with a real finding, closing with the note that the log's length is the true
      comparison count.
  - id: forking-paths-flow
    file: assets/forking-paths-flow.svg
    type: flow-animated
    title: >-
      One dataset branches through choices of subset, outcome and cutoff into eight candidate analyses, with
      the one that reached significance lighting up
    alt: >-
      Diagram: a single dataset box on the left, labelled no real signal, branches through three choice
      stages -- a subset choice with two options, an outcome choice with two options under each subset, and
      a cutoff choice with two options under each outcome -- ending in eight leaf boxes on the right. Seven
      of the eight leaves are shown in muted grey, each labelled not reported. One leaf, near the middle of
      the stack, is highlighted in gold and labelled p less than 0.05, reported. A travelling gold token
      follows a dashed, marching-ant wire from the dataset through the subset and outcome stages into the
      highlighted leaf, and the highlighted leaf glows briefly as the token arrives. A closing caption states
      that one of eight candidate analyses reached significance and got written up, and the other seven are
      just as real and just as available to try, they simply did not look interesting
    description: >-
      An animated flow diagram, fully readable as a still image. A dataset box on the left connects through
      plain grey wires to two subset-choice boxes, which connect to four outcome-choice boxes, which connect
      to eight cutoff-choice leaf boxes on the right. Seven leaves are drawn in a muted grey-blue with the
      label not reported; one leaf is drawn with a gold fill and border and the label p less than 0.05,
      reported. A gold circular token travels along a dashed line from the dataset box through the winning
      subset and outcome boxes into the winning leaf, tracing the exact path that produced the reported
      result, while the winning leaf's fill brightens briefly as the token arrives. A prefers-reduced-motion
      block disables the marching dashes, the token's motion and the leaf's glow, leaving the token resting
      at the winning leaf and every box, wire and label fully drawn and legible in both the animated and the
      still state.
