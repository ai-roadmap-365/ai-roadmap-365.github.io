questions:
  - question: >-
      A study's report, its figures and its confidence interval are byte-identical between an honest
      analysis and one that examined the confirmation set during exploration. Where does the difference show
      up?
    options:
      - 'In the p-value, which is inflated by the peek'
      - 'In the ordering of entries in the research log, and nowhere else'
      - 'In the manifest checksums, which change when data is reused'
      - 'In the figures, because the peeked study''s charts include held-out data'
    answer_index: 1
    explanation: >-
      This is not an argument, it is a measurement: the lab's test takes the honest study, rewrites only its
      research log to show an early peek, and asserts that REPORT.md, FIGURES.json, CLEANING.md and
      SOURCE.json are byte-identical between the two. The p-value is unchanged because the same test was run
      on the same data -- what changed is what the p-value MEANS, and that depends entirely on an ordering
      only the log records. This is why the gate reads the log and nothing else.
  - question: >-
      What separates a damage report entry from a changelog entry for a cleaning step?
    options:
      - 'A damage report is written in prose; a changelog is a bulleted list'
      - 'A damage report names the function used; a changelog names the author'
      - 'A damage report measures before and after; a changelog lists'
      - 'There is none -- the two terms are used interchangeably in practice'
    answer_index: 2
    explanation: >-
      "Dropped rows with missing tenure" tells you what somebody did. "Rows with missing tenure: before
      12,410, after 0 -- 31% of the delivery" tells you what it cost, and a reader can immediately ask the
      question that matters: are those rows special? Without the number, nobody asks. The harness enforces
      exactly this by requiring a before and an after under every step heading, and it names the step that
      lacks them.
  - question: >-
      The worked study's INGEST.json records both `grain_violations_on_arrival: 8` and `grain_verified:
      true`. Why record both?
    options:
      - 'Because the grain check is run twice for redundancy'
      - 'Because grain_verified describes the columns and grain_violations_on_arrival describes the rows'
      - 'Because the harness refuses any INGEST.json with fewer than two grain fields'
      - 'The raw delivery really did violate the grain'
    answer_index: 3
    explanation: >-
      Eight readings arrived twice, byte-identical, and every mean computed before de-duplication would have
      been biased toward those stations. The record says the contract failed on arrival, names the cleaning
      step that resolved it, and reports the verified result for the frame the study proceeds with. An
      earlier draft of this lab wrote INGEST.json before cleaning; the harness correctly refused the study,
      and the fix was to record both numbers rather than to move the assertion somewhere it would pass.
  - question: >-
      Which of these failures would a value-level validation library such as Great Expectations or pandera
      NOT catch?
    options:
      - 'A clean dataset whose question was written after the analysis'
      - 'A reading_id column with duplicate values'
      - 'A numeric column with values outside its declared range'
      - 'A column containing nulls where the schema forbids them'
    answer_index: 0
    explanation: >-
      Value validators check values, and they do it better than anything you will write by hand -- you
      should use one. But nothing in their vocabulary can express "there was a question, and it came first",
      or "the cleaning reported what it cost", or "the confirmation set was opened after the hypothesis".
      That gap is what today's harness fills, and the two are complementary rather than competing. The one
      genuine overlap is the grain assertion, which is a uniqueness expectation in either vocabulary.
  - question: >-
      Why does the uncertainty gate scan only the report's Findings section rather than the whole document?
    options:
      - 'Because scanning a whole document is too slow to run on every save'
      - 'A methods paragraph with a row count is not a claim'
      - 'Because Markdown headings cannot be parsed reliably outside a known section'
      - 'Because the Findings section is the only part of a report that readers actually look at'
    answer_index: 1
    explanation: >-
      Precision buys authority. A checker that cries wolf over "the delivery carried 264 rows" gets muted,
      and once it is muted its real findings are muted with it -- the same reason a snagging survey that
      lists eighty items on a good house gets ignored, along with the two that mattered. Scoping the gate
      narrowly is a deliberate trade of recall for the willingness to keep running it.
  - question: >-
      The harness's `_failed` helper raises ValueError if you try to fail a gate with an empty findings
      list. What design rule does that enforce?
    options:
      - 'That every gate may fail at most once per run'
      - 'That findings must be returned in a stable, sorted order'
      - 'A gate that says no must also say why'
      - 'That failures must be written to a log before they are returned to the caller'
    answer_index: 2
    explanation: >-
      Every checker you have ever ignored ignored you first, by reporting a failure you could not act on.
      "Provenance incomplete" is useless at 23:00 the night before a deadline; "SOURCE.json is missing:
      checksum_sha256" is a task with a location. Making the empty-findings case an exception rather than a
      convention means the rule cannot quietly erode as the harness grows.
  - question: >-
      The worked study rebuilds byte-identically across two runs, figures included. Which of these is NOT
      one of the four decisions that makes that true?
    options:
      - 'The as-of date is a parameter rather than a clock reading'
      - 'Figures are saved with metadata Software set to None, suppressing the matplotlib version tag'
      - 'The report''s paragraphs are wrapped by textwrap.fill at a fixed width'
      - 'The figures are rendered at a fixed DPI, which fixes their file size'
    answer_index: 3
    explanation: >-
      DPI is indeed fixed in the lab, but a fixed DPI does not make bytes deterministic -- two runs at the
      same DPI can still differ if anything upstream varies. The fourth decision is that every random draw
      comes from a seeded numpy.random.default_rng. The PNG metadata one is the least obvious and the most
      instructive: matplotlib writes its own version into the file by default, and that tag alone is enough
      to move the digest.
  - question: >-
      While building this lesson's uncertainty gate, it flagged a sentence in the worked study's own report
      that did state an interval -- in words, as "anywhere between 3.80 and 7.21". What was the right
      response?
    options:
      - 'Add the pattern and record why — the checker was incomplete'
      - 'Remove the gate, since a checker that produces false positives is worse than none'
      - 'Reword the report so that the checker stops complaining'
      - 'Downgrade the gate from a failure to a warning'
    answer_index: 0
    explanation: >-
      The report stated its interval perfectly well; "between x and y" simply was not in the pattern list.
      That was a genuine false positive in the tool, not a defect in the work, and the fix belongs in the
      tool -- with a comment saying why, so nobody removes it later. Rewriting your work to please your
      checker is how a checker stops being a check and becomes a ritual, and it is the commonest way
      verification tooling quietly loses its value.
