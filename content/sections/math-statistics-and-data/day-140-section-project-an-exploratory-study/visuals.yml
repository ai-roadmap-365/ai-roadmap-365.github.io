visuals:
  - id: study-arc-architecture
    file: assets/study-arc-architecture.svg
    type: diagram
    title: >-
      The arc of a study, nine stages from question to conclusion, each labelled with the day that taught
      it and each arrow labelled with the artefact that stage owes the next
    alt: >-
      Diagram: nine stages of a study stacked vertically from question to conclusion, each labelled with
      the day of this course that taught it, and beside each connecting arrow the artefact that stage must
      hand to the next one. Stage 1 is the question, from Days 119 and 136, written before looking, and it
      hands over a question in writing and the decision it would change. Stage 2 is source and provenance,
      Day 134, with licence, dictionary and checksum, handing over a file, a licence, a date and a digest
      that matches. Stage 3 is ingestion, Day 135, one row is one thing, handing over a frame with a
      stated grain and the check that ran. Stage 4 is quality and cleaning, Days 121 and 125, handing over
      a damage report where every step is measured before and after. Stage 5 is exploration, Day 136, with
      a research log and a sealed half, handing over one hypothesis, the count of looks and a confirmation
      set still unopened. Stage 6 is the estimate, Days 117 and 118, the interval rather than the point,
      handing over a number with an interval and the comparison count. Stage 7 is visuals, Days 127 to
      132, the right chart on an honest scale, handing over figures that carry the question and the claim.
      Stage 8 is the report, Days 133 and 138, the argument and its limits, handing over the frame, the
      proxies, who is missing and the limits. Stage 9 is the conclusion: exploratory, not causal, and it
      names what would establish causation. A manifest lane runs down the right-hand side recording a
      SHA-256 for every artefact, labelled Day 126
    description: >-
      A static architecture diagram. Nine stage boxes are stacked vertically on the left, from the question
      through source and provenance, ingestion, quality and cleaning, exploration, the estimate, visuals and
      the report, ending in a green conclusion box. Each box carries the day or days of this course that
      taught that stage. Between every pair of boxes a blue arrow drops down, and beside it in bold blue is
      the phrase hands over, followed by the artefact the stage must produce for the next one. A yellow
      manifest lane runs the full height of the diagram on the right, joined to every stage by a dashed
      line, labelled Day 126 and recording a SHA-256 for every artefact. A closing caption states that every
      arrow is a place a study can be internally correct and still worthless, and that the harness checks the
      arrows.
  - id: acceptance-flow
    file: assets/acceptance-flow.svg
    type: flow-animated
    title: >-
      A study directory entering the acceptance harness, with each of the eight gates lighting in turn and
      one of them failing, ending in a verdict that names the finding
    alt: >-
      Diagram: a study directory on the left, listing QUESTION.md, SOURCE.json, INGEST.json, CLEANING.md,
      RESEARCH_LOG.md, FIGURES.json, REPORT.md, MANIFEST.json, a data folder and a figures folder,
      annotated read, never executed. A dashed animated wire carries it into a vertical column of eight
      gates, numbered and named: question recorded, provenance complete, grain asserted, damage report
      quantified, confirmation untouched, uncertainty reported, figures documented, and outputs
      reproducible. Seven gates are shaded green and marked PASS. The sixth, uncertainty reported, is
      shaded red and marked FAIL. A blue token walks down the column one gate at a time, and each gate
      brightens briefly as the token reaches it. On the right a verdict panel reads NOT ACCEPTED, seven of
      eight gates pass, one finding, and quotes it: REPORT.md, estimate reported without an interval,
      followed by the opening words of the offending sentence. A caption notes that fixing that one
      sentence makes the same study acceptable, because the finding is a task and not a grade
    description: >-
      An animated flow diagram, fully readable as a still image. A white study-directory panel on the left
      lists the nine files and two folders a study contains, annotated read, never executed. A dashed blue
      wire with marching dashes carries it into a column of eight gate bars. Seven bars are drawn in green
      and marked PASS; the sixth, uncertainty reported, is drawn in red and marked FAIL, so the failing gate
      is visible with no animation at all. A blue token walks down the left edge of the column over eight
      seconds, one gate per second, and each gate brightens for a moment as the token reaches it. A second
      dashed wire leads right to a red verdict panel reading NOT ACCEPTED, seven of eight gates pass, one
      finding, and quoting that finding. A prefers-reduced-motion block disables the marching dashes, the
      token's walk, the gate brightening and the verdict's pulse, leaving every bar, label, PASS or FAIL
      mark and the whole verdict fully drawn and legible.
