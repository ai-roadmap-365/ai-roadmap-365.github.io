<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Judged on the whole.">
  <title>A portfolio piece</title>
  <style>
    .portfolio-piece-bg   { fill: #f8fafc; }
    .portfolio-piece-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-piece-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-piece-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-piece-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-piece-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-piece-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .portfolio-piece-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .portfolio-piece-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .portfolio-piece-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .portfolio-piece-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .portfolio-piece-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .portfolio-piece-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .portfolio-piece-row { opacity: 1; }
    .portfolio-piece-r0 { animation-delay: 0.00s; }
    .portfolio-piece-r1 { animation-delay: 0.45s; }
    .portfolio-piece-r2 { animation-delay: 0.90s; }
    .portfolio-piece-r3 { animation-delay: 1.35s; }
    .portfolio-piece-r4 { animation-delay: 1.80s; }
    .portfolio-piece-row { animation: portfolio-piece-reveal 7.3s ease-in-out infinite; }
    @keyframes portfolio-piece-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="portfolio-piece-bg" width="980" height="390"/>
  <text class="portfolio-piece-h1"  x="30" y="40">A portfolio piece</text>
  <text class="portfolio-piece-sub" x="30" y="64">Judged on the whole.</text>
  <rect class="portfolio-piece-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="portfolio-piece-name" x="46" y="122">Complete</text>
  <text class="portfolio-piece-desc" x="46" y="142">Judged favourably.</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r0" x="46" y="182">The question and why it matters</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r1" x="46" y="216">The data and its limitations</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r2" x="46" y="250">The reasoning, visible</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r3" x="46" y="284">Reproducible by the reader</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r4" x="46" y="318">This is a study</text>
  <rect class="portfolio-piece-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="portfolio-piece-name" x="526" y="122">A result alone</text>
  <text class="portfolio-piece-desc" x="526" y="142">Judged sceptically.</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r0" x="526" y="182">A number, or a chart</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r1" x="526" y="216">No provenance</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r2" x="526" y="250">No reasoning</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r3" x="526" y="284">Nothing to check</text>
  <text class="portfolio-piece-desc portfolio-piece-row portfolio-piece-r4" x="526" y="318">This is an assertion</text>
  <text class="portfolio-piece-sub" x="30" y="372">Reviewers of portfolio work consistently value the reasoning and the reproducibility above the sophistication of the method, which is worth knowing.</text>
</svg>
