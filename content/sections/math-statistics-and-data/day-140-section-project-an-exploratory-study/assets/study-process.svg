<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four phases.">
  <title>Running the study</title>
  <style>
    .study-process-bg   { fill: #f8fafc; }
    .study-process-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-process-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-process-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-process-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-process-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-process-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .study-process-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .study-process-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .study-process-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .study-process-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .study-process-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .study-process-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .study-process-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .study-process-stage { opacity: 1; }

    .study-process-s0 { animation-delay: 0.00s; }
    .study-process-e0 { animation-delay: 0.00s; }
    .study-process-s1 { animation-delay: 1.28s; }
    .study-process-e1 { animation-delay: 1.28s; }
    .study-process-s2 { animation-delay: 2.56s; }
    .study-process-e2 { animation-delay: 2.56s; }
    .study-process-s3 { animation-delay: 3.84s; }
    .study-process-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .study-process-conn  { animation: study-process-trace 6.4s ease-in-out infinite; }
      .study-process-stage { animation: study-process-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes study-process-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes study-process-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .study-process-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .study-process-stage { animation: study-process-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes study-process-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="study-process-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="study-process-bg" width="980" height="322"/>
  <text class="study-process-h1"  x="30" y="40">Running the study</text>
  <text class="study-process-sub" x="30" y="64">Four phases.</text>
  <g class="study-process-stage study-process-s0">
    <rect class="study-process-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="study-process-step" x="44" y="142">01</text>
    <text class="study-process-name" x="70" y="142">Source the data, recording provenance and licence</text>
    <text class="study-process-desc" x="44" y="166">Before writing any analysis.</text>
  </g>
  <line class="study-process-line study-process-conn study-process-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#study-process-tip)"/>
  <g class="study-process-stage study-process-s1">
    <rect class="study-process-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="study-process-step" x="280" y="142">02</text>
    <text class="study-process-name" x="306" y="142">Prepare it in a scripted, rerunnable pipeline</text>
    <text class="study-process-desc" x="280" y="166">Raw data untouched.</text>
  </g>
  <line class="study-process-line study-process-conn study-process-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#study-process-tip)"/>
  <g class="study-process-stage study-process-s2">
    <rect class="study-process-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="study-process-step" x="516" y="142">03</text>
    <text class="study-process-name" x="542" y="142">Explore systematically, recording what showed nothing</text>
    <text class="study-process-desc" x="516" y="166">As well as what did.</text>
  </g>
  <line class="study-process-line study-process-conn study-process-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#study-process-tip)"/>
  <g class="study-process-stage study-process-s3">
    <rect class="study-process-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="study-process-step" x="752" y="142">04</text>
    <text class="study-process-name" x="778" y="142">And report selectively, with limitations stated</text>
    <text class="study-process-desc" x="752" y="166">One point per figure.</text>
  </g>
  <text class="study-process-sub" x="30" y="304">Recording what showed nothing is what stops the report becoming a selection of whatever happened to look interesting, which is the main risk in exploratory work.</text>
</svg>
