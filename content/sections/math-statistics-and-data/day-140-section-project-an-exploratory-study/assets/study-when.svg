<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what does not.">
  <title>What makes a good study question</title>
  <style>
    .study-when-bg   { fill: #f8fafc; }
    .study-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .study-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .study-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .study-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .study-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .study-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .study-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .study-when-row { opacity: 1; }
    .study-when-r0 { animation-delay: 0.00s; }
    .study-when-r1 { animation-delay: 0.45s; }
    .study-when-r2 { animation-delay: 0.90s; }
    .study-when-r3 { animation-delay: 1.35s; }
    .study-when-r4 { animation-delay: 1.80s; }
    .study-when-row { animation: study-when-reveal 7.3s ease-in-out infinite; }
    @keyframes study-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="study-when-bg" width="980" height="390"/>
  <text class="study-when-h1"  x="30" y="40">What makes a good study question</text>
  <text class="study-when-sub" x="30" y="64">And what does not.</text>
  <rect class="study-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="study-when-name" x="46" y="122">A good question</text>
  <text class="study-when-desc" x="46" y="142">Four properties.</text>
  <text class="study-when-desc study-when-row study-when-r0" x="46" y="182">Specific enough to answer</text>
  <text class="study-when-desc study-when-row study-when-r1" x="46" y="216">Answerable with obtainable data</text>
  <text class="study-when-desc study-when-row study-when-r2" x="46" y="250">Interesting whichever way it resolves</text>
  <text class="study-when-desc study-when-row study-when-r3" x="46" y="284">Stated before the analysis</text>
  <text class="study-when-desc study-when-row study-when-r4" x="46" y="318">Scoped to the time available</text>
  <rect class="study-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="study-when-name" x="526" y="122">A poor one</text>
  <text class="study-when-desc" x="526" y="142">Also four.</text>
  <text class="study-when-desc study-when-row study-when-r0" x="526" y="182">Too broad to answer at all</text>
  <text class="study-when-desc study-when-row study-when-r1" x="526" y="216">Needing data you cannot obtain</text>
  <text class="study-when-desc study-when-row study-when-r2" x="526" y="250">Only interesting if it confirms something</text>
  <text class="study-when-desc study-when-row study-when-r3" x="526" y="284">Chosen after seeing a pattern</text>
  <text class="study-when-desc study-when-row study-when-r4" x="526" y="318">Requiring months of preparation</text>
  <text class="study-when-sub" x="30" y="372">Being interesting whichever way it resolves is the property that protects against motivated analysis, and it is the best single test of a proposed question.</text>
</svg>
