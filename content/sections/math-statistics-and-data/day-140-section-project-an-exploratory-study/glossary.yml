terms:
  - term: 'Study'
    definition: >-
      As this lesson uses the word: a directory containing a written question, the data that answers it, a
      record of everything done to that data, the answer with its uncertainty, and an honest statement of
      what the answer cannot support. Distinct from a notebook (a medium), a dashboard (a repeated answer)
      and a model (a prediction).
  - term: 'Seam (handoff)'
    definition: >-
      The interface between two stages of a study -- the artefact one stage owes the next. A study has nine
      stages and eight seams, and a capstone almost always fails at a seam rather than inside a stage,
      because a seam is invisible from within either stage it joins.
  - term: 'Acceptance harness'
    definition: >-
      A program that reads a finished piece of work and reports what is missing or unsupported, returning a
      structured verdict rather than raising on the first problem. This day's harness, `check_study(path)`,
      runs eight gates over a study directory. It checks presence and consistency of artefacts, never the
      quality of the analysis.
  - term: 'Gate'
    definition: >-
      One check in an acceptance harness, guarding one seam. A gate returns a result that is either a pass
      with no findings, or a failure with at least one finding that names a file, field, step or sentence.
      A failing gate with nothing to say is treated as a bug in the gate.
  - term: 'Finding'
    definition: >-
      A single, actionable statement of what is wrong and where -- "SOURCE.json is missing:
      checksum_sha256", not "provenance incomplete". A verdict is a list of findings, which makes it a task
      list rather than a grade.
  - term: 'Provenance'
    definition: >-
      The record of where data came from and under what terms: a URL, a retrieval date, a licence, a data
      dictionary and a cryptographic digest of the file as retrieved. Without it a result cannot be
      re-obtained by anyone, including its own author six months later.
  - term: 'Grain'
    definition: >-
      The sentence "one row is one ___". The unit of observation a table is keyed on. Every aggregate
      depends on it, and a sum computed under the wrong grain is not approximately right but wrong by an
      amount you cannot bound. A grain that is declared but never verified is a hope with a schema.
  - term: 'Damage report'
    definition: >-
      A record of what cleaning changed, measured: for each step, the quantity it affected, its value before
      and its value after. Distinct from a changelog, which records what was done. Only the measurement lets
      a reader ask whether the rows that were removed were special.
  - term: 'Research log'
    definition: >-
      An ordered record of every look taken during exploration, including the ones that found nothing, each
      with a timestamp, the split it used and its outcome. Its length is the true comparison count, and its
      ordering is the only evidence that a confirmation set was opened after a hypothesis rather than
      before.
  - term: 'Confirmation set'
    definition: >-
      A portion of the data set aside before any exploration begins and left untouched until a specific
      hypothesis has been formed, then tested once. A confirmation set tested more than once is an
      exploration set with a better name.
  - term: 'Comparison count'
    definition: >-
      How many analyses were examined before the one being reported was chosen. It belongs in the same
      paragraph as the estimate, not in a footnote, because a p-value is only interpretable alongside it.
  - term: 'Manifest'
    definition: >-
      A file recording a cryptographic digest -- here SHA-256 -- for every output a pipeline generates.
      It turns "it reproduces" from a belief into a two-second check, and it fails loudly when a generated
      file is edited by hand, which is how most reproducible pipelines actually die.
  - term: 'Byte-identical rebuild'
    definition: >-
      The property that running a pipeline twice produces outputs whose bytes match exactly. It requires
      that nothing reads a clock, every random draw is seeded, text layout is computed rather than
      hand-wrapped, and image writers are told not to stamp their own version into the file.
  - term: 'Lie factor'
    definition: >-
      Edward Tufte's ratio of the size of an effect as shown in a graphic to the size of the effect in the
      data. A truncated baseline on a ratio quantity inflates it; a chart designed to be honest keeps it at
      or near 1. Day 132's measure, applied here to the worked study's figures.
  - term: 'Leaked feature'
    definition: >-
      A variable whose value could not have been known at the moment the prediction or comparison is meant
      to apply to -- for example, a "days since last login" measured up to the moment an account closed. The
      resulting chart or model is accurate about the past and useless about the future.
  - term: 'Pre-registration'
    definition: >-
      Depositing an analysis plan with a third party before collecting or examining data, so that the
      ordering is attested by someone other than the analyst. Stronger than a locally written question file,
      because the timestamp is not yours to edit; the question file is its cheap local cousin, and it
      catches drift rather than fraud.
