visuals:
  - id: mask-anatomy-architecture
    file: assets/mask-anatomy-architecture.svg
    type: diagram
    title: 'Anatomy of a boolean mask: True flows through, False is held back, NaN falls out of BOTH'
    alt: 'Diagram: an eight-row DataFrame of names and scores beside its boolean mask score greater than 50, with True rows Ada, Dee and Gio flowing through a gate into a kept-rows panel, False rows Bo, Eli and Hu held back behind the gate, and the two rows with a missing score, Cy and Fay, shown falling through a gap beneath the gate into a third panel labelled neither kept nor held, with the same two rows shown falling through the gap again under the negated mask score less than or equal to 50, and a caption stating that a row missing from a comparison is missing from its negation too'
    description: >-
      A static architecture diagram dissecting a boolean mask into its three real outcomes, not the two
      most readers assume. On the left, an eight-row table of name and score, with the two rows Cy and
      Fay carrying a NaN score drawn with a dashed border and a paler fill to mark them as different from
      the start. Beside it, the mask column for score > 50 lists eight True/False values, with Cy and
      Fay's cells showing False -- but shaded the same pale dashed style as their source cells rather than
      the solid False styling Bo, Eli and Hu's cells use, visually distinguishing "genuinely false" from
      "false because there was nothing to compare." A gate shape sits between the mask and two labelled
      panels: a green KEPT panel receiving Ada, Dee and Gio (the three solid True rows), and a grey HELD
      BACK panel receiving Bo, Eli and Hu (the three solid False rows). Beneath the gate, a visible gap
      shows Cy and Fay falling through into a third, red-outlined panel labelled NEITHER KEPT NOR HELD --
      MISSING FROM BOTH SIDES. A second, smaller copy of the same gate to the right repeats the diagram
      for the negated mask, score <= 50: Bo, Eli and Hu are now the True rows flowing into KEPT, Ada, Dee
      and Gio are HELD BACK, and Cy and Fay fall through the SAME gap into the SAME third panel a second
      time. A caption block beneath both gates states plainly: "a row that fails a comparison is absent
      from the True side; a row with a missing value fails the comparison AND its negation, so it is
      absent from both mask and ~mask -- the only way to reliably catch it is .isna(), checked
      explicitly, not inferred from what a filter and its opposite failed to return."
  - id: filter-flow
    file: assets/filter-flow.svg
    type: flow-animated
    title: 'Building a compound filter: two masks combine, and missing-value rows drop out of both branches'
    alt: 'Diagram: a score column produces mask A via the comparison score greater than 50 and a name column produces mask B via the comparison name length greater than 2, both masks travel into a combine stage where they meet with an AND symbol, the combined mask then travels into an apply stage against the original table, kept rows flow out highlighted green while rows that were NaN in the score column are shown peeling away from BOTH mask A and the combined mask before reaching the apply stage, landing in a side tray labelled dropped by missing values, not by the condition'
    description: >-
      An animated flow diagram, readable in full as a still image, showing a compound filter assembled
      left to right in three stages: BUILD, COMBINE, APPLY. In the BUILD stage, two small labelled source
      blocks -- a score column and a name column -- each feed a comparison box (score > 50, name length >
      2) that produces its own mask, drawn as a short vertical stack of True/False/NaN-styled cells. A
      travelling token slides along a wire from each comparison box toward a COMBINE stage in the centre,
      where the two masks meet at an AND gate icon and merge into one combined mask. From COMBINE, a
      second wire carries the combined mask to an APPLY stage on the right, where it is laid against a
      faint outline of the original table; rows aligned with a True cell light up green and flow into a
      KEPT tray at the bottom right. Threaded through all three stages, the two rows whose score was
      originally NaN are drawn with the same dashed, paler styling as the architecture diagram, and are
      shown peeling OFF the main wire at the very first comparison box -- before COMBINE, before APPLY --
      sliding instead into a small side tray labelled "dropped by MISSING VALUES, not by the condition,"
      positioned so it is visually obvious these two rows never had a chance to be evaluated by the
      second comparison or the AND gate at all. A caption beneath states that a row can be excluded from a
      filter for two different reasons -- it failed the condition, or the condition could not be evaluated
      on it at all -- and that only the second one is silently invisible in an ordinary read of the code.
      A prefers-reduced-motion block halts the travelling tokens and the AND-gate pulse, leaving both
      wires drawn as solid completed paths, the KEPT tray already populated in its final green state, and
      the side tray already showing its two dropped rows, so every fact in the diagram is visible without
      motion.
