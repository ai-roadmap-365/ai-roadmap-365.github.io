<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="d122fTitleId d122fDescId">
  <title id="d122fTitleId">Building a compound filter: two masks combine, and missing-value rows drop out of both branches</title>
  <desc id="d122fDescId">Two comparisons each build a mask; the masks combine at an AND gate; the combined mask is applied to the table and kept rows flow into a tray. Rows with a missing score peel off at the very first comparison, before combine or apply, into a separate tray labelled dropped by missing values, not by the condition.</desc>

  <style>
    .d122f-bg    { fill: #f8fafc; }
    .d122f-title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d122f-label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d122f-small { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d122f-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d122f-cap   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }

    .d122f-box     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d122f-tray-kept { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .d122f-tray-drop { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }

    /* Stages light up in sequence: BUILD, COMBINE, APPLY */
    .d122f-stage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; animation: d122f-lift 6s ease-in-out infinite; }
    .d122f-s1 { animation-delay: 0.2s; }
    .d122f-s2 { animation-delay: 2.2s; }
    .d122f-s3 { animation-delay: 4.2s; }
    @keyframes d122f-lift {
      0%, 22%, 100% { fill: #e0e7ff; }
      8%, 16%       { fill: #bfdbfe; }
    }

    /* Marching-dash wires: the two comparisons feeding COMBINE, and COMBINE feeding APPLY */
    .d122f-wire { fill: none; stroke: #1d4ed8; stroke-width: 2.5; stroke-dasharray: 9 7; animation: d122f-march 1.6s linear infinite; marker-end: url(#d122f-arrow); }
    @keyframes d122f-march { to { stroke-dashoffset: -16; } }

    /* The kept-rows wire from APPLY to the KEPT tray, revealed once the token has arrived */
    .d122f-wire-kept { stroke: #16a34a; stroke-width: 2.5; fill: none; marker-end: url(#d122f-arrow-green); animation: d122f-reveal 6s ease-in-out infinite; }
    @keyframes d122f-reveal {
      0%, 60%   { opacity: 0.85; }
      70%, 100% { opacity: 1; }
    }

    /* The dropped-rows wire: dashed red, always visible, pulses once per cycle to draw the eye */
    .d122f-wire-drop { stroke: #dc2626; stroke-width: 2.25; fill: none; stroke-dasharray: 6 5; marker-end: url(#d122f-arrow-red); animation: d122f-pulse 6s ease-in-out infinite; }
    @keyframes d122f-pulse {
      0%, 14%, 100% { opacity: 0.6; }
      4%, 10%       { opacity: 1; }
    }

    /* A token travelling the score-column happy path through BUILD -> COMBINE -> APPLY -> KEPT */
    .d122f-token { fill: #1d4ed8; animation: d122f-travel 6s ease-in-out infinite; }
    @keyframes d122f-travel {
      0%   { transform: translate(0px, 0px);     opacity: 1; }
      4%   { transform: translate(0px, 0px);     opacity: 1; }
      28%  { transform: translate(210px, 45px);  opacity: 1; }
      50%  { transform: translate(400px, 45px);  opacity: 1; }
      74%  { transform: translate(400px, 45px);  opacity: 1; }
      92%  { transform: translate(560px, 20px);  opacity: 1; }
      100% { transform: translate(560px, 20px);  opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d122f-stage     { animation: none; fill: #e0e7ff; }
      .d122f-wire      { animation: none; stroke-dasharray: none; }
      .d122f-wire-kept { animation: none; opacity: 1; }
      .d122f-wire-drop { animation: none; opacity: 1; }
      .d122f-token     { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d122f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d122f-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="d122f-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect class="d122f-bg" x="0" y="0" width="1000" height="560" />
  <text class="d122f-title" x="28" y="36">Building a compound filter</text>
  <text class="d122f-small" x="28" y="58">score &gt; 50  &amp;  len(name) &gt; 2 — and where the missing rows actually leave the pipeline</text>

  <!-- Stage headers -->
  <text class="d122f-label" x="60" y="90" font-weight="700">BUILD</text>
  <text class="d122f-label" x="430" y="90" font-weight="700">COMBINE</text>
  <text class="d122f-label" x="660" y="90" font-weight="700">APPLY</text>

  <!-- ===== BUILD: two comparisons ===== -->
  <rect class="d122f-box d122f-stage d122f-s1" x="40" y="110" width="120" height="52" rx="6" />
  <text class="d122f-mono" x="52" y="132">score column</text>
  <text class="d122f-mono" x="52" y="150">has 2 NaN</text>

  <rect class="d122f-box d122f-stage d122f-s1" x="210" y="110" width="150" height="52" rx="6" />
  <text class="d122f-mono" x="222" y="132">score &gt; 50</text>
  <text class="d122f-mono" x="222" y="150">→ mask A</text>

  <rect class="d122f-box d122f-stage d122f-s1" x="40" y="230" width="120" height="52" rx="6" />
  <text class="d122f-mono" x="52" y="252">name column</text>
  <text class="d122f-mono" x="52" y="270">no missing</text>

  <rect class="d122f-box d122f-stage d122f-s1" x="210" y="230" width="150" height="52" rx="6" />
  <text class="d122f-mono" x="222" y="252">len(name) &gt; 2</text>
  <text class="d122f-mono" x="222" y="270">→ mask B</text>

  <path class="d122f-wire" d="M 160 136 L 205 136" />
  <path class="d122f-wire" d="M 160 256 L 205 256" />

  <!-- Mask A/B feed into COMBINE -->
  <path class="d122f-wire" d="M 360 136 C 400 136, 400 195, 440 195" />
  <path class="d122f-wire" d="M 360 256 C 400 256, 400 215, 440 215" />

  <!-- ===== COMBINE: AND gate ===== -->
  <rect class="d122f-box d122f-stage d122f-s2" x="440" y="170" width="130" height="60" rx="8" />
  <text class="d122f-mono" x="460" y="196" font-weight="700">AND</text>
  <text class="d122f-mono" x="460" y="216">combined mask</text>

  <path class="d122f-wire" d="M 570 200 L 615 200" />

  <!-- ===== APPLY: against the table ===== -->
  <rect class="d122f-box d122f-stage d122f-s3" x="620" y="170" width="130" height="60" rx="8" />
  <text class="d122f-mono" x="638" y="196" font-weight="700">apply mask</text>
  <text class="d122f-mono" x="638" y="216">to the table</text>

  <path class="d122f-wire-kept" d="M 750 190 C 790 175, 800 150, 820 140" />

  <!-- KEPT tray -->
  <rect class="d122f-tray-kept" x="820" y="90" width="140" height="80" rx="6" />
  <text class="d122f-label" x="832" y="114" font-weight="700" fill="#166534">KEPT</text>
  <text class="d122f-mono" x="832" y="136" font-size="12">Ada, Dee, Gio</text>
  <text class="d122f-cap" x="832" y="156" font-size="12">3 rows: pass both</text>

  <!-- Missing-value rows peel off at the FIRST comparison box, before COMBINE or APPLY -->
  <path class="d122f-wire-drop" d="M 285 162 C 260 260, 300 330, 440 340" />
  <text class="d122f-cap" x="288" y="180" font-size="12" fill="#991b1b">Cy, Fay peel off HERE —</text>
  <text class="d122f-cap" x="288" y="196" font-size="12" fill="#991b1b">never reach COMBINE or APPLY</text>

  <rect class="d122f-tray-drop" x="440" y="340" width="220" height="90" rx="6" />
  <text class="d122f-label" x="452" y="364" font-weight="700" fill="#991b1b">DROPPED BY MISSING VALUES</text>
  <text class="d122f-cap" x="452" y="384" font-size="12">Cy, Fay — 2 rows</text>
  <text class="d122f-cap" x="452" y="404" font-size="12">not by the condition,</text>
  <text class="d122f-cap" x="452" y="420" font-size="12">by NaN &gt; 50 always being False</text>

  <!-- Traveling token, following the happy-path score row through BUILD -> COMBINE -> APPLY -->
  <circle class="d122f-token" cx="66" cy="136" r="8" />

  <!-- Caption -->
  <rect x="20" y="450" width="960" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="d122f-cap" x="36" y="474" font-weight="700" fill="#1a202c" font-size="15">A row can be excluded from a filter for two different reasons.</text>
  <text class="d122f-cap" x="36" y="496">Either it failed the condition — visible, expected, the point of filtering — or the condition could not</text>
  <text class="d122f-cap" x="36" y="518">be evaluated on it at all, because the value was missing. Only the second one is silently invisible in an</text>
  <text class="d122f-cap" x="36" y="536">ordinary read of the code: Cy and Fay never even reach the AND gate or the table.</text>
</svg>
