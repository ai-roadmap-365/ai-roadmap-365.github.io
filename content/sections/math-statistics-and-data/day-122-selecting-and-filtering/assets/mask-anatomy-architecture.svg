<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="d122aTitleId d122aDescId">
  <title id="d122aTitleId">Anatomy of a boolean mask: True flows through, False is held back, NaN falls out of BOTH</title>
  <desc id="d122aDescId">An eight-row table of names and scores beside its boolean mask for score greater than 50. True rows flow through a gate into a kept panel, False rows are held back, and the two rows with a missing score fall through a gap under the gate into a third panel. The same gap catches the same two rows again under the negated mask, score less than or equal to 50.</desc>

  <style>
    .d122a-bg     { fill: #f8fafc; }
    .d122a-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #1a202c; }
    .d122a-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d122a-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d122a-mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d122a-cap    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }

    .d122a-cell        { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
    .d122a-cell-nan     { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .d122a-cell-true   { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .d122a-cell-false  { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; }
    .d122a-cell-nan-mask { fill: #fee2e2; stroke: #94a3b8; stroke-width: 1.25; stroke-dasharray: 4 3; }

    .d122a-panel-kept   { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .d122a-panel-held   { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
    .d122a-panel-missing { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }

    .d122a-arrow { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#d122a-arrowhead); }
    .d122a-arrow-drop { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 5 4; marker-end: url(#d122a-arrowhead-red); }
  </style>

  <defs>
    <marker id="d122a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d122a-arrowhead-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect class="d122a-bg" x="0" y="0" width="1000" height="640" />
  <text class="d122a-title" x="28" y="38">Anatomy of a boolean mask</text>
  <text class="d122a-small" x="28" y="60">Two outcomes are obvious. A third is silent — and it happens twice.</text>

  <!-- ================= LEFT HALF: mask = score > 50 ================= -->
  <text class="d122a-label" x="28" y="94" font-weight="600">mask = score &gt; 50</text>

  <!-- source table -->
  <text class="d122a-small" x="28" y="114">table</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- header -->
    <rect class="d122a-cell" x="20" y="122" width="70" height="26" fill="#e2e8f0" />
    <text class="d122a-mono" x="30" y="140" font-weight="600">name</text>
    <rect class="d122a-cell" x="90" y="122" width="70" height="26" fill="#e2e8f0" />
    <text class="d122a-mono" x="98" y="140" font-weight="600">score</text>

    <!-- rows: Ada 72, Bo 45, Cy NaN, Dee 91, Eli 50, Fay NaN, Gio 88, Hu 33 -->
    <!-- row 1: Ada 72 -->
    <rect class="d122a-cell" x="20" y="148" width="70" height="26" /><text class="d122a-mono" x="30" y="166">Ada</text>
    <rect class="d122a-cell" x="90" y="148" width="70" height="26" /><text class="d122a-mono" x="102" y="166">72</text>
    <!-- row 2: Bo 45 -->
    <rect class="d122a-cell" x="20" y="174" width="70" height="26" /><text class="d122a-mono" x="30" y="192">Bo</text>
    <rect class="d122a-cell" x="90" y="174" width="70" height="26" /><text class="d122a-mono" x="102" y="192">45</text>
    <!-- row 3: Cy NaN -->
    <rect class="d122a-cell-nan" x="20" y="200" width="70" height="26" /><text class="d122a-mono" x="30" y="218">Cy</text>
    <rect class="d122a-cell-nan" x="90" y="200" width="70" height="26" /><text class="d122a-mono" x="97" y="218">NaN</text>
    <!-- row 4: Dee 91 -->
    <rect class="d122a-cell" x="20" y="226" width="70" height="26" /><text class="d122a-mono" x="30" y="244">Dee</text>
    <rect class="d122a-cell" x="90" y="226" width="70" height="26" /><text class="d122a-mono" x="102" y="244">91</text>
    <!-- row 5: Eli 50 -->
    <rect class="d122a-cell" x="20" y="252" width="70" height="26" /><text class="d122a-mono" x="30" y="270">Eli</text>
    <rect class="d122a-cell" x="90" y="252" width="70" height="26" /><text class="d122a-mono" x="102" y="270">50</text>
    <!-- row 6: Fay NaN -->
    <rect class="d122a-cell-nan" x="20" y="278" width="70" height="26" /><text class="d122a-mono" x="30" y="296">Fay</text>
    <rect class="d122a-cell-nan" x="90" y="278" width="70" height="26" /><text class="d122a-mono" x="97" y="296">NaN</text>
    <!-- row 7: Gio 88 -->
    <rect class="d122a-cell" x="20" y="304" width="70" height="26" /><text class="d122a-mono" x="30" y="322">Gio</text>
    <rect class="d122a-cell" x="90" y="304" width="70" height="26" /><text class="d122a-mono" x="102" y="322">88</text>
    <!-- row 8: Hu 33 -->
    <rect class="d122a-cell" x="20" y="330" width="70" height="26" /><text class="d122a-mono" x="30" y="348">Hu</text>
    <rect class="d122a-cell" x="90" y="330" width="70" height="26" /><text class="d122a-mono" x="102" y="348">33</text>
  </g>

  <!-- mask column -->
  <text class="d122a-small" x="200" y="114">mask</text>
  <g>
    <rect class="d122a-cell" x="190" y="122" width="70" height="26" fill="#e2e8f0" />
    <text class="d122a-mono" x="196" y="140" font-weight="600">score&gt;50</text>

    <rect class="d122a-cell-true" x="190" y="148" width="70" height="26" /><text class="d122a-mono" x="205" y="166">True</text>
    <rect class="d122a-cell-false" x="190" y="174" width="70" height="26" /><text class="d122a-mono" x="200" y="192">False</text>
    <rect class="d122a-cell-nan" x="190" y="200" width="70" height="26" /><text class="d122a-mono" x="200" y="218">False*</text>
    <rect class="d122a-cell-true" x="190" y="226" width="70" height="26" /><text class="d122a-mono" x="205" y="244">True</text>
    <rect class="d122a-cell-false" x="190" y="252" width="70" height="26" /><text class="d122a-mono" x="200" y="270">False</text>
    <rect class="d122a-cell-nan" x="190" y="278" width="70" height="26" /><text class="d122a-mono" x="200" y="296">False*</text>
    <rect class="d122a-cell-true" x="190" y="304" width="70" height="26" /><text class="d122a-mono" x="205" y="322">True</text>
    <rect class="d122a-cell-false" x="190" y="330" width="70" height="26" /><text class="d122a-mono" x="200" y="348">False</text>
  </g>
  <text class="d122a-small" x="190" y="370" font-style="italic">* NaN &gt; 50 is False — dashed, not a real "no"</text>

  <!-- gate + panels -->
  <path class="d122a-arrow" d="M 262 174 L 300 210" />
  <path class="d122a-arrow" d="M 262 226 L 300 240" />
  <path class="d122a-arrow" d="M 262 306 L 300 270" />
  <text class="d122a-cap" x="300" y="205" text-anchor="middle" font-size="11">gate</text>

  <rect class="d122a-panel-kept" x="330" y="150" width="140" height="90" rx="6" />
  <text class="d122a-label" x="340" y="172" font-weight="700" fill="#166534">KEPT</text>
  <text class="d122a-mono" x="340" y="196">Ada, Dee, Gio</text>
  <text class="d122a-cap" x="340" y="216" font-size="12">3 rows: True</text>

  <rect class="d122a-panel-held" x="330" y="252" width="140" height="90" rx="6" />
  <text class="d122a-label" x="340" y="274" font-weight="700" fill="#334155">HELD BACK</text>
  <text class="d122a-mono" x="340" y="298">Bo, Eli, Hu</text>
  <text class="d122a-cap" x="340" y="318" font-size="12">3 rows: False</text>

  <path class="d122a-arrow-drop" d="M 225 213 Q 260 360 380 372" />
  <path class="d122a-arrow-drop" d="M 225 291 Q 300 370 380 380" />

  <rect class="d122a-panel-missing" x="330" y="366" width="140" height="76" rx="6" />
  <text class="d122a-label" x="340" y="388" font-weight="700" fill="#991b1b" font-size="13">NEITHER KEPT</text>
  <text class="d122a-label" x="340" y="404" font-weight="700" fill="#991b1b" font-size="13">NOR HELD</text>
  <text class="d122a-mono" x="340" y="424" font-size="13">Cy, Fay</text>

  <!-- ================= RIGHT HALF: mask = score <= 50 (negation) ================= -->
  <text class="d122a-label" x="560" y="94" font-weight="600">~mask = score &lt;= 50</text>
  <text class="d122a-small" x="560" y="114">same table, negated condition</text>

  <g>
    <rect class="d122a-cell" x="560" y="122" width="70" height="26" fill="#e2e8f0" />
    <text class="d122a-mono" x="562" y="140" font-weight="600">score&lt;=50</text>

    <rect class="d122a-cell-false" x="560" y="148" width="70" height="26" /><text class="d122a-mono" x="570" y="166">False</text>
    <rect class="d122a-cell-true" x="560" y="174" width="70" height="26" /><text class="d122a-mono" x="575" y="192">True</text>
    <rect class="d122a-cell-nan" x="560" y="200" width="70" height="26" /><text class="d122a-mono" x="570" y="218">False*</text>
    <rect class="d122a-cell-false" x="560" y="226" width="70" height="26" /><text class="d122a-mono" x="570" y="244">False</text>
    <rect class="d122a-cell-true" x="560" y="252" width="70" height="26" /><text class="d122a-mono" x="575" y="270">True</text>
    <rect class="d122a-cell-nan" x="560" y="278" width="70" height="26" /><text class="d122a-mono" x="570" y="296">False*</text>
    <rect class="d122a-cell-false" x="560" y="304" width="70" height="26" /><text class="d122a-mono" x="570" y="322">False</text>
    <rect class="d122a-cell-true" x="560" y="330" width="70" height="26" /><text class="d122a-mono" x="575" y="348">True</text>
  </g>

  <path class="d122a-arrow" d="M 632 200 L 670 210" />
  <path class="d122a-arrow" d="M 632 252 L 670 240" />
  <path class="d122a-arrow" d="M 632 332 L 670 270" />

  <rect class="d122a-panel-kept" x="700" y="150" width="140" height="90" rx="6" />
  <text class="d122a-label" x="710" y="172" font-weight="700" fill="#166534">KEPT</text>
  <text class="d122a-mono" x="710" y="196">Bo, Eli, Hu</text>
  <text class="d122a-cap" x="710" y="216" font-size="12">3 rows: True</text>

  <rect class="d122a-panel-held" x="700" y="252" width="140" height="90" rx="6" />
  <text class="d122a-label" x="710" y="274" font-weight="700" fill="#334155">HELD BACK</text>
  <text class="d122a-mono" x="710" y="298">Ada, Dee, Gio</text>
  <text class="d122a-cap" x="710" y="318" font-size="12">3 rows: False</text>

  <path class="d122a-arrow-drop" d="M 595 213 Q 640 400 750 380" />
  <path class="d122a-arrow-drop" d="M 595 291 Q 680 400 750 388" />

  <!-- same missing panel, arrows converge into it a second time -->
  <path class="d122a-arrow-drop" d="M 470 404 L 700 404" />
  <text class="d122a-cap" x="470" y="396" font-size="11" fill="#991b1b">Cy and Fay fall through AGAIN</text>

  <!-- caption -->
  <rect x="20" y="470" width="960" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="d122a-cap" x="36" y="496" font-weight="700" fill="#1a202c" font-size="15">A row that fails a comparison is absent from the True side.</text>
  <text class="d122a-cap" x="36" y="520">A row with a MISSING value fails the comparison AND its negation — score &gt; 50 is False for a NaN,</text>
  <text class="d122a-cap" x="36" y="542">and score &lt;= 50 is ALSO False for the same NaN. It is absent from both mask and ~mask, and there is</text>
  <text class="d122a-cap" x="36" y="564">no exception anywhere to announce it. The only reliable way to find it is .isna(), checked explicitly —</text>
  <text class="d122a-cap" x="36" y="586">never inferred from what a filter and its opposite both failed to return.</text>
  <text class="d122a-cap" x="36" y="610" font-style="italic">Cy and Fay: 2 rows, silently excluded from BOTH halves of an 8-row table.</text>
</svg>
