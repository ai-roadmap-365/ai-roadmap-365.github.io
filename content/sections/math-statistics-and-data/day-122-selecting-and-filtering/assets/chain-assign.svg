<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The assignment trap</title>
  <style>
    .chain-assign-bg   { fill: #f8fafc; }
    .chain-assign-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-assign-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-assign-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-assign-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-assign-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-assign-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-assign-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chain-assign-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chain-assign-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chain-assign-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chain-assign-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chain-assign-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chain-assign-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chain-assign-stage { opacity: 1; }

    .chain-assign-s0 { animation-delay: 0.00s; }
    .chain-assign-e0 { animation-delay: 0.00s; }
    .chain-assign-s1 { animation-delay: 1.28s; }
    .chain-assign-e1 { animation-delay: 1.28s; }
    .chain-assign-s2 { animation-delay: 2.56s; }
    .chain-assign-e2 { animation-delay: 2.56s; }
    .chain-assign-s3 { animation-delay: 3.84s; }
    .chain-assign-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chain-assign-conn  { animation: chain-assign-trace 6.4s ease-in-out infinite; }
      .chain-assign-stage { animation: chain-assign-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chain-assign-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chain-assign-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chain-assign-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chain-assign-stage { animation: chain-assign-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chain-assign-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chain-assign-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chain-assign-bg" width="980" height="322"/>
  <text class="chain-assign-h1"  x="30" y="40">The assignment trap</text>
  <text class="chain-assign-sub" x="30" y="64">Four steps.</text>
  <g class="chain-assign-stage chain-assign-s0">
    <rect class="chain-assign-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chain-assign-step" x="44" y="142">01</text>
    <text class="chain-assign-name" x="70" y="142">Selecting twice in sequence looks natural</text>
    <text class="chain-assign-desc" x="44" y="166">Filter, then assign to a column.</text>
  </g>
  <line class="chain-assign-line chain-assign-conn chain-assign-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chain-assign-tip)"/>
  <g class="chain-assign-stage chain-assign-s1">
    <rect class="chain-assign-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chain-assign-step" x="280" y="142">02</text>
    <text class="chain-assign-name" x="306" y="142">But the first selection may return a copy</text>
    <text class="chain-assign-desc" x="280" y="166">Not a view of the original.</text>
  </g>
  <line class="chain-assign-line chain-assign-conn chain-assign-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chain-assign-tip)"/>
  <g class="chain-assign-stage chain-assign-s2">
    <rect class="chain-assign-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chain-assign-step" x="516" y="142">03</text>
    <text class="chain-assign-name" x="542" y="142">So the assignment updates the copy and is lost</text>
    <text class="chain-assign-desc" x="516" y="166">Sometimes with a warning,</text>
    <text class="chain-assign-desc" x="516" y="182">sometimes not.</text>
  </g>
  <line class="chain-assign-line chain-assign-conn chain-assign-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chain-assign-tip)"/>
  <g class="chain-assign-stage chain-assign-s3">
    <rect class="chain-assign-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chain-assign-step" x="752" y="142">04</text>
    <text class="chain-assign-name" x="778" y="142">Selecting rows and column in one operation is correct</text>
    <text class="chain-assign-desc" x="752" y="166">Which is the rule to</text>
    <text class="chain-assign-desc" x="752" y="182">internalise.</text>
  </g>
  <text class="chain-assign-sub" x="30" y="304">This is probably the most common silent bug in data frame code, and the fix is mechanical: never chain a selection before an assignment.</text>
</svg>
