terms:
  - term: boolean mask
    definition: >-
      A Series of True/False values, one per row of the DataFrame it was built against, sharing that
      DataFrame's index. df[mask] keeps only the rows where mask is True. A mask is not a bare array of
      booleans; its index is what makes it possible to build a mask from one frame and apply it correctly
      to a differently-ordered version of the same frame.
  - term: partition invariant
    definition: >-
      The check that a set of filters, taken together, accounts for every row of the original frame
      exactly once. A naive two-way split of a column with missing values (score > 50, score <= 50) fails
      this invariant, because rows where the column is NaN satisfy neither comparison and are silently
      missing from both halves.
  - term: '`&`, `|`, `~`'
    definition: >-
      The elementwise boolean operators pandas overloads for combining masks -- AND, OR and NOT applied
      row by row. They work on a Series with no ambiguity because each row's result is independent. Python's
      `and`, `or` and `not` keywords are control-flow operators that need a single True/False and raise
      ValueError on a multi-row Series.
  - term: operator precedence trap
    definition: >-
      The fact that `&` binds more tightly than comparison operators (`>`, `<`, `==`) in Python, so
      `df.a > 1 & df.b < 2` does not group as `(df.a > 1) & (df.b < 2)` the way it visually reads. Every
      comparison combined with `&`, `|` or `~` must be individually parenthesised.
  - term: index alignment (filtering)
    definition: >-
      The rule that df[mask] looks up each of df's row labels in mask's own index and uses whatever
      boolean sits at that label -- regardless of the physical row order mask happens to be stored in.
      Converting a mask to a raw array with .to_numpy() discards this label information and makes
      selection purely positional.
  - term: '.loc'
    definition: >-
      A label-based indexer. df.loc[mask, 'col'] combines row filtering by a boolean mask with column
      selection in one call, and is the safe form for assignment through a filter under Copy-on-Write
      (Day 120).
  - term: '.query()'
    definition: >-
      A DataFrame method that evaluates a string of Python-like expression syntax against the frame's own
      columns, returning the same rows an equivalent boolean mask would. References an external Python
      value with an `@` prefix, e.g. df.query("amount > @threshold"). Reads well once several conditions
      stack up; costs the overhead of parsing a string for a single simple condition.
  - term: '.isin()'
    definition: >-
      A Series method returning True for every row whose value appears in a given collection. Equivalent
      to chaining `==` and `|` once per value, but scales to any number of values with one call.
      series.isin([]), an empty collection, returns an all-False mask -- filtering with it gives an empty
      frame, not the untouched original.
  - term: '.between()'
    definition: >-
      A Series method testing whether each value falls within a closed range (inclusive of both endpoints
      by default): series.between(lo, hi) is equivalent to (series >= lo) & (series <= hi), written as one
      call instead of a parenthesised compound comparison.
  - term: '.str.contains() NA trap'
    definition: >-
      On an object-dtype string column, .str.contains(pattern) applied to a missing entry returns None,
      not False, producing a mask whose own dtype is object rather than bool; filtering a DataFrame with
      such a mask raises ValueError. na=False makes .str.contains() treat a missing entry as "did not
      match" up front, producing a clean boolean mask. On pandas 3.0's default str dtype, a missing entry
      already returns a clean False with no na= needed.
  - term: '.nlargest() / .nsmallest()'
    definition: >-
      DataFrame/Series methods returning the n rows with the largest (or smallest) values in a given
      column, computed without a full sort. Match df.sort_values(col, ascending=False).head(n) exactly
      when no tie sits at the cutoff; keep='all' can return MORE than n rows, surfacing every row tied at
      the boundary rather than an arbitrary subset of them.
  - term: '.drop_duplicates()'
    definition: >-
      A DataFrame method removing rows that repeat according to a chosen subset of columns (every column,
      by default). subset names which columns define "duplicate"; keep chooses which occurrence of each
      duplicate group survives ('first', 'last', or False to drop every member of a duplicated group).
  - term: '.filter()'
    definition: >-
      A DataFrame method selecting LABELS -- column names by default, or row labels with axis=0 -- by
      exact match (items=), substring (like=), or pattern (regex=). It never evaluates a condition on the
      data inside a column or row, and passing it row-shaped arguments silently matches nothing rather
      than raising, making its name one of the more confusing in the library.
  - term: precedence-safe expression engine
    definition: >-
      A design, exemplified by polars' pl.col('a') > 1 syntax and pandas' own .query() strings, where
      comparisons and boolean combinators are composed inside one expression object or parsed string
      rather than through Python's own operator-precedence table applied to Series objects -- removing the
      `&`-binds-tighter-than-comparisons trap by construction rather than by convention.
