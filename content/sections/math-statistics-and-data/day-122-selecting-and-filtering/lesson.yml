id: D122
day: 122
slug: selecting-and-filtering
title: Selecting and Filtering
section: math-statistics-and-data
subsection: data-analysis
week: 18
learning_promise: >-
  After this lesson you will be able to demonstrate, on a real column with missing values, that a naive
  two-way filter split does not sum to the total row count and name exactly why; combine masks correctly
  with & , | and ~ and explain why Python's and/or raise ValueError on a Series; recognise and fix the
  &-binds-tighter-than-comparisons precedence trap in an unparenthesised compound filter; explain why a
  boolean mask built from a differently-ordered copy of a frame still selects the correct rows when
  applied to the original, because filtering aligns by label rather than position, and predict when
  stripping that label with .to_numpy() silently breaks it; fix the .str.contains() missing-value trap
  with na=False and state which pandas 3.0 dtype default changes whether it fires at all; use .query()
  including its @variable syntax and state honestly when it beats a plain mask; use .isin() correctly,
  including its counterintuitive empty-list behaviour; choose between .nlargest()/.nsmallest() and
  .sort_values().head() and explain the one case where they return different row counts; use
  .drop_duplicates() with subset and keep and explain why "duplicate" is a choice, not a fixed property;
  and predict what .filter() actually does, which is not filter rows.
objectives:
  - 'Demonstrate that a naive two-way filter split (score > 50, score <= 50) does not sum to the total row count when the column has missing values, and build a three-way partition that does'
  - "Explain why `mask1 and mask2` raises ValueError while `mask1 & mask2` does not, and combine masks correctly with &, | and ~"
  - "Recognise the `&`-binds-tighter-than-comparisons precedence trap in an unparenthesised compound filter, and parenthesise every comparison correctly"
  - 'Filter and select in one .loc call, and state why that stays safe under Copy-on-Write when assigning through it (Day 120)'
  - "Explain why a boolean mask built from a reordered copy of a frame still selects the correct rows when applied to the original, because filtering aligns by label, and predict when .to_numpy() breaks that guarantee"
  - "Fix the .str.contains() missing-value trap with na=False, and state which pandas 3.0 dtype default changes whether the trap fires by default"
  - "Use .query() including its @variable syntax, and state honestly when a plain mask is the simpler choice"
  - "Use .isin() and .between() correctly, including isin([])'s counterintuitive empty-result behaviour"
  - "Choose between .nlargest()/.nsmallest() and .sort_values().head(), and explain the one case (a tie at the cutoff) where they return a different number of rows"
  - "Use .drop_duplicates() with subset and keep, and explain why 'duplicate' means whatever columns subset names, not a fixed property of a row"
  - "Predict what .filter() actually does -- selecting labels, never rows -- and what happens when it is given row-shaped arguments by mistake"
  - 'Connect the partition-invariant habit to AI practice: recognise that a filter which silently drops rows with missing values during training-data selection produces a biased dataset, not an error'
prerequisites:
  - 'Day 120 — Series and DataFrames, index alignment, and Copy-on-Write; a mask is a Series with an index, and .loc[mask, col] = value is the safe assignment form this lesson builds on'
  - 'Day 121 — loading and inspecting data, including how missing values actually arrive in a real column'
  - 'Days 92-98 — data formats and pipelines, and the habit of reading data before trusting it'
  - 'Week 13 — SQL and SQLite, the tool this lesson compares filtering against for questions better pushed into a database'
  - 'A working python3 on your PATH; the lab creates its own virtual environment with pandas 3.0.5 pinned exactly'
reading_time_minutes: 45
practical_time_minutes: 40
