questions:
  - question: >-
      A DataFrame has a score column with two NaN values. high = df[df.score > 50] has 3 rows and
      low = df[df.score <= 50] has 3 rows, on a frame of 8 total rows. What is the correct explanation?
    options:
      - 'This is a bug in pandas; the two counts should always sum to the total'
      - 'The two NaN rows fail BOTH comparisons and are absent from both high and low, so 3 + 3 != 8'
      - 'One of the NaN rows was silently dropped from the frame by the first filter'
      - 'high and low overlap: at least one row satisfies both score > 50 and score <= 50'
    answer_index: 1
    explanation: >-
      NaN compared with >, <, <=, or >= always returns False -- never True, never an error. A row with a
      missing score fails EVERY comparison built from it, so it is absent from every group built purely
      from comparisons. The fix is not "trust the two totals less"; it is to name the missing rows as
      their own explicit group and check that all groups together sum to the total.
  - question: >-
      Why does `mask1 and mask2` raise ValueError when mask1 and mask2 are boolean pandas Series with more
      than one row?
    options:
      - "`and` requires both operands to be exactly the same length, and pandas cannot verify that"
      - "`and` is deprecated in pandas 3.0 in favour of `&`"
      - "Python's `and` needs to reduce each operand to a single True/False via __bool__, but a multi-row Series has no single truth value"
      - "`and` only works on Series with a RangeIndex, and these masks have a custom index"
    answer_index: 2
    explanation: >-
      `and` and `or` are Python control-flow keywords: they must collapse each operand to one boolean to
      decide which branch to take. A Series with more than one element cannot honestly answer "true or
      false" as a whole, so pandas raises rather than silently picking .any() or .all() on your behalf.
      `&`, `|` and `~` are ordinary overloaded operators that combine every row independently and never
      need a single truth value.
  - question: >-
      `df[df.a > 1 & df.b < 2]` is written expecting "rows where a > 1 AND b < 2". What actually happens?
    options:
      - 'It works correctly, because pandas evaluates comparisons left to right regardless of & placement'
      - 'It silently returns every row, because `&` on integers always evaluates to a truthy value'
      - 'It raises a SyntaxError before the line ever runs'
      - "It raises the same ValueError `and` raises, because `&` binds tighter than `>`/`<`, turning the expression into a chained comparison that needs a single truth value"
    answer_index: 3
    explanation: >-
      In Python, `&` binds more tightly than `>` and `<`. The expression actually parses as
      `df.a > (1 & df.b) < 2`, a chained comparison equivalent to `(df.a > (1 & df.b)) and ((1 & df.b) < 2)`
      -- which needs a single truth value from a Series-valued sub-expression and raises exactly the
      ValueError exercise 2 already demonstrated. The fix is unconditional: parenthesise every comparison
      before combining with `&`, `|` or `~`.
  - question: >-
      A boolean mask is built from `df.sort_values('score', ascending=False)` -- a reordered COPY of df --
      then applied as `df[mask]` to the ORIGINAL df. What rows come back, and in what order?
    options:
      - "The correct rows -- pandas looks up each of df's labels in the mask's index, and returns them in df's own original order, regardless of the mask's storage order"
      - 'The wrong rows, because the mask was built from a different row order than df has'
      - "An error, because df and the mask do not share the same row order"
      - "The correct rows, but in the SORTED order the mask happened to be built in"
    answer_index: 0
    explanation: >-
      A mask is a Series with an index, and df[mask] aligns by LABEL, not by physical row order. Which
      row the mask's True/False values are stored at makes no difference to the result, as long as every
      label df needs is present in the mask. The result comes back in df's own row order because that is
      the frame being indexed. Stripping the mask to a raw array with .to_numpy() discards this label
      information and makes the same booleans apply purely positionally -- which is where the silent
      wrong answer actually appears.
  - question: >-
      On an object-dtype string Series with a missing entry, `series.str.contains('a')` (no na= argument)
      is used to filter a DataFrame. What happens?
    options:
      - 'The missing row is silently excluded, as if it had returned False'
      - 'The missing row is silently included, as if it had returned True'
      - 'A ValueError is raised: filtering with a non-boolean mask containing NA values is not allowed'
      - 'A FutureWarning is printed, and the missing row is dropped from the whole DataFrame, not just the mask'
    answer_index: 2
    explanation: >-
      On object dtype, .str.contains() returns None (not False) for a missing entry, because there is no
      text to search. The resulting mask's own dtype becomes object, not bool, and pandas refuses to use
      a mask containing NA as a row selector -- it raises rather than guessing. na=False fixes this by
      telling .str.contains() to treat a missing entry as "did not match" before the mask is built. On
      pandas 3.0's own default str dtype for a plain list of strings, this specific trap does not fire by
      default -- a missing entry already returns a clean False -- but object dtype, still common, still
      needs na=False.
  - question: >-
      `orders.query("amount > @threshold")` and `orders[orders.amount > threshold]` are run with the same
      value of `threshold` in scope. How do their results compare?
    options:
      - "They select the identical rows -- `@threshold` inside .query() looks up the Python variable in the calling scope, exactly as the plain mask does"
      - "query() always returns a superset of the mask's rows, since it also matches near-equal floating-point values"
      - "They differ, because .query() re-parses column names as strings and cannot see values from outside the DataFrame at all"
      - "query() raises unless threshold is also a column of orders"
    answer_index: 0
    explanation: >-
      The `@` prefix inside a .query() string is exactly the mechanism for reaching a Python variable from
      the calling scope, rather than looking for a column of that name. When used correctly, .query() and
      the equivalent mask compute the identical boolean selection and therefore the identical rows --
      .query()'s advantage is readability once several conditions stack up, not a different result.
  - question: >-
      `staff.dept.isin([])` -- filtering with an EMPTY list of wanted values -- returns what?
    options:
      - 'Every row of staff, since no departments were excluded'
      - 'A TypeError, since isin requires at least one value'
      - 'Exactly the rows where dept is null or missing'
      - 'Zero rows: "is this row value one of these zero options" is false for every row, by definition'
    answer_index: 3
    explanation: >-
      isin([]) builds an all-False mask, because no row's value can ever be a member of an empty
      collection. Filtering with it therefore returns an empty frame, which is the OPPOSITE of the
      intuition "no filter values given must mean no filter applied." If "empty list means no filter" is
      genuinely the desired behaviour, it has to be coded explicitly, e.g. `df if not wanted else
      df[df.col.isin(wanted)]`; pandas will not infer that intention on its own.
  - question: >-
      A table has three rows tied for the top score, but `.nlargest(2, 'score', keep='all')` is called,
      asking for only the top 2. How many rows does it return, and why does `.sort_values('score',
      ascending=False).head(2)` behave differently?
    options:
      - "Both return exactly 2 rows, arbitrarily dropping one of the tied rows"
      - "nlargest raises an error when a tie sits at the cutoff, requiring keep='first' to resolve it"
      - "nlargest returns 3 -- every row tied at the cutoff value -- while sort_values().head(2) is structurally forced to return exactly 2, arbitrarily keeping two of the three"
      - "Both return all 3 rows, since keep='all' is the default behaviour of both methods"
    answer_index: 2
    explanation: >-
      keep='all' tells .nlargest() to surface every row tied for the boundary value, which can genuinely
      exceed the requested n -- a capability .head(n) does not have at all, since .head() always truncates
      to exactly n rows regardless of what lies at the cutoff. With the default keep='first', .nlargest()
      instead matches .sort_values().head() exactly, picking the same one row an ordinary stable sort
      would.
