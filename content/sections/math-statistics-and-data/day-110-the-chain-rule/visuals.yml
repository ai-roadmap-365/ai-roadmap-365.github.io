visuals:
  - id: computation-graph-architecture
    file: assets/computation-graph-architecture.svg
    type: diagram
    title: 'A computation graph with the local derivative on every edge, and one gradient built as a sum of two path products'
    alt: 'Diagram: a computation graph for f equals u times v, with u equals x squared and v equals 3x at x equals 2, showing the values 2, 4, 6 and 24 on the nodes and the local derivative on every edge — du by dx is 4, dv by dx is 3, df by du is 6 and df by dv is 4 — with the two paths from x to f highlighted separately, their products 24 and 12 written out, and the two added to give df by dx equals 36'
    description: 'A static architecture diagram, on a light background, that turns a small expression into a labelled graph. The heading states that the expression is f = u x v with u = x squared and v = 3x evaluated at x = 2, that every number shown is exact, and that x is used twice so there are two paths from x to f — multiply along each path, add across paths. The left panel, headed "THE GRAPH", draws four circular nodes: a leaf x holding 2 on the left, two intermediate nodes stacked vertically in the middle holding u = x squared at 4 and v = 3x at 6, and an output node f = u x v holding 24 on the right. Four edges connect them. The two edges forming the path through u are drawn in a heavy amber stroke and the two forming the path through v in a heavy blue stroke, so the two routes are visually separable where they cross the middle of the picture. Each edge carries a boxed local derivative in monospace, colour-matched to its path: du by dx equals 2x equals 4, then df by du equals v equals 6 along the amber route; dv by dx equals 3, then df by dv equals u equals 4 along the blue route. A note beneath explains that each edge label is a local derivative — how much the node at its head moves per unit of the node at its tail. The right panel, headed "THE TWO PATHS", holds two colour-matched boxes. The amber box reads "Path A: x to u to f", then df by du times du by dx, then 6 times 4, then 24. The blue box reads "Path B: x to v to f", then df by dv times dv by dx, then 4 times 3, then 12. A heavy rule separates them from the conclusion, which states that both movements are real and both happen, so they add, and gives df by dx equals 24 plus 12 equals 36 in large bold monospace. A footer band across the full width, headed "MULTIPLY ALONG EACH PATH, ADD ACROSS PATHS", writes the general formula as a stacked fraction — df by dx equals df by du times du by dx plus df by dv times dv by dx — with the arithmetic 36 equals 6 times 4 plus 4 times 3 beside it, and, past a vertical rule, an independent check: substituting the intermediates gives f = 3x cubed, so df by dx is 9x squared, which at x = 2 is 36, and a central difference measures 36.000000001 — three routes to one number. A final line records that neither 24 nor 12 nor their product 288 matches the measurement, only the sum does, and that this is why a gradient is accumulated with plus-equals rather than assigned.'
  - id: backward-pass-flow
    file: assets/backward-pass-flow.svg
    type: flow-animated
    title: 'The forward pass computing values left to right, then the backward pass carrying the gradient right to left by multiplying by each local derivative'
    alt: 'Diagram: a five-stage chain evaluated at x equals 1, with the forward pass along the top computing 1, 2, 5, 25, 5 and 1.609, the local derivative of each stage shown beneath as 2, 1, 10, 0.1 and 0.2, and the backward pass along the bottom carrying a gradient right to left from a seed of 1.0 through 0.2, 0.02, 0.2 and 0.2 to a final answer of 0.4'
    description: 'An animated flow diagram, fully readable as a still image. The heading reads "One forward pass, then one backward pass. Every number is real." and states that five stages are applied to x = 1 — double, add three, square, square root, natural logarithm — that the whole chain collapses to ln(2x + 3), and that the forward pass computes and keeps each value while the backward pass starts at 1 and multiplies by each stage local derivative in reverse. The picture is arranged in four horizontal bands. The top band, labelled "FORWARD PASS — left to right, computing and storing values" in amber, carries an amber arrow running the full width with the five stage names spaced along it, and a small amber token that travels left to right along that arrow during the first part of the cycle. Beneath it sits a row of six circular nodes holding the forward values 1, 2, 5, 25, 5 and 1.609, the first labelled x and the last labelled output; each node thickens its outline briefly in turn, in forward order, so the eye follows the computation. The third band, headed "LOCAL DERIVATIVE OF EACH STAGE, at the value arriving at it", places five amber boxes between the nodes reading 2, 1, 2u equals 10, 0.1 and 1 over u equals 0.2 — the middle one written with its formula to make the point that it is evaluated at the value arriving at that stage rather than at x. The fourth band, headed "BACKWARD PASS — right to left, multiplying by each local derivative" in blue, carries a blue arrow running right to left with a blue token travelling back along it during the second part of the cycle, and beneath each node a blue box holding the running gradient: 1.0 under the output, labelled as the seed d(out) by d(out), then 0.2, 0.02, 0.2, 0.2 and finally 0.4 under x, labelled the answer. Those six boxes brighten one at a time in reverse order, in step with the returning token. A panel across the foot, headed "THE BACKWARD ARITHMETIC, IN ORDER", writes the five multiplications out on one line — 1.0 times 0.2 equals 0.2, then 0.2 times 0.1 equals 0.02, then 0.02 times 10 equals 0.2, then 0.2 times 1 equals 0.2, then 0.2 times 2 equals 0.4 — followed by two closing notes: that each blue number is the derivative of the output with respect to the value at that node and that one walk computes all of them, and that the chain collapses to ln(2x + 3) whose derivative 2 over (2x + 3) at x = 1 is 2 over 5, which a central difference measures as 0.400000000. A prefers-reduced-motion block stops every animation and restores the resting state, in which both arrows are solid rather than dashed, both tokens are fully visible at the start of their runs, every node outline is at its normal width, every gradient box is at its normal fill, and all six forward values, five local derivatives, six running gradients, both band headings and every caption remain present.'
