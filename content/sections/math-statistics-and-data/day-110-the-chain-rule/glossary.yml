terms:
  - term: 'Composition'
    definition: 'Feeding the output of one function into another, written f(g(x)) and read from the inside out: g runs first on x, and f runs on whatever g returned. Composition is not commutative — at x = 2, squaring 3x + 1 gives 49 while tripling x squared and adding one gives 13.'
  - term: 'Chain rule'
    definition: 'The rule that the derivative of a composition is the product of the local rates along it: dy/dx = dy/du x du/dx, where u = g(x). The outer derivative is evaluated at the inner value u, never at x. Stated without notation: if A changes twice as fast as B and B changes three times as fast as C, then A changes six times as fast as C.'
  - term: 'Local derivative'
    definition: 'The derivative of a single operation with respect to one of its own inputs, evaluated at the value that actually arrives at that operation. For a product the local derivative with respect to one factor is the other factor; for tanh it is 1 minus tanh squared; for an addition it is 1. The chain rule multiplies local derivatives, so getting the evaluation point wrong corrupts the whole product.'
  - term: 'Computation graph'
    definition: 'A directed graph whose nodes are values and whose edges are operations, built as an expression is evaluated. Each edge carries a local derivative. The gradient of the output with respect to any node is the sum, over every path from that node to the output, of the product of the local derivatives along that path.'
  - term: 'Node'
    definition: 'One value in a computation graph, together with the record of which values it was computed from. In the engine built in this lab a node is a Value object holding a number, a gradient, a tuple of children, and a small function that hands its gradient back to those children.'
  - term: 'Path'
    definition: 'One route from a node to the output through the computation graph. A variable used more than once has more than one path, and its gradient is the sum of the path products. Reverse-mode differentiation never enumerates paths — it gets the same answer in one sweep, which is what makes it affordable on a graph where the number of paths grows exponentially with depth.'
  - term: 'Forward pass'
    definition: 'Running a computation from inputs to output, computing and storing every intermediate value. The stored values are not optional bookkeeping: the local derivatives are written in terms of them, so a backward pass cannot run without them.'
  - term: 'Backward pass'
    definition: 'Walking the computation graph from the output back towards the inputs, multiplying by each local derivative and accumulating the result at every node. After k steps the number being carried is the product of the last k local rates, which is exactly the gradient of the output with respect to the value at that point in the chain.'
  - term: 'Reverse-mode differentiation'
    definition: 'Applying the chain rule from the output backwards. One forward pass plus one backward pass yields the derivative of a single output with respect to every input at once, no matter how many inputs there are. It is what makes training practical, and it pays for that speed by keeping the forward pass values in memory.'
  - term: 'Forward-mode differentiation'
    definition: 'Applying the chain rule from the inputs forwards, carrying each value alongside its derivative with respect to one chosen input. It needs no graph and no second pass, but answers about one input per run — so a function of n inputs costs n runs. It wins in the opposite shape from reverse mode: one input, many outputs.'
  - term: 'Dual number'
    definition: 'A pair holding a value and its derivative with respect to a seeded input, with arithmetic defined so that the derivative propagates automatically — addition adds both parts, multiplication applies the product rule. Dual numbers are the whole implementation of forward mode.'
  - term: 'Automatic differentiation'
    definition: 'Computing exact derivatives by applying the chain rule to the operations a program actually performs. It is neither symbolic differentiation, which manipulates formulas and can blow up in size, nor numerical differentiation, which approximates with finite differences and carries truncation and rounding error. Automatic differentiation is exact up to float rounding and costs a small constant factor over the original computation.'
  - term: 'Backpropagation'
    definition: 'Reverse-mode automatic differentiation applied to a neural network: build the computation graph during the forward pass, seed the loss gradient with 1, and walk backwards applying the chain rule to get every parameter gradient in one sweep. It is not a separate algorithm from the chain rule — it is the chain rule with a schedule.'
  - term: 'Gradient accumulation'
    definition: 'Adding each incoming contribution to a node gradient rather than overwriting it, written += rather than = in a backward step. This one character implements the multivariable chain rule: a value used in several places receives a contribution from each use, and all of them are real. Assignment instead produces code that runs, looks reasonable and is wrong on every graph containing a reused value.'
  - term: 'Vanishing gradient'
    definition: 'A gradient that becomes too small to move a weight, because the product of many local rates below 1 collapses towards zero. Fifty factors of 0.25 — the sigmoid maximum slope — give about 7.9e-31, which changes a weight of 1 not at all. The arithmetic is correct; the answer is useless, and those are different complaints.'
  - term: 'Exploding gradient'
    definition: 'The mirror image: a product of many local rates above 1 growing without bound. Fifty factors of 1.1 give about 117 and two hundred give about 1.9e+8. Nothing raises an exception on the way; a large enough product silently becomes inf, after which one more operation turns every parameter into nan.'
  - term: 'Squared-error loss'
    definition: 'A single number measuring how wrong a prediction is, computed as (prediction minus target) squared. Its derivative with respect to the prediction is 2 times (prediction minus target), which is where every backward pass in this lesson begins. Squaring makes the loss a scalar with a well-defined minimum, and being a scalar is what lets reverse mode differentiate it against millions of parameters in one sweep.'
  - term: 'Topological order'
    definition: 'An ordering of a computation graph in which every node appears after everything it was computed from. A backward pass must visit that order in reverse, so that no node passes its gradient onwards before it has received every contribution owed to it. On a branching graph any convenient order will silently drop a path.'
  - term: 'Saturation'
    definition: 'The region where a bounded non-linearity flattens out and its local derivative approaches zero — tanh far from the origin, or the sigmoid at either extreme. Saturation is the usual explanation for vanishing gradients, but it is a claim about a particular network at particular values rather than a property of the curve: a stack of pure tanh operations pulls its own inputs back towards zero, where the slope is 1, and decays far more slowly than a constant-factor argument predicts.'
