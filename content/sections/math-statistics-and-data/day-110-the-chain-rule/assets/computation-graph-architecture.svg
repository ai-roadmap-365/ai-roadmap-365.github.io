<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"
     aria-labelledby="d110a-title d110a-desc" width="1100" height="700">
  <title id="d110a-title">A computation graph with the local derivative on every edge, and one gradient built as a sum of two path products</title>
  <desc id="d110a-desc">The expression f equals u times v, with u equals x squared and v equals 3x, drawn as a graph at x equals 2. Each edge carries its local derivative. Two paths run from x to f; each path's local rates multiply, and the two path products are added to give the gradient of f with respect to x.</desc>

  <style>
    .d110a-bg       { fill: #f8fafc; }
    .d110a-panel    { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d110a-h1       { fill: #1a202c; font-size: 27px; font-weight: 700; }
    .d110a-h2       { fill: #1d4ed8; font-size: 18px; font-weight: 700; letter-spacing: 0.6px; }
    .d110a-note     { fill: #475569; font-size: 15px; }
    .d110a-text     { fill: #1a202c; font-size: 16px; }
    .d110a-mono     { fill: #1a202c; font-size: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d110a-monosm   { fill: #475569; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d110a-node     { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d110a-leaf     { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
    .d110a-out      { fill: #c7d2fe; stroke: #1d4ed8; stroke-width: 3; }
    .d110a-nodeval  { fill: #1a202c; font-size: 22px; font-weight: 700; text-anchor: middle; }
    .d110a-nodename { fill: #1d4ed8; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .d110a-edge     { stroke: #94a3b8; stroke-width: 2.5; fill: none; }
    .d110a-patha    { stroke: #b45309; stroke-width: 5; fill: none; }
    .d110a-pathb    { stroke: #1d4ed8; stroke-width: 5; fill: none; }
    .d110a-edgelab  { fill: #1a202c; font-size: 15px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d110a-edgebox  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .d110a-abox     { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .d110a-bbox     { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
    .d110a-amber    { fill: #b45309; font-size: 16px; font-weight: 700; }
    .d110a-blue     { fill: #1d4ed8; font-size: 16px; font-weight: 700; }
    .d110a-rule     { stroke: #cbd5e1; stroke-width: 1.5; }
    .d110a-sumrule  { stroke: #1a202c; stroke-width: 2; }
  </style>

  <marker id="d110a-arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
  </marker>
  <marker id="d110a-arrow-a" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
  </marker>
  <marker id="d110a-arrow-b" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <rect class="d110a-bg" x="0" y="0" width="1100" height="700"/>

  <text class="d110a-h1" x="40" y="46">A computation graph: values forward, local derivatives on every edge</text>
  <text class="d110a-note" x="40" y="74">The expression is  f = u x v,  with  u = x squared  and  v = 3x,  evaluated at x = 2. Every number shown is exact.</text>
  <text class="d110a-note" x="40" y="96">x is used TWICE, so there are two paths from x to f. Multiply along each path; add across paths.</text>

  <!-- ================= graph panel ================= -->
  <rect class="d110a-panel" x="40" y="118" width="660" height="392" rx="8"/>
  <text class="d110a-h2" x="60" y="146">THE GRAPH</text>

  <!-- edges: drawn before the nodes so the circles sit on top -->
  <!-- path A: x -> u -> f  (amber, highlighted) -->
  <path class="d110a-patha" d="M 178 300 L 330 232" marker-end="url(#d110a-arrow-a)"/>
  <path class="d110a-patha" d="M 418 232 L 562 300" marker-end="url(#d110a-arrow-a)"/>
  <!-- path B: x -> v -> f  (blue, highlighted) -->
  <path class="d110a-pathb" d="M 178 340 L 330 408" marker-end="url(#d110a-arrow-b)"/>
  <path class="d110a-pathb" d="M 418 408 L 562 340" marker-end="url(#d110a-arrow-b)"/>

  <!-- nodes -->
  <circle class="d110a-leaf" cx="140" cy="320" r="38"/>
  <text class="d110a-nodeval" x="140" y="328">2</text>
  <text class="d110a-nodename" x="140" y="380">x</text>

  <circle class="d110a-node" cx="374" cy="212" r="38"/>
  <text class="d110a-nodeval" x="374" y="220">4</text>
  <text class="d110a-nodename" x="374" y="172">u = x squared</text>

  <circle class="d110a-node" cx="374" cy="428" r="38"/>
  <text class="d110a-nodeval" x="374" y="436">6</text>
  <text class="d110a-nodename" x="374" y="486">v = 3x</text>

  <circle class="d110a-out" cx="600" cy="320" r="38"/>
  <text class="d110a-nodeval" x="600" y="328">24</text>
  <text class="d110a-nodename" x="600" y="380">f = u x v</text>

  <!-- edge labels -->
  <rect class="d110a-abox" x="176" y="238" width="118" height="28" rx="5"/>
  <text class="d110a-edgelab" x="235" y="257">du/dx = 2x = 4</text>

  <rect class="d110a-abox" x="440" y="232" width="112" height="28" rx="5"/>
  <text class="d110a-edgelab" x="496" y="251">df/du = v = 6</text>

  <rect class="d110a-bbox" x="182" y="372" width="104" height="28" rx="5"/>
  <text class="d110a-edgelab" x="234" y="391">dv/dx = 3</text>

  <rect class="d110a-bbox" x="440" y="380" width="112" height="28" rx="5"/>
  <text class="d110a-edgelab" x="496" y="399">df/dv = u = 4</text>

  <text class="d110a-monosm" x="60" y="470">Each edge label is a LOCAL derivative: how much</text>
  <text class="d110a-monosm" x="60" y="490">the node at its head moves per unit of the node at its tail.</text>

  <!-- ================= paths panel ================= -->
  <rect class="d110a-panel" x="720" y="118" width="340" height="392" rx="8"/>
  <text class="d110a-h2" x="742" y="146">THE TWO PATHS</text>

  <rect class="d110a-abox" x="742" y="164" width="296" height="104" rx="6"/>
  <text class="d110a-amber" x="758" y="188">Path A:  x  to  u  to  f</text>
  <text class="d110a-mono" x="758" y="214">df/du x du/dx</text>
  <text class="d110a-mono" x="758" y="238">  =  6  x  4</text>
  <text class="d110a-mono" x="758" y="260">  =  24</text>

  <rect class="d110a-bbox" x="742" y="282" width="296" height="104" rx="6"/>
  <text class="d110a-blue" x="758" y="306">Path B:  x  to  v  to  f</text>
  <text class="d110a-mono" x="758" y="332">df/dv x dv/dx</text>
  <text class="d110a-mono" x="758" y="356">  =  4  x  3</text>
  <text class="d110a-mono" x="758" y="378">  =  12</text>

  <line class="d110a-sumrule" x1="742" y1="404" x2="1038" y2="404"/>
  <text class="d110a-text" x="758" y="430">Both movements are real, and</text>
  <text class="d110a-text" x="758" y="452">both happen. So they ADD:</text>
  <text class="d110a-mono" x="758" y="484" font-size="20" font-weight="700">df/dx  =  24 + 12  =  36</text>

  <!-- ================= footer band ================= -->
  <rect class="d110a-panel" x="40" y="530" width="1020" height="140" rx="8"/>
  <text class="d110a-h2" x="60" y="558">MULTIPLY ALONG EACH PATH, ADD ACROSS PATHS</text>

  <text class="d110a-mono" x="60" y="592">df       df   du       df   dv</text>
  <text class="d110a-mono" x="60" y="614">--   =   -- x --   +   -- x --          36   =   6 x 4   +   4 x 3</text>
  <text class="d110a-mono" x="60" y="636">dx       du   dx       dv   dx</text>

  <line class="d110a-rule" x1="600" y1="574" x2="600" y2="656"/>

  <text class="d110a-note" x="628" y="592">Check it without the graph: substituting gives f = 3x cubed,</text>
  <text class="d110a-note" x="628" y="614">so df/dx = 9x squared, which at x = 2 is 36. A central</text>
  <text class="d110a-note" x="628" y="636">difference measures 36.000000001. Three routes, one number.</text>

  <text class="d110a-monosm" x="60" y="690">Neither 24 nor 12 nor their product 288 matches the measurement. Only the sum does, and that is why a gradient is accumulated with += rather than assigned.</text>
</svg>
