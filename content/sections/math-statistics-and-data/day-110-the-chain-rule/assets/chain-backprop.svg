<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The chain rule through a network</title>
  <style>
    .chain-backprop-bg   { fill: #f8fafc; }
    .chain-backprop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-backprop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-backprop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-backprop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-backprop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-backprop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-backprop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chain-backprop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chain-backprop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chain-backprop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chain-backprop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chain-backprop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chain-backprop-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chain-backprop-stage { opacity: 1; }

    .chain-backprop-s0 { animation-delay: 0.00s; }
    .chain-backprop-e0 { animation-delay: 0.00s; }
    .chain-backprop-s1 { animation-delay: 1.28s; }
    .chain-backprop-e1 { animation-delay: 1.28s; }
    .chain-backprop-s2 { animation-delay: 2.56s; }
    .chain-backprop-e2 { animation-delay: 2.56s; }
    .chain-backprop-s3 { animation-delay: 3.84s; }
    .chain-backprop-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chain-backprop-conn  { animation: chain-backprop-trace 6.4s ease-in-out infinite; }
      .chain-backprop-stage { animation: chain-backprop-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chain-backprop-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chain-backprop-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chain-backprop-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chain-backprop-stage { animation: chain-backprop-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chain-backprop-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chain-backprop-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chain-backprop-bg" width="980" height="322"/>
  <text class="chain-backprop-h1"  x="30" y="40">The chain rule through a network</text>
  <text class="chain-backprop-sub" x="30" y="64">Four steps.</text>
  <g class="chain-backprop-stage chain-backprop-s0">
    <rect class="chain-backprop-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chain-backprop-step" x="44" y="142">01</text>
    <text class="chain-backprop-name" x="70" y="142">Start with the rate of change of the loss</text>
    <text class="chain-backprop-desc" x="44" y="166">With respect to the output.</text>
  </g>
  <line class="chain-backprop-line chain-backprop-conn chain-backprop-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chain-backprop-tip)"/>
  <g class="chain-backprop-stage chain-backprop-s1">
    <rect class="chain-backprop-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chain-backprop-step" x="280" y="142">02</text>
    <text class="chain-backprop-name" x="306" y="142">Multiply by the last layer's local rate</text>
    <text class="chain-backprop-desc" x="280" y="166">Giving the rate at its input.</text>
  </g>
  <line class="chain-backprop-line chain-backprop-conn chain-backprop-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chain-backprop-tip)"/>
  <g class="chain-backprop-stage chain-backprop-s2">
    <rect class="chain-backprop-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chain-backprop-step" x="516" y="142">03</text>
    <text class="chain-backprop-name" x="542" y="142">Pass that backwards, layer by layer</text>
    <text class="chain-backprop-desc" x="516" y="166">Multiplying at each step.</text>
  </g>
  <line class="chain-backprop-line chain-backprop-conn chain-backprop-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chain-backprop-tip)"/>
  <g class="chain-backprop-stage chain-backprop-s3">
    <rect class="chain-backprop-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chain-backprop-step" x="752" y="142">04</text>
    <text class="chain-backprop-name" x="778" y="142">And read off each parameter's gradient as you go</text>
    <text class="chain-backprop-desc" x="752" y="166">Which is backpropagation.</text>
  </g>
  <text class="chain-backprop-sub" x="30" y="304">Backpropagation is not a separate algorithm so much as the chain rule applied systematically, with intermediate results reused rather than recomputed.</text>
</svg>
