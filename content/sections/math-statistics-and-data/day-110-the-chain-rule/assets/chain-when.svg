<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it does not.">
  <title>Where the chain rule matters</title>
  <style>
    .chain-when-bg   { fill: #f8fafc; }
    .chain-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chain-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chain-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chain-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chain-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chain-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-when-row { opacity: 1; }
    .chain-when-r0 { animation-delay: 0.00s; }
    .chain-when-r1 { animation-delay: 0.45s; }
    .chain-when-r2 { animation-delay: 0.90s; }
    .chain-when-r3 { animation-delay: 1.35s; }
    .chain-when-r4 { animation-delay: 1.80s; }
    .chain-when-row { animation: chain-when-reveal 7.3s ease-in-out infinite; }
    @keyframes chain-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chain-when-bg" width="980" height="390"/>
  <text class="chain-when-h1"  x="30" y="40">Where the chain rule matters</text>
  <text class="chain-when-sub" x="30" y="64">And where it does not.</text>
  <rect class="chain-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chain-when-name" x="46" y="122">It matters</text>
  <text class="chain-when-desc" x="46" y="142">Four cases.</text>
  <text class="chain-when-desc chain-when-row chain-when-r0" x="46" y="182">Training any composed model</text>
  <text class="chain-when-desc chain-when-row chain-when-r1" x="46" y="216">Reasoning about depth</text>
  <text class="chain-when-desc chain-when-row chain-when-r2" x="46" y="250">Diagnosing vanishing gradients</text>
  <text class="chain-when-desc chain-when-row chain-when-r3" x="46" y="284">Any nested transformation</text>
  <text class="chain-when-desc chain-when-row chain-when-r4" x="46" y="318">Sensitivity through a pipeline</text>
  <rect class="chain-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chain-when-name" x="526" y="122">Not directly</text>
  <text class="chain-when-desc" x="526" y="142">Also four.</text>
  <text class="chain-when-desc chain-when-row chain-when-r0" x="526" y="182">Single-layer linear models</text>
  <text class="chain-when-desc chain-when-row chain-when-r1" x="526" y="216">Discrete decision procedures</text>
  <text class="chain-when-desc chain-when-row chain-when-r2" x="526" y="250">Non-differentiable steps</text>
  <text class="chain-when-desc chain-when-row chain-when-r3" x="526" y="284">Closed-form solutions</text>
  <text class="chain-when-desc chain-when-row chain-when-r4" x="526" y="318">Where no composition is involved</text>
  <text class="chain-when-sub" x="30" y="372">Sensitivity through a pipeline is the underused application: the same multiplication of local rates tells you how an upstream error propagates to a final number.</text>
</svg>
