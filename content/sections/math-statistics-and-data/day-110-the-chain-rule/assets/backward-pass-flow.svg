<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img"
     aria-labelledby="d110f-title d110f-desc" width="1200" height="760">
  <title id="d110f-title">The forward pass computing values left to right, then the backward pass carrying the gradient right to left by multiplying by each local derivative</title>
  <desc id="d110f-desc">A five-stage chain evaluated at x equals 1. The forward pass produces 1, 2, 5, 25, 5 and ln 5. The backward pass starts at 1 and multiplies by each stage's local derivative in reverse order, giving 0.2, 0.02, 0.2, 0.2 and finally 0.4, which is the derivative of the whole chain.</desc>

  <style>
    .d110f-bg      { fill: #f8fafc; }
    .d110f-panel   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d110f-h1      { fill: #1a202c; font-size: 27px; font-weight: 700; }
    .d110f-h2      { fill: #1d4ed8; font-size: 17px; font-weight: 700; letter-spacing: 0.6px; }
    .d110f-fwdlab  { fill: #b45309; font-size: 17px; font-weight: 700; letter-spacing: 0.6px; }
    .d110f-note    { fill: #475569; font-size: 15px; }
    .d110f-text    { fill: #1a202c; font-size: 16px; }
    .d110f-mono    { fill: #1a202c; font-size: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d110f-monosm  { fill: #475569; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d110f-node    { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d110f-nodeend { fill: #c7d2fe; stroke: #1d4ed8; stroke-width: 3; }
    .d110f-val     { fill: #1a202c; font-size: 20px; font-weight: 700; text-anchor: middle; }
    .d110f-stage   { fill: #b45309; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .d110f-rate    { fill: #1a202c; font-size: 15px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d110f-grad    { fill: #1d4ed8; font-size: 17px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d110f-ratebox { fill: #fef3c7; stroke: #b45309; stroke-width: 1.2; }
    .d110f-gradbox { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.2; }
    .d110f-rule    { stroke: #cbd5e1; stroke-width: 1.5; }

    /* forward wire: marching dashes, left to right */
    .d110f-fwire {
      stroke: #b45309; stroke-width: 3; fill: none;
      stroke-dasharray: 10 7;
      animation: d110f-marchf 1.6s linear infinite;
    }
    @keyframes d110f-marchf { to { stroke-dashoffset: -17; } }

    /* backward wire: marching dashes, right to left */
    .d110f-bwire {
      stroke: #1d4ed8; stroke-width: 3; fill: none;
      stroke-dasharray: 10 7;
      animation: d110f-marchb 1.6s linear infinite;
    }
    @keyframes d110f-marchb { to { stroke-dashoffset: 17; } }

    /* the forward token travels the top wire in the first half of the cycle */
    .d110f-ftoken {
      fill: #b45309;
      animation: d110f-slidef 12s ease-in-out infinite;
    }
    @keyframes d110f-slidef {
      0%           { transform: translateX(0);     opacity: 1; }
      40%          { transform: translateX(1000px); opacity: 1; }
      48%          { transform: translateX(1000px); opacity: 0.25; }
      100%         { transform: translateX(0);     opacity: 0.25; }
    }

    /* the backward token travels the bottom wire in the second half */
    .d110f-btoken {
      fill: #1d4ed8;
      animation: d110f-slideb 12s ease-in-out infinite;
    }
    @keyframes d110f-slideb {
      0%, 48%      { transform: translateX(0);      opacity: 0.25; }
      52%          { transform: translateX(0);      opacity: 1; }
      92%, 100%    { transform: translateX(-1000px); opacity: 1; }
    }

    /* nodes light up in forward order, then in reverse order */
    .d110f-node, .d110f-nodeend { animation: d110f-lift 12s ease-in-out infinite; }
    .d110f-n0 { animation-delay: 0s; }
    .d110f-n1 { animation-delay: 0.9s; }
    .d110f-n2 { animation-delay: 1.8s; }
    .d110f-n3 { animation-delay: 2.7s; }
    .d110f-n4 { animation-delay: 3.6s; }
    .d110f-n5 { animation-delay: 4.5s; }
    @keyframes d110f-lift {
      0%, 10%, 100% { stroke-width: 2; }
      3%, 7%        { stroke-width: 6; }
    }

    /* the running gradient boxes brighten in reverse order */
    .d110f-gradbox { animation: d110f-glow 12s ease-in-out infinite; }
    .d110f-g4 { animation-delay: 6.2s; }
    .d110f-g3 { animation-delay: 7.1s; }
    .d110f-g2 { animation-delay: 8.0s; }
    .d110f-g1 { animation-delay: 8.9s; }
    .d110f-g0 { animation-delay: 9.8s; }
    @keyframes d110f-glow {
      0%, 6%, 100% { fill: #dbeafe; }
      2%, 4%       { fill: #93c5fd; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d110f-fwire, .d110f-bwire {
        animation: none; stroke-dasharray: none;
      }
      .d110f-ftoken { animation: none; transform: none; opacity: 1; }
      .d110f-btoken { animation: none; transform: none; opacity: 1; }
      .d110f-node, .d110f-nodeend { animation: none; stroke-width: 2; }
      .d110f-gradbox { animation: none; fill: #dbeafe; }
    }
  </style>

  <marker id="d110f-farrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
  </marker>
  <marker id="d110f-barrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <rect class="d110f-bg" x="0" y="0" width="1200" height="760"/>

  <text class="d110f-h1" x="40" y="46">One forward pass, then one backward pass. Every number is real.</text>
  <text class="d110f-note" x="40" y="74">Five stages applied to x = 1: double, add three, square, square root, natural logarithm. The whole chain collapses to ln(2x + 3).</text>
  <text class="d110f-note" x="40" y="96">Forward: compute and keep each value. Backward: start at 1 and multiply by each stage's local derivative, in reverse.</text>

  <!-- ============ forward band ============ -->
  <text class="d110f-fwdlab" x="40" y="146">FORWARD PASS  —  left to right, computing and storing values</text>

  <!-- forward wire -->
  <path class="d110f-fwire" d="M 100 186 L 1090 186" marker-end="url(#d110f-farrow)"/>
  <circle class="d110f-ftoken" cx="100" cy="186" r="9"/>

  <!-- stage names, above each arrow segment -->
  <text class="d110f-stage" x="200" y="172">double</text>
  <text class="d110f-stage" x="400" y="172">add three</text>
  <text class="d110f-stage" x="600" y="172">square</text>
  <text class="d110f-stage" x="800" y="172">square root</text>
  <text class="d110f-stage" x="1000" y="172">logarithm</text>

  <!-- ============ nodes ============ -->
  <circle class="d110f-nodeend d110f-n0" cx="100" cy="260" r="40"/>
  <text class="d110f-val" x="100" y="268">1</text>
  <text class="d110f-monosm" x="82" y="322">x</text>

  <circle class="d110f-node d110f-n1" cx="300" cy="260" r="40"/>
  <text class="d110f-val" x="300" y="268">2</text>

  <circle class="d110f-node d110f-n2" cx="500" cy="260" r="40"/>
  <text class="d110f-val" x="500" y="268">5</text>

  <circle class="d110f-node d110f-n3" cx="700" cy="260" r="40"/>
  <text class="d110f-val" x="700" y="268">25</text>

  <circle class="d110f-node d110f-n4" cx="900" cy="260" r="40"/>
  <text class="d110f-val" x="900" y="268">5</text>

  <circle class="d110f-nodeend d110f-n5" cx="1100" cy="260" r="40"/>
  <text class="d110f-val" x="1100" y="264">1.609</text>
  <text class="d110f-monosm" x="1072" y="322">output</text>

  <!-- ============ local derivative row ============ -->
  <text class="d110f-h2" x="40" y="368">LOCAL DERIVATIVE OF EACH STAGE, at the value arriving at it</text>

  <rect class="d110f-ratebox" x="150" y="384" width="100" height="30" rx="5"/>
  <text class="d110f-rate" x="200" y="404">2</text>

  <rect class="d110f-ratebox" x="350" y="384" width="100" height="30" rx="5"/>
  <text class="d110f-rate" x="400" y="404">1</text>

  <rect class="d110f-ratebox" x="550" y="384" width="100" height="30" rx="5"/>
  <text class="d110f-rate" x="600" y="404">2u = 10</text>

  <rect class="d110f-ratebox" x="750" y="384" width="100" height="30" rx="5"/>
  <text class="d110f-rate" x="800" y="404">0.1</text>

  <rect class="d110f-ratebox" x="950" y="384" width="100" height="30" rx="5"/>
  <text class="d110f-rate" x="1000" y="404">1/u = 0.2</text>

  <!-- ============ backward band ============ -->
  <text class="d110f-h2" x="40" y="462">BACKWARD PASS  —  right to left, multiplying by each local derivative</text>

  <path class="d110f-bwire" d="M 1100 500 L 110 500" marker-end="url(#d110f-barrow)"/>
  <circle class="d110f-btoken" cx="1100" cy="500" r="9"/>

  <!-- running gradient at each node -->
  <rect class="d110f-gradbox d110f-g0" x="46" y="524" width="108" height="34" rx="5"/>
  <text class="d110f-grad" x="100" y="548">0.4</text>

  <rect class="d110f-gradbox d110f-g1" x="246" y="524" width="108" height="34" rx="5"/>
  <text class="d110f-grad" x="300" y="548">0.2</text>

  <rect class="d110f-gradbox d110f-g2" x="446" y="524" width="108" height="34" rx="5"/>
  <text class="d110f-grad" x="500" y="548">0.2</text>

  <rect class="d110f-gradbox d110f-g3" x="646" y="524" width="108" height="34" rx="5"/>
  <text class="d110f-grad" x="700" y="548">0.02</text>

  <rect class="d110f-gradbox d110f-g4" x="846" y="524" width="108" height="34" rx="5"/>
  <text class="d110f-grad" x="900" y="548">0.2</text>

  <rect class="d110f-gradbox" x="1046" y="524" width="108" height="34" rx="5"/>
  <text class="d110f-grad" x="1100" y="548">1.0</text>

  <text class="d110f-monosm" x="1046" y="580">seed: d(out)/d(out)</text>
  <text class="d110f-monosm" x="46" y="580">the answer</text>

  <!-- ============ arithmetic band ============ -->
  <rect class="d110f-panel" x="40" y="604" width="1120" height="132" rx="8"/>
  <text class="d110f-h2" x="60" y="632">THE BACKWARD ARITHMETIC, IN ORDER</text>

  <text class="d110f-mono" x="60" y="662">1.0 x 0.2 = 0.2      0.2 x 0.1 = 0.02      0.02 x 10 = 0.2      0.2 x 1 = 0.2      0.2 x 2 = 0.4</text>

  <line class="d110f-rule" x1="60" y1="678" x2="1140" y2="678"/>

  <text class="d110f-note" x="60" y="702">Each blue number is the derivative of the OUTPUT with respect to the value at that node. One walk computes all of them.</text>
  <text class="d110f-note" x="60" y="724">Check: the chain collapses to ln(2x + 3), whose derivative 2/(2x + 3) at x = 1 is 2/5 = 0.4. A central difference measures 0.400000000.</text>
</svg>
