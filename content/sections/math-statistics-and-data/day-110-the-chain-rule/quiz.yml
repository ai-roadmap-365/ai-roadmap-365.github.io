questions:
  - question: 'Gear A turns twice for every turn of gear B, and gear B turns three times for every turn of gear C. How many times does A turn per turn of C, and what does that have to do with calculus?'
    options:
      - 'Five, because the rates add — and the chain rule likewise adds derivatives along a chain'
      - 'Six, because the rates multiply — and that is the chain rule, with the notation removed'
      - 'Two thirds, because the rates divide — and the chain rule is a quotient of derivatives'
      - 'It cannot be determined without knowing the tooth counts, and the chain rule likewise needs the underlying functions'
    answer_index: 1
    explanation: 'Turn C once and B turns three times; each of those three turns spins A twice; so A turns six times. The rates multiplied, and nothing about that reasoning required calculus — "per" stacks by multiplying. That is exactly the chain rule: dA/dC = dA/dB x dB/dC = 2 x 3 = 6. Option 3 is the closest to a real objection and is still wrong: the ratios ARE the tooth counts, already expressed as rates, which is all the rule needs. The one thing calculus adds is that a derivative, unlike a gear ratio, can depend on where you are — which is why every local rate has to be evaluated at the value that actually arrives at its stage.'

  - question: 'For y = (3x + 1)² at x = 2, a reader computes 2 x 2 x 3 = 12. The correct answer is 42. What went wrong?'
    options:
      - 'The outer derivative was evaluated at x rather than at u = 3x + 1, which is 7 there'
      - 'The inner derivative was omitted, and 12 is what you get from the outer rate alone'
      - 'The power rule does not apply to a composition, so a different rule was needed'
      - 'The two derivatives should have been added rather than multiplied'
    answer_index: 0
    explanation: 'The outer function is f(u) = u², whose derivative is 2u — and the u it must be evaluated at is the value that arrives from the inner function, which is 3(2) + 1 = 7. So the correct product is 2 x 7 x 3 = 42, while evaluating 2u at x = 2 gives 2 x 2 x 3 = 12. This is the single most durable mistake in the topic, because the wrong answer still has the right shape: it is a product of two plausible numbers, and nothing about it looks like an error. The lab asserts the mistake as a mistake — a test checks that 12 and 42 differ — so that no future edit can quietly make the wrong route correct. Option 1 describes a different error that happens to be arithmetically close here and would give 14, not 12.'

  - question: 'A variable x reaches an output f through two separate routes: once via u = x², once via v = 3x, with f = u x v. At x = 2 the path products are 24 and 12. What is df/dx?'
    options:
      - '24, because the path through u carries the larger contribution and dominates'
      - '288, because the two paths compose and their contributions multiply'
      - '36, because both movements are real and both happen, so the contributions add'
      - '18, the average of the two paths, since x cannot move through both at once'
    answer_index: 2
    explanation: 'Substituting the intermediates gives f = x² x 3x = 3x³, so df/dx = 9x², which at x = 2 is 36 — and a central difference, which has no opinion about rules, measures 36.000000001. The lab puts all four candidates to that measurement and only the sum survives. The reasoning behind the sum is worth more than the check: nudging x moves the output through u AND through v, both movements genuinely occur, and adding them is precisely what "both happen" means. There is no rule of nature selecting one path as the real one, and nothing about the situation composes the paths, so options 0 and 1 have no mechanism behind them. Option 3 is the most seductive because it feels like conservation — but x does move through both routes at once, and averaging would understate the true rate by half. This is also why an autodiff engine accumulates gradients with += rather than assigning them: assignment is exactly the bug of letting the last path overwrite the others.'

  - question: 'A five-stage chain has local rates 2, 1, 10, 0.1 and 0.2, evaluated at x = 1. During a backward pass, what is the number being carried after the walk has passed the last two stages?'
    options:
      - '0.4, the derivative of the whole chain, since the walk always carries the final answer'
      - '0.3, the sum of the last two local rates'
      - '0.02, the product of the last two local rates'
      - '0.1, the smaller of the two rates, since the chain is limited by its weakest stage'
    answer_index: 2
    explanation: 'After k steps from the output end, the backward pass is carrying the product of the last k local rates — here 0.2 x 0.1 = 0.02. That number is not an intermediate curiosity: it is the gradient of the output with respect to the value arriving at that stage, computed for free on the way past. Continue the walk and it becomes 0.02 x 10 = 0.2, then 0.2 x 1 = 0.2, then 0.2 x 2 = 0.4, which is the derivative of the whole chain — confirmed independently by collapsing the five stages to ln(2x + 3), whose derivative 2/(2x + 3) at x = 1 is 2/5. Option 0 describes only the final step. Option 3 invokes a bottleneck intuition that does not apply — a product is not governed by its smallest factor, as the 10 in the middle of this chain demonstrates by pulling the running value back up.'

  - question: 'Why does reverse-mode differentiation win when a model has many parameters and a single scalar loss?'
    options:
      - 'It is more numerically accurate than forward mode, which accumulates rounding error over the chain'
      - 'It needs one forward-and-backward sweep to obtain every input gradient, while forward mode needs one complete run per input'
      - 'It avoids storing intermediate values, so it uses far less memory on a deep network'
      - 'It computes an approximate gradient, which is cheaper and good enough for training'
    answer_index: 1
    explanation: 'Both modes apply the same chain rule and both are exact up to float rounding; they differ only in which end they start from, and that decides the cost. Forward mode carries derivatives with respect to ONE seeded input, so a function of n inputs takes n runs — the lab measures 1, 25 and 50 passes for reverse mode, forward mode and central differences on a 25-input function, and all three produce the same gradients. Scale that to a hundred million parameters and one loss and the ratio is a hundred million to one; that asymmetry is the entire economic basis of modern training. Option 0 is false — the lab asserts the two modes agree to the last bits. Option 3 is false and matters: reverse mode is exact, unlike the finite differences used to check it. Option 2 inverts the truth, and the inversion is the honest caveat: reverse mode must keep every forward value alive until the backward pass consumes it, because the local derivatives are written in terms of those values. Forward mode is the one that stores almost nothing. Speed is bought with memory, which is why activation memory dominates on large models.'

  - question: 'In an autodiff engine, a developer writes `self.grad = out.grad` instead of `self.grad += out.grad` in every backward step. What happens?'
    options:
      - 'Every gradient becomes zero, because the seed is overwritten before it propagates'
      - 'The engine raises an error the first time a value is reused, since a gradient would be written twice'
      - 'The engine runs, returns plausible numbers, and is wrong on any graph where a value is used more than once'
      - 'Nothing changes, since each node receives its gradient exactly once in a correct topological order'
    answer_index: 2
    explanation: 'It runs. Nothing raises and nothing warns. On a straight chain with no reuse it is correct every time, which is why the bug survives casual testing. It breaks the moment a value feeds more than one operation: the second contribution overwrites the first instead of adding to it, and the node ends up reporting one path where it owed the sum of several. With x = 3 and y = x + x, the correct gradient is 2 and the assigning version gives 1 — a number that is the right type, the right shape and the right order of magnitude. This is the chain rule sum-over-paths fact compressed into one character, and it is the model case for the most expensive class of numerical bug: correct types, plausible magnitudes, wrong answers, no signal. Option 3 misunderstands what topological order guarantees — it fixes the ORDER of arrival so that nothing propagates early, but it cannot make several arrivals into one.'

  - question: 'A chain of 50 factors, each 0.9, gives about 5.15e-3, and 50 factors of 1.1 give about 117. A reader concludes that stacking 40 tanh layers, whose slope at the input is about 0.487, will give a gradient near 0.487⁴⁰ = 3.1e-13. Measurement gives 8.4e-3. Why?'
    options:
      - 'Floating-point rounding accumulates over 40 multiplications and inflates the result'
      - 'The local rates are not constant: each tanh pulls its input towards zero, where tanh has slope 1, so the rates climb back towards 1 as the stack deepens'
      - 'The measurement is wrong, because a central difference is unreliable at this magnitude'
      - 'tanh is not differentiable everywhere, so the chain rule does not strictly apply to a deep stack'
    answer_index: 1
    explanation: 'The prediction is out by ten orders of magnitude, and the cause is a modelling error rather than an arithmetic one. A product of CONSTANTS decays exponentially, and the lab asserts exactly that for a fixed factor of 0.487, which does fall below 1e-12 in forty steps. But a local rate depends on where it is evaluated, and the forward pass moves that point: each tanh maps its input closer to zero, tanh has slope 1 at zero, so successive local rates creep back towards 1 and the product decays like a power of the depth instead. The measured ratio settles near 2.8 per doubling of depth rather than growing. This is why the lab asserts the shape — a monotonic fall and a gap of more than nine orders against the prediction — rather than the value, and why "tanh saturates, therefore gradients vanish" is a claim that has to be measured on the network in front of you. Option 0 is the wrong scale entirely; rounding over 40 operations moves the last digits, not the exponent.'

  - question: 'The lab compares a hand-worked gradient against its autodiff engine with `==`, but compares both against a central difference with a tolerance of 1e-6. Why the different standards?'
    options:
      - 'The engine is trusted more than the hand computation, so it is held to a stricter standard'
      - 'Exact comparison is only valid for integers, and the numerical gradient happens to be fractional'
      - 'A tolerance of 1e-6 would be too slow to evaluate at exact precision, so it is used only where speed matters'
      - 'The first pair performs the same multiplications on the same exact values, while a central difference is an approximation with truncation and rounding error of its own'
    answer_index: 3
    explanation: 'These are two different kinds of comparison and using one tolerance for both would misrepresent one of them. The hand computation and the engine multiply the same exact float64 quantities in the same order, so they agree bit for bit — and the network in this lab was deliberately built so every quantity is exact, which is what the bias of half the natural logarithm of 3 buys: tanh returns exactly 0.5 there and 1 minus tanh squared is exactly 0.75. Anything looser than equality would be hiding a bug. A central difference, by contrast, carries truncation error of about (h²/6)|f‴| and rounding error of about EPSILON|f|/h; at h = 1e-5 that bound is roughly 9.7e-9 here, so 1e-6 is a justified tolerance with about a hundredfold margin, and the measured worst gap was 4.5e-9. Tightening it to 1e-12 would fail on correct code for reasons that have nothing to do with the chain rule; loosening the analytic comparison to 1e-6 would pass code that had dropped an entire path.'
