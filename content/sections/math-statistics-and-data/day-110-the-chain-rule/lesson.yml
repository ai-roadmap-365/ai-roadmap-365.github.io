week: 16
learning_promise: 'After this lesson you will know why backpropagation works, and you will know it because you will have written it. The chain rule is the hinge of the whole calculus arc: Day 108 gave you a rate of change, Day 109 gave you a gradient, and today those rates get connected end to end so that Day 111 can walk downhill. The idea needs no calculus to feel. If gear A turns twice for every turn of gear B, and B turns three times for every turn of C, then A turns six times per turn of C — the rates multiplied, and that is the whole rule. You will meet composition with numbers before any derivative appears, then the chain rule stated and immediately verified against Day 108''s central difference on six functions, then the dy/du times du/dx notation with an honest account of why the cancelling reading is a useful mnemonic and not a proof. You will work chains of two, three and five functions and watch the product grow without the shape changing, which is why depth is cheap. Then the part to slow down for: when a variable reaches the output by more than one route, the contributions ADD. You will see four candidate answers put to a measurement and only the sum survive, and you will learn that this single fact is what a += in an autodiff engine implements. You will meet the computation graph as the picture that makes all of this obvious, and forward versus reverse mode explained by cost rather than mechanics — reverse mode gets every input derivative from one backward pass, which is why training a model with a hundred million parameters and one loss is affordable at all. You will backpropagate a two-layer network entirely by hand, with numbers chosen so every value is exact in float64 and you can check the lot with a pen. And in the lab you will build a working reverse-mode autodiff engine in about seventy lines — the core of PyTorch''s autograd, with the engineering removed — and check every gradient it produces against a numerical derivative that knows nothing about your graph. You will also measure two things that contradict the obvious answer: 0.5 to the fiftieth power does not vanish when added to 1, and a stack of forty tanh layers decays ten orders of magnitude more slowly than the standard vanishing-gradient argument predicts.'
objectives:
  - 'State the chain rule as a sentence about rates rather than as a formula, and explain the gear train that makes it obvious before any notation arrives'
  - 'Compose two functions, evaluate the composition by hand, and say which of the two runs first and why the order matters'
  - 'Apply the one-variable chain rule correctly, and explain why the outer derivative must be evaluated at the inner value rather than at x'
  - 'Verify a chain-rule result against a central difference, and say why that check is genuinely independent rather than circular'
  - 'Read the notation dy/dx = dy/du times du/dx, use the cancelling reading as a mnemonic, and state precisely why it is not a proof and where it stops working'
  - 'Differentiate a chain of any depth by multiplying its local rates, each evaluated at the value that arrives at its own stage'
  - 'Describe what a backward pass is carrying at each step, and recognise it as a running partial product'
  - 'State the multivariable chain rule as a sum over paths, and explain why contributions add rather than multiply, compete or average'
  - 'Read a computation graph, identify every path from an input to the output, and compute a gradient as a sum of path products'
  - 'Explain why an autodiff engine accumulates gradients with += rather than assigning them, and describe the class of silent bug that assignment produces'
  - 'Distinguish forward-mode from reverse-mode differentiation by cost, and say which shape of problem each one suits'
  - 'Explain why reverse mode wins when there are many parameters and one loss, and what it pays for that speed in memory'
  - 'Backpropagate a small two-layer network by hand and check every gradient against both an engine and a numerical derivative'
  - 'Explain backpropagation as the chain rule applied to a computation graph in reverse, with nothing more exotic involved'
  - 'Demonstrate vanishing and exploding products, and state the result as an order of magnitude rather than as a value'
  - 'Explain why a product of constants is the wrong model for a product of rates that depend on where they are evaluated, and why the saturation argument for vanishing gradients has to be measured rather than assumed'
  - 'Choose an appropriate tolerance for a float comparison, and justify why an analytic-against-numerical check needs a looser one than an analytic-against-analytic check'
prerequisites:
  - 'Day 108 — derivatives, the central difference, and the U-shaped error curve. The step size used throughout today, h = 1e-5, sits inside the band Day 108 measured'
  - 'Day 109 — partial derivatives and the gradient. Today''s sum over paths is what happens when those partial derivatives are chained together'
  - 'Day 70 — floating point. The vanishing-gradient section is a direct consequence of it, and one of the day''s two surprises is pure IEEE-754'
  - 'Day 102 — linear transformations, where a non-linearity first appeared as the thing that stops a stack of layers collapsing into one'
  - 'Day 43 — python3 -m venv and installing a package with pip; the lab installs numpy and pytest into a lab-local environment'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'Comfort writing a small Python class with __init__ and one dunder method; the lab is the first time the course asks for operator overloads, and it writes the first one out in full'
  - 'No calculus beyond Days 108 and 109. Nothing is assumed and nothing is skipped over'
