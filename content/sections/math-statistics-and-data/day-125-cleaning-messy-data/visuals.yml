visuals:
  - id: cleaning-decisions-architecture
    file: assets/cleaning-decisions-architecture.svg
    type: diagram
    title: 'Cleaning is a sequence of forks, each with a cost written on it'
    alt: 'Diagram: a messy DataFrame entering from the left, then flowing through four decision-fork stages arranged left to right — drop-or-fill, coerce-or-reject, normalise-or-keep, remove-or-keep-the-outlier — each fork drawn as a labelled branch point with the cost of each branch written directly on it (drop: honest if few rows, disastrous if missingness is informative; fill: invents a value and changes downstream statistics; coerce: silently manufactures missing values from unparseable strings; reject: loses the whole column; normalise: merges categories that may not truly be identical; keep raw: leaves a groupby silently split; remove outlier: teaches a model a world without extremes; keep outlier: lets one point dominate a mean or a fitted line), with a cleaned DataFrame emerging on the right'
    description: >-
      A static architecture diagram, read left to right, of a messy DataFrame passing through four
      sequential decision-fork stages before emerging cleaned. Stage 1 ("drop or fill") shows a branch
      point with two labelled paths: drop, annotated "honest if few rows, disastrous if missingness is
      informative," and fill, annotated "invents a value and changes downstream statistics." Stage 2
      ("coerce or reject") shows coerce, annotated "silently manufactures missing values from unparseable
      strings," against reject, annotated "loses the whole column." Stage 3 ("normalise or keep") shows
      normalise, annotated "merges categories that may not truly be identical," against keep raw,
      annotated "leaves a groupby silently split." Stage 4 ("remove or keep the outlier") shows remove,
      annotated "teaches a model a world without extremes," against keep, annotated "lets one point
      dominate a mean or a fitted line." A messy DataFrame icon (visibly containing gaps, a stray garbage
      string, and an extreme value) enters at the far left; a cleaned DataFrame icon exits at the far
      right. A caption band beneath the diagram states that every fork has a real cost on both branches,
      and that the diagram is a map of costs, not a set of correct answers.
  - id: imputation-flow
    file: assets/imputation-flow.svg
    type: flow-animated
    title: 'Every imputed value lands on the one line that cannot move'
    alt: "Diagram: a histogram of a numeric column with a visible gap at the centre where values are missing; as the animation runs, small tokens representing the missing values travel toward the centre bin and arrive there one by one, the centre bin growing taller with each arrival into a spike that was not present in the original distribution; beneath the histogram a horizontal line displays the column's mean as a fixed marker that does not move throughout the animation, with a caption stating that every imputed value lands exactly on this unmoving line, which is why checking the mean after imputation proves nothing about what changed"
    description: >-
      An animated flow diagram, fully readable as a still image, of a numeric column's histogram before
      and during mean imputation. The histogram shows several bars of varying height across the value
      range, with a visibly shorter centre bin representing where missing values belong. Several small
      round tokens, each representing one missing value, sit to the side at the start of the animation.
      Over the animation's cycle, the tokens travel one at a time toward the centre bin along a short
      path, and each arrival increases that bin's height, so the centre bin visibly grows into a spike
      taller than any bin around it by the end of the cycle -- a spike that was not present in the
      original distribution. Beneath the histogram, a horizontal reference line marks the column's mean
      with a small labelled marker; this marker's position never moves at any point in the animation,
      even as the histogram above it visibly changes shape. A caption band beneath states plainly that
      every imputed value lands exactly on this unmoving line, which is why checking the mean after
      imputation proves nothing about what changed. A prefers-reduced-motion block stops every token's
      travel animation and the bin's growth animation, leaving the tokens at their resting positions
      beside the histogram, the centre bin already shown at its final, tallest height, and the mean
      marker in its single unchanging position, so every fact in the diagram is visible without motion.
