terms:
  - term: mean imputation
    definition: >-
      Replacing a column's missing values with that column's own mean, computed over the non-missing
      values. Leaves the column's mean exactly unchanged by construction, while strictly shrinking its
      standard deviation and strictly attenuating (never inflating) its correlation with any untouched
      column -- because an imputed value's deviation from the mean is exactly zero.
  - term: attenuation (of correlation)
    definition: >-
      The systematic shrinkage, toward zero, of a correlation between an imputed column and an untouched
      column. Follows directly from the Pearson correlation formula: a term with a zero deviation on one
      axis contributes zero to the covariance sum regardless of the other axis's value, so it can only
      dilute an existing relationship, never strengthen one.
  - term: missing completely at random (MCAR)
    definition: >-
      A missingness mechanism in which the probability a value is missing does not depend on any
      observed or unobserved value in the dataset -- the closest thing to "pure accident." The easiest
      case to handle honestly, and the least common in real data.
  - term: missing at random (MAR)
    definition: >-
      A missingness mechanism in which the probability a value is missing depends on OTHER observed
      columns, but not on the missing value itself once those other columns are accounted for. Imputation
      that uses the related observed columns (rather than a single unconditional mean) can partially
      correct for MAR missingness.
  - term: missing not at random (MNAR)
    definition: >-
      A missingness mechanism in which the probability a value is missing depends on the value itself --
      a sensor that fails specifically at extreme readings, or an income field left blank specifically by
      the highest earners. No imputation strategy repairs MNAR missingness, because the information needed
      to correct it was never recorded, and more data does not help (Day 117).
  - term: dropna
    definition: >-
      The pandas method that removes rows or columns containing missing values, controlled by how
      (any/all), thresh (a minimum count of non-null values required to survive) and subset (which
      columns to check). Honest when the affected rows are few and the missingness is uninformative;
      disastrous when missingness itself carries information, because dropping silently discards it.
  - term: fillna
    definition: >-
      The pandas method that replaces missing values with a supplied constant, a forward/backward fill,
      or an interpolated value. Every choice of fill value is a claim about what the missing data would
      have been, and that claim should be stated, not assumed.
  - term: ffill / bfill
    definition: >-
      Forward-fill and backward-fill: carry the nearest earlier (ffill) or later (bfill) non-missing
      value forward or backward to fill a gap. Correct only when the DataFrame's row order is the order
      that matters (typically chronological); run on unsorted data, ffill carries a value across rows
      that were never actually adjacent, producing a wrong answer with no error raised.
  - term: interpolate
    definition: >-
      A pandas method that fills missing values by estimating them from surrounding non-missing values
      along a specified method (linear by default), rather than copying a single neighbouring value the
      way ffill/bfill do.
  - term: missing indicator
    definition: >-
      A boolean column recording, before imputation erases the evidence, which rows originally had a
      missing value in a given column. Lets a downstream model or analysis use "this value was imputed"
      as a signal in its own right, rather than losing that information the moment fillna runs.
  - term: to_numeric(errors='coerce')
    definition: >-
      A pandas function that converts a column to a numeric dtype, and, with errors='coerce', silently
      turns every value it cannot parse into a missing value rather than raising. Never coerce a column
      without counting how many values became missing as a result -- the count is the only defence
      against a mostly-garbage column silently becoming a mostly-NaN column with no complaint.
  - term: string normalisation
    definition: >-
      Cleaning a text column's formatting -- stripping whitespace (.str.strip()), lowercasing
      (.str.lower()), removing or replacing punctuation (.str.replace()) -- so that values which mean the
      same thing ("USA", "U.S.A.", " usa ") collapse to one canonical spelling before any groupby or
      value_counts() is run on the column.
  - term: exact duplicate
    definition: >-
      A row that is identical to another row across every column, detected by DataFrame.duplicated()
      with no subset argument. The strictest possible definition of "the same row twice."
  - term: subset duplicate
    definition: >-
      A row that matches another row only on a NAMED subset of columns, detected by
      DataFrame.duplicated(subset=[...]), even if the two rows differ elsewhere. Which definition is
      "correct" depends entirely on the question being asked, not on a universal notion of duplication.
  - term: IQR rule
    definition: >-
      An outlier-detection rule flagging any value more than 1.5 times the interquartile range (Q3 - Q1)
      below Q1 or above Q3. A statistical detection procedure, not a decision about whether to remove the
      flagged point -- that decision is a judgement call, covered separately.
  - term: z-score outlier detection
    definition: >-
      An outlier-detection rule flagging any value more than a chosen number of standard deviations from
      the mean. Sensitive to the same fragility as the mean itself (Day 116's zero breakdown point):
      extreme values inflate the standard deviation used to detect them, which can mask the very outliers
      being searched for.
  - term: cleaning contract
    definition: >-
      A set of post-conditions -- no nulls in named key columns, dtypes matching what was declared, a row
      count inside an expected range -- asserted mechanically after a cleaning step, so the cleaning
      either provably holds or fails loudly instead of silently shipping a violated assumption downstream.
  - term: SimpleImputer
    definition: >-
      scikit-learn's imputation transformer, performing the same arithmetic as pandas' fillna(mean) but
      behind a fit/transform boundary: fit() learns the imputation statistic from training data only, and
      transform() applies it to both training and test data, preventing the test set's own statistics
      from leaking into what the model is trained on.
  - term: data leakage
    definition: >-
      Information from data that should be unavailable at training time (most commonly, the test or
      validation set) influencing the model during training, producing evaluation scores that look better
      than the model actually deserves. Imputing with a statistic computed over the WHOLE dataset before
      splitting it into train and test is a direct, common cause.
  - term: pyjanitor
    definition: >-
      A pandas extension library offering a verb-style, chainable cleaning API (.clean_names(),
      .remove_empty(), and similar methods) built on top of the same pandas primitives this lesson covers
      directly, aimed at making a cleaning pipeline read as a readable sequence of named steps.
