questions:
  - question: >-
      A column's missing values are filled with the column's own mean. The mean is checked afterward and
      found to be exactly unchanged. What does this prove about the imputation?
    options:
      - 'Nothing about safety -- the mean is mathematically guaranteed to stay unchanged by mean imputation, regardless of how much damage was done elsewhere'
      - 'That the imputation was safe, because the key summary statistic did not move'
      - 'That the imputation must have failed silently, since a real fix should change the mean'
      - 'That every other statistic (standard deviation, correlations) is also guaranteed to be unchanged'
    answer_index: 0
    explanation: >-
      Mean imputation is defined as filling missing values with the mean of the observed values, so the
      overall mean cannot move -- this is true by construction, not evidence of anything. Meanwhile the
      standard deviation strictly shrinks (a pile of new points sits exactly at the centre) and any
      correlation with another column strictly attenuates. Checking the one statistic guaranteed not to
      change is not a safety check at all.
  - question: >-
      A column income is missing at several rows and is mean-imputed. A second column, spending, is
      genuinely correlated with income and is never touched. What happens to corr(income, spending) after
      imputation, and why?
    options:
      - 'It strictly increases, because the imputed points "agree with everything"'
      - 'It strictly decreases in magnitude (attenuates), because each imputed point has a zero deviation from the mean on the income axis, contributing nothing to the covariance while still adding variance elsewhere'
      - 'It is mathematically guaranteed to stay exactly the same'
      - 'It becomes undefined, because pandas cannot compute a correlation across imputed values'
    answer_index: 1
    explanation: >-
      Every imputed value sits exactly at the column mean, so its deviation from that mean is exactly
      zero. In the Pearson correlation formula, a covariance term is a product of two deviations; a zero
      factor makes the whole term zero regardless of the other column's value. Such a term can only
      dilute an existing relationship, never strengthen it -- so the correlation's magnitude strictly
      shrinks. This is a provable algebraic fact, not a property of one dataset.
  - question: >-
      A sensor log has some genuinely missing readings AND some genuine readings of exactly 0.0. Why is
      fillna(0) a dangerous choice here specifically?
    options:
      - 'fillna(0) always raises an error when a column already contains a zero'
      - '0 is treated as a string by pandas, breaking downstream arithmetic'
      - '0 is a real, already-present value here, not an absence -- filling with it makes the genuinely missing readings indistinguishable from the genuinely recorded 0.0 readings'
      - 'fillna(0) silently converts the whole column to a boolean dtype'
    answer_index: 2
    explanation: >-
      Zero is a legitimate measurement in this column, not a stand-in for "no data." Once fillna(0) runs,
      a row that was truly missing and a row that genuinely read 0.0 are bit-for-bit identical -- nothing
      downstream can recover which is which. The general lesson: know whether the fill value you choose
      could also be a real value the column already contains.
  - question: >-
      df.dropna(thresh=2) is run on a row that has 1 non-null value out of 3 columns. What happens to that
      row?
    options:
      - 'It is kept, because thresh counts MISSING values and 1 is below the threshold'
      - 'It is dropped only if how="all" is also specified'
      - 'thresh has no effect unless subset is also passed'
      - 'It is dropped, because thresh requires at least that many NON-NULL values to survive, and this row has only 1'
    answer_index: 3
    explanation: >-
      thresh sets the minimum number of NON-NULL values a row (or column) must have to survive dropna.
      A row with only 1 non-null value out of 3 fails a thresh=2 requirement and is dropped. This is
      easy to misread as counting missing values instead of present ones -- printing notna().sum(axis=1)
      before predicting the result avoids the confusion.
  - question: >-
      A DataFrame is NOT sorted by date. ffill() is called on a numeric column to fill its gaps. What is
      the risk, specifically?
    options:
      - 'ffill() silently carries a value forward across rows that were never actually adjacent in time, producing a plausible-looking but wrong result with no error raised'
      - 'ffill() will raise a ValueError on unsorted data, so the risk is only an error, not a wrong answer'
      - 'ffill() automatically sorts the DataFrame by its index before filling, so there is no risk'
      - 'ffill() only works on string columns, so this call would do nothing at all'
    answer_index: 0
    explanation: >-
      ffill() operates purely on the DataFrame's CURRENT row order, not on any notion of chronological
      order. If the rows are not sorted by the column that defines "nearest," a gap gets filled with
      whatever value happens to sit immediately above it in the scrambled order -- which may belong to a
      completely different point in time. No exception is raised; the result simply looks plausible and is
      wrong.
  - question: >-
      pd.to_numeric(df["col"], errors="coerce") is run on a column that is mostly garbage strings. What is
      the single most important thing to do immediately after?
    options:
      - 'Nothing -- errors="coerce" already handles bad values safely by design'
      - "Count how many values became NaN as a result, and compare that count to what you expected -- errors='coerce' converts every unparseable value into a missing value with no warning"
      - 'Re-run the same call with errors="raise" to double-check it agrees'
      - "Switch to errors='ignore', which is always the safer default"
    answer_index: 1
    explanation: >-
      errors="coerce" silently turns every value it cannot parse into NaN -- a column that is mostly
      garbage becomes a column that is mostly missing, with no complaint from pandas. The only defence is
      counting: compare the number of newly-introduced NaN values against how many unparseable strings you
      expected, so a silent mass failure does not slip past unnoticed.
  - question: >-
      A country column contains "USA", "U.S.A.", " usa ", and "Usa" -- four spellings of one country. What
      is the concrete, measurable consequence of running a groupby on this column WITHOUT normalising it
      first?
    options:
      - 'pandas raises a ValueError because the values are not identical strings'
      - 'pandas automatically normalises whitespace and case before grouping, so there is no consequence'
      - 'The groupby silently produces four separate groups instead of one, splitting one true category''s total across several rows in the result'
      - 'The groupby result becomes a MultiIndex instead of a flat index'
    answer_index: 2
    explanation: >-
      groupby treats each distinct string as its own group -- it has no notion of "these mean the same
      thing." Four spellings become four separate rows in the aggregated result, each carrying only a
      fraction of the true country's total. .str.strip(), .str.lower() and .str.replace() collapse the
      variants to one canonical spelling before the groupby is run, which is exactly what exercise 7 in
      this lesson's lab measures directly with nunique().
  - question: >-
      A cleaning function asserts a set of post-conditions (no nulls in key columns, correct dtypes, a row
      count within range) but has only ever been run on data that already satisfies them. What is missing
      before this "cleaning contract" can be trusted?
    options:
      - 'Nothing -- if the assertions pass every time they are run, the contract is proven correct'
      - 'A performance benchmark showing the assertions run quickly'
      - 'A docstring explaining what each assertion checks'
      - 'A demonstrated case where the contract is run against genuinely violating data and is shown to raise -- otherwise it is unknown whether the assertions would ever actually fire'
    answer_index: 3
    explanation: >-
      An assertion that has only ever seen passing data has never been tested -- it could contain a typo,
      a wrong comparison, or dead code, and passing runs would never reveal it. The only way to know a
      contract can catch a real violation is to deliberately construct violating data and confirm the
      contract raises on it, exactly as this lesson's exercise 9 and this course's other test harnesses
      do throughout.
