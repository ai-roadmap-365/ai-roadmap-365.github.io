<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward reproducibility.">
  <title>Four steps in data cleaning practice</title>
  <style>
    .clean-history-bg   { fill: #f8fafc; }
    .clean-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clean-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clean-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clean-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clean-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clean-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clean-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .clean-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .clean-history-stage { opacity: 1; }

    .clean-history-s0 { animation-delay: 0.00s; }
    .clean-history-e0 { animation-delay: 0.00s; }
    .clean-history-s1 { animation-delay: 1.28s; }
    .clean-history-e1 { animation-delay: 1.28s; }
    .clean-history-s2 { animation-delay: 2.56s; }
    .clean-history-e2 { animation-delay: 2.56s; }
    .clean-history-s3 { animation-delay: 3.84s; }
    .clean-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .clean-history-conn  { animation: clean-history-trace 6.4s ease-in-out infinite; }
      .clean-history-stage { animation: clean-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes clean-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes clean-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .clean-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .clean-history-stage { animation: clean-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes clean-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="clean-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="clean-history-bg" width="980" height="322"/>
  <text class="clean-history-h1"  x="30" y="40">Four steps in data cleaning practice</text>
  <text class="clean-history-sub" x="30" y="64">Toward reproducibility.</text>
  <g class="clean-history-stage clean-history-s0">
    <rect class="clean-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="clean-history-step" x="44" y="142">01</text>
    <text class="clean-history-name" x="70" y="142">Correcting records by hand, in the source</text>
    <text class="clean-history-desc" x="44" y="166">Untracked, and irreversible.</text>
  </g>
  <line class="clean-history-line clean-history-conn clean-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#clean-history-tip)"/>
  <g class="clean-history-stage clean-history-s1">
    <rect class="clean-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="clean-history-step" x="280" y="142">02</text>
    <text class="clean-history-name" x="306" y="142">Then edits in a spreadsheet copy</text>
    <text class="clean-history-desc" x="280" y="166">Reversible, but unrecorded.</text>
  </g>
  <line class="clean-history-line clean-history-conn clean-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#clean-history-tip)"/>
  <g class="clean-history-stage clean-history-s2">
    <rect class="clean-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="clean-history-step" x="516" y="142">03</text>
    <text class="clean-history-name" x="542" y="142">Then cleaning as a script over raw data</text>
    <text class="clean-history-desc" x="516" y="166">Reproducible, and reviewable.</text>
  </g>
  <line class="clean-history-line clean-history-conn clean-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#clean-history-tip)"/>
  <g class="clean-history-stage clean-history-s3">
    <rect class="clean-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="clean-history-step" x="752" y="142">04</text>
    <text class="clean-history-name" x="778" y="142">And versioned pipelines with quality checks</text>
    <text class="clean-history-desc" x="752" y="166">Which fail when the data changes</text>
    <text class="clean-history-desc" x="752" y="182">shape.</text>
  </g>
  <text class="clean-history-sub" x="30" y="304">Automated quality checks are the current standard, and they turn a data problem from something noticed months later into something that stops a pipeline today.</text>
</svg>
