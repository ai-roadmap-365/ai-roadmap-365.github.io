<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things cleaning is not</title>
  <style>
    .clean-not-bg   { fill: #f8fafc; }
    .clean-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clean-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clean-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clean-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clean-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clean-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clean-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clean-not-row { opacity: 1; }
    .clean-not-r0 { animation-delay: 0.00s; }
    .clean-not-r1 { animation-delay: 0.45s; }
    .clean-not-r2 { animation-delay: 0.90s; }
    .clean-not-r3 { animation-delay: 1.35s; }
    .clean-not-r4 { animation-delay: 1.80s; }
    .clean-not-row { animation: clean-not-reveal 7.3s ease-in-out infinite; }
    @keyframes clean-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="clean-not-bg" width="980" height="390"/>
  <text class="clean-not-h1"  x="30" y="40">Four things cleaning is not</text>
  <text class="clean-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="clean-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="clean-not-name" x="46" y="122">The misconception</text>
  <text class="clean-not-desc" x="46" y="142">Commonly held.</text>
  <text class="clean-not-desc clean-not-row clean-not-r0" x="46" y="182">Cleaning is a preliminary chore</text>
  <text class="clean-not-desc clean-not-row clean-not-r1" x="46" y="216">Missing values should be filled with the mean</text>
  <text class="clean-not-desc clean-not-row clean-not-r2" x="46" y="250">Outliers should be removed</text>
  <text class="clean-not-desc clean-not-row clean-not-r3" x="46" y="284">Cleaning is objective</text>
  <text class="clean-not-desc clean-not-row clean-not-r4" x="46" y="318">It is done once and finished</text>
  <rect class="clean-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="clean-not-name" x="526" y="122">What is true</text>
  <text class="clean-not-desc" x="526" y="142">Actually.</text>
  <text class="clean-not-desc clean-not-row clean-not-r0" x="526" y="182">It is most of the work, and it is analysis</text>
  <text class="clean-not-desc clean-not-row clean-not-r1" x="526" y="216">That shrinks variance and biases results</text>
  <text class="clean-not-desc clean-not-row clean-not-r2" x="526" y="250">They may be the most informative rows</text>
  <text class="clean-not-desc clean-not-row clean-not-r3" x="526" y="284">Every decision shapes conclusions</text>
  <text class="clean-not-desc clean-not-row clean-not-r4" x="526" y="318">Sources change; cleaning is ongoing</text>
  <text class="clean-not-sub" x="30" y="372">Cleaning being analysis rather than preparation is the framing shift that matters, because every decision made here shapes what the data can later say.</text>
</svg>
