<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Record every change.">
  <title>Restoring a document</title>
  <style>
    .restoration-bg   { fill: #f8fafc; }
    .restoration-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restoration-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restoration-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restoration-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restoration-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restoration-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restoration-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .restoration-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .restoration-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .restoration-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .restoration-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .restoration-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restoration-row { opacity: 1; }
    .restoration-r0 { animation-delay: 0.00s; }
    .restoration-r1 { animation-delay: 0.45s; }
    .restoration-r2 { animation-delay: 0.90s; }
    .restoration-r3 { animation-delay: 1.35s; }
    .restoration-r4 { animation-delay: 1.80s; }
    .restoration-row { animation: restoration-reveal 7.3s ease-in-out infinite; }
    @keyframes restoration-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="restoration-bg" width="980" height="390"/>
  <text class="restoration-h1"  x="30" y="40">Restoring a document</text>
  <text class="restoration-sub" x="30" y="64">Record every change.</text>
  <rect class="restoration-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="restoration-name" x="46" y="122">Documented</text>
  <text class="restoration-desc" x="46" y="142">Reversible, trusted.</text>
  <text class="restoration-desc restoration-row restoration-r0" x="46" y="182">The original is preserved</text>
  <text class="restoration-desc restoration-row restoration-r1" x="46" y="216">Every intervention recorded</text>
  <text class="restoration-desc restoration-row restoration-r2" x="46" y="250">Others can judge the choices</text>
  <text class="restoration-desc restoration-row restoration-r3" x="46" y="284">Work can be undone</text>
  <text class="restoration-desc restoration-row restoration-r4" x="46" y="318">This is scripted cleaning</text>
  <rect class="restoration-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="restoration-name" x="526" y="122">Undocumented</text>
  <text class="restoration-desc" x="526" y="142">Irreversible, doubted.</text>
  <text class="restoration-desc restoration-row restoration-r0" x="526" y="182">The original is altered</text>
  <text class="restoration-desc restoration-row restoration-r1" x="526" y="216">Nothing recorded</text>
  <text class="restoration-desc restoration-row restoration-r2" x="526" y="250">Choices are invisible</text>
  <text class="restoration-desc restoration-row restoration-r3" x="526" y="284">Nothing can be undone</text>
  <text class="restoration-desc restoration-row restoration-r4" x="526" y="318">This is editing the source file</text>
  <text class="restoration-sub" x="30" y="372">Others being able to judge the choices is what makes a cleaned dataset trustworthy, and it is impossible if the cleaning happened by hand.</text>
</svg>
