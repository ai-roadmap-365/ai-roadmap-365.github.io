id: D125
day: 125
slug: cleaning-messy-data
title: Cleaning Messy Data
section: math-statistics-and-data
subsection: data-analysis
week: 18
learning_promise: >-
  After this lesson you will be able to name the exact statistic mean imputation cannot disturb (the
  mean) and the two it always does (the standard deviation, which strictly shrinks, and a real
  correlation, which strictly attenuates toward zero); explain algebraically why an imputed value can
  never inflate a correlation with an untouched column; distinguish fillna(0) from a genuine missing-value
  fill and name a case where zero collides with a value the data already contains; choose among dropna's
  how, thresh and subset arguments and state the row count each produces; show why ffill on unsorted data
  is a real bug and confirm sorting first fixes it; build a missing-indicator column that survives after
  isna() no longer can; count exactly how many values pd.to_numeric(errors='coerce') silently converted to
  missing; normalise string categories and show a raw groupby splitting one true category into several;
  distinguish exact duplicates from duplicates on a named subset and say which definition answers which
  question; and write a cleaning contract that asserts its own post-conditions and is proven able to raise.
objectives:
  - 'State which statistic mean imputation cannot change (the mean) and which two it always does (standard deviation, which strictly shrinks, and correlation with an untouched column, which strictly attenuates)'
  - 'Explain, from the Pearson correlation formula, why an imputed value -- sitting exactly at the column mean -- can only dilute an existing correlation, never inflate one'
  - "Distinguish fillna(0) from a true missing-value fill, and identify when 0 is itself a real, already-present value the fill would collide with"
  - "Choose among dropna's how='any', how='all', thresh= and subset= arguments and predict the row count each produces on a given frame"
  - 'Demonstrate that ffill on unsorted data produces a wrong result at specific rows, and that sorting by the relevant column first produces the correct one'
  - "Build a missing-indicator column recording isna() BEFORE imputing, and confirm it still matches the original mask after the fill has erased the evidence from the column itself"
  - "Use pd.to_numeric(errors='coerce') and count exactly how many values were silently converted to missing, comparing that count against the number of unparseable values planted"
  - 'Normalise string categories with .str.strip(), .str.lower() and .str.replace(), and show nunique() and a raw groupby both revealing the damage of skipping that step'
  - "Distinguish DataFrame.duplicated()'s exact-duplicate count from duplicated(subset=[...])'s subset-duplicate count, and state which definition answers which real question"
  - 'Detect outliers with the IQR rule or a z-score, and explain why detection is a statistical procedure while removal is a judgement call about whether the point is an error or a fact'
  - 'Write a cleaning contract asserting no nulls in key columns, declared dtypes, and a row count within an expected range, and prove it can genuinely raise on violating data'
  - 'Explain why imputing with a statistic computed over the whole dataset before a train/test split leaks information from the test set into training, and why SimpleImputer''s fit/transform boundary exists specifically to prevent it'
prerequisites:
  - 'Days 120-124 -- pandas Series and DataFrames, loading and inspecting data, selecting and filtering, groupby and aggregation, and merging and reshaping. Not re-taught here.'
  - "Day 116 -- the mean's zero breakdown point and robust measures of spread, which motivate why a single imputed statistic is not the whole picture"
  - 'Day 117 -- bias does not shrink with sample size, which is why informative (MNAR) missingness is not fixed by collecting more rows'
  - 'A working python3 on your PATH; the lab creates its own virtual environment with pandas 3.0.5 pinned exactly'
reading_time_minutes: 50
