visuals:
  - id: leakage-anatomy-architecture
    file: assets/leakage-anatomy-architecture.svg
    type: diagram
    title: >-
      The anatomy of leakage: the timeline of one prediction, the boundary marking what is knowable at
      prediction time, and the three kinds of leakage drawn as arrows crossing that boundary from the
      wrong side
    alt: >-
      Diagram: the anatomy of leakage drawn as a timeline of one prediction. A green band across the top
      left is labelled knowable at prediction time and lists visits so far, minutes on site, the discount
      offered and the batch this sensor is running under today. A red band across the top right is labelled
      not knowable, the future, and lists did they convert, when the invoice went out, and next month's
      calibration. A horizontal time axis runs beneath them with four events marked: first visit and
      discount shown on the left, they convert and invoice issued on the right. A thick blue dashed
      vertical line labelled prediction time separates the two halves. At the lower left sits a blue box,
      the feature table the model trains on, with the note that anything reaching it from the right of the
      line is a leak however it got there and will show up as a score better than the problem deserves.
      Three red arrows curve from the right-hand side back across the boundary into that box, each one
      starting from a labelled card. Card one, target leakage, a column derived from the outcome, days to
      first invoice is minus one until they convert, measured at 1.00 against 0.64. Card two, train and
      test contamination, a statistic fitted before the split, a group-mean imputer over all rows scoring
      0.748 against 0.666, eight points of optimism. Card three, temporal leakage, a value recorded after
      the moment and hidden by a random split, random 0.88 and time-ordered 0.07, trust the second. A
      closing note says the three cross the same boundary and hide in different places: the first in the
      column list, the second in the order of your code, and the third in the split itself, which is why it
      survives code review most often
    description: >-
      A static architecture diagram. A timeline of a single prediction runs across the width of the figure,
      with a thick blue dashed vertical line at the prediction moment. Everything left of it sits under a
      green band labelled knowable at prediction time; everything right of it sits under a red band labelled
      not knowable, the future. Four events are marked on the axis: first visit and discount shown to the
      left of the line, they convert and invoice issued to the right. A blue box at the lower left is the
      feature table the model trains on. Three red cards on the right name the three kinds of leakage --
      target leakage, train and test contamination, and temporal leakage -- each carrying the measured
      before-and-after pair from this lesson's lab, and each connected to the feature table by a red arrow
      that crosses the boundary from the wrong side. A closing note names where each kind hides: the column
      list, the order of the code, and the split itself.
  - id: cyclical-encoding-flow
    file: assets/cyclical-encoding-flow.svg
    type: flow-animated
    title: >-
      Cyclical encoding: hours laid out on a line with 23 and 0 far apart, then wrapped onto a circle where
      they become neighbours, with the distances annotated at both stages
    alt: >-
      Diagram: hours of the day encoded two ways, side by side. On the left, under the heading raw integer
      hour, the wrap is invisible, twenty-four hours are laid out along a straight ruler from 0 to 23 with
      ticks at 0, 3, 4, 8, 12, 18 and 23. A red bracket over the whole ruler is labelled 23 to 0 equals
      23.0, while a small green bracket under hours 3 and 4 is labelled 3 to 4 equals 1.0, and a note
      records that every adjacent pair is 1.0 apart except the one that matters, the wrap from 23 to 0,
      which the ruler records as the largest gap on it, a spread of 22.0 across the twenty-four adjacent
      pairs. A blue dashed arrow labelled sin, cos with the formula angle equals two pi h over 24 carries
      the ruler across to the right, where under the heading sine and cosine, the wrap is restored, the same
      twenty-four hours sit evenly around a circle. Hours 23 and 0 are marked in red as neighbours at the
      top and hours 3 and 4 in green a little further round, with hours 6, 12 and 18 labelled. Beneath the
      circle two green labels read 23 to 0 equals 0.2611 and 3 to 4 equals 0.2611, with a note that both
      are two times the sine of pi over 24, that the spread across all twenty-four adjacent pairs is below
      1e-12, and that opposite hours stay 2.0 apart. A travelling blue token walks the ruler and a second
      orbits the circle. A bottom panel says two columns replace one and the distance between any two hours
      now means what it means on a clock, and that with motion disabled every hour, every distance and both
      labelled pairs are already drawn, the animation only showing the order: walk the ruler, wrap it, then
      go round
    description: >-
      An animated flow diagram, fully readable as a still image. The left half is a straight ruler of the
      twenty-four hours, with a red bracket spanning the whole of it labelled 23 to 0 equals 23.0 and a
      small green bracket under hours 3 and 4 labelled 3 to 4 equals 1.0. A blue dashed wire with marching
      dashes carries the ruler across to the right half, where the same hours sit evenly around a circle and
      hours 23 and 0 are neighbours at the top. Both labelled pairs are annotated at 0.2611, which is two
      times the sine of pi over 24. A blue token walks the ruler from hour 0 to hour 23 and returns; a
      second token orbits the circle; the 23 and 0 pair pulses gently. A prefers-reduced-motion block sets
      every animation to none, turns the marching dashes into a solid line, freezes the walking token at
      hour 0 and the orbiting token at hour 0 on the circle, and restores full opacity to the pulsing pair,
      while every hour, every distance and every label stays fully drawn and fully legible.
