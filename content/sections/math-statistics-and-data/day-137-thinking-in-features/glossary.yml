terms:
  - term: feature
    definition: >-
      A number given to a model, computed from data you have. Every feature encodes a hypothesis about
      what matters: writing spend divided by income asserts that the proportion of income being spent is
      the thing that carries signal, and that the same ratio means the same thing at every income level. A
      feature is not a column; it is a column plus a fitting procedure, because "standardised order value"
      is undefined until you say whose mean and whose standard deviation.
  - term: leakage
    definition: >-
      Information reaching the model that will not be available at the moment a prediction is actually
      needed. It is invisible from the inside because it makes results look better rather than worse, which
      is why the only reliable symptom is a score that is better than the problem allows.
  - term: target leakage
    definition: >-
      A feature that encodes the outcome, directly or by proxy. In this lesson's lab,
      days_to_first_invoice is -1 for every unconverted row and a positive number for every converted one,
      because an invoice cannot exist before a conversion. It takes the model from 0.64 to 1.00. This kind
      hides in the column list, and the question that finds it is "when is this value written?".
  - term: train/test contamination
    definition: >-
      Any statistic fitted on rows the model will later be scored on: a scaler's mean, an imputer's fill
      value, a category's average outcome, a vocabulary. It hides in the order of the code, and the question
      that finds it is "which rows went into this number?". Its severity varies enormously -- measured here,
      a contaminated scaler was worth -0.06 points and a contaminated group-mean imputer 8.22.
  - term: temporal leakage
    definition: >-
      Using information from after the prediction moment. It hides in the split itself: a random split
      scatters every period into both halves, so the model learns each period's behaviour from rows recorded
      at the same time as the ones it is scored on. Measured here, 0.8833 under a random split and 0.0667
      under a time-ordered one, where the majority-class baseline for that period was 0.9333.
  - term: fit/transform split
    definition: >-
      Writing every fitted statistic as two operations: fit, which looks at rows and learns numbers, and
      transform, which applies numbers already learned and looks at nothing. Once they are separate, the
      question of which rows influenced a feature is answerable by reading the call site instead of guessing.
      This is what scikit-learn's Pipeline exists to enforce.
  - term: one-hot encoding
    definition: >-
      One 0/1 column per category, in an explicit category order derived from the training data. Honest
      about the absence of order, costs one column per level, and lets a category the training data never
      held become a row of zeros rather than a crash or a new column. Known in econometrics as dummy
      variables for most of a century.
  - term: ordinal encoding
    definition: >-
      Replacing each category with its position in a list. Correct when the order is real -- small, medium,
      large -- and a trap when it is not, because the code is a number and the model will read the gap
      between two categories as a quantity. Measured here on six unordered paint colours, the ordinal model
      could only produce a monotone climb from 0.252 to 0.415 and was out by 0.383 on the worst colour,
      where one-hot reproduced every observed rate to within 0.0000002.
  - term: target encoding
    definition: >-
      Replacing a category with the mean outcome for that category. Compact for high-cardinality columns and
      the subtlest way to leak in this lesson, because it reads the target: computed before the split, every
      test row's feature value is computed partly from its own answer. Usually credited to Micci-Barreca's
      2001 SIGKDD Explorations paper, which prescribes smoothing towards the global mean for small
      categories.
  - term: out-of-fold encoding
    definition: >-
      Computing a target encoding for each training fold from the means of the other folds, so a row's own
      target never contributes to its own feature value. It is a refinement inside the training half, not a
      licence to fit on the test set. Worth a further 1.2 points over naive encoding on the training rows in
      this lesson's measurement.
  - term: cyclical encoding
    definition: >-
      Replacing a wrapping quantity with a sine and cosine pair, so that adjacency survives the wrap. Hour
      23 and hour 0 sit 23.0 apart as integers and exactly 2*sin(pi/24) = 0.26105238444010315 apart on the
      circle -- the same distance as every other adjacent pair, with a spread below 1e-12 across all
      twenty-four. Opposite hours stay 2.0 apart, the diameter. It is the rare feature decision that can be
      proved rather than measured.
  - term: binning
    definition: >-
      Turning a continuous column into a categorical one by choosing boundaries. A bin boundary is a
      decision with the same power as Day 130's bin width: on the same 500 rows, equal-width edges put 4
      rows in the top bin at a rate of 1.000 while equal-count edges put 167 rows in it at a rate of 0.563.
      Both are correct; only one of them is what you meant.
  - term: interaction
    definition: >-
      A feature built from more than one column, expressing something neither carries alone -- usually a
      ratio or a product. Measured here, income alone separated two classes at 0.54 and spend alone at 0.67,
      while spend divided by income separated them at 1.00.
  - term: bag of words
    definition: >-
      Representing a document as counts of the words it contains, one column per word. The consequential
      decision is the vocabulary -- which words become columns at all -- which is a fitted statistic like any
      other and belongs on the training side of the split. The transform must also survive tokens it has
      never seen, by skipping them rather than crashing.
  - term: leakage audit
    definition: >-
      A reusable check over a feature table and a target. The version in this lesson has three named rules:
      correlation above a threshold, perfect separability by a single threshold, and a non-numeric column
      whose every category maps to one target value. It caught both planted leaks and flagged no honest
      column -- and the numeric leak was caught by separability, not correlation, because its correlation of
      0.8468 was under the 0.90 threshold. It cannot see contamination, unavailability at prediction time, or
      a value backfilled from the future.
  - term: feature cost
    definition: >-
      The requirement that a feature be computable at prediction time, from data that exists then, at
      acceptable expense. All three clauses bite independently: a lifetime average is not computable before
      a customer's first order, a nightly table is not current enough for a live request, and a
      200-millisecond aggregation is unavailable to a 50-millisecond budget. This is a systems constraint as
      much as a statistical one.
  - term: training/serving skew
    definition: >-
      The gap that opens when the feature computed in a training pipeline and the feature computed in a
      request handler are not quite the same feature. It is the problem feature stores were built for, and
      it is the reason the same code path is worth more than the better implementation.
  - term: point-in-time correctness
    definition: >-
      Retrieving, for each training example, the feature values as they stood at that example's timestamp
      rather than as they stand now. It is temporal-leakage prevention turned into infrastructure, and it is
      the hardest part to build by hand across dozens of features.
