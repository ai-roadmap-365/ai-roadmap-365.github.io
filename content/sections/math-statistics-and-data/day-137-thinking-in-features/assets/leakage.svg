<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four ways.">
  <title>How leakage happens</title>
  <style>
    .leakage-bg   { fill: #f8fafc; }
    .leakage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leakage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leakage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leakage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leakage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leakage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .leakage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .leakage-stage { opacity: 1; }

    .leakage-s0 { animation-delay: 0.00s; }
    .leakage-e0 { animation-delay: 0.00s; }
    .leakage-s1 { animation-delay: 1.28s; }
    .leakage-e1 { animation-delay: 1.28s; }
    .leakage-s2 { animation-delay: 2.56s; }
    .leakage-e2 { animation-delay: 2.56s; }
    .leakage-s3 { animation-delay: 3.84s; }
    .leakage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .leakage-conn  { animation: leakage-trace 6.4s ease-in-out infinite; }
      .leakage-stage { animation: leakage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes leakage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes leakage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .leakage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .leakage-stage { animation: leakage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes leakage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="leakage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="leakage-bg" width="980" height="322"/>
  <text class="leakage-h1"  x="30" y="40">How leakage happens</text>
  <text class="leakage-sub" x="30" y="64">Four ways.</text>
  <g class="leakage-stage leakage-s0">
    <rect class="leakage-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-step" x="44" y="142">01</text>
    <text class="leakage-name" x="70" y="142">A feature computed using data from after the prediction point</text>
    <text class="leakage-desc" x="44" y="166">Which will not exist in</text>
    <text class="leakage-desc" x="44" y="182">production.</text>
  </g>
  <line class="leakage-line leakage-conn leakage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#leakage-tip)"/>
  <g class="leakage-stage leakage-s1">
    <rect class="leakage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-step" x="280" y="142">02</text>
    <text class="leakage-name" x="306" y="142">A feature derived from the target itself</text>
    <text class="leakage-desc" x="280" y="166">Directly, or through a proxy.</text>
  </g>
  <line class="leakage-line leakage-conn leakage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#leakage-tip)"/>
  <g class="leakage-stage leakage-s2">
    <rect class="leakage-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-step" x="516" y="142">03</text>
    <text class="leakage-name" x="542" y="142">Scaling or encoding fitted on all the data</text>
    <text class="leakage-desc" x="516" y="166">Including the test set.</text>
  </g>
  <line class="leakage-line leakage-conn leakage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#leakage-tip)"/>
  <g class="leakage-stage leakage-s3">
    <rect class="leakage-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-step" x="752" y="142">04</text>
    <text class="leakage-name" x="778" y="142">And duplicate records split across train and test</text>
    <text class="leakage-desc" x="752" y="166">Which inflates every score.</text>
  </g>
  <text class="leakage-sub" x="30" y="304">Fitting a scaler on all the data before splitting is the most common and least obvious form, and it produces optimistic scores that never survive deployment.</text>
</svg>
