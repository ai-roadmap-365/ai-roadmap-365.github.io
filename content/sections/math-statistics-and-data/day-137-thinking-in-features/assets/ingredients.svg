<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Before cooking.">
  <title>Preparing ingredients</title>
  <style>
    .ingredients-bg   { fill: #f8fafc; }
    .ingredients-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingredients-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingredients-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingredients-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingredients-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingredients-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ingredients-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ingredients-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ingredients-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ingredients-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ingredients-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ingredients-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ingredients-row { opacity: 1; }
    .ingredients-r0 { animation-delay: 0.00s; }
    .ingredients-r1 { animation-delay: 0.45s; }
    .ingredients-r2 { animation-delay: 0.90s; }
    .ingredients-r3 { animation-delay: 1.35s; }
    .ingredients-r4 { animation-delay: 1.80s; }
    .ingredients-row { animation: ingredients-reveal 7.3s ease-in-out infinite; }
    @keyframes ingredients-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ingredients-bg" width="980" height="390"/>
  <text class="ingredients-h1"  x="30" y="40">Preparing ingredients</text>
  <text class="ingredients-sub" x="30" y="64">Before cooking.</text>
  <rect class="ingredients-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ingredients-name" x="46" y="122">Prepared</text>
  <text class="ingredients-desc" x="46" y="142">Ready to combine.</text>
  <text class="ingredients-desc ingredients-row ingredients-r0" x="46" y="182">Cut to a usable size</text>
  <text class="ingredients-desc ingredients-row ingredients-r1" x="46" y="216">Measured</text>
  <text class="ingredients-desc ingredients-row ingredients-r2" x="46" y="250">Only what the dish needs</text>
  <text class="ingredients-desc ingredients-row ingredients-r3" x="46" y="284">The cooking is straightforward</text>
  <text class="ingredients-desc ingredients-row ingredients-r4" x="46" y="318">These are engineered features</text>
  <rect class="ingredients-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ingredients-name" x="526" y="122">Raw</text>
  <text class="ingredients-desc" x="526" y="142">Work still to do.</text>
  <text class="ingredients-desc ingredients-row ingredients-r0" x="526" y="182">Whole, unprepared</text>
  <text class="ingredients-desc ingredients-row ingredients-r1" x="526" y="216">Unmeasured</text>
  <text class="ingredients-desc ingredients-row ingredients-r2" x="526" y="250">Everything in the cupboard</text>
  <text class="ingredients-desc ingredients-row ingredients-r3" x="526" y="284">The cooking is harder</text>
  <text class="ingredients-desc ingredients-row ingredients-r4" x="526" y="318">These are raw columns</text>
  <text class="ingredients-sub" x="30" y="372">Everything in the cupboard being available is not an advantage, and choosing what belongs is most of the skill in both settings.</text>
</svg>
