<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward learned representations.">
  <title>Four steps in feature thinking</title>
  <style>
    .feat-history-bg   { fill: #f8fafc; }
    .feat-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feat-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .feat-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .feat-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .feat-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .feat-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .feat-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .feat-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .feat-history-stage { opacity: 1; }

    .feat-history-s0 { animation-delay: 0.00s; }
    .feat-history-e0 { animation-delay: 0.00s; }
    .feat-history-s1 { animation-delay: 1.28s; }
    .feat-history-e1 { animation-delay: 1.28s; }
    .feat-history-s2 { animation-delay: 2.56s; }
    .feat-history-e2 { animation-delay: 2.56s; }
    .feat-history-s3 { animation-delay: 3.84s; }
    .feat-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .feat-history-conn  { animation: feat-history-trace 6.4s ease-in-out infinite; }
      .feat-history-stage { animation: feat-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes feat-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes feat-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .feat-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .feat-history-stage { animation: feat-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes feat-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="feat-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="feat-history-bg" width="980" height="322"/>
  <text class="feat-history-h1"  x="30" y="40">Four steps in feature thinking</text>
  <text class="feat-history-sub" x="30" y="64">Toward learned representations.</text>
  <g class="feat-history-stage feat-history-s0">
    <rect class="feat-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="feat-history-step" x="44" y="142">01</text>
    <text class="feat-history-name" x="70" y="142">Features designed by hand for each problem</text>
    <text class="feat-history-desc" x="44" y="166">Which dominated for decades.</text>
  </g>
  <line class="feat-history-line feat-history-conn feat-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#feat-history-tip)"/>
  <g class="feat-history-stage feat-history-s1">
    <rect class="feat-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="feat-history-step" x="280" y="142">02</text>
    <text class="feat-history-name" x="306" y="142">Then shared feature sets within domains</text>
    <text class="feat-history-desc" x="280" y="166">Reused across projects.</text>
  </g>
  <line class="feat-history-line feat-history-conn feat-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#feat-history-tip)"/>
  <g class="feat-history-stage feat-history-s2">
    <rect class="feat-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="feat-history-step" x="516" y="142">03</text>
    <text class="feat-history-name" x="542" y="142">Then learned representations from raw input</text>
    <text class="feat-history-desc" x="516" y="166">Which displaced hand design for</text>
    <text class="feat-history-desc" x="516" y="182">text and images.</text>
  </g>
  <line class="feat-history-line feat-history-conn feat-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#feat-history-tip)"/>
  <g class="feat-history-stage feat-history-s3">
    <rect class="feat-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="feat-history-step" x="752" y="142">04</text>
    <text class="feat-history-name" x="778" y="142">And tabular data, where engineering still wins</text>
    <text class="feat-history-desc" x="752" y="166">Which is worth knowing.</text>
  </g>
  <text class="feat-history-sub" x="30" y="304">Tabular data remaining a domain where careful feature work beats learned representations is a genuinely useful thing to know, and it contradicts the general narrative.</text>
</svg>
