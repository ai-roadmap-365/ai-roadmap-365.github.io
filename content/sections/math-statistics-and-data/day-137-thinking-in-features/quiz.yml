questions:
  - question: >-
      Your held-out accuracy comes back at 0.99 on a problem your team expected to be hard. What is the
      correct first response?
    options:
      - 'Treat it as a bug report and look for a leak first'
      - Report it, then start work on the deployment
      - Re-run it with a different random seed to confirm it is stable
      - Add regularisation, since a score that high indicates overfitting
    answer_index: 0
    explanation: >-
      A different seed will happily reproduce a leak, so stability confirms nothing; and regularisation
      cannot remove information that should not be in the table at all. Overfitting shows up as a training
      score far above a test score, whereas leakage inflates the test score too, which is exactly why it is
      harder to see. The habit worth building is that an unexpectedly excellent result is evidence of a
      defect until you have found out otherwise -- in this lesson's lab, one column derived from the outcome
      moved the score from 0.64 to 1.00.
  - question: >-
      Which of the three kinds of leakage is the one a random train/test split conceals completely?
    options:
      - Target leakage, because the leaking column looks like any other column
      - 'Temporal leakage — a random split mixes periods'
      - Train/test contamination, because the fit happens before the split
      - All three are concealed equally by a random split
    answer_index: 1
    explanation: >-
      Target leakage is visible in the column list if you ask when each value is written, and contamination
      is visible in the order of the code if you ask which rows fed each fitted statistic. Temporal leakage
      has nothing to read: the column names are sensible and every fit is in the right place. The defect is
      in the word random. In the lab, the same table scored 0.8833 under a random split and 0.0667 under a
      time-ordered one -- and the second number is the trustworthy one.
  - question: >-
      In the lab, fitting a scaler on all the data before the split was measured over 200 random splits and
      bought -0.06 accuracy points, while fitting a group-mean imputer the same way bought 8.22. What
      explains the difference?
    options:
      - The scaler experiment used too few splits for the effect to appear
      - Imputation is a more advanced technique and therefore leaks more
      - 'Standardisation is one affine map; a group-mean fill is local'
      - The scaler was fitted correctly by accident in most of the 200 splits
    answer_index: 2
    explanation: >-
      A scaler cannot pull the test rows towards the training rows; it moves everything together, so the
      only thing contamination can change is the relative weighting of the features, and a logistic
      regression run to convergence is nearly invariant to that. A group mean over about five rows is
      genuinely local knowledge about those rows. The rule worth carrying is that a contaminated statistic
      is worth exactly as much as that statistic knows -- which also predicts why a target encoding, which
      knows the answer, was worth 6.8 points.
  - question: >-
      Six paint colours are encoded as an ordinal code 0 to 5 in alphabetical order and fed to a logistic
      regression. Their true return rates are 0.23, 0.06, 0.70, 0.15, 0.63 and 0.23. What must the model's
      predictions look like?
    options:
      - They will match the true rates, because the model has enough capacity for six categories
      - They will be identical for all six colours, because the code carries no information
      - They will match for the first three colours and diverge afterwards
      - They will rise or fall monotonically with the code, so they cannot match a non-monotone pattern
    answer_index: 3
    explanation: >-
      One coefficient times one number, passed through a monotone link, can only produce a monotone
      sequence. Measured in the lab, the ordinal model predicted 0.252, 0.281, 0.312, 0.345, 0.380 and
      0.415 -- a gentle climb that is out by 0.383 on ivory. The one-hot model reproduced every rate to
      within 0.0000002. The failure is not a lack of capacity; it is that the encoding asserted an order,
      and a spacing, that the categories do not have.
  - question: >-
      You replace a high-cardinality city column with the mean conversion rate for each city, computing the
      means over the whole table, and then split. What have you done?
    options:
      - Given each test row a feature value computed partly from its own target
      - Nothing wrong, since the encoding is only a summary of the training signal
      - Introduced temporal leakage, because means are computed over history
      - Reduced the model's variance at the cost of a little bias
    answer_index: 0
    explanation: >-
      Target encoding reads the target, so computing it before the split lets each test row contribute its
      own answer to its own feature. In the lab this inflated held-out accuracy from 0.5535 to 0.6215,
      averaged over forty splits, and you can see it without any model: the naive encoding correlates 0.2708
      with the target where the out-of-fold one correlates 0.0505. Restricting the encoding to training rows
      removes the inflation; out-of-fold goes one better by keeping a training row's own target out of its
      own feature.
  - question: >-
      Why is encoding an hour as a sine and cosine pair described in this lesson as the one feature decision
      you can prove rather than measure?
    options:
      - Because the encoding always improves model accuracy on time-stamped data
      - 'Adjacent hours are always 2*sin(pi/24) apart, including the wrap'
      - Because two columns always beat one column
      - Because sine and cosine are bounded between -1 and 1, which standardises the feature
    answer_index: 1
    explanation: >-
      Adjacent hours are 2*pi/24 radians apart on a unit circle, so the chord between them is exactly
      2*sin(pi/24) = 0.26105238444010315 -- for every pair, wrap included, with a spread below 1e-12 across
      all twenty-four. Opposite hours stay 2.0 apart, the diameter. That is arithmetic, not a measurement,
      which is why the lab asserts it exactly rather than in a band. Whether it improves a particular model
      is a separate, empirical question.
  - question: >-
      A leakage audit flags a numeric column whose absolute correlation with the target is 0.85, using a
      threshold of 0.90. How is that possible, and what does it tell you?
    options:
      - It is a bug; a 0.85 correlation cannot exceed a 0.90 threshold
      - The audit rounds correlations up to the nearest tenth
      - 'A second rule caught it — one threshold separates the classes'
      - The column was flagged as a pure category rather than as a correlation
    answer_index: 2
    explanation: >-
      The planted leak in the lab, days_to_first_invoice, correlates 0.8468 with the target, which is under
      the default 0.90 threshold, so the correlation rule stayed silent. The separability rule caught it: the
      column is -1 for every unconverted row and at least 1 for every converted one, so one threshold splits
      the classes without error. Setting the threshold above 1, which disables the correlation rule entirely,
      still catches both planted leaks -- and no honest column is flagged either way.
  - question: >-
      Which statement about a feature's cost is the one this lesson insists on?
    options:
      - A feature is worth building whenever it improves held-out accuracy
      - Feature cost only matters for models served in real time, not for batch scoring
      - Cost is a deployment concern and should not influence feature design
      - 'It must be computable at prediction time, affordably'
    answer_index: 3
    explanation: >-
      All three clauses bite independently. A feature can be computable in principle and unavailable in
      practice, available in a nightly table and useless to a forty-millisecond request, or predictive and
      too slow to read. This is a systems constraint as much as a statistical one, and the first clause is
      the one that would have caught days_to_first_invoice before any model was trained -- which is exactly
      the problem a feature store exists to make tractable at organisational scale.
