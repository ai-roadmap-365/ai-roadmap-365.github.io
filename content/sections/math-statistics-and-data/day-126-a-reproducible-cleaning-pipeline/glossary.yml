terms:
  - term: pipeline (data)
    definition: >-
      A named sequence of pure, frame-to-frame functions applied in a declared order, with contracts
      checked at both ends, so the same input and configuration always produce the same output --
      as opposed to an ad hoc sequence of notebook cells run in whatever order they happen to be
      clicked.
  - term: idempotence
    definition: >-
      The property that applying an operation a second time to its own output produces the same
      result as applying it once: pipeline(pipeline(df)) equals pipeline(df). A pipeline that lacks
      this property drifts silently every time it happens to run twice, which a retried scheduled job
      does routinely.
  - term: determinism
    definition: >-
      The property that the same input and configuration always produce a byte-identical output,
      including row order -- which requires every sort to name an explicit tie-break, because a
      "stable" sort only preserves whatever order tied rows happened to arrive in.
  - term: input contract
    definition: >-
      A check, run before a pipeline's first step, that a frame has every required column with the
      required dtype. Raises immediately, naming the offending column, rather than letting a
      malformed frame fail confusingly several steps later.
  - term: output contract
    definition: >-
      A check, run after a pipeline's last step, that the result meets the promises the pipeline is
      supposed to keep (no missing values in a required column, no value above a configured ceiling,
      a required derived column present). Proven meaningful only by demonstrating it can genuinely
      fail when a step is sabotaged, not merely that it passes on correct input.
  - term: step log
    definition: >-
      A record, built while a pipeline runs, of each step's name, rows in, rows out, and the net
      change. Read after the fact, it is how a silently row-dropping step is discovered rather than
      guessed at -- the reconciliation habit from groupby (Day 123) generalised to a whole pipeline.
  - term: checkpoint
    definition: >-
      An intermediate result written to disk (here, Parquet) between expensive pipeline stages, so a
      failure partway through does not require re-running everything from the start. Parquet is used
      rather than CSV because it preserves dtypes exactly, including a nullable Int64 column's missing
      values, where CSV round-trips everything through text and loses them (Day 121).
  - term: manifest
    definition: >-
      A small JSON record tying a pipeline's output back to its origin: the input's content hash, the
      configuration's hash, the step log, and the output's content hash. The only thing that makes
      "which data produced this number?" answerable months later without guessing.
  - term: content hash
    definition: >-
      A cryptographic digest (here, SHA-256 via hashlib) computed from a frame's or a config's exact
      serialised bytes. Two runs on identical input produce an identical hash; changing even one byte
      of the input changes the hash. The specific hex digest can depend on serialisation details
      (float formatting, key order) and is not promised to match across different library versions --
      the STABILITY and SENSITIVITY properties are what a pipeline actually relies on.
  - term: order dependence
    definition: >-
      The fact that some pipeline steps produce different, equally defensible results depending on
      which order they run in -- normalising string casing before deduplicating catches variant-cased
      duplicates that deduplicating first would miss. A pipeline should declare its required order and
      the reason, rather than leaving it to whichever order someone happened to write the calls in.
  - term: configuration (pipeline)
    definition: >-
      Thresholds, column lists and mappings kept in a data structure the pipeline reads, separate from
      the step functions' code, so re-running with different parameters means editing the
      configuration, never the logic.
  - term: DataFrame.pipe
    definition: >-
      A pandas method that composes a sequence of frame-to-frame functions by passing each one's
      output as the next one's input, read top to bottom like a chain. Readable, but it removes the
      easy place to insert an inspection or a breakpoint between two steps that sequential function
      calls give for free -- a real tradeoff, not a stylistic one.
  - term: pandera
    definition: >-
      A Python library for declaring a DataFrame's expected schema -- column names, dtypes, value
      ranges and custom checks -- as data rather than as hand-written if-statements, raising a
      structured error when a frame fails to conform. Not installed in this lesson's environment;
      described from its documentation only.
  - term: Great Expectations
    definition: >-
      A Python library for declaring and running "expectations" about a dataset (row counts, null
      rates, value distributions) as part of a pipeline, with a paid-hosted layer (Great Expectations
      Cloud) built around the free open-source core. Not installed in this lesson's environment;
      described from its documentation only.
  - term: workflow runner
    definition: >-
      Software such as Prefect or Dagster that schedules pipeline runs, retries failed steps, and
      gives operational visibility into what ran and when -- solving a genuinely different problem
      from the correctness a pipeline's own idempotence, determinism and contracts provide. Not
      installed in this lesson's environment; described from documentation only.
  - term: mean imputation
    definition: >-
      Filling a missing value with the column's own mean (Day 125). Idempotent in a pipeline only if
      no later step can reintroduce a missing value into that column -- otherwise a second run can
      compute a different mean from an already-imputed column.
  - term: to_numeric(errors="coerce")
    definition: >-
      A pandas function that converts a column to a numeric dtype, turning any value it cannot parse
      into NaN rather than raising (Day 125). Idempotent on an already-numeric column, because the
      conversion is a no-op once nothing is left to coerce.
  - term: string normalisation
    definition: >-
      Collapsing superficially different text representations of the same value (whitespace, casing,
      known synonyms) to one canonical form (Day 125). Whether it runs before or after deduplication
      changes which rows are recognised as duplicates -- this lesson's central order-dependence
      example.
  - term: reproducibility
    definition: >-
      The property that a pipeline, run again later -- possibly by someone else, on a different
      machine -- produces the documented result. Requires idempotence, determinism, checkpointing and
      a manifest together; no single one of them is sufficient on its own.
  - term: tie-break
    definition: >-
      A secondary sort key named explicitly to give rows with an equal primary-sort value a
      deterministic relative order, independent of the order they happened to arrive in. Without one,
      a "stable" sort merely preserves arrival order, which is not the same thing as a deterministic
      order across two independently built frames.
