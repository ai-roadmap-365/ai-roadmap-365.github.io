visuals:
  - id: pipeline-architecture
    file: assets/pipeline-architecture.svg
    type: diagram
    title: "A reproducible pipeline's architecture: contracts at both boundaries, a checkpoint mid-pipeline, and a manifest collecting hashes"
    alt: 'Diagram: raw input flows through an input contract gate, seven named steps in their declared order — parse currency amount, normalise region strings, deduplicate orders, impute missing amount, clip amount to a fixed ceiling, add amount z-score, sort deterministic — a Parquet checkpoint between the fourth and fifth steps, and an output contract gate, ending in clean output. A manifest box to the side collects four items: the input hash, the config hash, the per-step log, and the output hash.'
    description: >-
      A static architecture diagram of the pipeline this lesson builds. On the left, a raw-input box
      feeds an amber, hexagonal input-contract gate. Seven blue step boxes follow in two rows,
      numbered and named in their declared order, each with a one-line note of what it does (currency
      parsing, region normalisation, deduplication with the resubmitted order_id 3 explicitly named,
      mean imputation, a fixed-ceiling clip, a z-score against fixed reference statistics, and a
      deterministic sort with an explicit tie-break). A green checkpoint icon, drawn as a small
      cylinder labelled ".parquet", sits between the fourth and fifth steps. After the seventh step, a
      second amber output-contract gate leads to a green clean-output box. Off to the side, a purple
      manifest box lists four collected items with dashed purple arrows reaching back to the input
      contract, a small config box, the step log, and the output contract respectively: input_hash,
      config_hash, the full step log, and output_hash. A caption band beneath states that contracts are
      gates the data must pass, the checkpoint means a failure after step four does not require
      re-running steps one through four, and the manifest is what makes "which data produced this
      number?" answerable months later.
  - id: pipeline-flow
    file: assets/pipeline-flow.svg
    type: flow-animated
    title: 'Same input, same artifact -- every time'
    alt: 'Diagram: a token labelled with a row count travels left to right through seven step nodes, shrinking from 7 rows to 6 rows at the dedupe orders step and staying at 6 for the remaining steps, while a step-log panel fills in one line per step as the token passes, ending at an output-hash box; a second, fainter token then repeats the identical journey and lands on the identical hash, with a checkmark confirming the two hashes agree — the same input always gives the same artifact.'
    description: >-
      An animated flow diagram, fully readable as a still image, showing a single frame's journey
      through the seven-step pipeline. A blue token travels along a horizontal rail through seven
      labelled step nodes, each one's border thickening briefly as the token passes it. Above the
      third node (dedupe_orders, drawn in red), a "7 rows" label crossfades to "6 rows" as the token
      passes, staying at 6 for every later step. Below the rail, a step-log panel fills in one line at
      a time, synchronised with the token's progress, each line showing the step's name, rows_in,
      rows_out and delta -- the dedupe_orders line the only one reading delta=-1. The token arrives at
      a green output-hash box showing a truncated SHA-256 digest. A second, fainter purple token then
      repeats the exact same journey along the same rail and arrives at a second hash box showing the
      IDENTICAL digest, with a checkmark and the caption "identical -- run 2 landed on run 1's exact
      hash" fading in. A closing caption band states the argument directly: because every step reads
      its thresholds from configuration rather than from the data passing through it, the same input
      always produces the same artifact, run after run. A prefers-reduced-motion block stops every
      motion, leaving the token at its final position, every step-log line filled in, both hash boxes
      shown in their finished green state, and the checkmark visible, so every fact in the diagram is
      present without motion.
