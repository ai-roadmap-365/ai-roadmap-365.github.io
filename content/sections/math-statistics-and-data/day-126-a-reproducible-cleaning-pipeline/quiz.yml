questions:
  - question: >-
      A clip step computes ceiling = df["amount"].quantile(0.99) and clips to it, every time it runs.
      Run once on raw data, order 7's amount clips to about 1236.5. Run the SAME step again on that
      output, order 7's amount changes to about 1223.675. What property does this step lack?
    options:
      - 'Idempotence -- applying the step twice in a row changes the result a second time'
      - 'A step log -- the step does not record its own row count'
      - 'An output contract -- the step does not check its own result'
      - 'Determinism -- the step produces a different result on different machines'
    answer_index: 0
    explanation: >-
      Idempotence is exactly the property that pipeline(pipeline(df)) equals pipeline(df). This step
      fails it because it recomputes its threshold from whatever data is CURRENTLY passing through
      it -- the second call sees already-clipped data and computes a new, lower ceiling from it. The
      fix is to read a fixed threshold from configuration instead of recomputing it from the frame.
  - question: >-
      Two rows both land on amount == 900.0 after clipping. Sorting by amount alone, using a "stable"
      sort, gives a different relative order for these two rows depending on whether they arrived in
      the DataFrame forward or reversed. What does this demonstrate?
    options:
      - 'A bug in pandas'' sort implementation'
      - 'A stable sort only preserves arrival order among tied values -- it is not the same thing as a deterministic order across two independently built frames, which requires an explicit tie-break'
      - 'Floating-point numbers can never be compared for exact equality'
      - 'The sort should have used quicksort instead of a stable sort'
    answer_index: 1
    explanation: >-
      "Stable" means equal elements keep their relative input order -- it says nothing about what
      that input order was. Two independently built frames with the same two tied values in different
      arrival orders will sort differently unless a secondary key (here, order_id) is named explicitly
      to break the tie. Determinism requires that explicit tie-break; a stable sort alone does not
      provide it.
  - question: >-
      A pipeline's step log shows dedupe_orders with rows_in=7 and rows_out=6, and every other step
      with rows_in equal to the previous step's rows_out. What does this log let you discover that a
      single "N rows in, N rows out" summary would not?
    options:
      - 'The exact runtime of each step in milliseconds'
      - 'Whether the pipeline used .pipe() or sequential function calls'
      - 'Exactly WHICH step changed the row count and by how much, so a step that unexpectedly discards a fifth of the data is caught at that step rather than only noticed in the final total'
      - 'Nothing extra -- the summary and the per-step log carry the same information'
    answer_index: 2
    explanation: >-
      A single before/after row count tells you THAT rows were lost somewhere; a per-step log tells
      you WHERE. Reading the log after the fact is how you discover that one specific step -- not the
      pipeline as a whole -- is quietly discarding rows nobody meant to discard, which the reconciliation
      habit from groupby (Day 123) generalises to an entire multi-step pipeline.
  - question: >-
      A pipeline's input contract requires the "amount" column to have dtype "str". Feeding the
      PIPELINE'S OWN OUTPUT (where "amount" is now float64, exactly as the pipeline is supposed to
      leave it) back into that same contract raises ContractError. Is this a bug in the pipeline?
    options:
      - 'Yes -- a correct pipeline must always accept its own output as valid input'
      - 'Yes -- this proves the pipeline is not idempotent'
      - 'No -- ContractError should never be raised under any circumstances'
      - 'No -- the input contract is a check on freshly-ingested external data specifically, and idempotence is a property of the transformation itself, checked by applying the step functions directly rather than by re-running the input-contract-gated entry point'
    answer_index: 3
    explanation: >-
      The input contract and idempotence are two different, both-necessary checks. The input contract
      protects the pipeline from malformed external data on ingestion; idempotence is a property of
      the step functions themselves, verified by applying them twice in a row directly, not by forcing
      an already-transformed frame back through a contract written for raw input.
  - question: >-
      An output contract asserts "amount" never exceeds the configured clip ceiling. A step is
      sabotaged into a no-op that skips clipping entirely, and the pipeline is re-run. What is the
      point of confirming the contract THEN raises an error, rather than just confirming it does not
      raise an error on normal input?
    options:
      - 'It proves the contract can genuinely catch a real violation, not merely that it happens to agree with correct output -- an untested contract could be vacuously true and would never catch anything'
      - 'There is no point -- if it passes on normal input, that alone proves it works correctly'
      - 'It measures how fast the contract check runs'
      - 'It is only useful for debugging, never for demonstrating correctness'
    answer_index: 0
    explanation: >-
      A check that only ever runs against already-correct data has never actually been exercised --
      it could be written wrong (checking the wrong column, using the wrong comparison) and still
      "pass" every time simply because it never encounters a violation. Deliberately sabotaging a step
      and confirming the contract raises is the only way to prove the contract does real work.
  - question: >-
      Building a DataFrame with steps chained via .pipe() versus the same steps called sequentially,
      one assignment at a time, produce identical output frames. What real, non-cosmetic tradeoff does
      the lesson identify between the two styles?
    options:
      - '.pipe() chains are always faster because pandas optimises them internally'
      - 'Sequential calls cannot use configuration arguments, only .pipe() can'
      - 'There is no real tradeoff; the two styles are interchangeable in every respect'
      - '.pipe() chains read well top to bottom, but there is nowhere to insert a breakpoint or an intermediate df.shape check between two links without breaking the chain apart -- sequential calls give that inspectability for free'
    answer_index: 3
    explanation: >-
      Both styles produce the same result and neither has a performance edge -- .pipe() is composing
      the same function calls, just written differently. The genuine tradeoff is readability against
      inspectability: a .pipe() chain reads as one flowing statement, but debugging an intermediate
      step means breaking the chain apart again, which sequential assignment never requires.
  - question: >-
      A pipeline's data contains a resubmitted order whose region string differs only in whitespace
      and casing from the original (" north" vs "North"). Deduplicating BEFORE normalising region
      strings misses this duplicate; deduplicating AFTER normalising catches it. What does this
      demonstrate about pipeline order?
    options:
      - 'This is a bug in pandas'' string comparison, not a property of step order'
      - 'Some steps commute and some do not -- normalising before deduplicating gives a different, and here more correct, answer than the reverse, so the pipeline must declare its required order and the reason rather than leaving it arbitrary'
      - 'Deduplication should always run first, in every pipeline, as a universal rule'
      - 'Step order never affects the result, only step logic does'
    answer_index: 1
    explanation: >-
      Comparing raw, unnormalised strings treats " north" and "North" as different values, so a
      content-based deduplication run first cannot recognise them as the same order. Running
      normalisation first collapses the casing/whitespace difference before deduplication compares
      rows, catching the duplicate. Neither order is universally "correct" for every dataset -- the
      point is that the choice changes the answer and must be a stated decision, not an accident of
      write order.
  - question: >-
      A Parquet checkpoint of a DataFrame containing a nullable Int64 column with one missing value is
      reloaded, and the reloaded column is still Int64 with the missing value in the same position. Why
      is Parquet used for this checkpoint instead of CSV?
    options:
      - 'Parquet and CSV behave identically for this case; the choice is purely stylistic'
      - 'Parquet files are always smaller than CSV files, which is the only reason to prefer them'
      - 'CSV cannot represent negative numbers'
      - 'CSV round-trips every value through text with no explicit dtype or nullability information, so a nullable Int64 column with a missing value typically comes back as float64 with NaN -- Parquet preserves the schema, including nullability, exactly'
    answer_index: 3
    explanation: >-
      This is Day 121's finding, used directly here: CSV has no way to declare a column's dtype or
      that None specifically means "a missing integer" rather than "a missing float" -- reading it back
      requires re-inferring types from text, and a nullable integer with a gap typically becomes
      float64 with NaN. Parquet stores the schema explicitly, so the round-trip preserves the exact
      dtype and the exact missing-value marker.
