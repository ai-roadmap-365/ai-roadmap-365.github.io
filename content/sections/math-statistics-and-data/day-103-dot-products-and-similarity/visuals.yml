visuals:
  - id: similarity-measures-architecture
    file: assets/similarity-measures-architecture.svg
    type: diagram
    title: 'The same two vectors compared three ways: Euclidean distance, the dot product as a projection, and the angle with its cosine'
    alt: 'Diagram: the same two vectors — a with components 3 and 4, and b with components 10 and 0 — drawn three times, once with the straight segment between their tips labelled 8.0623, once with b''s shadow along a''s direction labelled 6 beneath the dot product 30, and once with the angle between them marked 53.13 degrees and its cosine labelled 0.6, above a band stating what each measure reads and what it ignores'
    description: 'A static architecture diagram carrying the day''s comparison in one picture. The same pair of vectors appears in all three panels and nothing about them changes between the panels — only the question does. The pair is deliberately a 3-4-5 triangle so every number is exact on paper: a is 3 comma 4 with length 5, and b is 10 comma 0 with length 10. Panel one asks "how far apart", draws both vectors from a shared origin on a light grid and joins their tips with a dashed amber segment labelled 8.0623, with the working underneath: a minus b is minus 7 comma 4, and the square root of 49 plus 16 is the square root of 65. Panel two asks "how much of b lies along a", draws a''s direction as a dotted ray extending past its arrowhead, marks b''s shadow on that ray as a thick amber segment labelled shadow equals 6, and drops a dashed grey perpendicular from b''s tip onto the shadow''s end, with the working underneath: a dot b is 3 times 10 plus 4 times 0 equals 30, and 30 divided by the length of a, which is 5, gives 6. Panel three asks "do they point the same way", draws the same two vectors and marks the angle between them with an amber arc labelled 53.13 degrees, noting underneath that the cosine of 53.13 degrees is 0.6 and equals 30 divided by 5 times 10. A blue band across the middle states the identity that ties all three together — a dot b equals the product of the two lengths with the cosine of the angle, which here reads 30 equals 5 times 10 times 0.6 — and observes that panel two is panel three with the two lengths multiplied back in, so dividing them out again is exactly cosine similarity. Three grey panels across the foot state what each measure reads and what it ignores: Euclidean distance reads both lengths and the angle and ignores nothing, which makes it right when magnitude is part of what you mean, as for positions, sizes and counts whose size matters; the dot product also reads everything and is therefore dominated by the longer vector, though its sign alone is free of that, being positive under 90 degrees, zero at 90 and negative above; and cosine similarity reads the angle only and ignores both lengths by construction, since it divides them out, which makes it right when length is an accident of the writing, as it is for text and embeddings. A note records that the vectors are chosen for exact arithmetic rather than taken from data.'
  - id: cosine-vs-euclidean-flow
    file: assets/cosine-vs-euclidean-flow.svg
    type: flow-animated
    title: 'Scaling one vector: the Euclidean gap grows while the angle, and therefore the cosine similarity, stays fixed at 1'
    alt: 'Diagram: one article vector drawn along a ray, then the same article at twice and three times the length marked further out along the identical ray, with a travelling marker and a growing gap reporting 0, then 9.0554, then 18.1108, beside a table where the cosine similarity holds at 1.0000 and the angle at 0 degrees for all three, and the cancellation arithmetic underneath'
    description: 'An animated flow diagram, readable in full as a still image, built entirely from the lesson''s real numbers. The subject is the roast-chicken article from the Day 99 table, drawn in the only two features it actually uses — cooking 9 and money 1 — with a note explaining that the other two features are zero in this article and contribute nothing to any of the numbers shown, which is why leaving them off the picture changes none of them. The left panel draws a single blue ray out from the origin across a light grid, with three blue dots marked along it at 9 comma 1, at 18 comma 2 and at 27 comma 3, labelled 1 times, 2 times and 3 times: the same article, written at twice and three times the length, every count multiplied. An amber marching-dashed bar runs along the ray from the first dot to the third, and an amber token slides outwards from the first dot to the second and then the third and back, pausing at each, so the reader watches the gap open. Amber labels report the Euclidean gap from the 1 times article at each stop: 0.0000, then 9.0554, then 18.1108, with the note that it grows without limit as the writer keeps writing. Beside them, in black, the two numbers that do not move: the angle between every pair here is 0.00 degrees and the cosine similarity is 1.0000, both fixed. The right panel repeats the same three rows as a table of article, length, gap and cosine, with each row lighting up in turn and the cosine column held in a steady green that never dims, because its value never changes. Beneath the table an amber-bordered box gives the comparison that stings: race-day-nutrition, an article mostly about running, sits 8.0623 from roast-chicken, nearer than roast-chicken''s own doubled copy at 9.0554, and its cosine similarity is 0.5514, which is not close to 1.0000 at all. A blue band across the foot supplies the cancellation that makes the cosine exactly 1 rather than merely close to it: v dot 2v is 9 times 18 plus 1 times 2, which is 164; the length of v is 9.055385 and the length of 2v is 18.110770; and 164 divided by their product is 1.0000000000. Scaling multiplies the top and the bottom by the same factor, the factor cancels, and that is an identity rather than a near-miss rounded off. A prefers-reduced-motion block stops every animation and restores the resting state, in which the gap bar is a solid amber line, the token sits at the 1 times dot, all three table rows are shaded, the cosine column is green, and every number, label and line of arithmetic is present.'
