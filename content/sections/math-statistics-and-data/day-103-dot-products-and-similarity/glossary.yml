terms:
  - term: 'Dot product'
    definition: 'Multiply two vectors component by component and add up the results: [1, 2, 3] dot [4, 5, 6] is 4 plus 10 plus 18, which is 32. The answer is a single number, not a vector, which is why it is also called the scalar product. Its geometric meaning is the one that matters: a dot b equals the length of a times the length of b times the cosine of the angle between them. Everything else in this lesson is that identity read in a different direction.'
  - term: 'Projection'
    definition: 'How much of one vector lies along another — the length of the shadow b casts on a''s direction when the light shines straight down. The scalar projection is (a dot b) divided by the length of a; the vector projection is that length pointed along a. On the lesson''s 3-4-5 example, b of length 10 casts a shadow of length 6 on a. Note the asymmetry: projecting a onto b instead gives 3, because you have chosen a different surface to cast the shadow on, even though the dot product itself is the same either way.'
  - term: 'Cosine similarity'
    definition: 'The cosine of the angle between two vectors: the dot product divided by both lengths, or equivalently the plain dot product of the two unit vectors. It runs from 1 for the same direction, through 0 for perpendicular, to -1 for opposite. Dividing by both lengths is what makes it magnitude-free by construction rather than by convention — scale either vector by any positive number and the top and the bottom are multiplied by the same factor, which cancels. That is why an article and its doubled copy score exactly 1.0 rather than approximately 1.0.'
  - term: 'Cosine distance'
    definition: '1 minus the cosine similarity, so 0 for the same direction, 1 for perpendicular and 2 for opposite. Called a distance because it grows as things get less alike, and it is not a metric: it fails the triangle inequality, and it gives 0 for pairs that are not equal. On count vectors, where nothing is negative, no pair can be more than 90 degrees apart, so the value never exceeds 1 and orthogonal is as far apart as two documents get.'
  - term: 'Euclidean distance'
    definition: 'The straight-line distance between two points: the length of their difference, from Pythagoras. Day 99''s measure, and still the right one whenever magnitude is part of what you mean — physical positions, sizes, counts whose size you care about. It is the wrong one for text, because the length of a document is mostly a fact about the writer rather than about the subject, and Euclidean distance reads that length as if it were meaning.'
  - term: 'Orthogonal'
    definition: 'At right angles: the dot product is exactly 0 and the cosine similarity is exactly 0. The word to reach for is unrelated, not opposed — opposed is a cosine of -1. In the lesson''s table, roast-chicken and storm-bulletin are orthogonal because wherever one has a count the other has none, so every product in the sum is 0. They share no vocabulary at all, and nothing you learn about one tells you anything about the other.'
  - term: 'Unit vector'
    definition: 'A vector of length exactly 1, carrying direction and nothing else. Every vector except the zero vector has one pointing the same way, obtained by dividing by its own length. Two unit vectors compared with the dot product give their cosine similarity directly, with no division left to do — which is the whole reason a vector store normalises on the way in.'
  - term: 'Normalisation'
    definition: 'Rescaling a vector to length 1 by dividing every component by its length. In this lesson it is not a tidying step done out of habit; it is the step that makes cosine similarity and Euclidean distance interchangeable. On normalised vectors the two rank identically, so the choice between them becomes a performance decision. Skip it, and which one you picked changes the answers.'
  - term: 'Angle'
    definition: 'The measure of how far apart two directions are, from 0 degrees for the same direction to 180 for opposite. Recovered from the cosine similarity with arccos, and worth knowing about mostly because it behaves better than the cosine distance does: on the lesson''s failing triple the angles satisfy the triangle inequality exactly where 1 minus cosine does not. Any code that turns a similarity into an angle must clamp the similarity into the range -1 to 1 first, because floating-point rounding can put it a hair outside and arccos refuses.'
  - term: 'Metric'
    definition: 'A distance function satisfying four conditions: never negative, zero exactly when the two things are the same, symmetric, and obeying the triangle inequality. Euclidean distance is a metric; cosine distance is not, failing two of the four. This is not pedantry — a great deal of fast-search machinery prunes whole branches using the triangle inequality, and given a function that fails it, such an index still returns answers, some of them wrong, and nothing says so.'
  - term: 'Triangle inequality'
    definition: 'The rule that going direct is never longer than going via a detour: d(a, c) is at most d(a, b) plus d(b, c). The lesson breaks it with three two-dimensional vectors, a of 1 comma 0, b of 1 comma 1 and c of 0 comma 1: the two cosine distances are 0.292893 each, summing to 0.585786, while the direct distance is 1.000000. The direct route is longer than the detour, which is a counter-example, and one counter-example is a complete proof of the negative.'
  - term: 'Semantic search'
    definition: 'Retrieval by meaning rather than by keyword. Turn every document into a vector, turn the query into a vector the same way, and return the documents whose vectors point most nearly the same way as the query. The core is four lines: score everything with cosine similarity, sort, take the top few. Everything a production system adds is about getting better vectors and searching many more of them quickly.'
  - term: 'Curse of dimensionality'
    definition: 'The collection of surprises that appear as the number of dimensions grows and that have no analogue in two or three. Two of them are measured in this lesson. Random directions become nearly orthogonal — mean absolute cosine fell from 0.6435 at dimension 2 to 0.0089 at dimension 8192 in the captured run — and distances concentrate, with the furthest of 500 random points going from 63.7 times as far as the nearest at dimension 2 to 1.05 times at dimension 8192. The practical consequence is that a similarity score means nothing until you know the dimension it came from.'
  - term: 'Embedding'
    definition: 'A vector produced by a trained model to represent an item — a word, a sentence, a document, an image — such that items with similar meanings get vectors pointing in similar directions. The lesson''s six four-component tables are hand-counted stand-ins with features chosen by a person; a real embedding has hundreds or thousands of components whose individual meanings nobody assigned. Everything else is the same: a row of numbers per item, and similarity measured with a cosine.'
  - term: 'Scalar'
    definition: 'A single number, as opposed to a vector. The dot product of two vectors is a scalar, which is why it is also called the scalar product, and it is worth saying out loud because it is the point where a pile of numbers becomes one comparable answer.'
  - term: 'Zero vector'
    definition: 'The vector whose every component is 0. It has length 0 and therefore no direction, so there is no unit vector pointing the same way and no angle between it and anything else. Cosine similarity is genuinely undefined for it, and the honest implementation raises rather than returning NaN — an empty document is a real thing that happens in a pipeline, and a NaN sorts unpredictably and spreads through every average it touches.'
  - term: 'Clamping'
    definition: 'Forcing a value back inside a valid range before using it. A vector compared with itself should give a cosine of exactly 1.0, and floating-point rounding sometimes gives a hair more: three of this lesson''s six articles miss exact 1.0 through the unguarded formula, and race-day-nutrition comes out at 1.0000000000000002, which arccos refuses outright. One line — max of -1 and the min of 1 and the value — removes the whole class of failure.'
  - term: 'Ranking'
    definition: 'The ordered list a search returns, best first. Two facts about it carry through the day: on normalised vectors, ranking by cosine and ranking by Euclidean distance produce the identical order, so the choice is about speed rather than meaning; and ties must be broken by something deterministic, or the same query returns different orders on different runs and a test suite starts failing at random.'
