<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why cosine ignores magnitude</title>
  <style>
    .cosine-magnitude-free-bg   { fill: #f8fafc; }
    .cosine-magnitude-free-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-magnitude-free-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-magnitude-free-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-magnitude-free-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-magnitude-free-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-magnitude-free-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cosine-magnitude-free-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cosine-magnitude-free-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cosine-magnitude-free-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cosine-magnitude-free-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cosine-magnitude-free-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cosine-magnitude-free-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cosine-magnitude-free-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cosine-magnitude-free-stage { opacity: 1; }

    .cosine-magnitude-free-s0 { animation-delay: 0.00s; }
    .cosine-magnitude-free-e0 { animation-delay: 0.00s; }
    .cosine-magnitude-free-s1 { animation-delay: 1.28s; }
    .cosine-magnitude-free-e1 { animation-delay: 1.28s; }
    .cosine-magnitude-free-s2 { animation-delay: 2.56s; }
    .cosine-magnitude-free-e2 { animation-delay: 2.56s; }
    .cosine-magnitude-free-s3 { animation-delay: 3.84s; }
    .cosine-magnitude-free-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cosine-magnitude-free-conn  { animation: cosine-magnitude-free-trace 6.4s ease-in-out infinite; }
      .cosine-magnitude-free-stage { animation: cosine-magnitude-free-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cosine-magnitude-free-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cosine-magnitude-free-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cosine-magnitude-free-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cosine-magnitude-free-stage { animation: cosine-magnitude-free-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cosine-magnitude-free-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cosine-magnitude-free-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cosine-magnitude-free-bg" width="980" height="322"/>
  <text class="cosine-magnitude-free-h1"  x="30" y="40">Why cosine ignores magnitude</text>
  <text class="cosine-magnitude-free-sub" x="30" y="64">Four steps.</text>
  <g class="cosine-magnitude-free-stage cosine-magnitude-free-s0">
    <rect class="cosine-magnitude-free-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cosine-magnitude-free-step" x="44" y="142">01</text>
    <text class="cosine-magnitude-free-name" x="70" y="142">The dot product grows with both vectors' lengths</text>
    <text class="cosine-magnitude-free-desc" x="44" y="166">So a long document scores higher</text>
    <text class="cosine-magnitude-free-desc" x="44" y="182">regardless of topic.</text>
  </g>
  <line class="cosine-magnitude-free-line cosine-magnitude-free-conn cosine-magnitude-free-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cosine-magnitude-free-tip)"/>
  <g class="cosine-magnitude-free-stage cosine-magnitude-free-s1">
    <rect class="cosine-magnitude-free-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cosine-magnitude-free-step" x="280" y="142">02</text>
    <text class="cosine-magnitude-free-name" x="306" y="142">Divide by both magnitudes</text>
    <text class="cosine-magnitude-free-desc" x="280" y="166">Which cancels the length</text>
    <text class="cosine-magnitude-free-desc" x="280" y="182">entirely.</text>
  </g>
  <line class="cosine-magnitude-free-line cosine-magnitude-free-conn cosine-magnitude-free-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cosine-magnitude-free-tip)"/>
  <g class="cosine-magnitude-free-stage cosine-magnitude-free-s2">
    <rect class="cosine-magnitude-free-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cosine-magnitude-free-step" x="516" y="142">03</text>
    <text class="cosine-magnitude-free-name" x="542" y="142">Leaving a value between minus one and one</text>
    <text class="cosine-magnitude-free-desc" x="516" y="166">The cosine of the angle between</text>
    <text class="cosine-magnitude-free-desc" x="516" y="182">them.</text>
  </g>
  <line class="cosine-magnitude-free-line cosine-magnitude-free-conn cosine-magnitude-free-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cosine-magnitude-free-tip)"/>
  <g class="cosine-magnitude-free-stage cosine-magnitude-free-s3">
    <rect class="cosine-magnitude-free-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cosine-magnitude-free-step" x="752" y="142">04</text>
    <text class="cosine-magnitude-free-name" x="778" y="142">So only direction remains</text>
    <text class="cosine-magnitude-free-desc" x="752" y="166">Which is what topic similarity</text>
    <text class="cosine-magnitude-free-desc" x="752" y="182">should depend on.</text>
  </g>
  <text class="cosine-magnitude-free-sub" x="30" y="304">Length independence is precisely what text retrieval needs, since document length is an artefact of formatting rather than a fact about meaning.</text>
</svg>
