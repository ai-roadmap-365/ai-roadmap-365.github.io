<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Direction, not distance travelled.">
  <title>Comparing bearings</title>
  <style>
    .compass-bearing-bg   { fill: #f8fafc; }
    .compass-bearing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compass-bearing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compass-bearing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compass-bearing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compass-bearing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compass-bearing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compass-bearing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compass-bearing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compass-bearing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compass-bearing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compass-bearing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compass-bearing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compass-bearing-row { opacity: 1; }
    .compass-bearing-r0 { animation-delay: 0.00s; }
    .compass-bearing-r1 { animation-delay: 0.45s; }
    .compass-bearing-r2 { animation-delay: 0.90s; }
    .compass-bearing-r3 { animation-delay: 1.35s; }
    .compass-bearing-r4 { animation-delay: 1.80s; }
    .compass-bearing-row { animation: compass-bearing-reveal 7.3s ease-in-out infinite; }
    @keyframes compass-bearing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="compass-bearing-bg" width="980" height="390"/>
  <text class="compass-bearing-h1"  x="30" y="40">Comparing bearings</text>
  <text class="compass-bearing-sub" x="30" y="64">Direction, not distance travelled.</text>
  <rect class="compass-bearing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="compass-bearing-name" x="46" y="122">How far each went</text>
  <text class="compass-bearing-desc" x="46" y="142">Magnitude.</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r0" x="46" y="182">One walked ten miles, one walked one</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r1" x="46" y="216">Very different numbers</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r2" x="46" y="250">Says nothing about where they went</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r3" x="46" y="284">Two people going the same way look different</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r4" x="46" y="318">This is the raw dot product</text>
  <rect class="compass-bearing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="compass-bearing-name" x="526" y="122">Which way each faced</text>
  <text class="compass-bearing-desc" x="526" y="142">Direction.</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r0" x="526" y="182">Both headed north-east</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r1" x="526" y="216">The same bearing</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r2" x="526" y="250">Says exactly where they went</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r3" x="526" y="284">Two people going the same way look identical</text>
  <text class="compass-bearing-desc compass-bearing-row compass-bearing-r4" x="526" y="318">This is cosine similarity</text>
  <text class="compass-bearing-sub" x="30" y="372">Two travellers heading the same way should count as similar however far each went, which is exactly the judgment cosine similarity encodes.</text>
</svg>
