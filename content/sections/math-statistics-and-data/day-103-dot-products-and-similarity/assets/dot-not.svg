<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things cosine similarity is not</title>
  <style>
    .dot-not-bg   { fill: #f8fafc; }
    .dot-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dot-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dot-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dot-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dot-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dot-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dot-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dot-not-row { opacity: 1; }
    .dot-not-r0 { animation-delay: 0.00s; }
    .dot-not-r1 { animation-delay: 0.45s; }
    .dot-not-r2 { animation-delay: 0.90s; }
    .dot-not-r3 { animation-delay: 1.35s; }
    .dot-not-r4 { animation-delay: 1.80s; }
    .dot-not-row { animation: dot-not-reveal 7.3s ease-in-out infinite; }
    @keyframes dot-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dot-not-bg" width="980" height="390"/>
  <text class="dot-not-h1"  x="30" y="40">Four things cosine similarity is not</text>
  <text class="dot-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="dot-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dot-not-name" x="46" y="122">The misconception</text>
  <text class="dot-not-desc" x="46" y="142">Commonly held.</text>
  <text class="dot-not-desc dot-not-row dot-not-r0" x="46" y="182">A similarity of 0.8 means eighty percent alike</text>
  <text class="dot-not-desc dot-not-row dot-not-r1" x="46" y="216">Cosine distance is a proper metric</text>
  <text class="dot-not-desc dot-not-row dot-not-r2" x="46" y="250">It works equally well at any dimension</text>
  <text class="dot-not-desc dot-not-row dot-not-r3" x="46" y="284">It accounts for magnitude</text>
  <text class="dot-not-desc dot-not-row dot-not-r4" x="46" y="318">High similarity means semantically related</text>
  <rect class="dot-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dot-not-name" x="526" y="122">What is true</text>
  <text class="dot-not-desc" x="526" y="142">Actually.</text>
  <text class="dot-not-desc dot-not-row dot-not-r0" x="526" y="182">The scale is not a percentage of anything</text>
  <text class="dot-not-desc dot-not-row dot-not-r1" x="526" y="216">It fails the triangle inequality</text>
  <text class="dot-not-desc dot-not-row dot-not-r2" x="526" y="250">Similarities concentrate as dimensions grow</text>
  <text class="dot-not-desc dot-not-row dot-not-r3" x="526" y="284">It removes magnitude deliberately</text>
  <text class="dot-not-desc dot-not-row dot-not-r4" x="526" y="318">It means near in whatever space was learned</text>
  <text class="dot-not-sub" x="30" y="372">The last row is the one that matters for retrieval: the similarity reflects the embedding model's notion of nearness, which may not be the one you wanted.</text>
</svg>
