<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three cases.">
  <title>Reading the sign</title>
  <style>
    .sign-angle-bg   { fill: #f8fafc; }
    .sign-angle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-angle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-angle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-angle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-angle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-angle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sign-angle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sign-angle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sign-angle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sign-angle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sign-angle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sign-angle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sign-angle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sign-angle-stage { opacity: 1; }

    .sign-angle-s0 { animation-delay: 0.00s; }
    .sign-angle-e0 { animation-delay: 0.00s; }
    .sign-angle-s1 { animation-delay: 1.50s; }
    .sign-angle-e1 { animation-delay: 1.50s; }
    .sign-angle-s2 { animation-delay: 3.00s; }
    .sign-angle-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .sign-angle-conn  { animation: sign-angle-trace 6s ease-in-out infinite; }
      .sign-angle-stage { animation: sign-angle-arrive 6s ease-in-out infinite; }
    }
    @keyframes sign-angle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sign-angle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sign-angle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sign-angle-stage { animation: sign-angle-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sign-angle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sign-angle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sign-angle-bg" width="980" height="322"/>
  <text class="sign-angle-h1"  x="30" y="40">Reading the sign</text>
  <text class="sign-angle-sub" x="30" y="64">Three cases.</text>
  <g class="sign-angle-stage sign-angle-s0">
    <rect class="sign-angle-good" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="sign-angle-step" x="44" y="142">01</text>
    <text class="sign-angle-name" x="70" y="142">Positive: the angle is less than a right angle</text>
    <text class="sign-angle-desc" x="44" y="166">They point broadly the same way.</text>
  </g>
  <line class="sign-angle-line sign-angle-conn sign-angle-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#sign-angle-tip)"/>
  <g class="sign-angle-stage sign-angle-s1">
    <rect class="sign-angle-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="sign-angle-step" x="359" y="142">02</text>
    <text class="sign-angle-name" x="385" y="142">Zero: exactly perpendicular</text>
    <text class="sign-angle-desc" x="359" y="166">No shared direction at all.</text>
  </g>
  <line class="sign-angle-line sign-angle-conn sign-angle-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#sign-angle-tip)"/>
  <g class="sign-angle-stage sign-angle-s2">
    <rect class="sign-angle-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="sign-angle-step" x="674" y="142">03</text>
    <text class="sign-angle-name" x="700" y="142">Negative: more than a right angle</text>
    <text class="sign-angle-desc" x="674" y="166">They point broadly opposite ways.</text>
  </g>
  <text class="sign-angle-sub" x="30" y="304">Perpendicularity meaning no shared direction is the reading that makes orthogonality intuitive, and it is why independent features are described as orthogonal.</text>
</svg>
