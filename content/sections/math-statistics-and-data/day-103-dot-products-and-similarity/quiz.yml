questions:
  - question: 'An article is rewritten at twice the length: every word count doubled, same subject, same emphasis. Its vector goes from v to 2v. What is the cosine similarity between the two versions?'
    options:
      - 'About 0.5, because one is twice the size of the other'
      - 'Exactly 1.0, because they point in the same direction'
      - 'Exactly 2.0, because the similarity scales with the vector'
      - 'It depends on how long the original article was'
    answer_index: 1
    explanation: 'Cosine similarity divides the dot product by BOTH lengths, and that is the whole mechanism. Scale either vector by any positive number and the top and the bottom are multiplied by the same factor, which cancels exactly — not approximately. With the lesson''s numbers: v dot 2v is 9 times 18 plus 1 times 2, which is 164, and 164 divided by 9.055385 times 18.110770 is 1.0000000000. Option 1 is the tempting one and it is precisely wrong: the original''s length appears in the numerator and the denominator and leaves no trace in the answer. The point is not that cosine is a nicer number here; it is that "how long is this document" and "what is this document about" are different questions, and cosine answers only the second. Note also what it gives up in exchange — it can no longer tell v from 2v at all, which is a failure of the metric conditions and, for text, exactly what you wanted.'

  - question: 'Two vectors have a dot product of -6. What do you know about the angle between them?'
    options:
      - 'It is less than 90 degrees, but one vector has negative components'
      - 'It is exactly 180 degrees — they are direct opposites'
      - 'It is more than 90 degrees — they point in broadly opposing directions'
      - 'Nothing, because the dot product depends on the lengths too'
    answer_index: 2
    explanation: 'a dot b equals the length of a times the length of b times the cosine of the angle, and lengths are never negative. So the sign of the dot product is the sign of the cosine, and the sign of the cosine tells you which side of 90 degrees the angle is on: positive means under 90, zero means exactly 90, negative means over 90. The magnitude of -6 depends on the lengths and tells you little on its own; the SIGN does not depend on them at all. Option 1 over-reads it — the lesson''s worked case a of 3 comma 0 against b of minus 2 comma 2 has a dot product of -6 and an angle of 135 degrees, not 180. This is genuinely useful: when all you need is the direction of a relationship, the raw dot product answers it and you can skip both square roots.'

  - question: 'Why does cosine similarity ignore the magnitudes of the two vectors?'
    options:
      - 'Because it is defined only for unit vectors, so magnitudes never arise'
      - 'Because the implementation rounds small differences away'
      - 'Because it uses only the largest component of each vector'
      - 'It divides by both lengths, so any scaling cancels'
    answer_index: 3
    explanation: 'This is construction, not convention or approximation. cos(theta) equals (a dot b) divided by the length of a times the length of b. Replace a with k times a for any positive k and the numerator gains a factor of k while the denominator gains the same factor, so the quotient is unchanged. That is why an article and its doubled copy score exactly 1.0 rather than 0.999-something, and why in the lesson''s search the query [1, 0, 0, 0], the query [3, 0, 0, 0] and the query [100, 0, 0, 0] rank the catalogue identically to ten decimal places. Option 0 has a grain of truth worth keeping: cosine similarity IS the plain dot product of the two unit vectors, which is the same statement rearranged, and it is why a vector store normalises once on the way in and then never divides again.'

  - question: 'You have a set of embeddings and you normalise every one of them to length 1. You then rank a catalogue against a query, once by cosine similarity descending and once by Euclidean distance ascending. What do you get?'
    options:
      - 'The same order, but different scores'
      - 'The same order and the same scores'
      - 'The same order only if the vectors have no negative components'
      - 'Two different orders, because the two measures answer different questions'
    answer_index: 0
    explanation: 'For unit vectors u and v, expanding the square of the distance gives (u dot u) minus twice (u dot v) plus (v dot v), which is 2 minus twice the cosine. So the distance is the square root of 2 minus 2cos: strictly decreasing in the cosine, with no flat stretches and no exceptions. Sorting by one is exactly the reverse of sorting by the other. This is the fact that lets a vector database normalise on the way in and then use whichever comparison its hardware runs faster — the choice becomes a performance decision rather than a semantic one. But the scores are NOT the same, and that is the part people get wrong in practice: a cut-off of "similarity above 0.9" is "distance below 0.447214", and nothing about the second number is guessable from the first. Only the order is preserved.'

  - question: 'Take a = [1, 0], b = [1, 1] and c = [0, 1]. Their cosine distances are d(a,b) = 0.292893, d(b,c) = 0.292893 and d(a,c) = 1.0. What does this show?'
    options:
      - 'A bug in the implementation, since 1.0 should not be reachable'
      - 'That cosine distance fails the triangle inequality and is therefore not a metric'
      - 'That the three vectors were badly chosen and a better triple would behave'
      - 'That cosine distance and Euclidean distance disagree on these vectors'
    answer_index: 1
    explanation: 'Going via b costs 0.292893 plus 0.292893, which is 0.585786. Going direct costs 1.0. The detour is CHEAPER than the direct route, which is exactly what the triangle inequality forbids, and one counter-example is a complete proof of the negative. This is not fixable with a better triple, and it is not a bug: it follows from the definition. It also matters practically. Ball trees, KD-trees and metric indexes prune whole branches by reasoning "everything down here is too far away to contain the answer", and that reasoning IS the triangle inequality. Hand such an index a function that fails it and it will still return answers, some of them wrong, with nothing in the output to say so. The fix is not to avoid cosine: normalise your vectors and give the index Euclidean distance, which is a metric, knowing the ranking is identical.'

  - question: 'When is Euclidean distance the RIGHT choice rather than cosine similarity?'
    options:
      - 'When the vectors are long, since cosine loses precision at scale'
      - 'Never; cosine similarity is strictly better for every kind of data'
      - 'When magnitude is part of what you mean'
      - 'Only when the data has exactly two or three dimensions'
    answer_index: 2
    explanation: 'The whole day is a case for asking which question you want answered, not a case against Euclidean distance. If your vectors are coordinates on a map, the distance between them IS the answer, and normalising them would throw away the thing you care about — two cities in the same compass direction from you are not "the same place". The same holds for sensor readings where the size of the reading is the signal, for physical dimensions, and for counts you genuinely want the size of: a warehouse holding 10 of each item and one holding 1000 of each are pointing in the same direction and are not interchangeable. Cosine is right for text and embeddings precisely because there the length is mostly a fact about the writer rather than the subject. Neither measure is better; one of them matches your question. Option 0 inverts the truth about precision — the normalising divisions are cheap and stable, and the failure mode this lesson actually measured was a cosine rounding one bit past 1.0, fixed by a clamp.'

  - question: 'Two articles have a dot product of exactly 0. What does that mean about them?'
    options:
      - 'They are about opposite things — one contradicts the other'
      - 'They are identical, since there is no difference to measure'
      - 'At least one of them is the zero vector'
      - 'They are unrelated: wherever one has a count, the other has none'
    answer_index: 3
    explanation: 'A dot product of 0 means orthogonal, and the English word for orthogonal is unrelated, not opposed. Opposed is a cosine of -1, which for count vectors is unreachable because no count is negative. In the lesson''s table, roast-chicken [9, 0, 1, 0] and storm-bulletin [0, 1, 0, 9] give 9 times 0 plus 0 times 1 plus 1 times 0 plus 0 times 9, which is 0 — every single product is 0 because wherever one article has a count the other has none. They share no vocabulary at all, and knowing something about one tells you nothing about the other. Option 3 describes a different situation the lab treats separately: the zero vector has no direction, so cosine similarity against it is undefined and the lab raises ValueError rather than returning NaN.'

  - question: 'You measure the mean absolute cosine similarity between pairs of random vectors as the number of dimensions rises. In the lesson''s captured run it fell from 0.6435 at dimension 2 to 0.0089 at dimension 8192. What should you conclude?'
    options:
      - 'In high dimensions random directions are nearly orthogonal'
      - 'That the random generator is biased at high dimensions'
      - 'That cosine similarity stops working above a few hundred dimensions'
      - 'That the vectors should have been normalised before measuring'
    answer_index: 0
    explanation: 'This is the curse of dimensionality, and it is measured rather than asserted: the run tracked the exact value gamma(d/2) divided by the square root of pi times gamma((d+1)/2) to within 1.5% at every dimension. In two dimensions two random directions are quite likely to point similar ways by accident; in 8192 dimensions there is so much room that they almost never do, and 100% of the sampled pairs landed within 10 degrees of a right angle. The consequence is about reading scores, not about the measure breaking: a similarity of 0.3 is unremarkable in 2 dimensions and a strong signal in 1000, so "above 0.8 means relevant" is a claim about one model in one space rather than a general fact. Calibrate against your own data. Option 3 is a good instinct in the wrong place — normalisation does not change a cosine at all, since it divides by the lengths anyway.'
