title: 'Dot Products and Similarity'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 15
learning_promise: 'After this lesson you will be able to say which of two questions you are actually asking — "how far apart are these" or "do these point the same way" — and pick the measure that answers it, because you will have watched Euclidean distance get the answer wrong on real numbers you can check with a pen. You will know what the dot product means geometrically rather than only how to compute it, read its sign as an angle without touching a calculator, and see cosine similarity for what it is: the same dot product with both lengths divided out, and therefore magnitude-free by construction rather than by convention. You will implement the dot product, cosine similarity and cosine distance in fifteen lines of pure Python, assert them against NumPy, and build a working semantic search on top of them. You will be able to prove that on normalised vectors ranking by cosine and ranking by Euclidean distance give the identical order — which is why a vector database normalises on the way in and then uses whichever is faster — and to produce a concrete triple where cosine distance fails the triangle inequality, so you know what breaks in a pruning index if you hand it a distance that is not a metric. And you will have measured the curse of dimensionality yourself, watching mean absolute cosine fall from 0.6435 at two dimensions to 0.0089 at 8192, which changes how you read every similarity score you will ever see.'
objectives:
  - 'Reproduce the failure that motivates the day: Euclidean distance placing an article''s own doubled copy 9.0554 away while a genuinely different article sits at 8.0623, and explain why the distance between v and 2v is exactly the length of v'
  - 'State the geometric meaning of the dot product, a dot b equals the product of both lengths with the cosine of the angle, and compute the scalar and vector projection of one vector onto another'
  - 'Read the sign of a dot product as an angle — positive under 90 degrees, zero at exactly 90, negative above — and give a worked example of each'
  - 'Define cosine similarity as the dot product of the two unit vectors, explain why that makes it magnitude-free by construction, and state what the ends of its range from -1 to 1 mean'
  - 'Define cosine distance as 1 minus the similarity, and demonstrate on a concrete triple that it fails the triangle inequality and is therefore not a metric'
  - 'Derive the identity that the distance between two unit vectors is the square root of 2 minus twice their cosine, and use it to prove that both measures rank normalised vectors identically'
  - 'Implement dot, cosine similarity and cosine distance from first principles in pure Python, assert them against NumPy, and guard the zero vector and the floating-point overshoot past 1.0 that this lab actually measured'
  - 'Build a working semantic search from a cosine ranking over an embedding table, and defend the tie-breaking rule that makes the ranking deterministic'
  - 'Say when Euclidean distance is the right choice — when magnitude carries meaning, as in physical positions and counts whose size you care about — and give an example of each'
  - 'Explain orthogonality as "unrelated rather than opposed", and identify the pairs in a small embedding table that are exactly orthogonal and why'
  - 'Measure the curse of dimensionality with a seeded generator, report what mean absolute cosine and distance concentration actually did, and say what it changes about reading a raw similarity score'
  - 'Compare NumPy, scipy.spatial.distance and the similarity options a vector store exposes, state which of them was actually run here, and connect the whole day to retrieval: "find the most relevant chunk" is cosine similarity against an index'
prerequisites:
  - 'Day 99 — vectors, components, the L2 norm, unit vectors, normalisation and Euclidean distance. This lesson uses the identical six-article table and asks it a better question'
  - 'Day 101 — the dot product computed mechanically. Today it gets its geometric meaning'
  - 'Day 102 — linear transformations, which is where the idea of a vector having a direction independent of its length was made concrete'
  - 'Day 70 — floating point, which is why every comparison here declares a tolerance and why the lab clamps a cosine into its valid range'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'Day 43 — python3 -m venv and installing a package with pip; the lab installs numpy and pytest into a lab-local environment'
  - 'No mathematics beyond school arithmetic. Every symbol is defined where it first appears and every worked number can be re-derived with a pen'
