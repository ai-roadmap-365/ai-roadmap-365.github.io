terms:
  - term: 'Norm'
    definition: 'A function that takes one vector and returns its size. To earn the name it must satisfy four requirements: it is never negative; it is zero only for the zero vector; scaling a vector by k scales its size by the absolute value of k (absolute homogeneity); and the size of a sum is never more than the sum of the sizes (the triangle inequality). Squared Euclidean distance fails the third of those and is therefore not a norm, whatever it is called in the paper you are reading.'
  - term: 'p-norm'
    definition: 'The single formula that generates the whole family: raise every absolute component to the power p, add them, and take the p-th root. p = 1 gives L1, p = 2 gives L2, and letting p run to infinity gives L-infinity. The value falls as p rises and never falls below the largest single component. Below p = 1 the formula still returns a number, but the triangle inequality fails and it is no longer a norm — which is why a careful implementation refuses it rather than answering. Also called the Minkowski norm, after Hermann Minkowski, whose Geometrie der Zahlen of 1896 studied the geometry that results from replacing the round unit circle with a different convex shape.'
  - term: 'L1 norm'
    definition: 'The sum of absolute values, and the distance built from it is Manhattan or taxicab distance. Every unit of difference costs the same wherever it occurs, so ten features each one out costs exactly what one feature ten out costs. Its unit ball is a diamond, with corners sitting on the axes — which is precisely why L1 regularisation drives coefficients to exactly zero and produces sparse models where L2 does not. Correct whenever movement is constrained to the axes, and often the better choice in very high dimensions.'
  - term: 'L2 norm'
    definition: 'The square root of the sum of squares, and the distance built from it is Euclidean distance: ordinary straight-line separation. Its unit ball is the familiar circle, and it is the only member of the family that ordinary geometry hands you. Squaring before summing means one large disagreement costs far more than several small ones adding to the same total, which is a real difference in behaviour and not a technicality: on four part dimensions, four errors of 0.04 cost less under L2 than one error of 0.09, and more under L1.'
  - term: 'L-infinity norm'
    definition: 'The largest single absolute component, computed as the limit of the p-norm rather than by substituting infinity into the formula, which overflows. The distance built from it is Chebyshev distance. Every feature except the worst one is ignored entirely, which sounds like a weakness until you meet an acceptance rule of the form "no dimension may be out by more than X" — that rule is an L-infinity ball and cannot be expressed as anything else. Its unit ball is a square. It also predicts the finishing time of a two-axis machine whose motors run simultaneously, since the slower axis alone decides.'
  - term: 'Metric'
    definition: 'A distance function of two arguments satisfying four axioms: non-negativity; zero exactly when the two arguments are equal; symmetry; and the triangle inequality. Not a compliment but a checklist, and the reason to care is entirely practical — ball trees, KD-trees, cover trees and every metric-space pruning scheme are built on the fourth axiom. The framework was extracted rather than invented: Maurice Fréchet stripped distance down to these properties in his 1906 doctoral thesis, and Felix Hausdorff gave the resulting object its name in Grundzüge der Mengenlehre in 1914.'
  - term: 'Triangle inequality'
    definition: 'The requirement that a detour can never be shorter than going direct: d(x, z) is at most d(x, y) plus d(y, z). It is what allows an index to skip a region of the dataset without opening it — if the query is 10 from a cluster centre and the cluster has radius 2, nothing inside can be nearer than 8. Cosine distance breaks it: from (1, 0) to (0, 1) costs 1.0 direct and 0.585786 via (1, 1). An exhaustive sweep of all 3375 triples of non-zero four-bit vectors finds 326 violations, while Jaccard distance and Hamming distance survive all 4096 triples of their own sweeps.'
  - term: 'Manhattan distance'
    definition: 'The L1 distance: the sum of the absolute differences, feature by feature. Named for the street grid, with the phrase "taxicab geometry" popularised by Karl Menger in the 1950s. It is the correct and exact answer whenever movement is axis-by-axis rather than diagonal — for a warehouse picker walking aisles, six metres across and eight along really is fourteen metres, and the Euclidean answer of ten is a distance nobody can travel.'
  - term: 'Chebyshev distance'
    definition: 'The L-infinity distance: the largest single absolute difference. Named after Pafnuty Chebyshev (1821-1894), whose approximation theory minimises the worst error rather than the total one. It is the measure hiding inside every tolerance specification, and it is the one that will accept a part that is slightly out on every dimension while rejecting a part that is exact on all but one. Both L1 and L2 rank those two the other way round, and both are answering a question the inspection department did not ask.'
  - term: 'Hamming distance'
    definition: 'The number of positions at which two equal-length sequences differ. Introduced by Richard Hamming in "Error Detecting and Error Correcting Codes" in the Bell System Technical Journal in April 1950, where it counted bit flips between code words. Nothing is subtracted, so the values need not be numbers at all — which makes it the right measure for categorical features, and the honest alternative to encoding categories as 0, 1, 2 and thereby asserting that the second category is nearer to the first than the third is. On genuinely binary features it coincides exactly with L1 and with squared Euclidean distance, because every difference is 0 or 1 and 1 squared is 1.'
  - term: 'Jaccard similarity'
    definition: 'The size of the intersection divided by the size of the union of two sets: 1 for identical, 0 for disjoint. Published by the Swiss botanist Paul Jaccard in 1901 while comparing the plant species found at different alpine sites, which is exactly the situation of two lists of very different lengths. Because the union sits in the denominator, everything the two do not share is charged for in both directions — so an eleven-ingredient recipe containing all four ingredients you asked for scores 0.3636 while a three-ingredient recipe sharing two scores 0.4000. Unlike cosine distance, 1 minus Jaccard similarity is a genuine metric.'
  - term: 'Cosine similarity'
    definition: 'The dot product of two vectors divided by both their lengths: 1 for the same direction, 0 for perpendicular. Day 103 derived it. Length is divided out, which is the entire point and the entire limitation — a document three times as long with the same term mix scores exactly 1.0, and so does the same document repeated twice. It is a similarity rather than a distance, so it must be sorted descending; sorting it ascending builds a search engine that returns the worst match first with no error message anywhere.'
  - term: 'Cosine distance'
    definition: 'One minus cosine similarity. Widely used, genuinely useful, and not a metric: it fails the triangle inequality and it is zero between vectors that are not equal. Precise usage calls it a dissimilarity. Two standard repairs exist when a metric is required: angular distance, the arc cosine of the similarity divided by pi, which is a metric and preserves the same ranking; or normalising every vector to unit length on the way in, after which the squared Euclidean distance equals 2 minus twice the cosine similarity and the two rank identically. The second is what vector databases actually do.'
  - term: 'Mahalanobis distance'
    definition: 'Euclidean distance measured after accounting for how the data actually varies. Take the difference between two points and, instead of dotting it with itself, dot it with itself through the inverse covariance matrix. Published by Prasanta Chandra Mahalanobis in "On the generalised distance in statistics" in 1936, from the anthropometric problem of comparing populations across correlated measurements in different units. Substituting the identity matrix recovers ordinary Euclidean distance exactly, which is the cleanest statement of what the covariance contributes. It needs an invertible covariance, so it requires more rows than columns and no duplicated features, and each distance costs a matrix-vector product rather than a subtraction.'
  - term: 'Covariance matrix'
    definition: 'A square matrix whose (i, j) entry is the average product of column i and column j deviations from their own means. The diagonal holds each column variance; the off-diagonal says how strongly two columns move together. On the eight sensor readings used in this lab it comes out as exactly [[7.5, 7.0], [7.0, 7.5]], with a correlation of 0.9333. Day 106 eigenvectors of this matrix are the directions the data spreads along, and Mahalanobis distance is Euclidean distance measured along those directions with each component divided by the square root of its eigenvalue.'
  - term: 'Standardisation'
    definition: 'Subtracting a column mean and dividing by that column standard deviation, so every column ends with mean 0 and standard deviation 1. Also called the z-score. It exists because distances sum contributions across features and nothing in that sum knows what units the features are in: with bore diameter in metres against mass in grams, the bore column contributes 0.0036 per cent of every distance and the ranking is decided by mass alone. Two details matter in practice. Use the population divisor n, which is what numpy.std and scikit-learn StandardScaler both use. And standardise a query with the catalogue statistics rather than its own, since a single row standardised against itself is a row of zeros.'
  - term: 'Min-max normalisation'
    definition: 'Rescaling each column so its minimum becomes 0 and its maximum becomes 1. The alternative to standardisation, and the trade-off is worth stating rather than defaulting. Min-max pins the range exactly, which is what an image pipeline usually wants, but one outlier then decides the whole scale and any value outside the training range comes out above 1 or below 0. Standardisation assumes nothing about the range and handles unbounded features, but an outlier stretches the standard deviation and squashes everything else toward zero.'
  - term: 'Unit ball'
    definition: 'The set of points at distance exactly 1 from the origin under a given norm — the picture that makes the p-norm family click. L1 gives a diamond, L2 a circle, L-infinity a square, with areas 2, pi and 4. The shapes are strictly nested, which is the same fact as the p-norm falling as p rises, said the other way round: a bigger p is a more forgiving norm, so more points fit inside its ball. A single point such as (0.6, 0.8) sits outside the diamond, on the circle and inside the square, and measures 1.4, 1.0 and 0.8 under the three.'
  - term: 'Similarity versus distance'
    definition: 'A distance shrinks as two things become more alike and is zero when they are identical; a similarity grows. Cosine and Jaccard are similarities; L1, L2, L-infinity, Hamming and Mahalanobis are distances. No library knows which one it has been handed, so a ranking function has to be told — and getting it backwards produces a result that still looks like a ranked list. Converting between the two is a modelling assumption rather than a derivation: 1 minus cosine similarity is bounded and well behaved, while 1 minus a Euclidean distance goes negative and 1 divided by (1 plus d) is a choice somebody made.'
  - term: 'Squared Euclidean distance'
    definition: 'The sum of squared differences with the square root omitted. Common because it avoids a square root and because it is what least squares minimises, and not a norm: doubling a vector multiplies it by four rather than by two, so absolute homogeneity fails and the triangle inequality goes with it. It is safe for ranking, because squaring preserves order on non-negative numbers, and unsafe anywhere the triangle inequality is assumed — a ball tree, a cover tree, or a metric-space index.'
