questions:
  - question: 'One query and three candidate articles, four term counts each. Manhattan distance ranks the first article top, Euclidean ranks the second, and cosine similarity ranks the third. Which statement is correct?'
    options:
      - 'Two of the three implementations must contain a bug, because the same data cannot have three nearest neighbours'
      - 'The disagreement means the features are badly chosen and the vectors should be re-derived'
      - 'Cosine is the only correct answer, because the other two are sensitive to document length'
      - 'All three are correct; they are answering different questions, and which one you want is a modelling decision'
    answer_index: 3
    explanation: 'Nothing is broken. Manhattan asks "how much total disagreement is there across the features", and the first article disagrees on one term by 5, total 5. Euclidean squares before summing, so one error of 5 costs 25 while three errors of 2 cost 12 in total — which is why it prefers the second article despite its larger total. Cosine throws length away entirely, so the third article, which is the query profile at exactly three times the length, scores 1.0 while being the furthest away of the three under both L1 and L2. The first option assumes there is a fact of the matter about which is nearest, and there is not until you say what near means. The third gets the reasoning backwards: cosine is often right for text precisely because it ignores length, but ignoring length is wrong whenever magnitude is information, such as prices or counts. The fourth blames the representation for a property of the measure; the same three vectors under any one measure give one clean answer.'
  - question: 'Why is cosine distance not a metric?'
    options:
      - 'It violates the triangle inequality, and it is zero between vectors that are not equal'
      - 'It is not symmetric: the distance from A to B differs from the distance from B to A'
      - 'It can return negative values, which violates non-negativity'
      - 'It is undefined for the zero vector, which violates the requirement that every pair have a distance'
    answer_index: 0
    explanation: 'Two of the four axioms fail, and both are worth knowing. The triangle inequality: with east = (1, 0), diagonal = (1, 1) and north = (0, 1), going east to diagonal costs 0.292893 and diagonal to north costs the same, so the detour totals 0.585786 — while going east to north direct costs 1.0. A detour shorter than the direct route is exactly what no metric may allow, and an exhaustive sweep over the 3375 triples of non-zero four-bit vectors finds 326 violations. The second failure is identity of indiscernibles: cosine_distance((1, 0), (2, 0)) is 0, so two different vectors are at distance zero. For cosine that is the feature rather than a defect — length is what it was told to ignore — but it means cosine cannot distinguish a document from the same document repeated. The first option is wrong for non-negative data, where cosine similarity lies in 0 to 1 and the distance in 0 to 1; on data with negative components the similarity can reach -1 and the distance 2, which is still non-negative. The second is simply false: the formula is symmetric in its two arguments. The fourth describes a real edge case but not an axiom violation, since the axioms concern points that exist in the space. What the failure costs you is concrete: ball trees, KD-trees, cover trees and metric-space pruning all rely on the triangle inequality, so none of them is valid. The standard repairs are angular distance, arccos of the similarity divided by pi, or normalising every vector to length 1 so Euclidean distance ranks identically.'
  - question: 'A machined part has four dimensions and is rejected if any single dimension is out by more than 0.05 mm. Batch A is out by 0.04 on all four; batch B is exact on three and out by 0.09 on the fourth. Which measure expresses the acceptance rule, and which batch passes?'
    options:
      - 'Manhattan, and batch B passes'
      - 'Chebyshev, and batch A passes'
      - 'Euclidean, and batch A passes'
      - 'Chebyshev, and batch B passes'
    answer_index: 1
    explanation: 'The rule "no single feature may be worse than X" is an L-infinity ball and cannot be written as anything else. Batch A worst deviation is 0.04, which is inside the 0.05 tolerance, so it passes; batch B worst is 0.09, so it fails. Now look at what the other two measures say. Batch A total absolute error is 0.16 and batch B is 0.09, so Manhattan ranks batch B as the better part. Euclidean gives 0.0800 for A and 0.0900 for B, so it ranks A better — the two disagree with each other here, which is itself worth noticing. Neither is answering the inspection question. The general lesson is that averaging, whether L1 or L2, is a way of hiding one bad value behind several good ones, and whenever the specification is about a worst case, the measure has to be too.'
  - question: 'You are matching recipes by ingredient set. The query lists four ingredients. Sachertorte has eleven ingredients including all four; Shortbread has three ingredients, two of which are in the query. Cosine similarity prefers Sachertorte and Jaccard prefers Shortbread. Why?'
    options:
      - 'Jaccard is computed on counts while cosine is computed on presence, so they see different data'
      - 'Cosine is a distance and Jaccard is a similarity, so their orderings are naturally reversed'
      - 'Jaccard divides by the union, so it charges for the extras'
      - 'Jaccard is undefined for sets of different sizes and is falling back to a default'
    answer_index: 2
    explanation: 'Both are computed on exactly the same binary data, and the difference is entirely in the denominator. Cosine on binary vectors is shared over the square root of the product of the sizes, so 4 over the square root of 44, which is 0.6030. Jaccard is shared over the union, so 4 over 11, which is 0.3636. For Shortbread the numbers are 2 over the square root of 12, or 0.5774, and 2 over 5, or 0.4000. A square root is a much gentler penalty than a full count, so cosine forgives the seven extra ingredients and Jaccard does not. Neither is wrong: cosine is answering "has it got what I asked for" and Jaccard is answering "how much of everything involved is shared". The first option has it backwards; both are computed on presence here, and it is Jaccard that is defined on sets from the start. The third is false in a way worth correcting, since both cosine similarity and Jaccard similarity are similarities and both are being maximised. The fourth is simply untrue: Jaccard was invented in 1901 precisely for lists of very different lengths. One structural fact follows and is worth carrying: on binary data, cosine can never score below Jaccard, because the square root of the product of two sizes is never larger than the size of their union. Cosine is systematically the more generous of the two.'
  - question: 'Two points sit at exactly the same Euclidean distance from the mean of a dataset, and Mahalanobis distance scores one at 1.11 and the other at 6.00. What has Mahalanobis used that Euclidean has not?'
    options:
      - 'A larger number of dimensions, since Mahalanobis operates in a higher-dimensional space'
      - 'The median rather than the mean, which is more robust to outliers'
      - 'A weighting supplied by the user, which Euclidean distance does not accept'
      - 'The covariance of the data, so varying directions are cheap'
    answer_index: 3
    explanation: 'Mahalanobis distance is the difference dotted with itself through the inverse covariance matrix rather than with itself directly. On the eight sensor readings in the lab, the two sensors move together — the covariance is [[7.5, 7.0], [7.0, 7.5]] and the correlation is 0.9333 — so the data has a grain running along the line y = x. Both sensors reading 3 is ordinary; one reading +3 while the other reads -3 has never happened. Euclidean distance has no way to know that, because it does not know the dataset exists; both probes are the square root of 18 from the mean and it must score them identically. Day 106 supplies the connection: the eigenvalues of that covariance are 0.5 and 14.5, the eigenvector for 14.5 is the (1, 1) direction and the one for 0.5 is (1, -1), and Mahalanobis is Euclidean distance along those axes with each component divided by the square root of its eigenvalue. That is where 1.114172 and exactly 6.0 come from, and you can do the arithmetic by hand. The first option is wrong: both operate in the same two dimensions. The third describes a diagonal weight matrix, which is a special case of Mahalanobis and is exactly per-feature standardisation — the general case learns the weights and the correlations from the data instead. The fourth is a different idea altogether; Mahalanobis uses the mean.'
  - question: 'A catalogue has two features: bore diameter in metres, around 0.02, and mass in grams, around 350. You rank on raw Euclidean distance and then again after standardising both columns. What changes?'
    options:
      - 'The ordering changes, because before standardising the bore column contributed a negligible fraction of every distance'
      - 'The distances all shrink but the ordering is preserved, which is why standardising is described as cosmetic'
      - 'Nothing changes; standardising is a monotonic transformation and monotonic transformations preserve rankings'
      - 'The ordering changes only if the features are correlated; for independent features standardising has no effect'
    answer_index: 0
    explanation: 'Before standardising, the squared bore differences are around 1e-4 and the squared mass differences are in the thousands, so the bore column contributes at most 0.0036 per cent of any distance in the table. That is not a two-feature ranking; it is a ranking on mass. The winner is a bearing whose bore is 60 per cent oversize and physically will not fit, and it wins because it is 2 g from the target mass. After both columns are divided by their own standard deviations the winner changes, and the two parts that move are exactly the two the decision was between. The first two options both misunderstand what standardising does: it is applied per column with a different divisor for each, so it is not one monotonic transformation of the distance and there is no reason for the ordering to survive. The fourth confuses standardising with Mahalanobis; correlation is what Mahalanobis additionally removes, while standardising fixes only the scale — and the scale alone is enough to decide this ranking. The sharpest demonstration is that changing no data at all and only the unit the bore column is written in, from metres to micrometres, also changes the winner. Over 2000 random catalogues with a seeded generator, standardising changed the winner about 55 per cent of the time.'
  - question: 'Why is squared Euclidean distance not a norm or a metric, and when is it nevertheless safe to use?'
    options:
      - 'It fails non-negativity; it is safe only when all features are positive'
      - 'It fails absolute homogeneity, but is safe for ranking'
      - 'It fails nothing; it is a norm, and the square root is dropped purely as an optimisation'
      - 'It fails symmetry; it is safe when the two arguments are always supplied in the same order'
    answer_index: 1
    explanation: 'Absolute homogeneity requires that scaling a vector by k scales its size by the absolute value of k. For v = (3, -4, 12) the sum of squares is 169, and for 2v it is 676 — four times, not twice — so the axiom fails outright and the triangle inequality goes with it. That does not make it useless. Squaring is monotonic on non-negative numbers, so ranking by squared distance gives exactly the same order as ranking by Euclidean distance, which the lab asserts directly, and skipping the square root is a real saving inside a tight loop. What it makes it is unusable as a distance: never hand it to a ball tree, a cover tree, a metric-space index, or any argument that relies on a detour being no shorter than the direct route. The first option is wrong because a sum of squares is never negative. The second is wrong because the expression is symmetric in its two arguments. The third is the belief the question exists to correct, and it is a common one precisely because squared distance behaves so well in the one place people usually meet it, which is a least-squares objective.'
  - question: 'A parts register has a categorical column with values like steel, brass and nylon. A colleague encodes them as 0, 1 and 2 and feeds the column into a Euclidean nearest-neighbour model. What has that encoding asserted?'
    options:
      - 'Nothing; integer encoding is a lossless relabelling and the model recovers the categories'
      - 'That the three materials are equidistant, which is the correct assumption for categories'
      - 'That brass is twice as similar to steel as nylon is, because the numeric gaps are 1 and 2'
      - 'That the column should be ignored, because the model cannot use non-numeric data'
    answer_index: 2
    explanation: 'Subtracting the codes gives a distance of 1 from steel to brass and 2 from steel to nylon, so the model now believes brass is nearer to steel than nylon is, and by a specific factor. That is a claim about metallurgy which nobody made and nobody checked, and it changes the model output. Hamming distance is the honest alternative: it counts how many fields differ and refuses to invent an ordering, giving 1 for a record differing only in colour, 3 for one differing in three fields and 6 for one sharing nothing. The first option is wrong because the encoding is lossless as a labelling and not as a geometry — the model sees only the geometry. The third describes what one-hot encoding plus Hamming actually achieves, which is the fix rather than the problem. The fourth is false and is the reason people reach for integer encoding in the first place. One pleasant coincidence is worth carrying and worth distrusting: on genuinely binary features, Hamming, L1 and squared Euclidean give exactly the same number, because every difference is 0 or 1 and 1 squared is 1. The agreement collapses the moment the encoding has three or more levels.'
