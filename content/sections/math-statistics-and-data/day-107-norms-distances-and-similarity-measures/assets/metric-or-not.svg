<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not the same thing.">
  <title>Metric against similarity</title>
  <style>
    .metric-or-not-bg   { fill: #f8fafc; }
    .metric-or-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-or-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-or-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-or-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-or-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-or-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-or-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-or-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-or-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-or-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-or-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-or-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-or-not-row { opacity: 1; }
    .metric-or-not-r0 { animation-delay: 0.00s; }
    .metric-or-not-r1 { animation-delay: 0.45s; }
    .metric-or-not-r2 { animation-delay: 0.90s; }
    .metric-or-not-r3 { animation-delay: 1.35s; }
    .metric-or-not-r4 { animation-delay: 1.80s; }
    .metric-or-not-row { animation: metric-or-not-reveal 7.3s ease-in-out infinite; }
    @keyframes metric-or-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metric-or-not-bg" width="980" height="390"/>
  <text class="metric-or-not-h1"  x="30" y="40">Metric against similarity</text>
  <text class="metric-or-not-sub" x="30" y="64">Not the same thing.</text>
  <rect class="metric-or-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metric-or-not-name" x="46" y="122">A true metric</text>
  <text class="metric-or-not-desc" x="46" y="142">Four properties.</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r0" x="46" y="182">Never negative</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r1" x="46" y="216">Zero only for identical points</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r2" x="46" y="250">Symmetric in its arguments</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r3" x="46" y="284">Satisfies the triangle inequality</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r4" x="46" y="318">Which indexing structures rely on</text>
  <rect class="metric-or-not-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metric-or-not-name" x="526" y="122">A similarity</text>
  <text class="metric-or-not-desc" x="526" y="142">Fewer guarantees.</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r0" x="526" y="182">Can be negative</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r1" x="526" y="216">Maximal, not zero, for identical points</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r2" x="526" y="250">Usually symmetric</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r3" x="526" y="284">Often violates the triangle inequality</text>
  <text class="metric-or-not-desc metric-or-not-row metric-or-not-r4" x="526" y="318">So some indexes may misbehave</text>
  <text class="metric-or-not-sub" x="30" y="372">The triangle inequality is what allows an index to prune whole regions of the search space, which is why using a non-metric with such an index can silently lose results.</text>
</svg>
