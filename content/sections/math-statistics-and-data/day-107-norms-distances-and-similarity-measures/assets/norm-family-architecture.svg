<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img"
     aria-labelledby="d107a-title d107a-desc">
  <title id="d107a-title">The unit ball of L1, L2 and L-infinity drawn on the same axes: a diamond, a circle and a square, with one point measured under each and the three different numbers labelled</title>
  <desc id="d107a-desc">A static diagram showing the three unit balls of the p-norm family drawn on one set of axes, the same point measured under each norm giving 1.4, 1.0 and 0.8, a table of the p-norm of the vector 3 comma 4 as p rises from 1 to infinity, and three cards saying what each norm is for.</desc>

  <style>
    .d107a-bg    { fill: #f8fafc; }
    .d107a-h1    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 27px; font-weight: 700; fill: #1a202c; }
    .d107a-h2    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; fill: #1d4ed8; }
    .d107a-lab   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #1a202c; }
    .d107a-small { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d107a-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #1a202c; }
    .d107a-monob { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1a202c; }
    .d107a-card  { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d107a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d107a-axis  { stroke: #64748b; stroke-width: 1.5; }
    .d107a-tick  { stroke: #94a3b8; stroke-width: 1; }
    .d107a-diamond { fill: rgba(180, 83, 9, 0.16); stroke: #b45309; stroke-width: 3; }
    .d107a-circle  { fill: none; stroke: #1d4ed8; stroke-width: 3; }
    .d107a-square  { fill: none; stroke: #047857; stroke-width: 3; stroke-dasharray: 9 6; }
    .d107a-amber   { fill: #b45309; }
    .d107a-blue    { fill: #1d4ed8; }
    .d107a-green   { fill: #047857; }
    .d107a-amberT  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #b45309; }
    .d107a-blueT   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1d4ed8; }
    .d107a-greenT  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #047857; }
    .d107a-lead    { stroke: #475569; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .d107a-row     { fill: #f1f5f9; }
  </style>

  <rect class="d107a-bg" x="0" y="0" width="1000" height="780"/>

  <text class="d107a-h1" x="40" y="46">One formula, one dial: the unit ball of each norm</text>
  <text class="d107a-small" x="40" y="72">Every point on a shape below is at distance exactly 1.0 from the centre. Same centre, same radius, three meanings of “radius”.</text>

  <!-- ============ LEFT: the three unit balls ============ -->
  <rect class="d107a-panel" x="40" y="92" width="510" height="510" rx="8"/>
  <text class="d107a-h2" x="60" y="122">The three unit balls, on one set of axes</text>

  <!-- axes: centre (295, 372), unit = 110px -->
  <line class="d107a-axis" x1="150" y1="372" x2="450" y2="372"/>
  <line class="d107a-axis" x1="295" y1="227" x2="295" y2="517"/>
  <line class="d107a-tick" x1="405" y1="367" x2="405" y2="377"/>
  <line class="d107a-tick" x1="185" y1="367" x2="185" y2="377"/>
  <line class="d107a-tick" x1="290" y1="262" x2="300" y2="262"/>
  <line class="d107a-tick" x1="290" y1="482" x2="300" y2="482"/>
  <text class="d107a-small" x="399" y="393">1</text>
  <text class="d107a-small" x="176" y="393">-1</text>
  <text class="d107a-small" x="270" y="267">1</text>
  <text class="d107a-small" x="265" y="487">-1</text>

  <!-- L-infinity: the square, |x| <= 1 and |y| <= 1 -->
  <rect class="d107a-square" x="185" y="262" width="220" height="220"/>
  <!-- L2: the circle, radius 1 -->
  <circle class="d107a-circle" cx="295" cy="372" r="110"/>
  <!-- L1: the diamond, |x| + |y| = 1 -->
  <polygon class="d107a-diamond" points="405,372 295,262 185,372 295,482"/>

  <!-- the measured point (0.6, 0.8) -->
  <line class="d107a-lead" x1="295" y1="372" x2="361" y2="284"/>
  <circle class="d107a-blue" cx="361" cy="284" r="7"/>
  <text class="d107a-monob" x="374" y="278">(0.6, 0.8)</text>
  <text class="d107a-small" x="374" y="298">outside the diamond,</text>
  <text class="d107a-small" x="374" y="315">ON the circle,</text>
  <text class="d107a-small" x="374" y="332">inside the square</text>

  <text class="d107a-amberT" x="62" y="545">L1 · diamond</text>
  <text class="d107a-blueT" x="212" y="545">L2 · circle</text>
  <text class="d107a-greenT" x="352" y="545">L-infinity · square</text>
  <text class="d107a-small" x="62" y="570">|x| + |y| = 1</text>
  <text class="d107a-small" x="212" y="570">x² + y² = 1</text>
  <text class="d107a-small" x="352" y="570">max(|x|, |y|) = 1</text>
  <text class="d107a-small" x="62" y="590">area 2</text>
  <text class="d107a-small" x="212" y="590">area π ≈ 3.14</text>
  <text class="d107a-small" x="352" y="590">area 4</text>

  <!-- ============ RIGHT TOP: one point, three sizes ============ -->
  <rect class="d107a-card" x="576" y="92" width="384" height="216" rx="8"/>
  <text class="d107a-h2" x="596" y="122">One point. Three different sizes.</text>
  <text class="d107a-mono" x="596" y="152">v = (0.6, 0.8)</text>

  <text class="d107a-amberT" x="596" y="184">L1</text>
  <text class="d107a-mono" x="640" y="184">0.6 + 0.8</text>
  <text class="d107a-monob" x="800" y="184">= 1.4</text>
  <text class="d107a-blueT" x="596" y="214">L2</text>
  <text class="d107a-mono" x="640" y="214">√(0.36 + 0.64)</text>
  <text class="d107a-monob" x="800" y="214">= 1.0</text>
  <text class="d107a-greenT" x="596" y="244">L∞</text>
  <text class="d107a-mono" x="640" y="244">max(0.6, 0.8)</text>
  <text class="d107a-monob" x="800" y="244">= 0.8</text>

  <text class="d107a-small" x="596" y="276">The bigger p is, the smaller the number and the bigger</text>
  <text class="d107a-small" x="596" y="294">the ball — which is the same fact said twice.</text>

  <!-- ============ RIGHT MIDDLE: the p sweep ============ -->
  <rect class="d107a-panel" x="576" y="326" width="384" height="276" rx="8"/>
  <text class="d107a-h2" x="596" y="356">Turning the dial on v = (3, 4)</text>
  <text class="d107a-mono" x="596" y="382">‖v‖ₚ = ( Σ |xᵢ|ᵖ ) ^ (1/p)</text>

  <rect class="d107a-row" x="596" y="396" width="344" height="24"/>
  <text class="d107a-small" x="606" y="413">p</text>
  <text class="d107a-small" x="676" y="413">‖v‖ₚ</text>
  <text class="d107a-small" x="786" y="413">measured</text>

  <text class="d107a-mono" x="606" y="440">1</text>
  <text class="d107a-mono" x="676" y="440">7.000000</text>
  <text class="d107a-small" x="786" y="440">3 + 4</text>
  <text class="d107a-mono" x="606" y="464">1.5</text>
  <text class="d107a-mono" x="676" y="464">5.584250</text>
  <text class="d107a-mono" x="606" y="488">2</text>
  <text class="d107a-mono" x="676" y="488">5.000000</text>
  <text class="d107a-small" x="786" y="488">the 3-4-5 triangle</text>
  <text class="d107a-mono" x="606" y="512">3</text>
  <text class="d107a-mono" x="676" y="512">4.497941</text>
  <text class="d107a-mono" x="606" y="536">8</text>
  <text class="d107a-mono" x="676" y="536">4.047992</text>
  <text class="d107a-mono" x="606" y="560">64</text>
  <text class="d107a-mono" x="676" y="560">4.000000</text>
  <text class="d107a-small" x="786" y="560">the limit arrives</text>
  <text class="d107a-mono" x="606" y="584">∞</text>
  <text class="d107a-mono" x="676" y="584">4.000000</text>
  <text class="d107a-small" x="786" y="584">just the biggest</text>

  <!-- ============ BOTTOM: what each one is for ============ -->
  <rect class="d107a-card" x="40" y="624" width="298" height="132" rx="8"/>
  <text class="d107a-amberT" x="60" y="652">L1 — total disagreement</text>
  <text class="d107a-small" x="60" y="676">Every unit of error costs the same,</text>
  <text class="d107a-small" x="60" y="695">wherever it happens. Ten features</text>
  <text class="d107a-small" x="60" y="714">one out costs what one feature</text>
  <text class="d107a-small" x="60" y="733">ten out costs. Grid movement.</text>

  <rect class="d107a-card" x="351" y="624" width="298" height="132" rx="8"/>
  <text class="d107a-blueT" x="371" y="652">L2 — straight-line separation</text>
  <text class="d107a-small" x="371" y="676">Squaring punishes one BIG error</text>
  <text class="d107a-small" x="371" y="695">far more than several small ones</text>
  <text class="d107a-small" x="371" y="714">adding to the same total. The one</text>
  <text class="d107a-small" x="371" y="733">ordinary geometry hands you.</text>

  <rect class="d107a-card" x="662" y="624" width="298" height="132" rx="8"/>
  <text class="d107a-greenT" x="682" y="652">L∞ — the worst component</text>
  <text class="d107a-small" x="682" y="676">Every other feature is ignored</text>
  <text class="d107a-small" x="682" y="695">entirely. “No dimension may be out</text>
  <text class="d107a-small" x="682" y="714">by more than X” is this ball, and</text>
  <text class="d107a-small" x="682" y="733">cannot be written as anything else.</text>
</svg>
