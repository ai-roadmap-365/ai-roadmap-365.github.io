<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Scaling decides the answer</title>
  <style>
    .silent-decider-bg   { fill: #f8fafc; }
    .silent-decider-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-decider-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-decider-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-decider-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-decider-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-decider-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .silent-decider-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .silent-decider-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .silent-decider-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .silent-decider-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .silent-decider-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .silent-decider-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .silent-decider-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .silent-decider-stage { opacity: 1; }

    .silent-decider-s0 { animation-delay: 0.00s; }
    .silent-decider-e0 { animation-delay: 0.00s; }
    .silent-decider-s1 { animation-delay: 1.28s; }
    .silent-decider-e1 { animation-delay: 1.28s; }
    .silent-decider-s2 { animation-delay: 2.56s; }
    .silent-decider-e2 { animation-delay: 2.56s; }
    .silent-decider-s3 { animation-delay: 3.84s; }
    .silent-decider-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .silent-decider-conn  { animation: silent-decider-trace 6.4s ease-in-out infinite; }
      .silent-decider-stage { animation: silent-decider-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes silent-decider-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes silent-decider-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .silent-decider-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .silent-decider-stage { animation: silent-decider-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes silent-decider-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="silent-decider-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="silent-decider-bg" width="980" height="322"/>
  <text class="silent-decider-h1"  x="30" y="40">Scaling decides the answer</text>
  <text class="silent-decider-sub" x="30" y="64">Four steps.</text>
  <g class="silent-decider-stage silent-decider-s0">
    <rect class="silent-decider-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="silent-decider-step" x="44" y="142">01</text>
    <text class="silent-decider-name" x="70" y="142">Features arrive in different units</text>
    <text class="silent-decider-desc" x="44" y="166">Income in thousands, ratings out</text>
    <text class="silent-decider-desc" x="44" y="182">of five.</text>
  </g>
  <line class="silent-decider-line silent-decider-conn silent-decider-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#silent-decider-tip)"/>
  <g class="silent-decider-stage silent-decider-s1">
    <rect class="silent-decider-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="silent-decider-step" x="280" y="142">02</text>
    <text class="silent-decider-name" x="306" y="142">Distance is dominated by the largest-range feature</text>
    <text class="silent-decider-desc" x="280" y="166">Regardless of relevance.</text>
  </g>
  <line class="silent-decider-line silent-decider-conn silent-decider-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#silent-decider-tip)"/>
  <g class="silent-decider-stage silent-decider-s2">
    <rect class="silent-decider-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="silent-decider-step" x="516" y="142">03</text>
    <text class="silent-decider-name" x="542" y="142">So the nearest neighbours are decided by one column</text>
    <text class="silent-decider-desc" x="516" y="166">And the others contribute</text>
    <text class="silent-decider-desc" x="516" y="182">nothing.</text>
  </g>
  <line class="silent-decider-line silent-decider-conn silent-decider-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#silent-decider-tip)"/>
  <g class="silent-decider-stage silent-decider-s3">
    <rect class="silent-decider-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="silent-decider-step" x="752" y="142">04</text>
    <text class="silent-decider-name" x="778" y="142">Scaling first is what makes the comparison meaningful</text>
    <text class="silent-decider-desc" x="752" y="166">And it is the step most often</text>
    <text class="silent-decider-desc" x="752" y="182">skipped.</text>
  </g>
  <text class="silent-decider-sub" x="30" y="304">This decides the answer more often than the choice of norm does, which makes it the first thing to check when a similarity search returns puzzling results.</text>
</svg>
