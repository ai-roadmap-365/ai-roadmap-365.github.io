<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four shapes.">
  <title>The shape of each norm</title>
  <style>
    .unit-balls-bg   { fill: #f8fafc; }
    .unit-balls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unit-balls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unit-balls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unit-balls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unit-balls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unit-balls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unit-balls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unit-balls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unit-balls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unit-balls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unit-balls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unit-balls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .unit-balls-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .unit-balls-stage { opacity: 1; }

    .unit-balls-s0 { animation-delay: 0.00s; }
    .unit-balls-e0 { animation-delay: 0.00s; }
    .unit-balls-s1 { animation-delay: 1.28s; }
    .unit-balls-e1 { animation-delay: 1.28s; }
    .unit-balls-s2 { animation-delay: 2.56s; }
    .unit-balls-e2 { animation-delay: 2.56s; }
    .unit-balls-s3 { animation-delay: 3.84s; }
    .unit-balls-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .unit-balls-conn  { animation: unit-balls-trace 6.4s ease-in-out infinite; }
      .unit-balls-stage { animation: unit-balls-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes unit-balls-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes unit-balls-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .unit-balls-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .unit-balls-stage { animation: unit-balls-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes unit-balls-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="unit-balls-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="unit-balls-bg" width="980" height="322"/>
  <text class="unit-balls-h1"  x="30" y="40">The shape of each norm</text>
  <text class="unit-balls-sub" x="30" y="64">Four shapes.</text>
  <g class="unit-balls-stage unit-balls-s0">
    <rect class="unit-balls-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="unit-balls-step" x="44" y="142">01</text>
    <text class="unit-balls-name" x="70" y="142">All points at distance one form a shape</text>
    <text class="unit-balls-desc" x="44" y="166">Different for each norm.</text>
  </g>
  <line class="unit-balls-line unit-balls-conn unit-balls-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#unit-balls-tip)"/>
  <g class="unit-balls-stage unit-balls-s1">
    <rect class="unit-balls-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="unit-balls-step" x="280" y="142">02</text>
    <text class="unit-balls-name" x="306" y="142">Grid distance gives a diamond</text>
    <text class="unit-balls-desc" x="280" y="166">With corners on the axes.</text>
  </g>
  <line class="unit-balls-line unit-balls-conn unit-balls-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#unit-balls-tip)"/>
  <g class="unit-balls-stage unit-balls-s2">
    <rect class="unit-balls-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="unit-balls-step" x="516" y="142">03</text>
    <text class="unit-balls-name" x="542" y="142">Straight-line distance gives a circle</text>
    <text class="unit-balls-desc" x="516" y="166">Smooth, with no corners.</text>
  </g>
  <line class="unit-balls-line unit-balls-conn unit-balls-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#unit-balls-tip)"/>
  <g class="unit-balls-stage unit-balls-s3">
    <rect class="unit-balls-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="unit-balls-step" x="752" y="142">04</text>
    <text class="unit-balls-name" x="778" y="142">And the maximum norm gives a square</text>
    <text class="unit-balls-desc" x="752" y="166">Corners at the diagonals.</text>
  </g>
  <text class="unit-balls-sub" x="30" y="304">The diamond's corners are exactly why the absolute-value penalty produces zeros in regularisation, which connects this geometry directly to feature selection.</text>
</svg>
