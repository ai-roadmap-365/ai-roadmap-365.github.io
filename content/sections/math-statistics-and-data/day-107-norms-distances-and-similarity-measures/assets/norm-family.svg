<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four settings.">
  <title>One formula, one dial</title>
  <style>
    .norm-family-bg   { fill: #f8fafc; }
    .norm-family-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-family-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-family-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-family-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-family-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-family-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .norm-family-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .norm-family-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .norm-family-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .norm-family-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .norm-family-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .norm-family-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .norm-family-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .norm-family-stage { opacity: 1; }

    .norm-family-s0 { animation-delay: 0.00s; }
    .norm-family-e0 { animation-delay: 0.00s; }
    .norm-family-s1 { animation-delay: 1.28s; }
    .norm-family-e1 { animation-delay: 1.28s; }
    .norm-family-s2 { animation-delay: 2.56s; }
    .norm-family-e2 { animation-delay: 2.56s; }
    .norm-family-s3 { animation-delay: 3.84s; }
    .norm-family-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .norm-family-conn  { animation: norm-family-trace 6.4s ease-in-out infinite; }
      .norm-family-stage { animation: norm-family-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes norm-family-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes norm-family-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .norm-family-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .norm-family-stage { animation: norm-family-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes norm-family-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="norm-family-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="norm-family-bg" width="980" height="322"/>
  <text class="norm-family-h1"  x="30" y="40">One formula, one dial</text>
  <text class="norm-family-sub" x="30" y="64">Four settings.</text>
  <g class="norm-family-stage norm-family-s0">
    <rect class="norm-family-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="norm-family-step" x="44" y="142">01</text>
    <text class="norm-family-name" x="70" y="142">One formula: sum the powers, then take the root</text>
    <text class="norm-family-desc" x="44" y="166">With the power as a parameter.</text>
  </g>
  <line class="norm-family-line norm-family-conn norm-family-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#norm-family-tip)"/>
  <g class="norm-family-stage norm-family-s1">
    <rect class="norm-family-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="norm-family-step" x="280" y="142">02</text>
    <text class="norm-family-name" x="306" y="142">Set it to one: absolute differences summed</text>
    <text class="norm-family-desc" x="280" y="166">Grid distance.</text>
  </g>
  <line class="norm-family-line norm-family-conn norm-family-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#norm-family-tip)"/>
  <g class="norm-family-stage norm-family-s2">
    <rect class="norm-family-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="norm-family-step" x="516" y="142">03</text>
    <text class="norm-family-name" x="542" y="142">Set it to two: the familiar straight-line distance</text>
    <text class="norm-family-desc" x="516" y="166">The usual default.</text>
  </g>
  <line class="norm-family-line norm-family-conn norm-family-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#norm-family-tip)"/>
  <g class="norm-family-stage norm-family-s3">
    <rect class="norm-family-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="norm-family-step" x="752" y="142">04</text>
    <text class="norm-family-name" x="778" y="142">Send it to infinity: the largest single difference</text>
    <text class="norm-family-desc" x="752" y="166">Only the worst component counts.</text>
  </g>
  <text class="norm-family-sub" x="30" y="304">Seeing these as one family with a dial rather than as three separate formulas makes the choice between them a deliberate setting rather than a lookup.</text>
</svg>
