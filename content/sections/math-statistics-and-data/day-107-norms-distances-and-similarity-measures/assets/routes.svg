<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Depends how you travel.">
  <title>Distance across a city</title>
  <style>
    .routes-bg   { fill: #f8fafc; }
    .routes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .routes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .routes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .routes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .routes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .routes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .routes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .routes-row { opacity: 1; }
    .routes-r0 { animation-delay: 0.00s; }
    .routes-r1 { animation-delay: 0.45s; }
    .routes-r2 { animation-delay: 0.90s; }
    .routes-r3 { animation-delay: 1.35s; }
    .routes-r4 { animation-delay: 1.80s; }
    .routes-row { animation: routes-reveal 7.3s ease-in-out infinite; }
    @keyframes routes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="routes-bg" width="980" height="390"/>
  <text class="routes-h1"  x="30" y="40">Distance across a city</text>
  <text class="routes-sub" x="30" y="64">Depends how you travel.</text>
  <rect class="routes-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="routes-name" x="46" y="122">As the bird flies</text>
  <text class="routes-desc" x="46" y="142">Straight through.</text>
  <text class="routes-desc routes-row routes-r0" x="46" y="182">The direct line between two points</text>
  <text class="routes-desc routes-row routes-r1" x="46" y="216">Ignores obstacles</text>
  <text class="routes-desc routes-row routes-r2" x="46" y="250">The shortest possible</text>
  <text class="routes-desc routes-row routes-r3" x="46" y="284">What a map ruler measures</text>
  <text class="routes-desc routes-row routes-r4" x="46" y="318">This is straight-line distance</text>
  <rect class="routes-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="routes-name" x="526" y="122">Along the streets</text>
  <text class="routes-desc" x="526" y="142">Around the blocks.</text>
  <text class="routes-desc routes-row routes-r0" x="526" y="182">Sum of the horizontal and vertical legs</text>
  <text class="routes-desc routes-row routes-r1" x="526" y="216">Follows the grid</text>
  <text class="routes-desc routes-row routes-r2" x="526" y="250">Always at least as long</text>
  <text class="routes-desc routes-row routes-r3" x="526" y="284">What a taxi meter measures</text>
  <text class="routes-desc routes-row routes-r4" x="526" y="318">This is grid distance</text>
  <text class="routes-sub" x="30" y="372">Both are correct answers to different questions, which is exactly the situation with norms: the right one depends on how movement actually happens in your space.</text>
</svg>
