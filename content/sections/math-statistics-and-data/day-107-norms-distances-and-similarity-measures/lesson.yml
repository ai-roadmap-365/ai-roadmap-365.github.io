title: 'Norms, Distances, and Similarity Measures'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 16
learning_promise: 'After this lesson you will stop picking a distance by habit and start picking one on purpose. You will see one query and three candidates where Manhattan, Euclidean and cosine each name a different winner — four small whole numbers, no randomness, and three defensible answers — and you will be able to say what question each one was asking. You will learn that L1, L2 and L-infinity are not three ideas but one formula with the dial set to 1, 2 and infinity, and you will see the picture that makes the family click: a diamond, a circle and a square drawn on the same axes, with one point measuring 1.4, 1.0 and 0.8 under the three. You will know the four requirements a norm must meet and the four a metric must meet, why squared Euclidean distance fails one of them, and why cosine distance fails two — restated with a triple you can hold in your head rather than a proof, and confirmed by an exhaustive sweep in which 326 of 3375 binary triples break the triangle inequality while Jaccard and Hamming break none of 4096. You will meet Hamming distance, which is the right answer for categorical data and which most people replace with an integer encoding that quietly asserts brass is nearer to steel than nylon is. You will see Jaccard and cosine rank the same two sets in opposite orders and be able to say which question each answers. You will meet Mahalanobis distance as Euclidean distance after the data has had its say, with two points that sit at an identical 4.2426 from the mean and at 1.1142 and exactly 6.0 once the covariance is accounted for — and you will see those two numbers fall straight out of Day 106 eigenvectors. And you will finish holding the practical warning the day exists for: with bore diameter in metres against mass in grams, one column contributes 0.0036 per cent of every distance and the winner is a part that will not fit; standardise both columns and the winner changes, and changing nothing but the unit of one column changes it too.'
objectives:
  - 'Name three measures that pick three different winners on the same query, and state the question each one is answering'
  - 'Write the general p-norm, handle p = infinity as a limit rather than as arithmetic, and say why p below 1 must be refused'
  - 'Draw or recognise the unit ball of L1, L2 and L-infinity, and read the nesting off the picture'
  - 'State the four norm axioms and check absolute homogeneity numerically, including the case where squared Euclidean distance fails it'
  - 'State the four metric axioms and give a concrete counter-example showing cosine distance failing the triangle inequality'
  - 'Explain what a non-metric costs you in practice — tree pruning, index guarantees, termination proofs — and give the standard repair'
  - 'Choose between Manhattan, Euclidean and Chebyshev from the shape of the problem, using a case where each is the only correct answer'
  - 'Use Hamming distance for categorical fields, and explain what integer-encoding a category silently asserts'
  - 'Contrast Jaccard against cosine on identical set data, and predict which one favours a large superset'
  - 'Build a covariance matrix, invert it, and use Mahalanobis distance to separate two points that Euclidean distance cannot'
  - 'Connect Mahalanobis distance to Day 106 eigenvectors, dividing each component by the square root of its eigenvalue'
  - 'Demonstrate that scaling decides a ranking, and choose between z-score, min-max and a measure that needs neither'
  - 'Implement L1, L2, L-infinity, Hamming and Jaccard in pure Python and assert each against NumPy or a hand-computed value'
  - 'Write one ranking function that takes the measure as a parameter, so swapping the measure is one argument'
prerequisites:
  - 'Day 99 — vectors, the L1 and L2 norms, and Euclidean distance; today generalises all three'
  - 'Day 100 — matrices, which is what a covariance matrix is'
  - 'Day 101 — matrix multiplication, which is the arithmetic inside the Mahalanobis formula'
  - 'Day 103 — dot products, cosine similarity, and the proof that cosine distance fails the triangle inequality; today restates the result rather than re-deriving it'
  - 'Day 104 — NumPy arrays, shape and dtype, used throughout as the independent answer'
  - 'Day 106 — eigenvalues, eigenvectors and the covariance matrix, which is where the Mahalanobis numbers come from'
  - 'Day 70 — floating point, which is why every comparison in this lesson declares a tolerance'
  - 'Day 43 — python3 -m venv and pip; the lab installs numpy and pytest into a lab-local environment'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'No statistics beyond a mean and a standard deviation; the lab builds both from scratch'
