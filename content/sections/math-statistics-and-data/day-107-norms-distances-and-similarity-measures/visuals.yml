visuals:
  - id: norm-family-architecture
    file: assets/norm-family-architecture.svg
    type: diagram
    title: 'The unit ball of L1, L2 and L-infinity drawn on the same axes — a diamond, a circle and a square — with one point measured under each norm and the three different numbers labelled'
    alt: 'Diagram: the unit ball of the L1, L2 and L-infinity norms drawn on one set of axes as a diamond, a circle and a square, with the point 0.6 comma 0.8 measured under each and the three answers 1.4, 1.0 and 0.8 labelled, beside a table of the p-norm of the vector 3 comma 4 falling from 7 to 4 as p rises from 1 to infinity'
    description: 'A static architecture diagram carrying the day''s central idea in one picture: L1, L2 and L-infinity are not three ideas but one formula with the dial set to three values, and the difference is visible as three shapes. The heading reads One formula, one dial: the unit ball of each norm, with a caption noting that every point on a shape is at distance exactly 1.0 from the centre — same centre, same radius, three meanings of radius. The large left panel, headed The three unit balls, on one set of axes, draws a pair of axes with ticks at plus and minus 1 on both, and on them three shapes concentric about the origin: an amber diamond with vertices on the axes at plus and minus 1, filled with a translucent amber wash; a blue circle of radius 1; and a green dashed square from minus 1 to plus 1 in both directions. A blue dot marks the point 0.6 comma 0.8, joined to the origin by a dashed leader, and is annotated as sitting outside the diamond, ON the circle, and inside the square. Beneath the axes three colour-matched labels record L1 dot diamond with the equation the absolute value of x plus the absolute value of y equals 1 and area 2; L2 dot circle with x squared plus y squared equals 1 and area pi, about 3.14; and L-infinity dot square with the maximum of the two absolute values equals 1 and area 4. The upper right card, headed One point. Three different sizes, sets out the same point three ways in monospace: L1 as 0.6 plus 0.8 equals 1.4, L2 as the square root of 0.36 plus 0.64 equals 1.0, and L-infinity as the maximum of 0.6 and 0.8 equals 0.8, closing with the note that the bigger p is, the smaller the number and the bigger the ball, which is the same fact said twice. The lower right panel, headed Turning the dial on v equals 3 comma 4, gives the general formula as the p-th root of the sum of the absolute values raised to the power p, then tabulates measured values: p equals 1 gives 7.000000, annotated 3 plus 4; p equals 1.5 gives 5.584250; p equals 2 gives 5.000000, annotated the 3-4-5 triangle; p equals 3 gives 4.497941; p equals 8 gives 4.047992; p equals 64 gives 4.000000, annotated the limit arrives; and p equals infinity gives 4.000000, annotated just the biggest. Across the bottom, three colour-matched cards say what each norm is for. The amber card, L1 — total disagreement, states that every unit of error costs the same wherever it happens, that ten features one out costs what one feature ten out costs, and names grid movement. The blue card, L2 — straight-line separation, states that squaring punishes one big error far more than several small ones adding to the same total, and that this is the one ordinary geometry hands you. The green card, L-infinity — the worst component, states that every other feature is ignored entirely, and that a rule of the form no dimension may be out by more than X is this ball and cannot be written as anything else.'
  - id: scaling-changes-the-answer-flow
    file: assets/scaling-changes-the-answer-flow.svg
    type: flow-animated
    title: 'The same nearest-neighbour search before and after standardising: in metres and grams the winner is bearing R, and after both columns are divided by their own standard deviations the winner is bearing P'
    alt: 'Diagram: the same nearest-neighbour search run twice, first with bore diameter in metres and mass in grams where every part collapses onto one line and bearing R wins at a distance of 2.000036, then after standardising both columns where the points spread across two dimensions and bearing P wins at 0.466883'
    description: 'An animated flow diagram in three parts, fully readable as a still image, showing one Euclidean nearest-neighbour search run twice on identical data with every number measured rather than illustrated. The heading reads The units decide the answer, and nobody voted on them, with a caption naming the data: six bearings, one query of bore 0.020 metres and mass 300 grams, the same Euclidean distance and the same code both times, with both columns present both times. The left panel, headed 1 dot RAW — metres and grams, explains that both columns are drawn at the SAME scale and that the whole bore column spans 0.03 of one gram-width, so all seven points land on one line. A single vertical axis labelled mass in grams carries the seven points at their true relative heights: V at 500 grams, T at 410, P at 340, then R at 302 and the query at 300 essentially on top of one another, then U at 275 and S at 250. The query is drawn as a blue diamond with a dashed leader to its label; R is drawn as an amber dot inside an amber ring that pulses gently outward and rests at its resting radius, labelled R 302 g and nearest: 2.000036. Notes beneath record that R and the query overlap here because 2 grams is 3 pixels at this scale, that the winner is R with a bore of 0.032 metres, that this is 60 per cent oversize and will not fit the shaft, and that the bore column contributed 0.0036 per cent of the distance. In the middle, a blue marching-dash arrow carries a small blue travelling token from the left panel to the right, labelled standardise, with the formula z equals x minus mean, divided by sd, the measured column means 0.0230 and 346.17, the measured standard deviations 0.0102 and 85.67, and the note that these are taken from the CATALOGUE and then applied to the query too. The right panel, headed 2 dot STANDARDISED, states that both columns now speak in standard deviations of the catalogue so bore can finally be heard, and draws a two-dimensional scatter on axes labelled bore in z and mass in z: S at minus 1.46 and minus 1.12, U at minus 0.88 and minus 0.83, R at plus 0.88 and minus 0.52, T at plus 0.29 and plus 0.75, V at plus 1.46 and plus 1.80, the query as a blue diamond at minus 0.29 and minus 0.54, and P directly above it at minus 0.29 and minus 0.07, ringed in green with a ring that pulses after the amber one and rests at its resting radius, labelled P nearest: 0.466883. Notes beneath record that every point is now within about two standard deviations of the centre, that the winner is P with a bore of 0.020 metres, exactly the bore that was asked for, and that it was third before, behind a part that cannot be fitted. Across the bottom two cards give the two rankings in full: Raw Euclidean as R then U then P then S then T then V, described as effectively a ranking on mass alone with a rounding error attached; and Standardised Euclidean as P then U then R then S then T then V, with the note that two parts moved and they are the two the decision was between, P and R swapping first for third. A prefers-reduced-motion block stops every animation and restores the resting state, in which the travelling token sits at the start of its path, the connecting arrow is a solid line, both rings sit at their resting radius at full opacity, and every point, label, ranking and number is present.'
