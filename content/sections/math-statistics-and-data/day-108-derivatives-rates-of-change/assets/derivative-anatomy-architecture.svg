<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="d108a-title d108a-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <title id="d108a-title">The anatomy of a derivative: three secant lines over shrinking intervals, with rise, run and the computed slope at each stage, and the tangent they approach</title>
  <desc id="d108a-desc">Three panels show the curve y equals x squared near x equals 3. In each panel a secant line runs from the point at x equals 3 to a second point that is closer each time, with a right triangle marking the rise and the run and the slope computed from them: 16 over 2 is 8, then 3.25 over 0.5 is 6.5, then 0.61 over 0.1 is 6.1. The third panel also shows the tangent line the secants are approaching, whose slope is 6. A summary band gives the whole sequence and the algebra that produces it.</desc>

  <style>
    .d108a-bg    { fill: #f8fafc; }
    .d108a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d108a-h1    { fill: #1a202c; font-size: 26px; font-weight: 700; }
    .d108a-h2    { fill: #1d4ed8; font-size: 19px; font-weight: 700; }
    .d108a-lbl   { fill: #1a202c; font-size: 15px; }
    .d108a-mono  { fill: #1a202c; font-size: 15px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .d108a-monob { fill: #1d4ed8; font-size: 16px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .d108a-note  { fill: #475569; font-size: 14px; }
    .d108a-curve { fill: none; stroke: #1a202c; stroke-width: 2.5; }
    .d108a-sec   { stroke: #b45309; stroke-width: 2.5; fill: none; }
    .d108a-tan   { stroke: #1d4ed8; stroke-width: 3; fill: none; }
    .d108a-leg   { stroke: #b45309; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .d108a-dot   { fill: #1d4ed8; }
    .d108a-dot2  { fill: #b45309; }
    .d108a-axis  { stroke: #94a3b8; stroke-width: 1; }
    .d108a-band  { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d108a-amber { fill: #b45309; font-size: 15px; font-weight: 700; }
  </style>

  <rect class="d108a-bg" width="960" height="800"/>

  <text class="d108a-h1" x="40" y="46">A derivative, assembled from three secants</text>
  <text class="d108a-lbl" x="40" y="74">The curve is y = x², and the fixed point is P = (3, 9) in every panel. Each stage moves the second point closer and recomputes rise ÷ run.</text>
  <text class="d108a-note" x="40" y="98">Every number below is exact arithmetic on x², checkable with a pen. Nothing here is measured or approximate.</text>

  <!-- ================= PANEL 1 : h = 2 ================= -->
  <rect class="d108a-panel" x="60" y="150" width="260" height="300"/>
  <text class="d108a-h2" x="60" y="140">Stage 1 — h = 2</text>
  <polyline class="d108a-curve" points="60.0,437.4 73.0,427.1 86.0,416.4 99.0,405.2 112.0,393.6 125.0,381.6 138.0,369.1 151.0,356.3 164.0,342.9 177.0,329.2 190.0,315.0 203.0,300.4 216.0,285.3 229.0,269.9 242.0,253.9 255.0,237.6 268.0,220.8 281.0,203.6 294.0,186.0 307.0,167.9 313.5,158.7"/>
  <line class="d108a-leg" x1="81.7" y1="420.0" x2="298.3" y2="420.0"/>
  <line class="d108a-leg" x1="298.3" y1="420.0" x2="298.3" y2="180.0"/>
  <line class="d108a-sec" x1="81.7" y1="420.0" x2="298.3" y2="180.0"/>
  <circle class="d108a-dot" cx="81.7" cy="420.0" r="5.5"/>
  <circle class="d108a-dot2" cx="298.3" cy="180.0" r="5.5"/>
  <text class="d108a-mono" x="88" y="440">P (3, 9)</text>
  <text class="d108a-mono" x="228" y="172">(5, 25)</text>
  <text class="d108a-amber" x="150" y="440">run = 2</text>
  <text class="d108a-amber" x="306" y="304">rise</text>
  <text class="d108a-amber" x="306" y="322">= 16</text>

  <!-- ================= PANEL 2 : h = 0.5 ================= -->
  <rect class="d108a-panel" x="370" y="150" width="260" height="300"/>
  <text class="d108a-h2" x="370" y="140">Stage 2 — h = 0.5</text>
  <polyline class="d108a-curve" points="370.0,439.1 383.0,427.9 396.0,416.4 409.0,404.7 422.0,392.8 435.0,380.6 448.0,368.2 461.0,355.6 474.0,342.8 487.0,329.7 500.0,316.4 513.0,302.9 526.0,289.1 539.0,275.2 552.0,261.0 565.0,246.5 578.0,231.9 591.0,217.0 604.0,201.9 617.0,186.6 630.0,171.0"/>
  <line class="d108a-leg" x1="440.9" y1="375.0" x2="559.1" y2="375.0"/>
  <line class="d108a-leg" x1="559.1" y1="375.0" x2="559.1" y2="253.1"/>
  <line class="d108a-sec" x1="415.0" y1="428.0" x2="613.0" y2="224.0"/>
  <circle class="d108a-dot" cx="440.9" cy="375.0" r="5.5"/>
  <circle class="d108a-dot2" cx="559.1" cy="253.1" r="5.5"/>
  <text class="d108a-mono" x="384" y="398">P (3, 9)</text>
  <text class="d108a-mono" x="470" y="242">(3.5, 12.25)</text>
  <text class="d108a-amber" x="452" y="396">run = 0.5</text>
  <text class="d108a-amber" x="566" y="310">rise</text>
  <text class="d108a-amber" x="566" y="328">= 3.25</text>

  <!-- ================= PANEL 3 : h = 0.1, with the tangent ================= -->
  <rect class="d108a-panel" x="680" y="150" width="260" height="300"/>
  <text class="d108a-h2" x="680" y="140">Stage 3 — h = 0.1</text>
  <polyline class="d108a-curve" points="680.0,442.9 693.0,430.0 706.0,417.0 719.0,403.9 732.0,390.6 745.0,377.2 758.0,363.6 771.0,349.9 784.0,336.0 797.0,322.0 810.0,307.9 823.0,293.6 836.0,279.2 849.0,264.6 862.0,249.9 875.0,235.1 888.0,220.1 901.0,204.9 914.0,189.7 927.0,174.2 940.0,158.7"/>
  <line class="d108a-tan" x1="680.0" y1="450.0" x2="940.0" y2="165.8"/>
  <line class="d108a-leg" x1="810.0" y1="307.9" x2="853.3" y2="307.9"/>
  <line class="d108a-leg" x1="853.3" y1="307.9" x2="853.3" y2="259.7"/>
  <line class="d108a-sec" x1="684.3" y1="447.6" x2="940.0" y2="163.4"/>
  <circle class="d108a-dot" cx="810.0" cy="307.9" r="5.5"/>
  <circle class="d108a-dot2" cx="853.3" cy="259.7" r="5.5"/>
  <text class="d108a-mono" x="700" y="332">P (3, 9)</text>
  <text class="d108a-mono" x="770" y="248">(3.1, 9.61)</text>
  <text class="d108a-amber" x="790" y="330">run = 0.1</text>
  <text class="d108a-amber" x="860" y="278">rise = 0.61</text>
  <text class="d108a-lbl" x="686" y="196" fill="#1d4ed8">the tangent — slope 6</text>
  <text class="d108a-note" x="686" y="216">the secant is now nearly on top of it</text>

  <!-- ================= PANEL CAPTIONS ================= -->
  <text class="d108a-monob" x="60" y="486">slope = 16 ÷ 2 = 8.00</text>
  <text class="d108a-note" x="60" y="508">The average rate of change of x²</text>
  <text class="d108a-note" x="60" y="528">between x = 3 and x = 5. A true</text>
  <text class="d108a-note" x="60" y="548">statement about the interval, and</text>
  <text class="d108a-note" x="60" y="568">not a statement about x = 3.</text>

  <text class="d108a-monob" x="370" y="486">slope = 3.25 ÷ 0.5 = 6.50</text>
  <text class="d108a-note" x="370" y="508">Same construction, shorter interval.</text>
  <text class="d108a-note" x="370" y="528">The number moved from 8 to 6.5 and</text>
  <text class="d108a-note" x="370" y="548">the line pivoted towards the curve's</text>
  <text class="d108a-note" x="370" y="568">direction at P.</text>

  <text class="d108a-monob" x="680" y="486">slope = 0.61 ÷ 0.1 = 6.10</text>
  <text class="d108a-note" x="680" y="508">Closer still. The secant and the</text>
  <text class="d108a-note" x="680" y="528">tangent are now hard to tell apart</text>
  <text class="d108a-note" x="680" y="548">by eye, and the numbers say why:</text>
  <text class="d108a-note" x="680" y="568">6.10 against 6.00.</text>

  <!-- ================= SUMMARY BAND ================= -->
  <rect class="d108a-band" x="40" y="596" width="880" height="180" rx="6"/>
  <text class="d108a-h2" x="62" y="626">The sequence, and why it settles</text>

  <text class="d108a-mono" x="62" y="656">h        second point      rise      run      slope</text>
  <text class="d108a-mono" x="62" y="678">2        (5, 25)           16        2        8.00</text>
  <text class="d108a-mono" x="62" y="698">0.5      (3.5, 12.25)      3.25      0.5      6.50</text>
  <text class="d108a-mono" x="62" y="718">0.1      (3.1, 9.61)       0.61      0.1      6.10</text>
  <text class="d108a-mono" x="62" y="738">0.01     (3.01, 9.0601)    0.0601    0.01     6.01</text>
  <text class="d108a-monob" x="62" y="760">h → 0    the tangent       —         —        6.00</text>

  <text class="d108a-lbl" x="530" y="656">The algebra behind the pattern:</text>
  <text class="d108a-mono" x="530" y="682">  (3 + h)² − 9      9 + 6h + h² − 9</text>
  <text class="d108a-mono" x="530" y="702">  ───────────  =  ───────────────  =  6 + h</text>
  <text class="d108a-mono" x="530" y="722">        h                  h</text>
  <text class="d108a-note" x="530" y="748">The slope over [3, 3 + h] is 6 + h exactly, at every h. As h shrinks,</text>
  <text class="d108a-note" x="530" y="766">6 + h settles on 6 — and 6 is the derivative of x² at x = 3.</text>
</svg>
