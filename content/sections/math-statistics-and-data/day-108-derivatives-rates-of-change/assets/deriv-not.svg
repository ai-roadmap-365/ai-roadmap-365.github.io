<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a derivative is not</title>
  <style>
    .deriv-not-bg   { fill: #f8fafc; }
    .deriv-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deriv-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deriv-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deriv-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deriv-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deriv-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deriv-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deriv-not-row { opacity: 1; }
    .deriv-not-r0 { animation-delay: 0.00s; }
    .deriv-not-r1 { animation-delay: 0.45s; }
    .deriv-not-r2 { animation-delay: 0.90s; }
    .deriv-not-r3 { animation-delay: 1.35s; }
    .deriv-not-r4 { animation-delay: 1.80s; }
    .deriv-not-row { animation: deriv-not-reveal 7.3s ease-in-out infinite; }
    @keyframes deriv-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="deriv-not-bg" width="980" height="390"/>
  <text class="deriv-not-h1"  x="30" y="40">Four things a derivative is not</text>
  <text class="deriv-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="deriv-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="deriv-not-name" x="46" y="122">The misconception</text>
  <text class="deriv-not-desc" x="46" y="142">Commonly held.</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r0" x="46" y="182">It is the value of the function</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r1" x="46" y="216">Every function has one everywhere</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r2" x="46" y="250">Zero derivative means a minimum</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r3" x="46" y="284">It describes behaviour far away</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r4" x="46" y="318">Bigger derivative means bigger value</text>
  <rect class="deriv-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="deriv-not-name" x="526" y="122">What is true</text>
  <text class="deriv-not-desc" x="526" y="142">Actually.</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r0" x="526" y="182">It is the rate of change of the value</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r1" x="526" y="216">Corners and jumps have none</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r2" x="526" y="250">It could be a maximum or a saddle</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r3" x="526" y="284">It is local information only</text>
  <text class="deriv-not-desc deriv-not-row deriv-not-r4" x="526" y="318">It means steeper, not higher</text>
  <text class="deriv-not-sub" x="30" y="372">Locality is the property to keep in mind for optimisation: a gradient tells you which way is downhill here, and nothing about where the bottom is.</text>
</svg>
