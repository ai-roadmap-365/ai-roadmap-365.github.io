title: 'Derivatives: Rates of Change'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 16
learning_promise: 'After this lesson you will know what a derivative is, why anyone bothered to invent one, and why it is the single object that makes training a model possible — and you will have arrived there through arithmetic you can check with a pen rather than through a definition you have to take on trust. You will start from something you already understand as a rate: a car covers 144 metres in 6 seconds, so its average speed is 24 metres per second, and a speedometer somehow shows a number at an instant instead. You will see the arithmetic refuse that question — rise zero over run zero is not a number — and then watch the way round it, computing the slope over intervals of 1, 0.1, 0.01 and 0.001 and seeing the answers settle on 7, 6.1, 6.01, 6.001 without anyone taking a limit. You will meet the tangent as the line those secants approach, not as a line that touches once. You will meet all three notations, defined at first use. You will learn the five rules you actually need and see each one checked against a measurement, including the reason e is special, shown rather than asserted: the slope of b to the x at zero is 0.693 for base 2, 1.000 for base e and 2.303 for base 10. You will implement the forward and central differences yourself, prove that halving the step halves one error and quarters the other, and then meet the finding that contradicts everyone''s intuition — making h smaller eventually makes the answer WORSE, and at h = 1e-300 it is exactly 0.0 with no warning at all. You will measure that error across 27 step sizes, watch the U appear, and find the bottom. You will learn what a zero derivative does not tell you, meet the second derivative as the thing that distinguishes a minimum from a maximum, and meet the case it cannot decide either. And you will finish where derivatives fail: at a corner like the one in ReLU, where the central difference confidently returns an answer to a question that has none.'
objectives:
  - 'Compute an average rate of change as rise over run, and say precisely what it does and does not claim about the interval it covers'
  - 'Explain why the rate over an interval of zero width has no answer, and what the derivative does about that rather than pretending otherwise'
  - 'Compute the sequence of secant slopes over shrinking intervals and recognise it settling — meeting a limit as an observation before meeting it as a definition'
  - 'Define the tangent line as the line the secants approach, and write its equation for a given curve and point'
  - 'Read and use all three derivative notations — f prime of x, dy by dx, and the operator form — and say why more than one exists'
  - 'Apply the constant, power, constant-multiple and sum rules, and know the derivatives of e to the x and the natural logarithm as facts worth memorising'
  - 'Say what makes e special, and describe the measurement that shows it: the slope of b to the x at zero is the natural logarithm of b'
  - 'Implement the forward, backward and central differences from scratch and explain why the central rule''s error falls like h squared where the forward rule''s falls like h'
  - 'Explain the two error terms in a numerical derivative — truncation from the mathematics, rounding from the arithmetic — and why they pull in opposite directions'
  - 'Predict, measure and explain the U-shaped error curve, and choose a sensible step size for float64 rather than the smallest one available'
  - 'State what a zero derivative does and does not tell you, and use the second derivative''s sign to distinguish a minimum from a maximum'
  - 'Name the case the second derivative cannot decide, and explain why answering it anyway would be worse than admitting ignorance'
  - 'Recognise where a derivative fails to exist, connect that to the corner in ReLU, and detect it using values you have already computed'
  - 'Explain in one honest paragraph why training a model is a search for a minimum, and why the derivative is what tells you which way is downhill'
  - 'Distinguish numerical, symbolic and automatic differentiation, and say what each is for'
prerequisites:
  - 'Day 70 — floating point. Half of this lesson is a consequence of it, and the U-shaped error curve is unreadable without it'
  - 'Day 102 — linear transformations, where ReLU first appeared. Today it comes back as the corner rather than the transformation'
  - 'Day 104 — NumPy arrays. Used lightly: numpy.gradient as the library alternative, and numpy.finfo to check the epsilon rather than trust it'
  - 'Day 43 — python3 -m venv and installing a package with pip; the lab installs numpy and pytest into a lab-local environment'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'No calculus. None is assumed and none is skipped over'
  - 'School arithmetic, the idea of a graph, and the ability to read a straight line as y = mx + c'
