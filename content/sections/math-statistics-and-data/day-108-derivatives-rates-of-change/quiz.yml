questions:
  - question: 'A car covers 144 metres in 6 seconds. Its average speed is 24 metres per second. What does that number tell you about the car''s speed at t = 3?'
    options:
      - 'That it was travelling at 24 m/s at t = 3, since that is the middle of the interval'
      - 'Nothing directly — it is a statement about the whole interval, and the car may never have travelled at 24 m/s at all'
      - 'That its speed at t = 3 was at most 24 m/s'
      - 'That its speed at t = 3 was at least 24 m/s'
    answer_index: 1
    explanation: 'An average rate of change is a complete and true statement about an interval and says nothing on its own about any point inside it. In the lab''s data the car''s distance is 4t², so it starts at rest and finishes at 48 m/s; 24 is the constant speed that would have covered the same distance in the same time, and the car happens to reach it once, at t = 3, but only because this particular function is a parabola. Options 2 and 3 are both wrong for the same reason and in opposite directions — the instantaneous speed here is below 24 for the first half of the trip and above it for the second. This gap between "over the interval" and "right here" is the entire reason the derivative exists.'

  - question: 'For f(x) = x², the average rate of change over the interval from 3 to 3 + h simplifies to a short expression. Which one, and how exact is it?'
    options:
      - '6, approximately, and the approximation improves as h shrinks'
      - '6 + h, exactly, for every h'
      - '6 + h², exactly, for every h'
      - '9 + 6h, exactly, for every h'
    answer_index: 1
    explanation: 'Expand and cancel: ((3 + h)² − 9) ÷ h = (9 + 6h + h² − 9) ÷ h = (6h + h²) ÷ h = 6 + h. That is algebra, not approximation — the slope of the secant over that interval is 6 + h at every h, and the lab asserts it for h = 1, 0.1, 0.01 and 0.001, giving 7, 6.1, 6.01 and 6.001. Option 0 conflates two different facts that the lesson is careful to keep apart: the formula is exact, and it is the LIMIT of the formula that is 6. Notice what the algebra achieved that the arithmetic could not — it cancelled the h in the denominator BEFORE h was allowed to reach zero. At h = 0 the original fraction is 0 ÷ 0 and means nothing; the simplified form 6 + h means something at every h including zero, and 6 is what it means there.'

  - question: 'Why is the central difference so much more accurate than the forward difference at the same step size?'
    options:
      - 'It uses a smaller effective step, since 2h in the denominator halves the interval'
      - 'It uses more function evaluations, and more samples always means more accuracy'
      - 'It avoids subtracting nearly equal numbers, so it has no rounding error'
      - 'It is the average of the forward and backward differences, whose leading errors have opposite signs and cancel'
    answer_index: 3
    explanation: 'Write out Taylor''s expansions of f(x + h) and f(x − h). The h·f''(x) terms have opposite signs and the (h²/2)·f''''(x) terms have the SAME sign. Subtracting the second expansion from the first therefore cancels the f'''' terms exactly, and the first survivor is the f'''''' term with h²/6 in front — which is why the central error falls like h² where the forward error falls like h. On e^x at x = 1 with h = 1e-5 the lab measured a forward error of 1.36e-5 against a central error of 5.86e-11, a factor of about 232,000, for one extra function call. Option 0 has the arithmetic backwards: the interval is 2h wide, not h/2. Option 1 is a superstition — the five-point rule is better than the three-point rule for a real reason, not because it has more points. Option 2 is exactly wrong: the central difference subtracts two nearly equal numbers just as the forward one does, which is why it has a U-shaped error curve too.'

  - question: 'You want an accurate numerical derivative in float64, so you choose h = 1e-12 rather than h = 1e-5. What happens?'
    options:
      - 'The answer improves, since the difference quotient is closer to its limit'
      - 'The answer is unchanged, because float64 has more than 12 digits of precision'
      - 'The answer gets much worse — on the lab''s run, about 464 times worse'
      - 'The function raises an exception warning about precision loss'
    answer_index: 2
    explanation: 'Two errors govern a difference quotient and they pull in opposite directions. Truncation error comes from the mathematics and SHRINKS with h. Rounding error comes from the arithmetic and GROWS with h: f(x + h) and f(x − h) are each stored to about 1e-16 relative precision, subtracting two nearly equal numbers destroys the digits they had in common, and dividing by a tiny h magnifies what is left. Add a term that shrinks to a term that grows and you get a U. The lab measured the central difference''s error on e^x at h = 1e-3 and at h = 1e-12 and found the "careful" choice 464 times worse. The extreme case is the one to remember: at h = 1e-300 the answer is exactly 0.0, because exp(1 + 1e-300) and exp(1) are the same float64 and their difference is exactly zero — and option 3 is wrong in the way that matters most, since nothing warns you about any of it.'

  - question: 'Where does the error of a central difference bottom out in float64, and how do you know?'
    options:
      - 'Around 1e-16, the machine epsilon, since that is the limit of the arithmetic'
      - 'Around 1e-5 to 1e-6, where the truncation term and the rounding term are about equal in size'
      - 'It does not bottom out; it falls monotonically as h shrinks'
      - 'Around 1e-8, the same place as the forward difference'
    answer_index: 1
    explanation: 'Set the two error terms equal and solve. Truncation is about (h²/6)·f'''''' and rounding is about EPSILON·|f| ÷ h, so the balance sits near (3·EPSILON)^(1/3), which is 8.7e-6 for float64. The lab measured the minimum at h = 3.16e-6 on a 27-point grid — within a factor of ten of the prediction, which is the honest expectation given three grid steps per decade, the dropped constants and the fact that rounding error near the bottom is a random walk rather than a smooth curve. Option 3 is the forward difference''s answer: its truncation term is proportional to h rather than h², so its balance is at about sqrt(2·EPSILON) = 2.1e-8, and the lab measured 1e-8. Option 0 mistakes the precision of a stored number for the accuracy of a computed difference of two of them. Option 2 is the intuition the whole day exists to correct.'

  - question: 'You compute f''(x) numerically at three different points and get 0.0 at all three. What have you learned?'
    options:
      - 'That all three are minima'
      - 'That the function is constant between them'
      - 'That the graph is flat at all three, and nothing more — each could be a minimum, a maximum, or neither'
      - 'That your step size is too small and the answers are cancellation noise'
    answer_index: 2
    explanation: 'A zero derivative says the ground is level. It does not say whether you are at the bottom of a valley, the top of a hill, or on a flat step partway down a slope. The lab measures all three at once: (x − 2)² + 1 at x = 2 is a minimum, x³ − 3x at x = −1 is a maximum, x³ at 0 is neither, and the first derivative reports zero at every one of them. The second derivative resolves two of the three by its sign — positive is a bowl, negative is a dome — and the lab measures 2, −6 and 0 respectively. Where it is also zero it resolves nothing, and that is not a numerical failure: x³ at 0 and x⁴ at 0 give identical readings and are a step and a genuine minimum respectively. The lab''s classifier returns "undecided" there and a test asserts it, because reporting "minimum" would be right by accident on one of the two. Option 3 deserves a mention because it is a real hazard in other situations — but here the readings are stable across step sizes, which is exactly how you tell a true zero from cancellation noise.'

  - question: 'f(x) = |x| has no derivative at x = 0. What does `central_difference(abs, 0.0, 1e-5)` return?'
    options:
      - '0.0, with no error and no warning'
      - 'nan, since the derivative is undefined'
      - 'It raises a ValueError'
      - 'It returns +1 or −1 depending on the sign of h'
    answer_index: 0
    explanation: 'The formula is (|0 + h| − |0 − h|) ÷ 2h, which is (h − h) ÷ 2h = 0, exactly, at every h. The lab asserts that for h from 1e-2 down to 1e-14: shrinking h never reveals a limit that is not there, and there is no settling to observe because nothing is converging. This is the most important habit in the day: a numerical method always returns a number, and returning a number is not the same as there being one. Worse, 0.0 is a plausible-looking answer — it is what you get at the bottom of a valley — while here it means the opposite, that the function is changing as fast as it can in both directions at once. The cheapest detector costs nothing extra: compute the forward and backward differences, which are +1 and −1 here, and if they disagree by more than your tolerance, the value between them is an average rather than a slope. The second difference is an even louder alarm: at a corner it is exactly 2/h, so it grows without limit as h shrinks instead of converging.'

  - question: 'Automatic differentiation, as used by JAX and PyTorch, is best described as which of these?'
    options:
      - 'A faster numerical differentiation, using an optimally chosen h'
      - 'Symbolic differentiation applied to the source code, producing a formula for the gradient'
      - 'Neither — it applies the chain rule to the program''s own operations as they run, so there is no h and no formula'
      - 'A lookup table of derivatives for the standard functions'
    answer_index: 2
    explanation: 'There are three ways to get a derivative and it is worth keeping them separate. Numerical differentiation samples f at nearby points; it works on any function you can call, needs no source, and pays for that with the U-shaped error curve this lesson measures. Symbolic differentiation, which SymPy does, manipulates a formula and returns another formula: exact, inspectable, and prone to producing expressions that grow enormous for anything complicated. Automatic differentiation is neither. It records the elementary operations a program actually performs and applies the chain rule to that record, giving a derivative that is exact to floating-point precision with no step size to choose and no expression swell. Day 110 covers the chain rule it automates, and Day 111 writes the gradient descent that consumes the result. None of these three tools is installed in this lab, so no output from any of them is reproduced anywhere in this lesson — they are described from their documentation and marked as such. Numerical differentiation keeps one job even in a framework world: it is how you check that an analytic or automatic gradient is right.'
