terms:
  - term: 'Rate of change'
    definition: 'How much one quantity changes for a given change in another: the difference in the output divided by the difference in the input. Metres per second, dollars per unit, loss per unit of weight. Everything in this lesson is one idea applied at different interval widths, and this is the idea. Note that a rate is always attached to an interval or to a point; a rate with neither attached is not a claim about anything.'
  - term: 'Average rate of change'
    definition: 'The rate of change of f over an interval: (f(b) − f(a)) ÷ (b − a), read as rise over run. It is a true and complete statement about the interval and says nothing about any point inside it — a car averaging 24 metres per second over six seconds may never have travelled at 24 metres per second at all. Computable with nothing but arithmetic, which is why this lesson starts there.'
  - term: 'Secant line'
    definition: 'The straight line through two points on a curve. Its slope is exactly the average rate of change between those two points, which makes "average rate of change" and "slope of the secant" two names for one number. As the two points move closer together, the secant pivots — and what it pivots towards is the tangent.'
  - term: 'Tangent line'
    definition: 'The line the secants approach as the interval shrinks to nothing, and the line whose slope is the derivative. It is not "the line that touches the curve at exactly one point": plenty of lines do that without being tangents, and a tangent may cross its curve elsewhere. For y = x² at x = 3 the tangent is y = 6x − 9. The useful reading is that the tangent is the best straight-line approximation to the curve near that point.'
  - term: 'Limit'
    definition: 'The single value a sequence or an expression gets arbitrarily close to, without necessarily ever reaching it. The secant slopes over [3, 3 + h] for h = 1, 0.1, 0.01, 0.001 are 7, 6.1, 6.01 and 6.001, and their limit as h goes to zero is 6. The limit is not "what you get when h equals zero" — at h = 0 the expression is 0 ÷ 0 and means nothing. It is what the values settle on as h approaches zero, from both directions.'
  - term: 'Derivative'
    definition: 'The instantaneous rate of change of a function at a point: the limit of the difference quotient as the interval width goes to zero, and equivalently the slope of the tangent line there. Written f''(x) or dy/dx. A derivative is itself a function — it has a value at every point where the limit exists — and its own derivative is the second derivative. The reason it matters for this course is one sentence: its sign tells you which way to move to make a quantity smaller.'
  - term: 'Difference quotient'
    definition: 'The fraction (f(x + h) − f(x)) ÷ h whose limit defines the derivative. Everything in numerical differentiation is a difference quotient evaluated at a finite h rather than taken to a limit, which is why every numerical derivative is an approximation and why the choice of h matters so much.'
  - term: 'Differentiable'
    definition: 'A function is differentiable at a point when the limit of its difference quotient exists there — which requires the limit from the left and the limit from the right to agree. |x| is continuous at 0 and not differentiable at 0: the left slope is −1 and the right slope is +1, and there is no third number between them that the sequence settles on. Differentiable implies continuous; continuous does not imply differentiable.'
  - term: 'Forward difference'
    definition: 'The estimate (f(x + h) − f(x)) ÷ h: the definition of the derivative with a finite h substituted for the limit. Its truncation error is proportional to h, so halving the step roughly halves the error. It needs two function values, one of which is usually f(x) itself, so where f(x) is already known it costs one extra evaluation — which is why it survives despite being much less accurate than the central difference.'
  - term: 'Central difference'
    definition: 'The estimate (f(x + h) − f(x − h)) ÷ (2h): a secant straddling the point rather than reaching forward from it. It is the average of the forward and backward differences, and that averaging cancels their leading errors, leaving a truncation error proportional to h² rather than h. Halving the step quarters the error. On e^x at x = 1 with h = 1e-5 it was over two hundred thousand times more accurate than the forward difference on the authoring machine, for one extra function call. Note the divisor is 2h, not h; forgetting the 2 doubles every answer.'
  - term: 'Truncation error'
    definition: 'The part of a numerical derivative''s error that comes from the mathematics rather than the arithmetic: the difference quotient is the limit''s approximation at a finite h, and it is wrong by roughly (h ÷ 2)·f''''(x) for the forward rule and (h² ÷ 6)·f''''''(x) for the central one. It shrinks as h shrinks, which is the half of the story everyone knows.'
  - term: 'Rounding error'
    definition: 'The part of a numerical derivative''s error that comes from the arithmetic: f(x + h) and f(x − h) are each stored to about 1e-16 relative precision, subtracting two nearly equal numbers destroys the digits they had in common, and dividing by a tiny h magnifies what is left, giving roughly EPSILON·|f(x)| ÷ h. It GROWS as h shrinks, which is the half that surprises people, and it is why a forward difference at h = 1e-300 returns exactly 0.0 with no warning at all.'
  - term: 'Catastrophic cancellation'
    definition: 'The loss of significant digits that happens when two nearly equal floating-point numbers are subtracted. The leading digits agree and cancel exactly, leaving only the trailing digits — which are the least accurate ones — to carry the whole result. It is the mechanism behind the rounding-error term above, and it is not confined to calculus: it appears in variances computed as E[x²] − E[x]², in differences of large timestamps, and in running balances.'
  - term: 'Stationary point'
    definition: 'A point where the derivative is zero: the graph is momentarily flat. A minimum, a maximum and a horizontal inflection are all stationary points, and the first derivative cannot tell them apart, because it reports the same zero at all three. Finding a stationary point means finding a candidate, not finding an answer.'
  - term: 'Second derivative'
    definition: 'The derivative of the derivative, written f''''(x) or d²y/dx². It answers whether the slope is itself increasing or decreasing. Numerically it collapses to (f(x + h) − 2f(x) + f(x − h)) ÷ h², which reads as how far the middle value sags below the average of its neighbours. Note the h² in the divisor: it amplifies rounding error far harder than a first difference does, so its usable range of h is both narrower and larger.'
  - term: 'Curvature'
    definition: 'Which way a graph bends, read off the sign of the second derivative. Positive is a bowl and negative is a dome, so at a stationary point a positive second derivative means a minimum and a negative one means a maximum. When the second derivative is also zero it decides nothing: x³ at 0 is a flat step and x⁴ at 0 is a genuine minimum, and both read as zero slope and zero curvature.'
  - term: 'ReLU'
    definition: 'max(x, 0): the most widely used activation function in deep learning, met on Day 102 as a transformation. Its graph is flat to the left of zero and a 45-degree line to the right, so it has a corner at exactly zero and no derivative there — the one-sided slopes are 0 and 1. A framework must choose one of those two by convention to train through it. The central difference chooses neither: it returns their average, 0.5, which is why a numerical derivative disagrees with every framework at exactly that point.'
  - term: 'Loss function'
    definition: 'A single number measuring how wrong a model''s predictions are on some data, built so that smaller is better. Training is the search for the settings that make it small, which turns the whole of machine learning into a minimisation problem — and makes the derivative, whose sign says which way is downhill, the object worth having. Day 111 writes the loop that follows it.'
  - term: 'Automatic differentiation'
    definition: 'Computing exact derivatives by applying the chain rule to a program''s own operations as it runs, rather than manipulating a formula (symbolic differentiation) or sampling function values (numerical differentiation). It is neither of the other two: no formula is produced and no approximation is made, so there is no h to choose and no U-shaped error curve. It is what JAX and PyTorch do, and it is what makes training a model with millions of parameters possible at all. Day 110''s chain rule is the mechanism it automates.'
