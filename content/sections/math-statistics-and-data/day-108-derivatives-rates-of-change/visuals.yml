visuals:
  - id: derivative-anatomy-architecture
    file: assets/derivative-anatomy-architecture.svg
    type: diagram
    title: 'The anatomy of a derivative: three secant lines over shrinking intervals, with rise, run and the computed slope at each stage, and the tangent they approach'
    alt: 'Diagram: three panels showing the curve y equals x squared near x equals 3, each with a secant line from the point at x equals 3 to a second point that is closer each time, with the rise, the run and the computed slope labelled — 16 over 2 is 8, then 3.25 over 0.5 is 6.5, then 0.61 over 0.1 is 6.1 — and the tangent line of slope 6 that the secants are approaching'
    description: 'A static architecture diagram that builds a derivative out of three secants, in three side-by-side white panels over a light background. The heading states that the curve is y equals x squared and the fixed point is P at (3, 9) in every panel, that each stage moves the second point closer and recomputes rise divided by run, and that every number shown is exact arithmetic on x squared rather than a measurement. Panel one, headed "Stage 1 — h = 2", draws the curve in black with an amber secant from the blue point P at (3, 9) to an amber point at (5, 25), with a dashed amber right triangle beneath it labelled "run = 2" along the horizontal and "rise = 16" up the vertical. Panel two, "Stage 2 — h = 0.5", repeats the construction on a closer view with the second point at (3.5, 12.25), a run of 0.5 and a rise of 3.25. Panel three, "Stage 3 — h = 0.1", zooms closer still: the second point is (3.1, 9.61), the run is 0.1 and the rise is 0.61, and a blue tangent line labelled "the tangent — slope 6" is drawn underneath the amber secant with the note that the secant is now nearly on top of it. Beneath each panel a monospace line gives the arithmetic — 16 divided by 2 is 8.00, then 3.25 divided by 0.5 is 6.50, then 0.61 divided by 0.1 is 6.10 — with a short caption. The first caption records that this is a true statement about the interval and not a statement about x equals 3; the second that the number moved from 8 to 6.5 and the line pivoted towards the curve''s direction at P; the third that the secant and the tangent are now hard to tell apart by eye and that the numbers say why, 6.10 against 6.00. A summary band across the foot, headed "The sequence, and why it settles", tabulates h, the second point, the rise, the run and the slope for h equal to 2, 0.5, 0.1 and 0.01, giving slopes 8.00, 6.50, 6.10 and 6.01, and closes with a bold row for h approaching zero, the tangent, and 6.00. Beside the table the algebra is written out: (3 + h) squared minus 9, all over h, equals 9 plus 6h plus h squared minus 9, all over h, equals 6 + h — with the closing statement that the slope over the interval from 3 to 3 + h is 6 + h exactly at every h, that as h shrinks 6 + h settles on 6, and that 6 is the derivative of x squared at x equals 3.'
  - id: shrinking-interval-flow
    file: assets/shrinking-interval-flow.svg
    type: flow-animated
    title: 'The secant pivoting into the tangent as the interval shrinks, with the width and the computed slope at every step'
    alt: 'Diagram: four secant lines fanning out from the fixed point at x equals 3 on the curve y equals x squared, with the second point sliding down the curve towards it as the interval width falls from 2 to 1 to 0.5 to 0.1 and the computed slope falls from 8 to 7 to 6.5 to 6.1, closing on the tangent slope of 6, with a readout table listing every width, second point and slope'
    description: 'An animated flow diagram, fully readable as a still image. The heading reads "Shrink the interval, and watch the slope settle", and states that the curve is y equals x squared with fixed point P at (3, 9), that each secant runs from P to a second point closer than the last, and that the tangent is what they are heading for; a note adds that every slope shown is exact, because for this curve the secant over the interval from 3 to 3 + h has slope 6 + h at every h. The left two thirds is a white plot panel holding the black curve, the blue tangent line, and four amber secant lines fanning out from the blue point P. Four amber points sit on the curve at (5, 25), (4, 16), (3.5, 12.25) and (3.1, 9.61), each labelled, and a larger amber marker slides between them in sequence, resting at (5, 25) so the still frame starts where the sequence starts. Each secant thickens and brightens in turn on an eight-second cycle, one every two seconds, and the tangent swells gently at the end of each cycle so the eye is drawn to what the secants converge on. Slope labels beside the fan read "h = 2 → 8.00", "h = 1 → 7.00", "0.5 → 6.50", "0.1 → 6.10" and, in bold blue, "tangent → 6.00". The right third is a blue readout panel headed "The readout" with a monospace table of h, the second point and the slope: 2 gives 8.00, 1 gives 7.00, 0.5 gives 6.50, 0.1 gives 6.10, 0.01 gives 6.01 and 0.001 gives 6.001, with a rule and then a bold row for h approaching zero, the tangent, and 6.00. A pale blue highlight sweeps down the first four rows in step with the secants. Below the table three lines state that the sequence is 6 + h so it settles on 6, that the settling is the limit, and that 6 is the derivative of x squared at x equals 3, followed by the note that nothing ever reaches h equals zero because rise divided by run at h equals zero is zero divided by zero, which is not a number. A footer states that the tangent line is y equals 6x minus 9, that it is not "the line that touches the curve once" since plenty of lines do that and are not tangents, and that it is the line the secants approach with the derivative as its slope. A prefers-reduced-motion block stops every animation and restores the resting state, in which all four secants are drawn at full opacity, the tangent is at its normal width, the row highlights are cleared, the marker sits at the first second point, and every line, number, point and caption in the picture is still present.'
