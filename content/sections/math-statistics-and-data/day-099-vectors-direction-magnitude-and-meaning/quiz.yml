questions:
  - question: 'A colleague says "we cannot use vectors here, our data is just a spreadsheet of customers with twelve numeric columns each". What is the most accurate reply?'
    options:
      - 'They are right — vectors are arrows in 2D or 3D, and twelve columns cannot be drawn, so the word does not apply'
      - 'The spreadsheet would first have to be normalised before any row could be called a vector'
      - 'Each row already is a 12-dimensional vector; the word adds a set of operations, not a new kind of data'
      - 'Only the numeric columns count, so it depends on whether any of the twelve are text'
    answer_index: 2
    explanation: 'A vector is an ordered list of numbers where position carries meaning, and a spreadsheet row with twelve numeric columns is exactly that. Nothing needs converting; the only thing that changes is that a family of operations — add, subtract, scale, measure, compare — becomes available, and questions like "which two customers are most alike?" become arithmetic rather than opinion. Option 0 is the most common and most damaging misconception: the arrow picture is a picture, useful up to three dimensions and gone after that, but the definition never mentioned drawing. Option 2 confuses a preprocessing choice with the definition — normalising is sometimes useful and never required for something to be a vector. Option 3 mixes up a design question with the definition; if a column is text it is not a component, but the remaining numeric columns still form a vector.'

  - question: 'A vector v has magnitude 5. You normalise it. What happened to its direction and to its magnitude?'
    options:
      - 'Both changed: normalising rotates the vector to a standard orientation and rescales it'
      - 'Direction changed, magnitude did not: the vector now points along the first basis direction'
      - 'Neither changed: normalising only changes how the vector is stored'
      - 'Direction did not change, magnitude did: it is now 1'
    answer_index: 3
    explanation: 'Normalising means multiplying every component by one over the magnitude — in this case by one fifth. That is scalar multiplication with a positive scalar, and a positive scalar cannot change direction: every component is stretched or shrunk by the same factor, so the ratios between them, which is what direction is, are untouched. The magnitude, meanwhile, is deliberately thrown away and replaced with 1. That asymmetry is the entire point of the operation, and it is why so much production code normalises before comparing: a longer document has bigger counts without being about anything different, so length is often an artefact competing with the signal you actually want. Option 0 invents a rotation that nothing in the arithmetic performs. Option 1 has it backwards. Option 2 would make the operation pointless — the numbers really do change, and you can check it: (3, 4) becomes (0.6, 0.8).'

  - question: 'You are writing a test for your normalise function and you write: assert l2_norm(normalise(v)) == 1.0. What is wrong with it?'
    options:
      - 'It fails for some correct inputs; the magnitude is 1 only approximately'
      - 'Nothing is wrong — a unit vector has magnitude exactly 1 by definition, so the test is precise'
      - 'It is too weak: it would also pass for the zero vector, which cannot be normalised'
      - 'It should compare against the original magnitude of v instead'
    answer_index: 0
    explanation: 'This is the bug the lab exists to teach, and it was demonstrated rather than asserted: of seven test vectors normalised on the authoring machine, four came out at exactly the float 1.0 and three came out at 0.9999999999999999. The maths is correct in all seven rows. Only the equality test disagrees, because a float is a binary approximation and dividing by a square root then squaring the results back up does not have to land on the nose. The sharpest case was (2, 3, 6), whose magnitude is exactly 7.0 — a whole number with an exact binary representation — and which still did not normalise to exactly 1.0. A test like this fails on correct code, which is the worst kind of failure because it sends you hunting for a bug that is not there. Use math.isclose or numpy.allclose with a tolerance you state out loud. Option 2 is wrong on its own terms: normalising the zero vector raises rather than returning something to measure.'

  - question: 'Two candidate documents are compared against the same query. Under the L2 norm, candidate A is nearer. Under the L1 norm, candidate B is nearer. Which is actually nearer?'
    options:
      - 'Candidate A — L2 is the correct definition of distance and L1 is an approximation to it'
      - 'The question is incomplete — "nearer" needs a named norm'
      - 'Neither answer is meaningful; a disagreement means one of the two vectors is malformed'
      - 'Candidate B — L1 is more robust, so where they disagree L1 should be preferred'
    answer_index: 1
    explanation: 'Both computations are right, and this is not a paradox to be resolved but a choice to be made and written down. The lab shows it with numbers you can do in your head: against a query at the origin, spike = (4, 0, 0) has L1 4 and L2 4, while spread = (2, 2, 2) has L1 6 and L2 the square root of 12, about 3.4641. So L2 picks spread and L1 picks spike. Squaring is what does it — one component of 4 contributes 16 to the sum, whereas three components of 2 contribute 4 each — so L2 punishes a single large deviation far more than several small ones, and L1 counts every unit of difference at face value. L2 is the sensible default because it matches the everyday meaning of distance, but "default" is not "correct", and a ranking that changes with the norm is a result whose write-up must name the norm. Options 0 and 3 both dress a modelling choice up as a fact about the world.'

  - question: 'What does the dot product of two vectors return, and what does it being zero tell you?'
    options:
      - 'A vector of the componentwise products; zero means every product was zero'
      - 'A vector perpendicular to both; zero means they are parallel'
      - 'A single number, the sum of the componentwise products; zero means the two vectors are perpendicular'
      - 'A single number, the sum of the componentwise products; zero means the two vectors point in the same direction'
    answer_index: 2
    explanation: 'Multiply matching components, then add up the results: two lists go in and one number comes out. That collapse from two vectors to one scalar is exactly why the dot product is everywhere — a weighted sum, a projection and a similarity score are all this operation wearing different names, and it is the single most common thing a machine learning model does. Zero means perpendicular: (1, 0) and (0, 1) give 1 times 0 plus 0 times 1, which is 0, and so do (3, 4) and (-4, 3). In the lab catalogue, the cooking query and the two articles that mention cooking zero times have a dot product of exactly 0 between their unit vectors, and their normalised distance comes out at exactly the square root of 2 — the two facts are the same fact. Option 0 describes an operation that exists but is not this one; option 1 describes the cross product, which is a different thing and only exists in three dimensions.'

  - question: 'On a map, a is the point (2, 2) and b is the point (5, 6). How do you compute the distance between them, and what is it?'
    options:
      - 'Add the magnitudes: the square root of 8 plus the square root of 61, about 10.64'
      - 'Subtract the magnitudes: the square root of 61 minus the square root of 8, about 4.98'
      - 'Take the dot product: 2 times 5 plus 2 times 6 is 22'
      - 'Take the magnitude of the difference: root of 9 plus 16 is 5'
    answer_index: 3
    explanation: 'Subtract, then measure. The difference b - a is (5-2, 6-2), which is (3, 4), and that difference is the arrow you would walk from a to b — it does not start at the origin and it does not need to. Its magnitude is the square root of 3 squared plus 4 squared, which is the square root of 25, which is exactly 5. The thing worth taking away is that there is no separate distance formula: distance is defined as the norm of the difference, so once you have subtraction and a norm you already have distance, in any number of dimensions. Options 0 and 3 both try to combine the two magnitudes directly, which throws away the directions and gives an answer that is not a distance at all — you can see it fails immediately on the case where a and b are the same point but not the origin, where the answer must be 0. Option 2 computes something real but unrelated.'

  - question: 'Your recommender uses raw word counts as vectors. A one-line note about roasting a chicken ranks a running article above your main recipe article. What is the most likely cause, and the standard fix?'
    options:
      - 'The query vector is short, so length dominates; normalise first'
      - 'The dimension is too small; add more feature columns until the ranking corrects itself'
      - 'The counts are wrong and should be recounted; there is no fix in the vector arithmetic'
      - 'The L2 norm is unsuitable for text; switch to the L1 norm'
    answer_index: 0
    explanation: 'This is reproduced exactly in the lab. The query (1, 0, 0, 0) is a one-line cooking note. On raw counts, roast-chicken — the article most purely about cooking — comes third, behind slow-cooker-stew and behind race-day-nutrition, which is mostly about running. Nothing is wrong with the arithmetic. A short vector sits near the origin, and raw distance from a point near the origin is driven largely by how long each document is rather than by what it is about, so length is competing with topic. Normalising puts every vector on the unit sphere, deletes length from the comparison and leaves only direction — and normalised, roast-chicken wins with a distance of 0.1106 while race-day-nutrition falls to 0.9878. The same effect appears in the cleanest possible form elsewhere in the lab: an article tripled in length is 18.11 away from itself in raw counts and exactly 0 away after normalising. Option 3 changes the norm, which changes the answer without addressing the cause.'

  - question: 'You have been working in two dimensions where you can see the arrows. Your embeddings have 384 components. Which of your intuitions survives the jump, and which does not?'
    options:
      - 'Everything survives: 384 dimensions behave exactly like 2 dimensions in every respect, including how points are spread out'
      - 'The arithmetic survives unchanged; only the picture does not'
      - 'Nothing survives; high-dimensional space needs entirely different formulae, which is why libraries are required'
      - 'The picture survives through projection, and the arithmetic must be adapted because square roots behave differently at high dimension'
    answer_index: 1
    explanation: 'Look at the formulae and notice what is missing from them: the dimension. The magnitude is the square root of the sum of the squares of the components — however many there are. Distance is the norm of the difference — however many there are. The dot product is the sum of the componentwise products — however many there are. Every rule you verified by hand on (3, 4) holds verbatim on a vector of 384 numbers, and this is precisely why the arithmetic was worth doing by hand first. What does not survive is the drawing, and with it some of the geometric hunches drawing gives you: high-dimensional space is much emptier than intuition suggests, distances between random points bunch together, and the nearest neighbour may not be as convincingly nearest as a 2D picture would imply. Option 1 overclaims exactly that; option 3 invents a change in the formulae that does not happen. Option 2 is worth rejecting firmly — you can and did implement every one of these operations in a few lines of plain Python; libraries are there for speed, not for capability.'
