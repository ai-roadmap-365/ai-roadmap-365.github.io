visuals:
  - id: vector-anatomy-architecture
    file: assets/vector-anatomy-architecture.svg
    type: diagram
    title: 'One vector shown three ways at once: a list of numbers, an arrow with direction and magnitude, and a row in a table of many items'
    alt: 'Diagram: one vector shown three ways at once — the list v = (3, 4) with each component named, an arrow on labelled east and north axes with its components dropped to each axis and its magnitude of 5 and direction of about 53.1 degrees marked, and the same two numbers as one highlighted row in a table of five places — with the magnitude derived from Pythagoras in a panel underneath'
    description: 'A static three-panel diagram of a single vector, v = (3, 4), drawn as a journey from a place called Dunmore to a place called Ashfield, 3 kilometres east and 4 kilometres north. The left panel shows it as a list of numbers: v equals 3, 4, with component 1 named as how far east and component 2 as how far north, the dimension given as 2 with a note that dimension means only the number of components so that a hundred numbers is a 100-dimensional vector, a note that the order is fixed because 4, 3 is a different place and position carries the meaning, and a note that this is what you type — a Python list, a CSV line, a spreadsheet row. The middle panel shows it as an arrow on axes labelled east in kilometres and north in kilometres, with a light grid, ticks numbered 1 to 5 on both axes, a thick blue arrow from the origin to the point 3, 4, dashed orange lines dropping from the tip to each axis with dots where they land, the horizontal span annotated 3 east and the vertical span annotated 4 north, a callout on the right reading magnitude equals 5 kilometres with a leader to the arrow, a green arc at the origin between the east axis and the arrow with a callout reading 53.1 degrees, the direction, and a closing note that magnitude is how long and direction is which way and a vector is exactly both. The right panel shows the same numbers as one shaded row in a table of five places with an east column and a north column: Ashfield 3 and 4 shaded, Brookend 6 and 8, Calder minus 2 and 5, Dunmore 0 and 0, Elton 12 and 5, with notes that the shaded row is the same v as the other two panels, that every row here is a vector, that Brookend is 2 times Ashfield so it has the same direction, twice the distance and magnitude 10, and that Dunmore is the zero vector with magnitude 0 and no direction at all. A panel across the foot derives the magnitude as the square root of 3 squared plus 4 squared, which is the square root of 9 plus 16, which is the square root of 25, which is 5 — the straight-line distance, 5 kilometres, not the 7 kilometres you would walk — and gives the unit vector as one fifth times 3, 4 which is 0.6, 0.8, described as the same direction at magnitude 1 with the length thrown away and the way kept. It closes with the line that the list is what you type, the arrow is what you picture and the row is where it lives: one object, three notations, and in 300 dimensions only the arrow goes away.'
  - id: vector-operations-flow
    file: assets/vector-operations-flow.svg
    type: flow-animated
    title: 'Three vector operations with real coordinates: addition completing the parallelogram, scaling, and the difference whose length is the distance'
    alt: 'Diagram: three vector operations drawn with real coordinates — u = (4, 1) added to v = (1, 3) tip to tail to give (5, 4) with the parallelogram completed by two dashed arrows, u scaled to 2u = (8, 2) and to -u = (-4, -1) along one straight line through the origin, and the arrow from the tip of a = (2, 2) to the tip of b = (5, 6) labelled b - a = (3, 4) with its length worked out as 5 — and the full arithmetic written out beneath each panel'
    description: 'An animated three-panel flow diagram, readable in full as a still image, in which every coordinate is a small whole number so that a reader can redo all three panels with a pen. Panel one, addition: on axes with a unit grid, an orange arrow runs from the origin to u equals 4, 1, a green arrow is carried from the tip of u to reach 5, 4 and is labelled v equals 1, 3 carried to u tip, two grey dashed arrows complete the parallelogram by walking v first and then u, and a blue arrow runs from the origin to the point 5, 4 labelled u plus v equals 5, 4. Its answer box gives 4 plus 1 equals 5 for the first components and 1 plus 3 equals 4 for the second, and a note says tip to tail or componentwise gives the same answer and that the parallelogram is why v then u lands in exactly the same place as u then v. Panel two, scaling: on axes centred so that negative values are visible, the same orange u equals 4, 1 is drawn from the origin, a blue arrow reaches 2u equals 8, 2, and a purple arrow runs the opposite way to minus u equals minus 4, minus 1, all three lying on one straight line through the origin. Its answer box gives the magnitude of u as the square root of 16 plus 1 which is the square root of 17, the magnitude of 2u as twice the square root of 17, and the magnitude of minus u as the square root of 17 again, and a note says doubling doubles the length and keeps the direction while negating keeps the length and reverses the direction. Panel three, subtraction and distance: an orange arrow runs from the origin to a equals 2, 2 and a green arrow from the origin to b equals 5, 6, and a blue arrow runs from the tip of a to the tip of b labelled b minus a equals 3, 4 with the note that its length is the distance. Its answer box gives b minus a as 5 minus 2 and 6 minus 2, which is 3, 4, and the magnitude of b minus a as the square root of 9 plus 16, which is the square root of 25, which is 5, and a note says there is no separate distance formula to learn — subtract, then measure the result — and that the blue arrow does not start at the origin and does not need to. In motion, a blue token travels each panel result arrow in turn while that panel is emphasised with a lifted background and a blue border, the result arrows are drawn with marching dashes, and each answer box brightens once as its panel finishes. A prefers-reduced-motion block stops every animation, turns the marching dashes into solid arrows, restores every token to full opacity at the start of its own path, and returns the panels and answer boxes to their resting colours, so that the still frame carries every axis, arrow, coordinate and line of arithmetic. A panel across the foot states that addition is two walks in either order, scaling is one number applied to every component, and subtraction answers how do I get from a to b with the length of that answer being how far apart they are; that those three plus the dot product are every vector operation needed for a long while; and that none of this changes in 300 dimensions because the arithmetic is identical and only the picture stops being available.'
