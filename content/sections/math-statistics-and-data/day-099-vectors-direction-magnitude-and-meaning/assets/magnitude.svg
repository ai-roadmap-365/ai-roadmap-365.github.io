<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Magnitude</title>
  <style>
    .magnitude-bg   { fill: #f8fafc; }
    .magnitude-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .magnitude-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .magnitude-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .magnitude-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .magnitude-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .magnitude-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .magnitude-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .magnitude-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .magnitude-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .magnitude-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .magnitude-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .magnitude-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .magnitude-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .magnitude-stage { opacity: 1; }

    .magnitude-s0 { animation-delay: 0.00s; }
    .magnitude-e0 { animation-delay: 0.00s; }
    .magnitude-s1 { animation-delay: 1.28s; }
    .magnitude-e1 { animation-delay: 1.28s; }
    .magnitude-s2 { animation-delay: 2.56s; }
    .magnitude-e2 { animation-delay: 2.56s; }
    .magnitude-s3 { animation-delay: 3.84s; }
    .magnitude-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .magnitude-conn  { animation: magnitude-trace 6.4s ease-in-out infinite; }
      .magnitude-stage { animation: magnitude-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes magnitude-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes magnitude-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .magnitude-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .magnitude-stage { animation: magnitude-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes magnitude-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="magnitude-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="magnitude-bg" width="980" height="322"/>
  <text class="magnitude-h1"  x="30" y="40">Magnitude</text>
  <text class="magnitude-sub" x="30" y="64">Four steps.</text>
  <g class="magnitude-stage magnitude-s0">
    <rect class="magnitude-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="magnitude-step" x="44" y="142">01</text>
    <text class="magnitude-name" x="70" y="142">In two dimensions the components form a right triangle</text>
    <text class="magnitude-desc" x="44" y="166">With the vector as its</text>
    <text class="magnitude-desc" x="44" y="182">hypotenuse.</text>
  </g>
  <line class="magnitude-line magnitude-conn magnitude-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#magnitude-tip)"/>
  <g class="magnitude-stage magnitude-s1">
    <rect class="magnitude-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="magnitude-step" x="280" y="142">02</text>
    <text class="magnitude-name" x="306" y="142">So its length is the root of the sum of squares</text>
    <text class="magnitude-desc" x="280" y="166">Which is Pythagoras, unchanged.</text>
  </g>
  <line class="magnitude-line magnitude-conn magnitude-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#magnitude-tip)"/>
  <g class="magnitude-stage magnitude-s2">
    <rect class="magnitude-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="magnitude-step" x="516" y="142">03</text>
    <text class="magnitude-name" x="542" y="142">In three dimensions the same argument applies twice</text>
    <text class="magnitude-desc" x="516" y="166">Giving the same formula with one</text>
    <text class="magnitude-desc" x="516" y="182">more term.</text>
  </g>
  <line class="magnitude-line magnitude-conn magnitude-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#magnitude-tip)"/>
  <g class="magnitude-stage magnitude-s3">
    <rect class="magnitude-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="magnitude-step" x="752" y="142">04</text>
    <text class="magnitude-name" x="778" y="142">And it generalises to any number of dimensions</text>
    <text class="magnitude-desc" x="752" y="166">Which is why the formula never</text>
    <text class="magnitude-desc" x="752" y="182">changes.</text>
    <text class="magnitude-edge" x="752" y="242">one rule</text>
  </g>
  <text class="magnitude-sub" x="30" y="304">Deriving it rather than memorising it is what makes the high-dimensional case unsurprising: nothing new happens, only more terms in the same sum.</text>
</svg>
