<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 830" width="1260" height="830" role="img" aria-labelledby="d099f-title d099f-desc">
  <title id="d099f-title">Three vector operations with real coordinates: addition completing the parallelogram, scaling, and the difference whose length is the distance</title>
  <desc id="d099f-desc">Three panels, each with its own axes and its arithmetic written out in full. Panel one adds u equals 4, 1 and v equals 1, 3 tip to tail to reach 5, 4, with the other two sides of the parallelogram drawn as dashed copies, and the componentwise sum shown as 4 plus 1 equals 5 and 1 plus 3 equals 4. Panel two scales u by 2 to give 8, 2 and by minus 1 to give minus 4, minus 1, with the magnitudes given as the square root of 17, twice the square root of 17, and the square root of 17 again, so a positive scalar changes only the length while a negative scalar also reverses the direction. Panel three draws the arrow from the tip of a equals 2, 2 to the tip of b equals 5, 6, notes that this arrow is b minus a equals 3, 4, and computes its length as the square root of 3 squared plus 4 squared, which is the square root of 25, which is 5, and that this is the distance between the two points. A blue token travels the sum arrow, then the scaled arrow, then the difference arrow, and each panel is emphasised in turn as the token reaches it. With motion disabled every axis, arrow, coordinate and line of arithmetic is still drawn.</desc>

  <style>
    .d099f-bg     { fill: #f8fafc; }
    .d099f-h1     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 600; fill: #1a202c; }
    .d099f-sub    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d099f-ph     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1d4ed8; }
    .d099f-note   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d099f-strong { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d099f-mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d099f-lblu   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1d4ed8; }
    .d099f-lorg   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #b45309; }
    .d099f-lgrn   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #047857; }
    .d099f-lpur   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #6d28d9; }
    .d099f-axis   { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .d099f-grid   { fill: none; stroke: #cbd5e1; stroke-width: 1; }
    .d099f-tickt  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d099f-foot   { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }

    /* Panels rest fully drawn and fully readable; the emphasis is a border
       and background lift only, so nothing is hidden when motion is off. */
    .d099f-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5;
                    animation: d099f-lift 9s ease-in-out infinite; }
    .d099f-p1 { animation-delay: 0s; }
    .d099f-p2 { animation-delay: 3s; }
    .d099f-p3 { animation-delay: 6s; }
    @keyframes d099f-lift {
      0%, 26%, 100% { fill: #ffffff; stroke: #94a3b8; }
      6%, 20%       { fill: #f5f8ff; stroke: #1d4ed8; }
    }

    /* Input arrows: solid, always visible, never animated. */
    .d099f-uarr   { fill: none; stroke: #b45309; stroke-width: 3.5; }
    .d099f-varr   { fill: none; stroke: #047857; stroke-width: 3.5; }
    .d099f-neg    { fill: none; stroke: #6d28d9; stroke-width: 3.5; }
    .d099f-ghost  { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; }

    /* Result arrows: flowing dashes, a solid line when motion is off. */
    .d099f-res    { fill: none; stroke: #1d4ed8; stroke-width: 4;
                    stroke-dasharray: 11 7; animation: d099f-march 1.6s linear infinite; }
    @keyframes d099f-march { to { stroke-dashoffset: -18; } }

    /* One token per panel, travelling that panel's result arrow in turn.
       Each rests visible at the start of its own path, so the still frame
       shows three marked starting points rather than a blank. */
    .d099f-tok1 { fill: #1d4ed8; animation: d099f-t1 9s ease-in-out infinite; }
    .d099f-tok2 { fill: #1d4ed8; animation: d099f-t2 9s ease-in-out infinite; }
    .d099f-tok3 { fill: #1d4ed8; animation: d099f-t3 9s ease-in-out infinite; }
    @keyframes d099f-t1 {
      0%   { transform: translate(0px, 0px);      opacity: 1; }
      22%  { transform: translate(144px, -118px); opacity: 1; }
      30%  { transform: translate(144px, -118px); opacity: 0.3; }
      97%  { transform: translate(0px, 0px);      opacity: 0.3; }
      100% { transform: translate(0px, 0px);      opacity: 1; }
    }
    @keyframes d099f-t2 {
      0%, 32% { transform: translate(0px, 0px);     opacity: 0.3; }
      36%     { transform: translate(0px, 0px);     opacity: 1; }
      56%     { transform: translate(202px, -51px); opacity: 1; }
      64%     { transform: translate(202px, -51px); opacity: 0.3; }
      100%    { transform: translate(0px, 0px);     opacity: 0.3; }
    }
    @keyframes d099f-t3 {
      0%, 65% { transform: translate(0px, 0px);    opacity: 0.3; }
      69%     { transform: translate(0px, 0px);    opacity: 1; }
      89%     { transform: translate(90px, -120px); opacity: 1; }
      100%    { transform: translate(90px, -120px); opacity: 0.3; }
    }

    /* The answer boxes lift once as their panel finishes. */
    .d099f-ans  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
                  animation: d099f-glow 9s ease-in-out infinite; }
    .d099f-a1 { animation-delay: 0s; }
    .d099f-a2 { animation-delay: 3s; }
    .d099f-a3 { animation-delay: 6s; }
    @keyframes d099f-glow {
      0%, 24%, 100% { fill: #e0e7ff; }
      14%, 20%      { fill: #bfdbfe; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d099f-panel { animation: none; fill: #ffffff; stroke: #94a3b8; }
      .d099f-res   { animation: none; stroke-dasharray: none; }
      .d099f-tok1, .d099f-tok2, .d099f-tok3 { animation: none; transform: none; opacity: 1; }
      .d099f-ans   { animation: none; fill: #e0e7ff; }
    }
  </style>

  <defs>
    <marker id="d099f-hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d099f-ho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
    <marker id="d099f-hg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
    <marker id="d099f-hp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9" />
    </marker>
    <marker id="d099f-hs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="d099f-bg" x="0" y="0" width="1260" height="830" />

  <text class="d099f-h1" x="40" y="46">Three operations, with the arithmetic on screen</text>
  <text class="d099f-sub" x="40" y="74">Every coordinate is a small whole number, so all three panels can be redone with a pen. One grid square is one unit.</text>

  <!-- ==================================================================
       PANEL 1 — addition, tip to tail, parallelogram completed.
       Origin (110, 380); 30 px per unit.
       u = (4,1) -> (230,350)   v = (1,3) -> (140,290)   u+v = (5,4) -> (260,260)
       ================================================================== -->
  <rect class="d099f-panel d099f-p1" x="40" y="100" width="380" height="560" rx="6" />
  <text class="d099f-ph" x="64" y="136">1 . add: walk one, then the other</text>

  <path class="d099f-grid" d="M 140 410 L 140 220 M 170 410 L 170 220 M 200 410 L 200 220 M 230 410 L 230 220 M 260 410 L 260 220 M 290 410 L 290 220 M 320 410 L 320 220 M 350 410 L 350 220" />
  <path class="d099f-grid" d="M 110 350 L 380 350 M 110 320 L 380 320 M 110 290 L 380 290 M 110 260 L 380 260 M 110 230 L 380 230" />
  <path class="d099f-axis" d="M 110 380 L 385 380" marker-end="url(#d099f-hs)" />
  <path class="d099f-axis" d="M 110 410 L 110 215" marker-end="url(#d099f-hs)" />
  <text class="d099f-tickt" x="230" y="400" text-anchor="middle">4</text>
  <text class="d099f-tickt" x="260" y="400" text-anchor="middle">5</text>
  <text class="d099f-tickt" x="100" y="396" text-anchor="end">0</text>
  <text class="d099f-tickt" x="100" y="295" text-anchor="end">3</text>
  <text class="d099f-tickt" x="100" y="265" text-anchor="end">4</text>

  <path class="d099f-ghost" d="M 110 380 L 140 290" marker-end="url(#d099f-hs)" />
  <path class="d099f-ghost" d="M 140 290 L 255 261" marker-end="url(#d099f-hs)" />
  <path class="d099f-uarr" d="M 110 380 L 225 351" marker-end="url(#d099f-ho)" />
  <path class="d099f-varr" d="M 230 350 L 257 264" marker-end="url(#d099f-hg)" />
  <path class="d099f-res" d="M 110 380 L 254 262" marker-end="url(#d099f-hb)" />
  <circle class="d099f-tok1" cx="110" cy="380" r="8" />

  <text class="d099f-lorg" x="128" y="402">u = (4, 1)</text>
  <text class="d099f-lgrn" x="266" y="316">v = (1, 3)</text>
  <text class="d099f-note" x="266" y="336">carried to u's tip</text>
  <text class="d099f-lblu" x="118" y="250">u + v = (5, 4)</text>

  <rect class="d099f-ans d099f-a1" x="64" y="440" width="332" height="72" rx="5" />
  <text class="d099f-mono" x="82" y="470">4 + 1 = 5   first components</text>
  <text class="d099f-mono" x="82" y="494">1 + 3 = 4   second components</text>
  <text class="d099f-note" x="64" y="546">Tip to tail, or componentwise: the same</text>
  <text class="d099f-note" x="64" y="566">answer. The two dashed arrows complete the</text>
  <text class="d099f-note" x="64" y="586">parallelogram, and are why v then u lands in</text>
  <text class="d099f-note" x="64" y="606">exactly the same place as u then v.</text>

  <!-- ==================================================================
       PANEL 2 — scaling. Origin (500, 340); 26 px per unit.
       u = (4,1) -> (604,314)   2u = (8,2) -> (708,288)   -u -> (396,366)
       ================================================================== -->
  <rect class="d099f-panel d099f-p2" x="440" y="100" width="380" height="560" rx="6" />
  <text class="d099f-ph" x="464" y="136">2 . scale: change the length, keep the line</text>

  <path class="d099f-grid" d="M 396 420 L 396 240 M 448 420 L 448 240 M 552 420 L 552 240 M 604 420 L 604 240 M 656 420 L 656 240 M 708 420 L 708 240 M 760 420 L 760 240" />
  <path class="d099f-grid" d="M 390 288 L 800 288 M 390 314 L 800 314 M 390 366 L 800 366 M 390 392 L 800 392" />
  <path class="d099f-axis" d="M 390 340 L 800 340" marker-end="url(#d099f-hs)" />
  <path class="d099f-axis" d="M 500 420 L 500 240" marker-end="url(#d099f-hs)" />
  <text class="d099f-tickt" x="604" y="332" text-anchor="middle">4</text>
  <text class="d099f-tickt" x="708" y="332" text-anchor="middle">8</text>
  <text class="d099f-tickt" x="396" y="332" text-anchor="middle">-4</text>

  <path class="d099f-res" d="M 500 340 L 702 289" marker-end="url(#d099f-hb)" />
  <path class="d099f-uarr" d="M 500 340 L 598 315" marker-end="url(#d099f-ho)" />
  <path class="d099f-neg" d="M 500 340 L 402 365" marker-end="url(#d099f-hp)" />
  <circle class="d099f-tok2" cx="500" cy="340" r="8" />

  <text class="d099f-lorg" x="508" y="376">u = (4, 1)</text>
  <text class="d099f-lblu" x="646" y="272">2u = (8, 2)</text>
  <text class="d099f-lpur" x="396" y="400" text-anchor="middle">-u = (-4, -1)</text>

  <rect class="d099f-ans d099f-a2" x="464" y="440" width="332" height="72" rx="5" />
  <text class="d099f-mono" x="482" y="470">|u|  = sqrt(16 + 1) = sqrt(17)</text>
  <text class="d099f-mono" x="482" y="494">|2u| = 2 * sqrt(17)    |-u| = sqrt(17)</text>
  <text class="d099f-note" x="464" y="546">All three arrows lie on one straight line</text>
  <text class="d099f-note" x="464" y="566">through the origin. Doubling doubles the</text>
  <text class="d099f-note" x="464" y="586">length and keeps the direction; negating</text>
  <text class="d099f-note" x="464" y="606">keeps the length and reverses the direction.</text>

  <!-- ==================================================================
       PANEL 3 — difference and distance. Origin (890, 400); 30 px per unit.
       a = (2,2) -> (950,340)   b = (5,6) -> (1040,220)   b - a = (3,4)
       ================================================================== -->
  <rect class="d099f-panel d099f-p3" x="840" y="100" width="380" height="560" rx="6" />
  <text class="d099f-ph" x="864" y="136">3 . subtract: the arrow between two tips</text>

  <path class="d099f-grid" d="M 920 430 L 920 200 M 950 430 L 950 200 M 980 430 L 980 200 M 1010 430 L 1010 200 M 1040 430 L 1040 200 M 1070 430 L 1070 200 M 1100 430 L 1100 200" />
  <path class="d099f-grid" d="M 890 370 L 1180 370 M 890 340 L 1180 340 M 890 310 L 1180 310 M 890 280 L 1180 280 M 890 250 L 1180 250 M 890 220 L 1180 220" />
  <path class="d099f-axis" d="M 890 400 L 1185 400" marker-end="url(#d099f-hs)" />
  <path class="d099f-axis" d="M 890 430 L 890 195" marker-end="url(#d099f-hs)" />
  <text class="d099f-tickt" x="950" y="420" text-anchor="middle">2</text>
  <text class="d099f-tickt" x="1040" y="420" text-anchor="middle">5</text>
  <text class="d099f-tickt" x="880" y="345" text-anchor="end">2</text>
  <text class="d099f-tickt" x="880" y="225" text-anchor="end">6</text>

  <path class="d099f-uarr" d="M 890 400 L 945 345" marker-end="url(#d099f-ho)" />
  <path class="d099f-varr" d="M 890 400 L 1035 225" marker-end="url(#d099f-hg)" />
  <path class="d099f-res" d="M 950 340 L 1036 225" marker-end="url(#d099f-hb)" />
  <circle class="d099f-tok3" cx="950" cy="340" r="8" />

  <text class="d099f-lorg" x="958" y="374">a = (2, 2)</text>
  <text class="d099f-lgrn" x="1052" y="212">b = (5, 6)</text>
  <text class="d099f-lblu" x="1002" y="300">b - a = (3, 4)</text>
  <text class="d099f-note" x="1002" y="320">its length is the distance</text>

  <rect class="d099f-ans d099f-a3" x="864" y="440" width="332" height="72" rx="5" />
  <text class="d099f-mono" x="882" y="470">b - a = (5-2, 6-2) = (3, 4)</text>
  <text class="d099f-mono" x="882" y="494">|b-a| = sqrt(9 + 16) = sqrt(25) = 5</text>
  <text class="d099f-note" x="864" y="546">There is no separate distance formula to</text>
  <text class="d099f-note" x="864" y="566">learn. Subtract, then measure the result.</text>
  <text class="d099f-note" x="864" y="586">The blue arrow does not start at the origin,</text>
  <text class="d099f-note" x="864" y="606">and it does not need to.</text>

  <!-- ================= Foot ================= -->
  <rect class="d099f-foot" x="40" y="690" width="1180" height="115" rx="6" />
  <text class="d099f-ph" x="64" y="722">The numbers are the proof, not the pictures</text>
  <text class="d099f-strong" x="64" y="752">Addition is two walks in either order. Scaling is one number applied to every component. Subtraction answers "how do I get from a to b",</text>
  <text class="d099f-strong" x="64" y="774">and the length of that answer is how far apart they are. Those three, plus the dot product, are every vector operation you need for a long while.</text>
  <text class="d099f-note" x="64" y="796">None of this changes in 300 dimensions. The arithmetic is identical; only the picture stops being available.</text>
</svg>
