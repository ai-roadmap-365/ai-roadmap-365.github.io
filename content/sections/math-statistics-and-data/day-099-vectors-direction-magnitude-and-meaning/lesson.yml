id: D099
day: 99
slug: vectors-direction-magnitude-and-meaning
title: 'Vectors: Direction, Magnitude, and Meaning'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 15
learning_promise: 'After this lesson you will be able to look at a row of numbers describing one thing — a colour, a house, a customer, a document — and recognise it as a vector you have been using for ninety-eight days without the name; hold both pictures of it at once, as a list you type and as an arrow with a direction and a length, and say exactly which of the two survives the jump to three hundred dimensions and which does not; add, subtract and scale vectors both geometrically and componentwise, and explain the parallelogram; derive the magnitude from Pythagoras rather than accepting it as a formula, and compute it by hand for vectors whose answer is a whole number; normalise a vector and state precisely what that changes and what it preserves; compute the L1 norm alongside the L2 and produce a case where the two rank the same pair of candidates in opposite orders; compute the distance between two vectors as the magnitude of their difference and see why there was never a separate formula; implement add, subtract, scale, dot, both norms, distance, normalise and nearest-neighbour search in pure Python, then prove operation by operation that NumPy agrees with your loops on the same inputs; write every float assertion with a stated tolerance and demonstrate on your own machine why double-equals would have failed; and then take six short articles, turn them into vectors by counting, compute every pairwise distance and say — precisely, numerically, and with the working shown — which one is most like which.'
objectives:
  - 'Recognise a vector in data you already have: a row of numbers describing one thing, where position carries meaning and the order can never change'
  - 'Hold the two pictures of a vector at once — an ordered list and an arrow with direction and magnitude — and name what each one is good for'
  - 'State exactly which intuitions survive the jump from 2D and 3D to hundreds of dimensions, and which are lost along with the drawing'
  - 'Add and subtract vectors componentwise and geometrically, and explain the parallelogram picture and why the order of addition does not matter'
  - 'Multiply a vector by a scalar, and say what a positive, a negative and a zero scalar each do to direction and to magnitude'
  - 'Derive the L2 norm from Pythagoras rather than asserting it, and compute magnitudes by hand for vectors whose answer is a whole number'
  - 'Normalise a vector, explain why normalising is so common in practice, and produce a case where it changes which item wins a search'
  - 'Compute the L1 norm alongside the L2, and construct a concrete case where the two norms rank the same two candidates in opposite orders'
  - 'Compute the distance between two vectors as the norm of their difference, and explain why there is no separate distance formula to learn'
  - 'Compute a dot product, state that it returns a single number, and use a dot product of zero to identify perpendicular vectors'
  - 'Describe the zero vector and the standard basis, and explain what it means that a coordinate list is already a combination of basis vectors'
  - 'Implement every operation in pure Python from first principles, then prove agreement with NumPy operation by operation to a stated tolerance'
  - 'Assert every floating-point comparison with math.isclose or numpy.allclose and a tolerance you state, having demonstrated on your own machine why double-equals fails'
  - 'Turn six short documents into vectors by counting features, compute every pairwise distance, and name each one nearest neighbour with the arithmetic shown'
  - 'Compare pure Python lists, NumPy arrays, PyTorch tensors, JAX arrays and pandas Series for this work, and explain why NumPy is the shape the others imitate'
prerequisites:
  - 'Day 43 to 46 — Python functions, lists, comprehensions, and floating-point arithmetic; Day 46 in particular, because today is where "never compare floats with double-equals" stops being advice and becomes a failing test'
  - 'Day 51 — modules and imports, which is how the lab example scripts find the implementation you write'
  - 'Day 63 — pytest, and what a parametrised test does'
  - 'Day 83 — virtual environments and pinned requirements, which is how the lab installs its two dependencies'
  - 'School arithmetic: squares, square roots, and the fact that a right triangle with sides 3 and 4 has a hypotenuse of 5. Nothing beyond that is assumed, and nothing beyond that is needed'
