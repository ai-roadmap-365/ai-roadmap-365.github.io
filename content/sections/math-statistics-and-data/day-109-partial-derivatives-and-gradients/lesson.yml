title: 'Partial Derivatives and Gradients'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 16
learning_promise: 'After this lesson you will know which way is uphill, and you will have proved it rather than been told it. You will be able to say what a partial derivative is in one sentence — one input moves, everything else is held still — and compute one by hand and numerically for a function of two variables and a function of three. You will assemble those partials into a gradient and read its two halves separately: its direction is the way uphill, its length is how steep, and it has one component per INPUT rather than one per dimension of the graph. Then you will demonstrate the two facts everyone asserts and almost nobody shows. You will measure the rate of change along 360 separate bearings, each with its own direct central difference that never forms a gradient, and watch the winner land on the gradient''s own bearing to within the half-degree the sampling grid allows — with the winning rate divided by the gradient''s length equal to the cosine of that gap to nine decimal places. And you will show the gradient is perpendicular to the contour without cheating: every contour is an exact algebraic curve derived from the function alone and checked to hold f constant before it is used, because rotating a gradient ninety degrees and calling the result a contour direction proves nothing. You will learn what a zero gradient does not tell you — minimum, maximum and saddle are indistinguishable from it — and why saddles dominate in high dimensions. You will carry Day 108''s U-shaped error curve into two dimensions, watch a cubic''s truncation error come out as exactly h squared, and find the trough at 1e-5 for a central difference and 1e-8 for a forward one, both landing where the cube root and square root of machine epsilon predict. You will meet the honest limit that a plane''s constant gradient becomes unmeasurable when the function''s values are large, with the roundoff bound tracking the damage across seven orders of magnitude. And you will finish holding the number that explains autodiff: a numerical gradient costs two evaluations of the whole function per parameter, which is two million forward passes to take one training step on a million-parameter model.'
objectives:
  - 'Define a partial derivative as the ordinary derivative with every other input held constant, and say what the rounded d announces'
  - 'Compute partial derivatives by hand for a quadratic, a plane, a product and a cubic, then verify each one numerically with a central difference'
  - 'Build a gradient as the vector of partial derivatives, for a function of two inputs and of three, and explain why it has one component per input rather than one per dimension of the graph'
  - 'Read a gradient''s direction and its length as answers to two different questions, with different units'
  - 'Compute a directional derivative two ways — as a dot product with the gradient, and by measuring directly along the bearing — and use their agreement as evidence'
  - 'Demonstrate that no direction climbs faster than the gradient by sweeping 360 bearings, and derive the result from the geometric dot product'
  - 'Demonstrate that the gradient is perpendicular to the contour using an exactly parametrised curve, and explain why rotating the gradient would prove nothing'
  - 'Define a contour and a level set, and say why every optimisation picture in this course is drawn with them'
  - 'Identify a stationary point, and state plainly that a zero gradient cannot distinguish a minimum from a maximum from a saddle'
  - 'Explain why saddle points dominate stationary points in high-dimensional parameter spaces'
  - 'Choose a step size deliberately, predict the h-squared truncation law, and locate the trough of the error curve for both a central and a forward difference'
  - 'Recognise where a numerical gradient stops being trustworthy, and predict the damage with the roundoff bound eps times the size of f over 2h'
  - 'Distinguish numpy.gradient, which differences a sampled array, from a gradient of a callable function, and name the edge_order default that catches people'
  - 'Count the cost of a numerical gradient as two evaluations per parameter, and state precisely what reverse-mode automatic differentiation changes about that'
  - 'Name the Jacobian and the Hessian, say what each one is, and say which question each answers that the gradient cannot'
prerequisites:
  - 'Day 108 — derivatives, the central difference, and the U-shaped error curve. Today is that plus four words: and hold everything else still'
  - 'Day 99 — vectors, length and unit vectors. A gradient is a vector and every property from that day still applies'
  - 'Day 103 — the dot product and its geometric reading as length times length times cosine. That reading is the entire proof of steepest ascent'
  - 'Day 104 — NumPy arrays, linspace and elementwise arithmetic; the lab uses NumPy to hold results, never to differentiate anything'
  - 'Day 70 — floating point, which is why one whole section of this lesson is about subtracting two nearly equal numbers'
  - 'Day 43 — python3 -m venv and installing a package with pip; the lab installs numpy and pytest into a lab-local environment'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'No school calculus is assumed anywhere, and none is used'
