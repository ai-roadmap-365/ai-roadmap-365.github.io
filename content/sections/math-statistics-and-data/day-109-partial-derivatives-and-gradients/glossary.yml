terms:
  - term: 'Partial derivative'
    definition: 'The derivative of a function of several variables with respect to one of them, with all the others held constant — Wikipedia''s definition is exactly that. Written with a rounded d, as ∂f/∂x. It is not a different kind of derivative with different rules: freezing the other inputs turns a function of several variables into a function of one, and every rule from Day 108 then applies unchanged. The rounded symbol is a note to the reader that other inputs exist and are being held still, nothing more. For f = x² + 3y², freezing y leaves x² plus a constant, so ∂f/∂x = 2x.'
  - term: 'Gradient'
    definition: 'The vector whose components are all the partial derivatives of a scalar function, one per input, written ∇f. Its direction is the direction of steepest increase and its magnitude is the rate of increase in that direction — Wikipedia states both, and calls the magnitude "the greatest absolute directional derivative". Its formal defining property is sharper and worth knowing: it is "the unique vector field whose dot product with any unit vector v at each point x is the directional derivative of f along v". A function of n inputs has an n-component gradient regardless of how many dimensions its graph occupies: it is an arrow drawn on the flat map you are standing on, not one pointing out of the hillside.'
  - term: 'Nabla'
    definition: 'The symbol ∇, "written as an upside-down triangle and pronounced del", which denotes the vector differential operator. It is an operator rather than a number or a vector: ∇ on its own means "take the partial derivative with respect to each coordinate and stack the results", and ∇f is what you get when it is applied to a particular function. The gradient is also commonly written grad f.'
  - term: 'Contour line'
    definition: 'A curve joining points at which a function of two variables takes one fixed value — the line on a walking map that joins points of equal height. Where contours are close together the function is changing fast; where they are far apart it is nearly level. The gradient is perpendicular to the contour through every point, which is why an optimiser''s path is drawn crossing the contours at right angles. Every optimisation picture in the rest of this course is a contour map.'
  - term: 'Level set'
    definition: 'The general name for the set of points where a function takes one fixed value, of which a contour line is the two-input case. For a function of three inputs it is a surface rather than a curve — Wikipedia notes that "a level surface in three-dimensional space is defined by an equation of the form F(x, y, z) = c" and that "the gradient of F is then normal to the surface". The perpendicularity result survives every increase in dimension; only the picture stops being drawable.'
  - term: 'Directional derivative'
    definition: 'The rate at which a function changes as you move from a point along a chosen direction, computed as the dot product of the gradient with the UNIT vector in that direction: D_u f = ∇f · u. Normalising first is not tidiness — without it, handing in a longer arrow would give a bigger answer and the quantity would depend on how the direction was written rather than on which way it points. A partial derivative is the special case where the direction is an axis. Since ∇f · u = |∇f| cos θ, the answer for every direction is recoverable from one gradient.'
  - term: 'Steepest ascent'
    definition: 'The direction in which a function increases fastest from a point, which is the direction of its gradient. It follows from the geometric dot product: D_u f = |∇f| cos θ, cosine cannot exceed 1, and it reaches 1 exactly when the direction is the gradient''s. The largest available rate is therefore |∇f| and the most negative is −|∇f|, attained by walking exactly the opposite way — which is gradient descent. The property requires the function to be DIFFERENTIABLE, not merely to have partial derivatives; Wikipedia gives a function whose partials all exist at the origin and whose gradient formula nonetheless "fails to point towards the steepest ascent in some orientations" there.'
  - term: 'Stationary point'
    definition: 'A point where the gradient is the zero vector — Wikipedia names it as such. The ground is level in every direction to first order. The gradient carries no information at all about what KIND of point it is: a minimum, a maximum and a saddle all produce the identical zero vector, and no amount of extra precision would separate them, because the distinguishing information lives in the second derivatives rather than the first.'
  - term: 'Saddle point'
    definition: 'A stationary point that goes up in some directions and down in others — the middle of a mountain pass, or the origin of x² − y², which rises along x and falls along y. In two dimensions this is a curiosity. In a model''s parameter space it is the dominant case, because being a minimum requires the surface to curve upward in every one of millions of directions simultaneously while being a saddle requires only one of them to disagree. The practical hazard is not that an optimiser stops there but that near one the gradient is small without being zero, so progress crawls, and from outside a crawl is hard to tell from convergence.'
  - term: 'Jacobian'
    definition: 'The matrix of first partial derivatives of a function that returns a VECTOR rather than a single number, with one row per output and one column per input. A gradient is the one-row case. It is named here and not developed; it becomes necessary on Day 110, because the chain rule for composed multi-output functions is a chain of matrix products.'
  - term: 'Hessian'
    definition: 'The square matrix of SECOND partial derivatives of a scalar function, with one row and one column per input. It describes curvature, and it is the object that answers the question the gradient cannot: whether a stationary point is a minimum, a maximum or a saddle. Named here and not developed. Its cost is the reason it is rarely used at scale — it has one entry per pair of parameters, so a million-parameter model would have a Hessian with a trillion entries.'
  - term: 'Surface'
    definition: 'The graph of a function of two variables, drawn as a landscape in three dimensions with the function''s value as height. Wikipedia''s article on partial derivatives describes the geometry precisely: at every point on such a surface there are infinitely many tangent lines, and "partial differentiation is the act of choosing one of these lines and finding its slope" — usually the ones parallel to the xz-plane and the yz-plane, which is what freezing y or x respectively produces. Beyond two inputs the surface stops being drawable, which is why the two-input picture is worth learning properly.'
  - term: 'Unit direction'
    definition: 'A vector of length exactly 1, used to specify a direction without also specifying a distance. Obtained by dividing a vector by its magnitude, which is undefined for the zero vector — a zero vector has no direction to preserve, and today''s lab raises ValueError rather than returning NaNs that would surface somewhere harder to diagnose. Every directional derivative is taken along a unit direction so that the answer depends on the bearing alone.'
  - term: 'Central difference'
    definition: 'The estimate ( f(x+h) − f(x−h) ) / 2h, carried over from Day 108 and adapted here by moving only one coordinate. Its truncation error shrinks like h squared, against h for a one-sided forward difference, at a cost of one extra evaluation of f. On a quadratic it is algebraically EXACT at any h, since ((x+h)² − (x−h)²)/2h = 4xh/2h = 2x; on a cubic the error is exactly h squared with no other terms. Divide by 2h and not h: the point moved a total distance of 2h.'
  - term: 'Gradient checking'
    definition: 'Comparing a hand-written or analytic gradient against a numerical one on a small example, to find out whether the analytic one is correct. It is the job numerical differentiation is still genuinely best at, and the reason the method survives in serious toolkits long after nothing trains with it. The comparison should be relative rather than absolute, because a numerical gradient''s roundoff error grows in proportion to the size of the function''s values.'
