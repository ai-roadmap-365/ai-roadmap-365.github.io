visuals:
  - id: gradient-anatomy-architecture
    file: assets/gradient-anatomy-architecture.svg
    type: diagram
    title: 'The anatomy of a gradient: two partial derivatives measured on a contour map, assembled into one arrow that points uphill at right angles to the contour'
    alt: 'Diagram: the anatomy of a gradient on a contour map of the bowl f equals x squared plus three y squared, with the point one comma one marked on the contour f equals 4, the partial derivative in x drawn as an arrow of length 2 and the partial derivative in y as an arrow of length 6, those two composing into the gradient arrow two comma six whose length is the square root of 40 and whose bearing is 71.5651 degrees, meeting the tangent to the contour at exactly ninety degrees, with two side panels showing that freezing y at 1 leaves x squared plus 3 with slope 2 and freezing x at 1 leaves 1 plus 3 y squared with slope 6'
    description: 'A static architecture diagram that takes one gradient apart and puts it back together, with every number exact rather than measured. The left panel is headed "The flat map you are standing on" and draws three concentric grey ellipses centred on the origin — the contours f equals 1, 4 and 9 of the bowl x squared plus three y squared — with the middle one picked out in teal because it is the one passing through the marked point. A black dot sits at the point (1, 1). Two amber arrows leave it along the axes: one due east of length 2, labelled the partial derivative of f with respect to x equals 2, and one due north of length 6, labelled the partial derivative with respect to y equals 6. Dashed amber lines complete the rectangle those two arrows span, and a thick blue arrow runs along its diagonal to the far corner, labelled as the gradient (2, 6). A dashed teal line runs through the point along the contour''s tangent direction, and a small square marker sits in the angle between that line and the gradient, showing the right angle. A caption underneath records that the gradient is drawn ON the map rather than out of the hillside: it has two components because f has two inputs, not three because its graph is a surface, and it is a direction to walk rather than a place to stand. The right panel is headed "Where each number comes from: freeze one input, and it is Day 108 again" and holds two small plots. The first shows the curve of g of x equals f of x comma 1 equals x squared plus 3 over the range x from 0 to 2, with an amber tangent line drawn at x equals 1 and the note that the y squared term became the constant 3 and so contributes nothing to the slope, giving a slope of 2. The second shows k of y equals f of 1 comma y equals 1 plus 3 y squared over y from 0 to about 1.4, with its own steeper amber tangent at y equals 1 and the note that it is steeper because of the 3, giving a slope of 6. Beneath both, a rule and three lines explain that the rounded d in the partial derivative symbol announces one thing only — that the function has other inputs and they are being held still — and that the arithmetic of differentiating is unchanged from the previous day, so nothing new was learned about calculus and something new was learned about bookkeeping. A footer panel spanning the full width assembles the result in two columns. The left column gives the gradient as the two partials written side by side, one component per input, and then its length as the square root of 2 squared plus 6 squared, which is the square root of 40, which is 6.324555, described as how steep the steepest way up is in units of f gained per unit of distance walked rather than a height or a distance. The right column gives the bearing as the arctangent of 6 over 2, which is 71.5651 degrees and specifically not 45 degrees, because the bowl is three times steeper in y so uphill leans north; and then the dot product of the gradient with the contour direction (6, minus 2), worked as 2 times 6 plus 6 times minus 2, which is 12 minus 12, which is exactly 0 — no tolerance and no approximation — which is why every optimisation picture shows arrows crossing the contour lines at right angles.'
  - id: steepest-ascent-flow
    file: assets/steepest-ascent-flow.svg
    type: flow-animated
    title: 'Eight directions tried one after another from the same point, with the rate of change measured for each, and the gradient''s direction winning'
    alt: 'Diagram: eight unit directions tried one after another from the point one comma one on the bowl f equals x squared plus three y squared, with the rate of change measured directly along each bearing and shown as a bar, giving 2.0000 due east, 4.7321 at thirty degrees, 5.6569 at forty-five, 6.1962 at sixty, 6.3246 at 71.5651 degrees, 6.0000 at ninety, 4.1962 at a hundred and twenty and minus 2.0000 due west, with the winner at 71.5651 degrees being exactly the gradient''s bearing and its value exactly the gradient''s length, the square root of 40'
    description: 'An animated flow diagram, fully readable as a still image, that demonstrates the steepest-ascent property rather than asserting it. A heading states the setup once: f of x comma y equals x squared plus three y squared, standing at the point (1, 1), with the note that every rate shown was measured DIRECTLY along its own bearing with a central difference and that no gradient was formed to produce any of the numbers. The left panel, headed "Eight unit directions, tried one at a time", shows a fan of arrows radiating from a black dot at the point, all of exactly the same length because all are unit directions and only the bearing differs. Seven of them are amber and labelled 0, 30, 45, 60, 90, 120 and 180 degrees; the eighth, at 71.5651 degrees, is drawn thicker and in blue and labelled as the gradient, with a blue ring around its tip. A dashed teal line runs through the dot at right angles to the blue arrow, labelled as the contour. The seven amber arrows brighten and thicken one after another in bearing order over an eight-second cycle, so the eye follows the order in which the candidates were tried; the blue one pulses in its turn along with them and is permanently drawn heavier so the still frame shows the answer without needing the motion, and its ring thickens from seventy per cent of the cycle to the end, which is the moment the search settles on the gradient. The right panel, headed "What each one measured", is a horizontal bar chart of the same eight results against a vertical zero line, with each bearing labelled on the left and each measured rate printed at the end of its bar: 2.0000 at 0 degrees, 4.7321 at 30, 5.6569 at 45, 6.1962 at 60, 6.3246 at 71.57, 6.0000 at 90, 4.1962 at 120, and minus 2.0000 at 180, whose bar is red and runs the other way from the zero line because that direction goes downhill. The winning bar is blue, and a marching-dash blue arrow runs along its length. Each amber bar brightens in step with its own arrow in the fan. Beneath the chart, three lines record that the winner is 6.3246 at 71.5651 degrees, which is exactly the magnitude of the gradient, the square root of 2 squared plus 6 squared, and exactly the bearing of the gradient (2, 6) — and that the sweep was told nothing about the gradient and found it anyway. A footer spanning the full width gives the two readings of one arrow: the direction of the gradient answers which way is uphill, and its length answers how steep that way is; no direction can beat that length, because the rate along a unit direction u is the gradient dotted with u, which is the magnitude times the cosine of the angle between them, and a cosine cannot exceed 1; and reversing the arrow gives the steepest way down at minus 6.3246, which is the whole of gradient descent, and the reason the 90-degree bar reads 6.0000 rather than being the winner. A prefers-reduced-motion block stops every animation and restores the resting state, in which all eight arrows are fully drawn and labelled, all eight bars are filled with their numbers printed, the blue winner is heavy with its ring at full thickness, and the marching arrow becomes a solid line — so every figure and caption is present without any motion at all.'
