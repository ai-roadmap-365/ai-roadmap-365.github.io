questions:
  - question: 'On `f(x, y) = xy` at the point `(1, 0)`, the partial derivative `∂f/∂x` is exactly 0. What does that tell you about the surface at that point?'
    options:
      - 'Very little on its own — it says the slope is zero along the x direction, and `∂f/∂y` there is 1, so the surface is not flat at all'
      - 'The surface is flat at that point, since a zero derivative means no change'
      - 'The point is a minimum of the function'
      - 'The function is not differentiable there, which is why the partial is zero'
    answer_index: 0
    explanation: 'A partial derivative is a statement about ONE direction, not about the point. Walk along the x-axis, where y is 0, and `f = x × 0 = 0` the whole way — the function is identically zero along that line, so of course its slope along it is zero. Step off the line by a hair and it stops being zero: `∂f/∂x = y`. Meanwhile `∂f/∂y = x = 1` at that point, so the ground is climbing at unit rate in the perpendicular direction. Option 1 is the intuition carried over from one-variable calculus, where a zero derivative really does mean the curve is level; with several variables you need EVERY partial to vanish before the ground is level, and even then see question 5. Option 2 is wrong for the same reason and also because `f = xy` takes negative values arbitrarily close to `(1, 0)`. Option 3 is wrong: `xy` is a polynomial and is differentiable everywhere.'

  - question: 'For `f(x, y) = x² + 3y²`, the gradient at `(1, 1)` is `[2, 6]`. How many components does the gradient have, and why?'
    options:
      - 'Three, matching the three dimensions the graph of the function occupies'
      - 'One, because f returns a single number'
      - 'Two, matching the two INPUTS — a gradient is an arrow on the flat map you are standing on, not one pointing out of the hillside'
      - 'It depends on the step size h used to compute it'
    answer_index: 2
    explanation: 'This is the most common way to misread the object, and it is worth being emphatic. The function takes a point with two coordinates and returns one number, so its graph is naturally drawn as a surface in three dimensions — and the gradient still has two components. It lives in the INPUT space. It is a direction to walk, drawn on the flat contour map, not a vector pointing up out of the terrain. The general rule: a scalar function of n inputs has an n-component gradient, whatever its graph looks like. Option 0 is the mistake this question exists to catch. Option 1 confuses the gradient with the function value. Option 3 confuses accuracy with shape — h changes how good the numbers are, never how many of them there are.'

  - question: 'You are at a point where `|∇f| = 6.3246`. You walk along a unit direction that makes a 60° angle with the gradient. What rate of change do you experience?'
    options:
      - '6.3246, because the gradient''s magnitude is the rate of change in every direction'
      - 'About 3.1623, which is 6.3246 × cos(60°)'
      - 'About 5.4772, which is 6.3246 × sin(60°)'
      - '0, because any direction other than the gradient gives no change'
    answer_index: 1
    explanation: 'The directional derivative is `∇f · u`, and Day 103''s geometric reading of the dot product gives `|∇f| |u| cos θ`. Since u is a unit vector, `|u| = 1`, so the answer is `|∇f| cos θ` — here `6.3246 × 0.5 = 3.1623`. Wikipedia''s article on the gradient offers the same arithmetic as a road on a hill: if the steepest slope is 40%%, a road at 60° from the uphill direction has a slope of "40%% times the cosine of 60°, or 20%%". Option 0 forgets that the rate depends on which way you walk, which is the entire subject of the day. Option 2 uses sine, which would give zero along the gradient itself and the maximum perpendicular to it — exactly backwards. Option 3 is the over-correction: only directions at exactly 90° give zero, and cos(60°) is 0.5, not 0.'

  - question: 'Why is the gradient perpendicular to the contour line through a point?'
    options:
      - 'It is a convention of how contour maps are drawn rather than a mathematical fact'
      - 'Because contour lines are always straight, and gradients are always at right angles to straight lines'
      - 'It is true only for circular contours; on an elliptical bowl the angle is slightly less than 90°'
      - 'Because a contour is where f does not change, the rate along it is zero, and `∇f · u = 0` means the two vectors are perpendicular'
    answer_index: 3
    explanation: 'The argument is three steps and needs no new machinery. A contour — or level set — is by definition the set of points where f takes one fixed value, so walking along it changes f by nothing. The rate of change along a unit direction u is `∇f · u`. Setting that to zero for a direction along the contour gives a dot product of zero, and a dot product of zero between two non-zero vectors is precisely what perpendicular means. Wikipedia puts it the same way: "the dot product `(∇f)ₓ · v` ... gives the directional derivative ... It follows that in this case the gradient of f is orthogonal to the level sets of f." Option 0 has it backwards — the drawing convention follows the fact. Option 1 is false; contours are only straight for a linear function. Option 2 is a tempting hedge and is wrong: the lab checks an ELLIPTICAL contour, `x² + 3y² = 4`, and the exact tangent dotted with the exact gradient is `−2L sin t cos t + 2L sin t cos t = 0` identically, for every point on it. What IS true on an ellipse is that the gradient does not point at the centre — which is question 7.'

  - question: 'Three surfaces all have `∇f = [0, 0]` at the origin: `x² + 3y²`, `−(x² + y²)`, and `x² − y²`. What can the gradient tell you about which is which?'
    options:
      - 'Nothing — all three are stationary points and the gradient is identical; distinguishing them needs the second derivatives'
      - 'The sign of the gradient distinguishes them, but you have to look at the components separately'
      - 'Computing the gradient with a smaller h would separate them'
      - 'The magnitude of the gradient is slightly different in each case if you measure precisely enough'
    answer_index: 0
    explanation: 'They are a minimum, a maximum and a saddle, and the gradient is `[0, 0]` for all three. This is not a limitation of precision — it is a limitation of what a gradient IS. The gradient is built from FIRST derivatives, which describe the tangent plane; at a stationary point the tangent plane is level in all three cases and there is nothing left to distinguish. Which kind of point it is depends on the SECOND derivatives, and the matrix of those is the Hessian. Options 2 and 3 are the same mistake in two costumes: they imagine the information is present but faint. It is absent. Wikipedia names the general case: "a point where the gradient is the zero vector is known as a stationary point". The practical consequence is large — an optimiser that stops when the gradient is zero would stop dead at a saddle, and in a parameter space with millions of directions a stationary point is far more likely to be a saddle than a minimum, because being a minimum requires every one of those directions to curve upward at once.'

  - question: 'You compute a partial derivative with a central difference and want the most accurate answer float64 can give. Which step size h is best, and what happens if you go smaller?'
    options:
      - 'The smallest representable h, since the definition involves a limit'
      - 'Around 1e-08, and going smaller improves it further'
      - 'Around 1e-05, and going much smaller makes the answer dramatically WORSE — at 1e-14 it is out by more than at h = 0.1'
      - 'It does not matter; the central difference is exact at any h'
    answer_index: 2
    explanation: 'Two errors pull in opposite directions. The truncation error of a central difference shrinks like h², and the roundoff error from subtracting two nearly equal floats GROWS like 1/h — so the total is U-shaped and there is a trough. Balancing an h² term against an ε/h term puts it near the cube root of machine epsilon, which is 6.06e-06 for float64; the lab measures the best of fifteen decades at 1e-05, the nearest power of ten. Option 0 is the intuition from the definition and is exactly the trap Day 108 set up: at h = 1e-14 the measured error is 1.450e-01, fourteen times WORSE than at h = 0.1, a step a trillion times bigger, and nothing warns you. Option 1 is the answer for a FORWARD difference, whose error shrinks like h rather than h², putting its trough near the square root of epsilon at 1.49e-08 — the lab measures 1e-08 there, three decades away from the central one. Option 3 is true for a quadratic and only a quadratic: `((x+h)² − (x−h)²)/2h = 2x` exactly. On a genuine cubic the error is exactly h².'

  - question: 'On the elliptical bowl `x² + 3y²`, the minimum is at the origin. From the point `(1, 1)`, does the negative gradient point straight at the minimum?'
    options:
      - 'Yes — the negative gradient always points at the nearest minimum, which is what makes gradient descent work'
      - 'No, and it is off by 26.565° — steepest downhill and straight-towards-the-bottom are different directions, which is what makes gradient descent zig-zag'
      - 'No, because the negative gradient points AWAY from the minimum on any bowl'
      - 'Yes for the x component but no for the y component'
    answer_index: 1
    explanation: 'At `(1, 1)` the gradient is `(2, 6)`, so the negative gradient has a bearing of 251.565°, while the bearing straight back to the origin is 225°. The gap is 26.565°, and it exists because the bowl is elliptical: the 3 in front of y² makes it three times steeper in y, so the steepest way down leans harder in y than a straight line to the bottom would. On a CIRCULAR bowl the two would agree exactly, which is why circular examples give a misleading intuition. Option 0 is that misleading intuition, and the gap is precisely what makes gradient descent bounce from side to side down a narrow valley rather than walking calmly in — Day 111 will watch it happen, and the fixes for it (momentum, adaptive step sizes, preconditioning) are a large part of why optimisers have names. Option 2 has the sign backwards: the gradient points away from the minimum on a bowl, so the NEGATIVE gradient points broadly back towards it. Option 3 is not a coherent statement about a direction.'

  - question: 'A numerical gradient using a central difference costs how many evaluations of the function, and what does that mean for training a model with a million parameters?'
    options:
      - 'Two evaluations in total, so a million-parameter model costs two forward passes per step'
      - 'Two evaluations per parameter — two million forward passes for ONE step, which is why reverse-mode autodiff exists'
      - 'One evaluation per parameter, which is affordable at any scale'
      - 'It depends on the step size h; a smaller h needs more evaluations'
    answer_index: 1
    explanation: '`gradient` calls `partial` once per input, and `partial` evaluates f twice — once nudged up, once nudged down. So the cost is exactly 2n evaluations of the WHOLE function, and the lab counts it by wrapping the loss in a call counter: three parameters, six evaluations. One evaluation of a model''s loss is one complete forward pass over the batch, so a million parameters means two million forward passes to take a single training step, and training takes millions of steps. That is not slow; it is impossible by many orders of magnitude. Reverse-mode automatic differentiation — PyTorch''s autograd, JAX''s grad — gets the entire gradient for roughly one forward pass plus one backward pass regardless of the parameter count, and gets it exactly rather than to within h². Neither library is installed in this lab and no output from them is reproduced. Option 0 forgets the per-parameter loop, which is the only part that matters. Option 2 describes a forward difference, which is still linear in n and still hopeless. Option 3 confuses accuracy with cost: h changes how good each answer is, never how many evaluations there are. What numerical differentiation is still genuinely for is CHECKING an analytic gradient — gradient checking — and today''s lab is a working implementation of it.'
