questions:
  - question: 'Two bars are drawn for the values 100 and 102 with the y-axis set to start at 99. Measured off the rendered bars, what is the drawn height ratio and the resulting lie factor?'
    options:
      - 'A drawn ratio of 1.02 and a lie factor of 1.00, because the data did not change'
      - 'A drawn ratio of 3.00 and a lie factor of 2.94'
      - 'A drawn ratio of 2.00 and a lie factor of 2.00'
      - 'It cannot be computed, because the axis no longer shows the full bars'
    answer_index: 1
    explanation: 'The visible part of each bar runs from the axis floor to its value: 100 - 99 = 1 unit for the first, 102 - 99 = 3 for the second, so the drawn ratio is 3.00. The data ratio is 102/100 = 1.02, and the lie factor is 3.00 / 1.02 = 2.94. The point of measuring the drawn geometry rather than the inputs is exactly that the two answers differ -- if your measurement always returned 1.02 it could never detect a distortion.'

  - question: 'Why does the same pair of numbers on the same non-zero baseline give a lie factor of exactly 1.00 when drawn as a line rather than as bars?'
    options:
      - 'Lines are drawn thinner, so the visual difference is less pronounced'
      - 'matplotlib silently corrects the axis limits for line plots but not for bar plots'
      - 'A line encodes change as vertical displacement, and a labelled linear axis converts that displacement back to the true change whatever the baseline is'
      - 'It does not; the line has the same lie factor of 2.94 and the lesson rounds it differently'
    answer_index: 2
    explanation: 'This is the encoding distinction that makes the rule usable instead of a slogan. A bar''s length from the baseline IS the value, so moving the baseline changes what the length means. A line''s vertical displacement encodes the CHANGE, and the baseline plays no part in that -- a reader measures the rise as a fraction of the plotting box and multiplies by the labelled axis range, recovering 2.0 every time. Hence: zero baselines are load-bearing for bars, and often wrong for lines.'

  - question: 'Can independently rescaling the two y-axes of a dual-axis chart change the Pearson correlation of the two drawn traces?'
    options:
      - 'No. Correlation is invariant under positive affine transforms, and axis rescaling is exactly such a transform'
      - 'Yes, and that is the standard reason dual axes are considered misleading'
      - 'Only when the two series have different units'
      - 'Only if the axes are set to different numbers of tick marks'
    answer_index: 0
    explanation: 'The folk warning about dual axes is false as usually stated, and the correction is more useful than the warning. Measured across 500 random pairs of axis limits, the drawn correlation matched the data correlation to within 3.12e-15 -- floating-point noise around an algebraic identity. What a dual axis really controls is the SIGN, which inverting one axis negates exactly, and the visual impression: the gap between the drawn curves moved from 0.4938 to 0.0147 on unchanged data.'

  - question: 'The lab widens both axes of a dual-axis chart twentyfold and measures the gap between the drawn curves for two different datasets: an uncorrelated pair (r = -0.001) and a strongly correlated pair (r = +0.913). What does it find, and why does it matter?'
    options:
      - 'The correlated pair overlaps and the uncorrelated one does not, confirming that overlap indicates correlation'
      - 'Neither pair overlaps, showing that widening an axis has no visual effect'
      - 'Both pairs draw as overlapping curves -- gaps of 0.0046 and 0.0147 -- so overlap carries no information about correlation at all'
      - 'The uncorrelated pair overlaps more closely, which reverses the usual advice'
    answer_index: 2
    explanation: 'This control is what turns the exercise from a demonstration into an argument. If only the uncorrelated pair could be made to overlap, overlap would still mean something. Because the same scaling drives BOTH to overlapping curves, the picture is identical for opposite data -- so a reader who concludes "these move together" from a dual-axis chart has learned nothing, and neither has the author who drew it.'

  - question: 'A bubble chart sets each circle''s RADIUS proportional to its value. For two values with a data ratio of 4, what are the shown area ratio and the lie factor?'
    options:
      - 'A shown area ratio of 4 and a lie factor of 16'
      - 'A shown area ratio of 16 and a lie factor of 4'
      - 'A shown area ratio of 16 and a lie factor of 16'
      - 'A shown area ratio of 2 and a lie factor of 0.5'
    answer_index: 1
    explanation: 'Area goes as the square of the radius, so a radius ratio of 4 draws an area ratio of 4 squared, which is 16. The lie factor is the shown effect over the data effect: 16 / 4 = 4. Getting this the right way round matters -- the shown AREA RATIO is the square of the data ratio, which makes the LIE FACTOR equal the data ratio itself. And note what that implies: the distortion grows with the real difference, so the chart exaggerates most where the reader is looking hardest.'

  - question: 'Two 3D bars with heights 1 and 2 are rendered under perspective. The drawn front-face area ratio is 2.34 with the taller bar at the far depth and 4.20 with it at the near depth, while flat 2D bars give exactly 2.000. What is the correct conclusion?'
    options:
      - 'The 3D renderer has a bug that a newer matplotlib release fixes'
      - '3D is acceptable as long as the taller bar is placed at the far depth, where the error is only 17%'
      - 'The third dimension carries no data and makes the drawn size depend on where a bar stands, breaking the comparison the chart exists to support'
      - 'The flat chart is the inaccurate one, since it ignores the depth information'
    answer_index: 2
    explanation: 'The bars already encoded everything in their heights; the depth axis carries nothing. What it adds is a dependence of drawn size on position, which is precisely the property a comparison chart must not have. The exact figures depend on the camera -- matplotlib''s perspective projection at focal_length 0.2 and the default view angle -- and the lesson says so. What survives any camera is the shape of the finding, which is why the lab asserts that the departure exceeds a tolerance rather than pinning a value that has no right to be portable.'

  - question: 'The review contract passes a line chart drawn on a y-axis starting at 99 whose caption reads "Group B is 2% higher than group A. Note: the y axis starts at 99, not zero." Why is that the right behaviour rather than a loophole?'
    options:
      - 'Because line charts are always exempt from baseline rules'
      - 'Because the contract only checks bar charts and skips everything else'
      - 'Because a 2% difference is below the threshold at which any distortion matters'
      - 'Because a non-zero baseline is legitimate for a line, and the caption discloses it -- the contract forbids breaking a rule silently, not breaking it'
    answer_index: 3
    explanation: 'This is the single most important row in the day. A clipped outlier, a log axis, a non-zero baseline on a share price -- all legitimate, and sometimes necessary. What separates the professional from the misleading is not the choice but the note in the caption. The contract encodes exactly that: it fails the truncated bar chart with the identical caption text minus the disclosure, and passes this one.'

  - question: 'A chart is drawn from correct data on a zero baseline with no distortion of any kind, captioned "Results.", with no axis label. The review contract fails it. What is the reasoning?'
    options:
      - 'Accuracy is not the same as honesty, and neither is the same as usefulness -- a chart with no claim and no label has not communicated anything'
      - 'The contract has a false positive; a distortion-free chart should always pass'
      - 'Any caption shorter than a full sentence is rejected as a formatting error'
      - 'The chart is fine and the failure only appears because the lesson uses a strict setting'
    answer_index: 0
    explanation: 'An unlabelled, unordered, uncommented chart is not a neutral presentation of facts -- it is an unhelpful one. It states no claim, so a reader cannot disagree with it; whatever they conclude is an accident. This is why storytelling is not the opposite of honesty. Refusing to tell a story just means the reader tells themselves one, and you have no idea which.'
