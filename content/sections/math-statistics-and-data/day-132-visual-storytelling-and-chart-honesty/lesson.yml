title: 'Visual Storytelling and Chart Honesty'
section: math-statistics-and-data
subsection: data-analysis
week: 19
learning_promise: >-
  After this lesson you will be able to measure how much a chart
  overstates its own evidence, using Tufte's lie factor computed from the
  chart's rendered geometry rather than from the numbers that went in.
  You will watch two bars for 100 and 102 -- a two per cent difference --
  redrawn on a y-axis starting at 99 until one is exactly three times the
  height of the other, a measured drawn ratio of 3.0000 for a lie factor
  of 2.9412, with no data changed. You will then learn the nuance almost
  every version of that warning omits: the same two numbers on the same
  truncated axis, drawn as a line, have a lie factor of exactly 1.0000 on
  every baseline tried, because a bar encodes value as length from the
  baseline while a line encodes change as displacement. You will discover
  that the standard warning about dual y-axes is false as usually stated
  -- scaling cannot change the correlation of the drawn traces at all,
  measured invariant to 3.12e-15 across 500 random pairs of axis limits
  -- and that what a dual axis really controls is worse: the sign is a
  free parameter (inverting one axis takes a real correlation of +0.913234
  to a drawn -0.913234, exactly), and the same widening drives both an
  uncorrelated pair and a strongly correlated pair to overlapping curves,
  so overlap is evidence of nothing. You will watch a trend slope flip
  from -0.7305 to +0.7045 per week depending only on where a reader is
  allowed to start looking, watch two textbook bin rules draw one hump and
  two humps from the same 400 values, measure a radius-encoded bubble pair
  whose shown area ratio is the square of its data ratio, and measure two
  3D bars drawn 17% and 110% away from a data ratio a flat chart gets
  exactly right. You will measure the legitimate craft too -- ordering,
  retrievable claim text, and the luminance gap of 0.0996 that makes the
  classic red/green palette collapse for a colour-deficient reader. And
  you will finish with a reusable review contract that passes an honest
  chart, fails a truncated one, and passes a chart that breaks a rule and
  discloses it -- because the professional act is not refusing to break
  the rule, it is the note in the caption.
objectives:
  - 'Define Tufte''s lie factor precisely and compute it from a chart''s rendered geometry rather than from the values that were plotted'
  - 'Explain why a truncated axis destroys a bar chart''s encoding and leaves a line chart''s intact, and state the two-clause baseline rule that follows'
  - 'State precisely what a dual y-axis can and cannot do to an apparent relationship, including why scaling cannot change the drawn correlation and why overlapping curves carry no information'
  - 'Demonstrate that a trend''s sign is chosen by the window, and name the defence: show the full series and mark the window'
  - 'Show that two citable bin rules can support opposite claims about modality from one sample, and explain why "I used a standard rule" is not a defence'
  - 'Explain why encoding a value as a radius squares every ratio, and state the relationship between the shown area ratio and the lie factor the right way round'
  - 'Measure how far 3D perspective moves a comparison that a flat chart reproduces exactly, and explain why the third dimension carries no data'
  - 'Treat ordering, annotation, contrast and removal as measurable craft, and explain why an unlabelled chart is unhelpful rather than neutral'
  - 'Treat accessibility as an honesty requirement, using luminance separation and redundant encoding rather than colour alone'
  - 'Apply a reusable review contract to your own charts, and explain why disclosing a deliberate rule break is professional while breaking it silently is not'
prerequisites:
  - 'Day 127 -- chart choice and the perceptual ranking, including radius encoding and the red/green collapse this lesson quantifies'
  - 'Day 128 -- the matplotlib object model and testing a chart by asserting on its artists, which every measurement here applies'
  - 'Day 130 -- bin width as a choice; this lesson supplies the consequences'
  - 'Day 131 -- time series, including what a chosen window does to a trend'
  - 'Day 116 -- Simpson''s paradox, referenced here rather than re-derived'
  - 'Comfort with Python functions, NumPy arrays, and reading a stack trace'
