visuals:
- id: distortion-anatomy-architecture
  file: assets/distortion-anatomy-architecture.svg
  type: diagram
  title: One dataset drawn honestly, surrounded by five distortions, each labelled with its measured lie
    factor
  alt: 'Diagram: a reference map with an honest two-bar chart at the centre labelled lie factor 1.00,
    surrounded by five distorted renderings of the same data — a truncated baseline at lie factor 2.94,
    a dual y-axis whose sign is a free parameter, a radius-encoded bubble pair at lie factor 4.00, a pair
    of 3D bars whose drawn ratio is up to 110 per cent off, and a cherry-picked window whose trend slope
    flips from minus 0.73 to plus 0.70 per week — with a closing note that none of the five changed a
    single number'
  description: 'A static architecture diagram on a light background, laid out as a reference map for the
    whole day. At the centre, inside a blue-outlined panel headed "THE TRUTH", sits a small two-bar chart
    of the values 100 and 102 drawn on a zero baseline with a labelled axis, captioned "lie factor 1.00"
    in green. Five grey panels are arranged around it, each connected to the centre by a thin leader line,
    and each showing the same two numbers rendered a different way with the number it was measured at.
    Top left, "1. Truncated baseline": the same two bars on a y-axis starting at 99, one bar visibly three
    times the height of the other, with a dashed red floor line marking the cut, the note "3x the height,
    2% the difference", and "lie factor 2.94" in red. Top right, "2. Dual y-axis": two axes on one plot
    with two wandering lines drawn close together, captioned "drawn gap 0.49 or 0.01, the author''s choice"
    and labelled "sign is a free parameter". Middle left, "3. Encoded by radius": a small circle labelled
    25 beside a very much larger one, with the note "shown area ratio 16, data ratio 4" and "lie factor
    4.00". Middle right, "4. 3D perspective": two bars drawn as tilted boxes with visible top faces, captioned
    "data ratio 2, drawn 2.34 far / 4.20 near" and labelled "up to 110% off". Along the bottom, "5. Cherry-picked
    window": one U-shaped series with two red straight trend lines fitted over its two halves, labelled
    "-0.73 / week" and "+0.70 / week", with the note "full series: -0.01 per week, flat". A closing italic
    caption reads: "Not one of these five changed a single number. Each is a formatting choice an honest
    person makes without noticing."'
- id: baseline-flow
  file: assets/baseline-flow.svg
  type: flow-animated
  title: 'The baseline sliding up from zero: the drawn bar ratio grows while the data ratio stays fixed
    at 1.02 and the lie factor climbs'
  alt: 'Diagram: animated flow in four stages showing two bars for 100 and 102 at y-axis floors of 0,
    90, 95 and 99. As the floor rises, the drawn bar ratio grows from 1.02 to 1.20 to 1.40 to 3.00 and
    the lie factor climbs from 1.00 to 1.18 to 1.37 to 2.94, while a green caption reading data ratio
    1.02 stays identical in all four stages, and a marker walks along a lie-factor scale beneath them'
  description: 'An animated flow diagram, fully readable as a still image. The heading reads "Slide the
    baseline up. Watch what does not change." and a subtitle states that the four panels show two bars
    for 100 and 102 at four y-axis floors, with every drawn height measured rather than sketched. Four
    cards run left to right, headed "y axis from 0", "y axis from 90", "y axis from 95" and "y axis from
    99". In each, two bars are drawn against a labelled axis whose floor is marked by a solid red rule,
    with a pale red band beneath it showing how much of the bars has been cut away, growing wider at each
    stage. Under each chart, three lines: the measured drawn ratio, which reads 1.02, 1.20, 1.40 and 3.00
    across the four stages; the data ratio, which reads 1.02 in green in every one of the four; and the
    lie factor, which reads 1.00, 1.18, 1.37 and 2.94, coloured green through amber to red. Beneath the
    four cards runs a horizontal lie-factor scale with a labelled dot at each of those four values and
    a small blue triangular marker that steps along it, together with the note "Tufte calls anything outside
    0.95 to 1.05 a distortion". Animation: each card''s border lights up in turn on an eight-second cycle
    so the eye reads the stages in order, each red floor rule brightens as its card is emphasised, and
    the triangular marker walks from the first value to the last. A prefers-reduced-motion block stops
    all three animations: every card rests with its normal grey border, every floor rule rests fully visible,
    and the marker rests at the final position on the scale, with all four charts, all twelve numbers,
    both captions and the scale fully present and unchanged. The closing italic caption reads: "The green
    line never moves: the data ratio is 1.02 at every stage. Only the picture changes.", followed by a
    note that a bar encodes value as length from the baseline so cutting the baseline breaks the encoding,
    while a line on the same floors keeps a lie factor of exactly 1.00.'
