<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the purpose.">
  <title>Which framing when</title>
  <style>
    .story-when-bg   { fill: #f8fafc; }
    .story-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .story-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .story-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .story-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .story-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .story-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .story-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .story-when-row { opacity: 1; }
    .story-when-r0 { animation-delay: 0.00s; }
    .story-when-r1 { animation-delay: 0.45s; }
    .story-when-r2 { animation-delay: 0.90s; }
    .story-when-r3 { animation-delay: 1.35s; }
    .story-when-r4 { animation-delay: 1.80s; }
    .story-when-row { animation: story-when-reveal 7.3s ease-in-out infinite; }
    @keyframes story-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="story-when-bg" width="980" height="390"/>
  <text class="story-when-h1"  x="30" y="40">Which framing when</text>
  <text class="story-when-sub" x="30" y="64">By the purpose.</text>
  <rect class="story-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="story-when-name" x="46" y="122">The purpose</text>
  <text class="story-when-desc" x="46" y="142">Why you are presenting.</text>
  <text class="story-when-desc story-when-row story-when-r0" x="46" y="182">Exploring for yourself</text>
  <text class="story-when-desc story-when-row story-when-r1" x="46" y="216">Reporting to a technical audience</text>
  <text class="story-when-desc story-when-row story-when-r2" x="46" y="250">Persuading a decision-maker</text>
  <text class="story-when-desc story-when-row story-when-r3" x="46" y="284">Public communication</text>
  <text class="story-when-desc story-when-row story-when-r4" x="46" y="318">Regulatory or legal submission</text>
  <rect class="story-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="story-when-name" x="526" y="122">The approach</text>
  <text class="story-when-desc" x="526" y="142">What to do.</text>
  <text class="story-when-desc story-when-row story-when-r0" x="526" y="182">Anything readable; speed matters</text>
  <text class="story-when-desc story-when-row story-when-r1" x="526" y="216">Full detail, caveats included</text>
  <text class="story-when-desc story-when-row story-when-r2" x="526" y="250">One clear point, caveats stated</text>
  <text class="story-when-desc story-when-row story-when-r3" x="526" y="284">Simple encodings, explicit sources</text>
  <text class="story-when-desc story-when-row story-when-r4" x="526" y="318">Complete disclosure, documented method</text>
  <text class="story-when-sub" x="30" y="372">Persuading a decision-maker while stating caveats is the hardest of these and the one worth practising, since a decision made on an overstated finding rebounds.</text>
</svg>
