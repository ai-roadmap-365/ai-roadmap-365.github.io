terms:
  - term: Lie factor
    definition: >-
      Edward Tufte's measure of graphical distortion, from The Visual
      Display of Quantitative Information (1983): the size of the effect
      shown in the graphic divided by the size of the effect in the data.
      It is unitless -- a ratio of two ratios -- and equals 1.0 when the
      picture faithfully reproduces the data's effect. Tufte's rule of
      thumb treats anything outside roughly 0.95 to 1.05 as a distortion.
      Its value is that it turns "this chart is misleading" from an
      opinion into arithmetic.

  - term: Truncated axis
    definition: >-
      A value axis whose range does not begin at zero. For a bar chart
      this breaks the encoding outright, because a bar's length from the
      baseline is the value: two bars for 100 and 102 on an axis starting
      at 99 draw at a measured height ratio of 3.00 against a data ratio
      of 1.02. For a line chart encoding change it is often legitimate
      and sometimes necessary, provided the baseline is visible, labelled,
      and chosen to serve the reader's question rather than the author's
      conclusion.

  - term: Baseline
    definition: >-
      The lower limit of a value axis -- the level from which marks are
      measured. Whether it is load-bearing depends entirely on the mark:
      it is part of a bar's encoding and not part of a line's. This is why
      "always start at zero" is right for bars and wrong for lines, and
      why stating the rule without the distinction produces charts on
      which nothing is visible.

  - term: Dual y-axis
    definition: >-
      A chart with two independently scaled value axes, typically created
      with ax.twinx() in matplotlib and automatically by some BI tools
      when a second measure is added. Contrary to the usual warning, the
      scaling cannot change the Pearson correlation of the two drawn
      traces -- correlation is invariant under affine transforms. What it
      does control is the sign, which inverting one axis negates exactly,
      and how close the two curves sit, which is what readers actually
      respond to and which is entirely the author's choice.

  - term: Tracking gap
    definition: >-
      The root-mean-square vertical distance between two drawn curves,
      measured in fractions of the plot height. Zero means they lie
      exactly on top of one another. It is the quantity a dual-axis chart
      really manipulates, and the lab measures it running from 0.4938 to
      0.0147 on unchanged data. Because the same small gap is achievable
      for an uncorrelated pair and a strongly correlated one, a small gap
      carries no information about correlation.

  - term: Cherry-picked window
    definition: >-
      A subrange of a time series chosen, deliberately or not, so that
      the trend within it supports a desired claim. The lesson's series
      has a fitted slope of -0.7305 per week over its first half,
      +0.7045 over its second, and -0.0131 over the whole -- three true
      statements about three windows, only one of which is a statement
      about the series. The defence is to show the full series and mark
      the window inside it.

  - term: Bin width as an editorial choice
    definition: >-
      The recognition that a histogram's bin width is selected rather
      than given, and that the selection can decide the conclusion. On the
      lesson's sample, Sturges' rule draws one hump and the
      Freedman-Diaconis rule draws two, supporting opposite statements
      about modality from the same 400 values. Both rules are citable,
      which is why "I used a standard rule" is not a defence.

  - term: Radius versus area encoding
    definition: >-
      The error of setting a circle's radius from a value when a reader
      decodes its area. Because area goes as the square of the radius, a
      data ratio of 4 draws an area ratio of 16 -- so the shown area ratio
      is the square of the data ratio, which makes the lie factor equal
      the data ratio itself. The distortion therefore grows with the real
      difference. matplotlib's scatter takes s as marker area in points
      squared, so the correct encoding is the one that appears to do less.

  - term: Perspective distortion
    definition: >-
      The effect of a 3D projection on a comparison the chart exists to
      support: under perspective the drawn size of a mark depends on its
      depth, so identical data drawn at different depths draws at
      different sizes. Measured here, two bars with a data ratio of 2.000
      draw at 2.341 or 4.204 depending only on which one stands nearer,
      while flat bars reproduce 2.000 exactly. The third dimension in such
      a chart carries no data at all.

  - term: Relative luminance
    definition: >-
      The brightness of a colour as defined by WCAG: each sRGB channel is
      linearised, then weighted 0.2126, 0.7152 and 0.0722 and summed,
      giving a value from 0.0 for black to 1.0 for white. It is the
      channel that survives every form of colour-vision deficiency, every
      greyscale printer and every washed-out projector. It is one
      component of whether two colours can be distinguished, not the whole
      of it -- a full simulation needs a colour-appearance model.

  - term: Redundant encoding
    definition: >-
      Carrying a distinction on more than one visual channel at once --
      colour plus marker shape, colour plus line style, colour plus a
      direct label -- so that a reader who cannot decode one channel still
      receives the information. The practical test is whether the chart
      still works printed in black and white.

  - term: Caption contract
    definition: >-
      The reusable review check this lesson builds: a caption stating a
      claim a reader could disagree with, a labelled y axis, a non-zero
      baseline named in the caption, and either a zero baseline or an
      explicit disclosure. It passes an honest chart, fails a truncated
      one, and passes a line on a non-zero baseline whose caption says so
      -- because it forbids breaking a rule in silence rather than
      forbidding the break.

  - term: Graphical perception
    definition: >-
      The empirical study of how accurately readers decode quantities
      from visual encodings, established by William S. Cleveland and
      Robert McGill in the Journal of the American Statistical
      Association (1984). Their experiments produced the ordering of
      elementary perceptual tasks -- position along a common scale, then
      length, then angle and slope, then area, then volume and colour --
      that Day 127 introduced and that predicts which encodings fail
      before any distortion is added.

  - term: Drawn geometry
    definition: >-
      What a chart actually renders, as opposed to the values passed to
      the plotting call. Every measurement in this lesson reads it back
      through matplotlib's own transforms -- patch bounding boxes, line
      data pushed into axes fractions, collection sizes, projected 3D
      corners -- because a measurement computed from the inputs can never
      disagree with them and would report a lie factor of 1.0 for every
      chart ever drawn.

  - term: Storytelling versus neutrality
    definition: >-
      The distinction that an unlabelled, unordered, uncommented chart is
      not a neutral presentation of facts but an unhelpful one. It makes
      no claim, so a reader cannot disagree with it, and whatever they
      conclude is an accident. Ordering, annotation, emphasis through
      contrast and the removal of uninformative marks are craft in service
      of honesty, not opposed to it.
