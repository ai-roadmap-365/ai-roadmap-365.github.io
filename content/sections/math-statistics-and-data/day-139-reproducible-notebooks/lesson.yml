day: 139
slug: reproducible-notebooks
title: 'Reproducible Notebooks'
section: math-statistics-and-data
subsection: data-analysis
week: 20
learning_promise: >-
  After this lesson you will be able to state, and prove, the rule this day exists to defend: a notebook
  that has not been restarted and run from the top is a document whose claims are unverified, however
  carefully it was written. You will build a three-cell notebook with nbformat, execute it top to bottom for
  one answer and out of order for a different, silently wrong one, and read execution_count as the only
  trace of what really happened. You will delete a cell from a notebook while its kernel stays alive, watch
  the remaining cell keep working anyway, and then watch the same notebook fail with a clean NameError the
  moment its kernel is restarted -- proving hidden state is real rather than describing it. You will make
  nbclient fail a broken notebook the way a test failure fails a build, with the offending cell named in the
  error. You will strip a notebook's outputs and show precisely which JSON field makes two runs of identical
  code disagree as committed text -- and it will not be the field most tutorials blame. You will inject a
  papermill-style parameters cell and execute two variants that differ only where they should. You will
  convert an executed notebook to Markdown with nbconvert and confirm the artifact carries its own prose and
  its own numbers. And you will demonstrate, with a real test suite, why logic anything else depends on
  belongs in an imported module rather than a cell -- because pytest can reach the module and, structurally,
  cannot reach the cell.
objectives:
  - 'State the day''s rule -- restart and run all, or it did not happen -- and explain what "it did not happen" means for a specific notebook'
  - 'Execute the same three cells in two different orders and produce two different, non-error answers, with execution_count as the only surviving evidence'
  - 'Read a scrambled execution_count sequence and say precisely what it proves and what a monotonic sequence does not prove'
  - 'Demonstrate hidden state directly: a cell deleted from a document that still succeeds in a live kernel and fails with NameError the moment the kernel restarts'
  - 'Use nbclient to fail a broken notebook the way a failing test fails a build, and read the cell the error names'
  - 'Explain why notebook outputs are painful in version control, and identify precisely which JSON field makes two runs of unchanged code differ -- not the field folklore usually blames'
  - 'Strip a notebook''s outputs and state the trade-off: a stripped notebook reviews cleanly and no longer shows its own results'
  - 'Inject a parameters cell in the papermill style and execute two variants that differ only where the injected values differ'
  - 'Convert an executed notebook to Markdown or a script with nbconvert, and choose which target fits a report versus a code review'
  - 'Draw the line between exploration in a notebook and logic that belongs in an imported, tested module, and prove the distinction with a real pytest run'
  - 'Apply Day 126''s determinism discipline -- seeds, pinned versions, a recorded environment -- inside a notebook, and show that a changed pin changes the record'
  - 'Choose among nbformat/nbclient/nbconvert, Jupyter Lab, papermill, Quarto and Google Colab for a given reproducibility job, stating plainly which were actually run in this lesson and which were described from documentation only'
prerequisites:
  - 'Day 126 -- the reproducible cleaning pipeline: idempotence, determinism, contracts and a manifest of hashes, all applied here to a document instead of to data'
  - 'Day 133 -- why nothing in this lesson''s dependency stack (nbformat, nbclient, nbconvert, ipykernel) is installed in the shared authoring environment, for the same reason pandas Styler was not: nothing that pulls in jinja2 is installed centrally'
  - 'Day 136 -- the exploratory data analysis process and its research log, referenced rather than re-derived: this day is about the artifact the process leaves behind, not the process itself'
  - 'Week 18''s pandas pipeline, for the kind of code that typically fills a notebook''s cells'
  - 'A working python3 (3.11 or newer) on your PATH; the lab needs its own virtual environment built from requirements/requirements.txt'
reading_time_minutes: 50
practical_time_minutes: 50
