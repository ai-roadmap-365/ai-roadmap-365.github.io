<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d139a-title d139a-desc">
  <title id="d139a-title">The notebook document and the kernel's live namespace, and the gap between them</title>
  <desc id="d139a-desc">A static diagram of a notebook document on the left holding three cells, and a kernel process on the right holding a live namespace of variables. A dashed link shows that a variable in the kernel was defined by a cell that no longer exists in the document.</desc>
  <style>
    .d139a-bg { fill: #f8fafc; }
    .d139a-panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d139a-panel-title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1a202c; }
    .d139a-cell { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d139a-cell-ghost { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .d139a-cell-text { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d139a-cell-label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #475569; }
    .d139a-var { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .d139a-var-orphan { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
    .d139a-var-text { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d139a-annot { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d139a-annot-warn { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #b91c1c; font-weight: 600; }
    .d139a-link { stroke: #c2410c; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
    .d139a-arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#d139a-arrowhead); }
    .d139a-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
  </style>
  <defs>
    <marker id="d139a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="d139a-arrowhead-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
    </marker>
  </defs>

  <rect class="d139a-bg" x="0" y="0" width="960" height="600" />

  <!-- Left panel: the document -->
  <rect class="d139a-panel" x="30" y="60" width="380" height="460" rx="10" />
  <text class="d139a-panel-title" x="50" y="92">Notebook document (.ipynb, JSON)</text>
  <text class="d139a-cell-label" x="50" y="112">what got saved to disk</text>

  <rect class="d139a-cell" x="50" y="130" width="340" height="66" rx="6" />
  <text class="d139a-cell-text" x="64" y="156">helper_value = 42</text>
  <text class="d139a-cell-label" x="64" y="176">Cell 1 -- defines helper_value</text>

  <rect class="d139a-cell-ghost" x="50" y="212" width="340" height="66" rx="6" />
  <line x1="64" y1="245" x2="270" y2="245" stroke="#b91c1c" stroke-width="2" />
  <text class="d139a-cell-text" x="64" y="238" fill="#7f1d1d">(this cell was deleted)</text>
  <text class="d139a-cell-label" x="64" y="266">was Cell 2 -- defined helper_value here</text>

  <rect class="d139a-cell" x="50" y="294" width="340" height="66" rx="6" />
  <text class="d139a-cell-text" x="64" y="320">total = helper_value + 8</text>
  <text class="d139a-cell-label" x="64" y="340">Cell 2 (was Cell 3) -- uses helper_value</text>

  <text class="d139a-annot" x="50" y="404" width="340">The document is a list of cells.</text>
  <text class="d139a-annot" x="50" y="426">Nothing in it says what the kernel</text>
  <text class="d139a-annot" x="50" y="448">currently remembers -- only what</text>
  <text class="d139a-annot" x="50" y="470">code was written and, if it was run,</text>
  <text class="d139a-annot" x="50" y="492">what output that run produced.</text>

  <!-- Right panel: the kernel -->
  <rect class="d139a-panel" x="550" y="60" width="380" height="460" rx="10" />
  <text class="d139a-panel-title" x="570" y="92">Kernel process (live namespace)</text>
  <text class="d139a-cell-label" x="570" y="112">what the running Python actually holds</text>

  <rect class="d139a-var" x="570" y="130" width="340" height="50" rx="6" />
  <text class="d139a-var-text" x="584" y="160">x = 100</text>

  <rect class="d139a-var-orphan" x="570" y="196" width="340" height="50" rx="6" />
  <text class="d139a-var-text" x="584" y="226">helper_value = 42</text>

  <rect class="d139a-var" x="570" y="262" width="340" height="50" rx="6" />
  <text class="d139a-var-text" x="584" y="292">total = 50</text>

  <text class="d139a-annot-warn" x="570" y="344">helper_value still lives here.</text>
  <text class="d139a-annot" x="570" y="368">The kernel process was never restarted,</text>
  <text class="d139a-annot" x="570" y="390">so deleting its defining cell from the</text>
  <text class="d139a-annot" x="570" y="412">document changed nothing it remembers.</text>

  <!-- The gap, drawn explicitly -->
  <path class="d139a-link" d="M 390 245 C 460 245, 460 226, 570 226" marker-end="url(#d139a-arrowhead-warn)" />
  <text class="d139a-annot-warn" x="410" y="150">the gap</text>

  <!-- Bottom caption -->
  <rect class="d139a-panel" x="30" y="540" width="900" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
  <text class="d139a-caption" x="50" y="568">A notebook that "still works" while a cell is missing is telling you about the kernel, not about the document.</text>
</svg>
