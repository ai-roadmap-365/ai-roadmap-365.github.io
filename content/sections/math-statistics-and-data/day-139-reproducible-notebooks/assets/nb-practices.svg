<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Practices that fix it</title>
  <style>
    .nb-practices-bg   { fill: #f8fafc; }
    .nb-practices-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-practices-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-practices-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-practices-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-practices-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-practices-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-practices-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nb-practices-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nb-practices-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nb-practices-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nb-practices-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nb-practices-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nb-practices-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nb-practices-stage { opacity: 1; }

    .nb-practices-s0 { animation-delay: 0.00s; }
    .nb-practices-e0 { animation-delay: 0.00s; }
    .nb-practices-s1 { animation-delay: 1.28s; }
    .nb-practices-e1 { animation-delay: 1.28s; }
    .nb-practices-s2 { animation-delay: 2.56s; }
    .nb-practices-e2 { animation-delay: 2.56s; }
    .nb-practices-s3 { animation-delay: 3.84s; }
    .nb-practices-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nb-practices-conn  { animation: nb-practices-trace 6.4s ease-in-out infinite; }
      .nb-practices-stage { animation: nb-practices-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nb-practices-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nb-practices-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nb-practices-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nb-practices-stage { animation: nb-practices-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nb-practices-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nb-practices-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nb-practices-bg" width="980" height="322"/>
  <text class="nb-practices-h1"  x="30" y="40">Practices that fix it</text>
  <text class="nb-practices-sub" x="30" y="64">Four rules.</text>
  <g class="nb-practices-stage nb-practices-s0">
    <rect class="nb-practices-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nb-practices-step" x="44" y="142">01</text>
    <text class="nb-practices-name" x="70" y="142">Restart and run all, before sharing anything</text>
    <text class="nb-practices-desc" x="44" y="166">Every time.</text>
  </g>
  <line class="nb-practices-line nb-practices-conn nb-practices-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nb-practices-tip)"/>
  <g class="nb-practices-stage nb-practices-s1">
    <rect class="nb-practices-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nb-practices-step" x="280" y="142">02</text>
    <text class="nb-practices-name" x="306" y="142">Move stable code into modules and import it</text>
    <text class="nb-practices-desc" x="280" y="166">Leaving narrative in the</text>
    <text class="nb-practices-desc" x="280" y="182">notebook.</text>
  </g>
  <line class="nb-practices-line nb-practices-conn nb-practices-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nb-practices-tip)"/>
  <g class="nb-practices-stage nb-practices-s2">
    <rect class="nb-practices-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nb-practices-step" x="516" y="142">03</text>
    <text class="nb-practices-name" x="542" y="142">Use paths relative to the project root</text>
    <text class="nb-practices-desc" x="516" y="166">Resolved from one place.</text>
  </g>
  <line class="nb-practices-line nb-practices-conn nb-practices-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nb-practices-tip)"/>
  <g class="nb-practices-stage nb-practices-s3">
    <rect class="nb-practices-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nb-practices-step" x="752" y="142">04</text>
    <text class="nb-practices-name" x="778" y="142">And commit the notebook with outputs cleared</text>
    <text class="nb-practices-desc" x="752" y="166">Or use a text-friendly format.</text>
  </g>
  <text class="nb-practices-sub" x="30" y="304">Extracting stable code into modules is the practice with the largest payoff, because it makes that code testable and reusable outside the notebook entirely.</text>
</svg>
