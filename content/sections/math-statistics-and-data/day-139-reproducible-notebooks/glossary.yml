terms:
  - term: Kernel
    definition: >-
      The running process that actually executes a notebook's code. A kernel has its own persistent
      namespace -- every variable any cell has ever defined stays alive in it until the kernel is restarted
      or shut down, regardless of what the notebook document itself currently contains.
  - term: execution_count
    definition: >-
      The integer nbformat stores on every executed code cell, recording the order in which the kernel
      processed it -- not the order the cell sits in the document. A monotonically increasing sequence
      (1, 2, 3, ...) top to bottom is what a notebook run cleanly from a fresh kernel produces; any other
      sequence is direct evidence the cells were run out of document order.
  - term: Hidden state
    definition: >-
      A value a kernel remembers that no cell currently in the document defines. It arises when a cell that
      once defined a variable is deleted (or edited to remove that definition) without restarting the
      kernel, so cells that depend on the value keep working for whoever is still in that session and fail
      for anyone who opens the notebook fresh.
  - term: Restart and run all
    definition: >-
      The one operation that actually proves a notebook works: discard the current kernel, start a
      completely new one with an empty namespace, and execute every cell top to bottom in document order.
      Any claim a notebook makes without having survived this is unverified, however plausible its displayed
      outputs look.
  - term: nbformat
    definition: >-
      The Python library and JSON schema that define what a .ipynb file actually is: a list of cells, each
      with a source, a cell type, and -- for code cells -- an execution_count and a list of outputs.
      Building a notebook with nbformat produces the identical structure Jupyter itself would save.
  - term: nbclient
    definition: >-
      The library that executes a notebook against a real Jupyter kernel without opening any user interface.
      It is what nbconvert's --execute flag and Jupyter's own "Run All" ultimately call, and it is the
      library this lesson uses to turn "does this notebook still work" into an assertion a test suite can
      make.
  - term: CellExecutionError
    definition: >-
      The exception nbclient raises when a cell's execution fails during an nbclient run. It carries the
      original exception's name and message (.ename, .evalue) and names the failing cell's execution
      position in its string representation, which is what lets a CI log point directly at the broken cell.
  - term: nbconvert
    definition: >-
      The library and command-line tool that converts an executed notebook into another format: Markdown or
      HTML for a report, or a plain .py script for code review. Conversion reads the notebook's stored
      outputs; it does not re-execute cells unless told to with its own --execute flag.
  - term: Output stripping
    definition: >-
      Clearing a notebook's outputs, execution_count and per-cell execution timestamps before it is
      committed to version control, typically via an nbstripout-style pre-commit hook. It removes the noisy
      part of a notebook's diff at the cost of removing the evidence the notebook was ever actually run.
  - term: Parameters cell
    definition: >-
      A cell tagged "parameters" (by convention, in the cell's metadata) that holds a notebook's default
      inputs. A parameterisation tool such as papermill locates this cell and inserts a new
      "injected-parameters" cell immediately after it for each run, overriding the defaults without editing
      the original cell.
  - term: Papermill
    definition: >-
      A tool that executes a parameterised notebook from the command line or a script, producing one output
      notebook per set of parameter values. This lesson describes and reproduces its parameter-injection
      mechanism from documentation; papermill itself is not installed or run in this lesson's lab.
  - term: Quarto
    definition: >-
      A publishing system, successor to R Markdown, that renders notebooks and plain-text documents with
      embedded code into reports, books, slides and websites across multiple languages. Free and open
      source; described from documentation only in this lesson, not run.
  - term: cell.metadata.execution
    definition: >-
      The dictionary nbclient writes into a code cell's metadata on every execution, holding four wall-clock
      ISO-8601 timestamps (iopub.status.busy, iopub.execute_input, shell.execute_reply, iopub.status.idle).
      Measured directly in this lesson's lab, this field -- not execution_count -- is what makes two runs of
      identical, deterministic code differ as committed JSON.
  - term: Notebook/module split
    definition: >-
      The discipline of keeping exploration in a notebook's cells while moving any logic other code depends
      on into an imported, separately tested module. A notebook cell is structurally unreachable by Python's
      import system -- pytest can test a module directly and cannot reach a cell, with or without a kernel
      running.
  - term: Environment record
    definition: >-
      A cell (or a companion file) that captures the interpreter version and the exact versions of the
      packages a notebook depends on at the moment it ran -- Day 126's reproducibility manifest applied
      inside a notebook, so a reader can tell whether a changed answer came from changed code or a changed
      environment.
