questions:
  - question: >-
      A three-cell notebook is executed in the order setup, then report, then transform -- the report cell
      is never re-run after the transform. The notebook displays a plain number in the report cell with no
      error. What is the strongest true statement about that displayed number?
    options:
      - 'It is definitely wrong, because out-of-order execution always produces an error'
      - 'It cannot be trusted without checking execution_count or re-running from a clean kernel, because it may have been computed before a later cell changed the value it depends on'
      - 'It is correct, because Jupyter always recomputes downstream cells automatically when an upstream cell changes'
      - 'It is correct as long as no cell was deleted'
    answer_index: 1
    explanation: >-
      Jupyter never recomputes downstream cells automatically -- that is exactly the gap this lesson exploits.
      A cell's displayed output is frozen at whatever it computed the last time it ran, regardless of what
      other cells did afterward. The measured example in this lesson executes cleanly (no error) and still
      displays 50.0 where a clean top-to-bottom run gives 30.0.
  - question: >-
      A notebook's execution_count sequence, read top to bottom, is [1, 3, 2]. What does that prove?
    options:
      - 'Nothing -- execution_count is cosmetic and carries no information'
      - 'The notebook has an error somewhere'
      - 'The notebook was executed exactly twice'
      - 'The cells were executed in a different order than they appear in the document, specifically: cell 1 first, then the third-position cell, then the second-position cell'
    answer_index: 3
    explanation: >-
      execution_count records the order the kernel actually processed each cell, not the order it happens to
      sit in the document. [1, 3, 2] means: first-position cell ran first, third-position cell ran second,
      second-position cell ran third -- a non-monotonic sequence is the one reliable signature of out-of-order
      execution, whether or not any cell raised an error.
  - question: >-
      A cell that defines `helper_value = 42` is deleted from a notebook. A remaining cell that uses
      `helper_value` still runs successfully. What does that tell you?
    options:
      - 'The kernel process behind the notebook was never restarted, and its live namespace still holds helper_value even though no cell in the document defines it anymore'
      - 'Jupyter reconstructed the deleted cell automatically'
      - 'The remaining cell must not actually reference helper_value'
      - 'helper_value must be a built-in Python name'
    answer_index: 0
    explanation: >-
      A kernel is a running Python process with its own persistent namespace. Deleting a cell only removes
      text from the document; it does not touch anything the kernel already executed. The same one-cell
      notebook run in a brand-new kernel raises NameError immediately, because the document, on its own,
      never defines helper_value.
  - question: >-
      Why does nbclient's execute() raising CellExecutionError on a broken notebook matter for CI, beyond
      just being able to detect an error?
    options:
      - 'It does not matter -- any exception anywhere would do the same job'
      - 'It only matters for notebooks that produce plots'
      - 'It turns "does this notebook still work?" into a question a build pipeline can ask automatically, and the exception names the specific cell that failed rather than requiring someone to open the notebook and hunt'
      - 'It replaces the need to ever restart a kernel manually'
    answer_index: 2
    explanation: >-
      Before execution-as-a-test, "does this notebook still work" required a person to open it, click Restart
      & Run All, and read every cell. nbclient does the same thing headlessly and, when a cell fails, raises
      an exception whose message names the cell's execution position and quotes its source -- exactly the
      information a CI log needs to point someone at the fix.
  - question: >-
      Two independent, fresh-kernel executions of the exact same notebook code are compared as committed
      JSON. Measured directly in this lesson's lab, what turned out to make them differ?
    options:
      - 'The execution_count values, because every fresh run starts counting from a different number'
      - 'Nothing -- two runs of identical code always produce byte-identical notebooks'
      - 'The cell ids, which nbformat regenerates randomly on every execution'
      - "Each cell's metadata.execution field -- four wall-clock timestamps nbclient stamps on every run -- while execution_count and the output data were identical between the two runs"
    answer_index: 3
    explanation: >-
      A common assumption is that execution_count is the noisy field. Measured directly: two fresh-kernel runs
      of the same deterministic code both start counting at 1, so execution_count matched exactly. What
      differed was cell.metadata.execution -- the iopub.status.busy, iopub.execute_input, shell.execute_reply
      and iopub.status.idle timestamps nbclient injects on every execution, which are wall-clock and therefore
      never identical between two runs.
  - question: >-
      An nbstripout-style hook strips outputs before every commit. What is the honest trade-off this lesson
      names for that practice?
    options:
      - 'Stripping outputs makes a notebook execute faster'
      - 'A stripped notebook reviews cleanly in version control (no image-blob or metadata diffs), but it no longer shows its own results -- a reviewer has to re-run it to see what it actually produced'
      - 'There is no trade-off -- stripping outputs is strictly an improvement'
      - 'Stripping outputs is required before nbconvert can process a notebook'
    answer_index: 1
    explanation: >-
      Committing outputs makes a notebook a self-contained record of what it produced, at the cost of noisy,
      often opaque diffs (image blobs, per-run metadata). Stripping outputs makes the diff meaningful again but
      turns the committed file into source code with no evidence attached -- a real trade-off, not a free
      improvement, and the right choice depends on whether the repository or a separate report is meant to
      carry the evidence.
  - question: >-
      In papermill's parameterisation model, what actually happens to a notebook's tagged "parameters" cell
      when a variant is run with different values?
    options:
      - 'Every cell in the notebook is rewritten to hard-code the new values'
      - 'The parameters cell is deleted and replaced by a command-line argument'
      - 'The parameters cell is rewritten in place with the new values'
      - 'The parameters cell is left untouched, and a new cell tagged "injected-parameters" is inserted immediately after it, overriding the defaults for that run'
    answer_index: 3
    explanation: >-
      Papermill never edits the tagged parameters cell -- it appends a new cell right after it carrying the
      run's actual values, which is why the original defaults stay visible in every executed variant even
      though the variant behaves according to the injected values. This lesson reproduces that exact mechanism
      by hand with nbformat, since papermill itself is not installed or run here.
  - question: >-
      Why, in this lesson's own account, does averaging logic belong in an imported module rather than
      staying inline in a notebook cell -- beyond general tidiness?
    options:
      - 'Because nbconvert refuses to convert notebooks containing function definitions'
      - 'Because cells execute more slowly than module-level code'
      - 'Because notebooks cannot contain function definitions'
      - "Because pytest can import and test a module directly, while a .ipynb cell is structurally unreachable by Python's import system -- importing a name that only ever existed inside a cell raises ModuleNotFoundError"
    answer_index: 3
    explanation: >-
      The distinction proven directly in the lab: calc.clean_mean, defined in a module, is covered by an
      ordinary pytest test file with no kernel involved. The identical logic inlined into a notebook cell runs
      fine inside a kernel, but importlib.import_module raises ModuleNotFoundError for any name that only ever
      existed as text inside that cell -- pytest cannot reach it, with or without a kernel running.
