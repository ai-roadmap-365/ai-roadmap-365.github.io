visuals:
  - id: notebook-state-architecture
    file: assets/notebook-state-architecture.svg
    type: diagram
    title: >-
      The notebook document and the kernel's live namespace, drawn side by side, with a deleted cell's
      variable still sitting in the kernel
    alt: >-
      Diagram: on the left, a panel labelled the notebook document holding two visible code cells -- one
      defining helper_value, one using it -- and a ghost dashed cell in between marked as deleted. On the
      right, a panel labelled the kernel process holding a live namespace of three variables: x, helper_value
      and total, with helper_value drawn in a distinct orange box. A dashed orange line connects the deleted
      cell on the left to the helper_value box on the right, labelled the gap, showing that the kernel still
      holds a value whose defining cell no longer exists in the document. A bottom caption states that a
      notebook which still works while a cell is missing is telling you about the kernel, not about the
      document
    description: >-
      A static architecture diagram in two panels. The left panel, "Notebook document (.ipynb, JSON)", shows
      three stacked cell boxes: a normal cell defining helper_value, a dashed red ghost cell marked "(this
      cell was deleted)", and a normal cell that uses helper_value. The right panel, "Kernel process (live
      namespace)", shows three stacked variable boxes: x = 100, helper_value = 42 (drawn in a distinct orange
      "orphan" style), and total = 50. A dashed orange link runs from the deleted cell's position on the left
      to the helper_value box on the right, labelled "the gap", with an annotation explaining the kernel
      process was never restarted so deleting the defining cell from the document changed nothing the kernel
      remembers. A bottom banner states the diagram's point in one sentence.
  - id: execution-order-flow
    file: assets/execution-order-flow.svg
    type: flow-animated
    title: >-
      Three cells run in the order an analyst actually clicked them, producing a wrong answer with no error,
      followed by a restart that renumbers everything and produces the right one
    alt: >-
      Diagram: two stacked panels showing the same three cells, setup, transform and report. In the top
      panel, titled as actually run, the cells are visited in the order setup, report, transform, and each
      carries an execution count badge showing 1, 2 and 3 attached out of position, so the sequence read left
      to right is 1, 3, 2. A final orange box shows the answer 50.0. Below it, a restart and run all arrow
      points down to a bottom panel, titled after a restart, where the same three cells are visited in their
      normal document order, badges 1, 2 and 3 appear in position, and a final green box shows the answer
      30.0. A dashed wire with marching dashes and a travelling dot trace the click path through each panel,
      and each cell briefly thickens its border in the order it was run. A caption states that with motion
      off every cell, badge and answer already sits in its final position and the animation only shows the
      click order
    description: >-
      An animated flow diagram, fully readable as a still image. Two horizontal panels, each showing three
      labelled cell boxes (setup, transform, report) connected by a dashed wire with marching ants and a
      travelling token that follows the actual click path rather than the document's left-to-right layout.
      In the top panel the click path visits setup, then report, then transform, so the execution-count
      badges read 1, 3, 2 along the wire and the two badges on report and transform are drawn in a warning
      red; the final answer box (orange) reads 50.0. A "Restart & Run All" label with a downward arrow
      separates the panels. In the bottom panel the click path matches document order exactly, badges read
      1, 2, 3 in blue, and the final answer box (green) reads 30.0. Each cell's border briefly thickens in
      the order it is visited, staggered across a six-second loop split between the two panels. A
      prefers-reduced-motion block disables the marching dashes, freezes both travelling tokens at the end of
      their paths, and holds every cell border at its resting width, while every label, badge and answer
      value remains fully drawn and fully legible.
