id: D135
day: 135
slug: from-api-to-dataframe
title: 'From API to DataFrame'
section: math-statistics-and-data
subsection: data-analysis
week: 20
learning_promise: >-
  After this lesson you will be able to turn a paginated, nested JSON API response into a DataFrame you
  actually trust. You will flatten the same nested payload two different ways with `pandas.json_normalize` --
  one row per parent and one row per child -- and prove with real numbers that the wrong choice silently
  inflates a customer-level total by duplicating it once per child record. You will use `record_path` and
  `meta` correctly, state exactly which columns `meta` duplicates and by how much, and contrast that with
  `DataFrame.explode`, which keeps a row for an empty list where `record_path` drops one -- measured directly
  on pandas 3.0.5. You will pin dtypes on a frame where every value arrived as a JSON string, a bare number,
  or `None`, and count how many values you actually coerced. You will detect schema drift across paginated
  responses -- a field introduced partway through a run -- and name both the field and the page it first
  appeared on rather than discovering it later as an inexplicable column of nulls. You will persist raw API
  responses to JSONL before transforming them, and prove a replay from that raw copy touches the network zero
  times. You will build an idempotent ingestion step keyed on a natural key, and prove that running it twice
  leaves the frame byte-for-byte unchanged. You will write a contract on the assembled frame that raises and
  names the exact rule a corrupted payload breaks. And you will fetch incrementally by a watermark, choosing
  the inclusive boundary on purpose and explaining precisely why a harmless duplicate beats a silently
  dropped record.
objectives:
  - 'Flatten a nested JSON payload two different ways with pandas.json_normalize -- customer grain and order grain -- and state which question each grain answers correctly'
  - 'Use record_path and meta together, and state exactly which columns meta duplicates and by how much'
  - 'Use DataFrame.explode on a nested list column, and state precisely how it treats an empty list differently from record_path -- as measured on pandas 3.0.5'
  - 'Pin dtypes on a frame that arrived from JSON, where numbers are strings, dates are strings, and a field absent from some records becomes an all-NaN column rather than an error'
  - 'Detect schema drift across paginated API responses and name both the field and the first page it appeared on'
  - 'Persist raw API responses before transforming them, and prove that a replay from that raw copy touches the network zero times'
  - 'Build an idempotent ingestion step with a natural key and an upsert, and prove that running it twice leaves the frame unchanged'
  - 'Write a contract on an assembled frame -- columns, dtypes, key uniqueness, row-count bounds -- that raises and names the exact rule a corrupted payload breaks'
  - 'Fetch incrementally by a watermark, and explain which side of the boundary off-by-one to choose and why'
  - 'Say precisely what pandas.read_json can and cannot do with a nested payload, and what a pydantic model would validate that a DataFrame contract does not'
prerequisites:
  - 'Day 134 -- finding data, open datasets and APIs, pagination, rate limits and licences; this lesson assumes a page and a cursor already exist'
  - 'Day 121 -- loading and inspecting data, and its dtype-pinning discipline, applied here to JSON''s extra wrinkle of an absent (not merely empty) field'
  - 'Day 126 -- the reproducible cleaning pipeline: contracts, a manifest, and the raw-then-transform discipline this lesson applies to ingestion rather than cleaning'
  - 'Course01 Days 22-28 -- HTTP fundamentals: status codes, urllib.request, and reading a response body as JSON'
  - 'A working python3 on your PATH; the lab needs the standard library plus pandas and pytest'
reading_time_minutes: 45
