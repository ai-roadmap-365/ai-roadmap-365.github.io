<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-labelledby="d135aTitleId d135aDescId">
  <title id="d135aTitleId">A nested JSON tree flattened two ways: one row per customer versus one row per order, with the duplicated cells shaded</title>
  <desc id="d135aDescId">On the left, a JSON tree: three customers, each with a name, a total_amount_due, and a list of orders. On the right, two rectangles. The top rectangle is the customer-grain table, three rows, one per customer, with total_amount_due appearing once each and summing to the true total of 1550. The bottom rectangle is the order-grain table, six rows, one per order, with total_amount_due repeated once per order and shaded wherever it repeats; it sums to an inflated 2650, an overcount of 1100.</desc>

  <style>
    .d135a-bg     { fill: #f8fafc; }
    .d135a-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 600; fill: #1a202c; }
    .d135a-h2     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d135a-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d135a-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d135a-mono   { font-family: "SF Mono", "Menlo", monospace; font-size: 13px; fill: #1a202c; }
    .d135a-tree-node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d135a-tree-leaf { fill: #eef2ff; stroke: #94a3b8; stroke-width: 1.2; }
    .d135a-tree-line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .d135a-panel  { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d135a-cell   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .d135a-dup    { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.3; }
    .d135a-head   { fill: #e0e7ff; stroke: #94a3b8; stroke-width: 1; }
  </style>

  <rect class="d135a-bg" x="0" y="0" width="1040" height="640" />
  <text class="d135a-title" x="30" y="38">JSON is a tree. A DataFrame is a rectangle. Flattening chooses which grain wins.</text>

  <!-- Left: JSON tree -->
  <text class="d135a-h2" x="30" y="70">The nested payload (3 customers)</text>
  <rect class="d135a-tree-node" x="30" y="86" width="150" height="34" rx="6" />
  <text class="d135a-label" x="105" y="108" text-anchor="middle">customers[]</text>

  <path class="d135a-tree-line" d="M 105 120 L 105 140 L 105 150" />
  <path class="d135a-tree-line" d="M 105 140 L 250 140 L 250 150" />
  <path class="d135a-tree-line" d="M 105 140 L 30 140 L 30 150" />

  <!-- C1 node -->
  <rect class="d135a-tree-node" x="10" y="150" width="150" height="30" rx="6" />
  <text class="d135a-small" x="85" y="170" text-anchor="middle">C1 Ada Lovelace</text>
  <path class="d135a-tree-line" d="M 85 180 L 85 196" />
  <rect class="d135a-tree-leaf" x="10" y="196" width="150" height="26" rx="5" />
  <text class="d135a-mono" x="85" y="214" text-anchor="middle" font-size="12">total_amount_due: 500</text>
  <path class="d135a-tree-line" d="M 85 222 L 85 236" />
  <rect class="d135a-tree-node" x="10" y="236" width="150" height="26" rx="5" />
  <text class="d135a-small" x="85" y="254" text-anchor="middle">orders: [O1, O2]</text>

  <!-- C2 node -->
  <rect class="d135a-tree-node" x="175" y="150" width="150" height="30" rx="6" />
  <text class="d135a-small" x="250" y="170" text-anchor="middle">C2 Grace Hopper</text>
  <path class="d135a-tree-line" d="M 250 180 L 250 196" />
  <rect class="d135a-tree-leaf" x="175" y="196" width="150" height="26" rx="5" />
  <text class="d135a-mono" x="250" y="214" text-anchor="middle" font-size="12">total_amount_due: 750</text>
  <path class="d135a-tree-line" d="M 250 222 L 250 236" />
  <rect class="d135a-tree-node" x="175" y="236" width="150" height="26" rx="5" />
  <text class="d135a-small" x="250" y="254" text-anchor="middle">orders: [O3]</text>

  <!-- C3 node -->
  <path class="d135a-tree-line" d="M 105 140 L 415 140 L 415 150" />
  <rect class="d135a-tree-node" x="340" y="150" width="150" height="30" rx="6" />
  <text class="d135a-small" x="415" y="170" text-anchor="middle">C3 Alan Turing</text>
  <path class="d135a-tree-line" d="M 415 180 L 415 196" />
  <rect class="d135a-tree-leaf" x="340" y="196" width="150" height="26" rx="5" />
  <text class="d135a-mono" x="415" y="214" text-anchor="middle" font-size="12">total_amount_due: 300</text>
  <path class="d135a-tree-line" d="M 415 222 L 415 236" />
  <rect class="d135a-tree-node" x="340" y="236" width="150" height="26" rx="5" />
  <text class="d135a-small" x="415" y="254" text-anchor="middle">orders: [O4, O5, O6]</text>

  <text class="d135a-small" x="30" y="300">One tree. Two legitimate ways to flatten it into a rectangle -- and only one</text>
  <text class="d135a-small" x="30" y="318">answers a customer-level question correctly.</text>

  <!-- Right top: customer grain -->
  <text class="d135a-h2" x="540" y="70">Customer grain -- json_normalize(customers)</text>
  <rect class="d135a-panel" x="540" y="82" width="470" height="120" rx="8" />
  <rect class="d135a-head" x="550" y="92" width="150" height="24" />
  <text class="d135a-small" x="558" y="109">customer_id</text>
  <rect class="d135a-head" x="700" y="92" width="150" height="24" />
  <text class="d135a-small" x="708" y="109">name</text>
  <rect class="d135a-head" x="850" y="92" width="150" height="24" />
  <text class="d135a-small" x="858" y="109">total_amount_due</text>

  <rect class="d135a-cell" x="550" y="116" width="150" height="26" /><text class="d135a-small" x="558" y="134">C1</text>
  <rect class="d135a-cell" x="700" y="116" width="150" height="26" /><text class="d135a-small" x="708" y="134">Ada Lovelace</text>
  <rect class="d135a-cell" x="850" y="116" width="150" height="26" /><text class="d135a-small" x="858" y="134">500</text>

  <rect class="d135a-cell" x="550" y="142" width="150" height="26" /><text class="d135a-small" x="558" y="160">C2</text>
  <rect class="d135a-cell" x="700" y="142" width="150" height="26" /><text class="d135a-small" x="708" y="160">Grace Hopper</text>
  <rect class="d135a-cell" x="850" y="142" width="150" height="26" /><text class="d135a-small" x="858" y="160">750</text>

  <rect class="d135a-cell" x="550" y="168" width="150" height="26" /><text class="d135a-small" x="558" y="186">C3</text>
  <rect class="d135a-cell" x="700" y="168" width="150" height="26" /><text class="d135a-small" x="708" y="186">Alan Turing</text>
  <rect class="d135a-cell" x="850" y="168" width="150" height="26" /><text class="d135a-small" x="858" y="186">300</text>

  <text class="d135a-label" x="550" y="222">3 rows. sum(total_amount_due) = 1550 -- the true total.</text>

  <!-- Right bottom: order grain -->
  <text class="d135a-h2" x="540" y="260">Order grain -- json_normalize(customers, record_path="orders", meta=[...])</text>
  <rect class="d135a-panel" x="540" y="272" width="470" height="220" rx="8" />
  <rect class="d135a-head" x="550" y="282" width="90" height="22" /><text class="d135a-small" x="556" y="298" font-size="12">order_id</text>
  <rect class="d135a-head" x="640" y="282" width="120" height="22" /><text class="d135a-small" x="646" y="298" font-size="12">customer_id</text>
  <rect class="d135a-head" x="760" y="282" width="120" height="22" /><text class="d135a-small" x="766" y="298" font-size="12">name</text>
  <rect class="d135a-head" x="880" y="282" width="120" height="22" /><text class="d135a-small" x="886" y="298" font-size="12">total_amount_due</text>

  <!-- O1, O2 -> C1 duplicated -->
  <rect class="d135a-cell" x="550" y="304" width="90" height="24" /><text class="d135a-small" x="556" y="321" font-size="12">O1</text>
  <rect class="d135a-cell" x="640" y="304" width="120" height="24" /><text class="d135a-small" x="646" y="321" font-size="12">C1</text>
  <rect class="d135a-cell" x="760" y="304" width="120" height="24" /><text class="d135a-small" x="766" y="321" font-size="12">Ada Lovelace</text>
  <rect class="d135a-dup"  x="880" y="304" width="120" height="24" /><text class="d135a-small" x="886" y="321" font-size="12">500</text>

  <rect class="d135a-cell" x="550" y="328" width="90" height="24" /><text class="d135a-small" x="556" y="345" font-size="12">O2</text>
  <rect class="d135a-cell" x="640" y="328" width="120" height="24" /><text class="d135a-small" x="646" y="345" font-size="12">C1</text>
  <rect class="d135a-cell" x="760" y="328" width="120" height="24" /><text class="d135a-small" x="766" y="345" font-size="12">Ada Lovelace</text>
  <rect class="d135a-dup"  x="880" y="328" width="120" height="24" /><text class="d135a-small" x="886" y="345" font-size="12">500 (again)</text>

  <!-- O3 -> C2 not duplicated -->
  <rect class="d135a-cell" x="550" y="352" width="90" height="24" /><text class="d135a-small" x="556" y="369" font-size="12">O3</text>
  <rect class="d135a-cell" x="640" y="352" width="120" height="24" /><text class="d135a-small" x="646" y="369" font-size="12">C2</text>
  <rect class="d135a-cell" x="760" y="352" width="120" height="24" /><text class="d135a-small" x="766" y="369" font-size="12">Grace Hopper</text>
  <rect class="d135a-cell" x="880" y="352" width="120" height="24" /><text class="d135a-small" x="886" y="369" font-size="12">750</text>

  <!-- O4, O5, O6 -> C3 duplicated x3 -->
  <rect class="d135a-cell" x="550" y="376" width="90" height="24" /><text class="d135a-small" x="556" y="393" font-size="12">O4</text>
  <rect class="d135a-cell" x="640" y="376" width="120" height="24" /><text class="d135a-small" x="646" y="393" font-size="12">C3</text>
  <rect class="d135a-cell" x="760" y="376" width="120" height="24" /><text class="d135a-small" x="766" y="393" font-size="12">Alan Turing</text>
  <rect class="d135a-dup"  x="880" y="376" width="120" height="24" /><text class="d135a-small" x="886" y="393" font-size="12">300 (again)</text>

  <rect class="d135a-cell" x="550" y="400" width="90" height="24" /><text class="d135a-small" x="556" y="417" font-size="12">O5</text>
  <rect class="d135a-cell" x="640" y="400" width="120" height="24" /><text class="d135a-small" x="646" y="417" font-size="12">C3</text>
  <rect class="d135a-cell" x="760" y="400" width="120" height="24" /><text class="d135a-small" x="766" y="417" font-size="12">Alan Turing</text>
  <rect class="d135a-dup"  x="880" y="400" width="120" height="24" /><text class="d135a-small" x="886" y="417" font-size="12">300 (again)</text>

  <rect class="d135a-cell" x="550" y="424" width="90" height="24" /><text class="d135a-small" x="556" y="441" font-size="12">O6</text>
  <rect class="d135a-cell" x="640" y="424" width="120" height="24" /><text class="d135a-small" x="646" y="441" font-size="12">C3</text>
  <rect class="d135a-cell" x="760" y="424" width="120" height="24" /><text class="d135a-small" x="766" y="441" font-size="12">Alan Turing</text>
  <rect class="d135a-dup"  x="880" y="424" width="120" height="24" /><text class="d135a-small" x="886" y="441" font-size="12">300 (again)</text>

  <text class="d135a-label" x="550" y="472">6 rows. sum(total_amount_due) = 2650 -- inflated by 1100 over the shaded cells.</text>
  <text class="d135a-small" x="550" y="490">Shaded cells: total_amount_due repeated once per order, because meta carries it down by design.</text>

  <text class="d135a-h2" x="30" y="540">The rule</text>
  <text class="d135a-label" x="30" y="566">Decide what one row means before you flatten, and assert it afterwards.</text>
  <text class="d135a-small" x="30" y="588">Both flattenings above are correct pandas behaviour. Only one answers "how much does each</text>
  <text class="d135a-small" x="30" y="606">customer owe" -- and pandas has no way to know which one you meant.</text>
</svg>
