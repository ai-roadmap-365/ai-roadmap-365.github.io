terms:
  - term: grain
    definition: >-
      What one row in a table means. A customer-grain table has exactly one row per customer; an
      order-grain table has one row per order. Neither is more correct in general -- they answer different
      questions -- but choosing the wrong grain for a given question produces a number that is silently
      wrong rather than an error, which is why deciding the grain before flattening is this lesson's core
      discipline.
  - term: the grain trap
    definition: >-
      The specific failure of flattening a nested payload to a finer grain than a question needs, and then
      aggregating a field that belongs to the coarser grain. On this lesson's example, summing
      total_amount_due on an order-grain frame (six rows) counts a two-order customer's balance twice,
      inflating a true total of 1550.0 to 2650.0.
  - term: pandas.json_normalize
    definition: >-
      A pandas function that flattens nested JSON (a list of dicts, possibly with nested lists and dicts)
      into a DataFrame. Called with no record_path, it produces one row per top-level record, leaving
      nested lists untouched inside each cell. Called with record_path, it produces one row per element of
      the named nested list instead.
  - term: record_path
    definition: >-
      The json_normalize argument that names which nested list becomes the new row grain. Passing
      record_path="orders" tells json_normalize to produce one row per order rather than one row per
      customer. A customer whose orders list is empty contributes zero rows when record_path targets that
      list.
  - term: meta
    definition: >-
      The json_normalize argument, used together with record_path, that names parent-level fields to carry
      down onto every child row. meta columns are duplicated once per child record by design -- that
      duplication is what makes the child-grain frame usable, and it is also exactly what makes summing a
      meta column produce an inflated total.
  - term: DataFrame.explode
    definition: >-
      A pandas method that turns a single row whose column holds a list-like value into one row per list
      element, leaving every other column's value repeated across the new rows. Unlike record_path, explode
      applied to a row whose list is empty keeps one row with NaN rather than dropping the row -- a
      difference measured directly on pandas 3.0.5 and worth knowing before relying on either.
  - term: untyped arrival
    definition: >-
      The fact that every value decoded from a JSON API response is, until explicitly parsed, one of JSON's
      six native types -- and numeric-looking or date-looking values are frequently serialized as plain
      strings by the API on purpose, to avoid floating-point precision loss on the wire. A DataFrame built
      directly from such a response inherits that string-ness until dtypes are pinned.
  - term: dtype pinning
    definition: >-
      Explicitly converting a column to its intended type -- numeric, datetime, categorical -- rather than
      trusting whatever pandas inferred on load. For ingested JSON, pinning must tolerate a column that is
      entirely absent from some records, which becomes a fully-NaN column once the frame is assembled
      rather than raising an error.
  - term: schema drift
    definition: >-
      A field that is absent from earlier pages of a paginated API response and present on later ones (or
      the reverse). Assembling the pages with a plain concatenation produces a column that is silently NaN
      for the earlier rows, with no error or warning, because pandas aligns columns by name and backfills
      the rest. A deliberate detector names the field and the first page it appeared on.
  - term: raw-then-transform
    definition: >-
      The discipline of persisting every raw API response (as JSONL or Parquet) before running any parsing
      or flattening logic on it. A bug found later in the transformation step can be fixed and re-run
      against the stored raw copy, touching the network zero additional times, rather than requiring the
      API to be re-fetched.
  - term: idempotent ingestion
    definition: >-
      An ingestion step that produces the same result whether it runs once or is accidentally run twice
      with the same input -- typically achieved with a natural key (an identifier that names the same
      real-world entity across runs) and an upsert that replaces, rather than appends, any row sharing that
      key.
  - term: upsert
    definition: >-
      A merge operation that inserts a new row for a key not already present, and replaces the existing row
      for a key that is already present, rather than appending a duplicate. The mechanism this lesson uses
      to make ingestion idempotent.
  - term: contract (on a DataFrame)
    definition: >-
      A set of checks -- required columns present, key column unique, columns holding the expected dtype,
      row count within an expected range -- run against an assembled frame before anything downstream
      trusts it, raising an exception that names the specific rule broken rather than a generic error.
  - term: watermark
    definition: >-
      The timestamp (or other ordering value, such as a cursor) of the most recently seen record in an
      incremental fetch, used as the lower bound for the next fetch so that only new or updated records are
      requested rather than the entire dataset every time.
  - term: inclusive vs. exclusive boundary
    definition: >-
      The choice of whether an incremental fetch's "since" filter includes records exactly at the watermark
      timestamp (inclusive, >=) or excludes them (exclusive, >). Exclusive risks silently and permanently
      dropping a record that shares a timestamp with the watermark record; inclusive risks only a harmless
      duplicate that an idempotent upsert absorbs for free -- which is why this lesson chooses inclusive.
  - term: pandas.read_json
    definition: >-
      A pandas function that reads JSON directly into a DataFrame, appropriate when the source JSON is
      already close to tabular. Pointed at a genuinely nested payload, it does not flatten nested
      structures and does not raise an error either -- it leaves them as raw Python objects inside each
      cell, which is why this lesson calls it too blunt for the customers-with-orders shape it is built
      around.
