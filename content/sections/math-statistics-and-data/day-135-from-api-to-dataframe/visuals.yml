visuals:
  - id: json-to-frame-architecture
    file: assets/json-to-frame-architecture.svg
    type: diagram
    title: >-
      A nested JSON tree flattened two ways -- one row per customer versus one row per order -- with the
      duplicated cells shaded
    alt: >-
      Diagram: on the left, a JSON tree showing three customers, each with a name, a total_amount_due, and a
      list of orders. On the right, two rectangles. The top rectangle is the customer-grain table, three
      rows, one per customer, with total_amount_due appearing once each and summing to the true total of
      1550. The bottom rectangle is the order-grain table, six rows, one per order, with total_amount_due
      repeated once per order and shaded wherever it repeats; it sums to an inflated 2650, an overcount of
      1100. A closing note states the rule: decide what one row means before you flatten, and assert it
      afterwards, because both flattenings are correct pandas behaviour and only one answers a
      customer-level question correctly
    description: >-
      A static architecture diagram. The left half draws the nested JSON payload as a tree: a customers
      list containing three customer nodes, each expanding into a name, a total_amount_due leaf, and an
      orders list. The right half stacks two rectangular tables. The upper table is the customer-grain
      flattening -- three rows, customer_id, name and total_amount_due, each value appearing exactly once,
      summing to 1550. The lower table is the order-grain flattening -- six rows, order_id, customer_id,
      name and total_amount_due, where the total_amount_due cells that repeat across a customer's multiple
      orders are shaded in red to make the duplication visible at a glance, summing to 2650. A closing
      caption states the rule the whole diagram exists to teach: decide the grain before flattening, and
      assert it afterward.
  - id: ingestion-flow
    file: assets/ingestion-flow.svg
    type: flow-animated
    title: >-
      Pages arriving, landing in raw storage first, then transformed into a contracted frame, with a re-run
      visibly skipping the fetch
    alt: >-
      Diagram: four API pages travel left to right along a marching-dash wire into a raw storage stage,
      which lights up first. From raw storage, a second wire carries the data into a transform stage, which
      lights up second, and then into a contract-checked frame stage, which lights up third. Below the main
      path, a second, dashed re-run path starts directly at raw storage and skips the API entirely, labelled
      zero further requests, proving that a replay never touches the network. A resting-state note explains
      that with motion disabled every page, stage, arrow and label is already drawn in its final position,
      and the animation only shows the order the steps happen in
    description: >-
      An animated flow diagram, fully readable as a still image. Four page tiles sit on the left under a
      "mock API" label. A dashed wire with marching ants carries a travelling token left to right through
      three stages in sequence: raw JSONL storage, transform (assemble, pin dtypes, detect drift), and a
      green contracted-frame box on the far right. Each stage lights up in turn as the token passes. Below
      the main path, a second amber dashed path begins at the raw-storage stage and runs directly to the
      contracted-frame stage, skipping the API tiles entirely, labelled "0 further requests -- the server's
      own counter proves it." A prefers-reduced-motion block sets every animation to none, turns the
      marching dashes into solid lines, and freezes both travelling tokens at their resting positions, while
      every page, stage, wire, path and label stays fully drawn and fully legible.
