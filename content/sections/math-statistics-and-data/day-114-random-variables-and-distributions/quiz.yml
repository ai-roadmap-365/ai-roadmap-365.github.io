questions:
  - question: 'Two fair dice are summed. Most people''s first guess is that the sum is roughly even-handed across 2 through 12. Enumerating all 36 outcomes gives P(sum=7) = 1/6 and P(sum=2) = 1/36. What does this show?'
    options:
      - 'The distribution is close to uniform, and the small differences are rounding artifacts'
      - 'The dice must be unfair for this pattern to occur'
      - '7 is exactly six times as likely as 2 or 12'
      - 'This only holds for large numbers of rolls, not for the exact probabilities'
    answer_index: 2
    explanation: 'Six of the 36 equally likely outcomes sum to 7 — (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) — while only one, (1,1), sums to 2. The ratio 6/1 = 6 is exact, computed by counting, not a limiting or approximate statement. This is the pmf''s actual shape: a random variable built from a uniform sample space is not itself uniform just because the underlying outcomes were equally likely.'

  - question: 'A single fair die has E[X] = 3.5. What does this reveal about expectation in general?'
    options:
      - 'Expectation is only meaningful for continuous random variables'
      - '3.5 must be a typo, since no die can show that value'
      - 'Expectation always equals the median for a symmetric distribution, and 3.5 is the median here'
      - 'Expectation is a weighted average, not a value X can take'
    answer_index: 3
    explanation: 'E[X] = sum(k * P(X=k)) = (1+2+3+4+5+6)/6 = 3.5. No face of a die ever shows 3.5 — expectation is a weighted average over the whole distribution, not a prediction of any single outcome. This distinction matters in practice: a model''s expected loss, or a portfolio''s expected return, is routinely a number no single trial will ever exactly produce.'

  - question: 'X = the first die and Y = the sum of both dice, so Y depends on X directly (half of Y''s value IS X). What happens to E[X + Y]?'
    options:
      - 'E[X+Y] = E[X]+E[Y] exactly, with no independence needed'
      - 'E[X + Y] cannot be computed without first proving X and Y are independent'
      - 'E[X + Y] is somewhat less than E[X] + E[Y], because dependence introduces a discount'
      - 'E[X + Y] must be estimated by simulation, since exact enumeration cannot handle dependent variables'
    answer_index: 0
    explanation: 'Linearity of expectation holds unconditionally: E[X+Y] = sum over the sample space of (X(o)+Y(o)) * weight(o), and addition distributes over that sum regardless of any relationship between X and Y. Computed exactly by enumeration over the 36-outcome joint space, E[X]=7/2, E[Y]=7, and E[X+Y]=21/2 — exactly their sum. This is one of the most useful and most surprising facts in the subject precisely because it asks nothing of the relationship between the variables.'

  - question: 'For that same dependent pair, is Var[X + Y] = Var[X] + Var[Y]?'
    options:
      - 'Yes — variance is additive under exactly the same conditions as expectation'
      - 'No — Var adds 2*Cov(X,Y), which here is 35/12'
      - 'No, but only because the sample space has an even number of outcomes'
      - 'It depends on whether the variance is computed from the pmf or from a simulation'
    answer_index: 1
    explanation: 'Var[X]=35/12, Var[Y]=35/6, and their naive sum is 35/4 — but the true Var[X+Y] is 175/12, which only matches Var[X]+Var[Y]+2*Cov(X,Y). Beside linearity of expectation, this is the asymmetry worth memorising: expectation forgives dependence unconditionally; variance only does when the covariance term is zero, which independence guarantees and dependence, in general, does not.'

  - question: 'E[X^2] = 91/6 for a single fair die, while (E[X])^2 = 3.5^2 = 12.25 = 49/4. What is the gap between them, and what does it equal?'
    options:
      - 'The gap is a rounding error and should be treated as zero'
      - 'The gap indicates the die is biased'
      - 'The gap is 35/12, exactly Var[X] — Jensen''s inequality'
      - 'The gap can only be computed by simulation, not algebraically'
    answer_index: 2
    explanation: 'Var[X] = E[(X-E[X])^2] = E[X^2] - (E[X])^2 by direct algebraic expansion, and since a variance can never be negative, E[X^2] - (E[X])^2 >= 0 always — this is exactly Jensen''s inequality for the convex function g(x)=x^2. Here the gap is 91/6 - 49/4 = 35/12, which is precisely Var[X] for a fair die. It explains, in miniature, why E[g(X)] does not generally equal g(E[X]) for a nonlinear g.'

  - question: 'Uniform(0, 0.5) has probability density f(x) = 2 for every x in its support. Is this a contradiction?'
    options:
      - 'Yes — a valid probability can never exceed 1, and a density value is a probability'
      - 'No, because Uniform(0, 0.5) is a discrete distribution and densities do not apply to it'
      - 'Yes, but only for continuous distributions with support narrower than 0.5'
      - 'No — a density is not a probability; it integrates to one'
    answer_index: 3
    explanation: 'A density carries units of "probability per unit of x," not probability itself. Only its integral over a region gives back a probability, and that integral is bounded by 1 — not the density value at any single point. Uniform(0, 0.5) integrates its constant density of 2 over a support of width 0.5, giving 2 * 0.5 = 1 exactly, confirmed numerically in this lesson''s lab with a 100,000-panel trapezoid integral. This misconception is common enough that it survives entire degrees if never made concrete.'

  - question: 'Binomial(n, p) is evaluated with n growing from 10 to 10,000, with p = lambda/n held so that n*p = lambda = 2 stays fixed at every step. What happens to the maximum gap between the Binomial(n, lambda/n) pmf and the Poisson(lambda) pmf?'
    options:
      - 'It shrinks toward zero: 0.031 at n=10 to 0.000027 at 10,000'
      - 'It grows, because more trials introduce more variability'
      - 'It stays roughly constant, since lambda itself never changes'
      - 'It oscillates unpredictably and cannot be characterised as a trend'
    answer_index: 0
    explanation: 'This is the Poisson limit theorem, made numerically checkable rather than merely quoted: as n grows to infinity with n*p held at lambda, Binomial(n, p) converges to Poisson(lambda). At n=10 the Binomial''s own discrete, bounded-by-n shape has not converged; by n=10,000 the two pmfs agree to five decimal places at every count checked. The Poisson distribution is, in this precise sense, what a Binomial "becomes" once the number of trials is very large and each individual trial''s success probability is very small.'

  - question: 'An inverse-CDF sampler is written from scratch: build the pmf''s cdf, draw U from Uniform(0,1), and return the smallest value whose cdf is at least U. What must be true of the same-seed guarantee for this to be useful for debugging?'
    options:
      - 'It should not be reproducible, since reproducibility defeats the purpose of randomness'
      - 'Identical draws — each Generator carries its own state'
      - 'Reproducibility can only be guaranteed for continuous distributions, not discrete ones'
      - 'The sampler must be run single-threaded, or reproducibility cannot be guaranteed on any distribution'
    answer_index: 1
    explanation: 'numpy.random.default_rng(seed) constructs an independent Generator object; two Generators built from the same seed draw the identical sequence regardless of what else has run in the process, unlike the legacy global numpy.random.seed(), which mutates one shared state that any other code can perturb. This lesson''s lab confirms it directly: the same seed reproduces byte-identical draws from the from-scratch discrete sampler, and a different seed reliably does not.'

  - question: 'A language model''s output layer applies softmax to produce a probability distribution over its vocabulary, and sampling temperature reshapes that distribution before a token is drawn. How does this connect to today''s lesson?'
    options:
      - 'It does not connect meaningfully; softmax is a purely algebraic transformation with no probabilistic content'
      - 'The connection only applies to continuous-output models, not discrete-vocabulary language models'
      - 'Softmax IS a pmf over the next token, and sampling draws from it'
      - 'Temperature changes the sample space itself, not the distribution over it'
    answer_index: 2
    explanation: 'The vocabulary is a finite sample space, softmax turns the model''s raw scores into a valid pmf over it (non-negative, summing to 1), and generating a token means sampling one value from that discrete random variable — precisely the machinery exercise 7 builds from scratch. Temperature reshapes the pmf''s shape (flatter at high temperature, more peaked at low temperature) without changing the sample space, and cross-entropy loss during training is itself an expectation taken against that same pmf. Today''s exercises are, quite literally, the mechanics behind what a language model emits at every single generated token.'
