learning_promise: 'After this lesson you will be able to turn any outcome-generating process into arithmetic. Day 113 counted outcomes; today you will build the function that turns an outcome into a number you can average, add and multiply — a random variable — and you will feel the first misconception break immediately: almost everyone guesses the sum of two dice is roughly even-handed across 2 through 12, and enumerating all 36 outcomes shows 7 is exactly six times as likely as 2, by counting, not approximation. You will build the probability mass function and its running total, the cumulative distribution function, and use a cdf difference to read an interval probability with no re-summing. You will compute expectation two ways — by definition, exactly, and from 200,000 simulated dice rolls, with numpy.random.Generator and the statistics module side by side — and see that an expectation need not be a value the variable can ever actually take. You will prove, by exact enumeration over a dependent pair (the first die and the sum of both dice), that linearity of expectation holds completely regardless of dependence, while variance does not: Var[X+Y] = Var[X] + Var[Y] + 2*Cov(X,Y), and the covariance term here is 35/12, not zero. You will derive Jensen''s inequality in its simplest two-line form and watch the gap between E[X^2] and (E[X])^2 turn out to be exactly the variance. You will build a working reference to the seven named distributions you will meet for the rest of this course — Bernoulli, Binomial, Geometric, Poisson, Uniform, Exponential, Normal — each with its situation, its parameters, its mean and variance, and one concrete number. You will watch a Binomial distribution numerically converge to a Poisson distribution as the number of trials grows into the thousands, with the gap between their two pmfs measured and shown shrinking monotonically. You will build an inverse-CDF sampler completely from scratch, first for an arbitrary discrete distribution and then for the exponential distribution as the closed form -ln(U)/lambda, and confirm both against numpy''s own generator — including a maximum-gap statistic you write by hand, because scipy is not installed in this environment. And you will resolve the single most persistent misconception in the entire subject: a probability density can legitimately exceed 1, demonstrated with Uniform(0, 0.5), whose density is 2 everywhere on its support and which still integrates to exactly 1.'
objectives:
  - 'Define a random variable as a function from a sample space to the real numbers, and explain why this single shift is what makes expectation, variance and every loss function in machine learning possible'
  - 'Build a probability mass function by enumeration, as an exact fractions.Fraction, and build its cumulative distribution function as the pmf''s running total'
  - 'Compute expectation and variance from their definitions and confirm both against a large seeded simulation, with a tolerance derived from the standard error of the mean rather than guessed'
  - 'State and demonstrate, by exact enumeration over a genuinely dependent pair of random variables, that linearity of expectation holds unconditionally while variance requires the exact covariance correction Var[X+Y] = Var[X] + Var[Y] + 2*Cov(X,Y)'
  - 'State Jensen''s inequality in its simplest form, E[X^2] >= (E[X])^2, and show algebraically and numerically that the gap equals the variance'
  - 'Explain Var[aX + b] = a^2 * Var[X] and why the additive constant b disappears entirely from a spread measure'
  - 'Describe the Bernoulli, Binomial, Geometric, Poisson, Uniform, Exponential and Normal distributions well enough to choose the right one for a situation and state its mean and variance from memory'
  - 'Demonstrate numerically that a Binomial(n, lambda/n) distribution converges to a Poisson(lambda) distribution as n grows, by measuring a shrinking maximum pmf gap across four decades of n'
  - 'Build an inverse-CDF sampler from scratch for an arbitrary discrete distribution and for the exponential distribution, and explain what numpy.random.Generator''s own sampling methods are doing internally'
  - 'Explain why a probability density can exceed 1 while a probability cannot, using a concrete, numerically checkable example rather than the definition alone'
  - 'Use numpy.random.default_rng(seed) correctly for every sampler in this lesson, and explain why it is preferred over the legacy global-state numpy.random.seed()'
  - 'Connect a language model''s softmax output layer and sampling temperature to the pmf and sampling machinery built in this lesson, as a concrete instance rather than an analogy'
prerequisites:
  - 'Day 113 — sample spaces, events as sets, the addition and complement rules, independence versus mutual exclusivity, conditional probability, the law of total probability, and Monte Carlo estimation with numpy.random.Generator. This lesson builds on all of it and does not repeat it.'
  - 'Comfort with Python dictionaries, fractions.Fraction, and basic arithmetic on fractions'
  - 'No calculus is required. Where an integral appears (the density-integrates-to-1 example), it is evaluated numerically with a trapezoid rule, not derived analytically'
  - 'Days 71-74 — running pytest and reading its skip-versus-fail output'
  - 'Day 43 — python3 -m venv and installing a package with pip'
