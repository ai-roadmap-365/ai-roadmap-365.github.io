visuals:
  - id: random-variable-anatomy-architecture
    file: assets/random-variable-anatomy-architecture.svg
    type: diagram
    title: 'A random variable is a function: sample space, mapping, and the resulting pmf and cdf'
    alt: 'Diagram: three panels. Left shows the 36-outcome sample space of two dice as a 6 by 6 grid of dots, with three example outcomes highlighted. Middle shows the deterministic function Y mapping outcomes to numbers, Y(die1, die2) equals die1 plus die2, with the same three example mappings, plus the resulting E of Y equals 7 and Var of Y equals 35 over 6. Right shows the resulting probability mass function as eleven bars over sums 2 through 12 with the sum-of-7 bar tallest and highlighted, plus the cumulative distribution function drawn as a staircase beneath it, with the identity F of 7 minus F of 6 equals 1 over 6 labelled at the bottom'
    description: 'A static architecture diagram, on a light background, split into three side-by-side panels connected by two rightward arrows. The left panel, headed "1. SAMPLE SPACE", draws the 36-outcome sample space of two dice as a 6 by 6 grid of grey dots labelled by row (die 1) and column (die 2), with three dots highlighted in blue at (1,6), (2,6) and (6,6), captioned that each outcome carries weight 1/36 and that a raw outcome is a pair, not a number that can be averaged. Beneath it, a tinted box states that Day 113 stopped at this set of outcomes and today adds the function in the middle panel. The middle panel, headed "2. THE FUNCTION Y", writes Y(die1, die2) = die1 + die2 and shows the same three highlighted outcomes mapped to their sums, 7, 8 and 12, captioned that Y is deterministic — the randomness lives in which outcome occurs, not in the function itself — and states the two resulting summary numbers, E[Y] = 7 and Var[Y] = 35/6, connected by an arrow flowing in from the sample space panel. The right panel, headed "3. pmf AND cdf OF Y", draws Y possible values 2 through 12 as an 11-bar probability-mass-function chart with the sum-of-7 bar tallest and coloured amber for emphasis, labelled P(Y=7) = 1/6, and beneath it the same 11 values traced as a cumulative-distribution-function staircase that starts near zero and reaches exactly 1 at 12, closing with the identity F(7) - F(6) = 7/12 - 5/12 = 1/6 = P(Y=7) and the summary line that a pmf has shape while a cdf always ends at exactly 1.'

  - id: sampling-flow
    file: assets/sampling-flow.svg
    type: flow-animated
    title: 'Inverse-CDF sampling: a uniform draw lands on the cdf staircase, projects down to a sample, and a histogram builds up'
    alt: 'Diagram: an animated flow showing a uniform draw U on a vertical axis travelling right until it meets the cdf staircase of the two-dice-sum distribution, at which point it projects straight down to the sampled value on the horizontal axis, and a small histogram beneath the axis grows toward the true probability mass function shape as draws accumulate. A U value of 0.60 lands past F of 7 equal to 0.5833, so the sampled value is 8. A side panel spells out the method in four numbered steps and gives the exponential distribution closed form, x equals negative ln of U divided by lambda'
    description: 'An animated flow diagram, fully readable as a still image. The heading reads "Inverse-CDF sampling: one uniform draw, projected through the cdf" and states the four-step path: draw U, follow it to the cdf staircase, drop down to the sampled value, and watch the histogram grow. A vertical axis on the left runs from 0 at the bottom to 1 at the top, holding a labelled dot at U=0.60. A dashed amber horizontal line marches rightward from that dot toward the cdf staircase directly beneath the same eleven-value sum-of-two-dice cdf drawn in the architecture diagram, and a travelling amber token animates along an L-shaped path: rightward along the U line, then downward once it reaches the staircase, landing on a dashed vertical marker labelled "sample = 8" — correct because U=0.60 exceeds F(7)=0.5833, so 8 is the smallest value whose cdf is at least U. Beneath the horizontal axis, three grey histogram bars for sums 6, 7 and 8 animate growing taller over the cycle, settling against dashed amber outlines that mark the true pmf heights they approach, captioned that the histogram of draws builds toward the true pmf shape. A bordered side panel on the right spells out the method in four numbered steps — draw U, find where it meets the cdf, that value is the sample, repeat and the histogram converges — states that this is what Generator.exponential and similar methods do internally with one uniform draw per sample, and closes with the exponential distribution''s closed form, x = -ln(U) / lambda. A prefers-reduced-motion block stops every animation and restores the resting state, in which the U dot and its label are fully visible, the horizontal line to the cdf is a solid rather than marching line, the travelling token rests at the point directly above the sample-8 marker, and all three histogram bars sit at their final grown height beside their dashed pmf-shape outlines — every label, arrow, number and the closed-form formula remain fully present with no motion.'
