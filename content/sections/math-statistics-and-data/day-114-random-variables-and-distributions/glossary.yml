terms:
  - term: Random variable
    definition: >-
      A function that maps every outcome in a sample space to a real number.
      "Two dice sum to 7" is not itself a random variable; the function
      Y(outcome) = outcome[0] + outcome[1] is. The randomness lives in which
      outcome occurs; the variable is the fixed, deterministic rule that
      turns whichever outcome happened into a number.

  - term: Probability mass function (pmf)
    definition: >-
      For a discrete random variable, the function that gives P(X = k) for
      every value k the variable can take. The pmf of a two-dice sum gives
      P(Y=7) = 1/6 and P(Y=2) = 1/36 — a shape, not a flat line, since 7 is
      exactly six times as likely as 2.

  - term: Probability density function (pdf)
    definition: >-
      For a continuous random variable, the function whose integral over an
      interval gives the probability of landing in that interval. A pdf
      value is not itself a probability and can exceed 1 — Uniform(0, 0.5)
      has density 2 everywhere on its support and still integrates to
      exactly 1.

  - term: Cumulative distribution function (cdf)
    definition: >-
      F(k) = P(X <= k), for either a discrete or continuous random
      variable. It is monotone non-decreasing, approaches 1 as its argument
      grows, and a difference of two cdf values gives an interval
      probability directly — F(7) - F(6) recovers P(Y=7) exactly, with no
      re-summing of the pmf.

  - term: Expectation
    definition: >-
      E[X], the probability-weighted average of a random variable's
      possible values: sum over k of k * P(X=k). It need not be a value the
      variable can actually take — a single fair die has E[X] = 3.5, and no
      face of a die ever shows 3.5.

  - term: Variance
    definition: >-
      Var[X] = E[(X - E[X])^2], the expected squared distance from the
      mean. Unlike expectation, variance does not distribute over a sum
      unless the variables involved are independent (or, more precisely,
      have zero covariance): Var[X+Y] = Var[X] + Var[Y] + 2*Cov(X,Y).

  - term: Covariance
    definition: >-
      Cov(X, Y) = E[(X - E[X])(Y - E[Y])], a measure of how two random
      variables move together. It is exactly the correction term that
      makes Var[X+Y] = Var[X] + Var[Y] + 2*Cov(X,Y) an equality rather than
      an approximation, and it is zero whenever X and Y are independent
      (though a zero covariance does not by itself prove independence).

  - term: Jensen's inequality
    definition: >-
      For a convex function g, E[g(X)] >= g(E[X]). Its simplest case is
      g(x) = x^2, giving E[X^2] >= (E[X])^2 — and the gap between the two
      sides is exactly Var[X], since Var[X] = E[X^2] - (E[X])^2 and a
      variance can never be negative.

  - term: Bernoulli distribution
    definition: >-
      The distribution of a single trial with two outcomes, success with
      probability p and failure with probability 1-p. Mean p, variance
      p(1-p). Every other distribution on this page that counts successes
      is built from a sequence of Bernoulli trials.

  - term: Binomial distribution
    definition: >-
      The distribution of the number of successes in n independent
      Bernoulli(p) trials. Mean np, variance np(1-p). As n grows large
      while n*p is held fixed at a constant lambda, the Binomial
      distribution converges to the Poisson(lambda) distribution — a
      convergence this lesson's lab measures directly.

  - term: Geometric distribution
    definition: >-
      The distribution of the number of independent Bernoulli(p) trials
      needed to see the first success. Mean 1/p, variance (1-p)/p^2. The
      distribution behind "how many attempts until it works."

  - term: Poisson distribution
    definition: >-
      The distribution of the count of rare, independent events in a fixed
      interval, with rate parameter lambda. Mean lambda, variance lambda —
      the only common distribution whose mean and variance are the same
      number. Arises as the n-to-infinity limit of Binomial(n, lambda/n).

  - term: Uniform distribution
    definition: >-
      Every value in an interval [a, b] is equally likely. Mean (a+b)/2,
      variance (b-a)^2/12. Its density is the constant 1/(b-a), which
      exceeds 1 whenever the interval is narrower than 1 — the standard
      example that a density is not a probability.

  - term: Exponential distribution
    definition: >-
      The distribution of the waiting time between events in a Poisson
      process with rate lambda. Mean 1/lambda, variance 1/lambda^2. Sampled
      from a single uniform draw U as -ln(U) / lambda, the inverse-CDF
      method applied to its own cdf, F(x) = 1 - exp(-lambda*x).

  - term: Normal distribution
    definition: >-
      The bell-shaped distribution with parameters mean mu and variance
      sigma^2, that arises as the limiting shape of sums of many small,
      independent effects — the subject of Day 117's central limit
      theorem. Not derived numerically in this lesson beyond its
      description in the named-distributions table.

  - term: Inverse-CDF sampling
    definition: >-
      A method for turning a single uniform draw U on (0, 1) into a sample
      from any target distribution, by finding the value x such that
      F(x) = U, where F is the target's cdf. For a discrete pmf this is
      "find the smallest value whose cdf is at least U"; for the
      exponential distribution it collapses to the closed form
      -ln(U) / lambda.

  - term: Standard error
    definition: >-
      The standard deviation of a sampling statistic itself — for a sample
      mean, sqrt(variance / n). It is the quantity every tolerance in this
      lesson's lab is derived from, rather than guessed: a simulated value
      is expected to land within about three standard errors of the true
      value on roughly 99.7% of runs.

  - term: Law of large numbers
    definition: >-
      As the number of independent samples n grows, a sample mean
      converges to the true expectation. It is why simulation works at
      all; it says nothing about how fast that convergence happens — that
      rate is the central limit theorem, covered on Day 117.
