<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d114a-title d114a-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d114a-title">A random variable is a function: sample space, mapping, and the resulting pmf and cdf</title>
  <desc id="d114a-desc">Three panels. Left: the 36-outcome sample space of two dice as a 6 by 6 grid. Middle: the function Y mapping each outcome to a number, the sum of both dice. Right: the resulting probability mass function as bars and the cumulative distribution function as a staircase, both over the sums 2 through 12.</desc>

  <style>
    .d114a-bg { fill: #f8fafc; }
    .d114a-text { fill: #1a202c; }
    .d114a-muted { fill: #4a5568; }
    .d114a-accent { fill: #1d4ed8; }
    .d114a-accent-stroke { stroke: #1d4ed8; }
    .d114a-panel-title { font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d114a-label { font-size: 14px; fill: #1a202c; }
    .d114a-small { font-size: 13px; fill: #4a5568; }
    .d114a-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .d114a-panel { fill: none; stroke: #cbd5e1; stroke-width: 1.5; }
    .d114a-dot { fill: #94a3b8; }
    .d114a-dot-hi { fill: #1d4ed8; }
    .d114a-bar { fill: #1d4ed8; }
    .d114a-bar-max { fill: #b45309; }
    .d114a-cdf { fill: none; stroke: #b45309; stroke-width: 3; }
    .d114a-axis { stroke: #64748b; stroke-width: 1.5; }
    .d114a-arrow { stroke: #1d4ed8; stroke-width: 2.5; fill: none; marker-end: url(#d114a-arrowhead); }
  </style>

  <rect class="d114a-bg" x="0" y="0" width="1200" height="760" />

  <text x="600" y="36" text-anchor="middle" font-size="24" font-weight="700" class="d114a-text">A random variable is a function, not a value</text>
  <text x="600" y="60" text-anchor="middle" class="d114a-small">Y : outcome to a number. Here, Y(a, b) = a + b, the sum of two dice.</text>

  <!-- LEFT PANEL: sample space -->
  <rect class="d114a-panel" x="30" y="90" width="330" height="580" rx="8" />
  <text x="195" y="122" text-anchor="middle" class="d114a-panel-title">1. SAMPLE SPACE Ω</text>
  <text x="195" y="144" text-anchor="middle" class="d114a-small">36 equally likely outcomes (die 1, die 2)</text>

  <g id="d114a-grid">
    <!-- 6x6 grid of dots representing (die1, die2), die1 rows 1-6 top to bottom, die2 cols 1-6 -->
    <!-- generated positions -->
    <g font-size="12" class="d114a-muted">
      <!-- row/col labels -->
      <text x="70" y="168">die 2 →</text>
      <text x="52" y="200" transform="rotate(-90 52 200)">die 1 →</text>
    </g>
    <g transform="translate(95,180)">
      <!-- 6 rows (die1=1..6), 6 cols (die2=1..6), spacing 40 -->
      <!-- Row die1=1 -->
      <circle class="d114a-dot" cx="0"   cy="0"   r="9"/>
      <circle class="d114a-dot-hi" cx="40"  cy="0"   r="10"/><!-- (1,6) sum7 highlight example -->
      <circle class="d114a-dot" cx="80"  cy="0"   r="9"/>
      <circle class="d114a-dot" cx="120" cy="0"   r="9"/>
      <circle class="d114a-dot" cx="160" cy="0"   r="9"/>
      <circle class="d114a-dot" cx="200" cy="0"   r="9"/>
      <!-- Row die1=2 -->
      <circle class="d114a-dot" cx="0"   cy="40"  r="9"/>
      <circle class="d114a-dot" cx="40"  cy="40"  r="9"/>
      <circle class="d114a-dot" cx="80"  cy="40"  r="9"/>
      <circle class="d114a-dot" cx="120" cy="40"  r="9"/>
      <circle class="d114a-dot" cx="160" cy="40"  r="9"/>
      <circle class="d114a-dot-hi" cx="200" cy="40"  r="10"/><!-- (2,6) sum 8 -->
      <!-- Row die1=3 -->
      <circle class="d114a-dot" cx="0"   cy="80"  r="9"/>
      <circle class="d114a-dot" cx="40"  cy="80"  r="9"/>
      <circle class="d114a-dot" cx="80"  cy="80"  r="9"/>
      <circle class="d114a-dot" cx="120" cy="80"  r="9"/>
      <circle class="d114a-dot" cx="160" cy="80"  r="9"/>
      <circle class="d114a-dot" cx="200" cy="80"  r="9"/>
      <!-- Row die1=4 -->
      <circle class="d114a-dot" cx="0"   cy="120" r="9"/>
      <circle class="d114a-dot" cx="40"  cy="120" r="9"/>
      <circle class="d114a-dot" cx="80"  cy="120" r="9"/>
      <circle class="d114a-dot" cx="120" cy="120" r="9"/>
      <circle class="d114a-dot" cx="160" cy="120" r="9"/>
      <circle class="d114a-dot" cx="200" cy="120" r="9"/>
      <!-- Row die1=5 -->
      <circle class="d114a-dot" cx="0"   cy="160" r="9"/>
      <circle class="d114a-dot" cx="40"  cy="160" r="9"/>
      <circle class="d114a-dot" cx="80"  cy="160" r="9"/>
      <circle class="d114a-dot" cx="120" cy="160" r="9"/>
      <circle class="d114a-dot" cx="160" cy="160" r="9"/>
      <circle class="d114a-dot" cx="200" cy="160" r="9"/>
      <!-- Row die1=6 -->
      <circle class="d114a-dot" cx="0"   cy="200" r="9"/>
      <circle class="d114a-dot" cx="40"  cy="200" r="9"/>
      <circle class="d114a-dot" cx="80"  cy="200" r="9"/>
      <circle class="d114a-dot" cx="120" cy="200" r="9"/>
      <circle class="d114a-dot" cx="160" cy="200" r="9"/>
      <circle class="d114a-dot-hi" cx="200" cy="200" r="10"/><!-- (6,6) sum 12 -->
    </g>
  </g>

  <text x="195" y="425" text-anchor="middle" class="d114a-label">|Ω| = 36, each outcome weight 1/36</text>
  <text x="195" y="450" text-anchor="middle" class="d114a-small d114a-mono">highlighted: (1,6) and (2,6) sum to 7 and 8</text>
  <text x="195" y="468" text-anchor="middle" class="d114a-small d114a-mono">(6,6) sums to 12</text>

  <rect x="55" y="500" width="280" height="150" rx="6" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="195" y="524" text-anchor="middle" class="d114a-label" font-weight="700">Ω is a SET of outcomes.</text>
  <text x="195" y="548" text-anchor="middle" class="d114a-small">An outcome, like (1,6), is not a</text>
  <text x="195" y="566" text-anchor="middle" class="d114a-small">number you can average, add,</text>
  <text x="195" y="584" text-anchor="middle" class="d114a-small">or take the variance of.</text>
  <text x="195" y="608" text-anchor="middle" class="d114a-small" font-weight="700">Day 113 stopped here.</text>
  <text x="195" y="630" text-anchor="middle" class="d114a-small">Today adds the function below.</text>

  <!-- MIDDLE: the mapping -->
  <rect class="d114a-panel" x="400" y="90" width="290" height="580" rx="8" />
  <text x="545" y="122" text-anchor="middle" class="d114a-panel-title">2. THE FUNCTION Y</text>
  <text x="545" y="144" text-anchor="middle" class="d114a-small">Y(die1, die2) = die1 + die2</text>

  <rect x="425" y="180" width="240" height="220" rx="6" fill="#fff7ed" stroke="#fdba74" />
  <text x="545" y="206" text-anchor="middle" class="d114a-mono" font-size="15" font-weight="700">Y is deterministic</text>
  <text x="545" y="232" text-anchor="middle" class="d114a-mono" font-size="14">(1,6) &#8594; 7</text>
  <text x="545" y="256" text-anchor="middle" class="d114a-mono" font-size="14">(2,6) &#8594; 8</text>
  <text x="545" y="280" text-anchor="middle" class="d114a-mono" font-size="14">(6,6) &#8594; 12</text>
  <text x="545" y="304" text-anchor="middle" class="d114a-mono" font-size="14">(1,1) &#8594; 2</text>
  <text x="545" y="336" text-anchor="middle" class="d114a-small">The RANDOMNESS is in which</text>
  <text x="545" y="354" text-anchor="middle" class="d114a-small">outcome occurs. Y itself never</text>
  <text x="545" y="372" text-anchor="middle" class="d114a-small">changes: same input, same output.</text>

  <text x="545" y="440" text-anchor="middle" class="d114a-label" font-weight="700">E[Y] = 7</text>
  <text x="545" y="464" text-anchor="middle" class="d114a-small d114a-mono">weighted average of all 36 outputs</text>
  <text x="545" y="486" text-anchor="middle" class="d114a-small">(a fixed number, computed once Y exists)</text>

  <text x="545" y="530" text-anchor="middle" class="d114a-label" font-weight="700">Var[Y] = 35/6 &#8776; 5.83</text>
  <text x="545" y="554" text-anchor="middle" class="d114a-small">how spread out Y's outputs are</text>

  <path class="d114a-arrow" d="M 195 690 L 545 690" />
  <text x="370" y="712" text-anchor="middle" class="d114a-small">Ω feeds into Y</text>

  <path class="d114a-arrow" d="M 690 400 L 720 400" />

  <!-- RIGHT PANEL: pmf bars + cdf staircase -->
  <rect class="d114a-panel" x="730" y="90" width="440" height="580" rx="8" />
  <text x="950" y="122" text-anchor="middle" class="d114a-panel-title">3. pmf AND cdf OF Y</text>
  <text x="950" y="144" text-anchor="middle" class="d114a-small">Y's possible values: 2 through 12</text>

  <!-- pmf bar chart. sums 2..12, heights scaled to fraction/36 *600 -->
  <g transform="translate(760,170)">
    <line class="d114a-axis" x1="0" y1="220" x2="380" y2="220" />
    <!-- bars: width 26, gap 8, 11 bars starting x=5 -->
    <!-- counts: 1,2,3,4,5,6,5,4,3,2,1 out of 36 -->
    <g class="d114a-mono" font-size="11">
      <rect class="d114a-bar" x="5"   y="214" width="26" height="6" />
      <rect class="d114a-bar" x="39"  y="202" width="26" height="18" />
      <rect class="d114a-bar" x="73"  y="190" width="26" height="30" />
      <rect class="d114a-bar" x="107" y="178" width="26" height="42" />
      <rect class="d114a-bar" x="141" y="166" width="26" height="54" />
      <rect class="d114a-bar-max" x="175" y="154" width="26" height="66" />
      <rect class="d114a-bar" x="209" y="166" width="26" height="54" />
      <rect class="d114a-bar" x="243" y="178" width="26" height="42" />
      <rect class="d114a-bar" x="277" y="190" width="26" height="30" />
      <rect class="d114a-bar" x="311" y="202" width="26" height="18" />
      <rect class="d114a-bar" x="345" y="214" width="26" height="6" />
    </g>
    <g class="d114a-small" text-anchor="middle" font-size="12">
      <text x="18" y="235">2</text><text x="52" y="235">3</text><text x="86" y="235">4</text>
      <text x="120" y="235">5</text><text x="154" y="235">6</text><text x="188" y="235" font-weight="700">7</text>
      <text x="222" y="235">8</text><text x="256" y="235">9</text><text x="290" y="235">10</text>
      <text x="324" y="235">11</text><text x="358" y="235">12</text>
    </g>
    <text x="188" y="140" text-anchor="middle" class="d114a-small d114a-mono" font-weight="700">P(Y=7) = 1/6</text>
    <text x="18" y="270" class="d114a-small">pmf: P(Y=2) = 1/36 &#8230; P(Y=7) = 1/6 &#8230; six times as likely</text>
  </g>

  <!-- cdf staircase -->
  <g transform="translate(760,470)">
    <text x="190" y="-10" text-anchor="middle" class="d114a-small" font-weight="700">cdf F(k) = P(Y &#8804; k), the pmf's running total</text>
    <line class="d114a-axis" x1="0" y1="150" x2="380" y2="150" />
    <line class="d114a-axis" x1="0" y1="0" x2="0" y2="150" />
    <text x="-8" y="8" text-anchor="end" class="d114a-small">1.0</text>
    <text x="-8" y="153" text-anchor="end" class="d114a-small">0</text>
    <!-- staircase: cumulative fractions of 36: 1,3,6,10,15,21,26,30,33,35,36 -->
    <path class="d114a-cdf" d="
      M 5 145.8 L 39 145.8 L 39 137.5 L 73 137.5 L 73 125 L 107 125 L 107 108.3
      L 141 108.3 L 141 87.5 L 175 87.5 L 175 62.5 L 209 62.5 L 209 41.7
      L 243 41.7 L 243 25 L 277 25 L 277 12.5 L 311 12.5 L 311 4.2
      L 345 4.2 L 345 0 L 379 0
      " />
    <g class="d114a-small" text-anchor="middle" font-size="12">
      <text x="18" y="168">2</text><text x="52" y="168">3</text><text x="86" y="168">4</text>
      <text x="120" y="168">5</text><text x="154" y="168">6</text><text x="188" y="168" font-weight="700">7</text>
      <text x="222" y="168">8</text><text x="256" y="168">9</text><text x="290" y="168">10</text>
      <text x="324" y="168">11</text><text x="358" y="168">12</text>
    </g>
  </g>

  <text x="950" y="700" text-anchor="middle" class="d114a-small" font-weight="700">F(7) - F(6) = 7/12 - 5/12 = 1/6 = P(Y=7), exactly</text>
  <text x="950" y="722" text-anchor="middle" class="d114a-small">A cdf difference recovers a pmf value with no re-summing</text>
  <text x="950" y="744" text-anchor="middle" class="d114a-small" fill="#b45309" font-weight="700">A pmf has SHAPE. A cdf always ends at exactly 1.</text>
</svg>
