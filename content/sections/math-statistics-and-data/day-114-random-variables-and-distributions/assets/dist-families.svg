<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And what each models.">
  <title>Four distributions worth knowing</title>
  <style>
    .dist-families-bg   { fill: #f8fafc; }
    .dist-families-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist-families-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist-families-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist-families-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist-families-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist-families-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dist-families-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dist-families-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dist-families-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dist-families-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dist-families-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dist-families-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dist-families-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dist-families-stage { opacity: 1; }

    .dist-families-s0 { animation-delay: 0.00s; }
    .dist-families-e0 { animation-delay: 0.00s; }
    .dist-families-s1 { animation-delay: 1.28s; }
    .dist-families-e1 { animation-delay: 1.28s; }
    .dist-families-s2 { animation-delay: 2.56s; }
    .dist-families-e2 { animation-delay: 2.56s; }
    .dist-families-s3 { animation-delay: 3.84s; }
    .dist-families-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dist-families-conn  { animation: dist-families-trace 6.4s ease-in-out infinite; }
      .dist-families-stage { animation: dist-families-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dist-families-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dist-families-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dist-families-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dist-families-stage { animation: dist-families-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dist-families-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dist-families-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dist-families-bg" width="980" height="322"/>
  <text class="dist-families-h1"  x="30" y="40">Four distributions worth knowing</text>
  <text class="dist-families-sub" x="30" y="64">And what each models.</text>
  <g class="dist-families-stage dist-families-s0">
    <rect class="dist-families-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dist-families-step" x="44" y="142">01</text>
    <text class="dist-families-name" x="70" y="142">Uniform: every value equally likely</text>
    <text class="dist-families-desc" x="44" y="166">Rare in nature, common in</text>
    <text class="dist-families-desc" x="44" y="182">simulation.</text>
  </g>
  <line class="dist-families-line dist-families-conn dist-families-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dist-families-tip)"/>
  <g class="dist-families-stage dist-families-s1">
    <rect class="dist-families-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dist-families-step" x="280" y="142">02</text>
    <text class="dist-families-name" x="306" y="142">Binomial: counts of successes in fixed trials</text>
    <text class="dist-families-desc" x="280" y="166">Clicks, conversions, defects.</text>
  </g>
  <line class="dist-families-line dist-families-conn dist-families-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dist-families-tip)"/>
  <g class="dist-families-stage dist-families-s2">
    <rect class="dist-families-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dist-families-step" x="516" y="142">03</text>
    <text class="dist-families-name" x="542" y="142">Normal: sums of many small independent effects</text>
    <text class="dist-families-desc" x="516" y="166">Which is why it appears so</text>
    <text class="dist-families-desc" x="516" y="182">often.</text>
  </g>
  <line class="dist-families-line dist-families-conn dist-families-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dist-families-tip)"/>
  <g class="dist-families-stage dist-families-s3">
    <rect class="dist-families-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dist-families-step" x="752" y="142">04</text>
    <text class="dist-families-name" x="778" y="142">And heavy-tailed: extremes far more likely than normal</text>
    <text class="dist-families-desc" x="752" y="166">Incomes, file sizes, network</text>
    <text class="dist-families-desc" x="752" y="182">traffic.</text>
  </g>
  <text class="dist-families-sub" x="30" y="304">Heavy tails are the family that breaks the usual toolkit, because a mean and standard deviation describe them poorly and can be dominated by one observation.</text>
</svg>
