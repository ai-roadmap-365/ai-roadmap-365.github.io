<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four numbers.">
  <title>Summarising a distribution</title>
  <style>
    .moments-bg   { fill: #f8fafc; }
    .moments-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moments-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moments-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moments-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moments-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moments-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .moments-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .moments-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .moments-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .moments-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .moments-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .moments-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .moments-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .moments-stage { opacity: 1; }

    .moments-s0 { animation-delay: 0.00s; }
    .moments-e0 { animation-delay: 0.00s; }
    .moments-s1 { animation-delay: 1.28s; }
    .moments-e1 { animation-delay: 1.28s; }
    .moments-s2 { animation-delay: 2.56s; }
    .moments-e2 { animation-delay: 2.56s; }
    .moments-s3 { animation-delay: 3.84s; }
    .moments-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .moments-conn  { animation: moments-trace 6.4s ease-in-out infinite; }
      .moments-stage { animation: moments-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes moments-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes moments-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .moments-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .moments-stage { animation: moments-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes moments-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="moments-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="moments-bg" width="980" height="322"/>
  <text class="moments-h1"  x="30" y="40">Summarising a distribution</text>
  <text class="moments-sub" x="30" y="64">Four numbers.</text>
  <g class="moments-stage moments-s0">
    <rect class="moments-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="moments-step" x="44" y="142">01</text>
    <text class="moments-name" x="70" y="142">The mean: where the mass balances</text>
    <text class="moments-desc" x="44" y="166">Sensitive to extremes.</text>
  </g>
  <line class="moments-line moments-conn moments-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#moments-tip)"/>
  <g class="moments-stage moments-s1">
    <rect class="moments-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="moments-step" x="280" y="142">02</text>
    <text class="moments-name" x="306" y="142">The variance: how spread out it is</text>
    <text class="moments-desc" x="280" y="166">In squared units.</text>
  </g>
  <line class="moments-line moments-conn moments-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#moments-tip)"/>
  <g class="moments-stage moments-s2">
    <rect class="moments-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="moments-step" x="516" y="142">03</text>
    <text class="moments-name" x="542" y="142">The skew: whether it leans one way</text>
    <text class="moments-desc" x="516" y="166">Which the mean alone hides.</text>
  </g>
  <line class="moments-line moments-conn moments-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#moments-tip)"/>
  <g class="moments-stage moments-s3">
    <rect class="moments-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="moments-step" x="752" y="142">04</text>
    <text class="moments-name" x="778" y="142">And the tails: how likely extreme values are</text>
    <text class="moments-desc" x="752" y="166">Which is usually what matters.</text>
  </g>
  <text class="moments-sub" x="30" y="304">Tails usually being what matters is worth stating plainly, since risk, outages and outliers all live there and the mean says almost nothing about them.</text>
</svg>
