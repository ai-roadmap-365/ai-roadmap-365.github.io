<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a distribution is not</title>
  <style>
    .rv-not-bg   { fill: #f8fafc; }
    .rv-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rv-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rv-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rv-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rv-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rv-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rv-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rv-not-row { opacity: 1; }
    .rv-not-r0 { animation-delay: 0.00s; }
    .rv-not-r1 { animation-delay: 0.45s; }
    .rv-not-r2 { animation-delay: 0.90s; }
    .rv-not-r3 { animation-delay: 1.35s; }
    .rv-not-r4 { animation-delay: 1.80s; }
    .rv-not-row { animation: rv-not-reveal 7.3s ease-in-out infinite; }
    @keyframes rv-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rv-not-bg" width="980" height="390"/>
  <text class="rv-not-h1"  x="30" y="40">Four things a distribution is not</text>
  <text class="rv-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="rv-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rv-not-name" x="46" y="122">The misconception</text>
  <text class="rv-not-desc" x="46" y="142">Commonly held.</text>
  <text class="rv-not-desc rv-not-row rv-not-r0" x="46" y="182">Most real data is normal</text>
  <text class="rv-not-desc rv-not-row rv-not-r1" x="46" y="216">The mean describes the typical value</text>
  <text class="rv-not-desc rv-not-row rv-not-r2" x="46" y="250">Variance captures the shape</text>
  <text class="rv-not-desc rv-not-row rv-not-r3" x="46" y="284">A random variable is a variable</text>
  <text class="rv-not-desc rv-not-row rv-not-r4" x="46" y="318">Distributions are properties of data</text>
  <rect class="rv-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rv-not-name" x="526" y="122">What is true</text>
  <text class="rv-not-desc" x="526" y="142">Actually.</text>
  <text class="rv-not-desc rv-not-row rv-not-r0" x="526" y="182">Much of it is skewed or heavy-tailed</text>
  <text class="rv-not-desc rv-not-row rv-not-r1" x="526" y="216">For skewed data the median is better</text>
  <text class="rv-not-desc rv-not-row rv-not-r2" x="526" y="250">Skew and tails matter too</text>
  <text class="rv-not-desc rv-not-row rv-not-r3" x="526" y="284">It is a function from outcomes to numbers</text>
  <text class="rv-not-desc rv-not-row rv-not-r4" x="526" y="318">They are assumed models of a process</text>
  <text class="rv-not-sub" x="30" y="372">Distributions being assumed models rather than observed properties is the framing that keeps you honest, because the assumption is where the errors come from.</text>
</svg>
