<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different shapes.">
  <title>Heights and incomes</title>
  <style>
    .height-income-bg   { fill: #f8fafc; }
    .height-income-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .height-income-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .height-income-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .height-income-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .height-income-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .height-income-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .height-income-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .height-income-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .height-income-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .height-income-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .height-income-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .height-income-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .height-income-row { opacity: 1; }
    .height-income-r0 { animation-delay: 0.00s; }
    .height-income-r1 { animation-delay: 0.45s; }
    .height-income-r2 { animation-delay: 0.90s; }
    .height-income-r3 { animation-delay: 1.35s; }
    .height-income-r4 { animation-delay: 1.80s; }
    .height-income-row { animation: height-income-reveal 7.3s ease-in-out infinite; }
    @keyframes height-income-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="height-income-bg" width="980" height="390"/>
  <text class="height-income-h1"  x="30" y="40">Heights and incomes</text>
  <text class="height-income-sub" x="30" y="64">Two different shapes.</text>
  <rect class="height-income-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="height-income-name" x="46" y="122">Heights</text>
  <text class="height-income-desc" x="46" y="142">Symmetric.</text>
  <text class="height-income-desc height-income-row height-income-r0" x="46" y="182">Clustered around a centre</text>
  <text class="height-income-desc height-income-row height-income-r1" x="46" y="216">Mean and median agree</text>
  <text class="height-income-desc height-income-row height-income-r2" x="46" y="250">Extremes are close to the middle</text>
  <text class="height-income-desc height-income-row height-income-r3" x="46" y="284">One person changes nothing</text>
  <text class="height-income-desc height-income-row height-income-r4" x="46" y="318">This is roughly normal</text>
  <rect class="height-income-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="height-income-name" x="526" y="122">Incomes</text>
  <text class="height-income-desc" x="526" y="142">Heavy-tailed.</text>
  <text class="height-income-desc height-income-row height-income-r0" x="526" y="182">Long tail to the right</text>
  <text class="height-income-desc height-income-row height-income-r1" x="526" y="216">Mean well above the median</text>
  <text class="height-income-desc height-income-row height-income-r2" x="526" y="250">Extremes are far away</text>
  <text class="height-income-desc height-income-row height-income-r3" x="526" y="284">One person can shift the mean</text>
  <text class="height-income-desc height-income-row height-income-r4" x="526" y="318">This is heavy-tailed</text>
  <text class="height-income-sub" x="30" y="372">One person shifting the mean is the practical test for a heavy tail, and it is why median household income is reported rather than the average.</text>
</svg>
