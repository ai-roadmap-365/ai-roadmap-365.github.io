<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four items.">
  <title>What every report should state</title>
  <style>
    .eda-checklist-bg   { fill: #f8fafc; }
    .eda-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eda-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eda-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eda-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eda-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eda-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eda-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eda-checklist-stage { opacity: 1; }

    .eda-checklist-s0 { animation-delay: 0.00s; }
    .eda-checklist-e0 { animation-delay: 0.00s; }
    .eda-checklist-s1 { animation-delay: 1.28s; }
    .eda-checklist-e1 { animation-delay: 1.28s; }
    .eda-checklist-s2 { animation-delay: 2.56s; }
    .eda-checklist-e2 { animation-delay: 2.56s; }
    .eda-checklist-s3 { animation-delay: 3.84s; }
    .eda-checklist-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eda-checklist-conn  { animation: eda-checklist-trace 6.4s ease-in-out infinite; }
      .eda-checklist-stage { animation: eda-checklist-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eda-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eda-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eda-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eda-checklist-stage { animation: eda-checklist-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eda-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eda-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eda-checklist-bg" width="980" height="322"/>
  <text class="eda-checklist-h1"  x="30" y="40">What every report should state</text>
  <text class="eda-checklist-sub" x="30" y="64">Four items.</text>
  <g class="eda-checklist-stage eda-checklist-s0">
    <rect class="eda-checklist-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eda-checklist-step" x="44" y="142">01</text>
    <text class="eda-checklist-name" x="70" y="142">Where the data came from, and when it was taken</text>
    <text class="eda-checklist-desc" x="44" y="166">Which version, precisely.</text>
  </g>
  <line class="eda-checklist-line eda-checklist-conn eda-checklist-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eda-checklist-tip)"/>
  <g class="eda-checklist-stage eda-checklist-s1">
    <rect class="eda-checklist-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eda-checklist-step" x="280" y="142">02</text>
    <text class="eda-checklist-name" x="306" y="142">What was excluded, and why</text>
    <text class="eda-checklist-desc" x="280" y="166">Rows, periods, categories.</text>
  </g>
  <line class="eda-checklist-line eda-checklist-conn eda-checklist-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eda-checklist-tip)"/>
  <g class="eda-checklist-stage eda-checklist-s2">
    <rect class="eda-checklist-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eda-checklist-step" x="516" y="142">03</text>
    <text class="eda-checklist-name" x="542" y="142">What was assumed to make the analysis work</text>
    <text class="eda-checklist-desc" x="516" y="166">Including cleaning decisions.</text>
  </g>
  <line class="eda-checklist-line eda-checklist-conn eda-checklist-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eda-checklist-tip)"/>
  <g class="eda-checklist-stage eda-checklist-s3">
    <rect class="eda-checklist-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eda-checklist-step" x="752" y="142">04</text>
    <text class="eda-checklist-name" x="778" y="142">And how uncertain the findings are</text>
    <text class="eda-checklist-desc" x="752" y="166">Which is not optional.</text>
  </g>
  <text class="eda-checklist-sub" x="30" y="304">Recording exactly which version of the data was used answers most of the questions that arise months later when the numbers no longer reconcile.</text>
</svg>
