terms:
  - term: EDA report
    definition: >-
      A document that turns an exploratory analysis into an argument: one stated question, the decision it
      feeds, a conclusion placed above the evidence, a small number of figures each answering a stated
      question and captioned with the claim it supports, the caveats, and the provenance. It is not a
      cleaned-up notebook; a notebook records a search, and a search has a trail rather than a conclusion.
  - term: claim-carrying caption
    definition: >-
      A caption that states something a reader could disagree with, so the figure either supports it or
      fails to. "Revenue by region" is a label -- it restates the axes and asserts nothing. "Three regions
      grew while the West fell 8.6%" is a claim: it names a direction, a size and a comparison, and a
      reader who thinks it is wrong knows exactly where to look.
  - term: the "so what" test
    definition: >-
      The question asked of every section and every figure before it is allowed into a report: if this
      were deleted, would the decision change? Not "is it interesting" -- everything you looked at is
      interesting to you -- and not "is it correct", which is the entry price. Most sections fail, and
      failing is the normal outcome rather than a sign of poor work.
  - term: honest omission
    definition: >-
      A single line recording something you looked at and found nothing in, kept in the report after the
      chart itself has been deleted. It costs one line, stops the next reader repeating your dead end, and
      answers the question "did they check that?" with a fact instead of an assumption.
  - term: orphan figure
    definition: >-
      An image file written into a report's output directory that the report's text never links to. It is
      either a figure you meant to discuss and forgot, or a leftover from an earlier run that will mislead
      whoever opens the directory next. The lab detects one by comparing the image links in the rendered
      Markdown against the files actually on disk.
  - term: point estimate
    definition: >-
      A single computed number with no statement of how firm it is -- "revenue fell 8.6%". Reported alone
      it is an assertion rather than a finding, because a reader cannot tell whether it would survive a
      different sample. In this lesson's generator a point estimate must be accompanied by an interval or
      by an explicit note saying why no interval is available.
  - term: percentile bootstrap interval
    definition: >-
      An interval built by resampling the observed data with replacement many times, recomputing the
      statistic on each resample, and taking the 2.5th and 97.5th percentiles of the resulting
      distribution. Day 118's confidence interval obtained by simulation rather than by formula, which is
      what you reach for when the statistic has no tidy standard error -- a ratio of two window means, for
      instance.
  - term: data fingerprint
    definition: >-
      A short cryptographic hash of the input data, recorded in the report's provenance section in place of
      a timestamp. It answers "which data produced this document?", lets two people confirm they hold the
      same input without either sending it, and is the reason two runs of the generator produce
      byte-identical output.
  - term: byte-identical output
    definition: >-
      The property that two runs of a generator over the same input produce files that are equal
      byte for byte. Achieved by removing every clock reading, hostname and unseeded random draw from the
      output. For the Markdown in this lab it holds generally; for the figure PNGs it was measured across
      two runs on one machine only, because matplotlib rasterises text through FreeType and a different
      font stack can produce different pixels from identical code.
  - term: candidate figure
    definition: >-
      A chart made during exploration that has not yet earned a place in the report. In the lab it is a
      `Candidate` object carrying a slug, an optional question, and -- if it has no question -- a
      `dropped_because` line. Twelve go into the pipeline and five come out, a survival rate of 41.7%.
  - term: accessibility contract
    definition: >-
      A build check that a report's figures must pass rather than a guideline their author is asked to
      remember: every mark drawn in a colour from a colourblind-safe palette, and both axes labelled. It
      is deliberately incomplete -- it checks neither contrast ratios nor whether meaning is encoded by
      colour alone, and redundant encoding remains the real fix.
  - term: inverted pyramid
    definition: >-
      The ordering that puts the conclusion nearest the top and the machinery nearest the bottom, so each
      band is read by fewer people than the one above it. It is the exact reverse of the order in which
      the analyst discovered things, which is why it has to be imposed deliberately rather than falling
      out of how the work was done.
  - term: literate programming
    definition: >-
      Donald Knuth's 1984 idea that a program should be written as a document for humans with the code
      embedded in the explanation. It reached statistics through Sweave (Friedrich Leisch, 2002), then
      knitr (Yihui Xie, 2012) and R Markdown, and then Quarto (Posit, 2022) -- the lineage behind every
      tool that renders prose and computed output from one source.
  - term: model card
    definition: >-
      A short structured document describing a machine-learning model's intended use, evaluation and
      limitations, introduced by Margaret Mitchell and colleagues at the FAT* conference in 2019.
      Structurally it is this lesson's report with a different subject, and it fails the same way: pages of
      metrics with no stated claim, so a reader cannot tell whether the model is fit for their purpose.
