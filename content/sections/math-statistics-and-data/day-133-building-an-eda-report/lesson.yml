id: D133
day: 133
slug: building-an-eda-report
title: 'Building an EDA Report'
section: math-statistics-and-data
subsection: data-analysis
week: 19
learning_promise: >-
  After this lesson you will be able to turn an exploration into an argument: state the one question a
  report answers and the decision it feeds, put the conclusion above the evidence rather than where you
  happened to finish, and write captions that carry a claim a reader could disagree with instead of labels
  that restate the axes. You will build a working report generator that refuses to add a figure with no
  stated question, refuses a caption with no number and no comparison, computes every number in its prose
  from the data so the text cannot drift away from the figures, detects an orphan figure, and demands that
  every reported estimate carry a 95% interval or an explicit note saying why none is available. You will
  apply a three-gate "so what" filter to twelve candidate figures and watch five survive -- keeping each
  discarded one as a single line of honest omission so the next reader does not repeat the dead end. You
  will make the whole document reproducible in Day 126's sense, byte-identical across two runs because its
  provenance is a fingerprint of the input rather than a timestamp of the run, and you will turn Days 127
  and 132 into a build check that fails a red-against-green chart with unlabelled axes. You will also be
  able to say precisely what a crude claim-detecting heuristic can and cannot do, in both of its failure
  directions, and why the honest statement of its limits is worth more than a check that pretends to more.
objectives:
  - 'State the one question a report answers and the decision it feeds, and explain why a figure whose question you cannot state does not belong in the report'
  - 'Write a caption that carries a claim rather than a label, and explain why "revenue by region" gives a reader nothing to disagree with'
  - 'Build a report generator that raises an error on a figure with no stated question and on a caption with no comparative or quantitative element'
  - 'Explain both failure directions of a crude claim-detecting heuristic -- it passes a false claim and refuses a real one -- and say exactly what such a check does buy you'
  - 'Generate prose whose numbers are computed from the data, and prove that changing one input value changes the rendered sentence'
  - 'Detect an orphan figure: an image written to disk that the text never refers to'
  - 'Require every reported estimate to carry a bootstrap interval or an explicit note saying why none is available, and treat that note as a finding rather than a gap'
  - 'Order a document for the reader -- conclusion above evidence, caveats findable rather than buried -- and build the conclusion out of the captions so the two cannot drift apart'
  - 'Make a report byte-identical across two runs by putting a fingerprint of the input where a timestamp would otherwise go, and state precisely what that guarantee covers for the figure files and what it does not'
  - 'Apply the "so what" test to every candidate figure, measure the survival rate, and keep each discarded one as a one-line null result'
  - 'Turn a colourblind-safe palette and labelled axes into a build check, and name the two accessibility failures such a check still cannot catch'
  - 'Choose among a plain Python Markdown generator, Jupyter with nbconvert, Quarto and pandas Styler for a given reporting job, stating which were actually run in this lesson and which were described from documentation only'
prerequisites:
  - 'Day 126 -- the reproducible cleaning pipeline, whose idempotence, contracts and manifest this day applies to prose rather than to data, and whose out-of-order-execution hazard explains why nbconvert needs its --execute flag'
  - 'Day 117 -- sampling and the standard error, and Day 118 -- hypothesis tests and confidence intervals; every interval quoted in this day''s report is a percentile bootstrap'
  - 'Day 127 -- why we visualize and how to choose a chart type, including the perceptual ranking this day cites when a table beats a chart'
  - 'Day 128 -- matplotlib''s Figure/Axes/Artist object model; the accessibility check reads colours straight off the artists'
  - 'Day 130 -- distributions and relationships, especially the discipline of plotting the shape before computing a coefficient'
  - 'Day 132 -- chart honesty and disclosure, which this day turns from a rule into a check that runs'
  - 'Week 18''s pandas pipeline, referenced rather than re-derived: profiling, the damage report and the manifest'
  - 'A working python3 on your PATH; the lab needs the standard library plus matplotlib, seaborn, pandas, NumPy and pytest'
reading_time_minutes: 50
practical_time_minutes: 50
