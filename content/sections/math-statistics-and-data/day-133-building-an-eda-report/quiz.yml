questions:
  - question: >-
      A notebook contains thirty figures. Every axis is labelled, every aggregation is correct, and no
      chart misleads. A reader reaches the end unable to say what was found. What is the actual defect?
    options:
      - The figures are too small to read at the resolution they were exported at
      - There are too many figures; any document with more than ten charts is unreadable
      - Exploration was shipped as communication -- the figures are correct but no claim is attached to any of them
      - The charts use the wrong chart types for the questions being asked
    answer_index: 2
    explanation: >-
      Nothing in the notebook is wrong, which is exactly why the defect is easy to miss. The document is a
      complete record of a search, and a search has a trail rather than a conclusion. Reducing the count
      would not fix it either: five uncaptioned figures fail the same way three fewer times. The fix is
      that every figure must answer a stated question and the answer must be written down beside it.
  - question: >-
      Which of these captions carries a claim, in the sense this lesson means?
    options:
      - '"Figure 4: three regions grew across the pricing change while the West fell 8.6%"'
      - '"Figure 4: revenue by region"'
      - '"Figure 4: revenue by region over time"'
      - '"Figure 4: monthly revenue, all four regions, direct channel only"'
    answer_index: 0
    explanation: >-
      A claim states something a reader could disagree with, so the chart can either support it or fail
      to. The other three restate the axes in progressively more words; a reader has no way to check them
      because they never assert anything. The strongest form names the direction, the size and what the
      size is relative to, which is what the first option does.
  - question: >-
      The lab's `carries_claim` check requires a digit, a percent sign, or one of a fixed list of
      comparative words. Which statement about it is accurate?
    options:
      - It verifies that the caption is consistent with the data behind the figure
      - It guarantees the caption is true, since only a true claim would contain a number
      - It is complete for English, because the list of comparative words is exhaustive
      - It detects only whether a claim was made; it passes false claims and refuses some real ones
    answer_index: 3
    explanation: >-
      Measured in this lab, both failure directions are real and both are asserted in its tests. It passes
      "revenue doubled in every region" on data where revenue halved, because it never reads the data. It
      also refuses "revenue tripled in all four regions", a perfectly good claim written with a word that
      is not on the list. What it genuinely buys is narrow and still worth having: it makes the ABSENCE of
      a claim impossible to ship by accident.
  - question: >-
      A report's provenance section records a `sha256` fingerprint of the input data instead of the date
      and time the report was generated. What does that buy?
    options:
      - It compresses the input so the report file stays small
      - Two runs over the same input produce byte-identical output, and a reader can confirm which data produced the document
      - It proves the analysis is correct, because a hash cannot be forged
      - It replaces the need for a caveats section, since the data is now documented
    answer_index: 1
    explanation: >-
      A timestamp tells you when someone ran something, which is rarely the question. A fingerprint tells
      you WHICH data produced this document, and lets two people confirm they hold the same input without
      either sending it. It is also the reason the document is reproducible: a clock reading in the output
      would make every run differ from the last, so the byte-identity assertion in exercise 6 would be
      impossible.
  - question: >-
      An analysis reports that the East's revenue is 3.3 times its usual level, and the figure rests on a
      single month. What should the report say about uncertainty?
    options:
      - State plainly that this is one observation and no sampling interval is available for it
      - Bootstrap the single value to produce an interval, so the report is consistent
      - Omit the number entirely, since a figure without an interval cannot be reported
      - Quote the interval from a different, larger estimate in the same report as an approximation
    answer_index: 0
    explanation: >-
      The explicit "no interval available, and here is why" note is not a loophole -- it is the honest
      case, and it is more useful to a reader than either a fabricated interval or silence. It also tells
      the reader what to do next: a single spike belongs with whoever can explain it, while a level change
      belongs in the forecast. Bootstrapping one point returns that point, which would dress a
      non-measurement up as a measurement.
  - question: >-
      Why does the lab build its conclusion section by concatenating the panels' captions rather than
      writing a separate summary?
    options:
      - Because Markdown cannot represent a summary paragraph and a figure list in the same document
      - To reduce the file size of the rendered report
      - It is purely a convenience; a hand-written summary would be equally safe
      - Because the caption already carries the claim, so a conclusion built from captions cannot drift away from the figures
    answer_index: 3
    explanation: >-
      A separately written summary is a second copy of the findings, and second copies drift -- someone
      updates the figure and not the summary, or the data refreshes and the summary does not. Building the
      conclusion out of the captions makes the drift structurally impossible, and it is only possible
      because the caption rule forced each caption to be a claim in the first place.
  - question: >-
      Exercise 6 asserts that two renders of the same input produce byte-identical PNG files. What is the
      honest scope of that assertion?
    options:
      - PNG bytes are identical for any correct matplotlib install anywhere, since the code is deterministic
      - It holds for two runs on the same machine in the same session; different machines can legitimately produce different bytes
      - It holds only if the figures contain no text at all
      - It is a weaker claim than the Markdown byte-identity, so the lab does not actually test it
    answer_index: 1
    explanation: >-
      matplotlib rasterises text through FreeType, so a different FreeType build or a different set of
      installed fonts can produce different pixels from identical code. The lab does test the PNG bytes,
      and they matched here -- but only across two runs on one machine, which is where the guarantee holds.
      The Markdown byte-identity is the stronger and more portable claim precisely because Markdown
      contains no rendered glyphs.
  - question: >-
      You spend an afternoon checking whether missing values cluster by month. They do not. What belongs in
      the report?
    options:
      - The chart, with a caption saying no pattern was found, so the reader can verify it
      - Nothing at all -- a figure that answers no question fails the "so what" test and should leave no trace
      - One line saying you checked and found nothing, with the chart deleted
      - The chart moved to an appendix, where it does not interrupt the argument
    answer_index: 2
    explanation: >-
      Both halves matter. The chart fails the "so what" test and goes, because a reader has to interpret
      every figure you show them and this one changes no decision. The sentence stays, because otherwise
      the next person spends the same afternoon on the same check -- and because a reader wondering "did
      they look at that?" gets an answer instead of an assumption. Deleting the trace entirely is the one
      option that costs someone else real time.
