visuals:
  - id: report-arc-architecture
    file: assets/report-arc-architecture.svg
    type: diagram
    title: >-
      The arc of an EDA report as an inverted pyramid -- question and decision, conclusion, evidence,
      caveats and omissions, provenance -- each band annotated with what belongs there and what commonly
      goes wrong
    alt: >-
      Diagram: the arc of an exploratory data analysis report drawn as an inverted pyramid of five stacked
      bands, widest at the top and narrowing downward. The top band, question and decision, holds the one
      question the report answers and the decision it feeds, annotated that what belongs there is the
      question, the decision and who acts on it, and that what goes wrong is a report with no stated
      question, which becomes a gallery nobody can tell the purpose of. The second band, conclusion, holds
      what was found, how confident, and what would change it, annotated that each finding belongs there
      with its interval in one sentence, and that what goes wrong is the conclusion being left at the bottom
      where the analyst finished rather than at the top where the reader starts. The third band, evidence,
      holds one figure per question with each caption carrying the claim it supports, annotated that the
      figures that survived the filter belong there, numbered, each beside a caption a reader could disagree
      with, and that what goes wrong is thirty correct figures with not one claim attached. The fourth band,
      caveats and omissions, holds the limits and what was looked at and found nothing in, annotated that
      small samples, confounders and one-line null results belong there, and that what goes wrong is caveats
      being cut because they weakened the story. The narrow bottom band, provenance, holds which data, which
      code and how to rebuild it, annotated that a fingerprint of the input and the regenerating command
      belong there, and that what goes wrong is a timestamp where a fingerprint should be so nobody can tell
      which data produced the document. A closing caption explains that the pyramid is inverted on purpose
      because the analyst discovered the bands from the bottom up while the reader needs them in exactly the
      opposite order
    description: >-
      A static architecture diagram. Five trapezoidal bands stack into an inverted pyramid, widest at the
      top and narrowing to the base, because the top band is read by the most people and the bottom by the
      fewest. The bands are, in order: question and decision; conclusion; evidence; caveats and omissions;
      provenance. Each band carries its name and a one-line summary inside it, and a rule leads out to the
      right where two annotations sit -- a green "belongs here" line naming what the band is for, and a red
      "goes wrong" line naming the failure that band exists to prevent. A closing caption explains the
      inversion: the analyst discovered the bands from the bottom up, data first and question last, while
      the reader needs them in exactly the opposite order, and the report is written for the reader.
  - id: figure-lifecycle-flow
    file: assets/figure-lifecycle-flow.svg
    type: flow-animated
    title: >-
      The life of a candidate figure -- twelve enter three gates, seven are discarded into a tray of
      one-line null results, five reach the report with claim-carrying captions
    alt: >-
      Diagram: twelve candidate figures enter a filter pipeline from the left as small numbered tiles and
      only five reach the report on the right. Each candidate passes three gates in order. Gate one asks
      whether the figure answers a stated question, and four tiles are turned aside into a discard tray
      labelled kept as one line each. Gate two asks whether the caption carries a claim a reader could
      disagree with, and two more tiles are turned aside. Gate three is the so-what filter, asking whether
      the decision would move if this figure were removed, and one more tile is turned aside. The five
      survivors continue into a report panel on the right where each is drawn as a numbered figure with a
      caption beneath it stating a claim with a number in it. Counts of four dropped, two dropped and one
      dropped are printed beside the three downward arrows into the tray, and the tray is labelled seven
      discarded and kept as one line each, with one example null-result sentence shown in full. A wire with
      marching dashes carries a travelling token left to right along the main path and each gate lights up
      briefly in sequence. A bottom caption states that with motion disabled every tile, gate, count,
      caption and survivor is already drawn in its final position, that the animation only shows the order
      things happen in, and that in the candidate list of this lesson all seven fall at gate one so the
      three-gate split shown is the general shape rather than one run
    description: >-
      An animated flow diagram, fully readable as a still image. Twelve candidate tiles sit on the left
      under the heading "12 candidates". A dashed wire with marching ants carries a travelling token left to
      right through three gates: gate 1 asks whether the figure answers a stated question, gate 2 asks
      whether the caption carries a claim, and gate 3 is the "so what" filter. Red arrows drop out of each
      gate into a tray at the bottom, annotated 4 dropped, 2 dropped and 1 dropped, and the tray is labelled
      "7 discarded -- and kept as one line each" with one real null-result sentence printed in full. Five
      survivors enter a report panel on the right, each drawn as a numbered figure with a caption beneath
      it. The three gates light up in sequence and three red tokens fall from the gates into the tray. The
      three-gate split of 4, 2 and 1 is the general shape of the method; the lesson states plainly that in
      its own twelve-candidate list all seven fall at gate 1, and the diagram carries that note in its own
      bottom line. A prefers-reduced-motion block sets every animation to none, turns the marching dashes
      into a solid line, freezes the travelling token at the start of its path and freezes every falling
      token at its landed position in the tray, while every tile, gate, count, caption and survivor stays
      fully drawn and fully legible.
