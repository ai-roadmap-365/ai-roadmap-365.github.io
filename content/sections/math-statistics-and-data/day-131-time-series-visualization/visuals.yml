visuals:
  - id: timeseries-anatomy-architecture
    file: assets/timeseries-anatomy-architecture.svg
    type: diagram
    title: 'Anatomy of a time series chart -- trend, seasonal cycle, an annotated event, a genuine gap, and a trailing window''s lag against a centred window over the same peak'
    alt: 'Diagram in two stacked panels. The top panel draws one time series with a rising trend, a repeating seasonal wiggle riding on it, a vertical dashed line marking an annotated event, and a real gap where the line stops and resumes later with nothing drawn across it. The bottom panel isolates one peak and draws three curves over it: the true raw shape, a centred rolling mean that peaks in exactly the same place, and a trailing rolling mean whose peak is visibly shifted later, with a labelled arrow measuring that lag'
    description: >-
      A static architecture diagram in two stacked panels. The top panel, titled "Trend, season, event
      and a genuine gap", shows a dashed straight trend guide rising left to right under a solid blue
      series line that wiggles above and below it in a repeating seasonal pattern; one full cycle is
      bracketed and labelled. Partway across, a shaded red-bordered box marks a stretch with no line
      drawn inside it at all, labelled "genuine gap -- no observation here -- nothing is drawn across
      it", with a dot at the last point before the gap and the first point after it. Further right, a
      dashed vertical red line crosses the whole panel with a small callout box labelled "Annotated
      event: product launch". The bottom panel, titled "Same peak, two rolling means", plots a dashed
      grey raw peak shape and two solid curves over it: a green curve whose peak lines up exactly with
      the raw peak's own peak, and a red curve whose peak is visibly shifted to the right of it. Two
      dashed vertical guide lines mark the true peak position and the shifted red peak position, joined
      by a horizontal double-headed arrow labelled "trailing window's peak arrives LATE". A legend box
      states plainly that the centred window's peak lands on the same date as the true peak, while the
      trailing window's peak is shifted later by roughly half the window.
  - id: aliasing-flow
    file: assets/aliasing-flow.svg
    type: flow-animated
    title: 'Aliasing -- a fast underlying cycle sampled too slowly assembles into a slow wave that does not exist in the source signal'
    alt: 'Diagram: a fast cosine cycle runs across the top panel. A comb of eight vertical sampling marks, spaced every fifth day, picks out one point at a time; a highlighted band sweeps left to right across the panel to show the comb sliding along the signal, and each sampling mark and its dot light up in turn as the sweep passes it. The eight sampled values, connected in the bottom panel in the order they were taken, assemble into a slow, smooth wave that is not present anywhere in the fast signal above it and exists only because of the interval between samples. A caption states the true period is 4 days, the sampling interval is 5 days, and the observed period is 20 days. With motion disabled, every sampling mark and dot is already lit, the sweeping band rests at its start position, and the full slow wave is drawn as a still, complete curve'
    description: >-
      An animated flow diagram, fully readable as a still image, in two stacked panels. The top panel,
      titled "True signal -- a 4-day cycle", shows a fast grey cosine curve running the full width, with
      eight blue dashed vertical tick marks and matching dots spaced every fifth day; a faint translucent
      blue band sweeps left to right across the panel in a loop, and as it passes each tick and dot they
      briefly flash red and back to blue in sequence, timed to the sweep's position. A caption reads
      "sampling comb: one reading every 5 days, sweeping left to right". A fact box states "True period:
      4 days / Sampling interval: 5 days / Observed period: 20 days", alongside two lines explaining that
      nothing in the true signal repeats every 20 days -- only the samples land back at the same phase
      every four of them. The bottom panel, titled "What the samples assemble into -- a false slow wave",
      draws a smooth red line connecting the same eight sampled values in the order they were taken,
      spread evenly across the full width; the line rises and falls exactly like a slow, gentle wave. Each
      of its eight points pulses briefly, timed to match the corresponding tick above it. A closing caption
      states this bottom curve is exactly what a weekly-style reading of the faster true cycle above would
      show on a dashboard. A prefers-reduced-motion block freezes every tick, dot and the sweeping band at
      their fully-lit resting state, with the whole slow wave already drawn.
