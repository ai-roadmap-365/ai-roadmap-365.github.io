terms:
  - term: DatetimeIndex
    definition: >-
      A pandas index whose entries are real timestamps rather than plain integers or strings. Produced by
      passing parse_dates to a loader (Day 121) or by pd.date_range, it is what unlocks date-string
      slicing, resample and rolling by time, and axis formatting that understands months and years -- none
      of which a RangeIndex or a string column can do.
  - term: resample
    definition: >-
      A pandas method that groups a DatetimeIndex-ed series or frame into fixed time buckets (for example
      one bucket per calendar month) and then applies an aggregation to each bucket, extending Day 123's
      groupby from a fixed set of category labels to buckets defined purely by elapsed time.
  - term: aliasing
    definition: >-
      The phenomenon in which sampling a periodic signal below its own frequency does not simply lose
      detail but manufactures a specific, different, false period in the sampled data -- a pattern that
      exists nowhere in the underlying signal and is entirely a product of the sampling interval chosen.
  - term: rolling window
    definition: >-
      A computation (commonly a mean) applied to a sliding span of consecutive observations rather than to
      the whole series at once, smoothing short-term noise while preserving slower movement. pandas'
      rolling() method supports both trailing (the default) and centred windows.
  - term: trailing window
    definition: >-
      A rolling window whose span, at any given point in time, covers only observations up to and
      including that point -- never any future observation. Because it can only "look backward", a
      trailing window's own peak necessarily lags the true peak it is summarizing by roughly half the
      window's width.
  - term: centred window
    definition: >-
      A rolling window (rolling(..., center=True) in pandas) whose span is positioned symmetrically around
      each point in time, using both past and future observations relative to it. A centred window's peak
      lines up with the true peak exactly, at the cost of being unusable in a live, real-time setting where
      future observations do not yet exist.
  - term: reindex
    definition: >-
      A pandas operation that conforms a series or frame to a new, explicitly given index, introducing NaN
      for any position present in the new index but absent from the original. Reindexing a gapped time
      series to its full expected date range is what converts a silently missing row into an explicit,
      visible NaN.
  - term: spaghetti chart
    definition: >-
      A single set of axes carrying so many overlaid line series that individual lines become impossible
      to distinguish by color or position alone. The practical fix past a small series count is small
      multiples -- one panel per series, sharing axes for comparability.
  - term: small multiples
    definition: >-
      A grid of individually small charts, one per category or series, sharing the same axis scales so
      they remain directly comparable. The standard remedy for a spaghetti chart once the series count
      exceeds roughly five or six lines on one set of axes.
  - term: year-over-year overlay
    definition: >-
      A chart that plots multiple years of a seasonal series on a shared calendar axis (day or month of
      year) so that comparable periods -- the same month or the same day -- line up directly across years.
      Correct alignment requires matching by calendar month and day, not by raw ordinal day-of-year, or a
      leap year silently shifts every date after Feb 29 out of alignment.
  - term: Daylight Saving Time (DST) boundary
    definition: >-
      The specific date on which a timezone observing Daylight Saving Time shifts its clocks forward
      (losing one hour, producing a 23-hour local day) or backward (repeating one hour, producing a
      25-hour local day). A daily resample of hourly, timezone-aware data spans exactly one such day of
      each kind per year in a DST-observing zone.
  - term: log-scaled axis
    definition: >-
      An axis on which equal visual distances represent equal multiplicative (percentage) changes rather
      than equal additive changes. A series growing by a constant percentage every period is collinear (a
      straight line) on a log-scaled axis, while constant additive (linear) growth is not; Day 128
      additionally established that a zero value has no logarithm and silently vanishes from a log axis.
