<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four ways.">
  <title>Where time series plots mislead</title>
  <style>
    .ts-pitfalls-bg   { fill: #f8fafc; }
    .ts-pitfalls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-pitfalls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-pitfalls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-pitfalls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-pitfalls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-pitfalls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ts-pitfalls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ts-pitfalls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ts-pitfalls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ts-pitfalls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ts-pitfalls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ts-pitfalls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ts-pitfalls-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ts-pitfalls-stage { opacity: 1; }

    .ts-pitfalls-s0 { animation-delay: 0.00s; }
    .ts-pitfalls-e0 { animation-delay: 0.00s; }
    .ts-pitfalls-s1 { animation-delay: 1.28s; }
    .ts-pitfalls-e1 { animation-delay: 1.28s; }
    .ts-pitfalls-s2 { animation-delay: 2.56s; }
    .ts-pitfalls-e2 { animation-delay: 2.56s; }
    .ts-pitfalls-s3 { animation-delay: 3.84s; }
    .ts-pitfalls-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ts-pitfalls-conn  { animation: ts-pitfalls-trace 6.4s ease-in-out infinite; }
      .ts-pitfalls-stage { animation: ts-pitfalls-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ts-pitfalls-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ts-pitfalls-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ts-pitfalls-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ts-pitfalls-stage { animation: ts-pitfalls-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ts-pitfalls-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ts-pitfalls-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ts-pitfalls-bg" width="980" height="322"/>
  <text class="ts-pitfalls-h1"  x="30" y="40">Where time series plots mislead</text>
  <text class="ts-pitfalls-sub" x="30" y="64">Four ways.</text>
  <g class="ts-pitfalls-stage ts-pitfalls-s0">
    <rect class="ts-pitfalls-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ts-pitfalls-step" x="44" y="142">01</text>
    <text class="ts-pitfalls-name" x="70" y="142">A truncated vertical axis exaggerating changes</text>
    <text class="ts-pitfalls-desc" x="44" y="166">Which is the classic distortion.</text>
  </g>
  <line class="ts-pitfalls-line ts-pitfalls-conn ts-pitfalls-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ts-pitfalls-tip)"/>
  <g class="ts-pitfalls-stage ts-pitfalls-s1">
    <rect class="ts-pitfalls-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ts-pitfalls-step" x="280" y="142">02</text>
    <text class="ts-pitfalls-name" x="306" y="142">An aggregation interval chosen to suit the story</text>
    <text class="ts-pitfalls-desc" x="280" y="166">Weekly hides what daily shows.</text>
  </g>
  <line class="ts-pitfalls-line ts-pitfalls-conn ts-pitfalls-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ts-pitfalls-tip)"/>
  <g class="ts-pitfalls-stage ts-pitfalls-s2">
    <rect class="ts-pitfalls-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ts-pitfalls-step" x="516" y="142">03</text>
    <text class="ts-pitfalls-name" x="542" y="142">Missing periods drawn as continuous</text>
    <text class="ts-pitfalls-desc" x="516" y="166">Implying data that does not</text>
    <text class="ts-pitfalls-desc" x="516" y="182">exist.</text>
  </g>
  <line class="ts-pitfalls-line ts-pitfalls-conn ts-pitfalls-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ts-pitfalls-tip)"/>
  <g class="ts-pitfalls-stage ts-pitfalls-s3">
    <rect class="ts-pitfalls-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ts-pitfalls-step" x="752" y="142">04</text>
    <text class="ts-pitfalls-name" x="778" y="142">And heavy smoothing hiding the variation</text>
    <text class="ts-pitfalls-desc" x="752" y="166">Which may be the point of</text>
    <text class="ts-pitfalls-desc" x="752" y="182">interest.</text>
  </g>
  <text class="ts-pitfalls-sub" x="30" y="304">The choice of aggregation interval is the most underappreciated lever here, since the same series can look stable or volatile depending on the bucket size.</text>
</svg>
