questions:
  - question: >-
      A daily series has a real fourteen-day gap where a sensor was offline. It is plotted twice: once
      against `range(len(df))`, once against the parsed datetime column. What happens to the gap in each
      case?
    options:
      - 'The index plot hides the gap; the datetime plot shows it'
      - Both plots show the gap clearly, since matplotlib always detects missing dates automatically
      - The index plot shows the gap; the datetime plot hides it
      - Neither plot can show a gap unless the missing rows are explicitly filled with NaN first
    answer_index: 0
    explanation: >-
      Plotted against a plain row index, consecutive rows are always exactly one unit apart regardless of
      what dates they actually represent -- the fourteen-day gap is completely invisible. Plotted against
      the parsed datetime, the x-position of each point is its real calendar date, so the gap shows up as
      one measurably wider step among an otherwise uniform run of one-day steps. No NaN-filling is needed
      for the datetime axis to reveal it; the parsed dates alone are enough.
  - question: >-
      The same ninety-day series is resampled to monthly `.mean()`, `.sum()` and `.last()`. What should you
      expect about the three results for the same month?
    options:
      - All three are always identical, since resample always applies the same underlying computation
      - They are three different, equally true numbers, each answering a different question about that month
      - Only `.sum()` and `.mean()` can differ; `.last()` always equals `.mean()` for a monotonic series
      - Resampling to more than one aggregation at once is not supported by pandas
    answer_index: 1
    explanation: >-
      Mean, sum and last are three different statistics computed from the same underlying rows, and each
      answers a different question: sum answers "how much total activity happened", mean answers "what was
      a typical value", and last answers "what was the most recent reading by month's end". Choosing an
      aggregation is a claim about which of those questions the chart is meant to answer, not a neutral
      technical step.
  - question: >-
      A signal with a true period of 4 days is sampled every 5 days. What does the resulting downsampled
      series show?
    options:
      - A smoother, lower-resolution version of the same 4-day cycle
      - A flat, constant series, since 5 does not evenly divide 4
      - 'A false, longer period that is not in the true signal'
      - The same 4-day period, simply drawn with fewer points per cycle
    answer_index: 2
    explanation: >-
      This is aliasing: sampling below a signal's true frequency does not just reduce resolution, it can
      manufacture a completely different, false period. For a 4-day true cycle sampled every 5 days, the
      sampled sequence repeats every 4 samples -- 20 real days -- a spurious period five times longer than
      the real one, with nothing in the source signal actually varying on a 20-day cycle.
  - question: >-
      A 30-day rolling mean is drawn over a series with one sharp peak, using pandas' default (trailing)
      window. Where does the rolling mean's own peak land relative to the true peak?
    options:
      - Exactly on the true peak, because rolling averages are always centred by default
      - Roughly 15 days before the true peak
      - The rolling mean has no well-defined peak of its own
      - Roughly 15 days after the true peak
    answer_index: 3
    explanation: >-
      pandas' rolling() defaults to a trailing window, which at any point only looks backward over the
      last 30 observations. The trailing mean cannot report its own maximum until the true peak has fully
      entered that backward-looking window, which happens roughly half the window's width -- about 15
      days for a 30-day window -- after the real peak occurred. A centred window (center=True) does not
      have this problem.
  - question: >-
      A series has one row physically dropped (not present in the DataFrame at all) versus a second version
      of the same series with that row's value set to NaN instead. How does matplotlib draw each one?
    options:
      - The missing-row version connects straight across the gap; the NaN version breaks the line there
      - Both are drawn identically, since matplotlib treats a missing row the same as a NaN
      - The missing-row version shows a visible break; the NaN version connects straight across it
      - Neither can be plotted without first calling dropna() or fillna()
    answer_index: 0
    explanation: >-
      matplotlib only knows about the data points it is actually given. A physically absent row simply
      means one fewer point exists, so the line is drawn as one continuous segment connecting the points on
      either side of the gap -- nothing marks that anything is missing. An explicit NaN value, by contrast,
      genuinely breaks the drawn line at that position. Reindexing a series to its full expected date range
      converts the first case into the second, which is the honest way to plot it.
  - question: >-
      Two years of daily data are aligned for a year-over-year overlay: one is a leap year (366 days), the
      other is not (365). Aligning by raw ordinal day-of-year instead of by calendar (month, day) produces
      what result?
    options:
      - No difference at all -- ordinal day-of-year and calendar date always agree
      - 'Every date after Feb 29 is off by one day'
      - Every date before Feb 29 is misaligned, but dates afterward line up correctly
      - The overlay simply fails to render, since pandas rejects mismatched year lengths
    answer_index: 1
    explanation: >-
      Ordinal day-of-year counts from Jan 1, so Dec 31 is day 366 in a leap year but day 365 in a non-leap
      year -- the same calendar date, two different ordinal numbers. Everything up to and including Feb 28
      lines up fine by either method, but Feb 29 in the leap year has no matching ordinal number in the
      non-leap year, and every date from Mar 1 onward is shifted out of true calendar alignment if compared
      by raw ordinal number instead of by (month, day).
  - question: >-
      A series grows by a constant 5% every period. Plotted on a log-scaled y-axis, what should the result
      look like, and why?
    options:
      - A curve bending upward, because percentage growth always accelerates visually
      - A perfectly flat horizontal line, because percentages are already normalized
      - 'A straight line — a log axis turns growth into steps'
      - The plot cannot be drawn at all if any value in the series is ever exactly zero
    answer_index: 2
    explanation: >-
      A log-scaled axis turns equal multiplicative changes into equal visual (additive) distances. Constant
      percentage growth means the ratio between consecutive values never changes, so the logged values
      increase by the same fixed amount every period -- a straight line. Linear (constant absolute) growth
      does not have this property and shows up as a curve instead, which is exactly why a log axis is the
      practical test for distinguishing compounding from linear growth by eye. (A zero value would indeed
      break a log axis, per Day 128, but that is a separate concern from the shape question here.)
  - question: >-
      Hourly, timezone-aware data for a US city is resampled to daily counts across a Daylight Saving Time
      boundary. What should the count be on the day the clocks move forward in spring?
    options:
      - Always 24, because a calendar day is always 24 hours by definition
      - It depends only on whether the data was stored in UTC or local time, not on the transition itself
      - 25, because the transition duplicates an hour rather than skipping one
      - 23, because the local hour that gets skipped removes one hourly reading from that calendar day
    answer_index: 3
    explanation: >-
      When clocks move forward, one local hour (in the US, typically 2:00-3:00 AM) does not exist that
      day, so an hourly series resampled to daily counts genuinely has only 23 readings for that specific
      calendar day. The corresponding autumn transition, when clocks move back, repeats one local hour and
      produces a 25-hour day instead. Both are real, measurable facts about that day in that timezone, not
      an artifact of how the data happened to be stored.
