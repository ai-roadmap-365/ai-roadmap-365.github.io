title: 'Time Series Visualization'
section: math-statistics-and-data
subsection: data-analysis
week: 19
learning_promise: >-
  After this lesson you will be able to demonstrate that plotting a time series against its row index
  instead of its parsed DatetimeIndex silently erases a real gap in observations; choose between
  resample's mean, sum and last and state which question each answers on the same underlying data;
  construct or recognize aliasing, where downsampling below a signal's true frequency manufactures a
  specific, predictable, false pattern rather than merely losing detail; measure a trailing rolling
  window's lag against a centred window over the same peak; distinguish a physically missing row from an
  explicit NaN and know that only reindexing to the full period makes a gap visible as a gap; read a log
  axis as the test for constant-percentage growth; align two years of daily data by calendar date rather
  than ordinal day-of-year so a leap year does not silently shift every later comparison; choose between
  small multiples and an overlaid spaghetti chart past a stated series-count threshold; and know that a
  daily resample across a Daylight Saving Time boundary produces a real 23-hour or 25-hour day.
objectives:
  - 'Demonstrate that plotting a gapped time series against a plain row index makes a real multi-day outage completely invisible, while plotting the identical data against its parsed datetime reveals the gap as a measurable jump in x-position'
  - 'Resample the same daily series to monthly mean, sum and last, and state in one sentence which question each of the three different, equally true results actually answers'
  - 'Construct a signal with a known short period, downsample it below that frequency, and demonstrate that the result carries a specific, predictable spurious period rather than merely reduced detail -- and explain why a weekly-sampled daily cycle can manufacture a convincing multi-month false trend'
  - 'Measure a trailing rolling window''s lag against the true peak it summarizes, and demonstrate that a centred window of the same size does not lag at all'
  - 'Distinguish a physically absent row from an explicit NaN value, know that matplotlib connects straight across the first but breaks its line at the second, and reindex to the full expected period before plotting so an absence is visible as an absence'
  - 'Read a log-scaled y-axis as the honest test for constant-percentage growth: a straight line means compounding, a curve means it is not -- and recall from Day 128 that a zero value silently vanishes on that same axis'
  - 'Align two years of daily data by calendar month and day rather than by raw ordinal day-of-year, and explain why the ordinal version silently misaligns every date following a leap year''s Feb 29'
  - 'State a concrete threshold for switching from an overlaid spaghetti chart to small multiples, and facet a many-series frame into the correct number of individual panels'
  - 'Annotate a specific event directly on a time axis, and explain why a time series shown without that context invites a reader to invent their own explanation for what happened'
  - 'Explain that a daily resample of hourly data across a Daylight Saving Time boundary produces a real 23-hour or 25-hour day, and state the practical consequence for a per-hour rate computed with a hardcoded 24-hour divisor'
prerequisites:
  - 'Day 121 -- loading and inspecting data, specifically parse_dates, the exact mechanism that turns a plain string column into the DatetimeIndex every section of this lesson depends on'
  - 'Day 123 -- groupby and aggregation, the mechanics this lesson''s resample calls extend directly from a fixed set of groups to groups defined by a time interval'
  - 'Day 127 -- why to visualize and how to choose a chart type; this lesson assumes that decision is already made and focuses on what a time axis specifically can get wrong'
  - 'Day 128 -- matplotlib''s object model (fig, ax = plt.subplots(), the Figure/Axes/Artist hierarchy, testing by asserting on artists, and the fact that a log axis silently drops a zero), all of which this lesson''s artist-level assertions and log-scale section depend on directly'
  - 'A working python3 on your PATH; the lab creates its own virtual environment with pandas 3.0.5 and matplotlib 3.11.1 pinned exactly'
