visuals:
  - id: descent-anatomy-architecture
    file: assets/descent-anatomy-architecture.svg
    type: diagram
    title: 'The anatomy of one gradient-descent step: a current point, the gradient pointing uphill, the scaled step negative eta times the gradient pointing downhill, and the new point closer to the minimum'
    alt: 'Diagram: the anatomy of one gradient-descent step: a current point on a loss surface, the gradient pointing uphill, the scaled step negative eta times the gradient pointing downhill, and the new point closer to the minimum'
    description: 'A static architecture diagram, on a light background, in three panels. The left panel, headed "THE STEP, ON THE LOSS SURFACE", draws a bird''s-eye contour plot of a bowl-shaped loss surface as three concentric rings around a green minimum marker, with a current point x_n marked on the outer ring. An orange arrow labelled gradient of f at x_n runs from x_n outward, away from the minimum, labelled as pointing uphill, the direction that increases loss fastest. A blue arrow labelled negative eta times gradient of f at x_n runs from the same point in roughly the opposite direction but noticeably shorter, landing on a new point labelled x_n+1, with a caption explaining this is the actual step: opposite direction, scaled down by eta. A faint dashed orange line continues the unscaled negative-gradient direction further out, with a small marker and the caption that the unscaled step would have landed there, making the scaling visible by comparison. Captions beneath explain that each ring is a level curve of equal loss, that the gradient is always perpendicular to the level curve pointing toward higher rings, and that repeating the step from x_n+1 walks the point ring by ring toward the minimum. The top-right panel, headed "THE SCALING ETA PERFORMS", shows two horizontal bars: a longer orange bar labelled the raw gradient''s length equal to 1.00, and a shorter blue bar directly beneath it, roughly a third as long, labelled the actual step equal to 0.30 at eta equal to 0.3, with a note that eta only changes the length of the step, never its direction, and a further note that too small an eta gives correct direction but tiny, slow steps while too large an eta can overshoot the minimum and land farther away than it started. The bottom-right panel, headed "THE FOUR PARTS OF ONE STEP", numbers them: 1, x_n, where you are now; 2, the gradient of f at x_n, in orange, which way is uphill from here; 3, negative eta times the gradient, in blue, flip it, scale it by eta, the real move; 4, x_n+1 equals x_n plus the step, then repeat from the new point. A footer band across the full width states the whole rule in bold monospace: x_n+1 equals x_n minus eta times the gradient of f at x_n, described as one line, the whole of gradient descent, repeated until the gradient''s size is small enough.'
  - id: learning-rate-regimes-flow
    file: assets/learning-rate-regimes-flow.svg
    type: flow-animated
    title: 'Three gradient-descent runs from the same start on the same bowl, differing only in learning rate: too small crawls, well chosen arrives in one step, too large walks up the walls and leaves the frame'
    alt: 'Diagram: three gradient-descent runs from the same start on the same bowl, differing only in learning rate: too small crawls, well chosen arrives in one step, too large walks up the walls and leaves the frame'
    description: 'An animated flow diagram, fully readable as a still image, in three side-by-side panels sharing one heading: "Same start, same bowl, three learning rates", with the caption that x0 equals 1, f of x equals 0.5 times 5 times x squared, a equals 5, so 1 over a equals 0.2 and 2 over a equals 0.4, and only eta changes. The left panel, "TOO SMALL, eta equals 0.10", subtitled 0 less than eta less than 1 over a: monotone but crawling, draws a shallow bowl curve with a green minimum marker and four dots creeping inward along a dashed path — step 0 at x equals 1.000, step 1 at x equals 0.500, step 2 at x equals 0.250, step 3 at x equals 0.125 — with a caption that it is still far from 0 after many more steps, correct direction and the right answer eventually, but wastes steps and compute getting there. The middle panel, "WELL CHOSEN, eta equals 0.20 equals 1 over a", subtitled lands exactly on the minimum in one step, draws the same bowl with two dots, step 0 at x equals 1.000 and a bold step 1 at x equals 0.000 marked exact, with captions explaining this only happens at exactly eta equals 1 over a, a coincidence of this one quadratic and not a general property of well chosen, and that most well-chosen rates converge smoothly over several steps rather than in exactly one. The right panel, "TOO LARGE, eta equals 0.45", subtitled eta greater than 2 over a: overshoots, climbs, diverges, draws a bowl with six dots climbing higher up alternating sides at step 0 x equals 1.000, step 1 x equals negative 1.250, step 2 x equals 1.5625, step 3 x equals negative 1.953125, step 4 x equals 2.441406, step 5 x equals negative 3.051758 in red, followed by a dashed red arrow leaving the top of the panel labelled "and beyond" with the text step 6 x equals 3.814697, off this panel, and a caption that the magnitude grows by a factor of 1.25 every step, that continuing far enough it overflows to inf and the very next update becomes nan, and that nothing in f, the gradient or the code is wrong. A footer band across the full width gives the contraction factor per step, one minus eta times a, for the three panels: 0.5 which shrinks, 0.0 which is exact, and negative 1.25 which grows. Each panel carries a small coloured circle that, when animation is enabled, jumps in sequence from dot to dot in time with the other two panels on a shared eight-second loop, briefly fading out at the end of each panel''s sequence before reappearing at the first dot to loop; every dot, value, arrow and caption is already present without any motion.'
