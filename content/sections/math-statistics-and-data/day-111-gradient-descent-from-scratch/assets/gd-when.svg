<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use gradient descent</title>
  <style>
    .gd-when-bg   { fill: #f8fafc; }
    .gd-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gd-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gd-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gd-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gd-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gd-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gd-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gd-when-row { opacity: 1; }
    .gd-when-r0 { animation-delay: 0.00s; }
    .gd-when-r1 { animation-delay: 0.45s; }
    .gd-when-r2 { animation-delay: 0.90s; }
    .gd-when-r3 { animation-delay: 1.35s; }
    .gd-when-r4 { animation-delay: 1.80s; }
    .gd-when-row { animation: gd-when-reveal 7.3s ease-in-out infinite; }
    @keyframes gd-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gd-when-bg" width="980" height="390"/>
  <text class="gd-when-h1"  x="30" y="40">When to use gradient descent</text>
  <text class="gd-when-sub" x="30" y="64">And when not to.</text>
  <rect class="gd-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gd-when-name" x="46" y="122">Use it</text>
  <text class="gd-when-desc" x="46" y="142">Four cases.</text>
  <text class="gd-when-desc gd-when-row gd-when-r0" x="46" y="182">Differentiable loss, many parameters</text>
  <text class="gd-when-desc gd-when-row gd-when-r1" x="46" y="216">Large datasets</text>
  <text class="gd-when-desc gd-when-row gd-when-r2" x="46" y="250">Neural network training</text>
  <text class="gd-when-desc gd-when-row gd-when-r3" x="46" y="284">Where no closed form exists</text>
  <text class="gd-when-desc gd-when-row gd-when-r4" x="46" y="318">Where approximate is good enough</text>
  <rect class="gd-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gd-when-name" x="526" y="122">Do not</text>
  <text class="gd-when-desc" x="526" y="142">Also four.</text>
  <text class="gd-when-desc gd-when-row gd-when-r0" x="526" y="182">A closed-form solution exists</text>
  <text class="gd-when-desc gd-when-row gd-when-r1" x="526" y="216">Few parameters and cheap evaluation</text>
  <text class="gd-when-desc gd-when-row gd-when-r2" x="526" y="250">Non-differentiable objectives</text>
  <text class="gd-when-desc gd-when-row gd-when-r3" x="526" y="284">Discrete search spaces</text>
  <text class="gd-when-desc gd-when-row gd-when-r4" x="526" y="318">Where the exact optimum is required</text>
  <text class="gd-when-sub" x="30" y="372">Using a closed form when one exists is the first check: least squares has an exact solution, and iterating toward it is slower and less accurate.</text>
</svg>
