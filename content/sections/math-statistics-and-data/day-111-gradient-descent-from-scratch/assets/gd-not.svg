<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things gradient descent is not</title>
  <style>
    .gd-not-bg   { fill: #f8fafc; }
    .gd-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gd-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gd-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gd-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gd-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gd-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gd-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gd-not-row { opacity: 1; }
    .gd-not-r0 { animation-delay: 0.00s; }
    .gd-not-r1 { animation-delay: 0.45s; }
    .gd-not-r2 { animation-delay: 0.90s; }
    .gd-not-r3 { animation-delay: 1.35s; }
    .gd-not-r4 { animation-delay: 1.80s; }
    .gd-not-row { animation: gd-not-reveal 7.3s ease-in-out infinite; }
    @keyframes gd-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gd-not-bg" width="980" height="390"/>
  <text class="gd-not-h1"  x="30" y="40">Four things gradient descent is not</text>
  <text class="gd-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="gd-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gd-not-name" x="46" y="122">The misconception</text>
  <text class="gd-not-desc" x="46" y="142">Commonly held.</text>
  <text class="gd-not-desc gd-not-row gd-not-r0" x="46" y="182">It finds the global minimum</text>
  <text class="gd-not-desc gd-not-row gd-not-r1" x="46" y="216">A larger learning rate trains faster</text>
  <text class="gd-not-desc gd-not-row gd-not-r2" x="46" y="250">Decreasing loss means the model is good</text>
  <text class="gd-not-desc gd-not-row gd-not-r3" x="46" y="284">It needs the whole dataset each step</text>
  <text class="gd-not-desc gd-not-row gd-not-r4" x="46" y="318">Convergence is guaranteed</text>
  <rect class="gd-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gd-not-name" x="526" y="122">What is true</text>
  <text class="gd-not-desc" x="526" y="142">Actually.</text>
  <text class="gd-not-desc gd-not-row gd-not-r0" x="526" y="182">It finds a local one, usually good enough</text>
  <text class="gd-not-desc gd-not-row gd-not-r1" x="526" y="216">Beyond a point it diverges</text>
  <text class="gd-not-desc gd-not-row gd-not-r2" x="526" y="250">It may be memorising the training set</text>
  <text class="gd-not-desc gd-not-row gd-not-r3" x="526" y="284">Mini-batches are the standard</text>
  <text class="gd-not-desc gd-not-row gd-not-r4" x="526" y="318">Only under conditions rarely met in practice</text>
  <text class="gd-not-sub" x="30" y="372">Decreasing training loss meaning nothing about generalisation is the trap that matters most, and it is why a validation set is not optional.</text>
</svg>
