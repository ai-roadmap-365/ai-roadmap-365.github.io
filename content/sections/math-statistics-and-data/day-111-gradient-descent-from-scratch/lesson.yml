title: 'Gradient Descent from Scratch'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 16
learning_promise: 'After this lesson you will know why the single line x <- x - eta * grad(x) is the whole of how every model in this course gets trained, and you will know it because you watched it fail first. You will run gradient descent on the simplest convex function there is, f(x) = 0.5*x^2, with a learning rate only slightly too large, and watch the loss climb on every step -- smoothly, plausibly, for thousands of iterations -- until it overflows to inf and the very next update becomes nan. Nothing will be wrong with the function, the gradient, or the code. Then you will derive, by hand, the exact regime structure that explains it: for f(x) = 0.5*a*x^2 the update is exact algebra, x_n = x_0*(1-eta*a)^n, and four learning rates on the same quadratic land in four different outcomes with EXACT boundaries at 1/a and 2/a -- monotone decrease, an exact landing on the minimum in one step, alternating-but-converging, and unbounded divergence. You will measure the per-step contraction ratio and watch it equal |1-eta*a| to float precision. You will meet conditioning: on a bowl with eigenvalues 1 and kappa, the optimal fixed learning rate is 2/(1+kappa), an isotropic bowl solves in exactly one step, and an ill-conditioned one needs more than ten times the steps -- Day 106''s eigenvalues, shown to govern how hard optimisation actually is. You will add momentum, a running average of the gradient substituted for the raw gradient, and measure it beating plain descent at the identical learning rate on the same ill-conditioned bowl. You will build a gradient checker from Day 108''s central difference and watch it catch a sign error in one component of a deliberately broken gradient and nothing else. You will run two initialisations on a non-convex function and watch them converge to two different minima, decided entirely by where they started. And you will catch a stopping-criterion trap in the act: a naive "the loss stopped changing" rule firing early on a genuinely convex, genuinely unsolved problem, while the gradient itself sits ten times above its own tolerance. Every number in this lesson comes from a script you can run yourself.'
objectives:
  - 'State the entire gradient-descent update rule from memory, x <- x - eta*grad(x), and explain each of its four parts: the current point, the gradient, the scaled step, and the new point'
  - 'Derive the closed-form solution of gradient descent on a 1-D quadratic, x_n = x_0*(1-eta*a)^n, and use it to predict the exact learning-rate boundaries 1/a and 2/a'
  - 'Classify a learning rate into one of four regimes -- monotone, exact, oscillating-but-converging, divergent -- from first principles, and verify the classification against a real run'
  - 'Explain why the gradient points uphill and why the update subtracts rather than adds it'
  - 'Connect an ill-conditioned Hessian (Day 106''s ratio of eigenvalues) to slow convergence under a fixed learning rate, and state the optimal fixed learning rate for a quadratic bowl'
  - 'Implement momentum as an exponentially weighted running average of the gradient, and explain why it helps on an ill-conditioned problem in terms of averaging away an oscillating component'
  - 'Implement a numerical gradient check using Day 108''s central difference and use it to localise a bug to a specific parameter'
  - 'State three common stopping criteria for gradient descent and explain a concrete case where a loss-based criterion fails while a gradient-based one does not'
  - 'Explain, from a captured run, what a diverging training run looks like numerically -- a smoothly increasing loss, then inf, then nan -- and why production training loops check their own loss for finiteness'
  - 'Compare hand-rolled gradient descent against scipy.optimize.minimize, torch.optim.SGD and jax.grad with optax, stating when each is the right choice and which of them were actually run in this lesson'
  - 'Explain why non-convex loss landscapes make initialisation a real decision rather than an implementation detail'
prerequisites:
  - 'Day 108 -- derivatives, the central difference, and the U-shaped error curve. The gradient check in this lesson is that same central difference, used to catch bugs rather than just to measure derivatives'
  - 'Day 109 -- partial derivatives and the gradient. Today''s update rule subtracts exactly that vector'
  - 'Day 110 -- the chain rule and backpropagation. Day 110 computes gradients; today uses them. Neither day is the other'
  - 'Day 106 -- eigenvalues and eigenvectors. The condition number governing today''s ill-conditioning section is literally the ratio of two eigenvalues of a Hessian'
  - 'Day 43 -- python3 -m venv and installing a package with pip'
  - 'Days 71-74 -- pytest, which the lab uses for both the reference suite and the running score'
  - 'Comfort writing a Python function that takes another function as an argument'
