questions:
  - question: 'For f(x) = 0.5*a*x^2 with a = 5, gradient descent uses a learning rate of eta = 0.45. What happens, and why?'
    options:
      - 'It diverges, because eta = 0.45 is above the boundary 2/a = 0.4'
      - 'It converges monotonically, because 0.45 is a small number'
      - 'It lands exactly on the minimum in one step, because 0.45 is close to 1/a'
      - 'It oscillates forever without ever converging or diverging, because eta is between 1/a and 2/a'
    answer_index: 0
    explanation: 'The update is exact algebra: x_n = x_0*(1 - eta*a)^n. At eta = 0.45 and a = 5, (1 - eta*a) = 1 - 2.25 = -1.25, whose absolute value exceeds 1 -- so |x| grows by a factor of 1.25 every single step, without bound. The boundaries are exact: 0 < eta < 1/a = 0.2 gives monotone decrease, eta = 0.2 lands exactly on zero in one step, 0.2 < eta < 2/a = 0.4 gives alternating-but-shrinking convergence, and eta > 0.4 diverges. 0.45 sits past that last boundary. The lab measures this directly rather than trusting the formula: gradient_descent(lambda x: 5*x, 1.0, 0.45, 30) grows the tracked value past 800 within 30 steps.'

  - question: 'Gradient descent subtracts the gradient rather than adding it. Why?'
    options:
      - 'It is an arbitrary convention that could equally well have been addition'
      - 'The gradient points in the direction of steepest ASCENT, so subtracting it moves toward lower loss'
      - 'Addition would make the learning rate negative, which is not allowed'
      - 'Subtraction is computationally cheaper than addition in floating point'
    answer_index: 1
    explanation: 'The gradient is defined as the direction of steepest increase (Day 109). To reduce loss you need to move in the OPPOSITE direction, which is exactly what subtracting the gradient does: x <- x - eta*grad(x). This is not a convention or an efficiency choice -- it is the one direction, among all directions from a point, that decreases the function fastest, and subtracting the gradient is how you take it. Adding the gradient would be gradient ASCENT, which is a real and useful algorithm for a different goal: maximising a function rather than minimising one.'

  - question: 'Two learning rates are tried on the same 1-D quadratic: eta1 gives a measured per-step ratio |x_(n+1)/x_n| of 0.9, and eta2 gives a measured ratio of 0.3. Which converges faster, and how much faster, after 20 steps?'
    options:
      - 'They converge at the same rate, because both ratios are below 1'
      - 'It cannot be determined without knowing a and eta individually'
      - 'eta2, by a factor of about (0.3/0.9)^20, which is an enormous number'
      - 'eta1, because a ratio closer to 1 means steadier progress'
    answer_index: 2
    explanation: 'The ratio |1 - eta*a| IS the per-step contraction factor, so after n steps the remaining distance to the minimum is multiplied by ratio^n. After 20 steps, eta1 leaves 0.9^20 = 0.12 of the original distance, while eta2 leaves 0.3^20 = 3.5e-11 of it -- eta2''s remaining error is smaller by a factor of roughly 3.5e9. A ratio closer to 1 means SLOWER shrinkage, not steadier progress; ratio = 0 (the exact regime) is the fastest possible. This is exactly what exercise 4 measures: the ratio predicted from eta and a matches the ratio measured from a real run to float precision.'

  - question: 'A bowl f(x, y) = 0.5*(x^2 + kappa*y^2) is used to study ill-conditioning. At the optimal fixed learning rate 2/(1+kappa), what happens as kappa grows from 1 to 100?'
    options:
      - 'The problem becomes unsolvable once kappa exceeds 2, since the learning rate formula would be undefined'
      - 'The number of steps shrinks, because a larger kappa makes the bowl steeper overall and therefore faster to descend'
      - 'Nothing changes, because the optimal learning rate always converges in one step regardless of kappa'
      - 'The number of steps to reach a fixed gradient tolerance grows, because kappa = 1 solves in exactly one step while kappa = 100 needs far more'
    answer_index: 3
    explanation: 'At kappa = 1 the bowl is isotropic (both eigenvalues equal 1), and the optimal learning rate 2/(1+1) = 1 solves it in exactly one step -- the 2-D analogue of the 1-D "exact" regime. As kappa grows, the optimal learning rate 2/(1+kappa) shrinks to stay stable on the steep direction, which then forces the shallow direction (whose own curvature never changed) to crawl. The lab measures 1, 27, 122 and 691 steps for kappa = 1, 5, 20 and 100 respectively -- strictly increasing, and kappa = 100 needs more than ten times kappa = 1''s count. This is Day 106''s condition number, made concrete: a large ratio between a Hessian''s eigenvalues makes optimisation intrinsically harder, no matter how well you tune a single fixed learning rate.'

  - question: 'Momentum replaces the raw gradient with v <- beta*v + grad(x) in the update x <- x - eta*v. On an ill-conditioned bowl, why does this help?'
    options:
      - 'Momentum increases the effective learning rate uniformly in every direction'
      - 'Momentum removes the need to choose a learning rate at all'
      - 'Averaging cancels an oscillating component of the gradient while a consistent component survives and accumulates'
      - 'Momentum replaces gradient descent with a fundamentally different, more powerful algorithm'
    answer_index: 2
    explanation: 'On the steep axis of an ill-conditioned bowl, the raw gradient overshoots and flips sign step after step -- an oscillating signal that a running average partially cancels, because opposite-signed contributions partly cancel each other in the average. On the shallow axis, the gradient keeps the same sign step after step -- a consistent signal that a running average does NOT cancel, so its contribution to v accumulates. The net effect is damped movement on the steep axis and reinforced movement on the shallow one, which is exactly the trade-off ill-conditioning punishes plain descent for. The lab measures it directly: at the identical learning rate plain descent uses on the kappa = 20 bowl, momentum with beta = 0.5 needs 34 steps against plain descent''s 122. It is still the same update rule, x <- x - eta*(something); only what stands in for the gradient has changed.'

  - question: 'A gradient-checking function is given an analytic gradient with the sign flipped on exactly one of three components. What should happen, and why is this check worth running?'
    options:
      - 'The check should report exactly the one broken component as wrong, because it compares each component of the analytic gradient against Day 108''s central difference independently'
      - 'The check cannot detect a sign error, only a magnitude error'
      - 'The check is unnecessary if the loss still decreases during training'
      - 'The check should report all three components as wrong, because one wrong component corrupts the whole vector'
    answer_index: 0
    explanation: 'Gradient checking compares the analytic gradient against a central difference COMPONENT BY COMPONENT, so a sign error in one component shows up as a disagreement in exactly that component and nowhere else -- the lab''s test asserts the flags come back [True, False, True] for a three-component gradient with the middle sign flipped. The check is worth running precisely because "the loss still decreases" is not reliable evidence of a correct gradient: a wrong gradient that is only PARTLY wrong still has some correlation with the true one, so training can appear to work for a while even with a real bug present. Gradient checking is cheap, mechanical, and catches exactly the class of error that a decreasing loss curve cannot.'

  - question: 'On a genuinely convex bowl, far from its minimum but with very small curvature, one gradient-descent step leaves the gradient at ten times its own tolerance while the change in loss falls below its own tolerance. What does this demonstrate?'
    options:
      - 'The function must actually be at a local minimum already, since the loss has stopped moving'
      - 'This can only happen on non-convex functions, never on a convex one'
      - 'The gradient tolerance and the loss tolerance must have been set inconsistently, since they disagree'
      - 'A stopping rule based only on the change in loss can fire before training has actually converged, while a gradient-norm-based rule correctly does not'
    answer_index: 3
    explanation: 'This is a real, bounded convex bowl -- not a pathological edge case -- and one step from far away, with a small curvature, moves the loss by only a tiny amount even though the point is nowhere near its minimum and the gradient remains well above a reasonable tolerance. "The loss stopped changing" and "the gradient is near zero" are different claims, and this is the case where they disagree: the naive |delta f| < tolerance rule would stop here, wrongly, while the more honest ||gradient|| < tolerance rule correctly says training is not done. Nothing about convexity prevents this -- convexity guarantees a single global minimum exists, not that every approach to it changes the loss quickly.'

  - question: 'A learning rate that is only slightly too large is used on the simplest convex function there is, f(x) = 0.5*x^2. What does the resulting run actually look like, measured?'
    options:
      - 'An immediate crash, since dividing by a number greater than 2/a raises an exception'
      - 'No visible difference from a correctly tuned run until the very last step'
      - 'A loss that oscillates between two fixed values forever, without ever growing or crashing'
      - 'A loss that increases every step, smoothly and plausibly, for thousands of iterations, before overflowing to inf and then nan on the very next update'
    answer_index: 3
    explanation: 'A measured run with eta = 2.2 (just above the divergence boundary 2/a = 2.0 for a = 1) shows the loss increasing on every one of its first 20 steps, and nothing about those early steps announces the coming failure -- the growth looks like an ordinary, if unwelcome, increasing curve. Continued for a few thousand more steps, the tracked value exceeds the largest representable float64 and becomes inf; the very next update then produces nan, since that step''s arithmetic subtracts one infinite quantity from another. Neither transition raises an exception by default. This is exactly why production training loops check their own loss for finiteness: a run that "looks like it is training, just badly" can in fact be a diverging run that will eventually corrupt every parameter, and the earlier it is caught the cheaper the mistake.'
