terms:
  - term: 'Gradient descent'
    definition: 'The update rule x <- x - eta*grad(x), repeated until the gradient is small enough. Take the direction that increases loss fastest, flip it, scale it by a learning rate, and move. The entire training loop of every model in this course, underneath whatever else surrounds it.'
  - term: 'Learning rate'
    definition: 'The scalar eta that decides how far one gradient-descent step actually moves, written x <- x - eta*grad(x). It never changes the direction of the step, only its length. Too small wastes steps converging correctly; too large overshoots, and past a sharp boundary the run diverges outright.'
  - term: 'Contraction factor'
    definition: 'For a 1-D quadratic f(x) = 0.5*a*x^2, the number (1 - eta*a) that gradient descent multiplies x by on every step. Its absolute value predicts the whole outcome: below 1 the run shrinks toward the minimum, exactly 0 lands on it in one step, between 1 and 2 (in a*eta terms) it alternates sign while still shrinking, and above that it grows without bound.'
  - term: 'Divergence boundary'
    definition: 'The learning rate 2/a at which a 1-D quadratic gradient-descent run stops converging, even with alternating overshoot, and starts growing without bound. Above it, |x| grows by a fixed factor every step until the run overflows to inf and the next update becomes nan.'
  - term: 'Condition number'
    definition: 'The ratio of a Hessian''s largest eigenvalue to its smallest (Day 106). For a bowl f(x,y) = 0.5*(x^2 + kappa*y^2), the condition number is kappa exactly. It governs how hard gradient descent''s job is: a well-conditioned (low-kappa) bowl is fast to descend at any reasonable fixed learning rate, an ill-conditioned (high-kappa) one forces a tiny learning rate and therefore many more steps.'
  - term: 'Ill-conditioning'
    definition: 'A large gap between a loss surface''s steepest and shallowest curvature directions. Any single fixed learning rate that is safe for the steep direction is forced to be small, which then makes progress in the shallow direction painfully slow -- the mechanism behind the textbook image of gradient descent zig-zagging down a narrow valley.'
  - term: 'Momentum'
    definition: 'An update that substitutes an exponentially weighted running average of the gradient, v <- beta*v + grad(x), for the raw gradient in the descent step: x <- x - eta*v. It is not a separate algorithm -- it is the same update rule with a smoothed direction, and it helps on an ill-conditioned bowl because averaging cancels an oscillating component while a consistent component survives.'
  - term: 'Gradient checking'
    definition: 'Comparing an analytic gradient function against Day 108''s central difference, component by component, to catch implementation bugs. A wrong analytic gradient runs, returns numbers of a plausible shape, and can even make training loss go down for a while -- gradient checking is the cheap, mechanical way to catch it before it costs a real training run.'
  - term: 'Stopping criterion'
    definition: 'A rule that decides when to stop a gradient-descent loop: the gradient''s norm falling below a tolerance, the change in loss between steps falling below a tolerance, or a maximum number of iterations. The first is the most honest; the second can fire early on a shallow, unsolved part of a landscape, mistaking a slow approach for arrival.'
  - term: 'Plateau'
    definition: 'A region of a loss surface where the function value changes very little from step to step even though the gradient has not vanished -- distinct from a true flat region where the gradient itself is near zero. A stopping rule that only watches the loss cannot tell the two apart, and can declare victory on a plateau that is nowhere near a minimum.'
  - term: 'Non-convex function'
    definition: 'A function with more than one local minimum (or a mix of minima, maxima and saddle points). Gradient descent on a non-convex function converges to whichever minimum is downhill from its starting point, so the initialisation is a real decision with a real effect on the answer, not an implementation detail.'
  - term: 'Overflow to inf, then nan'
    definition: 'What a diverging gradient-descent run looks like numerically in IEEE-754 floating point: the tracked value grows without bound until it exceeds the largest representable float and becomes inf, after which the next arithmetic operation (inf minus a finite multiple of inf, for instance) produces nan. Neither raises an exception by default -- a training loop must check its own loss for finiteness to catch this.'
  - term: 'Hyperparameter'
    definition: 'A value that controls how an algorithm runs rather than being learned by it -- the learning rate and momentum coefficient in this lesson are both hyperparameters. Unlike a model parameter, a hyperparameter is not updated by the gradient; it is chosen (or searched over) before or between training runs.'
