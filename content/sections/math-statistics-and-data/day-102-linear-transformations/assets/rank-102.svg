<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Rank</title>
  <style>
    .rank-102-bg   { fill: #f8fafc; }
    .rank-102-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rank-102-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rank-102-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rank-102-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rank-102-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rank-102-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rank-102-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rank-102-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rank-102-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rank-102-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rank-102-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rank-102-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rank-102-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rank-102-stage { opacity: 1; }

    .rank-102-s0 { animation-delay: 0.00s; }
    .rank-102-e0 { animation-delay: 0.00s; }
    .rank-102-s1 { animation-delay: 1.28s; }
    .rank-102-e1 { animation-delay: 1.28s; }
    .rank-102-s2 { animation-delay: 2.56s; }
    .rank-102-e2 { animation-delay: 2.56s; }
    .rank-102-s3 { animation-delay: 3.84s; }
    .rank-102-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rank-102-conn  { animation: rank-102-trace 6.4s ease-in-out infinite; }
      .rank-102-stage { animation: rank-102-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rank-102-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rank-102-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rank-102-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rank-102-stage { animation: rank-102-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rank-102-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rank-102-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rank-102-bg" width="980" height="322"/>
  <text class="rank-102-h1"  x="30" y="40">Rank</text>
  <text class="rank-102-sub" x="30" y="64">Four steps.</text>
  <g class="rank-102-stage rank-102-s0">
    <rect class="rank-102-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rank-102-step" x="44" y="142">01</text>
    <text class="rank-102-name" x="70" y="142">Rank is how many dimensions the output actually spans</text>
    <text class="rank-102-desc" x="44" y="166">After the transformation.</text>
  </g>
  <line class="rank-102-line rank-102-conn rank-102-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rank-102-tip)"/>
  <g class="rank-102-stage rank-102-s1">
    <rect class="rank-102-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rank-102-step" x="280" y="142">02</text>
    <text class="rank-102-name" x="306" y="142">Full rank means nothing was collapsed</text>
    <text class="rank-102-desc" x="280" y="166">The output fills the space.</text>
  </g>
  <line class="rank-102-line rank-102-conn rank-102-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rank-102-tip)"/>
  <g class="rank-102-stage rank-102-s2">
    <rect class="rank-102-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rank-102-step" x="516" y="142">03</text>
    <text class="rank-102-name" x="542" y="142">Lower rank means dimensions were flattened away</text>
    <text class="rank-102-desc" x="516" y="166">Irrecoverably.</text>
  </g>
  <line class="rank-102-line rank-102-conn rank-102-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rank-102-tip)"/>
  <g class="rank-102-stage rank-102-s3">
    <rect class="rank-102-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rank-102-step" x="752" y="142">04</text>
    <text class="rank-102-name" x="778" y="142">Which is exactly what dimensionality reduction does</text>
    <text class="rank-102-desc" x="752" y="166">Deliberately, keeping the</text>
    <text class="rank-102-desc" x="752" y="182">directions that matter.</text>
  </g>
  <text class="rank-102-sub" x="30" y="304">Dimensionality reduction being deliberate rank reduction is the connection worth carrying: it discards dimensions on purpose, having chosen which.</text>
</svg>
