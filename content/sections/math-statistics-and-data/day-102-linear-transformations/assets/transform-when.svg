<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what you need.">
  <title>Which transformation when</title>
  <style>
    .transform-when-bg   { fill: #f8fafc; }
    .transform-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transform-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transform-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transform-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transform-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transform-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transform-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transform-when-row { opacity: 1; }
    .transform-when-r0 { animation-delay: 0.00s; }
    .transform-when-r1 { animation-delay: 0.45s; }
    .transform-when-r2 { animation-delay: 0.90s; }
    .transform-when-r3 { animation-delay: 1.35s; }
    .transform-when-r4 { animation-delay: 1.80s; }
    .transform-when-row { animation: transform-when-reveal 7.3s ease-in-out infinite; }
    @keyframes transform-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="transform-when-bg" width="980" height="390"/>
  <text class="transform-when-h1"  x="30" y="40">Which transformation when</text>
  <text class="transform-when-sub" x="30" y="64">By what you need.</text>
  <rect class="transform-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="transform-when-name" x="46" y="122">What you want</text>
  <text class="transform-when-desc" x="46" y="142">The effect.</text>
  <text class="transform-when-desc transform-when-row transform-when-r0" x="46" y="182">Change size, keep shape</text>
  <text class="transform-when-desc transform-when-row transform-when-r1" x="46" y="216">Turn without changing size</text>
  <text class="transform-when-desc transform-when-row transform-when-r2" x="46" y="250">Shear or skew</text>
  <text class="transform-when-desc transform-when-row transform-when-r3" x="46" y="284">Move without rotating</text>
  <text class="transform-when-desc transform-when-row transform-when-r4" x="46" y="318">Reduce dimensions deliberately</text>
  <rect class="transform-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="transform-when-name" x="526" y="122">The transformation</text>
  <text class="transform-when-desc" x="526" y="142">What to use.</text>
  <text class="transform-when-desc transform-when-row transform-when-r0" x="526" y="182">Scaling: a diagonal matrix</text>
  <text class="transform-when-desc transform-when-row transform-when-r1" x="526" y="216">Rotation: an orthogonal matrix</text>
  <text class="transform-when-desc transform-when-row transform-when-r2" x="526" y="250">A shear matrix</text>
  <text class="transform-when-desc transform-when-row transform-when-r3" x="526" y="284">Translation: needs homogeneous coordinates</text>
  <text class="transform-when-desc transform-when-row transform-when-r4" x="526" y="318">A projection: a rank-deficient matrix</text>
  <text class="transform-when-sub" x="30" y="372">Translation needing an extra dimension is the row that surprises people, and it is the reason graphics libraries use four-by-four matrices for three-dimensional work.</text>
</svg>
