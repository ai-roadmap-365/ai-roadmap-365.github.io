<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" role="img" aria-labelledby="d102f-title d102f-desc" width="1240" height="1000">
  <title id="d102f-title">Shearing then rotating a shape, and the one matrix that does both at once</title>
  <desc id="d102f-desc">An animated flow diagram showing an L-shaped flag on a square grid, then sheared, then turned a quarter turn, with the running product matrix updating at each step, and finally the same flag transformed in a single step by the composed matrix and landing on exactly the same corners.</desc>

  <style>
    .d102f-bg     { fill: #f8fafc; }
    .d102f-title  { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; }
    .d102f-sub    { fill: #334155; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; }
    .d102f-head   { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; }
    .d102f-text   { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; }
    .d102f-small  { fill: #334155; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d102f-mono   { fill: #1a202c; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 17px; }
    .d102f-monobig{ fill: #1a202c; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 21px; font-weight: 700; }
    .d102f-grid   { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
    .d102f-shape  { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 2.5; fill-opacity: 0.55; }
    .d102f-panel  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d102f-note   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d102f-warn   { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .d102f-eq     { fill: #15803d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 40px; font-weight: 700; }

    /* Panels light up in order, so the eye follows the pipeline. The resting
       fill is fully legible on its own; the animation only adds emphasis. */
    .d102f-stage  { animation: d102f-lift 8s ease-in-out infinite; }
    .d102f-s1     { animation-delay: 0s; }
    .d102f-s2     { animation-delay: 1.6s; }
    .d102f-s3     { animation-delay: 3.2s; }
    .d102f-s4     { animation-delay: 5.6s; }
    @keyframes d102f-lift {
      0%, 18%, 100% { fill: #ffffff; }
      4%, 12%       { fill: #dbeafe; }
    }

    /* Flowing connections. Reduced motion turns them into solid arrows. */
    .d102f-wire   { stroke: #1d4ed8; stroke-width: 3; fill: none;
                    stroke-dasharray: 10 8; animation: d102f-march 1.8s linear infinite; }
    @keyframes d102f-march { to { stroke-dashoffset: -18; } }

    /* The one-step route, travelled by a token. It rests visible at the start
       of its path, so the still frame shows where the journey begins. */
    .d102f-token  { fill: #1d4ed8;
                    offset-path: path('M 120 620 C 120 700, 400 716, 620 716 C 840 716, 1020 700, 1020 620');
                    offset-rotate: 0deg;
                    animation: d102f-travel 8s ease-in-out infinite; }
    @keyframes d102f-travel {
      0%, 62%  { offset-distance: 0%; }
      92%, 100% { offset-distance: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d102f-stage { animation: none; fill: #ffffff; }
      .d102f-wire  { animation: none; stroke-dasharray: none; }
      .d102f-token { animation: none; offset-distance: 0%; }
    }
  </style>

  <defs>
    <marker id="d102f-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect class="d102f-bg" x="0" y="0" width="1240" height="1000"/>

  <text class="d102f-title" x="40" y="48">Two transformations, then the single matrix that does both</text>
  <text class="d102f-sub" x="40" y="82">Shear the flag, then turn it a quarter turn. Multiply the two matrices instead, apply once, and the corners land in exactly the same places.</text>

  <!-- ============ STEP 1 ============ -->
  <rect class="d102f-panel d102f-stage d102f-s1" x="40" y="130" width="180" height="340" rx="10"/>
  <text class="d102f-head" x="56" y="162">1. Start</text>
  <g class="d102f-grid">
    <path d="M 76 430 L 76 358"/>
    <path d="M 112 430 L 112 358"/>
    <path d="M 148 430 L 148 358"/>
    <path d="M 76 430 L 148 430"/>
    <path d="M 76 394 L 148 394"/>
    <path d="M 76 358 L 148 358"/>
  </g>
  <path class="d102f-shape" d="M 76 430 L 148 430 L 148 412 L 94 412 L 94 358 L 76 358 Z"/>
  <text class="d102f-small" x="56" y="196">the flag, on a square grid</text>
  <text class="d102f-mono" x="56" y="454">corner (2, 0)</text>

  <!-- ============ STEP 2 ============ -->
  <path class="d102f-wire" d="M 228 300 L 284 300" marker-end="url(#d102f-arrow)"/>
  <text class="d102f-text" x="216" y="282">shear</text>

  <rect class="d102f-panel d102f-stage d102f-s2" x="300" y="130" width="280" height="340" rx="10"/>
  <text class="d102f-head" x="316" y="162">2. After shear_x(2)</text>
  <g class="d102f-grid">
    <path d="M 330 430 L 474 358"/>
    <path d="M 366 430 L 510 358"/>
    <path d="M 402 430 L 546 358"/>
    <path d="M 330 430 L 402 430"/>
    <path d="M 402 394 L 474 394"/>
    <path d="M 474 358 L 546 358"/>
  </g>
  <path class="d102f-shape" d="M 330 430 L 402 430 L 438 412 L 384 412 L 492 358 L 474 358 Z"/>
  <text class="d102f-small" x="316" y="196">every point slides sideways in proportion to its height</text>
  <text class="d102f-mono" x="316" y="454">corner (2, 0) did not move — it has height 0</text>

  <!-- ============ STEP 3 ============ -->
  <path class="d102f-wire" d="M 588 300 L 632 300" marker-end="url(#d102f-arrow)"/>
  <text class="d102f-text" x="576" y="282">turn</text>

  <rect class="d102f-panel d102f-stage d102f-s3" x="640" y="130" width="180" height="340" rx="10"/>
  <text class="d102f-head" x="656" y="162">3. Then a quarter turn</text>
  <g class="d102f-grid">
    <path d="M 740 450 L 668 306"/>
    <path d="M 740 414 L 668 270"/>
    <path d="M 740 378 L 668 234"/>
    <path d="M 740 450 L 740 378"/>
    <path d="M 704 378 L 704 306"/>
    <path d="M 668 306 L 668 234"/>
  </g>
  <path class="d102f-shape" d="M 740 450 L 740 378 L 722 342 L 722 396 L 668 288 L 668 306 Z"/>
  <text class="d102f-small" x="656" y="196">the whole plane rotates about the origin</text>

  <!-- ============ EQUALS ============ -->
  <text class="d102f-eq" x="862" y="316">=</text>

  <!-- ============ STEP 4 ============ -->
  <rect class="d102f-panel d102f-stage d102f-s4" x="940" y="130" width="180" height="340" rx="10"/>
  <text class="d102f-head" x="956" y="162">4. One matrix, one step</text>
  <g class="d102f-grid">
    <path d="M 1040 450 L 968 306"/>
    <path d="M 1040 414 L 968 270"/>
    <path d="M 1040 378 L 968 234"/>
    <path d="M 1040 450 L 1040 378"/>
    <path d="M 1004 378 L 1004 306"/>
    <path d="M 968 306 L 968 234"/>
  </g>
  <path class="d102f-shape" d="M 1040 450 L 1040 378 L 1022 342 L 1022 396 L 968 288 L 968 306 Z"/>
  <text class="d102f-small" x="956" y="196">the original flag, transformed once</text>

  <!-- ============ THE RUNNING PRODUCT ============ -->
  <text class="d102f-head" x="40" y="512">The running product, updated at each step</text>

  <rect class="d102f-note" x="40" y="528" width="180" height="70" rx="8"/>
  <text class="d102f-mono" x="56" y="554">nothing yet:</text>
  <text class="d102f-monobig" x="56" y="582">[[1, 0], [0, 1]]</text>

  <rect class="d102f-note" x="300" y="528" width="280" height="70" rx="8"/>
  <text class="d102f-mono" x="316" y="554">A = shear = [[1, 2], [0, 1]]   product:</text>
  <text class="d102f-monobig" x="316" y="582">[[1, 2], [0, 1]]</text>

  <rect class="d102f-note" x="640" y="528" width="180" height="70" rx="8"/>
  <text class="d102f-mono" x="656" y="554">B = turn, so B @ A:</text>
  <text class="d102f-monobig" x="656" y="582">[[0, -1], [1, 2]]</text>

  <rect class="d102f-note" x="940" y="528" width="180" height="70" rx="8"/>
  <text class="d102f-mono" x="956" y="554">apply that once:</text>
  <text class="d102f-monobig" x="956" y="582">[[0, -1], [1, 2]]</text>

  <!-- ============ THE ONE-STEP ROUTE ============ -->
  <path class="d102f-wire" d="M 120 620 C 120 700, 400 716, 620 716 C 840 716, 1020 700, 1020 620" marker-end="url(#d102f-arrow)"/>
  <circle class="d102f-token" r="9"/>
  <text class="d102f-text" x="520" y="748">one matrix, applied once — same answer, a fraction of the work</text>

  <!-- ============ BOTTOM: the order rule ============ -->
  <rect class="d102f-panel" x="40" y="778" width="580" height="192" rx="10"/>
  <text class="d102f-head" x="60" y="812">The order rule, and why it looks backwards</text>
  <text class="d102f-mono" x="60" y="844">shear first, then turn   →   B @ A   =   [[0, -1], [1, 2]]</text>
  <text class="d102f-mono" x="60" y="872">turn first, then shear   →   A @ B   =   [[2, -1], [1, 0]]</text>
  <text class="d102f-text" x="60" y="906">Read a product RIGHT TO LEFT. Write out B @ (A @ v) and it is</text>
  <text class="d102f-text" x="60" y="930">obvious: A stands next to the vector, so A touches it first.</text>
  <text class="d102f-small" x="60" y="956">These are two different transformations, not two spellings of one.</text>

  <rect class="d102f-warn" x="660" y="778" width="540" height="192" rx="10"/>
  <text class="d102f-head" x="680" y="812">Checked corner by corner, not asserted</text>
  <text class="d102f-mono" x="680" y="844">two steps :  (0, 0)  (0, 2)  (-0.5, 3)  (-0.5, 1.5)  (-2, 4.5)  (-2, 4)</text>
  <text class="d102f-mono" x="680" y="872">one matrix:  (0, 0)  (0, 2)  (-0.5, 3)  (-0.5, 1.5)  (-2, 4.5)  (-2, 4)</text>
  <text class="d102f-text" x="680" y="906">det(A) = 1 and det(B) = 1, so the composite has determinant 1:</text>
  <text class="d102f-text" x="680" y="930">area factors multiply. Neither step changed the flag's area.</text>
  <text class="d102f-small" x="680" y="956">All coordinates here are invented and every one can be checked by hand.</text>
</svg>
