<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a transformation is not</title>
  <style>
    .transform-not-bg   { fill: #f8fafc; }
    .transform-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transform-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transform-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transform-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transform-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transform-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transform-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transform-not-row { opacity: 1; }
    .transform-not-r0 { animation-delay: 0.00s; }
    .transform-not-r1 { animation-delay: 0.45s; }
    .transform-not-r2 { animation-delay: 0.90s; }
    .transform-not-r3 { animation-delay: 1.35s; }
    .transform-not-r4 { animation-delay: 1.80s; }
    .transform-not-row { animation: transform-not-reveal 7.3s ease-in-out infinite; }
    @keyframes transform-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="transform-not-bg" width="980" height="390"/>
  <text class="transform-not-h1"  x="30" y="40">Four things a transformation is not</text>
  <text class="transform-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="transform-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="transform-not-name" x="46" y="122">The misconception</text>
  <text class="transform-not-desc" x="46" y="142">Commonly held.</text>
  <text class="transform-not-desc transform-not-row transform-not-r0" x="46" y="182">Linear means it draws a straight line</text>
  <text class="transform-not-desc transform-not-row transform-not-r1" x="46" y="216">Any geometric change is a linear map</text>
  <text class="transform-not-desc transform-not-row transform-not-r2" x="46" y="250">Translation is a linear transformation</text>
  <text class="transform-not-desc transform-not-row transform-not-r3" x="46" y="284">Stacking layers adds expressive power</text>
  <text class="transform-not-desc transform-not-row transform-not-r4" x="46" y="318">The determinant is an abstract quantity</text>
  <rect class="transform-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="transform-not-name" x="526" y="122">What is true</text>
  <text class="transform-not-desc" x="526" y="142">Actually.</text>
  <text class="transform-not-desc transform-not-row transform-not-r0" x="526" y="182">It means lines stay lines and the origin stays put</text>
  <text class="transform-not-desc transform-not-row transform-not-r1" x="526" y="216">Bending and curving are not</text>
  <text class="transform-not-desc transform-not-row transform-not-r2" x="526" y="250">It moves the origin; it needs an extra dimension</text>
  <text class="transform-not-desc transform-not-row transform-not-r3" x="526" y="284">Not without a non-linearity between them</text>
  <text class="transform-not-desc transform-not-row transform-not-r4" x="526" y="318">It is the area or volume scaling factor</text>
  <text class="transform-not-sub" x="30" y="372">Translation not being linear is the fact that motivates homogeneous coordinates two lessons later, and it surprises almost everyone the first time.</text>
</svg>
