<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Some information is lost.">
  <title>Casting a shadow</title>
  <style>
    .shadow-projection-bg   { fill: #f8fafc; }
    .shadow-projection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-projection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-projection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-projection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-projection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-projection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shadow-projection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shadow-projection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shadow-projection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shadow-projection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shadow-projection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shadow-projection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shadow-projection-row { opacity: 1; }
    .shadow-projection-r0 { animation-delay: 0.00s; }
    .shadow-projection-r1 { animation-delay: 0.45s; }
    .shadow-projection-r2 { animation-delay: 0.90s; }
    .shadow-projection-r3 { animation-delay: 1.35s; }
    .shadow-projection-r4 { animation-delay: 1.80s; }
    .shadow-projection-row { animation: shadow-projection-reveal 7.3s ease-in-out infinite; }
    @keyframes shadow-projection-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shadow-projection-bg" width="980" height="390"/>
  <text class="shadow-projection-h1"  x="30" y="40">Casting a shadow</text>
  <text class="shadow-projection-sub" x="30" y="64">Some information is lost.</text>
  <rect class="shadow-projection-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shadow-projection-name" x="46" y="122">Rotating an object</text>
  <text class="shadow-projection-desc" x="46" y="142">Reversible.</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r0" x="46" y="182">Every point moves to a new place</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r1" x="46" y="216">Nothing is lost</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r2" x="46" y="250">The original can be recovered exactly</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r3" x="46" y="284">Determinant is non-zero</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r4" x="46" y="318">This is an invertible map</text>
  <rect class="shadow-projection-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shadow-projection-name" x="526" y="122">Casting its shadow</text>
  <text class="shadow-projection-desc" x="526" y="142">Irreversible.</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r0" x="526" y="182">Three dimensions become two</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r1" x="526" y="216">Depth information is destroyed</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r2" x="526" y="250">The original cannot be recovered</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r3" x="526" y="284">Determinant is zero</text>
  <text class="shadow-projection-desc shadow-projection-row shadow-projection-r4" x="526" y="318">This is a rank-deficient map</text>
  <text class="shadow-projection-sub" x="30" y="372">The shadow is a perfectly good transformation that simply cannot be undone, which is what a zero determinant records.</text>
</svg>
