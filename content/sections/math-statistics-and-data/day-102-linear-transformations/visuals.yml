visuals:
  - id: transformation-matrix-architecture
    file: assets/transformation-matrix-architecture.svg
    type: diagram
    title: 'The columns of a matrix are where the basis vectors land: a grid before and after, with the two landing places traced to the two columns'
    alt: 'Diagram: a square grid with the arrows 1 comma 0 and 0 comma 1 highlighted, the same grid after a transformation with those two arrows landing at 3 comma 1 and minus 1 comma 2, and dashed arrows showing that those two landing places written downwards are precisely the two columns of the matrix, with the worked example of where 2 comma 1 goes'
    description: 'A static architecture diagram carrying the day''s single organising idea in one picture: a matrix is a function, and its columns are where the basis vectors land. The left panel, headed Before, shows a plain square grid with the origin marked at the crossing point, a blue arrow one unit to the right labelled e1 equals 1 comma 0, an amber arrow one unit up labelled e2 equals 0 comma 1, and the unit square between them shaded and marked as having area 1. A caption notes that the origin sits at the crossing point. An arrow across the middle labelled apply M, with the note that every point moves at once, leads to the right panel, headed After. That panel shows the same grid transformed into a lattice of parallelograms — still straight lines, still evenly spaced, origin still fixed, as its subheading states — with the blue arrow now ending at the point labelled e1 landed at 3 comma 1, the amber arrow now ending at the point labelled e2 landed at minus 1 comma 2, and the image of the unit square shaded and marked as having area 7. A caption beneath records that the origin is the one point that did not move and that no matrix can move it. Across the foot of the diagram a wide panel is headed: those two landing places, written downwards, ARE the matrix. It shows M written in large brackets as 3 and minus 1 on the first row and 1 and 2 on the second, with the left column shaded blue and boxed, the right column shaded amber and boxed, labelled column 0 and column 1, and the instruction to read each one downwards. Two dashed arrows, one blue and one amber, run from the two landing-place labels in the After panel down to the two shaded columns, so the correspondence is drawn rather than described. Beside the matrix the panel states the trap in full: a ROW is not a landing place, row 0 here is 3 comma minus 1 and nothing lands there, the matrix is written across and it means down. Below that the worked example runs in three lines: 2 comma 1 equals 2 times 1 comma 0 plus 1 times 0 comma 1, so it must land at 2 times 3 comma 1 plus 1 times minus 1 comma 2, which equals 6 comma 2 plus minus 1 comma 2, which equals 5 comma 4 — with the note that this step is the whole day, because a linear transformation preserves combinations and so knowing two landings settles all of them. A closing line records that the determinant is 3 times 2 minus minus 1 times 1 equals 7, which is why the shaded unit square came out with area 7, and that all the numbers are invented.'
  - id: transformation-compose-flow
    file: assets/transformation-compose-flow.svg
    type: flow-animated
    title: 'Shearing then rotating a shape step by step with the running product matrix, and the same shape transformed once by the composed matrix landing identically'
    alt: 'Diagram: an L-shaped flag on a square grid, then sheared, then turned a quarter turn, with the running product matrix updating at each step, and finally the same flag transformed in a single step by the composed matrix and landing on exactly the same corners, with the two orders of the product shown side by side'
    description: 'An animated flow diagram in four stages plus two closing panels, fully readable as a still image. Stage one shows an L-shaped flag sitting on a plain square grid, captioned as the flag on a square grid, with a note naming the corner at 2 comma 0. A flowing arrow labelled shear leads to stage two, headed after shear_x(2), where the grid has become a lattice of slanted parallelograms and the flag has slid sideways in proportion to its height; a caption states that every point slides sideways in proportion to its height, and a second note records that the corner at 2 comma 0 did not move because it has height 0. A second flowing arrow labelled turn leads to stage three, headed then a quarter turn, where the whole lattice has rotated about the origin and the flag now points left and up; its caption states that the whole plane rotates about the origin. A large green equals sign separates stage three from stage four, headed one matrix, one step, which shows an identical lattice and an identical flag with the caption that this is the original flag transformed once. The four stage panels light up in sequence so the eye follows the pipeline, and each rests fully legible. Beneath them a row of four boxes shows the running product updating: nothing yet, the identity 1 0 0 1; then A equals shear equals 1 2 0 1 with the product 1 2 0 1; then B equals turn, so B at A gives 0 minus 1 1 2; then apply that once, 0 minus 1 1 2. A long marching-dash arrow sweeps from below stage one all the way to below stage four, carrying a small travelling token, labelled one matrix applied once — same answer, a fraction of the work. Across the foot, a left panel headed the order rule, and why it looks backwards gives shear first then turn as B at A equals 0 minus 1 1 2, turn first then shear as A at B equals 2 minus 1 1 0, and explains that a product is read right to left because writing out B at open bracket A at v makes it obvious that A stands next to the vector and touches it first, closing with the note that these are two different transformations rather than two spellings of one. A right panel headed checked corner by corner, not asserted lists the six corners produced by the two separate steps and the six produced by the single matrix, identical in both rows — 0 comma 0, then 0 comma 2, then minus 0.5 comma 3, then minus 0.5 comma 1.5, then minus 2 comma 4.5, then minus 2 comma 4 — and records that the determinant of A is 1 and of B is 1 so the composite has determinant 1 because area factors multiply, meaning neither step changed the flag''s area, with a final note that all coordinates are invented and every one can be checked by hand. A prefers-reduced-motion block stops every animation and restores the resting state, in which all four panels are shaded, both connecting arrows are solid, the travelling token sits at the start of its path, and every matrix, coordinate and caption is present.'
