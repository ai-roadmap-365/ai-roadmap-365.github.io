questions:
  - question: 'A picture shows the arrow (1, 0) redrawn ending at (3, 1), and the arrow (0, 1) redrawn ending at (-1, 2). What is the matrix?'
    options:
      - '[[3, 1], [-1, 2]] — the two landing places written as rows'
      - '[[3, -1], [1, 2]] — the two landing places written as columns'
      - '[[1, 0], [0, 1]] — the picture does not determine a matrix on its own'
      - '[[3, -1], [1, 2]] transposed, because NumPy stores arrays row-major'
    answer_index: 1
    explanation: 'The columns are the landing places. Column 0 is where (1, 0) went, read downwards, so the left column is 3 above 1. Column 1 is where (0, 1) went, so the right column is -1 above 2. Written as rows that is [[3, -1], [1, 2]]. Option 0 is the single most common mistake in the whole topic: the matrix is written across and it means down, so row 0 here is (3, -1) and nothing lands there. Option 2 is wrong because two landing places settle everything — every vector is a combination of the two basis vectors, and a linear transformation preserves combinations, so knowing where those two go fixes where all the others go. Option 3 confuses how NumPy lays bytes out in memory with what a matrix means; storage order is a Day 100 topic and has nothing to do with this.'

  - question: 'A transformation has determinant 0. What does that tell you?'
    options:
      - 'It shrinks every shape to a very small area, but nothing is lost'
      - 'It leaves area unchanged, like a rotation or a shear'
      - 'It flips the plane over, so shapes come out mirrored'
      - 'It flattens the plane onto a line or a point, two different inputs can share an output, and it cannot be undone'
    answer_index: 3
    explanation: 'The determinant is the factor by which area is multiplied, so a determinant of 0 means the unit square came out with area 0 — the plane was flattened. On [[1, 2], [2, 4]] both columns lie along the line y = 2x, so everything lands on that one line, and the lab shows (2, 0) and (0, 1) both landing on (2.0, 4.0). Two different starting points now share a landing place, and no rule can send that place back to both of them. The information is not compressed or hidden, it is gone, which is exactly what "no inverse" means: numpy.linalg.inv raises LinAlgError: Singular matrix. The first option is the reassuring misreading — 0 is not "very small", it is a collapse, and the difference is the difference between lossy and total. The second describes determinant 1. The third describes a NEGATIVE determinant, which flips orientation while keeping the size.'

  - question: 'Which of these functions is linear?'
    options:
      - 'f(v) = M @ v + b, with b = (1, 1) — a network layer'
      - 'f(x, y) = (x squared, y)'
      - 'f(v) = M @ v'
      - 'f(x, y) = (x + 1, y + 1)'
    answer_index: 2
    explanation: 'Linear means exactly two things: f(u + v) = f(u) + f(v), and f(cu) = c f(u). Only multiplication by a matrix satisfies both. Options 0 and 3 both move the origin — f((0, 0)) is (1, 1), not (0, 0) — and no linear transformation can move the origin, because M @ (0, 0) is zero lots of each column. That is the one-second test, and it disposes of both without touching a pair of vectors. The gap in option 0 is measurable and instructive: f(u) + f(v) minus f(u + v) comes out as exactly b, because the offset is added once on one side and twice on the other. Option 1 is the interesting case, and it is why the origin test is necessary but not sufficient: squaring a coordinate DOES fix the origin and is still not linear, because doubling the input quadruples the first output instead of doubling it. Option 0 is called affine — linear plus a shift — and it is the shape of every layer in every network you will build.'

  - question: 'You want to shear a shape first and then rotate it. Which single matrix does both?'
    options:
      - 'A @ B, where A is the shear and B is the rotation'
      - 'B @ A, where A is the shear and B is the rotation'
      - 'Either — matrix multiplication is commutative for rotations'
      - 'Neither; two transformations cannot be written as one matrix'
    answer_index: 1
    explanation: 'The step that happens FIRST is written on the RIGHT. Write out what applying A and then B to a vector means — B @ (A @ v) — and it is obvious: A is the one standing next to the vector, so A touches it first. The identity B(Ax) = (BA)x is what lets you collapse the two into one. This is not a convention to memorise, it is what the notation says. Option 0 is a genuinely different transformation, not a different spelling: with A = shear_x(2) and B = a quarter turn, B @ A is [[0, -1], [1, 2]] while A @ B is [[2, -1], [1, 0]], and they send (1, 1) to (-1, 3) and (1, 1) respectively. Option 2 is false — matrix multiplication is non-commutative in general, and Wikipedia says so in as many words. Option 3 is exactly backwards: composing into one matrix is the reason matrix multiplication was defined at all, by Binet in 1812.'

  - question: 'A transformation has determinant -1. What happened to the unit square?'
    options:
      - 'It kept its area of 1, but the plane was turned over, so its corners now run the other way round'
      - 'Its area became -1, which is impossible, so the matrix is invalid'
      - 'It shrank to nothing'
      - 'It was rotated by 180 degrees'
    answer_index: 0
    explanation: 'The SIZE of the determinant is the area factor and the SIGN is the orientation. A determinant of -1 means the area is still 1 and the plane was flipped. Measured in the lab: the unit square listed anticlockwise has signed area +1, and after reflection in the x axis its corners are (0, 0), (1, 0), (1, -1), (0, -1) with signed area -1. Same size, opposite winding. No rotation undoes it, the same way no amount of turning a left glove makes it a right one — and that is why the last option is wrong: a 180 degree rotation has determinant +1, not -1, and the lab checks that every rotation, at every angle it tries, has a positive determinant. The second option misreads a signed quantity as a physical area; the sign is carrying extra information, not describing an impossible region. The third describes determinant 0, which is a different and much more serious event.'

  - question: 'Why does a neural network layer compute X @ W + b instead of folding the bias into the weight matrix?'
    options:
      - 'For historical reasons; modern frameworks could fold it in but keep the old form for compatibility'
      - 'Because a matrix cannot move the origin, and b exists precisely to move it'
      - 'Because folding it in would make the matrix too large to fit in GPU memory'
      - 'Because the bias is trained separately from the weights, on a different objective'
    answer_index: 1
    explanation: 'M @ (0, 0) is zero lots of column 0 plus zero lots of column 1, which is (0, 0) whatever the four numbers are. There is no matrix anywhere that moves the origin. So a shift cannot be expressed as a matrix multiplication in the same space, and it has to arrive separately, afterwards. Linear plus a shift has its own name — affine — and the separateness is structural, not stylistic. Option 0 is wrong because it could not be folded in: this is a mathematical impossibility, not a convention. Option 2 is wrong on size — the homogeneous-coordinate trick, which graphics systems do use to make translation look like a multiplication, grows an n by n matrix to (n+1) by (n+1), which is a rounding error in memory terms. Option 3 is wrong: weights and biases are trained together on the same objective by the same gradient step.'

  - question: 'You write assert rotation(math.pi / 2) == [[0.0, -1.0], [1.0, 0.0]] and it fails. Why?'
    options:
      - 'The rotation matrix has the minus sign in the other position'
      - 'math.pi is only accurate to about six decimal places'
      - 'Lists cannot be compared with == in Python'
      - 'math.cos(math.pi / 2) is 6.123233995736766e-17, not 0.0, so the comparison must use a tolerance'
    answer_index: 3
    explanation: 'Pi cannot be stored exactly in binary floating point, so the value handed to cos is not quite pi over 2, and its cosine is not quite zero — it is about 6.1e-17. The same thing happens to sin of 30 degrees, which comes out as 0.49999999999999994. Neither is a bug and neither is fixable; it is what binary floating point is. So every float comparison in this lab states a tolerance of 1e-12 and none use ==, and one of the reference tests asserts the inexactness itself so that the claim cannot quietly stop being true. The first option describes a real and common bug — signs swapped gives a clockwise rotation — but it is not what is happening here, and you can tell the two apart in one line by checking whether (1, 0) went up to (0, 1) or down to (0, -1). The second badly understates the accuracy: a Python float carries roughly fifteen to sixteen significant decimal digits, which is exactly why the error turns up at the seventeenth. The third is simply false; lists compare elementwise with == quite happily, which is how this assertion managed to run and fail rather than raise.'

  - question: 'Twenty matrix layers are applied one after another, with nothing between them. What can the stack do that one layer cannot?'
    options:
      - 'Nothing — the twenty multiply together into a single matrix of the same size'
      - 'It can fit curved decision boundaries, which is why depth helps'
      - 'It can move the origin, once there are enough layers'
      - 'It can achieve any transformation, including non-linear ones, given enough width'
    answer_index: 0
    explanation: 'Composition of linear transformations is a linear transformation, so M20 @ ... @ M2 @ M1 is one matrix and always was. The lab measures it: twenty pseudo-random 2 by 2 matrices applied one at a time give (-3.5017165700891133, -4.824470758326175), and the single combined matrix gives (-3.501716570089111, -4.824470758326172), a relative difference of 6.3e-16 — the same answer to the limits of arithmetic. Depth bought nothing, and options 1, 2 and 4 are all versions of the same wrong hope. The stack still fixes the origin, still sends straight lines to straight lines, and still cannot separate the four exclusive-or points from the start of the lesson. This is the whole reason a non-linear activation sits between the layers: it breaks the additivity identity that lets the matrices slide together, so the collapse stops working and depth starts to buy something.'
