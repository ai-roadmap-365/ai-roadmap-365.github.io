title: 'Linear Transformations'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 15
learning_promise: 'After this lesson you will be able to look at any 2 by 2 matrix and say what it does to the plane, because you will know the one fact the whole subject rests on: a matrix is a function, and its columns are where the basis vectors land. If you know where (1, 0) and (0, 1) go, you know where every vector goes, and you never need the picture again. You will state the two conditions that make a transformation linear, test both on a matrix where they hold and on a function that adds a constant where they fail, and see that the failure is exactly the constant — which is the honest reason a network layer keeps its bias separate as X @ W + b. You will derive scaling, reflection, shear and rotation rather than memorise them, including deriving the rotation matrix from the unit circle with cosine and sine defined from scratch. You will compose two transformations into one matrix, get the order right and know why it reads backwards. You will meet the determinant as a measured area rather than a formula, with a negative one that reports a flip and a zero one that reports a permanent collapse, and you will know when an inverse exists and what NumPy raises when it does not. And you will finish holding the thing this day exists for: a linear transformation always fixes the origin and always sends straight lines to straight lines, so a stack of twenty of them is one 2 by 2 matrix and can draw no curve at all. That is the concrete, measured reason activation functions are not optional.'
objectives:
  - 'Read a transformation matrix off the landing places of the two basis vectors, read the landings back off the columns, and say why a row is never a landing place'
  - 'State the two conditions that define a linear transformation — it preserves addition and it preserves scalar multiplication — and test both in code'
  - 'Demonstrate that adding a constant breaks both conditions, and quantify the failure as exactly b and exactly (s minus 1) times b'
  - 'Explain why every linear transformation fixes the origin, and use that as a one-second test for linearity'
  - 'Derive the scaling, reflection and shear matrices from where the basis vectors land, rather than recalling them'
  - 'Derive the rotation matrix from the unit circle, defining cosine, sine and the radian along the way'
  - 'Compose two transformations into a single matrix, and read a product right to left because the first step stands next to the vector'
  - 'Interpret the determinant geometrically as the signed area factor, and measure it rather than compute it'
  - 'Say what a negative determinant means for orientation and what a zero determinant means for information'
  - 'State when an inverse exists, write down the inverse of a shear and a scaling by reasoning, and name the exception numpy.linalg.inv raises on a singular matrix'
  - 'Explain rank in plain language as how many dimensions survive, and read it off a 2 by 2 matrix by eye'
  - 'Compare floats with a stated tolerance and justify the number, knowing that cos of pi over 2 is not 0.0'
  - 'Explain, and demonstrate, why no stack of linear layers can separate data that needs a curve — and why that is the reason activation functions exist'
prerequisites:
  - 'Day 99 — vectors: components, magnitude, and what an arrow with coordinates means'
  - 'Day 100 — matrices and their three readings. Today is the third reading, in full'
  - 'Day 101 — matrix multiplication as composition. Today supplies the geometry behind the order rule'
  - 'Day 70 — floating point, which is why every comparison in this lesson declares a tolerance'
  - 'Day 43 — python3 -m venv and installing a package with pip; the lab installs numpy and pytest into a lab-local environment'
  - 'Days 71 to 74 — pytest, which the lab uses for both the reference suite and the running score'
  - 'No mathematics beyond school arithmetic. Cosine, sine and the radian are defined from the unit circle where they first appear'
