terms:
  - term: 'Linear transformation'
    definition: 'A function taking a vector and returning a vector that satisfies exactly two conditions: it preserves addition, so f(u + v) equals f(u) + f(v), and it preserves scalar multiplication, so f(cu) equals c f(u). Nothing else is in the definition. Every geometric fact about them — that the origin never moves, that straight lines stay straight, that evenly spaced points stay evenly spaced — is a consequence of those two lines rather than an addition to them. In two dimensions every such function can be written as a 2 by 2 matrix, and every 2 by 2 matrix is one.'
  - term: 'Basis vector'
    definition: 'One of a small set of vectors from which every other vector in the space can be built by scaling and adding. In the plane two are enough, and knowing where a linear transformation sends them determines where it sends everything else — which is the single most useful fact in the subject.'
  - term: 'Standard basis'
    definition: 'The particular pair e1 = (1, 0) and e2 = (0, 1) in two dimensions: one step right and one step up. Every vector (x, y) is x lots of e1 plus y lots of e2, which is what makes their landing places sufficient to describe a whole transformation. Written as e1, e2 and so on up to en in n dimensions.'
  - term: 'Transformation matrix'
    definition: 'The matrix whose columns are the landing places of the basis vectors: column 0 is where e1 goes, column 1 is where e2 goes. Formally A = the matrix whose columns are T(e1), T(e2) and so on. The most common error in the whole topic is reading a ROW as a landing place — the matrix is written across and it means down.'
  - term: 'Scaling'
    definition: 'Stretching or shrinking along the axes, with matrix [[sx, 0], [0, sy]]. Derived rather than remembered: one step right becomes sx steps right, so e1 lands at (sx, 0); one step up becomes sy steps up, so e2 lands at (0, sy). Its determinant is sx times sy, which is why scaling by 2 and 3 makes every area six times bigger.'
  - term: 'Reflection'
    definition: 'A mirroring of the plane in some line through the origin, with matrix [[1, 0], [0, -1]] for the x axis. Derived by noticing that a point ON the mirror line cannot move, so e1 stays put, while e2 goes from one step up to one step down. Its determinant is always -1: the size is preserved and the orientation is reversed, so a shape listed anticlockwise comes out listed clockwise.'
  - term: 'Shear'
    definition: 'A sideways slide in proportion to height, with matrix [[1, k], [0, 1]] for the horizontal case. The deck of cards pushed over: the bottom card does not move, every card above it slides further. e1 has height 0 so nothing pushes it; e2 has height 1 so it lands at (k, 1). Its determinant is exactly 1, because sliding the cards changes no areas — the sheared square has the same base and the same height as the original.'
  - term: 'Rotation matrix'
    definition: 'The matrix [[cos t, -sin t], [sin t, cos t]], which turns the whole plane anticlockwise by t radians about the origin. Derived from the unit circle in two steps: e1 walks around the rim to (cos t, sin t), which is the definition of those two functions, and e2 — already a quarter turn ahead — lands a quarter turn ahead of that, at (-sin t, cos t). Its determinant is cos squared plus sin squared, which is 1 by Pythagoras, so a rotation never changes area and never flips.'
  - term: 'Radian'
    definition: 'An angle measured as the distance walked around the rim of a circle of radius 1. The whole circumference is 2 pi, so a full turn is 2 pi radians, a half turn is pi and a quarter turn is pi over 2. Every trigonometric function in Python takes radians; math.radians converts from degrees.'
  - term: 'Composition'
    definition: 'Doing one transformation and then another. The single matrix that does both is the product of the two, with the FIRST step written on the RIGHT: applying A then B is B @ A, because A is the one standing next to the vector in B @ (A @ v). Matrix multiplication was defined by Binet in 1812 precisely to be this operation, which is why it does not commute — putting on socks then shoes is not the same as shoes then socks.'
  - term: 'Determinant'
    definition: 'The signed factor by which a transformation multiplies area, equal to a*d - b*c for a 2 by 2 matrix [[a, b], [c, d]]. Best met by measuring rather than by formula: send the unit square through and the signed area of what comes out IS the determinant. Its size is the area factor, its sign is the orientation, and a value of zero means the plane was flattened onto a line and nothing can undo it.'
  - term: 'Orientation'
    definition: 'Which way round a shape is wound — anticlockwise or clockwise. A positive determinant preserves it and a negative one reverses it, meaning the plane was turned over. No rotation undoes a reversal, in the same way no amount of turning a left glove makes it a right one. Measured by the sign of a polygon area computed with the shoelace formula.'
  - term: 'Singular matrix'
    definition: 'A square matrix whose determinant is zero, so it has no inverse. Geometrically it flattens the space: for a 2 by 2 matrix both columns lie along the same line, so every vector lands on that line and two different starting points can share a landing place. numpy.linalg.inv raises LinAlgError with the message "Singular matrix" rather than returning anything, and because LinAlgError is a subclass of ValueError, except ValueError catches it.'
  - term: 'Inverse'
    definition: 'The transformation that undoes another one, so that composing the two gives the identity. For 2 by 2 it is one over the determinant times [[d, -b], [-c, a]], and it exists precisely when the determinant is not zero — the same sentence as "precisely when no area was destroyed". Often writable by reasoning rather than formula: the inverse of shear_x(2) is shear_x(-2), of scaling by 2 and 3 is scaling by a half and a third, and of a reflection is the same reflection.'
  - term: 'Rank'
    definition: 'How many dimensions survive the transformation. Feed the whole plane in: if the output still fills the plane the rank is 2, if it is squashed onto a line the rank is 1, if everything lands on the origin the rank is 0. For a 2 by 2 matrix it reads off the columns — two columns pointing in genuinely different directions give rank 2, one column being a multiple of the other gives rank 1. numpy.linalg.matrix_rank computes it, and it is the more useful word than "determinant" once matrices stop being square.'
  - term: 'Identity matrix'
    definition: 'The matrix that leaves every vector exactly where it found it, [[1, 0], [0, 1]] in two dimensions. Under today reading it has a reason rather than a definition: it is what you write down when the basis vectors did not move, so nothing else moves either. Its determinant is 1 and its rank is full. numpy.eye(n) builds one.'
  - term: 'Affine transformation'
    definition: 'A linear transformation followed by a shift: x maps to M @ x + b. It is NOT linear, because it moves the origin and therefore fails both conditions — the additivity failure is exactly b and the scaling failure is exactly (s - 1) times b. Every neural network layer is affine, which is why the bias is written separately as X @ W + b: a matrix cannot move the origin, and b exists to move it.'
  - term: 'Homogeneous coordinates'
    definition: 'A trick that makes a shift look like a matrix multiplication by writing a 2D point (x, y) as the 3D vector (x, y, 1), whereupon translation becomes an ordinary 3 by 3 matrix product. It is why a 2D graphics transform is a 3 by 3 matrix and why CSS and SVG take six numbers for a 2D transform: four for the linear part and two for the shift. The shift did not become linear; it was moved to a bigger space where it could pretend to be.'
  - term: 'Activation function'
    definition: 'A deliberately non-linear function placed between the linear layers of a network — ReLU, which replaces every negative number with zero, being the usual choice. Its job is precisely to break the identity that lets consecutive matrices slide together into one. Without it, twenty layers multiply into a single matrix and depth buys nothing at all; with it, the collapse is blocked and the composite can describe boundaries no straight line could.'
  - term: 'Tolerance'
    definition: 'The margin within which two floating-point numbers are treated as equal, stated explicitly and with a reason rather than assumed. This lesson uses 1e-12, because cos of pi over 2 comes out as 6.123233995736766e-17 rather than 0.0 and sin of 30 degrees as 0.49999999999999994 rather than 0.5 — both about 1e-17 from the exact answer. The chosen value sits five orders of magnitude above that rounding and four below the smallest quantity the lab cares about, so it accepts the noise and would still catch a real error.'
  - term: 'Shoelace formula'
    definition: 'A way of computing the area of a polygon from its corners: walk them in order, add x_here times y_next minus x_next times y_here for each edge, and halve the total. Named for the way the cross-multiplied pairs criss-cross like lacing. Its sign depends on which way round the corners are listed, which is what makes it the right tool for measuring a determinant directly rather than computing one.'
