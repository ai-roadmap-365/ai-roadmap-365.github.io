visuals:
  - id: distribution-views-architecture
    file: assets/distribution-views-architecture.svg
    type: diagram
    title: 'One sample, five pictures -- histogram, KDE, ECDF, boxplot and strip plot -- each labelled with what it reveals and what it conceals'
    alt: 'Diagram: the same bimodal sample of points drawn five different ways in five side-by-side panels. The histogram panel shows two bars of different heights with a visible gap, labelled reveals: two separate clusters and their relative sizes, conceals: the exact shape depends on the chosen bin width. The KDE panel shows a smooth two-humped curve, labelled reveals: a smooth two-humped shape with no visible bin edges, conceals: the curve depends on a chosen bandwidth and can place density past a real boundary. The ECDF panel shows a rising staircase, labelled reveals: every observation and any exact quantile with no chosen parameter at all, conceals: the number of modes is hard to see at a glance. The boxplot panel shows a single box with a median line and whiskers, labelled reveals: the five-number summary, position and spread, conceals: whether the distribution is unimodal or bimodal -- a boxplot cannot show this. The strip plot panel shows every individual point as a small dot in two visible clusters, labelled reveals: every single raw observation, conceals: nothing about shape, but becomes unreadable once there are too many points to see individually. A caption beneath the five panels states that these are five views of the identical sample, not five competing conclusions'
    description: >-
      A static architecture diagram: one title band followed by five equal panels laid out left to right,
      each drawing the identical bimodal sample as a different chart type -- histogram, KDE, ECDF,
      boxplot, strip plot -- with the panel's name in blue, a small hand-drawn representative chart, and
      two short labelled lines beneath it: a green "reveals:" line and a red "conceals:" line. A closing
      caption band beneath all five panels states plainly that every one of the five pictures is
      arithmetically correct and that each discards something specific, which is the professional habit
      the day's lesson is built to teach.
  - id: binwidth-flow
    file: assets/binwidth-flow.svg
    type: flow-animated
    title: 'The same 500 points binned three ways as the bin width grows -- a second mode appears at the right width and dissolves once the bins grow too wide'
    alt: 'Diagram: the identical 500-point sample flows down into three histogram panels arranged left to right by increasing bin width. The first panel, 100 narrow bins, shows a jagged row of mostly tiny bars with no clear pattern, captioned noise, not structure. The second panel, 13 bins chosen by the Freedman-Diaconis rule, shows two clearly separated tall bars with a gap between them, captioned the real two-cluster structure, appearing. The third panel, 5 wide bins, shows one smooth tall hump, captioned the same two clusters, now merged into one. A wire with marching dashes connects the three panels in order and each panel''s border glows briefly in sequence, narrow first, then chosen, then wide, showing the second mode appearing at the chosen width and dissolving again as the bins widen further. A bottom caption states that with motion disabled, all three panels, their bars and their captions are already fully drawn and none of the diagram''s meaning depends on the animation playing'
    description: >-
      An animated flow diagram, fully readable as a still image, in three panels left to right: 100 narrow
      bins (jagged noise, more than twenty spurious bumps), 13 bins chosen by Freedman-Diaconis (two tall
      bars with a real gap between them, the genuine structure), and 5 wide bins (one smooth merged hump).
      A dashed wire with marching ants connects the panels in order, and each panel's border briefly glows
      blue in sequence -- narrow first, then chosen, then wide -- so the animation reads as "watch the
      story change as the bins widen." A small row of falling point tokens above each panel animates
      downward into that panel's histogram, timed to the same three-part sequence. A prefers-reduced-motion
      block freezes every token at its landed position and every panel border at its resting grey, with no
      animation, while every bar, label and caption stays fully drawn and fully legible.
