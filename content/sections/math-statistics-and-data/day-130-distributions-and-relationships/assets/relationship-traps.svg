<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four traps.">
  <title>Where relationships mislead</title>
  <style>
    .relationship-traps-bg   { fill: #f8fafc; }
    .relationship-traps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationship-traps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationship-traps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationship-traps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationship-traps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relationship-traps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .relationship-traps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .relationship-traps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .relationship-traps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .relationship-traps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .relationship-traps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .relationship-traps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .relationship-traps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .relationship-traps-stage { opacity: 1; }

    .relationship-traps-s0 { animation-delay: 0.00s; }
    .relationship-traps-e0 { animation-delay: 0.00s; }
    .relationship-traps-s1 { animation-delay: 1.28s; }
    .relationship-traps-e1 { animation-delay: 1.28s; }
    .relationship-traps-s2 { animation-delay: 2.56s; }
    .relationship-traps-e2 { animation-delay: 2.56s; }
    .relationship-traps-s3 { animation-delay: 3.84s; }
    .relationship-traps-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .relationship-traps-conn  { animation: relationship-traps-trace 6.4s ease-in-out infinite; }
      .relationship-traps-stage { animation: relationship-traps-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes relationship-traps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes relationship-traps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .relationship-traps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .relationship-traps-stage { animation: relationship-traps-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes relationship-traps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="relationship-traps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="relationship-traps-bg" width="980" height="322"/>
  <text class="relationship-traps-h1"  x="30" y="40">Where relationships mislead</text>
  <text class="relationship-traps-sub" x="30" y="64">Four traps.</text>
  <g class="relationship-traps-stage relationship-traps-s0">
    <rect class="relationship-traps-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="relationship-traps-step" x="44" y="142">01</text>
    <text class="relationship-traps-name" x="70" y="142">Correlation taken as causation</text>
    <text class="relationship-traps-desc" x="44" y="166">Which the data cannot establish.</text>
  </g>
  <line class="relationship-traps-line relationship-traps-conn relationship-traps-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#relationship-traps-tip)"/>
  <g class="relationship-traps-stage relationship-traps-s1">
    <rect class="relationship-traps-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="relationship-traps-step" x="280" y="142">02</text>
    <text class="relationship-traps-name" x="306" y="142">A third variable driving both</text>
    <text class="relationship-traps-desc" x="280" y="166">Which is confounding.</text>
  </g>
  <line class="relationship-traps-line relationship-traps-conn relationship-traps-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#relationship-traps-tip)"/>
  <g class="relationship-traps-stage relationship-traps-s2">
    <rect class="relationship-traps-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="relationship-traps-step" x="516" y="142">03</text>
    <text class="relationship-traps-name" x="542" y="142">A relationship that reverses within groups</text>
    <text class="relationship-traps-desc" x="516" y="166">Which the aggregate hides.</text>
  </g>
  <line class="relationship-traps-line relationship-traps-conn relationship-traps-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#relationship-traps-tip)"/>
  <g class="relationship-traps-stage relationship-traps-s3">
    <rect class="relationship-traps-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="relationship-traps-step" x="752" y="142">04</text>
    <text class="relationship-traps-name" x="778" y="142">And dense points hiding the true density</text>
    <text class="relationship-traps-desc" x="752" y="166">Where transparency or binning</text>
    <text class="relationship-traps-desc" x="752" y="182">helps.</text>
  </g>
  <text class="relationship-traps-sub" x="30" y="304">The within-group reversal is the most striking of these, because the aggregate and every subgroup can point in opposite directions simultaneously.</text>
</svg>
