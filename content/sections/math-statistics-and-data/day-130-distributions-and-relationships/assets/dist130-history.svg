<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward causal care.">
  <title>Four steps in studying relationships</title>
  <style>
    .dist130-history-bg   { fill: #f8fafc; }
    .dist130-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dist130-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dist130-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dist130-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dist130-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dist130-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dist130-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dist130-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dist130-history-stage { opacity: 1; }

    .dist130-history-s0 { animation-delay: 0.00s; }
    .dist130-history-e0 { animation-delay: 0.00s; }
    .dist130-history-s1 { animation-delay: 1.28s; }
    .dist130-history-e1 { animation-delay: 1.28s; }
    .dist130-history-s2 { animation-delay: 2.56s; }
    .dist130-history-e2 { animation-delay: 2.56s; }
    .dist130-history-s3 { animation-delay: 3.84s; }
    .dist130-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dist130-history-conn  { animation: dist130-history-trace 6.4s ease-in-out infinite; }
      .dist130-history-stage { animation: dist130-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dist130-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dist130-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dist130-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dist130-history-stage { animation: dist130-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dist130-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dist130-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dist130-history-bg" width="980" height="322"/>
  <text class="dist130-history-h1"  x="30" y="40">Four steps in studying relationships</text>
  <text class="dist130-history-sub" x="30" y="64">Toward causal care.</text>
  <g class="dist130-history-stage dist130-history-s0">
    <rect class="dist130-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dist130-history-step" x="44" y="142">01</text>
    <text class="dist130-history-name" x="70" y="142">Plotting pairs of measurements against each other</text>
    <text class="dist130-history-desc" x="44" y="166">Which made association visible.</text>
  </g>
  <line class="dist130-history-line dist130-history-conn dist130-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dist130-history-tip)"/>
  <g class="dist130-history-stage dist130-history-s1">
    <rect class="dist130-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dist130-history-step" x="280" y="142">02</text>
    <text class="dist130-history-name" x="306" y="142">Then correlation as a single summary number</text>
    <text class="dist130-history-desc" x="280" y="166">Which compressed it, and lost</text>
    <text class="dist130-history-desc" x="280" y="182">the form.</text>
  </g>
  <line class="dist130-history-line dist130-history-conn dist130-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dist130-history-tip)"/>
  <g class="dist130-history-stage dist130-history-s2">
    <rect class="dist130-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dist130-history-step" x="516" y="142">03</text>
    <text class="dist130-history-name" x="542" y="142">Then regression, describing the relationship</text>
    <text class="dist130-history-desc" x="516" y="166">With a stated model.</text>
  </g>
  <line class="dist130-history-line dist130-history-conn dist130-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dist130-history-tip)"/>
  <g class="dist130-history-stage dist130-history-s3">
    <rect class="dist130-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dist130-history-step" x="752" y="142">04</text>
    <text class="dist130-history-name" x="778" y="142">And modern causal inference, with explicit assumptions</text>
    <text class="dist130-history-desc" x="752" y="166">About what may be concluded.</text>
  </g>
  <text class="dist130-history-sub" x="30" y="304">Modern causal work is largely about making assumptions explicit, since the same data supports different causal conclusions under different assumed structures.</text>
</svg>
