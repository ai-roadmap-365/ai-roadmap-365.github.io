questions:
  - question: >-
      The same 500-point sample is histogrammed at 5 bins and at 100 bins. At 5 bins it shows one hump; at
      100 bins it shows more than twenty spurious bumps. What changed about the underlying data between
      the two charts?
    options:
      - Nothing -- the data is identical in both charts; only the bin width changed
      - The sample was re-drawn with a different random seed for the second chart
      - The 100-bin chart used a larger sample size than the 5-bin chart
      - The 5-bin chart applied a smoothing filter the 100-bin chart did not
    answer_index: 0
    explanation: >-
      Both charts draw the exact same 500 observations. A histogram's shape is a joint function of the
      data AND the bin width, and this lab's own capture shows the same sample recovering its real
      two-mode structure only at an intermediate, deliberately chosen bin count (Freedman-Diaconis, 13
      bins on this draw) -- neither extreme shows the truth.
  - question: >-
      Freedman-Diaconis chooses bin width from a sample's interquartile range (IQR) rather than its
      standard deviation. Why does that make it more resistant to a skewed or outlier-heavy sample than
      Scott's rule?
    options:
      - Freedman-Diaconis always produces exactly as many bins as Sturges' rule, avoiding the issue
      - 'The IQR is robust; extreme values inflate the SD instead'
      - Freedman-Diaconis ignores the sample size entirely, so extreme values have no effect at all
      - Scott's rule requires the data to be sorted first, which fails silently on skewed data
    answer_index: 1
    explanation: >-
      The standard deviation is sensitive to outliers because it squares deviations from the mean; a
      handful of extreme points can inflate it substantially and Scott's rule then chooses bins too wide
      to show real structure. The IQR only depends on the middle 50% of the data, so it barely moves when
      a few extreme values are added -- the same robustness property Day 116 established for the IQR as a
      spread measure.
  - question: >-
      A KDE looks like a single smooth, authoritative curve with no visible bin edges. What decision does
      it still depend on that is exactly analogous to a histogram's bin width?
    options:
      - The color palette chosen for the plot
      - Whether the y-axis is drawn on a linear or log scale
      - 'Its bandwidth — how wide each kernel is'
      - The number of observations in the sample
    answer_index: 2
    explanation: >-
      A KDE's bandwidth controls exactly the same trade-off a histogram's bin width controls: too narrow
      and every bit of sampling noise looks like a real bump; too wide and a genuine second mode gets
      smoothed into invisibility. This lab's exercise 3 shows the identical bimodal sample reporting two
      modes at seaborn's default bandwidth and one mode at bw_adjust=3.0 -- same data, different answer.
  - question: >-
      A KDE is drawn over a sample of strictly positive values (durations, all greater than zero). What
      does a standard Gaussian-kernel KDE do at and below zero that a histogram of the same data would
      never do?
    options:
      - It refuses to draw and raises an error
      - It correctly clips the curve to exactly zero at x = 0
      - It doubles the density near zero to compensate for the missing left side
      - 'It puts density below zero, where data cannot go'
    answer_index: 3
    explanation: >-
      A standard KDE has no built-in concept of a hard boundary -- it places a symmetric kernel at every
      observation, including ones close to zero, and half of that kernel's mass lands below zero
      regardless of whether the underlying quantity can ever be negative. This lab's exercise 4 measures
      that directly: on a real exponential sample, more than 9% of the KDE's total area sits at x < 0.
  - question: >-
      Two samples are constructed so their five-number summaries (min, Q1, median, Q3, max) agree to
      within a few tenths of a unit. What does this guarantee about the two samples' overall shape?
    options:
      - 'Nothing — five numbers fit many different shapes'
      - It guarantees both samples are unimodal, since a boxplot cannot represent more than one mode
      - It guarantees both samples have the same number of observations
      - It guarantees both samples were drawn from the same underlying distribution
    answer_index: 0
    explanation: >-
      This is the day's centrepiece demonstration: two samples engineered to share a five-number summary
      within 0.3 units nonetheless show 2 modes and 1 mode respectively when histogrammed at the same bin
      count. A boxplot summarizes position (quartiles), not shape -- it is entirely blind to how many
      humps the underlying density actually has.
  - question: >-
      What makes an ECDF (empirical cumulative distribution function) different from both a histogram and
      a KDE in terms of the parameters it requires?
    options:
      - It requires a bandwidth like a KDE, but no bin width
      - 'Neither a bin width nor a bandwidth is needed'
      - It requires both a bin width and a bandwidth, chosen jointly
      - It requires a bin width like a histogram, but no bandwidth
    answer_index: 1
    explanation: >-
      An ECDF plots, at every value x, the exact fraction of the sample less than or equal to x -- a step
      function built directly from the sorted data with no grouping decision anywhere. This lab's exercise
      6 confirms two direct consequences: every observation appears as a step, and the value where the
      curve crosses 0.5 matches numpy.median to nine decimal places.
  - question: >-
      A relationship between x and y is a symmetric parabola (y = x^2, x ranging on both sides of zero).
      What does this lesson's own captured measurement find about Pearson AND Spearman correlation on
      that relationship?
    options:
      - Pearson is near zero but Spearman correctly reports a strong relationship
      - Spearman is near zero but Pearson correctly reports a strong relationship
      - 'Both near zero — a parabola is neither linear nor monotonic'
      - Both report a strong relationship, since both can detect any deterministic function of x
    answer_index: 2
    explanation: >-
      This lesson's own measured run found both close to zero (Pearson about -0.004, Spearman about
      -0.023) on a genuinely deterministic y = x^2 + noise relationship with a fitted-quadratic R^2 above
      0.99. A symmetric parabola rises on one side and falls on the other, so it has no consistent
      direction for a rank correlation to find either -- only fitting the actual shape, or looking at the
      scatter, reveals it. This is a sharper example than "Pearson misses it, Spearman catches it," and
      the honest, stronger version of the lesson's own argument for plotting before computing a
      coefficient.
  - question: >-
      Jitter adds small random noise to a variable's PLOTTED position so that repeated discrete values do
      not draw exactly on top of each other. What is the correct way to disclose this when publishing a
      jittered chart?
    options:
      - No disclosure is needed -- jitter is a standard, universally understood convention
      - Jitter should never be disclosed, since disclosing it would undermine the chart's credibility
      - Replace the axis labels with "approximate" to signal the distortion
      - 'State the jitter width in the caption'
    answer_index: 3
    explanation: >-
      Jitter is a deliberate, useful distortion -- it is not the underlying data. A reader who does not
      know a jitter width might read two nearby jittered points as genuinely different values on a
      continuous scale, when the real data is discrete and the two points may in fact be identical. This
      lab's exercise 9 confirms the mechanism directly: every jittered point differs from its true value
      by no more than the stated jitter width, and the source array is completely unchanged by the
      operation.
