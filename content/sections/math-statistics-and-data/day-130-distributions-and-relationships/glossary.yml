terms:
  - term: bin width
    definition: >-
      The chosen width of each interval a histogram sorts values into. Every histogram picks one --
      whether the person drawing it thought about it or not -- and the same underlying data can look
      unimodal, bimodal, or like pure noise depending only on this choice. Sturges, Scott and
      Freedman-Diaconis (below) are three different rules for choosing it automatically.
  - term: Sturges' rule
    definition: >-
      A bin-count rule based only on the sample size n, choosing roughly log2(n) + 1 bins. It assumes the
      data is close to normally distributed and tends to under-bin skewed or heavy-tailed data, but is
      matplotlib's and NumPy's default because it is cheap and rarely produces an unreasonable-looking
      chart on well-behaved data.
  - term: Scott's rule
    definition: >-
      A bin-width rule based on the sample's standard deviation and size, choosing a width proportional to
      3.49 * (standard deviation) * n^(-1/3). Like Sturges, it assumes roughly normal data, so a heavy
      outlier or a strongly skewed shape inflates the standard deviation and produces bins wider than the
      data's real structure would justify.
  - term: Freedman-Diaconis rule
    definition: >-
      A bin-width rule based on the interquartile range (IQR) rather than the standard deviation, choosing
      a width proportional to 2 * IQR * n^(-1/3). Because the IQR is a robust statistic (Day 116), this
      rule resists distortion by outliers and skew in a way Sturges' and Scott's rules do not, which is
      why it recovers structure the other two rules can wash out.
  - term: kernel density estimate (KDE)
    definition: >-
      A smooth curve estimating a distribution's probability density, built by placing a small bump
      (kernel, almost always Gaussian in practice) at every observation and summing them. A KDE looks
      more authoritative than a histogram because it has no visible bin edges, but it depends just as
      completely on a chosen parameter -- its bandwidth -- as a histogram depends on its bin width.
  - term: bandwidth
    definition: >-
      The width of the kernel placed at each observation in a KDE -- the direct analogue of a histogram's
      bin width. A narrow bandwidth shows every bump in the data, including noise; a wide bandwidth
      smooths real structure away, including a genuine second mode. seaborn exposes it as bw_adjust, a
      multiplier on its own automatically chosen bandwidth.
  - term: KDE boundary problem
    definition: >-
      The fact that a standard (Gaussian-kernel) KDE has no concept of a hard boundary in the data, so a
      KDE of a strictly positive quantity (a price, a duration, a count) places real, non-zero density on
      the impossible region below zero. The fraction of mass placed there depends on how close the data
      sits to the boundary and how wide the bandwidth is.
  - term: empirical cumulative distribution function (ECDF)
    definition: >-
      A step function that, at any value x, reports the fraction of the sample less than or equal to x. It
      requires no bin width and no bandwidth -- every observation is a step, and nothing is smoothed,
      grouped, or discarded. A quantile (including the median) can be read directly off it by finding
      where the curve crosses that fraction.
  - term: five-number summary
    definition: >-
      The minimum, first quartile (Q1), median, third quartile (Q3), and maximum of a sample -- the entire
      content a standard boxplot draws. Two samples can share an identical five-number summary while
      having completely different shapes; the five-number summary alone cannot tell a unimodal
      distribution from a bimodal one, or reveal outliers a whisker rule would otherwise flag.
  - term: overplotting
    definition: >-
      What happens to a scatter plot once there are enough points that many of them land on, or very near,
      the same pixel -- the plot stops showing individual observations and starts showing a silhouette of
      density with no indication of how many points are stacked at any location. Transparency (alpha),
      hexbin, and 2-D density estimates are three different fixes, each trading away something different.
  - term: hexbin
    definition: >-
      A 2-D histogram that tiles the plotting area with hexagons instead of squares and colors each one by
      how many points fall inside it, fixing overplotting by aggregating count instead of trying to make
      individual points visible. It answers "how dense is this region" rather than "where exactly are the
      points," which is a real trade, not a free upgrade.
  - term: Pearson correlation
    definition: >-
      A number from -1 to 1 measuring the strength of a LINEAR relationship between two variables (Day
      116). It is close to zero for a strong relationship of any other shape -- including a perfectly
      deterministic parabola -- because Pearson correlation has no way to represent curvature, only a
      straight-line trend.
  - term: Spearman correlation
    definition: >-
      A correlation computed on the RANKS of two variables rather than their raw values, so it measures
      the strength of any MONOTONIC relationship (one that consistently increases, or consistently
      decreases), not just a linear one. It still misses a relationship that rises and then falls, such as
      a symmetric parabola, because that relationship is not monotonic either.
  - term: jitter
    definition: >-
      A small amount of random noise added to a variable's plotted position -- never to the underlying
      data -- so that discrete or repeated values do not draw exactly on top of each other. Jitter is a
      deliberate, disclosed distortion of position for the sake of visibility; the caption or a stated
      jitter width should say so, because an unlabelled jittered axis can be read as more precise than it
      is.
  - term: log scale
    definition: >-
      An axis on which equal visual distances represent equal multiplicative factors (each step is a
      times-ten, or a doubling) rather than equal additive amounts. It compresses a long right tail and
      makes proportional differences comparable across orders of magnitude, at the cost that zero and
      negative values have no position on the axis at all (Day 128).
