learning_promise: >-
  After this lesson you will be able to draw the same sample at several bin counts and show a genuinely
  bimodal distribution collapsing into one hump at a coarse count and dissolving into noise at a fine one,
  then recover its real structure with the Freedman-Diaconis rule and explain why that rule resists
  outliers where Sturges' and Scott's rules do not; treat a KDE's bandwidth as the exact same kind of
  decision as a histogram's bin width, and state plainly that a KDE of strictly positive data places real
  density below zero; construct two samples that share a five-number summary to a tight tolerance while
  one is unimodal and the other bimodal, proving directly that a boxplot cannot show what a histogram or
  an ECDF can; read a quantile straight off an ECDF with no bin width or bandwidth involved; demonstrate
  that a boxplot of a bimodal distribution is indistinguishable from a boxplot of a unimodal one with
  matching quartiles; quantify overplotting by counting how many of thousands of points collide onto the
  same screen pixel, and choose between alpha, hexbin and 2-D density as three different trades; show a
  strong non-linear relationship with near-zero Pearson AND Spearman correlation and explain why only
  fitting or plotting the actual shape reveals it; apply and disclose jitter as a deliberate, bounded
  distortion of plotted position; and read a log-scaled axis for skewed data while knowing exactly what it
  does to the visual weight of the tail and to a zero-valued point.
objectives:
  - 'Demonstrate that the same 500-point bimodal sample shows one mode at a coarse bin count, two modes under Freedman-Diaconis, and more than ten spurious modes at a fine bin count -- and explain why the choice of bin width is the whole difference'
  - 'Compute bin counts from Sturges'', Scott''s and Freedman-Diaconis'' rules on the same skewed sample with numpy.histogram_bin_edges, show all three disagree, and explain why the IQR-based rule resists outliers where the other two do not'
  - 'Treat a KDE''s bandwidth (bw_adjust in seaborn) as the direct analogue of a histogram''s bin width, and demonstrate the identical sample reporting two modes at one bandwidth and one at another'
  - 'State the KDE boundary problem precisely -- a Gaussian-kernel KDE of strictly positive data places real, non-zero density below zero -- and measure the fraction of density misplaced there on a real exponential sample'
  - 'Construct or explain two samples whose five-number summaries agree within a tight tolerance while their histograms show a different number of modes, and state exactly what a boxplot of either sample would never have revealed'
  - 'Read an ECDF directly: confirm it passes through every observation with no bin width or bandwidth involved, and that its median crossing matches numpy.median exactly'
  - 'Quantify overplotting by converting data coordinates to pixel coordinates and counting collisions, and choose between alpha, hexbin and a 2-D density estimate for a large scatter, stating what each trades away'
  - 'Demonstrate that Pearson correlation measures linear association only, construct a strong non-linear (and, in the sharpest case, non-monotonic) relationship where both Pearson AND Spearman are near zero, and explain why only fitting or plotting the shape reveals it'
  - 'Apply jitter to discrete data, quantify the maximum distortion it introduces, and state the disclosure a jittered chart owes its reader'
  - 'Read a log-scaled axis for right-skewed data, describe what it does to the visual weight of the tail, and connect Day 128''s point that a log axis silently drops a zero-valued observation'
  - 'Build a small pair plot for a handful of variables, and explain concretely why the same approach stops working past roughly a dozen columns'
  - 'Choose among matplotlib, seaborn, pandas'' .plot accessor and scipy.stats.gaussian_kde for a given distribution or relationship question, stating what was actually run in this lesson and what was described from documentation only'
prerequisites:
  - 'Day 116 -- descriptive statistics that don''t lie, specifically Anscombe''s quartet and the discipline of asking what a summary statistic discarded, which this day''s five-number-summary demonstration extends directly'
  - 'Day 114 -- random variables and distributions, the mathematical foundation this day treats visually rather than re-deriving'
  - 'Day 127 -- why to visualize and how to choose a chart type'
  - 'Day 128 -- matplotlib''s Figure/Axes/Artist object model and testing by asserting on artists, plus the fact that a log-scaled axis silently drops a zero-valued point, referenced rather than re-derived here'
  - 'Day 129 -- seaborn''s axes-level and figure-level functions, kdeplot and ecdfplot among them, which this day uses without re-explaining the split'
  - 'A working python3 on your PATH; the lab needs the standard library plus seaborn, matplotlib, pandas and NumPy'
