visuals:
  - id: experiment-pipeline-architecture
    file: assets/experiment-pipeline-architecture.svg
    type: diagram
    title: 'The eight-step experiment analysis pipeline, each step with its guarding check and the failure it catches'
    alt: 'Diagram: a vertical pipeline of eight numbered cards, each naming one analysis step, the check that guards it, and the failure it catches, connected top to bottom by a single line. Step 4, randomization checked, and step 7, segments carefully, are shaded to mark them as the two checks most often skipped'
    description: 'A static architecture diagram, on a light background, laid out as eight stacked cards connected by one vertical spine with numbered circles. Card 1 -- The question and the decision it feeds -- checks whether the result can change what you do next, catching an experiment run with no decision attached. Card 2 -- One primary metric, chosen before the data exists -- checks that the headline metric and guardrails are written down first, catching metric shopping. Card 3 -- The analysis plan, written in advance -- checks that the test, alpha, sample size and stopping rule are fixed, catching a stopping rule bent after seeing the data. Card 4, shaded, -- Randomization, checked, the SRM test -- checks a one-shot chi-squared test on final counts against the planned split, catching broken randomization, captioned as the single most valuable and most-skipped check. Card 5 -- Look before you test -- checks distributions, missing values and mean-versus-median on every group, catching a mean dragged away by outliers. Card 6 -- The test and the interval, together -- checks that a p-value, a confidence interval and an effect size in real units all appear together, catching a bare p-value with no size attached. Card 7, shaded, -- Segments, carefully -- checks each segment sign against the pooled sign, flagged rather than concluded, catching a Simpsons paradox reversal. Card 8 -- The verdict, in plain language -- checks for an estimate, an interval and what would have flipped the decision, or an explicit refusal, catching a forced ship-or-not call when the honest answer is inconclusive. A closing caption states that every cards arithmetic can be correct in isolation, and the pipeline is what makes the conclusion trustworthy.'

  - id: srm-and-simpson-flow
    file: assets/srm-and-simpson-flow.svg
    type: flow-animated
    title: 'Two failures that look like success: the split drifting off 50/50 and tripping the mismatch check, then every segment pointing one way while the pooled total points the other'
    alt: 'Diagram: animated flow, two panels. Top panel shows a marker sliding from a planned 50/50 split toward an observed 48/52 split, where a mismatch badge lights up. Bottom panel shows three segment rows each lighting up with a downward, negative arrow in sequence, followed by a pooled row lighting up with an upward, positive arrow -- the opposite direction from every segment that produced it'
    description: 'An animated flow diagram, fully readable as a still image. The top panel, headed "Did the randomization actually work?", draws a horizontal scale from 40% to 60% with a fixed blue marker at the planned 50% split and a red marker that animates sliding from 50% toward 48% and back on a repeating cycle, synchronized with a red "SRM CHECK: FAIL, observed 48/52, p = 1.5e-8" badge that pulses from faint to fully visible as the marker reaches its drifted position, captioned that a drift this small at this sample size is not noise, it is testable, and it fails. An arrow connects down into the bottom panel, headed "Every segment says one thing. The total says the opposite.", which draws three red-tinted rows -- desktop -3.56 percentage points, mobile -2.48 percentage points, tablet -4.30 percentage points, each with a downward arrow -- that light up with a brief scale-and-brighten pulse in sequence, followed after a pause by a green-tinted pooled row with an upward arrow reading +3.89 percentage points that lights up last, visually opposite in both color and arrow direction from every row above it. A closing caption states that every segment got worse under treatment, and pooled, treatment looks better only because it received a larger share of the segment that already converts more. A prefers-reduced-motion block stops every animation: the observed-split marker rests at its drifted 48% position, the FAIL badge rests fully visible, and all four rows rest fully lit at normal scale -- every label, number and arrow direction remains fully present with no motion.'
