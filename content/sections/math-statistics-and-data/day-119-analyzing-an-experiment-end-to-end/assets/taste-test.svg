<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Controlled, or not.">
  <title>A blind comparison</title>
  <style>
    .taste-test-bg   { fill: #f8fafc; }
    .taste-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taste-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taste-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taste-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taste-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taste-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .taste-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .taste-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .taste-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .taste-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .taste-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .taste-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .taste-test-row { opacity: 1; }
    .taste-test-r0 { animation-delay: 0.00s; }
    .taste-test-r1 { animation-delay: 0.45s; }
    .taste-test-r2 { animation-delay: 0.90s; }
    .taste-test-r3 { animation-delay: 1.35s; }
    .taste-test-r4 { animation-delay: 1.80s; }
    .taste-test-row { animation: taste-test-reveal 7.3s ease-in-out infinite; }
    @keyframes taste-test-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="taste-test-bg" width="980" height="390"/>
  <text class="taste-test-h1"  x="30" y="40">A blind comparison</text>
  <text class="taste-test-sub" x="30" y="64">Controlled, or not.</text>
  <rect class="taste-test-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="taste-test-name" x="46" y="122">Blinded</text>
  <text class="taste-test-desc" x="46" y="142">Only the variable differs.</text>
  <text class="taste-test-desc taste-test-row taste-test-r0" x="46" y="182">Labels hidden from everyone</text>
  <text class="taste-test-desc taste-test-row taste-test-r1" x="46" y="216">Order randomised</text>
  <text class="taste-test-desc taste-test-row taste-test-r2" x="46" y="250">Same conditions for each</text>
  <text class="taste-test-desc taste-test-row taste-test-r3" x="46" y="284">The difference is attributable</text>
  <text class="taste-test-desc taste-test-row taste-test-r4" x="46" y="318">This is a controlled experiment</text>
  <rect class="taste-test-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="taste-test-name" x="526" y="122">Unblinded</text>
  <text class="taste-test-desc" x="526" y="142">Everything differs.</text>
  <text class="taste-test-desc taste-test-row taste-test-r0" x="526" y="182">Labels visible</text>
  <text class="taste-test-desc taste-test-row taste-test-r1" x="526" y="216">Presented in a fixed order</text>
  <text class="taste-test-desc taste-test-row taste-test-r2" x="526" y="250">Conditions vary</text>
  <text class="taste-test-desc taste-test-row taste-test-r3" x="526" y="284">The difference could be anything</text>
  <text class="taste-test-desc taste-test-row taste-test-r4" x="526" y="318">This is an uncontrolled comparison</text>
  <text class="taste-test-sub" x="30" y="372">The difference being attributable is the whole purpose of the design, and every element of blinding and randomisation exists to protect that one property.</text>
</svg>
