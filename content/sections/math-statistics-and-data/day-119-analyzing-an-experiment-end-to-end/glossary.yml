terms:
  - term: Pre-registration
    definition: >-
      Writing down the primary metric, the significance level, the sample
      size, and the stopping rule before the experiment's data exists, so
      none of them can be adjusted after the fact to make a result look
      better. The direct defense against metric shopping and segment
      fishing alike.

  - term: Primary metric
    definition: >-
      The single, pre-declared number an experiment is judged by. Every
      other metric is either a guardrail (must not worsen) or exploratory
      (reported, never concluded from). Choosing the primary metric after
      seeing the data converts a legitimate analysis into an undisclosed
      multiple-comparisons problem.

  - term: Guardrail metric
    definition: >-
      A metric that must not get worse by more than a pre-declared
      tolerance, and can veto an otherwise-positive verdict on the primary
      metric. In this lesson's lab, page-render latency is the guardrail --
      dataset A's guardrail holds (latency improves slightly); a guardrail
      failure is designed to flip the final verdict regardless of how good
      the primary result looks.

  - term: Sample-ratio mismatch (SRM)
    definition: >-
      A statistically significant difference between the planned traffic
      split and the realized one -- for example, planning 50/50 and
      observing 48/52 at a large sample size. Detected with a one-shot
      chi-squared goodness-of-fit test over the final group counts. A
      failed SRM check means the two groups are not known to be comparable,
      which invalidates every downstream comparison regardless of how
      careful that comparison is.

  - term: Chi-squared goodness-of-fit test
    definition: >-
      A test comparing observed category counts against counts expected
      under a stated hypothesis (here, a 50/50 split). With two categories
      and one degree of freedom, the test statistic is the square of a
      standard normal variable, so its p-value has the closed form
      erfc(sqrt(chi2 / 2)) -- computable with nothing beyond the math
      module.

  - term: Effect size
    definition: >-
      How large an observed difference is, in the metric's own units
      (percentage points for a rate, seconds for a duration) and often also
      as a relative lift. Distinct from a p-value, which answers only
      whether the difference would be surprising under no true effect --
      not how large it is or whether it is worth acting on.

  - term: Simpson's paradox
    definition: >-
      A pattern in which an effect points one way in every subgroup of a
      dataset and the opposite way when the subgroups are pooled, caused by
      the subgroups' relative sizes differing between the groups being
      compared. Measured directly in this lesson's dataset B, where every
      segment shows a negative effect while the pooled effect is positive.

  - term: Segment fishing
    definition: >-
      Testing many segments (region, device, tenure) at the same
      significance threshold used for the primary metric and reporting
      whichever one looks interesting, without correcting for the number of
      segments tested. The multiple-comparisons problem wearing a
      business-stakeholder-friendly disguise; the fix is treating segment
      findings as hypotheses for a dedicated follow-up, never as
      conclusions.

  - term: Peeking (optional stopping)
    definition: >-
      Checking an experiment's significance repeatedly during data
      collection and stopping the moment a threshold is crossed. Inflates
      the true false-positive rate well above the nominal alpha, because
      the analyst is effectively running many correlated tests and taking
      the most favorable one. Demonstrated in this lesson on real data: a
      genuinely significant experiment's running p-value dips below 0.05,
      rises back above it, and only stabilizes much later.

  - term: Novelty effect
    definition: >-
      A metric movement caused by a change being new and attracting
      curiosity, rather than by the change being genuinely better -- one
      that typically fades over days or weeks. A treatment that looks
      strong on day one and weaker by day fourteen may indicate the effect
      was never real beyond curiosity, not that "the effect wore off."

  - term: Statistical versus practical significance
    definition: >-
      Statistical significance answers whether an effect is distinguishable
      from noise; practical significance asks whether an effect, once
      distinguished from noise, is large enough to be worth the cost of
      shipping and maintaining it. A confidence interval that excludes zero
      but spans only a trivially small range can be statistically
      significant and not practically worth acting on.

  - term: Inconclusive verdict
    definition: >-
      A legitimate, first-class experiment outcome in which the confidence
      interval is too wide to rule out either "no meaningful effect" or "a
      meaningful effect" -- distinct from, and not silently rounded to,
      "no effect." The honest response is usually more data or a different
      design, not a forced ship/no-ship call.

  - term: Verdict refusal
    definition: >-
      The deliberate choice to return no effect estimate at all once a
      precondition check (here, the sample-ratio mismatch check) has
      failed, rather than computing and reporting a number anyway with a
      caveat attached. Used in this lesson's `verdict()` function: dataset
      B's verdict carries no `estimate_pp` key, because randomization that
      cannot be trusted makes any downstream number untrustworthy too.
