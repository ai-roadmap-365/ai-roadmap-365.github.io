questions:
  - question: 'An experiment reports a clean 1.8 percentage point lift, p = 0.03, and a 95% confidence interval excluding zero. The analyst mentions, almost in passing, that they looked at seven different metrics before landing on this one. What does this fact do to the result?'
    options:
      - 'It only matters if the seven metrics were all correlated with each other'
      - 'It would matter if the metrics had been tested with a t-test, but not with a z-test'
      - 'Nothing -- the p-value was computed correctly on the metric that was reported, so it remains valid evidence'
      - 'It converts a hidden multiple-comparisons problem into the result: testing seven metrics means roughly one in twenty would cross p<0.05 by chance alone even with no real effect, so the "significant" one may simply be the lucky one'
    answer_index: 3
    explanation: 'Choosing the primary metric after seeing the data has exactly the same statistical effect as Day 118''s multiple-comparisons problem, even though no formal correction was applied and the analyst may not have run seven explicit hypothesis tests -- skimming seven metrics and settling on the interesting one does the same damage. The fix is deciding the primary metric before the data exists, in writing, so there is nothing left to shop among.'

  - question: 'Why must the sample-ratio mismatch (SRM) check be computed once, over the FINAL group counts, rather than continuously as data streams in?'
    options:
      - 'Because chi-squared tests are only valid on data collected within a single calendar day'
      - 'Because the chi-squared formula only accepts inputs collected in one batch'
      - 'It does not matter; checking continuously gives an equivalent result to checking once at the end'
      - 'Because a clean, genuinely 50/50 split will drift above and below 50/50 many times along the way by chance alone as data accumulates, so checking it repeatedly and flagging any mid-stream drift would itself be a form of peeking that trips on nearly every experiment'
    answer_index: 3
    explanation: 'This is the SRM check''s own version of Day 118''s peeking problem: computing it at every intermediate row count would fire false alarms constantly, because a genuinely balanced random process still fluctuates around 50/50 along the way. Computing it once, over the final assigned counts, is what makes the test''s stated alpha meaningful.'

  - question: 'In dataset B, all three segments (desktop, mobile, tablet) show a NEGATIVE effect, but the pooled effect across all segments is positive. What must be true about the segment mix for this Simpson''s-paradox-shaped reversal to occur?'
    options:
      - 'The segments must have identical base conversion rates'
      - 'The treatment and control groups must contain very different proportions of the segments, correlated with each segment''s base rate -- for example, treatment stuffed with a high-base-rate segment and control stuffed with a low-base-rate one'
      - 'The sample size must be too small for the segment-level tests to have any power'
      - 'At least one segment must have exactly zero conversions'
    answer_index: 1
    explanation: 'In dataset B, the treatment arm received a much larger share of the high-converting "desktop" segment while control received a much larger share of the low-converting "mobile" segment. Even though EVERY segment truly performed worse under treatment, pooling mixes in more of the naturally-higher-converting segment on the treatment side, which flips the pooled sign. This is exactly why segment mix must be checked, not just segment-level significance.'

  - question: 'Why does this lesson insist that an effect size (in the metric''s own units, plus a relative lift) always accompany a reported p-value?'
    options:
      - 'Because a p-value cannot be computed without first computing an effect size'
      - 'Because regulators require both figures to be reported together'
      - 'Because a p-value alone answers "would this be surprising under no effect", but says nothing about how large the effect actually is or whether that size is worth acting on -- a tiny, practically meaningless effect can still be statistically significant'
      - 'Because relative lift and absolute difference are mathematically identical and reporting both is redundant but harmless'
    answer_index: 2
    explanation: 'Dataset A''s 1.79 percentage point absolute lift and 17.65% relative lift describe a result a reader can act on; "p=0.0003" alone does not. An interval that excludes zero but sits entirely between, say, 0.01% and 0.03% lift would also be statistically significant and might not be worth the engineering cost of shipping -- significance and "worth acting on" are different questions, and only the effect size lets a reader ask the second one.'

  - question: 'Dataset A''s guardrail metric (page-render latency) is checked alongside a primary metric that shows a strong, significant positive lift. What role does the guardrail play that the primary test alone cannot?'
    options:
      - 'It can VETO an otherwise-positive verdict if a metric that must not get worse (like latency) worsens beyond a pre-declared tolerance, regardless of how good the primary result looks'
      - 'It recomputes the same significance test on a different random seed, as a sanity check'
      - 'It replaces the primary test entirely once both are computed'
      - 'It only matters for continuous metrics, not binary ones like conversion'
    answer_index: 0
    explanation: 'A primary metric moving in the right direction is not sufficient to ship -- a guardrail failure (latency getting meaningfully worse, an error rate rising, an unsubscribe rate climbing) must be able to change the final verdict from "ship" to something else, independent of how strong the primary result is. Dataset A''s guardrail passed (latency actually improved slightly); the lesson''s verdict function is built so a guardrail failure would have overridden a positive primary result.'

  - question: 'Walking dataset A in its arrival order, the running p-value dips below 0.05 at row 4,000, climbs back above 0.05 by row 5,000, and only settles for good after row 5,500 -- even though the final, full-sample verdict at row 16,000 is also significant. What does this demonstrate?'
    options:
      - 'A team with a fixed, pre-declared stopping rule reaches the same well-supported conclusion at the planned sample size; a team that stops the instant it first sees p<0.05 would have stopped on an unstable fluctuation and gotten lucky that the sign did not flip -- exactly the risk a declared-in-advance stopping rule protects against, even when the eventual answer is correct'
      - 'The final verdict must be wrong, since an earlier reading disagreed with it'
      - 'The dataset was generated incorrectly and should be regenerated with a different seed'
      - 'The primary test formula must contain an error, since a genuinely significant effect should never show a p-value above 0.05 at any checkpoint'
    answer_index: 0
    explanation: 'This is a real, measured demonstration of Day 118''s peeking-inflates-false-positives lesson, but on a dataset where the true effect IS real. The instability along the way is the point: a naive "stop the moment p<0.05" policy would have committed at row 4,000 on a reading that had not yet stabilized, and would have been indistinguishable, at the moment of stopping, from a false positive that later reverted.'

  - question: 'Dataset B''s primary metric shows a LARGER, MORE significant effect (3.89 percentage points, p effectively zero) than dataset A''s (1.79 points, p=0.0003). Why is dataset B''s result not better news?'
    options:
      - 'It is better news; a bigger, more significant effect is always stronger evidence regardless of any other check'
      - 'Because dataset B''s sample-ratio mismatch check already failed (the realized split drifted to 48/52), which means the two groups are not known to be comparable, and the impressive-looking primary result is downstream of that same broken randomization -- the segment reversal is a second, independent symptom of the same underlying problem'
      - 'Because dataset B has more rows than dataset A, and larger sample sizes always produce less trustworthy p-values'
      - 'It is not worse news, only differently reported; both datasets should receive the same "ship" verdict'
    answer_index: 1
    explanation: 'A bigger, cleaner-looking number computed downstream of broken randomization is not stronger evidence -- it is evidence of nothing, computed correctly. This is the lesson''s central point: the arithmetic in dataset B is not wrong, the process that produced the data is, and no amount of statistical significance downstream of that can fix it. The verdict function refuses to hand back an effect estimate for exactly this reason.'

  - question: 'What is the practical difference between reporting a segment finding as a "hypothesis" versus reporting it as a "conclusion"?'
    options:
      - 'There is no practical difference; both terms describe the same statistical result'
      - 'A "conclusion" requires a p-value below 0.01, while a "hypothesis" only requires a p-value below 0.05'
      - 'Reporting a segment finding as a hypothesis means treating it as something to investigate or test properly in a dedicated follow-up (with its own pre-registered plan and multiple-comparisons correction), while reporting it as a conclusion means acting on it directly -- which is exactly the segment-fishing failure mode this lesson warns against'
      - 'A hypothesis applies only to continuous metrics and a conclusion applies only to binary ones'
    answer_index: 2
    explanation: 'Segments generate hypotheses, they do not confirm them -- testing every segment at the full significance threshold and acting on whichever one looks interesting is Day 118''s multiple-comparisons problem wearing a business-stakeholder-friendly disguise. The honest path from a segment finding to a decision runs through a properly designed, pre-registered follow-up experiment, not straight into a ship/no-ship call.'
