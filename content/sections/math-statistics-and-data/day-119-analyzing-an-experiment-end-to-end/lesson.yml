title: 'Analyzing an Experiment End to End'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 17
learning_promise: 'After this lesson you will be able to run a complete, disciplined analysis of one A/B experiment end to end, and explain why a technically correct calculation can still support a false conclusion. You will analyze two shipped datasets with the same nine-function pipeline: exp_a.csv (16,000 rows), where the sample-ratio mismatch check passes cleanly (p=1.0), the primary metric moves from 10.13% to 11.91% conversion (a 1.79 percentage point lift, z=3.61, p=0.0003, 95% CI [0.82, 2.76] points, 17.65% relative lift), the guardrail holds (latency -0.51ms), all three segments agree in sign, and the verdict is "ship." And exp_b.csv (20,000 rows), where the same pipeline reveals the realized split drifted to 48/52 against a planned 50/50 (chi-squared p=1.5e-8, decisively failing its own alpha=0.001 threshold) and every one of three segments shows a NEGATIVE effect (-3.56, -2.48, -4.30 percentage points) while the pooled number shows a positive one (+3.89 points) -- a measured Simpson''s paradox -- so the verdict function refuses to compute a trustworthy estimate at all. You will also walk dataset A in its arrival order and watch its running p-value dip below 0.05 at row 4,000, climb back above it by row 5,000, and only settle for good after row 5,500, seeing directly why a stopping rule declared in advance matters even when the final answer turns out to be correct. Every test is built from math.erf and the standard library, exactly as Day 118 built its own.'
objectives:
  - 'State the through-line of the lesson precisely: statistical validity is a property of the process that produced a number, not of the number itself, and explain why a p-value cannot certify the process that generated it'
  - 'Run the eight-step end-to-end analysis process in order -- question, pre-registered metric, written plan, randomization check, look-before-you-test, test-with-interval, careful segments, plain-language verdict -- and name the specific failure mode each step guards against'
  - 'Build a sample-ratio mismatch check from a chi-squared goodness-of-fit test with a closed-form p-value (math.erfc), run it once over final counts rather than continuously, and explain why it is the single most valuable and most-often-skipped check in this process'
  - 'Report a primary metric''s result as a confidence interval AND an effect size in its own units (absolute and relative), never as a bare p-value, using the same math.erf-based normal CDF Day 118 built'
  - 'Detect and correctly flag a Simpson''s-paradox-shaped segment reversal -- every segment pointing one way, the pooled number pointing the other -- on a real measured dataset, and explain why segment analysis must report findings rather than conclude from them'
  - 'Demonstrate, on one real dataset walked in arrival order, why a running p-value crossing below 0.05 partway through data collection is not the same evidence as the same p-value observed at a pre-declared sample size'
  - 'Build a verdict function that ships a clean experiment and explicitly REFUSES to compute an effect estimate at all once randomization has failed its own check, and explain why that refusal is itself the correct output'
  - 'Distinguish statistical significance from practical significance as a decision problem (cost of shipping and maintaining versus size of the affected population), and treat "inconclusive" as a legitimate first-class outcome rather than a failure'
  - 'Explain the checkout-experiment discipline''s direct analogue in AI practice: a pre-registered offline evaluation metric, a guardrail that can veto a winning model, a held-out set sized by a power calculation, and a reported interval rather than a single leaderboard number'
prerequisites:
  - 'Day 116 -- descriptive statistics, the mean-versus-median divergence under outliers, and Simpson''s paradox as a phenomenon; this lesson measures both on real simulated data'
  - 'Day 117 -- the standard error and its 1/sqrt(n) law, used implicitly in every confidence interval this lesson computes'
  - 'Day 118 -- hypothesis tests, confidence intervals, the normal CDF built from math.erf, multiple comparisons, power, and the cost of peeking. This lesson assumes that machinery and applies it to one experiment end to end rather than re-deriving it'
  - 'Comfort with the standard library csv, statistics and math modules'
  - 'Days 71-74 -- running pytest and reading its skip-versus-fail output'
