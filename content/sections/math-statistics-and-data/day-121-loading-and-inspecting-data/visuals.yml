visuals:
  - id: loader-anatomy-architecture
    file: assets/loader-anatomy-architecture.svg
    type: diagram
    title: 'Anatomy of read_csv(): four inference decisions, two silent failures'
    alt: 'Diagram: raw file bytes enter a parser, pass through an inference stage with four labelled decision points — separator, encoding, na_values, dtype guess — drawn as a row of gates, with the na_values and dtype guess gates flagged in red as the exact stage where "NA" for Namibia becomes a missing value and "00123" becomes the integer 123, and a typed DataFrame emerges on the right already containing both silent corruptions'
    description: >-
      A static architecture diagram tracing read_csv()'s pipeline left to right. Raw file bytes enter a
      parser box. Four decision gates follow in sequence: separator (sep=","), encoding (default utf-8,
      a wrong guess raises), na_values, and dtype guess. The na_values and dtype-guess gates are drawn
      with a red fill and border rather than the neutral white of the other two, each labelled "SILENT
      FAILURE" and connected by a dashed red arrow down to the specific cell in the resulting DataFrame
      it corrupts: na_values to the code column's NaN in row 1 (originally the text "NA" for Namibia),
      and dtype guess to the id column's 123 (originally "00123", now missing its leading zeros). A
      three-row, three-column typed DataFrame sits at the bottom right as the pipeline's output, with no
      error or exception path drawn anywhere in the diagram, because none is raised. A caption block
      explains that two of read_csv()'s four decisions fail loudly when wrong (separator, encoding) and
      two fail silently (na_values, dtype guess), and names the three parameters -- dtype=, na_values=,
      keep_default_na= -- that pin those decisions instead of leaving them to be guessed.
  - id: inference-flow
    file: assets/inference-flow.svg
    type: flow-animated
    title: 'Two reads of the same file: guessing collapses the data; pinning preserves it'
    alt: 'Diagram: a raw text column being typed two ways — in the top path, unguarded read_csv() inference collapses "00123" into the integer 123 and turns "NA" into a missing value, both lighting up red as they change; in the bottom path, the same raw column read again with dtype and keep_default_na pinned arrives on the right unchanged, lighting up green — with a caption stating the difference between the two paths is two named arguments, not a different file'
    description: >-
      An animated flow diagram, readable in full as a still image, showing the same two raw values --
      id "00123" and code "NA" -- flowing through two different reads of the identical file. The shared
      source column sits on the left. The top path runs through an inference-stage box labelled
      "read_csv(path) -- no guard, pandas guesses", which pulses between two shades of blue to mark the
      moment of guessing, and arrives at two result cells that shift from neutral grey to red: id becomes
      123 with the leading zeros gone, and code becomes NaN, annotated "(missing!)". The bottom path runs
      through a second inference-stage box labelled "read_csv(path, dtype={'id':'str'},
      keep_default_na=False)", and arrives at two result cells that shift from neutral grey to green: id
      stays "00123" and code stays "NA", both annotated "(intact)". Marching-dash wires connect each
      stage in both paths, animating to suggest continuous flow. A caption beneath states plainly that
      the only difference between the two paths is two named arguments, not a different file, and a
      static colour-key legend (red square: changed by unguarded inference; green square: preserved
      exactly by a pinned read) is drawn permanently beneath the diagram so the meaning of the colours
      does not depend on the animation running. A prefers-reduced-motion block stops the wire animation
      and the colour pulses, leaving the guess-stage boxes in their mid-pulse colour and both result rows
      already shaded in their final red/green state, so every fact in the diagram is visible without
      motion.
