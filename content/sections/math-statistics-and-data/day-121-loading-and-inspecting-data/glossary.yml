terms:
  - term: type inference
    definition: >-
      The process by which read_csv() decides, per column, what dtype the file's plain text should
      become -- int64, float64, bool, str, a date -- based on what the values in that column look like,
      without being told. It is a guess, made once, silently, and it is usually right.
  - term: na_values
    definition: >-
      The list of literal strings read_csv() treats as a missing value by default, including "NA", "N/A",
      "null", "NaN" and several others. Any cell whose text matches one of these entries becomes a
      missing value on read, whether or not that was the intent -- the country code "NA" for Namibia is
      the textbook case.
  - term: keep_default_na
    definition: >-
      A read_csv() argument that, set to False, disables the default na_values list entirely, so no
      string is treated as missing unless explicitly listed in na_values yourself. The fix for the
      Namibia trap.
  - term: dtype (as a read_csv argument)
    definition: >-
      A dict mapping column names to the dtype read_csv() should assign them, overriding inference
      entirely for that column. dtype={"id": "str"} is the fix for an identifier column whose leading
      zeros or non-numeric-looking values matter.
  - term: parse_dates
    definition: >-
      A read_csv() argument naming which columns to parse as datetime64 rather than leaving them as
      plain text. Without it, a date column is the pandas-3.0 str dtype and sorts lexicographically,
      which silently disagrees with chronological order the moment date formatting is inconsistent.
  - term: precision loss (integer-to-float)
    definition: >-
      The silent rounding that occurs when an integer larger than 2**53 is represented as a float64,
      because float64's 53-bit mantissa cannot address every integer beyond that boundary exactly. A
      column read as int64 is exact; the same column cast to float64 is not.
  - term: encoding (text)
    definition: >-
      The byte-to-character mapping a file was written with -- UTF-8, latin-1 (ISO-8859-1), and others.
      read_csv()'s encoding argument defaults to UTF-8; reading a file written in a different encoding
      either raises UnicodeDecodeError on an invalid byte sequence or, worse, silently decodes into wrong
      characters ("mojibake") when the bytes happen to also be valid under the assumed encoding.
  - term: mojibake
    definition: >-
      Text that decodes without error under the wrong encoding, producing visibly garbled but
      syntactically valid characters -- the silent failure mode of an encoding mismatch, as opposed to
      UnicodeDecodeError, which is the loud one.
  - term: chunksize
    definition: >-
      A read_csv() argument that turns the function into an iterator of DataFrames, each holding
      chunksize rows, instead of one DataFrame holding the whole file. Lets a file larger than available
      memory be processed one piece at a time; an aggregate computed chunk by chunk must equal the
      whole-file aggregate exactly.
  - term: Parquet
    definition: >-
      A typed, columnar binary file format from the Apache Arrow project. Unlike CSV, a Parquet file
      stores each column's dtype explicitly, so reading it back is a lookup rather than a re-inference --
      the reason a Parquet round-trip preserves dtypes exactly where a CSV round-trip does not.
  - term: columnar storage
    definition: >-
      A file layout that stores all values of one column contiguously, rather than row by row. Parquet
      is columnar; CSV is row-oriented plain text. Columnar storage is what lets a typed format record
      one dtype per column instead of re-guessing it on every read.
  - term: round-trip
    definition: >-
      Writing data to a file and reading it back, then comparing the result to the original. A round-trip
      that preserves every dtype and value exactly is lossless; one that does not -- as CSV's is not, for
      a nullable Int64 column with a missing value -- silently changes the data's type on the way through.
  - term: .isna().sum()
    definition: >-
      A DataFrame method chain reporting how many missing values each column holds. The second command in
      the inspection battery, run immediately after any load whose row counts have not been independently
      verified.
  - term: .nunique()
    definition: >-
      A DataFrame or Series method reporting the count of distinct non-missing values per column --
      answers "how many different things are actually in here", distinct from .value_counts(), which also
      says how often each one appears.
  - term: .value_counts()
    definition: >-
      A Series method returning the distribution of distinct values, sorted most frequent first. The
      fastest way to see whether a categorical column's values are what you expect, and which one
      dominates.
  - term: memory_usage(deep=True)
    definition: >-
      A DataFrame method reporting the real byte cost per column, including the cost of the objects a
      pointer-based dtype refers to (deep=True) rather than only the pointers themselves (the default,
      deep=False). The only way to see the true cost of a text column's storage.
  - term: category dtype
    definition: >-
      A pandas dtype that stores each distinct value once, in a lookup table, and represents every row as
      a small integer code pointing into it. Converting a low-cardinality string column to category
      trades repeated string storage for one lookup table plus one integer per row, measured here as a
      memory-usage ratio rather than a fixed byte count.
  - term: inspection battery
    definition: >-
      The ordered sequence of eight commands this lesson recommends running on any unfamiliar DataFrame --
      .head(), .info(), .dtypes, .describe(), .isna().sum(), .nunique(), .value_counts(),
      memory_usage(deep=True) -- each answering a different question and together catching most of the
      silent load-time failures this lesson covers, in seconds.
  - term: read_sql
    definition: >-
      A pandas function that runs a SQL query against a database connection (here, a sqlite3 connection)
      and returns the result as a DataFrame. The filtering happens inside the database, not in pandas, so
      only the matching rows are ever loaded.
  - term: scan_csv (polars)
    definition: >-
      polars' lazy CSV-reading entry point, which builds a query plan without immediately loading data,
      deferring the actual read until the plan is executed -- a different answer to "a file larger than
      memory" than pandas' chunksize, described here from documentation only, since polars is not
      installed in this environment.
