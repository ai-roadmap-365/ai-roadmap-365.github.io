<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The first five checks</title>
  <style>
    .inspect-how-bg   { fill: #f8fafc; }
    .inspect-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspect-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspect-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspect-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspect-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspect-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inspect-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inspect-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inspect-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inspect-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inspect-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inspect-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .inspect-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .inspect-how-stage { opacity: 1; }

    .inspect-how-s0 { animation-delay: 0.00s; }
    .inspect-how-e0 { animation-delay: 0.00s; }
    .inspect-how-s1 { animation-delay: 1.28s; }
    .inspect-how-e1 { animation-delay: 1.28s; }
    .inspect-how-s2 { animation-delay: 2.56s; }
    .inspect-how-e2 { animation-delay: 2.56s; }
    .inspect-how-s3 { animation-delay: 3.84s; }
    .inspect-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .inspect-how-conn  { animation: inspect-how-trace 6.4s ease-in-out infinite; }
      .inspect-how-stage { animation: inspect-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes inspect-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes inspect-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .inspect-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .inspect-how-stage { animation: inspect-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes inspect-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="inspect-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="inspect-how-bg" width="980" height="322"/>
  <text class="inspect-how-h1"  x="30" y="40">The first five checks</text>
  <text class="inspect-how-sub" x="30" y="64">Four steps.</text>
  <g class="inspect-how-stage inspect-how-s0">
    <rect class="inspect-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="inspect-how-step" x="44" y="142">01</text>
    <text class="inspect-how-name" x="70" y="142">How many rows and columns — is it all there?</text>
    <text class="inspect-how-desc" x="44" y="166">Compare with the source's claim.</text>
  </g>
  <line class="inspect-how-line inspect-how-conn inspect-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#inspect-how-tip)"/>
  <g class="inspect-how-stage inspect-how-s1">
    <rect class="inspect-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="inspect-how-step" x="280" y="142">02</text>
    <text class="inspect-how-name" x="306" y="142">What type is each column, and is that right?</text>
    <text class="inspect-how-desc" x="280" y="166">Especially dates and</text>
    <text class="inspect-how-desc" x="280" y="182">identifiers.</text>
  </g>
  <line class="inspect-how-line inspect-how-conn inspect-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#inspect-how-tip)"/>
  <g class="inspect-how-stage inspect-how-s2">
    <rect class="inspect-how-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="inspect-how-step" x="516" y="142">03</text>
    <text class="inspect-how-name" x="542" y="142">How many values are missing, per column?</text>
    <text class="inspect-how-desc" x="516" y="166">Which changes every later</text>
    <text class="inspect-how-desc" x="516" y="182">summary.</text>
  </g>
  <line class="inspect-how-line inspect-how-conn inspect-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#inspect-how-tip)"/>
  <g class="inspect-how-stage inspect-how-s3">
    <rect class="inspect-how-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="inspect-how-step" x="752" y="142">04</text>
    <text class="inspect-how-name" x="778" y="142">And what does each column's distribution look like?</text>
    <text class="inspect-how-desc" x="752" y="166">Which exposes impossible values.</text>
  </g>
  <text class="inspect-how-sub" x="30" y="304">Comparing row count with the source's claim catches truncated downloads and quoting errors, which are far more common than people expect.</text>
</svg>
