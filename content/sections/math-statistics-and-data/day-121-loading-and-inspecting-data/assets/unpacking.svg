<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Check before using.">
  <title>Unpacking a delivery</title>
  <style>
    .unpacking-bg   { fill: #f8fafc; }
    .unpacking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpacking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpacking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpacking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpacking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unpacking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unpacking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unpacking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unpacking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unpacking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unpacking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unpacking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unpacking-row { opacity: 1; }
    .unpacking-r0 { animation-delay: 0.00s; }
    .unpacking-r1 { animation-delay: 0.45s; }
    .unpacking-r2 { animation-delay: 0.90s; }
    .unpacking-r3 { animation-delay: 1.35s; }
    .unpacking-r4 { animation-delay: 1.80s; }
    .unpacking-row { animation: unpacking-reveal 7.3s ease-in-out infinite; }
    @keyframes unpacking-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="unpacking-bg" width="980" height="390"/>
  <text class="unpacking-h1"  x="30" y="40">Unpacking a delivery</text>
  <text class="unpacking-sub" x="30" y="64">Check before using.</text>
  <rect class="unpacking-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="unpacking-name" x="46" y="122">Checked</text>
  <text class="unpacking-desc" x="46" y="142">Problems found early.</text>
  <text class="unpacking-desc unpacking-row unpacking-r0" x="46" y="182">Count the items against the note</text>
  <text class="unpacking-desc unpacking-row unpacking-r1" x="46" y="216">Look for damage</text>
  <text class="unpacking-desc unpacking-row unpacking-r2" x="46" y="250">Confirm it is what was ordered</text>
  <text class="unpacking-desc unpacking-row unpacking-r3" x="46" y="284">Problems raised immediately</text>
  <text class="unpacking-desc unpacking-row unpacking-r4" x="46" y="318">This is inspecting after loading</text>
  <rect class="unpacking-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="unpacking-name" x="526" y="122">Assumed</text>
  <text class="unpacking-desc" x="526" y="142">Problems found late.</text>
  <text class="unpacking-desc unpacking-row unpacking-r0" x="526" y="182">Put it straight into use</text>
  <text class="unpacking-desc unpacking-row unpacking-r1" x="526" y="216">Damage discovered mid-assembly</text>
  <text class="unpacking-desc unpacking-row unpacking-r2" x="526" y="250">Wrong item found at the end</text>
  <text class="unpacking-desc unpacking-row unpacking-r3" x="526" y="284">Too late to raise it</text>
  <text class="unpacking-desc unpacking-row unpacking-r4" x="526" y="318">This is loading and proceeding</text>
  <text class="unpacking-sub" x="30" y="372">Discovering the problem at the end is the expensive case in analysis too, since it invalidates everything built on top of the data.</text>
</svg>
