<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="d121aTitleId d121aDescId">
  <title id="d121aTitleId">Anatomy of read_csv(): raw bytes, an inference stage with four decision points, and a typed DataFrame -- with the two silent failures marked at the exact stage where they happen</title>
  <desc id="d121aDescId">Raw file bytes enter a parser on the left. They pass through an inference stage with four labelled decision points -- separator, encoding, na_values, dtype guess -- drawn as a row of gates. Two of the gates have a red flag attached: the na_values gate, where the string "NA" for Namibia is marked as becoming a missing value, and the dtype guess gate, where "00123" is marked as becoming the integer 123. The typed DataFrame emerges on the right, already containing both silent corruptions, with no error path drawn anywhere in the diagram.</desc>

  <style>
    .d121a-bg      { fill: #f8fafc; }
    .d121a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d121a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d121a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d121a-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d121a-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d121a-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d121a-stage   { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d121a-gate    { fill: #ffffff; stroke: #64748b; stroke-width: 1.25; }
    .d121a-flagged { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .d121a-cell    { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .d121a-wire    { fill: none; stroke: #1d4ed8; stroke-width: 2.25; }
    .d121a-flagwire{ fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 5 4; }
  </style>

  <rect class="d121a-bg" x="0" y="0" width="1000" height="660" />

  <text class="d121a-title" x="32" y="42">read_csv() is a type-inference engine wearing the costume of a file reader</text>
  <text class="d121a-sub" x="32" y="66">Raw bytes -&gt; four inference decisions -&gt; a typed DataFrame. Two decisions here go silently wrong.</text>

  <!-- Stage 1: raw bytes -->
  <rect class="d121a-stage" x="30" y="110" width="140" height="90" />
  <text class="d121a-label" x="100" y="145" text-anchor="middle">raw file</text>
  <text class="d121a-small" x="100" y="165" text-anchor="middle">bytes on disk</text>
  <text class="d121a-mono" x="100" y="185" text-anchor="middle" font-size="12">code,country</text>
  <path class="d121a-wire" d="M 170 155 L 205 155" marker-end="url(#d121a-arrow)" />

  <!-- Inference stage: four gates in a row -->
  <text class="d121a-label" x="490" y="95" text-anchor="middle">inference stage -- four decisions, made once, silently</text>

  <!-- Gate: separator -->
  <rect class="d121a-gate" x="210" y="110" width="130" height="90" />
  <text class="d121a-label" x="275" y="140" text-anchor="middle">separator</text>
  <text class="d121a-small" x="275" y="160" text-anchor="middle">sep=","</text>
  <text class="d121a-small" x="275" y="178" text-anchor="middle">guessed if omitted</text>
  <path class="d121a-wire" d="M 340 155 L 375 155" marker-end="url(#d121a-arrow)" />

  <!-- Gate: encoding -->
  <rect class="d121a-gate" x="380" y="110" width="130" height="90" />
  <text class="d121a-label" x="445" y="140" text-anchor="middle">encoding</text>
  <text class="d121a-small" x="445" y="160" text-anchor="middle">default: utf-8</text>
  <text class="d121a-small" x="445" y="178" text-anchor="middle">wrong guess raises</text>
  <path class="d121a-wire" d="M 510 155 L 545 155" marker-end="url(#d121a-arrow)" />

  <!-- Gate: na_values (FLAGGED) -->
  <rect class="d121a-flagged" x="550" y="110" width="150" height="90" />
  <text class="d121a-label" x="625" y="138" text-anchor="middle">na_values</text>
  <text class="d121a-small" x="625" y="157" text-anchor="middle">"NA" is in the</text>
  <text class="d121a-small" x="625" y="173" text-anchor="middle">default missing list</text>
  <text class="d121a-small" x="625" y="192" text-anchor="middle" font-weight="700">SILENT FAILURE 1</text>
  <path class="d121a-flagwire" d="M 625 200 L 625 240 L 760 300" marker-end="url(#d121a-flagarrow)" />
  <path class="d121a-wire" d="M 700 155 L 735 155" marker-end="url(#d121a-arrow)" />

  <!-- Gate: dtype guess (FLAGGED) -->
  <rect class="d121a-flagged" x="740" y="110" width="150" height="90" />
  <text class="d121a-label" x="815" y="138" text-anchor="middle">dtype guess</text>
  <text class="d121a-small" x="815" y="157" text-anchor="middle">all-digit column</text>
  <text class="d121a-small" x="815" y="173" text-anchor="middle">-&gt; inferred int64</text>
  <text class="d121a-small" x="815" y="192" text-anchor="middle" font-weight="700">SILENT FAILURE 2</text>
  <path class="d121a-flagwire" d="M 815 200 L 815 240 L 780 300" marker-end="url(#d121a-flagarrow)" />

  <!-- Typed DataFrame result -->
  <text class="d121a-label" x="490" y="270" text-anchor="middle">the typed DataFrame that comes out -- no exception raised anywhere above</text>
  <rect class="d121a-cell" x="200" y="300" width="580" height="150" fill="#ffffff" stroke="#94a3b8" />
  <!-- header -->
  <line x1="200" y1="330" x2="780" y2="330" stroke="#94a3b8" stroke-width="1" />
  <text class="d121a-mono" x="220" y="322" font-weight="700">code</text>
  <text class="d121a-mono" x="420" y="322" font-weight="700">country</text>
  <text class="d121a-mono" x="600" y="322" font-weight="700">id</text>
  <!-- rows -->
  <text class="d121a-mono" x="220" y="358">NaN</text>
  <text class="d121a-mono" x="420" y="358">Namibia</text>
  <text class="d121a-mono" x="600" y="358">123</text>
  <text class="d121a-small" x="700" y="358">was "00123"</text>
  <text class="d121a-mono" x="220" y="388">US</text>
  <text class="d121a-mono" x="420" y="388">United States</text>
  <text class="d121a-mono" x="600" y="388">456</text>
  <text class="d121a-mono" x="220" y="418">FR</text>
  <text class="d121a-mono" x="420" y="418">France</text>
  <text class="d121a-mono" x="600" y="418">789</text>
  <text class="d121a-caption" x="220" y="440" font-style="italic">row 1's "code" was the text "NA" for Namibia, now indistinguishable from any other missing value</text>

  <!-- Caption block -->
  <rect class="d121a-cell" x="30" y="470" width="940" height="160" fill="#ffffff" stroke="#cbd5e1" />
  <text class="d121a-label" x="52" y="500" font-weight="700">Read it this way:</text>
  <text class="d121a-caption" x="52" y="526">read_csv() makes four decisions before you see a single row: what separates fields, what encoding the</text>
  <text class="d121a-caption" x="52" y="548">bytes are in, which strings count as "missing", and what dtype each column should be. Three of the four</text>
  <text class="d121a-caption" x="52" y="570">fail LOUDLY when wrong -- a bad separator or encoding raises. Two do not: "NA" for Namibia silently</text>
  <text class="d121a-caption" x="52" y="592">becomes a missing value because it matches the default na_values list, and "00123" silently becomes</text>
  <text class="d121a-caption" x="52" y="614">the integer 123 because every character in it is a digit. Both return a DataFrame that looks complete.</text>
  <text class="d121a-caption" x="52" y="636">dtype=, na_values= and keep_default_na= exist specifically to pin these two decisions instead of guessing.</text>

  <defs>
    <marker id="d121a-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d121a-flagarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c" />
    </marker>
  </defs>
</svg>
