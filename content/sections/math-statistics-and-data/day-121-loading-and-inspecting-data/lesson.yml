id: D121
day: 121
slug: loading-and-inspecting-data
title: Loading and Inspecting Data
section: math-statistics-and-data
subsection: data-analysis
week: 18
learning_promise: >-
  After this lesson you will be able to name the exact reason a country-code column reads "NA" for
  Namibia as a missing value by default, and fix it with keep_default_na=False; explain why an identifier
  column of "00123" silently becomes the integer 123 unless you pin dtype={"col": "str"}; show, with a
  captured value, why an integer past 2**53 is exact as int64 but corrupted by a float64 cast; state what
  parse_dates changes about a date column's dtype and construct a case where a string-sorted date column
  gives the wrong chronological order; diagnose an encoding mismatch as either a UnicodeDecodeError or
  silent mojibake and fix it with the correct encoding= argument; read a file larger than memory with
  chunksize and confirm a chunk-by-chunk aggregate equals the whole-file answer exactly; demonstrate, with
  a real round-trip, that CSV loses dtypes and Parquet preserves them exactly; run the eight-command
  inspection battery on an unfamiliar frame and say what each command is for; and convert a low-cardinality
  string column to category and report the memory reduction as a ratio rather than a byte count.
objectives:
  - 'Explain why read_csv() reading the string "NA" as a missing value by default is not a bug, and fix it with keep_default_na=False when a literal "NA" value must survive'
  - 'Preserve a leading-zero identifier column with dtype={"col": "str"} instead of letting it silently become a shorter integer'
  - 'Demonstrate that an integer above 2**53 survives read_csv()''s int64 inference exactly, but is silently corrupted by a float64 cast, and show the exact differing digit'
  - 'State what parse_dates changes about a date column''s dtype, and construct a case where a string-sorted date column returns the wrong chronological order'
  - 'Diagnose an encoding mismatch as UnicodeDecodeError or silent mojibake, and fix it by naming the correct encoding= argument'
  - 'Read a file larger than memory with chunksize, and confirm a chunk-by-chunk aggregate equals the whole-file aggregate exactly'
  - 'Demonstrate with a real round-trip that CSV loses dtypes -- specifically that a nullable Int64 column with a missing value becomes float64 -- while Parquet preserves every dtype and value exactly'
  - 'Run the eight-command inspection battery (.head, .info, .dtypes, .describe, .isna().sum(), .nunique(), .value_counts(), memory_usage(deep=True)) on an unfamiliar frame and state what each command is for'
  - 'Convert a low-cardinality string column to category and report the memory reduction as a ratio, never a byte count'
  - 'Choose among CSV, JSON, Parquet, SQL and Excel for a given loading task, and state when to prefer each, including which is free versus paid'
  - 'Read a file with the stdlib csv module and say when it beats pandas: streaming, exact control, no type inference'
  - 'Trace how a silently truncated ID or a silently missing country code, introduced at load time, can corrupt a feature column months before a model trained on it shows any symptom'
prerequisites:
  - 'Day 120 -- pandas Series and DataFrames: the index, dtypes including the pandas-3.0 str default and Int64/int64 promotion, and Copy-on-Write. Not re-taught here.'
  - 'Days 92-98 -- data formats and pipelines, and the habit of reading data before trusting it'
  - 'Week 13 -- SQL and SQLite, which this lesson''s read_sql() example uses directly'
  - 'A working python3 on your PATH; the lab creates its own virtual environment with pandas 3.0.5 pinned exactly'
reading_time_minutes: 45
practical_time_minutes: 45
