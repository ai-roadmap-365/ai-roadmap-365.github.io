questions:
  - question: >-
      A CSV of country codes contains the row "NA,Namibia". What does pd.read_csv() do to that row by
      default, with no extra arguments?
    options:
      - "Reads code as the string 'NA', unchanged"
      - 'Reads code as NaN, because "NA" is a default na_value'
      - 'Raises a ValueError, refusing to guess'
      - 'Reads the whole row as a comment and skips it'
    answer_index: 1
    explanation: >-
      pandas' default na_values list includes several strings that mean "missing", and "NA" is one of
      them. The row does not disappear and no exception is raised -- the code cell simply becomes NaN,
      silently, and Namibia is now indistinguishable from any genuinely missing country. The fix is
      keep_default_na=False, which disables the default list entirely.
  - question: >-
      An identifier column contains "00123". Read with pd.read_csv(path) and no other arguments, what
      does that cell become?
    options:
      - "The string '00123', unchanged"
      - 'A ValueError, because "00123" looks ambiguous'
      - 'The integer 123, with leading zeros dropped'
      - 'The float 123.0'
    answer_index: 2
    explanation: >-
      Every character in "00123" is a digit, so read_csv()'s inference engine reads the column as int64,
      and int64 has no concept of a leading zero -- 00123 and 123 are the same integer. Nothing raises.
      dtype={"id": "str"} is the fix, forcing the column to stay text.
  - question: >-
      An integer column holds 2**53 + 1 (9007199254740993). What happens to that exact value if the
      column is cast to float64?
    options:
      - 'Nothing -- float64 can represent any integer exactly'
      - 'It becomes a Python int automatically to preserve precision'
      - 'A ValueError is raised, because the value is too large for float64'
      - 'Silently rounded to the nearest float64 value'
    answer_index: 3
    explanation: >-
      float64's mantissa has 53 bits, so it represents every integer up to 2**53 exactly, and not beyond.
      2**53 + 1 falls just past that boundary and silently rounds down to the nearest representable value,
      2**53 -- with no error, no warning, and a value one different from the true ID.
  - question: >-
      A date column is left as plain text (not passed to parse_dates) and contains "2024-01-20" and
      "2024-1-9" (no leading zero on the day). Sorted with .sort_values(), which comes first?
    options:
      - '''2024-01-20'' — string order puts ''0'' before ''1'''
      - "'2024-1-9', because it is the earlier date chronologically"
      - 'Both sort identically since pandas normalizes date-like strings automatically'
      - 'A TypeError is raised, since the two strings have different lengths'
    answer_index: 0
    explanation: >-
      Left unparsed, the column is plain text and sorts character by character. At the fifth character,
      "2024-01-20" has '0' and "2024-1-9" has '1' -- '0' < '1', so "2024-01-20" sorts FIRST even though
      January 9th is chronologically earlier than January 20th. parse_dates=['date'] converts the column
      to a real datetime64 dtype, which sorts correctly.
  - question: >-
      A file was written in latin-1 encoding. Read with pd.read_csv(path, encoding="utf-8"), what is the
      most honest description of what can happen?
    options:
      - 'It always raises UnicodeDecodeError, loudly, every time'
      - 'Either UnicodeDecodeError, or silent mojibake'
      - 'It always silently succeeds with garbled text ("mojibake"), never an error'
      - "pandas auto-detects the correct encoding and reads it correctly regardless"
    answer_index: 1
    explanation: >-
      Which of the two happens depends on the specific bytes. Some latin-1 byte sequences are not valid
      UTF-8 at all and raise UnicodeDecodeError -- the loud, easier-to-catch failure. Others happen to
      also be valid (but different) UTF-8 and decode without error into visibly wrong characters, which
      is the more dangerous outcome because nothing signals anything went wrong.
  - question: >-
      Reading a 50,000-row CSV with chunksize=1000 and summing one column chunk by chunk, how does the
      result compare to reading the whole file at once and summing it directly?
    options:
      - 'It is always slightly different, due to floating-point accumulation order'
      - "It depends on whether 50,000 divides evenly by 1,000"
      - 'It is always exactly equal -- chunking changes how the data arrives, never what it adds up to'
      - 'chunksize is only for reading, not for aggregation, so summing it this way is undefined behaviour'
    answer_index: 2
    explanation: >-
      chunksize turns read_csv() into an iterator of DataFrames instead of one big DataFrame -- a
      mechanism for staying inside memory, not a different computation. An aggregate accumulated across
      every chunk equals the whole-file aggregate exactly, regardless of chunk size or whether it divides
      the row count evenly, which this lesson's lab confirms with both a round chunk size and an odd one.
  - question: >-
      A DataFrame with a nullable Int64 column containing one missing value is round-tripped through CSV,
      and separately through Parquet. What is the most accurate description of the result?
    options:
      - 'Both formats preserve the Int64 dtype and the missing value exactly'
      - "CSV preserves the dtype exactly; Parquet re-infers it and gets it wrong"
      - 'Neither format can represent a nullable integer column at all'
      - 'CSV re-infers as float64; Parquet preserves Int64 exactly'
    answer_index: 3
    explanation: >-
      CSV is plain text -- every value becomes a string on disk, and read_csv() re-infers the dtype from
      scratch on the way back in, landing on float64 because a missing value forces int64-family promotion.
      Parquet is a typed, columnar binary format that writes the dtype into the file itself, so reading it
      back is a lookup, not a guess -- Int64 and its missing value both survive exactly.
  - question: >-
      Converting a string column with only 4 distinct values, repeated across 20,000 rows, to the category
      dtype and comparing memory_usage(deep=True) before and after, how should the reduction be reported?
    options:
      - 'As a ratio — "at least 5x smaller, measured at 12x"'
      - "As an exact byte count: 'saves 230,021 bytes'"
      - "It shouldn't be measured at all, since category is always better regardless of the data"
      - 'As a percentage of total DataFrame size, ignoring the specific column'
    answer_index: 0
    explanation: >-
      The exact byte counts depend on the specific random values generated, the platform's string-object
      overhead, and the pandas/NumPy build -- a fact about one machine on one day, exactly like the
      vectorised-vs-.apply timing comparison from Day 120. Reporting a ratio with a comfortable margin
      below the measured value is a claim that holds broadly; a specific byte count is not.
