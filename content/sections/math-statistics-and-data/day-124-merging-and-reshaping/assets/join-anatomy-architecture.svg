<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 660" width="1220" height="660" role="img" aria-labelledby="d124aTitleId d124aDescId">
  <title id="d124aTitleId">The anatomy of a join -- the duplicate-key fan-out, and the four join types side by side</title>
  <desc id="d124aDescId">On the left, an orders table with six rows and a customer-lookup table with four rows are connected by lines from each shared customer ID. The customer ID that appears twice in each table draws all four possible connecting lines, visibly producing four matched pairs from two plus two source rows. A fifth order row with no matching customer is routed into a no-match tray. On the right, a second pair of tables with unique keys on both sides is shown under the four join types -- inner, left, right, outer -- each panel labelled with its exact row count: 3, 4, 4, 5.</desc>

  <style>
    .d124a-bg       { fill: #f8fafc; }
    .d124a-title    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d124a-sub      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
    .d124a-stage    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #1d4ed8; letter-spacing: 0.5px; }
    .d124a-mono     { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d124a-mono-b   { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1a202c; }
    .d124a-mono-sm  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #1a202c; }
    .d124a-nan      { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-style: italic; fill: #b91c1c; }
    .d124a-caption  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
    .d124a-callout  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #1d4ed8; }
    .d124a-panel-title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 700; fill: #1a202c; }
    .d124a-panel-count { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #047857; }
    .d124a-head     { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.25; }
    .d124a-cell     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.1; }
    .d124a-cell-dropped { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.1; stroke-dasharray: 4 3; }
    .d124a-tray     { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .d124a-panel    { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d124a-fan      { stroke: #1d4ed8; stroke-width: 2.25; fill: none; marker-end: url(#d124a-arrow-blue); }
    .d124a-plain    { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#d124a-arrow-grey); }
    .d124a-nomatch  { stroke: #b91c1c; stroke-width: 1.75; fill: none; stroke-dasharray: 4 3; marker-end: url(#d124a-arrow-red); }
  </style>

  <defs>
    <marker id="d124a-arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#1d4ed8" />
    </marker>
    <marker id="d124a-arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#64748b" />
    </marker>
    <marker id="d124a-arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b91c1c" />
    </marker>
  </defs>

  <rect class="d124a-bg" x="0" y="0" width="1220" height="660" />

  <text class="d124a-title" x="24" y="34">The anatomy of a join</text>
  <text class="d124a-sub" x="24" y="56">orders.merge(customers, on="cust_id") -- the duplicated key fans out; the four join types decide what happens to what is left over</text>

  <!-- ===================== LEFT: DUPLICATE-KEY EXPLOSION ===================== -->
  <text class="d124a-stage" x="24" y="84">1. THE DUPLICATE-KEY EXPLOSION</text>

  <!-- orders table: cust_id, order_id, 6 rows: A,A,B,B,C,D -->
  <g transform="translate(24,96)">
    <rect class="d124a-head" x="0" y="0" width="60" height="26" /><text class="d124a-mono-b" x="8" y="18">cust_id</text>
    <rect class="d124a-head" x="60" y="0" width="70" height="26" /><text class="d124a-mono-b" x="68" y="18">order_id</text>

    <rect class="d124a-cell" x="0" y="26" width="60" height="24" /><text class="d124a-mono" x="8" y="43">A</text>
    <rect class="d124a-cell" x="60" y="26" width="70" height="24" /><text class="d124a-mono" x="68" y="43">1</text>

    <rect class="d124a-cell" x="0" y="50" width="60" height="24" /><text class="d124a-mono" x="8" y="67">A</text>
    <rect class="d124a-cell" x="60" y="50" width="70" height="24" /><text class="d124a-mono" x="68" y="67">2</text>

    <rect class="d124a-cell" x="0" y="74" width="60" height="24" /><text class="d124a-mono" x="8" y="91">B</text>
    <rect class="d124a-cell" x="60" y="74" width="70" height="24" /><text class="d124a-mono" x="68" y="91">3</text>

    <rect class="d124a-cell" x="0" y="98" width="60" height="24" /><text class="d124a-mono" x="8" y="115">B</text>
    <rect class="d124a-cell" x="60" y="98" width="70" height="24" /><text class="d124a-mono" x="68" y="115">4</text>

    <rect class="d124a-cell" x="0" y="122" width="60" height="24" /><text class="d124a-mono" x="8" y="139">C</text>
    <rect class="d124a-cell" x="60" y="122" width="70" height="24" /><text class="d124a-mono" x="68" y="139">5</text>

    <rect class="d124a-cell" x="0" y="146" width="60" height="24" /><text class="d124a-mono" x="8" y="163">D</text>
    <rect class="d124a-cell" x="60" y="146" width="70" height="24" /><text class="d124a-mono" x="68" y="163">6</text>
  </g>
  <text class="d124a-caption" x="24" y="304">orders (6 rows)</text>

  <!-- customers table: cust_id, channel, 4 rows: A,A,B,C -->
  <g transform="translate(384,96)">
    <rect class="d124a-head" x="0" y="0" width="60" height="26" /><text class="d124a-mono-b" x="8" y="18">cust_id</text>
    <rect class="d124a-head" x="60" y="0" width="110" height="26" /><text class="d124a-mono-b" x="68" y="18">channel</text>

    <rect class="d124a-cell" x="0" y="26" width="60" height="24" /><text class="d124a-mono" x="8" y="43">A</text>
    <rect class="d124a-cell" x="60" y="26" width="110" height="24" /><text class="d124a-mono" x="68" y="43">email</text>

    <rect class="d124a-cell" x="0" y="50" width="60" height="24" /><text class="d124a-mono" x="8" y="67">A</text>
    <rect class="d124a-cell" x="60" y="50" width="110" height="24" /><text class="d124a-mono" x="68" y="67">phone</text>

    <rect class="d124a-cell" x="0" y="74" width="60" height="24" /><text class="d124a-mono" x="8" y="91">B</text>
    <rect class="d124a-cell" x="60" y="74" width="110" height="24" /><text class="d124a-mono" x="68" y="91">sms</text>

    <rect class="d124a-cell" x="0" y="98" width="60" height="24" /><text class="d124a-mono" x="8" y="115">C</text>
    <rect class="d124a-cell" x="60" y="98" width="110" height="24" /><text class="d124a-mono" x="68" y="115">call</text>
  </g>
  <text class="d124a-caption" x="384" y="256">customers (4 rows)</text>

  <!-- fan-out lines: A x A -> 4 connections -->
  <path class="d124a-fan" d="M 84,134 C 190,110 280,110 384,134" />
  <path class="d124a-fan" d="M 84,134 C 190,150 280,150 384,158" />
  <path class="d124a-fan" d="M 84,158 C 190,134 280,134 384,134" />
  <path class="d124a-fan" d="M 84,158 C 190,170 280,170 384,158" />
  <text class="d124a-callout" x="150" y="100">2 &#215; 2 = 4 rows</text>

  <!-- B rows (many-to-one): 2 orders rows -> 1 customer row -->
  <path class="d124a-plain" d="M 84,182 C 200,182 260,182 384,182" />
  <path class="d124a-plain" d="M 84,206 C 200,206 260,192 384,182" />

  <!-- C row: 1-to-1 -->
  <path class="d124a-plain" d="M 84,230 C 200,230 260,214 384,206" />

  <!-- D row: no match -->
  <path class="d124a-nomatch" d="M 84,254 C 140,270 110,282 104,290" />

  <rect class="d124a-tray" x="24" y="290" width="140" height="34" />
  <text class="d124a-mono-sm" x="34" y="311">no match: D</text>

  <text class="d124a-caption" x="24" y="352">A duplicated key produces one output row per pairing on each side --</text>
  <text class="d124a-caption" x="24" y="372">2 A-rows &#215; 2 A-rows = 4, not 2. A key with no match on the other</text>
  <text class="d124a-caption" x="24" y="392">side (D) drops out of an inner join, or arrives with NaN, depending on how=.</text>

  <!-- ===================== RIGHT: FOUR JOIN TYPES ===================== -->
  <text class="d124a-stage" x="616" y="84">2. FOUR JOIN TYPES ON A CLEAN, UNIQUE KEY</text>
  <text class="d124a-sub" x="616" y="100">left_keys: A, B, C, D -- right_keys: B, C, D, E -- overlap: B, C, D</text>

  <!-- Panel template values, hand-placed per panel below -->

  <!-- Panel 1: inner -->
  <g transform="translate(616,112)">
    <rect class="d124a-panel" x="0" y="0" width="278" height="200" />
    <text class="d124a-panel-title" x="14" y="24">inner</text>
    <text class="d124a-panel-count" x="220" y="24">n = 3</text>
    <g transform="translate(14,36)">
      <rect class="d124a-head" x="0" y="0" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="14">id</text>
