      <rect class="d124a-head" x="130" y="0" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="14">plan</text>

      <rect class="d124a-cell-dropped" x="0" y="20" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="34" opacity="0.5">A</text>
      <rect class="d124a-cell-dropped" x="40" y="20" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="34" opacity="0.5">dropped</text>
      <rect class="d124a-cell-dropped" x="130" y="20" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="34" opacity="0.5">dropped</text>

      <rect class="d124a-cell" x="0" y="40" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="54">B</text>
      <rect class="d124a-cell" x="40" y="40" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="54">South</text>
      <rect class="d124a-cell" x="130" y="40" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="54">basic</text>

      <rect class="d124a-cell" x="0" y="60" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="74">C</text>
      <rect class="d124a-cell" x="40" y="60" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="74">East</text>
      <rect class="d124a-cell" x="130" y="60" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="74">pro</text>

      <rect class="d124a-cell" x="0" y="80" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="94">D</text>
      <rect class="d124a-cell" x="40" y="80" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="94">West</text>
      <rect class="d124a-cell" x="130" y="80" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="94">pro</text>

      <rect class="d124a-cell-dropped" x="0" y="100" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="114" opacity="0.5">E</text>
      <rect class="d124a-cell-dropped" x="40" y="100" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="114" opacity="0.5">dropped</text>
      <rect class="d124a-cell-dropped" x="130" y="100" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="114" opacity="0.5">dropped</text>
    </g>
    <text class="d124a-caption" x="14" y="176">Only keys on BOTH sides survive.</text>
  </g>

  <!-- Panel 2: left -->
  <g transform="translate(926,112)">
    <rect class="d124a-panel" x="0" y="0" width="278" height="200" />
    <text class="d124a-panel-title" x="14" y="24">left</text>
    <text class="d124a-panel-count" x="220" y="24">n = 4</text>
    <g transform="translate(14,36)">
      <rect class="d124a-head" x="0" y="0" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="14">id</text>
      <rect class="d124a-head" x="40" y="0" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="14">region</text>
      <rect class="d124a-head" x="130" y="0" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="14">plan</text>

      <rect class="d124a-cell" x="0" y="20" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="34">A</text>
      <rect class="d124a-cell" x="40" y="20" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="34">North</text>
      <rect class="d124a-cell" x="130" y="20" width="80" height="20" /><text class="d124a-nan" x="136" y="34">NaN</text>

      <rect class="d124a-cell" x="0" y="40" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="54">B</text>
      <rect class="d124a-cell" x="40" y="40" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="54">South</text>
      <rect class="d124a-cell" x="130" y="40" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="54">basic</text>

      <rect class="d124a-cell" x="0" y="60" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="74">C</text>
      <rect class="d124a-cell" x="40" y="60" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="74">East</text>
      <rect class="d124a-cell" x="130" y="60" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="74">pro</text>

      <rect class="d124a-cell" x="0" y="80" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="94">D</text>
      <rect class="d124a-cell" x="40" y="80" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="94">West</text>
      <rect class="d124a-cell" x="130" y="80" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="94">pro</text>

      <rect class="d124a-cell-dropped" x="0" y="100" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="114" opacity="0.5">E</text>
      <rect class="d124a-cell-dropped" x="40" y="100" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="114" opacity="0.5">dropped</text>
      <rect class="d124a-cell-dropped" x="130" y="100" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="114" opacity="0.5">dropped</text>
    </g>
    <text class="d124a-caption" x="14" y="176">Every LEFT row kept; A gets NaN.</text>
  </g>

  <!-- Panel 3: right -->
  <g transform="translate(616,332)">
    <rect class="d124a-panel" x="0" y="0" width="278" height="200" />
    <text class="d124a-panel-title" x="14" y="24">right</text>
    <text class="d124a-panel-count" x="220" y="24">n = 4</text>
    <g transform="translate(14,36)">
      <rect class="d124a-head" x="0" y="0" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="14">id</text>
      <rect class="d124a-head" x="40" y="0" width="90" height="20" /><text class="d124a-mono-sm" x="46" y="14">region</text>
      <rect class="d124a-head" x="130" y="0" width="80" height="20" /><text class="d124a-mono-sm" x="136" y="14">plan</text>

      <rect class="d124a-cell-dropped" x="0" y="20" width="40" height="20" /><text class="d124a-mono-sm" x="6" y="34" opacity="0.5">A</text>
