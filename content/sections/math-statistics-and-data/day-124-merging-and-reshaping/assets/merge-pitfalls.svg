<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four issues.">
  <title>Where merging goes wrong</title>
  <style>
    .merge-pitfalls-bg   { fill: #f8fafc; }
    .merge-pitfalls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-pitfalls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-pitfalls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-pitfalls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-pitfalls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-pitfalls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-pitfalls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .merge-pitfalls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .merge-pitfalls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .merge-pitfalls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .merge-pitfalls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .merge-pitfalls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .merge-pitfalls-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .merge-pitfalls-stage { opacity: 1; }

    .merge-pitfalls-s0 { animation-delay: 0.00s; }
    .merge-pitfalls-e0 { animation-delay: 0.00s; }
    .merge-pitfalls-s1 { animation-delay: 1.28s; }
    .merge-pitfalls-e1 { animation-delay: 1.28s; }
    .merge-pitfalls-s2 { animation-delay: 2.56s; }
    .merge-pitfalls-e2 { animation-delay: 2.56s; }
    .merge-pitfalls-s3 { animation-delay: 3.84s; }
    .merge-pitfalls-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .merge-pitfalls-conn  { animation: merge-pitfalls-trace 6.4s ease-in-out infinite; }
      .merge-pitfalls-stage { animation: merge-pitfalls-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes merge-pitfalls-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes merge-pitfalls-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .merge-pitfalls-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .merge-pitfalls-stage { animation: merge-pitfalls-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes merge-pitfalls-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="merge-pitfalls-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="merge-pitfalls-bg" width="980" height="322"/>
  <text class="merge-pitfalls-h1"  x="30" y="40">Where merging goes wrong</text>
  <text class="merge-pitfalls-sub" x="30" y="64">Four issues.</text>
  <g class="merge-pitfalls-stage merge-pitfalls-s0">
    <rect class="merge-pitfalls-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="merge-pitfalls-step" x="44" y="142">01</text>
    <text class="merge-pitfalls-name" x="70" y="142">A non-unique key multiplies rows</text>
    <text class="merge-pitfalls-desc" x="44" y="166">Inflating every subsequent</text>
    <text class="merge-pitfalls-desc" x="44" y="182">total.</text>
  </g>
  <line class="merge-pitfalls-line merge-pitfalls-conn merge-pitfalls-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#merge-pitfalls-tip)"/>
  <g class="merge-pitfalls-stage merge-pitfalls-s1">
    <rect class="merge-pitfalls-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="merge-pitfalls-step" x="280" y="142">02</text>
    <text class="merge-pitfalls-name" x="306" y="142">An inner merge silently drops unmatched rows</text>
    <text class="merge-pitfalls-desc" x="280" y="166">Which looks like data loss.</text>
  </g>
  <line class="merge-pitfalls-line merge-pitfalls-conn merge-pitfalls-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#merge-pitfalls-tip)"/>
  <g class="merge-pitfalls-stage merge-pitfalls-s2">
    <rect class="merge-pitfalls-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="merge-pitfalls-step" x="516" y="142">03</text>
    <text class="merge-pitfalls-name" x="542" y="142">Keys of different types never match</text>
    <text class="merge-pitfalls-desc" x="516" y="166">A number and a string of digits.</text>
  </g>
  <line class="merge-pitfalls-line merge-pitfalls-conn merge-pitfalls-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#merge-pitfalls-tip)"/>
  <g class="merge-pitfalls-stage merge-pitfalls-s3">
    <rect class="merge-pitfalls-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="merge-pitfalls-step" x="752" y="142">04</text>
    <text class="merge-pitfalls-name" x="778" y="142">And identically named columns get suffixed</text>
    <text class="merge-pitfalls-desc" x="752" y="166">Which is easy to miss.</text>
  </g>
  <text class="merge-pitfalls-sub" x="30" y="304">Checking the row count before and after a merge is the one-line habit that catches the first two of these immediately, and it should be automatic.</text>
</svg>
