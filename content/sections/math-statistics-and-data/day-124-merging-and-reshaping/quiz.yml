questions:
  - question: >-
      Two frames each have 100 rows, and the key column you merge on has the same single value on
      every row of both frames. What does left.merge(right, on="key", how="inner") produce?
    options:
      - A 200-row frame stacking both inputs, the same as pd.concat would produce
      - A MergeError, because pandas refuses to merge on a fully duplicated key
      - Exactly 100 rows, one for each row on the left
      - 'Exactly 10,000 rows — every left row paired with every right'
    answer_index: 3
    explanation: >-
      A merge is a per-key Cartesian product. When a key value is duplicated 100 times on each side,
      every one of the 100 left rows pairs with every one of the 100 right rows sharing that value:
      100 * 100 = 10,000. Nothing about this raises an exception -- it is exactly what merge is
      defined to do with a duplicated key on both sides.
  - question: >-
      You believe a merge key should be unique on both sides. Which argument makes pandas check that
      belief and raise MergeError the instant it is false, before the merge completes?
    options:
      - validate="one_to_one"
      - indicator=True
      - suffixes=("_l", "_r")
      - how="inner"
    answer_index: 0
    explanation: >-
      validate= accepts "one_to_one", "one_to_many", "many_to_one" and "many_to_many", each stating a
      cardinality claim pandas checks before merging. validate="one_to_one" raises MergeError the
      moment either side turns out to have a duplicated key. indicator=True reports match provenance
      after the fact but does not stop an exploded merge from completing.
  - question: >-
      An outer merge with indicator=True reports left_only=1, right_only=1, both=3. The left frame has
      4 rows and the right frame has 4 rows, and neither side has a duplicated key. What must the
      merged frame's total row count be?
    options:
      - 4, because outer joins never exceed the larger input
      - 5, because left_only + right_only + both must equal the merged row count exactly
      - 8, because every row from both frames is always kept regardless of matches
      - It cannot be determined from the counts given
    answer_index: 1
    explanation: >-
      The three _merge categories partition the output rows completely: left_only + right_only + both
      must equal the total merged row count. Here 1 + 1 + 3 = 5. Separately, left_only + both (1 + 3
      = 4) reconciles with the left frame's own row count, and right_only + both (1 + 3 = 4) reconciles
      with the right frame's -- exactly the reconciliation habit this lesson carries over from Day 123.
  - question: >-
      On pandas 3.0.5, merging an int64-keyed frame against a frame whose same-digit key column is a
      pandas Categorical produces what?
    options:
      - A correct match on every row, because pandas casts both keys to a common type automatically
      - A MergeError, because validate= is implied whenever dtypes differ
      - Zero matching rows, silently, with no exception and no warning
      - A ValueError naming both dtypes, the same as a plain string key would raise
    answer_index: 2
    explanation: >-
      A categorical key slips past pandas 3.0.5's explicit int64-vs-string dtype check, so the merge
      completes and returns zero rows with no signal that anything went wrong. A plain str (or legacy
      object) key against int64, by contrast, is caught by that same check and raises ValueError -- an
      honest correction to the older "always silent" story, verified directly against this pandas
      version.
  - question: >-
      left_keys has customers A, B, C, D. right_keys has customers B, C, D, E. Every key is unique on
      both sides. What row count does how="left" produce?
    options:
      - 4, every row from right_keys, with NaN filling left_keys' columns for customer E
      - 3, only the customers present on both sides
      - 5, every customer from either frame
      - 4, every row from left_keys, with NaN filling right_keys' columns for customer A
    answer_index: 3
    explanation: >-
      how="left" keeps every row from the left frame no matter what, filling NaN in the right frame's
      columns wherever no match exists. left_keys has 4 rows (A, B, C, D); A has no match in
      right_keys, so A's row survives with NaN in the right-side columns, and the result has 4 rows
      total -- not 3 (that is inner) and not 5 (that is outer).
  - question: >-
      price_left and price_right both have a column named price. What are that column's two names in
      the default result of price_left.merge(price_right, on="sku")?
    options:
      - price_x and price_y
      - price_left and price_right, matching the frames' own variable names
      - price_1 and price_2
      - The merge raises an error, because pandas refuses ambiguous overlapping column names
    answer_index: 0
    explanation: >-
      pandas' default suffixes are ("_x", "_y") for the left and right frame respectively, applied to
      any overlapping non-key column name. Passing suffixes=(...) explicitly replaces those
      uninformative defaults with names that say what each column actually is -- the fix for exactly
      how a column like price_x ends up shipped to production.
  - question: >-
      pd.concat([frame_a, frame_b], axis=0, ignore_index=True) stacks two frames that share column b
      but where frame_a has no column c and frame_b has no column a. What happens to frame_a's rows in
      the resulting column c?
    options:
      - The concat raises an error, because the two frames' columns do not match
      - 'Filled with NaN — concat aligns by column name'
      - They are filled with 0
      - They are dropped, leaving only rows where every column is present on both sides
    answer_index: 1
    explanation: >-
      concat aligns along axis=0 by column name (the same alignment logic Day 120 taught for Series
      arithmetic, applied here across whole frames) and fills any column missing from one input with
      NaN on that input's rows, rather than raising or dropping anything. Shared columns like b are
      populated all the way through; column c is NaN for every row that came from frame_a specifically.
  - question: >-
      A long-form table has two rows sharing the same (student, subject) index/column pair with
      different scores. What is the key difference between calling .pivot() and .pivot_table() on it?
    options:
      - Both silently keep only the last of the duplicate rows, discarding the earlier one
      - pivot aggregates the duplicates automatically; pivot_table raises on them
      - 'pivot raises on the duplicate pair; pivot_table aggregates'
      - They behave identically; pivot_table is only a longer alias for pivot
    answer_index: 2
    explanation: >-
      pivot is a pure reshape that requires each index/column pair to be unique, and raises
      ValueError ("Index contains duplicate entries, cannot reshape") the instant it is not.
      pivot_table solves the same layout problem by aggregating -- with aggfunc="mean" by default --
      so a genuine duplicate produces a real average rather than an error. Choosing the wrong one is
      the difference between an error that stops you and a silently averaged number.
