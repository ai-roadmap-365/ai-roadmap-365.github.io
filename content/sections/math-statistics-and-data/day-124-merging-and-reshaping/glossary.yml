terms:
  - term: merge
    definition: >-
      The pandas operation that combines two DataFrames by matching rows on one or more shared key
      values, analogous to a SQL JOIN. Every left row is paired with every right row sharing its key,
      which is why a duplicated key on both sides produces a per-key Cartesian product rather than a
      one-to-one pairing.
  - term: cardinality (of a join)
    definition: >-
      A claim about how many times a merge key may repeat on each side of a join -- for example, that a
      customer ID appears at most once in a customer table (one) but many times in an orders table
      (many). validate= turns a stated cardinality claim into an enforced check that pandas performs
      before completing the merge.
  - term: validate
    definition: >-
      A merge() keyword accepting "one_to_one", "one_to_many", "many_to_one" or "many_to_many", each
      stating a cardinality assumption about the merge key on each side. If the assumption is false,
      pandas raises pandas.errors.MergeError before producing any output, rather than silently
      completing an unintended Cartesian product.
  - term: MergeError
    definition: >-
      The exception pandas raises when a merge's validate= argument detects that the stated cardinality
      assumption does not hold -- for example, validate="one_to_one" on a key that is duplicated on
      either side.
  - term: indicator
    definition: >-
      A merge() keyword that, when set to True, adds a categorical _merge column to the result recording
      whether each row's key matched on the left frame only (left_only), the right frame only
      (right_only), or both (both). The three counts must sum to the merged row count, and left_only
      plus both must equal the left frame's own row count whenever the left key has no duplicates.
  - term: how (join type)
    definition: >-
      The merge() keyword selecting inner (keep only matching keys), left (keep every left row),
      right (keep every right row), or outer (keep every row from both sides), filling NaN wherever no
      match exists on the kept side. Named identically to SQL's JOIN clauses, which pandas' merge design
      deliberately mirrors.
  - term: suffixes
    definition: >-
      A merge() keyword controlling what gets appended to a non-key column name that appears in both
      input frames. Defaults to ("_x", "_y"), which is how an uninformative column name like price_x
      ends up in a merged result unless suffixes= is passed explicitly.
  - term: left_on / right_on
    definition: >-
      merge() keywords naming the join column on the left frame and the right frame separately, used
      when the two frames' key columns have different names. on= is shorthand for the common case where
      both sides share the same column name.
  - term: join (DataFrame method)
    definition: >-
      A DataFrame method that merges on the index rather than a column, calling merge() internally with
      left_index=True and right_index=True. Convenient when the join key already is a table's index.
  - term: concat
    definition: >-
      The pandas function that stacks DataFrames along an axis -- axis=0 adds rows, axis=1 adds columns
      -- without matching on any key. Aligns by column name (axis=0) or index label (axis=1), filling
      any position that does not line up across the inputs with NaN rather than raising an error.
  - term: wide format
    definition: >-
      A table layout with one column per measurement or category -- for example, separate math,
      reading and science score columns for each student. Natural to read but usually the wrong shape
      for groupby-based aggregation or most plotting libraries.
  - term: long format
    definition: >-
      A table layout with one row per individual measurement, carrying a column naming which
      measurement it is and a column holding its value. The shape groupby, most aggregation functions,
      and most plotting libraries expect a categorical variable to be in.
  - term: melt
    definition: >-
      The DataFrame method that converts a table from wide format to long format, turning selected
      column names into values of a new "variable" column and their corresponding values into a new
      "value" column, while keeping any id_vars columns unchanged per row.
  - term: pivot
    definition: >-
      The DataFrame method that converts long format back to wide format by placing one column's
      values into the row index, another column's values into the column labels, and a third column's
      values into the resulting cells. Raises ValueError if any index/column pair repeats, since it has
      nowhere to place two values in one cell.
  - term: pivot_table
    definition: >-
      pivot's aggregating cousin: reshapes long format into wide format the same way pivot does, but
      resolves a duplicate index/column pair by applying an aggregation function (aggfunc, "mean" by
      default) instead of raising an error.
  - term: stack / unstack
    definition: >-
      DataFrame methods that move a level of a MultiIndex between the row index and the column labels.
      stack() moves the innermost column level down into the row index, making the frame taller;
      unstack() moves the innermost row-index level out into columns, making it wider.
  - term: dtype-mismatch join
    definition: >-
      A join failure caused by the same key values being stored with different pandas dtypes on each
      side -- for example, int64 on one side and a pandas Categorical of the same digits on the other.
      On pandas 3.0.5, an int64-versus-categorical mismatch returns zero matching rows silently, while
      an int64-versus-plain-string mismatch raises ValueError instead.
