visuals:
  - id: join-anatomy-architecture
    file: assets/join-anatomy-architecture.svg
    type: diagram
    title: 'The anatomy of a join -- the duplicate-key fan-out, and the four join types side by side'
    alt: 'Diagram: on the left, an orders table with six rows and a customer-lookup table with four rows, connected by lines from each shared customer ID; the customer ID that appears twice in each table is drawn with all four connecting lines fanning out between those four rows, visibly producing four matched pairs from two plus two source rows, labelled as the duplicate-key explosion, while a fifth order row with no matching customer is routed by a dashed line into a no-match tray; on the right, four smaller panels show a second, unique-keyed pair of tables under inner, left, right and outer join rules, each panel shading which rows survive and which are dropped or padded with a dashed NULL placeholder, labelled with the exact row counts 3, 4, 4 and 5'
    description: >-
      A static architecture diagram in two parts. On the left, an orders table (six rows: two sharing
      customer ID A, two sharing B, one C, one D) and a customer-lookup table (four rows: two for A,
      one B, one C) are drawn with connecting lines from each shared customer ID. The two A rows on
      each side draw all four possible connecting lines explicitly, visibly fanning out into four
      matched pairs from only two plus two source rows -- the duplicate-key explosion this lesson opens
      with, shown as anatomy rather than only described in prose. The order row for customer D, which
      has no match in the lookup table, is routed by a dashed red line down into a small no-match tray
      instead. On the right, a second, deliberately simple pair of tables with unique keys on both
      sides (left keys A-D, right keys B-E) is shown under the four join types -- inner, left, right,
      outer -- each panel shading in blue the rows that survive that join and shading in pale grey,
      with a dashed NULL placeholder, the rows that are either dropped (inner) or padded with missing
      values (left, right, outer). Each panel is labelled with its resulting row count -- 3, 4, 4, 5 --
      matching exactly the row-count table in the lesson's How it works section.
  - id: merge-flow
    file: assets/merge-flow.svg
    type: flow-animated
    title: 'indicator=True in motion -- left_only, right_only, both, and a duplicated key multiplying'
    alt: 'Diagram: keys from a left table and a right table travel along two parallel tracks toward a central merge point; matched keys combine into a single output row stamped both, an unmatched left key produces an output row stamped left_only with its right-hand fields shown as empty, an unmatched right key produces an output row stamped right_only the same way, and one duplicated key on both tracks is shown producing multiple output rows from a single pair of source rows, visibly multiplying — a caption states that indicator=True records exactly which side or sides each output row came from, and that the three counts must sum to the total output row count'
    description: >-
      An animated flow diagram, fully readable as a still image, showing indicator=True's three
      outcomes as a process. Keys travel along two parallel tracks -- one from a left table, one from a
      right table -- toward a central merge point. A key present on both tracks combines into a single
      output row that settles into a green both bucket. A left-only key arrives alone and settles into
      an amber left_only bucket, its right-hand fields drawn empty. A right-only key does the same into
      a blue right_only bucket. A fourth case, drawn last, shows one key value appearing twice on both
      tracks at once; the merge point visibly produces four output rows from that single duplicated
      pair, each one routed into the both bucket, making the row-multiplying mechanism from the
      architecture diagram legible again here as motion rather than a static fan-out. A caption band
      beneath states that the three bucket counts must sum to the total number of output rows, and
      that this is the reconciliation check to run after every merge. A prefers-reduced-motion block
      stops every token's travel and every colour transition, leaving all three buckets already
      populated in their final state and every count already legible without motion.
