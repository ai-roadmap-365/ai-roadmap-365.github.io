id: D124
day: 124
slug: merging-and-reshaping
title: 'Merging and Reshaping'
section: math-statistics-and-data
subsection: data-analysis
week: 18
learning_promise: >-
  After this lesson you will be able to reproduce a merge-driven row explosion on purpose and explain
  exactly why a duplicated key produces a per-key Cartesian product; use validate= to make pandas raise
  a MergeError the instant a stated cardinality assumption is violated, on a genuinely violated case and
  a genuinely valid one; read an indicator=True _merge column and reconcile its three counts against
  both input row counts; demonstrate that an int64 key merged against a categorical key of the same
  digits returns zero rows silently while the same key merged against a plain string key raises
  ValueError instead, on pandas 3.0.5 specifically; state and demonstrate the row counts inner, left,
  right and outer joins produce on one pair of frames; use suffixes= instead of the default _x/_y, use
  on= versus left_on=/right_on=, and join two frames on their index; demonstrate that concat's axis=0
  and axis=1 alignment fills unmatched columns or labels with NaN in exactly the cells that should be
  NaN; convert a wide table to long form with melt and recover the original exactly with pivot; and
  explain and demonstrate why pivot raises on a duplicate index/column pair while pivot_table aggregates
  it instead.
objectives:
  - 'Reproduce a merge-driven row explosion on two frames sharing a duplicated key, and compute the expected row count directly from each side''s per-key group sizes rather than assuming it'
  - 'Use validate=''one_to_one'' (and ''one_to_many'') to make pandas raise a MergeError the instant a stated cardinality assumption about a merge key is violated, and confirm the same call raises nothing on genuinely unique keys'
  - 'Add indicator=True to a merge, read the resulting _merge column''s left_only/right_only/both counts, and reconcile all three against the two input frames'' own row counts'
  - 'Demonstrate that an int64 merge key against a same-digit categorical key returns zero rows with no exception, and that the same int64 key against a plain string key instead raises ValueError on pandas 3.0.5 -- and state which of the two is the classic silent-failure case'
  - 'State and demonstrate the exact row counts inner, left, right and outer joins produce on one shared pair of frames, and explain in one sentence each why the counts differ'
  - 'Use suffixes= to rename overlapping non-key columns explicitly instead of accepting the default _x/_y, and explain how the default suffixes are how a column like price_x ends up in production'
  - 'Use on= versus left_on=/right_on= correctly when a join key has different names on each side, and join two frames on their shared index with .join() instead of merge()'
  - 'Demonstrate that pd.concat''s axis=0 and axis=1 alignment fills unmatched columns or index labels with NaN in exactly the cells that should be NaN, and explain why a shared int column can become float64 after such a concat'
  - 'Convert a wide table to long form with melt and recover the original exactly with pivot, including handling the column-order and column-axis-name differences pivot introduces'
  - 'Explain and demonstrate why pivot raises ValueError on a duplicate index/column pair while pivot_table aggregates the duplicates instead, and state which aggfunc pivot_table used to produce a specific reported value'
  - 'State when a SQL join executed where the data already lives, or a plain pivot_table, is the better choice over an in-memory pandas merge, and describe polars'' join and its explicit validate argument as a documented, faster alternative not run in this environment'
prerequisites:
  - 'Day 120 -- pandas Series and DataFrames, index alignment, and Copy-on-Write; concat''s alignment behaviour in this lesson is the same rule Day 120 taught for arithmetic between two Series'
  - 'Day 121 -- loading and inspecting data, and the type-inference traps this lesson''s dtype-mismatch join turns into a real join failure'
  - 'Day 122 -- boolean masks, .query(), and the partition invariant, which this lesson''s indicator=True reconciliation directly extends from row-level filtering to merging'
  - 'Day 123 -- split-apply-combine and the habit of checking that the parts reconcile with the whole after any groupby aggregation, applied in this lesson to merge instead'
  - 'Week 13 -- SQL and SQLite, the tool this lesson''s Tools section compares merge against for joins that should be enforced at write time, not just checked at read time'
  - 'A working python3 on your PATH; the lab creates its own virtual environment with pandas 3.0.5 pinned exactly'
