terms:
  - term: Figure
    definition: >-
      The whole canvas matplotlib draws on -- the object you save to a
      file with savefig, and the top of the object model. A Figure holds
      one or more Axes; it owns nothing about what gets plotted, only
      where the Axes sit and at what overall size and resolution the
      canvas gets rendered.

  - term: Axes
    definition: >-
      A single set of x/y (or x/y/z) coordinates inside a Figure, and the
      object almost everything in this lesson is a method call on. An
      Axes owns its plotted Artists, its labels, its title, its limits,
      its ticks and its legend. Despite the name's similarity to "axis,"
      one Axes typically has two axis objects (x and y) belonging to it --
      the plural in "Axes" refers to this pairing, not to there being
      several of them.

  - term: Artist
    definition: >-
      matplotlib's base class for literally everything that gets drawn --
      a Line2D from a plot() call, a Text from a label or title, a
      Rectangle from a bar, a Legend. An Axes' plotted content is a list
      of Artist objects, which is exactly what makes a chart testable:
      ax.lines is a list of Line2D artists, and each one's get_xydata()
      returns the numbers that produced it.

  - term: pyplot state machine
    definition: >-
      The plt.plot / plt.xlabel / plt.title style of calling matplotlib,
      where every function operates on whichever Figure and Axes are
      currently "current" (plt.gcf() and plt.gca()) rather than on an
      object you named yourself. Convenient for a single quick plot in a
      notebook; the source of the two-APIs bug the moment a drawing
      routine gets called more than once.

  - term: object API
    definition: >-
      The fig, ax = plt.subplots() style, where every following
      instruction is a method call on that specific ax. Every example in
      this course uses this style, because it makes it structurally
      impossible for one call to silently draw into a different figure
      than the one you meant.

  - term: savefig
    definition: >-
      The Figure method that writes a chart to a file, with the output
      format inferred from the extension (or set explicitly via format=).
      Its output size in pixels is figsize (inches) times dpi, exactly --
      unless bbox_inches='tight' trims the canvas to the drawn content
      afterward, which breaks that exact prediction.

  - term: dpi
    definition: >-
      Dots per inch -- the resolution a Figure gets rendered at when
      saved to a raster format. Combined with figsize, dpi determines the
      output's pixel dimensions exactly: a 6x4 inch figure at 100 dpi
      saves at 600x400 pixels; at 200 dpi, 1200x800.

  - term: bbox_inches
    definition: >-
      A savefig argument controlling how much of the Figure's canvas gets
      written to the output file. The default writes the whole canvas at
      its declared figsize; 'tight' instead crops the output to the
      bounding box of everything actually drawn, which is often what you
      want visually but breaks the exact figsize-times-dpi pixel
      arithmetic, since the trimmed size depends on the content.

  - term: subplots grid
    definition: >-
      The array of Axes objects plt.subplots(nrows, ncols) returns when
      either dimension exceeds 1 -- a genuine 2-D numpy array shaped
      (nrows, ncols), not a flat list. Each entry is a fully independent
      Axes: setting a label on axes[0, 0] never touches axes[0, 1].

  - term: autoscale
    definition: >-
      matplotlib's default behaviour of choosing axis limits that fit the
      plotted data with a small margin, recomputed whenever new data is
      plotted. An explicit call to set_xlim or set_ylim overrides
      autoscaling for that axis; autoscaling does not resume unless
      autoscale() is called again explicitly.

  - term: log scale
    definition: >-
      An axis scale (set with set_yscale('log') or set_xscale('log'))
      where equal steps represent equal ratios rather than equal
      differences. It has no representation for zero or negative values
      -- matplotlib does not raise an error over this, it silently
      narrows the rendered range to exclude non-positive values, leaving
      the underlying data untouched but the affected points undrawn.

  - term: label-then-legend pattern
    definition: >-
      The convention of passing label= to every plot call that should
      appear in the legend, then calling ax.legend() once, after every
      relevant artist has been created. The legend's entries appear in
      plotting order, which is why the pattern names it "label-then" --
      the labelling happens first, the single legend() call happens last.

  - term: figure lifecycle
    definition: >-
      The fact that every Figure created through pyplot (plt.figure(),
      plt.subplots()) is retained in a global registry until
      plt.close(fig) or plt.close('all') removes it -- it does not get
      garbage-collected just because the variable holding it goes out of
      scope. A function that plots in a loop and returns without closing
      leaks one figure per call; matplotlib issues its own RuntimeWarning
      once more than 20 figures are open at once (rcParams
      figure.max_open_warning).

  - term: raster image
    definition: >-
      An image format (PNG, JPEG) stored as a fixed grid of pixel colour
      values. Text and lines in a raster image are rendered into pixels
      at save time and cannot be searched, selected, or resized without
      quality loss -- the string that produced a label does not appear
      anywhere in the file's bytes.

  - term: vector image
    definition: >-
      An image format (SVG, PDF, EPS) stored as a description of shapes,
      paths and text -- resolution-independent, and, for SVG, literally
      XML markup you can open in a text editor. A vector chart's axis
      label appears as a literal <text> element you can search for in the
      file; the file can be zoomed or printed at any size without pixel
      artifacts.

  - term: rcParams
    definition: >-
      matplotlib's global dictionary of default settings -- figure size,
      font size, line width, colour cycle, and hundreds more -- read from
      matplotlib.rcParams or set in bulk from a named style sheet with
      plt.style.use(). Setting defaults once through rcParams, rather
      than repeating the same keyword argument on every plot call across
      a report, is what keeps a multi-chart document visually consistent.
