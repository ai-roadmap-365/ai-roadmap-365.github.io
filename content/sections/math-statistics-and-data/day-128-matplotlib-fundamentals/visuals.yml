visuals:
  - id: figure-anatomy-architecture
    file: assets/figure-anatomy-architecture.svg
    type: diagram
    title: 'The Figure/Axes/Artist object model, labelled on a real chart'
    alt: 'Diagram: a single rendered line chart, labelled to show the object model -- an outer box marked Figure containing one inner plotting box marked Axes; inside the Axes, labelled parts include the four spines around the edge, tick marks and tick labels on both axes, the x-axis label and y-axis label below and beside the plot, a title above the plot, a legend box in an upper corner, and the plotted line itself marked as a Line2D Artist -- with a caption explaining that the Figure holds the Axes and the Axes owns everything drawn inside it'
    description: 'A static architecture diagram, on a light background, showing one rendered line chart with every structural part called out by a leader line and a label. The outermost dashed rectangle is labelled "FIGURE -- the whole canvas, what savefig() writes to disk", drawn slightly larger than the plot itself to show it as the containing object. Inside it, a solid rectangle is labelled "AXES -- one plotting area, with its own x/y coordinates", and every part of that rectangle is called out: the four border lines are labelled "spines", the small perpendicular marks along each edge are labelled "ticks", the numbers beside them are labelled "tick labels", text below the Axes is labelled "x-axis label (ax.set_xlabel)", text to the left is labelled "y-axis label (ax.set_ylabel)", text above the Axes is labelled "title (ax.set_title)", a small boxed key in the upper-right corner is labelled "legend (ax.legend())", and the plotted line itself, a simple upward curve, is labelled "Line2D -- an Artist, stored in ax.lines". A closing caption states: "A Figure holds one or more Axes. An Axes owns every Artist drawn inside it -- its lines, its labels, its legend -- as real, readable Python objects, which is what makes a chart testable."'

  - id: two-apis-flow
    file: assets/two-apis-flow.svg
    type: flow-animated
    title: 'The same three drawing commands, routed two ways: through the pyplot state machine to whichever figure is current, versus through the object API to a named Axes'
    alt: 'Diagram: animated flow, two panels. Top panel shows three pyplot commands -- plt.plot, plt.xlabel, plt.title -- each sending an arrow toward a single box labelled "current figure", which is drawn twice in sequence to show a second call landing on the same box as the first. Bottom panel shows the same three kinds of commands as ax.plot, ax.set_xlabel, ax.set_title, each sending an arrow directly to a specific named Axes box, with a second call shown routing to a second, separate Axes box'
    description: 'An animated flow diagram, fully readable as a still image. The heading reads "Two calls, two outcomes" and states that the same three instructions -- plot a line, set a label, set a title -- are issued twice in each panel. The top panel, labelled "pyplot state machine -- routes through whatever is CURRENT", shows three small labelled command boxes (plt.plot, plt.xlabel, plt.title) each with an animated dashed arrow that travels toward a single destination box labelled "current figure (figure 1)"; the arrows pulse in sequence to show call 1 and call 2 both arriving at the same destination box, which briefly highlights twice to mark two separate deliveries to one target. The bottom panel, labelled "object API -- routes to a NAMED Axes", shows three equivalent command boxes (ax.plot, ax.set_xlabel, ax.set_title) with animated arrows that travel to two clearly separate destination boxes labelled "ax (figure 1)" and "ax (figure 2)", one arrow set per box, highlighting each destination exactly once. A closing caption states: "Same three kinds of instructions, issued the same number of times. One path can only ever reach whatever is current; the other path names its destination and cannot reach anywhere else." A prefers-reduced-motion block stops every animation: the top panel''s three arrows rest fully drawn, pointing at the single current-figure box with both delivery highlights shown at once; the bottom panel''s arrows rest fully drawn, pointing at their own separate Axes boxes with both highlighted -- every command box, arrow, destination box, label and both captions remain fully present with no motion.'
