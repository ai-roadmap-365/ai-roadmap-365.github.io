learning_promise: >-
  After this lesson you will be able to explain why matplotlib's two APIs
  produce different behaviour from nearly identical-looking code, and
  build every chart in this course the way that cannot go wrong. You will
  watch a helper function built from plt.plot and plt.xlabel silently
  overlay two unrelated runs onto one figure when called twice --
  measured directly, plt.get_fignums() reports a single figure holding
  two lines -- and then watch the object-API version of the same function,
  built from fig, ax = plt.subplots(), produce two independent figures
  with one line each, guaranteed by construction rather than by
  discipline. You will compute savefig's exact pixel arithmetic and check
  it against a real PNG file's own header bytes: a 6x4 inch figure at 100
  dpi saves at exactly 600x400 pixels, and doubling the dpi to 200 doubles
  both dimensions to exactly 1200x800, measured, not assumed. You will
  build a 2x3 grid of subplots and confirm each Axes is genuinely
  independent -- a label set on one cell never appears on any other. You
  will discover what a logarithmic y-scale actually does to a data point
  with value zero: it does not raise an error, and on matplotlib 3.11.1 it
  does not even warn when the series contains a mix of positive and
  non-positive values -- it silently narrows the rendered range so the
  zero-valued point falls outside what gets drawn, while the underlying
  data is untouched. You will apply the label-then-legend pattern and
  verify a legend's text and order by reading the Legend object directly.
  You will reproduce matplotlib's figure-lifecycle leak -- opening figures
  in a loop without closing them -- and trigger matplotlib's own real
  RuntimeWarning once more than 20 are open at once, then watch
  plt.close() empty the registry completely. You will save the same chart
  as PNG and SVG and prove, by searching each file's own bytes, that the
  axis label appears as literal searchable text in the SVG and nowhere at
  all in the PNG -- the entire argument for vector output turned into two
  assertions. And throughout, you will test every one of these claims by
  asserting on the chart's own object graph -- ax.get_xlabel(),
  ax.get_ylim(), len(ax.lines), ax.lines[0].get_xydata(),
  ax.get_yscale() -- never by comparing rendered pixels to a stored
  reference image.
objectives:
  - 'Explain why the pyplot state-machine API and the object API produce different results when a drawing routine is called more than once, and demonstrate the difference by measuring plt.get_fignums()'
  - 'Name the Figure/Axes/Artist object model precisely: a Figure holds one or more Axes, and an Axes owns its plotted Artists, its labels, its limits and its ticks'
  - 'Predict a saved PNG''s exact pixel dimensions from figsize and dpi, and explain why bbox_inches=''tight'' breaks that exact prediction'
  - 'Build a grid of subplots with plt.subplots(nrows, ncols), read the shape of the returned Axes array, and demonstrate that each Axes in the grid is independent of every other'
  - 'Set labels, a title and explicit axis limits on an Axes, and demonstrate that an explicit set_ylim overrides autoscaling rather than merging with it'
  - 'Describe precisely what set_yscale(''log'') does to a data point with value zero or negative, and demonstrate the effect by inspecting the Axes'' own rendered y-limits'
  - 'Apply the label-then-legend pattern and verify a legend''s text and order by reading the Legend object it produces'
  - 'Explain matplotlib''s figure lifecycle, reproduce the leak that follows from plotting in a loop without plt.close(), and trigger matplotlib''s own too-many-open-figures warning'
  - 'State the concrete, testable difference between a raster (PNG) and a vector (SVG) chart output, and choose between them for a given downstream use'
  - 'Test a chart by asserting on its artists rather than by diffing rendered image bytes, and explain why that approach is more robust across machines and matplotlib versions'
prerequisites:
  - 'Day 127 -- why we visualize data and how to choose the right chart type, which this lesson assumes and builds the tool for'
  - 'Day 91 -- running and reading pytest output, this lesson''s lab testing pattern'
  - 'Days 71-74 -- installing packages with pip into a virtual environment'
  - 'Comfort with Python functions, tuples, and reading a stack trace'
