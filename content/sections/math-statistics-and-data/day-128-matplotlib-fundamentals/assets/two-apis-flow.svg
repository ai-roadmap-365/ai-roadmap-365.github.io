<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="d128fTitleId d128fDescId">
  <title id="d128fTitleId">The same three drawing commands, routed two ways: through the pyplot state machine to whichever figure is current, versus through the object API to a named Axes</title>
  <desc id="d128fDescId">Two panels, animated. Top: three pyplot commands (plt.plot, plt.xlabel, plt.title) each route toward a single "current figure" box, called twice, both calls landing on the same box. Bottom: the equivalent object-API commands (ax.plot, ax.set_xlabel, ax.set_title) route to two separate, explicitly named Axes boxes, one call each. With motion removed, both panels' full routing remains visible at once as a labelled diagram.</desc>

  <style>
    .d128f-bg      { fill: #f8fafc; }
    .d128f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d128f-panelh  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1a202c; }
    .d128f-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d128f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1a202c; }
    .d128f-panel   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d128f-cmdbox  { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.25; }
    .d128f-destbox { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.75; }
    .d128f-destbox2{ fill: #dcfce7; stroke: #15803d; stroke-width: 1.75; }

    .d128f-arrow1  { stroke: #1d4ed8; stroke-width: 2; fill: none; opacity: 0.25;
                     stroke-dasharray: 6 5; animation: d128f-flow 4s ease-in-out infinite; }
    .d128f-arrow2  { stroke: #1d4ed8; stroke-width: 2; fill: none; opacity: 0.25;
                     stroke-dasharray: 6 5; animation: d128f-flow 4s ease-in-out infinite; animation-delay: 0.6s; }
    @keyframes d128f-flow {
      0%, 6%    { stroke-dashoffset: 60; opacity: 0.2; }
      35%       { stroke-dashoffset: 0; opacity: 0.95; }
      55%, 100% { stroke-dashoffset: 0; opacity: 0.95; }
    }

    .d128f-hit1 { opacity: 0; animation: d128f-pulse 4s ease-in-out infinite; }
    .d128f-hit2 { opacity: 0; animation: d128f-pulse 4s ease-in-out infinite; animation-delay: 0.6s; }
    @keyframes d128f-pulse {
      0%, 30%   { opacity: 0; }
      40%, 50%  { opacity: 1; }
      60%, 100% { opacity: 0; }
    }

    .d128f-arrowB1 { stroke: #15803d; stroke-width: 2; fill: none; opacity: 0.25;
                      stroke-dasharray: 6 5; animation: d128f-flow 4s ease-in-out infinite; }
    .d128f-arrowB2 { stroke: #15803d; stroke-width: 2; fill: none; opacity: 0.25;
                      stroke-dasharray: 6 5; animation: d128f-flow 4s ease-in-out infinite; animation-delay: 0.6s; }

    @media (prefers-reduced-motion: reduce) {
      .d128f-arrow1, .d128f-arrow2, .d128f-arrowB1, .d128f-arrowB2 { animation: none; stroke-dashoffset: 0; opacity: 0.95; }
      .d128f-hit1, .d128f-hit2 { animation: none; opacity: 1; }
    }
  </style>

  <rect class="d128f-bg" x="0" y="0" width="1040" height="560" />
  <text class="d128f-title" x="30" y="36">Two calls, two outcomes</text>
  <text class="d128f-small" x="30" y="58">the same three kinds of instructions, issued twice in each panel -- watch where they land</text>

  <!-- TOP PANEL: pyplot state machine -->
  <rect class="d128f-panel" x="24" y="72" width="992" height="200" rx="10" />
  <text class="d128f-panelh" x="44" y="98">pyplot state machine -- routes through whatever is CURRENT</text>

  <g transform="translate(60,120)">
    <rect class="d128f-cmdbox" x="0" y="0" width="130" height="34" rx="6" />
    <text class="d128f-label" x="65" y="22" text-anchor="middle">plt.plot(...)</text>
  </g>
  <g transform="translate(60,170)">
    <rect class="d128f-cmdbox" x="0" y="0" width="130" height="34" rx="6" />
    <text class="d128f-label" x="65" y="22" text-anchor="middle">plt.xlabel(...)</text>
  </g>
  <g transform="translate(60,220)">
    <rect class="d128f-cmdbox" x="0" y="0" width="130" height="34" rx="6" />
    <text class="d128f-label" x="65" y="22" text-anchor="middle">plt.title(...)</text>
  </g>

  <path class="d128f-arrow1" d="M190,137 C350,137 480,150 610,160" />
  <path class="d128f-arrow1" d="M190,187 C350,187 480,165 610,168" />
  <path class="d128f-arrow2" d="M190,237 C350,237 480,180 610,176" />

  <rect class="d128f-destbox" x="620" y="120" width="220" height="120" rx="8" />
  <text class="d128f-label" x="730" y="150" text-anchor="middle" font-weight="700">current figure</text>
  <text class="d128f-label" x="730" y="170" text-anchor="middle">(figure 1)</text>
  <text class="d128f-small" x="730" y="196" text-anchor="middle">call 1 AND call 2</text>
  <text class="d128f-small" x="730" y="214" text-anchor="middle">both land here</text>
  <rect class="d128f-hit1" x="620" y="120" width="220" height="120" rx="8" fill="#1d4ed8" opacity="0" />
  <rect class="d128f-hit2" x="620" y="120" width="220" height="120" rx="8" fill="#1d4ed8" opacity="0" />

  <text class="d128f-small" x="880" y="150">plt.get_fignums()</text>
  <text class="d128f-label" x="880" y="170" font-weight="700">= [1]</text>
  <text class="d128f-small" x="880" y="196">2 lines on</text>
  <text class="d128f-small" x="880" y="212">that 1 figure</text>

  <!-- BOTTOM PANEL: object API -->
  <rect class="d128f-panel" x="24" y="288" width="992" height="248" rx="10" />
  <text class="d128f-panelh" x="44" y="314">object API -- routes to a NAMED Axes</text>

  <g transform="translate(60,336)">
    <rect class="d128f-cmdbox" x="0" y="0" width="150" height="34" rx="6" />
    <text class="d128f-label" x="75" y="22" text-anchor="middle">ax.plot(...)</text>
  </g>
  <g transform="translate(60,386)">
    <rect class="d128f-cmdbox" x="0" y="0" width="150" height="34" rx="6" />
    <text class="d128f-label" x="75" y="22" text-anchor="middle">ax.set_xlabel(...)</text>
  </g>
  <g transform="translate(60,436)">
    <rect class="d128f-cmdbox" x="0" y="0" width="150" height="34" rx="6" />
    <text class="d128f-label" x="75" y="22" text-anchor="middle">ax.set_title(...)</text>
  </g>

  <path class="d128f-arrowB1" d="M210,353 C330,353 400,370 470,378" />
  <path class="d128f-arrowB1" d="M210,403 C330,403 400,385 470,382" />
  <path class="d128f-arrowB1" d="M210,453 C330,453 400,395 470,386" />

  <rect class="d128f-destbox2" x="480" y="345" width="190" height="90" rx="8" />
  <text class="d128f-label" x="575" y="378" text-anchor="middle" font-weight="700">ax (figure 1)</text>
  <text class="d128f-small" x="575" y="400" text-anchor="middle">call 1 only</text>
  <rect class="d128f-hit1" x="480" y="345" width="190" height="90" rx="8" fill="#15803d" opacity="0" />

  <path class="d128f-arrowB2" d="M210,353 C560,300 700,460 730,478" />
  <path class="d128f-arrowB2" d="M210,403 C560,320 700,470 730,485" />
  <path class="d128f-arrowB2" d="M210,453 C560,340 700,478 730,490" />

  <rect class="d128f-destbox2" x="730" y="440" width="190" height="90" rx="8" />
  <text class="d128f-label" x="825" y="473" text-anchor="middle" font-weight="700">ax (figure 2)</text>
  <text class="d128f-small" x="825" y="495" text-anchor="middle">call 2 only</text>
  <rect class="d128f-hit2" x="730" y="440" width="190" height="90" rx="8" fill="#15803d" opacity="0" />

  <text class="d128f-small" x="480" y="325">plt.get_fignums() = [1, 2] -- two figures, one line each</text>
</svg>
