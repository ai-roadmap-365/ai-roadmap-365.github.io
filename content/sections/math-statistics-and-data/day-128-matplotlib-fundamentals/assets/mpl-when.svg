<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the purpose.">
  <title>Which plotting approach when</title>
  <style>
    .mpl-when-bg   { fill: #f8fafc; }
    .mpl-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mpl-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mpl-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mpl-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mpl-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mpl-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mpl-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mpl-when-row { opacity: 1; }
    .mpl-when-r0 { animation-delay: 0.00s; }
    .mpl-when-r1 { animation-delay: 0.45s; }
    .mpl-when-r2 { animation-delay: 0.90s; }
    .mpl-when-r3 { animation-delay: 1.35s; }
    .mpl-when-r4 { animation-delay: 1.80s; }
    .mpl-when-row { animation: mpl-when-reveal 7.3s ease-in-out infinite; }
    @keyframes mpl-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mpl-when-bg" width="980" height="390"/>
  <text class="mpl-when-h1"  x="30" y="40">Which plotting approach when</text>
  <text class="mpl-when-sub" x="30" y="64">By the purpose.</text>
  <rect class="mpl-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mpl-when-name" x="46" y="122">The purpose</text>
  <text class="mpl-when-desc" x="46" y="142">What the plot is for.</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r0" x="46" y="182">A quick look while exploring</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r1" x="46" y="216">A statistical chart of a common type</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r2" x="46" y="250">A figure for a report or paper</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r3" x="46" y="284">A multi-panel comparison</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r4" x="46" y="318">An interactive dashboard</text>
  <rect class="mpl-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mpl-when-name" x="526" y="122">The approach</text>
  <text class="mpl-when-desc" x="526" y="142">What to use.</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r0" x="526" y="182">The shortest command available</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r1" x="526" y="216">A statistical wrapper</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r2" x="526" y="250">The explicit interface, with a style</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r3" x="526" y="284">The explicit interface, with subplots</text>
  <text class="mpl-when-desc mpl-when-row mpl-when-r4" x="526" y="318">A dedicated interactive library</text>
  <text class="mpl-when-sub" x="30" y="372">Reaching for the shortest command while exploring is correct and worth permitting yourself, since polish applied to a chart you will discard is wasted effort.</text>
</svg>
