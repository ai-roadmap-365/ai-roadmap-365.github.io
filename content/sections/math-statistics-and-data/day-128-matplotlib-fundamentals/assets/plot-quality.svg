<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four elements.">
  <title>What makes a plot readable</title>
  <style>
    .plot-quality-bg   { fill: #f8fafc; }
    .plot-quality-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plot-quality-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plot-quality-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plot-quality-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plot-quality-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plot-quality-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .plot-quality-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .plot-quality-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .plot-quality-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .plot-quality-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .plot-quality-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .plot-quality-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .plot-quality-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .plot-quality-stage { opacity: 1; }

    .plot-quality-s0 { animation-delay: 0.00s; }
    .plot-quality-e0 { animation-delay: 0.00s; }
    .plot-quality-s1 { animation-delay: 1.28s; }
    .plot-quality-e1 { animation-delay: 1.28s; }
    .plot-quality-s2 { animation-delay: 2.56s; }
    .plot-quality-e2 { animation-delay: 2.56s; }
    .plot-quality-s3 { animation-delay: 3.84s; }
    .plot-quality-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .plot-quality-conn  { animation: plot-quality-trace 6.4s ease-in-out infinite; }
      .plot-quality-stage { animation: plot-quality-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes plot-quality-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes plot-quality-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .plot-quality-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .plot-quality-stage { animation: plot-quality-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes plot-quality-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="plot-quality-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="plot-quality-bg" width="980" height="322"/>
  <text class="plot-quality-h1"  x="30" y="40">What makes a plot readable</text>
  <text class="plot-quality-sub" x="30" y="64">Four elements.</text>
  <g class="plot-quality-stage plot-quality-s0">
    <rect class="plot-quality-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="plot-quality-step" x="44" y="142">01</text>
    <text class="plot-quality-name" x="70" y="142">Axis labels with units, always</text>
    <text class="plot-quality-desc" x="44" y="166">An unlabelled axis is not a</text>
    <text class="plot-quality-desc" x="44" y="182">chart.</text>
  </g>
  <line class="plot-quality-line plot-quality-conn plot-quality-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#plot-quality-tip)"/>
  <g class="plot-quality-stage plot-quality-s1">
    <rect class="plot-quality-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="plot-quality-step" x="280" y="142">02</text>
    <text class="plot-quality-name" x="306" y="142">An honest scale, starting at zero for bars</text>
    <text class="plot-quality-desc" x="280" y="166">Or the comparison is distorted.</text>
  </g>
  <line class="plot-quality-line plot-quality-conn plot-quality-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#plot-quality-tip)"/>
  <g class="plot-quality-stage plot-quality-s2">
    <rect class="plot-quality-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="plot-quality-step" x="516" y="142">03</text>
    <text class="plot-quality-name" x="542" y="142">Restraint: remove anything not carrying data</text>
    <text class="plot-quality-desc" x="516" y="166">Gridlines, borders, effects.</text>
  </g>
  <line class="plot-quality-line plot-quality-conn plot-quality-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#plot-quality-tip)"/>
  <g class="plot-quality-stage plot-quality-s3">
    <rect class="plot-quality-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="plot-quality-step" x="752" y="142">04</text>
    <text class="plot-quality-name" x="778" y="142">And a caption stating what the reader should see</text>
    <text class="plot-quality-desc" x="752" y="166">Which is not the same as a</text>
    <text class="plot-quality-desc" x="752" y="182">title.</text>
  </g>
  <text class="plot-quality-sub" x="30" y="304">A caption stating the takeaway is the most undervalued element, because a reader who takes the wrong point from a correct chart has still been misinformed.</text>
</svg>
