questions:
  - question: 'A helper function calls plt.plot(x, y) and plt.xlabel("x") to draw a chart. It is called twice in a row, with different data, and nothing calls plt.figure() in between. What does plt.get_fignums() report afterward?'
    options:
      - 'A list of two figure numbers, one per call'
      - 'A list with exactly one figure number, holding both lines'
      - 'An empty list, since neither call created a named figure'
      - 'An error, because plt.plot cannot be called twice without plt.show() in between'
    answer_index: 1
    explanation: 'Every plt.* call draws into whichever figure is currently "current" (plt.gcf()). Without an intervening plt.figure() or plt.subplots(), the second call finds the same current figure the first call left behind, and both lines land on it. This lesson measured exactly this: plt.get_fignums() == [1] with two lines on that one figure, which is the entire motivation for the object API.'

  - question: 'What structurally prevents fig, ax = plt.subplots() from ever drawing into a different figure than the one just created, in a way the pyplot state machine cannot guarantee?'
    options:
      - 'plt.subplots() automatically calls plt.close() on any other open figures'
      - 'Every following instruction is a method call on the specific ax object returned, which has no notion of "current" to get confused about'
      - 'The object API only allows one figure to exist per Python process'
      - 'ax.plot() checks a global lock before drawing to prevent concurrent figures'
    answer_index: 1
    explanation: 'The object API names its target explicitly: ax.plot(), ax.set_xlabel() and so on all operate on the specific Axes object in hand. There is no "currently active" figure or axes for a bug to route through by mistake -- the only way to draw into the wrong Axes is to be handed the wrong ax variable, which is a different and much rarer mistake than forgetting to call plt.figure().'

  - question: 'A figure is created with figsize=(6, 4) and saved with fig.savefig(path, dpi=100) and no bbox_inches argument. What are the saved PNG''s pixel dimensions?'
    options:
      - '600 x 400'
      - '6 x 4'
      - '100 x 100'
      - 'It depends on how much whitespace surrounds the plotted data'
    answer_index: 0
    explanation: 'Pixel dimensions are figsize (in inches) times dpi, exactly, when the default bounding box is used: 6 inches x 100 dpi = 600 pixels wide, 4 inches x 100 dpi = 400 pixels tall. This lesson verified it by reading the saved PNG''s own IHDR header bytes, not by trusting the arithmetic, and confirmed doubling dpi to 200 doubles both dimensions to exactly 1200 x 800.'

  - question: 'Why does bbox_inches="tight" break the figsize-times-dpi pixel prediction?'
    options:
      - 'It has no effect on the saved file, only on the on-screen preview'
      - 'It doubles the dpi automatically to compensate for cropping'
      - 'It crops the saved output to the bounding box of what was actually drawn, so the final size depends on the content and its margins rather than only on figsize and dpi'
      - 'It only affects vector formats like SVG, never PNG'
    answer_index: 2
    explanation: 'bbox_inches="tight" is often what you want visually -- it trims empty margin around the plotted content -- but that means the saved size is figsize x dpi MINUS whatever got trimmed, which depends on the specific figure''s content, labels and layout. Exact pixel arithmetic requires the default, untrimmed bounding box.'

  - question: 'plt.subplots(2, 3) is called, and a label is set on axes[0, 0]. What is axes[0, 1].get_xlabel() afterward?'
    options:
      - 'The same label as axes[0, 0], since they share a row'
      - 'An empty string, because each Axes in the returned array is independent'
      - 'A TypeError, since axes cannot be indexed like a 2-D array'
      - 'The label of whichever Axes was created most recently'
    answer_index: 1
    explanation: 'plt.subplots(nrows, ncols) returns a genuine (nrows, ncols) numpy array of independent Axes objects. Setting state on one entry -- a label, a title, a plotted line -- has no effect on any other entry. This lesson confirmed it directly: after labelling only axes[0, 0], every other cell in a 2x3 grid reported an empty string for get_xlabel().'

  - question: 'A series [0, 1, 4, 9, 16] is plotted and ax.set_yscale("log") is applied, then the figure is redrawn. What actually happens to the point at (x=0, y=0), measured on matplotlib 3.11.1?'
    options:
      - 'matplotlib raises a ValueError, since log(0) is undefined'
      - 'The point is silently removed from ax.lines[0].get_xydata()'
      - 'matplotlib always prints a warning naming the offending zero value'
      - 'The point remains in the line''s stored data, but the rendered y-limits narrow to exclude it, so it draws nothing and no error or warning fires for this mixed-sign case'
    answer_index: 3
    explanation: 'Measured directly: after set_yscale("log") and a forced redraw, ax.get_ylim() came back as roughly (0.87, 18.4) -- a lower bound strictly above zero -- while ax.lines[0].get_xydata() still contained the original (0, 0) point untouched. matplotlib only emits its "no positive values" warning when EVERY value is non-positive; a mix draws nothing for the zero point and says nothing about it.'

  - question: 'ax.plot(x, y1, label="B") is called, then ax.plot(x, y2, label="A") is called, then ax.legend(). What order do the legend entries appear in?'
    options:
      - 'Alphabetical: "A" then "B"'
      - 'Plotting order: "B" then "A"'
      - 'Reverse plotting order: "A" then "B", most recent first'
      - 'Undefined -- legend order is randomized each render'
    answer_index: 1
    explanation: 'A Legend''s entries follow the order the labelled artists were created in, not the order of their label strings. This lesson''s lab measured exactly this: [t.get_text() for t in legend.get_texts()] equals the labels in plotting order, which is why the label-then-legend pattern calls legend() only after every relevant plot() call.'

  - question: 'A report-generation function calls fig, ax = plt.subplots() inside a loop that runs 25 times, without ever calling plt.close(fig). What happens, measured on matplotlib 3.11.1?'
    options:
      - 'Nothing -- matplotlib automatically closes figures once their variable goes out of scope'
      - 'The process crashes immediately after the 20th figure'
      - 'plt.get_fignums() grows to 25 entries, and a RuntimeWarning naming "More than 20 figures" fires once the count passes 20 -- the figures stay open and consume memory until plt.close() is called on each'
      - 'Each new call to plt.subplots() silently reuses and overwrites the previous figure'
    answer_index: 2
    explanation: 'Every figure created through pyplot stays in a global registry until explicitly closed -- there is no automatic cleanup tied to a Python variable going out of scope. This lesson triggered the real warning: opening 22 figures without closing any produced exactly one RuntimeWarning containing "More than 20 figures," and plt.get_fignums() reported all 22 as open until plt.close("all") emptied the registry back to zero.'

  - question: 'The same chart is saved once as reading.png and once as reading.svg. Searching each file''s own bytes for the axis label text "depth (m)", what is found?'
    options:
      - 'The text is found inside the SVG file and not found anywhere inside the PNG file'
      - 'The text is found in both files, since both formats embed the original label as metadata'
      - 'The text is found in neither file -- labels are rendered into un-searchable glyph outlines in both formats'
      - 'The text is found only in the PNG, since SVG stores text as vector paths rather than characters'
    answer_index: 0
    explanation: 'SVG is XML markup -- a text label is written as a literal <text> element, searchable in any text editor. PNG is a fixed grid of pixel colour values -- the string that produced a label is nowhere in the file''s bytes, only the pixels its glyphs were rasterized into. This lesson confirmed both directions directly: "depth (m)" was found inside the saved SVG''s characters and absent from the saved PNG''s bytes, which is the concrete, testable version of "vector output is better for anything that will be zoomed, printed, or edited later."'
