<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four sources.">
  <title>Where data comes from</title>
  <style>
    .find-idea-bg   { fill: #f8fafc; }
    .find-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .find-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .find-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .find-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .find-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .find-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .find-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .find-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .find-idea-stage { opacity: 1; }

    .find-idea-s0 { animation-delay: 0.00s; }
    .find-idea-e0 { animation-delay: 0.00s; }
    .find-idea-s1 { animation-delay: 1.28s; }
    .find-idea-e1 { animation-delay: 1.28s; }
    .find-idea-s2 { animation-delay: 2.56s; }
    .find-idea-e2 { animation-delay: 2.56s; }
    .find-idea-s3 { animation-delay: 3.84s; }
    .find-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .find-idea-conn  { animation: find-idea-trace 6.4s ease-in-out infinite; }
      .find-idea-stage { animation: find-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes find-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes find-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .find-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .find-idea-stage { animation: find-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes find-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="find-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="find-idea-bg" width="980" height="322"/>
  <text class="find-idea-h1"  x="30" y="40">Where data comes from</text>
  <text class="find-idea-sub" x="30" y="64">Four sources.</text>
  <g class="find-idea-stage find-idea-s0">
    <rect class="find-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="find-idea-step" x="44" y="142">01</text>
    <text class="find-idea-name" x="70" y="142">Open datasets, published deliberately</text>
    <text class="find-idea-desc" x="44" y="166">With licences and documentation.</text>
  </g>
  <line class="find-idea-line find-idea-conn find-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#find-idea-tip)"/>
  <g class="find-idea-stage find-idea-s1">
    <rect class="find-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="find-idea-step" x="280" y="142">02</text>
    <text class="find-idea-name" x="306" y="142">Interfaces offering data programmatically</text>
    <text class="find-idea-desc" x="280" y="166">Structured, and rate limited.</text>
  </g>
  <line class="find-idea-line find-idea-conn find-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#find-idea-tip)"/>
  <g class="find-idea-stage find-idea-s2">
    <rect class="find-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="find-idea-step" x="516" y="142">03</text>
    <text class="find-idea-name" x="542" y="142">Scraped pages, where nothing else exists</text>
    <text class="find-idea-desc" x="516" y="166">Fragile, and legally</text>
    <text class="find-idea-desc" x="516" y="182">constrained.</text>
  </g>
  <line class="find-idea-line find-idea-conn find-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#find-idea-tip)"/>
  <g class="find-idea-stage find-idea-s3">
    <rect class="find-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="find-idea-step" x="752" y="142">04</text>
    <text class="find-idea-name" x="778" y="142">And internal data, which is usually the richest</text>
    <text class="find-idea-desc" x="752" y="166">And needs the most governance.</text>
  </g>
  <text class="find-idea-sub" x="30" y="304">Internal data being both richest and most constrained is the practical reality in most organisations, and the governance question usually decides what is feasible.</text>
</svg>
