<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things finding data is not</title>
  <style>
    .find-not-bg   { fill: #f8fafc; }
    .find-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .find-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .find-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .find-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .find-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .find-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .find-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .find-not-row { opacity: 1; }
    .find-not-r0 { animation-delay: 0.00s; }
    .find-not-r1 { animation-delay: 0.45s; }
    .find-not-r2 { animation-delay: 0.90s; }
    .find-not-r3 { animation-delay: 1.35s; }
    .find-not-r4 { animation-delay: 1.80s; }
    .find-not-row { animation: find-not-reveal 7.3s ease-in-out infinite; }
    @keyframes find-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="find-not-bg" width="980" height="390"/>
  <text class="find-not-h1"  x="30" y="40">Four things finding data is not</text>
  <text class="find-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="find-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="find-not-name" x="46" y="122">The misconception</text>
  <text class="find-not-desc" x="46" y="142">Commonly held.</text>
  <text class="find-not-desc find-not-row find-not-r0" x="46" y="182">Public means freely usable</text>
  <text class="find-not-desc find-not-row find-not-r1" x="46" y="216">More data is always better</text>
  <text class="find-not-desc find-not-row find-not-r2" x="46" y="250">Official data is unbiased</text>
  <text class="find-not-desc find-not-row find-not-r3" x="46" y="284">A dataset means what its columns say</text>
  <text class="find-not-desc find-not-row find-not-r4" x="46" y="318">Downloading it once is enough</text>
  <rect class="find-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="find-not-name" x="526" y="122">What is true</text>
  <text class="find-not-desc" x="526" y="142">Actually.</text>
  <text class="find-not-desc find-not-row find-not-r0" x="526" y="182">Licences vary; read them</text>
  <text class="find-not-desc find-not-row find-not-r1" x="526" y="216">Relevant data beats abundant data</text>
  <text class="find-not-desc find-not-row find-not-r2" x="526" y="250">Collection method shapes it</text>
  <text class="find-not-desc find-not-row find-not-r3" x="526" y="284">Read the documentation, then check</text>
  <text class="find-not-desc find-not-row find-not-r4" x="526" y="318">Sources change; record version and date</text>
  <text class="find-not-sub" x="30" y="372">Reading the documentation and then checking is the discipline that matters, because column definitions and the actual contents frequently disagree.</text>
</svg>
