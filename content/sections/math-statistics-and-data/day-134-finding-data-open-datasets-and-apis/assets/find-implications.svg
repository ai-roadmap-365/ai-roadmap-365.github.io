<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are legal.">
  <title>Four consequences of source choice</title>
  <style>
    .find-implications-bg   { fill: #f8fafc; }
    .find-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .find-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .find-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .find-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .find-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .find-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .find-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .find-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .find-implications-stage { opacity: 1; }

    .find-implications-s0 { animation-delay: 0.00s; }
    .find-implications-e0 { animation-delay: 0.00s; }
    .find-implications-s1 { animation-delay: 1.28s; }
    .find-implications-e1 { animation-delay: 1.28s; }
    .find-implications-s2 { animation-delay: 2.56s; }
    .find-implications-e2 { animation-delay: 2.56s; }
    .find-implications-s3 { animation-delay: 3.84s; }
    .find-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .find-implications-conn  { animation: find-implications-trace 6.4s ease-in-out infinite; }
      .find-implications-stage { animation: find-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes find-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes find-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .find-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .find-implications-stage { animation: find-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes find-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="find-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="find-implications-bg" width="980" height="322"/>
  <text class="find-implications-h1"  x="30" y="40">Four consequences of source choice</text>
  <text class="find-implications-sub" x="30" y="64">Two are legal.</text>
  <g class="find-implications-stage find-implications-s0">
    <rect class="find-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="find-implications-step" x="44" y="142">01</text>
    <text class="find-implications-name" x="70" y="142">The source sets a ceiling on analysis quality</text>
    <text class="find-implications-desc" x="44" y="166">No method recovers what was not</text>
    <text class="find-implications-desc" x="44" y="182">collected.</text>
  </g>
  <line class="find-implications-line find-implications-conn find-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#find-implications-tip)"/>
  <g class="find-implications-stage find-implications-s1">
    <rect class="find-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="find-implications-step" x="280" y="142">02</text>
    <text class="find-implications-name" x="306" y="142">And licence terms constrain what you may do</text>
    <text class="find-implications-desc" x="280" y="166">Including training and</text>
    <text class="find-implications-desc" x="280" y="182">redistribution.</text>
  </g>
  <line class="find-implications-line find-implications-conn find-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#find-implications-tip)"/>
  <g class="find-implications-stage find-implications-s2">
    <rect class="find-implications-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="find-implications-step" x="516" y="142">03</text>
    <text class="find-implications-name" x="542" y="142">While any bias in collection is inherited entirely</text>
    <text class="find-implications-desc" x="516" y="166">By every model built on it.</text>
  </g>
  <line class="find-implications-line find-implications-conn find-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#find-implications-tip)"/>
  <g class="find-implications-stage find-implications-s3">
    <rect class="find-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="find-implications-step" x="752" y="142">04</text>
    <text class="find-implications-name" x="778" y="142">And a source that disappears breaks your pipeline</text>
    <text class="find-implications-desc" x="752" y="166">So cache what you depend on.</text>
  </g>
  <text class="find-implications-sub" x="30" y="304">Caching what you depend on is straightforward insurance, and public datasets are withdrawn or restructured more often than people expect.</text>
</svg>
