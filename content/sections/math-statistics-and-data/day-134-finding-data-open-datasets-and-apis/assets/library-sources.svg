<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Provenance matters.">
  <title>Choosing a source to cite</title>
  <style>
    .library-sources-bg   { fill: #f8fafc; }
    .library-sources-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sources-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sources-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sources-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sources-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sources-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-sources-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-sources-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-sources-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-sources-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-sources-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-sources-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-sources-row { opacity: 1; }
    .library-sources-r0 { animation-delay: 0.00s; }
    .library-sources-r1 { animation-delay: 0.45s; }
    .library-sources-r2 { animation-delay: 0.90s; }
    .library-sources-r3 { animation-delay: 1.35s; }
    .library-sources-r4 { animation-delay: 1.80s; }
    .library-sources-row { animation: library-sources-reveal 7.3s ease-in-out infinite; }
    @keyframes library-sources-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-sources-bg" width="980" height="390"/>
  <text class="library-sources-h1"  x="30" y="40">Choosing a source to cite</text>
  <text class="library-sources-sub" x="30" y="64">Provenance matters.</text>
  <rect class="library-sources-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-sources-name" x="46" y="122">Documented</text>
  <text class="library-sources-desc" x="46" y="142">Citable.</text>
  <text class="library-sources-desc library-sources-row library-sources-r0" x="46" y="182">Author, date, method known</text>
  <text class="library-sources-desc library-sources-row library-sources-r1" x="46" y="216">Can be verified independently</text>
  <text class="library-sources-desc library-sources-row library-sources-r2" x="46" y="250">Limitations stated by the author</text>
  <text class="library-sources-desc library-sources-row library-sources-r3" x="46" y="284">Usable in serious work</text>
  <text class="library-sources-desc library-sources-row library-sources-r4" x="46" y="318">This is a well-sourced dataset</text>
  <rect class="library-sources-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-sources-name" x="526" y="122">Anonymous</text>
  <text class="library-sources-desc" x="526" y="142">Uncitable.</text>
  <text class="library-sources-desc library-sources-row library-sources-r0" x="526" y="182">Origin unknown</text>
  <text class="library-sources-desc library-sources-row library-sources-r1" x="526" y="216">Cannot be verified</text>
  <text class="library-sources-desc library-sources-row library-sources-r2" x="526" y="250">Limitations unknown</text>
  <text class="library-sources-desc library-sources-row library-sources-r3" x="526" y="284">Unusable when challenged</text>
  <text class="library-sources-desc library-sources-row library-sources-r4" x="526" y="318">This is a found file</text>
  <text class="library-sources-sub" x="30" y="372">Being unusable when challenged is the practical consequence, and it tends to arrive precisely when the analysis matters most.</text>
</svg>
