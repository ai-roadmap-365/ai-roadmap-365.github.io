<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" role="img" aria-labelledby="d134f-title d134f-desc" width="1220" height="720">
  <title id="d134f-title">A paginated fetch that meets a rate limit and backs off, then a re-run that short-circuits on a 304</title>
  <desc id="d134f-desc">Top row: a client walks three pages of a dataset, is told to stop by the source's own has-more flag, then requests one more resource and receives a 429 rate limit, waits with growing backoff, and succeeds on retry. Bottom row: a second run of the same fetch sends the stored ETag and receives a 304 Not Modified, so the cached copy is served immediately with no download and no wait.</desc>
  <style>
    .d134f-bg    { fill: #f8fafc; }
    .d134f-lead  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 24px; font-weight: 700; fill: #1d4ed8; }
    .d134f-note  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d134f-h     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1a202c; }
    .d134f-t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d134f-sm    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #1a202c; }
    .d134f-lane  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; fill: #1d4ed8; }
    .d134f-code  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .d134f-page  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .d134f-stop  { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
    .d134f-limit { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
    .d134f-ok    { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
    .d134f-cache { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
    .d134f-track { stroke: #cbd5e1; stroke-width: 3; fill: none; }

    .d134f-wire  { stroke: #1d4ed8; stroke-width: 2.5; fill: none;
                   stroke-dasharray: 9 7; animation: d134f-march 1.5s linear infinite; }
    @keyframes d134f-march { to { stroke-dashoffset: -16; } }

    .d134f-token { fill: #1d4ed8; animation: d134f-travel 7s ease-in-out infinite; }
    @keyframes d134f-travel {
      0%             { transform: translateX(0); }
      10%            { transform: translateX(140px); }
      20%            { transform: translateX(280px); }
      /* pause at the rate-limit wall */
      20%, 46%       { transform: translateX(280px); }
      /* backoff wait shown as the token nudging back and forth in place */
      52%            { transform: translateX(280px) translateY(-6px); }
      58%            { transform: translateX(280px) translateY(0); }
      /* resumes and succeeds */
      75%, 100%      { transform: translateX(560px); }
    }

    .d134f-pulse { animation: d134f-glow 7s ease-in-out infinite; }
    @keyframes d134f-glow {
      0%, 18%, 60%, 100% { fill: #fee2e2; }
      28%, 50%           { fill: #fecaca; }
    }

    .d134f-flash { animation: d134f-blink 7s ease-in-out infinite; opacity: 0; }
    @keyframes d134f-blink {
      0%, 20%, 60%, 100% { opacity: 0; }
      30%, 50%           { opacity: 1; }
    }

    .d134f-cachetoken { fill: #b45309; animation: d134f-shortcut 7s ease-in-out infinite; }
    @keyframes d134f-shortcut {
      0%, 8%   { transform: translateX(0); }
      35%, 100% { transform: translateX(500px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .d134f-wire        { animation: none; stroke-dasharray: none; }
      .d134f-token       { animation: none; transform: translateX(560px); }
      .d134f-pulse       { animation: none; fill: #fecaca; }
      .d134f-flash       { animation: none; opacity: 1; }
      .d134f-cachetoken  { animation: none; transform: translateX(500px); }
    }
  </style>

  <rect class="d134f-bg" x="0" y="0" width="1220" height="720" />
  <text class="d134f-lead" x="40" y="42">A polite client stops when told to, waits when rate-limited, and costs nothing on a re-run.</text>
  <text class="d134f-note" x="40" y="66">Top: the first fetch. Bottom: the same fetch tomorrow, with an ETag already on file.</text>

  <defs>
    <marker id="d134f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- ============ TOP LANE: first run ============ -->
  <text class="d134f-lane" x="40" y="120">First run</text>

  <line class="d134f-track" x1="40" y1="160" x2="1140" y2="160" />

  <g transform="translate(40,130)">
    <rect class="d134f-page" x="0" y="0" width="100" height="60" rx="6" />
    <text class="d134f-h" x="50" y="26" text-anchor="middle">page 1</text>
    <text class="d134f-sm" x="50" y="46" text-anchor="middle">has_more: yes</text>
  </g>
  <line class="d134f-wire" x1="150" y1="160" x2="180" y2="160" marker-end="url(#d134f-arrow)" />

  <g transform="translate(180,130)">
    <rect class="d134f-page" x="0" y="0" width="100" height="60" rx="6" />
    <text class="d134f-h" x="50" y="26" text-anchor="middle">page 2</text>
    <text class="d134f-sm" x="50" y="46" text-anchor="middle">has_more: yes</text>
  </g>
  <line class="d134f-wire" x1="290" y1="160" x2="320" y2="160" marker-end="url(#d134f-arrow)" />

  <g transform="translate(320,130)">
    <rect class="d134f-page" x="0" y="0" width="100" height="60" rx="6" />
    <text class="d134f-h" x="50" y="26" text-anchor="middle">page 3</text>
    <text class="d134f-sm" x="50" y="46" text-anchor="middle">has_more: no</text>
  </g>
  <line class="d134f-wire" x1="430" y1="160" x2="460" y2="160" marker-end="url(#d134f-arrow)" />

  <g transform="translate(460,130)">
    <rect class="d134f-stop" x="0" y="0" width="90" height="60" rx="6" />
    <text class="d134f-h" x="45" y="26" text-anchor="middle">stop</text>
    <text class="d134f-sm" x="45" y="46" text-anchor="middle">all 25 rows</text>
  </g>

  <line class="d134f-wire" x1="550" y1="160" x2="590" y2="160" marker-end="url(#d134f-arrow)" />

  <g transform="translate(590,120)" class="d134f-pulse">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5" />
    <text class="d134f-code" x="70" y="30" text-anchor="middle" fill="#b91c1c">429</text>
    <text class="d134f-sm" x="70" y="52" text-anchor="middle">rate limited</text>
    <text class="d134f-sm" x="70" y="68" text-anchor="middle">Retry-After: 0</text>
  </g>

  <g transform="translate(590,60)" class="d134f-flash">
    <text class="d134f-t" x="70" y="0" text-anchor="middle" fill="#b91c1c">waiting, growing backoff...</text>
  </g>

  <line class="d134f-wire" x1="730" y1="160" x2="770" y2="160" marker-end="url(#d134f-arrow)" />

  <g transform="translate(770,120)">
    <rect class="d134f-ok" x="0" y="0" width="140" height="80" rx="8" />
    <text class="d134f-code" x="70" y="30" text-anchor="middle" fill="#166534">200</text>
    <text class="d134f-sm" x="70" y="52" text-anchor="middle">3rd attempt</text>
    <text class="d134f-sm" x="70" y="68" text-anchor="middle">succeeds</text>
  </g>

  <circle class="d134f-token" cx="40" cy="160" r="9" />

  <!-- ============ BOTTOM LANE: tomorrow's re-run ============ -->
  <text class="d134f-lane" x="40" y="420">Tomorrow's re-run</text>

  <line class="d134f-track" x1="40" y1="460" x2="1140" y2="460" />

  <g transform="translate(40,430)">
    <rect class="d134f-page" x="0" y="0" width="150" height="60" rx="6" />
    <text class="d134f-h" x="75" y="26" text-anchor="middle">GET /resource</text>
    <text class="d134f-sm" x="75" y="46" text-anchor="middle">If-None-Match: etag</text>
  </g>

  <line class="d134f-wire" x1="200" y1="460" x2="500" y2="460" marker-end="url(#d134f-arrow)" />

  <g transform="translate(500,420)">
    <rect class="d134f-cache" x="0" y="0" width="140" height="80" rx="8" />
    <text class="d134f-code" x="70" y="30" text-anchor="middle" fill="#92400e">304</text>
    <text class="d134f-sm" x="70" y="52" text-anchor="middle">not modified</text>
    <text class="d134f-sm" x="70" y="68" text-anchor="middle">0 bytes sent back</text>
  </g>

  <line class="d134f-wire" x1="640" y1="460" x2="900" y2="460" stroke="#b45309" marker-end="url(#d134f-arrow)" />

  <g transform="translate(900,420)">
    <rect class="d134f-ok" x="0" y="0" width="150" height="80" rx="8" />
    <text class="d134f-h" x="75" y="30" text-anchor="middle">cached copy</text>
    <text class="d134f-sm" x="75" y="52" text-anchor="middle">served instantly</text>
    <text class="d134f-sm" x="75" y="68" text-anchor="middle">no download, no wait</text>
  </g>

  <circle class="d134f-cachetoken" cx="40" cy="460" r="9" fill="#b45309" />

  <text class="d134f-note" x="40" y="580">The first run pays the source's price once: three pages, one rejection, one retry.</text>
  <text class="d134f-note" x="40" y="602">The second run pays nothing, because the client asked "has this changed?" instead of asking for the data again.</text>
  <text class="d134f-note" x="40" y="624">That is the whole case for caching responses locally: it makes a re-run reproducible for free, and it makes you a polite caller.</text>
</svg>
