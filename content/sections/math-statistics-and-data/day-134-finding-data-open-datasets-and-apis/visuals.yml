visuals:
  - id: source-assessment-architecture
    file: assets/source-assessment-architecture.svg
    type: diagram
    title: >-
      A candidate dataset passing through six assessment gates -- provenance, data dictionary, granularity,
      coverage, licence, checksum -- each annotated with what failing it costs later, ending in a
      ready-for-analysis box for a dataset that clears all six
    alt: >-
      Diagram: a candidate dataset passing through six numbered gates in sequence — provenance, data
      dictionary, granularity, coverage, licence, checksum — each with a short caption naming what failing
      that gate costs later, ending in a ready-for-analysis box for a dataset that clears all six
    description: >-
      A static architecture diagram. A "candidate dataset" box on the left flows through six numbered
      gates drawn as blue-bordered boxes in sequence: 1 provenance (who published it, and when -- failing
      costs the ability to cite or re-fetch it), 2 data dictionary (does a codebook define each column --
      failing means two same-named columns get joined wrong), 3 granularity (what does one row actually
      count -- failing means aggregates that look precise are not comparable), 4 coverage (does every
      claimed region or group appear -- failing means a "national" result that quietly excludes some), 5
      licence (may you analyse it, may you republish it -- failing means a report you cannot legally
      publish), and 6 checksum (is what you downloaded what you think it is -- failing means "downloaded
      from X" is a claim, not a proof). A dataset that clears all six gates reaches a green
      "ready for analysis" box. Three closing notes state that failing a gate does not disqualify a source,
      that the two unemployment_rate columns from the lesson's opening story pass every gate except the
      dictionary, and that the dictionary gate is the one people skip because the other five are checked
      against the data while the dictionary is checked against prose.
  - id: pagination-flow
    file: assets/pagination-flow.svg
    type: flow-animated
    title: >-
      A paginated fetch walking three pages until told to stop, meeting a 429 rate limit, backing off and
      succeeding on retry, followed by a second run the next day that sends the stored ETag and
      short-circuits on a 304 with no download and no wait
    alt: >-
      Diagram: a paginated fetch walking three pages until told to stop, meeting a 429 rate limit, backing
      off and succeeding on retry, followed underneath by a second run the next day that sends the stored
      ETag and short-circuits on a 304 with no download and no wait
    description: >-
      An animated flow diagram, fully readable as a still image, in two horizontal lanes. Top lane, "first
      run": a token travels through page 1 (has_more: yes), page 2 (has_more: yes), and page 3 (has_more:
      no), reaches a "stop, all 25 rows" box, then a marching-dashed wire carries it into a red "429 rate
      limited, Retry-After: 0" box that pulses while a "waiting, growing backoff..." label fades in and
      out, then the token continues into a green "200, 3rd attempt succeeds" box. Bottom lane, "tomorrow's
      re-run": a second, amber token travels from a "GET /resource, If-None-Match: etag" box directly into
      an amber "304 not modified, 0 bytes sent back" box and then into a green "cached copy served
      instantly, no download, no wait" box, without pausing at any rate-limit box. Three closing notes state
      that the first run pays the source's price once (three pages, one rejection, one retry), that the
      second run pays nothing because the client asked "has this changed?" instead of asking for the data
      again, and that this is the entire case for caching responses locally: free reproducibility and a
      polite client. A prefers-reduced-motion media query sets every animation to none, turns the marching
      dashes into solid lines, and freezes both tokens at their final positions (the first at the 200
      success box, the second at the cached-copy box), while every page, box, label and note stays fully
      drawn and fully legible.
