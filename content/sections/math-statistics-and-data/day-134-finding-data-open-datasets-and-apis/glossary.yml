terms:
  - term: data dictionary
    definition: >-
      A document, separate from the data itself, that defines every column in prose: what it measures, its
      unit, and how edge cases are handled. Two columns can share a name, a dtype and an overlapping range
      while meaning entirely different things, and the dictionary is the only place that difference is
      visible -- reading it before joining on a shared column name is this lesson's central habit.
  - term: source assessment
    definition: >-
      A fast, structured check run against a candidate dataset before committing time to it, covering
      provenance, the presence of a data dictionary, granularity, coverage, licence, and whether a checksum
      can be produced. Failing a gate does not disqualify a source; it means the source needs a stated
      caveat rather than a silent, undocumented assumption.
  - term: provenance
    definition: >-
      Who published a dataset, when, and how to verify you are looking at the version they actually
      published. A source with no named publisher cannot be cited and cannot be safely re-fetched, because
      there is no way to confirm today's copy matches what was originally released.
  - term: granularity
    definition: >-
      What a single row of a dataset represents -- a country-year, a household-month, a single transaction.
      Two datasets that look comparable because they cover the same topic frequently differ in granularity,
      and an aggregate computed across mismatched granularities looks precise while measuring nothing real.
  - term: coverage
    definition: >-
      Whether a dataset actually contains everything it claims to. A source titled "national" that is
      missing one region entirely looks visually identical to one where that region legitimately has a zero
      value, unless the actual set of keys present is compared against the set the documentation promises.
  - term: pagination to exhaustion
    definition: >-
      Fetching every page of a paginated API response by following the source's own stopping signal (such
      as a has_more flag or the absence of a next link) rather than a page count computed in advance, which
      can silently drift out of sync with how much data the source actually holds.
  - term: rate limit backoff
    definition: >-
      A client's response to receiving a 429 status: wait, using a growing delay, and retry up to a bounded
      number of attempts before giving up loudly. A client that retries with no upper bound is, from the
      server's perspective, indistinguishable from the abusive traffic a rate limit exists to stop.
  - term: conditional request
    definition: >-
      An HTTP GET carrying an If-None-Match header with a previously stored ETag value, letting the server
      answer 304 Not Modified with an empty body when nothing has changed, instead of re-sending the full
      resource. This is what makes a daily re-run of the same fetch cost close to nothing.
  - term: ETag
    definition: >-
      An opaque identifier a server attaches to a specific version of a resource, sent back by a client on
      the next request as If-None-Match so the server can answer with a cheap 304 rather than the full
      payload if the resource has not changed since.
  - term: checksum pinning
    definition: >-
      Recording the SHA-256 hash of a downloaded file's bytes alongside its source URL and retrieval date,
      so anyone -- including yourself, months later -- can prove the file they have is the exact file the
      source served. "Downloaded from X" is a claim; "downloaded from X, SHA-256 abc123..." is checkable.
  - term: provenance record
    definition: >-
      A structured record of exactly three facts about a retrieved dataset -- the URL it came from, the
      timestamp it was retrieved, and its checksum -- built to be regenerated identically from the same
      fixture provided the timestamp is held fixed, since the real clock is the one part expected to vary.
  - term: redistribution licence gate
    definition: >-
      A check of what a stated data licence (CC0, CC-BY, ODbL, all rights reserved) actually permits for a
      specific intended use, returning a reason alongside an allowed/not-allowed verdict, because "you may
      analyse this" and "you may republish this" are different permissions a single boolean cannot express.
