questions:
  - question: >-
      Two datasets both have a column named unemployment_rate: same dtype, overlapping range. A check
      comparing dtype and value range passes on both. What is the actual defect in joining them?
    options:
      - The check should have compared the mean instead of the range
      - The join is fine; a dtype-and-range match is sufficient proof two columns are comparable
      - The two columns are defined differently, and nothing about their type or range reveals that
      - The defect is that neither dataset was cleaned before the check ran
    answer_index: 2
    explanation: >-
      One source's unemployment_rate counts only people actively seeking work; the other counts everyone
      not employed, regardless of search activity. Both are internally correct, both share a name, dtype
      and overlapping range, and only the two sources' data dictionaries -- read as prose, not compared as
      numbers -- reveal the mismatch. A dtype-and-range check is not wrong to run; it is simply not
      sufficient, and treating it as sufficient is exactly how the join goes wrong.
  - question: >-
      A dataset's documentation claims national coverage across four regions. What is the mechanical way to
      detect that one region is actually missing from the data?
    options:
      - Plot the data on a map and look for blank areas
      - Count the total number of rows and compare it to the row count of a similar dataset
      - Check whether the file size matches what the source's documentation states
      - 'Compare the expected keys against the keys actually present'
    answer_index: 3
    explanation: >-
      A region with zero rows and a region that was never collected can look visually identical on a map --
      both show nothing. Comparing the dictionary's stated expected_regions against the data's actual keys
      catches the gap directly, by name, regardless of how the missing region would otherwise render.
  - question: >-
      A client keeps retrying a 429 response indefinitely, with no upper bound on attempts. What is wrong
      with this, beyond the client eventually wasting its own time?
    options:
      - 'Unbounded retrying looks exactly like the abuse rate limits exist to stop'
      - Nothing is wrong with it as long as the delay between retries grows over time
      - 429 responses should never be retried at all, under any circumstances
      - The client should switch to a different HTTP method instead of retrying the same one
    answer_index: 0
    explanation: >-
      A bounded backoff that eventually gives up loudly, with a named attempt count, tells the caller
      something actionable happened. A client that never stops retrying behaves exactly like the traffic
      pattern rate limits are built to block, and it can degrade service for every other legitimate caller
      of a shared public resource.
  - question: >-
      A second request for a resource sends the ETag stored from the first response as If-None-Match, and
      receives a 304 Not Modified with an empty body. What did this actually accomplish?
    options:
      - It confirmed the resource had changed and triggered a fresh download
      - 'It confirmed nothing changed, so the cached copy was served'
      - It let the server know the client's cache should be cleared
      - It is functionally identical to a normal 200 response and saves nothing
    answer_index: 1
    explanation: >-
      A 304 response carries no body by design. Measured directly in this lesson's lab, the first fetch of
      a resource downloaded 92 bytes; the second, carrying the stored ETag, cost 0 bytes over the wire and
      the client served its cached copy. That is the entire mechanism that makes a daily re-run of an
      analysis cost the source close to nothing.
  - question: >-
      What does a SHA-256 checksum, recorded alongside a download's URL and retrieval date, let you prove
      that "I downloaded this from this URL" alone does not?
    options:
      - That the source's server has no bugs
      - That the data inside the file is statistically representative
      - 'That the file is provably the exact bytes the source served'
      - That the download completed faster than a specified time limit
    answer_index: 2
    explanation: >-
      "Downloaded from X" is an unverifiable claim. "Downloaded from X, SHA-256 4c0610aa..." is a claim
      anyone can check by recomputing the hash of their own copy -- if a single byte differs anywhere in the
      file, the digest is completely different, which is exactly what SHA-256's design guarantees.
  - question: >-
      A CC-BY-4.0 licence and an ODbL licence both permit redistributing a dataset. What is a real
      difference between the obligations they impose on someone who redistributes a derived database?
    options:
      - There is no meaningful difference; both licences are functionally identical
      - ODbL requires payment to the original publisher; CC-BY does not
      - CC-BY forbids commercial use; ODbL permits it
      - 'CC-BY requires attribution; ODbL requires share-alike'
    answer_index: 3
    explanation: >-
      CC-BY's condition is attribution -- name the source. ODbL's share-alike condition is stronger and
      specifically about derived databases: if you redistribute a database built by combining ODbL data with
      your own, that derived database inherits ODbL's terms too. Assuming "open" always means "no
      conditions" is exactly the mistake this distinction is meant to prevent.
  - question: >-
      A one-off analysis needs a stable dataset once. A live dashboard needs the same data kept current.
      Which retrieval approach fits each, and what commonly goes wrong when the fit is reversed?
    options:
      - 'A one-off fits a bulk file; a dashboard fits an API'
      - Both cases should always use an API; bulk files are obsolete
      - Both cases should always use a bulk file; APIs are only for real-time trading systems
      - The dashboard should use a bulk file refreshed manually once a week instead of an API
    answer_index: 0
    explanation: >-
      A bulk file with a checksum is simpler and gives a complete provenance story for a single analysis. An
      API is right when the data must stay current. Treating an API as a substitute for a bulk export --
      paging through it repeatedly to reconstruct the whole dataset -- is exactly the pattern that trips
      rate limits designed for occasional, targeted queries.
  - question: >-
      Hugging Face's datasets library guarantees a consistent load interface across many source formats. A
      national statistics office's published CSV guarantees methodological rigor and a documented codebook.
      What follows from these being genuinely different guarantees?
    options:
      - The two sources are interchangeable for any purpose, since both are technically "open data"
      - 'Choose on which guarantee the task actually needs'
      - Hugging Face datasets is strictly better because it is easier to load
      - National statistics offices should switch to publishing through Hugging Face exclusively
    answer_index: 1
    explanation: >-
      Neither source class is universally better; they optimise for different things. A dataset library
      optimised for "loads the same way every time" is the right first stop for ML-ready corpora and the
      wrong first stop when the question is "does this official figure mean what I think it means" --
      which is precisely the question a statistical agency's codebook is built to answer.
