title: 'Finding Data: Open Datasets and APIs'
section: math-statistics-and-data
subsection: data-analysis
week: 20
learning_promise: >-
  After this lesson you will be able to decide, in about five minutes, whether an unfamiliar data source
  deserves the rest of your afternoon. You will run a six-gate assessment covering provenance, data
  dictionary, granularity, coverage, licence and checksum, and you will be able to explain precisely why a
  dtype-and-range check can pass on two columns that measure genuinely different things -- and what
  dictionary-aware check catches the mismatch instead. You will build a client that follows pagination to
  exhaustion using the source's own stopping signal, handles a 429 with bounded backoff instead of retrying
  forever, and makes a conditional request with ETag so a re-run costs the source nothing. You will pin a
  download to its SHA-256 and build a provenance record carrying a URL, a retrieval timestamp and a
  checksum, stable when regenerated from the same fixture with the same pinned clock. You will be able to
  map where open data actually lives -- national portals, statistical agencies, World Bank and Our World in
  Data, Zenodo and Dryad, Kaggle and Hugging Face -- by what each source guarantees rather than by size or
  popularity, and you will be able to state plainly what a CC0, CC-BY, ODbL or all-rights-reserved licence
  each permits and forbids for your own future projects.
objectives:
  - 'Run a six-gate source assessment -- provenance, data dictionary, granularity, coverage, licence, checksum -- against an unfamiliar dataset in about five minutes'
  - 'Explain why a naive dtype-and-range check can pass on two same-named columns with genuinely different definitions, and build a dictionary-aware check that catches the mismatch instead'
  - 'Fetch a paginated collection by following the source''s own has-more signal rather than a page count computed in advance, and prove the assembled row count against the advertised total'
  - 'Handle a 429 with bounded exponential backoff, and give up loudly with a named attempt count rather than retrying a rate-limited source forever'
  - 'Make a conditional request with ETag and If-None-Match, and measure in bytes what a cache hit actually saves on a re-run'
  - 'Pin a downloaded file to its SHA-256 checksum and prove a single altered byte changes the digest'
  - 'Return a licence-gate reason rather than a bare boolean, and distinguish what a licence permits for analysis from what it permits for redistribution'
  - 'Detect a documented coverage gap by comparing a dataset''s actual keys against a data dictionary''s expected list, rather than by eyeballing a chart'
  - 'Build a provenance record -- URL, retrieval timestamp, checksum -- that is stable when regenerated from the same fixture with a pinned clock'
  - 'Choose between a bulk download and a live API for a given task, and explain why using an API as a bulk downloader gets a client rate-limited'
  - 'Map where open data actually lives by what each source class guarantees -- national portals, statistical agencies, World Bank/OWID, Zenodo/Dryad, Kaggle, Hugging Face -- rather than by name recognition'
prerequisites:
  - 'Days 22-28 -- REST fundamentals, JSON, authentication, rate limits and pagination as HTTP mechanics. This lesson assumes all of it and does not re-teach it'
  - 'Weeks 18-19 -- pandas and visualization, the skills this lesson''s judgement calls will feed once a source clears assessment'
  - 'Comfort with pytest and a working python3 on your PATH'
