questions:
  - question: >-
      Eight regions with growth figures, two of them 18.9 and 17.4, and the reader must find the
      fastest-growing. The same data is drawn once as a pie chart and once as a sorted horizontal
      bar chart. Neither truncates an axis or hides a category. Why is only one of them a usable
      instrument for that question?
    options:
      - 'The bar chart has more colours available for the eight regions'
      - 'The pie chart is dishonest, because circles distort proportions'
      - 'A pie asks for angle; a bar asks for position on a scale'
      - 'There is no real difference; the choice is a matter of taste and audience preference'
    answer_index: 2
    explanation: >-
      Both charts are perfectly honest -- every number is represented exactly. The difference is
      which perceptual task each one asks of the reader. Cleveland and McGill measured that
      difference experimentally in 1984, and position on a common scale came out first while angle
      came out fourth. A 1.5-point gap out of 18.9 is about five degrees of arc in a pie and a
      clearly visible length difference on a shared baseline. No colour scheme or annotation moves a
      pie chart up that ladder, because the ladder is about what the eye is being asked to do.
  - question: >-
      A bubble map scales each city's circle so that a city with twice the population gets twice the
      radius. Every circle is exactly the size the code asked for and no number is misstated. What
      does the picture do to the reader?
    options:
      - 'Nothing -- the circles are correct, so the chart is correct'
      - 'It only distorts if the circles overlap each other'
      - 'It understates every ratio, because large circles are harder to see'
      - 'Area goes as the square of radius, so ratios come out squared'
    answer_index: 3
    explanation: >-
      The reader never perceives radius; they perceive area. Doubling the radius quadruples the ink,
      so a 3x population difference is drawn 9x as large. This lesson's lab measures it twice: an
      analytic area ratio of 4.0 for a data ratio of 2.0, and rendered pixel counts of 5,156 against
      20,368 -- a measured ratio of 3.95. The fix is one square root: scale the radius by the square
      root of the value so that AREA is proportional, which drops the measured ratio to 1.99.
  - question: >-
      A five-level satisfaction scale, very dissatisfied through very satisfied, is coloured with
      the first five entries of matplotlib's tab10 palette. What has been destroyed, and what
      measurement demonstrates it?
    options:
      - 'The order — luminance correlates +1.00 for viridis, -0.20 for tab10'
      - 'The category labels, demonstrated by counting how many are readable at small size'
      - 'The colours are simply ugly together, which is a matter of taste and cannot be measured'
      - 'Nothing has been destroyed; tab10 is a well-designed palette'
    answer_index: 0
    explanation: >-
      tab10 is an excellent palette for the job it was designed for, which is making neighbouring
      categories look as different as possible -- and "as different as possible" has no direction.
      Measuring WCAG relative luminance for five tab10 entries gives 0.168, 0.365, 0.259, 0.159 and
      0.197, a rank correlation of -0.20 against the scale's own order, so "satisfied" comes out
      darker than "dissatisfied". Five steps of viridis give 0.019 through 0.783, a correlation of
      exactly +1.00, and survive a greyscale photocopy intact. The mistake is not the palette; it is
      putting an ordered variable on a categorical one.
  - question: >-
      matplotlib's default red and green sit about 120 apart in CIELAB for a reader with typical
      colour vision. Pushed through a published deuteranopia transform they land 7.31 apart, about
      6% of the original separation. What is the right response?
    options:
      - 'Nothing; 7.31 is still greater than zero, so the colours remain distinguishable'
      - 'Add a second channel so colour never carries it alone'
      - 'Increase the saturation of both colours until the simulated distance rises'
      - 'Add a note under the chart telling colourblind readers which bar is which'
    answer_index: 1
    explanation: >-
      Swapping to a colourblind-safe pair helps a great deal -- seaborn's colorblind blue and orange
      go from 115.70 to 116.51 through the identical transform, keeping essentially all of their
      separation -- but the durable fix is redundancy. A simulation approximates one severity of one
      deficiency; it does not reproduce anyone's experience and it cannot represent anomalous
      trichromacy at all. Once shape or position or a direct label also carries the distinction, how
      accurate the simulation was stops being load-bearing.
  - question: >-
      A reader must find the largest of twenty categories. In source order they hold a running best
      and check every remaining bar: 19 comparisons. Sorted descending, they read the top row and
      glance at the second to confirm the sort: 1 comparison. What does this demonstrate about
      sorting?
    options:
      - 'That sorting changes the answer, so an unsorted chart is misleading'
      - 'That sorting only matters for charts with more than twenty categories'
      - 'Sorting is an encoding decision whose cost the reader bears'
      - 'That sorting is a matter of neatness, with no measurable effect on the reader'
    answer_index: 2
    explanation: >-
      The largest category is the largest category whether or not the chart is sorted; sorting
      changes nothing about the data and everything about how much work the reader does to extract
      the answer. Because the cost falls on the reader rather than on the author, it is easy to
      skip without noticing -- which is exactly why it is worth treating as a deliberate encoding
      decision alongside the choice of channel.
  - question: >-
      A scatter of 10,000 one-pixel points, with none of them clipped, paints 6,349 distinct pixels
      and the resulting image contains exactly TWO distinct grey levels. What does the count of two
      tell you?
    options:
      - 'That the image is corrupt, since a scatter should contain many shades'
      - 'That the renderer used a two-colour palette to save space'
      - 'That only two of the ten thousand points were actually drawn'
      - 'The density is absent, not faint — one point or forty is one black'
    answer_index: 3
    explanation: >-
      Two levels is paper and ink. Opaque compositing has no way to record that a pixel was painted
      forty times rather than once, so 3,651 points -- 36.5% of the data -- landed where a point
      already was and changed nothing. Alpha blending at 0.05 lets a pixel accumulate, giving nine
      distinct levels for the same cloud, which says the busiest pixel carries about eight points.
      Hexbin gives 244 levels, because it aggregates before drawing rather than hoping the
      compositor will do the work.
  - question: >-
      A chart-choice function recommends a TABLE rather than a chart when there are five or fewer
      values to compare. What is the argument for that recommendation?
    options:
      - 'With three numbers there was no arithmetic to convert'
      - 'Charts are only appropriate for time-series data'
      - 'Tables render faster than charts and use less bandwidth'
      - 'Five is a hard limit established by the Cleveland and McGill experiments'
    answer_index: 0
    explanation: >-
      A chart earns its place when the reader cannot hold the comparison in their head, which is a
      real advantage and one that grows with the number of values. Below that point the reader can
      simply read three numbers exactly, which a bar length never lets them do. Five is a judgement,
      not a finding -- the lab writes it down as a named constant precisely so you can disagree with
      it deliberately rather than by habit. Note too where this leaves the pie chart's last defence:
      "just two or three slices" falls below the threshold, where a table answers exactly.
  - question: >-
      A model evaluation dashboard shows a bar of mean accuracy at 0.87 across all users, and
      everyone signs off. The per-user accuracy distribution turns out to be bimodal, with a large
      mode near 0.94 and a smaller one near 0.51. What went wrong, and what is the general lesson?
    options:
      - 'The mean was computed incorrectly; 0.87 is not the mean of that distribution'
      - 'It was the wrong instrument: a comparison chart for a distribution'
      - 'Nothing went wrong -- 0.87 is the correct headline number and the distribution is a detail'
      - 'The bar chart was dishonest, because it hid the second mode on purpose'
    answer_index: 1
    explanation: >-
      0.87 really is the mean, so nothing was misstated -- this is a chart-choice failure rather than
      a chart-honesty failure, which is exactly why it survives scrutiny. The question being asked
      was "does this model work for our users?", which is a question about a distribution, and only a
      distribution chart can answer it. The general habit worth taking from this lesson: when someone
      shows you an aggregate, ask to see the distribution behind it.
