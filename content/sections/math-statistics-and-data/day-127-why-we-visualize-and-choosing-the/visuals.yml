visuals:
  - id: encoding-ranking-architecture
    file: assets/encoding-ranking-architecture.svg
    type: diagram
    title: "The Cleveland-McGill accuracy ladder, with the same pair of values drawn in every channel"
    alt: 'Diagram: seven rungs from most to least accurately judged, each showing the same two values, 40 and 60, encoded in that channel: position on a common scale, position on non-aligned scales, length, angle, area, volume, and colour saturation. Reading down the ladder the same one-and-a-half-to-one ratio becomes progressively harder to recover from the picture.'
    description: >-
      A static architecture diagram of the perceptual ranking this lesson is built on. Seven
      horizontal rungs run down the page, alternating white and pale grey, each with a numbered
      badge on the left -- blue for rungs 1 to 3, grey for rungs 4 to 7 -- the channel's name and a
      one-line note of where it shows up in practice. The middle of each rung carries a small
      worked demonstration of the SAME two values, 40 in blue and 60 in amber, drawn in that
      channel: two dots on one shared axis with ticks at 0, 40 and 80; two dots on two separate
      short axes offset from each other; two horizontal bars starting from different left origins so
      they share no baseline; two pie wedges of 144 and 216 degrees; two circles whose areas are
      proportional to the values; two isometric cubes whose volumes are; and two rectangles of the
      same hue at different saturations. The right-hand column of each rung says what the reader can
      actually do with that channel, from "read the ratio off the axis" at the top to "never for is
      this one one-and-a-half times that one" at the bottom. A blue arrow runs down the left edge
      labelled "accuracy falls". A caption band beneath states that every rung carries the identical
      fact -- 60 is one and a half times 40 -- that only the top of the ladder lets a reader recover
      it, and that "bar beats pie" is rung 1 against rung 4, an experimental result about human
      vision rather than a matter of taste.
  - id: chart-choice-flow
    file: assets/chart-choice-flow.svg
    type: flow-animated
    title: "One question in, one instrument out, with every rejected branch still drawn"
    alt: 'Diagram: a question card reading which of these eight regions grew fastest feeds a node that reads the data types — region is nominal, growth is quantitative, and the number of values is eight. Five question-kind branches fan out — comparison, distribution, relationship, composition, change over time — and the comparison branch is the live one. It reaches a size gate that asks whether the number of values is five or fewer; eight is not, so the table outcome is passed over and the sorted horizontal bar is recommended. The other four branches stay drawn in grey with their own outcomes, and a pie chart box sits at the bottom marked as never recommended.'
    description: >-
      An animated flow diagram of the chart-choice decision, following the A30 standard. A blue
      question card on the left states the question and labels it a ranking question. It feeds a
      node that reads the data types -- region nominal, growth quantitative, n equals 8 -- which
      fans out into five question-kind boxes: comparison, distribution, relationship, composition
      and change over time. Only the comparison branch is drawn in blue; the other four are grey but
      fully legible, each leading to its own outcome on the right: histogram, scatter then hexbin
      past 2000 points, stacked bar, and line with small multiples past 8. The live branch reaches
      an amber size gate asking whether n is 5 or fewer; because 8 is not, the grey "table" outcome
      is passed over and the green "sorted horizontal bar" outcome is recommended, annotated
      "position on a common scale". A red box at the bottom holds "pie chart", struck through and
      labelled "no branch leads here". Three motions carry the sequence: the live wires are drawn
      with marching dashes, a blue token travels the decision path from the question card to the
      recommended chart on a seven-second loop, and the five stages light up in order with a
      staggered fill change. The caption band explains that the rejected branches are drawn rather
      than hidden because they are the argument -- each grey box is the right answer to a different
      question about the same data -- that the table branch is live too and would have been taken had
      there been three regions rather than eight, and that only the pie chart is unreachable, because
      judging angle is ranked fourth where the sorted bar's position is ranked first. A
      prefers-reduced-motion block disables every animation and restores each resting state, and the
      still frame carries the whole meaning on its own.
