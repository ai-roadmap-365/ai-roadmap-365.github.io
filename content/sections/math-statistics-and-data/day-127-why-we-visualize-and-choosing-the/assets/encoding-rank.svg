<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four levels.">
  <title>Which encodings are read accurately</title>
  <style>
    .encoding-rank-bg   { fill: #f8fafc; }
    .encoding-rank-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-rank-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-rank-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-rank-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-rank-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-rank-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoding-rank-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoding-rank-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoding-rank-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoding-rank-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoding-rank-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoding-rank-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .encoding-rank-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .encoding-rank-stage { opacity: 1; }

    .encoding-rank-s0 { animation-delay: 0.00s; }
    .encoding-rank-e0 { animation-delay: 0.00s; }
    .encoding-rank-s1 { animation-delay: 1.28s; }
    .encoding-rank-e1 { animation-delay: 1.28s; }
    .encoding-rank-s2 { animation-delay: 2.56s; }
    .encoding-rank-e2 { animation-delay: 2.56s; }
    .encoding-rank-s3 { animation-delay: 3.84s; }
    .encoding-rank-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .encoding-rank-conn  { animation: encoding-rank-trace 6.4s ease-in-out infinite; }
      .encoding-rank-stage { animation: encoding-rank-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes encoding-rank-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes encoding-rank-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .encoding-rank-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .encoding-rank-stage { animation: encoding-rank-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes encoding-rank-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="encoding-rank-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="encoding-rank-bg" width="980" height="322"/>
  <text class="encoding-rank-h1"  x="30" y="40">Which encodings are read accurately</text>
  <text class="encoding-rank-sub" x="30" y="64">Four levels.</text>
  <g class="encoding-rank-stage encoding-rank-s0">
    <rect class="encoding-rank-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-rank-step" x="44" y="142">01</text>
    <text class="encoding-rank-name" x="70" y="142">Position on a common scale: read most accurately</text>
    <text class="encoding-rank-desc" x="44" y="166">Which is why scatter and bar</text>
    <text class="encoding-rank-desc" x="44" y="182">charts work.</text>
  </g>
  <line class="encoding-rank-line encoding-rank-conn encoding-rank-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#encoding-rank-tip)"/>
  <g class="encoding-rank-stage encoding-rank-s1">
    <rect class="encoding-rank-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-rank-step" x="280" y="142">02</text>
    <text class="encoding-rank-name" x="306" y="142">Length: read well, if from a common baseline</text>
    <text class="encoding-rank-desc" x="280" y="166">Which is why bars must start at</text>
    <text class="encoding-rank-desc" x="280" y="182">zero.</text>
  </g>
  <line class="encoding-rank-line encoding-rank-conn encoding-rank-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#encoding-rank-tip)"/>
  <g class="encoding-rank-stage encoding-rank-s2">
    <rect class="encoding-rank-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-rank-step" x="516" y="142">03</text>
    <text class="encoding-rank-name" x="542" y="142">Angle and slope: read less accurately</text>
    <text class="encoding-rank-desc" x="516" y="166">Which is the problem with pie</text>
    <text class="encoding-rank-desc" x="516" y="182">charts.</text>
  </g>
  <line class="encoding-rank-line encoding-rank-conn encoding-rank-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#encoding-rank-tip)"/>
  <g class="encoding-rank-stage encoding-rank-s3">
    <rect class="encoding-rank-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-rank-step" x="752" y="142">04</text>
    <text class="encoding-rank-name" x="778" y="142">And area and colour: read poorly</text>
    <text class="encoding-rank-desc" x="752" y="166">Useful for grouping, not for</text>
    <text class="encoding-rank-desc" x="752" y="182">magnitude.</text>
  </g>
  <text class="encoding-rank-sub" x="30" y="304">This ranking comes from actual perceptual experiments rather than taste, which is what makes it a usable rule rather than a stylistic preference.</text>
</svg>
