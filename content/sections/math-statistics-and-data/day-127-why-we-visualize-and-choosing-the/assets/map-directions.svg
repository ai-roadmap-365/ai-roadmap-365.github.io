<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different questions.">
  <title>A map or a list of directions</title>
  <style>
    .map-directions-bg   { fill: #f8fafc; }
    .map-directions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-directions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-directions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-directions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-directions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-directions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-directions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .map-directions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .map-directions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .map-directions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .map-directions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .map-directions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-directions-row { opacity: 1; }
    .map-directions-r0 { animation-delay: 0.00s; }
    .map-directions-r1 { animation-delay: 0.45s; }
    .map-directions-r2 { animation-delay: 0.90s; }
    .map-directions-r3 { animation-delay: 1.35s; }
    .map-directions-r4 { animation-delay: 1.80s; }
    .map-directions-row { animation: map-directions-reveal 7.3s ease-in-out infinite; }
    @keyframes map-directions-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="map-directions-bg" width="980" height="390"/>
  <text class="map-directions-h1"  x="30" y="40">A map or a list of directions</text>
  <text class="map-directions-sub" x="30" y="64">Different questions.</text>
  <rect class="map-directions-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="map-directions-name" x="46" y="122">A map</text>
  <text class="map-directions-desc" x="46" y="142">Shows relationships.</text>
  <text class="map-directions-desc map-directions-row map-directions-r0" x="46" y="182">The whole area at once</text>
  <text class="map-directions-desc map-directions-row map-directions-r1" x="46" y="216">Relationships between places visible</text>
  <text class="map-directions-desc map-directions-row map-directions-r2" x="46" y="250">You can spot an alternative route</text>
  <text class="map-directions-desc map-directions-row map-directions-r3" x="46" y="284">Poor for precise distances</text>
  <text class="map-directions-desc map-directions-row map-directions-r4" x="46" y="318">This is a chart</text>
  <rect class="map-directions-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="map-directions-name" x="526" y="122">Directions</text>
  <text class="map-directions-desc" x="526" y="142">Gives precise steps.</text>
  <text class="map-directions-desc map-directions-row map-directions-r0" x="526" y="182">One instruction at a time</text>
  <text class="map-directions-desc map-directions-row map-directions-r1" x="526" y="216">No sense of the whole</text>
  <text class="map-directions-desc map-directions-row map-directions-r2" x="526" y="250">No alternatives visible</text>
  <text class="map-directions-desc map-directions-row map-directions-r3" x="526" y="284">Exact distances given</text>
  <text class="map-directions-desc map-directions-row map-directions-r4" x="526" y="318">This is a table</text>
  <text class="map-directions-sub" x="30" y="372">Both are correct for different questions, which is why the instinct to always chart is as wrong as the instinct to always tabulate.</text>
</svg>
