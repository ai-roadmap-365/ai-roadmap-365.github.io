<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four questions.">
  <title>Choosing a chart</title>
  <style>
    .chart-choice-bg   { fill: #f8fafc; }
    .chart-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chart-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chart-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chart-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chart-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chart-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chart-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chart-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chart-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chart-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chart-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chart-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chart-choice-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chart-choice-stage { opacity: 1; }

    .chart-choice-s0 { animation-delay: 0.00s; }
    .chart-choice-e0 { animation-delay: 0.00s; }
    .chart-choice-s1 { animation-delay: 1.28s; }
    .chart-choice-e1 { animation-delay: 1.28s; }
    .chart-choice-s2 { animation-delay: 2.56s; }
    .chart-choice-e2 { animation-delay: 2.56s; }
    .chart-choice-s3 { animation-delay: 3.84s; }
    .chart-choice-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chart-choice-conn  { animation: chart-choice-trace 6.4s ease-in-out infinite; }
      .chart-choice-stage { animation: chart-choice-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chart-choice-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chart-choice-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chart-choice-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chart-choice-stage { animation: chart-choice-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chart-choice-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chart-choice-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chart-choice-bg" width="980" height="322"/>
  <text class="chart-choice-h1"  x="30" y="40">Choosing a chart</text>
  <text class="chart-choice-sub" x="30" y="64">Four questions.</text>
  <g class="chart-choice-stage chart-choice-s0">
    <rect class="chart-choice-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chart-choice-step" x="44" y="142">01</text>
    <text class="chart-choice-name" x="70" y="142">What comparison should the reader make?</text>
    <text class="chart-choice-desc" x="44" y="166">Which is the actual design</text>
    <text class="chart-choice-desc" x="44" y="182">question.</text>
  </g>
  <line class="chart-choice-line chart-choice-conn chart-choice-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chart-choice-tip)"/>
  <g class="chart-choice-stage chart-choice-s1">
    <rect class="chart-choice-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chart-choice-step" x="280" y="142">02</text>
    <text class="chart-choice-name" x="306" y="142">What kinds of variable are involved?</text>
    <text class="chart-choice-desc" x="280" y="166">Categorical, continuous,</text>
    <text class="chart-choice-desc" x="280" y="182">temporal.</text>
  </g>
  <line class="chart-choice-line chart-choice-conn chart-choice-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chart-choice-tip)"/>
  <g class="chart-choice-stage chart-choice-s2">
    <rect class="chart-choice-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chart-choice-step" x="516" y="142">03</text>
    <text class="chart-choice-name" x="542" y="142">How many values must be shown?</text>
    <text class="chart-choice-desc" x="516" y="166">Which rules out several options.</text>
  </g>
  <line class="chart-choice-line chart-choice-conn chart-choice-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chart-choice-tip)"/>
  <g class="chart-choice-stage chart-choice-s3">
    <rect class="chart-choice-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chart-choice-step" x="752" y="142">04</text>
    <text class="chart-choice-name" x="778" y="142">And who is reading, in what context?</text>
    <text class="chart-choice-desc" x="752" y="166">A report and a dashboard differ.</text>
  </g>
  <text class="chart-choice-sub" x="30" y="304">Starting from the comparison rather than the data type is what separates a chart that makes a point from one that merely displays numbers.</text>
</svg>
