slug: why-we-visualize-and-choosing-the
title: 'Why We Visualize, and Choosing the Right Chart'
section: math-statistics-and-data
subsection: data-analysis
week: 19
learning_promise: >-
  After this lesson you will be able to treat a chart as an argument whose encoding is the claim,
  and choose that encoding from evidence rather than habit: name the visual channel a variable
  belongs on using the Cleveland and McGill accuracy ordering, and say why; prove that encoding a
  value by a circle's radius squares every ratio in the chart -- 4.0 where the data ratio is 2.0,
  confirmed analytically and again by counting 5,156 against 20,368 rendered pixels -- and fix it
  with one square root; recommend a chart from the question rather than from the data alone, using
  a decision function that recommends a table below five values and never recommends a pie chart
  for anything; measure how much of a colour pair's separation survives a published deuteranopia
  transform, finding that matplotlib's default red and green fall from a CIELAB distance of 119.77
  to 7.31 while a colourblind-safe pair keeps all of its separation; measure as a rank correlation
  the order a categorical palette destroys, +1.00 for a sequential palette against -0.20 for a
  categorical one; express sorting as a saving in reader effort, 19 comparisons down to 1 with the
  answer unchanged; compute a data-ink ratio from real pixels, 0.367 with chart furniture against
  0.934 without; and measure overplotting directly, 10,000 points painting only 6,349 distinct
  pixels in an image carrying exactly two grey levels, then recover the lost density with alpha
  blending and hexbin.
objectives:
  - 'Name the seven channels of the Cleveland and McGill accuracy ordering, from position on a common scale down to colour saturation, and use that ordering as a decision procedure rather than quoting it as a slogan'
  - 'Prove that encoding a value by a circle''s radius squares every ratio in the chart -- an analytic area ratio of 4.0 where the data ratio is 2.0 -- and remove the distortion entirely by scaling area instead'
  - 'Confirm the same square law by measurement, counting 5,156 painted pixels for a 40-pixel-radius circle against 20,368 for an 80-pixel one, and explain why the measured ratio of 3.95 is asserted with a tolerance while the raw counts are not asserted at all'
  - 'Classify a variable as nominal, ordinal, quantitative or temporal, and state which channels can carry it honestly -- including why a nominal variable on a length channel invents an order and an ordinal variable on a categorical palette destroys one'
  - 'Recommend a chart from the question, the number of values and the data types, across comparison, distribution, relationship, composition and change over time, naming for each the chart that fits and the one people wrongly reach for'
  - 'Explain why a written-down decision function recommends a table below five values, in terms of what a chart buys the reader and what it costs them in precision'
  - 'Measure how much of a colour pair''s separation survives a published deuteranopia transform, finding matplotlib''s default red and green collapse from a CIELAB distance of 119.77 to 7.31 while seaborn''s colourblind-safe blue and orange keep 116.51 of 115.70'
  - 'State precisely what a colour vision deficiency simulation does and does not license you to claim, and give the design move -- never let colour alone carry a distinction -- that makes the question stop being load-bearing'
  - 'Measure as a rank correlation the ordering a sequential palette preserves and a categorical palette destroys: +1.00 for five steps of viridis against -0.20 for five entries of tab10'
  - 'Express sorting as an encoding decision with a measurable cost to the reader -- 19 comparisons to find the largest of 20 in source order against 1 when sorted -- while the answer itself is unchanged'
  - 'Compute a data-ink ratio from a rendered image rather than asserting it, obtaining 0.367 for a chart with a tinted panel, gridlines and a heavy box against 0.934 for the identical eight numbers without them, and read the result without dogma'
  - 'Measure overplotting directly -- 10,000 unclipped points painting 6,349 distinct pixels in an image containing exactly two grey levels -- and demonstrate that alpha blending and hexbin recover the density that opaque compositing discarded'
  - 'Connect all of it to model evaluation: explain how a mean-accuracy bar chart conceals a bimodal split between the users a model serves and the ones it fails, and name the chart that would have shown it'
prerequisites:
  - 'Day 116 -- descriptive statistics that do not lie, including Anscombe''s quartet. This lesson does not re-tell it and assumes the argument for plotting at all is already won'
  - 'Day 104 -- NumPy arrays and vectorised thinking; every pixel count in this lesson''s lab is a NumPy comparison over an image array'
  - 'Day 107 -- norms and distance measures, the direct ancestor of this lesson''s CIELAB colour distance'
  - 'Days 120-126 -- pandas, for the analysis habits that carry into this day: measure rather than assume, and never assert what you did not run'
  - 'Comfort reading a small pure Python function; the two decision functions in this lesson''s lab are plain Python with explicit validation and no framework'
  - 'A working python3 on your PATH; the lab creates its own virtual environment with matplotlib 3.11.1 and seaborn 0.13.2 pinned exactly'
