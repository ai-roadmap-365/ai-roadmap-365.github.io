terms:
  - term: encoding channel
    definition: >-
      A visual property a chart uses to carry a number: position, length, angle, area, volume,
      colour saturation, hue, shape. Choosing which variable rides which channel is the whole craft
      of chart design; everything else is decoration.
  - term: graphical perception
    definition: >-
      The study of how accurately people extract quantities from visual encodings, made experimental
      by Cleveland and McGill in 1984. It is what turns "bar beats pie" from a preference into a
      measured result.
  - term: Cleveland-McGill ordering
    definition: >-
      The ranking of encoding channels by measured judgement accuracy: position on a common scale,
      then position on identical non-aligned scales, then length, then angle and slope, then area,
      then volume, then colour saturation. Used in this lesson as a decision procedure -- take the
      highest-ranked channel the task has not already spent and the data type can honestly carry.
  - term: position on a common scale
    definition: >-
      The top-ranked channel: two or more marks placed against one shared axis with one shared zero,
      so their values can be compared directly. A sorted bar chart and a dot plot both use it, which
      is why they win so often.
  - term: position on non-aligned scales
    definition: >-
      The second-ranked channel: the same kind of reading, but split across separate panels each
      with its own axis, so the reader must carry a value from one panel to the next. The cost of
      small multiples, and usually worth paying.
  - term: square law of area encoding
    definition: >-
      The fact that a circle's area goes as the square of its radius, so encoding a value by radius
      squares every ratio in the chart -- a doubled value is drawn four times as large. Measured here
      as an analytic area ratio of 4.0 for a data ratio of 2.0, and as 20,368 rendered pixels
      against 5,156. Fixed by scaling the radius by the square root of the value so that area is
      proportional.
  - term: nominal, ordinal, quantitative, temporal
    definition: >-
      The four data types that constrain encoding. Nominal is names with no order; ordinal has order
      but no meaningful arithmetic; quantitative has both; temporal is quantitative with a structure
      readers already know. Nominal data on a magnitude channel invents an order that is not there;
      ordinal data on a categorical colour palette destroys an order that is.
  - term: sequential palette
    definition: >-
      A colour ramp that increases monotonically in luminance, such as viridis, for quantitative or
      ordinal data where more is more. Its order survives greyscale printing: five steps of viridis
      measure 0.019, 0.089, 0.223, 0.451 and 0.783 in relative luminance, a rank correlation with
      position of exactly +1.00.
  - term: diverging palette
    definition: >-
      A colour ramp running from one dark end through a light middle to another dark end, such as
      RdBu, for data with a meaningful midpoint -- profit against loss, anomaly against a baseline,
      error against none. Using one where no midpoint exists invents a distinction the data does not
      have.
  - term: categorical palette
    definition: >-
      A set of maximally distinguishable hues, such as tab10 or seaborn's colorblind, for nominal
      data only. Five tab10 entries measure a rank correlation of -0.20 between position and
      luminance: the palette carries no order, by design, because "as different as possible" has no
      direction.
  - term: CIELAB and delta-E
    definition: >-
      A colour space built so that Euclidean distance roughly tracks perceived difference, and the
      distance measured in it. The CIE76 formula is plain Euclidean distance in CIELAB. As a rough
      guide from the literature, about 2.3 is the just-noticeable difference between adjacent
      patches.
  - term: deuteranopia
    definition: >-
      The absence of a working medium-wavelength cone, the most common form of red-green colour
      vision deficiency. Simulated here with the Machado, Oliveira and Fernandes (2009) severity-1.0
      matrix applied in linear RGB. A simulation approximates a deficiency; it does not reproduce
      anyone's experience, assumes a single severity, and cannot represent anomalous trichromacy.
  - term: relative luminance
    definition: >-
      The WCAG measure of a colour's perceived lightness, computed from linearised sRGB as
      0.2126 R + 0.7152 G + 0.0722 B. It is the part of a colour that survives a greyscale
      photocopy, which is why a palette carrying order in luminance carries order robustly.
  - term: data-ink ratio
    definition: >-
      Tufte's measure: of all the ink on the page, the fraction that is the data itself. Computed
      here from real pixels as 0.367 for a chart with a tinted panel, gridlines and a heavy box,
      against 0.934 for the identical eight numbers without them. Not a rule that gridlines are
      forbidden, but a reminder that every non-data mark should justify itself.
  - term: chartjunk
    definition: >-
      Tufte's term for decoration that adds no information -- three-dimensional effects on
      two-dimensional data, textured fills, ornamental frames. The measurable version of the
      complaint is a low data-ink ratio.
  - term: overplotting
    definition: >-
      Marks landing on top of each other so that the picture stops representing how many there are.
      Measured here as 10,000 unclipped points painting only 6,349 distinct pixels, in an image
      containing exactly two grey levels -- the density is not faint, it is absent.
  - term: small multiples
    definition: >-
      A grid of small charts sharing a scale, one per group, instead of many series crowded into one
      panel. Trades rung one of the accuracy ordering for rung two in exchange for making a tangle
      readable.
  - term: pre-attentive attribute
    definition: >-
      A visual property processed before conscious attention -- colour, size, orientation, motion,
      enclosure. One red dot among two hundred grey ones is found in roughly constant time; one
      labelled dot is found by reading. This is why highlighting one thing is powerful and
      highlighting five things is worthless.
  - term: grammar of graphics
    definition: >-
      Leland Wilkinson's 1999 idea that charts should be composed from data, a mapping of variables
      to channels, a geometry, scales and a coordinate system, rather than chosen from a menu of
      named types. The ancestor of ggplot2 and Vega-Lite, and the reason "which channel?" is a more
      answerable question than "which chart?".
  - term: Agg backend
    definition: >-
      matplotlib's pure software rasteriser, selected with matplotlib.use("Agg") before importing
      pyplot. It draws into memory and needs no display, window server or GPU, which is what makes
      plotting safe inside a test suite, a container or a continuous integration job.
