terms:
  - term: 'Sample space'
    definition: 'The set of every possible outcome of an experiment, usually written Ω. For two dice, Ω is the set of all 36 ordered pairs (d1, d2) with each die from 1 to 6. In this lesson, sample spaces are built by exact enumeration with itertools.product rather than written out by hand.'
  - term: 'Event'
    definition: 'A subset of the sample space — the set of outcomes for which something you care about is true. "The dice sum to 7" is the event {(1,6), (2,5), (3,4), (4,3), (5,2), (6,1)}, six of the 36 outcomes. An event is nothing more than a filtered set, built with a predicate over the sample space.'
  - term: 'Probability'
    definition: 'A number between 0 and 1 assigned to an event, satisfying three axioms: non-negativity, the whole sample space has probability 1, and disjoint events'' probabilities add. For a finite space of equally likely outcomes, it reduces to |event| / |space|, computed in this lesson with fractions.Fraction for exactness.'
  - term: 'Addition rule'
    definition: 'P(A or B) = P(A) + P(B) - P(A and B). Subtracting the intersection once corrects for the fact that any outcome belonging to both A and B was counted in both P(A) and P(B). Naively adding P(A) + P(B) without the correction overstates the truth by exactly P(A and B) whenever the two events overlap.'
  - term: 'Complement rule'
    definition: 'P(not A) = 1 - P(A). Applied to "at least one success in n trials," it collapses a hard-to-count question into an easy one: 1 minus the probability that every single trial fails. This is the one-line resolution of the Chevalier de Méré''s 1654 paradox about two seemingly equal dice bets.'
  - term: "Chevalier de Méré's paradox"
    definition: 'A 1650s gambling puzzle: betting on at least one 6 in 4 rolls of one die (P ≈ 0.5177, favourable) was believed equal to betting on at least one double-six in 24 rolls of two dice (P ≈ 0.4914, unfavourable), reasoning that a 6x smaller per-roll probability should be exactly offset by 6x more rolls. It is not offset, and the correspondence between Pascal and Fermat that resolved it is usually credited as founding the mathematical theory of probability.'
  - term: 'Independence'
    definition: 'Two events A and B are independent when P(A and B) = P(A) x P(B) — equivalently, when knowing one occurred tells you nothing about the other, P(A | B) = P(A). "Sum is 7" and "first die is 3" are independent on two dice; "sum is 2" and "first die is 1" are not.'
  - term: 'Mutual exclusivity'
    definition: 'Two events A and B are mutually exclusive when they cannot both occur: P(A and B) = 0. Mutually exclusive events with non-zero individual probabilities are necessarily DEPENDENT, not unrelated — knowing one occurred tells you the other definitely did not, collapsing its conditional probability to exactly 0.'
  - term: 'Conditional probability'
    definition: 'P(A | B) = P(A and B) / P(B), read "the probability of A given B." Operationally, this is restricting the sample space to the rows where B is true and asking the original question again inside that smaller space — computing it by formula and by literally filtering the space must give the same exact answer.'
  - term: 'Multiplication rule'
    definition: 'P(A and B) = P(A) x P(B | A), the rearranged form of the conditional-probability definition. When A and B are independent, P(B | A) = P(B), and the rule collapses to P(A and B) = P(A) x P(B), which is exactly what makes de Méré''s (5/6)^4 valid: four independent rolls, each missing with the same unconditioned probability.'
  - term: 'Chain rule for probability'
    definition: 'The multiplication rule extended to any number of events: P(A and B and C) = P(A) x P(B|A) x P(C|A,B), each factor conditioned on everything decided before it. It shares its name with, and nothing else in common with, Day 110''s chain rule for derivatives — the resemblance is that both build a quantity by multiplying local pieces each evaluated in the correct context, and the resemblance stops there.'
  - term: 'Law of total probability'
    definition: 'P(A) = sum over i of P(piece_i) x P(A | piece_i), for any partition of the sample space into non-overlapping pieces. Used across two urns of different composition in this lesson, checked against a direct enumeration of the combined experiment. Day 115''s Bayes'' theorem runs this exact computation backwards, with this rule supplying its denominator.'
  - term: 'Monte Carlo simulation'
    definition: 'Estimating a probability by running a large number of random trials and counting how often an event occurs, rather than computing it exactly. Converges to the true probability as the trial count grows, but its error shrinks only as 1/sqrt(n) — a hundred times the trials buys ten times less error, not a hundred times less.'
  - term: 'Standard error of a proportion'
    definition: 'sqrt(p(1-p)/n), the typical size of the gap between a Monte Carlo estimate and the true probability it estimates, for n independent trials. This lesson derives simulation tolerances from this formula rather than choosing a number that happens to make a test pass — three standard errors is the band inside which about 99.7% of honest simulation runs should land.'
  - term: "Gambler's fallacy"
    definition: 'The mistaken belief that an independent random process is "due" for a particular outcome after a streak — for example, believing tails is more likely after five heads in a row on a fair coin. The coin has no memory; the probability of tails on the next flip remains exactly 0.5 regardless of the preceding streak, because independence means the past streak carries zero information about the next flip.'
  - term: 'Base-rate neglect'
    definition: 'The tendency to ignore how rare an event was to begin with — its base rate — when a specific, vivid piece of evidence (such as a positive diagnostic test) is available. A 99%-accurate test for a rare disease can still mean a positive result is more likely a false positive than a true one, once the disease''s low prevalence is properly weighed by the law of total probability, contrary to most people''s intuitive estimate.'
  - term: 'Conjunction fallacy'
    definition: 'The mistaken judgement that a more specific, detailed conjunction of events is more probable than either event alone, when in fact P(A and B) can never exceed P(A) or P(B) — a subset can never be larger than the set that contains it. Adding vivid, plausible-sounding detail to a description can make it feel more probable even though it can only ever be equally or less probable.'
  - term: 'fractions.Fraction'
    definition: "Python's standard-library exact-rational-number type, used throughout this lesson so that probability comparisons are exact rather than approximate. Fraction(1, 6) == 6/36 evaluates True exactly; the equivalent float comparison 1/6 == 6/36 can fail to be exact due to floating-point rounding, which is precisely the noise Fraction exists to eliminate."
  - term: 'numpy.random.Generator'
    definition: "NumPy's modern random-number API, constructed with numpy.random.default_rng(seed). It returns an independent, stateful object rather than mutating shared global state, so two Generators built from the same seed reproduce byte-identical results regardless of what else the program does — unlike the legacy numpy.random.seed() function, which mutates one process-wide generator that every unrelated call to numpy.random.* also draws from."
