visuals:
  - id: event-algebra-architecture
    file: assets/event-algebra-architecture.svg
    type: diagram
    title: "Event algebra: the addition rule's double-counted region, and a mutually exclusive pair for contrast"
    alt: 'Diagram: two panels over the 36-outcome sample space of two dice. The left panel shows overlapping events A, sum is 7, and B, first die is 6, with their one-outcome intersection (6,1) labelled as the double-counted region, and the naive sum 1/3 shown wrong against the true union 11/36. The right panel shows mutually exclusive events C, sum is 2, and D, sum is 12, with an empty intersection, and the conditional probability P(C given D) equal to 0 while P(C) is 1/36, proving the two events are dependent despite never co-occurring'
    description: 'A static architecture diagram, on a light background, split into two side-by-side panels over the same 36-outcome sample space of two dice, plus a footer stating the general addition rule. The left panel, headed "A AND B OVERLAP — THE ADDITION RULE", draws the sample space as a light rectangle labelled with its 36-outcome count, containing two overlapping circles: an amber circle A labelled "sum is 7" with 6 outcomes, and a blue circle B labelled "first die is 6" with 6 outcomes. Their overlap is labelled with the single shared outcome (6,1) and captioned "A ∩ B — 1 outcome, double-counted region." Beneath the circles, an amber-tinted box shows the naive sum P(A) + P(B) = 12/36 = 1/3 marked WRONG, against the true union P(A) + P(B) − P(A∩B) = 11/36 marked correct, with a note that the error equals exactly P(A∩B) = 1/36. The right panel, headed "C AND D CANNOT BOTH HAPPEN — MUTUAL EXCLUSIVITY", draws the same sample space containing two non-overlapping circles: an amber circle C labelled "sum is 2, only (1,1)" and a blue circle D labelled "sum is 12, only (6,6)", with the empty space between them labelled "C ∩ D = ∅". Beneath, a blue-tinted box works through P(C | D) = P(C∩D)/P(D) = 0/(1/36) = 0, contrasted against P(C) = 1/36 ≠ 0, concluding in bold that C and D are DEPENDENT, with a note that mutual exclusivity with non-zero probability always implies dependence. A footer band across the full width states the general addition rule, P(A or B) = P(A) + P(B) − P(A and B), in large bold monospace, and beneath a dividing line explains in two columns that the left panel''s overlapping events require subtracting the intersection once to undo a double count, while the right panel''s non-overlapping events make the rule collapse to a plain sum — but remain dependent regardless.'
  - id: conditioning-flow
    file: assets/conditioning-flow.svg
    type: flow-animated
    title: 'Conditioning as restriction: the full sample space shrinks to B, then A within B is highlighted'
    alt: 'Diagram: an animated three-stage flow over the 36-outcome sample space of two dice, shown as a 6 by 6 grid of dots. Stage one shows the full space of 36 dots. Stage two restricts to B, first die is even, keeping 18 dots highlighted and discarding the rest. Stage three highlights the 3 dots within that restricted set where the sum is 8, ending at P(A given B) equal to 3 over 18 equal to 1 over 6, matching the formula method exactly'
    description: 'An animated flow diagram, fully readable as a still image. The heading reads "Conditioning is restriction: throw away rows, then ask again inside what''s left" and states that each dot is one of the 36 equally likely outcomes of two dice. The picture is arranged in three side-by-side panels connected by two rightward arrows, followed by a footer. Panel one, headed "1. FULL SAMPLE SPACE", holds a 6 by 6 grid of 36 uniform grey dots representing every outcome, captioned "|Ω| = 36". Panel two, headed "2. RESTRICT TO B", holds the same 6 by 6 grid with only the three columns corresponding to an even first die (2, 4, 6) coloured blue — 18 dots — and the remaining 18 dots left grey, captioned "|B| = 18, the other 18 rows discarded". Panel three, headed "3. A WITHIN B", holds the same restricted grid of 18 blue dots, with exactly three of them recoloured amber and enlarged slightly — the outcomes (2,6), (4,4) and (6,2), which all sum to 8 — captioned in bold "P(A | B) = 3/18 = 1/6". Each panel''s border briefly thickens and turns blue in sequence, panel one then panel two then panel three, over a repeating cycle, and a small blue token travels along each connecting arrow in turn, timed to arrive as the next panel highlights, so the eye follows the restriction happening left to right. A footer band across the full width, headed "BY FORMULA — AND BY RESTRICTION — THE SAME ANSWER", writes both routes to the identical number: the formula P(A | B) = P(A and B) / P(B) = (3/36) / (18/36) = 3/18 = 1/6, and the restriction method, filtering to B''s 18 rows and counting the 3 that satisfy A, arriving at the same 3/18 = 1/6, closing with the line "Conditioning does not need the formula to be correct — it needs the table to be smaller." A prefers-reduced-motion block stops every animation and restores the resting state, in which all three panel borders sit at their normal thin grey stroke, both connecting arrows are solid rather than dashed, both travelling tokens are invisible, and all three grids, every caption, every count and both closing formulas remain fully present.'
