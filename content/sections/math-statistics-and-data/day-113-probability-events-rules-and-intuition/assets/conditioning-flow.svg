<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="d113f-title d113f-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d113f-title">Conditioning as restriction: the full sample space shrinks to B, then A within B is highlighted</title>
  <desc id="d113f-desc">An animated three-stage flow: 36 outcomes of two dice, restricted to the 18 outcomes where the first die is even, then further restricted to the 3 outcomes within that set where the sum is 8, ending at P(A given B) = 1/6.</desc>

  <style>
    .d113f-bg { fill: #f8fafc; }
    .d113f-heading { font-size: 17px; font-weight: 700; fill: #1a202c; }
    .d113f-subheading { font-size: 14px; font-weight: 700; fill: #1a202c; }
    .d113f-label { font-size: 13px; fill: #1a202c; }
    .d113f-small { font-size: 12px; fill: #475569; }
    .d113f-mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d113f-mono-bold { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1a202c; }

    .d113f-panel {
      fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.5; rx: 8;
      animation: d113f-lift 7.5s ease-in-out infinite;
    }
    .d113f-p1 { animation-delay: 0s; }
    .d113f-p2 { animation-delay: 2.5s; }
    .d113f-p3 { animation-delay: 5s; }
    @keyframes d113f-lift {
      0%, 20%, 100% { stroke: #cbd5e1; stroke-width: 2.5; }
      6%, 13%       { stroke: #1d4ed8; stroke-width: 4; }
    }

    .d113f-dot-out    { fill: #cbd5e1; }
    .d113f-dot-b      { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 1.2; }
    .d113f-dot-ab     { fill: #f59e0b; stroke: #b45309; stroke-width: 1.4; }

    .d113f-arrow {
      stroke: #1d4ed8; stroke-width: 2.5; fill: none;
      stroke-dasharray: 8 6; animation: d113f-march 1.6s linear infinite;
    }
    @keyframes d113f-march { to { stroke-dashoffset: -14; } }

    .d113f-token {
      fill: #1d4ed8;
      offset-rotate: 0deg;
      animation: d113f-travel 7.5s ease-in-out infinite;
    }
    .d113f-t1 {
      offset-path: path('M 190 500 L 500 500');
      animation-delay: 0s;
    }
    .d113f-t2 {
      offset-path: path('M 500 500 L 810 500');
      animation-delay: 2.5s;
    }
    @keyframes d113f-travel {
      0%, 33.3%, 100% { offset-distance: 0%; opacity: 0; }
      2%   { opacity: 1; }
      31%  { offset-distance: 100%; opacity: 1; }
      33.29% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d113f-panel { animation: none; stroke: #cbd5e1; stroke-width: 2.5; }
      .d113f-arrow { animation: none; stroke-dasharray: none; }
      .d113f-token { animation: none; opacity: 0; }
    }
  </style>

  <rect class="d113f-bg" x="0" y="0" width="1000" height="560" />

  <text x="500" y="34" text-anchor="middle" class="d113f-heading">Conditioning is restriction: throw away rows, then ask again inside what's left</text>
  <text x="500" y="55" text-anchor="middle" class="d113f-small">Each dot is one of the 36 equally likely outcomes of two dice. Nothing here is approximate — every count is exact.</text>

  <!-- Stage 1: full space -->
  <g>
    <rect class="d113f-panel d113f-p1" x="30" y="80" width="260" height="330" rx="8" />
    <text x="160" y="106" text-anchor="middle" class="d113f-subheading">1. FULL SAMPLE SPACE</text>
    <text x="160" y="124" text-anchor="middle" class="d113f-small">Ω — all 36 outcomes</text>
    <!-- 6x6 grid of dots, all grey -->
    <g id="d113f-grid1">
    </g>
    <text x="160" y="392" text-anchor="middle" class="d113f-mono">|Ω| = 36</text>
  </g>

  <!-- Stage 2: restrict to B -->
  <g>
    <rect class="d113f-panel d113f-p2" x="370" y="80" width="260" height="330" rx="8" />
    <text x="500" y="106" text-anchor="middle" class="d113f-subheading">2. RESTRICT TO B</text>
    <text x="500" y="124" text-anchor="middle" class="d113f-small">B = "first die is even" — 18 rows kept</text>
    <g id="d113f-grid2">
    </g>
    <text x="500" y="392" text-anchor="middle" class="d113f-mono">|B| = 18, the other 18 rows discarded</text>
  </g>

  <!-- Stage 3: A within B -->
  <g>
    <rect class="d113f-panel d113f-p3" x="710" y="80" width="260" height="330" rx="8" />
    <text x="840" y="106" text-anchor="middle" class="d113f-subheading">3. A WITHIN B</text>
    <text x="840" y="124" text-anchor="middle" class="d113f-small">A = "sum is 8" — 3 of the 18 remain highlighted</text>
    <g id="d113f-grid3">
    </g>
    <text x="840" y="392" text-anchor="middle" class="d113f-mono-bold">P(A | B) = 3/18 = 1/6</text>
  </g>

  <!-- connecting arrows -->
  <path class="d113f-arrow" d="M 290 300 L 370 300" marker-end="url(#d113f-arrowhead)" />
  <path class="d113f-arrow" d="M 630 300 L 710 300" marker-end="url(#d113f-arrowhead)" />
  <circle class="d113f-token d113f-t1" r="6" />
  <circle class="d113f-token d113f-t2" r="6" />

  <defs>
    <marker id="d113f-arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Footer: both routes to the same number -->
  <rect x="30" y="430" width="940" height="110" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="500" y="456" text-anchor="middle" class="d113f-heading">BY FORMULA — AND BY RESTRICTION — THE SAME ANSWER</text>
  <text x="500" y="480" text-anchor="middle" class="d113f-mono">P(A | B) = P(A and B) / P(B) = (3/36) / (18/36) = 3/18 = 1/6</text>
  <text x="500" y="500" text-anchor="middle" class="d113f-mono">restriction: filter to B's 18 rows, count the 3 that satisfy A, divide = 3/18 = 1/6</text>
  <text x="500" y="522" text-anchor="middle" class="d113f-small">Conditioning does not need the formula to be correct — it needs the table to be smaller.</text>

  <!-- Static dot grids, drawn last so they sit above panel fills -->
  <g font-size="1">
  </g>

  <!-- Grid 1: all 36 dots, uniform grey -->
  <g transform="translate(52,148)">
    <!-- rows: second die 1..6 (top to bottom), cols: first die 1..6 (left to right) -->
    <circle class="d113f-dot-out" cx="10"  cy="10"  r="8" /><circle class="d113f-dot-out" cx="46"  cy="10"  r="8" /><circle class="d113f-dot-out" cx="82"  cy="10"  r="8" /><circle class="d113f-dot-out" cx="118" cy="10"  r="8" /><circle class="d113f-dot-out" cx="154" cy="10"  r="8" /><circle class="d113f-dot-out" cx="190" cy="10"  r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="46"  r="8" /><circle class="d113f-dot-out" cx="46"  cy="46"  r="8" /><circle class="d113f-dot-out" cx="82"  cy="46"  r="8" /><circle class="d113f-dot-out" cx="118" cy="46"  r="8" /><circle class="d113f-dot-out" cx="154" cy="46"  r="8" /><circle class="d113f-dot-out" cx="190" cy="46"  r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="82"  r="8" /><circle class="d113f-dot-out" cx="46"  cy="82"  r="8" /><circle class="d113f-dot-out" cx="82"  cy="82"  r="8" /><circle class="d113f-dot-out" cx="118" cy="82"  r="8" /><circle class="d113f-dot-out" cx="154" cy="82"  r="8" /><circle class="d113f-dot-out" cx="190" cy="82"  r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="118" r="8" /><circle class="d113f-dot-out" cx="46"  cy="118" r="8" /><circle class="d113f-dot-out" cx="82"  cy="118" r="8" /><circle class="d113f-dot-out" cx="118" cy="118" r="8" /><circle class="d113f-dot-out" cx="154" cy="118" r="8" /><circle class="d113f-dot-out" cx="190" cy="118" r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="154" r="8" /><circle class="d113f-dot-out" cx="46"  cy="154" r="8" /><circle class="d113f-dot-out" cx="82"  cy="154" r="8" /><circle class="d113f-dot-out" cx="118" cy="154" r="8" /><circle class="d113f-dot-out" cx="154" cy="154" r="8" /><circle class="d113f-dot-out" cx="190" cy="154" r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="190" r="8" /><circle class="d113f-dot-out" cx="46"  cy="190" r="8" /><circle class="d113f-dot-out" cx="82"  cy="190" r="8" /><circle class="d113f-dot-out" cx="118" cy="190" r="8" /><circle class="d113f-dot-out" cx="154" cy="190" r="8" /><circle class="d113f-dot-out" cx="190" cy="190" r="8" />
  </g>

  <!-- Grid 2: only columns 2, 4, 6 (first die even) are highlighted blue; columns 1,3,5 dimmed grey -->
  <g transform="translate(392,148)">
    <circle class="d113f-dot-out" cx="10"  cy="10"  r="8" /><circle class="d113f-dot-b" cx="46"  cy="10"  r="8" /><circle class="d113f-dot-out" cx="82"  cy="10"  r="8" /><circle class="d113f-dot-b" cx="118" cy="10"  r="8" /><circle class="d113f-dot-out" cx="154" cy="10"  r="8" /><circle class="d113f-dot-b" cx="190" cy="10"  r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="46"  r="8" /><circle class="d113f-dot-b" cx="46"  cy="46"  r="8" /><circle class="d113f-dot-out" cx="82"  cy="46"  r="8" /><circle class="d113f-dot-b" cx="118" cy="46"  r="8" /><circle class="d113f-dot-out" cx="154" cy="46"  r="8" /><circle class="d113f-dot-b" cx="190" cy="46"  r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="82"  r="8" /><circle class="d113f-dot-b" cx="46"  cy="82"  r="8" /><circle class="d113f-dot-out" cx="82"  cy="82"  r="8" /><circle class="d113f-dot-b" cx="118" cy="82"  r="8" /><circle class="d113f-dot-out" cx="154" cy="82"  r="8" /><circle class="d113f-dot-b" cx="190" cy="82"  r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="118" r="8" /><circle class="d113f-dot-b" cx="46"  cy="118" r="8" /><circle class="d113f-dot-out" cx="82"  cy="118" r="8" /><circle class="d113f-dot-b" cx="118" cy="118" r="8" /><circle class="d113f-dot-out" cx="154" cy="118" r="8" /><circle class="d113f-dot-b" cx="190" cy="118" r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="154" r="8" /><circle class="d113f-dot-b" cx="46"  cy="154" r="8" /><circle class="d113f-dot-out" cx="82"  cy="154" r="8" /><circle class="d113f-dot-b" cx="118" cy="154" r="8" /><circle class="d113f-dot-out" cx="154" cy="154" r="8" /><circle class="d113f-dot-b" cx="190" cy="154" r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="190" r="8" /><circle class="d113f-dot-b" cx="46"  cy="190" r="8" /><circle class="d113f-dot-out" cx="82"  cy="190" r="8" /><circle class="d113f-dot-b" cx="118" cy="190" r="8" /><circle class="d113f-dot-out" cx="154" cy="190" r="8" /><circle class="d113f-dot-b" cx="190" cy="190" r="8" />
  </g>

  <!-- Grid 3: same even columns, but the 3 outcomes summing to 8, namely (2,6) (4,4) (6,2), are amber.
       Rows here are second die 1 top through 6 bottom; columns are first die 1,2,3,4,5,6.
       (2,6) is col2 row6; (4,4) is col4 row4; (6,2) is col6 row2. -->
  <g transform="translate(732,148)">
    <circle class="d113f-dot-out" cx="10"  cy="10"  r="8" /><circle class="d113f-dot-b" cx="46"  cy="10"  r="8" /><circle class="d113f-dot-out" cx="82"  cy="10"  r="8" /><circle class="d113f-dot-b" cx="118" cy="10"  r="8" /><circle class="d113f-dot-out" cx="154" cy="10"  r="8" /><circle class="d113f-dot-b" cx="190" cy="10"  r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="46"  r="8" /><circle class="d113f-dot-b" cx="46"  cy="46"  r="8" /><circle class="d113f-dot-out" cx="82"  cy="46"  r="8" /><circle class="d113f-dot-b" cx="118" cy="46"  r="8" /><circle class="d113f-dot-out" cx="154" cy="46"  r="8" /><circle class="d113f-dot-ab" cx="190" cy="46"  r="8.5" />
    <circle class="d113f-dot-out" cx="10"  cy="82"  r="8" /><circle class="d113f-dot-b" cx="46"  cy="82"  r="8" /><circle class="d113f-dot-out" cx="82"  cy="82"  r="8" /><circle class="d113f-dot-b" cx="118" cy="82"  r="8" /><circle class="d113f-dot-out" cx="154" cy="82"  r="8" /><circle class="d113f-dot-b" cx="190" cy="82"  r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="118" r="8" /><circle class="d113f-dot-b" cx="46"  cy="118" r="8" /><circle class="d113f-dot-out" cx="82"  cy="118" r="8" /><circle class="d113f-dot-ab" cx="118" cy="118" r="8.5" /><circle class="d113f-dot-out" cx="154" cy="118" r="8" /><circle class="d113f-dot-b" cx="190" cy="118" r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="154" r="8" /><circle class="d113f-dot-b" cx="46"  cy="154" r="8" /><circle class="d113f-dot-out" cx="82"  cy="154" r="8" /><circle class="d113f-dot-b" cx="118" cy="154" r="8" /><circle class="d113f-dot-out" cx="154" cy="154" r="8" /><circle class="d113f-dot-b" cx="190" cy="154" r="8" />
    <circle class="d113f-dot-out" cx="10"  cy="190" r="8" /><circle class="d113f-dot-ab" cx="46"  cy="190" r="8.5" /><circle class="d113f-dot-out" cx="82"  cy="190" r="8" /><circle class="d113f-dot-b" cx="118" cy="190" r="8" /><circle class="d113f-dot-out" cx="154" cy="190" r="8" /><circle class="d113f-dot-b" cx="190" cy="190" r="8" />
  </g>
</svg>
