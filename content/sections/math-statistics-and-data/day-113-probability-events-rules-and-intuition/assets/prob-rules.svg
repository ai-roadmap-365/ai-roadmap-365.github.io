<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four points.">
  <title>The three rules</title>
  <style>
    .prob-rules-bg   { fill: #f8fafc; }
    .prob-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prob-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prob-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prob-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prob-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prob-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prob-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prob-rules-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prob-rules-stage { opacity: 1; }

    .prob-rules-s0 { animation-delay: 0.00s; }
    .prob-rules-e0 { animation-delay: 0.00s; }
    .prob-rules-s1 { animation-delay: 1.28s; }
    .prob-rules-e1 { animation-delay: 1.28s; }
    .prob-rules-s2 { animation-delay: 2.56s; }
    .prob-rules-e2 { animation-delay: 2.56s; }
    .prob-rules-s3 { animation-delay: 3.84s; }
    .prob-rules-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prob-rules-conn  { animation: prob-rules-trace 6.4s ease-in-out infinite; }
      .prob-rules-stage { animation: prob-rules-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prob-rules-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prob-rules-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prob-rules-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prob-rules-stage { animation: prob-rules-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prob-rules-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prob-rules-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prob-rules-bg" width="980" height="322"/>
  <text class="prob-rules-h1"  x="30" y="40">The three rules</text>
  <text class="prob-rules-sub" x="30" y="64">Four points.</text>
  <g class="prob-rules-stage prob-rules-s0">
    <rect class="prob-rules-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prob-rules-step" x="44" y="142">01</text>
    <text class="prob-rules-name" x="70" y="142">For either of two events, add — then subtract the overlap</text>
    <text class="prob-rules-desc" x="44" y="166">Or you count it twice.</text>
  </g>
  <line class="prob-rules-line prob-rules-conn prob-rules-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prob-rules-tip)"/>
  <g class="prob-rules-stage prob-rules-s1">
    <rect class="prob-rules-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prob-rules-step" x="280" y="142">02</text>
    <text class="prob-rules-name" x="306" y="142">For both, multiply the conditional probabilities</text>
    <text class="prob-rules-desc" x="280" y="166">Order does not matter.</text>
  </g>
  <line class="prob-rules-line prob-rules-conn prob-rules-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prob-rules-tip)"/>
  <g class="prob-rules-stage prob-rules-s2">
    <rect class="prob-rules-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prob-rules-step" x="516" y="142">03</text>
    <text class="prob-rules-name" x="542" y="142">If independent, the conditional equals the plain one</text>
    <text class="prob-rules-desc" x="516" y="166">So you can multiply directly.</text>
  </g>
  <line class="prob-rules-line prob-rules-conn prob-rules-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prob-rules-tip)"/>
  <g class="prob-rules-stage prob-rules-s3">
    <rect class="prob-rules-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prob-rules-step" x="752" y="142">04</text>
    <text class="prob-rules-name" x="778" y="142">And conditioning narrows the outcome space</text>
    <text class="prob-rules-desc" x="752" y="166">Which is the key move.</text>
  </g>
  <text class="prob-rules-sub" x="30" y="304">Conditioning as narrowing the space is the intuition that makes conditional probability easy: you are not changing the world, only the set you are counting within.</text>
</svg>
