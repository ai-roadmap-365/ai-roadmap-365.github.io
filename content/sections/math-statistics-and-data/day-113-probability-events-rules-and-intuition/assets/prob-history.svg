<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward an axiomatic basis.">
  <title>Four steps in probability</title>
  <style>
    .prob-history-bg   { fill: #f8fafc; }
    .prob-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prob-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prob-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prob-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prob-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prob-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prob-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prob-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prob-history-stage { opacity: 1; }

    .prob-history-s0 { animation-delay: 0.00s; }
    .prob-history-e0 { animation-delay: 0.00s; }
    .prob-history-s1 { animation-delay: 1.28s; }
    .prob-history-e1 { animation-delay: 1.28s; }
    .prob-history-s2 { animation-delay: 2.56s; }
    .prob-history-e2 { animation-delay: 2.56s; }
    .prob-history-s3 { animation-delay: 3.84s; }
    .prob-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prob-history-conn  { animation: prob-history-trace 6.4s ease-in-out infinite; }
      .prob-history-stage { animation: prob-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prob-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prob-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prob-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prob-history-stage { animation: prob-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prob-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prob-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prob-history-bg" width="980" height="322"/>
  <text class="prob-history-h1"  x="30" y="40">Four steps in probability</text>
  <text class="prob-history-sub" x="30" y="64">Toward an axiomatic basis.</text>
  <g class="prob-history-stage prob-history-s0">
    <rect class="prob-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prob-history-step" x="44" y="142">01</text>
    <text class="prob-history-name" x="70" y="142">Questions about games of chance</text>
    <text class="prob-history-desc" x="44" y="166">Answered case by case.</text>
  </g>
  <line class="prob-history-line prob-history-conn prob-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prob-history-tip)"/>
  <g class="prob-history-stage prob-history-s1">
    <rect class="prob-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prob-history-step" x="280" y="142">02</text>
    <text class="prob-history-name" x="306" y="142">Then general rules for combining chances</text>
    <text class="prob-history-desc" x="280" y="166">Which applied beyond gambling.</text>
  </g>
  <line class="prob-history-line prob-history-conn prob-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prob-history-tip)"/>
  <g class="prob-history-stage prob-history-s2">
    <rect class="prob-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prob-history-step" x="516" y="142">03</text>
    <text class="prob-history-name" x="542" y="142">Then an axiomatic foundation on measure theory</text>
    <text class="prob-history-desc" x="516" y="166">Which made it rigorous.</text>
  </g>
  <line class="prob-history-line prob-history-conn prob-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prob-history-tip)"/>
  <g class="prob-history-stage prob-history-s3">
    <rect class="prob-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prob-history-step" x="752" y="142">04</text>
    <text class="prob-history-name" x="778" y="142">And a continuing debate about interpretation</text>
    <text class="prob-history-desc" x="752" y="166">Frequency, or degree of belief.</text>
  </g>
  <text class="prob-history-sub" x="30" y="304">The interpretive debate is not merely philosophical: it decides whether you may assign a probability to a one-off event, which matters constantly in practice.</text>
</svg>
