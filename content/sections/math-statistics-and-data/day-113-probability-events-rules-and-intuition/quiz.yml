questions:
  - question: 'The Chevalier de Méré believed betting on "at least one 6 in 4 rolls of one die" was exactly as good as "at least one double-six in 24 rolls of two dice," because a double six is 1/6 as likely and 24 = 6 x 4 rolls. What do the exact probabilities show?'
    options:
      - 'They are equal, 0.5, confirming his reasoning exactly'
      - 'Bet 2 is more favourable, because 24 rolls give more chances overall'
      - 'Both bets favour the house, so neither is worth taking'
      - 'Bet 1 is about 0.5177 (favourable) and bet 2 is about 0.4914 (unfavourable) — the two are not equal, and the naive 6x-the-rolls scaling was wrong'
    answer_index: 3
    explanation: 'The complement rule gives 1 - (5/6)^4 = 671/1296 ≈ 0.5177 for bet 1, and 1 - (35/36)^24 ≈ 0.4914 for bet 2 — one above one-half, one below. The naive argument assumed 1 - (1-p)^n scales linearly with n so that a 6x-smaller p and a 6x-larger n cancel exactly; that function is not linear, and the two bets were never equal. This gap, first noticed at the gaming table by an experienced gambler with good instincts, is the problem that launched the Pascal-Fermat correspondence of 1654 and, with it, the mathematical theory of probability.'

  - question: 'A = "the two dice sum to 7" (6 outcomes) and B = "the first die shows 6" (6 outcomes) overlap in exactly one outcome, (6, 1). A reader computes P(A or B) as P(A) + P(B) = 1/6 + 1/6 = 1/3. What is wrong, and by how much?'
    options:
      - 'The naive sum double-counts the one outcome in both A and B, overstating the truth by exactly P(A and B) = 1/36; the correct answer is 11/36'
      - 'Nothing is wrong; 1/3 is the correct probability of A or B'
      - 'The naive sum undercounts, because A and B should have been multiplied rather than added'
      - 'The events must be checked for independence before the addition rule can be applied at all'
    answer_index: 0
    explanation: 'The outcome (6, 1) satisfies both A and B, so it gets counted once in the P(A) pile and once again in the P(B) pile — the naive sum 1/3 = 12/36 double-counts it. The addition rule corrects this by subtracting the overlap once: P(A or B) = P(A) + P(B) - P(A and B) = 6/36 + 6/36 - 1/36 = 11/36. The size of the error is exactly P(A and B), which is why this specific pair of events was chosen: it makes the overcounting concrete and measurable rather than abstract. When A and B are disjoint, P(A and B) = 0 and the naive sum happens to be correct — which is exactly what makes it a dangerous shortcut to memorise without the correction.'

  - question: 'Two dice events, A = "sum is 2" and C = "first die is 1", have P(A) = 1/36, P(C) = 1/6, and P(A and C) = 1/36. Are A and C independent?'
    options:
      - 'Yes, because both events involve small probabilities'
      - 'No — P(A) x P(C) = 1/216, which does not equal the actual P(A and C) = 1/36, so the events are dependent'
      - 'Cannot be determined without knowing P(A or C) as well'
      - 'Yes, because A is a subset of C'
    answer_index: 1
    explanation: 'Independence requires P(A and C) = P(A) x P(C) exactly. Here P(A) x P(C) = (1/36)(1/6) = 1/216, but the actual joint probability is 1/36 — a factor of six off. The two events are dependent because "sum is 2" is ONLY reachable when the first die shows 1 (both dice must show 1); knowing the first die shows 1 changes the probability of summing to 2 from what it would be given any other first-die value, which is exactly what dependence means. Option 3 misreads the relationship: A being reachable only through part of C is precisely why they are dependent, not a reason they would be independent.'

  - question: 'Events A = "sum is 2" and D = "sum is 12" are mutually exclusive on two dice — the dice cannot sum to both at once. What does this imply about whether A and D are independent?'
    options:
      - 'Mutual exclusivity implies independence, since the events clearly do not interact'
      - 'Nothing can be concluded about independence from mutual exclusivity alone'
      - 'A and D are necessarily dependent: P(A | D) = P(A and D)/P(D) = 0, but P(A) = 1/36 ≠ 0, so knowing D occurred changed the probability of A'
      - 'A and D are independent only if both have the same probability, which they do here, so they are independent'
    answer_index: 2
    explanation: 'This is the sharpest possible form of dependence hiding behind a relationship that sounds like it should mean "unrelated." Because A and D cannot both occur, P(A and D) = 0, so P(A | D) = 0/P(D) = 0 exactly — while P(A) on its own is 1/36, not zero. Learning that D occurred collapsed the probability of A all the way to zero, which is about as large a change in belief as conditioning can produce. In general, any pair of mutually exclusive events with non-zero individual probabilities is necessarily dependent, because each one occurring rules the other out completely. Options 0 and 3 both describe the exact opposite of the true relationship between these two properties.'

  - question: 'P(sum = 8 | first die is even) is computed two ways: by the formula P(A and B)/P(B), and by filtering the 36-outcome sample space down to the 18 outcomes where the first die is even and asking what fraction of THOSE sum to 8. What should happen?'
    options:
      - 'The two methods should give different answers, since they compute genuinely different quantities'
      - 'The formula method is more accurate; the filtering method is only an approximation'
      - 'The filtering method only works when the condition and the target event are independent'
      - 'Both methods give exactly 1/6 — they are the same computation, described two different ways'
    answer_index: 3
    explanation: 'By the formula: P(sum=8 and first-even) = 3/36, P(first-even) = 18/36, so P(A|B) = (3/36)/(18/36) = 3/18 = 1/6. By filtering: restrict to the 18 rows where the first die is even, count that 3 of those rows sum to 8, and divide: 3/18 = 1/6. These are not two independent checks that happen to agree by luck — conditioning IS restriction; the formula is just an algebraic shortcut for exactly the row-filtering operation described in option 3. Option 2 is backwards: restriction-based conditioning works for every pair of events, independent or not, and is in fact the most useful way to reason about dependent pairs, since independence is the special case where restricting changes nothing.'

  - question: 'Two urns are drawn from with a fair coin: urn 1 has 3 red and 7 blue balls, urn 2 has 6 red and 4 blue. What structural fact makes the law of total probability applicable here, and why does it matter for Day 115?'
    options:
      - 'The two urns partition the sample space into non-overlapping possibilities, each with a known probability and a known conditional probability of red; Bayes'' theorem, arriving on Day 115, runs this exact computation backwards'
      - 'The urns must have the same number of balls, which is a requirement of the law of total probability in general'
      - 'The coin must be fair; the law of total probability does not apply to a biased prior'
      - 'The urns must both contain some red and some blue balls, or the rule produces division by zero'
    answer_index: 0
    explanation: 'The law of total probability needs a partition — a set of non-overlapping possibilities that together cover the whole sample space, each with a known probability of occurring and a known conditional probability of the target event. "Drew from urn 1" and "drew from urn 2" is exactly such a partition here, giving P(red) = P(urn1) x P(red|urn1) + P(urn2) x P(red|urn2) = 9/20. Neither equal urn sizes nor a fair coin nor non-zero compositions are requirements of the rule in general — they were chosen in this lesson''s specific example to make an independent enumeration check simple, not because the rule needs them. Day 115''s Bayes'' theorem asks the reverse question — given a red ball was drawn, what''s the probability it came from urn 2? — and its denominator is precisely this rule''s output.'

  - question: 'A simulation estimates a probability at n = 100, 1,000, 10,000 and 100,000 trials. From n=100 to n=100,000 (a 1,000x increase), by roughly what factor should the average estimation error shrink?'
    options:
      - 'About 1,000x, matching the increase in n directly'
      - 'About 31.6x — the square root of 1,000 — because Monte Carlo error shrinks as 1/sqrt(n), not 1/n'
      - 'Not at all; more trials only reduce error for events with probability near 0.5'
      - 'About 3x, since standard error formulas are only meaningful up to a small constant factor'
    answer_index: 1
    explanation: 'The standard error of a proportion is sqrt(p(1-p)/n), which shrinks as 1/sqrt(n) rather than 1/n. Multiplying n by 1,000 should shrink the typical error by sqrt(1,000) ≈ 31.6x, not by 1,000x. This lesson''s lab measures this directly across four sample sizes and twenty seeds per size and finds a shrink close to the sqrt(n) prediction and far below the naive 1/n prediction. The practical consequence: a hundredfold increase in simulation trials buys roughly a tenfold reduction in error, not a hundredfold one — a fact worth knowing before deciding how many trials a decision actually needs. Option 2 is false: the formula sqrt(p(1-p)/n) is largest at p=0.5 and smaller elsewhere, but it is never zero and always shrinks with more trials for any p strictly between 0 and 1.'

  - question: 'This lesson introduces "the chain rule for probability," P(A and B and C) = P(A) x P(B|A) x P(C|A,B). How does this relate to Day 110''s chain rule for derivatives?'
    options:
      - 'They are the same rule, just applied in two different fields — probability and calculus — with the underlying mathematics identical'
      - 'Neither rule is actually called a chain rule in standard terminology; the naming is a common misconception this lesson corrects'
      - 'They share only a name and a loose structural echo — both build a quantity by multiplying a chain of local pieces, each evaluated in the correct context — but are otherwise entirely unrelated results from unrelated fields'
      - 'The probability chain rule is a special case of the derivative chain rule, obtainable by taking a limit'
    answer_index: 2
    explanation: 'This is a genuine and common point of confusion precisely because both rules are real, both are commonly called "the chain rule," and both do describe a quantity built by multiplying a sequence of local factors, each evaluated in the right context — a local derivative evaluated at the value that actually arrives at its stage, or a conditional probability conditioned on everything decided before it. Beyond that structural resemblance, the two rules come from entirely different mathematical traditions, apply to entirely different kinds of objects (functions and derivatives versus events and conditional probabilities), and neither can be derived from the other. Option 1 is false — both uses of the term are standard and correct within their own fields; the lesson names the collision explicitly rather than pretending it does not exist.'
