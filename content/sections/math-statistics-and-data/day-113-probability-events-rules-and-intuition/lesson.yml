learning_promise: 'After this lesson you will be able to resolve a 370-year-old gambling paradox in two lines of code, and you will know exactly why your intuition about it was wrong. In the 1650s the Chevalier de Méré believed betting on at least one 6 in 4 rolls of one die was exactly as good as betting on at least one double-six in 24 rolls of two dice — a double six is 1/6 as likely, so 6x the rolls should even things out. It does not: the exact probabilities are 0.5177 and 0.4914, favourable and unfavourable respectively, and the gap is what launched Pascal and Fermat''s 1654 correspondence that founded the mathematical theory of probability. You will derive both numbers exactly with the complement rule in one line each, then confirm both by simulation with numpy.random.Generator, and that derive-then-check pattern is the whole strategy of the lesson: when intuition and arithmetic disagree, enumerate a sample space with itertools and count with fractions.Fraction so the answer has no floating-point noise; when the space is too large to enumerate, simulate and derive your tolerance from the standard error of a proportion rather than guessing it. You will work the addition rule on two overlapping dice events and see the naive P(A) + P(B) overstate the truth by exactly P(A and B), the double-counted region. You will build a table distinguishing independence from mutual exclusivity — the most common conflation in the subject — and prove that mutually exclusive events with non-zero probability are NECESSARILY dependent, using a worked example where P(A | B) collapses to exactly 0 while P(A) does not. You will learn to think of conditioning as throwing away rows of a table and re-normalising, checked against the formula on the same example. You will meet the multiplication rule and the chain rule for probability, and be told plainly that despite the name it shares nothing with Day 110''s chain rule beyond an echo of structure. You will set up the law of total probability across two urns of different composition, carefully enough that Day 115''s Bayes'' theorem — which runs this exact rule backwards — arrives as a natural next step rather than a new idea. And you will measure, not just be told, that Monte Carlo error shrinks like 1/sqrt(n): a hundred times the samples buys a tenth of the error, not a hundredth, confirmed across four sample sizes four decades apart and twenty seeds per size so the claim is about a trend rather than one lucky run.'
objectives:
  - 'Build a finite sample space by enumeration with itertools.product, define an event as a filtered subset of it, and compute a probability as an exact Fraction rather than a float'
  - 'State the addition rule P(A or B) = P(A) + P(B) - P(A and B), and show precisely how much a naive sum overstates the truth when two events overlap'
  - 'Collapse an "at least one" question to one line with the complement rule, and use it to resolve the Chevalier de Méré''s 1654 paradox exactly'
  - 'Confirm an exact probability by simulation with numpy.random.default_rng, using a tolerance derived from the standard error of a proportion rather than chosen arbitrarily'
  - 'Distinguish independence (P(A and B) = P(A) x P(B)) from mutual exclusivity (P(A and B) = 0), and explain why mutually exclusive events with non-zero probability are necessarily dependent'
  - 'Compute a conditional probability both by the formula P(A|B) = P(A and B)/P(B) and by literally restricting the sample space, and recognise these as the same operation'
  - 'State the multiplication rule and the chain rule for probability, and explain precisely why it shares nothing with Day 110''s chain rule beyond a coincidental name'
  - 'Apply the law of total probability across a partition of the sample space, verified against a direct enumeration of the combined experiment'
  - 'Explain why Monte Carlo error shrinks as 1/sqrt(n) rather than 1/n, and say what that means for how many simulation trials a decision actually needs'
  - 'Use numpy.random.default_rng(seed) correctly for reproducible simulation, and explain why it is preferred over the legacy numpy.random.seed global-state function'
  - 'Recognise and explain the gambler''s fallacy, the confusion between P(A|B) and P(B|A), base-rate neglect, and the conjunction fallacy, each with a concrete worked or measured example'
  - 'Explain why fractions.Fraction rather than float division is used for every exact probability claim in this lesson, and what specifically goes wrong with the float alternative'
prerequisites:
  - 'Comfort with Python sets, list comprehensions, and itertools.product — no new syntax is introduced, only new ways of using what you already know'
  - 'Basic arithmetic on fractions; fractions.Fraction handles the mechanics, but the lesson assumes you can read a fraction like 11/36 and know roughly what it means'
  - 'No calculus and no prior statistics. This is the first day of probability in the entire course, and nothing here depends on Days 99-112''s linear algebra or calculus'
  - 'Days 71-74 — running pytest and reading its skip-versus-fail output'
  - 'Day 43 — python3 -m venv and installing a package with pip'
