questions:
  - question: 'You apply a matrix to twenty-four unit vectors spread evenly around the circle and record the angle between each input and its output. Twenty-two of the angles are non-zero. What are the two directions where the angle came out as zero?'
    options:
      - 'The directions in which the determinant is largest'
      - 'The columns of the matrix, which is where the basis vectors land'
      - 'Eigenvectors, and each length factor is its eigenvalue'
      - 'Artefacts of sampling — with a finer fan those angles would be non-zero too'
    answer_index: 2
    explanation: 'That measurement IS the definition. A vector whose output lies on the same line as its input has been scaled but not turned, which is exactly what A v = lambda v says: the matrix did to v precisely what multiplying by a single number does. The length ratio is lambda. The second option confuses today with Day 102: the columns of a matrix are where the basis vectors (1, 0) and (0, 1) land, which is a fact about the matrix but tells you nothing about which directions survive — for the matrix [[4, 1], [2, 3]] the columns are (4, 2) and (1, 3) while the eigen-lines sit at 45 and 116.565 degrees. The third option is not a thing: a determinant is one number for the whole matrix, not something that varies by direction. The fourth gets it backwards — a coarser fan MISSES eigendirections rather than inventing them, which is exactly what happened in the lesson: the twenty-four-direction fan found the 45-degree line and stepped straight over the one at 116.565 degrees, which only a 180,000-direction sweep recovered.'
  - question: 'Why is the zero vector excluded from the definition of an eigenvector, even though A 0 = lambda 0 is a true equation?'
    options:
      - 'Because the zero vector cannot be normalised to unit length'
      - 'Because its eigenvalue would have to be zero, and zero is not allowed as an eigenvalue'
      - 'Because matrix multiplication is undefined for the zero vector'
      - 'Because it satisfies the equation for every value of lambda, so it distinguishes nothing'
    answer_index: 3
    explanation: 'A @ (0, 0) is (0, 0), and lambda * (0, 0) is also (0, 0) — for lambda = 5, for lambda = 2, for lambda = 1000, for every number there is. So the zero vector satisfies the defining equation universally, which means it separates no eigenvalue from any other and carries no information. Allowing it would make every number an eigenvalue of every matrix and empty the concept out completely. It also has no direction to keep, so the question the definition is really asking — did this direction survive? — has no content for it. The first option is true but is a consequence rather than the reason; plenty of useful objects cannot be normalised. The third is simply false: A @ 0 is perfectly well defined and equals 0. The fourth inverts the actual rule, and the inversion matters: the EIGENVALUE is allowed to be zero and the EIGENVECTOR is not. An eigenvalue of zero is highly informative — it says the matrix collapsed that entire direction to the origin, which is the same news as a zero determinant.'
  - question: 'Why does a 90-degree rotation of the plane have no real eigenvector?'
    options:
      - 'Because it turns every vector by 90 degrees, so no vector can come back on its own line'
      - 'Because rotation matrices are not square, so eigenvalues are undefined for them'
      - 'Because its determinant is 1, and only matrices with determinant 0 have eigenvectors'
      - 'Because numpy.linalg.eig fails to converge on rotation matrices'
    answer_index: 0
    explanation: 'Answer it from the geometry and the algebra becomes a footnote. A rotation turns EVERY vector by the same angle. For a vector to keep its line it would have to be turned by 0 degrees or by 180 degrees, and a 90-degree rotation turns by neither — so nothing survives, and there is nothing for any algebra to find. The lesson confirmed this by measurement as well: over 180,000 swept directions the smallest swing was 90.000000 degrees, and the sweep returned the verdict none. The algebra then says the same thing in its own vocabulary: trace 0 and determinant 1 give lambda squared plus 1 = 0, and no real number squares to minus 1. The negative discriminant is not an error message, it is the algebra reporting the geometry. The first option has the relationship backwards — a zero determinant means some eigenvalue is zero, not that eigenvectors exist only then; the identity has determinant 1 and every direction is an eigenvector of it. The second is false: a rotation matrix is square. The fourth is false and worth being clear about — eig succeeds perfectly well and returns 0+1j and 0-1j, which is the honest answer rather than a failure. The real danger here is taking .real without checking, which silently reports two eigenvalues of magnitude 1 as 0.'
  - question: 'Your hand calculation gives the eigenvector (0.447, -0.894). numpy.linalg.eig returns (-0.447, 0.894) for the same eigenvalue, and numpy.allclose says False. What is going on?'
    options:
      - 'NumPy uses a different sign convention that you should convert to before comparing'
      - 'Both are correct — an eigenvector is defined up to sign'
      - 'One of the two answers is wrong, and the residual of A v minus lambda v will show which'
      - 'The tolerance in allclose is too tight for this calculation and should be relaxed'
    answer_index: 1
    explanation: 'If A v = lambda v, multiply both sides by any non-zero number c and you get A (c v) = lambda (c v). So c v is an eigenvector too, for every c — including minus 1 and including 3.7. There is no such thing as THE eigenvector for an eigenvalue; there is an eigen-LINE through the origin, and every library that hands you a single vector has made an arbitrary choice on your behalf. Which sign LAPACK returns is a detail of its internal normalisation, not a fact about your matrix, and it can differ between builds and between versions. The fix is to compare directions with the absolute cosine, where 1.0 means same line. The first option is a trap worth naming because it sounds professional: there is no convention to convert to, because there is nothing to convert — attempting to normalise the sign yourself makes one case pass and another fail, and you end up back here in an hour. The second is wrong: BOTH residuals are zero, because both vectors genuinely satisfy the equation. The fourth misdiagnoses entirely — the two answers differ by a factor of exactly minus 1, not by a rounding error, so no tolerance short of 2.0 would help and relaxing it would only hide real failures.'
  - question: 'The shear [[1, 1], [0, 1]] has eigenvalues 1 and 1, and numpy.linalg.eig returns a 2x2 array of eigenvectors. How many distinct eigendirections does it actually have?'
    options:
      - 'Two, one per column returned'
      - 'Zero, because the repeated eigenvalue means the decomposition failed'
      - 'One — both returned columns lie on the same line, and their absolute cosine is 1.0'
      - 'Infinitely many, because a repeated eigenvalue always means every direction qualifies'
    answer_index: 2
    explanation: 'The measured absolute cosine between the two returned columns is 1.000000000000000: they are the same line. eig must return a square array, so when there are not enough independent directions to fill it, it fills the space anyway — which means counting columns is not counting eigendirections. Geometrically it is obvious: a shear leaves the x-axis alone and tilts everything else, so only the horizontal line survives, and a brute-force sweep of 180,000 directions independently found exactly one. The eigenvalue 1 appears twice as a root of the characteristic equation, so its ALGEBRAIC multiplicity is 2, while only one independent direction exists, so its GEOMETRIC multiplicity is 1. That gap is precisely what makes the shear impossible to diagonalise, and the failure is silent: numpy.linalg.inv on its singular eigenvector matrix does not raise — the determinant is 2.2e-16 rather than exactly 0, so LAPACK inverts it, returns entries around 4.5e15, and V D V-inverse comes back as a clean, plausible, completely wrong identity matrix. Check the condition number, not for an exception. The fourth option describes the identity and the uniform scaling, where a repeated eigenvalue DOES come with every direction qualifying — so a repeated eigenvalue alone cannot tell you which case you are in.'
  - question: 'You run the power method on a matrix with eigenvalues 5 and 2, and it converges in 25 iterations. You then run the identical code on a matrix with eigenvalues 5 and 4.9. What happens, and why?'
    options:
      - 'It converges in about the same number of iterations, since the dominant eigenvalue is unchanged'
      - 'It fails immediately, because the power method requires distinct integer eigenvalues'
      - 'It converges faster, because the two eigenvalues are closer so less separation is needed'
      - 'It needs far more iterations — 962 in the lab'
    answer_index: 3
    explanation: 'Write the starting vector as a mixture of the eigenvectors. Each application of the matrix multiplies each ingredient by its own eigenvalue, so after k rounds the second ingredient has shrunk RELATIVE to the first by (lambda 2 over lambda 1) to the power k. Nothing is eliminated — the dominant direction simply outgrows the other one, and the speed at which it does so is entirely governed by that ratio. For 2 over 5 the ratio is 0.4, measured in the lab at 0.399999, and 25 rounds suffice for a tolerance of 1e-10. For 4.9 over 5 the ratio is 0.98, and the same code needed 962 iterations. This is why the algorithm effectively tells you the second eigenvalue through the speed at which it finds the first, and it is the honest answer to when NOT to use the power method. The third option inverts the mechanism: closeness in magnitude is exactly what makes the dominant direction hard to isolate, because the competing ingredient refuses to die away. The fourth is false — the method has no integer requirement at all and works on any matrix with a single dominant eigenvalue. What genuinely breaks it is two eigenvalues of EQUAL magnitude, such as 3 and minus 3, where there is no single dominant direction to converge to and the iteration never settles.'
  - question: 'You compute PCA on a cloud of points by taking the eigenvectors of X-transpose X divided by n minus 1, but you forget to subtract the column means first. The cloud is genuinely elongated along 30 degrees. What do you get?'
    options:
      - 'A confident answer around 166.6 degrees, roughly 136.6 degrees wrong, with no error or warning'
      - 'An exception, because a covariance matrix is undefined for uncentred data'
      - 'A result rotated by exactly 90 degrees from the truth'
      - 'The correct 30 degrees, since centring only shifts the data and eigenvectors ignore shifts'
    answer_index: 0
    explanation: 'The measured result was 166.583965 degrees against a truth of 30.0, an error of 136.583965 degrees, and nothing was raised. Covariance is about how points vary AROUND THEIR OWN MEAN. Skip the subtraction and every product picks up the offset of the cloud from the origin, which for this cloud is (5, minus 2) and describes where it sits rather than what shape it is. The numbers make the mechanism plain: the squared offset is 5 squared plus 2 squared = 29, while the actual spread contributes about 8.4, so the offset simply swamps the signal. Confirming the diagnosis, the uncentred answer lands 8.385374 degrees from the direction of the cloud CENTRE and 136.583965 degrees from its shape — it measured the offset, faithfully. The first option is a plausible-sounding half-truth: eigenvectors are indeed unaffected by scaling the whole matrix, which is why dividing by n versus n minus 1 does not matter, but they are absolutely affected by which matrix you built. The second is wrong and is the heart of why this is dangerous — no library checks, because X-transpose X is a perfectly well-formed matrix and there is no way for it to know you meant something else. The third invents a structure that is not there; the error depends entirely on where your cloud happens to sit relative to the origin.'
  - question: 'You have a covariance matrix and you need its eigenvectors. Why is numpy.linalg.eigh the right call rather than numpy.linalg.eig?'
    options:
      - 'Because eig cannot handle matrices larger than 2 by 2'
      - 'A covariance matrix is symmetric, which is what eigh assumes'
      - 'Because eigh normalises the eigenvectors to unit length and eig does not'
      - 'Because eigh is guaranteed to return components with a positive first entry, which removes the sign ambiguity'
    answer_index: 1
    explanation: 'Entry (i, j) and entry (j, i) of a covariance matrix are the same sum of products written in the other order, so symmetry is structural rather than something you hope for — and symmetry guarantees real eigenvalues and orthogonal eigenvectors, which is why PCA is so well behaved. eigh is the routine written for that case and it pays three measured dividends: it returns float64 rather than complex128, so no .real and no guard against a rotation-style disaster; it returns values sorted ascending, whereas eig makes no ordering promise at all and needs an argmax; and on a 400 by 400 symmetric matrix on the authoring machine it took 6.19 ms against 64.79 ms, a factor of 10.46 on that run. The sharp edge to know about is the other direction: eigh reads only ONE triangle of the input and assumes the other matches, so handed a non-symmetric matrix it does not complain — on [[4, 1], [2, 3]] it silently solves [[4, 2], [2, 3]] and returns 1.438 and 5.562 instead of 2 and 5. The second option is simply false. The third is false too — both routines return unit-length eigenvectors. The fourth is the tempting one and it is wrong: eigh fixes nothing about the sign, which is exactly why the lesson PCA result came back as (minus 0.865, minus 0.502) against a true direction of (0.866, 0.500), pointing the opposite way along the identical line while being exactly correct.'
