<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"
     aria-labelledby="d106f-title d106f-desc">
  <title id="d106f-title">The power method: a random starting vector multiplied and normalised over and over, swinging round and settling onto the dominant eigenvector at forty-five degrees</title>
  <desc id="d106f-desc">A starting vector pointing at twenty point one seven degrees is repeatedly multiplied by the matrix and rescaled to unit length. Each round moves it closer to the eigen-line at forty-five degrees, by a shrinking amount. The measured directions are twenty point one seven, thirty-five point three nine, forty-one point two five, forty-three point five two and forty-four point four one degrees, converging in twenty-five iterations to a tolerance of one times ten to the minus ten.</desc>

  <style>
    .d106f-bg    { fill: #f8fafc; }
    .d106f-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .d106f-h     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d106f-sub   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 15px; fill: #475569; }
    .d106f-t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 15px; fill: #1a202c; }
    .d106f-tb    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 16px; font-weight: 700; fill: #1a202c; }
    .d106f-mono  { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
                   font-size: 15px; fill: #1a202c; }
    .d106f-grey  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 14px; fill: #64748b; }
    .d106f-blue  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 15px; font-weight: 700; fill: #1d4ed8; }
    .d106f-axis  { stroke: #e2e8f0; stroke-width: 1.5; }
    .d106f-circle{ fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .d106f-target{ stroke: #1d4ed8; stroke-width: 3; stroke-dasharray: 9 6; }
    .d106f-ghost { stroke: #94a3b8; stroke-width: 2; fill: none; opacity: 0.75; }

    /* the travelling vector: it SWINGS from 20.17 degrees to 45 degrees.
       SVG rotates clockwise for a positive angle, so the mathematical
       counter-clockwise swing is written as a negative rotation. */
    .d106f-arrow { stroke: #1d4ed8; stroke-width: 5; fill: none;
                   transform-origin: 270px 400px;
                   transform: rotate(-20.172157deg);
                   animation: d106f-swing 7s ease-in-out infinite; }
    @keyframes d106f-swing {
       0%,  6%  { transform: rotate(-20.172157deg) }
      20%, 24%  { transform: rotate(-35.386025deg) }
      36%, 40%  { transform: rotate(-41.250476deg) }
      50%, 54%  { transform: rotate(-43.517808deg) }
      62%, 66%  { transform: rotate(-44.410065deg) }
      74%, 100% { transform: rotate(-45deg) }
    }

    /* the three stages of one round, lighting up in order */
    .d106f-stage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; rx: 8;
                   animation: d106f-lift 7s ease-in-out infinite; }
    .d106f-s1 { animation-delay: 0s; }
    .d106f-s2 { animation-delay: 0.5s; }
    .d106f-s3 { animation-delay: 1s; }
    @keyframes d106f-lift {
       0%, 26%, 100% { fill: #e0e7ff }
       6%, 18%       { fill: #bfdbfe }
    }

    /* the loop-back arrow: dashes marching round the cycle */
    .d106f-wire { stroke: #1d4ed8; stroke-width: 2.5; fill: none;
                  stroke-dasharray: 10 8; animation: d106f-march 1.6s linear infinite; }
    @keyframes d106f-march { to { stroke-dashoffset: -18 } }

    /* the measured rows, highlighted in the same order the arrow swings */
    .d106f-row { fill: #ffffff; animation: d106f-glow 7s ease-in-out infinite; }
    .d106f-r0 { animation-delay: 0s; }
    .d106f-r1 { animation-delay: 1.05s; }
    .d106f-r2 { animation-delay: 2.24s; }
    .d106f-r3 { animation-delay: 3.15s; }
    .d106f-r4 { animation-delay: 3.99s; }
    .d106f-r5 { animation-delay: 5.18s; }
    @keyframes d106f-glow {
       0%, 14%, 100% { fill: #ffffff }
       2%, 10%       { fill: #dbeafe }
    }

    @media (prefers-reduced-motion: reduce) {
      .d106f-arrow { animation: none; transform: rotate(-45deg) }
      .d106f-stage { animation: none; fill: #e0e7ff }
      .d106f-wire  { animation: none; stroke-dasharray: none }
      .d106f-row   { animation: none; fill: #ffffff }
    }
  </style>

  <rect class="d106f-bg" x="0" y="0" width="1000" height="700"/>

  <!-- =================== LEFT: the swing ================================= -->
  <rect class="d106f-panel" x="20" y="18" width="500" height="664"/>

  <text class="d106f-h"    x="42" y="52">Multiply. Rescale. Repeat.</text>
  <text class="d106f-mono" x="42" y="78">A = [[4, 1], [2, 3]]</text>
  <text class="d106f-sub"  x="42" y="100">A seeded random start, and the line it is pulled onto.</text>

  <!-- axes and unit circle, centre (270, 400) radius 155 -->
  <line class="d106f-axis" x1="80"  y1="400" x2="470" y2="400"/>
  <line class="d106f-axis" x1="270" y1="210" x2="270" y2="590"/>
  <circle class="d106f-circle" cx="270" cy="400" r="155"/>

  <!-- the dominant eigen-line at 45 degrees: the destination -->
  <line class="d106f-target" x1="139" y1="531" x2="401" y2="269"/>
  <text class="d106f-blue" x="356" y="256">the eigen-line, 45&#176;</text>
  <text class="d106f-blue" x="356" y="276">&#955; = 5</text>

  <!-- the ghost positions: every measured round, present in the still frame -->
  <line class="d106f-ghost" x1="270" y1="400" x2="416" y2="347"/>
  <line class="d106f-ghost" x1="270" y1="400" x2="396" y2="310"/>
  <line class="d106f-ghost" x1="270" y1="400" x2="387" y2="298"/>
  <line class="d106f-ghost" x1="270" y1="400" x2="382" y2="293"/>
  <line class="d106f-ghost" x1="270" y1="400" x2="381" y2="292"/>

  <text class="d106f-grey" x="424" y="352">k = 0</text>
  <text class="d106f-grey" x="424" y="312">k = 1</text>
  <text class="d106f-grey" x="424" y="292">k = 2, 3, 4 &#8230;</text>

  <!-- the travelling vector itself: drawn along +x and rotated by the CSS -->
  <line class="d106f-arrow" x1="270" y1="400" x2="425" y2="400"
        marker-end="url(#d106f-tip)"/>

  <text class="d106f-grey" x="42" y="628">Each round closes the remaining gap to 0.4 of what it was,</text>
  <text class="d106f-grey" x="42" y="650">because 0.4 is &#955;&#8322; / &#955;&#8321; = 2 / 5. Measured: 0.399999.</text>
  <text class="d106f-grey" x="42" y="672">The ghosts are the real measured rounds, not a sketch.</text>

  <!-- =================== RIGHT: the loop and the numbers ================== -->
  <rect class="d106f-panel" x="540" y="18" width="440" height="664"/>

  <text class="d106f-h" x="562" y="52">One round, three lines</text>

  <rect class="d106f-stage d106f-s1" x="562" y="70"  width="290" height="44"/>
  <text class="d106f-mono" x="578" y="98">w = A @ v</text>

  <rect class="d106f-stage d106f-s2" x="562" y="126" width="290" height="44"/>
  <text class="d106f-mono" x="578" y="154">w = w / norm(w)</text>

  <rect class="d106f-stage d106f-s3" x="562" y="182" width="290" height="44"/>
  <text class="d106f-mono" x="578" y="210">change = norm(w &#8722; v);  v = w</text>

  <!-- the loop back -->
  <path class="d106f-wire" d="M 852 204 L 900 204 L 900 92 L 858 92"
        marker-end="url(#d106f-tip)"/>
  <text class="d106f-grey" x="906" y="152" transform="rotate(90 906 152)">repeat</text>

  <text class="d106f-grey" x="562" y="250">Rescaling changes no direction. Without it the length</text>
  <text class="d106f-grey" x="562" y="270">multiplies by 5 each round and overflows to inf by k = 300.</text>

  <line class="d106f-axis" x1="562" y1="288" x2="958" y2="288"/>

  <text class="d106f-tb" x="562" y="318">What was measured</text>

  <text class="d106f-grey" x="562" y="344">k</text>
  <text class="d106f-grey" x="606" y="344">direction</text>
  <text class="d106f-grey" x="726" y="344">Rayleigh</text>
  <text class="d106f-grey" x="846" y="344">off target</text>

  <rect class="d106f-row d106f-r0" x="558" y="352" width="400" height="30" rx="4"/>
  <text class="d106f-mono" x="566" y="373">0</text>
  <text class="d106f-mono" x="606" y="373">20.172157</text>
  <text class="d106f-mono" x="726" y="373">4.852153</text>
  <text class="d106f-mono" x="846" y="373">24.8278</text>

  <rect class="d106f-row d106f-r1" x="558" y="386" width="400" height="30" rx="4"/>
  <text class="d106f-mono" x="566" y="407">1</text>
  <text class="d106f-mono" x="606" y="407">35.386025</text>
  <text class="d106f-mono" x="726" y="407">5.080987</text>
  <text class="d106f-mono" x="846" y="407">9.6140</text>

  <rect class="d106f-row d106f-r2" x="558" y="420" width="400" height="30" rx="4"/>
  <text class="d106f-mono" x="566" y="441">2</text>
  <text class="d106f-mono" x="606" y="441">41.250476</text>
  <text class="d106f-mono" x="726" y="441">5.052425</text>
  <text class="d106f-mono" x="846" y="441">3.7495</text>

  <rect class="d106f-row d106f-r3" x="558" y="454" width="400" height="30" rx="4"/>
  <text class="d106f-mono" x="566" y="475">3</text>
  <text class="d106f-mono" x="606" y="475">43.517808</text>
  <text class="d106f-mono" x="726" y="475">5.023850</text>
  <text class="d106f-mono" x="846" y="475">1.4822</text>

  <rect class="d106f-row d106f-r4" x="558" y="488" width="400" height="30" rx="4"/>
  <text class="d106f-mono" x="566" y="509">4</text>
  <text class="d106f-mono" x="606" y="509">44.410065</text>
  <text class="d106f-mono" x="726" y="509">5.009978</text>
  <text class="d106f-mono" x="846" y="509">0.5899</text>

  <rect class="d106f-row d106f-r5" x="558" y="522" width="400" height="30" rx="4"/>
  <text class="d106f-mono" x="566" y="543">5</text>
  <text class="d106f-mono" x="606" y="543">44.764504</text>
  <text class="d106f-mono" x="726" y="543">5.004059</text>
  <text class="d106f-mono" x="846" y="543">0.2355</text>

  <line class="d106f-axis" x1="562" y1="566" x2="958" y2="566"/>

  <text class="d106f-tb"   x="562" y="596">Stopped at k = 25</text>
  <text class="d106f-mono" x="562" y="620">change  6.77e&#8722;11  &lt;  tol 1e&#8722;10</text>
  <text class="d106f-mono" x="562" y="642">&#955;       5.000000000045</text>
  <text class="d106f-grey" x="562" y="666">numpy.linalg.eig agrees to 4.5e&#8722;11.</text>

  <defs>
    <marker id="d106f-tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>
