<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"
     aria-labelledby="d106a-title d106a-desc">
  <title id="d106a-title">A matrix acting on twelve directions around a circle: ten are knocked off their line, two are only stretched, and those two are the eigenvectors</title>
  <desc id="d106a-desc">The matrix four one two three is applied to twelve unit vectors spread evenly around a circle. Ten outputs point somewhere other than their input, shown by diverging arrows. Two outputs lie exactly along their input, at forty-five degrees and one hundred sixteen point five six five degrees; those are labelled as eigenvectors with stretch factors five and two, which are the eigenvalues.</desc>

  <style>
    .d106a-bg    { fill: #f8fafc; }
    .d106a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .d106a-h     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d106a-sub   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 15px; fill: #475569; }
    .d106a-t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 15px; fill: #1a202c; }
    .d106a-tb    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d106a-mono  { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
                   font-size: 15px; fill: #1a202c; }
    .d106a-monob { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
                   font-size: 16px; font-weight: 700; fill: #1d4ed8; }
    .d106a-circle{ fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .d106a-axis  { stroke: #e2e8f0; stroke-width: 1.5; }
    .d106a-in    { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .d106a-out   { stroke: #f59e0b; stroke-width: 2.5; fill: none; }
    .d106a-eline { stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 7 5; opacity: 0.55; }
    .d106a-ein   { stroke: #1d4ed8; stroke-width: 3; fill: none; }
    .d106a-eout  { stroke: #1d4ed8; stroke-width: 4.5; fill: none; }
    .d106a-blue  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 15px; font-weight: 700; fill: #1d4ed8; }
    .d106a-amber { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 15px; font-weight: 700; fill: #b45309; }
    .d106a-grey  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                   font-size: 14px; fill: #64748b; }
    .d106a-chip  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; rx: 6; }
    .d106a-chipw { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; rx: 6; }
  </style>

  <rect class="d106a-bg" x="0" y="0" width="1000" height="620"/>

  <!-- ============================ LEFT: the measurement ==================== -->
  <rect class="d106a-panel" x="20" y="18" width="552" height="584"/>

  <text class="d106a-h"   x="40" y="50">Apply the matrix to every direction</text>
  <text class="d106a-mono" x="40" y="76">A = [[4, 1], [2, 3]]</text>
  <text class="d106a-sub" x="40" y="98">Grey = the input, a unit vector.  Arrow = where A sends it.</text>

  <!-- axes and unit circle, centre (296, 330) radius 104 -->
  <line class="d106a-axis" x1="76"  y1="330" x2="516" y2="330"/>
  <line class="d106a-axis" x1="296" y1="120" x2="296" y2="540"/>
  <circle class="d106a-circle" cx="296" cy="330" r="104"/>

  <!-- the two eigen-lines, drawn right across the panel -->
  <line class="d106a-eline" x1="162" y1="464" x2="430" y2="196"/>
  <line class="d106a-eline" x1="381" y1="500" x2="211" y2="160"/>

  <!-- ten directions that get KNOCKED OFF their line -->
  <g>
    <!-- 0 deg: input, then output swung 26.6 deg away -->
    <line class="d106a-in"  x1="296" y1="330" x2="400" y2="330"/>
    <line class="d106a-out" x1="296" y1="330" x2="437" y2="259" marker-end="url(#d106a-tipAmber)"/>
    <!-- 30 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="386" y2="278"/>
    <line class="d106a-out" x1="296" y1="330" x2="436" y2="216" marker-end="url(#d106a-tipAmber)"/>
    <!-- 60 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="348" y2="240"/>
    <line class="d106a-out" x1="296" y1="330" x2="397" y2="203" marker-end="url(#d106a-tipAmber)"/>
    <!-- 90 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="296" y2="226"/>
    <line class="d106a-out" x1="296" y1="330" x2="331" y2="224" marker-end="url(#d106a-tipAmber)"/>
    <!-- 120 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="244" y2="240"/>
    <line class="d106a-out" x1="296" y1="330" x2="256" y2="273" marker-end="url(#d106a-tipAmber)"/>
    <!-- 150 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="206" y2="278"/>
    <line class="d106a-out" x1="296" y1="330" x2="191" y2="338" marker-end="url(#d106a-tipAmber)"/>
    <!-- 180 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="192" y2="330"/>
    <line class="d106a-out" x1="296" y1="330" x2="155" y2="401" marker-end="url(#d106a-tipAmber)"/>
    <!-- 210 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="206" y2="382"/>
    <line class="d106a-out" x1="296" y1="330" x2="156" y2="444" marker-end="url(#d106a-tipAmber)"/>
    <!-- 240 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="244" y2="420"/>
    <line class="d106a-out" x1="296" y1="330" x2="195" y2="457" marker-end="url(#d106a-tipAmber)"/>
    <!-- 270 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="296" y2="434"/>
    <line class="d106a-out" x1="296" y1="330" x2="261" y2="436" marker-end="url(#d106a-tipAmber)"/>
    <!-- 300 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="348" y2="420"/>
    <line class="d106a-out" x1="296" y1="330" x2="336" y2="387" marker-end="url(#d106a-tipAmber)"/>
    <!-- 330 deg -->
    <line class="d106a-in"  x1="296" y1="330" x2="386" y2="382"/>
    <line class="d106a-out" x1="296" y1="330" x2="401" y2="322" marker-end="url(#d106a-tipAmber)"/>
  </g>

  <!-- the TWO that stay on their line -->
  <g>
    <!-- 45 deg, eigenvalue 5 -->
    <line class="d106a-ein"  x1="296" y1="330" x2="370" y2="256"/>
    <line class="d106a-eout" x1="296" y1="330" x2="421" y2="205" marker-end="url(#d106a-tipBlue)"/>
    <!-- 225 deg, the same line the other way -->
    <line class="d106a-ein"  x1="296" y1="330" x2="222" y2="404"/>
    <line class="d106a-eout" x1="296" y1="330" x2="171" y2="455" marker-end="url(#d106a-tipBlue)"/>
    <!-- 116.565 deg, eigenvalue 2 -->
    <line class="d106a-ein"  x1="296" y1="330" x2="249" y2="237"/>
    <line class="d106a-eout" x1="296" y1="330" x2="264" y2="267" marker-end="url(#d106a-tipBlue)"/>
    <!-- 296.565 deg, the same line the other way -->
    <line class="d106a-ein"  x1="296" y1="330" x2="343" y2="423"/>
    <line class="d106a-eout" x1="296" y1="330" x2="328" y2="393" marker-end="url(#d106a-tipBlue)"/>
  </g>

  <!-- callout chips on the two survivors -->
  <rect class="d106a-chip" x="404" y="168" width="132" height="28"/>
  <text class="d106a-blue" x="414" y="187">45&#176;  stretched &#215;5</text>

  <rect class="d106a-chip" x="120" y="150" width="150" height="28"/>
  <text class="d106a-blue" x="130" y="169">116.565&#176;  &#215;2</text>

  <rect class="d106a-chipw" x="404" y="454" width="146" height="28"/>
  <text class="d106a-amber" x="414" y="473">every other: swung</text>

  <text class="d106a-grey" x="40" y="566">Ten of the twelve leave their line, by 5.4&#176; to 34.5&#176;. Two do not move off it at all.</text>
  <text class="d106a-grey" x="40" y="588">45&#176; and 225&#176; are the SAME line, so two lines survive, not four.</text>

  <!-- ============================ RIGHT: the anatomy ====================== -->
  <rect class="d106a-panel" x="592" y="18" width="388" height="584"/>

  <text class="d106a-h" x="614" y="50">What those two are called</text>

  <text class="d106a-monob" x="614" y="88">A v  =  &#955; v</text>
  <text class="d106a-sub"   x="614" y="110">&#8220;the matrix does to v exactly what</text>
  <text class="d106a-sub"   x="614" y="130">multiplying by a single number does&#8221;</text>

  <line class="d106a-axis" x1="614" y1="146" x2="958" y2="146"/>

  <text class="d106a-tb" x="614" y="176">v  &#8212;  the eigenvector</text>
  <text class="d106a-t"  x="614" y="198">the direction that survives. Never the zero</text>
  <text class="d106a-t"  x="614" y="218">vector: A 0 = &#955; 0 for EVERY &#955;, so it</text>
  <text class="d106a-t"  x="614" y="238">distinguishes nothing and is excluded.</text>

  <text class="d106a-tb" x="614" y="272">&#955;  &#8212;  the eigenvalue</text>
  <text class="d106a-t"  x="614" y="294">the stretch factor, and its size is the news:</text>
  <text class="d106a-mono" x="628" y="318">&#955; &gt; 1   longer          (here 5)</text>
  <text class="d106a-mono" x="628" y="340">&#955; = 1   unchanged</text>
  <text class="d106a-mono" x="628" y="362">0 &lt; &#955; &lt; 1  shorter</text>
  <text class="d106a-mono" x="628" y="384">&#955; &lt; 0   reversed along the line</text>
  <text class="d106a-mono" x="628" y="406">&#955; = 0   collapsed to the origin</text>
  <text class="d106a-grey" x="628" y="426">and &#955; = 0 is Day 102&#8217;s zero determinant</text>

  <line class="d106a-axis" x1="614" y1="446" x2="958" y2="446"/>

  <text class="d106a-tb" x="614" y="476">a LINE, not an arrow</text>
  <text class="d106a-t"  x="614" y="498">If A v = &#955; v then it holds for &#8722;v and for</text>
  <text class="d106a-t"  x="614" y="518">3.7 v too. So (1, &#8722;2) and (&#8722;1, 2) are the</text>
  <text class="d106a-t"  x="614" y="538">same answer, and numpy.allclose calls one</text>
  <text class="d106a-t"  x="614" y="558">of them wrong. Compare the absolute</text>
  <text class="d106a-t"  x="614" y="578">cosine instead: 1.0 means &#8220;same line&#8221;.</text>

  <defs>
    <marker id="d106a-tipAmber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="d106a-tipBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>
