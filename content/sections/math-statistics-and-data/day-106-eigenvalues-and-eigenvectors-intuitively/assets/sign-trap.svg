<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The sign trap</title>
  <style>
    .sign-trap-bg   { fill: #f8fafc; }
    .sign-trap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-trap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-trap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-trap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-trap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-trap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sign-trap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sign-trap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sign-trap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sign-trap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sign-trap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sign-trap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sign-trap-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sign-trap-stage { opacity: 1; }

    .sign-trap-s0 { animation-delay: 0.00s; }
    .sign-trap-e0 { animation-delay: 0.00s; }
    .sign-trap-s1 { animation-delay: 1.28s; }
    .sign-trap-e1 { animation-delay: 1.28s; }
    .sign-trap-s2 { animation-delay: 2.56s; }
    .sign-trap-e2 { animation-delay: 2.56s; }
    .sign-trap-s3 { animation-delay: 3.84s; }
    .sign-trap-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sign-trap-conn  { animation: sign-trap-trace 6.4s ease-in-out infinite; }
      .sign-trap-stage { animation: sign-trap-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sign-trap-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sign-trap-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sign-trap-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sign-trap-stage { animation: sign-trap-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sign-trap-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sign-trap-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sign-trap-bg" width="980" height="322"/>
  <text class="sign-trap-h1"  x="30" y="40">The sign trap</text>
  <text class="sign-trap-sub" x="30" y="64">Four steps.</text>
  <g class="sign-trap-stage sign-trap-s0">
    <rect class="sign-trap-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sign-trap-step" x="44" y="142">01</text>
    <text class="sign-trap-name" x="70" y="142">If a vector is an eigenvector, so is its negative</text>
    <text class="sign-trap-desc" x="44" y="166">Both satisfy the definition</text>
    <text class="sign-trap-desc" x="44" y="182">equally.</text>
  </g>
  <line class="sign-trap-line sign-trap-conn sign-trap-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sign-trap-tip)"/>
  <g class="sign-trap-stage sign-trap-s1">
    <rect class="sign-trap-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sign-trap-step" x="280" y="142">02</text>
    <text class="sign-trap-name" x="306" y="142">So the sign returned is an implementation choice</text>
    <text class="sign-trap-desc" x="280" y="166">And differs between libraries</text>
    <text class="sign-trap-desc" x="280" y="182">and versions.</text>
  </g>
  <line class="sign-trap-line sign-trap-conn sign-trap-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sign-trap-tip)"/>
  <g class="sign-trap-stage sign-trap-s2">
    <rect class="sign-trap-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sign-trap-step" x="516" y="142">03</text>
    <text class="sign-trap-name" x="542" y="142">For variance and reconstruction it changes nothing</text>
    <text class="sign-trap-desc" x="516" y="166">Which is why it usually goes</text>
    <text class="sign-trap-desc" x="516" y="182">unnoticed.</text>
  </g>
  <line class="sign-trap-line sign-trap-conn sign-trap-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sign-trap-tip)"/>
  <g class="sign-trap-stage sign-trap-s3">
    <rect class="sign-trap-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sign-trap-step" x="752" y="142">04</text>
    <text class="sign-trap-name" x="778" y="142">But a plot flips, and a stored component no longer matches</text>
    <text class="sign-trap-desc" x="752" y="166">So fix the sign by a convention.</text>
  </g>
  <text class="sign-trap-sub" x="30" y="304">Fixing the sign by a rule — say, making the largest-magnitude entry positive — is what keeps stored components comparable across runs and library upgrades.</text>
</svg>
