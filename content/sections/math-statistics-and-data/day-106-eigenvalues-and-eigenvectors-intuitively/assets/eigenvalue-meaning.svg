<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four cases.">
  <title>Reading an eigenvalue</title>
  <style>
    .eigenvalue-meaning-bg   { fill: #f8fafc; }
    .eigenvalue-meaning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigenvalue-meaning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigenvalue-meaning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigenvalue-meaning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigenvalue-meaning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigenvalue-meaning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eigenvalue-meaning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eigenvalue-meaning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eigenvalue-meaning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eigenvalue-meaning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eigenvalue-meaning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eigenvalue-meaning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eigenvalue-meaning-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eigenvalue-meaning-stage { opacity: 1; }

    .eigenvalue-meaning-s0 { animation-delay: 0.00s; }
    .eigenvalue-meaning-e0 { animation-delay: 0.00s; }
    .eigenvalue-meaning-s1 { animation-delay: 1.28s; }
    .eigenvalue-meaning-e1 { animation-delay: 1.28s; }
    .eigenvalue-meaning-s2 { animation-delay: 2.56s; }
    .eigenvalue-meaning-e2 { animation-delay: 2.56s; }
    .eigenvalue-meaning-s3 { animation-delay: 3.84s; }
    .eigenvalue-meaning-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eigenvalue-meaning-conn  { animation: eigenvalue-meaning-trace 6.4s ease-in-out infinite; }
      .eigenvalue-meaning-stage { animation: eigenvalue-meaning-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eigenvalue-meaning-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eigenvalue-meaning-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eigenvalue-meaning-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eigenvalue-meaning-stage { animation: eigenvalue-meaning-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eigenvalue-meaning-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eigenvalue-meaning-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eigenvalue-meaning-bg" width="980" height="322"/>
  <text class="eigenvalue-meaning-h1"  x="30" y="40">Reading an eigenvalue</text>
  <text class="eigenvalue-meaning-sub" x="30" y="64">Four cases.</text>
  <g class="eigenvalue-meaning-stage eigenvalue-meaning-s0">
    <rect class="eigenvalue-meaning-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eigenvalue-meaning-step" x="44" y="142">01</text>
    <text class="eigenvalue-meaning-name" x="70" y="142">Greater than one: that direction is stretched</text>
    <text class="eigenvalue-meaning-desc" x="44" y="166">Repeated application grows it.</text>
  </g>
  <line class="eigenvalue-meaning-line eigenvalue-meaning-conn eigenvalue-meaning-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eigenvalue-meaning-tip)"/>
  <g class="eigenvalue-meaning-stage eigenvalue-meaning-s1">
    <rect class="eigenvalue-meaning-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eigenvalue-meaning-step" x="280" y="142">02</text>
    <text class="eigenvalue-meaning-name" x="306" y="142">Between zero and one: it is shrunk</text>
    <text class="eigenvalue-meaning-desc" x="280" y="166">Repeated application collapses</text>
    <text class="eigenvalue-meaning-desc" x="280" y="182">it.</text>
  </g>
  <line class="eigenvalue-meaning-line eigenvalue-meaning-conn eigenvalue-meaning-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eigenvalue-meaning-tip)"/>
  <g class="eigenvalue-meaning-stage eigenvalue-meaning-s2">
    <rect class="eigenvalue-meaning-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eigenvalue-meaning-step" x="516" y="142">03</text>
    <text class="eigenvalue-meaning-name" x="542" y="142">Negative: it is flipped as well as scaled</text>
    <text class="eigenvalue-meaning-desc" x="516" y="166">Pointing the opposite way.</text>
  </g>
  <line class="eigenvalue-meaning-line eigenvalue-meaning-conn eigenvalue-meaning-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eigenvalue-meaning-tip)"/>
  <g class="eigenvalue-meaning-stage eigenvalue-meaning-s3">
    <rect class="eigenvalue-meaning-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eigenvalue-meaning-step" x="752" y="142">04</text>
    <text class="eigenvalue-meaning-name" x="778" y="142">Zero: that direction is destroyed entirely</text>
    <text class="eigenvalue-meaning-desc" x="752" y="166">Which is what makes the matrix</text>
    <text class="eigenvalue-meaning-desc" x="752" y="182">singular.</text>
  </g>
  <text class="eigenvalue-meaning-sub" x="30" y="304">A zero eigenvalue and a zero determinant are the same fact stated two ways, since the determinant is the product of the eigenvalues.</text>
</svg>
