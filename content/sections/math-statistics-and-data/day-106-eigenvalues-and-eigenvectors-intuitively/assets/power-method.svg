<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The power method</title>
  <style>
    .power-method-bg   { fill: #f8fafc; }
    .power-method-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-method-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-method-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-method-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-method-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-method-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .power-method-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .power-method-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .power-method-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .power-method-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .power-method-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .power-method-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .power-method-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .power-method-stage { opacity: 1; }

    .power-method-s0 { animation-delay: 0.00s; }
    .power-method-e0 { animation-delay: 0.00s; }
    .power-method-s1 { animation-delay: 1.28s; }
    .power-method-e1 { animation-delay: 1.28s; }
    .power-method-s2 { animation-delay: 2.56s; }
    .power-method-e2 { animation-delay: 2.56s; }
    .power-method-s3 { animation-delay: 3.84s; }
    .power-method-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .power-method-conn  { animation: power-method-trace 6.4s ease-in-out infinite; }
      .power-method-stage { animation: power-method-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes power-method-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes power-method-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .power-method-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .power-method-stage { animation: power-method-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes power-method-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="power-method-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="power-method-bg" width="980" height="322"/>
  <text class="power-method-h1"  x="30" y="40">The power method</text>
  <text class="power-method-sub" x="30" y="64">Four steps.</text>
  <g class="power-method-stage power-method-s0">
    <rect class="power-method-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="power-method-step" x="44" y="142">01</text>
    <text class="power-method-name" x="70" y="142">Start with a random vector</text>
    <text class="power-method-desc" x="44" y="166">Almost any one will do.</text>
  </g>
  <line class="power-method-line power-method-conn power-method-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#power-method-tip)"/>
  <g class="power-method-stage power-method-s1">
    <rect class="power-method-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="power-method-step" x="280" y="142">02</text>
    <text class="power-method-name" x="306" y="142">Multiply by the matrix, repeatedly</text>
    <text class="power-method-desc" x="280" y="166">The dominant direction grows</text>
    <text class="power-method-desc" x="280" y="182">fastest.</text>
  </g>
  <line class="power-method-line power-method-conn power-method-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#power-method-tip)"/>
  <g class="power-method-stage power-method-s2">
    <rect class="power-method-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="power-method-step" x="516" y="142">03</text>
    <text class="power-method-name" x="542" y="142">Normalising after each step to prevent overflow</text>
    <text class="power-method-desc" x="516" y="166">Which changes nothing about the</text>
    <text class="power-method-desc" x="516" y="182">direction.</text>
  </g>
  <line class="power-method-line power-method-conn power-method-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#power-method-tip)"/>
  <g class="power-method-stage power-method-s3">
    <rect class="power-method-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="power-method-step" x="752" y="142">04</text>
    <text class="power-method-name" x="778" y="142">And it converges to the largest eigenvector</text>
    <text class="power-method-desc" x="752" y="166">Faster when the eigenvalues are</text>
    <text class="power-method-desc" x="752" y="182">well separated.</text>
  </g>
  <text class="power-method-sub" x="30" y="304">Convergence speed depending on the eigenvalue gap is the practical caveat: two nearly equal dominant eigenvalues make this method very slow.</text>
</svg>
