title: 'Eigenvalues and Eigenvectors, Intuitively'
section: math-statistics-and-data
subsection: mathematics-for-ai
week: 16
learning_promise: 'After this lesson you will be able to say what an eigenvector and an eigenvalue are in one sentence, without reaching for a determinant, and explain it to someone else. You will arrive at the idea the way it was found rather than the way it is usually taught: by applying a matrix to twenty-four directions spread around a circle, watching twenty-two of them get knocked off their line, and noticing that two come back pointing exactly where they started, merely longer. You will then DERIVE the characteristic equation instead of being handed it — A v = lambda v becomes (A minus lambda I) v = 0, which says a non-zero vector is sent to the origin, and Day 102 already told you that only a matrix with zero determinant does that. You will solve a 2x2 by hand in about a minute, get integer eigenvalues 5 and 2 and integer eigenvectors, and check them against numpy.linalg.eig to a stated tolerance. You will learn what each eigenvalue means: above one is a stretch, one is unchanged, below one is a squash, negative is a reversal, and zero is a collapse — which is Day 102 zero determinant arriving in new clothing. You will know how many eigendirections each of Day 102 standard transformations has: every direction for a scaling, exactly one for a shear, and NONE AT ALL for a plane rotation, which is geometrically obvious once you picture an arrow being turned and which numpy reports honestly as a complex pair rather than as an error. You will implement the power method — multiply, rescale, repeat — watch it converge in 25 iterations, and discover that its convergence rate of 0.399999 is the ratio of the two eigenvalues telling you the second one through the speed at which it finds the first. And you will finish with the connection that makes this day matter: principal component analysis IS the eigenvectors of a covariance matrix. You will build a 400-point cloud stretched along 30 degrees, hand the code nothing but the coordinates, and get 30.101134 degrees back — PCA, complete, in fifteen lines. You will also meet the trap that costs practitioners the most time: an eigenvector is defined only up to sign and scale, so numpy.allclose calls a correct answer wrong roughly half the time, and the fix is to compare directions rather than components.'
objectives:
  - 'Say in one sentence what an eigenvector and an eigenvalue are, without using the words determinant, characteristic or polynomial'
  - 'Measure which directions a matrix leaves on their own line, by computing the angle between a vector and its image'
  - 'Derive the characteristic equation from (A minus lambda I) v = 0 and Day 102 zero determinant, rather than quoting it'
  - 'Solve a 2x2 by hand — trace, determinant, discriminant, quadratic formula, then one row per eigenvector'
  - 'Read an eigenvalue as a scale factor, including what negative, one and zero each mean geometrically'
  - 'Explain why a plane rotation has no real eigenvector, from the geometry before the algebra'
  - 'Distinguish algebraic from geometric multiplicity, and say why a shear cannot be diagonalised'
  - 'Implement the power method with rescaling and sign alignment, and predict its convergence rate from the eigenvalue ratio'
  - 'Compute a covariance matrix from scratch, take its eigenvectors, and recognise that as principal component analysis'
  - 'Compare eigenvectors by direction rather than by components, and say why numpy.allclose is the wrong tool'
  - 'Choose between numpy.linalg.eig and numpy.linalg.eigh, and say what eigh does with non-symmetric input'
  - 'Name three silent failures in this area — eigh on non-symmetric input, inverting a defective eigenvector matrix, and skipping the centring in PCA'
