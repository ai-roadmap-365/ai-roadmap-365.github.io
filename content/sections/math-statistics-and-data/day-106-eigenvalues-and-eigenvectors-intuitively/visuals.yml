visuals:
  - id: eigenvector-anatomy-architecture
    file: assets/eigenvector-anatomy-architecture.svg
    type: diagram
    title: 'The eigenvector, arrived at by measurement: a matrix applied to twelve directions around a circle, ten knocked off their line and two only stretched, beside the anatomy of A v equals lambda v'
    alt: 'Diagram: the matrix four one two three applied to twelve unit vectors spread evenly around a circle, with grey arrows for the inputs and amber arrows for the outputs; ten of the outputs point away from their input while two lie exactly along their input, at forty-five degrees stretched by five and at one hundred sixteen point five six five degrees stretched by two, labelled as the eigenvectors with their eigenvalues, beside a panel giving the anatomy of the equation A v equals lambda v'
    description: 'A static architecture diagram carrying the day''s organising idea in one picture, with no algebra required to read it. The left panel, headed Apply the matrix to every direction, shows the matrix A equals four one two three above a dashed unit circle centred on a pair of faint axes. Twelve grey input arrows radiate from the centre to the circle, one every thirty degrees, and beside each one an amber arrow shows where the matrix sent it. The amber arrows visibly diverge from their grey partners, by amounts ranging from five point four degrees to thirty-four point five degrees, so the eye reads immediately that most directions are turned. Two blue dashed lines cross the panel at forty-five degrees and at one hundred sixteen point five six five degrees, and along each of those lines the input and output arrows are drawn in blue and lie exactly on top of one another, differing only in length. A blue chip labels the forty-five degree survivor as stretched by five and the other as stretched by two, while an amber chip labels the rest as every other: swung. Two grey lines beneath record that ten of the twelve leave their line by five point four to thirty-four point five degrees while two do not move off it at all, and that forty-five and two hundred twenty-five degrees are the same line, so two lines survive rather than four. The right panel, headed What those two are called, gives the anatomy. It states A v equals lambda v in blue and reads it aloud as the matrix does to v exactly what multiplying by a single number does. Below that, v is named the eigenvector, the direction that survives, with the note that it is never the zero vector because A times zero equals lambda times zero for every lambda, so the zero vector distinguishes nothing and is excluded. Then lambda is named the eigenvalue, the stretch factor, with five cases listed in a monospaced column: greater than one is longer, here five; equal to one is unchanged; between zero and one is shorter; less than zero is reversed along the line; and equal to zero is collapsed to the origin, with a grey footnote that lambda equals zero is Day 102''s zero determinant. A final block headed a LINE, not an arrow records that if A v equals lambda v then it holds for minus v and for three point seven v too, so one and minus two and minus one and two are the same answer, that numpy.allclose calls one of them wrong, and that the absolute cosine should be compared instead because one point zero means same line.'
  - id: power-method-flow
    file: assets/power-method-flow.svg
    type: flow-animated
    title: 'The power method: a starting vector multiplied and rescaled over and over, swinging round and settling onto the dominant eigenvector at forty-five degrees in twenty-five iterations'
    alt: 'Diagram: the power method animated as a vector swinging from twenty point one seven degrees onto the eigen-line at forty-five degrees, with ghost arrows marking each measured round, a three-stage loop showing multiply then rescale then compare, and a table of the real measured directions, Rayleigh quotients and remaining angle error for iterations zero to five, ending at twenty-five iterations with eigenvalue five point zero zero zero zero zero zero zero zero zero four five'
    description: 'An animated flow diagram, hand-authored, whose animation adds emphasis and ordering but no information — every label, number and position is present in the still frame, and a prefers-reduced-motion block parks the swinging arrow at its converged position and turns the marching dashes into a solid line. The left panel, headed Multiply. Rescale. Repeat., shows the matrix A equals four one two three above a dashed unit circle on faint axes. A thick blue dashed line crosses it at forty-five degrees, labelled the eigen-line, forty-five degrees, lambda equals five: this is the destination. Five grey ghost arrows radiate from the centre at the real measured directions of the first rounds, labelled k equals zero, k equals one, and k equals two, three, four and so on, and they visibly bunch closer together as they approach the blue line, which is convergence made visible. A single thick blue arrow with an arrowhead is the travelling vector; in the animation it swings anticlockwise from twenty point one seven two one five seven degrees through thirty-five point three eight six zero two five, forty-one point two five zero four seven six, forty-three point five one seven eight zero eight and forty-four point four one zero zero six five degrees, resting at forty-five degrees for the remainder of each seven-second cycle. Grey notes beneath record that each round closes the remaining gap to nought point four of what it was because nought point four is lambda two over lambda one equals two over five, measured at nought point three nine nine nine nine nine, and that the ghosts are the real measured rounds rather than a sketch. The right panel, headed One round, three lines, shows three pale blue rounded stages that light up in sequence: w equals A at v, then w equals w over norm w, then change equals norm of w minus v with v set to w. A blue arrow of marching dashes loops from the third stage back to the first, labelled repeat. A grey note records that rescaling changes no direction and that without it the length multiplies by five each round and overflows to infinity by k equals three hundred. Below a rule, a section headed What was measured gives a six-row table with columns k, direction, Rayleigh and off target, whose rows highlight in turn in step with the swinging arrow: iteration zero at twenty point one seven two one five seven degrees with quotient four point eight five two one five three and twenty-four point eight two seven eight degrees off target; then thirty-five point three eight six zero two five with five point zero eight zero nine eight seven and nine point six one four zero; forty-one point two five zero four seven six with five point zero five two four two five and three point seven four nine five; forty-three point five one seven eight zero eight with five point zero two three eight five zero and one point four eight two two; forty-four point four one zero zero six five with five point zero zero nine nine seven eight and nought point five eight nine nine; and forty-four point seven six four five zero four with five point zero zero four zero five nine and nought point two three five five. A closing block headed Stopped at k equals twenty-five records that the change was six point seven seven times ten to the minus eleven, below the tolerance of one times ten to the minus ten, that lambda came out as five point zero zero zero zero zero zero zero zero zero four five, and that numpy.linalg.eig agrees to four point five times ten to the minus eleven.'
