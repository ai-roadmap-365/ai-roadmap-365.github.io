terms:
  - term: 'Eigenvector'
    definition: 'A non-zero vector that a matrix scales but does not turn: applying the matrix leaves it on exactly the line it started on, only longer, shorter, or reversed. Formally, v is an eigenvector of A if A v = lambda v for some number lambda, with v not the zero vector. The critical subtlety is that it is really a LINE rather than a vector: if A v = lambda v then the same equation holds for minus v and for 3.7 v, so every non-zero multiple is equally an eigenvector. Any library that returns one vector has made an arbitrary choice, which is why comparing eigenvectors component by component is a bug and comparing absolute cosines is not. The word is half-translated German: eigen means own or characteristic, so this is the matrix own direction.'
  - term: 'Eigenvalue'
    definition: 'The scale factor belonging to an eigenvector — how much the matrix stretches that direction. Its value is the news: above 1 means stretched, exactly 1 means unchanged, between 0 and 1 means shortened, negative means reversed end-for-end along the same line, and exactly 0 means the direction was collapsed to the origin. That last case is Day 102 zero determinant arriving in new clothing. Note the asymmetry with its partner: an eigenVALUE of zero is permitted and highly informative, while an eigenVECTOR of zero is excluded because it satisfies the defining equation for every lambda and therefore distinguishes nothing.'
  - term: 'Characteristic equation'
    definition: 'The polynomial equation det(A minus lambda I) = 0, whose roots are the eigenvalues. It is not an arbitrary formula but a direct translation of the geometry: rearranging A v = lambda v gives (A minus lambda I) v = 0, which says a non-zero vector is sent to the origin, and only a matrix with zero determinant does that. For any 2x2 it always works out to lambda squared minus (trace) lambda plus (determinant) = 0, so trace and determinant are the only two numbers you need. Derive that once and never again. Its DISCRIMINANT carries the whole character of the matrix: positive means two distinct real eigenvalues, zero means one repeated, negative means none that are real. Worth knowing that no serious numerical library computes it — the QR algorithm finds eigenvalues without ever forming the polynomial, because polynomial root-finding is unstable in a way that eigenvalue-finding need not be.'
  - term: 'Dominant eigenvalue'
    definition: 'The eigenvalue of largest absolute value, and the eigenvector belonging to it is the dominant eigenvector. It matters because repeated application of a matrix is eventually governed by it alone: writing any starting vector as a mixture of the eigenvectors, each application multiplies each ingredient by its own eigenvalue, so the ingredient with the largest magnitude outgrows every other one. Nothing is eliminated; it is simply left behind. Note that dominant is about MAGNITUDE, so minus 5 dominates 2. When two eigenvalues share the largest magnitude there is no dominant direction at all, and iterative methods that assume one will never converge.'
  - term: 'Power method'
    definition: 'An algorithm for finding the dominant eigenvector in three lines: multiply by the matrix, rescale to unit length, repeat until successive vectors stop moving. Rescaling changes no direction and exists only to stop the length running away — without it the vector grows by the eigenvalue every round and overflows float64 to infinity within a few hundred steps, destroying a direction that was already correct. Sign alignment is equally non-optional: when the dominant eigenvalue is negative the iterate flips end-for-end every step, so the convergence test never fires even though the answer settled on round three. Its convergence RATE is the ratio of the second eigenvalue to the first, measured at 0.399999 for a matrix with eigenvalues 5 and 2. It looks naive next to numpy.linalg.eig, and it is, for a small matrix — but it needs only the ability to compute A times v rather than the matrix itself, which is why every large-scale eigensolver is a refined descendant of it.'
  - term: 'Diagonalisation'
    definition: 'Rewriting a matrix as A = V D V-inverse, where the columns of V are the eigenvectors and D is the diagonal matrix of eigenvalues. In one sentence: changing to the basis where the matrix is just a scaling. Read right to left as Day 101 taught, V-inverse translates a vector into eigenvector coordinates, D scales each coordinate independently, and V translates back — so the complicated matrix in the middle has become a list of numbers, and the k-th application becomes a list of k-th powers. It is possible exactly when there are enough independent eigenvectors to fill V. When there are not — as for a shear — the matrix is called DEFECTIVE and diagonalisation does not exist. The dangerous part is that the attempt fails silently: numpy.linalg.inv on a singular eigenvector matrix does not raise, it returns entries around 4.5e15 and a plausible wrong answer.'
  - term: 'Symmetric matrix'
    definition: 'A square matrix equal to its own transpose, so entry (i, j) always matches entry (j, i). Two guarantees follow, both standard results proved in any linear algebra text and cited rather than proved in this lesson: all its eigenvalues are REAL, and its eigenvectors are ORTHOGONAL. Cauchy proved the real-eigenvalue result in the 1820s while studying the principal axes of quadric surfaces. This is not a niche case — a covariance matrix, a Gram matrix, a correlation matrix and a graph Laplacian are all symmetric by construction, which is precisely why PCA never returns a complex answer you have to interpret and why its components always come out perpendicular. It is also why numpy.linalg.eigh exists and is roughly ten times faster than eig on such input.'
  - term: 'Orthogonal'
    definition: 'At right angles — two vectors are orthogonal when their dot product is zero, which Day 103 established means a cosine similarity of zero and no shared component at all. For a set of vectors it means every pair is mutually perpendicular. Symmetry of a matrix guarantees its eigenvectors are orthogonal, which is what gives PCA its second useful property beyond finding the best directions: the projections of the data onto different principal components are UNCORRELATED, measured at 6.420e-16 in this lesson. It is also the hidden condition on the textbook claim that the Rayleigh quotient converges quadratically — measured, that holds for a symmetric matrix and fails for a non-symmetric one whose eigen-lines meet at 71.5651 degrees rather than 90.'
  - term: 'Covariance matrix'
    definition: 'For data with d features, the d by d matrix whose (i, j) entry is how much feature i and feature j vary TOGETHER around their own means. Computed as the centred data transposed times itself, divided by n minus 1. Two things about it decide everything downstream. It is always symmetric, because entry (i, j) and entry (j, i) are the same sum of products written in the other order — which is what guarantees real eigenvalues and perpendicular eigenvectors. And the CENTRING is not optional: skip it and you measure how far the cloud sits from the origin rather than how it is shaped, which in this lesson produced an answer 136.583965 degrees wrong with no error and no warning. Note that its size depends on the number of FEATURES, not the number of points: a 400 by 2 dataset has a 2 by 2 covariance matrix.'
  - term: 'Principal component'
    definition: 'An eigenvector of a covariance matrix. The FIRST principal component is the one with the largest eigenvalue, and it is the direction along which the data varies most; each subsequent one is the direction of greatest remaining variance perpendicular to all the earlier ones. Principal component analysis is nothing more than computing these and keeping the ones whose eigenvalues are large — in this lesson the top component of a 400-point cloud came back at 30.101134 degrees against a true elongation of 30.0 that the code was never told. The eigenvalue IS the variance along its own component, so its square root is a standard deviation, and the proportions of the total are the explained-variance ratios behind every claim that 768 dimensions were reduced to 50. Because a component is an eigenvector it names an AXIS rather than an arrow: sign flips between library versions are routine and are not errors. Published by Karl Pearson in 1901 and independently named by Harold Hotelling in 1933.'
  - term: 'Spectral radius'
    definition: 'The largest absolute value among a matrix eigenvalues. The word spectrum for the set of eigenvalues comes from Hilbert work on integral equations, predating its use in physics for what a prism does to light. The spectral radius is the single number that answers whether repeated application of a matrix grows or decays: above 1 and the iterates grow without bound, below 1 and they shrink to nothing, exactly 1 and they hold steady. That makes it the honest one-number stability test for anything driven by an iterated linear map, and it is what the power method converges towards. Related and worth knowing alongside it: the ratio of largest to smallest eigenvalue magnitude is the CONDITION NUMBER, which measures how much a small error in the input can be amplified in the output.'
  - term: 'Multiplicity'
    definition: 'How many times an eigenvalue counts, in two different senses that can disagree. ALGEBRAIC multiplicity is how many times it appears as a root of the characteristic equation. GEOMETRIC multiplicity is how many independent eigenvectors it actually has. Geometric is never greater than algebraic, and when they are equal for every eigenvalue the matrix diagonalises. The shear [[1, 1], [0, 1]] is the canonical example of them disagreeing: its eigenvalue 1 has algebraic multiplicity 2 and geometric multiplicity 1, because only the x-axis survives. This matters practically because numpy.linalg.eig must return a square array of eigenvectors regardless, so it returns two columns for the shear whose absolute cosine is 1.0 — the same line twice. Counting the columns a library returns is not counting eigendirections.'
