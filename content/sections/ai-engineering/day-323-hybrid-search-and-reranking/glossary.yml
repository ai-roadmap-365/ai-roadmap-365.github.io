terms:
- term: Hybrid Search
  definition: Combining dense vector semantic search with sparse lexical keyword search (BM25) to maximize
    recall.
- term: BM25 (Best Matching 25)
  definition: A probabilistic TF-IDF ranking function optimizing exact keyword relevance and term saturation.
- term: Reciprocal Rank Fusion (RRF)
  definition: An algorithm combining multiple ranked search result lists based on reciprocal rank positions.
- term: Cross-Encoder (Reranker)
  definition: A transformer model that jointly attends over concatenated query-document pairs to produce
    fine-grained relevance scores.
- term: Bi-Encoder
  definition: An embedding model that encodes queries and documents into independent vector embeddings
    for fast vector search.
- term: Two-Stage Retrieval
  definition: A pipeline using fast hybrid search for candidate selection (top-50) followed by cross-encoder
    reranking (top-5).
- term: Keyword Blindness
  definition: The failure of pure vector search to distinguish exact alphanumeric identifiers or rare
    technical terms.
- term: Rank Constant k
  definition: A smoothing parameter in RRF (default 60) that balances top ranks against rank consensus.
