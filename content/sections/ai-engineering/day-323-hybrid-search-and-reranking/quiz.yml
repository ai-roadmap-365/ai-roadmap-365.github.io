questions:
- question: Why does pure dense semantic vector search frequently fail on domain-specific product queries
    (e.g. searching for error code 'ERR_9402_AUTH')?
  options:
  - Because vector databases cannot store text
  - Because dense embeddings compress text into a continuous semantic space that prioritizes conceptual
    similarity over exact keyword/token matching, often blurring distinct alphanumeric product IDs or
    error codes into generic related concepts
  - Because Python does not support math
  - Because GPUs only process images
  answer_index: 1
  explanation: Dense embeddings excel at conceptual meaning but suffer from keyword blindness on exact
    alphanumeric identifiers.
- question: How does Reciprocal Rank Fusion (RRF) merge ranking lists from BM25 and vector search without
    suffering from uncalibrated score scale mismatches?
  options:
  - By multiplying raw scores together
  - 'By using the inverse of rank positions (formula: `RRF(d) = sum(1 / (k + rank_i(d)))`) rather than
    raw scores, making fusion completely invariant to differences in score scales and distributions'
  - By deleting the lower half of both lists
  - By sorting documents alphabetically
  answer_index: 1
  explanation: RRF operates on ordinal rank positions rather than arbitrary raw score scales, ensuring
    robust multi-modal search fusion.
- question: What is the architectural difference between a Bi-Encoder (Dense Vector Search) and a Cross-Encoder
    (Reranker)?
  options:
  - Bi-encoders embed query and document independently into separate vectors (allowing sub-millisecond
    fast approximate nearest neighbor search over millions of docs), whereas Cross-encoders feed query
    and document concatenated into a full self-attention transformer together (achieving superior accuracy
    at high computational cost per pair)
  - Bi-encoders run on CPUs; Cross-encoders run only in memory
  - They are identical models with different brand names
  - Bi-encoders only work in English
  answer_index: 0
  explanation: Bi-encoders enable fast indexable vector search; Cross-encoders provide deep full-attention
    cross-scoring for the top-k candidates.
- question: What is the standard recommended two-stage retrieval pipeline in production RAG systems?
  options:
  - Retrieve top-1 million docs and prompt the LLM directly
  - 'Stage 1: Retrieve top-50 to top-100 candidates using fast Hybrid Search (BM25 + Dense Vectors + RRF);
    Stage 2: Rerank the candidates with a Neural Cross-Encoder to select the top-5 most relevant passages
    for the context window'
  - Randomly pick 5 documents from the database
  - Run a linear regression on file size
  answer_index: 1
  explanation: Stage 1 casts a wide, fast hybrid net; Stage 2 applies heavy cross-attention scoring to
    pick the top 5 high-precision passages.
- question: What is the role of the smoothing constant `k` (typically `k = 60`) in the Reciprocal Rank
    Fusion formula?
  options:
  - It specifies the maximum number of documents to return
  - It prevents high-ranking outliers in one list from overwhelmingly dominating documents that appear
    consistently across multiple lists
  - It sets the GPU temperature
  - It limits the query word count
  answer_index: 1
  explanation: The rank constant k=60 prevents top-1 dominance and rewards consensus across multiple search
    modalities.
