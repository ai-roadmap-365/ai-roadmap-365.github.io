<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Two-Stage Hybrid Search and Reranking Pipeline">
  <title>Two-Stage Hybrid Search and Reranking Pipeline</title>
  <defs>
    <style>
      .d323a-bg { fill: #f8fafc; }
      .d323a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d323a-s1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d323a-s2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d323a-s3 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d323a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d323a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d323a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d323a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d323a-bg" />
  
  <text x="40" y="40" class="d323a-title">Two-Stage Hybrid Search &amp; Reranking Pipeline</text>
  <text x="40" y="65" class="d323a-subtitle">Two-Stage Hybrid Search and Reranking Pipeline showing Stage 1 Parallel BM25 and Vector Search with RRF Fusion (Top 50), and Stage 2 Cross-Encoder Reranker delivering Top 5 to LLM Context</text>
  
  <!-- Stage 1A: Sparse & Dense Search -->
  <rect x="40" y="110" width="250" height="270" class="d323a-s1" />
  <text x="60" y="145" class="d323a-header" fill="#1d4ed8">Stage 1A: Parallel Retrieval</text>
  <text x="60" y="180" class="d323a-text">• **Dense Vector Search:**</text>
  <text x="60" y="200" class="d323a-text">  Cosine similarity (Top 50)</text>
  <text x="60" y="220" class="d323a-text">  Captures semantic intent</text>
  <text x="60" y="250" class="d323a-text">• **Sparse BM25 Search:**</text>
  <text x="60" y="270" class="d323a-text">  Lexical term frequency (Top 50)</text>
  <text x="60" y="290" class="d323a-text">  Captures exact serials / IDs</text>
  <text x="60" y="325" class="d323a-text" font-weight="600" fill="#1d4ed8">Latency: 10 - 25ms</text>
  
  <!-- Stage 1B: RRF Fusion -->
  <rect x="325" y="110" width="250" height="270" class="d323a-s2" />
  <text x="345" y="145" class="d323a-header" fill="#7e22ce">Stage 1B: RRF Rank Fusion</text>
  <text x="345" y="180" class="d323a-text">• Score-invariant rank fusion</text>
  <text x="345" y="205" class="d323a-text">• `RRF = sum(1 / (60 + rank_i))`</text>
  <text x="345" y="230" class="d323a-text">• Eliminates score normalization</text>
  <text x="345" y="255" class="d323a-text">• Merges Top 100 candidate pool</text>
  <text x="345" y="280" class="d323a-text">• Selects Top 50 diverse candidates</text>
  <text x="345" y="325" class="d323a-text" font-weight="600" fill="#7e22ce">Latency: under 2ms</text>
  
  <!-- Stage 2: Neural Reranking -->
  <rect x="610" y="110" width="250" height="270" class="d323a-s3" />
  <text x="630" y="145" class="d323a-header" fill="#15803d">Stage 2: Cross-Encoder Rerank</text>
  <text x="630" y="180" class="d323a-text">• Concatenated `[Q; D]` attention</text>
  <text x="630" y="205" class="d323a-text">• Deep cross-attention scoring</text>
  <text x="630" y="230" class="d323a-text">• Filters false-positive hits</text>
  <text x="630" y="255" class="d323a-text">• **Top 5 High-Precision Passages**</text>
  <text x="630" y="280" class="d323a-text">• Dispatched to LLM prompt</text>
  <text x="630" y="325" class="d323a-text" font-weight="600" fill="#15803d">Latency: 20 - 45ms</text>
</svg>