<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Bi-Encoder vs Cross-Encoder Attention Topology">
  <title>Bi-Encoder vs Cross-Encoder Attention Topology</title>
  <defs>
    <style>
      .d323b-bg { fill: #f8fafc; }
      .d323b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d323b-bi { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d323b-cross { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d323b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d323b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d323b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d323b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d323b-bg" />
  
  <text x="40" y="40" class="d323a-title">Retrieval Models: Bi-Encoder vs Cross-Encoder</text>
  <text x="40" y="65" class="d323a-subtitle">Bi-Encoder vs Cross-Encoder Attention Topology comparing Independent Vector Dot Product (Bi-Encoder) with Full Self-Attention Joint Interaction (Cross-Encoder)</text>
  
  <!-- Bi-Encoder -->
  <rect x="40" y="110" width="390" height="270" class="d323b-bi" />
  <text x="60" y="145" class="d323b-header" fill="#1d4ed8">Bi-Encoder (Dense Embeddings)</text>
  <text x="60" y="180" class="d323b-text">• **Architecture:** Independent BERT encoders</text>
  <text x="60" y="205" class="d323b-text">• **Scoring:** Dot Product / Cosine Distance</text>
  <text x="60" y="230" class="d323b-text">• **Scale:** 10,000,000+ indexed passages</text>
  <text x="60" y="255" class="d323b-text">• **Precomputation:** Document vectors cached in HNSW</text>
  <text x="60" y="280" class="d323b-text">• **Trade-off:** Fast search, but no token-to-token attention</text>
  <text x="60" y="320" class="d323b-text" font-weight="600" fill="#1d4ed8">Role: Stage 1 Candidate Selection (Fast)</text>
  
  <!-- Cross-Encoder -->
  <rect x="470" y="110" width="390" height="270" class="d323b-cross" />
  <text x="490" y="145" class="d323b-header" fill="#7e22ce">Cross-Encoder (Neural Reranker)</text>
  <text x="490" y="180" class="d323b-text">• **Architecture:** Single Transformer over `[Q; D]`</text>
  <text x="490" y="205" class="d323b-text">• **Scoring:** Full bidirectional cross-attention matrix</text>
  <text x="490" y="230" class="d323b-text">• **Scale:** Max 50 - 100 candidate pairs</text>
  <text x="490" y="255" class="d323b-text">• **Precomputation:** None (Requires live inference per pair)</text>
  <text x="490" y="280" class="d323b-text">• **Trade-off:** High precision, but compute intensive</text>
  <text x="490" y="320" class="d323b-text" font-weight="600" fill="#7e22ce">Role: Stage 2 High-Precision Reranking</text>
</svg>