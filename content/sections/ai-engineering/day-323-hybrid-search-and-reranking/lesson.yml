title: Hybrid Search and Reranking
section: ai-engineering
subsection: production-retrieval-and-pipelines
week: 47
learning_promise: 'Master state-of-the-art hybrid information retrieval: fuse dense vector embeddings
  with sparse BM25 lexical search using Reciprocal Rank Fusion (RRF) and filter top-k passages with neural
  cross-encoder rerankers in Python.'
objectives:
- Deconstruct the fundamental failure modes of pure dense vector search (keyword blindness, exact serial
  number failures, out-of-domain vocabulary).
- Implement BM25 sparse keyword scoring alongside dense vector embeddings.
- Implement Reciprocal Rank Fusion (RRF) with rank constant k=60 to merge disparate score distributions
  into a single calibrated ranking.
- Build a production-grade Hybrid Search & Reranking Engine in Python combining BM25, vector search, RRF
  fusion, and cross-encoder scoring.
- Evaluate precision vs latency trade-offs between two-stage retrieval (Retrieve top-50 -> Rerank top-5)
  and single-stage vector scan.
