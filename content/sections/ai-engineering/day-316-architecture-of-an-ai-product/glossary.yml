terms:
- term: AI Product Architecture
  definition: The end-to-end system design uniting UI clients, streaming gateways, orchestration engines,
    retrieval pipelines, and model routers.
- term: Server-Sent Events (SSE)
  definition: A unidirectional HTTP protocol allowing servers to stream text tokens and event payloads
    continuously to clients.
- term: Model Router
  definition: Middleware routing incoming prompts to specific models based on cost, latency, capability,
    or provider health.
- term: Orchestration Layer
  definition: The backend system assembling prompt context, history, tools, and guardrails before model
    execution.
- term: Multi-Tenant Boundary
  definition: Architectural isolation ensuring users and organizations only access their own private context
    and data.
- term: Asynchronous Job Queue
  definition: A background task processing system executing long-running AI workloads off the main request
    thread.
- term: Time to First Token (TTFT)
  definition: The latency from user prompt submission to receiving the first streamed token on the frontend.
- term: Edge Gateway
  definition: A distributed reverse proxy terminating TLS, authenticating tokens, and applying rate limits
    close to users.
