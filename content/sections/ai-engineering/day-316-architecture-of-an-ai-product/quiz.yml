questions:
- question: Why should a production AI application never call LLM provider APIs directly from client-side
    frontend code (e.g. browser JavaScript or mobile app)?
  options:
  - Because browsers cannot parse JSON
  - Because client-side API calls expose private provider API keys, bypass backend rate limiting, prevent
    server-side prompt injection guardrails, eliminate prompt caching, and prevent accurate multi-tenant
    billing attribution
  - Because Python cannot run in browsers
  - Because language models only respond to Linux servers
  answer_index: 1
  explanation: Backend gateways protect credentials, enforce rate limits, apply guardrails, and track
    billing.
- question: What is the primary architectural advantage of Server-Sent Events (SSE) over WebSockets for
    text generation streaming?
  options:
  - SSE is unidirectional (server-to-client), operates over standard HTTP/2, automatically reconnects,
    works seamlessly with standard CDN edge caching and proxies, and avoids stateful WebSocket connection
    overhead for simple request-response chats
  - SSE encrypts all data with quantum cryptography
  - SSE does not require internet access
  - SSE makes models generate text faster
  answer_index: 0
  explanation: SSE provides lightweight, standard HTTP streaming without the complex bidirectional state
    management of WebSockets.
- question: In a layered full-stack AI architecture, what is the role of the 'Orchestration Middleware'
    layer?
  options:
  - To draw UI buttons on screen
  - To assemble system prompts, retrieve context chunks from vector and relational databases, enforce
    session memory windows, validate tool calling schemas, and dispatch requests to model routers
  - To reboot the server every 10 minutes
  - To replace DNS servers
  answer_index: 1
  explanation: Orchestration middleware acts as the brain uniting retrieval, session memory, prompts,
    and model dispatch.
- question: How does an Asynchronous Task Queue (e.g. Celery, Redis Streams, SQS) complement a synchronous
    streaming API gateway?
  options:
  - By converting text into audio files
  - By handling long-running background tasks (e.g. multi-page document ingestion, video transcription,
    batch evaluations, and complex multi-agent deep research) without holding open HTTP client connections
    that risk browser timeouts
  - By disabling database transactions
  - By encrypting the user interface
  answer_index: 1
  explanation: Async queues offload heavy, multi-minute processing tasks from real-time interactive user
    threads.
- question: What is the function of the 'Model Router / Vendor Abstraction Layer' in an enterprise AI
    system?
  options:
  - To prevent developers from writing code
  - To provide a unified SDK interface across diverse LLM providers (OpenAI, Anthropic, Google, local
    vLLM), manage automatic failover on outages, load-balance across API keys, and route easy queries
    to cheaper compact models
  - To shut down the database when traffic is high
  - To translate Python into C++
  answer_index: 1
  explanation: Vendor abstraction enables vendor portability, automatic failover, and intelligent price-performance
    routing.
