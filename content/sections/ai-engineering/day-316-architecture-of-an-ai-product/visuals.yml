visuals:
- id: full-stack-ai-product-system-topology
  file: assets/full-stack-ai-product-system-topology.svg
  type: diagram
  title: Full-Stack AI Product System Topology
  alt: Full-Stack AI Product System Topology showing Client UI, Edge API Gateway (Auth & Rate Limit),
    Streaming Orchestrator, Context & Memory Store, Model Router, and LLM Providers
  description: System architecture diagram illustrating the end-to-end multi-tier topology of a production
    AI product.
- id: synchronous-streaming-vs-async-job-flow
  file: assets/synchronous-streaming-vs-async-job-flow.svg
  type: diagram
  title: Synchronous Streaming vs Async Job Flow
  alt: Synchronous Streaming vs Async Job Flow comparing Real-time SSE Token Streaming (under 1s TTFT) with
    Asynchronous Task Queue Execution (Celery/Redis for multi-minute jobs)
  description: Architectural comparison between real-time streaming and asynchronous batch task execution.
- id: five-tiers
  file: assets/five-tiers.svg
  type: diagram
  title: 'Five tiers'
  alt: 'Diagram: the five tiers of a production AI product architecture'
  description: 'A five-stage description of AI product architecture covering the client, the edge gateway, orchestration, model routing and asynchronous workers.'
- id: three-tier-or-compound
  file: assets/three-tier-or-compound.svg
  type: diagram
  title: 'A web app, or a compound AI system'
  alt: 'Diagram: a classic three-tier web architecture compared with a compound AI architecture'
  description: 'A two-column comparison of a conventional synchronous web architecture against a streaming AI product architecture.'
- id: product-lineage
  file: assets/product-lineage.svg
  type: diagram
  title: 'Three architectural eras'
  alt: 'Diagram: the progression from three-tier web apps to compound AI architectures'
  description: 'A three-stage progression of application architecture from classic three-tier through LLM wrappers to decoupled compound AI systems.'
- id: sync-or-async
  file: assets/sync-or-async.svg
  type: diagram
  title: 'Blocking workers, or a queue'
  alt: 'Diagram: synchronous request workers compared with queued asynchronous generation'
  description: 'A two-column comparison of running model calls inside synchronous request workers against queuing them for async workers.'
- id: session-state
  file: assets/session-state.svg
  type: diagram
  title: 'Where conversation state lives'
  alt: 'Diagram: the tiered storage of AI conversation state'
  description: 'A three-stage description of conversation state storage covering client payloads, an in-memory cache and cold archival storage.'
- id: airport-terminal
  file: assets/airport-terminal.svg
  type: diagram
  title: 'An airport terminal'
  alt: 'Diagram: an airport terminal as an analogy for AI product architecture tiers'
  description: 'A two-column comparison mapping airport operations onto AI product architecture layers.'
- id: product-failures
  file: assets/product-failures.svg
  type: diagram
  title: 'Four vulnerabilities the layers close'
  alt: 'Diagram: the four failure modes a layered AI architecture prevents'
  description: 'A four-stage description of AI product failures covering client credential exposure, gateway timeouts, provider outages and tenant data mixing.'
- id: tenant-isolation
  file: assets/tenant-isolation.svg
  type: diagram
  title: 'Isolating tenants in a vector index'
  alt: 'Diagram: partitioned tenant vector storage compared with filtered shared storage'
  description: 'A two-column comparison of hard tenant isolation in vector storage against relying on query-time filtering.'
- id: edge-checklist
  file: assets/edge-checklist.svg
  type: diagram
  title: 'Four edge-tier requirements'
  alt: 'Diagram: the four verification checks for an AI product''s edge tier'
  description: 'A four-stage checklist covering async servers, rate limiter ordering, session expiry and connection multiplexing.'
- id: architecture-when
  file: assets/architecture-when.svg
  type: diagram
  title: 'When the full architecture is warranted'
  alt: 'Diagram: when a full multi-tier AI architecture is warranted'
  description: 'A two-column comparison of products requiring a full layered architecture against prototypes.'
