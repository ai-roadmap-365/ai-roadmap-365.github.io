<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each owns one concern.">
  <title>Five tiers</title>
  <style>
    .five-tiers-bg   { fill: #f8fafc; }
    .five-tiers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-tiers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-tiers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-tiers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-tiers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-tiers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .five-tiers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .five-tiers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .five-tiers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .five-tiers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .five-tiers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .five-tiers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .five-tiers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .five-tiers-stage { opacity: 1; }

    .five-tiers-s0 { animation-delay: 0.00s; }
    .five-tiers-e0 { animation-delay: 0.00s; }
    .five-tiers-s1 { animation-delay: 1.33s; }
    .five-tiers-e1 { animation-delay: 1.33s; }
    .five-tiers-s2 { animation-delay: 2.67s; }
    .five-tiers-e2 { animation-delay: 2.67s; }
    .five-tiers-s3 { animation-delay: 4.00s; }
    .five-tiers-e3 { animation-delay: 4.00s; }
    .five-tiers-s4 { animation-delay: 5.33s; }
    .five-tiers-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .five-tiers-conn  { animation: five-tiers-trace 8s ease-in-out infinite; }
      .five-tiers-stage { animation: five-tiers-arrive 8s ease-in-out infinite; }
    }
    @keyframes five-tiers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes five-tiers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .five-tiers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .five-tiers-stage { animation: five-tiers-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes five-tiers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="five-tiers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="five-tiers-bg" width="980" height="322"/>
  <text class="five-tiers-h1"  x="30" y="40">Five tiers</text>
  <text class="five-tiers-sub" x="30" y="64">Each owns one concern.</text>
  <g class="five-tiers-stage five-tiers-s0">
    <rect class="five-tiers-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="five-tiers-step" x="44" y="142">01</text>
    <text class="five-tiers-name" x="70" y="142">Client</text>
    <text class="five-tiers-desc" x="44" y="166">Renders a stream. Never</text>
    <text class="five-tiers-desc" x="44" y="182">holds a provider</text>
    <text class="five-tiers-desc" x="44" y="198">credential.</text>
  </g>
  <line class="five-tiers-line five-tiers-conn five-tiers-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#five-tiers-tip)"/>
  <g class="five-tiers-stage five-tiers-s1">
    <rect class="five-tiers-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="five-tiers-step" x="233" y="142">02</text>
    <text class="five-tiers-name" x="259" y="142">Edge gateway</text>
    <text class="five-tiers-desc" x="233" y="166">Authentication, rate</text>
    <text class="five-tiers-desc" x="233" y="182">limits, credit quota —</text>
    <text class="five-tiers-desc" x="233" y="198">before anything</text>
    <text class="five-tiers-edge" x="233" y="242">cheap checks first</text>
  </g>
  <line class="five-tiers-line five-tiers-conn five-tiers-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#five-tiers-tip)"/>
  <g class="five-tiers-stage five-tiers-s2">
    <rect class="five-tiers-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="five-tiers-step" x="422" y="142">03</text>
    <text class="five-tiers-name" x="448" y="142">Orchestration</text>
    <text class="five-tiers-desc" x="422" y="166">Prompt assembly,</text>
    <text class="five-tiers-desc" x="422" y="182">retrieval, memory,</text>
    <text class="five-tiers-desc" x="422" y="198">guardrails.</text>
  </g>
  <line class="five-tiers-line five-tiers-conn five-tiers-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#five-tiers-tip)"/>
  <g class="five-tiers-stage five-tiers-s3">
    <rect class="five-tiers-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="five-tiers-step" x="611" y="142">04</text>
    <text class="five-tiers-name" x="637" y="142">Model router</text>
    <text class="five-tiers-desc" x="611" y="166">Provider selection,</text>
    <text class="five-tiers-desc" x="611" y="182">failover, semantic cache.</text>
  </g>
  <line class="five-tiers-line five-tiers-conn five-tiers-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#five-tiers-tip)"/>
  <g class="five-tiers-stage five-tiers-s4">
    <rect class="five-tiers-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="five-tiers-step" x="800" y="142">05</text>
    <text class="five-tiers-name" x="826" y="142">Async workers</text>
    <text class="five-tiers-desc" x="800" y="166">Ingestion, evaluation,</text>
    <text class="five-tiers-desc" x="800" y="182">anything that must not</text>
    <text class="five-tiers-desc" x="800" y="198">block a request.</text>
  </g>
  <text class="five-tiers-sub" x="30" y="304">The ordering of the second tier is the important detail: quota and rate checks belong before tokenisation and embedding, because the point is to reject cheaply rather than to reject accurately.</text>
</svg>
