<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Five hundred requests decides it.">
  <title>Blocking workers, or a queue</title>
  <style>
    .sync-or-async-bg   { fill: #f8fafc; }
    .sync-or-async-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sync-or-async-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sync-or-async-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sync-or-async-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sync-or-async-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sync-or-async-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sync-or-async-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sync-or-async-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sync-or-async-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sync-or-async-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sync-or-async-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sync-or-async-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sync-or-async-row { opacity: 1; }
    .sync-or-async-r0 { animation-delay: 0.00s; }
    .sync-or-async-r1 { animation-delay: 0.45s; }
    .sync-or-async-r2 { animation-delay: 0.90s; }
    .sync-or-async-r3 { animation-delay: 1.35s; }
    .sync-or-async-r4 { animation-delay: 1.80s; }
    .sync-or-async-row { animation: sync-or-async-reveal 7.3s ease-in-out infinite; }
    @keyframes sync-or-async-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sync-or-async-bg" width="980" height="390"/>
  <text class="sync-or-async-h1"  x="30" y="40">Blocking workers, or a queue</text>
  <text class="sync-or-async-sub" x="30" y="64">Five hundred requests decides it.</text>
  <rect class="sync-or-async-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sync-or-async-name" x="46" y="122">Synchronous workers</text>
  <text class="sync-or-async-desc" x="46" y="142">Blocked for the whole generation.</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r0" x="46" y="182">A 12-second call holds a worker thread</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r1" x="46" y="216">500 concurrent requests exhausts the pool</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r2" x="46" y="250">New connections get 504s</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r3" x="46" y="284">Including requests that need no model</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r4" x="46" y="318">The whole gateway degrades</text>
  <rect class="sync-or-async-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sync-or-async-name" x="526" y="122">Queued and async</text>
  <text class="sync-or-async-desc" x="526" y="142">Accepted immediately.</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r0" x="526" y="182">Accept at the edge, issue a job id</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r1" x="526" y="216">Enqueue to a stream</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r2" x="526" y="250">Return 202, or open an SSE channel</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r3" x="526" y="284">Async workers pull and stream chunks</text>
  <text class="sync-or-async-desc sync-or-async-row sync-or-async-r4" x="526" y="318">The gateway stays responsive</text>
  <text class="sync-or-async-sub" x="30" y="372">The detail that makes this urgent is the fourth row on the left: a blocked pool rejects everything, including cheap requests that would have completed instantly.</text>
</svg>
