<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Check-in, gate, fleet, freight.">
  <title>An airport terminal</title>
  <style>
    .airport-terminal-bg   { fill: #f8fafc; }
    .airport-terminal-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-terminal-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-terminal-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-terminal-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-terminal-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-terminal-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .airport-terminal-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .airport-terminal-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .airport-terminal-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .airport-terminal-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .airport-terminal-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .airport-terminal-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .airport-terminal-row { opacity: 1; }
    .airport-terminal-r0 { animation-delay: 0.00s; }
    .airport-terminal-r1 { animation-delay: 0.45s; }
    .airport-terminal-r2 { animation-delay: 0.90s; }
    .airport-terminal-r3 { animation-delay: 1.35s; }
    .airport-terminal-r4 { animation-delay: 1.80s; }
    .airport-terminal-row { animation: airport-terminal-reveal 7.3s ease-in-out infinite; }
    @keyframes airport-terminal-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="airport-terminal-bg" width="980" height="390"/>
  <text class="airport-terminal-h1"  x="30" y="40">An airport terminal</text>
  <text class="airport-terminal-sub" x="30" y="64">Check-in, gate, fleet, freight.</text>
  <rect class="airport-terminal-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="airport-terminal-name" x="46" y="122">The terminal</text>
  <text class="airport-terminal-desc" x="46" y="142">Four systems.</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r0" x="46" y="182">Check-in verifies and issues passes</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r1" x="46" y="216">The gate organises boarding</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r2" x="46" y="250">The fleet is matched to the route</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r3" x="46" y="284">Freight moves on separate aircraft</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r4" x="46" y="318">Nothing blocks anything else</text>
  <rect class="airport-terminal-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="airport-terminal-name" x="526" y="122">The product</text>
  <text class="airport-terminal-desc" x="526" y="142">The same four.</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r0" x="526" y="182">The gateway authenticates and meters</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r1" x="526" y="216">The orchestrator assembles context</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r2" x="526" y="250">The router selects a model</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r3" x="526" y="284">Async workers do ingestion</text>
  <text class="airport-terminal-desc airport-terminal-row airport-terminal-r4" x="526" y="318">And the request path stays clear</text>
  <text class="airport-terminal-sub" x="30" y="372">Matching aircraft to route is the model router's job stated plainly: a wide-body for a long haul and a turboprop for a short hop is the same decision as a frontier model for reasoning and a small one for classification.</text>
</svg>
