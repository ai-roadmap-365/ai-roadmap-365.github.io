<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Synchronous Streaming vs Async Job Flow">
  <title>Synchronous Streaming vs Async Job Flow</title>
  <defs>
    <style>
      .d316f-bg { fill: #f8fafc; }
      .d316f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d316f-sync { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d316f-async { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d316f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d316f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d316f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d316f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d316f-bg" />
  
  <text x="40" y="40" class="d316a-title">Synchronous Streaming vs Asynchronous Task Queues</text>
  <text x="40" y="65" class="d316a-subtitle">Synchronous Streaming vs Async Job Flow comparing Real-time SSE Token Streaming (under 1s TTFT) with Asynchronous Task Queue Execution (Celery/Redis for multi-minute jobs)</text>
  
  <!-- Path A: Synchronous Real-Time Streaming -->
  <rect x="40" y="110" width="390" height="270" class="d316f-sync" />
  <text x="60" y="145" class="d316f-header" fill="#1d4ed8">A. Real-Time Streaming (SSE / HTTP/2)</text>
  <text x="60" y="180" class="d316f-text">• **Use Case:** Interactive Chat, Copilot Auto-complete</text>
  <text x="60" y="205" class="d316f-text">• **Latency:** Time to First Token (TTFT) under 500ms</text>
  <text x="60" y="230" class="d316f-text">• **Transport:** Server-Sent Events (SSE) `text/event-stream`</text>
  <text x="60" y="255" class="d316f-text">• **Connection:** Single open HTTP stream per request</text>
  <text x="60" y="280" class="d316f-text">• **Failure Mode:** Client disconnect aborts model stream</text>
  <text x="60" y="320" class="d316f-text" font-weight="600" fill="#1d4ed8">Direct Streaming Response</text>
  
  <!-- Path B: Asynchronous Job Queue -->
  <rect x="470" y="110" width="390" height="270" class="d316f-async" />
  <text x="490" y="145" class="d316f-header" fill="#7e22ce">B. Asynchronous Job Queue (Celery / SQS)</text>
  <text x="490" y="180" class="d316f-text">• **Use Case:** Document Ingestion, Video Parsing, Evals</text>
  <text x="490" y="205" class="d316f-text">• **Latency:** Seconds to hours (decoupled from UI)</text>
  <text x="490" y="230" class="d316f-text">• **Transport:** `POST /jobs` -> returns `job_id: 202 Accepted`</text>
  <text x="490" y="255" class="d316f-text">• **Notification:** Webhook callback or client polling</text>
  <text x="490" y="280" class="d316f-text">• **Resilience:** Automatic retry on worker crash / OOM</text>
  <text x="490" y="320" class="d316f-text" font-weight="600" fill="#7e22ce">Decoupled Background Execution</text>
</svg>