<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three tiers, by age.">
  <title>Where conversation state lives</title>
  <style>
    .session-state-bg   { fill: #f8fafc; }
    .session-state-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .session-state-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .session-state-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .session-state-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .session-state-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .session-state-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .session-state-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .session-state-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .session-state-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .session-state-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .session-state-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .session-state-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .session-state-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .session-state-stage { opacity: 1; }

    .session-state-s0 { animation-delay: 0.00s; }
    .session-state-e0 { animation-delay: 0.00s; }
    .session-state-s1 { animation-delay: 1.50s; }
    .session-state-e1 { animation-delay: 1.50s; }
    .session-state-s2 { animation-delay: 3.00s; }
    .session-state-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .session-state-conn  { animation: session-state-trace 6s ease-in-out infinite; }
      .session-state-stage { animation: session-state-arrive 6s ease-in-out infinite; }
    }
    @keyframes session-state-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes session-state-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .session-state-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .session-state-stage { animation: session-state-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes session-state-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="session-state-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="session-state-bg" width="980" height="322"/>
  <text class="session-state-h1"  x="30" y="40">Where conversation state lives</text>
  <text class="session-state-sub" x="30" y="64">Three tiers, by age.</text>
  <g class="session-state-stage session-state-s0">
    <rect class="session-state-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="session-state-step" x="44" y="142">01</text>
    <text class="session-state-name" x="70" y="142">Not in the client</text>
    <text class="session-state-desc" x="44" y="166">A full transcript in cookies or local storage</text>
    <text class="session-state-desc" x="44" y="182">is network payload on every request.</text>
  </g>
  <line class="session-state-line session-state-conn session-state-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#session-state-tip)"/>
  <g class="session-state-stage session-state-s1">
    <rect class="session-state-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="session-state-step" x="359" y="142">02</text>
    <text class="session-state-name" x="385" y="142">Active window in memory</text>
    <text class="session-state-desc" x="359" y="166">A Redis cluster with a sliding TTL of a</text>
    <text class="session-state-desc" x="359" y="182">couple of days.</text>
    <text class="session-state-edge" x="359" y="242">48h</text>
  </g>
  <line class="session-state-line session-state-conn session-state-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#session-state-tip)"/>
  <g class="session-state-stage session-state-s2">
    <rect class="session-state-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="session-state-step" x="674" y="142">03</text>
    <text class="session-state-name" x="700" y="142">Older turns archived</text>
    <text class="session-state-desc" x="674" y="166">Asynchronously, to a relational store and</text>
    <text class="session-state-desc" x="674" y="182">object storage.</text>
  </g>
  <text class="session-state-sub" x="30" y="304">The sliding expiry is what prevents the memory tier becoming permanent storage: without it, every conversation ever started stays resident and the cluster runs out of memory on a Tuesday.</text>
</svg>
