visuals:
  - id: six-stages-three-seams
    file: assets/six-stages-three-seams.svg
    type: diagram
    title: Six Stages, Three Seams
    alt: Six Stages, Three Seams showing the assembled pipeline from ingestion through processing,
      freshness, retrieval, cost and privacy, with the three interactions that only appear once the
      stages share a system
    description: The six week-47 stages in sequence, with the three seams — ordering, one ledger, and
      the deletion path — that no single day's tests can reach.
  - id: what-the-ledger-shows
    file: assets/what-the-ledger-shows.svg
    type: diagram
    title: What the Ledger Shows
    alt: What the Ledger Shows showing spend attributed across retrieval, the small model, the large
      model and the cache for three questions
    description: Measured spend attributed by stage, showing one reasoning question accounting for
      ninety-one percent of cost and retrieval sharing the same request budget.
  - id: three-shared-structures
    file: assets/three-shared-structures.svg
    type: diagram
    title: 'Three shared structures'
    alt: 'Diagram: the three structures shared across the stages of a production assistant'
    description: 'A three-stage description of the shared structures in a production assistant covering the checkpoint, the ledger and the deletion path.'
  - id: seams-or-components
    file: assets/seams-or-components.svg
    type: diagram
    title: 'Components, or seams'
    alt: 'Diagram: components tested in isolation compared with the interactions between them'
    description: 'A two-column comparison of individually correct components against the failures that appear only when they share a pipeline.'
  - id: integration-lineage
    file: assets/integration-lineage.svg
    type: diagram
    title: 'Four ideas this rests on'
    alt: 'Diagram: the engineering traditions that inform production assistant assembly'
    description: 'A four-stage progression from integration testing through the end-to-end argument and pipelines-as-products to production RAG.'
  - id: assistant-stages
    file: assets/assistant-stages.svg
    type: diagram
    title: 'Four stages, and their constraints'
    alt: 'Diagram: the four stages of the assembled assistant and the ordering constraint on each'
    description: 'A four-stage description of the assistant covering ingestion, retrieval, answering and erasure, with the constraint each imposes.'
  - id: ordering-costs
    file: assets/ordering-costs.svg
    type: diagram
    title: 'Five failures, all ordering'
    alt: 'Diagram: the five integration failures of a retrieval assistant and their fixes'
    description: 'A five-stage description of integration failures covering compositional failure, late redaction, uncapped paths, partial erasure and accidental permanence.'
  - id: kitchen-seams
    file: assets/kitchen-seams.svg
    type: diagram
    title: 'A kitchen where every station passed'
    alt: 'Diagram: individually inspected kitchen stations compared with the handoffs between them'
    description: 'A two-column comparison of independently correct kitchen stations against the coordination between them.'
  - id: assistant-evidence
    file: assets/assistant-evidence.svg
    type: diagram
    title: 'Three runs, three properties'
    alt: 'Diagram: the three measured properties of the assembled assistant'
    description: 'A four-stage reading of the assistant''s end-to-end run covering dead-lettering, pre-index redaction, cost attribution and verified erasure.'
  - id: not-scale
    file: assets/not-scale.svg
    type: diagram
    title: 'What the assistant is not'
    alt: 'Diagram: what the assembled assistant demonstrates compared with what it is not'
    description: 'A two-column comparison of the properties the assistant demonstrates against the things it deliberately is not.'
  - id: assistant-implications
    file: assets/assistant-implications.svg
    type: diagram
    title: 'Three consequences of the assembly'
    alt: 'Diagram: the security, privacy and cost implications of the assistant''s ordering decisions'
    description: 'A three-stage description of the implications of the assistant''s structure covering the unified ledger, boundary redaction and verified erasure.'
  - id: assistant-when
    file: assets/assistant-when.svg
    type: diagram
    title: 'What to carry forward'
    alt: 'Diagram: the properties worth carrying into any production AI system'
    description: 'A two-column comparison of the properties this assistant demonstrates against the production concerns it does not address.'
  - id: three-seam-questions
    file: assets/three-seam-questions.svg
    type: diagram
    title: 'Three questions the seams ask'
    alt: 'Diagram: the three integration questions that decide the assistant''s structure'
    description: 'A two-column comparison of the three seam questions against the answers that must be chosen at assembly time.'
