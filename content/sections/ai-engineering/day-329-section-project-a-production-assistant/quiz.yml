questions:
  - question: Why must redaction run before chunking rather than after retrieval?
    options:
      - Because retrieval is too slow to redact during
      - 'The identifiers are already inside the embeddings'
      - Because chunking strips punctuation that the detectors rely on
      - It makes no difference; both orderings produce the same index
    answer_index: 1
    explanation: The ordering is nearly free while building and genuinely expensive to retrofit, which is
      the whole argument for fixing it at assembly time.
  - question: What does charging retrieval to the same ledger as generation make visible?
    options:
      - The total number of documents in the index
      - The latency of each retrieval call
      - 'A recall setting is also a cost setting'
      - Which embedding model is in use
    answer_index: 2
    explanation: One budget per request rather than per component is what makes the cap meaningful, and
      it is invisible while the stages are studied separately.
  - question: An erasure clears a document's chunks and its cached answers but leaves its content hash.
      What breaks, and when?
    options:
      - Nothing breaks; the hash is only used for reporting
      - Retrieval starts returning the deleted document again
      - The index grows without bound
      - 'A re-ingest sees the stale hash and never restores it'
    answer_index: 3
    explanation: The hash is part of the subject's stored state. Leaving it turns a reversible deletion
      into an irreversible one that nobody chose and nobody notices.
  - question: Why does the cursor advance even for a dead-lettered document?
    options:
      - 'It would retry the poison document on every run'
      - To keep the statistics tidy
      - Because dead letters are stored in the cursor
      - It should not advance; that is a bug
    answer_index: 0
    explanation: Head-of-line blocking is the failure being avoided. The dead-letter queue is the record
      of outstanding work, and the cursor records that the pipeline is finished with the record.
  - question: Why does this project test its properties on five documents rather than five thousand?
    options:
      - Because larger corpora are too slow to embed
      - 'These properties hold or fail regardless of scale'
      - Because five documents is the maximum a hashing vectoriser supports
      - Because the tests would become non-deterministic at scale
    answer_index: 1
    explanation: What changes with scale is the retrieval strategy, and that plugs into the same ledger.
      The seams are the subject, and seams are size-independent.
