<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cheap now, expensive later.">
  <title>Five failures, all ordering</title>
  <style>
    .ordering-costs-bg   { fill: #f8fafc; }
    .ordering-costs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ordering-costs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ordering-costs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ordering-costs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ordering-costs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ordering-costs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ordering-costs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ordering-costs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ordering-costs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ordering-costs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ordering-costs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ordering-costs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ordering-costs-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ordering-costs-stage { opacity: 1; }

    .ordering-costs-s0 { animation-delay: 0.00s; }
    .ordering-costs-e0 { animation-delay: 0.00s; }
    .ordering-costs-s1 { animation-delay: 1.33s; }
    .ordering-costs-e1 { animation-delay: 1.33s; }
    .ordering-costs-s2 { animation-delay: 2.67s; }
    .ordering-costs-e2 { animation-delay: 2.67s; }
    .ordering-costs-s3 { animation-delay: 4.00s; }
    .ordering-costs-e3 { animation-delay: 4.00s; }
    .ordering-costs-s4 { animation-delay: 5.33s; }
    .ordering-costs-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .ordering-costs-conn  { animation: ordering-costs-trace 8s ease-in-out infinite; }
      .ordering-costs-stage { animation: ordering-costs-arrive 8s ease-in-out infinite; }
    }
    @keyframes ordering-costs-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ordering-costs-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ordering-costs-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ordering-costs-stage { animation: ordering-costs-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ordering-costs-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ordering-costs-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ordering-costs-bg" width="980" height="322"/>
  <text class="ordering-costs-h1"  x="30" y="40">Five failures, all ordering</text>
  <text class="ordering-costs-sub" x="30" y="64">Cheap now, expensive later.</text>
  <g class="ordering-costs-stage ordering-costs-s0">
    <rect class="ordering-costs-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="ordering-costs-step" x="44" y="142">01</text>
    <text class="ordering-costs-name" x="70" y="142">Components that pass separately fail together</text>
    <text class="ordering-costs-desc" x="44" y="166">An interactions test</text>
    <text class="ordering-costs-desc" x="44" y="182">group no single suite</text>
    <text class="ordering-costs-desc" x="44" y="198">contains.</text>
  </g>
  <line class="ordering-costs-line ordering-costs-conn ordering-costs-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#ordering-costs-tip)"/>
  <g class="ordering-costs-stage ordering-costs-s1">
    <rect class="ordering-costs-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="ordering-costs-step" x="233" y="142">02</text>
    <text class="ordering-costs-name" x="259" y="142">Redaction added late</text>
    <text class="ordering-costs-desc" x="233" y="166">Retrofitting means</text>
    <text class="ordering-costs-desc" x="233" y="182">re-embedding, so it gets</text>
    <text class="ordering-costs-desc" x="233" y="198">deferred, so the exposure</text>
  </g>
  <line class="ordering-costs-line ordering-costs-conn ordering-costs-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#ordering-costs-tip)"/>
  <g class="ordering-costs-stage ordering-costs-s2">
    <rect class="ordering-costs-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="ordering-costs-step" x="422" y="142">03</text>
    <text class="ordering-costs-name" x="448" y="142">An uncapped path</text>
    <text class="ordering-costs-desc" x="422" y="166">Generation capped,</text>
    <text class="ordering-costs-desc" x="422" y="182">retrieval not. One ledger</text>
    <text class="ordering-costs-desc" x="422" y="198">per request closes it.</text>
  </g>
  <line class="ordering-costs-line ordering-costs-conn ordering-costs-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#ordering-costs-tip)"/>
  <g class="ordering-costs-stage ordering-costs-s3">
    <rect class="ordering-costs-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="ordering-costs-step" x="611" y="142">04</text>
    <text class="ordering-costs-name" x="637" y="142">Partial erasure</text>
    <text class="ordering-costs-desc" x="611" y="166">The delete reaches the</text>
    <text class="ordering-costs-desc" x="611" y="182">stores somebody</text>
    <text class="ordering-costs-desc" x="611" y="198">remembered. Verify by</text>
  </g>
  <line class="ordering-costs-line ordering-costs-conn ordering-costs-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#ordering-costs-tip)"/>
  <g class="ordering-costs-stage ordering-costs-s4">
    <rect class="ordering-costs-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="ordering-costs-step" x="800" y="142">05</text>
    <text class="ordering-costs-name" x="826" y="142">Deletion permanent by accident</text>
    <text class="ordering-costs-desc" x="800" y="166">Chunks cleared, hash</text>
    <text class="ordering-costs-desc" x="800" y="182">kept, re-ingest concludes</text>
    <text class="ordering-costs-desc" x="800" y="198">nothing changed.</text>
  </g>
  <text class="ordering-costs-sub" x="30" y="304">The last is the subtlest and the most surprising in practice: the document is deleted, the user re-uploads it, and the pipeline silently refuses to index it because a hash from before the deletion still matches.</text>
</svg>
