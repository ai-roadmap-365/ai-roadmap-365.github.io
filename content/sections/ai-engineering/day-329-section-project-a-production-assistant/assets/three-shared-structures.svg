<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The system is not the six stages.">
  <title>Three shared structures</title>
  <style>
    .three-shared-structures-bg   { fill: #f8fafc; }
    .three-shared-structures-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-shared-structures-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-shared-structures-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-shared-structures-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-shared-structures-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-shared-structures-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-shared-structures-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-shared-structures-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-shared-structures-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-shared-structures-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-shared-structures-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-shared-structures-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-shared-structures-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-shared-structures-stage { opacity: 1; }

    .three-shared-structures-s0 { animation-delay: 0.00s; }
    .three-shared-structures-e0 { animation-delay: 0.00s; }
    .three-shared-structures-s1 { animation-delay: 1.50s; }
    .three-shared-structures-e1 { animation-delay: 1.50s; }
    .three-shared-structures-s2 { animation-delay: 3.00s; }
    .three-shared-structures-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-shared-structures-conn  { animation: three-shared-structures-trace 6s ease-in-out infinite; }
      .three-shared-structures-stage { animation: three-shared-structures-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-shared-structures-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-shared-structures-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-shared-structures-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-shared-structures-stage { animation: three-shared-structures-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-shared-structures-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-shared-structures-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-shared-structures-bg" width="980" height="322"/>
  <text class="three-shared-structures-h1"  x="30" y="40">Three shared structures</text>
  <text class="three-shared-structures-sub" x="30" y="64">The system is not the six stages.</text>
  <g class="three-shared-structures-stage three-shared-structures-s0">
    <rect class="three-shared-structures-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-shared-structures-step" x="44" y="142">01</text>
    <text class="three-shared-structures-name" x="70" y="142">The checkpoint</text>
    <text class="three-shared-structures-desc" x="44" y="166">Makes ingestion resumable and incremental.</text>
    <text class="three-shared-structures-desc" x="44" y="182">Owned by ingestion; read by freshness.</text>
  </g>
  <line class="three-shared-structures-line three-shared-structures-conn three-shared-structures-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-shared-structures-tip)"/>
  <g class="three-shared-structures-stage three-shared-structures-s1">
    <rect class="three-shared-structures-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-shared-structures-step" x="359" y="142">02</text>
    <text class="three-shared-structures-name" x="385" y="142">The ledger</text>
    <text class="three-shared-structures-desc" x="359" y="166">Makes cost attributable. Must span retrieval</text>
    <text class="three-shared-structures-desc" x="359" y="182">and generation, or the cap does not bound a</text>
    <text class="three-shared-structures-desc" x="359" y="198">request.</text>
  </g>
  <line class="three-shared-structures-line three-shared-structures-conn three-shared-structures-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-shared-structures-tip)"/>
  <g class="three-shared-structures-stage three-shared-structures-s2">
    <rect class="three-shared-structures-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-shared-structures-step" x="674" y="142">03</text>
    <text class="three-shared-structures-name" x="700" y="142">The deletion path</text>
    <text class="three-shared-structures-desc" x="674" y="166">Every stage that writes registers with it, or</text>
    <text class="three-shared-structures-desc" x="674" y="182">erasure misses what it wrote.</text>
  </g>
  <text class="three-shared-structures-sub" x="30" y="304">The system is those three structures plus the ordering constraints between the stages, and getting them right is the entire difference between six working components and one working system.</text>
</svg>
