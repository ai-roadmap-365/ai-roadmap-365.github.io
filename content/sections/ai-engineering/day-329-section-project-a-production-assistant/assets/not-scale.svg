<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three honest limits.">
  <title>What the assistant is not</title>
  <style>
    .not-scale-bg   { fill: #f8fafc; }
    .not-scale-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-scale-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-scale-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-scale-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-scale-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-scale-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-scale-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-scale-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-scale-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-scale-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-scale-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-scale-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-scale-row { opacity: 1; }
    .not-scale-r0 { animation-delay: 0.00s; }
    .not-scale-r1 { animation-delay: 0.45s; }
    .not-scale-r2 { animation-delay: 0.90s; }
    .not-scale-r3 { animation-delay: 1.35s; }
    .not-scale-r4 { animation-delay: 1.80s; }
    .not-scale-row { animation: not-scale-reveal 7.3s ease-in-out infinite; }
    @keyframes not-scale-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-scale-bg" width="980" height="390"/>
  <text class="not-scale-h1"  x="30" y="40">What the assistant is not</text>
  <text class="not-scale-sub" x="30" y="64">Three honest limits.</text>
  <rect class="not-scale-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-scale-name" x="46" y="122">What it is</text>
  <text class="not-scale-desc" x="46" y="142">The seams, made explicit.</text>
  <text class="not-scale-desc not-scale-row not-scale-r0" x="46" y="182">Shared checkpoint, ledger and deletion path</text>
  <text class="not-scale-desc not-scale-row not-scale-r1" x="46" y="216">Testable end to end, with simulated dependencies</text>
  <text class="not-scale-desc not-scale-row not-scale-r2" x="46" y="250">Interactions pinned by tests rather than hoped for</text>
  <text class="not-scale-desc not-scale-row not-scale-r3" x="46" y="284">Structurally the thing you would run</text>
  <text class="not-scale-desc not-scale-row not-scale-r4" x="46" y="318">A capstone for the course</text>
  <rect class="not-scale-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-scale-name" x="526" y="122">What it is not</text>
  <text class="not-scale-desc" x="526" y="142">Three limits.</text>
  <text class="not-scale-desc not-scale-row not-scale-r0" x="526" y="182">Not a demonstration of scale — five documents</text>
  <text class="not-scale-desc not-scale-row not-scale-r1" x="526" y="216">Not a real model — a hashing vectoriser and a formatted string</text>
  <text class="not-scale-desc not-scale-row not-scale-r2" x="526" y="250">Not finished software</text>
  <text class="not-scale-desc not-scale-row not-scale-r3" x="526" y="284">No tenancy, no sandboxing, no retention policy</text>
  <text class="not-scale-desc not-scale-row not-scale-r4" x="526" y="318">The structure is the lesson, not the scale</text>
  <text class="not-scale-sub" x="30" y="372">Naming the limits is part of the exercise: an artefact presented as production-ready when it has no tenancy or retention policy teaches the wrong lesson about what production means.</text>
</svg>
