title: 'Section Project: A Production Assistant'
section: ai-engineering
subsection: production-ai-systems
week: 47
learning_promise:
  'Assemble the week into one working assistant and meet the failures that only appear at
  the seams: redaction that must precede indexing or the identifiers end up inside the vectors, one
  ledger so retrieval and generation compete for the same cap, and an erasure that has to reach the
  index, the content hashes and the response cache.'
objectives:
  - Compose six independently tested stages into a pipeline sharing a checkpoint, a ledger and a
    deletion path.
  - Explain why redaction must run before chunking, and what retrofitting it costs.
  - Charge retrieval to the request budget, and show what that makes visible about recall settings.
  - Verify an erasure across every store, including the content hash that a re-ingest depends on.
  - Justify testing these properties on five documents rather than at scale.
