terms:
  - term: Seam
    definition: An interaction between two components, where each is individually correct and their
      assumptions about one another may not be. Where systems fail most often.
  - term: Section Project
    definition: An exercise that assembles a course's parts into one system, so the interactions between
      them can be tested rather than assumed.
  - term: Shared Ledger
    definition: One cost record spanning every paid stage of a request, so a cap bounds the whole request
      rather than one component.
  - term: Deletion Path
    definition: The list of stores a subject's data reached, which an erasure must traverse and verify
      rather than relying on memory.
  - term: Checkpoint Cursor
    definition: The marker of how far ingestion has processed, advanced on every outcome including a dead
      letter so a poison record cannot block the queue head.
  - term: Content Hash
    definition: A digest of a document's normalised body used to detect real change. Part of a subject's
      stored state, so an erasure must clear it too.
  - term: Orphaned Chunk
    definition: A chunk left behind when a document shrinks, still retrievable and still able to appear
      in an answer.
  - term: Boundary Redaction
    definition: Replacing identifiers at the point data enters the system, so every derived store is
      clean by construction.
  - term: Verified Erasure
    definition: Confirming by read-back that a subject is absent from every store, as distinct from
      reporting success because the delete calls returned.
  - term: End-to-End Argument
    definition: The principle that correctness properties belong at the end points of a system rather
      than in its intermediate components.
