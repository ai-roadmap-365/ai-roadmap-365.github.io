visuals:
- id: vendor-abstraction-gateway-topology
  file: assets/vendor-abstraction-gateway-topology.svg
  type: diagram
  title: Vendor Abstraction Gateway Topology
  alt: Vendor Abstraction Gateway Topology showing Unified App Interface, Router Middleware (Load Balancing
    & Health Checks), and Dispatches to Anthropic, OpenAI, Google Gemini, and Local vLLM
  description: System architecture diagram illustrating a vendor-neutral LLM gateway topology.
- id: dynamic-model-cascade-and-failover-flow
  file: assets/dynamic-model-cascade-and-failover-flow.svg
  type: diagram
  title: Dynamic Model Cascade and Failover Flow
  alt: Dynamic Model Cascade and Failover Flow comparing Cost-Optimized Complexity Routing with Outage-Triggered
    Automatic Failover
  description: Decision flowchart for dynamic model routing and automatic failover handling.
- id: gateway-responsibilities
  file: assets/gateway-responsibilities.svg
  type: diagram
  title: 'What the gateway owns'
  alt: 'Diagram: the three responsibilities of a vendor abstraction gateway'
  description: 'A three-stage description of a vendor gateway covering schema normalisation, failover routing and cost-based cascading.'
- id: coupled-or-abstracted
  file: assets/coupled-or-abstracted.svg
  type: diagram
  title: 'Coupled to an SDK, or not'
  alt: 'Diagram: application code coupled to one provider SDK compared with a gateway'
  description: 'A two-column comparison of direct provider SDK usage across an application against a single abstraction layer.'
- id: abstraction-lineage
  file: assets/abstraction-lineage.svg
  type: diagram
  title: 'Three eras of vendor abstraction'
  alt: 'Diagram: the progression from database drivers to unified LLM gateways'
  description: 'A three-stage progression of vendor abstraction from database drivers through multi-cloud infrastructure to unified LLM gateways.'
- id: cascade-triage
  file: assets/cascade-triage.svg
  type: diagram
  title: 'Triaging cheaply'
  alt: 'Diagram: the lightweight signals used to route a query to a model tier'
  description: 'A four-stage description of cascade triage covering length heuristics, embedding centroids, confidence escalation and the constraint that triage must be cheap.'
- id: dual-sim
  file: assets/dual-sim.svg
  type: diagram
  title: 'A dual-SIM phone abroad'
  alt: 'Diagram: dual-network switching as an analogy for provider failover'
  description: 'A two-column comparison of single-network and dual-network connectivity as an analogy for provider abstraction.'
- id: provider-breaker
  file: assets/provider-breaker.svg
  type: diagram
  title: 'Breaking on a failing provider'
  alt: 'Diagram: the circuit breaker states protecting against a failing model provider'
  description: 'A four-stage description of provider circuit breaking covering the trip condition, bypass, cooldown and probe recovery.'
- id: failover-timeouts
  file: assets/failover-timeouts.svg
  type: diagram
  title: 'Timing out fast enough to fail over'
  alt: 'Diagram: aggressive time-to-first-token timeouts compared with long request timeouts'
  description: 'A three-stage description of failover timeout tuning covering the TTFT threshold, abort and secondary dispatch.'
- id: cascade-distribution
  file: assets/cascade-distribution.svg
  type: diagram
  title: 'The complexity distribution'
  alt: 'Diagram: the distribution of query complexity in a production AI application'
  description: 'A three-stage description of production query complexity distribution and the routing implication.'
- id: failover-privacy
  file: assets/failover-privacy.svg
  type: diagram
  title: 'A fallback provider is a data decision'
  alt: 'Diagram: the compliance implications of adding a fallback model provider'
  description: 'A two-column comparison of a compliance-verified fallback provider against one added for availability alone.'
- id: abstraction-when
  file: assets/abstraction-when.svg
  type: diagram
  title: 'When abstraction is worth it'
  alt: 'Diagram: when to implement vendor abstraction and multi-provider failover'
  description: 'A two-column comparison of systems requiring vendor abstraction against those where a single provider suffices.'
