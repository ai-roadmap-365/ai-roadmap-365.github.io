<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fifty files, or one config line.">
  <title>Coupled to an SDK, or not</title>
  <style>
    .coupled-or-abstracted-bg   { fill: #f8fafc; }
    .coupled-or-abstracted-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coupled-or-abstracted-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coupled-or-abstracted-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coupled-or-abstracted-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coupled-or-abstracted-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coupled-or-abstracted-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coupled-or-abstracted-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .coupled-or-abstracted-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .coupled-or-abstracted-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .coupled-or-abstracted-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .coupled-or-abstracted-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .coupled-or-abstracted-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coupled-or-abstracted-row { opacity: 1; }
    .coupled-or-abstracted-r0 { animation-delay: 0.00s; }
    .coupled-or-abstracted-r1 { animation-delay: 0.45s; }
    .coupled-or-abstracted-r2 { animation-delay: 0.90s; }
    .coupled-or-abstracted-r3 { animation-delay: 1.35s; }
    .coupled-or-abstracted-r4 { animation-delay: 1.80s; }
    .coupled-or-abstracted-row { animation: coupled-or-abstracted-reveal 7.3s ease-in-out infinite; }
    @keyframes coupled-or-abstracted-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="coupled-or-abstracted-bg" width="980" height="390"/>
  <text class="coupled-or-abstracted-h1"  x="30" y="40">Coupled to an SDK, or not</text>
  <text class="coupled-or-abstracted-sub" x="30" y="64">Fifty files, or one config line.</text>
  <rect class="coupled-or-abstracted-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="coupled-or-abstracted-name" x="46" y="122">Directly coupled</text>
  <text class="coupled-or-abstracted-desc" x="46" y="142">An import in fifty files.</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r0" x="46" y="182">Provider syntax in view functions</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r1" x="46" y="216">An outage means editing production code</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r2" x="46" y="250">A model upgrade is a migration</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r3" x="46" y="284">Switching providers is a rewrite</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r4" x="46" y="318">And there is no fallback path</text>
  <rect class="coupled-or-abstracted-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="coupled-or-abstracted-name" x="526" y="122">Behind a gateway</text>
  <text class="coupled-or-abstracted-desc" x="526" y="142">One line of configuration.</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r0" x="526" y="182">A standard interface everywhere</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r1" x="526" y="216">An outage triggers automatic failover</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r2" x="526" y="250">A model upgrade is a config change</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r3" x="526" y="284">Providers are interchangeable</text>
  <text class="coupled-or-abstracted-desc coupled-or-abstracted-row coupled-or-abstracted-r4" x="526" y="318">And cascading becomes possible</text>
  <text class="coupled-or-abstracted-sub" x="30" y="372">This is the JDBC argument transplanted, and it holds for the same reason: the thing that changes frequently should be behind an interface, and in this field the model changes every few months.</text>
</svg>
