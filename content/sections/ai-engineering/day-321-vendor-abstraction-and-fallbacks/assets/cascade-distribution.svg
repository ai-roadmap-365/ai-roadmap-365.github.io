<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Most traffic is easy.">
  <title>The complexity distribution</title>
  <style>
    .cascade-distribution-bg   { fill: #f8fafc; }
    .cascade-distribution-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-distribution-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-distribution-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-distribution-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-distribution-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascade-distribution-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cascade-distribution-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cascade-distribution-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cascade-distribution-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cascade-distribution-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cascade-distribution-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cascade-distribution-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cascade-distribution-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cascade-distribution-stage { opacity: 1; }

    .cascade-distribution-s0 { animation-delay: 0.00s; }
    .cascade-distribution-e0 { animation-delay: 0.00s; }
    .cascade-distribution-s1 { animation-delay: 1.50s; }
    .cascade-distribution-e1 { animation-delay: 1.50s; }
    .cascade-distribution-s2 { animation-delay: 3.00s; }
    .cascade-distribution-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .cascade-distribution-conn  { animation: cascade-distribution-trace 6s ease-in-out infinite; }
      .cascade-distribution-stage { animation: cascade-distribution-arrive 6s ease-in-out infinite; }
    }
    @keyframes cascade-distribution-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cascade-distribution-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cascade-distribution-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cascade-distribution-stage { animation: cascade-distribution-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cascade-distribution-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cascade-distribution-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cascade-distribution-bg" width="980" height="322"/>
  <text class="cascade-distribution-h1"  x="30" y="40">The complexity distribution</text>
  <text class="cascade-distribution-sub" x="30" y="64">Most traffic is easy.</text>
  <g class="cascade-distribution-stage cascade-distribution-s0">
    <rect class="cascade-distribution-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="cascade-distribution-step" x="44" y="142">01</text>
    <text class="cascade-distribution-name" x="70" y="142">About 40% simple</text>
    <text class="cascade-distribution-desc" x="44" y="166">Entity extraction, classification, short</text>
    <text class="cascade-distribution-desc" x="44" y="182">exchanges.</text>
  </g>
  <line class="cascade-distribution-line cascade-distribution-conn cascade-distribution-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#cascade-distribution-tip)"/>
  <g class="cascade-distribution-stage cascade-distribution-s1">
    <rect class="cascade-distribution-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="cascade-distribution-step" x="359" y="142">02</text>
    <text class="cascade-distribution-name" x="385" y="142">About 35% medium</text>
    <text class="cascade-distribution-desc" x="359" y="166">Summaries and conversational inquiries.</text>
  </g>
  <line class="cascade-distribution-line cascade-distribution-conn cascade-distribution-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#cascade-distribution-tip)"/>
  <g class="cascade-distribution-stage cascade-distribution-s2">
    <rect class="cascade-distribution-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="cascade-distribution-step" x="674" y="142">03</text>
    <text class="cascade-distribution-name" x="700" y="142">About 25% hard</text>
    <text class="cascade-distribution-desc" x="674" y="166">Coding, multi-step reasoning, deep analysis.</text>
    <text class="cascade-distribution-edge" x="674" y="242">frontier</text>
  </g>
  <text class="cascade-distribution-sub" x="30" y="304">Routing the first two categories to compact models leaves only a quarter of traffic on frontier pricing, which is the largest single cost reduction available to most AI products.</text>
</svg>
