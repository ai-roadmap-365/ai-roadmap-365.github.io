<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three states, one canary.">
  <title>Breaking on a failing provider</title>
  <style>
    .provider-breaker-bg   { fill: #f8fafc; }
    .provider-breaker-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provider-breaker-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provider-breaker-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provider-breaker-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provider-breaker-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provider-breaker-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .provider-breaker-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .provider-breaker-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .provider-breaker-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .provider-breaker-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .provider-breaker-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .provider-breaker-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .provider-breaker-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .provider-breaker-stage { opacity: 1; }

    .provider-breaker-s0 { animation-delay: 0.00s; }
    .provider-breaker-e0 { animation-delay: 0.00s; }
    .provider-breaker-s1 { animation-delay: 1.28s; }
    .provider-breaker-e1 { animation-delay: 1.28s; }
    .provider-breaker-s2 { animation-delay: 2.56s; }
    .provider-breaker-e2 { animation-delay: 2.56s; }
    .provider-breaker-s3 { animation-delay: 3.84s; }
    .provider-breaker-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .provider-breaker-conn  { animation: provider-breaker-trace 6.4s ease-in-out infinite; }
      .provider-breaker-stage { animation: provider-breaker-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes provider-breaker-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes provider-breaker-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .provider-breaker-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .provider-breaker-stage { animation: provider-breaker-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes provider-breaker-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="provider-breaker-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="provider-breaker-bg" width="980" height="322"/>
  <text class="provider-breaker-h1"  x="30" y="40">Breaking on a failing provider</text>
  <text class="provider-breaker-sub" x="30" y="64">Three states, one canary.</text>
  <g class="provider-breaker-stage provider-breaker-s0">
    <rect class="provider-breaker-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="provider-breaker-step" x="44" y="142">01</text>
    <text class="provider-breaker-name" x="70" y="142">Five consecutive failures in 30 seconds</text>
    <text class="provider-breaker-desc" x="44" y="166">The circuit trips.</text>
  </g>
  <line class="provider-breaker-line provider-breaker-conn provider-breaker-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#provider-breaker-tip)"/>
  <g class="provider-breaker-stage provider-breaker-s1">
    <rect class="provider-breaker-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="provider-breaker-step" x="280" y="142">02</text>
    <text class="provider-breaker-name" x="306" y="142">Traffic bypasses the provider entirely</text>
    <text class="provider-breaker-desc" x="280" y="166">No network call at all. Instant</text>
    <text class="provider-breaker-desc" x="280" y="182">failover.</text>
    <text class="provider-breaker-edge" x="280" y="242">no hang</text>
  </g>
  <line class="provider-breaker-line provider-breaker-conn provider-breaker-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#provider-breaker-tip)"/>
  <g class="provider-breaker-stage provider-breaker-s2">
    <rect class="provider-breaker-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="provider-breaker-step" x="516" y="142">03</text>
    <text class="provider-breaker-name" x="542" y="142">Sixty seconds of cooldown</text>
    <text class="provider-breaker-desc" x="516" y="166">Long enough for a transient</text>
    <text class="provider-breaker-desc" x="516" y="182">incident to resolve.</text>
  </g>
  <line class="provider-breaker-line provider-breaker-conn provider-breaker-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#provider-breaker-tip)"/>
  <g class="provider-breaker-stage provider-breaker-s3">
    <rect class="provider-breaker-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="provider-breaker-step" x="752" y="142">04</text>
    <text class="provider-breaker-name" x="778" y="142">One canary probe</text>
    <text class="provider-breaker-desc" x="752" y="166">Success closes the circuit;</text>
    <text class="provider-breaker-desc" x="752" y="182">failure re-opens it.</text>
  </g>
  <text class="provider-breaker-sub" x="30" y="304">Skipping the network call is what protects the thread pool: without a breaker, thousands of requests each hang for ten seconds against a dead provider and exhaust the server before failing over.</text>
</svg>
