<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when one provider is fine.">
  <title>When abstraction is worth it</title>
  <style>
    .abstraction-when-bg   { fill: #f8fafc; }
    .abstraction-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .abstraction-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .abstraction-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .abstraction-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .abstraction-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .abstraction-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .abstraction-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .abstraction-when-row { opacity: 1; }
    .abstraction-when-r0 { animation-delay: 0.00s; }
    .abstraction-when-r1 { animation-delay: 0.45s; }
    .abstraction-when-r2 { animation-delay: 0.90s; }
    .abstraction-when-r3 { animation-delay: 1.35s; }
    .abstraction-when-r4 { animation-delay: 1.80s; }
    .abstraction-when-row { animation: abstraction-when-reveal 7.3s ease-in-out infinite; }
    @keyframes abstraction-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="abstraction-when-bg" width="980" height="390"/>
  <text class="abstraction-when-h1"  x="30" y="40">When abstraction is worth it</text>
  <text class="abstraction-when-sub" x="30" y="64">And when one provider is fine.</text>
  <rect class="abstraction-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="abstraction-when-name" x="46" y="122">Abstract it</text>
  <text class="abstraction-when-desc" x="46" y="142">Availability or cost matters.</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r0" x="46" y="182">An uptime commitment to customers</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r1" x="46" y="216">Meaningful monthly token spend</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r2" x="46" y="250">More than one model in use</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r3" x="46" y="284">Frequent model upgrades</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r4" x="46" y="318">Anywhere cascading would pay</text>
  <rect class="abstraction-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="abstraction-when-name" x="526" y="122">One provider is fine</text>
  <text class="abstraction-when-desc" x="526" y="142">Prototypes and internal tools.</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r0" x="526" y="182">A prototype or internal tool</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r1" x="526" y="216">Downtime is an inconvenience</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r2" x="526" y="250">One model, rarely changed</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r3" x="526" y="284">But keep the call behind one function</text>
  <text class="abstraction-when-desc abstraction-when-row abstraction-when-r4" x="526" y="318">So the abstraction is one refactor away</text>
  <text class="abstraction-when-sub" x="30" y="372">The caveat on the right is nearly free: routing every model call through a single internal function costs nothing today and turns a future migration from fifty files into one.</text>
</svg>
