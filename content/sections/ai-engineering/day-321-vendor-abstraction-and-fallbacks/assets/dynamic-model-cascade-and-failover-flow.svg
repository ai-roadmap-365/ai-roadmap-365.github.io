<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Dynamic Model Cascade and Failover Flow">
  <title>Dynamic Model Cascade and Failover Flow</title>
  <defs>
    <style>
      .d321b-bg { fill: #f8fafc; }
      .d321b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d321b-casc { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d321b-fail { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d321b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d321b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d321b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d321b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d321b-bg" />
  
  <text x="40" y="40" class="d321a-title">Dynamic Model Cascades vs Outage Failover</text>
  <text x="40" y="65" class="d321a-subtitle">Dynamic Model Cascade and Failover Flow comparing Cost-Optimized Complexity Routing with Outage-Triggered Automatic Failover</text>
  
  <!-- Path A: Complexity Cascade -->
  <rect x="40" y="110" width="390" height="270" class="d321b-casc" />
  <text x="60" y="145" class="d321b-header" fill="#1d4ed8">A. Dynamic Complexity Cascade</text>
  <text x="60" y="180" class="d321b-text">• **Step 1:** Analyze query complexity with fast classifier</text>
  <text x="60" y="205" class="d321b-text">• **Simple Queries (70%):** Route to Mini model ($0.15/M)</text>
  <text x="60" y="230" class="d321b-text">• **Complex Queries (30%):** Escalate to Frontier ($3.00/M)</text>
  <text x="60" y="255" class="d321b-text">• **Economic Impact:** 70% reduction in average token bill</text>
  <text x="60" y="300" class="d321b-text" font-weight="600" fill="#1d4ed8">Target: Cost &amp; Latency Optimization</text>
  
  <!-- Path B: Outage Failover -->
  <rect x="470" y="110" width="390" height="270" class="d321b-fail" />
  <text x="490" y="145" class="d321b-header" fill="#991b1b">B. Outage &amp; Rate Limit Failover</text>
  <text x="490" y="180" class="d321b-text">• **Step 1:** Dispatch request to Primary Provider</text>
  <text x="490" y="205" class="d321b-text">• **Step 2:** Primary returns HTTP 429 / 503 error</text>
  <text x="490" y="230" class="d321b-text">• **Step 3:** Intercept error in &lt; 50ms</text>
  <text x="490" y="255" class="d321b-text">• **Step 4:** Seamlessly retry on Secondary Backup</text>
  <text x="490" y="300" class="d321b-text" font-weight="600" fill="#991b1b">Target: 99.99% High Availability</text>
</svg>