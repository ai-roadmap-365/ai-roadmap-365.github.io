<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Vendor Abstraction Gateway Topology">
  <title>Vendor Abstraction Gateway Topology</title>
  <defs>
    <style>
      .d321a-bg { fill: #f8fafc; }
      .d321a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d321a-app { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d321a-gw { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d321a-p1 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 6px; }
      .d321a-p2 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d321a-p3 { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 6px; }
      .d321a-p4 { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2px; rx: 6px; }
      .d321a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d321a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d321a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d321a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d321a-bg" />
  
  <text x="40" y="40" class="d321a-title">Vendor-Neutral AI Gateway Architecture</text>
  <text x="40" y="65" class="d321a-subtitle">Vendor Abstraction Gateway Topology showing Unified App Interface, Router Middleware (Load Balancing &amp; Health Checks), and Dispatches to Anthropic, OpenAI, Google Gemini, and Local vLLM</text>
  
  <!-- Application Layer -->
  <rect x="40" y="110" width="220" height="270" class="d321a-app" />
  <text x="55" y="140" class="d321a-header" fill="#1d4ed8">Application Layer</text>
  <text x="55" y="170" class="d321a-text">• Unified `call_model()` API</text>
  <text x="55" y="190" class="d321a-text">• Standard OpenAI schema</text>
  <text x="55" y="210" class="d321a-text">• Zero vendor SDK imports</text>
  <text x="55" y="230" class="d321a-text">• Business logic decoupled</text>
  <text x="55" y="270" class="d321a-text" font-weight="600">Benefit:</text>
  <text x="55" y="290" class="d321a-text">100% Vendor Portability</text>
  
  <!-- Router Gateway -->
  <rect x="290" y="110" width="240" height="270" class="d321a-gw" />
  <text x="305" y="140" class="d321a-header" fill="#7e22ce">Router &amp; Fallback Gateway</text>
  <text x="305" y="170" class="d321a-text">• Health score tracking</text>
  <text x="305" y="190" class="d321a-text">• Sub-second failover on 5xx</text>
  <text x="305" y="210" class="d321a-text">• Dynamic model cascades</text>
  <text x="305" y="230" class="d321a-text">• Multi-key load balancing</text>
  <text x="305" y="270" class="d321a-text" font-weight="600">SLA Guarantee:</text>
  <text x="305" y="290" class="d321a-text">99.99% Multi-Cloud Uptime</text>
  
  <!-- Model Provider Targets -->
  <rect x="560" y="110" width="300" height="55" class="d321a-p1" />
  <text x="575" y="135" class="d321a-header" fill="#a16207">1. Anthropic: Claude 3.5 Sonnet</text>
  <text x="575" y="152" class="d321a-text">Primary Model (Code &amp; Deep Reasoning)</text>
  
  <rect x="560" y="180" width="300" height="55" class="d321a-p2" />
  <text x="575" y="205" class="d321a-header" fill="#15803d">2. OpenAI: GPT-4o / GPT-4o-mini</text>
  <text x="575" y="222" class="d321a-text">Secondary Fallback &amp; Fast Classifier</text>
  
  <rect x="560" y="250" width="300" height="55" class="d321a-p3" />
  <text x="575" y="275" class="d321a-header" fill="#991b1b">3. Google: Gemini 2.0 Flash</text>
  <text x="575" y="292" class="d321a-text">High-Throughput Multimodal Target</text>
  
  <rect x="560" y="320" width="300" height="55" class="d321a-p4" />
  <text x="575" y="345" class="d321a-header" fill="#0369a1">4. Local vLLM: Llama 3.3 70B</text>
  <text x="575" y="362" class="d321a-text">Self-Hosted Private Backup Replica</text>
</svg>