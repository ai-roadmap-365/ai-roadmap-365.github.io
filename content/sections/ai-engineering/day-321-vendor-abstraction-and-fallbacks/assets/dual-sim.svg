<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Signal drops, network switches.">
  <title>A dual-SIM phone abroad</title>
  <style>
    .dual-sim-bg   { fill: #f8fafc; }
    .dual-sim-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-sim-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-sim-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-sim-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-sim-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-sim-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dual-sim-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dual-sim-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dual-sim-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dual-sim-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dual-sim-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dual-sim-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dual-sim-row { opacity: 1; }
    .dual-sim-r0 { animation-delay: 0.00s; }
    .dual-sim-r1 { animation-delay: 0.45s; }
    .dual-sim-r2 { animation-delay: 0.90s; }
    .dual-sim-r3 { animation-delay: 1.35s; }
    .dual-sim-r4 { animation-delay: 1.80s; }
    .dual-sim-row { animation: dual-sim-reveal 7.3s ease-in-out infinite; }
    @keyframes dual-sim-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dual-sim-bg" width="980" height="390"/>
  <text class="dual-sim-h1"  x="30" y="40">A dual-SIM phone abroad</text>
  <text class="dual-sim-sub" x="30" y="64">Signal drops, network switches.</text>
  <rect class="dual-sim-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dual-sim-name" x="46" y="122">Single network</text>
  <text class="dual-sim-desc" x="46" y="142">One valley, no service.</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r0" x="46" y="182">Connected to one carrier</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r1" x="46" y="216">Signal drops in a valley</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r2" x="46" y="250">Total loss of service</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r3" x="46" y="284">Nothing to fail over to</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r4" x="46" y="318">The user experiences an outage</text>
  <rect class="dual-sim-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dual-sim-name" x="526" y="122">Dual network</text>
  <text class="dual-sim-desc" x="526" y="142">Switched in milliseconds.</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r0" x="526" y="182">Signal strength monitored on both</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r1" x="526" y="216">One drops, the other takes over</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r2" x="526" y="250">Fifty milliseconds, no dropped call</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r3" x="526" y="284">The user notices nothing</text>
  <text class="dual-sim-desc dual-sim-row dual-sim-r4" x="526" y="318">Two carriers, one interface</text>
  <text class="dual-sim-sub" x="30" y="372">The monitoring is the part that has to exist beforehand: a phone that only discovers the second network after the first fails has already dropped the call.</text>
</svg>
