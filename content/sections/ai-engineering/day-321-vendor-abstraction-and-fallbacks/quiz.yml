questions:
- question: What is the primary danger of tightly coupling application source code directly to a single
    proprietary LLM SDK (e.g. `import openai`)?
  options:
  - The computer will not compile Python
  - Python scripts become too small
  - 'Lock-in and a single point of failure'
  - It disables unit testing
  answer_index: 2
  explanation: Direct SDK coupling creates vendor lock-in and leaves the application vulnerable to single-provider
    outages.
- question: What is a 'Dynamic Model Cascade' in an AI routing gateway?
  options:
  - A waterfall animation in CSS
  - Deleting old model checkpoints
  - Running 100 models simultaneously on one laptop
  - 'Try a cheap model first, escalate only when needed'
  answer_index: 3
  explanation: Model cascades route simple queries to cheap models and complex queries to frontier models,
    optimizing price-performance.
- question: How does an 'Automated Multi-Provider Fallback' router handle a 503 Service Unavailable error
    from the primary provider?
  options:
  - 'Mark it degraded and retry against the backup'
  - Crash the server and show a blank page to the user
  - Wait 10 minutes and retry
  - Send a text message to the CEO
  answer_index: 0
  explanation: Automated failover routes requests to healthy backup providers immediately upon encountering
    upstream errors.
- question: Why is standardizing on a Unified Message Schema (e.g. OpenAI-compatible format) essential
    in a vendor abstraction layer?
  options:
  - Because JSON only works with OpenAI
  - 'Providers differ in parameter names and payloads'
  - Because HTTP requires all strings to be lowercase
  - To make the code look longer
  answer_index: 1
  explanation: A unified schema abstracts away idiosyncratic differences in provider parameter naming
    and response shapes.
- question: Which open-source proxy framework is widely adopted for vendor-neutral LLM load balancing,
    failovers, and cost tracking?
  options:
  - Microsoft Word
  - Adobe Flash
  - LiteLLM Proxy
  - jQuery UI
  answer_index: 2
  explanation: LiteLLM Proxy provides drop-in vendor abstraction across 100+ LLM providers.
