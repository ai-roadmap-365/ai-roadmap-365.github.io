terms:
- term: Vendor Abstraction
  definition: A software layer isolating application logic from specific proprietary model provider SDKs.
- term: Failover Routing
  definition: Automatically redirecting requests to backup model providers when the primary provider fails.
- term: Model Cascade
  definition: An architecture routing simple queries to cheap compact models and complex queries to frontier
    models.
- term: Provider Health Score
  definition: A real-time reliability metric based on recent latency and error rates used to balance traffic.
- term: LiteLLM
  definition: An open-source library and proxy providing a unified OpenAI-compatible interface across
    100+ LLMs.
- term: Fallback Priority List
  definition: An ordered list of providers (e.g. Primary -> Secondary -> Local vLLM) tried sequentially
    during outages.
- term: Unified Message Schema
  definition: A standardized JSON representation for system, user, assistant, and tool messages across
    all providers.
- term: Self-Hosted Gateway
  definition: A proxy deployed within a company's private cloud infrastructure to route and audit all
    model traffic.
