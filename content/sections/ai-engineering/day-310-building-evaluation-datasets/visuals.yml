visuals:
- id: evaluation-dataset-composition-pyramid
  file: assets/evaluation-dataset-composition-pyramid.svg
  type: diagram
  title: Evaluation Dataset Composition Pyramid
  alt: Evaluation Dataset Composition Pyramid showing Happy Path Invariants (50%), Hard Negative Edge
    Cases (25%), Boundary & Schema Conditions (15%), and Adversarial Red-Teaming (10%)
  description: Stratified distribution pyramid for production-grade AI evaluation datasets.
- id: synthetic-dataset-generation-pipeline
  file: assets/synthetic-dataset-generation-pipeline.svg
  type: diagram
  title: Synthetic Dataset Generation Pipeline
  alt: Synthetic Dataset Generation Pipeline showing Seed Scenarios, LLM Paraphrase & Mutation, Schema
    Validation, De-duplication, and Expert Audit
  description: Multi-stage automated pipeline for synthesizing and filtering evaluation datasets.
- id: dataset-strata
  file: assets/dataset-strata.svg
  type: diagram
  title: 'Four strata, deliberately weighted'
  alt: 'Diagram: the four strata of a production evaluation dataset'
  description: 'A four-stage description of evaluation dataset stratification covering standard cases, hard negatives, boundary conditions and adversarial prompts.'
- id: road-test
  file: assets/road-test.svg
  type: diagram
  title: 'A road test, or a straight road'
  alt: 'Diagram: a happy-path driving test compared with a stratified one'
  description: 'A two-column comparison of a trivial driving test against one covering adverse conditions, technical manoeuvres and hazards.'
- id: dataset-eras
  file: assets/dataset-eras.svg
  type: diagram
  title: 'Three eras of evaluation data'
  alt: 'Diagram: the progression from academic benchmarks to production data flywheels'
  description: 'A three-stage progression of evaluation datasets from fixed academic benchmarks through synthetic generation to mined production telemetry.'
- id: dataset-not-scrape
  file: assets/dataset-not-scrape.svg
  type: diagram
  title: 'What the dataset must be'
  alt: 'Diagram: a curated evaluation dataset compared with two failure modes'
  description: 'A two-column comparison of a properly curated dataset against an unverified scrape and a contaminated one.'
- id: counterfactual
  file: assets/counterfactual.svg
  type: diagram
  title: 'Synthesising hard negatives'
  alt: 'Diagram: three ways to perturb a real example into a hard negative'
  description: 'A three-stage description of counterfactual perturbation covering entity swapping, temporal inversion and numerical alteration.'
- id: decontamination
  file: assets/decontamination.svg
  type: diagram
  title: 'Keeping the benchmark clean'
  alt: 'Diagram: the three practices that protect an evaluation dataset from contamination'
  description: 'A three-stage description of dataset governance covering isolated storage, canary tokens and continuous pruning.'
- id: flight-simulator
  file: assets/flight-simulator.svg
  type: diagram
  title: 'A flight simulator library'
  alt: 'Diagram: clear-weather flight compared with a full simulator scenario library'
  description: 'A two-column comparison of certifying a pilot on routine flight against certifying across a scenario library.'
- id: hard-negative-mining
  file: assets/hard-negative-mining.svg
  type: diagram
  title: 'Mining hard negatives from traces'
  alt: 'Diagram: how hard negatives are mined from production retrieval traces'
  description: 'A four-stage description of hard negative mining covering score discrepancy search, distractor isolation, test case conversion and CI integration.'
- id: annotation-reliability
  file: assets/annotation-reliability.svg
  type: diagram
  title: 'Making human labels reliable'
  alt: 'Diagram: the three practices that produce reliable human annotation'
  description: 'A three-stage description of annotation reliability covering written guidelines, calibration pilots and disagreement arbitration.'
- id: eighty-twenty
  file: assets/eighty-twenty.svg
  type: diagram
  title: 'Where to spend curation effort'
  alt: 'Diagram: the edge case archetypes that account for most production failures'
  description: 'A two-column comparison of high-yield curation targets against low-yield volume expansion.'
- id: dataset-when
  file: assets/dataset-when.svg
  type: diagram
  title: 'When to curate formally'
  alt: 'Diagram: when a formal stratified evaluation dataset is warranted'
  description: 'A two-column comparison of situations requiring a curated dataset against disposable work, and the practices that apply either way.'
