terms:
- term: Evaluation Dataset
  definition: A curated collection of structured inputs, context, and ground-truth references used to
    benchmark AI models.
- term: JSONL (JSON Lines)
  definition: A text file format where each line is a valid, independent JSON object.
- term: Hard Negative
  definition: An input example with misleading or superficially relevant context designed to test model
    hallucination and abstention.
- term: Synthetic Data Generation
  definition: Using LLMs and automated scripts to generate diverse test cases from domain templates.
- term: Stratified Sampling
  definition: Sampling evaluation test cases proportionally across critical categories (e.g. happy path,
    edge case, adversarial).
- term: Golden Test Set
  definition: A high-priority, human-verified benchmark dataset that must achieve 100% pass rate before
    deployment.
- term: Data Contamination / Leakage
  definition: When evaluation examples accidentally leak into model training or prompt few-shot sets.
- term: De-duplication
  definition: Removing semantically identical or exact duplicate queries to prevent benchmark bias.
