title: Building Evaluation Datasets
section: ai-engineering
subsection: production-ai-systems
week: 45
learning_promise: 'Master the curation, synthesis, and stratification of production evaluation datasets:
  learn how to mine production logs, synthesize hard negative edge cases with LLMs, maintain golden baselines,
  and format JSONL datasets.'
objectives:
- Design multi-tier evaluation datasets balancing typical user distribution, hard negative edge cases,
  adversarial attacks, and schema boundary conditions.
- Implement production log mining pipelines converting real user queries and failure telemetry into labeled
  evaluation test cases.
- Generate high-diversity synthetic test cases with LLM-based query mutation, paraphrase expansion, and
  scenario injection.
- Implement an automated Evaluation Dataset Curator in Python that loads, validates, deduplicates, stratifies,
  and exports JSONL datasets.
- Formulate data governance and decontamination strategies preventing eval test leakage into model training
  corpora.
