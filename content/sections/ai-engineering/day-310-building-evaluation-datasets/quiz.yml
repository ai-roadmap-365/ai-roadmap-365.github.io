questions:
- question: What is the primary danger of curating an evaluation dataset composed solely of typical, happy-path
    user queries?
  options:
  - The file size of the dataset will be too large
  - It requires GPU acceleration
  - 'It passes easily while missing the cases that break things'
  - It prevents JSON serialization
  answer_index: 2
  explanation: Production AI failures occur on rare edge cases, ambiguous requests, and boundary conditions.
    High-quality eval datasets must stratify across happy paths, edge cases, and adversarial samples.
- question: What is 'Hard Negative Mining' in the context of RAG and AI evaluation datasets?
  options:
  - Deleting negative numbers from a database
  - Encrypting dataset files
  - Subtracting loss gradients during backward passes
  - 'Cases that look relevant but do not hold the answer'
  answer_index: 3
  explanation: Hard negatives test if a model can distinguish true relevance from misleading semantic
    distractors.
- question: Why should evaluation datasets be strictly partitioned into 'Development' and 'Golden Blind
    Test' sets?
  options:
  - 'To stop engineers overfitting prompts to the test set'
  - To reduce disk storage requirements
  - To comply with CSS style guidelines
  - To speed up network bandwidth
  answer_index: 0
  explanation: Blind test sets ensure reported accuracy reflects genuine model generalization rather than
    overfitting to specific test phrases.
- question: What format is the industry standard for storing and streaming LLM evaluation datasets?
  options:
  - Raw binary protobuf
  - 'JSON Lines, one object per case'
  - Comma-separated values without quotes
  - HTML tables
  answer_index: 1
  explanation: JSONL allows line-by-line streaming, arbitrary nested metadata, and straightforward appending
    of new test cases.
- question: How can AI engineers safely leverage synthetic data generation when curating evaluation suites?
  options:
  - By having an LLM generate both the questions and answers without any human review or domain constraints
  - By copying text directly from Wikipedia without permission
  - 'Generate variations, then have experts verify them'
  - By generating random strings of characters
  answer_index: 2
  explanation: Synthetic data generation excels at expanding scenario diversity, but human verification
    ensures ground-truth correctness.
