<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Synthetic Dataset Generation Pipeline">
  <title>Synthetic Dataset Generation Pipeline</title>
  <defs>
    <style>
      .d310f-bg { fill: #f8fafc; }
      .d310f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d310f-s1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d310f-s2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d310f-s3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d310f-s4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d310f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d310f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d310f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d310f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d310f-bg" />
  
  <text x="40" y="40" class="d310a-title">Synthetic Evaluation Dataset Pipeline</text>
  <text x="40" y="65" class="d310a-subtitle">Synthetic Dataset Generation Pipeline showing Seed Scenarios, LLM Paraphrase &amp; Mutation, Schema Validation, De-duplication, and Expert Audit</text>
  
  <!-- Step 1: Seed Scenarios -->
  <rect x="40" y="110" width="180" height="270" class="d310f-s1" />
  <text x="55" y="140" class="d310f-header" fill="#1d4ed8">1. Seed Scenarios</text>
  <text x="55" y="170" class="d310f-text">• 20 Core domain tasks</text>
  <text x="55" y="190" class="d310f-text">• Production telemetry logs</text>
  <text x="55" y="210" class="d310f-text">• Customer incident reports</text>
  <text x="55" y="230" class="d310f-text">• Target API specs</text>
  <text x="55" y="260" class="d310f-text" font-weight="600">Output:</text>
  <text x="55" y="280" class="d310f-text">Seed prompt templates</text>
  
  <!-- Step 2: LLM Mutation -->
  <rect x="250" y="110" width="180" height="270" class="d310f-s2" />
  <text x="265" y="140" class="d310f-header" fill="#7e22ce">2. LLM Mutation</text>
  <text x="265" y="170" class="d310f-text">• Paraphrase rephrasing</text>
  <text x="265" y="190" class="d310f-text">• Typo &amp; slang injection</text>
  <text x="265" y="210" class="d310f-text">• Adversarial mutations</text>
  <text x="265" y="230" class="d310f-text">• Entity slot swapping</text>
  <text x="265" y="260" class="d310f-text" font-weight="600">Scale:</text>
  <text x="265" y="280" class="d310f-text">20 seeds → 500 cases</text>
  
  <!-- Step 3: De-dup & Filter -->
  <rect x="460" y="110" width="180" height="270" class="d310f-s3" />
  <text x="475" y="140" class="d310f-header" fill="#a16207">3. De-dup &amp; Validation</text>
  <text x="475" y="170" class="d310f-text">• JSON schema validation</text>
  <text x="475" y="190" class="d310f-text">• Semantic vector de-dup</text>
  <text x="475" y="210" class="d310f-text">• PII &amp; secret scrubbing</text>
  <text x="475" y="230" class="d310f-text">• Quality threshold filter</text>
  <text x="475" y="260" class="d310f-text" font-weight="600">Result:</text>
  <text x="475" y="280" class="d310f-text">High-signal JSONL</text>
  
  <!-- Step 4: Golden Test Set -->
  <rect x="670" y="110" width="190" height="270" class="d310f-s4" />
  <text x="685" y="140" class="d310f-header" fill="#15803d">4. Stratified Golden Set</text>
  <text x="685" y="170" class="d310f-text">• Human SME spot-check</text>
  <text x="685" y="190" class="d310f-text">• Balanced categories</text>
  <text x="685" y="210" class="d310f-text">• Versioned in Git</text>
  <text x="685" y="230" class="d310f-text">• CI/CD integration</text>
  <text x="685" y="260" class="d310f-text" font-weight="600">Asset:</text>
  <text x="685" y="280" class="d310f-text">`golden_evals_v1.jsonl`</text>
</svg>