<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, all automatable.">
  <title>Mining hard negatives from traces</title>
  <style>
    .hard-negative-mining-bg   { fill: #f8fafc; }
    .hard-negative-mining-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-negative-mining-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-negative-mining-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-negative-mining-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-negative-mining-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-negative-mining-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hard-negative-mining-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hard-negative-mining-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hard-negative-mining-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hard-negative-mining-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hard-negative-mining-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hard-negative-mining-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hard-negative-mining-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hard-negative-mining-stage { opacity: 1; }

    .hard-negative-mining-s0 { animation-delay: 0.00s; }
    .hard-negative-mining-e0 { animation-delay: 0.00s; }
    .hard-negative-mining-s1 { animation-delay: 1.28s; }
    .hard-negative-mining-e1 { animation-delay: 1.28s; }
    .hard-negative-mining-s2 { animation-delay: 2.56s; }
    .hard-negative-mining-e2 { animation-delay: 2.56s; }
    .hard-negative-mining-s3 { animation-delay: 3.84s; }
    .hard-negative-mining-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hard-negative-mining-conn  { animation: hard-negative-mining-trace 6.4s ease-in-out infinite; }
      .hard-negative-mining-stage { animation: hard-negative-mining-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hard-negative-mining-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hard-negative-mining-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hard-negative-mining-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hard-negative-mining-stage { animation: hard-negative-mining-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hard-negative-mining-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hard-negative-mining-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hard-negative-mining-bg" width="980" height="322"/>
  <text class="hard-negative-mining-h1"  x="30" y="40">Mining hard negatives from traces</text>
  <text class="hard-negative-mining-sub" x="30" y="64">Four steps, all automatable.</text>
  <g class="hard-negative-mining-stage hard-negative-mining-s0">
    <rect class="hard-negative-mining-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hard-negative-mining-step" x="44" y="142">01</text>
    <text class="hard-negative-mining-name" x="70" y="142">Find the discrepancies</text>
    <text class="hard-negative-mining-desc" x="44" y="166">High retrieval similarity,</text>
    <text class="hard-negative-mining-desc" x="44" y="182">negative user feedback. The</text>
    <text class="hard-negative-mining-desc" x="44" y="198">interesting failures.</text>
    <text class="hard-negative-mining-edge" x="44" y="242">&gt; 0.85, thumbs down</text>
  </g>
  <line class="hard-negative-mining-line hard-negative-mining-conn hard-negative-mining-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hard-negative-mining-tip)"/>
  <g class="hard-negative-mining-stage hard-negative-mining-s1">
    <rect class="hard-negative-mining-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hard-negative-mining-step" x="280" y="142">02</text>
    <text class="hard-negative-mining-name" x="306" y="142">Isolate the distractor</text>
    <text class="hard-negative-mining-desc" x="280" y="166">Chunks sharing keywords but</text>
    <text class="hard-negative-mining-desc" x="280" y="182">describing a different entity or</text>
    <text class="hard-negative-mining-desc" x="280" y="198">policy.</text>
  </g>
  <line class="hard-negative-mining-line hard-negative-mining-conn hard-negative-mining-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hard-negative-mining-tip)"/>
  <g class="hard-negative-mining-stage hard-negative-mining-s2">
    <rect class="hard-negative-mining-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hard-negative-mining-step" x="516" y="142">03</text>
    <text class="hard-negative-mining-name" x="542" y="142">Convert to a test case</text>
    <text class="hard-negative-mining-desc" x="516" y="166">Query, distractors, and the</text>
    <text class="hard-negative-mining-desc" x="516" y="182">correct abstention as ground</text>
    <text class="hard-negative-mining-desc" x="516" y="198">truth.</text>
  </g>
  <line class="hard-negative-mining-line hard-negative-mining-conn hard-negative-mining-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hard-negative-mining-tip)"/>
  <g class="hard-negative-mining-stage hard-negative-mining-s3">
    <rect class="hard-negative-mining-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hard-negative-mining-step" x="752" y="142">04</text>
    <text class="hard-negative-mining-name" x="778" y="142">Add to CI</text>
    <text class="hard-negative-mining-desc" x="752" y="166">So the same hallucination cannot</text>
    <text class="hard-negative-mining-desc" x="752" y="182">recur.</text>
  </g>
  <text class="hard-negative-mining-sub" x="30" y="304">High similarity with negative feedback is precisely the signal worth mining: the retrieval worked by its own metric and the answer was wrong, which is where the interesting failures live.</text>
</svg>
