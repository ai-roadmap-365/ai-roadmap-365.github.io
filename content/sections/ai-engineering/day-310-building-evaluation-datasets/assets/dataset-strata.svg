<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Happy paths are the smallest useful half.">
  <title>Four strata, deliberately weighted</title>
  <style>
    .dataset-strata-bg   { fill: #f8fafc; }
    .dataset-strata-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-strata-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-strata-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-strata-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-strata-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-strata-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataset-strata-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dataset-strata-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dataset-strata-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dataset-strata-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dataset-strata-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dataset-strata-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dataset-strata-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dataset-strata-stage { opacity: 1; }

    .dataset-strata-s0 { animation-delay: 0.00s; }
    .dataset-strata-e0 { animation-delay: 0.00s; }
    .dataset-strata-s1 { animation-delay: 1.28s; }
    .dataset-strata-e1 { animation-delay: 1.28s; }
    .dataset-strata-s2 { animation-delay: 2.56s; }
    .dataset-strata-e2 { animation-delay: 2.56s; }
    .dataset-strata-s3 { animation-delay: 3.84s; }
    .dataset-strata-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dataset-strata-conn  { animation: dataset-strata-trace 6.4s ease-in-out infinite; }
      .dataset-strata-stage { animation: dataset-strata-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dataset-strata-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dataset-strata-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dataset-strata-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dataset-strata-stage { animation: dataset-strata-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dataset-strata-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dataset-strata-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dataset-strata-bg" width="980" height="322"/>
  <text class="dataset-strata-h1"  x="30" y="40">Four strata, deliberately weighted</text>
  <text class="dataset-strata-sub" x="30" y="64">Happy paths are the smallest useful half.</text>
  <g class="dataset-strata-stage dataset-strata-s0">
    <rect class="dataset-strata-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-strata-step" x="44" y="142">01</text>
    <text class="dataset-strata-name" x="70" y="142">Standard conditions, ~50%</text>
    <text class="dataset-strata-desc" x="44" y="166">The core invariants. What the</text>
    <text class="dataset-strata-desc" x="44" y="182">system is for.</text>
  </g>
  <line class="dataset-strata-line dataset-strata-conn dataset-strata-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dataset-strata-tip)"/>
  <g class="dataset-strata-stage dataset-strata-s1">
    <rect class="dataset-strata-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-strata-step" x="280" y="142">02</text>
    <text class="dataset-strata-name" x="306" y="142">Hard negatives, ~25%</text>
    <text class="dataset-strata-desc" x="280" y="166">Answers that are not in the</text>
    <text class="dataset-strata-desc" x="280" y="182">context. The model must abstain.</text>
  </g>
  <line class="dataset-strata-line dataset-strata-conn dataset-strata-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dataset-strata-tip)"/>
  <g class="dataset-strata-stage dataset-strata-s2">
    <rect class="dataset-strata-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-strata-step" x="516" y="142">03</text>
    <text class="dataset-strata-name" x="542" y="142">Boundary conditions, ~15%</text>
    <text class="dataset-strata-desc" x="516" y="166">Empty strings, emoji, huge</text>
    <text class="dataset-strata-desc" x="516" y="182">payloads, schema edges.</text>
  </g>
  <line class="dataset-strata-line dataset-strata-conn dataset-strata-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dataset-strata-tip)"/>
  <g class="dataset-strata-stage dataset-strata-s3">
    <rect class="dataset-strata-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dataset-strata-step" x="752" y="142">04</text>
    <text class="dataset-strata-name" x="778" y="142">Adversarial, ~10%</text>
    <text class="dataset-strata-desc" x="752" y="166">Injection attempts and prompt</text>
    <text class="dataset-strata-desc" x="752" y="182">extraction.</text>
  </g>
  <text class="dataset-strata-sub" x="30" y="304">The second stratum is the one most datasets omit entirely, and it tests the behaviour that separates a trustworthy system from a fluent one: correctly saying that the answer is not available.</text>
</svg>
