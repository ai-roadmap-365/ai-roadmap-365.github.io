learning_promise: 'Master query rewriting, expansion, and routing: implement Hypothetical Document Embeddings
  (HyDE), multi-query expansion, step-back prompting, and semantic query routers in Python.'
objectives:
- Deconstruct the fundamental vocabulary asymmetry problem between short user questions and long informative
  passage answers in vector space.
- Implement Hypothetical Document Embeddings (HyDE) generating synthetic answer passages to bridge the
  query-to-document embedding gap.
- Implement Multi-Query Expansion generating diverse paraphrased search vectors to maximize recall across
  ambiguous inquiries.
- Build a production-grade Query Transformation & Semantic Router Engine in Python directing queries to
  Vector Search, SQL Databases, or Direct LLM bypass.
- Evaluate latency and token cost trade-offs of pre-retrieval LLM rewriting passes.
