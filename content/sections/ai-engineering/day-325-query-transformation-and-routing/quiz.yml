questions:
- question: What is the 'Vocabulary Asymmetry Problem' in vector search?
  options:
  - When words are spelled in reverse
  - User queries are typically short, interrogative, and question-framed (e.g. 'How do I fix 403?'), whereas
    relevant knowledge base passages are long, declarative, and technical (e.g. 'HTTP 403 Forbidden indicates
    credentials lack required IAM permissions'); their raw vector embeddings often sit far apart in vector
    space
  - When search engines only index numbers
  - When users write queries in JavaScript
  answer_index: 1
  explanation: Short questions and long declarative answers occupy different regions of embedding vector
    space.
- question: How does Hypothetical Document Embeddings (HyDE) solve vocabulary asymmetry?
  options:
  - By deleting user queries
  - By prompting a fast LLM to generate a hypothetical synthetic answer passage, and then embedding that
    hypothetical document; because the hypothetical answer is declarative, its embedding vector aligns
    closely with real answer passages in the index
  - By sorting the database in reverse
  - By running SQL queries without where clauses
  answer_index: 1
  explanation: HyDE embeds a synthetic hypothetical answer, shifting search from question-to-document
    to document-to-document space.
- question: What is 'Multi-Query Expansion'?
  options:
  - Sending 100 duplicate HTTP requests to the same server
  - Using an LLM to generate 3 to 5 semantically diverse rephrasings of the user's inquiry, executing
    parallel searches for each variant, and merging the retrieved candidate pools to maximize recall
  - Multiplying the query length by 5
  - Translating queries into Morse code
  answer_index: 1
  explanation: Multi-query expansion generates diverse paraphrases to overcome narrow query phrasing limitations.
- question: What is the primary responsibility of a 'Semantic Query Router'?
  options:
  - To buy internet domain names
  - To inspect incoming user queries and intelligently route them to the optimal data source (e.g. Text2SQL
    for structured tables, Vector Search for unstructured documentation, or Direct LLM bypass for greetings)
  - To restart the server on error
  - To encrypt files on disk
  answer_index: 1
  explanation: Query routers direct inquiries to the appropriate retrieval engine (Vector DB, SQL, Graph,
    or LLM bypass).
- question: What is 'Step-Back Prompting' in query transformation?
  options:
  - Asking the user to retype their question
  - Deriving a more abstract, high-level conceptual question from a specific inquiry (e.g. converting
    'Why did my PostgreSQL vacuum process hang on table orders?' into 'What conditions cause vacuum locks
    in PostgreSQL?'), retrieving foundational principles to guide generation
  - Deleting the last word of the prompt
  - Reversing the token order
  answer_index: 1
  explanation: Step-back prompting generates an abstract high-level query to retrieve fundamental conceptual
    principles.
