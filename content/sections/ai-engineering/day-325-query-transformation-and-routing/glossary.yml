terms:
- term: Hypothetical Document Embeddings (HyDE)
  definition: A technique embedding a generated hypothetical answer to bridge question-to-document vector
    asymmetry.
- term: Query Expansion
  definition: Generating multiple paraphrased variations of a user query to widen search recall across
    distinct terminologies.
- term: Semantic Query Router
  definition: A decision gateway directing user queries to specialized retrieval backends (SQL, Vector,
    Graph, Web).
- term: Step-Back Prompting
  definition: Deriving a higher-level abstract question to retrieve foundational principles and context.
- term: Vocabulary Asymmetry
  definition: The semantic embedding vector gap between short questions and detailed declarative answers.
- term: Sub-Query Decomposition
  definition: Breaking a complex multi-part question into independent atomic queries executed in parallel.
- term: Pre-Retrieval Rewriting
  definition: Transforming raw user prompts into optimized search queries before database lookup.
- term: Routing Classifier
  definition: A lightweight model or heuristic mapping queries to structured or unstructured data sources.
