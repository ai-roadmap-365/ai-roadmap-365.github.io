<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="HyDE: Hypothetical Document Embedding Flow">
  <title>HyDE: Hypothetical Document Embedding Flow</title>
  <defs>
    <style>
      .d325a-bg { fill: #f8fafc; }
      .d325a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d325a-s1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d325a-s2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d325a-s3 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d325a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d325a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d325a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d325a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d325a-bg" />
  
  <text x="40" y="40" class="d325a-title">Hypothetical Document Embeddings (HyDE) Pipeline</text>
  <text x="40" y="65" class="d325a-subtitle">HyDE: Hypothetical Document Embedding Flow showing User Question, Fast LLM generating Synthetic Hypothetical Document, Embedding Vector, and Document-to-Document Search</text>
  
  <!-- Step 1: User Query -->
  <rect x="40" y="110" width="250" height="270" class="d325a-s1" />
  <text x="60" y="145" class="d325a-header" fill="#1d4ed8">1. Raw Question (Asymmetric)</text>
  <text x="60" y="180" class="d325a-text">• "Why does Postgres vacuum hang?"</text>
  <text x="60" y="205" class="d325a-text">• Short, interrogative tone</text>
  <text x="60" y="230" class="d325a-text">• Direct vector search fails</text>
  <text x="60" y="255" class="d325a-text">• Vocabulary gap with docs</text>
  <text x="60" y="295" class="d325a-text" font-weight="600" fill="#1d4ed8">Problem:</text>
  <text x="60" y="320" class="d325a-text">Question-to-Doc distance is wide</text>
  
  <!-- Step 2: HyDE Generator -->
  <rect x="325" y="110" width="250" height="270" class="d325a-s2" />
  <text x="345" y="145" class="d325a-header" fill="#7e22ce">2. Synthetic Passage Gen</text>
  <text x="345" y="180" class="d325a-text">• Prompt compact LLM:</text>
  <text x="345" y="205" class="d325a-text">  "Write a scientific answer..."</text>
  <text x="345" y="230" class="d325a-text">• **Hypothetical Output:**</text>
  <text x="345" y="255" class="d325a-text">  "PostgreSQL VACUUM locks occur</text>
  <text x="345" y="275" class="d325a-text">  when long-running transactions..."</text>
  <text x="345" y="315" class="d325a-text" font-weight="600" fill="#7e22ce">Transformation: Declarative Doc</text>
  
  <!-- Step 3: Doc-to-Doc Search -->
  <rect x="610" y="110" width="250" height="270" class="d325a-s3" />
  <text x="630" y="145" class="d325a-header" fill="#15803d">3. Doc-to-Doc Vector Search</text>
  <text x="630" y="180" class="d325a-text">• Embed hypothetical passage</text>
  <text x="630" y="205" class="d325a-text">• Vector space: Document-to-Doc</text>
  <text x="630" y="230" class="d325a-text">• Cosine alignment: 0.96</text>
  <text x="630" y="255" class="d325a-text">• **Retrieves Real Postgres Manual**</text>
  <text x="630" y="295" class="d325a-text" font-weight="600" fill="#15803d">Outcome: Perfect Recall</text>
  <text x="630" y="320" class="d325a-text">Zero vocabulary gap failure</text>
</svg>