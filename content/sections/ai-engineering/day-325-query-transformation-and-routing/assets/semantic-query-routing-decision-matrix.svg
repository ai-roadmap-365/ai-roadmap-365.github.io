<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Semantic Query Routing Decision Matrix">
  <title>Semantic Query Routing Decision Matrix</title>
  <defs>
    <style>
      .d325b-bg { fill: #f8fafc; }
      .d325b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d325b-r1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 6px; }
      .d325b-r2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 6px; }
      .d325b-r3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 6px; }
      .d325b-r4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d325b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d325b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d325b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d325b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d325b-bg" />
  
  <text x="40" y="40" class="d325a-title">Semantic Query Routing Gateway</text>
  <text x="40" y="65" class="d325a-subtitle">Semantic Query Routing Decision Matrix showing Query Router classifying user intent into Text2SQL, Vector RAG, GraphRAG, or Direct LLM Bypass</text>
  
  <!-- Route 1: Text2SQL -->
  <rect x="40" y="110" width="190" height="270" class="d325b-r1" />
  <text x="55" y="140" class="d325b-header" fill="#1d4ed8">1. Text2SQL Router</text>
  <text x="55" y="170" class="d325b-text">• **Intent:** Structured aggregations</text>
  <text x="55" y="190" class="d325b-text">• **Example:**</text>
  <text x="55" y="210" class="d325b-text">  "Total sales in Q3 by region"</text>
  <text x="55" y="240" class="d325b-text">• **Target:**</text>
  <text x="55" y="260" class="d325b-text">  PostgreSQL / Snowflake</text>
  <text x="55" y="300" class="d325b-text" font-weight="600">Zero RAG hallucination</text>
  
  <!-- Route 2: Vector RAG -->
  <rect x="250" y="110" width="190" height="270" class="d325b-r2" />
  <text x="265" y="140" class="d325b-header" fill="#7e22ce">2. Vector RAG</text>
  <text x="265" y="170" class="d325b-text">• **Intent:** Unstructured semantics</text>
  <text x="265" y="190" class="d325b-text">• **Example:**</text>
  <text x="265" y="210" class="d325b-text">  "How to configure SSO?"</text>
  <text x="265" y="240" class="d325b-text">• **Target:**</text>
  <text x="265" y="260" class="d325b-text">  Hybrid Search + Rerank</text>
  <text x="265" y="300" class="d325b-text" font-weight="600">High Precision Passage</text>
  
  <!-- Route 3: GraphRAG -->
  <rect x="460" y="110" width="190" height="270" class="d325b-r3" />
  <text x="475" y="140" class="d325b-header" fill="#a16207">3. GraphRAG Router</text>
  <text x="475" y="170" class="d325b-text">• **Intent:** Multi-hop entities</text>
  <text x="475" y="190" class="d325b-text">• **Example:**</text>
  <text x="475" y="210" class="d325b-text">  "Which vendors link to CEO?"</text>
  <text x="475" y="240" class="d325b-text">• **Target:**</text>
  <text x="475" y="260" class="d325b-text">  Neo4j / Knowledge Graph</text>
  <text x="475" y="300" class="d325b-text" font-weight="600">Multi-Hop Traversal</text>
  
  <!-- Route 4: Direct Bypass -->
  <rect x="670" y="110" width="190" height="270" class="d325b-r4" />
  <text x="685" y="140" class="d325b-header" fill="#15803d">4. Direct LLM Bypass</text>
  <text x="685" y="170" class="d325b-text">• **Intent:** Conversational / Chit-chat</text>
  <text x="685" y="190" class="d325b-text">• **Example:**</text>
  <text x="685" y="210" class="d325b-text">  "Hello!", "Who are you?"</text>
  <text x="685" y="240" class="d325b-text">• **Target:**</text>
  <text x="685" y="260" class="d325b-text">  Zero Database Calls</text>
  <text x="685" y="300" class="d325b-text" font-weight="600">Instant 15ms Response</text>
</svg>