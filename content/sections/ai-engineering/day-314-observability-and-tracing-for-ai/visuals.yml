visuals:
- id: distributed-ai-span-tree-architecture
  file: assets/distributed-ai-span-tree-architecture.svg
  type: diagram
  title: Distributed AI Span Tree Architecture
  alt: Distributed AI Span Tree Architecture showing Root Trace, Child Spans for Query Embedding, Vector
    DB Search, Prompt Construction, LLM Inference, and Guardrail Scan
  description: Hierarchical span tree showing nested distributed tracing across an AI pipeline.
- id: production-feedback-to-eval-flywheel
  file: assets/production-feedback-to-eval-flywheel.svg
  type: diagram
  title: Production Feedback to Eval Flywheel
  alt: Production Feedback to Eval Flywheel showing Live Production Traffic, Trace Logging, User Thumbs
    Down, Triage & Clustering, and Eval Dataset Append
  description: Lifecycle diagram showing user feedback capturing and automated evaluation dataset enrichment.
- id: span-tree
  file: assets/span-tree.svg
  type: diagram
  title: 'What a trace records'
  alt: 'Diagram: the contents of a span in an AI system trace'
  description: 'A four-stage description of the information captured in an AI trace span covering identity, timing, payloads and economics.'
- id: logs-or-traces
  file: assets/logs-or-traces.svg
  type: diagram
  title: 'A flat log, or a span tree'
  alt: 'Diagram: unstructured logging compared with distributed tracing for a failed request'
  description: 'A two-column comparison of flat log searching against a distributed span tree when diagnosing a failure.'
- id: tracing-lineage
  file: assets/tracing-lineage.svg
  type: diagram
  title: 'Three generations of tracing'
  alt: 'Diagram: the progression from RPC tracing to generative AI observability'
  description: 'A three-stage progression of distributed tracing from Dapper through OpenTelemetry to OpenInference semantic conventions.'
- id: observability-uses
  file: assets/observability-uses.svg
  type: diagram
  title: 'Three things traces enable'
  alt: 'Diagram: the three operational capabilities distributed AI tracing provides'
  description: 'A three-stage description of tracing benefits covering root-cause debugging, token cost control and the feedback flywheel.'
- id: parcel-tracking
  file: assets/parcel-tracking.svg
  type: diagram
  title: 'A parcel tracking barcode'
  alt: 'Diagram: parcel tracking as an analogy for distributed tracing'
  description: 'A two-column comparison of an untracked delivery against one scanned at each stage.'
- id: telemetry-pipeline
  file: assets/telemetry-pipeline.svg
  type: diagram
  title: 'Getting telemetry off the request path'
  alt: 'Diagram: the stages of a high-throughput telemetry pipeline'
  description: 'A four-stage description of a telemetry pipeline covering non-blocking buffering, streaming ingestion, columnar storage and dashboards.'
- id: tail-sampling
  file: assets/tail-sampling.svg
  type: diagram
  title: 'Tail-based sampling'
  alt: 'Diagram: tail-based trace sampling by outcome'
  description: 'A four-stage description of tail-based sampling covering failures, slow traces, rated sessions and routine requests.'
- id: token-economics
  file: assets/token-economics.svg
  type: diagram
  title: 'Token economics on the dashboard'
  alt: 'Diagram: the token economics signals worth monitoring'
  description: 'A three-stage description of token economics telemetry covering cache hit ratio, tenant quotas and anomaly alerting.'
- id: feedback-correlation
  file: assets/feedback-correlation.svg
  type: diagram
  title: 'When the benchmark disagrees with users'
  alt: 'Diagram: correlating offline evaluation scores with live user satisfaction'
  description: 'A two-column comparison of aligned and misaligned offline evaluation against production user feedback.'
- id: latency-case
  file: assets/latency-case.svg
  type: diagram
  title: 'Where the five seconds went'
  alt: 'Diagram: the span breakdown of a latency investigation'
  description: 'A four-stage walkthrough of a latency investigation showing the actual distribution of time across spans.'
- id: observability-when
  file: assets/observability-when.svg
  type: diagram
  title: 'Where tracing is required'
  alt: 'Diagram: when to implement AI observability and what to avoid'
  description: 'A two-column comparison of systems requiring distributed tracing against those that do not, with common anti-patterns.'
