title: Observability and Tracing for AI
section: ai-engineering
subsection: production-ai-systems
week: 45
learning_promise: 'Master production observability and distributed tracing for LLM applications: instrument
  span trees with OpenTelemetry, track token economics and p99 latencies, capture user feedback loops,
  and debug multi-agent execution traces.'
objectives:
- Architect distributed tracing pipelines capturing nested span trees for retrieval, prompt formatting,
  LLM generation, tool calls, and post-processing.
- Instrument OpenTelemetry and OpenInference semantic conventions for generative AI applications.
- Track real-time token economics (input tokens, cached tokens, output tokens, financial costs per user/tenant).
- Implement a production Trace & Telemetry Engine in Python supporting contextual span creation, duration
  timing, token accounting, and JSON trace export.
- Integrate production user feedback loops (thumbs-up/down, ratings, escalations) into continuous evaluation
  datasets.
