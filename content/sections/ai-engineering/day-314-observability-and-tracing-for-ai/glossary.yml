terms:
- term: AI Observability
  definition: Monitoring, tracing, evaluating, and debugging the runtime behavior and economics of production
    AI systems.
- term: Distributed Trace
  definition: An end-to-end record of an entire user request through all downstream services, LLMs, and
    databases.
- term: Span
  definition: A single contiguous unit of work within a trace (e.g. vector search, LLM completion, guardrail
    check).
- term: OpenInference
  definition: An open standard extending OpenTelemetry semantic conventions specifically for AI systems.
- term: Token Telemetry
  definition: Tracking input tokens, cached tokens, output tokens, and financial costs per request.
- term: Feedback Loop
  definition: Capturing user ratings (thumbs up/down, corrections) and feeding failed interactions into
    evaluation datasets.
- term: Time to First Token (TTFT)
  definition: The latency in milliseconds from sending a prompt until receiving the first streamed token.
- term: Inter-Token Latency (ITL)
  definition: The average time in milliseconds between consecutive streamed tokens.
