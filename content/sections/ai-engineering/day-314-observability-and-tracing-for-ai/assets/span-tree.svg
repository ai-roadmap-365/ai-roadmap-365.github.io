<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things per span.">
  <title>What a trace records</title>
  <style>
    .span-tree-bg   { fill: #f8fafc; }
    .span-tree-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-tree-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-tree-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-tree-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-tree-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-tree-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .span-tree-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .span-tree-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .span-tree-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .span-tree-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .span-tree-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .span-tree-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .span-tree-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .span-tree-stage { opacity: 1; }

    .span-tree-s0 { animation-delay: 0.00s; }
    .span-tree-e0 { animation-delay: 0.00s; }
    .span-tree-s1 { animation-delay: 1.28s; }
    .span-tree-e1 { animation-delay: 1.28s; }
    .span-tree-s2 { animation-delay: 2.56s; }
    .span-tree-e2 { animation-delay: 2.56s; }
    .span-tree-s3 { animation-delay: 3.84s; }
    .span-tree-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .span-tree-conn  { animation: span-tree-trace 6.4s ease-in-out infinite; }
      .span-tree-stage { animation: span-tree-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes span-tree-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes span-tree-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .span-tree-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .span-tree-stage { animation: span-tree-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes span-tree-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="span-tree-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="span-tree-bg" width="980" height="322"/>
  <text class="span-tree-h1"  x="30" y="40">What a trace records</text>
  <text class="span-tree-sub" x="30" y="64">Four things per span.</text>
  <g class="span-tree-stage span-tree-s0">
    <rect class="span-tree-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="span-tree-step" x="44" y="142">01</text>
    <text class="span-tree-name" x="70" y="142">Identity</text>
    <text class="span-tree-desc" x="44" y="166">A trace ID, a span ID and a</text>
    <text class="span-tree-desc" x="44" y="182">parent, so the tree</text>
    <text class="span-tree-desc" x="44" y="198">reconstructs.</text>
  </g>
  <line class="span-tree-line span-tree-conn span-tree-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#span-tree-tip)"/>
  <g class="span-tree-stage span-tree-s1">
    <rect class="span-tree-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="span-tree-step" x="280" y="142">02</text>
    <text class="span-tree-name" x="306" y="142">Timing</text>
    <text class="span-tree-desc" x="280" y="166">Start and end, to microseconds.</text>
    <text class="span-tree-desc" x="280" y="182">Where the seconds went.</text>
    <text class="span-tree-edge" x="280" y="242">duration</text>
  </g>
  <line class="span-tree-line span-tree-conn span-tree-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#span-tree-tip)"/>
  <g class="span-tree-stage span-tree-s2">
    <rect class="span-tree-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="span-tree-step" x="516" y="142">03</text>
    <text class="span-tree-name" x="542" y="142">Payloads</text>
    <text class="span-tree-desc" x="516" y="166">Prompt version, retrieved</text>
    <text class="span-tree-desc" x="516" y="182">documents, model parameters —</text>
    <text class="span-tree-desc" x="516" y="198">scrubbed.</text>
  </g>
  <line class="span-tree-line span-tree-conn span-tree-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#span-tree-tip)"/>
  <g class="span-tree-stage span-tree-s3">
    <rect class="span-tree-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="span-tree-step" x="752" y="142">04</text>
    <text class="span-tree-name" x="778" y="142">Economics</text>
    <text class="span-tree-desc" x="752" y="166">Input, cached and output tokens,</text>
    <text class="span-tree-desc" x="752" y="182">and the cost.</text>
    <text class="span-tree-edge" x="752" y="242">per span</text>
  </g>
  <text class="span-tree-sub" x="30" y="304">The third and fourth are what distinguish AI tracing from ordinary APM: no web service span needs to record which documents were retrieved or how many tokens were cached.</text>
</svg>
