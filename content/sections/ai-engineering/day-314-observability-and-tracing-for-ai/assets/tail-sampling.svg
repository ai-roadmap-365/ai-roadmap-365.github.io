<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Keep what is interesting, sample the rest.">
  <title>Tail-based sampling</title>
  <style>
    .tail-sampling-bg   { fill: #f8fafc; }
    .tail-sampling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tail-sampling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tail-sampling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tail-sampling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tail-sampling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tail-sampling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tail-sampling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tail-sampling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tail-sampling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tail-sampling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tail-sampling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tail-sampling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tail-sampling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tail-sampling-stage { opacity: 1; }

    .tail-sampling-s0 { animation-delay: 0.00s; }
    .tail-sampling-e0 { animation-delay: 0.00s; }
    .tail-sampling-s1 { animation-delay: 1.28s; }
    .tail-sampling-e1 { animation-delay: 1.28s; }
    .tail-sampling-s2 { animation-delay: 2.56s; }
    .tail-sampling-e2 { animation-delay: 2.56s; }
    .tail-sampling-s3 { animation-delay: 3.84s; }
    .tail-sampling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tail-sampling-conn  { animation: tail-sampling-trace 6.4s ease-in-out infinite; }
      .tail-sampling-stage { animation: tail-sampling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tail-sampling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tail-sampling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tail-sampling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tail-sampling-stage { animation: tail-sampling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tail-sampling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tail-sampling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tail-sampling-bg" width="980" height="322"/>
  <text class="tail-sampling-h1"  x="30" y="40">Tail-based sampling</text>
  <text class="tail-sampling-sub" x="30" y="64">Keep what is interesting, sample the rest.</text>
  <g class="tail-sampling-stage tail-sampling-s0">
    <rect class="tail-sampling-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tail-sampling-step" x="44" y="142">01</text>
    <text class="tail-sampling-name" x="70" y="142">Every failure</text>
    <text class="tail-sampling-desc" x="44" y="166">100%. These are the ones you</text>
    <text class="tail-sampling-desc" x="44" y="182">will need.</text>
  </g>
  <line class="tail-sampling-line tail-sampling-conn tail-sampling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tail-sampling-tip)"/>
  <g class="tail-sampling-stage tail-sampling-s1">
    <rect class="tail-sampling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tail-sampling-step" x="280" y="142">02</text>
    <text class="tail-sampling-name" x="306" y="142">Every slow trace</text>
    <text class="tail-sampling-desc" x="280" y="166">Above the latency threshold. The</text>
    <text class="tail-sampling-desc" x="280" y="182">tail is where the complaints</text>
    <text class="tail-sampling-desc" x="280" y="198">are.</text>
    <text class="tail-sampling-edge" x="280" y="242">&gt; 2000ms</text>
  </g>
  <line class="tail-sampling-line tail-sampling-conn tail-sampling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tail-sampling-tip)"/>
  <g class="tail-sampling-stage tail-sampling-s2">
    <rect class="tail-sampling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tail-sampling-step" x="516" y="142">03</text>
    <text class="tail-sampling-name" x="542" y="142">Every rated session</text>
    <text class="tail-sampling-desc" x="516" y="166">Thumbs up or down. These become</text>
    <text class="tail-sampling-desc" x="516" y="182">evaluation cases.</text>
  </g>
  <line class="tail-sampling-line tail-sampling-conn tail-sampling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tail-sampling-tip)"/>
  <g class="tail-sampling-stage tail-sampling-s3">
    <rect class="tail-sampling-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tail-sampling-step" x="752" y="142">04</text>
    <text class="tail-sampling-name" x="778" y="142">5% of routine requests</text>
    <text class="tail-sampling-desc" x="752" y="166">Enough to characterise normal,</text>
    <text class="tail-sampling-desc" x="752" y="182">cheap enough to store.</text>
  </g>
  <text class="tail-sampling-sub" x="30" y="304">Deciding after the request completes is what makes this work: head-based sampling has to choose before it knows the outcome, and the interesting traces are precisely the unusual ones.</text>
</svg>
