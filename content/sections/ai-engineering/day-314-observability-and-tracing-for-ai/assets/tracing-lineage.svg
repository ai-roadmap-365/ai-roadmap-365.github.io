<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Dapper, OpenTelemetry, then AI conventions.">
  <title>Three generations of tracing</title>
  <style>
    .tracing-lineage-bg   { fill: #f8fafc; }
    .tracing-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracing-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracing-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracing-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracing-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracing-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracing-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tracing-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tracing-lineage-stage { opacity: 1; }

    .tracing-lineage-s0 { animation-delay: 0.00s; }
    .tracing-lineage-e0 { animation-delay: 0.00s; }
    .tracing-lineage-s1 { animation-delay: 1.50s; }
    .tracing-lineage-e1 { animation-delay: 1.50s; }
    .tracing-lineage-s2 { animation-delay: 3.00s; }
    .tracing-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .tracing-lineage-conn  { animation: tracing-lineage-trace 6s ease-in-out infinite; }
      .tracing-lineage-stage { animation: tracing-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes tracing-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tracing-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tracing-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tracing-lineage-stage { animation: tracing-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tracing-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tracing-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tracing-lineage-bg" width="980" height="322"/>
  <text class="tracing-lineage-h1"  x="30" y="40">Three generations of tracing</text>
  <text class="tracing-lineage-sub" x="30" y="64">Dapper, OpenTelemetry, then AI conventions.</text>
  <g class="tracing-lineage-stage tracing-lineage-s0">
    <rect class="tracing-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="tracing-lineage-step" x="44" y="142">01</text>
    <text class="tracing-lineage-name" x="70" y="142">Dapper, 2010-2018</text>
    <text class="tracing-lineage-desc" x="44" y="166">trace_id and span_id for RPC calls. Jaeger,</text>
    <text class="tracing-lineage-desc" x="44" y="182">Zipkin, Datadog.</text>
  </g>
  <line class="tracing-lineage-line tracing-lineage-conn tracing-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#tracing-lineage-tip)"/>
  <g class="tracing-lineage-stage tracing-lineage-s1">
    <rect class="tracing-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="tracing-lineage-step" x="359" y="142">02</text>
    <text class="tracing-lineage-name" x="385" y="142">OpenTelemetry, 2019-2022</text>
    <text class="tracing-lineage-desc" x="359" y="166">A vendor-neutral standard, merging two</text>
    <text class="tracing-lineage-desc" x="359" y="182">competing ones.</text>
  </g>
  <line class="tracing-lineage-line tracing-lineage-conn tracing-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#tracing-lineage-tip)"/>
  <g class="tracing-lineage-stage tracing-lineage-s2">
    <rect class="tracing-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="tracing-lineage-step" x="674" y="142">03</text>
    <text class="tracing-lineage-name" x="700" y="142">OpenInference, 2023</text>
    <text class="tracing-lineage-desc" x="674" y="166">Prompt templates, token counts, retrieved</text>
    <text class="tracing-lineage-desc" x="674" y="182">documents, judge scores.</text>
  </g>
  <text class="tracing-lineage-sub" x="30" y="304">The third generation is a set of conventions rather than a new mechanism: the span model was already right, and what was missing was agreement on what an AI span should carry.</text>
</svg>
