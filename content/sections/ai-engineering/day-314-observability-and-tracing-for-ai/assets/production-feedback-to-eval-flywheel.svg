<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Production Feedback to Eval Flywheel">
  <title>Production Feedback to Eval Flywheel</title>
  <defs>
    <style>
      .d314f-bg { fill: #f8fafc; }
      .d314f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d314f-p1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d314f-p2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d314f-p3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d314f-p4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d314f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d314f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d314f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d314f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d314f-bg" />
  
  <text x="40" y="40" class="d314a-title">Production Observability to Evaluation Flywheel</text>
  <text x="40" y="65" class="d314a-subtitle">Production Feedback to Eval Flywheel showing Live Production Traffic, Trace Logging, User Thumbs Down, Triage &amp; Clustering, and Eval Dataset Append</text>
  
  <!-- Step 1: Live Traffic & Tracing -->
  <rect x="40" y="110" width="180" height="270" class="d314f-p1" />
  <text x="55" y="140" class="d314f-header" fill="#1d4ed8">1. Production Tracing</text>
  <text x="55" y="170" class="d314f-text">• 50k User chats / day</text>
  <text x="55" y="190" class="d314f-text">• OpenTelemetry traces</text>
  <text x="55" y="210" class="d314f-text">• Full prompt &amp; context</text>
  <text x="55" y="230" class="d314f-text">• Token cost &amp; latencies</text>
  <text x="55" y="260" class="d314f-text" font-weight="600">Store:</text>
  <text x="55" y="280" class="d314f-text">Postgres / ClickHouse</text>
  
  <!-- Step 2: User Feedback Signal -->
  <rect x="250" y="110" width="180" height="270" class="d314f-p2" />
  <text x="265" y="140" class="d314f-header" fill="#7e22ce">2. Feedback Signal</text>
  <text x="265" y="170" class="d314f-text">• Thumbs Down rating</text>
  <text x="265" y="190" class="d314f-text">• User correction typed</text>
  <text x="265" y="210" class="d314f-text">• Customer escalation</text>
  <text x="265" y="230" class="d314f-text">• Guardrail blocked event</text>
  <text x="265" y="260" class="d314f-text" font-weight="600">Volume:</text>
  <text x="265" y="280" class="d314f-text">~ 2% Negative signal</text>
  
  <!-- Step 3: Triage & Cluster -->
  <rect x="460" y="110" width="180" height="270" class="d314f-p3" />
  <text x="475" y="140" class="d314f-header" fill="#a16207">3. Failure Triage</text>
  <text x="475" y="170" class="d314f-text">• Semantic clustering</text>
  <text x="475" y="190" class="d314f-text">• Identify root causes:</text>
  <text x="475" y="205" class="d314f-text">  (Missing doc, prompt</text>
  <text x="475" y="220" class="d314f-text">   ambiguity, timeout)</text>
  <text x="475" y="260" class="d314f-text" font-weight="600">Action:</text>
  <text x="475" y="280" class="d314f-text">Label ground truth</text>
  
  <!-- Step 4: Golden Eval Benchmark -->
  <rect x="670" y="110" width="190" height="270" class="d314f-p4" />
  <text x="685" y="140" class="d314f-header" fill="#15803d">4. Continuous Evals</text>
  <text x="685" y="170" class="d314f-text">• Append to eval suite</text>
  <text x="685" y="190" class="d314f-text">• Golden regression test</text>
  <text x="685" y="210" class="d314f-text">• Continuous CI gating</text>
  <text x="685" y="230" class="d314f-text">• Self-improving product</text>
  <text x="685" y="260" class="d314f-text" font-weight="600">Result:</text>
  <text x="685" y="280" class="d314f-text" fill="#15803d" font-weight="700">Durable Moat</text>
</svg>