questions:
- question: Why is traditional microservice APM (like standard HTTP request tracing) insufficient for
    diagnosing complex LLM and RAG applications?
  options:
  - Because APM tools do not support Python
  - Because traditional APM tracks only high-level HTTP status codes and endpoint durations, failing to
    capture nested LLM prompts, retrieved chunk metadata, token usage breakdowns, prompt version tags,
    tool call arguments, and model hallucination scores
  - Because LLMs do not use HTTP requests
  - Because tracing makes language models stop working
  answer_index: 1
  explanation: AI observability requires capturing nested spans containing prompts, completions, token
    counts, and retrieved context chunks.
- question: In OpenTelemetry and OpenInference standards, what is a 'Span Tree' in an AI workflow?
  options:
  - A hierarchical graph of nested operations (e.g. Root Request -> Embedding Generation -> Vector DB
    Retrieval -> Prompt Construction -> LLM Inference -> Guardrail Validation) capturing latency and payload
    metadata for each stage
  - A binary search tree for sorting strings
  - A network cabling topology
  - A database index
  answer_index: 0
  explanation: Span trees represent the hierarchical decomposition of a complex compound AI workflow.
- question: What is the primary benefit of tracking 'Token Telemetry' (Prompt Tokens, Completion Tokens,
    Cached Tokens) in production?
  options:
  - It makes the computer run faster
  - It enables real-time cost attribution by user/tenant, detects token inflation regressions in long-context
    agents, monitors prompt caching hit rates, and forecasts cloud GPU expenditures
  - It replaces database backups
  - It encrypts user passwords
  answer_index: 1
  explanation: Token telemetry allows financial accounting, rate limit governance, and caching optimization.
- question: How does closing the 'Production User Feedback Loop' accelerate model improvement?
  options:
  - By deleting user accounts who give negative feedback
  - By automatically capturing low-rated sessions (thumbs down, user corrections, escalated tickets),
    extracting the trace context, and converting failed interactions into new regression test cases in
    your evaluation dataset
  - By sending marketing emails to users
  - By restarting the server
  answer_index: 1
  explanation: Negative user feedback is the highest-signal source for discovering real-world edge cases.
- question: Which open-source telemetry framework is widely adopted for vendor-neutral tracing in AI engineering?
  options:
  - OpenTelemetry (OTel) with OpenInference semantic conventions
  - Flash Player
  - DirectX 12
  - Apache Subversion
  answer_index: 0
  explanation: OpenTelemetry and OpenInference provide standardized, vendor-neutral telemetry instrumentation.
