terms:
- term: claude_desktop_config.json
  definition: The standard configuration file defining the list of MCP servers, executable commands, and
    environment variables for Claude Desktop.
- term: mcpServers Key
  definition: The top-level JSON object in an MCP client configuration containing individual server declarations.
- term: Unbuffered I/O
  definition: A stream mode where output data is transmitted immediately without waiting for an internal
    buffer to fill.
- term: Stderr Logging
  definition: The practice of routing all diagnostic and debug output to standard error to prevent corrupting
    stdio JSON-RPC framing.
- term: MCP Server Manager
  definition: A software controller that spawns, monitors, communicates with, and terminates local MCP
    server subprocesses.
- term: Subprocess Pipe
  definition: An inter-process communication mechanism connecting the stdin/stdout streams of child processes
    to a parent host.
- term: Environment Injection
  definition: Passing secure credentials and tokens to child MCP server processes via environment variable
    maps.
- term: Process Lifecycle
  definition: The sequence of spawning, handshaking, polling, and gracefully terminating a server process.
