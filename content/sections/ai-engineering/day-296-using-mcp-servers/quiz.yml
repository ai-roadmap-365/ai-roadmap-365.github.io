questions:
- question: Where are local MCP servers registered for the Claude Desktop host client?
  options:
  - In `/etc/hosts`
  - In `claude_desktop_config.json` under the `mcpServers` configuration key
  - In browser cookies
  - In the macOS Keychain
  answer_index: 1
  explanation: '`claude_desktop_config.json` defines the command, arguments, and environment variables
    for each spawned MCP server process.'
- question: What is the most common reason a newly configured Python MCP server fails to respond to its
    client?
  options:
  - Python does not support JSON
  - Standard output buffering in Python delays JSON-RPC messages, or the server wrote debugging print
    statements directly to stdout instead of stderr
  - The server requires 64 GPUs
  - The client rejected the font family
  answer_index: 1
  explanation: MCP requires stdout to be reserved strictly for JSON-RPC 2.0 messages; printing debug text
    to stdout corrupts framing. Use stderr for logging.
- question: How does an MCP client pass API keys or secrets to a spawned stdio MCP server?
  options:
  - By posting them in public GitHub comments
  - Via the `env` dictionary block inside the `mcpServers` configuration object
  - By hardcoding them in the prompt text
  - Secrets cannot be used in MCP
  answer_index: 1
  explanation: The host application injects configured environment variables into the child process environment
    upon spawning.
- question: What flag ensures Python subprocesses do not buffer stdout when running as an MCP server?
  options:
  - '`-u` (unbuffered) or setting `PYTHONUNBUFFERED=1` in the environment'
  - '`--fast`'
  - '`-O3`'
  - '`--no-cache`'
  answer_index: 0
  explanation: Unbuffered I/O (`python -u`) guarantees that JSON-RPC lines are flushed immediately across
    the stdio pipe.
- question: When debugging an unresponsive MCP server, which stream should you inspect for stack traces?
  options:
  - The audio output stream
  - Standard Error (`stderr`), where logging and error diagnostics are routed
  - Standard Input (`stdin`)
  - The CPU temperature register
  answer_index: 1
  explanation: MCP specification mandates that all server logs and diagnostic traces be emitted to stderr.
