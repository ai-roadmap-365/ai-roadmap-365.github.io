<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Twenty seconds instead of fifteen minutes.">
  <title>Four servers, one investigation</title>
  <style>
    .incident-triage-bg   { fill: #f8fafc; }
    .incident-triage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-triage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-triage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-triage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-triage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-triage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .incident-triage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .incident-triage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .incident-triage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .incident-triage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .incident-triage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .incident-triage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .incident-triage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .incident-triage-stage { opacity: 1; }

    .incident-triage-s0 { animation-delay: 0.00s; }
    .incident-triage-e0 { animation-delay: 0.00s; }
    .incident-triage-s1 { animation-delay: 1.28s; }
    .incident-triage-e1 { animation-delay: 1.28s; }
    .incident-triage-s2 { animation-delay: 2.56s; }
    .incident-triage-e2 { animation-delay: 2.56s; }
    .incident-triage-s3 { animation-delay: 3.84s; }
    .incident-triage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .incident-triage-conn  { animation: incident-triage-trace 6.4s ease-in-out infinite; }
      .incident-triage-stage { animation: incident-triage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes incident-triage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes incident-triage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .incident-triage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .incident-triage-stage { animation: incident-triage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes incident-triage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="incident-triage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="incident-triage-bg" width="980" height="322"/>
  <text class="incident-triage-h1"  x="30" y="40">Four servers, one investigation</text>
  <text class="incident-triage-sub" x="30" y="64">Twenty seconds instead of fifteen minutes.</text>
  <g class="incident-triage-stage incident-triage-s0">
    <rect class="incident-triage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="incident-triage-step" x="44" y="142">01</text>
    <text class="incident-triage-name" x="70" y="142">Version control</text>
    <text class="incident-triage-desc" x="44" y="166">Commits deployed to the affected</text>
    <text class="incident-triage-desc" x="44" y="182">service in the last thirty</text>
    <text class="incident-triage-desc" x="44" y="198">minutes.</text>
  </g>
  <line class="incident-triage-line incident-triage-conn incident-triage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#incident-triage-tip)"/>
  <g class="incident-triage-stage incident-triage-s1">
    <rect class="incident-triage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="incident-triage-step" x="280" y="142">02</text>
    <text class="incident-triage-name" x="306" y="142">Database</text>
    <text class="incident-triage-desc" x="280" y="166">Connection pool utilisation.</text>
    <text class="incident-triage-desc" x="280" y="182">Saturated at 100%.</text>
    <text class="incident-triage-edge" x="280" y="242">the cause</text>
  </g>
  <line class="incident-triage-line incident-triage-conn incident-triage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#incident-triage-tip)"/>
  <g class="incident-triage-stage incident-triage-s2">
    <rect class="incident-triage-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="incident-triage-step" x="516" y="142">03</text>
    <text class="incident-triage-name" x="542" y="142">Logs</text>
    <text class="incident-triage-desc" x="516" y="166">"remaining connection slots are</text>
    <text class="incident-triage-desc" x="516" y="182">reserved" — the error confirming</text>
    <text class="incident-triage-desc" x="516" y="198">it.</text>
  </g>
  <line class="incident-triage-line incident-triage-conn incident-triage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#incident-triage-tip)"/>
  <g class="incident-triage-stage incident-triage-s3">
    <rect class="incident-triage-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="incident-triage-step" x="752" y="142">04</text>
    <text class="incident-triage-name" x="778" y="142">Messaging</text>
    <text class="incident-triage-desc" x="752" y="166">A drafted incident update, with</text>
    <text class="incident-triage-desc" x="752" y="182">cause and proposed mitigation.</text>
  </g>
  <text class="incident-triage-sub" x="30" y="304">The saving is context switching rather than reasoning: the same four checks by hand mean six browser tabs and fifteen minutes, and the analysis at the end is identical.</text>
</svg>
