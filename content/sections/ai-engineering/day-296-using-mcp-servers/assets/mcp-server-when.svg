<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a script is enough.">
  <title>When to reach for a server</title>
  <style>
    .mcp-server-when-bg   { fill: #f8fafc; }
    .mcp-server-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-server-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-server-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-server-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-server-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-server-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-server-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-server-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-server-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-server-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-server-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-server-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-server-when-row { opacity: 1; }
    .mcp-server-when-r0 { animation-delay: 0.00s; }
    .mcp-server-when-r1 { animation-delay: 0.45s; }
    .mcp-server-when-r2 { animation-delay: 0.90s; }
    .mcp-server-when-r3 { animation-delay: 1.35s; }
    .mcp-server-when-r4 { animation-delay: 1.80s; }
    .mcp-server-when-row { animation: mcp-server-when-reveal 7.3s ease-in-out infinite; }
    @keyframes mcp-server-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mcp-server-when-bg" width="980" height="390"/>
  <text class="mcp-server-when-h1"  x="30" y="40">When to reach for a server</text>
  <text class="mcp-server-when-sub" x="30" y="64">And when a script is enough.</text>
  <rect class="mcp-server-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-server-when-name" x="46" y="122">Configure one</text>
  <text class="mcp-server-when-desc" x="46" y="142">Reused, and shared.</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r0" x="46" y="182">A capability several clients need</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r1" x="46" y="216">Credentials that must stay out of prompts</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r2" x="46" y="250">A tool your team will all use</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r3" x="46" y="284">Something the community already built</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r4" x="46" y="318">Where hot reload matters during development</text>
  <rect class="mcp-server-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-server-when-name" x="526" y="122">Write a script</text>
  <text class="mcp-server-when-desc" x="526" y="142">Once, and yours.</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r0" x="526" y="182">A one-off local task</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r1" x="526" y="216">No other client will ever call it</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r2" x="526" y="250">No credentials involved</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r3" x="526" y="284">A subprocess and a config file are overhead</text>
  <text class="mcp-server-when-desc mcp-server-when-row mcp-server-when-r4" x="526" y="318">And there is nothing to discover</text>
  <text class="mcp-server-when-sub" x="30" y="372">The 500 community servers change this calculation more than anything else in the lesson: for most common backends the decision is not whether to write one, but whether to trust the one that exists.</text>
</svg>
