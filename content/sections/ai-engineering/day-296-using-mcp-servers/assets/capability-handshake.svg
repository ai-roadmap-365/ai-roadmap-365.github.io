<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Version, capabilities, confirmation.">
  <title>The handshake, in three messages</title>
  <style>
    .capability-handshake-bg   { fill: #f8fafc; }
    .capability-handshake-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capability-handshake-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capability-handshake-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capability-handshake-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capability-handshake-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capability-handshake-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .capability-handshake-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .capability-handshake-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .capability-handshake-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .capability-handshake-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .capability-handshake-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .capability-handshake-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .capability-handshake-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .capability-handshake-stage { opacity: 1; }

    .capability-handshake-s0 { animation-delay: 0.00s; }
    .capability-handshake-e0 { animation-delay: 0.00s; }
    .capability-handshake-s1 { animation-delay: 1.50s; }
    .capability-handshake-e1 { animation-delay: 1.50s; }
    .capability-handshake-s2 { animation-delay: 3.00s; }
    .capability-handshake-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .capability-handshake-conn  { animation: capability-handshake-trace 6s ease-in-out infinite; }
      .capability-handshake-stage { animation: capability-handshake-arrive 6s ease-in-out infinite; }
    }
    @keyframes capability-handshake-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes capability-handshake-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .capability-handshake-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .capability-handshake-stage { animation: capability-handshake-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes capability-handshake-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="capability-handshake-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="capability-handshake-bg" width="980" height="322"/>
  <text class="capability-handshake-h1"  x="30" y="40">The handshake, in three messages</text>
  <text class="capability-handshake-sub" x="30" y="64">Version, capabilities, confirmation.</text>
  <g class="capability-handshake-stage capability-handshake-s0">
    <rect class="capability-handshake-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="capability-handshake-step" x="44" y="142">01</text>
    <text class="capability-handshake-name" x="70" y="142">initialize</text>
    <text class="capability-handshake-desc" x="44" y="166">The client states its protocol version and</text>
    <text class="capability-handshake-desc" x="44" y="182">capabilities.</text>
  </g>
  <line class="capability-handshake-line capability-handshake-conn capability-handshake-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#capability-handshake-tip)"/>
  <g class="capability-handshake-stage capability-handshake-s1">
    <rect class="capability-handshake-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="capability-handshake-step" x="359" y="142">02</text>
    <text class="capability-handshake-name" x="385" y="142">The server responds</text>
    <text class="capability-handshake-desc" x="359" y="166">Its version, and which of tools, resources,</text>
    <text class="capability-handshake-desc" x="359" y="182">prompts and logging it supports.</text>
    <text class="capability-handshake-edge" x="359" y="242">negotiated</text>
  </g>
  <line class="capability-handshake-line capability-handshake-conn capability-handshake-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#capability-handshake-tip)"/>
  <g class="capability-handshake-stage capability-handshake-s2">
    <rect class="capability-handshake-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="capability-handshake-step" x="674" y="142">03</text>
    <text class="capability-handshake-name" x="700" y="142">notifications/initialized</text>
    <text class="capability-handshake-desc" x="674" y="166">The client confirms, then queries the</text>
    <text class="capability-handshake-desc" x="674" y="182">catalogues.</text>
  </g>
  <text class="capability-handshake-sub" x="30" y="304">Negotiating a version rather than assuming one is why a client from this year works with a server from last year: both sides agree on a subset instead of failing on an unrecognised field.</text>
</svg>
