<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, before any tool exists.">
  <title>What happens when a client starts</title>
  <style>
    .config-lifecycle-bg   { fill: #f8fafc; }
    .config-lifecycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lifecycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lifecycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lifecycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lifecycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lifecycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .config-lifecycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .config-lifecycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .config-lifecycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .config-lifecycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .config-lifecycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .config-lifecycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .config-lifecycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .config-lifecycle-stage { opacity: 1; }

    .config-lifecycle-s0 { animation-delay: 0.00s; }
    .config-lifecycle-e0 { animation-delay: 0.00s; }
    .config-lifecycle-s1 { animation-delay: 1.28s; }
    .config-lifecycle-e1 { animation-delay: 1.28s; }
    .config-lifecycle-s2 { animation-delay: 2.56s; }
    .config-lifecycle-e2 { animation-delay: 2.56s; }
    .config-lifecycle-s3 { animation-delay: 3.84s; }
    .config-lifecycle-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .config-lifecycle-conn  { animation: config-lifecycle-trace 6.4s ease-in-out infinite; }
      .config-lifecycle-stage { animation: config-lifecycle-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes config-lifecycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes config-lifecycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .config-lifecycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .config-lifecycle-stage { animation: config-lifecycle-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes config-lifecycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="config-lifecycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="config-lifecycle-bg" width="980" height="322"/>
  <text class="config-lifecycle-h1"  x="30" y="40">What happens when a client starts</text>
  <text class="config-lifecycle-sub" x="30" y="64">Four steps, before any tool exists.</text>
  <g class="config-lifecycle-stage config-lifecycle-s0">
    <rect class="config-lifecycle-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="config-lifecycle-step" x="44" y="142">01</text>
    <text class="config-lifecycle-name" x="70" y="142">Read the configuration</text>
    <text class="config-lifecycle-desc" x="44" y="166">Command, arguments and</text>
    <text class="config-lifecycle-desc" x="44" y="182">environment, per server.</text>
  </g>
  <line class="config-lifecycle-line config-lifecycle-conn config-lifecycle-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#config-lifecycle-tip)"/>
  <g class="config-lifecycle-stage config-lifecycle-s1">
    <rect class="config-lifecycle-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="config-lifecycle-step" x="280" y="142">02</text>
    <text class="config-lifecycle-name" x="306" y="142">Spawn the subprocess</text>
    <text class="config-lifecycle-desc" x="280" y="166">Pipes wired to stdin, stdout and</text>
    <text class="config-lifecycle-desc" x="280" y="182">stderr.</text>
  </g>
  <line class="config-lifecycle-line config-lifecycle-conn config-lifecycle-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#config-lifecycle-tip)"/>
  <g class="config-lifecycle-stage config-lifecycle-s2">
    <rect class="config-lifecycle-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="config-lifecycle-step" x="516" y="142">03</text>
    <text class="config-lifecycle-name" x="542" y="142">Negotiate capabilities</text>
    <text class="config-lifecycle-desc" x="516" y="166">initialize, then the server's</text>
    <text class="config-lifecycle-desc" x="516" y="182">supported feature sets, then</text>
    <text class="config-lifecycle-desc" x="516" y="198">initialized.</text>
    <text class="config-lifecycle-edge" x="516" y="242">handshake</text>
  </g>
  <line class="config-lifecycle-line config-lifecycle-conn config-lifecycle-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#config-lifecycle-tip)"/>
  <g class="config-lifecycle-stage config-lifecycle-s3">
    <rect class="config-lifecycle-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="config-lifecycle-step" x="752" y="142">04</text>
    <text class="config-lifecycle-name" x="778" y="142">Query the catalogues</text>
    <text class="config-lifecycle-desc" x="752" y="166">tools/list and resources/list.</text>
    <text class="config-lifecycle-desc" x="752" y="182">Now the model has an inventory.</text>
  </g>
  <text class="config-lifecycle-sub" x="30" y="304">Nothing is hardcoded at any point in that sequence, which is what allows a user to add a server to a JSON file and have an assistant gain a capability without a release.</text>
</svg>
