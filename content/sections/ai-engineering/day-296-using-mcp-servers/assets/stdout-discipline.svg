<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One stray print disconnects the client.">
  <title>stdout belongs to the protocol</title>
  <style>
    .stdout-discipline-bg   { fill: #f8fafc; }
    .stdout-discipline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-discipline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-discipline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-discipline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-discipline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-discipline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdout-discipline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stdout-discipline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stdout-discipline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stdout-discipline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stdout-discipline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stdout-discipline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdout-discipline-row { opacity: 1; }
    .stdout-discipline-r0 { animation-delay: 0.00s; }
    .stdout-discipline-r1 { animation-delay: 0.45s; }
    .stdout-discipline-r2 { animation-delay: 0.90s; }
    .stdout-discipline-r3 { animation-delay: 1.35s; }
    .stdout-discipline-r4 { animation-delay: 1.80s; }
    .stdout-discipline-row { animation: stdout-discipline-reveal 7.3s ease-in-out infinite; }
    @keyframes stdout-discipline-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stdout-discipline-bg" width="980" height="390"/>
  <text class="stdout-discipline-h1"  x="30" y="40">stdout belongs to the protocol</text>
  <text class="stdout-discipline-sub" x="30" y="64">One stray print disconnects the client.</text>
  <rect class="stdout-discipline-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stdout-discipline-name" x="46" y="122">Disciplined</text>
  <text class="stdout-discipline-desc" x="46" y="142">Two streams, two purposes.</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r0" x="46" y="182">stdout: JSON-RPC frames only</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r1" x="46" y="216">stderr: logs, banners, stack traces</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r2" x="46" y="250">The host captures stderr to a log file</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r3" x="46" y="284">Framing stays valid</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r4" x="46" y="318">Debuggable and connected</text>
  <rect class="stdout-discipline-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stdout-discipline-name" x="526" y="122">One stray print</text>
  <text class="stdout-discipline-desc" x="526" y="142">The connection ends.</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r0" x="526" y="182">A debug line lands in stdout</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r1" x="526" y="216">The client cannot parse the frame</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r2" x="526" y="250">It disconnects immediately</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r3" x="526" y="284">The error looks unrelated to the print</text>
  <text class="stdout-discipline-desc stdout-discipline-row stdout-discipline-r4" x="526" y="318">The most common MCP server bug</text>
  <text class="stdout-discipline-sub" x="30" y="372">This is the fifty-year-old Unix convention doing exactly the job it was designed for, and it is worth enforcing with a lint rule rather than a comment, because a `print` added during debugging is how it happens.</text>
</svg>
