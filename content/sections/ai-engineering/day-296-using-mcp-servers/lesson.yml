learning_promise: Learn how to configure, connect, and debug real-world MCP servers with AI host clients
  like Claude Desktop, Cursor, and custom Python agents using stdio subprocess configurations.
objectives:
- Configure `claude_desktop_config.json` and client MCP registries with stdio server definitions.
- Inspect and debug active tool inventories and environment variables across multiple running MCP servers.
- Implement a local MCP Server Manager in Python that spawns, inspects, and monitors stdio subprocesses.
- 'Troubleshoot common connection failures: PATH misconfigurations, unbuffered stdout locks, and missing
  dependencies.'
- Evaluate security boundaries when installing third-party community MCP packages.
