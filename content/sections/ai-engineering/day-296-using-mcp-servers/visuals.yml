  alt: MCP Stdio Framing vs Stderr Logging diagram contrasting clean stdout JSON-RPC messaging with isolated
    stderr diagnostic logs
  description: Stream separation diagram showing clean stdout JSON-RPC framing alongside stderr logging.
- id: config-lifecycle
