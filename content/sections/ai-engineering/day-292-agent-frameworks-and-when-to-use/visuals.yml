  title: Agent Frameworks Comparison Matrix
  alt: Agent Frameworks Comparison Matrix evaluating LangGraph, CrewAI, AutoGen, and Custom Runtimes across
    control, complexity, and overhead
  description: Comparative matrix evaluating major agent orchestration frameworks.
- id: state-graph-checkpointing-lifecycle
  file: assets/state-graph-checkpointing-lifecycle.svg
  type: diagram
  title: State Graph Checkpointing Lifecycle
  alt: State Graph Checkpointing Lifecycle showing Node Execution, State Reducer, Checkpoint Persistence,
    and Human in the Loop pause
  description: Lifecycle diagram illustrating state graph checkpointing and human approval gates.
- id: state-graph-parts
  file: assets/state-graph-parts.svg
  type: diagram
  title: 'What a state graph is made of'
