  description: 'A two-column comparison of a state graph''s explicit transitions against unstructured conversational agent collaboration.'
- id: graph-lineage
  file: assets/graph-lineage.svg
  type: diagram
  title: 'Three eras of orchestration'
  alt: 'Diagram: the progression from prompt chains to state graphs'
  description: 'A three-stage progression of agent orchestration from linear prompt chains through conversational multi-agent frameworks to state graphs.'
- id: graph-benefits
  file: assets/graph-benefits.svg
  type: diagram
  title: 'Four things checkpointing enables'
  alt: 'Diagram: the four capabilities that state checkpointing provides'
  description: 'A four-stage description of state graph capabilities covering cycle control, human approval gates, time-travel debugging and multi-actor contracts.'
- id: thread-isolation
  file: assets/thread-isolation.svg
  type: diagram
  title: 'Namespacing state per thread'
  alt: 'Diagram: how checkpoint namespacing isolates concurrent agent executions'
  description: 'A two-column comparison of namespaced checkpoint storage against a shared state store for concurrent runs.'
- id: baggage-system
  file: assets/baggage-system.svg
