  alt: 'Diagram: the requirements for running a state graph across distributed workers'
  description: 'A three-stage description of distributed state graph requirements covering a messaging backbone, serialisable state contracts and on-demand resource acquisition.'
- id: checkpoint-privacy
  file: assets/checkpoint-privacy.svg
  type: diagram
  title: 'What a checkpoint contains'
  alt: 'Diagram: the privacy and performance implications of state checkpointing'
  description: 'A two-column comparison of the compliance obligations of checkpoints against their latency cost.'
- id: framework-fit
  file: assets/framework-fit.svg
  type: diagram
  title: 'Which orchestrator fits'
  alt: 'Diagram: state graph frameworks compared with durable workflow engines'
  description: 'A two-column comparison of agent-native state graph frameworks against general durable workflow engines.'
- id: graph-when
  file: assets/graph-when.svg
  type: diagram
  title: 'When a graph is worth it'
  alt: 'Diagram: when to adopt a state graph framework'
  description: 'A two-column comparison of workflows justifying a state graph against those better served by ordinary control flow.'
