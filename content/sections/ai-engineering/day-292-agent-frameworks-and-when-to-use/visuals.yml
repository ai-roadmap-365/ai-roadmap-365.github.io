  title: 'An airport baggage system'
  alt: 'Diagram: an automated baggage system as an analogy for a state graph'
  description: 'A two-column comparison mapping baggage handling components onto state graph components.'
- id: distributed-graphs
  file: assets/distributed-graphs.svg
  type: diagram
