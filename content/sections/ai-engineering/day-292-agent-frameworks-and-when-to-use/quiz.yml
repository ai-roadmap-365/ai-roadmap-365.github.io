questions:
- question: What is the primary architectural innovation of graph-based agent frameworks like LangGraph?
  options:
  - They replace Python with GraphQL
  - They model agent workflows as Directed Cyclic Graphs (DCGs) with explicit state reducers, persistence
    checkpoints, and conditional branching
  - They eliminate all token costs
  - They run directly in browser WebAssembly
  answer_index: 1
  explanation: State graphs provide deterministic control over cyclic agent transitions, error handling
    loops, and human-in-the-loop gates.
- question: What is a 'State Reducer' in a graph-based agent architecture?
  options:
  - A function that compresses images
  - A pure function that defines how a node's partial update is merged into the global state dictionary
  - A garbage collector for Python dictionaries
  - A method for deleting user accounts
  answer_index: 1
  explanation: State reducers control how state mutations (e.g. appending messages or updating counters)
    are applied cleanly to the graph state.
- question: When should an engineering team avoid high-level conversational frameworks in favor of a graph
    or custom engine?
  options:
  - When building single-turn translation prompts
  - When building mission-critical enterprise workflows requiring strict deterministic routing, audit
    logging, and human approval gates
  - When running on Windows machines
  - When using open-source models
  answer_index: 1
  explanation: Conversational group-chat frameworks lack the deterministic control, checkpointing, and
    branch predictability needed for mission-critical enterprise systems.
- question: How does a 'Human-in-the-Loop' breakpoint operate in a state graph?
  options:
  - The graph pauses execution before or after designated nodes, saves state to a persistent checkpointer,
    and waits for human approval to resume
  - The human must manually type all LLM tokens
  - The server shuts down completely
  - The graph runs in reverse
  answer_index: 0
  explanation: Checkpointed breakpoints allow human review of sensitive actions before execution continues.
- question: What is the primary difference between a DAG (Directed Acyclic Graph) and an Agent State Graph?
  options:
  - DAGs do not support nodes
  - Agent State Graphs permit cyclic edges (loops) to enable iterative reasoning, tool retries, and error
    recovery
  - DAGs are only used in CSS layout engines
  - Agent State Graphs require 100 GPUs
  answer_index: 1
  explanation: Cycles are fundamental to agentic behavior, allowing models to retry actions, refine code,
    and observe feedback iteratively.
