learning_promise: Evaluate modern agent frameworks (LangGraph, CrewAI, AutoGen) and build a deterministic,
  directed cyclic state graph engine in Python with state reducers and human-in-the-loop checkpoints.
objectives:
- Evaluate architectural trade-offs between LangGraph, CrewAI, and Microsoft AutoGen.
- Construct a Directed Cyclic State Graph engine with nodes, conditional edges, and state reducers.
- Implement durable state checkpointing and human-in-the-loop pause-and-resume gates.
- Identify the architectural boundary between custom runtimes and high-level agent frameworks.
- Verify state persistence and graph retry execution with automated test suites.
