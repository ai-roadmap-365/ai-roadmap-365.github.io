terms:
- term: Directed Cyclic Graph (DCG)
  definition: A graph structure allowing cycles, essential for modeling iterative agent reasoning and
    retry loops.
- term: State Reducer
  definition: A function that merges partial updates from execution nodes into the global graph state.
- term: Conditional Edge
  definition: A dynamic routing edge in a graph whose destination is determined by inspecting the current
    state.
- term: Human-in-the-Loop (HITL)
  definition: A safety pattern that pauses graph execution for human review and approval prior to risky
    mutations.
- term: Checkpoint Persistence
  definition: Saving graph state snapshots to disk or database after each node execution to support replay
    and fault tolerance.
- term: LangGraph
  definition: A production orchestration framework modeling multi-agent workflows as stateful cyclic graphs.
- term: CrewAI
  definition: A role-playing multi-agent framework orchestrating sequential or hierarchical agent teams.
- term: AutoGen
  definition: A multi-agent conversational framework from Microsoft enabling agent group-chat collaboration.
