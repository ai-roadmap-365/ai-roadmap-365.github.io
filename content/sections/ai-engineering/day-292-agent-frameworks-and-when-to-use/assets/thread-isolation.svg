<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Multi-tenancy is a checkpoint key.">
  <title>Namespacing state per thread</title>
  <style>
    .thread-isolation-bg   { fill: #f8fafc; }
    .thread-isolation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thread-isolation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thread-isolation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thread-isolation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thread-isolation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thread-isolation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .thread-isolation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .thread-isolation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .thread-isolation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .thread-isolation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .thread-isolation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .thread-isolation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .thread-isolation-row { opacity: 1; }
    .thread-isolation-r0 { animation-delay: 0.00s; }
    .thread-isolation-r1 { animation-delay: 0.45s; }
    .thread-isolation-r2 { animation-delay: 0.90s; }
    .thread-isolation-r3 { animation-delay: 1.35s; }
    .thread-isolation-r4 { animation-delay: 1.80s; }
    .thread-isolation-row { animation: thread-isolation-reveal 7.3s ease-in-out infinite; }
    @keyframes thread-isolation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="thread-isolation-bg" width="980" height="390"/>
  <text class="thread-isolation-h1"  x="30" y="40">Namespacing state per thread</text>
  <text class="thread-isolation-sub" x="30" y="64">Multi-tenancy is a checkpoint key.</text>
  <rect class="thread-isolation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="thread-isolation-name" x="46" y="122">Namespaced</text>
  <text class="thread-isolation-desc" x="46" y="142">Keyed per thread.</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r0" x="46" y="182">A globally unique thread_id per interaction</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r1" x="46" y="216">Keys of (thread_id, namespace, checkpoint_id)</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r2" x="46" y="250">Concurrent runs cannot corrupt each other</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r3" x="46" y="284">No session data crosses tenants</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r4" x="46" y="318">Resumption targets one exact run</text>
  <rect class="thread-isolation-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="thread-isolation-name" x="526" y="122">Shared</text>
  <text class="thread-isolation-desc" x="526" y="142">One store, many runs.</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r0" x="526" y="182">State written without a run identity</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r1" x="526" y="216">Concurrent runs interleave writes</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r2" x="526" y="250">A resume may load somebody else's step</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r3" x="526" y="284">A tenancy leak, not just a bug</text>
  <text class="thread-isolation-desc thread-isolation-row thread-isolation-r4" x="526" y="318">And very hard to reproduce</text>
  <text class="thread-isolation-sub" x="30" y="372">This is worth getting right before concurrency exists rather than after: the failure mode is intermittent, cross-tenant and appears only under load, which is the worst combination for diagnosis.</text>
</svg>
