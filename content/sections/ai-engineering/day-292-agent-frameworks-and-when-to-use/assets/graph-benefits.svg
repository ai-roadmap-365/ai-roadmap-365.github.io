<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All of them are operational.">
  <title>Four things checkpointing enables</title>
  <style>
    .graph-benefits-bg   { fill: #f8fafc; }
    .graph-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .graph-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .graph-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .graph-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .graph-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .graph-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .graph-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .graph-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .graph-benefits-stage { opacity: 1; }

    .graph-benefits-s0 { animation-delay: 0.00s; }
    .graph-benefits-e0 { animation-delay: 0.00s; }
    .graph-benefits-s1 { animation-delay: 1.28s; }
    .graph-benefits-e1 { animation-delay: 1.28s; }
    .graph-benefits-s2 { animation-delay: 2.56s; }
    .graph-benefits-e2 { animation-delay: 2.56s; }
    .graph-benefits-s3 { animation-delay: 3.84s; }
    .graph-benefits-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .graph-benefits-conn  { animation: graph-benefits-trace 6.4s ease-in-out infinite; }
      .graph-benefits-stage { animation: graph-benefits-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes graph-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes graph-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .graph-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .graph-benefits-stage { animation: graph-benefits-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes graph-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="graph-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="graph-benefits-bg" width="980" height="322"/>
  <text class="graph-benefits-h1"  x="30" y="40">Four things checkpointing enables</text>
  <text class="graph-benefits-sub" x="30" y="64">All of them are operational.</text>
  <g class="graph-benefits-stage graph-benefits-s0">
    <rect class="graph-benefits-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="graph-benefits-step" x="44" y="142">01</text>
    <text class="graph-benefits-name" x="70" y="142">Bounded cycles</text>
    <text class="graph-benefits-desc" x="44" y="166">A node failing twice routes to</text>
    <text class="graph-benefits-desc" x="44" y="182">recovery by an explicit edge,</text>
    <text class="graph-benefits-desc" x="44" y="198">not by hope.</text>
  </g>
  <line class="graph-benefits-line graph-benefits-conn graph-benefits-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#graph-benefits-tip)"/>
  <g class="graph-benefits-stage graph-benefits-s1">
    <rect class="graph-benefits-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="graph-benefits-step" x="280" y="142">02</text>
    <text class="graph-benefits-name" x="306" y="142">Human-in-the-loop gates</text>
    <text class="graph-benefits-desc" x="280" y="166">Snapshot, suspend, wait for</text>
    <text class="graph-benefits-desc" x="280" y="182">approval, resume from the exact</text>
    <text class="graph-benefits-desc" x="280" y="198">point.</text>
    <text class="graph-benefits-edge" x="280" y="242">HITL</text>
  </g>
  <line class="graph-benefits-line graph-benefits-conn graph-benefits-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#graph-benefits-tip)"/>
  <g class="graph-benefits-stage graph-benefits-s2">
    <rect class="graph-benefits-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="graph-benefits-step" x="516" y="142">03</text>
    <text class="graph-benefits-name" x="542" y="142">Time-travel debugging</text>
    <text class="graph-benefits-desc" x="516" y="166">Load checkpoint 14, change the</text>
    <text class="graph-benefits-desc" x="516" y="182">prompt, re-run from there.</text>
    <text class="graph-benefits-edge" x="516" y="242">cheap</text>
  </g>
  <line class="graph-benefits-line graph-benefits-conn graph-benefits-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#graph-benefits-tip)"/>
  <g class="graph-benefits-stage graph-benefits-s3">
    <rect class="graph-benefits-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="graph-benefits-step" x="752" y="142">04</text>
    <text class="graph-benefits-name" x="778" y="142">Contracts between nodes</text>
    <text class="graph-benefits-desc" x="752" y="166">A SQL generator feeding a SQL</text>
    <text class="graph-benefits-desc" x="752" y="182">validator, with a typed</text>
    <text class="graph-benefits-desc" x="752" y="198">interface.</text>
  </g>
  <text class="graph-benefits-sub" x="30" y="304">The third capability changes how agent bugs are investigated: re-running a twenty-step failure from step one is expensive and, because the model is stochastic, may not even reproduce it.</text>
</svg>
