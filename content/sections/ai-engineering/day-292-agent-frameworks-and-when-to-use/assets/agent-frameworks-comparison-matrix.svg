<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img">
  <title>Agent Frameworks Comparison Matrix</title>
  <defs>
    <style>
      .d292a-bg { fill: #f8fafc; }
      .d292a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d292a-lg { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d292a-crew { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d292a-custom { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d292a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d292a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d292a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d292a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d292a-bg" />
  
  <text x="40" y="40" class="d292a-title">Agent Frameworks Comparison Matrix</text>
  <text x="40" y="65" class="d292a-subtitle">Agent Frameworks Comparison Matrix evaluating LangGraph, CrewAI, AutoGen, and Custom Runtimes across control, complexity, and overhead</text>
  
  <!-- LangGraph -->
  <rect x="40" y="100" width="250" height="340" class="d292a-lg" />
  <text x="55" y="130" class="d292a-header" fill="#1d4ed8">LangGraph (State Graphs)</text>
  <text x="55" y="155" class="d292a-text">• Architecture: Cyclic Directed Graphs</text>
  <text x="55" y="175" class="d292a-text">• State Model: Explicit Typed State</text>
  <text x="55" y="195" class="d292a-text">• Control Level: High (Fine-grained)</text>
  <text x="55" y="215" class="d292a-text">• Checkpointing: Built-in persistence</text>
  <text x="55" y="235" class="d292a-text">• Human-in-the-Loop: Native support</text>
  <text x="55" y="265" class="d292a-text" font-weight="600">Best For:</text>
  <text x="55" y="285" class="d292a-text">Complex production systems,</text>
  <text x="55" y="300" class="d292a-text">multi-step cyclic workflows</text>
  <text x="55" y="330" class="d292a-text" font-weight="600">Tradeoff:</text>
  <text x="55" y="350" class="d292a-text">Steeper learning curve,</text>
  <text x="55" y="365" class="d292a-text">graph boilerplate setup</text>
  
  <!-- CrewAI -->
  <rect x="325" y="100" width="250" height="340" class="d292a-crew" />
  <text x="340" y="130" class="d292a-header" fill="#a16207">CrewAI / AutoGen (Role-Based)</text>
  <text x="340" y="155" class="d292a-text">• Architecture: Multi-Agent Teams</text>
  <text x="340" y="175" class="d292a-text">• State Model: Conversational Chat</text>
  <text x="340" y="195" class="d292a-text">• Control Level: Moderate (Autonomous)</text>
  <text x="340" y="215" class="d292a-text">• Checkpointing: External logging</text>
  <text x="340" y="235" class="d292a-text">• Human-in-the-Loop: Limited / chat</text>
  <text x="340" y="265" class="d292a-text" font-weight="600">Best For:</text>
  <text x="340" y="285" class="d292a-text">Rapid role-playing prototypes,</text>
  <text x="340" y="300" class="d292a-text">collaborative brainstorming</text>
  <text x="340" y="330" class="d292a-text" font-weight="600">Tradeoff:</text>
  <text x="340" y="350" class="d292a-text">High token chatter,</text>
  <text x="340" y="365" class="d292a-text">less deterministic routing</text>
  
  <!-- Custom Zero-Dependency -->
  <rect x="610" y="100" width="250" height="340" class="d292a-custom" />
  <text x="625" y="130" class="d292a-header" fill="#15803d">Custom Zero-Dependency</text>
  <text x="625" y="155" class="d292a-text">• Architecture: Explicit Python State</text>
  <text x="625" y="175" class="d292a-text">• State Model: Tailored Dataclasses</text>
  <text x="625" y="195" class="d292a-text">• Control Level: 100% Total Control</text>
  <text x="625" y="215" class="d292a-text">• Checkpointing: Direct SQL/JSON save</text>
  <text x="625" y="235" class="d292a-text">• Human-in-the-Loop: Fully custom</text>
  <text x="625" y="265" class="d292a-text" font-weight="600">Best For:</text>
  <text x="625" y="285" class="d292a-text">Enterprise microservices,</text>
  <text x="625" y="300" class="d292a-text">zero CVE tolerance, fast CI</text>
  <text x="625" y="330" class="d292a-text" font-weight="600">Tradeoff:</text>
  <text x="625" y="350" class="d292a-text">Requires writing own</text>
  <text x="625" y="365" class="d292a-text">dispatch &amp; parsing logic</text>
</svg>