<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four parts, all ordinary Python.">
  <title>What a state graph is made of</title>
  <style>
    .state-graph-parts-bg   { fill: #f8fafc; }
    .state-graph-parts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-graph-parts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-graph-parts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-graph-parts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-graph-parts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-graph-parts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .state-graph-parts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .state-graph-parts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .state-graph-parts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .state-graph-parts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .state-graph-parts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .state-graph-parts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .state-graph-parts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .state-graph-parts-stage { opacity: 1; }

    .state-graph-parts-s0 { animation-delay: 0.00s; }
    .state-graph-parts-e0 { animation-delay: 0.00s; }
    .state-graph-parts-s1 { animation-delay: 1.28s; }
    .state-graph-parts-e1 { animation-delay: 1.28s; }
    .state-graph-parts-s2 { animation-delay: 2.56s; }
    .state-graph-parts-e2 { animation-delay: 2.56s; }
    .state-graph-parts-s3 { animation-delay: 3.84s; }
    .state-graph-parts-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .state-graph-parts-conn  { animation: state-graph-parts-trace 6.4s ease-in-out infinite; }
      .state-graph-parts-stage { animation: state-graph-parts-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes state-graph-parts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes state-graph-parts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .state-graph-parts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .state-graph-parts-stage { animation: state-graph-parts-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes state-graph-parts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="state-graph-parts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="state-graph-parts-bg" width="980" height="322"/>
  <text class="state-graph-parts-h1"  x="30" y="40">What a state graph is made of</text>
  <text class="state-graph-parts-sub" x="30" y="64">Four parts, all ordinary Python.</text>
  <g class="state-graph-parts-stage state-graph-parts-s0">
    <rect class="state-graph-parts-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="state-graph-parts-step" x="44" y="142">01</text>
    <text class="state-graph-parts-name" x="70" y="142">Nodes</text>
    <text class="state-graph-parts-desc" x="44" y="166">Python functions. Your domain</text>
    <text class="state-graph-parts-desc" x="44" y="182">logic, unchanged.</text>
  </g>
  <line class="state-graph-parts-line state-graph-parts-conn state-graph-parts-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#state-graph-parts-tip)"/>
  <g class="state-graph-parts-stage state-graph-parts-s1">
    <rect class="state-graph-parts-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="state-graph-parts-step" x="280" y="142">02</text>
    <text class="state-graph-parts-name" x="306" y="142">Edges</text>
    <text class="state-graph-parts-desc" x="280" y="166">Transitions, including</text>
    <text class="state-graph-parts-desc" x="280" y="182">conditional ones. This is where</text>
    <text class="state-graph-parts-desc" x="280" y="198">cycles become explicit.</text>
  </g>
  <line class="state-graph-parts-line state-graph-parts-conn state-graph-parts-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#state-graph-parts-tip)"/>
  <g class="state-graph-parts-stage state-graph-parts-s2">
    <rect class="state-graph-parts-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="state-graph-parts-step" x="516" y="142">03</text>
    <text class="state-graph-parts-name" x="542" y="142">A typed state with reducers</text>
    <text class="state-graph-parts-desc" x="516" y="166">Each node returns a partial</text>
    <text class="state-graph-parts-desc" x="516" y="182">update; the reducer merges it.</text>
    <text class="state-graph-parts-edge" x="516" y="242">immutable</text>
  </g>
  <line class="state-graph-parts-line state-graph-parts-conn state-graph-parts-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#state-graph-parts-tip)"/>
  <g class="state-graph-parts-stage state-graph-parts-s3">
    <rect class="state-graph-parts-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="state-graph-parts-step" x="752" y="142">04</text>
    <text class="state-graph-parts-name" x="778" y="142">A checkpointer</text>
    <text class="state-graph-parts-desc" x="752" y="166">A snapshot after every node.</text>
    <text class="state-graph-parts-desc" x="752" y="182">Pause, resume, rewind.</text>
  </g>
  <text class="state-graph-parts-sub" x="30" y="304">The reducer is the piece that makes concurrency and resumption tractable: nodes return what changed rather than mutating shared state, so a replayed node produces the same merge.</text>
</svg>
