<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Linear, conversational, then cyclic.">
  <title>Three eras of orchestration</title>
  <style>
    .graph-lineage-bg   { fill: #f8fafc; }
    .graph-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .graph-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .graph-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .graph-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .graph-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .graph-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .graph-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .graph-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .graph-lineage-stage { opacity: 1; }

    .graph-lineage-s0 { animation-delay: 0.00s; }
    .graph-lineage-e0 { animation-delay: 0.00s; }
    .graph-lineage-s1 { animation-delay: 1.50s; }
    .graph-lineage-e1 { animation-delay: 1.50s; }
    .graph-lineage-s2 { animation-delay: 3.00s; }
    .graph-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .graph-lineage-conn  { animation: graph-lineage-trace 6s ease-in-out infinite; }
      .graph-lineage-stage { animation: graph-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes graph-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes graph-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .graph-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .graph-lineage-stage { animation: graph-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes graph-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="graph-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="graph-lineage-bg" width="980" height="322"/>
  <text class="graph-lineage-h1"  x="30" y="40">Three eras of orchestration</text>
  <text class="graph-lineage-sub" x="30" y="64">Linear, conversational, then cyclic.</text>
  <g class="graph-lineage-stage graph-lineage-s0">
    <rect class="graph-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="graph-lineage-step" x="44" y="142">01</text>
    <text class="graph-lineage-name" x="70" y="142">Prompt chains, 2022-2023</text>
    <text class="graph-lineage-desc" x="44" y="166">Template, model, parser. No cycles without</text>
    <text class="graph-lineage-desc" x="44" y="182">unwieldy recursion.</text>
  </g>
  <line class="graph-lineage-line graph-lineage-conn graph-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#graph-lineage-tip)"/>
  <g class="graph-lineage-stage graph-lineage-s1">
    <rect class="graph-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="graph-lineage-step" x="359" y="142">02</text>
    <text class="graph-lineage-name" x="385" y="142">Role-playing multi-agent, 2023</text>
    <text class="graph-lineage-desc" x="359" y="166">AutoGen and CrewAI. Impressive, and hard to</text>
    <text class="graph-lineage-desc" x="359" y="182">control in production.</text>
  </g>
  <line class="graph-lineage-line graph-lineage-conn graph-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#graph-lineage-tip)"/>
  <g class="graph-lineage-stage graph-lineage-s2">
    <rect class="graph-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="graph-lineage-step" x="674" y="142">03</text>
    <text class="graph-lineage-name" x="700" y="142">State graphs, 2024</text>
    <text class="graph-lineage-desc" x="674" y="166">Nodes, edges and checkpoints —</text>
    <text class="graph-lineage-desc" x="674" y="182">workflow-engine reliability for agents.</text>
  </g>
  <text class="graph-lineage-sub" x="30" y="304">The third era is best understood as agents catching up with Temporal and Airflow: durable state, explicit transitions and resumability were solved problems, and the agent ecosystem re-derived them.</text>
</svg>
