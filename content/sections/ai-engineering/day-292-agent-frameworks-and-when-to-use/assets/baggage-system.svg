<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scanners, diverters and a holding bay.">
  <title>An airport baggage system</title>
  <style>
    .baggage-system-bg   { fill: #f8fafc; }
    .baggage-system-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baggage-system-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baggage-system-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baggage-system-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baggage-system-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baggage-system-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baggage-system-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .baggage-system-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .baggage-system-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .baggage-system-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .baggage-system-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .baggage-system-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baggage-system-row { opacity: 1; }
    .baggage-system-r0 { animation-delay: 0.00s; }
    .baggage-system-r1 { animation-delay: 0.45s; }
    .baggage-system-r2 { animation-delay: 0.90s; }
    .baggage-system-r3 { animation-delay: 1.35s; }
    .baggage-system-r4 { animation-delay: 1.80s; }
    .baggage-system-row { animation: baggage-system-reveal 7.3s ease-in-out infinite; }
    @keyframes baggage-system-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="baggage-system-bg" width="980" height="390"/>
  <text class="baggage-system-h1"  x="30" y="40">An airport baggage system</text>
  <text class="baggage-system-sub" x="30" y="64">Scanners, diverters and a holding bay.</text>
  <rect class="baggage-system-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="baggage-system-name" x="46" y="122">The baggage system</text>
  <text class="baggage-system-desc" x="46" y="142">Deterministic and auditable.</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r0" x="46" y="182">Bags enter on a belt</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r1" x="46" y="216">Scanners read the tag</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r2" x="46" y="250">Diverters route domestic or international</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r3" x="46" y="284">An anomaly goes to a holding bay</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r4" x="46" y="318">A human unlocks the latch</text>
  <rect class="baggage-system-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="baggage-system-name" x="526" y="122">The state graph</text>
  <text class="baggage-system-desc" x="526" y="142">The same four.</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r0" x="526" y="182">State enters the graph</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r1" x="526" y="216">Nodes read and update it</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r2" x="526" y="250">Conditional edges route it</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r3" x="526" y="284">A high-risk action pauses at a checkpoint</text>
  <text class="baggage-system-desc baggage-system-row baggage-system-r4" x="526" y="318">A human approves, and it resumes</text>
  <text class="baggage-system-sub" x="30" y="372">The holding bay is the part worth noticing: the system can hold an item safely at any point, which is exactly what a checkpointer provides and what an in-memory loop cannot.</text>
</svg>
