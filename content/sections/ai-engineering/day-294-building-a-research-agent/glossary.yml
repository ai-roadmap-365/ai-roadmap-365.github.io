terms:
- term: Deep Research Agent
  definition: An autonomous agent that iteratively searches, extracts atomic facts, cross-references sources,
    and synthesizes structured research reports.
- term: Sub-Query Decomposition
  definition: The algorithmic process of splitting a broad research goal into multiple targeted search
    queries.
- term: Atomic Fact Extraction
  definition: Isolating standalone, verifiable claims paired with exact source URLs from raw document
    text.
- term: Inline Citation Attribution
  definition: Formally linking every statement in a synthesized report to its originating source citation
    key.
- term: Source Conflict Resolution
  definition: The methodology for identifying, documenting, and evaluating contradictory factual claims
    across different information sources.
- term: Note Store
  definition: A structured database storing extracted claims, metadata, confidence scores, and source
    URLs.
- term: Recursive Hop
  definition: Dynamically generating follow-up queries based on entities or citations discovered in previous
    search results.
- term: STORM Framework
  definition: A multi-perspective research architecture from Stanford simulating diverse expert personas
    for deep literature reviews.
