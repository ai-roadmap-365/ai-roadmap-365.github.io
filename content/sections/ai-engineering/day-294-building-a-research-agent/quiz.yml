questions:
- question: What is the primary function of Sub-Query Decomposition in a deep research agent?
  options:
  - To translate search terms into Latin
  - To break down complex, multi-faceted research questions into targeted, orthogonal search queries exploring
    distinct sub-topics
  - To delete duplicate rows in a database
  - To compress PDF files
  answer_index: 1
  explanation: Query decomposition ensures comprehensive coverage across technical, economic, and operational
    dimensions.
- question: Why should a research agent maintain a structured Note Store rather than stuffing raw webpages
    into the LLM context?
  options:
  - Python cannot process HTML strings
  - To prevent context bloat, filter boilerplate ads/navigation, and ensure every synthesized claim maps
    to an exact source URL
  - To bypass paywalls automatically
  - To convert text into audio
  answer_index: 1
  explanation: Extracting atomic factual notes dramatically reduces token consumption, filters noise,
    and provides exact source attribution.
- question: How should a research agent handle conflicting factual claims found across two reputable sources?
  options:
  - Silently discard both sources and hallucinate a compromise
  - Explicitly highlight the discrepancy in the research brief, noting competing numbers, methodologies,
    and dates
  - Pick the source with the shorter URL
  - Crash the execution loop immediately
  answer_index: 1
  explanation: High-quality research explicitly documents discrepancies, presenting both perspectives
    and analyzing potential reasons for divergence.
- question: What is the primary difference between a Deep Research Agent and standard Retrieval-Augmented
    Generation (RAG)?
  options:
  - RAG requires an internet connection while research agents do not
  - Standard RAG performs single-turn retrieval over a static index, whereas a research agent dynamically
    explores external sources across multiple recursive hops
  - Research agents do not use language models
  - RAG only works with Python 2.7
  answer_index: 1
  explanation: Research agents autonomously formulate follow-up queries, navigate links, and compile notes
    iteratively.
- question: What security vulnerability must be strictly prevented when an agent dynamically scrapes web
    URLs?
  options:
  - Buffer overflow in the print statement
  - Server-Side Request Forgery (SSRF) targeting internal network IP addresses and cloud metadata endpoints
  - SQL syntax formatting errors
  - CSS stylesheet injection
  answer_index: 1
  explanation: Scrapers must enforce IP allowlists and reject private subnet lookups (e.g., `169.254.169.254`).
