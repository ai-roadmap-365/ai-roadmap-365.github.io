<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img">
  <title>Deep Research Agent Architecture</title>
  <defs>
    <style>
      .d294a-bg { fill: #f8fafc; }
      .d294a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d294a-decomp { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d294a-search { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d294a-notes { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d294a-synth { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d294a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d294a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d294a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d294a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .d294a-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 6,4; fill: none; animation: d294a-p 3s linear infinite; }
      @keyframes d294a-p { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .d294a-flow { animation: none; } }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d294a-bg" />
  
  <text x="40" y="40" class="d294a-title">Deep Research Agent Architecture</text>
  <text x="40" y="65" class="d294a-subtitle">Deep Research Agent Architecture illustrating Query Decomposition, Multi-Hop Search, Fact Extraction Note Store, and Citation Synthesis</text>
  
  <!-- Step 1: Decomposition -->
  <rect x="40" y="100" width="180" height="340" class="d294a-decomp" />
  <text x="55" y="130" class="d294a-header" fill="#1d4ed8">1. Query Decompose</text>
  <text x="55" y="155" class="d294a-text">• User Goal Ingestion</text>
  <text x="55" y="175" class="d294a-text">• Generate Sub-queries:</text>
  <text x="55" y="195" class="d294a-text">  - Q1: Market Size</text>
  <text x="55" y="210" class="d294a-text">  - Q2: Key Competitors</text>
  <text x="55" y="225" class="d294a-text">  - Q3: Tech Bottlenecks</text>
  <text x="55" y="255" class="d294a-text" font-weight="600">Technique:</text>
  <text x="55" y="275" class="d294a-text">Multi-perspective</text>
  <text x="55" y="290" class="d294a-text">question generation</text>
  
  <!-- Step 2: Multi-Hop Search -->
  <rect x="250" y="100" width="180" height="340" class="d294a-search" />
  <text x="265" y="130" class="d294a-header" fill="#a16207">2. Multi-Hop Search</text>
  <text x="265" y="155" class="d294a-text">• Execute Web Queries</text>
  <text x="265" y="175" class="d294a-text">• Scrape HTML / PDF</text>
  <text x="265" y="195" class="d294a-text">• Dynamic Re-querying:</text>
  <text x="265" y="210" class="d294a-text">  Follow interesting links</text>
  <text x="265" y="225" class="d294a-text">  and new entity names</text>
  <text x="265" y="255" class="d294a-text" font-weight="600">Rate Limiter:</text>
  <text x="265" y="275" class="d294a-text">Respect domain quotas</text>
  <text x="265" y="290" class="d294a-text">and robots.txt rules</text>
  
  <!-- Step 3: Note Store -->
  <rect x="460" y="100" width="180" height="340" class="d294a-notes" />
  <text x="475" y="130" class="d294a-header" fill="#15803d">3. Note Store</text>
  <text x="475" y="155" class="d294a-text">• Extract Atomic Facts</text>
  <text x="475" y="175" class="d294a-text">• Deduplicate Claims</text>
  <text x="475" y="195" class="d294a-text">• Attach Source URL</text>
  <text x="475" y="215" class="d294a-text">• Detect Conflicts:</text>
  <text x="475" y="230" class="d294a-text">  Flag metric mismatch</text>
  <text x="475" y="260" class="d294a-text" font-weight="600">Structure:</text>
  <text x="475" y="280" class="d294a-text">Fact + Citation Key</text>
  <text x="475" y="295" class="d294a-text">+ Confidence Score</text>
  
  <!-- Step 4: Synthesis -->
  <rect x="670" y="100" width="190" height="340" class="d294a-synth" />
  <text x="685" y="130" class="d294a-header" fill="#7e22ce">4. Brief Synthesis</text>
  <text x="685" y="155" class="d294a-text">• Outline Generation</text>
  <text x="685" y="175" class="d294a-text">• Draft Sections</text>
  <text x="685" y="195" class="d294a-text">• Inline Citations [1][2]</text>
  <text x="685" y="215" class="d294a-text">• Bibliography Table</text>
  <text x="685" y="245" class="d294a-text" font-weight="600">Output:</text>
  <text x="685" y="265" class="d294a-text">Executive Markdown</text>
  <text x="685" y="280" class="d294a-text">Research Brief</text>
  
  <!-- Flow Lines -->
  <path d="M 220 270 L 250 270" class="d294a-flow" />
  <path d="M 430 270 L 460 270" class="d294a-flow" />
  <path d="M 640 270 L 670 270" class="d294a-flow" />
</svg>