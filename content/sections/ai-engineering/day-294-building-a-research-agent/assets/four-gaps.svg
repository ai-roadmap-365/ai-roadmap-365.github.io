<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each maps to one stage.">
  <title>Four gaps the architecture closes</title>
  <style>
    .four-gaps-bg   { fill: #f8fafc; }
    .four-gaps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-gaps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-gaps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-gaps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-gaps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-gaps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-gaps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-gaps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-gaps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-gaps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-gaps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-gaps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-gaps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-gaps-stage { opacity: 1; }

    .four-gaps-s0 { animation-delay: 0.00s; }
    .four-gaps-e0 { animation-delay: 0.00s; }
    .four-gaps-s1 { animation-delay: 1.28s; }
    .four-gaps-e1 { animation-delay: 1.28s; }
    .four-gaps-s2 { animation-delay: 2.56s; }
    .four-gaps-e2 { animation-delay: 2.56s; }
    .four-gaps-s3 { animation-delay: 3.84s; }
    .four-gaps-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-gaps-conn  { animation: four-gaps-trace 6.4s ease-in-out infinite; }
      .four-gaps-stage { animation: four-gaps-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-gaps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-gaps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-gaps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-gaps-stage { animation: four-gaps-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-gaps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-gaps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-gaps-bg" width="980" height="322"/>
  <text class="four-gaps-h1"  x="30" y="40">Four gaps the architecture closes</text>
  <text class="four-gaps-sub" x="30" y="64">Each maps to one stage.</text>
  <g class="four-gaps-stage four-gaps-s0">
    <rect class="four-gaps-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-gaps-step" x="44" y="142">01</text>
    <text class="four-gaps-name" x="70" y="142">Single-query coverage gap</text>
    <text class="four-gaps-desc" x="44" y="166">One search misses whole</text>
    <text class="four-gaps-desc" x="44" y="182">sub-topics. Decomposition is the</text>
    <text class="four-gaps-desc" x="44" y="198">fix.</text>
    <text class="four-gaps-edge" x="44" y="242">decompose</text>
  </g>
  <line class="four-gaps-line four-gaps-conn four-gaps-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-gaps-tip)"/>
  <g class="four-gaps-stage four-gaps-s1">
    <rect class="four-gaps-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-gaps-step" x="280" y="142">02</text>
    <text class="four-gaps-name" x="306" y="142">Noise and context overflow</text>
    <text class="four-gaps-desc" x="280" y="166">Cookie banners and navigation.</text>
    <text class="four-gaps-desc" x="280" y="182">An extractor subagent distils.</text>
    <text class="four-gaps-edge" x="280" y="242">extract</text>
  </g>
  <line class="four-gaps-line four-gaps-conn four-gaps-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-gaps-tip)"/>
  <g class="four-gaps-stage four-gaps-s2">
    <rect class="four-gaps-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-gaps-step" x="516" y="142">03</text>
    <text class="four-gaps-name" x="542" y="142">Unattributed claims</text>
    <text class="four-gaps-desc" x="516" y="166">Every metric carries a citation</text>
    <text class="four-gaps-desc" x="516" y="182">key into a verified</text>
    <text class="four-gaps-desc" x="516" y="198">bibliography.</text>
  </g>
  <line class="four-gaps-line four-gaps-conn four-gaps-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-gaps-tip)"/>
  <g class="four-gaps-stage four-gaps-s3">
    <rect class="four-gaps-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-gaps-step" x="752" y="142">04</text>
    <text class="four-gaps-name" x="778" y="142">Silent conflicts</text>
    <text class="four-gaps-desc" x="752" y="166">Divergent forecasts reported as</text>
    <text class="four-gaps-desc" x="752" y="182">a discrepancy, with the</text>
    <text class="four-gaps-desc" x="752" y="198">assumptions.</text>
  </g>
  <text class="four-gaps-sub" x="30" y="304">The fourth is the one that separates a useful brief from a confident one: picking a number when two credible sources disagree hides exactly the information a decision-maker needs.</text>
</svg>
