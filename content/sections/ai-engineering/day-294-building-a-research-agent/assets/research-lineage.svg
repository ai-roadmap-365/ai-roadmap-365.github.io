<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From keywords to trajectories.">
  <title>Three eras of automated research</title>
  <style>
    .research-lineage-bg   { fill: #f8fafc; }
    .research-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .research-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .research-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .research-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .research-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .research-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .research-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .research-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .research-lineage-stage { opacity: 1; }

    .research-lineage-s0 { animation-delay: 0.00s; }
    .research-lineage-e0 { animation-delay: 0.00s; }
    .research-lineage-s1 { animation-delay: 1.50s; }
    .research-lineage-e1 { animation-delay: 1.50s; }
    .research-lineage-s2 { animation-delay: 3.00s; }
    .research-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .research-lineage-conn  { animation: research-lineage-trace 6s ease-in-out infinite; }
      .research-lineage-stage { animation: research-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes research-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes research-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .research-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .research-lineage-stage { animation: research-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes research-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="research-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="research-lineage-bg" width="980" height="322"/>
  <text class="research-lineage-h1"  x="30" y="40">Three eras of automated research</text>
  <text class="research-lineage-sub" x="30" y="64">From keywords to trajectories.</text>
  <g class="research-lineage-stage research-lineage-s0">
    <rect class="research-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="research-lineage-step" x="44" y="142">01</text>
    <text class="research-lineage-name" x="70" y="142">Crawlers and TF-IDF, 2000-2020</text>
    <text class="research-lineage-desc" x="44" y="166">Keyword extraction and statistical</text>
    <text class="research-lineage-desc" x="44" y="182">summarisation. No semantic synthesis.</text>
  </g>
  <line class="research-lineage-line research-lineage-conn research-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#research-lineage-tip)"/>
  <g class="research-lineage-stage research-lineage-s1">
    <rect class="research-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="research-lineage-step" x="359" y="142">02</text>
    <text class="research-lineage-name" x="385" y="142">STORM, 2024</text>
    <text class="research-lineage-desc" x="359" y="166">Simulated expert personas asking probing</text>
    <text class="research-lineage-desc" x="359" y="182">questions, producing cited articles.</text>
  </g>
  <line class="research-lineage-line research-lineage-conn research-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#research-lineage-tip)"/>
  <g class="research-lineage-stage research-lineage-s2">
    <rect class="research-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="research-lineage-step" x="674" y="142">03</text>
    <text class="research-lineage-name" x="700" y="142">Deep research features, 2024-2025</text>
    <text class="research-lineage-desc" x="674" y="166">Dozens of search turns across hundreds of</text>
    <text class="research-lineage-desc" x="674" y="182">documents, as a product.</text>
  </g>
  <text class="research-lineage-sub" x="30" y="304">The middle step is the conceptual one: the difficulty was never retrieval, it was knowing what to ask, and personas turned decomposition into something a model could do systematically.</text>
</svg>
