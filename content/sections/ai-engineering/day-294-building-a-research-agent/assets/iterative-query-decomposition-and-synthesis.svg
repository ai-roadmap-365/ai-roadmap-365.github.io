<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img">
  <title>Iterative Query Decomposition And Synthesis</title>
  <defs>
    <style>
      .d294f-bg { fill: #f8fafc; }
      .d294f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d294f-node { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d294f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d294f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d294f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d294f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .d294f-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d294f-bg" />
  
  <text x="40" y="40" class="d294f-title">Iterative Query Decomposition and Synthesis</text>
  <text x="40" y="65" class="d294f-subtitle">Iterative Query Decomposition and Synthesis flowchart showing recursive sub-query generation, search execution, and note consolidation</text>
  
  <!-- Root Goal -->
  <rect x="40" y="110" width="220" height="80" class="d294f-node" />
  <text x="55" y="135" class="d294f-header" fill="#1d4ed8">Research Topic</text>
  <text x="55" y="155" class="d294f-text">"State of Solid-State Batteries"</text>
  <text x="55" y="170" class="d294f-text">Goal Formulation</text>
  
  <path d="M 260 150 L 330 150" class="d294f-flow" />
  
  <!-- Decomposer -->
  <rect x="330" y="100" width="250" height="280" class="d294f-card" />
  <text x="345" y="130" class="d294f-header">Decomposed Search Plan</text>
  <text x="345" y="160" class="d294f-text">• Sub-query 1: Energy Density (Wh/kg)</text>
  <text x="345" y="180" class="d294f-text">• Sub-query 2: Manufacturing Yields</text>
  <text x="345" y="200" class="d294f-text">• Sub-query 3: Commercial Automakers</text>
  <text x="345" y="230" class="d294f-text" font-weight="600">Recursive Hop:</text>
  <text x="345" y="250" class="d294f-text">Discovered new chemistry "sulfide"</text>
  <text x="345" y="265" class="d294f-text">-> Generates Sub-query 4: Sulfide vs Oxide</text>
  
  <path d="M 580 150 L 650 150" class="d294f-flow" />
  
  <!-- Synthesizer -->
  <rect x="650" y="110" width="210" height="260" class="d294f-node" />
  <text x="665" y="135" class="d294f-header" fill="#1d4ed8">Synthesized Brief</text>
  <text x="665" y="160" class="d294f-text"># Executive Summary</text>
  <text x="665" y="180" class="d294f-text">Energy density hits 450 Wh/kg [1].</text>
  <text x="665" y="200" class="d294f-text">Toyota targeting 2027 rollout [2].</text>
  <text x="665" y="230" class="d294f-text" font-weight="600"># Sources</text>
  <text x="665" y="250" class="d294f-text">[1] Nature Energy (2025)</text>
  <text x="665" y="265" class="d294f-text">[2] Toyota Press Release</text>
</svg>