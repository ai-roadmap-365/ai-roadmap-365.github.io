<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a classic web vulnerability.">
  <title>Two hazards of following links</title>
  <style>
    .research-hazards-bg   { fill: #f8fafc; }
    .research-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .research-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .research-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .research-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .research-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .research-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .research-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .research-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .research-hazards-stage { opacity: 1; }

    .research-hazards-s0 { animation-delay: 0.00s; }
    .research-hazards-e0 { animation-delay: 0.00s; }
    .research-hazards-s1 { animation-delay: 1.50s; }
    .research-hazards-e1 { animation-delay: 1.50s; }
    .research-hazards-s2 { animation-delay: 3.00s; }
    .research-hazards-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .research-hazards-conn  { animation: research-hazards-trace 6s ease-in-out infinite; }
      .research-hazards-stage { animation: research-hazards-arrive 6s ease-in-out infinite; }
    }
    @keyframes research-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes research-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .research-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .research-hazards-stage { animation: research-hazards-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes research-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="research-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="research-hazards-bg" width="980" height="322"/>
  <text class="research-hazards-h1"  x="30" y="40">Two hazards of following links</text>
  <text class="research-hazards-sub" x="30" y="64">One is a classic web vulnerability.</text>
  <g class="research-hazards-stage research-hazards-s0">
    <rect class="research-hazards-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="research-hazards-step" x="44" y="142">01</text>
    <text class="research-hazards-name" x="70" y="142">Model-supplied URLs are SSRF</text>
    <text class="research-hazards-desc" x="44" y="166">A search result can point at a cloud metadata</text>
    <text class="research-hazards-desc" x="44" y="182">endpoint.</text>
    <text class="research-hazards-edge" x="44" y="242">169.254.169.254</text>
  </g>
  <line class="research-hazards-line research-hazards-conn research-hazards-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#research-hazards-tip)"/>
  <g class="research-hazards-stage research-hazards-s1">
    <rect class="research-hazards-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="research-hazards-step" x="359" y="142">02</text>
    <text class="research-hazards-name" x="385" y="142">So restrict the fetcher</text>
    <text class="research-hazards-desc" x="359" y="166">Private subnets rejected, https only, an</text>
    <text class="research-hazards-desc" x="359" y="182">explicit protocol allowlist.</text>
  </g>
  <line class="research-hazards-line research-hazards-conn research-hazards-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#research-hazards-tip)"/>
  <g class="research-hazards-stage research-hazards-s2">
    <rect class="research-hazards-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="research-hazards-step" x="674" y="142">03</text>
    <text class="research-hazards-name" x="700" y="142">And scrub before storing</text>
    <text class="research-hazards-desc" x="674" y="166">Identifiers and tokens filtered before notes</text>
    <text class="research-hazards-desc" x="674" y="182">reach the persistent store.</text>
  </g>
  <text class="research-hazards-sub" x="30" y="304">Server-side request forgery is worth naming explicitly because the agent framing hides it: the fetch is being made by your infrastructure from inside your network, on a URL somebody else chose.</text>
</svg>
