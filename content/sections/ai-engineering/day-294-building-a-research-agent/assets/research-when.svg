<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is far too slow.">
  <title>When deep research is right</title>
  <style>
    .research-when-bg   { fill: #f8fafc; }
    .research-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .research-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .research-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .research-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .research-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .research-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .research-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .research-when-row { opacity: 1; }
    .research-when-r0 { animation-delay: 0.00s; }
    .research-when-r1 { animation-delay: 0.45s; }
    .research-when-r2 { animation-delay: 0.90s; }
    .research-when-r3 { animation-delay: 1.35s; }
    .research-when-r4 { animation-delay: 1.80s; }
    .research-when-row { animation: research-when-reveal 7.3s ease-in-out infinite; }
    @keyframes research-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="research-when-bg" width="980" height="390"/>
  <text class="research-when-h1"  x="30" y="40">When deep research is right</text>
  <text class="research-when-sub" x="30" y="64">And when it is far too slow.</text>
  <rect class="research-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="research-when-name" x="46" y="122">Use it</text>
  <text class="research-when-desc" x="46" y="142">Multi-faceted and cited.</text>
  <text class="research-when-desc research-when-row research-when-r0" x="46" y="182">Cross-referencing independent sources</text>
  <text class="research-when-desc research-when-row research-when-r1" x="46" y="216">Regulatory or legal citation requirements</text>
  <text class="research-when-desc research-when-row research-when-r2" x="46" y="250">Competitive intelligence and market sizing</text>
  <text class="research-when-desc research-when-row research-when-r3" x="46" y="284">Patent and literature analysis</text>
  <text class="research-when-desc research-when-row research-when-r4" x="46" y="318">Where a conflict must be surfaced</text>
  <rect class="research-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="research-when-name" x="526" y="122">Do not</text>
  <text class="research-when-desc" x="526" y="142">Two clear cases.</text>
  <text class="research-when-desc research-when-row research-when-r0" x="526" y="182">A simple factual question</text>
  <text class="research-when-desc research-when-row research-when-r1" x="526" y="216">Sub-second response requirements</text>
  <text class="research-when-desc research-when-row research-when-r2" x="526" y="250">Deep research takes 15-60 seconds</text>
  <text class="research-when-desc research-when-row research-when-r3" x="526" y="284">One lookup is cheaper and better</text>
  <text class="research-when-desc research-when-row research-when-r4" x="526" y="318">And a citation adds nothing</text>
  <text class="research-when-sub" x="30" y="372">The latency figure is the practical constraint: deep research is a background job that returns a document, and designing it into an interactive interface produces an experience nobody enjoys.</text>
</svg>
