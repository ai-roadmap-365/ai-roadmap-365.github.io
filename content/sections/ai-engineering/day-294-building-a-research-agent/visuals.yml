visuals:
- id: deep-research-agent-architecture
  file: assets/deep-research-agent-architecture.svg
  type: diagram
  title: Deep Research Agent Architecture
  alt: Deep Research Agent Architecture illustrating Query Decomposition, Multi-Hop Search, Fact Extraction
    Note Store, and Citation Synthesis
  description: System architecture diagram illustrating the four-stage deep research agent lifecycle.
- id: iterative-query-decomposition-and-synthesis
  file: assets/iterative-query-decomposition-and-synthesis.svg
  type: diagram
  title: Iterative Query Decomposition and Synthesis
  alt: Iterative Query Decomposition and Synthesis flowchart showing recursive sub-query generation, search
    execution, and note consolidation
  description: Flowchart showing recursive query expansion and structured note compilation.
- id: research-pipeline
  file: assets/research-pipeline.svg
  type: diagram
  title: 'Five stages of a research run'
  alt: 'Diagram: the five stages of a deep research agent pipeline'
  description: 'A five-stage description of a research agent covering query decomposition, multi-hop search, fact extraction, conflict reconciliation and cited synthesis.'
- id: skim-or-investigate
  file: assets/skim-or-investigate.svg
  type: diagram
  title: 'A skim, or an investigation'
  alt: 'Diagram: a single-prompt answer compared with an investigative research process'
  description: 'A two-column comparison of answering a research question in one pass against decomposing and investigating it.'
- id: research-lineage
  file: assets/research-lineage.svg
  type: diagram
  title: 'Three eras of automated research'
  alt: 'Diagram: the progression from keyword crawlers to autonomous deep research'
  description: 'A three-stage progression of automated research from statistical summarisation through multi-perspective question asking to autonomous deep research trajectories.'
- id: research-or-rag
  file: assets/research-or-rag.svg
  type: diagram
  title: 'A research agent is not RAG'
  alt: 'Diagram: a standard RAG pipeline compared with a deep research agent'
  description: 'A two-column comparison of single-pass retrieval-augmented generation against an iterative multi-hop research agent.'
- id: four-gaps
  file: assets/four-gaps.svg
  type: diagram
  title: 'Four gaps the architecture closes'
  alt: 'Diagram: the four limitations of single-query research and their architectural remedies'
  description: 'A four-stage description of research agent design covering coverage gaps, noise filtering, attribution and conflict detection.'
- id: information-gain
  file: assets/information-gain.svg
  type: diagram
  title: 'Deduplicating a note store'
  alt: 'Diagram: how information gain scoring deduplicates facts and flags conflicts'
  description: 'A four-stage description of note store curation covering embedding similarity, redundancy discard, conflict flagging and routing to resolution.'
- id: multi-pass-drafting
  file: assets/multi-pass-drafting.svg
  type: diagram
  title: 'Three drafting passes'
  alt: 'Diagram: the three passes of a cited research synthesis'
  description: 'A three-stage description of multi-pass report synthesis covering thematic clustering, footnoted drafting and adversarial fact auditing.'
- id: grad-students
  file: assets/grad-students.svg
  type: diagram
  title: 'A literature review team'
  alt: 'Diagram: a research team dividing sources compared with one person reading everything'
  description: 'A two-column comparison of a divided literature review against a single reader attempting the same coverage.'
- id: research-hazards
  file: assets/research-hazards.svg
  type: diagram
  title: 'Two hazards of following links'
  alt: 'Diagram: the SSRF and privacy hazards of an autonomous research agent'
  description: 'A three-stage description of research agent hazards covering server-side request forgery, required network restrictions and note store redaction.'
- id: research-when
  file: assets/research-when.svg
  type: diagram
  title: 'When deep research is right'
  alt: 'Diagram: when to use a deep research agent'
  description: 'A two-column comparison of research tasks warranting an autonomous agent against those better served by a single lookup.'
