visuals:
- id: ai-code-review-verification-pyramid
  file: assets/ai-code-review-verification-pyramid.svg
  type: diagram
  title: AI Code Review Verification Pyramid
  alt: AI Code Review Verification Pyramid showing Automated Static Linters, Type Checkers, Security Scanners,
    Unit & Mutation Tests, and Human Architectural Review
  description: Verification pyramid illustrating the multi-layer quality gates required for AI-generated
    code.
- id: hallucinated-dependency-attack-vector
  file: assets/hallucinated-dependency-attack-vector.svg
  type: diagram
  title: Hallucinated Dependency Attack Vector
  alt: Hallucinated Dependency Attack Vector diagram showing LLM Hallucination, Attacker Registry Squatting,
    Developer Install, and Remote Code Execution
  description: Security threat model diagram illustrating package slopsquatting vulnerabilities.
- id: verification-layers
  file: assets/verification-layers.svg
  type: diagram
  title: 'Four verification layers'
  alt: 'Diagram: the four layers of verification for AI-written code'
  description: 'A four-stage description of code verification covering static analysis, dependency auditing, mutation testing and human architectural review.'
- id: fluent-or-correct
  file: assets/fluent-or-correct.svg
  type: diagram
  title: 'Fluency is not correctness'
  alt: 'Diagram: the surface qualities of AI-written code compared with the properties that matter'
  description: 'A two-column comparison of the presentation qualities of generated code against the structural properties a reviewer must verify.'
- id: review-lineage
  file: assets/review-lineage.svg
  type: diagram
  title: 'Three milestones in code trust'
  alt: 'Diagram: the progression from Fagan inspection to hallucinated-dependency security'
  description: 'A three-stage progression of code verification from formal inspection through mutation testing to AI-specific supply-chain security.'
- id: ai-vulnerability-taxonomy
  file: assets/ai-vulnerability-taxonomy.svg
  type: diagram
  title: 'Four patterns to screen for'
  alt: 'Diagram: the four security anti-patterns common in generated code'
  description: 'A four-stage description of AI code security anti-patterns covering unsafe deserialisation, shell construction, hardcoded cryptographic constants and missing authorisation.'
- id: mutation-gate
  file: assets/mutation-gate.svg
  type: diagram
  title: 'Proving a test suite'
  alt: 'Diagram: how mutation testing verifies that a test suite detects defects'
  description: 'A four-stage description of mutation testing covering operator inversion, statement deletion, killed mutants and survivors.'
- id: accounting-audit
  file: assets/accounting-audit.svg
  type: diagram
  title: 'Auditing a spreadsheet'
  alt: 'Diagram: admiring a formatted ledger compared with auditing it'
  description: 'A two-column comparison of accepting a well-formatted ledger against independently verifying its figures and references.'
- id: ten-point-gate
  file: assets/ten-point-gate.svg
  type: diagram
  title: 'Five of the ten checks'
  alt: 'Diagram: the human review checks that static analysis cannot perform'
  description: 'A five-stage description of human review checks covering complexity, resource management, concurrency safety, authorisation and error masking.'
- id: verification-strategies
  file: assets/verification-strategies.svg
  type: diagram
  title: 'Three verification strategies'
  alt: 'Diagram: static, dynamic and symbolic verification compared by coverage'
  description: 'A three-stage description of verification strategies covering static analysis, dynamic testing and symbolic execution.'
- id: decimal-case
  file: assets/decimal-case.svg
  type: diagram
  title: 'Syntactically flawless, financially wrong'
  alt: 'Diagram: floating-point currency arithmetic compared with decimal arithmetic'
  description: 'A two-column comparison of IEEE 754 floating-point currency calculation against decimal arithmetic with explicit rounding.'
- id: review-when
  file: assets/review-when.svg
  type: diagram
  title: 'Where the full pyramid applies'
  alt: 'Diagram: when full verification is required for AI-written code'
  description: 'A two-column comparison of contexts requiring full verification against lighter contexts, and the checks that apply regardless.'
