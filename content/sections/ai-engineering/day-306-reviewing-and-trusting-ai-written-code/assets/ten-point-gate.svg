<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The ones automation cannot do.">
  <title>Five of the ten checks</title>
  <style>
    .ten-point-gate-bg   { fill: #f8fafc; }
    .ten-point-gate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ten-point-gate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ten-point-gate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ten-point-gate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ten-point-gate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ten-point-gate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ten-point-gate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ten-point-gate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ten-point-gate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ten-point-gate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ten-point-gate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ten-point-gate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ten-point-gate-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ten-point-gate-stage { opacity: 1; }

    .ten-point-gate-s0 { animation-delay: 0.00s; }
    .ten-point-gate-e0 { animation-delay: 0.00s; }
    .ten-point-gate-s1 { animation-delay: 1.33s; }
    .ten-point-gate-e1 { animation-delay: 1.33s; }
    .ten-point-gate-s2 { animation-delay: 2.67s; }
    .ten-point-gate-e2 { animation-delay: 2.67s; }
    .ten-point-gate-s3 { animation-delay: 4.00s; }
    .ten-point-gate-e3 { animation-delay: 4.00s; }
    .ten-point-gate-s4 { animation-delay: 5.33s; }
    .ten-point-gate-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .ten-point-gate-conn  { animation: ten-point-gate-trace 8s ease-in-out infinite; }
      .ten-point-gate-stage { animation: ten-point-gate-arrive 8s ease-in-out infinite; }
    }
    @keyframes ten-point-gate-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ten-point-gate-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ten-point-gate-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ten-point-gate-stage { animation: ten-point-gate-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ten-point-gate-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ten-point-gate-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ten-point-gate-bg" width="980" height="322"/>
  <text class="ten-point-gate-h1"  x="30" y="40">Five of the ten checks</text>
  <text class="ten-point-gate-sub" x="30" y="64">The ones automation cannot do.</text>
  <g class="ten-point-gate-stage ten-point-gate-s0">
    <rect class="ten-point-gate-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="ten-point-gate-step" x="44" y="142">01</text>
    <text class="ten-point-gate-name" x="70" y="142">Algorithmic complexity</text>
    <text class="ten-point-gate-desc" x="44" y="166">O(N) or O(N squared)? A</text>
    <text class="ten-point-gate-desc" x="44" y="182">linter cannot tell you</text>
    <text class="ten-point-gate-desc" x="44" y="198">which one this should be.</text>
  </g>
  <line class="ten-point-gate-line ten-point-gate-conn ten-point-gate-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#ten-point-gate-tip)"/>
  <g class="ten-point-gate-stage ten-point-gate-s1">
    <rect class="ten-point-gate-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="ten-point-gate-step" x="233" y="142">02</text>
    <text class="ten-point-gate-name" x="259" y="142">Resource management</text>
    <text class="ten-point-gate-desc" x="233" y="166">Descriptors, sockets and</text>
    <text class="ten-point-gate-desc" x="233" y="182">connections inside</text>
    <text class="ten-point-gate-desc" x="233" y="198">context managers.</text>
    <text class="ten-point-gate-edge" x="233" y="242">with/finally</text>
  </g>
  <line class="ten-point-gate-line ten-point-gate-conn ten-point-gate-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#ten-point-gate-tip)"/>
  <g class="ten-point-gate-stage ten-point-gate-s2">
    <rect class="ten-point-gate-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="ten-point-gate-step" x="422" y="142">03</text>
    <text class="ten-point-gate-name" x="448" y="142">Concurrency safety</text>
    <text class="ten-point-gate-desc" x="422" y="166">Shared state behind a</text>
    <text class="ten-point-gate-desc" x="422" y="182">lock, or not shared at</text>
    <text class="ten-point-gate-desc" x="422" y="198">all.</text>
  </g>
  <line class="ten-point-gate-line ten-point-gate-conn ten-point-gate-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#ten-point-gate-tip)"/>
  <g class="ten-point-gate-stage ten-point-gate-s3">
    <rect class="ten-point-gate-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="ten-point-gate-step" x="611" y="142">04</text>
    <text class="ten-point-gate-name" x="637" y="142">Authorisation and tenancy</text>
    <text class="ten-point-gate-desc" x="611" y="166">Every query filtered by</text>
    <text class="ten-point-gate-desc" x="611" y="182">the authenticated</text>
    <text class="ten-point-gate-desc" x="611" y="198">organisation.</text>
  </g>
  <line class="ten-point-gate-line ten-point-gate-conn ten-point-gate-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#ten-point-gate-tip)"/>
  <g class="ten-point-gate-stage ten-point-gate-s4">
    <rect class="ten-point-gate-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="ten-point-gate-step" x="800" y="142">05</text>
    <text class="ten-point-gate-name" x="826" y="142">Error masking</text>
    <text class="ten-point-gate-desc" x="800" y="166">No broad except-pass</text>
    <text class="ten-point-gate-desc" x="800" y="182">swallowing system errors.</text>
  </g>
  <text class="ten-point-gate-sub" x="30" y="304">Delegating the mechanical checks to scanners is what makes this list achievable: a human reading a 300-line diff for both style and architecture will find the style issues and miss the tenancy one.</text>
</svg>
