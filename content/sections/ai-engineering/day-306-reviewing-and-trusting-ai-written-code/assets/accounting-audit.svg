<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Recalculate; do not admire.">
  <title>Auditing a spreadsheet</title>
  <style>
    .accounting-audit-bg   { fill: #f8fafc; }
    .accounting-audit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .accounting-audit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .accounting-audit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .accounting-audit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .accounting-audit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .accounting-audit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .accounting-audit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .accounting-audit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .accounting-audit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .accounting-audit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .accounting-audit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .accounting-audit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .accounting-audit-row { opacity: 1; }
    .accounting-audit-r0 { animation-delay: 0.00s; }
    .accounting-audit-r1 { animation-delay: 0.45s; }
    .accounting-audit-r2 { animation-delay: 0.90s; }
    .accounting-audit-r3 { animation-delay: 1.35s; }
    .accounting-audit-r4 { animation-delay: 1.80s; }
    .accounting-audit-row { animation: accounting-audit-reveal 7.3s ease-in-out infinite; }
    @keyframes accounting-audit-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="accounting-audit-bg" width="980" height="390"/>
  <text class="accounting-audit-h1"  x="30" y="40">Auditing a spreadsheet</text>
  <text class="accounting-audit-sub" x="30" y="64">Recalculate; do not admire.</text>
  <rect class="accounting-audit-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="accounting-audit-name" x="46" y="122">Admiring it</text>
  <text class="accounting-audit-desc" x="46" y="142">Crisp and green.</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r0" x="46" y="182">Aligned columns and coloured totals</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r1" x="46" y="216">Green checkmarks throughout</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r2" x="46" y="250">Every figure looks deliberate</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r3" x="46" y="284">Nothing recalculated</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r4" x="46" y="318">Nothing cross-referenced</text>
  <rect class="accounting-audit-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="accounting-audit-name" x="526" y="122">Auditing it</text>
  <text class="accounting-audit-desc" x="526" y="142">Three independent checks.</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r0" x="526" y="182">Recalculate the sub-totals</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r1" x="526" y="216">Check routing numbers against verified accounts</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r2" x="526" y="250">Stress the tax formulas with edge cases</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r3" x="526" y="284">Presentation is not evidence</text>
  <text class="accounting-audit-desc accounting-audit-row accounting-audit-r4" x="526" y="318">And formatting was never the risk</text>
  <text class="accounting-audit-sub" x="30" y="372">The routing-number check maps onto the dependency audit exactly: it is a boring, mechanical cross-reference against an authoritative list, and it is the one that catches the expensive fraud.</text>
</svg>
