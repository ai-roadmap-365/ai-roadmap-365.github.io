<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Break the code and see who notices.">
  <title>Proving a test suite</title>
  <style>
    .mutation-gate-bg   { fill: #f8fafc; }
    .mutation-gate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutation-gate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutation-gate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutation-gate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutation-gate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutation-gate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mutation-gate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mutation-gate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mutation-gate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mutation-gate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mutation-gate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mutation-gate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mutation-gate-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mutation-gate-stage { opacity: 1; }

    .mutation-gate-s0 { animation-delay: 0.00s; }
    .mutation-gate-e0 { animation-delay: 0.00s; }
    .mutation-gate-s1 { animation-delay: 1.28s; }
    .mutation-gate-e1 { animation-delay: 1.28s; }
    .mutation-gate-s2 { animation-delay: 2.56s; }
    .mutation-gate-e2 { animation-delay: 2.56s; }
    .mutation-gate-s3 { animation-delay: 3.84s; }
    .mutation-gate-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mutation-gate-conn  { animation: mutation-gate-trace 6.4s ease-in-out infinite; }
      .mutation-gate-stage { animation: mutation-gate-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mutation-gate-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mutation-gate-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mutation-gate-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mutation-gate-stage { animation: mutation-gate-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mutation-gate-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mutation-gate-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mutation-gate-bg" width="980" height="322"/>
  <text class="mutation-gate-h1"  x="30" y="40">Proving a test suite</text>
  <text class="mutation-gate-sub" x="30" y="64">Break the code and see who notices.</text>
  <g class="mutation-gate-stage mutation-gate-s0">
    <rect class="mutation-gate-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mutation-gate-step" x="44" y="142">01</text>
    <text class="mutation-gate-name" x="70" y="142">Mutate the source</text>
    <text class="mutation-gate-desc" x="44" y="166">Invert a comparison, delete a</text>
    <text class="mutation-gate-desc" x="44" y="182">line, change a constant.</text>
  </g>
  <line class="mutation-gate-line mutation-gate-conn mutation-gate-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mutation-gate-tip)"/>
  <g class="mutation-gate-stage mutation-gate-s1">
    <rect class="mutation-gate-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mutation-gate-step" x="280" y="142">02</text>
    <text class="mutation-gate-name" x="306" y="142">Run the suite against each mutant</text>
    <text class="mutation-gate-desc" x="280" y="166">Automatically, across every</text>
    <text class="mutation-gate-desc" x="280" y="182">mutation.</text>
  </g>
  <line class="mutation-gate-line mutation-gate-conn mutation-gate-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mutation-gate-tip)"/>
  <g class="mutation-gate-stage mutation-gate-s2">
    <rect class="mutation-gate-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mutation-gate-step" x="516" y="142">03</text>
    <text class="mutation-gate-name" x="542" y="142">Killed mutants are good news</text>
    <text class="mutation-gate-desc" x="516" y="166">The suite failed, so it detects</text>
    <text class="mutation-gate-desc" x="516" y="182">that defect.</text>
  </g>
  <line class="mutation-gate-line mutation-gate-conn mutation-gate-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mutation-gate-tip)"/>
  <g class="mutation-gate-stage mutation-gate-s3">
    <rect class="mutation-gate-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mutation-gate-step" x="752" y="142">04</text>
    <text class="mutation-gate-name" x="778" y="142">Survivors are the finding</text>
    <text class="mutation-gate-desc" x="752" y="166">Mutated broken code, and the</text>
    <text class="mutation-gate-desc" x="752" y="182">tests still pass. Reject the</text>
    <text class="mutation-gate-desc" x="752" y="198">assertions.</text>
  </g>
  <text class="mutation-gate-sub" x="30" y="304">A survivor is a precise, actionable finding rather than a vague concern: it names a change to the code that the test suite does not notice, which is exactly the class of bug that reaches production.</text>
</svg>
