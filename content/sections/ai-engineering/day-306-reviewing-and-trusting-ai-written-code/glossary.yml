terms:
- term: Plausibility Bias
  definition: Accepting flawed code because its syntax, formatting, and docstrings appear highly professional.
- term: Package Slopsquatting
  definition: Supply chain attack vector where attackers register hallucinated package names on public
    registries.
- term: Mutation Testing
  definition: Injecting deliberate bugs into code to verify that test suites accurately catch and fail
    on defects.
- term: Superficial Assertion
  definition: A weak test assertion (e.g. `assert res is not None`) that passes without validating correctness.
- term: Dependency Auditing
  definition: Verifying all imported packages exist in approved manifest files and contain no known CVEs.
- term: Silent Regression
  definition: When an agent subtly breaks existing edge-case handling without triggering syntax errors.
- term: Bandit Security Scanner
  definition: A static analysis tool designed to find common security issues in Python source code.
- term: Quality Gate Pipeline
  definition: An automated CI suite of type checking, linting, security scans, and test suites gating
    PR merges.
