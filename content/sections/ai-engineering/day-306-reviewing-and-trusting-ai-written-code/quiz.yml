questions:
- question: What is the phenomenon of 'Plausibility Bias' when reviewing AI-generated code?
  options:
  - A compiler error in Python 3.12
  - The tendency for human reviewers to approve AI code because it looks beautifully formatted, syntactically
    clean, and well-commented, despite containing subtle logic flaws or off-by-one bugs
  - A hardware failure in GPU memory
  - An encryption protocol
  answer_index: 1
  explanation: Plausibility bias occurs when clean formatting masks dangerous underlying logical or security
    defects.
- question: What is 'Package Slopsquatting' (hallucinated dependency vulnerability) in AI code generation?
  options:
  - When an agent writes code too fast
  - When a language model imports a non-existent package name, allowing an attacker to publish a malicious
    package with that exact name to PyPI/npm to compromise systems that run the AI-generated code
  - A database compression algorithm
  - A type of CSS animation
  answer_index: 1
  explanation: Attackers register hallucinated package names on public registries to execute supply chain
    attacks.
- question: How should a reviewer verify that an agent's newly written unit tests are actually testing
    the business logic rather than trivially passing?
  options:
  - Check if the file is green in git
  - Introduce a deliberate mutation or bug into the implementation function and verify that the test suite
    fails (Mutation Testing)
  - Delete the test file
  - Run the tests with higher GPU memory
  answer_index: 1
  explanation: Mutation testing validates that test suites catch real bugs rather than containing tautological
    `assert True` assertions.
- question: Which automated verification tools should gate every AI-generated pull request before human
    merge?
  options:
  - Only an email notification
  - A multi-layer suite comprising static linters (`ruff`), strict type checkers (`mypy`), security scanners
    (`bandit`), dependency validators, and unit test runners with coverage gates
  - No tools are needed if the model is large enough
  - A spell checker
  answer_index: 1
  explanation: Multi-layer automated quality gates catch static, dynamic, and security flaws before human
    review.
- question: Why is verifying time-complexity and resource consumption crucial when reviewing AI-written
    algorithms?
  options:
  - LLMs frequently generate working implementations using naive O(N^2) or recursive algorithms with stack
    overflow risks instead of optimal O(N) or iterative structures
  - Python does not support algorithms
  - It reduces disk usage
  - It makes git commits smaller
  answer_index: 0
  explanation: Models prioritize syntax completion over algorithmic efficiency, frequently introducing
    performance bottlenecks.
