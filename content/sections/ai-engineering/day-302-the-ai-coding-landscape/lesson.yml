learning_promise: 'Navigate the modern AI-assisted software engineering ecosystem: compare inline autocompletion,
  agentic IDEs, terminal CLI agents, and fully autonomous background agents across real-world developer
  workflows.'
objectives:
- Analyze the architectural evolution from inline tab completion (Copilot) to agentic IDEs (Cursor, Windsurf)
  and terminal agents (Aider, Claude Code).
- Evaluate context indexing strategies including AST parsing, embedding-based code search, and LSP symbol
  indexing.
- 'Compare autonomous execution topologies: Human-in-the-Loop pair programming vs headless background
  issue solvers.'
- Benchmark SWE-bench performance, patch generation quality, and token cost economics.
- Select the optimal coding agent architecture for individual, team, and CI/CD development.
