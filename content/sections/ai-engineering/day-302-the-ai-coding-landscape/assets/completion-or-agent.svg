<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One reads a buffer; one reads a repository.">
  <title>Completion, or an agent</title>
  <style>
    .completion-or-agent-bg   { fill: #f8fafc; }
    .completion-or-agent-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .completion-or-agent-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .completion-or-agent-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .completion-or-agent-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .completion-or-agent-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .completion-or-agent-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .completion-or-agent-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .completion-or-agent-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .completion-or-agent-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .completion-or-agent-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .completion-or-agent-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .completion-or-agent-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .completion-or-agent-row { opacity: 1; }
    .completion-or-agent-r0 { animation-delay: 0.00s; }
    .completion-or-agent-r1 { animation-delay: 0.45s; }
    .completion-or-agent-r2 { animation-delay: 0.90s; }
    .completion-or-agent-r3 { animation-delay: 1.35s; }
    .completion-or-agent-r4 { animation-delay: 1.80s; }
    .completion-or-agent-row { animation: completion-or-agent-reveal 7.3s ease-in-out infinite; }
    @keyframes completion-or-agent-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="completion-or-agent-bg" width="980" height="390"/>
  <text class="completion-or-agent-h1"  x="30" y="40">Completion, or an agent</text>
  <text class="completion-or-agent-sub" x="30" y="64">One reads a buffer; one reads a repository.</text>
  <rect class="completion-or-agent-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="completion-or-agent-name" x="46" y="122">Inline completion</text>
  <text class="completion-or-agent-desc" x="46" y="142">One buffer, one prediction.</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r0" x="46" y="182">Conditioned on the preceding tokens</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r1" x="46" y="216">No knowledge of other files</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r2" x="46" y="250">Cannot run anything</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r3" x="46" y="284">No feedback signal</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r4" x="46" y="318">Fast, and always available</text>
  <rect class="completion-or-agent-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="completion-or-agent-name" x="526" y="122">An agent</text>
  <text class="completion-or-agent-desc" x="526" y="142">A repository and a terminal.</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r0" x="526" y="182">An AST map of the whole repository</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r1" x="526" y="216">Edits several files coherently</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r2" x="526" y="250">Runs tests and reads the traceback</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r3" x="526" y="284">Self-corrects until green</text>
  <text class="completion-or-agent-desc completion-or-agent-row completion-or-agent-r4" x="526" y="318">Slower, and verifiable</text>
  <text class="completion-or-agent-sub" x="30" y="372">The feedback signal is the whole difference: a completion is a guess nobody checks, and an agent's edit is a guess followed by a test run that says whether it was right.</text>
</svg>
