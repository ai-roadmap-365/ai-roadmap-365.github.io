<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="500,000 lines in 2,000 tokens.">
  <title>The repo-map</title>
  <style>
    .repo-map-bg   { fill: #f8fafc; }
    .repo-map-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repo-map-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repo-map-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repo-map-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repo-map-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repo-map-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repo-map-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repo-map-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repo-map-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repo-map-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repo-map-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repo-map-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .repo-map-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .repo-map-stage { opacity: 1; }

    .repo-map-s0 { animation-delay: 0.00s; }
    .repo-map-e0 { animation-delay: 0.00s; }
    .repo-map-s1 { animation-delay: 1.28s; }
    .repo-map-e1 { animation-delay: 1.28s; }
    .repo-map-s2 { animation-delay: 2.56s; }
    .repo-map-e2 { animation-delay: 2.56s; }
    .repo-map-s3 { animation-delay: 3.84s; }
    .repo-map-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .repo-map-conn  { animation: repo-map-trace 6.4s ease-in-out infinite; }
      .repo-map-stage { animation: repo-map-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes repo-map-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes repo-map-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .repo-map-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .repo-map-stage { animation: repo-map-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes repo-map-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="repo-map-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="repo-map-bg" width="980" height="322"/>
  <text class="repo-map-h1"  x="30" y="40">The repo-map</text>
  <text class="repo-map-sub" x="30" y="64">500,000 lines in 2,000 tokens.</text>
  <g class="repo-map-stage repo-map-s0">
    <rect class="repo-map-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="repo-map-step" x="44" y="142">01</text>
    <text class="repo-map-name" x="70" y="142">Parse every file with tree-sitter</text>
    <text class="repo-map-desc" x="44" y="166">Incrementally, into a concrete</text>
    <text class="repo-map-desc" x="44" y="182">syntax tree.</text>
    <text class="repo-map-edge" x="44" y="242">fast</text>
  </g>
  <line class="repo-map-line repo-map-conn repo-map-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#repo-map-tip)"/>
  <g class="repo-map-stage repo-map-s1">
    <rect class="repo-map-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="repo-map-step" x="280" y="142">02</text>
    <text class="repo-map-name" x="306" y="142">Extract the structure</text>
    <text class="repo-map-desc" x="280" y="166">Classes, methods, types,</text>
    <text class="repo-map-desc" x="280" y="182">imports, docstring headers.</text>
  </g>
  <line class="repo-map-line repo-map-conn repo-map-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#repo-map-tip)"/>
  <g class="repo-map-stage repo-map-s2">
    <rect class="repo-map-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="repo-map-step" x="516" y="142">03</text>
    <text class="repo-map-name" x="542" y="142">Discard the bodies</text>
    <text class="repo-map-desc" x="516" y="166">Implementation is retrievable on</text>
    <text class="repo-map-desc" x="516" y="182">demand; the shape is what</text>
    <text class="repo-map-desc" x="516" y="198">navigation needs.</text>
  </g>
  <line class="repo-map-line repo-map-conn repo-map-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#repo-map-tip)"/>
  <g class="repo-map-stage repo-map-s3">
    <rect class="repo-map-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="repo-map-step" x="752" y="142">04</text>
    <text class="repo-map-name" x="778" y="142">Rank by centrality</text>
    <text class="repo-map-desc" x="752" y="166">So the most connected symbols</text>
    <text class="repo-map-desc" x="752" y="182">survive the token budget.</text>
    <text class="repo-map-edge" x="752" y="242">2,000 tokens</text>
  </g>
  <text class="repo-map-sub" x="30" y="304">Discarding bodies is the compression that makes this work: a signature tells the model what exists and where, and the implementation is one targeted read away when it turns out to matter.</text>
</svg>
