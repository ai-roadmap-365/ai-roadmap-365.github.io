<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each added a capability, not a bigger model.">
  <title>Four leaps in four years</title>
  <style>
    .coding-eras-bg   { fill: #f8fafc; }
    .coding-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coding-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .coding-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .coding-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .coding-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .coding-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .coding-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .coding-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .coding-eras-stage { opacity: 1; }

    .coding-eras-s0 { animation-delay: 0.00s; }
    .coding-eras-e0 { animation-delay: 0.00s; }
    .coding-eras-s1 { animation-delay: 1.28s; }
    .coding-eras-e1 { animation-delay: 1.28s; }
    .coding-eras-s2 { animation-delay: 2.56s; }
    .coding-eras-e2 { animation-delay: 2.56s; }
    .coding-eras-s3 { animation-delay: 3.84s; }
    .coding-eras-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .coding-eras-conn  { animation: coding-eras-trace 6.4s ease-in-out infinite; }
      .coding-eras-stage { animation: coding-eras-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes coding-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes coding-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .coding-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .coding-eras-stage { animation: coding-eras-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes coding-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="coding-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="coding-eras-bg" width="980" height="322"/>
  <text class="coding-eras-h1"  x="30" y="40">Four leaps in four years</text>
  <text class="coding-eras-sub" x="30" y="64">Each added a capability, not a bigger model.</text>
  <g class="coding-eras-stage coding-eras-s0">
    <rect class="coding-eras-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="coding-eras-step" x="44" y="142">01</text>
    <text class="coding-eras-name" x="70" y="142">Token completion, 2021-2022</text>
    <text class="coding-eras-desc" x="44" y="166">Stateless prediction over the</text>
    <text class="coding-eras-desc" x="44" y="182">preceding 2,000 tokens.</text>
  </g>
  <line class="coding-eras-line coding-eras-conn coding-eras-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#coding-eras-tip)"/>
  <g class="coding-eras-stage coding-eras-s1">
    <rect class="coding-eras-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="coding-eras-step" x="280" y="142">02</text>
    <text class="coding-eras-name" x="306" y="142">In-editor chat, 2023</text>
    <text class="coding-eras-desc" x="280" y="166">Explanation, refactoring and</text>
    <text class="coding-eras-desc" x="280" y="182">test generation in a sidebar.</text>
  </g>
  <line class="coding-eras-line coding-eras-conn coding-eras-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#coding-eras-tip)"/>
  <g class="coding-eras-stage coding-eras-s2">
    <rect class="coding-eras-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="coding-eras-step" x="516" y="142">03</text>
    <text class="coding-eras-name" x="542" y="142">Tool loops and repo-maps, 2024</text>
    <text class="coding-eras-desc" x="516" y="166">Editing, execution and AST</text>
    <text class="coding-eras-desc" x="516" y="182">navigation. Verification enters</text>
    <text class="coding-eras-desc" x="516" y="198">the loop.</text>
  </g>
  <line class="coding-eras-line coding-eras-conn coding-eras-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#coding-eras-tip)"/>
  <g class="coding-eras-stage coding-eras-s3">
    <rect class="coding-eras-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="coding-eras-step" x="752" y="142">04</text>
    <text class="coding-eras-name" x="778" y="142">Headless agents and SWE-bench, 2024</text>
    <text class="coding-eras-desc" x="752" y="166">Real GitHub issues, resolved end</text>
    <text class="coding-eras-desc" x="752" y="182">to end in containers.</text>
    <text class="coding-eras-edge" x="752" y="242">measurable</text>
  </g>
  <text class="coding-eras-sub" x="30" y="304">The third leap is the substantive one, and it was architectural rather than a model improvement: the same models became far more useful once they could edit files and read a test result.</text>
</svg>
