<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is reviewable; one is not.">
  <title>Chunked edits, or full rewrites</title>
  <style>
    .chunked-edits-bg   { fill: #f8fafc; }
    .chunked-edits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunked-edits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunked-edits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunked-edits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunked-edits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunked-edits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunked-edits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chunked-edits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chunked-edits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chunked-edits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chunked-edits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chunked-edits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunked-edits-row { opacity: 1; }
    .chunked-edits-r0 { animation-delay: 0.00s; }
    .chunked-edits-r1 { animation-delay: 0.45s; }
    .chunked-edits-r2 { animation-delay: 0.90s; }
    .chunked-edits-r3 { animation-delay: 1.35s; }
    .chunked-edits-r4 { animation-delay: 1.80s; }
    .chunked-edits-row { animation: chunked-edits-reveal 7.3s ease-in-out infinite; }
    @keyframes chunked-edits-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chunked-edits-bg" width="980" height="390"/>
  <text class="chunked-edits-h1"  x="30" y="40">Chunked edits, or full rewrites</text>
  <text class="chunked-edits-sub" x="30" y="64">One is reviewable; one is not.</text>
  <rect class="chunked-edits-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chunked-edits-name" x="46" y="122">Chunked edits</text>
  <text class="chunked-edits-desc" x="46" y="142">Up to 80% fewer tokens.</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r0" x="46" y="182">Only the changed region is emitted</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r1" x="46" y="216">Produces a diff a human can read</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r2" x="46" y="250">Unrelated code cannot drift</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r3" x="46" y="284">Cheaper on every turn</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r4" x="46" y="318">Fails loudly when the anchor is missing</text>
  <rect class="chunked-edits-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chunked-edits-name" x="526" y="122">Full rewrites</text>
  <text class="chunked-edits-desc" x="526" y="142">Every line, every turn.</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r0" x="526" y="182">The whole file regenerated</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r1" x="526" y="216">A diff nobody can review</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r2" x="526" y="250">Formatting and comments quietly change</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r3" x="526" y="284">Cost scales with file size, not change size</text>
  <text class="chunked-edits-desc chunked-edits-row chunked-edits-r4" x="526" y="318">And drift is invisible</text>
  <text class="chunked-edits-sub" x="30" y="372">The reviewability argument matters as much as the cost one: a two-line diff gets read carefully, and a four-hundred-line regeneration of a file that changed in two places gets approved without being read.</text>
</svg>
