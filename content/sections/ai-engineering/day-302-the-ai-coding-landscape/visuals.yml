visuals:
- id: ai-coding-agent-evolution-and-taxonomy
  file: assets/ai-coding-agent-evolution-and-taxonomy.svg
  type: diagram
  title: AI Coding Agent Evolution and Taxonomy
  alt: AI Coding Agent Evolution and Taxonomy diagram comparing Line Completion, Chat In-Editor, Agentic
    IDE, Terminal Pair Programmer, and Autonomous Background Agent
  description: Taxonomy diagram comparing the five generations of AI-assisted coding tools.
- id: coding-agent-codebase-indexing-and-tool-loop
  file: assets/coding-agent-codebase-indexing-and-tool-loop.svg
  type: diagram
  title: Coding Agent Codebase Indexing and Tool Loop
  alt: Coding Agent Codebase Indexing and Tool Loop flowchart showing AST repo-map compilation, semantic
    retrieval, patch generation, test execution, and self-correction
  description: System architecture diagram illustrating how coding agents navigate, modify, and verify
    codebases.
- id: four-generations
  file: assets/four-generations.svg
  type: diagram
  title: 'Four generations of coding assistance'
  alt: 'Diagram: the four generations of AI coding tools by autonomy'
  description: 'A four-stage progression of AI coding assistance from inline completion through chat and agentic IDEs to headless background engineers.'
- id: completion-or-agent
  file: assets/completion-or-agent.svg
  type: diagram
  title: 'Completion, or an agent'
  alt: 'Diagram: inline completion compared with an agentic coding loop'
  description: 'A two-column comparison of next-token completion against an agent that edits, executes and verifies.'
- id: coding-eras
  file: assets/coding-eras.svg
  type: diagram
  title: 'Four leaps in four years'
  alt: 'Diagram: the progression from token completion to SWE-bench-driven autonomous agents'
  description: 'A four-stage progression of AI coding tools from statistical completion through chat and tool loops to headless agents evaluated on SWE-bench.'
- id: repo-map
  file: assets/repo-map.svg
  type: diagram
  title: 'The repo-map'
  alt: 'Diagram: how an AST repository map compresses a codebase into a context budget'
  description: 'A four-stage description of repo-map construction covering AST parsing, signature extraction, body discarding and centrality ranking.'
- id: chunked-edits
  file: assets/chunked-edits.svg
  type: diagram
  title: 'Chunked edits, or full rewrites'
  alt: 'Diagram: search-and-replace chunked editing compared with rewriting whole files'
  description: 'A two-column comparison of chunked search-and-replace edits against full-file regeneration.'
- id: apprentice
  file: assets/apprentice.svg
  type: diagram
  title: 'A workshop apprentice'
  alt: 'Diagram: a mechanic''s apprentice as an analogy for an agentic coding loop'
  description: 'A two-column comparison of a supervised apprentice using instruments against guessing at a repair.'
- id: swe-bench
  file: assets/swe-bench.svg
  type: diagram
  title: 'How SWE-bench evaluates an agent'
  alt: 'Diagram: the evaluation procedure of the SWE-bench benchmark'
  description: 'A four-stage description of SWE-bench evaluation covering issue ingestion, patch generation, fail-to-pass testing and regression testing.'
- id: agent-benefits
  file: assets/agent-benefits.svg
  type: diagram
  title: 'Four bottlenecks agents remove'
  alt: 'Diagram: the four development bottlenecks that agentic coding addresses'
  description: 'A four-stage description of the bottlenecks coding agents relieve covering multi-file changes, migration work, stack-trace diagnosis and unfamiliar frameworks.'
- id: coding-agent-risks
  file: assets/coding-agent-risks.svg
  type: diagram
  title: 'Two risks worth naming'
  alt: 'Diagram: the supply-chain and cost risks of agentic coding'
  description: 'A three-stage description of coding agent risks covering hallucinated dependencies, slopsquatting and multi-turn token cost.'
- id: coding-agent-when
  file: assets/coding-agent-when.svg
  type: diagram
  title: 'Where agents belong'
  alt: 'Diagram: when to use an AI coding agent and where human architecture is required'
  description: 'A two-column comparison of tasks suited to coding agents against those requiring senior human oversight.'
