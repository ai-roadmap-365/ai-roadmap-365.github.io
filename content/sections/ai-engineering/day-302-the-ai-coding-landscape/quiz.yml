questions:
- question: What is the primary architectural difference between an inline code completion assistant (e.g.
    GitHub Copilot tab completion) and an agentic coding assistant (e.g. Cursor Agent, Aider)?
  options:
  - Inline completion uses C++ while agentic coding uses Python
  - Inline completion predicts the immediate next tokens in the active buffer without executing tools
    or inspecting terminal errors, while an agentic assistant runs autonomous ReAct loops that edit files,
    run linters/tests, and iteratively fix syntax errors
  - Inline completion only works on Windows while agents only work on Linux
  - Inline completion does not use large language models
  answer_index: 1
  explanation: Agentic coding systems execute multi-step tool loops (file edits, test executions, linters)
    to iteratively solve complex tasks rather than predicting single-token completions.
- question: How do modern coding agents maintain codebase-wide semantic context across repositories with
    millions of lines of code?
  options:
  - By loading all repository files into RAM simultaneously without chunking
  - By combining Language Server Protocol (LSP) symbol indexing, Abstract Syntax Tree (AST) tree-sitter
    chunking, and BM25/vector embeddings to retrieve relevant references dynamically
  - By asking the user to copy-paste the entire codebase into every prompt
  - By deleting non-essential files before starting
  answer_index: 1
  explanation: Hybrid indexing combining AST symbols and semantic retrieval allows agents to navigate
    massive codebases efficiently.
- question: What is SWE-bench in the context of coding agent evaluation?
  options:
  - A hardware benchmark measuring GPU memory bandwidth
  - A standardized benchmark dataset composed of real GitHub pull requests and issue descriptions used
    to evaluate autonomous software engineering agents on real bug fixes
  - A code formatter for Python
  - A database query engine
  answer_index: 1
  explanation: SWE-bench tests whether AI agents can resolve real-world GitHub issues by generating passing
    unified diff patches.
- question: Which editing strategy is most cost-effective and accurate when an agent modifies a 2,000-line
    source file?
  options:
  - Rewriting the entire 2,000 lines from scratch on every turn
  - Generating unified diffs (`diff` blocks) or structured search-and-replace chunks (`multi_replace_file_content`)
    specifying precise replacement blocks
  - Appending all changes to the end of the file
  - Renaming the file
  answer_index: 1
  explanation: Search-and-replace chunks and diffs minimize output token generation costs and prevent
    accidental deletion of untouched code.
- question: What role does the Language Server Protocol (LSP) play in AI coding agent architectures?
  options:
  - It compresses PNG images
  - It provides deterministic code intelligence (go-to-definition, find references, diagnostic linter
    errors, type signatures) directly to the agent's toolset
  - It manages cloud billing accounts
  - It encrypts git commit messages
  answer_index: 1
  explanation: LSP equips agents with compiler-grade deterministic code intelligence, reducing hallucinations.
