terms:
- term: AI Coding Agent
  definition: An autonomous AI system equipped with file editing, terminal execution, and LSP tools to
    solve software engineering tasks.
- term: SWE-bench
  definition: A benchmark dataset of resolved GitHub issues measuring autonomous software engineering
    performance on real repositories.
- term: Language Server Protocol (LSP)
  definition: A protocol standardizing code intelligence features (definitions, references, diagnostics)
    across tools.
- term: AST Parsing
  definition: Using Abstract Syntax Trees (e.g. tree-sitter) to chunk and analyze source code hierarchically
    by classes and functions.
- term: Unified Diff Format
  definition: A standardized text representation showing added (`+`) and removed (`-`) lines with surrounding
    context.
- term: Search-and-Replace Chunking
  definition: A targeted file editing mechanism replacing exact matching blocks without rewriting entire
    files.
- term: Repo-Map
  definition: A compact, token-efficient structural summary of repository files and top-level symbols
    provided to coding models.
- term: Headless Coding Agent
  definition: A CLI or CI/CD coding agent that operates without a graphical user interface to fix bugs
    or generate PRs.
