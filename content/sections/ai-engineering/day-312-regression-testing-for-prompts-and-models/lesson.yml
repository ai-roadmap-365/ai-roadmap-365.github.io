title: Regression Testing for Prompts and Models
section: ai-engineering
subsection: production-ai-systems
week: 45
learning_promise: 'Master automated regression testing for generative AI: implement prompt versioning,
  semantic drift detection, pass@k statistical metrics, and automated CI/CD gating to prevent model regressions.'
objectives:
- Architect regression testing pipelines that compare candidate prompt/model performance against pinned
  golden baselines.
- Implement Pass@k and Mean Reciprocal Rank (MRR) statistical metrics to measure generation stability
  under stochastic sampling.
- Detect semantic drift and behavioral degradation across model provider updates and temperature variations.
- Implement an automated Regression Test Runner in Python with configurable tolerance thresholds and pass/fail
  assertion gates.
- Integrate prompt regression test gates into GitHub Actions and GitLab CI workflows.
