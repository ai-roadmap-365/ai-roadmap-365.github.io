questions:
- question: What is the primary objective of a 'Golden Baseline Benchmark' in AI regression testing?
  options:
  - To optimize CSS font styling
  - To delete outdated git commits
  - 'An immutable reference set to compare candidates against'
  - To compress JSON payloads
  answer_index: 2
  explanation: A golden baseline provides the mathematical benchmark required to detect regressions.
- question: What does the statistical metric 'Pass@k' measure in LLM code generation or problem solving?
  options:
  - How many network packets pass a router
  - The number of users logged into a system
  - The amount of memory used during backpropagation
  - 'The chance that one of k samples passes'
  answer_index: 3
  explanation: Pass@k evaluates generation quality under stochastic sampling (e.g. Pass@1 vs Pass@5).
- question: Why do minor system prompt changes frequently cause 'Silent Semantic Regressions' in downstream
    LLM tasks?
  options:
  - 'Changing wording for one skill can degrade another'
  - Because Python syntax changes daily
  - Because prompt tokens consume physical CPU registers
  - Because API keys expire
  answer_index: 0
  explanation: Language models are interconnected probabilistic distributions; localized prompt tweaks
    often induce non-local regressions.
- question: How does an automated CI Regression Gate prevent degraded AI features from reaching production?
  options:
  - By shutting down the production web server
  - 'Run the benchmark and fail the build on a drop'
  - By deleting the repository main branch
  - By emailing the entire company
  answer_index: 1
  explanation: Automated regression gates block PR merges when benchmark performance degrades.
- question: What is 'Semantic Drift' in the context of foundation model APIs?
  options:
  - When a server physically moves to another region
  - When an hard drive corrupts text files
  - 'The vendor changes weights behind a stable model name'
  - When CSS styles do not render correctly
  answer_index: 2
  explanation: Vendor model updates behind static alias tags can silently alter output characteristics,
    requiring continuous regression monitoring.
