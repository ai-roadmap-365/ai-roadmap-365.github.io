<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And how tight to set them.">
  <title>Where regression gates belong</title>
  <style>
    .regression-when-bg   { fill: #f8fafc; }
    .regression-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regression-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .regression-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .regression-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .regression-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .regression-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .regression-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regression-when-row { opacity: 1; }
    .regression-when-r0 { animation-delay: 0.00s; }
    .regression-when-r1 { animation-delay: 0.45s; }
    .regression-when-r2 { animation-delay: 0.90s; }
    .regression-when-r3 { animation-delay: 1.35s; }
    .regression-when-r4 { animation-delay: 1.80s; }
    .regression-when-row { animation: regression-when-reveal 7.3s ease-in-out infinite; }
    @keyframes regression-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="regression-when-bg" width="980" height="390"/>
  <text class="regression-when-h1"  x="30" y="40">Where regression gates belong</text>
  <text class="regression-when-sub" x="30" y="64">And how tight to set them.</text>
  <rect class="regression-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="regression-when-name" x="46" y="122">Implement gates</text>
  <text class="regression-when-desc" x="46" y="142">Anything maintained.</text>
  <text class="regression-when-desc regression-when-row regression-when-r0" x="46" y="182">Prompts under active revision</text>
  <text class="regression-when-desc regression-when-row regression-when-r1" x="46" y="216">Model provider changes</text>
  <text class="regression-when-desc regression-when-row regression-when-r2" x="46" y="250">Retrieval algorithm changes</text>
  <text class="regression-when-desc regression-when-row regression-when-r3" x="46" y="284">More than one engineer contributing</text>
  <text class="regression-when-desc regression-when-row regression-when-r4" x="46" y="318">Anywhere a silent regression would ship</text>
  <rect class="regression-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="regression-when-name" x="526" y="122">Configure them well</text>
  <text class="regression-when-desc" x="526" y="142">Two practical rules.</text>
  <text class="regression-when-desc regression-when-row regression-when-r0" x="526" y="182">Tolerance of -1.5% to -2.0% for variance</text>
  <text class="regression-when-desc regression-when-row regression-when-r1" x="526" y="216">Fail fast on a golden invariant</text>
  <text class="regression-when-desc regression-when-row regression-when-r2" x="526" y="250">Abort the run to save API cost</text>
  <text class="regression-when-desc regression-when-row regression-when-r3" x="526" y="284">Skip gates for sandbox prototypes</text>
  <text class="regression-when-desc regression-when-row regression-when-r4" x="526" y="318">But version the prompt file anyway</text>
  <text class="regression-when-sub" x="30" y="372">Failing fast on an invariant is a small optimisation with a real effect: an aborted run costs seconds instead of minutes of API spend, which keeps the full suite affordable enough to keep running.</text>
</svg>
