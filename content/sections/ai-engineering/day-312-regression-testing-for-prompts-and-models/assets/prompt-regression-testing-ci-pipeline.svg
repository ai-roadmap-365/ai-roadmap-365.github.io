<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Prompt Regression Testing CI Pipeline">
  <title>Prompt Regression Testing CI Pipeline</title>
  <defs>
    <style>
      .d312a-bg { fill: #f8fafc; }
      .d312a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d312a-pr { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d312a-run { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d312a-diff { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d312a-gate { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d312a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d312a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d312a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d312a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d312a-bg" />
  
  <text x="40" y="40" class="d312a-title">Automated AI Regression Testing CI Gate</text>
  <text x="40" y="65" class="d312a-subtitle">Prompt Regression Testing CI Pipeline showing Git PR Trigger, Dataset Runner, Delta Calculation against Golden Baseline, Tolerance Gate Assertion, and Deployment Block or Pass</text>
  
  <!-- Step 1: PR Trigger -->
  <rect x="40" y="110" width="180" height="270" class="d312a-pr" />
  <text x="55" y="140" class="d312a-header" fill="#1d4ed8">1. Pull Request Trigger</text>
  <text x="55" y="170" class="d312a-text">• Prompt edit or model</text>
  <text x="55" y="185" class="d312a-text">  checkpoint update</text>
  <text x="55" y="210" class="d312a-text">• Git commit SHA pinned</text>
  <text x="55" y="230" class="d312a-text">• CI runner spawned</text>
  <text x="55" y="260" class="d312a-text" font-weight="600">Branch:</text>
  <text x="55" y="280" class="d312a-text">`feature/update-prompt`</text>
  
  <!-- Step 2: Benchmark Execution -->
  <rect x="250" y="110" width="180" height="270" class="d312a-run" />
  <text x="265" y="140" class="d312a-header" fill="#7e22ce">2. Run Golden Benchmark</text>
  <text x="265" y="170" class="d312a-text">• Load `golden_eval.jsonl`</text>
  <text x="265" y="190" class="d312a-text">• Run 250 test cases</text>
  <text x="265" y="210" class="d312a-text">• Compute Exact Match,</text>
  <text x="265" y="225" class="d312a-text">  JSON F1, and Judge</text>
  <text x="265" y="260" class="d312a-text" font-weight="600">Candidate Score:</text>
  <text x="265" y="280" class="d312a-text">Pass Rate = 91.2%</text>
  
  <!-- Step 3: Delta Calculation -->
  <rect x="460" y="110" width="180" height="270" class="d312a-diff" />
  <text x="475" y="140" class="d312a-header" fill="#a16207">3. Delta vs Baseline</text>
  <text x="475" y="170" class="d312a-text">• Baseline = 88.5%</text>
  <text x="475" y="190" class="d312a-text">• Delta = +2.7%</text>
  <text x="475" y="210" class="d312a-text">• Zero regressions in</text>
  <text x="475" y="225" class="d312a-text">  hard negative category</text>
  <text x="475" y="260" class="d312a-text" font-weight="600">Tolerance Check:</text>
  <text x="475" y="280" class="d312a-text">Delta &gt;= -1.0% (PASS)</text>
  
  <!-- Step 4: Gate & Deploy -->
  <rect x="670" y="110" width="190" height="270" class="d312a-gate" />
  <text x="685" y="140" class="d312a-header" fill="#15803d">4. CI Gate Decision</text>
  <text x="685" y="170" class="d312a-text">• Automated PR status</text>
  <text x="685" y="190" class="d312a-text">• Post detailed markdown</text>
  <text x="685" y="205" class="d312a-text">  regression diff comment</text>
  <text x="685" y="230" class="d312a-text">• Green check &rarr; Mergeable</text>
  <text x="685" y="260" class="d312a-text" font-weight="600">Status:</text>
  <text x="685" y="280" class="d312a-text" fill="#15803d" font-weight="700">Deployment Approved</text>
</svg>