<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three signals, one trigger.">
  <title>Watching for drift in production</title>
  <style>
    .drift-detection-bg   { fill: #f8fafc; }
    .drift-detection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-detection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-detection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-detection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-detection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-detection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drift-detection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .drift-detection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .drift-detection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .drift-detection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .drift-detection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .drift-detection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .drift-detection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .drift-detection-stage { opacity: 1; }

    .drift-detection-s0 { animation-delay: 0.00s; }
    .drift-detection-e0 { animation-delay: 0.00s; }
    .drift-detection-s1 { animation-delay: 1.28s; }
    .drift-detection-e1 { animation-delay: 1.28s; }
    .drift-detection-s2 { animation-delay: 2.56s; }
    .drift-detection-e2 { animation-delay: 2.56s; }
    .drift-detection-s3 { animation-delay: 3.84s; }
    .drift-detection-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .drift-detection-conn  { animation: drift-detection-trace 6.4s ease-in-out infinite; }
      .drift-detection-stage { animation: drift-detection-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes drift-detection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes drift-detection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .drift-detection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .drift-detection-stage { animation: drift-detection-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes drift-detection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="drift-detection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="drift-detection-bg" width="980" height="322"/>
  <text class="drift-detection-h1"  x="30" y="40">Watching for drift in production</text>
  <text class="drift-detection-sub" x="30" y="64">Three signals, one trigger.</text>
  <g class="drift-detection-stage drift-detection-s0">
    <rect class="drift-detection-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="drift-detection-step" x="44" y="142">01</text>
    <text class="drift-detection-name" x="70" y="142">Embedding centroid drift</text>
    <text class="drift-detection-desc" x="44" y="166">Vectorise live responses; track</text>
    <text class="drift-detection-desc" x="44" y="182">rolling movement over seven</text>
    <text class="drift-detection-desc" x="44" y="198">days.</text>
  </g>
  <line class="drift-detection-line drift-detection-conn drift-detection-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#drift-detection-tip)"/>
  <g class="drift-detection-stage drift-detection-s1">
    <rect class="drift-detection-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="drift-detection-step" x="280" y="142">02</text>
    <text class="drift-detection-name" x="306" y="142">Output statistics</text>
    <text class="drift-detection-desc" x="280" y="166">Completion length, vocabulary</text>
    <text class="drift-detection-desc" x="280" y="182">diversity, refusal frequency.</text>
  </g>
  <line class="drift-detection-line drift-detection-conn drift-detection-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#drift-detection-tip)"/>
  <g class="drift-detection-stage drift-detection-s2">
    <rect class="drift-detection-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="drift-detection-step" x="516" y="142">03</text>
    <text class="drift-detection-name" x="542" y="142">Thresholds fire</text>
    <text class="drift-detection-desc" x="516" y="166">Canary pass rate down 2.5%, or</text>
    <text class="drift-detection-desc" x="516" y="182">length up 30%.</text>
  </g>
  <line class="drift-detection-line drift-detection-conn drift-detection-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#drift-detection-tip)"/>
  <g class="drift-detection-stage drift-detection-s3">
    <rect class="drift-detection-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="drift-detection-step" x="752" y="142">04</text>
    <text class="drift-detection-name" x="778" y="142">Page, and roll back</text>
    <text class="drift-detection-desc" x="752" y="166">To the previous prompt version.</text>
  </g>
  <text class="drift-detection-sub" x="30" y="304">Refusal frequency is an underrated signal: a model that starts declining more requests has changed behaviour in a way no accuracy metric captures and every user notices.</text>
</svg>
