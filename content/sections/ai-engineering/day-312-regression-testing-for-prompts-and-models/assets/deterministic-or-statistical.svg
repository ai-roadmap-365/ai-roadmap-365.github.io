<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="f(x) = y was the assumption.">
  <title>Why classical unit testing broke</title>
  <style>
    .deterministic-or-statistical-bg   { fill: #f8fafc; }
    .deterministic-or-statistical-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-statistical-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-statistical-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-statistical-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-statistical-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-statistical-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deterministic-or-statistical-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deterministic-or-statistical-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deterministic-or-statistical-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deterministic-or-statistical-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deterministic-or-statistical-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deterministic-or-statistical-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deterministic-or-statistical-row { opacity: 1; }
    .deterministic-or-statistical-r0 { animation-delay: 0.00s; }
    .deterministic-or-statistical-r1 { animation-delay: 0.45s; }
    .deterministic-or-statistical-r2 { animation-delay: 0.90s; }
    .deterministic-or-statistical-r3 { animation-delay: 1.35s; }
    .deterministic-or-statistical-r4 { animation-delay: 1.80s; }
    .deterministic-or-statistical-row { animation: deterministic-or-statistical-reveal 7.3s ease-in-out infinite; }
    @keyframes deterministic-or-statistical-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="deterministic-or-statistical-bg" width="980" height="390"/>
  <text class="deterministic-or-statistical-h1"  x="30" y="40">Why classical unit testing broke</text>
  <text class="deterministic-or-statistical-sub" x="30" y="64">f(x) = y was the assumption.</text>
  <rect class="deterministic-or-statistical-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="deterministic-or-statistical-name" x="46" y="122">Deterministic testing</text>
  <text class="deterministic-or-statistical-desc" x="46" y="142">Same input, same output.</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r0" x="46" y="182">assert f(x) == y</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r1" x="46" y="216">One run is conclusive</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r2" x="46" y="250">A failure is unambiguous</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r3" x="46" y="284">Exact string matching</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r4" x="46" y="318">Breaks constantly on natural language</text>
  <rect class="deterministic-or-statistical-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="deterministic-or-statistical-name" x="526" y="122">Statistical gating</text>
  <text class="deterministic-or-statistical-desc" x="526" y="142">A distribution, sampled.</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r0" x="526" y="182">Pass@k over n samples</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r1" x="526" y="216">Deltas against a pinned baseline</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r2" x="526" y="250">Tolerance for stochastic variance</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r3" x="526" y="284">Bootstrapped confidence intervals</text>
  <text class="deterministic-or-statistical-desc deterministic-or-statistical-row deterministic-or-statistical-r4" x="526" y="318">A failure is a significant delta</text>
  <text class="deterministic-or-statistical-sub" x="30" y="372">The tolerance is what makes this work in practice and also what has to be chosen carefully: too tight and every run fails on noise, too loose and a real regression slips through as variance.</text>
</svg>
