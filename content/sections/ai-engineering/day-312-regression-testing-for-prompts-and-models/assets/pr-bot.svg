<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where the decision is made.">
  <title>Putting the delta in the pull request</title>
  <style>
    .pr-bot-bg   { fill: #f8fafc; }
    .pr-bot-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-bot-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-bot-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-bot-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-bot-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-bot-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pr-bot-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pr-bot-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pr-bot-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pr-bot-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pr-bot-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pr-bot-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pr-bot-row { opacity: 1; }
    .pr-bot-r0 { animation-delay: 0.00s; }
    .pr-bot-r1 { animation-delay: 0.45s; }
    .pr-bot-r2 { animation-delay: 0.90s; }
    .pr-bot-r3 { animation-delay: 1.35s; }
    .pr-bot-r4 { animation-delay: 1.80s; }
    .pr-bot-row { animation: pr-bot-reveal 7.3s ease-in-out infinite; }
    @keyframes pr-bot-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pr-bot-bg" width="980" height="390"/>
  <text class="pr-bot-h1"  x="30" y="40">Putting the delta in the pull request</text>
  <text class="pr-bot-sub" x="30" y="64">Where the decision is made.</text>
  <rect class="pr-bot-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pr-bot-name" x="46" y="122">In the pull request</text>
  <text class="pr-bot-desc" x="46" y="142">Where the reviewer is.</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r0" x="46" y="182">A sticky comment with a comparison table</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r1" x="46" y="216">Pass rate: 88.5% -&gt; 92.0% (+3.5%)</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r2" x="46" y="250">JSON validity: 100% -&gt; 100%</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r3" x="46" y="284">Golden invariants: 0 failures</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r4" x="46" y="318">Clickable links to individual case diffs</text>
  <rect class="pr-bot-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pr-bot-name" x="526" y="122">In a dashboard</text>
  <text class="pr-bot-desc" x="526" y="142">Somewhere else.</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r0" x="526" y="182">The run happened</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r1" x="526" y="216">Somebody has to go and look</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r2" x="526" y="250">Usually after merging</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r3" x="526" y="284">Or not at all</text>
  <text class="pr-bot-desc pr-bot-row pr-bot-r4" x="526" y="318">The gate exists and does not gate</text>
  <text class="pr-bot-sub" x="30" y="372">Putting the numbers where the decision is made is most of what makes a gate effective: a reviewer who sees the delta above the diff cannot merge without having seen it.</text>
</svg>
