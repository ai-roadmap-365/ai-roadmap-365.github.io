<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Measured on a track, not assumed.">
  <title>Vehicle certification</title>
  <style>
    .crash-testing-bg   { fill: #f8fafc; }
    .crash-testing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crash-testing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crash-testing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crash-testing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crash-testing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crash-testing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .crash-testing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .crash-testing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .crash-testing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .crash-testing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .crash-testing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .crash-testing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .crash-testing-row { opacity: 1; }
    .crash-testing-r0 { animation-delay: 0.00s; }
    .crash-testing-r1 { animation-delay: 0.45s; }
    .crash-testing-r2 { animation-delay: 0.90s; }
    .crash-testing-r3 { animation-delay: 1.35s; }
    .crash-testing-r4 { animation-delay: 1.80s; }
    .crash-testing-row { animation: crash-testing-reveal 7.3s ease-in-out infinite; }
    @keyframes crash-testing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="crash-testing-bg" width="980" height="390"/>
  <text class="crash-testing-h1"  x="30" y="40">Vehicle certification</text>
  <text class="crash-testing-sub" x="30" y="64">Measured on a track, not assumed.</text>
  <rect class="crash-testing-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="crash-testing-name" x="46" y="122">Certified</text>
  <text class="crash-testing-desc" x="46" y="142">Measured against a standard.</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r0" x="46" y="182">A hundred standardised test tracks</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r1" x="46" y="216">Fuel efficiency, braking, emissions, stability</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r2" x="46" y="250">Efficiency up 8%, braking unchanged</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r3" x="46" y="284">Zero mechanical faults</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r4" x="46" y="318">Certified for production</text>
  <rect class="crash-testing-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="crash-testing-name" x="526" y="122">Shipped directly</text>
  <text class="crash-testing-desc" x="526" y="142">Improved one thing.</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r0" x="526" y="182">A better engine, dropped in</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r1" x="526" y="216">Efficiency genuinely improved</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r2" x="526" y="250">Nothing else measured</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r3" x="526" y="284">Brakes fail on the first cold morning</text>
  <text class="crash-testing-desc crash-testing-row crash-testing-r4" x="526" y="318">Discovered by customers</text>
  <text class="crash-testing-sub" x="30" y="372">The multi-metric point is what carries across: an improvement on the dimension you were optimising tells you nothing about the dimensions you were not, and only a standard battery covers both.</text>
</svg>
