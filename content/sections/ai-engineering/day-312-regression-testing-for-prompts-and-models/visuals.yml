visuals:
- id: prompt-regression-testing-ci-pipeline
  file: assets/prompt-regression-testing-ci-pipeline.svg
  type: diagram
  title: Prompt Regression Testing CI Pipeline
  alt: Prompt Regression Testing CI Pipeline showing Git PR Trigger, Dataset Runner, Delta Calculation
    against Golden Baseline, Tolerance Gate Assertion, and Deployment Block or Pass
  description: Continuous integration pipeline showing automated regression testing on prompt pull requests.
- id: pass-at-k-sampling-and-regression-delta-matrix
  file: assets/pass-at-k-sampling-and-regression-delta-matrix.svg
  type: diagram
  title: Pass at k Sampling and Regression Delta Matrix
  alt: Pass at k Sampling and Regression Delta Matrix showing Stochastic Sampling across k=1 and k=5,
    Metric Deltas, and Category Breakdown
  description: Comparative matrix visualizing Pass@1 vs Pass@5 sampling and regression deltas across dataset
    categories.
- id: regression-gate
  file: assets/regression-gate.svg
  type: diagram
  title: 'What a regression gate does'
  alt: 'Diagram: the four steps of an AI regression gate'
  description: 'A four-stage description of a regression gate covering the pinned baseline, the candidate run, delta computation and threshold enforcement.'
- id: deterministic-or-statistical
  file: assets/deterministic-or-statistical.svg
  type: diagram
  title: 'Why classical unit testing broke'
  alt: 'Diagram: deterministic unit testing compared with statistical regression gating'
  description: 'A two-column comparison of classical deterministic unit tests against statistical regression testing for stochastic models.'
- id: regression-lineage
  file: assets/regression-lineage.svg
  type: diagram
  title: 'Three steps to a prompt gate'
  alt: 'Diagram: the progression from unit testing to CI-gated prompt versioning'
  description: 'A three-stage progression from deterministic unit testing through the Pass@k metric to prompt versioning with CI gates.'
- id: tiered-ci
  file: assets/tiered-ci.svg
  type: diagram
  title: 'Three CI stages'
  alt: 'Diagram: the three stages of a tiered regression testing pipeline'
  description: 'A three-stage description of tiered CI regression testing covering pre-commit checks, pull request smoke tests and a nightly matrix run.'
- id: statistical-rigor
  file: assets/statistical-rigor.svg
  type: diagram
  title: 'Is a 3.5% gain real?'
  alt: 'Diagram: how bootstrapped confidence intervals verify an accuracy improvement'
  description: 'A four-stage description of bootstrap significance testing covering resampling, delta computation, the confidence interval and the decision rule.'
- id: crash-testing
  file: assets/crash-testing.svg
  type: diagram
  title: 'Vehicle certification'
  alt: 'Diagram: certifying a new engine on standardised tests compared with shipping it directly'
  description: 'A two-column comparison of vehicle regression certification against untested deployment.'
- id: drift-detection
  file: assets/drift-detection.svg
  type: diagram
  title: 'Watching for drift in production'
  alt: 'Diagram: the signals monitored for semantic drift in a production model'
  description: 'A four-stage description of drift detection covering embedding centroid movement, output statistics, anomaly thresholds and rollback.'
- id: pr-bot
  file: assets/pr-bot.svg
  type: diagram
  title: 'Putting the delta in the pull request'
  alt: 'Diagram: a regression bot posting results into a pull request compared with a separate dashboard'
  description: 'A two-column comparison of surfacing regression results in the pull request against reporting them elsewhere.'
- id: token-inflation
  file: assets/token-inflation.svg
  type: diagram
  title: 'The regression nobody measured'
  alt: 'Diagram: a prompt change that improved quality while inflating cost'
  description: 'A four-stage walkthrough of an undetected token inflation regression and the gate that now prevents it.'
- id: regression-when
  file: assets/regression-when.svg
  type: diagram
  title: 'Where regression gates belong'
  alt: 'Diagram: when to implement AI regression gates and how to configure tolerances'
  description: 'A two-column comparison of systems requiring regression gates against disposable work, with practical tolerance guidance.'
