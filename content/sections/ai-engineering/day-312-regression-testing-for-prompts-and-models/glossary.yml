terms:
- term: Regression Testing
  definition: Executing a standardized test suite to verify that code or prompt changes do not degrade
    existing functionality.
- term: Golden Baseline
  definition: An immutable, verified historical benchmark score and dataset used as the target for comparison.
- term: Pass@k
  definition: The probability that at least one of $k$ generated candidate outputs passes all verification
    criteria.
- term: Semantic Drift
  definition: Gradual shifts in model behavior or output distribution over time caused by vendor updates.
- term: Regression Gate
  definition: A CI/CD automated assertion blocking deployment if benchmark performance drops below a threshold.
- term: Regression Tolerance Delta
  definition: The maximum permissible drop in an evaluation metric (e.g. -1.5%) before failing CI.
- term: Prompt Versioning
  definition: Treating system prompts as version-controlled code artifacts with commit histories and changelogs.
- term: A/B Benchmark Diff
  definition: A side-by-side comparative report highlighting cases where a candidate model improved or
    regressed.
