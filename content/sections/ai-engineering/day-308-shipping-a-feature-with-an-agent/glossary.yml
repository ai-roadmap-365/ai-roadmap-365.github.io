terms:
- term: Feature Shipping Playbook
  definition: A standardized 6-stage lifecycle for delivering features with AI coding agents.
- term: Walkthrough Artifact
  definition: A post-implementation document summarizing changes, test evidence, and review notes.
- term: Atomic Schema Synchronization
  definition: Simultaneously updating database models, API serializers, client bindings, and tests.
- term: Deterministic Merge Gate
  definition: A strict CI pipeline of tests, linters, and type checkers gating branch merges.
- term: Specification Lock
  definition: Finalizing technical requirements and non-goals before the agent begins file edits.
- term: Red-Green-Verify Cycle
  definition: Confirming test failure first, implementing code, and confirming 100% test pass.
- term: Coordinated Patch
  definition: A multi-file edit applied in a single turn across interdependent repository modules.
- term: Self-Contained PR
  definition: A pull request containing implementation code, unit tests, documentation, and execution
    logs.
