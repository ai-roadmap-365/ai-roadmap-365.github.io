questions:
- question: What is the recommended sequence of stages for shipping a production feature with an AI coding
    agent?
  options:
  - 'Spec, plan, failing test, implement, verify, document'
  - Deploy to prod -> Write code -> Delete tests
  - Write code in one prompt -> Merge immediately
  - Ask the agent to decide everything without human review
  answer_index: 0
  explanation: A disciplined 6-stage lifecycle guarantees architectural integrity, test coverage, and
    clean documentation.
- question: Why is generating user-facing and API documentation during the agent's feature loop essential?
  options:
  - 'Because documentation prevents the code from compiling at all'
  - 'It already holds the new types and error codes in context'
  - It makes the git repo larger
  - It is required by Python syntax
  answer_index: 1
  explanation: Authoring documentation in the same turn as implementation ensures docs and code never
    drift out of synchronization.
- question: What role does the 'Walkthrough' artifact play upon feature completion?
  options:
  - It deletes all git branches
  - It compiles C++ source code
  - 'It summarises files, tests, and benchmarks for review'
  - It sends marketing emails
  answer_index: 2
  explanation: A walkthrough artifact summarizes changes and validation evidence for peer review.
- question: If an agent modifies a shared database model, what downstream artifacts must be updated in
    the same atomic turn?
  options:
  - Only the database model file
  - The operating system kernel
  - 'No downstream artifacts need any updates at all'
  - 'Migration, serializer, type bindings, and tests'
  answer_index: 3
  explanation: Atomic multi-file refactoring keeps data schemas, serializers, API bindings, and tests
    in sync.
- question: What is the ultimate acceptance gate before merging an agent-built feature into the main codebase?
  options:
  - 'Green tests, clean linters, and human approval'
  - The model claiming it works
  - Waiting 24 hours
  - Restarting the computer
  answer_index: 0
  explanation: Deterministic automated quality gates combined with human architectural review constitute
    the final merge criteria.
