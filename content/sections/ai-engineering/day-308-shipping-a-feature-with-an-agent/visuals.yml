visuals:
- id: end-to-end-feature-shipping-lifecycle
  file: assets/end-to-end-feature-shipping-lifecycle.svg
  type: diagram
  title: End to End Feature Shipping Lifecycle
  alt: End to End Feature Shipping Lifecycle showing Spec, Plan Review, TDD Red Test, Implementation Green,
    Verification Gate, and PR Walkthrough
  description: Lifecycle diagram illustrating the complete 6-stage feature shipping methodology.
- id: atomic-multi-file-feature-synchronization
  file: assets/atomic-multi-file-feature-synchronization.svg
  type: diagram
  title: Atomic Multi File Feature Synchronization
  alt: Atomic Multi File Feature Synchronization diagram showing Models, API Endpoints, Serializers, Unit
    Tests, and Docs modified simultaneously
  description: Architecture diagram illustrating synchronized multi-file feature modifications.
- id: six-stages
  file: assets/six-stages.svg
  type: diagram
  title: 'The six stages'
  alt: 'Diagram: the six stages of shipping a feature with a coding agent'
  description: 'A six-stage description of agentic feature delivery covering specification, plan review, failing tests, implementation, quality gates and the pull request.'
- id: playbook-or-adhoc
  file: assets/playbook-or-adhoc.svg
  type: diagram
  title: 'The playbook against ad-hoc prompting'
  alt: 'Diagram: structured agentic delivery compared with ad-hoc prompting and manual coding'
  description: 'A two-column comparison of a structured six-stage delivery playbook against ad-hoc agent prompting.'
- id: delivery-lineage
  file: assets/delivery-lineage.svg
  type: diagram
  title: 'Three traditions combined'
  alt: 'Diagram: the engineering traditions that agentic feature delivery combines'
  description: 'A three-stage progression from specification by example through infrastructure as code to unified agentic delivery.'
- id: atomic-layers
  file: assets/atomic-layers.svg
  type: diagram
  title: 'Atomic multi-file synchronisation'
  alt: 'Diagram: the layers a single feature change must update together'
  description: 'A five-stage description of the stack layers a coordinated feature change touches and why partial updates fail.'
- id: jet-engine
  file: assets/jet-engine.svg
  type: diagram
  title: 'Fitting a jet engine'
  alt: 'Diagram: a complete engine installation compared with attaching the turbine alone'
  description: 'A two-column comparison of a complete aircraft engine installation against attaching the engine without connected systems.'
- id: walkthrough-artifact
  file: assets/walkthrough-artifact.svg
  type: diagram
  title: 'The walkthrough artefact'
  alt: 'Diagram: the contents of a pull request walkthrough artefact'
  description: 'A four-stage description of a walkthrough artefact covering architectural intent, changed files, test evidence and rollback plan.'
- id: post-merge
  file: assets/post-merge.svg
  type: diagram
  title: 'Shipping does not end at merge'
  alt: 'Diagram: the automated post-merge verification and rollout sequence'
  description: 'A four-stage description of post-merge verification covering canary routing, telemetry monitoring, automated rollback and traffic promotion.'
- id: pre-merge-gate
  file: assets/pre-merge-gate.svg
  type: diagram
  title: 'Five pre-merge checks'
  alt: 'Diagram: the five checks before merging an agent-built feature'
  description: 'A five-stage checklist covering test coverage, backward compatibility, telemetry, git history and documentation.'
- id: role-shift
  file: assets/role-shift.svg
  type: diagram
  title: 'What the engineer does now'
  alt: 'Diagram: the shift in engineering activity as agents take over implementation'
  description: 'A two-column comparison of traditional engineering activity against the specification and verification role.'
- id: playbook-when
  file: assets/playbook-when.svg
  type: diagram
  title: 'When the full playbook applies'
  alt: 'Diagram: when the six-stage delivery playbook is warranted'
  description: 'A two-column comparison of changes warranting the full six-stage process against small changes.'
