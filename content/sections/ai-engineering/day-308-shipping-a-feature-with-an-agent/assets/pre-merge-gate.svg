<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them is about rolling updates.">
  <title>Five pre-merge checks</title>
  <style>
    .pre-merge-gate-bg   { fill: #f8fafc; }
    .pre-merge-gate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-merge-gate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-merge-gate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-merge-gate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-merge-gate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-merge-gate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pre-merge-gate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pre-merge-gate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pre-merge-gate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pre-merge-gate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pre-merge-gate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pre-merge-gate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pre-merge-gate-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pre-merge-gate-stage { opacity: 1; }

    .pre-merge-gate-s0 { animation-delay: 0.00s; }
    .pre-merge-gate-e0 { animation-delay: 0.00s; }
    .pre-merge-gate-s1 { animation-delay: 1.33s; }
    .pre-merge-gate-e1 { animation-delay: 1.33s; }
    .pre-merge-gate-s2 { animation-delay: 2.67s; }
    .pre-merge-gate-e2 { animation-delay: 2.67s; }
    .pre-merge-gate-s3 { animation-delay: 4.00s; }
    .pre-merge-gate-e3 { animation-delay: 4.00s; }
    .pre-merge-gate-s4 { animation-delay: 5.33s; }
    .pre-merge-gate-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .pre-merge-gate-conn  { animation: pre-merge-gate-trace 8s ease-in-out infinite; }
      .pre-merge-gate-stage { animation: pre-merge-gate-arrive 8s ease-in-out infinite; }
    }
    @keyframes pre-merge-gate-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pre-merge-gate-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pre-merge-gate-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pre-merge-gate-stage { animation: pre-merge-gate-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pre-merge-gate-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pre-merge-gate-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pre-merge-gate-bg" width="980" height="322"/>
  <text class="pre-merge-gate-h1"  x="30" y="40">Five pre-merge checks</text>
  <text class="pre-merge-gate-sub" x="30" y="64">One of them is about rolling updates.</text>
  <g class="pre-merge-gate-stage pre-merge-gate-s0">
    <rect class="pre-merge-gate-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="pre-merge-gate-step" x="44" y="142">01</text>
    <text class="pre-merge-gate-name" x="70" y="142">Test coverage</text>
    <text class="pre-merge-gate-desc" x="44" y="166">Unit, integration and</text>
    <text class="pre-merge-gate-desc" x="44" y="182">edge cases, not only the</text>
    <text class="pre-merge-gate-desc" x="44" y="198">happy path.</text>
  </g>
  <line class="pre-merge-gate-line pre-merge-gate-conn pre-merge-gate-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#pre-merge-gate-tip)"/>
  <g class="pre-merge-gate-stage pre-merge-gate-s1">
    <rect class="pre-merge-gate-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="pre-merge-gate-step" x="233" y="142">02</text>
    <text class="pre-merge-gate-name" x="259" y="142">Backward compatibility</text>
    <text class="pre-merge-gate-desc" x="233" y="166">Nullable columns or</text>
    <text class="pre-merge-gate-desc" x="233" y="182">defaults, so a rolling</text>
    <text class="pre-merge-gate-desc" x="233" y="198">update does not break the</text>
  </g>
  <line class="pre-merge-gate-line pre-merge-gate-conn pre-merge-gate-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#pre-merge-gate-tip)"/>
  <g class="pre-merge-gate-stage pre-merge-gate-s2">
    <rect class="pre-merge-gate-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="pre-merge-gate-step" x="422" y="142">03</text>
    <text class="pre-merge-gate-name" x="448" y="142">Structured logging</text>
    <text class="pre-merge-gate-desc" x="422" y="166">Business events with</text>
    <text class="pre-merge-gate-desc" x="422" y="182">request IDs, so</text>
    <text class="pre-merge-gate-desc" x="422" y="198">production is debuggable.</text>
  </g>
  <line class="pre-merge-gate-line pre-merge-gate-conn pre-merge-gate-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#pre-merge-gate-tip)"/>
  <g class="pre-merge-gate-stage pre-merge-gate-s3">
    <rect class="pre-merge-gate-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="pre-merge-gate-step" x="611" y="142">04</text>
    <text class="pre-merge-gate-name" x="637" y="142">Clean git history</text>
    <text class="pre-merge-gate-desc" x="611" y="166">A squashed conventional</text>
    <text class="pre-merge-gate-desc" x="611" y="182">commit linked to the</text>
    <text class="pre-merge-gate-desc" x="611" y="198">ticket.</text>
  </g>
  <line class="pre-merge-gate-line pre-merge-gate-conn pre-merge-gate-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#pre-merge-gate-tip)"/>
  <g class="pre-merge-gate-stage pre-merge-gate-s4">
    <rect class="pre-merge-gate-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="pre-merge-gate-step" x="800" y="142">05</text>
    <text class="pre-merge-gate-name" x="826" y="142">Documentation updated</text>
    <text class="pre-merge-gate-desc" x="800" y="166">OpenAPI, docstrings and</text>
    <text class="pre-merge-gate-desc" x="800" y="182">guides, generated in the</text>
    <text class="pre-merge-gate-desc" x="800" y="198">same loop.</text>
  </g>
  <text class="pre-merge-gate-sub" x="30" y="304">The compatibility check is the one agents miss most often: a non-nullable column added without a default is correct in isolation and breaks every instance still running the previous release.</text>
</svg>
