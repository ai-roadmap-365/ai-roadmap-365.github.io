visuals:
- id: react-agent-execution-loop
  file: assets/react-agent-execution-loop.svg
  type: diagram
  title: ReAct Agent Execution Loop
  alt: ReAct Agent Execution Loop showing Thought, Action, Environment Execution, Observation, and Dynamic
    Termination Loop
  description: Lifecycle flowchart showing the cyclic ReAct execution pattern.
- id: plan-and-solve-vs-react-comparison
  file: assets/plan-and-solve-vs-react-comparison.svg
  type: diagram
  title: Plan and Solve vs ReAct Comparison
  alt: Plan and Solve vs ReAct Comparison diagram contrasting upfront macro planning with iterative step-by-step
    reasoning
  description: Comparative diagram between Plan-and-Solve and ReAct control flows.
- id: react-cycle
  file: assets/react-cycle.svg
  type: diagram
  title: 'Thought, Action, Observation'
  alt: 'Diagram: the alternating structure of a ReAct execution loop'
  description: 'A four-stage description of the ReAct loop covering the reasoning trace, the action call, the injected observation and the termination condition.'
- id: react-versus-either
  file: assets/react-versus-either.svg
  type: diagram
  title: 'Reason only, or act only'
  alt: 'Diagram: pure reasoning compared with blind action, and why interleaving beats both'
  description: 'A two-column comparison of reasoning without action against acting without reasoning, in an escape-room setting.'
- id: loop-lineage
  file: assets/loop-lineage.svg
  type: diagram
  title: 'Three generations of control loop'
  alt: 'Diagram: the progression from chain-of-thought to Plan-and-Solve and Reflexion'
  description: 'A four-stage progression from chain-of-thought prompting through ReAct to Plan-and-Solve macro planning and Reflexion''s verbal reinforcement.'
- id: react-not-zero-shot
  file: assets/react-not-zero-shot.svg
  type: diagram
  title: 'Three things the loop is not'
  alt: 'Diagram: a ReAct loop compared with three simpler structures mistaken for it'
  description: 'A two-column comparison of a stateful ReAct loop against zero-shot function calling, static pipelines and unbounded recursion.'
- id: parsing-contract
  file: assets/parsing-contract.svg
  type: diagram
  title: 'Parsing a completion into a call'
  alt: 'Diagram: what a production action parser must handle'
  description: 'A four-stage description of parsing model completions into tool calls covering the grammar contract, fenced blocks, malformed JSON and schema validation.'
- id: four-failures
  file: assets/four-failures.svg
  type: diagram
  title: 'Four failure modes the loop fixes'
  alt: 'Diagram: the four failure modes of single-pass generation that the ReAct loop addresses'
  description: 'A four-stage description of failures the ReAct loop resolves covering error cascades, hallucinated signatures, syntax recovery and completion verification.'
- id: chef-analogy
  file: assets/chef-analogy.svg
  type: diagram
  title: 'Cooking a sauce'
  alt: 'Diagram: a cook checking intermediate results compared with blind execution'
  description: 'A two-column comparison of a cook verifying between steps against combining all ingredients at once.'
- id: context-growth
  file: assets/context-growth.svg
  type: diagram
  title: 'Why the loop gets expensive'
  alt: 'Diagram: how a ReAct scratchpad accumulates across steps'
  description: 'A four-stage description of context growth in a ReAct loop covering per-step appends, the resulting cost curve and scratchpad truncation.'
- id: sandbox-tools
  file: assets/sandbox-tools.svg
  type: diagram
  title: 'Every action executes real code'
  alt: 'Diagram: sandboxed tool execution compared with direct execution'
  description: 'A two-column comparison of executing agent tool calls inside a sandbox against running them directly.'
- id: react-or-native
  file: assets/react-or-native.svg
  type: diagram
  title: 'A text grammar, or native tool calling'
  alt: 'Diagram: prompt-based ReAct compared with native tool-calling APIs'
  description: 'A two-column comparison of a text-grammar ReAct loop against provider-native tool calling.'
- id: react-when
  file: assets/react-when.svg
  type: diagram
  title: 'Where the loop belongs'
  alt: 'Diagram: when the ReAct loop is the right structure'
  description: 'A two-column comparison of tasks suited to a ReAct loop against those better served by a single call or a fixed pipeline.'
