terms:
- term: ReAct Paradigm
  definition: An execution pattern that interleaves verbal reasoning (Thought), tool execution (Action),
    and environment feedback (Observation).
- term: Action Parser
  definition: A parser extracting structured tool names and JSON parameters from raw LLM output text.
- term: Self-Healing Feedback
  definition: Injecting tool syntax or runtime errors back into the agent context so the model can correct
    its mistake.
- term: Scratchpad
  definition: The cumulative working memory containing all historical thoughts, actions, and observations
    for the active trajectory.
- term: Termination Predicate
  definition: The logical condition determining when an agent has satisfied its objective and should stop
    execution.
- term: Plan-and-Solve
  definition: An agent architecture that generates a full execution plan upfront before executing individual
    steps.
- term: Observation Injection
  definition: Appending structured tool returns to the active conversation history before the next reasoning
    step.
- term: Stream Parsing
  definition: Incrementally evaluating model token streams to trigger tool calls with minimal latency.
