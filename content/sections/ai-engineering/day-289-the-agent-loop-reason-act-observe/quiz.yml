questions:
- question: What is the primary advantage of interleaved Thought-Action-Observation (ReAct) over standalone
    Chain-of-Thought (CoT)?
  options:
  - ReAct requires zero tokens
  - ReAct grounds reasoning in dynamic external observations and enables runtime error correction during
    multi-step tasks
  - ReAct compiles Python code into assembly
  - ReAct eliminates all model non-determinism
  answer_index: 1
  explanation: Standard CoT cannot interact with external tools or correct internal reasoning errors using
    live observation feedback.
- question: How should an agent runtime respond when an action parser fails to parse malformed JSON produced
    by the model?
  options:
  - Crash the application immediately
  - Inject the exact syntax error and expected JSON schema back into the scratchpad as an Observation
    to trigger self-healing
  - Silently execute a random function
  - Delete the agent's history
  answer_index: 1
  explanation: Self-healing error feedback prompts the model to correct its syntax mistake on the subsequent
    reasoning turn.
- question: What role does the 'Thought' phase serve in the ReAct prompt trajectory?
  options:
  - It encrypts the user prompt
  - It provides explicit verbal working memory allowing the model to decompose goals and formulate an
    action plan before executing a tool
  - It bypasses API rate limits
  - It downloads external dependencies
  answer_index: 1
  explanation: The Thought phase acts as an explicit scratchpad for step-by-step reasoning and sub-goal
    tracking.
- question: What indicates to the ReAct engine that the task has successfully concluded?
  options:
  - The model emits the explicit `Final Answer:` prefix or invokes a designated `terminate()` tool
  - The model runs out of GPU memory
  - The HTTP socket closes
  - The Python garbage collector runs
  answer_index: 0
  explanation: A formal termination predicate (such as `Final Answer:` or a completion tool call) ends
    the loop.
- question: What happens if an agent loop does not implement an observation feedback step?
  options:
  - It becomes a closed-loop system
  - It becomes an open-loop execution system blind to tool output, failures, and environmental changes
  - It executes 100x faster with 100% accuracy
  - It converts into a neural network
  answer_index: 1
  explanation: Without observation feedback, the agent cannot see what its tools produced or whether errors
    occurred.
