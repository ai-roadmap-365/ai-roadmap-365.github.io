<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the grammar that makes it parseable.">
  <title>Thought, Action, Observation</title>
  <style>
    .react-cycle-bg   { fill: #f8fafc; }
    .react-cycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-cycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-cycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-cycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-cycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-cycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .react-cycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .react-cycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .react-cycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .react-cycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .react-cycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .react-cycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .react-cycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .react-cycle-stage { opacity: 1; }

    .react-cycle-s0 { animation-delay: 0.00s; }
    .react-cycle-e0 { animation-delay: 0.00s; }
    .react-cycle-s1 { animation-delay: 1.28s; }
    .react-cycle-e1 { animation-delay: 1.28s; }
    .react-cycle-s2 { animation-delay: 2.56s; }
    .react-cycle-e2 { animation-delay: 2.56s; }
    .react-cycle-s3 { animation-delay: 3.84s; }
    .react-cycle-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .react-cycle-conn  { animation: react-cycle-trace 6.4s ease-in-out infinite; }
      .react-cycle-stage { animation: react-cycle-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes react-cycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes react-cycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .react-cycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .react-cycle-stage { animation: react-cycle-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes react-cycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="react-cycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="react-cycle-bg" width="980" height="322"/>
  <text class="react-cycle-h1"  x="30" y="40">Thought, Action, Observation</text>
  <text class="react-cycle-sub" x="30" y="64">And the grammar that makes it parseable.</text>
  <g class="react-cycle-stage react-cycle-s0">
    <rect class="react-cycle-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="react-cycle-step" x="44" y="142">01</text>
    <text class="react-cycle-name" x="70" y="142">Thought</text>
    <text class="react-cycle-desc" x="44" y="166">The model states its reasoning.</text>
    <text class="react-cycle-desc" x="44" y="182">Not decoration — it tracks the</text>
    <text class="react-cycle-desc" x="44" y="198">sub-goal.</text>
  </g>
  <line class="react-cycle-line react-cycle-conn react-cycle-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#react-cycle-tip)"/>
  <g class="react-cycle-stage react-cycle-s1">
    <rect class="react-cycle-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="react-cycle-step" x="280" y="142">02</text>
    <text class="react-cycle-name" x="306" y="142">Action</text>
    <text class="react-cycle-desc" x="280" y="166">A structured tool call, parsed</text>
    <text class="react-cycle-desc" x="280" y="182">from the completion.</text>
    <text class="react-cycle-edge" x="280" y="242">parsed</text>
  </g>
  <line class="react-cycle-line react-cycle-conn react-cycle-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#react-cycle-tip)"/>
  <g class="react-cycle-stage react-cycle-s2">
    <rect class="react-cycle-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="react-cycle-step" x="516" y="142">03</text>
    <text class="react-cycle-name" x="542" y="142">Observation</text>
    <text class="react-cycle-desc" x="516" y="166">The environment's return,</text>
    <text class="react-cycle-desc" x="516" y="182">injected back into the prompt.</text>
    <text class="react-cycle-edge" x="516" y="242">grounding</text>
  </g>
  <line class="react-cycle-line react-cycle-conn react-cycle-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#react-cycle-tip)"/>
  <g class="react-cycle-stage react-cycle-s3">
    <rect class="react-cycle-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="react-cycle-step" x="752" y="142">04</text>
    <text class="react-cycle-name" x="778" y="142">Repeat, or Final Answer</text>
    <text class="react-cycle-desc" x="752" y="166">Until the accumulated</text>
    <text class="react-cycle-desc" x="752" y="182">observations satisfy the</text>
    <text class="react-cycle-desc" x="752" y="198">objective.</text>
  </g>
  <text class="react-cycle-sub" x="30" y="304">The synergy runs both ways in the original result: reasoning helps the model pick the right tool, and observations stop the reasoning drifting away from what is actually true.</text>
</svg>
