<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to get a structured call.">
  <title>A text grammar, or native tool calling</title>
  <style>
    .react-or-native-bg   { fill: #f8fafc; }
    .react-or-native-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-or-native-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-or-native-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-or-native-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-or-native-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-or-native-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .react-or-native-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .react-or-native-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .react-or-native-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .react-or-native-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .react-or-native-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .react-or-native-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .react-or-native-row { opacity: 1; }
    .react-or-native-r0 { animation-delay: 0.00s; }
    .react-or-native-r1 { animation-delay: 0.45s; }
    .react-or-native-r2 { animation-delay: 0.90s; }
    .react-or-native-r3 { animation-delay: 1.35s; }
    .react-or-native-r4 { animation-delay: 1.80s; }
    .react-or-native-row { animation: react-or-native-reveal 7.3s ease-in-out infinite; }
    @keyframes react-or-native-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="react-or-native-bg" width="980" height="390"/>
  <text class="react-or-native-h1"  x="30" y="40">A text grammar, or native tool calling</text>
  <text class="react-or-native-sub" x="30" y="64">Two ways to get a structured call.</text>
  <rect class="react-or-native-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="react-or-native-name" x="46" y="122">Text-grammar ReAct</text>
  <text class="react-or-native-desc" x="46" y="142">Portable, and yours.</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r0" x="46" y="182">Works with any model that completes text</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r1" x="46" y="216">The reasoning trace is explicit and loggable</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r2" x="46" y="250">You own the parser</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r3" x="46" y="284">Fragile against unusual formatting</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r4" x="46" y="318">Zero dependency</text>
  <rect class="react-or-native-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="react-or-native-name" x="526" y="122">Native tool calling</text>
  <text class="react-or-native-desc" x="526" y="142">Lowest overhead.</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r0" x="526" y="182">The model was trained to emit the grammar</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r1" x="526" y="216">Structured output, validated by the provider</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r2" x="526" y="250">Much higher schema compliance</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r3" x="526" y="284">Provider-specific envelopes</text>
  <text class="react-or-native-desc react-or-native-row react-or-native-r4" x="526" y="318">Reasoning trace may be implicit</text>
  <text class="react-or-native-sub" x="30" y="372">Plan-and-Solve and Reflexion sit above either choice rather than competing with them: they change what the loop does between steps, not how a step is expressed.</text>
</svg>
