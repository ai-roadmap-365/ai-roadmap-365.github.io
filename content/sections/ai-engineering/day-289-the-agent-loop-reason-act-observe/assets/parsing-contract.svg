<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things a real parser handles.">
  <title>Parsing a completion into a call</title>
  <style>
    .parsing-contract-bg   { fill: #f8fafc; }
    .parsing-contract-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-contract-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-contract-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-contract-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-contract-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-contract-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parsing-contract-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parsing-contract-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parsing-contract-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parsing-contract-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parsing-contract-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parsing-contract-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .parsing-contract-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .parsing-contract-stage { opacity: 1; }

    .parsing-contract-s0 { animation-delay: 0.00s; }
    .parsing-contract-e0 { animation-delay: 0.00s; }
    .parsing-contract-s1 { animation-delay: 1.28s; }
    .parsing-contract-e1 { animation-delay: 1.28s; }
    .parsing-contract-s2 { animation-delay: 2.56s; }
    .parsing-contract-e2 { animation-delay: 2.56s; }
    .parsing-contract-s3 { animation-delay: 3.84s; }
    .parsing-contract-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .parsing-contract-conn  { animation: parsing-contract-trace 6.4s ease-in-out infinite; }
      .parsing-contract-stage { animation: parsing-contract-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes parsing-contract-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes parsing-contract-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .parsing-contract-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .parsing-contract-stage { animation: parsing-contract-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes parsing-contract-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="parsing-contract-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="parsing-contract-bg" width="980" height="322"/>
  <text class="parsing-contract-h1"  x="30" y="40">Parsing a completion into a call</text>
  <text class="parsing-contract-sub" x="30" y="64">Four things a real parser handles.</text>
  <g class="parsing-contract-stage parsing-contract-s0">
    <rect class="parsing-contract-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="parsing-contract-step" x="44" y="142">01</text>
    <text class="parsing-contract-name" x="70" y="142">A stated grammar</text>
    <text class="parsing-contract-desc" x="44" y="166">Thought, Action, Observation as</text>
    <text class="parsing-contract-desc" x="44" y="182">literal prefixes the model was</text>
    <text class="parsing-contract-desc" x="44" y="198">shown.</text>
  </g>
  <line class="parsing-contract-line parsing-contract-conn parsing-contract-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#parsing-contract-tip)"/>
  <g class="parsing-contract-stage parsing-contract-s1">
    <rect class="parsing-contract-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="parsing-contract-step" x="280" y="142">02</text>
    <text class="parsing-contract-name" x="306" y="142">Single-line and fenced forms</text>
    <text class="parsing-contract-desc" x="280" y="166">Models emit both. A parser that</text>
    <text class="parsing-contract-desc" x="280" y="182">handles one breaks on the other.</text>
  </g>
  <line class="parsing-contract-line parsing-contract-conn parsing-contract-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#parsing-contract-tip)"/>
  <g class="parsing-contract-stage parsing-contract-s2">
    <rect class="parsing-contract-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="parsing-contract-step" x="516" y="142">03</text>
    <text class="parsing-contract-name" x="542" y="142">Malformed JSON</text>
    <text class="parsing-contract-desc" x="516" y="166">A trailing comma is a</text>
    <text class="parsing-contract-desc" x="516" y="182">JSONDecodeError, not a crash —</text>
    <text class="parsing-contract-desc" x="516" y="198">it becomes an observation.</text>
  </g>
  <line class="parsing-contract-line parsing-contract-conn parsing-contract-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#parsing-contract-tip)"/>
  <g class="parsing-contract-stage parsing-contract-s3">
    <rect class="parsing-contract-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="parsing-contract-step" x="752" y="142">04</text>
    <text class="parsing-contract-name" x="778" y="142">Schema validation</text>
    <text class="parsing-contract-desc" x="752" y="166">Before execution. An invalid</text>
    <text class="parsing-contract-desc" x="752" y="182">argument is a message, not an</text>
    <text class="parsing-contract-desc" x="752" y="198">exception.</text>
  </g>
  <text class="parsing-contract-sub" x="30" y="304">Treating every parse failure as an observation rather than an error is what makes the loop self-healing: the model reads its own mistake in the next turn and corrects the formatting unprompted.</text>
</svg>
