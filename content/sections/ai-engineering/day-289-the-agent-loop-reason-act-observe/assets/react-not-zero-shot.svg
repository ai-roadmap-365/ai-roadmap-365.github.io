<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="All three are what people build first.">
  <title>Three things the loop is not</title>
  <style>
    .react-not-zero-shot-bg   { fill: #f8fafc; }
    .react-not-zero-shot-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-not-zero-shot-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-not-zero-shot-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-not-zero-shot-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-not-zero-shot-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-not-zero-shot-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .react-not-zero-shot-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .react-not-zero-shot-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .react-not-zero-shot-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .react-not-zero-shot-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .react-not-zero-shot-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .react-not-zero-shot-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .react-not-zero-shot-row { opacity: 1; }
    .react-not-zero-shot-r0 { animation-delay: 0.00s; }
    .react-not-zero-shot-r1 { animation-delay: 0.45s; }
    .react-not-zero-shot-r2 { animation-delay: 0.90s; }
    .react-not-zero-shot-r3 { animation-delay: 1.35s; }
    .react-not-zero-shot-r4 { animation-delay: 1.80s; }
    .react-not-zero-shot-row { animation: react-not-zero-shot-reveal 7.3s ease-in-out infinite; }
    @keyframes react-not-zero-shot-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="react-not-zero-shot-bg" width="980" height="390"/>
  <text class="react-not-zero-shot-h1"  x="30" y="40">Three things the loop is not</text>
  <text class="react-not-zero-shot-sub" x="30" y="64">All three are what people build first.</text>
  <rect class="react-not-zero-shot-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="react-not-zero-shot-name" x="46" y="122">The loop</text>
  <text class="react-not-zero-shot-desc" x="46" y="142">Stateful and bounded.</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r0" x="46" y="182">Multi-turn message management</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r1" x="46" y="216">A resilient parser for semi-structured output</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r2" x="46" y="250">Observations updating cognitive state</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r3" x="46" y="284">Step guards and budget constraints</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r4" x="46" y="318">Auditable: every step is logged</text>
  <rect class="react-not-zero-shot-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="react-not-zero-shot-name" x="526" y="122">Three near-misses</text>
  <text class="react-not-zero-shot-desc" x="526" y="142">Each missing something.</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r0" x="526" y="182">A zero-shot prompt with functions attached</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r1" x="526" y="216">A fixed pipeline ignoring intermediate results</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r2" x="526" y="250">Unbounded recursion with no guard</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r3" x="526" y="284">The first has no loop</text>
  <text class="react-not-zero-shot-desc react-not-zero-shot-row react-not-zero-shot-r4" x="526" y="318">The third has no end</text>
  <text class="react-not-zero-shot-sub" x="30" y="372">The third is the one that produces a memorable invoice: an agent with no step bound and a tool that always returns something will happily iterate until the API key is exhausted.</text>
</svg>
