<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it is overhead.">
  <title>Where the loop belongs</title>
  <style>
    .react-when-bg   { fill: #f8fafc; }
    .react-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .react-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .react-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .react-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .react-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .react-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .react-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .react-when-row { opacity: 1; }
    .react-when-r0 { animation-delay: 0.00s; }
    .react-when-r1 { animation-delay: 0.45s; }
    .react-when-r2 { animation-delay: 0.90s; }
    .react-when-r3 { animation-delay: 1.35s; }
    .react-when-r4 { animation-delay: 1.80s; }
    .react-when-row { animation: react-when-reveal 7.3s ease-in-out infinite; }
    @keyframes react-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="react-when-bg" width="980" height="390"/>
  <text class="react-when-h1"  x="30" y="40">Where the loop belongs</text>
  <text class="react-when-sub" x="30" y="64">And where it is overhead.</text>
  <rect class="react-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="react-when-name" x="46" y="122">Use the loop</text>
  <text class="react-when-desc" x="46" y="142">When results decide the next step.</text>
  <text class="react-when-desc react-when-row react-when-r0" x="46" y="182">Querying live data sources</text>
  <text class="react-when-desc react-when-row react-when-r1" x="46" y="216">Multi-digit arithmetic and exact manipulation</text>
  <text class="react-when-desc react-when-row react-when-r2" x="46" y="250">Validating that generated code compiles</text>
  <text class="react-when-desc react-when-row react-when-r3" x="46" y="284">Branching on live observations</text>
  <text class="react-when-desc react-when-row react-when-r4" x="46" y="318">Auditability: every step is logged</text>
  <rect class="react-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="react-when-name" x="526" y="122">Do not</text>
  <text class="react-when-desc" x="526" y="142">When the sequence is fixed.</text>
  <text class="react-when-desc react-when-row react-when-r0" x="526" y="182">"Translate this sentence" — zero-shot</text>
  <text class="react-when-desc react-when-row react-when-r1" x="526" y="216">A static, known sequence of steps</text>
  <text class="react-when-desc react-when-row react-when-r2" x="526" y="250">Use a DAG pipeline instead</text>
  <text class="react-when-desc react-when-row react-when-r3" x="526" y="284">Cheaper, faster, easier to test</text>
  <text class="react-when-desc react-when-row react-when-r4" x="526" y="318">And it cannot loop</text>
  <text class="react-when-sub" x="30" y="372">The auditability row is worth weighing on its own: the loop produces a complete record of what was thought, called and returned, which is the difference between explaining a failure and describing it.</text>
</svg>
