terms:
- term: Optimistic UI
  definition: Rendering user actions on screen immediately before server confirmation to eliminate perceived
    latency.
- term: Smart Auto-Scroll
  definition: Scrolling down when at the bottom while pausing auto-scroll if the user scrolls up.
- term: Streaming Markdown
  definition: Progressively parsing and rendering partial markdown tokens with unclosed tags.
- term: AbortController
  definition: Browser standard allowing clients to cancel active HTTP fetch streaming connections.
- term: Typing Indicator
  definition: Animated dots displayed before the first token arrives to signal active processing.
- term: Time to First Token (TTFT)
  definition: The perceptual delay between clicking submit and the first word appearing on screen.
- term: Error Boundary
  definition: A UI wrapper that catches rendering crashes and displays a friendly retry interface.
- term: Copy to Clipboard
  definition: A UX action copying code blocks or markdown text with visual confirmation feedback.
