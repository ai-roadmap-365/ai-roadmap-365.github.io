<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Windowing, drafts and keys.">
  <title>Three implementation rules</title>
  <style>
    .frontend-rules-bg   { fill: #f8fafc; }
    .frontend-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frontend-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frontend-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frontend-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frontend-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frontend-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .frontend-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .frontend-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .frontend-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .frontend-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .frontend-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .frontend-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .frontend-rules-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .frontend-rules-stage { opacity: 1; }

    .frontend-rules-s0 { animation-delay: 0.00s; }
    .frontend-rules-e0 { animation-delay: 0.00s; }
    .frontend-rules-s1 { animation-delay: 1.50s; }
    .frontend-rules-e1 { animation-delay: 1.50s; }
    .frontend-rules-s2 { animation-delay: 3.00s; }
    .frontend-rules-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .frontend-rules-conn  { animation: frontend-rules-trace 6s ease-in-out infinite; }
      .frontend-rules-stage { animation: frontend-rules-arrive 6s ease-in-out infinite; }
    }
    @keyframes frontend-rules-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes frontend-rules-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .frontend-rules-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .frontend-rules-stage { animation: frontend-rules-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes frontend-rules-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="frontend-rules-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="frontend-rules-bg" width="980" height="322"/>
  <text class="frontend-rules-h1"  x="30" y="40">Three implementation rules</text>
  <text class="frontend-rules-sub" x="30" y="64">Windowing, drafts and keys.</text>
  <g class="frontend-rules-stage frontend-rules-s0">
    <rect class="frontend-rules-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="frontend-rules-step" x="44" y="142">01</text>
    <text class="frontend-rules-name" x="70" y="142">Virtual windowing</text>
    <text class="frontend-rules-desc" x="44" y="166">Render the visible messages, not all thousand</text>
    <text class="frontend-rules-desc" x="44" y="182">DOM nodes.</text>
    <text class="frontend-rules-edge" x="44" y="242">memory</text>
  </g>
  <line class="frontend-rules-line frontend-rules-conn frontend-rules-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#frontend-rules-tip)"/>
  <g class="frontend-rules-stage frontend-rules-s1">
    <rect class="frontend-rules-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="frontend-rules-step" x="359" y="142">02</text>
    <text class="frontend-rules-name" x="385" y="142">Persist the draft</text>
    <text class="frontend-rules-desc" x="359" y="166">To session storage on every keystroke. A</text>
    <text class="frontend-rules-desc" x="359" y="182">reload should not lose a prompt.</text>
  </g>
  <line class="frontend-rules-line frontend-rules-conn frontend-rules-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#frontend-rules-tip)"/>
  <g class="frontend-rules-stage frontend-rules-s2">
    <rect class="frontend-rules-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="frontend-rules-step" x="674" y="142">03</text>
    <text class="frontend-rules-name" x="700" y="142">Keyboard controls</text>
    <text class="frontend-rules-desc" x="674" y="166">Submit, escape to abort, up-arrow to edit the</text>
    <text class="frontend-rules-desc" x="674" y="182">previous prompt.</text>
  </g>
  <text class="frontend-rules-sub" x="30" y="304">Draft persistence is the cheapest of the three and the one users notice most: losing a carefully written prompt to an accidental refresh is a small disaster with an obvious fix.</text>
</svg>
