<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="120 tokens a second, 60 frames.">
  <title>Rendering on every token, or on every frame</title>
  <style>
    .frame-throttling-bg   { fill: #f8fafc; }
    .frame-throttling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frame-throttling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frame-throttling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frame-throttling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frame-throttling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .frame-throttling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .frame-throttling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .frame-throttling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .frame-throttling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .frame-throttling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .frame-throttling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .frame-throttling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .frame-throttling-row { opacity: 1; }
    .frame-throttling-r0 { animation-delay: 0.00s; }
    .frame-throttling-r1 { animation-delay: 0.45s; }
    .frame-throttling-r2 { animation-delay: 0.90s; }
    .frame-throttling-r3 { animation-delay: 1.35s; }
    .frame-throttling-r4 { animation-delay: 1.80s; }
    .frame-throttling-row { animation: frame-throttling-reveal 7.3s ease-in-out infinite; }
    @keyframes frame-throttling-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="frame-throttling-bg" width="980" height="390"/>
  <text class="frame-throttling-h1"  x="30" y="40">Rendering on every token, or on every frame</text>
  <text class="frame-throttling-sub" x="30" y="64">120 tokens a second, 60 frames.</text>
  <rect class="frame-throttling-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="frame-throttling-name" x="46" y="122">Per token</text>
  <text class="frame-throttling-desc" x="46" y="142">120 re-renders a second.</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r0" x="46" y="182">A component update per character</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r1" x="46" y="216">High CPU on the main thread</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r2" x="46" y="250">Visible stutter</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r3" x="46" y="284">Worse with concurrent streams</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r4" x="46" y="318">And nothing is gained visually</text>
  <rect class="frame-throttling-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="frame-throttling-name" x="526" y="122">Frame-synchronised</text>
  <text class="frame-throttling-desc" x="526" y="142">60 or 120 updates a second.</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r0" x="526" y="182">Deltas buffered between frames</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r1" x="526" y="216">One DOM update per repaint</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r2" x="526" y="250">Synchronised to the display</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r3" x="526" y="284">Smooth at any token rate</text>
  <text class="frame-throttling-desc frame-throttling-row frame-throttling-r4" x="526" y="318">Identical appearance, far less work</text>
  <text class="frame-throttling-sub" x="30" y="372">Nothing is lost by batching because the display cannot show more than it refreshes: rendering at 120 tokens per second onto a 60Hz screen does twice the work for the same result.</text>
</svg>
