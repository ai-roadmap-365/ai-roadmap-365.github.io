<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A virtual delimiter stack.">
  <title>Parsing markdown that is not finished yet</title>
  <style>
    .markdown-streaming-bg   { fill: #f8fafc; }
    .markdown-streaming-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .markdown-streaming-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .markdown-streaming-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .markdown-streaming-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .markdown-streaming-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .markdown-streaming-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .markdown-streaming-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .markdown-streaming-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .markdown-streaming-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .markdown-streaming-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .markdown-streaming-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .markdown-streaming-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .markdown-streaming-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .markdown-streaming-stage { opacity: 1; }

    .markdown-streaming-s0 { animation-delay: 0.00s; }
    .markdown-streaming-e0 { animation-delay: 0.00s; }
    .markdown-streaming-s1 { animation-delay: 1.28s; }
    .markdown-streaming-e1 { animation-delay: 1.28s; }
    .markdown-streaming-s2 { animation-delay: 2.56s; }
    .markdown-streaming-e2 { animation-delay: 2.56s; }
    .markdown-streaming-s3 { animation-delay: 3.84s; }
    .markdown-streaming-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .markdown-streaming-conn  { animation: markdown-streaming-trace 6.4s ease-in-out infinite; }
      .markdown-streaming-stage { animation: markdown-streaming-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes markdown-streaming-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes markdown-streaming-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .markdown-streaming-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .markdown-streaming-stage { animation: markdown-streaming-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes markdown-streaming-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="markdown-streaming-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="markdown-streaming-bg" width="980" height="322"/>
  <text class="markdown-streaming-h1"  x="30" y="40">Parsing markdown that is not finished yet</text>
  <text class="markdown-streaming-sub" x="30" y="64">A virtual delimiter stack.</text>
  <g class="markdown-streaming-stage markdown-streaming-s0">
    <rect class="markdown-streaming-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="markdown-streaming-step" x="44" y="142">01</text>
    <text class="markdown-streaming-name" x="70" y="142">An opening delimiter arrives</text>
    <text class="markdown-streaming-desc" x="44" y="166">A code fence, a bold marker, a</text>
    <text class="markdown-streaming-desc" x="44" y="182">link bracket.</text>
  </g>
  <line class="markdown-streaming-line markdown-streaming-conn markdown-streaming-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#markdown-streaming-tip)"/>
  <g class="markdown-streaming-stage markdown-streaming-s1">
    <rect class="markdown-streaming-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="markdown-streaming-step" x="280" y="142">02</text>
    <text class="markdown-streaming-name" x="306" y="142">With no closing token yet</text>
    <text class="markdown-streaming-desc" x="280" y="166">A naive parser treats the rest</text>
    <text class="markdown-streaming-desc" x="280" y="182">of the page as inside it.</text>
  </g>
  <line class="markdown-streaming-line markdown-streaming-conn markdown-streaming-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#markdown-streaming-tip)"/>
  <g class="markdown-streaming-stage markdown-streaming-s2">
    <rect class="markdown-streaming-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="markdown-streaming-step" x="516" y="142">03</text>
    <text class="markdown-streaming-name" x="542" y="142">Inject a virtual closer</text>
    <text class="markdown-streaming-desc" x="516" y="166">Into the syntax tree, before</text>
    <text class="markdown-streaming-desc" x="516" y="182">rendering to the DOM.</text>
    <text class="markdown-streaming-edge" x="516" y="242">stack</text>
  </g>
  <line class="markdown-streaming-line markdown-streaming-conn markdown-streaming-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#markdown-streaming-tip)"/>
  <g class="markdown-streaming-stage markdown-streaming-s3">
    <rect class="markdown-streaming-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="markdown-streaming-step" x="752" y="142">04</text>
    <text class="markdown-streaming-name" x="778" y="142">Promote it when the real one arrives</text>
    <text class="markdown-streaming-desc" x="752" y="166">The virtual tag becomes an</text>
    <text class="markdown-streaming-desc" x="752" y="182">actual one.</text>
  </g>
  <text class="markdown-streaming-sub" x="30" y="304">Without this, opening a Python code block mid-stream reformats everything below it until the closing fence arrives, which is a visible and alarming layout flash on every code response.</text>
</svg>
