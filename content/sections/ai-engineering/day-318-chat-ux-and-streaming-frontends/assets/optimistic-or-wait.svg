<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fifteen seconds of nothing.">
  <title>Optimistic, or waiting</title>
  <style>
    .optimistic-or-wait-bg   { fill: #f8fafc; }
    .optimistic-or-wait-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimistic-or-wait-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimistic-or-wait-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimistic-or-wait-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimistic-or-wait-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimistic-or-wait-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .optimistic-or-wait-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .optimistic-or-wait-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .optimistic-or-wait-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .optimistic-or-wait-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .optimistic-or-wait-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .optimistic-or-wait-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .optimistic-or-wait-row { opacity: 1; }
    .optimistic-or-wait-r0 { animation-delay: 0.00s; }
    .optimistic-or-wait-r1 { animation-delay: 0.45s; }
    .optimistic-or-wait-r2 { animation-delay: 0.90s; }
    .optimistic-or-wait-r3 { animation-delay: 1.35s; }
    .optimistic-or-wait-r4 { animation-delay: 1.80s; }
    .optimistic-or-wait-row { animation: optimistic-or-wait-reveal 7.3s ease-in-out infinite; }
    @keyframes optimistic-or-wait-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="optimistic-or-wait-bg" width="980" height="390"/>
  <text class="optimistic-or-wait-h1"  x="30" y="40">Optimistic, or waiting</text>
  <text class="optimistic-or-wait-sub" x="30" y="64">Fifteen seconds of nothing.</text>
  <rect class="optimistic-or-wait-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="optimistic-or-wait-name" x="46" y="122">Blocking</text>
  <text class="optimistic-or-wait-desc" x="46" y="142">A spinner, then everything.</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r0" x="46" y="182">The input clears and nothing appears</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r1" x="46" y="216">A spinner for the full generation</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r2" x="46" y="250">Five paragraphs arrive at once</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r3" x="46" y="284">No way to stop it</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r4" x="46" y="318">No evidence anything is working</text>
  <rect class="optimistic-or-wait-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="optimistic-or-wait-name" x="526" y="122">Optimistic and streamed</text>
  <text class="optimistic-or-wait-desc" x="526" y="142">Immediate, then continuous.</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r0" x="526" y="182">The user's message renders instantly</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r1" x="526" y="216">Typing indicator within milliseconds</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r2" x="526" y="250">Words appear at reading speed</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r3" x="526" y="284">Stop is available throughout</text>
  <text class="optimistic-or-wait-desc optimistic-or-wait-row optimistic-or-wait-r4" x="526" y="318">The system feels responsive</text>
  <text class="optimistic-or-wait-sub" x="30" y="372">Both deliver the same text in roughly the same total time, and only one of them feels like a product — which is Day 358's perceived-wait argument, implemented in a browser.</text>
</svg>
