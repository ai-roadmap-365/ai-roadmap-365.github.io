<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it is irrelevant.">
  <title>Where streaming UX belongs</title>
  <style>
    .chat-ux-when-bg   { fill: #f8fafc; }
    .chat-ux-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chat-ux-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chat-ux-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chat-ux-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chat-ux-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chat-ux-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chat-ux-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chat-ux-when-row { opacity: 1; }
    .chat-ux-when-r0 { animation-delay: 0.00s; }
    .chat-ux-when-r1 { animation-delay: 0.45s; }
    .chat-ux-when-r2 { animation-delay: 0.90s; }
    .chat-ux-when-r3 { animation-delay: 1.35s; }
    .chat-ux-when-r4 { animation-delay: 1.80s; }
    .chat-ux-when-row { animation: chat-ux-when-reveal 7.3s ease-in-out infinite; }
    @keyframes chat-ux-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chat-ux-when-bg" width="980" height="390"/>
  <text class="chat-ux-when-h1"  x="30" y="40">Where streaming UX belongs</text>
  <text class="chat-ux-when-sub" x="30" y="64">And where it is irrelevant.</text>
  <rect class="chat-ux-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chat-ux-when-name" x="46" y="122">Build it</text>
  <text class="chat-ux-when-desc" x="46" y="142">Anything interactive.</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r0" x="46" y="182">Conversational products</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r1" x="46" y="216">Coding copilots</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r2" x="46" y="250">Customer support assistants</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r3" x="46" y="284">Anywhere a person waits for the answer</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r4" x="46" y="318">Anywhere they might want to stop it</text>
  <rect class="chat-ux-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chat-ux-when-name" x="526" y="122">Not needed</text>
  <text class="chat-ux-when-desc" x="526" y="142">Nobody is watching.</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r0" x="526" y="182">Background report generation</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r1" x="526" y="216">Batch data transformation</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r2" x="526" y="250">Scheduled pipelines</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r3" x="526" y="284">The result is a file, not a conversation</text>
  <text class="chat-ux-when-desc chat-ux-when-row chat-ux-when-r4" x="526" y="318">But still sanitise the output</text>
  <text class="chat-ux-when-sub" x="30" y="372">The sanitisation caveat carries even to batch output: generated text rendered later in any HTML context is the same execution surface, arriving by a different route.</text>
</svg>
