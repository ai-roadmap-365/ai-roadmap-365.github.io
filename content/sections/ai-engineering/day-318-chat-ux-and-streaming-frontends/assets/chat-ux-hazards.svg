<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One security, one performance.">
  <title>Two client-side hazards</title>
  <style>
    .chat-ux-hazards-bg   { fill: #f8fafc; }
    .chat-ux-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chat-ux-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chat-ux-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chat-ux-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chat-ux-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chat-ux-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chat-ux-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chat-ux-hazards-row { opacity: 1; }
    .chat-ux-hazards-r0 { animation-delay: 0.00s; }
    .chat-ux-hazards-r1 { animation-delay: 0.45s; }
    .chat-ux-hazards-r2 { animation-delay: 0.90s; }
    .chat-ux-hazards-r3 { animation-delay: 1.35s; }
    .chat-ux-hazards-r4 { animation-delay: 1.80s; }
    .chat-ux-hazards-row { animation: chat-ux-hazards-reveal 7.3s ease-in-out infinite; }
    @keyframes chat-ux-hazards-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chat-ux-hazards-bg" width="980" height="390"/>
  <text class="chat-ux-hazards-h1"  x="30" y="40">Two client-side hazards</text>
  <text class="chat-ux-hazards-sub" x="30" y="64">One security, one performance.</text>
  <rect class="chat-ux-hazards-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chat-ux-hazards-name" x="46" y="122">The hazards</text>
  <text class="chat-ux-hazards-desc" x="46" y="142">Both easy to miss.</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r0" x="46" y="182">Model output rendered as raw HTML</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r1" x="46" y="216">script tags and onerror attributes</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r2" x="46" y="250">A hundred messages as DOM nodes</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r3" x="46" y="284">Thousands of nodes, sluggish browser</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r4" x="46" y="318">Both appear only in real use</text>
  <rect class="chat-ux-hazards-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chat-ux-hazards-name" x="526" y="122">The controls</text>
  <text class="chat-ux-hazards-desc" x="526" y="142">Both standard.</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r0" x="526" y="182">Sanitise markdown before insertion</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r1" x="526" y="216">A dedicated sanitiser, not a regex</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r2" x="526" y="250">Virtualised list rendering</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r3" x="526" y="284">Only the visible bubbles exist</text>
  <text class="chat-ux-hazards-desc chat-ux-hazards-row chat-ux-hazards-r4" x="526" y="318">Both are library-level solutions</text>
  <text class="chat-ux-hazards-sub" x="30" y="372">The sanitiser point is Day 345's output-handling rule in a browser: the model is an untrusted source of very plausible text, and markdown rendering is an execution surface.</text>
</svg>
