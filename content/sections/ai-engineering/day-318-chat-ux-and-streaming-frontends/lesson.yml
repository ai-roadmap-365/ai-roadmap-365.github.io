objectives:
- Architect interactive chat interfaces supporting real-time Server-Sent Events (SSE) stream parsing.
- Implement Optimistic UI state updates to display user messages instantly with zero perceptual latency.
- Master smart auto-scrolling physics (stick-to-bottom on streaming, release on manual user scroll up).
- Build a production-grade Chat Stream Frontend Engine in Python that simulates frontend state transitions,
  optimistic messaging, chunk aggregation, and abort handling.
- Render complex markdown elements (code blocks, syntax highlighting, copy-to-clipboard buttons, tables)
  during active streaming.
