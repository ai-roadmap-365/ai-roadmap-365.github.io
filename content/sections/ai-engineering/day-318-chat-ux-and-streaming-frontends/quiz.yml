questions:
- question: What is 'Optimistic UI' in a chat application?
  options:
  - Only showing positive responses to users
  - Immediately inserting the user's message into the chat message list and rendering it on screen before
    the network request reaches the server, giving the illusion of instant responsiveness
  - Assuming the language model never makes mistakes
  - A CSS animation style
  answer_index: 1
  explanation: Optimistic UI renders user inputs immediately without waiting for server network round-trips.
- question: What is the recommended behavior for 'Smart Auto-Scroll' during active token streaming in
    a chat UI?
  options:
  - Forcibly lock the scroll position to the bottom of the page even if the user tries to scroll up to
    read earlier text
  - Auto-scroll down as new tokens arrive if the user is already at the bottom; if the user manually scrolls
    up to read earlier messages, pause auto-scrolling immediately to avoid scroll-jumping
  - Never scroll the window
  - Scroll randomly
  answer_index: 1
  explanation: Smart auto-scroll respects user intent when reading previous history during active streaming.
- question: Why is rendering Markdown during active token streaming challenging?
  options:
  - Because streaming tokens arrive as incomplete fragments (e.g. ````pyt`, `**bold te`), which can break
    standard Markdown parsers unless progressive incremental parsing is applied
  - Because browsers cannot display fonts
  - Because Python cannot render HTML
  - Because Markdown was invented before language models
  answer_index: 0
  explanation: Partial token chunks contain unclosed delimiters that require streaming markdown parsers.
- question: What UI element should always accompany generated code blocks in an AI assistant interface?
  options:
  - A 10-second timer
  - Syntax highlighting, language tag badge, and a one-click 'Copy to Clipboard' button with visual confirmation
    feedback
  - A paid advertisement
  - An unformatted plain text box
  answer_index: 1
  explanation: Code blocks require syntax highlighting and one-click copy utilities for optimal developer
    experience.
- question: What API standard allows client-side JavaScript to cancel an in-flight streaming fetch request
    when the user clicks 'Stop Generating'?
  options:
  - '`AbortController` and `signal`'
  - '`window.close()`'
  - '`document.reload()`'
  - '`localStorage.clear()`'
  answer_index: 0
  explanation: The standard `AbortController` API cancels in-flight HTTP streaming requests.
