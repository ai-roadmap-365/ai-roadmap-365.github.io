visuals:
- id: chat-ux-streaming-state-machine-flow
  file: assets/chat-ux-streaming-state-machine-flow.svg
  type: diagram
  title: Chat UX Streaming State Machine Flow
  alt: Chat UX Streaming State Machine Flow showing IDLE, OPTIMISTIC_USER_APPEND, STREAMING_TOKENS, SMART_AUTOSCROLL,
    and COMPLETED / ABORTED states
  description: State transition diagram of frontend chat UX state machine during streaming.
- id: smart-auto-scroll-physics-logic
  file: assets/smart-auto-scroll-physics-logic.svg
  type: diagram
  title: Smart Auto-Scroll Physics Logic
  alt: Smart Auto-Scroll Physics Logic comparing User at Bottom (Stick to bottom on new token) with User
    Scrolled Up (Auto-scroll locked, show jump-to-bottom button)
  description: Logic flowchart for intelligent viewport scrolling in streaming chat applications.
- id: chat-ux-parts
  file: assets/chat-ux-parts.svg
  type: diagram
  title: 'Four things a chat UI must do'
  alt: 'Diagram: the four responsibilities of a streaming chat frontend'
  description: 'A four-stage description of streaming chat frontend responsibilities covering optimistic rendering, chunk aggregation, scroll anchoring and abort control.'
- id: optimistic-or-wait
  file: assets/optimistic-or-wait.svg
  type: diagram
  title: 'Optimistic, or waiting'
  alt: 'Diagram: an optimistic streaming interface compared with a blocking one'
  description: 'A two-column comparison of optimistic streaming chat rendering against waiting for a complete response.'
- id: chat-ux-lineage
  file: assets/chat-ux-lineage.svg
  type: diagram
  title: 'Three eras of chat interfaces'
  alt: 'Diagram: the progression from messaging UX to multimodal AI canvases'
  description: 'A three-stage progression of chat interface design from human messaging apps through token streaming to multimodal generative canvases.'
- id: scroll-physics
  file: assets/scroll-physics.svg
  type: diagram
  title: 'Smart auto-scroll'
  alt: 'Diagram: the states of an intelligent auto-scrolling viewport'
  description: 'A four-stage description of scroll anchoring covering following the stream, detecting manual scroll, locking the viewport and offering to return.'
- id: stenographer
  file: assets/stenographer.svg
  type: diagram
  title: 'Live courtroom subtitles'
  alt: 'Diagram: live stenography as an analogy for streaming chat interfaces'
  description: 'A two-column comparison of live subtitling against transcribing and publishing afterwards.'
- id: markdown-streaming
  file: assets/markdown-streaming.svg
  type: diagram
  title: 'Parsing markdown that is not finished yet'
  alt: 'Diagram: how virtual closing delimiters keep streaming markdown renderable'
  description: 'A four-stage description of streaming markdown parsing covering unclosed delimiters, virtual closure, promotion on arrival and the failure it prevents.'
- id: frame-throttling
  file: assets/frame-throttling.svg
  type: diagram
  title: 'Rendering on every token, or on every frame'
  alt: 'Diagram: per-token rendering compared with frame-synchronised batching'
  description: 'A two-column comparison of re-rendering on every token against batching updates to the display refresh rate.'
- id: frontend-rules
  file: assets/frontend-rules.svg
  type: diagram
  title: 'Three implementation rules'
  alt: 'Diagram: the three implementation rules for a high-performance chat interface'
  description: 'A three-stage description of chat frontend rules covering virtual windowing, draft persistence and keyboard accessibility.'
- id: chat-ux-hazards
  file: assets/chat-ux-hazards.svg
  type: diagram
  title: 'Two client-side hazards'
  alt: 'Diagram: the sanitisation and memory hazards of a streaming chat client'
  description: 'A two-column comparison of the XSS and memory failure modes of a chat frontend against their controls.'
- id: multi-tab
  file: assets/multi-tab.svg
  type: diagram
  title: 'Synchronising across tabs'
  alt: 'Diagram: how chat state is synchronised between browser tabs'
  description: 'A three-stage description of cross-tab chat synchronisation covering the broadcast event, optimistic rendering in other tabs and the desynchronisation it prevents.'
- id: chat-ux-when
  file: assets/chat-ux-when.svg
  type: diagram
  title: 'Where streaming UX belongs'
  alt: 'Diagram: when to build a streaming chat interface'
  description: 'A two-column comparison of products requiring streaming chat UX against those where it adds nothing.'
