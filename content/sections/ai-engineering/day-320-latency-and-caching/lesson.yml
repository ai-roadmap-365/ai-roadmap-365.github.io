  acceleration.'
objectives:
- Deconstruct end-to-end latency in generative AI (Network RTT, Prefill/TTFT, Inter-Token Decode Latency).
- 'Implement Multi-Tier Caching: Tier 1 Exact Match (Redis SHA-256), Tier 2 Semantic Similarity Cache
  (Vector distance threshold), and Tier 3 Provider Prompt Caching.'
- Configure Anthropic and OpenAI Prompt Caching prefixes to achieve 90% input token cost reductions and
  50% TTFT latency improvements.
- Build a production-grade Semantic & Exact LLM Cache Engine in Python with cosine similarity thresholds
  and TTL eviction.
- 'Quantify cache hit trade-offs: cost reduction, latency savings, and semantic drift risks.'
