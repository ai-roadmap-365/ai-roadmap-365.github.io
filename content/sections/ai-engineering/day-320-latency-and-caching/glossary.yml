terms:
- term: Time to First Token (TTFT)
  definition: The latency from request dispatch until the first token is received by the client.
- term: Inter-Token Latency (ITL)
  definition: The average time in milliseconds between consecutive autoregressively generated tokens.
- term: Prefill Phase
  definition: The initial GPU compute phase processing all input prompt tokens in parallel.
- term: Decode Phase
  definition: The sequential autoregressive generation of output tokens one by one.
- term: Exact Hash Cache
  definition: Caching responses based on exact cryptographic hashes (SHA-256) of input prompts.
- term: Semantic Cache
  definition: Caching responses based on embedding vector cosine similarity above a strict threshold.
- term: KV Cache
  definition: In-memory Key-Value activation tensors cached on GPU VRAM to avoid recomputing attention
    over past tokens.
- term: Prompt Caching
  definition: Provider feature reusing KV caches for static prefix context across distinct user requests.
