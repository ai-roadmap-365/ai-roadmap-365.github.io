terms:
  - term: Time to First Token (TTFT)
    definition: The latency from request dispatch until the first token is received by the client.
  - term: Inter-Token Latency (ITL)
    definition: The average time in milliseconds between consecutive autoregressively generated tokens.
  - term: Prefill Phase
    definition: The initial GPU compute phase processing all input prompt tokens in parallel.
  - term: Decode Phase
    definition: The sequential autoregressive generation of output tokens one by one.
  - term: Exact Hash Cache
    definition: Caching responses based on exact cryptographic hashes (SHA-256) of input prompts.
  - term: Semantic Cache
    definition: Caching responses based on embedding vector cosine similarity above a strict threshold.
  - term: KV Cache
    definition: >-
      In-memory Key-Value activation tensors cached on GPU VRAM to avoid recomputing attention over
      past tokens.
  - term: Prompt Caching
    definition: Provider feature reusing KV caches for static prefix context across distinct user requests.
  - term: Speculative Decoding
    definition: >-
      Having a small draft model propose several tokens and the large model verify them in one
      forward pass. The output is mathematically identical to the large model alone.
  - term: Draft Model
    definition: >-
      The small, cheap model that proposes candidate tokens in speculative decoding. Its similarity
      to the target model decides how often its guesses are accepted.
  - term: Acceptance Rate
    definition: >-
      How often the target model agrees with the draft model proposal. It decides the speedup, and
      it is high on predictable spans and low on genuinely uncertain ones.
  - term: Memory-Bandwidth Bound
    definition: >-
      Limited by moving weights out of memory rather than by arithmetic. The decode phase is
      bandwidth bound, which is the asymmetry speculative decoding exploits.
