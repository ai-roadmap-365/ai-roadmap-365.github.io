<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Latency, money and headroom.">
  <title>Three things caching buys</title>
  <style>
    .cache-economics-bg   { fill: #f8fafc; }
    .cache-economics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-economics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-economics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-economics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-economics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-economics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-economics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cache-economics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cache-economics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cache-economics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cache-economics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cache-economics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cache-economics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cache-economics-stage { opacity: 1; }

    .cache-economics-s0 { animation-delay: 0.00s; }
    .cache-economics-e0 { animation-delay: 0.00s; }
    .cache-economics-s1 { animation-delay: 1.50s; }
    .cache-economics-e1 { animation-delay: 1.50s; }
    .cache-economics-s2 { animation-delay: 3.00s; }
    .cache-economics-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .cache-economics-conn  { animation: cache-economics-trace 6s ease-in-out infinite; }
      .cache-economics-stage { animation: cache-economics-arrive 6s ease-in-out infinite; }
    }
    @keyframes cache-economics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cache-economics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cache-economics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cache-economics-stage { animation: cache-economics-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cache-economics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cache-economics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cache-economics-bg" width="980" height="322"/>
  <text class="cache-economics-h1"  x="30" y="40">Three things caching buys</text>
  <text class="cache-economics-sub" x="30" y="64">Latency, money and headroom.</text>
  <g class="cache-economics-stage cache-economics-s0">
    <rect class="cache-economics-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="cache-economics-step" x="44" y="142">01</text>
    <text class="cache-economics-name" x="70" y="142">Time to first token</text>
    <text class="cache-economics-desc" x="44" y="166">1,500 ms to under 15 ms on a hit. The</text>
    <text class="cache-economics-desc" x="44" y="182">application feels instant.</text>
    <text class="cache-economics-edge" x="44" y="242">100x</text>
  </g>
  <line class="cache-economics-line cache-economics-conn cache-economics-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#cache-economics-tip)"/>
  <g class="cache-economics-stage cache-economics-s1">
    <rect class="cache-economics-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="cache-economics-step" x="359" y="142">02</text>
    <text class="cache-economics-name" x="385" y="142">Cost</text>
    <text class="cache-economics-desc" x="359" y="166">30-50% of support queries are paraphrases of</text>
    <text class="cache-economics-desc" x="359" y="182">frequent ones.</text>
    <text class="cache-economics-edge" x="359" y="242">money</text>
  </g>
  <line class="cache-economics-line cache-economics-conn cache-economics-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#cache-economics-tip)"/>
  <g class="cache-economics-stage cache-economics-s2">
    <rect class="cache-economics-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="cache-economics-step" x="674" y="142">03</text>
    <text class="cache-economics-name" x="700" y="142">Rate limit headroom</text>
    <text class="cache-economics-desc" x="674" y="166">A cached response makes no provider call at</text>
    <text class="cache-economics-desc" x="674" y="182">all.</text>
    <text class="cache-economics-edge" x="674" y="242">no RPM</text>
  </g>
  <text class="cache-economics-sub" x="30" y="304">The third benefit is the one that matters during a traffic spike: cache hits do not consume provider quota, so the cache is also the thing that keeps you serving when demand exceeds your tier.</text>
</svg>
