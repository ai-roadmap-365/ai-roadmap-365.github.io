<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Deterministic, then broken, then semantic.">
  <title>Three generations of caching</title>
  <style>
    .caching-lineage-bg   { fill: #f8fafc; }
    .caching-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .caching-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .caching-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .caching-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .caching-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .caching-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .caching-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .caching-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .caching-lineage-stage { opacity: 1; }

    .caching-lineage-s0 { animation-delay: 0.00s; }
    .caching-lineage-e0 { animation-delay: 0.00s; }
    .caching-lineage-s1 { animation-delay: 1.50s; }
    .caching-lineage-e1 { animation-delay: 1.50s; }
    .caching-lineage-s2 { animation-delay: 3.00s; }
    .caching-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .caching-lineage-conn  { animation: caching-lineage-trace 6s ease-in-out infinite; }
      .caching-lineage-stage { animation: caching-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes caching-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes caching-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .caching-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .caching-lineage-stage { animation: caching-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes caching-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="caching-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="caching-lineage-bg" width="980" height="322"/>
  <text class="caching-lineage-h1"  x="30" y="40">Three generations of caching</text>
  <text class="caching-lineage-sub" x="30" y="64">Deterministic, then broken, then semantic.</text>
  <g class="caching-lineage-stage caching-lineage-s0">
    <rect class="caching-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="caching-lineage-step" x="44" y="142">01</text>
    <text class="caching-lineage-name" x="70" y="142">HTTP caching, 2000-2020</text>
    <text class="caching-lineage-desc" x="44" y="166">Identical URLs, deterministic responses, a</text>
    <text class="caching-lineage-desc" x="44" y="182">max-age header.</text>
  </g>
  <line class="caching-lineage-line caching-lineage-conn caching-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#caching-lineage-tip)"/>
  <g class="caching-lineage-stage caching-lineage-s1">
    <rect class="caching-lineage-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="caching-lineage-step" x="359" y="142">02</text>
    <text class="caching-lineage-name" x="385" y="142">The gap, 2022-2023</text>
    <text class="caching-lineage-desc" x="359" y="166">Dynamic prompts and stochastic output. URL</text>
    <text class="caching-lineage-desc" x="359" y="182">caching failed completely.</text>
  </g>
  <line class="caching-lineage-line caching-lineage-conn caching-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#caching-lineage-tip)"/>
  <g class="caching-lineage-stage caching-lineage-s2">
    <rect class="caching-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="caching-lineage-step" x="674" y="142">03</text>
    <text class="caching-lineage-name" x="700" y="142">Multi-tier, 2024</text>
    <text class="caching-lineage-desc" x="674" y="166">Exact hashes, embedding similarity, and</text>
    <text class="caching-lineage-desc" x="674" y="182">provider KV reuse.</text>
  </g>
  <text class="caching-lineage-sub" x="30" y="304">The middle period is worth remembering as an economic fact: for roughly two years every query, however repetitive, paid full inference cost, because no cache layer applied.</text>
</svg>
