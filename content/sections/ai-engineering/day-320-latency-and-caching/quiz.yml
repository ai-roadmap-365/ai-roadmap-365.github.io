questions:
- question: What are the three distinct phases of latency in an LLM request lifecycle?
  options:
  - Compilation, Assembly, Execution
  - Reading, Writing, Deleting
  - 'Network, prefill, and decode'
  - HTML, CSS, JavaScript
  answer_index: 2
  explanation: LLM latency breaks down into network transit, prompt prefill (TTFT), and autoregressive
    decode generation.
- question: What is the key difference between an 'Exact Hash Cache' and a 'Semantic Cache'?
  options:
  - They are identical
  - Exact cache is only for images
  - 'Semantic cache works without a computer at all'
  - 'Hash matches bytes; semantic matches meaning'
  answer_index: 3
  explanation: Exact cache requires identical string matches; semantic cache matches semantically equivalent
    phrasing via vector similarity.
- question: How does 'Provider Prompt Caching' (e.g. Anthropic Prompt Caching or OpenAI Cached Tokens)
    reduce latency and cost?
  options:
  - 'It keeps the prefix KV cache on the provider''s GPUs'
  - By deleting the prompt
  - By speeding up user internet speed
  - By compressing text into ZIP files
  answer_index: 0
  explanation: Provider prompt caching reuses KV activations across requests, dramatically cutting TTFT
    and input costs.
- question: What is the primary risk of setting a semantic cache similarity threshold too low (e.g. threshold
    = 0.70)?
  options:
  - The database will run out of disk space
  - 'False hits: near-miss queries get the wrong answer'
  - The server will overheat
  - Tokens become unreadable
  answer_index: 1
  explanation: Low similarity thresholds risk returning incorrect responses to distinct queries.
- question: Where should static system instructions and few-shot examples be placed to maximize prompt
    caching hit rates?
  options:
  - At the very end of the prompt
  - Scattered randomly throughout the text
  - 'At the start, with dynamic parts last'
  - In a separate audio recording
  answer_index: 2
  explanation: KV caches match from the beginning (prefix) of the prompt; static prefixes maximize cache
    hits.
