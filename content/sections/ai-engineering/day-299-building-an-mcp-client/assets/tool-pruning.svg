<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Or the five that matter.">
  <title>Fifty schemas on every call</title>
  <style>
    .tool-pruning-bg   { fill: #f8fafc; }
    .tool-pruning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-pruning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-pruning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-pruning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-pruning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-pruning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-pruning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-pruning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-pruning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-pruning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-pruning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-pruning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-pruning-row { opacity: 1; }
    .tool-pruning-r0 { animation-delay: 0.00s; }
    .tool-pruning-r1 { animation-delay: 0.45s; }
    .tool-pruning-r2 { animation-delay: 0.90s; }
    .tool-pruning-r3 { animation-delay: 1.35s; }
    .tool-pruning-r4 { animation-delay: 1.80s; }
    .tool-pruning-row { animation: tool-pruning-reveal 7.3s ease-in-out infinite; }
    @keyframes tool-pruning-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tool-pruning-bg" width="980" height="390"/>
  <text class="tool-pruning-h1"  x="30" y="40">Fifty schemas on every call</text>
  <text class="tool-pruning-sub" x="30" y="64">Or the five that matter.</text>
  <rect class="tool-pruning-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tool-pruning-name" x="46" y="122">All fifty</text>
  <text class="tool-pruning-desc" x="46" y="142">Every turn.</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r0" x="46" y="182">Thousands of prompt tokens per call</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r1" x="46" y="216">Paid again on every step of the loop</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r2" x="46" y="250">Overlapping descriptions compete</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r3" x="46" y="284">Selection accuracy degrades — tool distraction</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r4" x="46" y="318">And it worsens as the catalogue grows</text>
  <rect class="tool-pruning-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tool-pruning-name" x="526" y="122">Pruned</text>
  <text class="tool-pruning-desc" x="526" y="142">Retrieved per turn.</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r0" x="526" y="182">Tool names and descriptions embedded once</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r1" x="526" y="216">The turn's context retrieves the relevant few</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r2" x="526" y="250">Up to 70% fewer input tokens</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r3" x="526" y="284">Selection accuracy improves</text>
  <text class="tool-pruning-desc tool-pruning-row tool-pruning-r4" x="526" y="318">Scales past fifty tools</text>
  <text class="tool-pruning-sub" x="30" y="372">This is a retrieval problem hiding inside an agent: the tool catalogue is a corpus, the current context is a query, and the same techniques that work for documents work here.</text>
</svg>
