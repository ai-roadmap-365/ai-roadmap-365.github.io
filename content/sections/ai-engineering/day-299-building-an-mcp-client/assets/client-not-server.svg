<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And it is not the model either.">
  <title>A client is not a server</title>
  <style>
    .client-not-server-bg   { fill: #f8fafc; }
    .client-not-server-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-not-server-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-not-server-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-not-server-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-not-server-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-not-server-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .client-not-server-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .client-not-server-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .client-not-server-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .client-not-server-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .client-not-server-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .client-not-server-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .client-not-server-row { opacity: 1; }
    .client-not-server-r0 { animation-delay: 0.00s; }
    .client-not-server-r1 { animation-delay: 0.45s; }
    .client-not-server-r2 { animation-delay: 0.90s; }
    .client-not-server-r3 { animation-delay: 1.35s; }
    .client-not-server-r4 { animation-delay: 1.80s; }
    .client-not-server-row { animation: client-not-server-reveal 7.3s ease-in-out infinite; }
    @keyframes client-not-server-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="client-not-server-bg" width="980" height="390"/>
  <text class="client-not-server-h1"  x="30" y="40">A client is not a server</text>
  <text class="client-not-server-sub" x="30" y="64">And it is not the model either.</text>
  <rect class="client-not-server-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="client-not-server-name" x="46" y="122">The client</text>
  <text class="client-not-server-desc" x="46" y="142">Consumes and orchestrates.</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r0" x="46" y="182">Spawns and manages server processes</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r1" x="46" y="216">Merges tool catalogues</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r2" x="46" y="250">Routes calls and collects results</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r3" x="46" y="284">Enforces approval and logging</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r4" x="46" y="318">Talks to a model, and is not one</text>
  <rect class="client-not-server-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="client-not-server-name" x="526" y="122">Not the client</text>
  <text class="client-not-server-desc" x="526" y="142">Two other roles.</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r0" x="526" y="182">A server provides tools</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r1" x="526" y="216">A model does the reasoning</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r2" x="526" y="250">The client sits between them</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r3" x="526" y="284">Which is why it is the security layer</text>
  <text class="client-not-server-desc client-not-server-row client-not-server-r4" x="526" y="318">Everything passes through it</text>
  <text class="client-not-server-sub" x="30" y="372">Being the point everything passes through is what makes the client the right place for controls: it is the only component that sees both the model's intent and the server's response.</text>
</svg>
