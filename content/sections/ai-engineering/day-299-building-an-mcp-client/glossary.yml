terms:
- term: MCP Host Client
  definition: The controlling application that connects to MCP servers, manages tool discovery, and interfaces
    with the LLM.
- term: Multi-Server Pool
  definition: An array of active MCP server connections managed concurrently by a single host client.
- term: Tool Routing Table
  definition: An in-memory dictionary mapping tool names to their corresponding server connection instances.
- term: Schema Ingestion
  definition: Fetching `tools/list` from connected servers and translating definitions into model-compatible
    tool parameters.
- term: Subprocess Lifecycle
  definition: The automated management of spawning, monitoring, communicating with, and killing server
    subprocesses.
- term: Dynamic Tool Dispatch
  definition: Parsing an LLM tool call decision and dispatching the JSON-RPC request to the responsible
    server.
- term: Broken Pipe Recovery
  definition: Handling unexpected server termination cleanly without crashing the primary agent loop.
- term: Unified Scratchpad
  definition: The cumulative conversation history recording tool calls across multiple distinct MCP backends.
