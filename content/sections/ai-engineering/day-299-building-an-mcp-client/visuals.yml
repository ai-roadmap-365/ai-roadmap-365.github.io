visuals:
- id: mcp-client-multi-server-orchestration-architecture
  file: assets/mcp-client-multi-server-orchestration-architecture.svg
  type: diagram
  title: MCP Client Multi Server Orchestration Architecture
  alt: MCP Client Multi Server Orchestration Architecture diagram showing LLM Core, Unified Tool Registry,
    and multi-server stdio connections to Database, Git, and Web servers
  description: System architecture diagram illustrating how an MCP client aggregates multiple server backends.
- id: mcp-client-react-agent-loop-flow
  file: assets/mcp-client-react-agent-loop-flow.svg
  type: diagram
  title: MCP Client ReAct Agent Loop Flow
  alt: MCP Client ReAct Agent Loop Flow showing model reasoning turn, tool selection, MCP JSON-RPC dispatch,
    and observation integration
  description: Flowchart showing the integration of MCP tool execution into an autonomous ReAct loop.
- id: client-responsibilities
  file: assets/client-responsibilities.svg
  type: diagram
  title: 'What a client owns'
  alt: 'Diagram: the four responsibilities of an MCP host client'
  description: 'A four-stage description of MCP client responsibilities covering process management, schema aggregation, routing and observation handling.'
- id: client-not-server
  file: assets/client-not-server.svg
  type: diagram
  title: 'A client is not a server'
  alt: 'Diagram: an MCP client compared with an MCP server and a foundation model'
  description: 'A two-column comparison of the MCP client''s role against the roles of servers and models.'
- id: client-lineage
  file: assets/client-lineage.svg
  type: diagram
  title: 'Three eras of tool clients'
  alt: 'Diagram: the progression from hardcoded tool classes to multi-server MCP clients'
  description: 'A three-stage progression of agent tool clients from imported Python classes through provider function calling to multi-server protocol clients.'
- id: client-benefits
  file: assets/client-benefits.svg
  type: diagram
  title: 'Four things a custom client buys'
  alt: 'Diagram: the four architectural benefits of building a custom MCP client'
  description: 'A four-stage description of custom MCP client benefits covering decoupling, cross-language tools, audit control and runtime capability expansion.'
- id: async-pool
  file: assets/async-pool.svg
  type: diagram
  title: 'Managing several servers at once'
  alt: 'Diagram: the requirements of an asynchronous multi-server connection pool'
  description: 'A four-stage description of multi-server client requirements covering asynchronous pipes, crash detection, respawning and file descriptor limits.'
- id: tool-pruning
  file: assets/tool-pruning.svg
  type: diagram
  title: 'Fifty schemas on every call'
  alt: 'Diagram: sending every tool schema compared with semantically pruning them'
  description: 'A two-column comparison of sending a full tool catalogue on every model call against retrieving only relevant tools.'
- id: contractor
  file: assets/contractor.svg
  type: diagram
  title: 'A general contractor'
  alt: 'Diagram: a general contractor coordinating subcontractors as an analogy for an MCP client'
  description: 'A two-column comparison of a general contractor''s coordination role against direct client-to-specialist dealing.'
- id: schema-translation
  file: assets/schema-translation.svg
  type: diagram
  title: 'Translating schemas per provider'
  alt: 'Diagram: how a schema translation layer decouples an agent from provider SDKs'
  description: 'A three-stage description of schema translation covering provider differences, a universal transformer and the resulting portability.'
- id: client-hazards
  file: assets/client-hazards.svg
  type: diagram
  title: 'Three operational hazards'
  alt: 'Diagram: the file descriptor, naming and cancellation hazards of an MCP client'
  description: 'A three-stage description of MCP client hazards covering pipe exhaustion, tool name collisions and cancellation propagation.'
- id: build-client-when
  file: assets/build-client-when.svg
  type: diagram
  title: 'When to build a client'
  alt: 'Diagram: when building a custom MCP client is warranted'
  description: 'A two-column comparison of situations requiring a custom MCP client against those where an existing host application suffices.'
