questions:
- question: What is the primary role of an MCP Host Client in an autonomous agent system?
  options:
  - To train transformer model weights
  - To manage the lifecycle of connected MCP servers, discover their tool/resource catalogs, format schemas
    for the LLM, and route model-generated tool calls to the appropriate server
  - To compile C++ header files
  - To format Markdown tables in the browser
  answer_index: 1
  explanation: The client acts as the central orchestrator bridging the language model's reasoning loop
    with external MCP server subprocesses.
- question: How does an MCP client determine which server should handle a specific tool call when connected
    to multiple servers?
  options:
  - It broadcasts the tool call to all servers simultaneously
  - It maintains an in-memory routing table mapping each unique tool name to its originating server instance
  - It asks the user to pick a server every time
  - It hashes the tool name to a random port
  answer_index: 1
  explanation: The client builds a unified tool registry during initialization, mapping tool names to
    server connections for direct routing.
- question: What should an MCP client do if a child server process terminates abruptly during a tool call?
  options:
  - Crash the entire host application without error logs
  - Catch the broken pipe / EOF error, format a structured error observation for the model, and attempt
    to respawn the server
  - Delete the client configuration
  - Ignore the error and pretend the tool succeeded
  answer_index: 1
  explanation: Resilient clients catch process failures and feed structured error observations back into
    the agent scratchpad.
- question: How are MCP tools exposed to modern LLM APIs (such as OpenAI or Anthropic SDKs)?
  options:
  - By converting MCP `tools/list` JSON schemas into the provider's `tools` parameter format
  - By embedding Python bytecode into the prompt
  - By converting all tools into bash scripts
  - By creating binary DLL plugins
  answer_index: 0
  explanation: MCP tool schemas map 1:1 into standard JSON Schema function declarations accepted by foundation
    model APIs.
- question: What is the recommended cleanup procedure when an MCP client shuts down?
  options:
  - Leave all subprocesses running indefinitely
  - Send termination signals (SIGTERM/SIGKILL) to all spawned server subprocesses and close open stdio
    pipes
  - Delete the operating system temp directory
  - Reboot the machine
  answer_index: 1
  explanation: Proper lifecycle management requires terminating child subprocesses to prevent orphan processes
    from consuming system resources.
