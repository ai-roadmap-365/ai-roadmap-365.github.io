learning_promise: 'Build an autonomous AI agent that acts as an MCP Host Client: dynamically discover
  tools from multiple MCP servers over stdio, convert schemas into LLM function calls, and dispatch actions
  in a ReAct loop.'
objectives:
- Architect an autonomous MCP Client runtime managing multi-server subprocess pools.
- Implement dynamic schema ingestion converting MCP `tools/list` into model function definitions.
- Integrate MCP tool execution directly into an autonomous ReAct agent loop.
- Handle multi-server connection timeouts, broken pipes, and graceful error propagation.
- Benchmark single-client vs multi-server throughput and latency.
