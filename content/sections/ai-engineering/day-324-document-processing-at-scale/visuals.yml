visuals:
  - id: document-processing-dispatch-and-quality-gate
    file: assets/document-processing-dispatch-and-quality-gate.svg
    type: diagram
    title: Document Processing Dispatch and Quality Gate
    alt: 'Document Processing Dispatch and Quality Gate showing format detection routing to per-format
      extractors, a quality scoring stage, and three outcomes: accepted, flagged for review, and
      dead-lettered'
    description: Flow diagram from byte-level detection through per-format dispatch and a budgeted
      extraction stage to a scoring gate with three outcomes.
  - id: extraction-quality-signals
    file: assets/extraction-quality-signals.svg
    type: diagram
    title: Extraction Quality Signals
    alt: Extraction Quality Signals showing four cheap heuristics — text yield per page, alphabetic
      character ratio, mean word length, and whitespace ratio — and the failure each one catches
    description: Four cards describing each quality signal, the failure it detects, and the failure that
      none of them can see.
  - id: three-processing-ideas
    file: assets/three-processing-ideas.svg
    type: diagram
    title: 'Three ideas'
    alt: 'Diagram: the three principles of document processing at scale'
    description: 'A three-stage description of document processing principles covering format detection, quality scoring and per-document budgets.'
  - id: quiet-failure
    file: assets/quiet-failure.svg
    type: diagram
    title: 'Extraction fails quietly'
    alt: 'Diagram: a loud extraction failure compared with a quiet one'
    description: 'A two-column comparison of an extraction failure that raises an error against one that returns plausible-looking but wrong text.'
  - id: pdf-history
    file: assets/pdf-history.svg
    type: diagram
    title: 'Four developments in document handling'
    alt: 'Diagram: the progression from OCR to document intelligence pipelines'
    description: 'A four-stage progression of document processing from OCR through the PDF structure problem and layout-aware models to document intelligence.'
  - id: processing-pipeline
    file: assets/processing-pipeline.svg
    type: diagram
    title: 'Detect, dispatch, budget, score, gate'
    alt: 'Diagram: the five steps of a document processing pipeline'
    description: 'A five-stage description of document processing covering format detection, extractor dispatch, resource budgets, quality scoring and the three-outcome gate.'
  - id: quality-signals
    file: assets/quality-signals.svg
    type: diagram
    title: 'Four cheap signals'
    alt: 'Diagram: the four heuristic signals used to score an extraction'
    description: 'A four-stage description of extraction quality signals covering text yield, alphabetic ratio, mean word length and whitespace ratio.'
  - id: sorting-office
    file: assets/sorting-office.svg
    type: diagram
    title: 'A postal sorting office'
    alt: 'Diagram: an indiscriminate sorting process compared with one that classifies first'
    description: 'A two-column comparison of handling all mail identically against sorting by class and checking plausibility.'
  - id: processing-cases
    file: assets/processing-cases.svg
    type: diagram
    title: 'Four documents, four routes'
    alt: 'Diagram: four document types and how the pipeline handles each'
    description: 'A four-stage walkthrough of processing a born-digital PDF, a scan, a two-column paper and a pathological file.'
  - id: processing-implications
    file: assets/processing-implications.svg
    type: diagram
    title: 'Five consequences of parsing files'
    alt: 'Diagram: the security, privacy, performance, scalability and cost implications of document processing'
    description: 'A five-stage description of document processing implications covering parser security, redaction, cost variance, parallelism and OCR escalation.'
  - id: heuristic-or-model
    file: assets/heuristic-or-model.svg
    type: diagram
    title: 'Heuristics or a model'
    alt: 'Diagram: heuristic quality scoring compared with model-based quality assessment'
    description: 'A two-column comparison of cheap statistical quality scoring against model-based extraction quality judgement.'
  - id: processing-when
    file: assets/processing-when.svg
    type: diagram
    title: 'When to invest in processing'
    alt: 'Diagram: when serious document processing is warranted'
    description: 'A two-column comparison of corpora requiring full document processing against uniform ones.'
  - id: detect-not-extension
    file: assets/detect-not-extension.svg
    type: diagram
    title: 'Detecting the real format'
    alt: 'Diagram: format detection from magic bytes rather than file extension'
    description: 'A four-stage description of format detection covering magic numbers, common misidentifications, ambiguous containers and further probing.'
  - id: processing-not-chunking
    file: assets/processing-not-chunking.svg
    type: diagram
    title: 'Processing is not chunking'
    alt: 'Diagram: document processing compared with chunking'
    description: 'A two-column comparison of document processing against chunking, and the recoverability of errors in each.'
  - id: extraction-failures
    file: assets/extraction-failures.svg
    type: diagram
    title: 'Five ways extraction fails'
    alt: 'Diagram: the five silent failure modes of document extraction'
    description: 'A five-stage description of extraction failures covering reading order, empty extraction, table flattening, pathological documents and encoding.'
  - id: extraction-tooling
    file: assets/extraction-tooling.svg
    type: diagram
    title: 'Choosing an extractor'
    alt: 'Diagram: extraction library options compared by capability and constraint'
    description: 'A two-column comparison of lightweight extraction libraries against fuller pipelines and commercial services.'
