questions:
  - question: Why is dispatching on a file's extension unreliable, and what should be used instead?
    options:
      - Extensions are reliable; the problem is only that some are uppercase
      - The extension is metadata a human chose and can be wrong or meaningless — a .pdf may be a scan
        with no text layer — so detection should read the leading bytes for a format signature
      - Extensions should be replaced by the file's size in bytes
      - Detection should ask the user to confirm each format
    answer_index: 1
    explanation: The name is a claim, the bytes are evidence. Magic-number detection is what
      distinguishes a born-digital PDF from a scan that happens to share the extension.
  - question: A 900-byte PDF extracts to 20 characters. Which quality signal catches this, and what is
      the likely cause?
    options:
      - Alphabetic ratio; the document is mojibake
      - Text yield; the document is almost certainly a scan with no text layer, so a direct extractor
        recovers only stray artefacts
      - Mean word length; the words are too long
      - None of them; the extraction succeeded because it returned a string
    answer_index: 1
    explanation: Yield is characters per source byte. Those 20 characters may all be letters, so the
      alphabetic ratio looks healthy — only the ratio of output to input reveals the failure.
  - question: Why must a per-document time budget be enforced by the harness rather than by the parser?
    options:
      - Parsers are always well behaved, so the budget is only documentation
      - A parser stuck in a tight loop cannot check a deadline, so the caller must be able to give up
        without its cooperation — and since a thread cannot be killed, that means a process it can
        terminate
      - The harness runs faster than the parser
      - Budgets must be enforced by the operating system's scheduler
    answer_index: 1
    explanation: Cooperative timeouts assume the code cooperates. This lab's first version used a thread
      pool and the 30-second sleep blocked the run anyway, because the pool's shutdown waits.
  - question: What failure does the "flagged" outcome prevent that a binary accept-or-reject cannot?
    options:
      - It prevents the pipeline from running out of memory
      - Rejecting everything that scores poorly discards documents whose partial text is still useful,
        while accepting everything silently admits garbage; flagged indexes the text and records that it
        needs review
      - It prevents duplicate documents from entering the index
      - It makes extraction faster by skipping the scoring stage
    answer_index: 1
    explanation: The third outcome separates "this is unusable" from "this is imperfect but better than
      nothing", and keeps a record so the document can be re-routed to a costlier extractor.
  - question: Which realistic extraction failure will the cheap quality signals NOT catch?
    options:
      - A scanned document with no text layer
      - A file decoded with the wrong character encoding
      - A two-column paper read straight across, splicing the left column into the right, because the
        result is still fluent-looking language on every statistical signal
      - A document that causes the parser to hang
    answer_index: 2
    explanation: The spliced text IS language, so yield, alphabetic ratio and word length all look
      normal. Knowing what your gate cannot see is part of using it responsibly.
