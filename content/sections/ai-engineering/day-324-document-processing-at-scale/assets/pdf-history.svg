<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And one architectural fact.">
  <title>Four developments in document handling</title>
  <style>
    .pdf-history-bg   { fill: #f8fafc; }
    .pdf-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdf-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdf-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdf-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdf-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdf-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pdf-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pdf-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pdf-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pdf-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pdf-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pdf-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pdf-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pdf-history-stage { opacity: 1; }

    .pdf-history-s0 { animation-delay: 0.00s; }
    .pdf-history-e0 { animation-delay: 0.00s; }
    .pdf-history-s1 { animation-delay: 1.28s; }
    .pdf-history-e1 { animation-delay: 1.28s; }
    .pdf-history-s2 { animation-delay: 2.56s; }
    .pdf-history-e2 { animation-delay: 2.56s; }
    .pdf-history-s3 { animation-delay: 3.84s; }
    .pdf-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pdf-history-conn  { animation: pdf-history-trace 6.4s ease-in-out infinite; }
      .pdf-history-stage { animation: pdf-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pdf-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pdf-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pdf-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pdf-history-stage { animation: pdf-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pdf-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pdf-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pdf-history-bg" width="980" height="322"/>
  <text class="pdf-history-h1"  x="30" y="40">Four developments in document handling</text>
  <text class="pdf-history-sub" x="30" y="64">And one architectural fact.</text>
  <g class="pdf-history-stage pdf-history-s0">
    <rect class="pdf-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pdf-history-step" x="44" y="142">01</text>
    <text class="pdf-history-name" x="70" y="142">OCR, 1970s onward</text>
    <text class="pdf-history-desc" x="44" y="166">Accurate on clean print. The gap</text>
    <text class="pdf-history-desc" x="44" y="182">on creased photographs still</text>
    <text class="pdf-history-desc" x="44" y="198">defines what is worth</text>
  </g>
  <line class="pdf-history-line pdf-history-conn pdf-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pdf-history-tip)"/>
  <g class="pdf-history-stage pdf-history-s1">
    <rect class="pdf-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pdf-history-step" x="280" y="142">02</text>
    <text class="pdf-history-name" x="306" y="142">PDF, 1993</text>
    <text class="pdf-history-desc" x="280" y="166">Designed for presentation</text>
    <text class="pdf-history-desc" x="280" y="182">fidelity. It says where a glyph</text>
    <text class="pdf-history-desc" x="280" y="198">goes, not what a paragraph is.</text>
  </g>
  <line class="pdf-history-line pdf-history-conn pdf-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pdf-history-tip)"/>
  <g class="pdf-history-stage pdf-history-s2">
    <rect class="pdf-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pdf-history-step" x="516" y="142">03</text>
    <text class="pdf-history-name" x="542" y="142">Layout-aware models, 2020</text>
    <text class="pdf-history-desc" x="516" y="166">Text plus position: a page as a</text>
    <text class="pdf-history-desc" x="516" y="182">two-dimensional object.</text>
  </g>
  <line class="pdf-history-line pdf-history-conn pdf-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pdf-history-tip)"/>
  <g class="pdf-history-stage pdf-history-s3">
    <rect class="pdf-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pdf-history-step" x="752" y="142">04</text>
    <text class="pdf-history-name" x="778" y="142">Document intelligence, 2020s</text>
    <text class="pdf-history-desc" x="752" y="166">Detection, OCR, layout and</text>
    <text class="pdf-history-desc" x="752" y="182">tables bundled. A cost-quality</text>
    <text class="pdf-history-desc" x="752" y="198">spectrum.</text>
  </g>
  <text class="pdf-history-sub" x="30" y="304">The second row is architectural rather than a defect in any library: reading order, columns and tables are all reconstruction from geometry, which is why they fail in ways that look like bugs and are not.</text>
</svg>
