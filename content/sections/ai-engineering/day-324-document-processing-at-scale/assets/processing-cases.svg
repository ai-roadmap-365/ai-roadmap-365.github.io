<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them defeats the gate.">
  <title>Four documents, four routes</title>
  <style>
    .processing-cases-bg   { fill: #f8fafc; }
    .processing-cases-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-cases-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-cases-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-cases-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-cases-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-cases-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .processing-cases-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .processing-cases-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .processing-cases-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .processing-cases-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .processing-cases-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .processing-cases-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .processing-cases-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .processing-cases-stage { opacity: 1; }

    .processing-cases-s0 { animation-delay: 0.00s; }
    .processing-cases-e0 { animation-delay: 0.00s; }
    .processing-cases-s1 { animation-delay: 1.28s; }
    .processing-cases-e1 { animation-delay: 1.28s; }
    .processing-cases-s2 { animation-delay: 2.56s; }
    .processing-cases-e2 { animation-delay: 2.56s; }
    .processing-cases-s3 { animation-delay: 3.84s; }
    .processing-cases-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .processing-cases-conn  { animation: processing-cases-trace 6.4s ease-in-out infinite; }
      .processing-cases-stage { animation: processing-cases-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes processing-cases-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes processing-cases-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .processing-cases-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .processing-cases-stage { animation: processing-cases-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes processing-cases-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="processing-cases-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="processing-cases-bg" width="980" height="322"/>
  <text class="processing-cases-h1"  x="30" y="40">Four documents, four routes</text>
  <text class="processing-cases-sub" x="30" y="64">One of them defeats the gate.</text>
  <g class="processing-cases-stage processing-cases-s0">
    <rect class="processing-cases-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="processing-cases-step" x="44" y="142">01</text>
    <text class="processing-cases-name" x="70" y="142">Born-digital invoice</text>
    <text class="processing-cases-desc" x="44" y="166">High yield, high alphabetic</text>
    <text class="processing-cases-desc" x="44" y="182">ratio. Accepted in milliseconds.</text>
  </g>
  <line class="processing-cases-line processing-cases-conn processing-cases-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#processing-cases-tip)"/>
  <g class="processing-cases-stage processing-cases-s1">
    <rect class="processing-cases-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="processing-cases-step" x="280" y="142">02</text>
    <text class="processing-cases-name" x="306" y="142">Scanned contract</text>
    <text class="processing-cases-desc" x="280" y="166">180 characters over forty pages.</text>
    <text class="processing-cases-desc" x="280" y="182">Flagged, then routed to OCR.</text>
    <text class="processing-cases-edge" x="280" y="242">100x</text>
  </g>
  <line class="processing-cases-line processing-cases-conn processing-cases-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#processing-cases-tip)"/>
  <g class="processing-cases-stage processing-cases-s2">
    <rect class="processing-cases-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="processing-cases-step" x="516" y="142">03</text>
    <text class="processing-cases-name" x="542" y="142">Two-column paper</text>
    <text class="processing-cases-desc" x="516" y="166">Spliced lines that look like</text>
    <text class="processing-cases-desc" x="516" y="182">language. The gate does not</text>
    <text class="processing-cases-desc" x="516" y="198">catch this.</text>
  </g>
  <line class="processing-cases-line processing-cases-conn processing-cases-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#processing-cases-tip)"/>
  <g class="processing-cases-stage processing-cases-s3">
    <rect class="processing-cases-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="processing-cases-step" x="752" y="142">04</text>
    <text class="processing-cases-name" x="778" y="142">Font-bomb PDF</text>
    <text class="processing-cases-desc" x="752" y="166">Unbounded allocation. Times out</text>
    <text class="processing-cases-desc" x="752" y="182">at ten seconds, dead-lettered,</text>
    <text class="processing-cases-desc" x="752" y="198">run continues.</text>
  </g>
  <text class="processing-cases-sub" x="30" y="304">Knowing which failures your gate cannot catch is part of using it responsibly, and the third case is the honest limitation: heuristics see character statistics, not semantics.</text>
</svg>
