<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Detect, score, budget.">
  <title>Three ideas</title>
  <style>
    .three-processing-ideas-bg   { fill: #f8fafc; }
    .three-processing-ideas-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-processing-ideas-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-processing-ideas-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-processing-ideas-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-processing-ideas-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-processing-ideas-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-processing-ideas-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-processing-ideas-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-processing-ideas-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-processing-ideas-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-processing-ideas-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-processing-ideas-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-processing-ideas-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-processing-ideas-stage { opacity: 1; }

    .three-processing-ideas-s0 { animation-delay: 0.00s; }
    .three-processing-ideas-e0 { animation-delay: 0.00s; }
    .three-processing-ideas-s1 { animation-delay: 1.50s; }
    .three-processing-ideas-e1 { animation-delay: 1.50s; }
    .three-processing-ideas-s2 { animation-delay: 3.00s; }
    .three-processing-ideas-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-processing-ideas-conn  { animation: three-processing-ideas-trace 6s ease-in-out infinite; }
      .three-processing-ideas-stage { animation: three-processing-ideas-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-processing-ideas-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-processing-ideas-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-processing-ideas-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-processing-ideas-stage { animation: three-processing-ideas-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-processing-ideas-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-processing-ideas-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-processing-ideas-bg" width="980" height="322"/>
  <text class="three-processing-ideas-h1"  x="30" y="40">Three ideas</text>
  <text class="three-processing-ideas-sub" x="30" y="64">Detect, score, budget.</text>
  <g class="three-processing-ideas-stage three-processing-ideas-s0">
    <rect class="three-processing-ideas-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-processing-ideas-step" x="44" y="142">01</text>
    <text class="three-processing-ideas-name" x="70" y="142">Dispatch by what the file is</text>
    <text class="three-processing-ideas-desc" x="44" y="166">The extension lies. Detect the real format,</text>
    <text class="three-processing-ideas-desc" x="44" y="182">then route.</text>
    <text class="three-processing-ideas-edge" x="44" y="242">magic bytes</text>
  </g>
  <line class="three-processing-ideas-line three-processing-ideas-conn three-processing-ideas-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-processing-ideas-tip)"/>
  <g class="three-processing-ideas-stage three-processing-ideas-s1">
    <rect class="three-processing-ideas-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-processing-ideas-step" x="359" y="142">02</text>
    <text class="three-processing-ideas-name" x="385" y="142">Score the result</text>
    <text class="three-processing-ideas-desc" x="359" y="166">Text and a judgement about that text. Cheap</text>
    <text class="three-processing-ideas-desc" x="359" y="182">heuristics catch catastrophes.</text>
  </g>
  <line class="three-processing-ideas-line three-processing-ideas-conn three-processing-ideas-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-processing-ideas-tip)"/>
  <g class="three-processing-ideas-stage three-processing-ideas-s2">
    <rect class="three-processing-ideas-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-processing-ideas-step" x="674" y="142">03</text>
    <text class="three-processing-ideas-name" x="700" y="142">Budget every document</text>
    <text class="three-processing-ideas-desc" x="674" y="166">A time limit and a memory ceiling. Exceeding</text>
    <text class="three-processing-ideas-desc" x="674" y="182">either is a normal outcome.</text>
  </g>
  <text class="three-processing-ideas-sub" x="30" y="304">The middle idea is the one with no equivalent in ordinary file handling: extraction can succeed technically and fail semantically, and only an explicit score notices.</text>
</svg>
