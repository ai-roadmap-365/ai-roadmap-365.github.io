<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a genuine attack surface.">
  <title>Five consequences of parsing files</title>
  <style>
    .processing-implications-bg   { fill: #f8fafc; }
    .processing-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .processing-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .processing-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .processing-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .processing-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .processing-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .processing-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .processing-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .processing-implications-stage { opacity: 1; }

    .processing-implications-s0 { animation-delay: 0.00s; }
    .processing-implications-e0 { animation-delay: 0.00s; }
    .processing-implications-s1 { animation-delay: 1.33s; }
    .processing-implications-e1 { animation-delay: 1.33s; }
    .processing-implications-s2 { animation-delay: 2.67s; }
    .processing-implications-e2 { animation-delay: 2.67s; }
    .processing-implications-s3 { animation-delay: 4.00s; }
    .processing-implications-e3 { animation-delay: 4.00s; }
    .processing-implications-s4 { animation-delay: 5.33s; }
    .processing-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .processing-implications-conn  { animation: processing-implications-trace 8s ease-in-out infinite; }
      .processing-implications-stage { animation: processing-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes processing-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes processing-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .processing-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .processing-implications-stage { animation: processing-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes processing-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="processing-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="processing-implications-bg" width="980" height="322"/>
  <text class="processing-implications-h1"  x="30" y="40">Five consequences of parsing files</text>
  <text class="processing-implications-sub" x="30" y="64">One is a genuine attack surface.</text>
  <g class="processing-implications-stage processing-implications-s0">
    <rect class="processing-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="processing-implications-step" x="44" y="142">01</text>
    <text class="processing-implications-name" x="70" y="142">Parsers are an attack surface</text>
    <text class="processing-implications-desc" x="44" y="166">Complex libraries,</text>
    <text class="processing-implications-desc" x="44" y="182">untrusted input,</text>
    <text class="processing-implications-desc" x="44" y="198">decompression bombs.</text>
    <text class="processing-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="processing-implications-line processing-implications-conn processing-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#processing-implications-tip)"/>
  <g class="processing-implications-stage processing-implications-s1">
    <rect class="processing-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="processing-implications-step" x="233" y="142">02</text>
    <text class="processing-implications-name" x="259" y="142">This is where text becomes greppable</text>
    <text class="processing-implications-desc" x="233" y="166">So it is the right stage</text>
    <text class="processing-implications-desc" x="233" y="182">to redact — and</text>
    <text class="processing-implications-desc" x="233" y="198">third-party OCR is a</text>
  </g>
  <line class="processing-implications-line processing-implications-conn processing-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#processing-implications-tip)"/>
  <g class="processing-implications-stage processing-implications-s2">
    <rect class="processing-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="processing-implications-step" x="422" y="142">03</text>
    <text class="processing-implications-name" x="448" y="142">Costs vary by orders of magnitude</text>
    <text class="processing-implications-desc" x="422" y="166">Microseconds for text,</text>
    <text class="processing-implications-desc" x="422" y="182">milliseconds for a PDF,</text>
    <text class="processing-implications-desc" x="422" y="198">seconds for OCR.</text>
    <text class="processing-implications-edge" x="422" y="242">performance</text>
  </g>
  <line class="processing-implications-line processing-implications-conn processing-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#processing-implications-tip)"/>
  <g class="processing-implications-stage processing-implications-s3">
    <rect class="processing-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="processing-implications-step" x="611" y="142">04</text>
    <text class="processing-implications-name" x="637" y="142">Parallelise, but bound it</text>
    <text class="processing-implications-desc" x="611" y="166">Unbounded workers plus a</text>
    <text class="processing-implications-desc" x="611" y="182">few large documents</text>
    <text class="processing-implications-desc" x="611" y="198">exhausts memory.</text>
  </g>
  <line class="processing-implications-line processing-implications-conn processing-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#processing-implications-tip)"/>
  <g class="processing-implications-stage processing-implications-s4">
    <rect class="processing-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="processing-implications-step" x="800" y="142">05</text>
    <text class="processing-implications-name" x="826" y="142">The escalation decision dominates cost</text>
    <text class="processing-implications-desc" x="800" y="166">Everything to OCR is</text>
    <text class="processing-implications-desc" x="800" y="182">wasteful; nothing means</text>
    <text class="processing-implications-desc" x="800" y="198">scans are missing.</text>
  </g>
  <text class="processing-implications-sub" x="30" y="304">Never letting a parser fetch remote resources referenced by a document is a small rule with a large effect: it closes a request-forgery path that arrives inside the file itself.</text>
</svg>
