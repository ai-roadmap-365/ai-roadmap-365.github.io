<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All of them silently.">
  <title>Five ways extraction fails</title>
  <style>
    .extraction-failures-bg   { fill: #f8fafc; }
    .extraction-failures-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-failures-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-failures-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-failures-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-failures-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .extraction-failures-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .extraction-failures-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .extraction-failures-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .extraction-failures-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .extraction-failures-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .extraction-failures-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .extraction-failures-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .extraction-failures-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .extraction-failures-stage { opacity: 1; }

    .extraction-failures-s0 { animation-delay: 0.00s; }
    .extraction-failures-e0 { animation-delay: 0.00s; }
    .extraction-failures-s1 { animation-delay: 1.33s; }
    .extraction-failures-e1 { animation-delay: 1.33s; }
    .extraction-failures-s2 { animation-delay: 2.67s; }
    .extraction-failures-e2 { animation-delay: 2.67s; }
    .extraction-failures-s3 { animation-delay: 4.00s; }
    .extraction-failures-e3 { animation-delay: 4.00s; }
    .extraction-failures-s4 { animation-delay: 5.33s; }
    .extraction-failures-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .extraction-failures-conn  { animation: extraction-failures-trace 8s ease-in-out infinite; }
      .extraction-failures-stage { animation: extraction-failures-arrive 8s ease-in-out infinite; }
    }
    @keyframes extraction-failures-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes extraction-failures-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .extraction-failures-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .extraction-failures-stage { animation: extraction-failures-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes extraction-failures-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="extraction-failures-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="extraction-failures-bg" width="980" height="322"/>
  <text class="extraction-failures-h1"  x="30" y="40">Five ways extraction fails</text>
  <text class="extraction-failures-sub" x="30" y="64">All of them silently.</text>
  <g class="extraction-failures-stage extraction-failures-s0">
    <rect class="extraction-failures-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="extraction-failures-step" x="44" y="142">01</text>
    <text class="extraction-failures-name" x="70" y="142">Reading order collapse</text>
    <text class="extraction-failures-desc" x="44" y="166">Two columns spliced.</text>
    <text class="extraction-failures-desc" x="44" y="182">Locally grammatical,</text>
    <text class="extraction-failures-desc" x="44" y="198">globally nonsense.</text>
  </g>
  <line class="extraction-failures-line extraction-failures-conn extraction-failures-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#extraction-failures-tip)"/>
  <g class="extraction-failures-stage extraction-failures-s1">
    <rect class="extraction-failures-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="extraction-failures-step" x="233" y="142">02</text>
    <text class="extraction-failures-name" x="259" y="142">Silent empty extraction</text>
    <text class="extraction-failures-desc" x="233" y="166">A scan with no text</text>
    <text class="extraction-failures-desc" x="233" y="182">layer. Absent from the</text>
    <text class="extraction-failures-desc" x="233" y="198">index, apparently</text>
  </g>
  <line class="extraction-failures-line extraction-failures-conn extraction-failures-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#extraction-failures-tip)"/>
  <g class="extraction-failures-stage extraction-failures-s2">
    <rect class="extraction-failures-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="extraction-failures-step" x="422" y="142">03</text>
    <text class="extraction-failures-name" x="448" y="142">Table flattening</text>
    <text class="extraction-failures-desc" x="422" y="166">Row labels separated from</text>
    <text class="extraction-failures-desc" x="422" y="182">their values. The meaning</text>
    <text class="extraction-failures-desc" x="422" y="198">was the structure.</text>
  </g>
  <line class="extraction-failures-line extraction-failures-conn extraction-failures-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#extraction-failures-tip)"/>
  <g class="extraction-failures-stage extraction-failures-s3">
    <rect class="extraction-failures-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="extraction-failures-step" x="611" y="142">04</text>
    <text class="extraction-failures-name" x="637" y="142">The pathological document</text>
    <text class="extraction-failures-desc" x="611" y="166">Unbounded memory, or</text>
    <text class="extraction-failures-desc" x="611" y="182">never returns.</text>
  </g>
  <line class="extraction-failures-line extraction-failures-conn extraction-failures-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#extraction-failures-tip)"/>
  <g class="extraction-failures-stage extraction-failures-s4">
    <rect class="extraction-failures-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="extraction-failures-step" x="800" y="142">05</text>
    <text class="extraction-failures-name" x="826" y="142">Encoding chaos</text>
    <text class="extraction-failures-desc" x="800" y="166">Mojibake that embeds</text>
    <text class="extraction-failures-desc" x="800" y="182">happily and matches</text>
    <text class="extraction-failures-desc" x="800" y="198">nothing.</text>
  </g>
  <text class="extraction-failures-sub" x="30" y="304">Every one of these produces output rather than an error, which is why the quality gate is the only mechanism that catches them before they reach the index.</text>
</svg>
