<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" role="img" aria-label="Document Processing Dispatch and Quality Gate showing format detection routing to per-format extractors, a quality scoring stage, and three outcomes: accepted, flagged for review, and dead-lettered">
  <title>Document Processing Dispatch and Quality Gate</title>
  <defs>
    <style>
      .d324a-bg { fill: #f8fafc; }
      .d324a-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d324a-ok { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; }
      .d324a-warn { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2px; }
      .d324a-bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; }
      .d324a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d324a-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d324a-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d324a-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d324a-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d324a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" class="d324a-bg"/>
  <text x="40" y="40" class="d324a-title">Document Processing Dispatch and Quality Gate</text>
  <text x="40" y="64" class="d324a-sub">Detection reads bytes, not the file name. Every extraction is scored, and the gate has three outcomes rather than two.</text>

  <rect x="40" y="110" width="130" height="66" rx="8" class="d324a-box"/>
  <text x="105" y="138" class="d324a-h" text-anchor="middle">Detect</text>
  <text x="105" y="158" class="d324a-t" text-anchor="middle">magic bytes</text>

  <rect x="220" y="92" width="150" height="42" rx="6" class="d324a-box"/>
  <text x="295" y="118" class="d324a-t" text-anchor="middle">born-digital PDF</text>
  <rect x="220" y="142" width="150" height="42" rx="6" class="d324a-box"/>
  <text x="295" y="168" class="d324a-t" text-anchor="middle">scan (no text layer)</text>
  <rect x="220" y="192" width="150" height="42" rx="6" class="d324a-box"/>
  <text x="295" y="218" class="d324a-t" text-anchor="middle">HTML / text</text>

  <path d="M 170 143 L 214 113" class="d324a-flow" marker-end="url(#d324a-a)"/>
  <path d="M 170 143 L 214 163" class="d324a-flow" marker-end="url(#d324a-a)"/>
  <path d="M 170 143 L 214 213" class="d324a-flow" marker-end="url(#d324a-a)"/>

  <rect x="420" y="120" width="150" height="90" rx="8" class="d324a-box"/>
  <text x="495" y="150" class="d324a-h" text-anchor="middle">Extract</text>
  <text x="495" y="172" class="d324a-t" text-anchor="middle">under a hard budget</text>
  <text x="495" y="190" class="d324a-t" text-anchor="middle">in a killable process</text>
  <path d="M 370 113 L 414 150" class="d324a-flow" marker-end="url(#d324a-a)"/>
  <path d="M 370 163 L 414 163" class="d324a-flow" marker-end="url(#d324a-a)"/>
  <path d="M 370 213 L 414 180" class="d324a-flow" marker-end="url(#d324a-a)"/>

  <rect x="620" y="120" width="140" height="90" rx="8" class="d324a-box"/>
  <text x="690" y="150" class="d324a-h" text-anchor="middle">Score</text>
  <text x="690" y="172" class="d324a-t" text-anchor="middle">yield, alpha ratio,</text>
  <text x="690" y="190" class="d324a-t" text-anchor="middle">word length</text>
  <path d="M 570 165 L 614 165" class="d324a-flow" marker-end="url(#d324a-a)"/>

  <rect x="200" y="290" width="180" height="70" rx="8" class="d324a-ok"/>
  <text x="290" y="318" class="d324a-h" text-anchor="middle">accepted</text>
  <text x="290" y="338" class="d324a-t" text-anchor="middle">goes to the index</text>

  <rect x="400" y="290" width="180" height="70" rx="8" class="d324a-warn"/>
  <text x="490" y="318" class="d324a-h" text-anchor="middle">flagged</text>
  <text x="490" y="338" class="d324a-t" text-anchor="middle">indexed AND reviewed</text>

  <rect x="600" y="290" width="180" height="70" rx="8" class="d324a-bad"/>
  <text x="690" y="318" class="d324a-h" text-anchor="middle">dead-lettered</text>
  <text x="690" y="338" class="d324a-t" text-anchor="middle">timeout, crash, unknown</text>

  <path d="M 660 210 L 400 260 L 320 286" class="d324a-flow" marker-end="url(#d324a-a)"/>
  <path d="M 690 210 L 490 286" class="d324a-flow" marker-end="url(#d324a-a)"/>
  <path d="M 720 210 L 690 286" class="d324a-flow" marker-end="url(#d324a-a)"/>

  <text x="40" y="400" class="d324a-h">Why three outcomes and not two</text>
  <text x="40" y="422" class="d324a-t">A binary accept/reject either discards documents whose partial text is still useful, or silently admits garbage into the index.</text>
  <text x="40" y="442" class="d324a-t">"Flagged" indexes the text AND records that it scored badly, so it can be re-routed to a more expensive extractor later.</text>
</svg>
