title: Document Processing at Scale
section: ai-engineering
subsection: production-ai-systems
week: 47
learning_promise:
  'Turn arbitrary source files into clean text without silent corruption: detect formats from
  their bytes rather than their names, dispatch to per-format extractors under a hard budget enforced by
  a process you can kill, and score every result so a scan that yields twenty characters is flagged
  rather than indexed.'
objectives:
  - Detect a document's real format from its leading bytes and explain why the extension cannot be
    trusted.
  - Dispatch to per-format extractors through a registry rather than a growing conditional.
  - Enforce a per-document time budget from the harness, and explain why a thread cannot provide one.
  - Score extracted text on yield, alphabetic ratio and word length, and identify which failure each
    signal catches.
  - Justify a three-outcome gate — accepted, flagged, dead-lettered — over a binary accept or reject.
