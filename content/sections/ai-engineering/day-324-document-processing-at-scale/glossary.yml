terms:
  - term: Magic Number
    definition: A short signature at the start of a file that identifies its real format, independent of
      the file name.
  - term: Text Layer
    definition: The extractable character data embedded in a PDF. A scanned page has none, which is why
      direct extraction recovers almost nothing from it.
  - term: Optical Character Recognition
    definition: Recovering text from an image of a page. Far more expensive than reading a text layer,
      which is why it should be a routed decision rather than the default.
  - term: Reading Order
    definition: The sequence in which text should be read. PDF stores glyph positions rather than order,
      so reading order must be reconstructed from geometry.
  - term: Text Yield
    definition: Extracted characters per unit of source size. A ratio rather than a length, so a short
      document is not confused with a failed extraction.
  - term: Alphabetic Ratio
    definition: The proportion of non-space characters that are letters, used to detect mojibake and
      character-level noise.
  - term: Mojibake
    definition: Text decoded with the wrong character encoding, producing characters that embed happily
      and match nothing.
  - term: Quality Gate
    definition: The stage that decides whether extracted text is accepted, flagged for review, or
      dead-lettered.
  - term: Resource Budget
    definition: A hard time or memory limit applied to processing one document, enforced by the harness
      so a pathological input cannot stall a run.
  - term: Layout-Aware Extraction
    definition: Extraction that treats a page as a two-dimensional object, combining text with position
      to recover columns, headings and tables.
