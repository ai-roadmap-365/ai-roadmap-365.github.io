terms:
  - term: Ingestion Pipeline
    definition: The scheduled, restartable process that moves source data into a retrieval index and
      keeps it correct as the sources change.
  - term: Cursor
    definition: A durable marker recording how far a source has been fully processed, so the next run
      resumes rather than restarts.
  - term: Idempotency
    definition: The property that applying the same operation twice produces the same result as applying
      it once.
  - term: Content Hash
    definition: A digest of a document's normalised body, used to prove whether its text genuinely
      changed independently of modification metadata.
  - term: Stable Chunk Identifier
    definition: A chunk id derived from the document id and the chunk's position or content, so it is
      reproducible across runs and makes a write an upsert.
  - term: Upsert
    definition: A write that inserts a record if its id is new and replaces it if the id already exists.
  - term: Dead-Letter Queue
    definition: A durable store of records that failed processing, held with their error so the batch can
      continue and the failures can later be drained or abandoned.
  - term: Reconciliation
    definition: Comparing the set of ids at the source against the set in the index and deleting the
      difference, so deletions propagate.
  - term: Change Data Capture
    definition: Reading a source's change log rather than re-reading the whole source, so ingestion is
      incremental by construction.
  - term: At-Least-Once Delivery
    definition: A delivery guarantee where a record may be processed more than once, made safe by pairing
      it with idempotent writes.
