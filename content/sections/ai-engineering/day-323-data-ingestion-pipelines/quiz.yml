questions:
  - question: Why must the ingestion cursor be committed after the batch is durably written rather than
      before?
    options:
      - Committing first is faster, and the ordering makes no observable difference
      - The cursor must be committed first so the source knows the records were read
      - 'A crash then merely reprocesses an idempotent batch'
      - Cursors cannot be committed after a write in any database
    answer_index: 2
    explanation: Commit-after turns a crash into reprocessing, which idempotent writes absorb.
      Commit-before turns the same crash into silent data loss.
  - question: What makes a chunk identifier "stable", and why does it matter?
    options:
      - It is a random UUID generated fresh for each chunk on every run
      - It is a counter over all chunks produced in the run, so ids are dense and ordered
      - It is the current timestamp, which guarantees uniqueness
      - 'It derives from the document and chunk, so it repeats'
    answer_index: 3
    explanation: A content-derived id is reproducible across runs, which is exactly what turns an insert
      into an upsert. Random or order-dependent ids duplicate the index on every re-run.
  - question: A document that previously produced twelve chunks now produces eight. Upserting the eight
      is not sufficient. What else must happen?
    options:
      - 'Chunks nine to twelve must be deleted or they orphan'
      - Nothing; the extra chunks expire automatically in every vector store
      - The whole index must be rebuilt from scratch
      - The document must be re-embedded twelve times to keep the count constant
    answer_index: 0
    explanation: Orphaned chunks stay retrievable and surface as stale answers. Per-document
      reconciliation deletes ids no longer in the current chunk set.
  - question: Why does a content hash reduce cost even when the source reports a document as modified?
    options:
      - Because hashing is faster than reading the document
      - 'Timestamps change when the text does not; the hash proves it'
      - Because hashes compress the document before embedding
      - Because embedding providers charge less for hashed input
    answer_index: 1
    explanation: Modification metadata is a weak signal. The hash makes "unchanged" provable, and
      embedding is the dominant cost.
  - question: What is the operational purpose of a dead-letter queue, as distinct from logging the error?
    options:
      - It is a formatted log intended for humans to read during incidents
      - It stores the successful records so they can be replayed
      - 'A durable list of work that must later be drained'
      - It replaces the checkpoint store
    answer_index: 2
    explanation: A log is passive; a dead-letter queue is outstanding work with an owner. That
      distinction is what stops failures from disappearing silently.
