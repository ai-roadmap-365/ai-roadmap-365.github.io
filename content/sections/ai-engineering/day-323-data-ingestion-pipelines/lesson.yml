title: Data Ingestion Pipelines
section: ai-engineering
subsection: production-ai-systems
week: 47
learning_promise:
  'Build the ingestion machinery a production retrieval system depends on: content-hash
  change detection, stable chunk identifiers, durable cursors that make a run resumable, and a
  dead-letter queue that stops one poison record halting ten thousand good ones.'
objectives:
  - Explain why resumability, idempotency and failure isolation are the three properties that separate a
    production ingestion pipeline from a loading script.
  - Derive stable chunk identifiers from document content so that a re-run upserts rather than duplicates.
  - Implement content-hash change detection so an incremental run embeds only what genuinely changed.
  - Commit a durable cursor in the correct order relative to the batch write, so a crash reprocesses
    rather than loses work.
  - Route failing records to a dead-letter queue with their error, and reconcile orphaned chunks when a
    document shrinks.
