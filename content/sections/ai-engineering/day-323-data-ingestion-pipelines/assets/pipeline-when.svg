<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a rebuild is a feature.">
  <title>When to build a real pipeline</title>
  <style>
    .pipeline-when-bg   { fill: #f8fafc; }
    .pipeline-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-when-row { opacity: 1; }
    .pipeline-when-r0 { animation-delay: 0.00s; }
    .pipeline-when-r1 { animation-delay: 0.45s; }
    .pipeline-when-r2 { animation-delay: 0.90s; }
    .pipeline-when-r3 { animation-delay: 1.35s; }
    .pipeline-when-r4 { animation-delay: 1.80s; }
    .pipeline-when-row { animation: pipeline-when-reveal 7.3s ease-in-out infinite; }
    @keyframes pipeline-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pipeline-when-bg" width="980" height="390"/>
  <text class="pipeline-when-h1"  x="30" y="40">When to build a real pipeline</text>
  <text class="pipeline-when-sub" x="30" y="64">And when a rebuild is a feature.</text>
  <rect class="pipeline-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pipeline-when-name" x="46" y="122">Build one</text>
  <text class="pipeline-when-desc" x="46" y="142">The corpus has its own schedule.</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r0" x="46" y="182">The corpus changes without you</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r1" x="46" y="216">A full rebuild costs more than you want routinely</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r2" x="46" y="250">Deletions must propagate</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r3" x="46" y="284">Ingestion must run unattended</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r4" x="46" y="318">Somebody asks whether the index is current</text>
  <rect class="pipeline-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pipeline-when-name" x="526" y="122">Rebuild instead</text>
  <text class="pipeline-when-desc" x="526" y="142">During exploration.</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r0" x="526" y="182">A genuinely static corpus</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r1" x="526" y="216">Still choosing chunking and embedding</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r2" x="526" y="250">A rebuild guarantees the index matches the code</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r3" x="526" y="284">No stale state to confuse a comparison</text>
  <text class="pipeline-when-desc pipeline-when-row pipeline-when-r4" x="526" y="318">Which is a feature, not a compromise</text>
  <text class="pipeline-when-sub" x="30" y="372">The transition point is usually a specific question: the first time someone asks whether the index is up to date and nobody can answer with confidence, the pipeline is overdue.</text>
</svg>
