<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each mechanism exists for one failure.">
  <title>Four failures, four mechanisms</title>
  <style>
    .four-failures-ingest-bg   { fill: #f8fafc; }
    .four-failures-ingest-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-ingest-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-ingest-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-ingest-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-ingest-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-ingest-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-failures-ingest-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-failures-ingest-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-failures-ingest-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-failures-ingest-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-failures-ingest-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-failures-ingest-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-failures-ingest-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-failures-ingest-stage { opacity: 1; }

    .four-failures-ingest-s0 { animation-delay: 0.00s; }
    .four-failures-ingest-e0 { animation-delay: 0.00s; }
    .four-failures-ingest-s1 { animation-delay: 1.28s; }
    .four-failures-ingest-e1 { animation-delay: 1.28s; }
    .four-failures-ingest-s2 { animation-delay: 2.56s; }
    .four-failures-ingest-e2 { animation-delay: 2.56s; }
    .four-failures-ingest-s3 { animation-delay: 3.84s; }
    .four-failures-ingest-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-failures-ingest-conn  { animation: four-failures-ingest-trace 6.4s ease-in-out infinite; }
      .four-failures-ingest-stage { animation: four-failures-ingest-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-failures-ingest-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-failures-ingest-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-failures-ingest-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-failures-ingest-stage { animation: four-failures-ingest-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-failures-ingest-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-failures-ingest-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-failures-ingest-bg" width="980" height="322"/>
  <text class="four-failures-ingest-h1"  x="30" y="40">Four failures, four mechanisms</text>
  <text class="four-failures-ingest-sub" x="30" y="64">Each mechanism exists for one failure.</text>
  <g class="four-failures-ingest-stage four-failures-ingest-s0">
    <rect class="four-failures-ingest-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-failures-ingest-step" x="44" y="142">01</text>
    <text class="four-failures-ingest-name" x="70" y="142">The re-run duplicates everything</text>
    <text class="four-failures-ingest-desc" x="44" y="166">80% of the corpus twice.</text>
    <text class="four-failures-ingest-desc" x="44" y="182">Content-derived ids and upserts.</text>
  </g>
  <line class="four-failures-ingest-line four-failures-ingest-conn four-failures-ingest-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-failures-ingest-tip)"/>
  <g class="four-failures-ingest-stage four-failures-ingest-s1">
    <rect class="four-failures-ingest-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-failures-ingest-step" x="280" y="142">02</text>
    <text class="four-failures-ingest-name" x="306" y="142">The crash loses a day</text>
    <text class="four-failures-ingest-desc" x="280" y="166">A durable cursor committed after</text>
    <text class="four-failures-ingest-desc" x="280" y="182">the write.</text>
  </g>
  <line class="four-failures-ingest-line four-failures-ingest-conn four-failures-ingest-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-failures-ingest-tip)"/>
  <g class="four-failures-ingest-stage four-failures-ingest-s2">
    <rect class="four-failures-ingest-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-failures-ingest-step" x="516" y="142">03</text>
    <text class="four-failures-ingest-name" x="542" y="142">One poison record halts everything</text>
    <text class="four-failures-ingest-desc" x="516" y="166">A dead-letter queue; the batch</text>
    <text class="four-failures-ingest-desc" x="516" y="182">continues.</text>
  </g>
  <line class="four-failures-ingest-line four-failures-ingest-conn four-failures-ingest-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-failures-ingest-tip)"/>
  <g class="four-failures-ingest-stage four-failures-ingest-s3">
    <rect class="four-failures-ingest-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-failures-ingest-step" x="752" y="142">04</text>
    <text class="four-failures-ingest-name" x="778" y="142">The index drifts from the source</text>
    <text class="four-failures-ingest-desc" x="752" y="166">Reconciliation: compare id sets</text>
    <text class="four-failures-ingest-desc" x="752" y="182">and delete the difference.</text>
  </g>
  <text class="four-failures-ingest-sub" x="30" y="304">The fourth is the one with legal consequences: a document deleted at source and still returned as an answer is not a caching problem, it is a system that ignored a deletion.</text>
</svg>
