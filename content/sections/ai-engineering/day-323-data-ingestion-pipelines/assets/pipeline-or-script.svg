<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them survives being re-run.">
  <title>A pipeline, or a loading script</title>
  <style>
    .pipeline-or-script-bg   { fill: #f8fafc; }
    .pipeline-or-script-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-or-script-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-or-script-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-or-script-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-or-script-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-or-script-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-or-script-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-or-script-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-or-script-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-or-script-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-or-script-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-or-script-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-or-script-row { opacity: 1; }
    .pipeline-or-script-r0 { animation-delay: 0.00s; }
    .pipeline-or-script-r1 { animation-delay: 0.45s; }
    .pipeline-or-script-r2 { animation-delay: 0.90s; }
    .pipeline-or-script-r3 { animation-delay: 1.35s; }
    .pipeline-or-script-r4 { animation-delay: 1.80s; }
    .pipeline-or-script-row { animation: pipeline-or-script-reveal 7.3s ease-in-out infinite; }
    @keyframes pipeline-or-script-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pipeline-or-script-bg" width="980" height="390"/>
  <text class="pipeline-or-script-h1"  x="30" y="40">A pipeline, or a loading script</text>
  <text class="pipeline-or-script-sub" x="30" y="64">One of them survives being re-run.</text>
  <rect class="pipeline-or-script-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pipeline-or-script-name" x="46" y="122">A pipeline</text>
  <text class="pipeline-or-script-desc" x="46" y="142">Stateful and restartable.</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r0" x="46" y="182">A durable cursor and content hashes</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r1" x="46" y="216">Stable ids making writes idempotent</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r2" x="46" y="250">A dead-letter queue for bad records</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r3" x="46" y="284">A schedule, run history and lag metric</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r4" x="46" y="318">Safe to re-run at any point</text>
  <rect class="pipeline-or-script-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pipeline-or-script-name" x="526" y="122">A script</text>
  <text class="pipeline-or-script-desc" x="526" y="142">Correct once.</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r0" x="526" y="182">Starts from the beginning every time</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r1" x="526" y="216">Random or positional chunk ids</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r2" x="526" y="250">One exception ends the run</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r3" x="526" y="284">No history, no lag, no alerting</text>
  <text class="pipeline-or-script-desc pipeline-or-script-row pipeline-or-script-r4" x="526" y="318">A re-run duplicates the corpus</text>
  <text class="pipeline-or-script-sub" x="30" y="372">Excellent chunking logic wrapped in a script that cannot be safely re-run is a very common shape, and it is the reason the distinction is worth drawing explicitly.</text>
</svg>
