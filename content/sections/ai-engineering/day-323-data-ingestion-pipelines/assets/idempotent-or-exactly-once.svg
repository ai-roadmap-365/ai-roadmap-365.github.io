<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rather than exactly-once.">
  <title>At-least-once plus idempotent</title>
  <style>
    .idempotent-or-exactly-once-bg   { fill: #f8fafc; }
    .idempotent-or-exactly-once-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotent-or-exactly-once-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotent-or-exactly-once-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotent-or-exactly-once-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotent-or-exactly-once-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotent-or-exactly-once-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .idempotent-or-exactly-once-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .idempotent-or-exactly-once-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .idempotent-or-exactly-once-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .idempotent-or-exactly-once-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .idempotent-or-exactly-once-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .idempotent-or-exactly-once-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .idempotent-or-exactly-once-row { opacity: 1; }
    .idempotent-or-exactly-once-r0 { animation-delay: 0.00s; }
    .idempotent-or-exactly-once-r1 { animation-delay: 0.45s; }
    .idempotent-or-exactly-once-r2 { animation-delay: 0.90s; }
    .idempotent-or-exactly-once-r3 { animation-delay: 1.35s; }
    .idempotent-or-exactly-once-r4 { animation-delay: 1.80s; }
    .idempotent-or-exactly-once-row { animation: idempotent-or-exactly-once-reveal 7.3s ease-in-out infinite; }
    @keyframes idempotent-or-exactly-once-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="idempotent-or-exactly-once-bg" width="980" height="390"/>
  <text class="idempotent-or-exactly-once-h1"  x="30" y="40">At-least-once plus idempotent</text>
  <text class="idempotent-or-exactly-once-sub" x="30" y="64">Rather than exactly-once.</text>
  <rect class="idempotent-or-exactly-once-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="idempotent-or-exactly-once-name" x="46" y="122">Exactly-once</text>
  <text class="idempotent-or-exactly-once-desc" x="46" y="142">Extremely difficult.</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r0" x="46" y="182">A distributed systems research problem</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r1" x="46" y="216">Requires coordination across every boundary</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r2" x="46" y="250">Fragile under partial failure</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r3" x="46" y="284">Rarely achieved in practice</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r4" x="46" y="318">And not necessary here</text>
  <rect class="idempotent-or-exactly-once-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="idempotent-or-exactly-once-name" x="526" y="122">At-least-once, idempotent</text>
  <text class="idempotent-or-exactly-once-desc" x="526" y="142">The same observable outcome.</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r0" x="526" y="182">Delivery may repeat</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r1" x="526" y="216">Writes are keyed by content-derived ids</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r2" x="526" y="250">A repeat is an update, not an insert</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r3" x="526" y="284">Far less machinery</text>
  <text class="idempotent-or-exactly-once-desc idempotent-or-exactly-once-row idempotent-or-exactly-once-r4" x="526" y="318">The standard reliability recipe</text>
  <text class="idempotent-or-exactly-once-sub" x="30" y="372">The observable outcome is identical and the engineering cost is not, which is why this pairing became the default recipe rather than the pursuit of exactly-once semantics.</text>
</svg>
