<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the ordering of the last two is the whole game.">
  <title>Six stages, in order</title>
  <style>
    .pipeline-stages-bg   { fill: #f8fafc; }
    .pipeline-stages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-stages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-stages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-stages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-stages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-stages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-stages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-stages-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-stages-stage { opacity: 1; }

    .pipeline-stages-s0 { animation-delay: 0.00s; }
    .pipeline-stages-e0 { animation-delay: 0.00s; }
    .pipeline-stages-s1 { animation-delay: 1.37s; }
    .pipeline-stages-e1 { animation-delay: 1.37s; }
    .pipeline-stages-s2 { animation-delay: 2.74s; }
    .pipeline-stages-e2 { animation-delay: 2.74s; }
    .pipeline-stages-s3 { animation-delay: 4.11s; }
    .pipeline-stages-e3 { animation-delay: 4.11s; }
    .pipeline-stages-s4 { animation-delay: 5.49s; }
    .pipeline-stages-e4 { animation-delay: 5.49s; }
    .pipeline-stages-s5 { animation-delay: 6.86s; }
    .pipeline-stages-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-stages-conn  { animation: pipeline-stages-trace 9.600000000000001s ease-in-out infinite; }
      .pipeline-stages-stage { animation: pipeline-stages-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes pipeline-stages-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-stages-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-stages-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-stages-stage { animation: pipeline-stages-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-stages-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-stages-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-stages-bg" width="980" height="322"/>
  <text class="pipeline-stages-h1"  x="30" y="40">Six stages, in order</text>
  <text class="pipeline-stages-sub" x="30" y="64">And the ordering of the last two is the whole game.</text>
  <g class="pipeline-stages-stage pipeline-stages-s0">
    <rect class="pipeline-stages-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="44" y="142">01</text>
    <text class="pipeline-stages-name" x="70" y="142">Source and cursor</text>
    <text class="pipeline-stages-desc" x="44" y="166">Enumerate above the</text>
    <text class="pipeline-stages-desc" x="44" y="182">highest</text>
    <text class="pipeline-stages-desc" x="44" y="198">fully-processed</text>
  </g>
  <line class="pipeline-stages-line pipeline-stages-conn pipeline-stages-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#pipeline-stages-tip)"/>
  <g class="pipeline-stages-stage pipeline-stages-s1">
    <rect class="pipeline-stages-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="201" y="142">02</text>
    <text class="pipeline-stages-name" x="227" y="142">Extract</text>
    <text class="pipeline-stages-desc" x="201" y="166">Bytes to text. Where</text>
    <text class="pipeline-stages-desc" x="201" y="182">the most failures</text>
    <text class="pipeline-stages-desc" x="201" y="198">live; wrap every</text>
  </g>
  <line class="pipeline-stages-line pipeline-stages-conn pipeline-stages-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#pipeline-stages-tip)"/>
  <g class="pipeline-stages-stage pipeline-stages-s2">
    <rect class="pipeline-stages-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="358" y="142">03</text>
    <text class="pipeline-stages-name" x="384" y="142">Normalise</text>
    <text class="pipeline-stages-desc" x="358" y="166">A schema, a content</text>
    <text class="pipeline-stages-desc" x="358" y="182">hash, and</text>
    <text class="pipeline-stages-desc" x="358" y="198">deduplication within</text>
    <text class="pipeline-stages-edge" x="358" y="242">the hash</text>
  </g>
  <line class="pipeline-stages-line pipeline-stages-conn pipeline-stages-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#pipeline-stages-tip)"/>
  <g class="pipeline-stages-stage pipeline-stages-s3">
    <rect class="pipeline-stages-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="515" y="142">04</text>
    <text class="pipeline-stages-name" x="541" y="142">Chunk</text>
    <text class="pipeline-stages-desc" x="515" y="166">Stable ids derived</text>
    <text class="pipeline-stages-desc" x="515" y="182">from the document</text>
    <text class="pipeline-stages-desc" x="515" y="198">and position, never</text>
  </g>
  <line class="pipeline-stages-line pipeline-stages-conn pipeline-stages-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#pipeline-stages-tip)"/>
  <g class="pipeline-stages-stage pipeline-stages-s4">
    <rect class="pipeline-stages-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="672" y="142">05</text>
    <text class="pipeline-stages-name" x="698" y="142">Embed</text>
    <text class="pipeline-stages-desc" x="672" y="166">In batches. An</text>
    <text class="pipeline-stages-desc" x="672" y="182">unchanged document</text>
    <text class="pipeline-stages-desc" x="672" y="198">skips this stage</text>
    <text class="pipeline-stages-edge" x="672" y="242">money</text>
  </g>
  <line class="pipeline-stages-line pipeline-stages-conn pipeline-stages-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#pipeline-stages-tip)"/>
  <g class="pipeline-stages-stage pipeline-stages-s5">
    <rect class="pipeline-stages-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="829" y="142">06</text>
    <text class="pipeline-stages-name" x="855" y="142">Index, then advance the cursor</text>
    <text class="pipeline-stages-desc" x="829" y="166">Upsert semantics.</text>
    <text class="pipeline-stages-desc" x="829" y="182">Cursor after the</text>
    <text class="pipeline-stages-desc" x="829" y="198">durable write, never</text>
  </g>
  <text class="pipeline-stages-sub" x="30" y="304">Committing the cursor before the write loses data silently on a crash; committing after simply reprocesses a batch, which is harmless because the writes are idempotent.</text>
</svg>
