<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are security.">
  <title>Five consequences of running a pipeline</title>
  <style>
    .ingestion-implications-bg   { fill: #f8fafc; }
    .ingestion-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ingestion-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ingestion-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ingestion-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ingestion-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ingestion-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ingestion-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ingestion-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ingestion-implications-stage { opacity: 1; }

    .ingestion-implications-s0 { animation-delay: 0.00s; }
    .ingestion-implications-e0 { animation-delay: 0.00s; }
    .ingestion-implications-s1 { animation-delay: 1.33s; }
    .ingestion-implications-e1 { animation-delay: 1.33s; }
    .ingestion-implications-s2 { animation-delay: 2.67s; }
    .ingestion-implications-e2 { animation-delay: 2.67s; }
    .ingestion-implications-s3 { animation-delay: 4.00s; }
    .ingestion-implications-e3 { animation-delay: 4.00s; }
    .ingestion-implications-s4 { animation-delay: 5.33s; }
    .ingestion-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .ingestion-implications-conn  { animation: ingestion-implications-trace 8s ease-in-out infinite; }
      .ingestion-implications-stage { animation: ingestion-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes ingestion-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ingestion-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ingestion-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ingestion-implications-stage { animation: ingestion-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ingestion-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ingestion-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ingestion-implications-bg" width="980" height="322"/>
  <text class="ingestion-implications-h1"  x="30" y="40">Five consequences of running a pipeline</text>
  <text class="ingestion-implications-sub" x="30" y="64">Two are security.</text>
  <g class="ingestion-implications-stage ingestion-implications-s0">
    <rect class="ingestion-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="ingestion-implications-step" x="44" y="142">01</text>
    <text class="ingestion-implications-name" x="70" y="142">It holds every source credential</text>
    <text class="ingestion-implications-desc" x="44" y="166">Narrowest read-only</text>
    <text class="ingestion-implications-desc" x="44" y="182">scopes. A high-value</text>
    <text class="ingestion-implications-desc" x="44" y="198">target.</text>
    <text class="ingestion-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="ingestion-implications-line ingestion-implications-conn ingestion-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#ingestion-implications-tip)"/>
  <g class="ingestion-implications-stage ingestion-implications-s1">
    <rect class="ingestion-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="ingestion-implications-step" x="233" y="142">02</text>
    <text class="ingestion-implications-name" x="259" y="142">It is where personal data enters</text>
    <text class="ingestion-implications-desc" x="233" y="166">So it is the right place</text>
    <text class="ingestion-implications-desc" x="233" y="182">to redact, and to honour</text>
    <text class="ingestion-implications-desc" x="233" y="198">deletion.</text>
    <text class="ingestion-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="ingestion-implications-line ingestion-implications-conn ingestion-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#ingestion-implications-tip)"/>
  <g class="ingestion-implications-stage ingestion-implications-s2">
    <rect class="ingestion-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="ingestion-implications-step" x="422" y="142">03</text>
    <text class="ingestion-implications-name" x="448" y="142">Batch embedding; bound extraction</text>
    <text class="ingestion-implications-desc" x="422" y="166">A worker pool, so a burst</text>
    <text class="ingestion-implications-desc" x="422" y="182">of large files cannot</text>
    <text class="ingestion-implications-desc" x="422" y="198">exhaust memory.</text>
  </g>
  <line class="ingestion-implications-line ingestion-implications-conn ingestion-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#ingestion-implications-tip)"/>
  <g class="ingestion-implications-stage ingestion-implications-s3">
    <rect class="ingestion-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="ingestion-implications-step" x="611" y="142">04</text>
    <text class="ingestion-implications-name" x="637" y="142">Keep the state small</text>
    <text class="ingestion-implications-desc" x="611" y="166">A hash per document is</text>
    <text class="ingestion-implications-desc" x="611" y="182">bytes. Extracted text is</text>
    <text class="ingestion-implications-desc" x="611" y="198">a second corpus.</text>
    <text class="ingestion-implications-edge" x="611" y="242">scalability</text>
  </g>
  <line class="ingestion-implications-line ingestion-implications-conn ingestion-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#ingestion-implications-tip)"/>
  <g class="ingestion-implications-stage ingestion-implications-s4">
    <rect class="ingestion-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="ingestion-implications-step" x="800" y="142">05</text>
    <text class="ingestion-implications-name" x="826" y="142">Embedding is the largest line item</text>
    <text class="ingestion-implications-desc" x="800" y="166">Proportional to chunks</text>
    <text class="ingestion-implications-desc" x="800" y="182">processed, not documents</text>
    <text class="ingestion-implications-desc" x="800" y="198">changed.</text>
    <text class="ingestion-implications-edge" x="800" y="242">money</text>
  </g>
  <text class="ingestion-implications-sub" x="30" y="304">Parsing untrusted input is the security dimension people miss: a PDF or an archive is an attack surface, which is why extraction belongs under resource limits and ideally in a sandbox.</text>
</svg>
