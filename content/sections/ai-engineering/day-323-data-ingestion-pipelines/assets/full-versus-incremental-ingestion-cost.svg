<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-label="Full versus Incremental Ingestion Cost comparing a full rebuild that re-embeds every document each run against an incremental run that re-embeds only changed documents">
  <title>Full versus Incremental Ingestion Cost</title>
  <defs>
    <style>
      .d323b-bg { fill: #f8fafc; }
      .d323b-full { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d323b-inc { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d323b-axis { stroke: #94a3b8; stroke-width: 2px; }
      .d323b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d323b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d323b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d323b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d323b-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d323b-bg" />
  <text x="40" y="40" class="d323b-title">Full versus Incremental Ingestion Cost</text>
  <text x="40" y="64" class="d323b-subtitle">A corpus of 100,000 documents where roughly 500 change per day. Bars show documents embedded per run.</text>

  <line x1="90" y1="110" x2="90" y2="300" class="d323b-axis" />
  <line x1="90" y1="300" x2="840" y2="300" class="d323b-axis" />
  <text x="70" y="116" class="d323b-label" text-anchor="end">100k</text>
  <text x="70" y="210" class="d323b-label" text-anchor="end">50k</text>
  <text x="70" y="304" class="d323b-label" text-anchor="end">0</text>

  <rect x="130" y="112" width="70" height="188" class="d323b-full" />
  <rect x="240" y="112" width="70" height="188" class="d323b-full" />
  <rect x="350" y="112" width="70" height="188" class="d323b-full" />
  <text x="275" y="325" class="d323b-header" text-anchor="middle">Full rebuild — 100,000 per run</text>
  <text x="275" y="344" class="d323b-text" text-anchor="middle">run 1, run 2, run 3 all pay the same price</text>

  <rect x="520" y="112" width="70" height="188" class="d323b-inc" />
  <rect x="630" y="299" width="70" height="1" class="d323b-inc" />
  <rect x="740" y="299" width="70" height="1" class="d323b-inc" />
  <text x="665" y="325" class="d323b-header" text-anchor="middle">Incremental — 100,000 then ~500</text>
  <text x="665" y="344" class="d323b-text" text-anchor="middle">first run seeds; later runs embed only what changed</text>

  <text x="595" y="292" class="d323b-label" text-anchor="middle">~500</text>
  <text x="705" y="292" class="d323b-label" text-anchor="middle">~500</text>

  <text x="40" y="380" class="d323b-header">Why the difference is structural, not an optimisation</text>
  <text x="40" y="402" class="d323b-text">Incremental ingestion needs a content hash per document so "unchanged" is provable, and a stable chunk id so an upsert replaces</text>
  <text x="40" y="420" class="d323b-text">rather than duplicates. Without both, a re-run silently doubles the index — which is why correctness comes before the cost saving.</text>
</svg>
