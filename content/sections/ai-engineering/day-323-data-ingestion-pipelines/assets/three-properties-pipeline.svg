<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each names a mechanism.">
  <title>Three questions about the belt</title>
  <style>
    .three-properties-pipeline-bg   { fill: #f8fafc; }
    .three-properties-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-properties-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-properties-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-properties-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-properties-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-properties-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-properties-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-properties-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-properties-pipeline-stage { opacity: 1; }

    .three-properties-pipeline-s0 { animation-delay: 0.00s; }
    .three-properties-pipeline-e0 { animation-delay: 0.00s; }
    .three-properties-pipeline-s1 { animation-delay: 1.50s; }
    .three-properties-pipeline-e1 { animation-delay: 1.50s; }
    .three-properties-pipeline-s2 { animation-delay: 3.00s; }
    .three-properties-pipeline-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-properties-pipeline-conn  { animation: three-properties-pipeline-trace 6s ease-in-out infinite; }
      .three-properties-pipeline-stage { animation: three-properties-pipeline-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-properties-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-properties-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-properties-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-properties-pipeline-stage { animation: three-properties-pipeline-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-properties-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-properties-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-properties-pipeline-bg" width="980" height="322"/>
  <text class="three-properties-pipeline-h1"  x="30" y="40">Three questions about the belt</text>
  <text class="three-properties-pipeline-sub" x="30" y="64">Each names a mechanism.</text>
  <g class="three-properties-pipeline-stage three-properties-pipeline-s0">
    <rect class="three-properties-pipeline-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-properties-pipeline-step" x="44" y="142">01</text>
    <text class="three-properties-pipeline-name" x="70" y="142">If it stops halfway, where does it restart?</text>
    <text class="three-properties-pipeline-desc" x="44" y="166">Without a cursor, a job that fails at scale</text>
    <text class="three-properties-pipeline-desc" x="44" y="182">never finishes.</text>
    <text class="three-properties-pipeline-edge" x="44" y="242">resumability</text>
  </g>
  <line class="three-properties-pipeline-line three-properties-pipeline-conn three-properties-pipeline-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-properties-pipeline-tip)"/>
  <g class="three-properties-pipeline-stage three-properties-pipeline-s1">
    <rect class="three-properties-pipeline-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-properties-pipeline-step" x="359" y="142">02</text>
    <text class="three-properties-pipeline-name" x="385" y="142">If an item goes down twice, one output or two?</text>
    <text class="three-properties-pipeline-desc" x="359" y="166">Two is a corrupted index, invisible until a</text>
    <text class="three-properties-pipeline-desc" x="359" y="182">user sees a paragraph three times.</text>
    <text class="three-properties-pipeline-edge" x="359" y="242">idempotency</text>
  </g>
  <line class="three-properties-pipeline-line three-properties-pipeline-conn three-properties-pipeline-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-properties-pipeline-tip)"/>
  <g class="three-properties-pipeline-stage three-properties-pipeline-s2">
    <rect class="three-properties-pipeline-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-properties-pipeline-step" x="674" y="142">03</text>
    <text class="three-properties-pipeline-name" x="700" y="142">If one item is defective, does the belt stop?</text>
    <text class="three-properties-pipeline-desc" x="674" y="166">Halting couples ten thousand documents to the</text>
    <text class="three-properties-pipeline-desc" x="674" y="182">worst one.</text>
    <text class="three-properties-pipeline-edge" x="674" y="242">isolation</text>
  </g>
  <text class="three-properties-pipeline-sub" x="30" y="304">These three are what separate a script that loads documents from a pipeline you can schedule and forget, and every mechanism in the rest of the lesson implements one of them.</text>
</svg>
