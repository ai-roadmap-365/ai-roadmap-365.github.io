visuals:
  - id: ingestion-pipeline-stages-and-failure-boundaries
    file: assets/ingestion-pipeline-stages-and-failure-boundaries.svg
    type: diagram
    title: Ingestion Pipeline Stages and Failure Boundaries
    alt: Ingestion Pipeline Stages and Failure Boundaries showing Source Connector, Extract, Normalize,
      Chunk, Embed, and Index stages with a checkpoint store and a dead-letter queue
    description: Stage diagram showing where work flows forward, where failures divert to the dead-letter
      queue, and where progress is committed to the checkpoint store.
  - id: full-versus-incremental-ingestion-cost
    file: assets/full-versus-incremental-ingestion-cost.svg
    type: diagram
    title: Full versus Incremental Ingestion Cost
    alt: Full versus Incremental Ingestion Cost comparing a full rebuild that re-embeds every document
      each run against an incremental run that re-embeds only changed documents
    description: Bar comparison of documents embedded per run for a full rebuild versus an incremental
      pipeline over a corpus of one hundred thousand documents.
  - id: three-properties-pipeline
    file: assets/three-properties-pipeline.svg
    type: diagram
    title: 'Three questions about the belt'
    alt: 'Diagram: the three properties that make an ingestion pipeline production-grade'
    description: 'A three-stage description of pipeline properties covering resumability, idempotency and failure isolation.'
  - id: pipeline-or-script
    file: assets/pipeline-or-script.svg
    type: diagram
    title: 'A pipeline, or a loading script'
    alt: 'Diagram: a production ingestion pipeline compared with a document loading script'
    description: 'A two-column comparison of a stateful restartable pipeline against a script that loads documents.'
  - id: ingestion-lineage
    file: assets/ingestion-lineage.svg
    type: diagram
    title: 'Four eras of moving data'
    alt: 'Diagram: the progression from ETL to retrieval ingestion pipelines'
    description: 'A four-stage progression of data movement from ETL through streaming and change data capture to retrieval pipelines.'
  - id: pipeline-stages
    file: assets/pipeline-stages.svg
    type: diagram
    title: 'Six stages, in order'
    alt: 'Diagram: the six stages of a retrieval ingestion pipeline'
    description: 'A six-stage description of the ingestion pipeline covering the source cursor, extraction, normalisation, chunking, embedding and indexing.'
  - id: four-failures-ingest
    file: assets/four-failures-ingest.svg
    type: diagram
    title: 'Four failures, four mechanisms'
    alt: 'Diagram: the four ingestion failures and the mechanism that prevents each'
    description: 'A four-stage description of ingestion failures covering duplication on re-run, lost progress, poison records and index drift.'
  - id: librarian
    file: assets/librarian.svg
    type: diagram
    title: 'Two librarians, one crate'
    alt: 'Diagram: an ad-hoc shelving process compared with a catalogued one'
    description: 'A two-column comparison of shelving books without a catalogue system against shelving with catalogue numbers, a ledger and a repairs bin.'
  - id: incremental-economics
    file: assets/incremental-economics.svg
    type: diagram
    title: 'Full rebuild against incremental'
    alt: 'Diagram: the cost comparison of full and incremental ingestion runs'
    description: 'A four-stage comparison of full rebuild and incremental ingestion showing the invariants the saving depends on.'
  - id: shrinking-document
    file: assets/shrinking-document.svg
    type: diagram
    title: 'The document that shrinks'
    alt: 'Diagram: upserting a shrunk document with and without per-document reconciliation'
    description: 'A two-column comparison of upserting a document that produced fewer chunks with and without deleting the orphaned ones.'
  - id: ingestion-implications
    file: assets/ingestion-implications.svg
    type: diagram
    title: 'Five consequences of running a pipeline'
    alt: 'Diagram: the security, privacy, performance, scalability and cost implications of an ingestion pipeline'
    description: 'A five-stage description of ingestion implications covering credentials, redaction and deletion, batching, checkpoint size and embedding cost.'
  - id: idempotent-or-exactly-once
    file: assets/idempotent-or-exactly-once.svg
    type: diagram
    title: 'At-least-once plus idempotent'
    alt: 'Diagram: exactly-once delivery compared with at-least-once delivery plus idempotent writes'
    description: 'A two-column comparison of pursuing exactly-once delivery against combining at-least-once delivery with idempotent writes.'
  - id: pipeline-when
    file: assets/pipeline-when.svg
    type: diagram
    title: 'When to build a real pipeline'
    alt: 'Diagram: when an ingestion pipeline is warranted and when a full rebuild is better'
    description: 'A two-column comparison of situations requiring a real pipeline against those where full rebuilds are preferable.'
  - id: ingestion-not-migration
    file: assets/ingestion-not-migration.svg
    type: diagram
    title: 'Three things a pipeline is not'
    alt: 'Diagram: an ingestion pipeline compared with three things it is confused with'
    description: 'A two-column comparison of what an ingestion pipeline is against three common conflations.'
  - id: batch-or-streaming
    file: assets/batch-or-streaming.svg
    type: diagram
    title: 'Batch or streaming'
    alt: 'Diagram: batch ingestion compared with streaming ingestion'
    description: 'A two-column comparison of scheduled batch ingestion against per-event streaming ingestion.'
  - id: orchestrator-choice
    file: assets/orchestrator-choice.svg
    type: diagram
    title: 'When to adopt an orchestrator'
    alt: 'Diagram: the progression from hand-rolled ingestion to an orchestrator'
    description: 'A three-stage description of ingestion tooling choices from hand-rolled scripts through orchestrators to connector platforms.'
