visuals:
  - id: ingestion-pipeline-stages-and-failure-boundaries
    file: assets/ingestion-pipeline-stages-and-failure-boundaries.svg
    type: diagram
    title: Ingestion Pipeline Stages and Failure Boundaries
    alt: Ingestion Pipeline Stages and Failure Boundaries showing Source Connector, Extract, Normalize,
      Chunk, Embed, and Index stages with a checkpoint store and a dead-letter queue
    description: Stage diagram showing where work flows forward, where failures divert to the dead-letter
      queue, and where progress is committed to the checkpoint store.
  - id: full-versus-incremental-ingestion-cost
    file: assets/full-versus-incremental-ingestion-cost.svg
    type: diagram
    title: Full versus Incremental Ingestion Cost
    alt: Full versus Incremental Ingestion Cost comparing a full rebuild that re-embeds every document
      each run against an incremental run that re-embeds only changed documents
    description: Bar comparison of documents embedded per run for a full rebuild versus an incremental
      pipeline over a corpus of one hundred thousand documents.
