<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a classic path bug.">
  <title>Three hazards of serving data</title>
  <style>
    .resource-hazards-bg   { fill: #f8fafc; }
    .resource-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resource-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .resource-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .resource-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .resource-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .resource-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .resource-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .resource-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .resource-hazards-stage { opacity: 1; }

    .resource-hazards-s0 { animation-delay: 0.00s; }
    .resource-hazards-e0 { animation-delay: 0.00s; }
    .resource-hazards-s1 { animation-delay: 1.50s; }
    .resource-hazards-e1 { animation-delay: 1.50s; }
    .resource-hazards-s2 { animation-delay: 3.00s; }
    .resource-hazards-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .resource-hazards-conn  { animation: resource-hazards-trace 6s ease-in-out infinite; }
      .resource-hazards-stage { animation: resource-hazards-arrive 6s ease-in-out infinite; }
    }
    @keyframes resource-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes resource-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .resource-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .resource-hazards-stage { animation: resource-hazards-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes resource-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="resource-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="resource-hazards-bg" width="980" height="322"/>
  <text class="resource-hazards-h1"  x="30" y="40">Three hazards of serving data</text>
  <text class="resource-hazards-sub" x="30" y="64">One is a classic path bug.</text>
  <g class="resource-hazards-stage resource-hazards-s0">
    <rect class="resource-hazards-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="resource-hazards-step" x="44" y="142">01</text>
    <text class="resource-hazards-name" x="70" y="142">Directory traversal</text>
    <text class="resource-hazards-desc" x="44" y="166">file:///etc/passwd is a valid URI. Resolve</text>
    <text class="resource-hazards-desc" x="44" y="182">against an authorised root.</text>
    <text class="resource-hazards-edge" x="44" y="242">commonpath</text>
  </g>
  <line class="resource-hazards-line resource-hazards-conn resource-hazards-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#resource-hazards-tip)"/>
  <g class="resource-hazards-stage resource-hazards-s1">
    <rect class="resource-hazards-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="resource-hazards-step" x="359" y="142">02</text>
    <text class="resource-hazards-name" x="385" y="142">Memory spikes</text>
    <text class="resource-hazards-desc" x="359" y="166">A multi-gigabyte log read into one string.</text>
    <text class="resource-hazards-desc" x="359" y="182">Cap the payload, or chunk by range.</text>
  </g>
  <line class="resource-hazards-line resource-hazards-conn resource-hazards-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#resource-hazards-tip)"/>
  <g class="resource-hazards-stage resource-hazards-s2">
    <rect class="resource-hazards-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="resource-hazards-step" x="674" y="142">03</text>
    <text class="resource-hazards-name" x="700" y="142">Cache with invalidation</text>
    <text class="resource-hazards-desc" x="674" y="166">A TTL cache plus a file watcher, broadcasting</text>
    <text class="resource-hazards-desc" x="674" y="182">updates to subscribers.</text>
  </g>
  <text class="resource-hazards-sub" x="30" y="304">The third row is where the two halves meet: a cache without invalidation serves stale schemas, and invalidation without a cache re-reads disk on every request, so both are needed together.</text>
</svg>
