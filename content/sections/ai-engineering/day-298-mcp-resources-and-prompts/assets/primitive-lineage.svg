<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="REST, Slack, and a token problem.">
  <title>Where the primitives came from</title>
  <style>
    .primitive-lineage-bg   { fill: #f8fafc; }
    .primitive-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .primitive-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .primitive-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .primitive-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .primitive-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .primitive-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .primitive-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .primitive-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .primitive-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .primitive-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .primitive-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .primitive-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .primitive-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .primitive-lineage-stage { opacity: 1; }

    .primitive-lineage-s0 { animation-delay: 0.00s; }
    .primitive-lineage-e0 { animation-delay: 0.00s; }
    .primitive-lineage-s1 { animation-delay: 1.50s; }
    .primitive-lineage-e1 { animation-delay: 1.50s; }
    .primitive-lineage-s2 { animation-delay: 3.00s; }
    .primitive-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .primitive-lineage-conn  { animation: primitive-lineage-trace 6s ease-in-out infinite; }
      .primitive-lineage-stage { animation: primitive-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes primitive-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes primitive-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .primitive-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .primitive-lineage-stage { animation: primitive-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes primitive-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="primitive-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="primitive-lineage-bg" width="980" height="322"/>
  <text class="primitive-lineage-h1"  x="30" y="40">Where the primitives came from</text>
  <text class="primitive-lineage-sub" x="30" y="64">REST, Slack, and a token problem.</text>
  <g class="primitive-lineage-stage primitive-lineage-s0">
    <rect class="primitive-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="primitive-lineage-step" x="44" y="142">01</text>
    <text class="primitive-lineage-name" x="70" y="142">URIs, 2000</text>
    <text class="primitive-lineage-desc" x="44" y="166">Fielding's scheme://authority/path as the</text>
    <text class="primitive-lineage-desc" x="44" y="182">universal way to name a passive resource.</text>
  </g>
  <line class="primitive-lineage-line primitive-lineage-conn primitive-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#primitive-lineage-tip)"/>
  <g class="primitive-lineage-stage primitive-lineage-s1">
    <rect class="primitive-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="primitive-lineage-step" x="359" y="142">02</text>
    <text class="primitive-lineage-name" x="385" y="142">Slash commands, 2015-2020</text>
    <text class="primitive-lineage-desc" x="359" y="166">Complex API payloads made intuitive as</text>
    <text class="primitive-lineage-desc" x="359" y="182">user-invoked templates.</text>
  </g>
  <line class="primitive-lineage-line primitive-lineage-conn primitive-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#primitive-lineage-tip)"/>
  <g class="primitive-lineage-stage primitive-lineage-s2">
    <rect class="primitive-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="primitive-lineage-step" x="674" y="142">03</text>
    <text class="primitive-lineage-name" x="700" y="142">Separation, 2024</text>
    <text class="primitive-lineage-desc" x="674" y="166">Forcing data and templates through tool</text>
    <text class="primitive-lineage-desc" x="674" y="182">calling caused prompt bloat.</text>
  </g>
  <text class="primitive-lineage-sub" x="30" y="304">The third row is the motivation stated plainly: everything could have been a tool, and doing so made the tool catalogue unusable, which is a token-efficiency argument before it is an architectural one.</text>
</svg>
