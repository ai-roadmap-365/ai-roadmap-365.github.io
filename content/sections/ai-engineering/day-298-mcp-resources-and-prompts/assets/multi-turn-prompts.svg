<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which constrains the reasoning path.">
  <title>Prompts can pre-seed a conversation</title>
  <style>
    .multi-turn-prompts-bg   { fill: #f8fafc; }
    .multi-turn-prompts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-turn-prompts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-turn-prompts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-turn-prompts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-turn-prompts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-turn-prompts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multi-turn-prompts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multi-turn-prompts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multi-turn-prompts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multi-turn-prompts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multi-turn-prompts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multi-turn-prompts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multi-turn-prompts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multi-turn-prompts-stage { opacity: 1; }

    .multi-turn-prompts-s0 { animation-delay: 0.00s; }
    .multi-turn-prompts-e0 { animation-delay: 0.00s; }
    .multi-turn-prompts-s1 { animation-delay: 1.50s; }
    .multi-turn-prompts-e1 { animation-delay: 1.50s; }
    .multi-turn-prompts-s2 { animation-delay: 3.00s; }
    .multi-turn-prompts-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .multi-turn-prompts-conn  { animation: multi-turn-prompts-trace 6s ease-in-out infinite; }
      .multi-turn-prompts-stage { animation: multi-turn-prompts-arrive 6s ease-in-out infinite; }
    }
    @keyframes multi-turn-prompts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multi-turn-prompts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multi-turn-prompts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multi-turn-prompts-stage { animation: multi-turn-prompts-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multi-turn-prompts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multi-turn-prompts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multi-turn-prompts-bg" width="980" height="322"/>
  <text class="multi-turn-prompts-h1"  x="30" y="40">Prompts can pre-seed a conversation</text>
  <text class="multi-turn-prompts-sub" x="30" y="64">Which constrains the reasoning path.</text>
  <g class="multi-turn-prompts-stage multi-turn-prompts-s0">
    <rect class="multi-turn-prompts-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="multi-turn-prompts-step" x="44" y="142">01</text>
    <text class="multi-turn-prompts-name" x="70" y="142">Return a message array</text>
    <text class="multi-turn-prompts-desc" x="44" y="166">System, user and assistant turns, not a</text>
    <text class="multi-turn-prompts-desc" x="44" y="182">single string.</text>
  </g>
  <line class="multi-turn-prompts-line multi-turn-prompts-conn multi-turn-prompts-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#multi-turn-prompts-tip)"/>
  <g class="multi-turn-prompts-stage multi-turn-prompts-s1">
    <rect class="multi-turn-prompts-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="multi-turn-prompts-step" x="359" y="142">02</text>
    <text class="multi-turn-prompts-name" x="385" y="142">Pre-seed assistant turns</text>
    <text class="multi-turn-prompts-desc" x="359" y="166">Few-shot examples, or the first step of a</text>
    <text class="multi-turn-prompts-desc" x="359" y="182">required protocol.</text>
    <text class="multi-turn-prompts-edge" x="359" y="242">constraint</text>
  </g>
  <line class="multi-turn-prompts-line multi-turn-prompts-conn multi-turn-prompts-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#multi-turn-prompts-tip)"/>
  <g class="multi-turn-prompts-stage multi-turn-prompts-s2">
    <rect class="multi-turn-prompts-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="multi-turn-prompts-step" x="674" y="142">03</text>
    <text class="multi-turn-prompts-name" x="700" y="142">So the strategy is fixed</text>
    <text class="multi-turn-prompts-desc" x="674" y="166">Consistent output across different foundation</text>
    <text class="multi-turn-prompts-desc" x="674" y="182">models.</text>
  </g>
  <text class="multi-turn-prompts-sub" x="30" y="304">Pre-seeding an assistant turn is a strong constraint and worth using sparingly: it guarantees a shape, and it also forecloses approaches the model might have taken that were better.</text>
</svg>
