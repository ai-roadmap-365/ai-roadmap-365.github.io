terms:
- term: MCP Resource
  definition: A passive, read-only data entity exposed by an MCP server and addressed via a unique URI
    scheme.
- term: Resource URI
  definition: A standard Uniform Resource Identifier string (e.g. `file:///var/log/syslog` or `memo://recent-notes`)
    identifying a resource.
- term: MIME Type
  definition: A media type identifier (e.g. `text/plain`, `application/json`, `text/markdown`) indicating
    the data format of a resource.
- term: Resource Subscription
  definition: A client registration allowing an MCP client to receive push notifications whenever a target
    resource URI changes.
- term: MCP Prompt
  definition: A structured, parameterized prompt template exposed by a server for user-initiated workflows.
- term: Prompt Arguments
  definition: Named parameters required by a prompt template (e.g. `file_path`, `style`) provided by the
    user at invocation.
- term: Passive Context
  definition: Information attached to an LLM context window to provide background knowledge without model
    tool execution.
- term: Dynamic Resource Template
  definition: A URI pattern with variable wildcards (e.g. `customer://{id}`) allowing dynamic retrieval
    of parameterized data.
