visuals:
- id: mcp-three-primitives-tools-resources-prompts
  file: assets/mcp-three-primitives-tools-resources-prompts.svg
  type: diagram
  title: MCP Three Primitives Tools Resources Prompts
  alt: MCP Three Primitives Tools Resources Prompts diagram comparing model-controlled Tools, application-controlled
    Resources, and user-controlled Prompts
  description: Taxonomy diagram comparing the three primary MCP primitives and their control loops.
- id: mcp-resource-subscription-and-sync-lifecycle
  file: assets/mcp-resource-subscription-and-sync-lifecycle.svg
  type: diagram
  title: MCP Resource Subscription and Sync Lifecycle
  alt: MCP Resource Subscription and Sync Lifecycle sequence diagram showing resource discovery, read
    request, client subscription, update notification, and cache refresh
  description: Sequence diagram showing real-time resource synchronization and change notifications.
- id: three-primitives-compared
  file: assets/three-primitives-compared.svg
  type: diagram
  title: 'Three primitives, three owners'
  alt: 'Diagram: which actor initiates each MCP primitive'
  description: 'A three-stage description of MCP primitives distinguished by which actor decides to use them: the model, the client and the user.'
- id: resource-or-tool
  file: assets/resource-or-tool.svg
  type: diagram
  title: 'Model it as a resource, or a tool'
  alt: 'Diagram: the decision between exposing data as a resource and as a tool'
  description: 'A two-column comparison of criteria for modelling something as an MCP resource against criteria for modelling it as a tool.'
- id: primitive-lineage
  file: assets/primitive-lineage.svg
  type: diagram
  title: 'Where the primitives came from'
  alt: 'Diagram: the origins of MCP''s resource and prompt primitives'
  description: 'A three-stage progression from REST URIs through messaging slash commands to MCP''s separation of resources and prompts from tools.'
- id: context-hygiene
  file: assets/context-hygiene.svg
  type: diagram
  title: 'Three problems the split solves'
  alt: 'Diagram: the three problems solved by separating resources and prompts from tools'
  description: 'A three-stage description of the benefits of the resource and prompt primitives covering catalogue hygiene, live synchronisation and shared templates.'
- id: uri-templates
  file: assets/uri-templates.svg
  type: diagram
  title: 'Templates instead of enumeration'
  alt: 'Diagram: static resources compared with parameterised URI templates'
  description: 'A three-stage description of URI templates covering static resources, parameterised templates and the discovery call that exposes them.'
- id: cockpit
  file: assets/cockpit.svg
  type: diagram
  title: 'A cockpit'
  alt: 'Diagram: cockpit instruments as an analogy for the three MCP primitives'
  description: 'A two-column comparison mapping cockpit components onto MCP tools, resources and prompts.'
- id: multi-turn-prompts
  file: assets/multi-turn-prompts.svg
  type: diagram
  title: 'Prompts can pre-seed a conversation'
  alt: 'Diagram: how a prompt template pre-populates multiple conversational turns'
  description: 'A three-stage description of multi-turn prompt templates covering pre-populated user and assistant turns, few-shot demonstration and consistency across models.'
- id: resource-hazards
  file: assets/resource-hazards.svg
  type: diagram
  title: 'Three hazards of serving data'
  alt: 'Diagram: the traversal, memory and caching considerations of MCP resources'
  description: 'A three-stage description of resource hazards covering directory traversal, oversized payloads and cache invalidation.'
- id: resources-when
  file: assets/resources-when.svg
  type: diagram
  title: 'When to reach for each primitive'
  alt: 'Diagram: when to use resources and prompts rather than tools'
  description: 'A two-column comparison of situations calling for resources and prompts against those requiring tools.'
- id: binary-resources
  file: assets/binary-resources.svg
  type: diagram
  title: 'Serving binary resources'
  alt: 'Diagram: how binary resources are encoded and negotiated over MCP'
  description: 'A three-stage description of binary resource serving covering base64 encoding, MIME type declaration and multimodal client handling.'
- id: resources-not-executable
  file: assets/resources-not-executable.svg
  type: diagram
  title: 'What each primitive cannot do'
  alt: 'Diagram: the boundaries of MCP resources and prompts'
  description: 'A two-column comparison of what resources and prompts provide against the capabilities they deliberately lack.'
