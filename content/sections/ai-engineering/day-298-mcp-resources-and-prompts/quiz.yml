questions:
- question: What is the primary conceptual difference between an MCP Tool and an MCP Resource?
  options:
  - Tools are written in Python while Resources are written in C++
  - Resources can only contain JSON while Tools can only return plain text
  - 'Tools act and may have side effects; resources only supply data'
  - Tools require an internet connection while Resources are only local
  answer_index: 2
  explanation: Resources provide structured read-only context data identified by URIs without side effects,
    while Tools allow the model to take actions.
- question: Which URI scheme is recommended when an MCP server exposes database table contents as a resource?
  options:
  - '`ftp://anonymous@server`'
  - '`http://example.internal:8080/data`'
  - '`file:///dev/null`'
  - 'A hierarchical custom URI scheme'
  answer_index: 3
  explanation: MCP standardizes URI-based resource identification, enabling clients to parse domain-specific
    schemes cleanly.
- question: What is the purpose of the `prompts/list` and `prompts/get` endpoints in an MCP server?
  options:
  - 'To expose reusable parameterized prompt templates'
  - To benchmark GPU inference speeds
  - To encrypt system prompts
  - To delete prompt histories
  answer_index: 0
  explanation: Prompts in MCP are user-controlled workflow templates that define standard questions and
    inject context into the conversation.
- question: How does an MCP server inform connected clients that a dynamic resource (e.g. an active log
    file) has changed?
  options:
  - By restarting the server process
  - 'By sending a resources/updated notification'
  - By sending an HTTP 301 redirect
  - By deleting the client's cache
  answer_index: 1
  explanation: The `notifications/resources/updated` notification triggers clients to re-fetch the latest
    data if they are subscribed to that resource.
- question: What fields are required in an MCP Resource object returned by `resources/list`?
  options:
  - '`model_name`, `temperature`, `top_p`'
  - '`ip_address`, `port`, `password`'
  - 'uri and name, plus optional description'
  - '`binary_blob`, `hash`'
  answer_index: 2
  explanation: Each resource requires a unique `uri` string and human-readable `name`, along with optional
    metadata like `mimeType`.
