week: 43
learning_promise: 'Master the non-tool primitives of MCP: design URI-addressable Resources with MIME types,
  implement real-time change notifications, and author parameterized Prompt Templates for reusable agent
  workflows.'
objectives:
- Architect URI-addressable MCP Resources using standard scheme conventions (`file://`, `postgres://`,
  `memo://`).
- Implement MIME-type negotiation and binary vs text payload streaming for resources.
- Design dynamic resource change notifications (`notifications/resources/updated`) for live synchronization.
- Create parameterized Prompt Templates with typed arguments and multi-role message arrays.
- Evaluate the division of labor between passive Resources, active Tools, and interactive Prompts.
