questions:
- question: What is the primary benefit of building a personal MCP server tailored to your local developer
    workflow?
  options:
  - It replaces your operating system kernel
  - It reduces internet latency to zero
  - 'Any MCP client gets access to your own tools and notes'
  - It automatically writes all code without user supervision
  answer_index: 2
  explanation: A personal MCP server bridges personal developer tools, notes, and local environment workflows
    directly into AI interfaces.
- question: How do you configure a newly created Python MCP server to run inside Claude Desktop on macOS?
  options:
  - 'Delete all of the existing application caches first'
  - Copy the Python script to `/usr/bin`
  - Run a local web browser on port 80
  - 'Add an mcpServers entry to the Claude config file'
  answer_index: 3
  explanation: Claude Desktop reads server configurations from its JSON configuration file and spawns
    configured servers over stdio.
- question: Why should developer tools in a personal MCP server emit structured logs to `stderr` rather
    than `stdout`?
  options:
  - 'stdout carries the protocol frames, so prints corrupt it'
  - Because stderr is faster than stdout
  - Because stdout is disabled in Python
  - Because stderr encrypts data automatically
  answer_index: 0
  explanation: In stdio-based protocols, stdout carries JSON-RPC protocol messages only. Debug logs must
    always go to stderr.
- question: Which of the following is a recommended architecture for managing persistent state inside
    a personal MCP server?
  options:
  - Global in-memory dictionaries that reset on every process restart
  - 'A SQLite file in the app data directory'
  - Sending data via unencrypted emails
  - Writing text to random temporary files
  answer_index: 1
  explanation: An embedded SQLite database provides reliable, persistent storage that survives server
    restarts and supports concurrent queries.
- question: What is the role of an MCP Prompt Template like `/standup` in a personal server?
  options:
  - To benchmark GPU clock speed
  - To play audio notifications
  - 'To gather commits and todos into a standup prompt'
  - To format JSON files with prettier
  answer_index: 2
  explanation: Prompt templates automate repetitive daily workflows by gathering contextual data and framing
    standard prompts.
