learning_promise: Design, implement, package, and deploy a production-grade personal MCP server integrating
  custom developer tools, live workspace resources, and workflow prompt templates configured for desktop
  AI assistants and autonomous CLI agents.
objectives:
- Architect a cohesive Personal MCP Server combining Tools, Resources, and Prompts in a single unified
  service.
- Implement developer productivity tools (Git commit history, SQLite memo database, system telemetry).
- Expose live workspace status and project documentation via standard URI resources (`memo://`, `git://`).
- Create reusable workflow prompt templates (`/standup`, `/code-audit`).
- Package and configure the server for integration with Claude Desktop, Cursor, and custom Python agents.
