<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Gauges, controls and driving modes.">
  <title>A vehicle's onboard computer</title>
  <style>
    .car-dashboard-bg   { fill: #f8fafc; }
    .car-dashboard-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-dashboard-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-dashboard-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-dashboard-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-dashboard-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-dashboard-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .car-dashboard-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .car-dashboard-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .car-dashboard-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .car-dashboard-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .car-dashboard-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .car-dashboard-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .car-dashboard-row { opacity: 1; }
    .car-dashboard-r0 { animation-delay: 0.00s; }
    .car-dashboard-r1 { animation-delay: 0.45s; }
    .car-dashboard-r2 { animation-delay: 0.90s; }
    .car-dashboard-r3 { animation-delay: 1.35s; }
    .car-dashboard-r4 { animation-delay: 1.80s; }
    .car-dashboard-row { animation: car-dashboard-reveal 7.3s ease-in-out infinite; }
    @keyframes car-dashboard-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="car-dashboard-bg" width="980" height="390"/>
  <text class="car-dashboard-h1"  x="30" y="40">A vehicle's onboard computer</text>
  <text class="car-dashboard-sub" x="30" y="64">Gauges, controls and driving modes.</text>
  <rect class="car-dashboard-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="car-dashboard-name" x="46" y="122">The vehicle</text>
  <text class="car-dashboard-desc" x="46" y="142">One bus, three interfaces.</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r0" x="46" y="182">GPS, speedometer, tyre sensors on one bus</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r1" x="46" y="216">The driver reads the dashboard</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r2" x="46" y="250">Presses climate controls</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r3" x="46" y="284">Selects Eco or Sport mode</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r4" x="46" y="318">Everything wired to one system</text>
  <rect class="car-dashboard-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="car-dashboard-name" x="526" y="122">The server</text>
  <text class="car-dashboard-desc" x="526" y="142">The same three.</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r0" x="526" y="182">Notes, git state and telemetry on one protocol</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r1" x="526" y="216">Resources are read</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r2" x="526" y="250">Tools are invoked</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r3" x="526" y="284">Prompts are chosen</text>
  <text class="car-dashboard-desc car-dashboard-row car-dashboard-r4" x="526" y="318">One daemon behind all of it</text>
  <text class="car-dashboard-sub" x="30" y="372">The shared bus is the point of the analogy: the value is not any single gauge, it is that everything reports through one interface the driver already knows how to read.</text>
</svg>
