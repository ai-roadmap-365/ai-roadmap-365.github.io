<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when the pattern does not fit.">
  <title>When to build one</title>
  <style>
    .personal-server-when-bg   { fill: #f8fafc; }
    .personal-server-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .personal-server-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .personal-server-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .personal-server-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .personal-server-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .personal-server-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .personal-server-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .personal-server-when-row { opacity: 1; }
    .personal-server-when-r0 { animation-delay: 0.00s; }
    .personal-server-when-r1 { animation-delay: 0.45s; }
    .personal-server-when-r2 { animation-delay: 0.90s; }
    .personal-server-when-r3 { animation-delay: 1.35s; }
    .personal-server-when-r4 { animation-delay: 1.80s; }
    .personal-server-when-row { animation: personal-server-when-reveal 7.3s ease-in-out infinite; }
    @keyframes personal-server-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="personal-server-when-bg" width="980" height="390"/>
  <text class="personal-server-when-h1"  x="30" y="40">When to build one</text>
  <text class="personal-server-when-sub" x="30" y="64">And when the pattern does not fit.</text>
  <rect class="personal-server-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="personal-server-when-name" x="46" y="122">Build one</text>
  <text class="personal-server-when-desc" x="46" y="142">Personal, persistent, repeated.</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r0" x="46" y="182">Persistent memory of notes and tasks</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r1" x="46" y="216">Repeated developer workflows</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r2" x="46" y="250">Project state you keep re-checking</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r3" x="46" y="284">Anything you have written a shell alias for</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r4" x="46" y="318">Auto-reload during development</text>
  <rect class="personal-server-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="personal-server-when-name" x="526" y="122">Do not</text>
  <text class="personal-server-when-desc" x="526" y="142">Multi-tenant scale.</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r0" x="526" y="182">A cloud SaaS with thousands of users</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r1" x="526" y="216">Concurrent multi-tenant state</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r2" x="526" y="250">SQLite is the wrong store there</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r3" x="526" y="284">Use distributed services instead</text>
  <text class="personal-server-when-desc personal-server-when-row personal-server-when-r4" x="526" y="318">This is a workstation daemon</text>
  <text class="personal-server-when-sub" x="30" y="372">"Anything you have written a shell alias for" is a good first list: those are already the commands you run often enough to have automated once, and they are now available to every AI client at the same time.</text>
</svg>
