<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Personal MCP Server Complete System Topology">
  <title>Personal MCP Server Complete System Topology</title>
  <defs>
    <style>
      .d301a-bg { fill: #f8fafc; }
      .d301a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d301a-core { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d301a-db { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d301a-git { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d301a-cli { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d301a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d301a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d301a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d301a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d301a-pipe { stroke: #3b82f6; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d301a-bg" />
  
  <text x="40" y="40" class="d301a-title">Personal MCP Server: System Topology</text>
  <text x="40" y="65" class="d301a-subtitle">Personal MCP Server Complete System Topology diagram showing Claude Desktop, Terminal Client, Personal MCP Server Core, SQLite DB, Local Git, and System Telemetry</text>
  
  <rect x="40" y="100" width="200" height="130" class="d301a-cli" />
  <text x="55" y="125" class="d301a-header" fill="#a16207">Host Clients</text>
  <text x="55" y="150" class="d301a-text">• Claude Desktop App</text>
  <text x="55" y="170" class="d301a-text">• Cursor / Zed Editor</text>
  <text x="55" y="190" class="d301a-text">• Python Autonomous CLI</text>
  <text x="55" y="210" class="d301a-text">(Communicates via stdio)</text>
  
  <rect x="290" y="100" width="310" height="300" class="d301a-core" />
  <text x="310" y="130" class="d301a-header" fill="#1d4ed8">Personal MCP Server Core (Python)</text>
  
  <text x="310" y="160" class="d301a-text" font-weight="600">1. Tools (Actions):</text>
  <text x="310" y="180" class="d301a-text">• `save_memo(title, body, tags)`</text>
  <text x="310" y="195" class="d301a-text">• `search_memos(keyword)`</text>
  <text x="310" y="210" class="d301a-text">• `get_system_telemetry()`</text>
  
  <text x="310" y="240" class="d301a-text" font-weight="600">2. Resources (Live State):</text>
  <text x="310" y="260" class="d301a-text">• `memo://recent-notes`</text>
  <text x="310" y="275" class="d301a-text">• `git://workspace/status`</text>
  <text x="310" y="290" class="d301a-text">• `sys://telemetry/cpu`</text>
  
  <text x="310" y="320" class="d301a-text" font-weight="600">3. Prompts (Workflows):</text>
  <text x="310" y="340" class="d301a-text">• `/standup` (Gathers commits + todos)</text>
  <text x="310" y="355" class="d301a-text">• `/code-audit {path}`</text>
  
  <rect x="650" y="100" width="210" height="85" class="d301a-db" />
  <text x="665" y="125" class="d301a-header" fill="#15803d">Persistent SQLite Store</text>
  <text x="665" y="145" class="d301a-text">Path: `~/.personal_mcp/memos.db`</text>
  <text x="665" y="165" class="d301a-text">Tables: `memos`, `todos`, `tags`</text>
  
  <rect x="650" y="205" width="210" height="85" class="d301a-git" />
  <text x="665" y="230" class="d301a-header" fill="#7e22ce">Local Git Repository</text>
  <text x="665" y="250" class="d301a-text">Inspects: commit history, diffs</text>
  <text x="665" y="270" class="d301a-text">Branch tracking &amp; staged files</text>
  
  <rect x="650" y="310" width="210" height="85" class="d301a-card" />
  <text x="665" y="335" class="d301a-header">Local OS Telemetry</text>
  <text x="665" y="355" class="d301a-text">CPU load, memory availability,</text>
  <text x="665" y="375" class="d301a-text">disk space, active background jobs</text>
  
  <path d="M 240 160 L 290 160" class="d301a-pipe" />
  <path d="M 600 140 L 650 140" class="d301a-pipe" />
  <path d="M 600 245 L 650 245" class="d301a-pipe" />
  <path d="M 600 350 L 650 350" class="d301a-pipe" />
</svg>