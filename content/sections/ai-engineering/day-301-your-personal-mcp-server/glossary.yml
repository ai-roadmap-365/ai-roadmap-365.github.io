terms:
- term: Personal MCP Server
  definition: A custom MCP server designed for an individual developer's local tools, repositories, and
    notes.
- term: claude_desktop_config.json
  definition: The standard configuration file configuring MCP server subprocesses for Claude Desktop.
- term: Developer Telemetry
  definition: System metrics (disk space, git status, active processes) exposed to AI assistants via MCP.
- term: Persistent Memo Store
  definition: A local database storing notes, tasks, and memory snippets accessible via MCP tools and
    resources.
- term: Standard Error Logging
  definition: Directing debug information to `sys.stderr` to keep `sys.stdout` clean for JSON-RPC frames.
- term: FastMCP Server
  definition: A high-level Python framework for building MCP servers with minimal boilerplate decorators.
- term: Workflow Automation
  definition: Using MCP prompt templates to streamline daily developer tasks like code reviews and standups.
- term: Package Entrypoint
  definition: A console script entrypoint defined in `pyproject.toml` enabling terminal CLI execution
    of the server.
