terms:
- term: Pure Python Agent
  definition: An agent runtime implemented using only the Python standard library with zero external dependencies.
- term: Sliding Window Compactor
  definition: A memory strategy that maintains essential system prompts and recent turns while dropping
    old intermediate noise.
- term: Regex Stream Extractor
  definition: Regular expressions that identify Thought, Action, and Final Answer sections in model responses.
- term: Action Hash
  definition: A cryptographic or string hash of an action payload used for cycle detection.
- term: Trajectory History
  definition: The complete chronological sequence of states, thoughts, actions, and observations in an
    execution run.
- term: Deterministic Dispatcher
  definition: A dispatcher routing validated tool calls directly to their target Python callable.
- term: Zero-Dependency
  definition: Software built entirely with core language primitives, ensuring maximum portability and
    minimal attack surface.
- term: State Serialization
  definition: Converting an agent's memory and execution state into JSON for persistence or network transmission.
