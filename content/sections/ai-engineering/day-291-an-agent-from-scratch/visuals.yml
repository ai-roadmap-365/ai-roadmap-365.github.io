visuals:
- id: zero-dependency-agent-scratchpad-architecture
  file: assets/zero-dependency-agent-scratchpad-architecture.svg
  type: diagram
  title: Zero Dependency Agent Scratchpad Architecture
  alt: Zero Dependency Agent Scratchpad Architecture illustrating System Prompt, Dynamic Scratchpad Buffer,
    Tool Registry, and Execution Dispatcher
  description: System architecture diagram illustrating the components of a zero-dependency agent.
- id: agent-short-term-memory-sliding-window
  file: assets/agent-short-term-memory-sliding-window.svg
  type: diagram
  title: Agent Short Term Memory Sliding Window
  alt: Agent Short Term Memory Sliding Window diagram showing system prompt preservation, middle step
    truncation, and recent turn retention
  description: Diagram illustrating sliding window memory management in long-horizon agent execution.
- id: scratch-components
  file: assets/scratch-components.svg
  type: diagram
  title: 'What you build, and what it is made of'
  alt: 'Diagram: the six components of a zero-dependency agent runtime'
  description: 'A six-stage description of a from-scratch agent covering prompt assembly, parsing, dispatch, sandboxing, memory compaction and stopping predicates.'
- id: scooter-or-bike
  file: assets/scooter-or-bike.svg
  type: diagram
  title: 'A sealed shell, or wired by hand'
  alt: 'Diagram: a pre-built enclosed vehicle compared with one assembled from components'
  description: 'A two-column comparison of a sealed pre-built machine against one assembled from known components, as an analogy for frameworks and scratch builds.'
- id: framework-pendulum
  file: assets/framework-pendulum.svg
  type: diagram
  title: 'The framework pendulum'
  alt: 'Diagram: the swing from monolithic agent frameworks back to explicit loops'
  description: 'A two-column comparison of the 2022-2023 framework era against the 2024 return to lightweight explicit architectures.'
- id: not-a-toy
  file: assets/not-a-toy.svg
  type: diagram
  title: 'Zero dependency is not zero safety'
  alt: 'Diagram: what a from-scratch agent includes compared with three misconceptions'
  description: 'A two-column comparison of a production-grade scratch build against assumptions that it is a toy, anti-library, or a single prompt.'
- id: why-scratch
  file: assets/why-scratch.svg
  type: diagram
  title: 'Four reasons to own the loop'
  alt: 'Diagram: the four engineering arguments for building the agent loop yourself'
  description: 'A four-stage description of the reasons to build a scratch agent covering CVE exposure, token transparency, exception handling and offline testing.'
- id: sliding-window
  file: assets/sliding-window.svg
  type: diagram
  title: 'Keeping the scratchpad bounded'
  alt: 'Diagram: how a sliding window compacts an agent''s scratchpad'
  description: 'A three-stage description of context compaction covering the preserved head, the compacted middle and the raw recent turns.'
- id: watchmaker
  file: assets/watchmaker.svg
  type: diagram
  title: 'A sealed microchip, or brass gears'
  alt: 'Diagram: a disposable digital watch compared with a mechanical chronometer'
  description: 'A two-column comparison of a sealed digital device against a hand-assembled mechanical one, as an analogy for opaque and transparent systems.'
- id: telemetry-and-state
  file: assets/telemetry-and-state.svg
  type: diagram
  title: 'Telemetry and resumable state'
  alt: 'Diagram: in-process telemetry and JSON state serialisation for agent resumption'
  description: 'A four-stage description of production concerns in a scratch agent covering ring-buffer telemetry, JSON state serialisation, crash resumption and the pickle hazard.'
- id: safe-eval
  file: assets/safe-eval.svg
  type: diagram
  title: 'Evaluating an expression safely'
  alt: 'Diagram: evaluating a model-supplied expression with and without builtins available'
  description: 'A two-column comparison of evaluating an expression with the default namespace against one with builtins stripped.'
- id: scratch-when
  file: assets/scratch-when.svg
  type: diagram
  title: 'When to build it yourself'
  alt: 'Diagram: when a zero-dependency agent is the right choice'
  description: 'A two-column comparison of situations favouring a scratch-built agent against those favouring an ecosystem framework.'
- id: scratch-testability
  file: assets/scratch-testability.svg
  type: diagram
  title: 'What owning the loop buys'
  alt: 'Diagram: the transparency, performance and testability properties of a scratch agent'
  description: 'A three-stage description of the measurable benefits of a from-scratch agent runtime.'
