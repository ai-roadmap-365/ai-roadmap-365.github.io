<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is replaced; one is repaired.">
  <title>A sealed microchip, or brass gears</title>
  <style>
    .watchmaker-bg   { fill: #f8fafc; }
    .watchmaker-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .watchmaker-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .watchmaker-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .watchmaker-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .watchmaker-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .watchmaker-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .watchmaker-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .watchmaker-row { opacity: 1; }
    .watchmaker-r0 { animation-delay: 0.00s; }
    .watchmaker-r1 { animation-delay: 0.45s; }
    .watchmaker-r2 { animation-delay: 0.90s; }
    .watchmaker-r3 { animation-delay: 1.35s; }
    .watchmaker-r4 { animation-delay: 1.80s; }
    .watchmaker-row { animation: watchmaker-reveal 7.3s ease-in-out infinite; }
    @keyframes watchmaker-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="watchmaker-bg" width="980" height="390"/>
  <text class="watchmaker-h1"  x="30" y="40">A sealed microchip, or brass gears</text>
  <text class="watchmaker-sub" x="30" y="64">One is replaced; one is repaired.</text>
  <rect class="watchmaker-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="watchmaker-name" x="46" y="122">The sealed chip</text>
  <text class="watchmaker-desc" x="46" y="142">Made elsewhere.</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r0" x="46" y="182">Pre-programmed, in a distant factory</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r1" x="46" y="216">One failed transistor ends it</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r2" x="46" y="250">Nothing is serviceable</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r3" x="46" y="284">Cheap, and adequate</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r4" x="46" y="318">Replaced rather than repaired</text>
  <rect class="watchmaker-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="watchmaker-name" x="526" y="122">Brass and ruby</text>
  <text class="watchmaker-desc" x="526" y="142">Assembled by hand.</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r0" x="526" y="182">Every gear's tooth count known</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r1" x="526" y="216">Mainspring tension known</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r2" x="526" y="250">Jewel friction accounted for</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r3" x="526" y="284">Serviceable indefinitely</text>
  <text class="watchmaker-desc watchmaker-row watchmaker-r4" x="526" y="318">Repaired rather than replaced</text>
  <text class="watchmaker-sub" x="30" y="372">The analogy is about knowledge rather than quality: the digital watch keeps better time, and only one of the two can be understood by the person responsible for it.</text>
</svg>
