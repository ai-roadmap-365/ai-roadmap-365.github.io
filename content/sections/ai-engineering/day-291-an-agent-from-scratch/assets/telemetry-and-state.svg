<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two things a scratch build must add.">
  <title>Telemetry and resumable state</title>
  <style>
    .telemetry-and-state-bg   { fill: #f8fafc; }
    .telemetry-and-state-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-and-state-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-and-state-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-and-state-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-and-state-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-and-state-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .telemetry-and-state-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .telemetry-and-state-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .telemetry-and-state-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .telemetry-and-state-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .telemetry-and-state-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .telemetry-and-state-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .telemetry-and-state-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .telemetry-and-state-stage { opacity: 1; }

    .telemetry-and-state-s0 { animation-delay: 0.00s; }
    .telemetry-and-state-e0 { animation-delay: 0.00s; }
    .telemetry-and-state-s1 { animation-delay: 1.28s; }
    .telemetry-and-state-e1 { animation-delay: 1.28s; }
    .telemetry-and-state-s2 { animation-delay: 2.56s; }
    .telemetry-and-state-e2 { animation-delay: 2.56s; }
    .telemetry-and-state-s3 { animation-delay: 3.84s; }
    .telemetry-and-state-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .telemetry-and-state-conn  { animation: telemetry-and-state-trace 6.4s ease-in-out infinite; }
      .telemetry-and-state-stage { animation: telemetry-and-state-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes telemetry-and-state-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes telemetry-and-state-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .telemetry-and-state-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .telemetry-and-state-stage { animation: telemetry-and-state-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes telemetry-and-state-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="telemetry-and-state-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="telemetry-and-state-bg" width="980" height="322"/>
  <text class="telemetry-and-state-h1"  x="30" y="40">Telemetry and resumable state</text>
  <text class="telemetry-and-state-sub" x="30" y="64">Two things a scratch build must add.</text>
  <g class="telemetry-and-state-stage telemetry-and-state-s0">
    <rect class="telemetry-and-state-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-and-state-step" x="44" y="142">01</text>
    <text class="telemetry-and-state-name" x="70" y="142">An in-memory ring buffer</text>
    <text class="telemetry-and-state-desc" x="44" y="166">Timestamps, token estimates and</text>
    <text class="telemetry-and-state-desc" x="44" y="182">tool payloads, without logging</text>
    <text class="telemetry-and-state-desc" x="44" y="198">I/O locks.</text>
  </g>
  <line class="telemetry-and-state-line telemetry-and-state-conn telemetry-and-state-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#telemetry-and-state-tip)"/>
  <g class="telemetry-and-state-stage telemetry-and-state-s1">
    <rect class="telemetry-and-state-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-and-state-step" x="280" y="142">02</text>
    <text class="telemetry-and-state-name" x="306" y="142">Serialise state to canonical JSON</text>
    <text class="telemetry-and-state-desc" x="280" y="166">Or a SQLite WAL database. Never</text>
    <text class="telemetry-and-state-desc" x="280" y="182">pickle.</text>
    <text class="telemetry-and-state-edge" x="280" y="242">Day 347</text>
  </g>
  <line class="telemetry-and-state-line telemetry-and-state-conn telemetry-and-state-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#telemetry-and-state-tip)"/>
  <g class="telemetry-and-state-stage telemetry-and-state-s2">
    <rect class="telemetry-and-state-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-and-state-step" x="516" y="142">03</text>
    <text class="telemetry-and-state-name" x="542" y="142">So a crash at step 5 resumes</text>
    <text class="telemetry-and-state-desc" x="516" y="166">A replacement worker reads the</text>
    <text class="telemetry-and-state-desc" x="516" y="182">state and continues from step 6.</text>
  </g>
  <line class="telemetry-and-state-line telemetry-and-state-conn telemetry-and-state-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#telemetry-and-state-tip)"/>
  <g class="telemetry-and-state-stage telemetry-and-state-s3">
    <rect class="telemetry-and-state-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-and-state-step" x="752" y="142">04</text>
    <text class="telemetry-and-state-name" x="778" y="142">Without repeating mutations</text>
    <text class="telemetry-and-state-desc" x="752" y="166">Which is why idempotency keys</text>
    <text class="telemetry-and-state-desc" x="752" y="182">and state persistence belong</text>
    <text class="telemetry-and-state-desc" x="752" y="198">together.</text>
  </g>
  <text class="telemetry-and-state-sub" x="30" y="304">The pickle prohibition is the same one as for model weights and for the same reason: a state file is an input, and an input that executes code on load is a remote code execution primitive.</text>
</svg>
