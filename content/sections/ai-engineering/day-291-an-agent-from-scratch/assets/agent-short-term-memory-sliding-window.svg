<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img">
  <title>Agent Short Term Memory Sliding Window</title>
  <defs>
    <style>
      .d291f-bg { fill: #f8fafc; }
      .d291f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d291f-sys { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d291f-trunc { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; stroke-dasharray: 4,4; rx: 8px; }
      .d291f-recent { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d291f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d291f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d291f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d291f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d291f-bg" />
  
  <text x="40" y="40" class="d291f-title">Agent Short-Term Memory Sliding Window</text>
  <text x="40" y="65" class="d291f-subtitle">Agent Short Term Memory Sliding Window diagram showing system prompt preservation, middle step truncation, and recent turn retention</text>
  
  <!-- System Prompt (Always Kept) -->
  <rect x="40" y="110" width="240" height="280" class="d291f-sys" />
  <text x="55" y="140" class="d291f-header" fill="#1d4ed8">Pinned Base Prompt</text>
  <text x="55" y="165" class="d291f-text">• System Role &amp; Rules</text>
  <text x="55" y="185" class="d291f-text">• Tool Definitions</text>
  <text x="55" y="205" class="d291f-text">• User Goal / Objective</text>
  <text x="55" y="245" class="d291f-text" font-weight="600">Preservation: 100%</text>
  <text x="55" y="265" class="d291f-text">Never truncated or dropped</text>
  
  <!-- Truncated Middle History -->
  <rect x="330" y="110" width="240" height="280" class="d291f-trunc" />
  <text x="345" y="140" class="d291f-header" fill="#b91c1c">Truncated History (Turns 1-5)</text>
  <text x="345" y="165" class="d291f-text">• Turn 1 (Obs: 4,000 chars)</text>
  <text x="345" y="185" class="d291f-text">• Turn 2 (Obs: 2,500 chars)</text>
  <text x="345" y="205" class="d291f-text">• Turn 3 (Obs: 6,000 chars)</text>
  <text x="345" y="245" class="d291f-text" font-weight="600" fill="#b91c1c">Compaction Action:</text>
  <text x="345" y="265" class="d291f-text">Summarized into 2-line brief</text>
  <text x="345" y="280" class="d291f-text">Saves 85% prompt tokens</text>
  
  <!-- Recent Active Window -->
  <rect x="620" y="110" width="240" height="280" class="d291f-recent" />
  <text x="635" y="140" class="d291f-header" fill="#15803d">Active Window (Turns 6-8)</text>
  <text x="635" y="165" class="d291f-text">• Turn 6 (Recent Thought)</text>
  <text x="635" y="185" class="d291f-text">• Turn 7 (Action + Return)</text>
  <text x="635" y="205" class="d291f-text">• Turn 8 (Current Thought)</text>
  <text x="635" y="245" class="d291f-text" font-weight="600" fill="#15803d">Full Fidelity:</text>
  <text x="635" y="265" class="d291f-text">Exact quotes &amp; raw values</text>
  <text x="635" y="280" class="d291f-text">Enables immediate reasoning</text>
</svg>