<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are security; two are cost.">
  <title>Four reasons to own the loop</title>
  <style>
    .why-scratch-bg   { fill: #f8fafc; }
    .why-scratch-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scratch-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scratch-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scratch-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scratch-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scratch-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-scratch-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-scratch-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-scratch-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-scratch-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-scratch-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-scratch-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .why-scratch-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .why-scratch-stage { opacity: 1; }

    .why-scratch-s0 { animation-delay: 0.00s; }
    .why-scratch-e0 { animation-delay: 0.00s; }
    .why-scratch-s1 { animation-delay: 1.28s; }
    .why-scratch-e1 { animation-delay: 1.28s; }
    .why-scratch-s2 { animation-delay: 2.56s; }
    .why-scratch-e2 { animation-delay: 2.56s; }
    .why-scratch-s3 { animation-delay: 3.84s; }
    .why-scratch-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .why-scratch-conn  { animation: why-scratch-trace 6.4s ease-in-out infinite; }
      .why-scratch-stage { animation: why-scratch-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes why-scratch-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes why-scratch-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .why-scratch-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .why-scratch-stage { animation: why-scratch-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes why-scratch-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="why-scratch-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="why-scratch-bg" width="980" height="322"/>
  <text class="why-scratch-h1"  x="30" y="40">Four reasons to own the loop</text>
  <text class="why-scratch-sub" x="30" y="64">Two are security; two are cost.</text>
  <g class="why-scratch-stage why-scratch-s0">
    <rect class="why-scratch-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="why-scratch-step" x="44" y="142">01</text>
    <text class="why-scratch-name" x="70" y="142">Zero transitive CVE exposure</text>
    <text class="why-scratch-desc" x="44" y="166">No unmaintained scraper or</text>
    <text class="why-scratch-desc" x="44" y="182">outdated XML parser pulled in</text>
    <text class="why-scratch-desc" x="44" y="198">behind you.</text>
    <text class="why-scratch-edge" x="44" y="242">audit</text>
  </g>
  <line class="why-scratch-line why-scratch-conn why-scratch-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#why-scratch-tip)"/>
  <g class="why-scratch-stage why-scratch-s1">
    <rect class="why-scratch-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="why-scratch-step" x="280" y="142">02</text>
    <text class="why-scratch-name" x="306" y="142">Every token accounted for</text>
    <text class="why-scratch-desc" x="280" y="166">Hidden boilerplate inflates</text>
    <text class="why-scratch-desc" x="280" y="182">input by 30-50%, invisibly.</text>
    <text class="why-scratch-edge" x="280" y="242">money</text>
  </g>
  <line class="why-scratch-line why-scratch-conn why-scratch-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#why-scratch-tip)"/>
  <g class="why-scratch-stage why-scratch-s2">
    <rect class="why-scratch-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="why-scratch-step" x="516" y="142">03</text>
    <text class="why-scratch-name" x="542" y="142">Exceptions you defined</text>
    <text class="why-scratch-desc" x="516" y="166">Not an OutputParserException</text>
    <text class="why-scratch-desc" x="516" y="182">from three layers down.</text>
  </g>
  <line class="why-scratch-line why-scratch-conn why-scratch-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#why-scratch-tip)"/>
  <g class="why-scratch-stage why-scratch-s3">
    <rect class="why-scratch-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="why-scratch-step" x="752" y="142">04</text>
    <text class="why-scratch-name" x="778" y="142">Deterministic offline tests</text>
    <text class="why-scratch-desc" x="752" y="166">Mock the gateway; hundreds of</text>
    <text class="why-scratch-desc" x="752" y="182">trajectory tests in under two</text>
    <text class="why-scratch-desc" x="752" y="198">seconds.</text>
    <text class="why-scratch-edge" x="752" y="242">no API key</text>
  </g>
  <text class="why-scratch-sub" x="30" y="304">The last is the one that changes daily development most: an agent whose model call is a function you can stub becomes ordinary software, testable in CI without a network or a budget.</text>
</svg>
