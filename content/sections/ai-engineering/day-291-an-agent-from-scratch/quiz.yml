questions:
- question: Why is building an agent from scratch without high-level frameworks valuable for production
    engineering?
  options:
  - 'Full control of prompt, errors, budget, and state'
  - It makes the Python script run faster than C++
  - Frameworks are forbidden in all enterprise companies
  - It eliminates the need for unit tests
  answer_index: 0
  explanation: Scratch implementations demystify agent loops and provide maximum transparency and customization
    for production needs.
- question: What is the purpose of sliding window memory compaction in an agent's working scratchpad?
  options:
  - To delete all user messages
  - 'Keep the system prompt and recent turns, prune the rest'
  - To encrypt the conversation history
  - To increase the temperature parameter
  answer_index: 1
  explanation: Sliding window memory prevents context overflow on extended multi-turn execution trajectories.
- question: How does cycle detection identify that an agent is caught in a repetitive loop?
  options:
  - By checking if CPU utilization reaches 100%
  - By listening to audio signals
  - 'Hash the thought-action tuple and look for a repeat'
  - 'By counting the number of vowels in the whole prompt'
  answer_index: 2
  explanation: Hashing recent action states exposes repetitive non-progress loops so the runtime can abort
    or intervene.
- question: What is the role of an explicit system prompt in a scratch agent?
  options:
  - It restarts the server
  - It compiles the Python interpreter
  - It downloads packages from PyPI
  - 'It defines the tools, the syntax, and the limits'
  answer_index: 3
  explanation: The system prompt instructs the foundation model how to structure its reasoning and interact
    with tools.
- question: What should the agent runtime do when maximum iterations are reached without a Final Answer?
  options:
  - 'Exit cleanly with MAX_STEPS_EXCEEDED'
  - Hang indefinitely
  - Crash the host machine
  - Invent a hallucinated final answer
  answer_index: 0
  explanation: Graceful termination with a clear error status prevents infinite compute spend and aids
    debugging.
