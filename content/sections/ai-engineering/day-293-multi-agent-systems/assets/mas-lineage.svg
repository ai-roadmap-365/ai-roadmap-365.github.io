<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Forty years, two very different eras.">
  <title>From the actor model to debate</title>
  <style>
    .mas-lineage-bg   { fill: #f8fafc; }
    .mas-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mas-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mas-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mas-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mas-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mas-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mas-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mas-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mas-lineage-stage { opacity: 1; }

    .mas-lineage-s0 { animation-delay: 0.00s; }
    .mas-lineage-e0 { animation-delay: 0.00s; }
    .mas-lineage-s1 { animation-delay: 1.50s; }
    .mas-lineage-e1 { animation-delay: 1.50s; }
    .mas-lineage-s2 { animation-delay: 3.00s; }
    .mas-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .mas-lineage-conn  { animation: mas-lineage-trace 6s ease-in-out infinite; }
      .mas-lineage-stage { animation: mas-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes mas-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mas-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mas-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mas-lineage-stage { animation: mas-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mas-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mas-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mas-lineage-bg" width="980" height="322"/>
  <text class="mas-lineage-h1"  x="30" y="40">From the actor model to debate</text>
  <text class="mas-lineage-sub" x="30" y="64">Forty years, two very different eras.</text>
  <g class="mas-lineage-stage mas-lineage-s0">
    <rect class="mas-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="mas-lineage-step" x="44" y="142">01</text>
    <text class="mas-lineage-name" x="70" y="142">Classical MAS, 1980s-2000s</text>
    <text class="mas-lineage-desc" x="44" y="166">Actor model, BDI, FIPA-ACL. Formal protocols,</text>
    <text class="mas-lineage-desc" x="44" y="182">symbolic logic, rigid.</text>
  </g>
  <line class="mas-lineage-line mas-lineage-conn mas-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#mas-lineage-tip)"/>
  <g class="mas-lineage-stage mas-lineage-s1">
    <rect class="mas-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="mas-lineage-step" x="359" y="142">02</text>
    <text class="mas-lineage-name" x="385" y="142">Multi-agent debate, 2023</text>
    <text class="mas-lineage-desc" x="359" y="166">Competing arguments across rounds measurably</text>
    <text class="mas-lineage-desc" x="359" y="182">improve factual accuracy.</text>
  </g>
  <line class="mas-lineage-line mas-lineage-conn mas-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#mas-lineage-tip)"/>
  <g class="mas-lineage-stage mas-lineage-s2">
    <rect class="mas-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="mas-lineage-step" x="674" y="142">03</text>
    <text class="mas-lineage-name" x="700" y="142">Frameworks and scaling, 2023-2024</text>
    <text class="mas-lineage-desc" x="674" y="166">Aggregating specialised small models often</text>
    <text class="mas-lineage-desc" x="674" y="182">beats one large one.</text>
  </g>
  <text class="mas-lineage-sub" x="30" y="304">The classical era solved coordination and could not handle ambiguity; the modern era handles ambiguity natively and had to re-learn coordination, which is why message envelopes and round caps keep reappearing.</text>
</svg>
