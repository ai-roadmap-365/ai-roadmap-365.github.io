<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A typed envelope, not free text.">
  <title>What agents send each other</title>
  <style>
    .message-envelope-bg   { fill: #f8fafc; }
    .message-envelope-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-envelope-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-envelope-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-envelope-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-envelope-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .message-envelope-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .message-envelope-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .message-envelope-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .message-envelope-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .message-envelope-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .message-envelope-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .message-envelope-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .message-envelope-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .message-envelope-stage { opacity: 1; }

    .message-envelope-s0 { animation-delay: 0.00s; }
    .message-envelope-e0 { animation-delay: 0.00s; }
    .message-envelope-s1 { animation-delay: 1.28s; }
    .message-envelope-e1 { animation-delay: 1.28s; }
    .message-envelope-s2 { animation-delay: 2.56s; }
    .message-envelope-e2 { animation-delay: 2.56s; }
    .message-envelope-s3 { animation-delay: 3.84s; }
    .message-envelope-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .message-envelope-conn  { animation: message-envelope-trace 6.4s ease-in-out infinite; }
      .message-envelope-stage { animation: message-envelope-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes message-envelope-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes message-envelope-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .message-envelope-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .message-envelope-stage { animation: message-envelope-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes message-envelope-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="message-envelope-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="message-envelope-bg" width="980" height="322"/>
  <text class="message-envelope-h1"  x="30" y="40">What agents send each other</text>
  <text class="message-envelope-sub" x="30" y="64">A typed envelope, not free text.</text>
  <g class="message-envelope-stage message-envelope-s0">
    <rect class="message-envelope-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="message-envelope-step" x="44" y="142">01</text>
    <text class="message-envelope-name" x="70" y="142">Sender and recipient</text>
    <text class="message-envelope-desc" x="44" y="166">Routable identities, not implied</text>
    <text class="message-envelope-desc" x="44" y="182">by turn order.</text>
  </g>
  <line class="message-envelope-line message-envelope-conn message-envelope-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#message-envelope-tip)"/>
  <g class="message-envelope-stage message-envelope-s1">
    <rect class="message-envelope-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="message-envelope-step" x="280" y="142">02</text>
    <text class="message-envelope-name" x="306" y="142">Intent</text>
    <text class="message-envelope-desc" x="280" y="166">Request, result, critique,</text>
    <text class="message-envelope-desc" x="280" y="182">escalation. Not a conversational</text>
    <text class="message-envelope-desc" x="280" y="198">register.</text>
  </g>
  <line class="message-envelope-line message-envelope-conn message-envelope-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#message-envelope-tip)"/>
  <g class="message-envelope-stage message-envelope-s2">
    <rect class="message-envelope-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="message-envelope-step" x="516" y="142">03</text>
    <text class="message-envelope-name" x="542" y="142">A typed payload</text>
    <text class="message-envelope-desc" x="516" y="166">Structured data with a schema,</text>
    <text class="message-envelope-desc" x="516" y="182">which is what makes handoffs</text>
    <text class="message-envelope-desc" x="516" y="198">checkable.</text>
  </g>
  <line class="message-envelope-line message-envelope-conn message-envelope-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#message-envelope-tip)"/>
  <g class="message-envelope-stage message-envelope-s3">
    <rect class="message-envelope-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="message-envelope-step" x="752" y="142">04</text>
    <text class="message-envelope-name" x="778" y="142">Round and budget accounting</text>
    <text class="message-envelope-desc" x="752" y="166">So a cap can be enforced by the</text>
    <text class="message-envelope-desc" x="752" y="182">bus rather than by each agent.</text>
    <text class="message-envelope-edge" x="752" y="242">R &lt;= 4</text>
  </g>
  <text class="message-envelope-sub" x="30" y="304">Putting the round cap in the bus rather than in the agents is the design decision that actually stops chatter: an agent asked to be brief will be brief and will still reply, and a bus that drops non-actionable messages will not.</text>
</svg>
