<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Quadratic messages, and deadlocks.">
  <title>Why broadcast does not scale</title>
  <style>
    .pubsub-scaling-bg   { fill: #f8fafc; }
    .pubsub-scaling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pubsub-scaling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pubsub-scaling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pubsub-scaling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pubsub-scaling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pubsub-scaling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pubsub-scaling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pubsub-scaling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pubsub-scaling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pubsub-scaling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pubsub-scaling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pubsub-scaling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pubsub-scaling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pubsub-scaling-stage { opacity: 1; }

    .pubsub-scaling-s0 { animation-delay: 0.00s; }
    .pubsub-scaling-e0 { animation-delay: 0.00s; }
    .pubsub-scaling-s1 { animation-delay: 1.28s; }
    .pubsub-scaling-e1 { animation-delay: 1.28s; }
    .pubsub-scaling-s2 { animation-delay: 2.56s; }
    .pubsub-scaling-e2 { animation-delay: 2.56s; }
    .pubsub-scaling-s3 { animation-delay: 3.84s; }
    .pubsub-scaling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pubsub-scaling-conn  { animation: pubsub-scaling-trace 6.4s ease-in-out infinite; }
      .pubsub-scaling-stage { animation: pubsub-scaling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pubsub-scaling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pubsub-scaling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pubsub-scaling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pubsub-scaling-stage { animation: pubsub-scaling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pubsub-scaling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pubsub-scaling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pubsub-scaling-bg" width="980" height="322"/>
  <text class="pubsub-scaling-h1"  x="30" y="40">Why broadcast does not scale</text>
  <text class="pubsub-scaling-sub" x="30" y="64">Quadratic messages, and deadlocks.</text>
  <g class="pubsub-scaling-stage pubsub-scaling-s0">
    <rect class="pubsub-scaling-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pubsub-scaling-step" x="44" y="142">01</text>
    <text class="pubsub-scaling-name" x="70" y="142">Broadcast is quadratic</text>
    <text class="pubsub-scaling-desc" x="44" y="166">Ten agents sharing every</text>
    <text class="pubsub-scaling-desc" x="44" y="182">observation: hundreds of</text>
    <text class="pubsub-scaling-desc" x="44" y="198">messages in five turns.</text>
    <text class="pubsub-scaling-edge" x="44" y="242">O(N^2)</text>
  </g>
  <line class="pubsub-scaling-line pubsub-scaling-conn pubsub-scaling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pubsub-scaling-tip)"/>
  <g class="pubsub-scaling-stage pubsub-scaling-s1">
    <rect class="pubsub-scaling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pubsub-scaling-step" x="280" y="142">02</text>
    <text class="pubsub-scaling-name" x="306" y="142">Topic-based channels</text>
    <text class="pubsub-scaling-desc" x="280" y="166">Agents subscribe to what</text>
    <text class="pubsub-scaling-desc" x="280" y="182">concerns them, not to</text>
    <text class="pubsub-scaling-desc" x="280" y="198">everything.</text>
  </g>
  <line class="pubsub-scaling-line pubsub-scaling-conn pubsub-scaling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pubsub-scaling-tip)"/>
  <g class="pubsub-scaling-stage pubsub-scaling-s2">
    <rect class="pubsub-scaling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pubsub-scaling-step" x="516" y="142">03</text>
    <text class="pubsub-scaling-name" x="542" y="142">Semantic filtering at the gateway</text>
    <text class="pubsub-scaling-desc" x="516" y="166">Non-actionable messages dropped</text>
    <text class="pubsub-scaling-desc" x="516" y="182">before they reach a context</text>
    <text class="pubsub-scaling-desc" x="516" y="198">window.</text>
  </g>
  <line class="pubsub-scaling-line pubsub-scaling-conn pubsub-scaling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pubsub-scaling-tip)"/>
  <g class="pubsub-scaling-stage pubsub-scaling-s3">
    <rect class="pubsub-scaling-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pubsub-scaling-step" x="752" y="142">04</text>
    <text class="pubsub-scaling-name" x="778" y="142">Deadlock detection</text>
    <text class="pubsub-scaling-desc" x="752" y="166">A cyclic wait between two agents</text>
    <text class="pubsub-scaling-desc" x="752" y="182">is detected and broken by the</text>
    <text class="pubsub-scaling-desc" x="752" y="198">supervisor.</text>
  </g>
  <text class="pubsub-scaling-sub" x="30" y="304">The deadlock case is easy to dismiss as theoretical and is not: A waiting on B's query while B waits on A's schema is a natural thing for two competent agents to do, and neither will notice.</text>
</svg>
