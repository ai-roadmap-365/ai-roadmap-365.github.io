<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img">
  <title>Multi Agent Topologies Router Vs Debate</title>
  <defs>
    <style>
      .d293a-bg { fill: #f8fafc; }
      .d293a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d293a-sup { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d293a-pipe { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d293a-deb { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d293a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d293a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d293a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d293a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d293a-bg" />
  
  <text x="40" y="40" class="d293a-title">Multi-Agent Topologies: Supervisor, Pipeline &amp; Debate</text>
  <text x="40" y="65" class="d293a-subtitle">Multi-Agent Topologies Router vs Debate diagram illustrating Hierarchical Supervisor, Sequential Pipeline, and Multi-Agent Debate patterns</text>
  
  <!-- 1. Hierarchical Supervisor -->
  <rect x="40" y="100" width="250" height="340" class="d293a-sup" />
  <text x="55" y="130" class="d293a-header" fill="#1d4ed8">1. Hierarchical Supervisor</text>
  <text x="55" y="155" class="d293a-text">• Central Lead Agent orchestrates</text>
  <text x="55" y="175" class="d293a-text">• Delegates to specialized workers:</text>
  <text x="55" y="195" class="d293a-text">  - Researcher Agent (Search)</text>
  <text x="55" y="210" class="d293a-text">  - Coder Agent (Sandbox)</text>
  <text x="55" y="225" class="d293a-text">  - Reviewer Agent (Eval)</text>
  <text x="55" y="255" class="d293a-text" font-weight="600">Best For:</text>
  <text x="55" y="275" class="d293a-text">Complex projects with heterogeneous</text>
  <text x="55" y="290" class="d293a-text">specialized toolsets</text>
  <text x="55" y="320" class="d293a-text" font-weight="600">Strengths:</text>
  <text x="55" y="340" class="d293a-text">Clear accountability, zero chatter</text>
  
  <!-- 2. Sequential Pipeline -->
  <rect x="325" y="100" width="250" height="340" class="d293a-pipe" />
  <text x="340" y="130" class="d293a-header" fill="#a16207">2. Sequential Pipeline</text>
  <text x="340" y="155" class="d293a-text">• Linear Assembly Line:</text>
  <text x="340" y="175" class="d293a-text">  Agent A (Data Ingestion)</text>
  <text x="340" y="195" class="d293a-text">      │</text>
  <text x="340" y="210" class="d293a-text">  Agent B (Analysis &amp; Code)</text>
  <text x="340" y="230" class="d293a-text">      │</text>
  <text x="340" y="245" class="d293a-text">  Agent C (Report Drafting)</text>
  <text x="340" y="275" class="d293a-text" font-weight="600">Best For:</text>
  <text x="340" y="295" class="d293a-text">Deterministic data transformations,</text>
  <text x="340" y="310" class="d293a-text">automated CI/CD pipelines</text>
  <text x="340" y="340" class="d293a-text" font-weight="600">Strengths:</text>
  <text x="340" y="360" class="d293a-text">Predictable latency and tokens</text>
  
  <!-- 3. Multi-Agent Debate -->
  <rect x="610" y="100" width="250" height="340" class="d293a-deb" />
  <text x="625" y="130" class="d293a-header" fill="#7e22ce">3. Multi-Agent Debate</text>
  <text x="625" y="155" class="d293a-text">• Adversarial / Dialectic Scheme:</text>
  <text x="625" y="175" class="d293a-text">  - Proposer (Agent 1)</text>
  <text x="625" y="190" class="d293a-text">  - Skeptic / Critic (Agent 2)</text>
  <text x="625" y="205" class="d293a-text">  - Impartial Judge (Agent 3)</text>
  <text x="625" y="235" class="d293a-text">• Multi-round critique exchange</text>
  <text x="625" y="265" class="d293a-text" font-weight="600">Best For:</text>
  <text x="625" y="285" class="d293a-text">High-stakes fact checking,</text>
  <text x="625" y="300" class="d293a-text">legal/medical decision auditing</text>
  <text x="625" y="330" class="d293a-text" font-weight="600">Strengths:</text>
  <text x="625" y="350" class="d293a-text">Drastically slashes hallucinations</text>
</svg>