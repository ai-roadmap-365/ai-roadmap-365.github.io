<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three views, one supermajority.">
  <title>Consensus for high-stakes calls</title>
  <style>
    .consensus-bg   { fill: #f8fafc; }
    .consensus-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consensus-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consensus-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consensus-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consensus-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consensus-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .consensus-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .consensus-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .consensus-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .consensus-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .consensus-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .consensus-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .consensus-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .consensus-stage { opacity: 1; }

    .consensus-s0 { animation-delay: 0.00s; }
    .consensus-e0 { animation-delay: 0.00s; }
    .consensus-s1 { animation-delay: 1.28s; }
    .consensus-e1 { animation-delay: 1.28s; }
    .consensus-s2 { animation-delay: 2.56s; }
    .consensus-e2 { animation-delay: 2.56s; }
    .consensus-s3 { animation-delay: 3.84s; }
    .consensus-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .consensus-conn  { animation: consensus-trace 6.4s ease-in-out infinite; }
      .consensus-stage { animation: consensus-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes consensus-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes consensus-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .consensus-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .consensus-stage { animation: consensus-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes consensus-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="consensus-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="consensus-bg" width="980" height="322"/>
  <text class="consensus-h1"  x="30" y="40">Consensus for high-stakes calls</text>
  <text class="consensus-sub" x="30" y="64">Three views, one supermajority.</text>
  <g class="consensus-stage consensus-s0">
    <rect class="consensus-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="consensus-step" x="44" y="142">01</text>
    <text class="consensus-name" x="70" y="142">Spawn diverse reviewers</text>
    <text class="consensus-desc" x="44" y="166">An optimistic proposer, a</text>
    <text class="consensus-desc" x="44" y="182">conservative auditor, an</text>
    <text class="consensus-desc" x="44" y="198">efficiency architect.</text>
  </g>
  <line class="consensus-line consensus-conn consensus-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#consensus-tip)"/>
  <g class="consensus-stage consensus-s1">
    <rect class="consensus-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="consensus-step" x="280" y="142">02</text>
    <text class="consensus-name" x="306" y="142">Review independently</text>
    <text class="consensus-desc" x="280" y="166">No shared context, so the errors</text>
    <text class="consensus-desc" x="280" y="182">are not correlated.</text>
    <text class="consensus-edge" x="280" y="242">independence</text>
  </g>
  <line class="consensus-line consensus-conn consensus-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#consensus-tip)"/>
  <g class="consensus-stage consensus-s2">
    <rect class="consensus-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="consensus-step" x="516" y="142">03</text>
    <text class="consensus-name" x="542" y="142">An arbiter measures agreement</text>
    <text class="consensus-desc" x="516" y="166">Semantic overlap across the</text>
    <text class="consensus-desc" x="516" y="182">independent reviews.</text>
  </g>
  <line class="consensus-line consensus-conn consensus-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#consensus-tip)"/>
  <g class="consensus-stage consensus-s3">
    <rect class="consensus-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="consensus-step" x="752" y="142">04</text>
    <text class="consensus-name" x="778" y="142">Accept on supermajority</text>
    <text class="consensus-desc" x="752" y="166">At least two thirds, or the</text>
    <text class="consensus-desc" x="752" y="182">proposal does not proceed.</text>
    <text class="consensus-edge" x="752" y="242">&gt;= 67%</text>
  </g>
  <text class="consensus-sub" x="30" y="304">Independence is what the whole mechanism rests on: three reviewers sharing a context produce three correlated opinions, which is a more expensive way of getting one opinion.</text>
</svg>
