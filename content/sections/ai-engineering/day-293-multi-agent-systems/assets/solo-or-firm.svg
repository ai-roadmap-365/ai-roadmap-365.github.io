<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Separation of concerns, applied to prompts.">
  <title>One overloaded generalist, or a firm</title>
  <style>
    .solo-or-firm-bg   { fill: #f8fafc; }
    .solo-or-firm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .solo-or-firm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .solo-or-firm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .solo-or-firm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .solo-or-firm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .solo-or-firm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .solo-or-firm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .solo-or-firm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .solo-or-firm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .solo-or-firm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .solo-or-firm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .solo-or-firm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .solo-or-firm-row { opacity: 1; }
    .solo-or-firm-r0 { animation-delay: 0.00s; }
    .solo-or-firm-r1 { animation-delay: 0.45s; }
    .solo-or-firm-r2 { animation-delay: 0.90s; }
    .solo-or-firm-r3 { animation-delay: 1.35s; }
    .solo-or-firm-r4 { animation-delay: 1.80s; }
    .solo-or-firm-row { animation: solo-or-firm-reveal 7.3s ease-in-out infinite; }
    @keyframes solo-or-firm-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="solo-or-firm-bg" width="980" height="390"/>
  <text class="solo-or-firm-h1"  x="30" y="40">One overloaded generalist, or a firm</text>
  <text class="solo-or-firm-sub" x="30" y="64">Separation of concerns, applied to prompts.</text>
  <rect class="solo-or-firm-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="solo-or-firm-name" x="46" y="122">One agent, 50 tools</text>
  <text class="solo-or-firm-desc" x="46" y="142">Cognitive interference.</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r0" x="46" y="182">Structural loads, plumbing, zoning, renderings</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r1" x="46" y="216">Contradictory instructions in one prompt</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r2" x="46" y="250">Overlapping tool descriptions</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r3" x="46" y="284">Thousands of lines of observations</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r4" x="46" y="318">Mistakes from overload, not ignorance</text>
  <rect class="solo-or-firm-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="solo-or-firm-name" x="526" y="122">Specialists</text>
  <text class="solo-or-firm-desc" x="526" y="142">Narrow contexts, clear interfaces.</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r0" x="526" y="182">A supervisor sets budget and milestones</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r1" x="526" y="216">A structural agent with physics tools</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r2" x="526" y="250">A legal agent with a statute search</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r3" x="526" y="284">Each sees three tools, not fifty</text>
  <text class="solo-or-firm-desc solo-or-firm-row solo-or-firm-r4" x="526" y="318">Selection accuracy stays high</text>
  <text class="solo-or-firm-sub" x="30" y="372">The mechanism is concrete rather than metaphorical: tool-selection accuracy degrades measurably with tool count and description overlap, and splitting the agent restores it.</text>
</svg>
