terms:
- term: Multi-Agent System (MAS)
  definition: A distributed system comprising multiple autonomous AI agents that communicate and cooperate
    to solve complex objectives.
- term: Hierarchical Supervisor
  definition: An orchestration topology where a central lead agent delegates sub-tasks to specialized
    subagents and reviews deliverables.
- term: Message Bus
  definition: A structured communication channel enabling agents to publish, subscribe, and route messages
    using standardized envelopes.
- term: Multi-Agent Debate
  definition: A verification topology where multiple agents argue competing hypotheses before an impartial
    judge synthesizes the final conclusion.
- term: Groupthink Drift
  definition: A failure mode in peer-to-peer multi-agent systems where agents reinforce and amplify each
    other's hallucinations.
- term: Role Specialization
  definition: Restricting an individual agent's system prompt and tool inventory to a single domain of
    expertise.
- term: Delegation Ping-Pong
  definition: A failure mode where two agents repeatedly delegate a task back and forth without executing
    real work.
- term: Consensus Arbiter
  definition: An impartial agent that aggregates votes and arguments across an ensemble to determine the
    final output.
