questions:
- question: What is the primary operational risk when deploying an unsupervised Peer-to-Peer multi-agent
    chat?
  options:
  - The agents consume zero tokens
  - The server runs out of disk space
  - 'The Python interpreter crashes on the first import'
  - 'They can loop forever, agreeing with each other'
  answer_index: 3
  explanation: Without a supervisor or explicit termination predicate, peer-to-peer agents frequently
    engage in repetitive conversational loops.
- question: In a Hierarchical Supervisor multi-agent topology, what is the role of the lead supervisor
    agent?
  options:
  - 'To decompose, delegate, and synthesize results'
  - To execute low-level shell scripts
  - To write unit tests for the human
  - To delete the database
  answer_index: 0
  explanation: The supervisor serves as the strategic orchestrator, routing tasks to domain specialists
    and aggregating their returns.
- question: Why does a Multi-Agent Debate pattern improve reasoning quality on complex analytical questions?
  options:
  - It reduces token spend by 90%
  - 'Opposing agents expose each other''s weak claims'
  - It eliminates the need for tool calling
  - It compresses prompt text
  answer_index: 1
  explanation: Debate exposes confirmation bias and ungrounded assumptions by pitting competing models
    against each other.
- question: How does role specialization in multi-agent systems improve tool execution accuracy?
  options:
  - It gives all agents 100 tools simultaneously
  - It removes all JSON parsing
  - 'Each agent gets a minimal, focused toolset'
  - It speeds up network I/O
  answer_index: 2
  explanation: Curating small, role-specific tool inventories prevents tool-selection ambiguity and context
    pollution.
- question: What communication protocol prevents quadratic message explosion in large multi-agent networks?
  options:
  - Broadcasting every message to every agent
  - Using XML instead of JSON
  - Disabling all logging
  - 'A pub/sub bus with hard round bounds'
  answer_index: 3
  explanation: Pub/Sub channels and bounded message routing ensure messages are only delivered to relevant
    subscriber agents.
