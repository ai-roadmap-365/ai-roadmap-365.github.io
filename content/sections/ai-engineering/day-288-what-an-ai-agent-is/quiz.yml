questions:
- question: What is the primary defining characteristic of an autonomous AI agent compared to a passive
    LLM?
  options:
  - An agent runs on an FPGA chip
  - An agent operates in a closed perception-cognition-action loop, maintaining internal state and iteratively
    choosing actions until a goal condition is satisfied
  - An agent has 100 billion parameters
  - An agent only accepts JSON formatted inputs
  answer_index: 1
  explanation: An agent autonomously senses its environment, plans intermediate steps, executes tool actions,
    and observes feedback to update its internal state.
- question: Why is an explicit state machine and transition table necessary in production agent runtimes?
  options:
  - To prevent invalid state transitions, enforce human-in-the-loop approval, and prevent infinite loops
  - To increase GPU memory consumption
  - To convert Python bytecode into C++
  - To delete stale database records
  answer_index: 0
  explanation: A formal state machine bounds non-deterministic model behavior, tracking cycles and enforcing
    safety gates.
- question: What is the function of an observation feedback loop in an agentic system?
  options:
  - To display popups to the user
  - To feed the output or error string of a tool execution back into the agent's scratchpad for self-correction
  - To compress video files
  - To format markdown headers
  answer_index: 1
  explanation: Observation feedback provides environmental feedback so the agent can reason about whether
    its previous action succeeded or failed.
- question: What mechanism prevents an autonomous agent from entering an infinite execution loop?
  options:
  - A maximum step limit (iteration budget) and state cycle detection hash table
  - Lowering the temperature parameter to exactly zero
  - Increasing the system prompt length
  - Using a quantized 4-bit model
  answer_index: 0
  explanation: Hard step budgets and cycle hash detection prevent runaway loops when an agent repeatedly
    executes failing actions.
- question: In the Perception-Cognition-Action loop, which phase is responsible for deciding the next
    tool invocation?
  options:
  - Perception
  - Cognition (Reasoning / Planning)
  - Action Execution
  - Environment Ingestion
  answer_index: 1
  explanation: Cognition evaluates the perceived environment state and historical context to plan and
    select the next action.
