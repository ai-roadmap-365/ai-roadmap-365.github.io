<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Transparency against boilerplate.">
  <title>Vanilla loop, or a framework</title>
  <style>
    .framework-choice-bg   { fill: #f8fafc; }
    .framework-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .framework-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .framework-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .framework-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .framework-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .framework-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .framework-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .framework-choice-row { opacity: 1; }
    .framework-choice-r0 { animation-delay: 0.00s; }
    .framework-choice-r1 { animation-delay: 0.45s; }
    .framework-choice-r2 { animation-delay: 0.90s; }
    .framework-choice-r3 { animation-delay: 1.35s; }
    .framework-choice-r4 { animation-delay: 1.80s; }
    .framework-choice-row { animation: framework-choice-reveal 7.3s ease-in-out infinite; }
    @keyframes framework-choice-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="framework-choice-bg" width="980" height="390"/>
  <text class="framework-choice-h1"  x="30" y="40">Vanilla loop, or a framework</text>
  <text class="framework-choice-sub" x="30" y="64">Transparency against boilerplate.</text>
  <rect class="framework-choice-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="framework-choice-name" x="46" y="122">Vanilla Python</text>
  <text class="framework-choice-desc" x="46" y="142">You write the state machine.</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r0" x="46" y="182">Total transparency</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r1" x="46" y="216">Easy to debug — it is your code</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r2" x="46" y="250">No dependency surface</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r3" x="46" y="284">Manual state management</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r4" x="46" y="318">The right way to learn it</text>
  <rect class="framework-choice-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="framework-choice-name" x="526" y="122">A framework</text>
  <text class="framework-choice-desc" x="526" y="142">Structure, and abstraction.</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r0" x="526" y="182">LangGraph: explicit state, human-in-the-loop</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r1" x="526" y="216">CrewAI: role-based multi-agent, fast to prototype</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r2" x="526" y="250">AutoGen: rich dialogue patterns</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r3" x="526" y="284">Debugging chatter loops is genuinely hard</text>
  <text class="framework-choice-desc framework-choice-row framework-choice-r4" x="526" y="318">Opinionated where you may disagree</text>
  <text class="framework-choice-sub" x="30" y="372">Anthropic's own guidance points at the left column for a reason worth taking seriously: the loop is about forty lines, and a framework's abstraction is mostly valuable once you already know what it is hiding.</text>
</svg>
