<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img">
  <title>Ai Agent Architecture Overview</title>
  <defs>
    <style>
      .d288a-bg { fill: #f8fafc; }
      .d288a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d288a-agent { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d288a-tool { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d288a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d288a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d288a-node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .d288a-node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .d288a-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 6,4; fill: none; animation: d288a-pulse 3s linear infinite; }
      @keyframes d288a-pulse { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .d288a-flow { animation: none; } }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d288a-bg" />
  
  <text x="40" y="40" class="d288a-title">AI Agent Architecture Overview</text>
  <text x="40" y="65" class="d288a-subtitle">Perception, Working Memory, Planning Engine, Tool Actuation, and Environment Feedback Loop</text>
  
  <!-- Environment Input -->
  <rect x="40" y="110" width="160" height="90" class="d288a-card" />
  <text x="55" y="140" class="d288a-node-title">1. Perception</text>
  <text x="55" y="160" class="d288a-node-desc">User Goal &amp; Context</text>
  <text x="55" y="175" class="d288a-node-desc">System Constraints</text>
  
  <!-- Agent Core Container -->
  <rect x="250" y="95" width="400" height="340" class="d288a-agent" />
  <text x="270" y="125" class="d288a-node-title" fill="#1d4ed8">Autonomous Agent Brain</text>
  
  <!-- Sub-components inside agent -->
  <rect x="270" y="145" width="170" height="110" class="d288a-card" />
  <text x="285" y="175" class="d288a-node-title">2. Memory</text>
  <text x="285" y="195" class="d288a-node-desc">• Short-term Scratchpad</text>
  <text x="285" y="210" class="d288a-node-desc">• Episodic Experience</text>
  <text x="285" y="225" class="d288a-node-desc">• Long-term Vector Store</text>
  
  <rect x="460" y="145" width="170" height="110" class="d288a-card" />
  <text x="475" y="175" class="d288a-node-title">3. Cognition</text>
  <text x="475" y="195" class="d288a-node-desc">• ReAct Reasoning Loop</text>
  <text x="475" y="210" class="d288a-node-desc">• Sub-Goal Decomposition</text>
  <text x="475" y="225" class="d288a-node-desc">• Self-Reflection &amp; Eval</text>
  
  <rect x="270" y="280" width="360" height="130" class="d288a-card" />
  <text x="285" y="310" class="d288a-node-title">4. Action &amp; Tool Actuation</text>
  <text x="285" y="330" class="d288a-node-desc">• Function Calling Schema Parsing</text>
  <text x="285" y="345" class="d288a-node-desc">• Argument Coercion &amp; Validation</text>
  <text x="285" y="360" class="d288a-node-desc">• Side-Effect Execution Safeguards</text>
  <text x="285" y="375" class="d288a-node-desc">• Stopping Condition Predicates</text>
  
  <!-- External Environment / Tools -->
  <rect x="700" y="110" width="160" height="310" class="d288a-tool" />
  <text x="715" y="140" class="d288a-node-title" fill="#15803d">5. Environment</text>
  <text x="715" y="165" class="d288a-node-desc">• Web Search &amp; Scraping</text>
  <text x="715" y="185" class="d288a-node-desc">• Python Execution Sandbox</text>
  <text x="715" y="205" class="d288a-node-desc">• SQL / Database Queries</text>
  <text x="715" y="225" class="d288a-node-desc">• Local Filesystem Read/Write</text>
  <text x="715" y="245" class="d288a-node-desc">• External MCP Server APIs</text>
  <text x="715" y="295" class="d288a-node-desc" font-weight="600">Dynamic Feedback:</text>
  <text x="715" y="315" class="d288a-node-desc">Returns tool outputs,</text>
  <text x="715" y="330" class="d288a-node-desc">errors, or sensor readings</text>
  
  <!-- Flow Lines -->
  <path d="M 200 155 L 250 155" class="d288a-flow" />
  <path d="M 630 345 L 700 345" class="d288a-flow" />
  <path d="M 700 280 C 660 280, 660 200, 440 200" class="d288a-flow" />
</svg>