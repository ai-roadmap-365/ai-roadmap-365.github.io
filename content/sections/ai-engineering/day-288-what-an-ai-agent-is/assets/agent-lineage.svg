<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The idea is older than the models.">
  <title>Four generations of agents</title>
  <style>
    .agent-lineage-bg   { fill: #f8fafc; }
    .agent-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .agent-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .agent-lineage-stage { opacity: 1; }

    .agent-lineage-s0 { animation-delay: 0.00s; }
    .agent-lineage-e0 { animation-delay: 0.00s; }
    .agent-lineage-s1 { animation-delay: 1.28s; }
    .agent-lineage-e1 { animation-delay: 1.28s; }
    .agent-lineage-s2 { animation-delay: 2.56s; }
    .agent-lineage-e2 { animation-delay: 2.56s; }
    .agent-lineage-s3 { animation-delay: 3.84s; }
    .agent-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .agent-lineage-conn  { animation: agent-lineage-trace 6.4s ease-in-out infinite; }
      .agent-lineage-stage { animation: agent-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes agent-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes agent-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .agent-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .agent-lineage-stage { animation: agent-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes agent-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="agent-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="agent-lineage-bg" width="980" height="322"/>
  <text class="agent-lineage-h1"  x="30" y="40">Four generations of agents</text>
  <text class="agent-lineage-sub" x="30" y="64">The idea is older than the models.</text>
  <g class="agent-lineage-stage agent-lineage-s0">
    <rect class="agent-lineage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="agent-lineage-step" x="44" y="142">01</text>
    <text class="agent-lineage-name" x="70" y="142">Classical agents, 1950s-1990s</text>
    <text class="agent-lineage-desc" x="44" y="166">Russell and Norvig: perceive</text>
    <text class="agent-lineage-desc" x="44" y="182">through sensors, act through</text>
    <text class="agent-lineage-desc" x="44" y="198">actuators. Rule engines and</text>
  </g>
  <line class="agent-lineage-line agent-lineage-conn agent-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#agent-lineage-tip)"/>
  <g class="agent-lineage-stage agent-lineage-s1">
    <rect class="agent-lineage-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="agent-lineage-step" x="280" y="142">02</text>
    <text class="agent-lineage-name" x="306" y="142">Reinforcement learning, 2013-2020</text>
    <text class="agent-lineage-desc" x="280" y="166">DQN and AlphaGo. Superhuman</text>
    <text class="agent-lineage-desc" x="280" y="182">agency, in constrained</text>
    <text class="agent-lineage-desc" x="280" y="198">environments with reward</text>
  </g>
  <line class="agent-lineage-line agent-lineage-conn agent-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#agent-lineage-tip)"/>
  <g class="agent-lineage-stage agent-lineage-s2">
    <rect class="agent-lineage-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="agent-lineage-step" x="516" y="142">03</text>
    <text class="agent-lineage-name" x="542" y="142">ReAct and generative agents, 2022-2023</text>
    <text class="agent-lineage-desc" x="516" y="166">Thought, Action, Observation —</text>
    <text class="agent-lineage-desc" x="516" y="182">and a formal memory</text>
    <text class="agent-lineage-desc" x="516" y="198">architecture.</text>
  </g>
  <line class="agent-lineage-line agent-lineage-conn agent-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#agent-lineage-tip)"/>
  <g class="agent-lineage-stage agent-lineage-s3">
    <rect class="agent-lineage-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="agent-lineage-step" x="752" y="142">04</text>
    <text class="agent-lineage-name" x="778" y="142">Protocols, 2024</text>
    <text class="agent-lineage-desc" x="752" y="166">MCP standardises how agents</text>
    <text class="agent-lineage-desc" x="752" y="182">reach data and tools. Simple</text>
    <text class="agent-lineage-desc" x="752" y="198">composable workflows over</text>
  </g>
  <text class="agent-lineage-sub" x="30" y="304">The second generation's limitation is the interesting one: those agents were genuinely superhuman and could not generalise, because they learned a reward surface rather than a language in which goals can be stated.</text>
</svg>
