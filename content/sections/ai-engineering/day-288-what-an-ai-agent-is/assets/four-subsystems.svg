<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every agent has these, named or not.">
  <title>Four subsystems</title>
  <style>
    .four-subsystems-bg   { fill: #f8fafc; }
    .four-subsystems-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-subsystems-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-subsystems-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-subsystems-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-subsystems-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-subsystems-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-subsystems-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-subsystems-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-subsystems-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-subsystems-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-subsystems-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-subsystems-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-subsystems-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-subsystems-stage { opacity: 1; }

    .four-subsystems-s0 { animation-delay: 0.00s; }
    .four-subsystems-e0 { animation-delay: 0.00s; }
    .four-subsystems-s1 { animation-delay: 1.28s; }
    .four-subsystems-e1 { animation-delay: 1.28s; }
    .four-subsystems-s2 { animation-delay: 2.56s; }
    .four-subsystems-e2 { animation-delay: 2.56s; }
    .four-subsystems-s3 { animation-delay: 3.84s; }
    .four-subsystems-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-subsystems-conn  { animation: four-subsystems-trace 6.4s ease-in-out infinite; }
      .four-subsystems-stage { animation: four-subsystems-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-subsystems-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-subsystems-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-subsystems-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-subsystems-stage { animation: four-subsystems-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-subsystems-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-subsystems-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-subsystems-bg" width="980" height="322"/>
  <text class="four-subsystems-h1"  x="30" y="40">Four subsystems</text>
  <text class="four-subsystems-sub" x="30" y="64">Every agent has these, named or not.</text>
  <g class="four-subsystems-stage four-subsystems-s0">
    <rect class="four-subsystems-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-subsystems-step" x="44" y="142">01</text>
    <text class="four-subsystems-name" x="70" y="142">Perception</text>
    <text class="four-subsystems-desc" x="44" y="166">Objective, instructions,</text>
    <text class="four-subsystems-desc" x="44" y="182">environment variables and tool</text>
    <text class="four-subsystems-desc" x="44" y="198">returns, into one context.</text>
  </g>
  <line class="four-subsystems-line four-subsystems-conn four-subsystems-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-subsystems-tip)"/>
  <g class="four-subsystems-stage four-subsystems-s1">
    <rect class="four-subsystems-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-subsystems-step" x="280" y="142">02</text>
    <text class="four-subsystems-name" x="306" y="142">The orchestrator</text>
    <text class="four-subsystems-desc" x="280" y="166">The model. Evaluates state,</text>
    <text class="four-subsystems-desc" x="280" y="182">forms sub-goals, selects the</text>
    <text class="four-subsystems-desc" x="280" y="198">next action.</text>
  </g>
  <line class="four-subsystems-line four-subsystems-conn four-subsystems-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-subsystems-tip)"/>
  <g class="four-subsystems-stage four-subsystems-s2">
    <rect class="four-subsystems-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-subsystems-step" x="516" y="142">03</text>
    <text class="four-subsystems-name" x="542" y="142">Memory</text>
    <text class="four-subsystems-desc" x="516" y="166">Working scratchpad, episodic</text>
    <text class="four-subsystems-desc" x="516" y="182">trajectories in a vector store,</text>
    <text class="four-subsystems-desc" x="516" y="198">and static schemas.</text>
    <text class="four-subsystems-edge" x="516" y="242">three kinds</text>
  </g>
  <line class="four-subsystems-line four-subsystems-conn four-subsystems-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-subsystems-tip)"/>
  <g class="four-subsystems-stage four-subsystems-s3">
    <rect class="four-subsystems-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-subsystems-step" x="752" y="142">04</text>
    <text class="four-subsystems-name" x="778" y="142">Tool actuation</text>
    <text class="four-subsystems-desc" x="752" y="166">Validates schemas, enforces</text>
    <text class="four-subsystems-desc" x="752" y="182">permissions, executes, and</text>
    <text class="four-subsystems-desc" x="752" y="198">formats the result.</text>
  </g>
  <text class="four-subsystems-sub" x="30" y="304">The three kinds of memory are worth separating deliberately: the scratchpad grows every turn and is expensive, the episodic store persists across sessions, and the schemas never change at all.</text>
</svg>
