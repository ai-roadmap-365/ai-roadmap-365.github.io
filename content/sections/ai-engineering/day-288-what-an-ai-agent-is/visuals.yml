visuals:
- id: ai-agent-architecture-overview
  file: assets/ai-agent-architecture-overview.svg
  type: diagram
  title: AI Agent Architecture Overview
  alt: AI Agent Architecture Overview illustrating Perception, Working Memory, Planning Engine, Tool Actuation,
    and Environment Feedback Loop
  description: System architecture diagram illustrating the core components of an autonomous AI agent.
- id: stateless-llm-vs-autonomous-agent
  file: assets/stateless-llm-vs-autonomous-agent.svg
  type: diagram
  title: Stateless LLM vs Autonomous Agent
  alt: Stateless LLM vs Autonomous Agent comparison diagram showing single-pass generation versus multi-step
    dynamic execution loops
  description: Comparative diagram highlighting differences between one-shot prompting and closed-loop
    agentic execution.
- id: agent-loop-cycle
  file: assets/agent-loop-cycle.svg
  type: diagram
  title: 'The closed loop'
  alt: 'Diagram: the perceive, plan, act, observe and reflect cycle of an agent'
  description: 'A five-stage description of the agent execution cycle covering perception, planning, tool actuation, observation and reflection.'
- id: stateless-or-agent
  file: assets/stateless-or-agent.svg
  type: diagram
  title: 'A hallway answer, or an engineer'
  alt: 'Diagram: a stateless model answering compared with an agent working the problem'
  description: 'A two-column comparison of a single-pass language model response against an agent that inspects, executes and verifies.'
- id: agent-lineage
  file: assets/agent-lineage.svg
  type: diagram
  title: 'Four generations of agents'
  alt: 'Diagram: the progression from classical agent theory to enterprise agent protocols'
  description: 'A four-stage progression of agent research from classical AI and cybernetics through reinforcement learning and ReAct to standardised enterprise protocols.'
- id: agent-or-pipeline
  file: assets/agent-or-pipeline.svg
  type: diagram
  title: 'An agent, or a pipeline'
  alt: 'Diagram: an autonomous agent compared with a fixed prompt chain'
  description: 'A two-column comparison of an agent whose next step depends on observations against a hardcoded pipeline of model calls.'
- id: four-subsystems
  file: assets/four-subsystems.svg
  type: diagram
  title: 'Four subsystems'
  alt: 'Diagram: the four subsystems that make up an autonomous agent'
  description: 'A four-stage description of agent architecture covering perception, the model orchestrator, the memory subsystem and the tool interface.'
- id: loop-invariants
  file: assets/loop-invariants.svg
  type: diagram
  title: 'Three non-negotiable invariants'
  alt: 'Diagram: the three invariants every agent loop must enforce'
  description: 'A three-stage description of agent loop invariants covering a hard step bound, a cumulative token cap and cycle detection.'
- id: electrician-analogy
  file: assets/electrician-analogy.svg
  type: diagram
  title: 'An electrician, or advice from an armchair'
  alt: 'Diagram: a technician with instruments compared with remote guesswork'
  description: 'A two-column comparison of an on-site electrician using instruments against someone diagnosing the same fault remotely.'
- id: agent-failure-modes
  file: assets/agent-failure-modes.svg
  type: diagram
  title: 'Three consequences of actuation'
  alt: 'Diagram: the security, privacy and cost consequences of giving a model tools'
  description: 'A three-stage description of agent implications covering indirect prompt injection, data exfiltration through tools, and compounding token cost.'
- id: agent-or-script
  file: assets/agent-or-script.svg
  type: diagram
  title: 'When an agent earns its cost'
  alt: 'Diagram: when to use an autonomous agent and when a deterministic script is right'
  description: 'A two-column comparison of problems suited to autonomous agents against those better solved by fixed scripts.'
- id: framework-choice
  file: assets/framework-choice.svg
  type: diagram
  title: 'Vanilla loop, or a framework'
  alt: 'Diagram: a zero-dependency agent loop compared with an agent framework'
  description: 'A two-column comparison of implementing an agent loop directly against adopting a framework.'
- id: state-machine
  file: assets/state-machine.svg
  type: diagram
  title: 'The agent as a state machine'
  alt: 'Diagram: the states of an agent runtime and the transitions between them'
  description: 'A five-stage description of agent runtime states covering thinking, tool calls, observation, evaluation and the terminal states.'
- id: agent-or-chatbot
  file: assets/agent-or-chatbot.svg
  type: diagram
  title: 'An agent is not a chatbot'
  alt: 'Diagram: an autonomous agent compared with a conversational interface'
  description: 'A two-column comparison of an agent that acts on an environment against a chat interface that streams text.'
