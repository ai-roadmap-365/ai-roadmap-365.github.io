terms:
- term: AI Agent
  definition: An autonomous software entity that perceives its environment, reasons about goals, and executes
    tool actions iteratively.
- term: Perception-Cognition-Action Loop
  definition: The cyclic execution model where an agent observes environment state, plans decisions, and
    invokes tools.
- term: Agent State Machine
  definition: A formal discrete transition model governing an agent's lifecycle (INITIALIZED, REASONING,
    ACTING, PAUSED, TERMINATED).
- term: Tool Invocation
  definition: The execution of an external API or function chosen by an agent with parsed structured arguments.
- term: Observation Feedback
  definition: The raw output or error returned by a tool execution and appended to the agent's reasoning
    scratchpad.
- term: Cycle Detection
  definition: An algorithmic guard identifying when an agent repeats identical state-action sequences
    continuously.
- term: Step Budget
  definition: A hard numerical cap on the maximum number of reasoning-action iterations allowed per task.
- term: ReAct Paradigm
  definition: The interleaved Thought-Action-Observation reasoning and execution framework for language
    models.
