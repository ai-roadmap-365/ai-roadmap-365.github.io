visuals:
  - id: exact-versus-ivf-search
    file: assets/exact-versus-ivf-search.svg
    type: diagram
    title: Exact versus IVF Search
    alt: Exact versus IVF Search showing a query compared against every vector in exact search, against
      centroids then a subset of lists in IVF, and the neighbour missed when it sits in an unprobed list
    description: Side-by-side comparison of exhaustive search and a single-probe IVF search, showing the
      true neighbour that is absent rather than merely down-ranked.
  - id: recall-versus-cost-curve
    file: assets/recall-versus-cost-curve.svg
    type: diagram
    title: Recall versus Cost Curve
    alt: Recall versus Cost Curve showing measured recall at 10 against comparisons for nprobe 1 to 8,
      with the knee where additional probing stops buying recall
    description: Measured curve of recall against comparisons across every nprobe setting, marking the
      knee and the point where full probing exceeds the cost of exact search.
  - id: ann-families
    file: assets/ann-families.svg
    type: diagram
    title: 'Three ways to skip vectors'
    alt: 'Diagram: the three families of approximate nearest neighbour search'
    description: 'A three-stage description of ANN approaches covering partitioning, graph traversal and quantisation.'
  - id: exact-or-approximate
    file: assets/exact-or-approximate.svg
    type: diagram
    title: 'Exact or approximate'
    alt: 'Diagram: exact nearest neighbour search compared with approximate search'
    description: 'A two-column comparison of exhaustive exact search against approximate nearest neighbour search.'
  - id: ann-lineage
    file: assets/ann-lineage.svg
    type: diagram
    title: 'Four steps to the vector database'
    alt: 'Diagram: the progression from k-d trees to packaged vector databases'
    description: 'A four-stage progression of nearest neighbour search from spatial indexes through locality-sensitive hashing and HNSW to vector databases.'
  - id: ivf-mechanics
    file: assets/ivf-mechanics.svg
    type: diagram
    title: 'How IVF works'
    alt: 'Diagram: the build and search phases of an inverted-file index'
    description: 'A four-stage description of IVF covering clustering, centroid comparison, list probing and the cause of recall loss.'
  - id: library-sections
    file: assets/library-sections.svg
    type: diagram
    title: 'Finding a book in a library'
    alt: 'Diagram: reading every spine compared with searching by subject section'
    description: 'A two-column comparison of exhaustive shelf search against subject-section search, including the failure mode.'
  - id: recall-curve
    file: assets/recall-curve.svg
    type: diagram
    title: 'The measured recall curve'
    alt: 'Diagram: the measured recall and cost curve of an IVF index across probe settings'
    description: 'A four-stage reading of a measured recall-versus-cost sweep showing the cheap first probe, the knee, diminishing returns and the full-probe ceiling.'
  - id: mean-recall-hides
    file: assets/mean-recall-hides.svg
    type: diagram
    title: 'Averaged recall hides the shape'
    alt: 'Diagram: two different recall distributions with the same mean'
    description: 'A two-column comparison of two recall distributions sharing a mean of 0.90 but differing in per-query outcome.'
  - id: scaling-constraints
    file: assets/scaling-constraints.svg
    type: diagram
    title: 'Four things that break at scale'
    alt: 'Diagram: the four constraints that break linear-scan retrieval at scale'
    description: 'A four-stage description of scaling constraints covering compute, memory, tail latency and unmeasured recall.'
  - id: ann-implications
    file: assets/ann-implications.svg
    type: diagram
    title: 'Five consequences of an ANN index'
    alt: 'Diagram: the security, privacy, performance, scalability and cost implications of approximate indexes'
    description: 'A five-stage description of ANN implications covering shared structures, deletion tombstones, the recall-latency-memory triangle, sharding and operational cost.'
  - id: scaling-when
    file: assets/scaling-when.svg
    type: diagram
    title: 'When to leave exact search'
    alt: 'Diagram: when to adopt an approximate index'
    description: 'A two-column comparison of staying with exact search against adopting an approximate index, with the measurement obligation.'
  - id: knob-names
    file: assets/knob-names.svg
    type: diagram
    title: 'One knob, several names'
    alt: 'Diagram: the shared tuning parameter across approximate search methods'
    description: 'A two-column comparison of the tuning parameter''s names across ANN methods against its identical meaning.'
  - id: ann-tooling
    file: assets/ann-tooling.svg
    type: diagram
    title: 'Choosing an implementation'
    alt: 'Diagram: approximate search implementations compared by operational commitment'
    description: 'A four-stage description of ANN implementation options from exact search through libraries and database extensions to managed services.'
  - id: scaling-costs
    file: assets/scaling-costs.svg
    type: diagram
    title: 'What the numbers actually are'
    alt: 'Diagram: the concrete compute and memory figures behind retrieval scaling decisions'
    description: 'A three-stage description of scaling figures covering per-query compute, corpus memory and the quantisation saving.'
