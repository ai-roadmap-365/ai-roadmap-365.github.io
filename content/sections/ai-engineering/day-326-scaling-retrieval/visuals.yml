visuals:
  - id: exact-versus-ivf-search
    file: assets/exact-versus-ivf-search.svg
    type: diagram
    title: Exact versus IVF Search
    alt: Exact versus IVF Search showing a query compared against every vector in exact search, against
      centroids then a subset of lists in IVF, and the neighbour missed when it sits in an unprobed list
    description: Side-by-side comparison of exhaustive search and a single-probe IVF search, showing the
      true neighbour that is absent rather than merely down-ranked.
  - id: recall-versus-cost-curve
    file: assets/recall-versus-cost-curve.svg
    type: diagram
    title: Recall versus Cost Curve
    alt: Recall versus Cost Curve showing measured recall at 10 against comparisons for nprobe 1 to 8,
      with the knee where additional probing stops buying recall
    description: Measured curve of recall against comparisons across every nprobe setting, marking the
      knee and the point where full probing exceeds the cost of exact search.
