<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="nprobe, efSearch, ef.">
  <title>One knob, several names</title>
  <style>
    .knob-names-bg   { fill: #f8fafc; }
    .knob-names-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knob-names-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knob-names-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knob-names-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knob-names-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knob-names-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knob-names-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .knob-names-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .knob-names-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .knob-names-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .knob-names-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .knob-names-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knob-names-row { opacity: 1; }
    .knob-names-r0 { animation-delay: 0.00s; }
    .knob-names-r1 { animation-delay: 0.45s; }
    .knob-names-r2 { animation-delay: 0.90s; }
    .knob-names-r3 { animation-delay: 1.35s; }
    .knob-names-r4 { animation-delay: 1.80s; }
    .knob-names-row { animation: knob-names-reveal 7.3s ease-in-out infinite; }
    @keyframes knob-names-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="knob-names-bg" width="980" height="390"/>
  <text class="knob-names-h1"  x="30" y="40">One knob, several names</text>
  <text class="knob-names-sub" x="30" y="64">nprobe, efSearch, ef.</text>
  <rect class="knob-names-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="knob-names-name" x="46" y="122">Different names</text>
  <text class="knob-names-desc" x="46" y="142">Per method.</text>
  <text class="knob-names-desc knob-names-row knob-names-r0" x="46" y="182">nprobe, for partition methods</text>
  <text class="knob-names-desc knob-names-row knob-names-r1" x="46" y="216">efSearch, for graph traversal</text>
  <text class="knob-names-desc knob-names-row knob-names-r2" x="46" y="250">ef, at build time for graph quality</text>
  <text class="knob-names-desc knob-names-row knob-names-r3" x="46" y="284">Different libraries, different defaults</text>
  <text class="knob-names-desc knob-names-row knob-names-r4" x="46" y="318">Different documentation, same concept</text>
  <rect class="knob-names-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="knob-names-name" x="526" y="122">One meaning</text>
  <text class="knob-names-desc" x="526" y="142">How much to search.</text>
  <text class="knob-names-desc knob-names-row knob-names-r0" x="526" y="182">Search more candidates</text>
  <text class="knob-names-desc knob-names-row knob-names-r1" x="526" y="216">Get better recall</text>
  <text class="knob-names-desc knob-names-row knob-names-r2" x="526" y="250">Pay more compute</text>
  <text class="knob-names-desc knob-names-row knob-names-r3" x="526" y="284">The curve has a knee</text>
  <text class="knob-names-desc knob-names-row knob-names-r4" x="526" y="318">And nobody's default is tuned for you</text>
  <text class="knob-names-sub" x="30" y="372">Recognising that these are the same parameter is what makes experience transferable: a recall sweep learned on one index structure reads identically on another.</text>
</svg>
