<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three figures worth remembering.">
  <title>What the numbers actually are</title>
  <style>
    .scaling-costs-bg   { fill: #f8fafc; }
    .scaling-costs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-costs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-costs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-costs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-costs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-costs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-costs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scaling-costs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scaling-costs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scaling-costs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scaling-costs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scaling-costs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scaling-costs-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scaling-costs-stage { opacity: 1; }

    .scaling-costs-s0 { animation-delay: 0.00s; }
    .scaling-costs-e0 { animation-delay: 0.00s; }
    .scaling-costs-s1 { animation-delay: 1.50s; }
    .scaling-costs-e1 { animation-delay: 1.50s; }
    .scaling-costs-s2 { animation-delay: 3.00s; }
    .scaling-costs-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .scaling-costs-conn  { animation: scaling-costs-trace 6s ease-in-out infinite; }
      .scaling-costs-stage { animation: scaling-costs-arrive 6s ease-in-out infinite; }
    }
    @keyframes scaling-costs-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scaling-costs-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scaling-costs-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scaling-costs-stage { animation: scaling-costs-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scaling-costs-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scaling-costs-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scaling-costs-bg" width="980" height="322"/>
  <text class="scaling-costs-h1"  x="30" y="40">What the numbers actually are</text>
  <text class="scaling-costs-sub" x="30" y="64">Three figures worth remembering.</text>
  <g class="scaling-costs-stage scaling-costs-s0">
    <rect class="scaling-costs-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="scaling-costs-step" x="44" y="142">01</text>
    <text class="scaling-costs-name" x="70" y="142">7.7 billion multiply-adds</text>
    <text class="scaling-costs-desc" x="44" y="166">One exact query over ten million</text>
    <text class="scaling-costs-desc" x="44" y="182">768-dimensional vectors.</text>
    <text class="scaling-costs-edge" x="44" y="242">per query</text>
  </g>
  <line class="scaling-costs-line scaling-costs-conn scaling-costs-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#scaling-costs-tip)"/>
  <g class="scaling-costs-stage scaling-costs-s1">
    <rect class="scaling-costs-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="scaling-costs-step" x="359" y="142">02</text>
    <text class="scaling-costs-name" x="385" y="142">About 30 GB</text>
    <text class="scaling-costs-desc" x="359" y="166">The same corpus as float32. This is usually</text>
    <text class="scaling-costs-desc" x="359" y="182">the binding constraint.</text>
  </g>
  <line class="scaling-costs-line scaling-costs-conn scaling-costs-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#scaling-costs-tip)"/>
  <g class="scaling-costs-stage scaling-costs-s2">
    <rect class="scaling-costs-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="scaling-costs-step" x="674" y="142">03</text>
    <text class="scaling-costs-name" x="700" y="142">Fourfold, from 8-bit quantisation</text>
    <text class="scaling-costs-desc" x="674" y="166">Product quantisation far more, each with its</text>
    <text class="scaling-costs-desc" x="674" y="182">own recall cost.</text>
  </g>
  <text class="scaling-costs-sub" x="30" y="304">Having the figures rather than the intuition is what makes the decision concrete: ten million vectors is a number many teams reach, and thirty gigabytes is a machine size rather than an abstraction.</text>
</svg>
