<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="0.90 is two different products.">
  <title>Averaged recall hides the shape</title>
  <style>
    .mean-recall-hides-bg   { fill: #f8fafc; }
    .mean-recall-hides-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-recall-hides-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-recall-hides-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-recall-hides-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-recall-hides-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-recall-hides-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mean-recall-hides-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mean-recall-hides-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mean-recall-hides-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mean-recall-hides-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mean-recall-hides-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mean-recall-hides-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mean-recall-hides-row { opacity: 1; }
    .mean-recall-hides-r0 { animation-delay: 0.00s; }
    .mean-recall-hides-r1 { animation-delay: 0.45s; }
    .mean-recall-hides-r2 { animation-delay: 0.90s; }
    .mean-recall-hides-r3 { animation-delay: 1.35s; }
    .mean-recall-hides-r4 { animation-delay: 1.80s; }
    .mean-recall-hides-row { animation: mean-recall-hides-reveal 7.3s ease-in-out infinite; }
    @keyframes mean-recall-hides-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mean-recall-hides-bg" width="980" height="390"/>
  <text class="mean-recall-hides-h1"  x="30" y="40">Averaged recall hides the shape</text>
  <text class="mean-recall-hides-sub" x="30" y="64">0.90 is two different products.</text>
  <rect class="mean-recall-hides-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mean-recall-hides-name" x="46" y="122">Uniformly good</text>
  <text class="mean-recall-hides-desc" x="46" y="142">Nine of ten, every query.</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r0" x="46" y="182">Every query returns nine relevant results</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r1" x="46" y="216">Consistent, predictable behaviour</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r2" x="46" y="250">A reranker sees enough candidates</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r3" x="46" y="284">No query fails outright</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r4" x="46" y="318">Mean recall: 0.90</text>
  <rect class="mean-recall-hides-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mean-recall-hides-name" x="526" y="122">Bimodal</text>
  <text class="mean-recall-hides-desc" x="526" y="142">Eighteen perfect, two empty.</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r0" x="526" y="182">Eighteen queries return all ten</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r1" x="526" y="216">Two return nothing relevant</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r2" x="526" y="250">Two users get a confidently wrong answer</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r3" x="526" y="284">No aggregate metric shows it</text>
  <text class="mean-recall-hides-desc mean-recall-hides-row mean-recall-hides-r4" x="526" y="318">Mean recall: 0.90</text>
  <text class="mean-recall-hides-sub" x="30" y="372">Only the per-query distribution distinguishes these, which is why a recall measurement worth having reports a histogram rather than a single number.</text>
</svg>
