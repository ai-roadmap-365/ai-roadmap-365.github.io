<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And which one binds first.">
  <title>Four things that break at scale</title>
  <style>
    .scaling-constraints-bg   { fill: #f8fafc; }
    .scaling-constraints-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-constraints-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-constraints-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-constraints-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-constraints-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-constraints-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-constraints-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scaling-constraints-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scaling-constraints-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scaling-constraints-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scaling-constraints-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scaling-constraints-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scaling-constraints-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scaling-constraints-stage { opacity: 1; }

    .scaling-constraints-s0 { animation-delay: 0.00s; }
    .scaling-constraints-e0 { animation-delay: 0.00s; }
    .scaling-constraints-s1 { animation-delay: 1.28s; }
    .scaling-constraints-e1 { animation-delay: 1.28s; }
    .scaling-constraints-s2 { animation-delay: 2.56s; }
    .scaling-constraints-e2 { animation-delay: 2.56s; }
    .scaling-constraints-s3 { animation-delay: 3.84s; }
    .scaling-constraints-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scaling-constraints-conn  { animation: scaling-constraints-trace 6.4s ease-in-out infinite; }
      .scaling-constraints-stage { animation: scaling-constraints-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scaling-constraints-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scaling-constraints-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scaling-constraints-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scaling-constraints-stage { animation: scaling-constraints-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scaling-constraints-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scaling-constraints-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scaling-constraints-bg" width="980" height="322"/>
  <text class="scaling-constraints-h1"  x="30" y="40">Four things that break at scale</text>
  <text class="scaling-constraints-sub" x="30" y="64">And which one binds first.</text>
  <g class="scaling-constraints-stage scaling-constraints-s0">
    <rect class="scaling-constraints-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-constraints-step" x="44" y="142">01</text>
    <text class="scaling-constraints-name" x="70" y="142">Compute</text>
    <text class="scaling-constraints-desc" x="44" y="166">Ten million 768-dimensional</text>
    <text class="scaling-constraints-desc" x="44" y="182">vectors is about 7.7 billion</text>
    <text class="scaling-constraints-desc" x="44" y="198">multiply-adds per query.</text>
  </g>
  <line class="scaling-constraints-line scaling-constraints-conn scaling-constraints-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scaling-constraints-tip)"/>
  <g class="scaling-constraints-stage scaling-constraints-s1">
    <rect class="scaling-constraints-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-constraints-step" x="280" y="142">02</text>
    <text class="scaling-constraints-name" x="306" y="142">Memory</text>
    <text class="scaling-constraints-desc" x="280" y="166">The same corpus in float32 is</text>
    <text class="scaling-constraints-desc" x="280" y="182">around 30 GB. Usually the wall</text>
    <text class="scaling-constraints-desc" x="280" y="198">you hit first.</text>
    <text class="scaling-constraints-edge" x="280" y="242">binds first</text>
  </g>
  <line class="scaling-constraints-line scaling-constraints-conn scaling-constraints-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scaling-constraints-tip)"/>
  <g class="scaling-constraints-stage scaling-constraints-s2">
    <rect class="scaling-constraints-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-constraints-step" x="516" y="142">03</text>
    <text class="scaling-constraints-name" x="542" y="142">Tail latency</text>
    <text class="scaling-constraints-desc" x="516" y="166">A p50 of 20 ms with a p99 of 900</text>
    <text class="scaling-constraints-desc" x="516" y="182">ms is a system people call slow.</text>
  </g>
  <line class="scaling-constraints-line scaling-constraints-conn scaling-constraints-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scaling-constraints-tip)"/>
  <g class="scaling-constraints-stage scaling-constraints-s3">
    <rect class="scaling-constraints-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-constraints-step" x="752" y="142">04</text>
    <text class="scaling-constraints-name" x="778" y="142">Unmeasured recall</text>
    <text class="scaling-constraints-desc" x="752" y="166">The commonest failure is not</text>
    <text class="scaling-constraints-desc" x="752" y="182">slowness, it is not knowing what</text>
    <text class="scaling-constraints-desc" x="752" y="198">you lost.</text>
  </g>
  <text class="scaling-constraints-sub" x="30" y="304">Memory binding before compute is the practically important ordering: quantisation is often the first optimisation worth reaching for, and it is frequently skipped in favour of tuning search parameters.</text>
</svg>
