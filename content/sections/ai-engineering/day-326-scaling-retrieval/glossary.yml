terms:
  - term: Exact Nearest-Neighbour Search
    definition: Comparing a query against every vector in the corpus. Cannot be wrong, and cannot be
      fast.
  - term: Approximate Nearest-Neighbour Search
    definition: Comparing a query against a chosen subset of vectors. Fast because it skips work, and
      approximate because the skipped vectors sometimes held the answer.
  - term: IVF
    definition: An inverted-file index that partitions vectors into lists with a centroid each, and
      searches only the nearest few lists.
  - term: nprobe
    definition: How many lists an IVF search examines. The tuning knob that trades recall against work.
  - term: HNSW
    definition: A hierarchical navigable small-world graph, searched by walking greedily toward the
      query. Generally the best recall-latency trade-off, at a substantial memory cost.
  - term: Recall at k
    definition: The fraction of the true top-k that an approximate search also returned. Measures
      membership, not ordering.
  - term: Quantisation
    definition: Storing vector components with reduced precision so more fit in memory and each
      comparison is cheaper, at some cost in recall.
  - term: Curse of Dimensionality
    definition: The property that in high dimensions almost every point is roughly equidistant from every
      other, which is why classical spatial indexes fail on embeddings.
  - term: Knee of the Curve
    definition: The point on a recall-versus-cost curve after which additional work buys very little
      recall — where sensible defaults live.
  - term: Tail Latency
    definition: The slow end of the latency distribution, such as p99. What users actually notice, and
      not predictable from the mean.
