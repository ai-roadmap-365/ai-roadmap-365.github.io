questions:
  - question: Why can a reranker not recover a document that an approximate index failed to return?
    options:
      - 'A document the index never returned was never a candidate'
      - Rerankers only reorder the top three results
      - Because rerankers use a different embedding model
      - It can, provided the reranker is given a larger k
    answer_index: 0
    explanation: This is why recall matters more than precision at the retrieval stage. An extra
      irrelevant candidate is work for the next stage; a missing one is unrecoverable.
  - question: Full-probe IVF cost 40,160 comparisons against exact search's 40,000. Where do the extra
      160 come from, and what does it imply?
    options:
      - Rounding error in the comparison counter
      - 'The centroid comparisons, paid on every search'
      - The extra cost of sorting a larger candidate list
      - Memory overhead from the inverted lists
    answer_index: 1
    explanation: At nprobe equal to nlist you scan every vector anyway, so you pay brute force's cost
      plus the centroid step. Needing recall 1.0 is evidence the corpus does not need an ANN index.
  - question: Why would uniformly random vectors make an IVF index look far worse than it does on real
      embeddings?
    options:
      - Random vectors are higher-dimensional than embeddings
      - Because cosine similarity is undefined for random vectors
      - 'Real embeddings cluster; uniform noise does not'
      - Because random vectors cannot be clustered by k-means
    answer_index: 2
    explanation: The fixture in this lab is deliberately clustered for exactly this reason. Benchmarking
      an ANN method on uniform noise measures the wrong thing.
  - question: A sweep reports 0.90 mean recall at some setting. What might that hide?
    options:
      - Nothing; the mean fully describes the behaviour
      - That k was set incorrectly
      - That the corpus is too small
      - 'That the distribution is uneven, not the shape of it'
    answer_index: 3
    explanation: Averages hide tails. A handful of queries returning zero results sits comfortably inside
      a healthy-looking mean, which is why per-query minimums matter.
  - question: Why does the lab count vector comparisons rather than measuring elapsed time?
    options:
      - 'Wall-clock is noisy; comparisons are reproducible'
      - Because comparisons are easier to spell
      - Because elapsed time cannot be measured in Python
      - Because comparisons and seconds are always proportional
    answer_index: 0
    explanation: Comparisons make a deterministic teaching signal and a stable test assertion. The
      abstraction breaks down where memory layout and cache behaviour dominate, which the lesson states.
