title: Scaling Retrieval
section: ai-engineering
subsection: production-ai-systems
week: 47
learning_promise:
  'Measure the recall you trade for speed instead of accepting a library default: build
  exact and approximate search side by side, sweep the tuning parameter, and read the recall-versus-cost
  curve for your own data — including the point where an index tuned for perfect recall costs more than
  having no index at all.'
objectives:
  - Explain why approximate search is faster because it skips vectors, and what that costs.
  - Implement an inverted-file index and identify exactly where its recall loss comes from.
  - Measure recall at k against an exact baseline, and explain why a reranker cannot recover a missed
    document.
  - Sweep a tuning parameter and locate the knee where additional work stops buying recall.
  - Justify measuring vector comparisons rather than wall-clock time, and state where that abstraction
    breaks down.
