title: Privacy in AI Systems
section: ai-engineering
subsection: production-ai-systems
week: 47
learning_promise:
  'Handle personal data in a retrieval system so a deletion actually lands: redact identifiers
  at the boundary before one record becomes six, track every store a subject reaches, and verify an
  erasure by reading back rather than by trusting that the delete calls returned.'
objectives:
  - Trace how one document multiplies into text, chunks, embeddings, caches and traces, and why deleting
    the primary row is insufficient.
  - Detect and pseudonymise identifiers at the boundary, with detector ordering that prevents partial
    redaction.
  - Explain why a pseudonym must be salted and why pseudonymised data is not anonymous.
  - Maintain a data-flow record and verify an erasure by re-reading every store.
  - Explain why an embedding is not an anonymous artefact.
