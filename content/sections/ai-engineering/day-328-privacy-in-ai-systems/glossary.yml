terms:
  - term: Data Minimisation
    definition: Collecting only the fields a stated purpose requires. The cheapest privacy control, since
      data never collected cannot leak and does not need deleting.
  - term: Pseudonymisation
    definition: Replacing an identifier with a stable stand-in so records remain linkable without
      carrying identity. Still personal data under most regulations.
  - term: Anonymisation
    definition: Irreversible transformation that takes data out of scope. Much harder than it sounds, and
      frequently claimed for what is really pseudonymisation.
  - term: Salt
    definition: A secret value combined with input before hashing, which defeats precomputed lookup of a
      small value space such as phone numbers.
  - term: Right to Erasure
    definition: A data subject's right to have their personal data deleted, which must reach every
      derived store rather than only the primary one.
  - term: Data Flow Record
    definition: An explicit account of which stores hold data for which subject, so an erasure runs
      against a list rather than someone's memory.
  - term: Verified Erasure
    definition: Deleting and then re-reading to confirm the subject is absent, as distinct from reporting
      success because the delete calls returned.
  - term: Quasi-Identifier
    definition: An attribute that is not identifying alone but becomes so in combination, such as
      postcode with birth date and sex.
  - term: Embedding Inversion
    definition: Recovering meaningful content from an embedding vector, which is why a vector index holds
      personal data rather than harmless numbers.
  - term: Differential Privacy
    definition: A rigorous definition of privacy loss with a measurable budget. The strongest available
      tool, and difficult to apply to free text.
