visuals:
  - id: how-one-record-becomes-six
    file: assets/how-one-record-becomes-six.svg
    type: diagram
    title: How One Record Becomes Six
    alt: How One Record Becomes Six showing a document flowing into extracted text, chunks, embeddings, a
      response cache and an observability trace, with a deletion reaching only the first store
    description: Fan-out diagram of one document into six stored artefacts, with a database delete
      reaching only the first and nothing reporting a problem.
  - id: erasure-verified-versus-assumed
    file: assets/erasure-verified-versus-assumed.svg
    type: diagram
    title: Erasure Verified versus Erasure Assumed
    alt: Erasure Verified versus Erasure Assumed showing delete calls issued to some stores and a
      read-back that reports which stores still hold the subject
    description: Two runs issuing identical delete calls, where only the one that re-reads afterwards
      reports the two stores still holding the subject.
