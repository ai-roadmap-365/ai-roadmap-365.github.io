visuals:
  - id: how-one-record-becomes-six
    file: assets/how-one-record-becomes-six.svg
    type: diagram
    title: How One Record Becomes Six
    alt: How One Record Becomes Six showing a document flowing into extracted text, chunks, embeddings, a
      response cache and an observability trace, with a deletion reaching only the first store
    description: Fan-out diagram of one document into six stored artefacts, with a database delete
      reaching only the first and nothing reporting a problem.
  - id: erasure-verified-versus-assumed
    file: assets/erasure-verified-versus-assumed.svg
    type: diagram
    title: Erasure Verified versus Erasure Assumed
    alt: Erasure Verified versus Erasure Assumed showing delete calls issued to some stores and a
      read-back that reports which stores still hold the subject
    description: Two runs issuing identical delete calls, where only the one that re-reads afterwards
      reports the two stores still holding the subject.
  - id: data-multiplies
    file: assets/data-multiplies.svg
    type: diagram
    title: 'One document, six copies'
    alt: 'Diagram: how one document multiplies across the stores of a retrieval system'
    description: 'A five-stage description of how a single document propagates into text, chunks, vectors, caches and traces.'
  - id: three-controls
    file: assets/three-controls.svg
    type: diagram
    title: 'Three controls, one asymmetry'
    alt: 'Diagram: the three privacy controls and the asymmetry between their failure modes'
    description: 'A two-column comparison of the three privacy controls against the asymmetric cost of getting redaction wrong.'
  - id: privacy-lineage
    file: assets/privacy-lineage.svg
    type: diagram
    title: 'Four developments in data privacy'
    alt: 'Diagram: the progression from data protection law to model memorisation research'
    description: 'A four-stage progression through data protection law, the limits of anonymisation, differential privacy and extraction attacks.'
  - id: privacy-procedure
    file: assets/privacy-procedure.svg
    type: diagram
    title: 'Four steps, and two details'
    alt: 'Diagram: the four steps of privacy engineering and the two implementation details that matter'
    description: 'A six-stage description of privacy engineering covering minimisation, pseudonymisation, pattern ordering, boundary matching, flow recording and verified erasure.'
  - id: office-copies
    file: assets/office-copies.svg
    type: diagram
    title: 'A letter and its copies'
    alt: 'Diagram: destroying an original document compared with tracking and destroying every copy'
    description: 'A two-column comparison of an office without a movement log against one that tracks and verifies every copy.'
  - id: erasure-report
    file: assets/erasure-report.svg
    type: diagram
    title: 'Reading an erasure report'
    alt: 'Diagram: how a verified erasure report converts a silent failure into a visible one'
    description: 'A four-stage walkthrough of a verified erasure showing partial deletion, read-back, the incomplete report and its value.'
  - id: privacy-implications
    file: assets/privacy-implications.svg
    type: diagram
    title: 'Five consequences worth designing for'
    alt: 'Diagram: the security, privacy, performance, scalability and cost implications of privacy engineering'
    description: 'A five-stage description of privacy implications covering the salt, embedding inversion, redaction cost, flow record size and retention.'
  - id: pseudonymisation-limits
    file: assets/pseudonymisation-limits.svg
    type: diagram
    title: 'Pseudonymisation is not anonymisation'
    alt: 'Diagram: pseudonymisation compared with anonymisation and encryption'
    description: 'A two-column comparison of what pseudonymisation provides against what anonymisation and encryption provide.'
  - id: privacy-when
    file: assets/privacy-when.svg
    type: diagram
    title: 'Where these controls apply'
    alt: 'Diagram: when privacy engineering controls are required'
    description: 'A two-column comparison of systems requiring full privacy engineering against smaller ones, and the control that applies universally.'
  - id: privacy-problems
    file: assets/privacy-problems.svg
    type: diagram
    title: 'Five failures the controls address'
    alt: 'Diagram: the five privacy failure modes of AI systems and their controls'
    description: 'A five-stage description of privacy failures covering data multiplication, incomplete deletion, early identifier spread, reversible pseudonyms and forgotten logs.'
  - id: privacy-tooling
    file: assets/privacy-tooling.svg
    type: diagram
    title: 'Detection tooling'
    alt: 'Diagram: pattern-based detection compared with model-based detection for personal data'
    description: 'A two-column comparison of regular-expression detection against named-entity model detection for personal data.'
  - id: test-lesson
    file: assets/test-lesson.svg
    type: diagram
    title: 'A lesson from the tests'
    alt: 'Diagram: how a hexadecimal digest broke an assertion about redacted content'
    description: 'A three-stage description of a test failure caused by asserting on substrings of a hexadecimal digest.'
