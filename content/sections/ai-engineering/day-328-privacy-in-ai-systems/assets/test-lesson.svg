<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A correct redactor failing a wrong test.">
  <title>A lesson from the tests</title>
  <style>
    .test-lesson-bg   { fill: #f8fafc; }
    .test-lesson-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lesson-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lesson-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lesson-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lesson-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lesson-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-lesson-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-lesson-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-lesson-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-lesson-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-lesson-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-lesson-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .test-lesson-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .test-lesson-stage { opacity: 1; }

    .test-lesson-s0 { animation-delay: 0.00s; }
    .test-lesson-e0 { animation-delay: 0.00s; }
    .test-lesson-s1 { animation-delay: 1.50s; }
    .test-lesson-e1 { animation-delay: 1.50s; }
    .test-lesson-s2 { animation-delay: 3.00s; }
    .test-lesson-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .test-lesson-conn  { animation: test-lesson-trace 6s ease-in-out infinite; }
      .test-lesson-stage { animation: test-lesson-arrive 6s ease-in-out infinite; }
    }
    @keyframes test-lesson-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes test-lesson-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .test-lesson-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .test-lesson-stage { animation: test-lesson-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes test-lesson-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="test-lesson-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="test-lesson-bg" width="980" height="322"/>
  <text class="test-lesson-h1"  x="30" y="40">A lesson from the tests</text>
  <text class="test-lesson-sub" x="30" y="64">A correct redactor failing a wrong test.</text>
  <g class="test-lesson-stage test-lesson-s0">
    <rect class="test-lesson-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="test-lesson-step" x="44" y="142">01</text>
    <text class="test-lesson-name" x="70" y="142">The assertion</text>
    <text class="test-lesson-desc" x="44" y="166">The pseudonym must not contain the original</text>
    <text class="test-lesson-desc" x="44" y="182">substring.</text>
  </g>
  <line class="test-lesson-line test-lesson-conn test-lesson-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#test-lesson-tip)"/>
  <g class="test-lesson-stage test-lesson-s1">
    <rect class="test-lesson-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="test-lesson-step" x="359" y="142">02</text>
    <text class="test-lesson-name" x="385" y="142">It failed against a correct redactor</text>
    <text class="test-lesson-desc" x="359" y="166">The digest happened to end in those</text>
    <text class="test-lesson-desc" x="359" y="182">characters — valid hexadecimal.</text>
  </g>
  <line class="test-lesson-line test-lesson-conn test-lesson-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#test-lesson-tip)"/>
  <g class="test-lesson-stage test-lesson-s2">
    <rect class="test-lesson-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="test-lesson-step" x="674" y="142">03</text>
    <text class="test-lesson-name" x="700" y="142">Assert on structure, not substrings</text>
    <text class="test-lesson-desc" x="674" y="166">That the original does not appear, not that a</text>
    <text class="test-lesson-desc" x="674" y="182">digest lacks a hex fragment.</text>
  </g>
  <text class="test-lesson-sub" x="30" y="304">This is worth recording because it wastes an afternoon: the test is testing the digest's alphabet rather than the redaction, and it fails at random depending on the salt.</text>
</svg>
