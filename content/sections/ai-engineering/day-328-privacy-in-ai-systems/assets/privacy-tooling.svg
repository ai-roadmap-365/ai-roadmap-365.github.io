<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Patterns, models, or a platform.">
  <title>Detection tooling</title>
  <style>
    .privacy-tooling-bg   { fill: #f8fafc; }
    .privacy-tooling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-tooling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-tooling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-tooling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-tooling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-tooling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-tooling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .privacy-tooling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .privacy-tooling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .privacy-tooling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .privacy-tooling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .privacy-tooling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-tooling-row { opacity: 1; }
    .privacy-tooling-r0 { animation-delay: 0.00s; }
    .privacy-tooling-r1 { animation-delay: 0.45s; }
    .privacy-tooling-r2 { animation-delay: 0.90s; }
    .privacy-tooling-r3 { animation-delay: 1.35s; }
    .privacy-tooling-r4 { animation-delay: 1.80s; }
    .privacy-tooling-row { animation: privacy-tooling-reveal 7.3s ease-in-out infinite; }
    @keyframes privacy-tooling-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="privacy-tooling-bg" width="980" height="390"/>
  <text class="privacy-tooling-h1"  x="30" y="40">Detection tooling</text>
  <text class="privacy-tooling-sub" x="30" y="64">Patterns, models, or a platform.</text>
  <rect class="privacy-tooling-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="privacy-tooling-name" x="46" y="122">Patterns</text>
  <text class="privacy-tooling-desc" x="46" y="142">Structured identifiers.</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r0" x="46" y="182">Cards, national IDs, emails, phone numbers</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r1" x="46" y="216">Deterministic and auditable</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r2" x="46" y="250">Negligible cost per document</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r3" x="46" y="284">Order longest-first, mind the boundaries</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r4" x="46" y="318">Cannot see names in free text</text>
  <rect class="privacy-tooling-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="privacy-tooling-name" x="526" y="122">Models</text>
  <text class="privacy-tooling-desc" x="526" y="142">Free-text entities.</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r0" x="526" y="182">Named-entity recognition for people and places</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r1" x="526" y="216">Catches what patterns cannot</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r2" x="526" y="250">Probabilistic, so it has a miss rate</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r3" x="526" y="284">Costs real compute per document</text>
  <text class="privacy-tooling-desc privacy-tooling-row privacy-tooling-r4" x="526" y="318">Use both, layered</text>
  <text class="privacy-tooling-sub" x="30" y="372">Layering is the practical arrangement: patterns catch the structured identifiers with certainty, and a model catches the names and addresses that no expression can enumerate.</text>
</svg>
