<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each one silent.">
  <title>Five failures the controls address</title>
  <style>
    .privacy-problems-bg   { fill: #f8fafc; }
    .privacy-problems-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-problems-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-problems-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-problems-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-problems-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-problems-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-problems-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .privacy-problems-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .privacy-problems-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .privacy-problems-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .privacy-problems-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .privacy-problems-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .privacy-problems-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .privacy-problems-stage { opacity: 1; }

    .privacy-problems-s0 { animation-delay: 0.00s; }
    .privacy-problems-e0 { animation-delay: 0.00s; }
    .privacy-problems-s1 { animation-delay: 1.33s; }
    .privacy-problems-e1 { animation-delay: 1.33s; }
    .privacy-problems-s2 { animation-delay: 2.67s; }
    .privacy-problems-e2 { animation-delay: 2.67s; }
    .privacy-problems-s3 { animation-delay: 4.00s; }
    .privacy-problems-e3 { animation-delay: 4.00s; }
    .privacy-problems-s4 { animation-delay: 5.33s; }
    .privacy-problems-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .privacy-problems-conn  { animation: privacy-problems-trace 8s ease-in-out infinite; }
      .privacy-problems-stage { animation: privacy-problems-arrive 8s ease-in-out infinite; }
    }
    @keyframes privacy-problems-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes privacy-problems-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .privacy-problems-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .privacy-problems-stage { animation: privacy-problems-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes privacy-problems-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="privacy-problems-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="privacy-problems-bg" width="980" height="322"/>
  <text class="privacy-problems-h1"  x="30" y="40">Five failures the controls address</text>
  <text class="privacy-problems-sub" x="30" y="64">Each one silent.</text>
  <g class="privacy-problems-stage privacy-problems-s0">
    <rect class="privacy-problems-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-problems-step" x="44" y="142">01</text>
    <text class="privacy-problems-name" x="70" y="142">Data multiplies silently</text>
    <text class="privacy-problems-desc" x="44" y="166">Text, chunks, vectors, a</text>
    <text class="privacy-problems-desc" x="44" y="182">cached response, a trace.</text>
    <text class="privacy-problems-desc" x="44" y="198">An explicit flow record</text>
  </g>
  <line class="privacy-problems-line privacy-problems-conn privacy-problems-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#privacy-problems-tip)"/>
  <g class="privacy-problems-stage privacy-problems-s1">
    <rect class="privacy-problems-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-problems-step" x="233" y="142">02</text>
    <text class="privacy-problems-name" x="259" y="142">Deletion does not propagate</text>
    <text class="privacy-problems-desc" x="233" y="166">The delete reaches the</text>
    <text class="privacy-problems-desc" x="233" y="182">primary store and nothing</text>
    <text class="privacy-problems-desc" x="233" y="198">else.</text>
  </g>
  <line class="privacy-problems-line privacy-problems-conn privacy-problems-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#privacy-problems-tip)"/>
  <g class="privacy-problems-stage privacy-problems-s2">
    <rect class="privacy-problems-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-problems-step" x="422" y="142">03</text>
    <text class="privacy-problems-name" x="448" y="142">Identifiers spread before anyone thinks</text>
    <text class="privacy-problems-desc" x="422" y="166">Redact at the boundary,</text>
    <text class="privacy-problems-desc" x="422" y="182">before the fan-out.</text>
  </g>
  <line class="privacy-problems-line privacy-problems-conn privacy-problems-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#privacy-problems-tip)"/>
  <g class="privacy-problems-stage privacy-problems-s3">
    <rect class="privacy-problems-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-problems-step" x="611" y="142">04</text>
    <text class="privacy-problems-name" x="637" y="142">Pseudonyms are reversed</text>
    <text class="privacy-problems-desc" x="611" y="166">An unsalted hash of a</text>
    <text class="privacy-problems-desc" x="611" y="182">phone number is</text>
    <text class="privacy-problems-desc" x="611" y="198">enumerable. Salt, and</text>
  </g>
  <line class="privacy-problems-line privacy-problems-conn privacy-problems-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#privacy-problems-tip)"/>
  <g class="privacy-problems-stage privacy-problems-s4">
    <rect class="privacy-problems-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-problems-step" x="800" y="142">05</text>
    <text class="privacy-problems-name" x="826" y="142">Logs are forgotten</text>
    <text class="privacy-problems-desc" x="800" y="166">Traces capture prompts in</text>
    <text class="privacy-problems-desc" x="800" y="182">full and outlive the</text>
    <text class="privacy-problems-desc" x="800" y="198">primary data.</text>
  </g>
  <text class="privacy-problems-sub" x="30" y="304">The fourth is easy to underestimate: the value space for phone numbers and national identifiers is small enough that an unsalted digest is a lookup table rather than a pseudonym.</text>
</svg>
