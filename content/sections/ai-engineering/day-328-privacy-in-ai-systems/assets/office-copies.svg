<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Shredding the original is not destruction.">
  <title>A letter and its copies</title>
  <style>
    .office-copies-bg   { fill: #f8fafc; }
    .office-copies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .office-copies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .office-copies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .office-copies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .office-copies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .office-copies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .office-copies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .office-copies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .office-copies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .office-copies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .office-copies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .office-copies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .office-copies-row { opacity: 1; }
    .office-copies-r0 { animation-delay: 0.00s; }
    .office-copies-r1 { animation-delay: 0.45s; }
    .office-copies-r2 { animation-delay: 0.90s; }
    .office-copies-r3 { animation-delay: 1.35s; }
    .office-copies-r4 { animation-delay: 1.80s; }
    .office-copies-row { animation: office-copies-reveal 7.3s ease-in-out infinite; }
    @keyframes office-copies-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="office-copies-bg" width="980" height="390"/>
  <text class="office-copies-h1"  x="30" y="40">A letter and its copies</text>
  <text class="office-copies-sub" x="30" y="64">Shredding the original is not destruction.</text>
  <rect class="office-copies-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="office-copies-name" x="46" y="122">Shred the original</text>
  <text class="office-copies-desc" x="46" y="142">Feels complete.</text>
  <text class="office-copies-desc office-copies-row office-copies-r0" x="46" y="182">The letter is retrieved from the file</text>
  <text class="office-copies-desc office-copies-row office-copies-r1" x="46" y="216">Shredded, and confirmed destroyed</text>
  <text class="office-copies-desc office-copies-row office-copies-r2" x="46" y="250">Six copies exist elsewhere</text>
  <text class="office-copies-desc office-copies-row office-copies-r3" x="46" y="284">The office never tracked where they went</text>
  <text class="office-copies-desc office-copies-row office-copies-r4" x="46" y="318">And the confirmation was sincere</text>
  <rect class="office-copies-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="office-copies-name" x="526" y="122">A movement log</text>
  <text class="office-copies-desc" x="526" y="142">A list, not a memory.</text>
  <text class="office-copies-desc office-copies-row office-copies-r0" x="526" y="182">Every copy and recipient recorded</text>
  <text class="office-copies-desc office-copies-row office-copies-r1" x="526" y="216">Destruction executed against the list</text>
  <text class="office-copies-desc office-copies-row office-copies-r2" x="526" y="250">Someone checks each location afterwards</text>
  <text class="office-copies-desc office-copies-row office-copies-r3" x="526" y="284">Rather than assuming the instruction was followed</text>
  <text class="office-copies-desc office-copies-row office-copies-r4" x="526" y="318">And redaction happens before the copies are made</text>
  <text class="office-copies-sub" x="30" y="372">Blacking out the sender's details before the scan reaches the shared drive is the boundary control, and it is what stops five downstream copies carrying identifiers at all.</text>
</svg>
