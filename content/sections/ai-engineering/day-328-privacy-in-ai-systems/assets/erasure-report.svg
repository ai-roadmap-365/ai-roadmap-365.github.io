<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="INCOMPLETE is the valuable outcome.">
  <title>Reading an erasure report</title>
  <style>
    .erasure-report-bg   { fill: #f8fafc; }
    .erasure-report-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .erasure-report-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .erasure-report-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .erasure-report-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .erasure-report-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .erasure-report-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .erasure-report-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .erasure-report-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .erasure-report-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .erasure-report-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .erasure-report-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .erasure-report-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .erasure-report-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .erasure-report-stage { opacity: 1; }

    .erasure-report-s0 { animation-delay: 0.00s; }
    .erasure-report-e0 { animation-delay: 0.00s; }
    .erasure-report-s1 { animation-delay: 1.28s; }
    .erasure-report-e1 { animation-delay: 1.28s; }
    .erasure-report-s2 { animation-delay: 2.56s; }
    .erasure-report-e2 { animation-delay: 2.56s; }
    .erasure-report-s3 { animation-delay: 3.84s; }
    .erasure-report-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .erasure-report-conn  { animation: erasure-report-trace 6.4s ease-in-out infinite; }
      .erasure-report-stage { animation: erasure-report-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes erasure-report-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes erasure-report-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .erasure-report-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .erasure-report-stage { animation: erasure-report-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes erasure-report-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="erasure-report-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="erasure-report-bg" width="980" height="322"/>
  <text class="erasure-report-h1"  x="30" y="40">Reading an erasure report</text>
  <text class="erasure-report-sub" x="30" y="64">INCOMPLETE is the valuable outcome.</text>
  <g class="erasure-report-stage erasure-report-s0">
    <rect class="erasure-report-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="erasure-report-step" x="44" y="142">01</text>
    <text class="erasure-report-name" x="70" y="142">Deletes issued to the obvious stores</text>
    <text class="erasure-report-desc" x="44" y="166">The database and the vector</text>
    <text class="erasure-report-desc" x="44" y="182">index. The two that come to</text>
    <text class="erasure-report-desc" x="44" y="198">mind.</text>
  </g>
  <line class="erasure-report-line erasure-report-conn erasure-report-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#erasure-report-tip)"/>
  <g class="erasure-report-stage erasure-report-s1">
    <rect class="erasure-report-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="erasure-report-step" x="280" y="142">02</text>
    <text class="erasure-report-name" x="306" y="142">The cache and the audit log are missed</text>
    <text class="erasure-report-desc" x="280" y="166">Realistically, and silently.</text>
  </g>
  <line class="erasure-report-line erasure-report-conn erasure-report-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#erasure-report-tip)"/>
  <g class="erasure-report-stage erasure-report-s2">
    <rect class="erasure-report-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="erasure-report-step" x="516" y="142">03</text>
    <text class="erasure-report-name" x="542" y="142">Read back from every recorded store</text>
    <text class="erasure-report-desc" x="516" y="166">Two still hold the subject.</text>
  </g>
  <line class="erasure-report-line erasure-report-conn erasure-report-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#erasure-report-tip)"/>
  <g class="erasure-report-stage erasure-report-s3">
    <rect class="erasure-report-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="erasure-report-step" x="752" y="142">04</text>
    <text class="erasure-report-name" x="778" y="142">INCOMPLETE, naming both</text>
    <text class="erasure-report-desc" x="752" y="166">A silent failure becomes a</text>
    <text class="erasure-report-desc" x="752" y="182">visible one. This is the entire</text>
    <text class="erasure-report-desc" x="752" y="198">control.</text>
  </g>
  <text class="erasure-report-sub" x="30" y="304">Stability of pseudonyms is worth noting alongside this: the same email produces the same token across records, so an engineer can follow one person through a ticket chain without ever seeing who they are.</text>
</svg>
