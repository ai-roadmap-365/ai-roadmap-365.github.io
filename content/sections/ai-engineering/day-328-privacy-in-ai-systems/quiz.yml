questions:
  - question: One document becomes six stored artefacts. Why is deleting the database row insufficient?
    options:
      - It is sufficient, because the other stores are derived and expire automatically
      - Because the extracted text, chunks, embeddings, response cache and observability trace are each
        separate stores holding the same personal data, with their own retention, and the delete reached
        only one of them
      - Because database deletes are soft by default
      - Because the other copies are encrypted and therefore out of scope
    answer_index: 1
    explanation: The data multiplied and the deletion did not. Every derived store is a place the erasure
      has to reach, and the trace is usually retained longest.
  - question: Why must longer, more specific detection patterns run before shorter ones?
    options:
      - Because shorter patterns are slower to evaluate
      - Because a short pattern can consume part of a longer identifier — a phone matcher taking a slice
        of a card number — leaving the remaining digits in the text while the run reports success
      - Because regular expressions are evaluated in reverse order
      - Ordering makes no difference as long as every pattern runs
    answer_index: 1
    explanation: Partial redaction is the dangerous outcome — it looks like a success and leaks
      anyway. Claiming spans with the most specific detector first prevents it.
  - question: Why does an unsalted hash fail as a pseudonym for a phone number?
    options:
      - Because hashes are reversible by design
      - Because the value space is small enough to enumerate — an attacker hashes every possible number
        and builds a lookup table, recovering the original from the token
      - Because hashing is too slow at scale
      - Because hashes collide too frequently for phone numbers
    answer_index: 1
    explanation: A salt makes the precomputation useless, which is why the salt is a secret and must be
      stored apart from the data it protects.
  - question: Why is an embedding not an anonymous artefact?
    options:
      - Because embeddings store the original text alongside the vector
      - Because inversion attacks can recover substantial content from a vector, so an embedding derived
        from personal data is itself personal data and inherits the same obligations
      - Because embeddings are always logged in plain text
      - Because vector databases do not support deletion
    answer_index: 1
    explanation: Treating a vector index as harmless numbers is the comfortable assumption this research
      closed off. It is a store of personal data and must be included in an erasure.
  - question: A privacy test asserting a token does not contain "ada" failed against a correct redactor.
      Why, and what should it assert instead?
    options:
      - The redactor was broken and the test was right
      - Because "ada" is valid hexadecimal and appeared inside the SHA-256 digest by coincidence; assert
        on the whole identifier and on fragments containing non-hex characters
      - Because the test ran before redaction completed
      - Because tokens are case-sensitive and the fragment was lowercase
    answer_index: 1
    explanation: A privacy test that raises false alarms gets muted, and a muted test protects nothing.
      Choose fragments that cannot occur in a digest by chance.
