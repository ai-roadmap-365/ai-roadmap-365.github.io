visuals:
- id: mcp-security-threat-model-and-attack-vectors
  file: assets/mcp-security-threat-model-and-attack-vectors.svg
  type: diagram
  title: MCP Security Threat Model and Attack Vectors
  alt: MCP Security Threat Model and Attack Vectors diagram illustrating Indirect Prompt Injection, Path
    Traversal, Command Injection, and Data Exfiltration vectors
  description: Threat modeling diagram illustrating the four primary attack vectors against MCP systems.
- id: mcp-defense-in-depth-sandboxing-and-hitl-gate
  file: assets/mcp-defense-in-depth-sandboxing-and-hitl-gate.svg
  type: diagram
  title: MCP Defense in Depth Sandboxing and HITL Gate
  alt: MCP Defense in Depth Sandboxing and HITL Gate flowchart showing Input Sanitization, Path Canonicalization,
    Human Approval Boundary, and Execution Sandbox
  description: Architecture diagram illustrating defense-in-depth security layers and human approval gates.
- id: defense-layers-mcp
  file: assets/defense-layers-mcp.svg
  type: diagram
  title: 'Five layers, none sufficient alone'
  alt: 'Diagram: the five layers of defence in an MCP deployment'
  description: 'A five-stage description of MCP security controls covering input validation, path canonicalisation, least privilege, human approval and audit logging.'
- id: prompt-or-control
  file: assets/prompt-or-control.svg
  type: diagram
  title: 'A prompt is not a control'
  alt: 'Diagram: architectural MCP security controls compared with two things mistaken for them'
  description: 'A two-column comparison of enforced MCP security controls against reliance on prompt instructions and operating system permissions.'
- id: injection-history
  file: assets/injection-history.svg
  type: diagram
  title: 'Three milestones'
  alt: 'Diagram: the progression from classical web vulnerabilities to the MCP security model'
  description: 'A three-stage progression from OWASP-era vulnerabilities through the discovery of indirect prompt injection to MCP''s client-side permission model.'
- id: four-failures-prevented
  file: assets/four-failures-prevented.svg
  type: diagram
  title: 'Four failures the controls prevent'
  alt: 'Diagram: the four catastrophic failure modes MCP security controls prevent'
  description: 'A four-stage description of failures prevented by MCP controls covering accidental deletion, injected actions, filesystem blast radius and auditability.'
- id: egress-filtering
  file: assets/egress-filtering.svg
  type: diagram
  title: 'Filtering egress before the request'
  alt: 'Diagram: the checks applied before an agent-initiated HTTP request is dispatched'
  description: 'A four-stage description of egress filtering covering DNS resolution, private range rejection, metadata endpoint blocking and protocol allowlisting.'
- id: fire-code
  file: assets/fire-code.svg
  type: diagram
  title: 'Building fire regulations'
  alt: 'Diagram: fire safety systems as an analogy for containment-based AI security'
  description: 'A two-column comparison of preventing fires against containing them, as an analogy for prompt injection defence.'
- id: rate-limits
  file: assets/rate-limits.svg
  type: diagram
  title: 'Bounding a runaway loop'
  alt: 'Diagram: the resource guardrails that bound an agent''s tool usage'
  description: 'A three-stage description of resource guardrails covering request rate limits, third-party API quotas and local disk I/O.'
- id: os-sandboxing
  file: assets/os-sandboxing.svg
  type: diagram
  title: 'Operating-system level isolation'
  alt: 'Diagram: the operating system primitives that isolate an MCP server process'
  description: 'A three-stage description of OS-level sandboxing covering namespaces and cgroups, seccomp syscall filtering, and filesystem mount restrictions.'
- id: supply-chain-mcp
  file: assets/supply-chain-mcp.svg
  type: diagram
  title: 'Third-party servers are dependencies'
  alt: 'Diagram: verified subprocess integrity compared with running an unverified package'
  description: 'A two-column comparison of running verified MCP server binaries against installing unverified packages from public registries.'
- id: hitl-friction
  file: assets/hitl-friction.svg
  type: diagram
  title: 'Approval friction against velocity'
  alt: 'Diagram: confirming every action compared with confirming only mutations'
  description: 'A two-column comparison of universal confirmation prompts against confirmation restricted to state-changing operations.'
- id: mcp-security-when
  file: assets/mcp-security-when.svg
  type: diagram
  title: 'Where the controls are mandatory'
  alt: 'Diagram: when MCP security controls are required'
  description: 'A two-column comparison of deployments requiring the full control set against the controls that apply unconditionally.'
