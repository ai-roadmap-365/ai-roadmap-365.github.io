<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="With shell privileges attached.">
  <title>Third-party servers are dependencies</title>
  <style>
    .supply-chain-mcp-bg   { fill: #f8fafc; }
    .supply-chain-mcp-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-mcp-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-mcp-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-mcp-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-mcp-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-mcp-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .supply-chain-mcp-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .supply-chain-mcp-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .supply-chain-mcp-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .supply-chain-mcp-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .supply-chain-mcp-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .supply-chain-mcp-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .supply-chain-mcp-row { opacity: 1; }
    .supply-chain-mcp-r0 { animation-delay: 0.00s; }
    .supply-chain-mcp-r1 { animation-delay: 0.45s; }
    .supply-chain-mcp-r2 { animation-delay: 0.90s; }
    .supply-chain-mcp-r3 { animation-delay: 1.35s; }
    .supply-chain-mcp-r4 { animation-delay: 1.80s; }
    .supply-chain-mcp-row { animation: supply-chain-mcp-reveal 7.3s ease-in-out infinite; }
    @keyframes supply-chain-mcp-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="supply-chain-mcp-bg" width="980" height="390"/>
  <text class="supply-chain-mcp-h1"  x="30" y="40">Third-party servers are dependencies</text>
  <text class="supply-chain-mcp-sub" x="30" y="64">With shell privileges attached.</text>
  <rect class="supply-chain-mcp-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="supply-chain-mcp-name" x="46" y="122">Verified</text>
  <text class="supply-chain-mcp-desc" x="46" y="142">Pinned and checked.</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r0" x="46" y="182">SHA-256 of the binary, or an image digest</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r1" x="46" y="216">Verified before spawning</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r2" x="46" y="250">A pinned version, not a floating tag</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r3" x="46" y="284">Reviewed like any dependency</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r4" x="46" y="318">Day 347's argument, at process start</text>
  <rect class="supply-chain-mcp-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="supply-chain-mcp-name" x="526" y="122">Unverified</text>
  <text class="supply-chain-mcp-desc" x="526" y="142">Arbitrary code at startup.</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r0" x="526" y="182">Installed from npm or PyPI on trust</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r1" x="526" y="216">A malicious update runs on next launch</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r2" x="526" y="250">With your shell privileges</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r3" x="526" y="284">Reads SSH keys and environment secrets</text>
  <text class="supply-chain-mcp-desc supply-chain-mcp-row supply-chain-mcp-r4" x="526" y="318">And nothing detects it</text>
  <text class="supply-chain-mcp-sub" x="30" y="372">The install decision is the security decision here, and it is made once, quietly, by someone adding a line to a config file — which is exactly the shape of every supply-chain compromise.</text>
</svg>
