<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Gate mutations, not reads.">
  <title>Approval friction against velocity</title>
  <style>
    .hitl-friction-bg   { fill: #f8fafc; }
    .hitl-friction-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hitl-friction-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hitl-friction-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hitl-friction-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hitl-friction-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hitl-friction-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hitl-friction-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hitl-friction-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hitl-friction-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hitl-friction-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hitl-friction-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hitl-friction-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hitl-friction-row { opacity: 1; }
    .hitl-friction-r0 { animation-delay: 0.00s; }
    .hitl-friction-r1 { animation-delay: 0.45s; }
    .hitl-friction-r2 { animation-delay: 0.90s; }
    .hitl-friction-r3 { animation-delay: 1.35s; }
    .hitl-friction-r4 { animation-delay: 1.80s; }
    .hitl-friction-row { animation: hitl-friction-reveal 7.3s ease-in-out infinite; }
    @keyframes hitl-friction-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hitl-friction-bg" width="980" height="390"/>
  <text class="hitl-friction-h1"  x="30" y="40">Approval friction against velocity</text>
  <text class="hitl-friction-sub" x="30" y="64">Gate mutations, not reads.</text>
  <rect class="hitl-friction-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hitl-friction-name" x="46" y="122">Confirm everything</text>
  <text class="hitl-friction-desc" x="46" y="142">Velocity destroyed.</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r0" x="46" y="182">A prompt for every file read</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r1" x="46" y="216">Autonomy becomes supervision</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r2" x="46" y="250">People approve by reflex</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r3" x="46" y="284">Which is worse than no gate</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r4" x="46" y="318">The gate stops carrying information</text>
  <rect class="hitl-friction-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hitl-friction-name" x="526" y="122">Confirm mutations</text>
  <text class="hitl-friction-desc" x="526" y="142">Friction where it pays.</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r0" x="526" y="182">DELETE, UPDATE, DROP, SHELL</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r1" x="526" y="216">Network egress</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r2" x="526" y="250">Anything that spends money</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r3" x="526" y="284">Reads proceed freely</text>
  <text class="hitl-friction-desc hitl-friction-row hitl-friction-r4" x="526" y="318">The prompt still means something</text>
  <text class="hitl-friction-sub" x="30" y="372">This is Day 339's alert-fatigue argument in a different costume: a confirmation dialog that always says yes is a keystroke rather than a decision, and it fails at exactly the wrong moment.</text>
</svg>
