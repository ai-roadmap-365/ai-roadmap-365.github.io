<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three primitives, in increasing strictness.">
  <title>Operating-system level isolation</title>
  <style>
    .os-sandboxing-bg   { fill: #f8fafc; }
    .os-sandboxing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-sandboxing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-sandboxing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-sandboxing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-sandboxing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .os-sandboxing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .os-sandboxing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .os-sandboxing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .os-sandboxing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .os-sandboxing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .os-sandboxing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .os-sandboxing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .os-sandboxing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .os-sandboxing-stage { opacity: 1; }

    .os-sandboxing-s0 { animation-delay: 0.00s; }
    .os-sandboxing-e0 { animation-delay: 0.00s; }
    .os-sandboxing-s1 { animation-delay: 1.50s; }
    .os-sandboxing-e1 { animation-delay: 1.50s; }
    .os-sandboxing-s2 { animation-delay: 3.00s; }
    .os-sandboxing-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .os-sandboxing-conn  { animation: os-sandboxing-trace 6s ease-in-out infinite; }
      .os-sandboxing-stage { animation: os-sandboxing-arrive 6s ease-in-out infinite; }
    }
    @keyframes os-sandboxing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes os-sandboxing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .os-sandboxing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .os-sandboxing-stage { animation: os-sandboxing-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes os-sandboxing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="os-sandboxing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="os-sandboxing-bg" width="980" height="322"/>
  <text class="os-sandboxing-h1"  x="30" y="40">Operating-system level isolation</text>
  <text class="os-sandboxing-sub" x="30" y="64">Three primitives, in increasing strictness.</text>
  <g class="os-sandboxing-stage os-sandboxing-s0">
    <rect class="os-sandboxing-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="os-sandboxing-step" x="44" y="142">01</text>
    <text class="os-sandboxing-name" x="70" y="142">Namespaces and cgroups</text>
    <text class="os-sandboxing-desc" x="44" y="166">Unprivileged user namespace, 512 MB memory,</text>
    <text class="os-sandboxing-desc" x="44" y="182">one CPU. Runaway resources bounded.</text>
    <text class="os-sandboxing-edge" x="44" y="242">limits</text>
  </g>
  <line class="os-sandboxing-line os-sandboxing-conn os-sandboxing-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#os-sandboxing-tip)"/>
  <g class="os-sandboxing-stage os-sandboxing-s1">
    <rect class="os-sandboxing-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="os-sandboxing-step" x="359" y="142">02</text>
    <text class="os-sandboxing-name" x="385" y="142">Seccomp filtering</text>
    <text class="os-sandboxing-desc" x="359" y="166">Block ptrace, mount and raw sockets at the</text>
    <text class="os-sandboxing-desc" x="359" y="182">syscall boundary.</text>
  </g>
  <line class="os-sandboxing-line os-sandboxing-conn os-sandboxing-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#os-sandboxing-tip)"/>
  <g class="os-sandboxing-stage os-sandboxing-s2">
    <rect class="os-sandboxing-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="os-sandboxing-step" x="674" y="142">03</text>
    <text class="os-sandboxing-name" x="700" y="142">Restricted mounts</text>
    <text class="os-sandboxing-desc" x="674" y="166">The project directory read-write; system</text>
    <text class="os-sandboxing-desc" x="674" y="182">libraries read-only.</text>
  </g>
  <text class="os-sandboxing-sub" x="30" y="304">Layered this way, arbitrary code execution through an unsanitised parameter still leaves the attacker inside a filesystem sandbox with no egress and a CPU quota, which is a very different incident.</text>
</svg>
