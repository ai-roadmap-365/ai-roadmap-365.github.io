questions:
- question: What is an 'Indirect Prompt Injection' attack in the context of an MCP server?
  options:
  - A hardware fault on the GPU
  - Untrusted external data (such as a webpage, email, or database record retrieved via a tool/resource)
    containing adversarial instructions designed to hijack the model's reasoning and execute unauthorized
    tool actions
  - A syntax error in the JSON configuration
  - An expired SSL certificate
  answer_index: 1
  explanation: Indirect prompt injection occurs when external content ingested via tools or resources
    instructs the model to perform malicious actions (e.g. exfiltrating data).
- question: How should an MCP server exposing filesystem operations defend against Path Traversal (`../`)
    attacks?
  options:
  - Disable all file reading completely
  - Resolve canonical paths using `os.path.realpath` and verify that the target path begins with the authorized
    root directory (`os.path.commonpath([target, root]) == root`)
  - Rely solely on the client's honesty
  - Compress file paths with gzip
  answer_index: 1
  explanation: Canonical path resolution and common prefix verification prevent malicious paths like `../../etc/passwd`
    from escaping the sandbox root.
- question: What is the primary security benefit of Human-in-the-Loop (HITL) approval gates for MCP tools?
  options:
  - It reduces token consumption by 50%
  - It prevents autonomous AI agents from executing destructive mutations (e.g. `DROP TABLE`, `rm -rf`,
    sending emails) without explicit human verification of parameters
  - It compiles Python scripts into binaries
  - It bypasses operating system user permissions
  answer_index: 1
  explanation: HITL gates insert a mandatory human authorization boundary before irreversible or dangerous
    actions are dispatched.
- question: Why should database MCP servers use parameterized queries rather than string concatenation?
  options:
  - To prevent SQL Injection attacks where untrusted model input alters SQL query structure and executes
    arbitrary database commands
  - Parameterized queries are written in Latin
  - To reduce RAM usage to zero
  - To format database rows as HTML
  answer_index: 0
  explanation: Parameterized SQL bindings separate SQL logic from user data, eliminating SQL injection
    risks.
- question: Which principle of cybersecurity should govern tool permissions granted to an autonomous agent?
  options:
  - Principle of Maximum Privilege (grant root access to all tools)
  - Principle of Least Privilege (grant only the minimal read/write capabilities strictly necessary for
    the specific task)
  - Security by Obscurity
  - Zero Encryption
  answer_index: 1
  explanation: Least privilege limits the blast radius of compromised or malfunctioning agents.
