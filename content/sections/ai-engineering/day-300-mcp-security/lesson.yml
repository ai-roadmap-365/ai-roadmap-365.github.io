learning_promise: 'Master threat modeling and defense-in-depth for Model Context Protocol systems: defend
  against indirect prompt injection, prevent command injection and path traversal, implement human-in-the-loop
  confirmation gates, and enforce least-privilege sandboxing.'
objectives:
- Construct an MCP Threat Model covering indirect prompt injection, path traversal, command injection,
  and data exfiltration.
- Implement human-in-the-loop approval gates for destructive and high-risk tool operations.
- Enforce strict path canonicalization and directory sandboxing for filesystem resources.
- Sanitize and validate tool input arguments against injection payloads.
- Build a secure MCP Security Guard middleware in Python.
