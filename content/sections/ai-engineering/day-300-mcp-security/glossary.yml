terms:
- term: Indirect Prompt Injection
  definition: A vulnerability where adversarial instructions embedded in retrieved external data manipulate
    an AI model's behavior.
- term: Path Traversal
  definition: An attack using `../` sequences to access files and directories outside an authorized sandbox
    boundary.
- term: Human-in-the-Loop (HITL) Gate
  definition: A mandatory human authorization checkpoint pausing execution before high-risk tool operations
    occur.
- term: Least Privilege
  definition: A security architecture granting only the minimal permissions required to complete a given
    task.
- term: Path Canonicalization
  definition: Resolving symbolic links and relative path tokens (`..`) to determine the absolute canonical
    filesystem location.
- term: Command Injection
  definition: An exploit where unsanitized user inputs execute arbitrary system shell commands via `os.system`
    or `subprocess`.
- term: Data Exfiltration
  definition: Unauthorized transfer of sensitive internal data (passwords, tokens, records) to an external
    attacker via tool calls.
- term: Blast Radius
  definition: The maximum potential damage an attacker or compromised agent can inflict if an exploit
    succeeds.
