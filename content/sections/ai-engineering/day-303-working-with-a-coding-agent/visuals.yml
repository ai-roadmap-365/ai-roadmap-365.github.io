visuals:
- id: specification-driven-prompting-anatomy
  file: assets/specification-driven-prompting-anatomy.svg
  type: diagram
  title: Specification Driven Prompting Anatomy
  alt: Specification Driven Prompting Anatomy diagram showing Goal, Context Files, Type Signatures, Explicit
    Constraints, Non-Goals, and Verification Plan
  description: Anatomy breakdown of a high-leverage specification prompt for AI coding agents.
- id: human-agent-collaborative-steering-loop
  file: assets/human-agent-collaborative-steering-loop.svg
  type: diagram
  title: Human Agent Collaborative Steering Loop
  alt: Human Agent Collaborative Steering Loop showing Developer Spec, Agent Plan Review, Code Patch Execution,
    Test Gate, and Steering Intervention
  description: Process flowchart illustrating the human-in-the-loop collaborative steering loop.
- id: spec-anatomy
  file: assets/spec-anatomy.svg
  type: diagram
  title: 'What a usable specification contains'
  alt: 'Diagram: the five components of a specification a coding agent can execute'
  description: 'A five-stage description of a coding specification covering target files, the change, type contracts, non-goals and a verification command.'
- id: vague-or-specified
  file: assets/vague-or-specified.svg
  type: diagram
  title: '"Make search faster", or a specification'
  alt: 'Diagram: an ambiguous instruction compared with a bounded specification'
  description: 'A two-column comparison of a vague request to a coding agent against a specified one with constraints and a verification gate.'
- id: spec-lineage
  file: assets/spec-lineage.svg
  type: diagram
  title: 'Three disciplines this borrows from'
  alt: 'Diagram: the software engineering practices agentic specification draws on'
  description: 'A three-stage progression from test-driven development through specification by example to prompt-driven engineering.'
- id: attention-dilution
  file: assets/attention-dilution.svg
  type: diagram
  title: 'Why dumping files hurts'
  alt: 'Diagram: how irrelevant context dilutes a transformer''s attention distribution'
  description: 'A four-stage explanation of attention dilution covering the softmax over keys, the effect of irrelevant tokens, degraded retrieval and the surgical alternative.'
- id: cognitive-traps
  file: assets/cognitive-traps.svg
  type: diagram
  title: 'Three cognitive traps'
  alt: 'Diagram: the three failure loops a coding agent falls into'
  description: 'A four-stage description of coding agent failure loops covering circular linting, phantom dependencies, invasive refactoring, and the intervention.'
- id: cnc-blueprint
  file: assets/cnc-blueprint.svg
  type: diagram
  title: 'A napkin sketch, or a CAD file'
  alt: 'Diagram: an imprecise sketch compared with a toleranced specification for a machine'
  description: 'A two-column comparison of a hand sketch against a CAD specification, as an analogy for prompt precision.'
- id: idempotency-case
  file: assets/idempotency-case.svg
  type: diagram
  title: 'The same task, twice'
  alt: 'Diagram: the measured difference between ad-hoc prompting and a specification on one task'
  description: 'A four-stage walkthrough of a real refactoring attempted with an ad-hoc prompt and then with a specification.'
- id: ambiguity-cost
  file: assets/ambiguity-cost.svg
  type: diagram
  title: 'What "handle errors properly" means'
  alt: 'Diagram: how an ambiguous requirement expands into competing implementations'
  description: 'A four-stage description of the strategies a model may sample from for an ambiguous error-handling requirement.'
- id: spec-checklist
  file: assets/spec-checklist.svg
  type: diagram
  title: 'Five checks before you press Enter'
  alt: 'Diagram: the five-point checklist for a production coding specification'
  description: 'A five-stage checklist covering file bounds, type signatures, invariants, non-goals and a verification gate.'
- id: spec-when
  file: assets/spec-when.svg
  type: diagram
  title: 'When a specification is worth writing'
  alt: 'Diagram: when specification-driven prompting is warranted'
  description: 'A two-column comparison of tasks warranting a full specification against those where a short prompt suffices.'
