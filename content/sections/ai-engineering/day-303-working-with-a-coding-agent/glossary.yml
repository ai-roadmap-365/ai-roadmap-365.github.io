terms:
- term: Specification-Driven Development
  definition: Directing coding agents with structured technical specs defining requirements, schemas,
    and non-goals.
- term: Context Window Hygiene
  definition: Curating minimal, high-signal context to prevent attention dilution and prompt bloat in
    coding models.
- term: Non-Goals
  definition: Explicit boundaries in a prompt specifying what the agent must NOT modify or refactor.
- term: Agent Drift
  definition: When an agent wanders off the original task trajectory and begins making unrequested codebase
    modifications.
- term: Surgical Context Package
  definition: A curated collection of relevant interface contracts, test cases, and error logs provided
    to an agent.
- term: Turn-by-Turn Scoping
  definition: Breaking a complex multi-hour feature into discrete, verifiable 10-minute milestones for
    the agent.
- term: Corrective Pivot Prompt
  definition: A targeted intervention message steering an agent out of an incorrect assumption or failing
    loop.
- term: Golden Test Case
  definition: A deterministic unit test defining the exact expected behavior that the agent's code must
    satisfy.
