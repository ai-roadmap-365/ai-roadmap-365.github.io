<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is overhead.">
  <title>When a specification is worth writing</title>
  <style>
    .spec-when-bg   { fill: #f8fafc; }
    .spec-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spec-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .spec-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .spec-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .spec-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .spec-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .spec-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spec-when-row { opacity: 1; }
    .spec-when-r0 { animation-delay: 0.00s; }
    .spec-when-r1 { animation-delay: 0.45s; }
    .spec-when-r2 { animation-delay: 0.90s; }
    .spec-when-r3 { animation-delay: 1.35s; }
    .spec-when-r4 { animation-delay: 1.80s; }
    .spec-when-row { animation: spec-when-reveal 7.3s ease-in-out infinite; }
    @keyframes spec-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="spec-when-bg" width="980" height="390"/>
  <text class="spec-when-h1"  x="30" y="40">When a specification is worth writing</text>
  <text class="spec-when-sub" x="30" y="64">And when it is overhead.</text>
  <rect class="spec-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="spec-when-name" x="46" y="122">Specify it</text>
  <text class="spec-when-desc" x="46" y="142">Where a wrong edit costs.</text>
  <text class="spec-when-desc spec-when-row spec-when-r0" x="46" y="182">Core business logic</text>
  <text class="spec-when-desc spec-when-row spec-when-r1" x="46" y="216">Refactoring production APIs</text>
  <text class="spec-when-desc spec-when-row spec-when-r2" x="46" y="250">Distributed systems bugs</text>
  <text class="spec-when-desc spec-when-row spec-when-r3" x="46" y="284">Large repositories with downstream consumers</text>
  <text class="spec-when-desc spec-when-row spec-when-r4" x="46" y="318">Anything you would review carefully</text>
  <rect class="spec-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="spec-when-name" x="526" y="122">Do not</text>
  <text class="spec-when-desc" x="526" y="142">Small and disposable.</text>
  <text class="spec-when-desc spec-when-row spec-when-r0" x="526" y="182">A three-line regex</text>
  <text class="spec-when-desc spec-when-row spec-when-r1" x="526" y="216">Formatting a markdown table</text>
  <text class="spec-when-desc spec-when-row spec-when-r2" x="526" y="250">A throwaway prototype</text>
  <text class="spec-when-desc spec-when-row spec-when-r3" x="526" y="284">The spec would exceed the change</text>
  <text class="spec-when-desc spec-when-row spec-when-r4" x="526" y="318">But name the file anyway</text>
  <text class="spec-when-sub" x="30" y="372">Naming the file is the one habit worth keeping even for trivial tasks, because it is the single constraint that prevents an agent deciding your small request warrants a large refactor.</text>
</svg>
