<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Human Agent Collaborative Steering Loop">
  <title>Human Agent Collaborative Steering Loop</title>
  <defs>
    <style>
      .d303f-bg { fill: #f8fafc; }
      .d303f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d303f-dev { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d303f-agent { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d303f-test { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d303f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d303f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d303f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d303f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d303f-pipe { stroke: #3b82f6; stroke-width: 2px; marker-end: url(#d303f-m); fill: none; }
      .d303f-loop { stroke: #ef4444; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d303f-bg" />
  
  <text x="40" y="40" class="d303a-title">Human-in-the-Loop Collaborative Steering Flow</text>
  <text x="40" y="65" class="d303a-subtitle">Human Agent Collaborative Steering Loop showing Developer Spec, Agent Plan Review, Code Patch Execution, Test Gate, and Steering Intervention</text>
  
  <!-- Step 1: Developer Spec -->
  <rect x="40" y="110" width="180" height="260" class="d303f-dev" />
  <text x="55" y="140" class="d303f-header" fill="#1d4ed8">1. Developer Spec</text>
  <text x="55" y="170" class="d303f-text">• Defines requirements</text>
  <text x="55" y="190" class="d303f-text">• Attaches interfaces</text>
  <text x="55" y="210" class="d303f-text">• Sets non-goals</text>
  <text x="55" y="230" class="d303f-text">• Prompts: "Plan first"</text>
  
  <!-- Step 2: Agent Plan Approval -->
  <rect x="250" y="110" width="180" height="260" class="d303f-agent" />
  <text x="265" y="140" class="d303f-header" fill="#7e22ce">2. Plan Review</text>
  <text x="265" y="170" class="d303f-text">• Agent outlines steps</text>
  <text x="265" y="190" class="d303f-text">• Developer inspects plan</text>
  <text x="265" y="210" class="d303f-text">• Catches flawed logic</text>
  <text x="265" y="230" class="d303f-text">• Approves to execute</text>
  
  <!-- Step 3: Patch & Test Gate -->
  <rect x="460" y="110" width="180" height="260" class="d303f-test" />
  <text x="475" y="140" class="d303f-header" fill="#15803d">3. Patch &amp; Test Gate</text>
  <text x="475" y="170" class="d303f-text">• Agent applies diffs</text>
  <text x="475" y="190" class="d303f-text">• Executes unit tests</text>
  <text x="475" y="210" class="d303f-text">• Green: Ready to ship</text>
  <text x="475" y="230" class="d303f-text">• Red: Self-correct or alert</text>
  
  <!-- Step 4: Steering Pivot -->
  <rect x="670" y="110" width="190" height="260" class="d303f-card" />
  <text x="685" y="140" class="d303f-header">4. Steering Pivot</text>
  <text x="685" y="170" class="d303f-text">• If agent gets stuck:</text>
  <text x="685" y="190" class="d303f-text">  Dev supplies hint</text>
  <text x="685" y="210" class="d303f-text">• Reverts bad changes</text>
  <text x="685" y="230" class="d303f-text">• Unblocks progress</text>
  
  <!-- Loop Arrow -->
  <path d="M 765 240 L 765 330 L 340 330 L 340 240" class="d303f-loop" />
  <text x="430" y="350" class="d303f-text" font-weight="600" fill="#dc2626">Corrective Pivot Intervention</text>
</svg>