<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same agent, two outcomes.">
  <title>"Make search faster", or a specification</title>
  <style>
    .vague-or-specified-bg   { fill: #f8fafc; }
    .vague-or-specified-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vague-or-specified-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vague-or-specified-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vague-or-specified-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vague-or-specified-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vague-or-specified-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vague-or-specified-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vague-or-specified-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vague-or-specified-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vague-or-specified-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vague-or-specified-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vague-or-specified-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vague-or-specified-row { opacity: 1; }
    .vague-or-specified-r0 { animation-delay: 0.00s; }
    .vague-or-specified-r1 { animation-delay: 0.45s; }
    .vague-or-specified-r2 { animation-delay: 0.90s; }
    .vague-or-specified-r3 { animation-delay: 1.35s; }
    .vague-or-specified-r4 { animation-delay: 1.80s; }
    .vague-or-specified-row { animation: vague-or-specified-reveal 7.3s ease-in-out infinite; }
    @keyframes vague-or-specified-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vague-or-specified-bg" width="980" height="390"/>
  <text class="vague-or-specified-h1"  x="30" y="40">"Make search faster", or a specification</text>
  <text class="vague-or-specified-sub" x="30" y="64">The same agent, two outcomes.</text>
  <rect class="vague-or-specified-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vague-or-specified-name" x="46" y="122">"Make our search faster"</text>
  <text class="vague-or-specified-desc" x="46" y="142">Every choice is the agent's.</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r0" x="46" y="182">Deletes indexes it judged unused</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r1" x="46" y="216">Installs an unapproved search daemon</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r2" x="46" y="250">Rewrites models in another language</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r3" x="46" y="284">Breaks the login page</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r4" x="46" y="318">All of it defensible from the instruction</text>
  <rect class="vague-or-specified-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vague-or-specified-name" x="526" y="122">A specification</text>
  <text class="vague-or-specified-desc" x="526" y="142">One bounded change.</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r0" x="526" y="182">"Trigram index on company_name in db/search.py"</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r1" x="526" y="216">"No external packages"</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r2" x="526" y="250">"Preserve existing signatures"</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r3" x="526" y="284">"pytest tests/test_search.py, under 15ms"</text>
  <text class="vague-or-specified-desc vague-or-specified-row vague-or-specified-r4" x="526" y="318">A clean, passing diff in 30 seconds</text>
  <text class="vague-or-specified-sub" x="30" y="372">The output quality is a function of the boundaries rather than of the model: the left column is what an unbounded search over plausible interpretations looks like when it runs at full speed.</text>
</svg>
