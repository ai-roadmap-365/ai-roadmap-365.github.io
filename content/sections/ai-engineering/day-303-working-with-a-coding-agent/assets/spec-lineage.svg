<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None of them new.">
  <title>Three disciplines this borrows from</title>
  <style>
    .spec-lineage-bg   { fill: #f8fafc; }
    .spec-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spec-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .spec-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .spec-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .spec-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .spec-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .spec-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .spec-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .spec-lineage-stage { opacity: 1; }

    .spec-lineage-s0 { animation-delay: 0.00s; }
    .spec-lineage-e0 { animation-delay: 0.00s; }
    .spec-lineage-s1 { animation-delay: 1.50s; }
    .spec-lineage-e1 { animation-delay: 1.50s; }
    .spec-lineage-s2 { animation-delay: 3.00s; }
    .spec-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .spec-lineage-conn  { animation: spec-lineage-trace 6s ease-in-out infinite; }
      .spec-lineage-stage { animation: spec-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes spec-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes spec-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .spec-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .spec-lineage-stage { animation: spec-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes spec-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="spec-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="spec-lineage-bg" width="980" height="322"/>
  <text class="spec-lineage-h1"  x="30" y="40">Three disciplines this borrows from</text>
  <text class="spec-lineage-sub" x="30" y="64">None of them new.</text>
  <g class="spec-lineage-stage spec-lineage-s0">
    <rect class="spec-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="spec-lineage-step" x="44" y="142">01</text>
    <text class="spec-lineage-name" x="70" y="142">Test-driven development, 2002</text>
    <text class="spec-lineage-desc" x="44" y="166">Write the verification first. For a model,</text>
    <text class="spec-lineage-desc" x="44" y="182">tests are deterministic guardrails.</text>
  </g>
  <line class="spec-lineage-line spec-lineage-conn spec-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#spec-lineage-tip)"/>
  <g class="spec-lineage-stage spec-lineage-s1">
    <rect class="spec-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="spec-lineage-step" x="359" y="142">02</text>
    <text class="spec-lineage-name" x="385" y="142">Specification by example, 2011</text>
    <text class="spec-lineage-desc" x="359" y="166">Concrete inputs and outputs remove ambiguity</text>
    <text class="spec-lineage-desc" x="359" y="182">between people, and between people and</text>
    <text class="spec-lineage-desc" x="359" y="198">models.</text>
  </g>
  <line class="spec-lineage-line spec-lineage-conn spec-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#spec-lineage-tip)"/>
  <g class="spec-lineage-stage spec-lineage-s2">
    <rect class="spec-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="spec-lineage-step" x="674" y="142">03</text>
    <text class="spec-lineage-name" x="700" y="142">Prompt-driven engineering, 2023</text>
    <text class="spec-lineage-desc" x="674" y="166">Plan, gather context, patch, verify — an</text>
    <text class="spec-lineage-desc" x="674" y="182">order-of-magnitude defect reduction.</text>
  </g>
  <text class="spec-lineage-sub" x="30" y="304">Nothing here was invented for agents: every one of these practices was developed to remove ambiguity between humans, and a model is simply a collaborator with no shared context at all.</text>
</svg>
