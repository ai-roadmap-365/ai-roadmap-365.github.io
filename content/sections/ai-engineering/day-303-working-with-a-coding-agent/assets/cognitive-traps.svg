<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Recognise them, then interrupt.">
  <title>Three cognitive traps</title>
  <style>
    .cognitive-traps-bg   { fill: #f8fafc; }
    .cognitive-traps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cognitive-traps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cognitive-traps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cognitive-traps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cognitive-traps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cognitive-traps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cognitive-traps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cognitive-traps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cognitive-traps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cognitive-traps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cognitive-traps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cognitive-traps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cognitive-traps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cognitive-traps-stage { opacity: 1; }

    .cognitive-traps-s0 { animation-delay: 0.00s; }
    .cognitive-traps-e0 { animation-delay: 0.00s; }
    .cognitive-traps-s1 { animation-delay: 1.28s; }
    .cognitive-traps-e1 { animation-delay: 1.28s; }
    .cognitive-traps-s2 { animation-delay: 2.56s; }
    .cognitive-traps-e2 { animation-delay: 2.56s; }
    .cognitive-traps-s3 { animation-delay: 3.84s; }
    .cognitive-traps-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cognitive-traps-conn  { animation: cognitive-traps-trace 6.4s ease-in-out infinite; }
      .cognitive-traps-stage { animation: cognitive-traps-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cognitive-traps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cognitive-traps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cognitive-traps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cognitive-traps-stage { animation: cognitive-traps-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cognitive-traps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cognitive-traps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cognitive-traps-bg" width="980" height="322"/>
  <text class="cognitive-traps-h1"  x="30" y="40">Three cognitive traps</text>
  <text class="cognitive-traps-sub" x="30" y="64">Recognise them, then interrupt.</text>
  <g class="cognitive-traps-stage cognitive-traps-s0">
    <rect class="cognitive-traps-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cognitive-traps-step" x="44" y="142">01</text>
    <text class="cognitive-traps-name" x="70" y="142">The circular linter loop</text>
    <text class="cognitive-traps-desc" x="44" y="166">Reformat, trigger a warning,</text>
    <text class="cognitive-traps-desc" x="44" y="182">revert, repeat. Forever.</text>
  </g>
  <line class="cognitive-traps-line cognitive-traps-conn cognitive-traps-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cognitive-traps-tip)"/>
  <g class="cognitive-traps-stage cognitive-traps-s1">
    <rect class="cognitive-traps-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cognitive-traps-step" x="280" y="142">02</text>
    <text class="cognitive-traps-name" x="306" y="142">The phantom dependency trap</text>
    <text class="cognitive-traps-desc" x="280" y="166">Reaching for an increasingly</text>
    <text class="cognitive-traps-desc" x="280" y="182">obscure library instead of the</text>
    <text class="cognitive-traps-desc" x="280" y="198">standard one.</text>
  </g>
  <line class="cognitive-traps-line cognitive-traps-conn cognitive-traps-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cognitive-traps-tip)"/>
  <g class="cognitive-traps-stage cognitive-traps-s2">
    <rect class="cognitive-traps-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cognitive-traps-step" x="516" y="142">03</text>
    <text class="cognitive-traps-name" x="542" y="142">The invasive refactoring trap</text>
    <text class="cognitive-traps-desc" x="516" y="166">Rewriting the connection pool</text>
    <text class="cognitive-traps-desc" x="516" y="182">when asked for a null check.</text>
  </g>
  <line class="cognitive-traps-line cognitive-traps-conn cognitive-traps-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cognitive-traps-tip)"/>
  <g class="cognitive-traps-stage cognitive-traps-s3">
    <rect class="cognitive-traps-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cognitive-traps-step" x="752" y="142">04</text>
    <text class="cognitive-traps-name" x="778" y="142">Interrupt, then re-specify</text>
    <text class="cognitive-traps-desc" x="752" y="166">Not more prompting inside the</text>
    <text class="cognitive-traps-desc" x="752" y="182">same trajectory.</text>
    <text class="cognitive-traps-edge" x="752" y="242">pivot</text>
  </g>
  <text class="cognitive-traps-sub" x="30" y="304">The intervention has to be an interrupt rather than a correction in the same conversation: the trajectory that produced the trap is still in the context, and it continues to pull in the same direction.</text>
</svg>
