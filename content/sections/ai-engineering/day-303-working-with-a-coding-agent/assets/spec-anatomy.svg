<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five parts, and the last two are skipped most.">
  <title>What a usable specification contains</title>
  <style>
    .spec-anatomy-bg   { fill: #f8fafc; }
    .spec-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spec-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .spec-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .spec-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .spec-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .spec-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .spec-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .spec-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .spec-anatomy-stage { opacity: 1; }

    .spec-anatomy-s0 { animation-delay: 0.00s; }
    .spec-anatomy-e0 { animation-delay: 0.00s; }
    .spec-anatomy-s1 { animation-delay: 1.33s; }
    .spec-anatomy-e1 { animation-delay: 1.33s; }
    .spec-anatomy-s2 { animation-delay: 2.67s; }
    .spec-anatomy-e2 { animation-delay: 2.67s; }
    .spec-anatomy-s3 { animation-delay: 4.00s; }
    .spec-anatomy-e3 { animation-delay: 4.00s; }
    .spec-anatomy-s4 { animation-delay: 5.33s; }
    .spec-anatomy-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .spec-anatomy-conn  { animation: spec-anatomy-trace 8s ease-in-out infinite; }
      .spec-anatomy-stage { animation: spec-anatomy-arrive 8s ease-in-out infinite; }
    }
    @keyframes spec-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes spec-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .spec-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .spec-anatomy-stage { animation: spec-anatomy-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes spec-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="spec-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="spec-anatomy-bg" width="980" height="322"/>
  <text class="spec-anatomy-h1"  x="30" y="40">What a usable specification contains</text>
  <text class="spec-anatomy-sub" x="30" y="64">Five parts, and the last two are skipped most.</text>
  <g class="spec-anatomy-stage spec-anatomy-s0">
    <rect class="spec-anatomy-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="spec-anatomy-step" x="44" y="142">01</text>
    <text class="spec-anatomy-name" x="70" y="142">Exact target files</text>
    <text class="spec-anatomy-desc" x="44" y="166">Relative paths. Not "the</text>
    <text class="spec-anatomy-desc" x="44" y="182">search code".</text>
  </g>
  <line class="spec-anatomy-line spec-anatomy-conn spec-anatomy-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#spec-anatomy-tip)"/>
  <g class="spec-anatomy-stage spec-anatomy-s1">
    <rect class="spec-anatomy-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="spec-anatomy-step" x="233" y="142">02</text>
    <text class="spec-anatomy-name" x="259" y="142">The change, concretely</text>
    <text class="spec-anatomy-desc" x="233" y="166">"Add a trigram index on</text>
    <text class="spec-anatomy-desc" x="233" y="182">company_name", not "make</text>
    <text class="spec-anatomy-desc" x="233" y="198">it faster".</text>
  </g>
  <line class="spec-anatomy-line spec-anatomy-conn spec-anatomy-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#spec-anatomy-tip)"/>
  <g class="spec-anatomy-stage spec-anatomy-s2">
    <rect class="spec-anatomy-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="spec-anatomy-step" x="422" y="142">03</text>
    <text class="spec-anatomy-name" x="448" y="142">Type contracts</text>
    <text class="spec-anatomy-desc" x="422" y="166">Signatures for inputs and</text>
    <text class="spec-anatomy-desc" x="422" y="182">outputs, so the interface</text>
    <text class="spec-anatomy-desc" x="422" y="198">cannot drift.</text>
  </g>
  <line class="spec-anatomy-line spec-anatomy-conn spec-anatomy-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#spec-anatomy-tip)"/>
  <g class="spec-anatomy-stage spec-anatomy-s3">
    <rect class="spec-anatomy-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="spec-anatomy-step" x="611" y="142">04</text>
    <text class="spec-anatomy-name" x="637" y="142">Non-goals</text>
    <text class="spec-anatomy-desc" x="611" y="166">No new packages. Do not</text>
    <text class="spec-anatomy-desc" x="611" y="182">change public signatures.</text>
    <text class="spec-anatomy-desc" x="611" y="198">Do not touch database.py.</text>
  </g>
  <line class="spec-anatomy-line spec-anatomy-conn spec-anatomy-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#spec-anatomy-tip)"/>
  <g class="spec-anatomy-stage spec-anatomy-s4">
    <rect class="spec-anatomy-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="spec-anatomy-step" x="800" y="142">05</text>
    <text class="spec-anatomy-name" x="826" y="142">A verification command</text>
    <text class="spec-anatomy-desc" x="800" y="166">pytest</text>
    <text class="spec-anatomy-desc" x="800" y="182">tests/test_search.py, and</text>
    <text class="spec-anatomy-desc" x="800" y="198">a threshold to meet.</text>
    <text class="spec-anatomy-edge" x="800" y="242">self-check</text>
  </g>
  <text class="spec-anatomy-sub" x="30" y="304">The last two do the most work and are the two people leave out: without a non-goal the agent chooses the scope, and without a command it decides for itself when it is finished.</text>
</svg>
