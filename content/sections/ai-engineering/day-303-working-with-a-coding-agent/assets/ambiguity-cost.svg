<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four plausible strategies, one sampled.">
  <title>What "handle errors properly" means</title>
  <style>
    .ambiguity-cost-bg   { fill: #f8fafc; }
    .ambiguity-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ambiguity-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ambiguity-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ambiguity-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ambiguity-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ambiguity-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ambiguity-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ambiguity-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ambiguity-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ambiguity-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ambiguity-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ambiguity-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ambiguity-cost-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ambiguity-cost-stage { opacity: 1; }

    .ambiguity-cost-s0 { animation-delay: 0.00s; }
    .ambiguity-cost-e0 { animation-delay: 0.00s; }
    .ambiguity-cost-s1 { animation-delay: 1.28s; }
    .ambiguity-cost-e1 { animation-delay: 1.28s; }
    .ambiguity-cost-s2 { animation-delay: 2.56s; }
    .ambiguity-cost-e2 { animation-delay: 2.56s; }
    .ambiguity-cost-s3 { animation-delay: 3.84s; }
    .ambiguity-cost-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ambiguity-cost-conn  { animation: ambiguity-cost-trace 6.4s ease-in-out infinite; }
      .ambiguity-cost-stage { animation: ambiguity-cost-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ambiguity-cost-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ambiguity-cost-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ambiguity-cost-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ambiguity-cost-stage { animation: ambiguity-cost-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ambiguity-cost-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ambiguity-cost-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ambiguity-cost-bg" width="980" height="322"/>
  <text class="ambiguity-cost-h1"  x="30" y="40">What "handle errors properly" means</text>
  <text class="ambiguity-cost-sub" x="30" y="64">Four plausible strategies, one sampled.</text>
  <g class="ambiguity-cost-stage ambiguity-cost-s0">
    <rect class="ambiguity-cost-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ambiguity-cost-step" x="44" y="142">01</text>
    <text class="ambiguity-cost-name" x="70" y="142">Raise a custom domain exception</text>
    <text class="ambiguity-cost-desc" x="44" y="166">Plausible, and it changes the</text>
    <text class="ambiguity-cost-desc" x="44" y="182">caller contract.</text>
  </g>
  <line class="ambiguity-cost-line ambiguity-cost-conn ambiguity-cost-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ambiguity-cost-tip)"/>
  <g class="ambiguity-cost-stage ambiguity-cost-s1">
    <rect class="ambiguity-cost-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ambiguity-cost-step" x="280" y="142">02</text>
    <text class="ambiguity-cost-name" x="306" y="142">Return a JSON error payload</text>
    <text class="ambiguity-cost-desc" x="280" y="166">Plausible, and it changes the</text>
    <text class="ambiguity-cost-desc" x="280" y="182">status code semantics.</text>
  </g>
  <line class="ambiguity-cost-line ambiguity-cost-conn ambiguity-cost-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ambiguity-cost-tip)"/>
  <g class="ambiguity-cost-stage ambiguity-cost-s2">
    <rect class="ambiguity-cost-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ambiguity-cost-step" x="516" y="142">03</text>
    <text class="ambiguity-cost-name" x="542" y="142">Log and return None</text>
    <text class="ambiguity-cost-desc" x="516" y="166">Plausible, and it silently</text>
    <text class="ambiguity-cost-desc" x="516" y="182">swallows the failure.</text>
  </g>
  <line class="ambiguity-cost-line ambiguity-cost-conn ambiguity-cost-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ambiguity-cost-tip)"/>
  <g class="ambiguity-cost-stage ambiguity-cost-s3">
    <rect class="ambiguity-cost-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ambiguity-cost-step" x="752" y="142">04</text>
    <text class="ambiguity-cost-name" x="778" y="142">Retry with exponential backoff</text>
    <text class="ambiguity-cost-desc" x="752" y="166">Plausible, and it changes the</text>
    <text class="ambiguity-cost-desc" x="752" y="182">latency profile.</text>
    <text class="ambiguity-cost-edge" x="752" y="242">one is sampled</text>
  </g>
  <text class="ambiguity-cost-sub" x="30" y="304">Stating the contract — catch this exception, log with this identifier, raise this status with this detail — collapses the distribution to one implementation, which is what makes the output deterministic.</text>
</svg>
