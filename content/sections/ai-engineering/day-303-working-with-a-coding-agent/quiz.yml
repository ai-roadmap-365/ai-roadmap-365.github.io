questions:
- question: What is the primary cause of AI coding agents hallucinating APIs or producing broken implementations
    on complex codebases?
  options:
  - 'The computer simply running out of disk space'
  - Using Python instead of JavaScript
  - 'Vague prompts plus noisy, unfocused context'
  - Running tests in the background
  answer_index: 2
  explanation: Context pollution and vague specifications are the primary drivers of agent hallucinations
    and incorrect assumptions.
- question: What is 'Specification-Driven Development' when pairing with an AI coding agent?
  options:
  - Allowing the model to guess the entire architecture without instructions
  - Deploying directly to production without testing
  - Writing code in assembly language first
  - 'Write the spec before asking for the code'
  answer_index: 3
  explanation: Clear upfront specifications constrain the model's solution space and ensure high-precision
    code generation.
- question: Which context-gathering technique provides the highest signal-to-noise ratio for a coding
    agent?
  options:
  - 'The interface, the tests, and the stack trace'
  - Copying every file in the repository into the chat window
  - Sending only the project README
  - Providing raw git binary packfiles
  answer_index: 0
  explanation: Surgical context packages (signatures, tests, tracebacks) minimize token waste and maximize
    model attention on key interfaces.
- question: What should a developer do when they observe a coding agent stuck in a repetitive loop (e.g.
    failing a test, making an incorrect edit, and failing the same test again)?
  options:
  - Let it run for 1,000 turns unattended
  - 'Interrupt, correct the root cause, and revert'
  - Format the hard drive
  - Delete all existing unit tests
  answer_index: 1
  explanation: Active human steering breaks repetitive loops and resets the agent's reasoning trajectory.
- question: Why is defining explicit 'Non-Goals' in a feature prompt valuable when directing an AI coding
    agent?
  options:
  - It makes the prompt longer
  - It disables all unit tests
  - 'It forbids refactors and changes outside the task'
  - It forces the agent to compile C++ code
  answer_index: 2
  explanation: Non-goals prevent 'scope creep' and protect existing codebase architecture from unrequested
    refactoring.
