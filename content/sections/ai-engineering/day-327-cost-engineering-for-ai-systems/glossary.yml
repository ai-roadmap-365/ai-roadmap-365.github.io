terms:
  - term: Unit Economics
    definition: Cost per request multiplied by expected volume — the calculation that decides whether a
      feature is viable, and which belongs in a design document rather than a retrospective.
  - term: Token Accounting
    definition: Recording input and output tokens per call so spend can be attributed to a model, a
      feature or a tenant rather than merely totalled.
  - term: Model Tiering
    definition: Routing each request to the cheapest model that can do the job, on the basis that most
      traffic does not need the expensive one.
  - term: Context Budget
    definition: A token limit on retrieved context, filled in priority order and stopped at the first
      chunk that does not fit.
  - term: Prompt Caching
    definition: A provider discount on repeated prompt prefixes, which rewards putting stable content
      first and variable content last.
  - term: Semantic Caching
    definition: Caching on embedding similarity rather than exact match. Much higher hit rates, and a
      real risk of serving a wrong answer to a similar-but-different question.
  - term: Spend Cap
    definition: A hard limit checked before a call is made, which refuses or degrades rather than
      allowing spend to continue.
  - term: Graceful Degradation
    definition: Downgrading to a cheaper model as a budget nears exhaustion, on the basis that a cheaper
      answer beats no answer.
  - term: Denial of Wallet
    definition: An attack that induces expensive model calls to exhaust a budget rather than a server,
      bounded only by a spend cap.
  - term: Cost Attribution
    definition: Splitting spend by model, feature or tenant, without which optimisation targets whatever
      is most visible rather than what is most expensive.
