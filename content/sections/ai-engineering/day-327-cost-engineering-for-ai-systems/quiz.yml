questions:
  - question: A cache achieves a 33 percent hit rate and saves 7 percent of spend. How can both be
      correct?
    options:
      - The cache is misconfigured and is not really hitting
      - The cached requests were the cheap ones — they routed to the small model — while the large model
        accounted for most of the spend, so hit rate and savings measure different things
      - Cache hits are billed at a reduced rate rather than being free
      - The saving is delayed and appears in the next billing period
    answer_index: 1
    explanation: Hit rate is not savings. A cache that hits your cheapest traffic saves nothing while a
      dashboard reports it as a success, which is why spend must be attributed by model first.
  - question: Why must a budget check happen before the call rather than after?
    options:
      - Because providers reject requests that would exceed a budget
      - Because checking afterwards is an audit rather than a control — the money is already spent, so
        the cap can be exceeded by exactly the size of the last request or by an unbounded loop
      - Because token counts are unavailable after the call
      - It makes no difference as long as the total is recorded
    answer_index: 1
    explanation: A control has to be able to prevent the action. Estimating first and reconciling later
      against reported usage is the workable pattern.
  - question: Output tokens cost more per token than input tokens. Why might input still dominate a bill?
    options:
      - Because input tokens are counted twice
      - Because retrieval-augmented requests send far more input than they receive output, so a large
        context can outweigh the higher per-token price of generation
      - Because providers charge a fixed fee per input token
      - Because input tokens cannot be cached
    answer_index: 1
    explanation: Per-token price and total volume are different things. Which dominates depends on the
      workload, which is why it must be measured rather than assumed.
  - question: What is a denial-of-wallet attack, and which lever bounds it?
    options:
      - Flooding a service with traffic to exhaust CPU; bounded by autoscaling
      - Inducing expensive model calls — through a retry loop, a recursive agent, or a hostile client —
        so spend grows without limit; bounded by a hard spend cap checked before each call
      - Stealing API keys to use someone else's quota; bounded by key rotation
      - Making the model produce very long outputs; bounded by a temperature setting
    answer_index: 1
    explanation: Anything a user can trigger is something an attacker can trigger. The cap is the only
      lever that bounds the worst case rather than improving the average.
  - question: Why does a cache keyed only on prompt text create a privacy problem in a multi-tenant
      system?
    options:
      - Because prompts are always longer than the cache key limit
      - Because two tenants issuing the same prompt share an entry, so one tenant can receive a response
        generated from another tenant's context or data
      - Because cache keys are stored in plain text on disk
      - Because caching disables audit logging
    answer_index: 1
    explanation: The key must include the tenant as well as the content, and cached prompts and responses
      carry the same retention obligations as any other user data.
