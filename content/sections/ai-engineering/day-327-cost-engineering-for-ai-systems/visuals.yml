visuals:
  - id: where-cost-accumulates
    file: assets/where-cost-accumulates.svg
    type: diagram
    title: Where Cost Accumulates in an AI Request
    alt: Where Cost Accumulates in an AI Request showing retrieval, context assembly, model selection and
      generation, with the levers that act on each
    description: Stage diagram of a request path with the cost lever that applies at each stage, and the
      two facts that decide which lever is worth pulling.
  - id: cost-levers-and-what-each-saves
    file: assets/cost-levers-and-what-each-saves.svg
    type: diagram
    title: Cost Levers and What Each One Saves
    alt: Cost Levers and What Each One Saves showing the measured effect of caching, trimming and tiering
      on the same workload, and the case where a cache hit saves almost nothing
    description: Stacked bars of measured spend split by model across three configurations, showing that
      a thirty-three percent cache hit rate produced only a seven percent saving.
