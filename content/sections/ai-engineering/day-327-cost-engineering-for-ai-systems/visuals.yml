visuals:
  - id: where-cost-accumulates
    file: assets/where-cost-accumulates.svg
    type: diagram
    title: Where Cost Accumulates in an AI Request
    alt: Where Cost Accumulates in an AI Request showing retrieval, context assembly, model selection and
      generation, with the levers that act on each
    description: Stage diagram of a request path with the cost lever that applies at each stage, and the
      two facts that decide which lever is worth pulling.
  - id: cost-levers-and-what-each-saves
    file: assets/cost-levers-and-what-each-saves.svg
    type: diagram
    title: Cost Levers and What Each One Saves
    alt: Cost Levers and What Each One Saves showing the measured effect of caching, trimming and tiering
      on the same workload, and the case where a cache hit saves almost nothing
    description: Stacked bars of measured spend split by model across three configurations, showing that
      a thirty-three percent cache hit rate produced only a seven percent saving.
  - id: four-levers
    file: assets/four-levers.svg
    type: diagram
    title: 'One equation, four levers'
    alt: 'Diagram: the four cost levers for an AI system, ordered by return'
    description: 'A four-stage description of AI cost levers covering caching, model tiering, context trimming and spend caps.'
  - id: dev-or-production
    file: assets/dev-or-production.svg
    type: diagram
    title: 'Forty requests, or forty thousand'
    alt: 'Diagram: development-scale cost compared with production-scale cost for the same feature'
    description: 'A two-column comparison of AI feature cost at development volume against production volume.'
  - id: cost-lineage
    file: assets/cost-lineage.svg
    type: diagram
    title: 'Four developments in AI economics'
    alt: 'Diagram: the progression from metered computing to model tiering'
    description: 'A four-stage progression of AI cost engineering from cloud metering through token pricing and prompt caching to capable small models.'
  - id: cost-procedure
    file: assets/cost-procedure.svg
    type: diagram
    title: 'Six steps, in order'
    alt: 'Diagram: the six steps of cost engineering an AI request path'
    description: 'A six-stage description of cost engineering covering accounting, pre-call estimation, routing, trimming, capping and projection.'
  - id: taxi-meter
    file: assets/taxi-meter.svg
    type: diagram
    title: 'A visible meter'
    alt: 'Diagram: a monthly transport budget compared with a visible per-journey meter'
    description: 'A two-column comparison of discovering cost monthly against seeing it accumulate per journey.'
  - id: hit-rate-lesson
    file: assets/hit-rate-lesson.svg
    type: diagram
    title: 'Hit rate is not savings'
    alt: 'Diagram: why a 33 percent cache hit rate saved only 7 percent of cost'
    description: 'A four-stage explanation of why cache hit rate and cost saving diverge when traffic is tiered.'
  - id: cost-implications
    file: assets/cost-implications.svg
    type: diagram
    title: 'Five consequences of metered inference'
    alt: 'Diagram: the security, privacy, performance, scalability and cost implications of AI spending'
    description: 'A five-stage description of cost implications covering denial-of-wallet, cache tenancy, lever trade-offs, linear scaling and the input-output balance.'
  - id: cost-tooling
    file: assets/cost-tooling.svg
    type: diagram
    title: 'Build the ledger, adopt the proxy'
    alt: 'Diagram: a self-built cost ledger compared with a proxy or observability platform'
    description: 'A two-column comparison of building cost accounting yourself against adopting a proxy or observability tool.'
  - id: cost-when
    file: assets/cost-when.svg
    type: diagram
    title: 'When to invest in cost work'
    alt: 'Diagram: when cost engineering is warranted'
    description: 'A two-column comparison of situations requiring cost engineering against prototypes, with the control that always applies.'
  - id: not-micro-optimisation
    file: assets/not-micro-optimisation.svg
    type: diagram
    title: 'Cost work is not micro-optimisation'
    alt: 'Diagram: architectural cost decisions compared with micro-optimisation'
    description: 'A two-column comparison of design-time cost decisions against token-level trimming.'
  - id: cost-comparisons
    file: assets/cost-comparisons.svg
    type: diagram
    title: 'Four distinctions worth keeping'
    alt: 'Diagram: four distinctions in AI cost reasoning'
    description: 'A four-stage description of cost distinctions covering FinOps against engineering, application against prompt caching, tiering against fine-tuning, and per-request against per-user cost.'
