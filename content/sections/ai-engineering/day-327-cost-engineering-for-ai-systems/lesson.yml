title: Cost Engineering for AI Systems
section: ai-engineering
subsection: production-ai-systems
week: 47
learning_promise:
  'Make the cost of an AI system visible, controllable and bounded: attribute spend per
  model with a ledger, route easy work to cheaper models, trim context to a token budget, and enforce a
  cap that degrades before it refuses — then project cost per request to real volume before shipping.'
objectives:
  - Attribute spend per model and per stage rather than reporting a single total.
  - Explain why a high cache hit rate can produce almost no saving, and what to measure instead.
  - Route requests to the cheapest model that can do the job, and trim context to a token budget.
  - Enforce a spend cap checked before the call, with degradation before refusal.
  - Project cost per request to expected volume, and identify unbounded spend as a security concern.
