<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Metering, asymmetry, prefixes, small models.">
  <title>Four developments in AI economics</title>
  <style>
    .cost-lineage-bg   { fill: #f8fafc; }
    .cost-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-lineage-stage { opacity: 1; }

    .cost-lineage-s0 { animation-delay: 0.00s; }
    .cost-lineage-e0 { animation-delay: 0.00s; }
    .cost-lineage-s1 { animation-delay: 1.28s; }
    .cost-lineage-e1 { animation-delay: 1.28s; }
    .cost-lineage-s2 { animation-delay: 2.56s; }
    .cost-lineage-e2 { animation-delay: 2.56s; }
    .cost-lineage-s3 { animation-delay: 3.84s; }
    .cost-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-lineage-conn  { animation: cost-lineage-trace 6.4s ease-in-out infinite; }
      .cost-lineage-stage { animation: cost-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cost-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-lineage-stage { animation: cost-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-lineage-bg" width="980" height="322"/>
  <text class="cost-lineage-h1"  x="30" y="40">Four developments in AI economics</text>
  <text class="cost-lineage-sub" x="30" y="64">Metering, asymmetry, prefixes, small models.</text>
  <g class="cost-lineage-stage cost-lineage-s0">
    <rect class="cost-lineage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cost-lineage-step" x="44" y="142">01</text>
    <text class="cost-lineage-name" x="70" y="142">Metered computing, 2006</text>
    <text class="cost-lineage-desc" x="44" y="166">Per-unit infrastructure, and</text>
    <text class="cost-lineage-desc" x="44" y="182">FinOps: tagging, attribution,</text>
    <text class="cost-lineage-desc" x="44" y="198">budgets, alerts.</text>
  </g>
  <line class="cost-lineage-line cost-lineage-conn cost-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cost-lineage-tip)"/>
  <g class="cost-lineage-stage cost-lineage-s1">
    <rect class="cost-lineage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cost-lineage-step" x="280" y="142">02</text>
    <text class="cost-lineage-name" x="306" y="142">Token pricing, 2020</text>
    <text class="cost-lineage-desc" x="280" y="166">Input and output charged</text>
    <text class="cost-lineage-desc" x="280" y="182">differently — generation is</text>
    <text class="cost-lineage-desc" x="280" y="198">sequential and cannot batch like</text>
    <text class="cost-lineage-edge" x="280" y="242">asymmetry</text>
  </g>
  <line class="cost-lineage-line cost-lineage-conn cost-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cost-lineage-tip)"/>
  <g class="cost-lineage-stage cost-lineage-s2">
    <rect class="cost-lineage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cost-lineage-step" x="516" y="142">03</text>
    <text class="cost-lineage-name" x="542" y="142">Prompt caching, 2023-2024</text>
    <text class="cost-lineage-desc" x="516" y="166">Discounts on repeated prefixes</text>
    <text class="cost-lineage-desc" x="516" y="182">made prompt structure an</text>
    <text class="cost-lineage-desc" x="516" y="198">economic decision.</text>
  </g>
  <line class="cost-lineage-line cost-lineage-conn cost-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cost-lineage-tip)"/>
  <g class="cost-lineage-stage cost-lineage-s3">
    <rect class="cost-lineage-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cost-lineage-step" x="752" y="142">04</text>
    <text class="cost-lineage-name" x="778" y="142">Small models get good, 2023</text>
    <text class="cost-lineage-desc" x="752" y="166">Tiering stopped being a</text>
    <text class="cost-lineage-desc" x="752" y="182">compromise and became the</text>
    <text class="cost-lineage-desc" x="752" y="198">default architecture.</text>
  </g>
  <text class="cost-lineage-sub" x="30" y="304">The asymmetry in the second row has a physical cause rather than a commercial one, which is why it is stable: prefill parallelises across a prompt and decode cannot parallelise across time.</text>
</svg>
