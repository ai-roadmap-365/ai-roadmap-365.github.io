<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Where Cost Accumulates in an AI Request showing retrieval, context assembly, model selection and generation, with the levers that act on each">
  <title>Where Cost Accumulates in an AI Request</title>
  <defs>
    <style>
      .d327a-bg { fill: #f8fafc; }
      .d327a-stage { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d327a-free { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; }
      .d327a-big { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; }
      .d327a-lever { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2px; }
      .d327a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d327a-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d327a-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d327a-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d327a-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d327a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" class="d327a-bg"/>
  <text x="40" y="40" class="d327a-title">Where Cost Accumulates in an AI Request</text>
  <text x="40" y="64" class="d327a-sub">Each stage has a lever. They are not equally worth pulling — attribute spend before choosing one.</text>

  <rect x="40" y="105" width="150" height="70" rx="8" class="d327a-free"/>
  <text x="115" y="132" class="d327a-h" text-anchor="middle">Cache lookup</text>
  <text x="115" y="152" class="d327a-t" text-anchor="middle">a hit costs nothing</text>

  <rect x="230" y="105" width="150" height="70" rx="8" class="d327a-stage"/>
  <text x="305" y="132" class="d327a-h" text-anchor="middle">Retrieve</text>
  <text x="305" y="152" class="d327a-t" text-anchor="middle">embedding cost</text>

  <rect x="420" y="105" width="150" height="70" rx="8" class="d327a-stage"/>
  <text x="495" y="132" class="d327a-h" text-anchor="middle">Assemble context</text>
  <text x="495" y="152" class="d327a-t" text-anchor="middle">INPUT tokens</text>

  <rect x="610" y="105" width="120" height="70" rx="8" class="d327a-stage"/>
  <text x="670" y="132" class="d327a-h" text-anchor="middle">Route</text>
  <text x="670" y="152" class="d327a-t" text-anchor="middle">small or large</text>

  <rect x="770" y="105" width="90" height="70" rx="8" class="d327a-big"/>
  <text x="815" y="132" class="d327a-h" text-anchor="middle">Generate</text>
  <text x="815" y="152" class="d327a-t" text-anchor="middle">OUTPUT</text>

  <path d="M 190 140 L 224 140" class="d327a-flow" marker-end="url(#d327a-a)"/>
  <path d="M 380 140 L 414 140" class="d327a-flow" marker-end="url(#d327a-a)"/>
  <path d="M 570 140 L 604 140" class="d327a-flow" marker-end="url(#d327a-a)"/>
  <path d="M 730 140 L 764 140" class="d327a-flow" marker-end="url(#d327a-a)"/>

  <rect x="40" y="220" width="150" height="60" rx="6" class="d327a-lever"/>
  <text x="115" y="245" class="d327a-h" text-anchor="middle">CACHE</text>
  <text x="115" y="265" class="d327a-t" text-anchor="middle">cheapest win</text>

  <rect x="420" y="220" width="150" height="60" rx="6" class="d327a-lever"/>
  <text x="495" y="245" class="d327a-h" text-anchor="middle">TRIM</text>
  <text x="495" y="265" class="d327a-t" text-anchor="middle">fewer input tokens</text>

  <rect x="610" y="220" width="120" height="60" rx="6" class="d327a-lever"/>
  <text x="670" y="245" class="d327a-h" text-anchor="middle">TIER</text>
  <text x="670" y="265" class="d327a-t" text-anchor="middle">cheaper model</text>

  <rect x="770" y="220" width="90" height="60" rx="6" class="d327a-lever"/>
  <text x="815" y="245" class="d327a-h" text-anchor="middle">CAP</text>
  <text x="815" y="265" class="d327a-t" text-anchor="middle">bound it</text>

  <path d="M 115 216 L 115 180" class="d327a-flow" marker-end="url(#d327a-a)"/>
  <path d="M 495 216 L 495 180" class="d327a-flow" marker-end="url(#d327a-a)"/>
  <path d="M 670 216 L 670 180" class="d327a-flow" marker-end="url(#d327a-a)"/>
  <path d="M 815 216 L 815 180" class="d327a-flow" marker-end="url(#d327a-a)"/>

  <text x="40" y="330" class="d327a-h">Two facts that decide where to spend your effort</text>
  <text x="40" y="354" class="d327a-t">Output tokens cost several times more PER TOKEN than input — generation is sequential and cannot be batched like prefill.</text>
  <text x="40" y="374" class="d327a-t">But you usually send far more input than you receive output, so context size often dominates the total anyway. Measure.</text>
  <text x="40" y="404" class="d327a-t">The cap is the lever teams skip, and the only one that bounds the WORST case. A retry loop against a paid API is</text>
  <text x="40" y="424" class="d327a-t">unbounded spend, and anything a user can trigger is something an attacker can trigger.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.36s}.dx-f2{animation-delay:0.72s}.dx-f3{animation-delay:1.08s}.dx-f4{animation-delay:1.44s}.dx-f5{animation-delay:1.80s}.dx-f6{animation-delay:2.16s}.dx-f7{animation-delay:2.52s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 190 140 L 224 140" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 380 140 L 414 140" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 570 140 L 604 140" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 730 140 L 764 140" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 115 216 L 115 180" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 495 216 L 495 180" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f6" d="M 670 216 L 670 180" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f7" d="M 815 216 L 815 180" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
