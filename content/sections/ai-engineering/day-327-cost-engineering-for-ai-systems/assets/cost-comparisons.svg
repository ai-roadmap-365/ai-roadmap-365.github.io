<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cost is not one number.">
  <title>Four distinctions worth keeping</title>
  <style>
    .cost-comparisons-bg   { fill: #f8fafc; }
    .cost-comparisons-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-comparisons-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-comparisons-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-comparisons-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-comparisons-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-comparisons-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-comparisons-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-comparisons-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-comparisons-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-comparisons-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-comparisons-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-comparisons-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-comparisons-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-comparisons-stage { opacity: 1; }

    .cost-comparisons-s0 { animation-delay: 0.00s; }
    .cost-comparisons-e0 { animation-delay: 0.00s; }
    .cost-comparisons-s1 { animation-delay: 1.28s; }
    .cost-comparisons-e1 { animation-delay: 1.28s; }
    .cost-comparisons-s2 { animation-delay: 2.56s; }
    .cost-comparisons-e2 { animation-delay: 2.56s; }
    .cost-comparisons-s3 { animation-delay: 3.84s; }
    .cost-comparisons-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-comparisons-conn  { animation: cost-comparisons-trace 6.4s ease-in-out infinite; }
      .cost-comparisons-stage { animation: cost-comparisons-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cost-comparisons-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-comparisons-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-comparisons-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-comparisons-stage { animation: cost-comparisons-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-comparisons-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-comparisons-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-comparisons-bg" width="980" height="322"/>
  <text class="cost-comparisons-h1"  x="30" y="40">Four distinctions worth keeping</text>
  <text class="cost-comparisons-sub" x="30" y="64">Cost is not one number.</text>
  <g class="cost-comparisons-stage cost-comparisons-s0">
    <rect class="cost-comparisons-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cost-comparisons-step" x="44" y="142">01</text>
    <text class="cost-comparisons-name" x="70" y="142">FinOps against cost engineering</text>
    <text class="cost-comparisons-desc" x="44" y="166">One is organisational</text>
    <text class="cost-comparisons-desc" x="44" y="182">attribution; the other is what</text>
    <text class="cost-comparisons-desc" x="44" y="198">happens in the request path.</text>
  </g>
  <line class="cost-comparisons-line cost-comparisons-conn cost-comparisons-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cost-comparisons-tip)"/>
  <g class="cost-comparisons-stage cost-comparisons-s1">
    <rect class="cost-comparisons-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cost-comparisons-step" x="280" y="142">02</text>
    <text class="cost-comparisons-name" x="306" y="142">Application caching against prompt caching</text>
    <text class="cost-comparisons-desc" x="280" y="166">Whole responses, or discounted</text>
    <text class="cost-comparisons-desc" x="280" y="182">prefixes within a call. They</text>
    <text class="cost-comparisons-desc" x="280" y="198">compose.</text>
  </g>
  <line class="cost-comparisons-line cost-comparisons-conn cost-comparisons-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cost-comparisons-tip)"/>
  <g class="cost-comparisons-stage cost-comparisons-s2">
    <rect class="cost-comparisons-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cost-comparisons-step" x="516" y="142">03</text>
    <text class="cost-comparisons-name" x="542" y="142">Tiering against fine-tuning</text>
    <text class="cost-comparisons-desc" x="516" y="166">Route to a cheaper model, or</text>
    <text class="cost-comparisons-desc" x="516" y="182">make a small one better so more</text>
    <text class="cost-comparisons-desc" x="516" y="198">can be routed down.</text>
    <text class="cost-comparisons-edge" x="516" y="242">upfront</text>
  </g>
  <line class="cost-comparisons-line cost-comparisons-conn cost-comparisons-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cost-comparisons-tip)"/>
  <g class="cost-comparisons-stage cost-comparisons-s3">
    <rect class="cost-comparisons-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cost-comparisons-step" x="752" y="142">04</text>
    <text class="cost-comparisons-name" x="778" y="142">Per request against per user</text>
    <text class="cost-comparisons-desc" x="752" y="166">Per request sizes the system;</text>
    <text class="cost-comparisons-desc" x="752" y="182">per user prices the product.</text>
  </g>
  <text class="cost-comparisons-sub" x="30" y="304">The last distinction matters more than it looks: heavy users are not average users, and a product priced on mean per-user cost is priced for a customer who does not exist.</text>
</svg>
