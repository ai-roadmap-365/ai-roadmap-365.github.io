<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="In the order they pay off.">
  <title>One equation, four levers</title>
  <style>
    .four-levers-bg   { fill: #f8fafc; }
    .four-levers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-levers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-levers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-levers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-levers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-levers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-levers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-levers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-levers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-levers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-levers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-levers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-levers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-levers-stage { opacity: 1; }

    .four-levers-s0 { animation-delay: 0.00s; }
    .four-levers-e0 { animation-delay: 0.00s; }
    .four-levers-s1 { animation-delay: 1.28s; }
    .four-levers-e1 { animation-delay: 1.28s; }
    .four-levers-s2 { animation-delay: 2.56s; }
    .four-levers-e2 { animation-delay: 2.56s; }
    .four-levers-s3 { animation-delay: 3.84s; }
    .four-levers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-levers-conn  { animation: four-levers-trace 6.4s ease-in-out infinite; }
      .four-levers-stage { animation: four-levers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-levers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-levers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-levers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-levers-stage { animation: four-levers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-levers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-levers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-levers-bg" width="980" height="322"/>
  <text class="four-levers-h1"  x="30" y="40">One equation, four levers</text>
  <text class="four-levers-sub" x="30" y="64">In the order they pay off.</text>
  <g class="four-levers-stage four-levers-s0">
    <rect class="four-levers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-levers-step" x="44" y="142">01</text>
    <text class="four-levers-name" x="70" y="142">Cache</text>
    <text class="four-levers-desc" x="44" y="166">An exact repeat costs nothing.</text>
    <text class="four-levers-desc" x="44" y="182">Cheapest win, often a large</text>
    <text class="four-levers-desc" x="44" y="198">share of traffic.</text>
  </g>
  <line class="four-levers-line four-levers-conn four-levers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-levers-tip)"/>
  <g class="four-levers-stage four-levers-s1">
    <rect class="four-levers-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-levers-step" x="280" y="142">02</text>
    <text class="four-levers-name" x="306" y="142">Tier</text>
    <text class="four-levers-desc" x="280" y="166">Route easy work to a cheaper</text>
    <text class="four-levers-desc" x="280" y="182">model. Sending everything to the</text>
    <text class="four-levers-desc" x="280" y="198">largest is the commonest waste.</text>
    <text class="four-levers-edge" x="280" y="242">largest lever</text>
  </g>
  <line class="four-levers-line four-levers-conn four-levers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-levers-tip)"/>
  <g class="four-levers-stage four-levers-s2">
    <rect class="four-levers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-levers-step" x="516" y="142">03</text>
    <text class="four-levers-name" x="542" y="142">Trim</text>
    <text class="four-levers-desc" x="516" y="166">Send less context. Input is</text>
    <text class="four-levers-desc" x="516" y="182">cheaper per token and you send</text>
    <text class="four-levers-desc" x="516" y="198">far more of it.</text>
  </g>
  <line class="four-levers-line four-levers-conn four-levers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-levers-tip)"/>
  <g class="four-levers-stage four-levers-s3">
    <rect class="four-levers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-levers-step" x="752" y="142">04</text>
    <text class="four-levers-name" x="778" y="142">Cap</text>
    <text class="four-levers-desc" x="752" y="166">Refuse or degrade rather than</text>
    <text class="four-levers-desc" x="752" y="182">overspend. The lever teams skip.</text>
    <text class="four-levers-edge" x="752" y="242">bounds the worst case</text>
  </g>
  <text class="four-levers-sub" x="30" y="304">The equation underneath is cost per request times expected volume, and both halves need measuring: an accurate unit cost multiplied by a guessed volume is still a guess.</text>
</svg>
