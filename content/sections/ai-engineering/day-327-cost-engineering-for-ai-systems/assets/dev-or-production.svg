<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same feature, two bills.">
  <title>Forty requests, or forty thousand</title>
  <style>
    .dev-or-production-bg   { fill: #f8fafc; }
    .dev-or-production-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dev-or-production-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dev-or-production-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dev-or-production-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dev-or-production-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dev-or-production-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dev-or-production-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dev-or-production-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dev-or-production-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dev-or-production-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dev-or-production-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dev-or-production-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dev-or-production-row { opacity: 1; }
    .dev-or-production-r0 { animation-delay: 0.00s; }
    .dev-or-production-r1 { animation-delay: 0.45s; }
    .dev-or-production-r2 { animation-delay: 0.90s; }
    .dev-or-production-r3 { animation-delay: 1.35s; }
    .dev-or-production-r4 { animation-delay: 1.80s; }
    .dev-or-production-row { animation: dev-or-production-reveal 7.3s ease-in-out infinite; }
    @keyframes dev-or-production-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dev-or-production-bg" width="980" height="390"/>
  <text class="dev-or-production-h1"  x="30" y="40">Forty requests, or forty thousand</text>
  <text class="dev-or-production-sub" x="30" y="64">The same feature, two bills.</text>
  <rect class="dev-or-production-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dev-or-production-name" x="46" y="122">In development</text>
  <text class="dev-or-production-desc" x="46" y="142">Forty requests.</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r0" x="46" y="182">The feature works beautifully</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r1" x="46" y="216">Cost is negligible and invisible</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r2" x="46" y="250">Nobody computes a unit cost</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r3" x="46" y="284">Every request goes to the best model</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r4" x="46" y="318">Because why would it not</text>
  <rect class="dev-or-production-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dev-or-production-name" x="526" y="122">In production</text>
  <text class="dev-or-production-desc" x="526" y="142">Volume, and no ceiling.</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r0" x="526" y="182">The same unit cost, multiplied</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r1" x="526" y="216">A retry loop has no natural stopping point</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r2" x="526" y="250">A hostile user has no budget of their own</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r3" x="526" y="284">Discovered on the invoice</text>
  <text class="dev-or-production-desc dev-or-production-row dev-or-production-r4" x="526" y="318">Or on the alert, if one exists</text>
  <text class="dev-or-production-sub" x="30" y="372">The unbounded case is the one worth designing against first: normal traffic produces a predictable bill, and a loop against a paid API produces whatever it produces until something stops it.</text>
</svg>
