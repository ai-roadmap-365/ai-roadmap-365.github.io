<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The most useful lesson in the topic.">
  <title>Hit rate is not savings</title>
  <style>
    .hit-rate-lesson-bg   { fill: #f8fafc; }
    .hit-rate-lesson-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hit-rate-lesson-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hit-rate-lesson-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hit-rate-lesson-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hit-rate-lesson-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hit-rate-lesson-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hit-rate-lesson-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hit-rate-lesson-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hit-rate-lesson-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hit-rate-lesson-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hit-rate-lesson-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hit-rate-lesson-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hit-rate-lesson-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hit-rate-lesson-stage { opacity: 1; }

    .hit-rate-lesson-s0 { animation-delay: 0.00s; }
    .hit-rate-lesson-e0 { animation-delay: 0.00s; }
    .hit-rate-lesson-s1 { animation-delay: 1.28s; }
    .hit-rate-lesson-e1 { animation-delay: 1.28s; }
    .hit-rate-lesson-s2 { animation-delay: 2.56s; }
    .hit-rate-lesson-e2 { animation-delay: 2.56s; }
    .hit-rate-lesson-s3 { animation-delay: 3.84s; }
    .hit-rate-lesson-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hit-rate-lesson-conn  { animation: hit-rate-lesson-trace 6.4s ease-in-out infinite; }
      .hit-rate-lesson-stage { animation: hit-rate-lesson-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hit-rate-lesson-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hit-rate-lesson-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hit-rate-lesson-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hit-rate-lesson-stage { animation: hit-rate-lesson-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hit-rate-lesson-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hit-rate-lesson-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hit-rate-lesson-bg" width="980" height="322"/>
  <text class="hit-rate-lesson-h1"  x="30" y="40">Hit rate is not savings</text>
  <text class="hit-rate-lesson-sub" x="30" y="64">The most useful lesson in the topic.</text>
  <g class="hit-rate-lesson-stage hit-rate-lesson-s0">
    <rect class="hit-rate-lesson-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hit-rate-lesson-step" x="44" y="142">01</text>
    <text class="hit-rate-lesson-name" x="70" y="142">Two of six requests hit the cache</text>
    <text class="hit-rate-lesson-desc" x="44" y="166">A 33% hit rate. A dashboard</text>
    <text class="hit-rate-lesson-desc" x="44" y="182">would call this a success.</text>
    <text class="hit-rate-lesson-edge" x="44" y="242">33%</text>
  </g>
  <line class="hit-rate-lesson-line hit-rate-lesson-conn hit-rate-lesson-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hit-rate-lesson-tip)"/>
  <g class="hit-rate-lesson-stage hit-rate-lesson-s1">
    <rect class="hit-rate-lesson-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hit-rate-lesson-step" x="280" y="142">02</text>
    <text class="hit-rate-lesson-name" x="306" y="142">And it saved 7% of cost</text>
    <text class="hit-rate-lesson-desc" x="280" y="166">Which looks like a broken cache.</text>
    <text class="hit-rate-lesson-desc" x="280" y="182">It is not.</text>
  </g>
  <line class="hit-rate-lesson-line hit-rate-lesson-conn hit-rate-lesson-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hit-rate-lesson-tip)"/>
  <g class="hit-rate-lesson-stage hit-rate-lesson-s2">
    <rect class="hit-rate-lesson-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hit-rate-lesson-step" x="516" y="142">03</text>
    <text class="hit-rate-lesson-name" x="542" y="142">The repeated question routed to the small model</text>
    <text class="hit-rate-lesson-desc" x="516" y="166">The cheapest traffic was the</text>
    <text class="hit-rate-lesson-desc" x="516" y="182">most repetitive traffic.</text>
  </g>
  <line class="hit-rate-lesson-line hit-rate-lesson-conn hit-rate-lesson-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hit-rate-lesson-tip)"/>
  <g class="hit-rate-lesson-stage hit-rate-lesson-s3">
    <rect class="hit-rate-lesson-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hit-rate-lesson-step" x="752" y="142">04</text>
    <text class="hit-rate-lesson-name" x="778" y="142">Attribute spend by model before optimising</text>
    <text class="hit-rate-lesson-desc" x="752" y="166">Or you optimise the visible</text>
    <text class="hit-rate-lesson-desc" x="752" y="182">thing rather than the expensive</text>
    <text class="hit-rate-lesson-desc" x="752" y="198">one.</text>
  </g>
  <text class="hit-rate-lesson-sub" x="30" y="304">Trimming context helped more than caching in the same run, because it reduced input tokens on the large-model calls — which is where the cost actually lived.</text>
</svg>
