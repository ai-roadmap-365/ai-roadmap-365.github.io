visuals:
- id: agent-tool-schema-and-validation
  file: assets/agent-tool-schema-and-validation.svg
  type: diagram
  title: Agent Tool Schema and Validation
  alt: Agent Tool Schema and Validation illustrating JSON Schema definition, LLM tool selection, parameter
    coercion, and sandbox execution
  description: System diagram illustrating tool schema parsing and validation lifecycle.
- id: idempotent-tool-execution-pipeline
  file: assets/idempotent-tool-execution-pipeline.svg
  type: diagram
  title: Idempotent Tool Execution Pipeline
  alt: Idempotent Tool Execution Pipeline showing idempotency key caching, duplicate request suppression,
    and state mutation safety
  description: Flowchart showing idempotency enforcement in agent tool execution.
- id: tool-contract
  file: assets/tool-contract.svg
  type: diagram
  title: 'What a tool owes the model'
  alt: 'Diagram: the four properties of a production-grade agent tool'
  description: 'A four-stage description of agent tool design covering the schema, argument validation, side-effect classification and digestible output.'
- id: tool-quality
  file: assets/tool-quality.svg
  type: diagram
  title: 'Two tools, same capability'
  alt: 'Diagram: a vague tool definition compared with a precise one'
  description: 'A two-column comparison of an underspecified tool against one with a clear purpose, constrained parameters and actionable errors.'
- id: tool-interface-eras
  file: assets/tool-interface-eras.svg
  type: diagram
  title: 'Three eras of the tool interface'
  alt: 'Diagram: the progression from regex-scraped actions to the Model Context Protocol'
  description: 'A three-stage progression of agent tool interfaces from unstructured text through native function calling to MCP.'
- id: tool-not-api
  file: assets/tool-not-api.svg
  type: diagram
  title: 'A tool is not your REST API'
  alt: 'Diagram: a curated tool registry compared with an exposed API surface'
  description: 'A two-column comparison of a curated set of agent tools against exposing an entire backend API.'
- id: schema-precision
  file: assets/schema-precision.svg
  type: diagram
  title: 'What a production schema states'
  alt: 'Diagram: the three components of a high-accuracy tool schema'
  description: 'A three-stage description of a production JSON Schema covering purpose and preconditions, required versus optional properties, and explicit value constraints.'
- id: idempotency
  file: assets/idempotency.svg
  type: diagram
  title: 'Why mutating tools need a key'
  alt: 'Diagram: how an idempotency key prevents a retried tool call from repeating a side effect'
  description: 'A four-stage description of idempotency covering the failure it prevents, key derivation, cache lookup and the resulting guarantee.'
- id: kiosk-analogy
  file: assets/kiosk-analogy.svg
  type: diagram
  title: 'A blank field, or a menu'
  alt: 'Diagram: an unstructured order field compared with a structured ordering interface'
  description: 'A two-column comparison of a free-text order box against a constrained menu with typed options.'
- id: tool-hazards
  file: assets/tool-hazards.svg
  type: diagram
  title: 'Three tool-level hazards'
  alt: 'Diagram: the privilege, output and selection hazards of agent tools'
  description: 'A three-stage description of tool hazards covering privilege escalation through generic tools, unbounded output payloads and the resulting context cost.'
- id: mcp-or-native
  file: assets/mcp-or-native.svg
  type: diagram
  title: 'Native calling, or a protocol'
  alt: 'Diagram: provider-native function calling compared with the Model Context Protocol'
  description: 'A two-column comparison of native function-calling schemas against MCP tool servers.'
- id: tool-registry-when
  file: assets/tool-registry-when.svg
  type: diagram
  title: 'How much tool machinery'
  alt: 'Diagram: when a full tool registry with validation and idempotency is warranted'
  description: 'A two-column comparison of situations requiring a production tool registry against those where a simple callable suffices.'
