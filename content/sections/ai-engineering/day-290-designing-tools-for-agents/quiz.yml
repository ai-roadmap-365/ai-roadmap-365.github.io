questions:
- question: Why is JSON Schema considered the industry standard for declaring agent tools?
  options:
  - Because it is written in binary
  - 'A machine-readable spec of names, types, and fields'
  - 'It compiles the Python source into Rust automatically'
  - It bypasses all cloud security firewalls
  answer_index: 1
  explanation: JSON Schema provides a formal standard that foundation models use to construct typed function
    arguments.
- question: What is tool idempotency and why is it vital for autonomous agent stability?
  options:
  - Idempotency deletes old logs
  - Idempotency makes tools run at 10 GHz
  - 'Repeating a call causes no duplicate side effects'
  - Idempotency compresses JSON text
  answer_index: 2
  explanation: Idempotency prevents dangerous duplicate operations (e.g. charging a credit card twice)
    if an agent retries an action.
- question: How should parameter descriptions in a tool JSON Schema be written for optimal model performance?
  options:
  - Left blank to save tokens
  - Containing obfuscated code
  - Written in hexadecimal
  - 'Clear, with units, ranges, and examples'
  answer_index: 3
  explanation: Detailed descriptions with units and format constraints dramatically reduce argument hallucination.
- question: What is the purpose of automated parameter coercion in a tool registry?
  options:
  - 'To cast strings to the expected types'
  - To delete invalid parameters
  - 'To restart the whole operating system first'
  - To translate English to Spanish
  answer_index: 0
  explanation: Models occasionally emit numbers as strings; automatic coercion prevents unnecessary type
    error failures.
- question: Which tool design principle prevents destructive side effects in production environments?
  options:
  - Granting root administrative access to all tools
  - 'Read-only defaults, sandboxing, confirmation gates'
  - Disabling all unit tests
  - Increasing the batch size
  answer_index: 1
  explanation: Restricting tool privileges and requiring confirmation for destructive mutations protects
    system integrity.
