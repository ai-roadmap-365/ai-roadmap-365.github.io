<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties, all in the schema.">
  <title>What a tool owes the model</title>
  <style>
    .tool-contract-bg   { fill: #f8fafc; }
    .tool-contract-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-contract-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-contract-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-contract-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-contract-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-contract-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-contract-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-contract-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-contract-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-contract-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-contract-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-contract-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tool-contract-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tool-contract-stage { opacity: 1; }

    .tool-contract-s0 { animation-delay: 0.00s; }
    .tool-contract-e0 { animation-delay: 0.00s; }
    .tool-contract-s1 { animation-delay: 1.28s; }
    .tool-contract-e1 { animation-delay: 1.28s; }
    .tool-contract-s2 { animation-delay: 2.56s; }
    .tool-contract-e2 { animation-delay: 2.56s; }
    .tool-contract-s3 { animation-delay: 3.84s; }
    .tool-contract-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tool-contract-conn  { animation: tool-contract-trace 6.4s ease-in-out infinite; }
      .tool-contract-stage { animation: tool-contract-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tool-contract-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tool-contract-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tool-contract-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tool-contract-stage { animation: tool-contract-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tool-contract-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tool-contract-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tool-contract-bg" width="980" height="322"/>
  <text class="tool-contract-h1"  x="30" y="40">What a tool owes the model</text>
  <text class="tool-contract-sub" x="30" y="64">Four properties, all in the schema.</text>
  <g class="tool-contract-stage tool-contract-s0">
    <rect class="tool-contract-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tool-contract-step" x="44" y="142">01</text>
    <text class="tool-contract-name" x="70" y="142">A precise schema</text>
    <text class="tool-contract-desc" x="44" y="166">Purpose, required and optional</text>
    <text class="tool-contract-desc" x="44" y="182">properties, enums, ranges,</text>
    <text class="tool-contract-desc" x="44" y="198">patterns.</text>
  </g>
  <line class="tool-contract-line tool-contract-conn tool-contract-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tool-contract-tip)"/>
  <g class="tool-contract-stage tool-contract-s1">
    <rect class="tool-contract-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tool-contract-step" x="280" y="142">02</text>
    <text class="tool-contract-name" x="306" y="142">Validation and coercion</text>
    <text class="tool-contract-desc" x="280" y="166">Before execution. "50" becomes</text>
    <text class="tool-contract-desc" x="280" y="182">50; a bad date becomes an</text>
    <text class="tool-contract-desc" x="280" y="198">actionable error.</text>
    <text class="tool-contract-edge" x="280" y="242">pre-flight</text>
  </g>
  <line class="tool-contract-line tool-contract-conn tool-contract-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tool-contract-tip)"/>
  <g class="tool-contract-stage tool-contract-s2">
    <rect class="tool-contract-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tool-contract-step" x="516" y="142">03</text>
    <text class="tool-contract-name" x="542" y="142">Read or mutate, declared</text>
    <text class="tool-contract-desc" x="516" y="166">Mutating tools carry an</text>
    <text class="tool-contract-desc" x="516" y="182">idempotency key. Read-only tools</text>
    <text class="tool-contract-desc" x="516" y="198">cannot be retried wrongly.</text>
  </g>
  <line class="tool-contract-line tool-contract-conn tool-contract-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tool-contract-tip)"/>
  <g class="tool-contract-stage tool-contract-s3">
    <rect class="tool-contract-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tool-contract-step" x="752" y="142">04</text>
    <text class="tool-contract-name" x="778" y="142">Digestible output</text>
    <text class="tool-contract-desc" x="752" y="166">Truncated, projected, paginated.</text>
    <text class="tool-contract-desc" x="752" y="182">Not a 50,000-line payload.</text>
    <text class="tool-contract-edge" x="752" y="242">context</text>
  </g>
  <text class="tool-contract-sub" x="30" y="304">The schema is the entire interface, which is worth stating plainly: there is no documentation portal, no type checker and no colleague to ask, so an ambiguous description is an ambiguous API.</text>
</svg>
