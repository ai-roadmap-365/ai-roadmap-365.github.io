<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three things, all of them constraints.">
  <title>What a production schema states</title>
  <style>
    .schema-precision-bg   { fill: #f8fafc; }
    .schema-precision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-precision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-precision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-precision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-precision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-precision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schema-precision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schema-precision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schema-precision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schema-precision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schema-precision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schema-precision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schema-precision-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schema-precision-stage { opacity: 1; }

    .schema-precision-s0 { animation-delay: 0.00s; }
    .schema-precision-e0 { animation-delay: 0.00s; }
    .schema-precision-s1 { animation-delay: 1.50s; }
    .schema-precision-e1 { animation-delay: 1.50s; }
    .schema-precision-s2 { animation-delay: 3.00s; }
    .schema-precision-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .schema-precision-conn  { animation: schema-precision-trace 6s ease-in-out infinite; }
      .schema-precision-stage { animation: schema-precision-arrive 6s ease-in-out infinite; }
    }
    @keyframes schema-precision-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schema-precision-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schema-precision-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schema-precision-stage { animation: schema-precision-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schema-precision-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schema-precision-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schema-precision-bg" width="980" height="322"/>
  <text class="schema-precision-h1"  x="30" y="40">What a production schema states</text>
  <text class="schema-precision-sub" x="30" y="64">Three things, all of them constraints.</text>
  <g class="schema-precision-stage schema-precision-s0">
    <rect class="schema-precision-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="schema-precision-step" x="44" y="142">01</text>
    <text class="schema-precision-name" x="70" y="142">Purpose and preconditions</text>
    <text class="schema-precision-desc" x="44" y="166">What it does, and when it is valid to call.</text>
    <text class="schema-precision-desc" x="44" y="182">In a sentence the model reads.</text>
  </g>
  <line class="schema-precision-line schema-precision-conn schema-precision-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#schema-precision-tip)"/>
  <g class="schema-precision-stage schema-precision-s1">
    <rect class="schema-precision-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="schema-precision-step" x="359" y="142">02</text>
    <text class="schema-precision-name" x="385" y="142">Required against optional</text>
    <text class="schema-precision-desc" x="359" y="166">With deterministic defaults, so an omitted</text>
    <text class="schema-precision-desc" x="359" y="182">field has a defined meaning.</text>
  </g>
  <line class="schema-precision-line schema-precision-conn schema-precision-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#schema-precision-tip)"/>
  <g class="schema-precision-stage schema-precision-s2">
    <rect class="schema-precision-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="schema-precision-step" x="674" y="142">03</text>
    <text class="schema-precision-name" x="700" y="142">Explicit constraints</text>
    <text class="schema-precision-desc" x="674" y="166">enum, minimum, maximum, pattern. Every</text>
    <text class="schema-precision-desc" x="674" y="182">constraint removes a hallucination.</text>
  </g>
  <text class="schema-precision-sub" x="30" y="304">Enums are the highest-leverage element by a wide margin: a free-string parameter invites the model to invent a plausible value, and an enumerated one makes the valid set part of the prompt.</text>
</svg>
