<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Curation is a correctness concern.">
  <title>A tool is not your REST API</title>
  <style>
    .tool-not-api-bg   { fill: #f8fafc; }
    .tool-not-api-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-not-api-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-not-api-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-not-api-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-not-api-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-not-api-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-not-api-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-not-api-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-not-api-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-not-api-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-not-api-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-not-api-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-not-api-row { opacity: 1; }
    .tool-not-api-r0 { animation-delay: 0.00s; }
    .tool-not-api-r1 { animation-delay: 0.45s; }
    .tool-not-api-r2 { animation-delay: 0.90s; }
    .tool-not-api-r3 { animation-delay: 1.35s; }
    .tool-not-api-r4 { animation-delay: 1.80s; }
    .tool-not-api-row { animation: tool-not-api-reveal 7.3s ease-in-out infinite; }
    @keyframes tool-not-api-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tool-not-api-bg" width="980" height="390"/>
  <text class="tool-not-api-h1"  x="30" y="40">A tool is not your REST API</text>
  <text class="tool-not-api-sub" x="30" y="64">Curation is a correctness concern.</text>
  <rect class="tool-not-api-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tool-not-api-name" x="46" y="122">A curated registry</text>
  <text class="tool-not-api-desc" x="46" y="142">Few, distinct, typed.</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r0" x="46" y="182">Domain-specific and mutually exclusive</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r1" x="46" y="216">Strongly typed, with a schema each</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r2" x="46" y="250">Sandboxed and permission-bounded</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r3" x="46" y="284">Structured, digestible returns</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r4" x="46" y="318">Selection accuracy stays high</text>
  <rect class="tool-not-api-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tool-not-api-name" x="526" y="122">An exposed API</text>
  <text class="tool-not-api-desc" x="526" y="142">Everything, uncurated.</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r0" x="526" y="182">100+ endpoints in the system prompt</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r1" x="526" y="216">Overlapping names and purposes</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r2" x="526" y="250">Raw shell access with root</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r3" x="526" y="284">Silent failures returning empty strings</text>
  <text class="tool-not-api-desc tool-not-api-row tool-not-api-r4" x="526" y="318">Selection accuracy collapses</text>
  <text class="tool-not-api-sub" x="30" y="372">The failure is not that the model cannot read a hundred schemas — it is that overlapping descriptions create genuine ambiguity, and the model resolves it by inventing a hybrid signature.</text>
</svg>
