<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img">
  <title>Idempotent Tool Execution Pipeline</title>
  <defs>
    <style>
      .d290f-bg { fill: #f8fafc; }
      .d290f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d290f-cache { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d290f-exec { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d290f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d290f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d290f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d290f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .d290f-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d290f-bg" />
  
  <text x="40" y="40" class="d290f-title">Idempotent Tool Execution Pipeline</text>
  <text x="40" y="65" class="d290f-subtitle">Idempotent Tool Execution Pipeline showing idempotency key caching, duplicate request suppression, and state mutation safety</text>
  
  <rect x="40" y="110" width="220" height="90" class="d290f-card" />
  <text x="55" y="140" class="d290f-header">Incoming Tool Call</text>
  <text x="55" y="160" class="d290f-text">Tool: create_order</text>
  <text x="55" y="175" class="d290f-text">Idempotency-Key: "k-9812"</text>
  
  <path d="M 260 155 L 340 155" class="d290f-flow" />
  
  <rect x="340" y="110" width="240" height="90" class="d290f-cache" />
  <text x="355" y="140" class="d290f-header" fill="#1d4ed8">Idempotency Key Check</text>
  <text x="355" y="160" class="d290f-text">Has "k-9812" been executed</text>
  <text x="355" y="175" class="d290f-text">within last 10 minutes?</text>
  
  <!-- Branch 1: Key Found (Duplicate) -->
  <path d="M 460 200 L 460 270" class="d290f-flow" stroke="#ef4444" />
  <rect x="340" y="270" width="240" height="90" class="d290f-card" />
  <text x="355" y="300" class="d290f-header" fill="#b91c1c">Duplicate Detected (Cache Hit)</text>
  <text x="355" y="320" class="d290f-text">Return cached result directly</text>
  <text x="355" y="335" class="d290f-text">Zero mutation performed</text>
  
  <!-- Branch 2: Key Not Found (Fresh) -->
  <path d="M 580 155 L 660 155" class="d290f-flow" stroke="#22c55e" />
  <rect x="660" y="110" width="200" height="250" class="d290f-exec" />
  <text x="675" y="140" class="d290f-header" fill="#15803d">Fresh Execution</text>
  <text x="675" y="165" class="d290f-text">1. Execute DB Mutation</text>
  <text x="675" y="185" class="d290f-text">2. Store Order #40921</text>
  <text x="675" y="205" class="d290f-text">3. Cache Result for "k-9812"</text>
  <text x="675" y="225" class="d290f-text">4. Return Order JSON to Agent</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 260 155 L 340 155" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 580 155 L 660 155" stroke="#22c55e" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 460 200 L 460 270" stroke="#ef4444" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>