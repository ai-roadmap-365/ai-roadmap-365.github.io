terms:
- term: JSON Schema
  definition: A standard declarative format describing the structure, types, and constraints of tool arguments.
- term: Tool Registry
  definition: A centralized management system registering, validating, and dispatching tool invocations.
- term: Idempotency Key
  definition: A unique identifier (such as a parameter hash) ensuring repeated executions do not cause
    duplicate mutations.
- term: Parameter Coercion
  definition: Automatically casting incoming arguments to their schema-defined types safely.
- term: Sandbox Isolation
  definition: Executing untrusted or high-risk tool operations within isolated containers or restricted
    environments.
- term: Destructive Action Gate
  definition: A security boundary requiring human review before executing irreversible operations.
- term: Function Calling API
  definition: A model inference capability structured specifically to output valid tool invocations.
- term: Error Contract
  definition: Standardized JSON error responses formatted specifically to guide model self-correction.
