slug: llm-as-judge
title: LLM-as-Judge
section: ai-engineering
subsection: production-ai-systems
week: 45
learning_promise: 'Master the theory, architecture, and practical implementation of LLM-as-a-Judge evaluation
  systems: understand single-answer scoring vs pairwise comparison, rubric design, positional bias mitigation,
  and human agreement calibration.'
objectives:
- Analyze the architectural foundations of LLM-as-a-Judge and when model-graded evaluation outperforms
  static heuristics.
- Design objective, anchored evaluation rubrics (1-5 Likert scales and binary criteria) for Faithfulness,
  Helpfulness, Tone, and Completeness.
- 'Identify and mitigate model biases: Position Bias (swap-evaluation), Verbosity Bias, Self-Enhancement
  Bias, and Length Bias.'
- Implement an automated LLM-as-Judge Evaluator in Python supporting single-answer rubric grading and
  pairwise comparison with position-swapping.
- Calculate Cohen's Kappa and Pearson correlation to measure alignment between LLM judge scores and human
  expert ground truth.
