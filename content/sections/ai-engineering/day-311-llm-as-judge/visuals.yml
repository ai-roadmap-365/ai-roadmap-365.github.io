visuals:
- id: llm-as-judge-architecture-and-rubric-flow
  file: assets/llm-as-judge-architecture-and-rubric-flow.svg
  type: diagram
  title: LLM as Judge Architecture and Rubric Flow
  alt: LLM as Judge Architecture and Rubric Flow showing Input Query, Retrieved Context, Candidate Output,
    Structured Prompt Rubric, Judge LLM, and JSON Score with Reasoning
  description: System architecture diagram of a rubric-anchored LLM-as-a-Judge evaluation pipeline.
- id: pairwise-evaluation-and-position-bias-mitigation
  file: assets/pairwise-evaluation-and-position-bias-mitigation.svg
  type: diagram
  title: Pairwise Evaluation and Position Bias Mitigation
  alt: Pairwise Evaluation and Position Bias Mitigation showing Forward Pass (A vs B), Swapped Pass (B
    vs A), Consistency Check, and Final Calibrated Winner
  description: Workflow diagram showing position-swapped pairwise comparison to eliminate positional bias.
- id: judge-prompt-anatomy
  file: assets/judge-prompt-anatomy.svg
  type: diagram
  title: 'What a judge prompt contains'
  alt: 'Diagram: the six elements of a production LLM-as-judge prompt'
  description: 'A six-stage description of a judge prompt covering the persona, inputs, anchored rubric, chain-of-thought requirement, schema and temperature.'
- id: exact-match-fails
  file: assets/exact-match-fails.svg
  type: diagram
  title: 'Where exact match breaks'
  alt: 'Diagram: exact match compared with a judged evaluation on a paraphrase'
  description: 'A two-column comparison of string matching against model-graded evaluation for semantically equivalent answers.'
- id: judge-lineage
  file: assets/judge-lineage.svg
  type: diagram
  title: 'Three milestones for judges'
  alt: 'Diagram: the progression from n-gram metrics to calibrated LLM judges'
  description: 'A three-stage progression from the failure of reference-overlap metrics through G-Eval to systematic bias documentation in MT-Bench.'
- id: judge-biases
  file: assets/judge-biases.svg
  type: diagram
  title: 'Three biases, three mitigations'
  alt: 'Diagram: the three documented biases of LLM judges and their mitigations'
  description: 'A three-stage description of judge biases covering positional, verbosity and self-enhancement bias, with the mitigation for each.'
- id: calibration
  file: assets/calibration.svg
  type: diagram
  title: 'Calibrating the judge'
  alt: 'Diagram: how Cohen''s kappa validates an LLM judge against human raters'
  description: 'A four-stage description of judge calibration covering agreement measurement, the kappa thresholds and rubric refinement.'
- id: sommelier
  file: assets/sommelier.svg
  type: diagram
  title: 'A blind tasting'
  alt: 'Diagram: a blind wine tasting as an analogy for unbiased pairwise judging'
  description: 'A two-column comparison of a labelled tasting against a blind, order-swapped, rubric-scored one.'
- id: rubric-decomposition
  file: assets/rubric-decomposition.svg
  type: diagram
  title: 'Decompose the rubric'
  alt: 'Diagram: the four orthogonal dimensions of a decomposed evaluation rubric'
  description: 'A four-stage description of rubric decomposition covering faithfulness, relevance, tone and safety.'
- id: medical-case
  file: assets/medical-case.svg
  type: diagram
  title: 'One judge, recalibrated'
  alt: 'Diagram: the measured effect of correcting verbosity bias in a clinical summarisation judge'
  description: 'A four-stage walkthrough of diagnosing and correcting a verbosity-biased judge in medical summarisation.'
- id: judge-checklist
  file: assets/judge-checklist.svg
  type: diagram
  title: 'Six checks before shipping a judge'
  alt: 'Diagram: the verification checklist for a production judge prompt'
  description: 'A two-column comparison of a verified judge prompt against the omissions that make one unreliable.'
- id: judge-when
  file: assets/judge-when.svg
  type: diagram
  title: 'Where a judge belongs'
  alt: 'Diagram: when to use an LLM judge and when to use a deterministic check'
  description: 'A two-column comparison of evaluation tasks suited to LLM judges against those better served by deterministic tools.'
