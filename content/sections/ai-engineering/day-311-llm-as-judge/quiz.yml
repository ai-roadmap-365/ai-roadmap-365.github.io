questions:
- question: What is 'Position Bias' in pairwise LLM-as-a-Judge evaluation, and how is it mitigated?
  options:
  - The position of the GPU server in the datacenter rack
  - The tendency of an LLM judge to favor the first candidate response (Response A) regardless of quality;
    mitigated by running pairwise evaluation twice with swapped response positions (A vs B, then B vs
    A) and averaging results
  - A sorting algorithm error in Python
  - Text wrapping in terminals
  answer_index: 1
  explanation: LLMs have a strong positional bias favoring the first response presented in the prompt.
    Swapping candidate positions and verifying consistency eliminates this bias.
- question: What is the primary advantage of 'Rubric-Based Likert Scoring' (1 to 5 scale) over open-ended
    qualitative critique?
  options:
  - It makes prompts shorter
  - It provides explicit, anchor-defined criteria for each discrete score tier, converting subjective
    language quality into reproducible numerical metrics that can be tracked across continuous integration
    runs
  - It disables model temperature
  - It reduces network packet size
  answer_index: 1
  explanation: Anchored rubrics provide concrete criteria for each numerical score, drastically reducing
    judge variance.
- question: What is 'Verbosity Bias' in LLM evaluation?
  options:
  - When a prompt exceeds 4096 tokens
  - The tendency of judge models to award higher scores to longer, wordier responses even when a concise
    response is more accurate and direct
  - When an API client logs too many messages
  - A compiler warning
  answer_index: 1
  explanation: Judge models frequently conflate length and formatting with reasoning depth. Rubrics must
    explicitly reward conciseness when appropriate.
- question: Which statistical coefficient is commonly used to measure the agreement between LLM-as-Judge
    scores and human expert annotators?
  options:
  - Cohen's Kappa or Spearman's Rank Correlation
  - Fourier Transform coefficient
  - HTTP Status Code
  - Binary entropy loss
  answer_index: 0
  explanation: Cohen's Kappa measures inter-annotator agreement above chance, calibrating judge models
    against human ground truth.
- question: In a RAG evaluation pipeline, what does the 'Faithfulness / Groundedness' rubric specifically
    measure?
  options:
  - Whether the model responds quickly
  - Whether every claim and fact in the generated answer can be strictly inferred from the provided retrieved
    context documents, with zero unsupported external hallucinations
  - Whether the answer is written in iambic pentameter
  - Whether the text uses polite language
  answer_index: 1
  explanation: Faithfulness checks that generated claims are strictly supported by the retrieved reference
    text.
