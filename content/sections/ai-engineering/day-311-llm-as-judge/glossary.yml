terms:
- term: LLM-as-a-Judge
  definition: Using a high-capability language model to evaluate and score candidate outputs based on
    structured rubrics.
- term: Position Bias
  definition: The systemic tendency of judge models to prefer the first candidate response in a pairwise
    prompt.
- term: Verbosity Bias
  definition: The tendency of LLM judges to assign higher scores to unnecessarily lengthy or verbose responses.
- term: Anchored Rubric
  definition: A grading rubric with explicit, descriptive definitions for every discrete score level (e.g.
    1 to 5).
- term: Pairwise Comparison
  definition: Presenting two candidate answers side-by-side to a judge model to determine which is superior.
- term: Faithfulness / Groundedness
  definition: The degree to which claims in a generated response are directly supported by provided context.
- term: Cohen's Kappa
  definition: A statistical metric measuring agreement between two raters corrected for chance.
- term: Self-Enhancement Bias
  definition: The tendency of an LLM judge to favor responses generated by its own model family.
